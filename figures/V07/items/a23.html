<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 10:34</div><h3>A step takes the longer of reading and computing</h3><svg viewBox='0 0 680 608' role='img'><title>A step takes the longer of reading and computing</title><text class="hd" x="40" y="46">Step time against tokens processed in the step, linear axes</text><line class="axis" x1="110" y1="280" x2="600" y2="280"/><line class="axis" x1="110" y1="84" x2="110" y2="280"/><line class="tick" x1="110.0" y1="280" x2="110.0" y2="285"/><text class="sub2" x="110.0" y="299" text-anchor="middle">0</text><line class="tick" x1="221.36363636363637" y1="280" x2="221.36363636363637" y2="285"/><text class="sub2" x="221.4" y="299" text-anchor="middle">500</text><line class="tick" x1="332.72727272727275" y1="280" x2="332.72727272727275" y2="285"/><text class="sub2" x="332.7" y="299" text-anchor="middle">1,000</text><line class="tick" x1="444.09090909090907" y1="280" x2="444.09090909090907" y2="285"/><text class="sub2" x="444.1" y="299" text-anchor="middle">1,500</text><line class="tick" x1="555.4545454545455" y1="280" x2="555.4545454545455" y2="285"/><text class="sub2" x="555.5" y="299" text-anchor="middle">2,000</text><line class="tick" x1="105" y1="280.0" x2="110" y2="280.0"/><text class="sub2" x="101" y="284.0" text-anchor="end">0</text><line class="tick" x1="105" y1="225.55555555555554" x2="110" y2="225.55555555555554"/><text class="sub2" x="101" y="229.6" text-anchor="end">10</text><line class="tick" x1="105" y1="171.1111111111111" x2="110" y2="171.1111111111111"/><text class="sub2" x="101" y="175.1" text-anchor="end">20</text><line class="tick" x1="105" y1="116.66666666666666" x2="110" y2="116.66666666666666"/><text class="sub2" x="101" y="120.7" text-anchor="end">30</text><text class="sub2" x="101" y="70" text-anchor="start">ms per step</text><text class="sub2" x="355.0" y="318" text-anchor="middle">tokens processed in the step</text><polyline class="pl-h" points="110.0,247.1 600.0,247.1"/><polyline class="pl-m" points="110.0,280.0 600.0,85.5"/><line class="mark" x1="192.9" y1="247.1" x2="192.9" y2="280"/><text class="sub2" x="192.9" y="299" text-anchor="middle">372</text><text class="sub2" x="300" y="238.1" text-anchor="start">reading: 16.06 GB of weights + 4.19 GB of caches</text><text class="sub2" x="374.4" y="165.5" text-anchor="end">computing: 16.2 µs per token</text><g class="u"><rect x="113.1" y="243.1" width="8" height="8" rx="4"/></g><text class="sub2 halo" x="125.1" y="265.1" text-anchor="start" style="paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round">32 decodes alone: 6.04 ms</text><g class="h"><rect x="558.6" y="96.4" width="8" height="8" rx="4"/></g><text class="sub2" x="572.6" y="120.4" text-anchor="start">33.0 ms, with</text><text class="sub2" x="572.6" y="134.4" text-anchor="start">the prompt</text><text class="cap" x="40" y="356" text-anchor="start">A step takes the longer of two times: reading every byte it needs, and doing every</text><text class="cap" x="40" y="376" text-anchor="start">operation ({{fig:v01-o123}}). Reading is the weights, 16.06 GB, plus the caches the</text><text class="cap" x="40" y="396" text-anchor="start">running requests' attention reads: 32 requests holding 1,000 tokens each, 4.19 GB.</text><text class="cap" x="40" y="416" text-anchor="start">20.25 GB at 3.35 TB/s is 6.04 ms, whatever the step computes.</text><text class="cap" x="40" y="456" text-anchor="start">Computing is 2 × 8.03 billion operations per token, 16.2 µs at the chip's peak. The 32</text><text class="cap" x="40" y="476" text-anchor="start">decode tokens need 0.52 ms, far inside the read, and a step can hold 372 tokens before</text><text class="cap" x="40" y="496" text-anchor="start">the arithmetic takes longer. A 2,000-token prompt makes it 2,032 tokens: 33.0 ms.</text><text class="cap" x="40" y="536" text-anchor="start">Assumed: the chip at its peak rates and 1,000 tokens of context per running request</text><text class="cap" x="40" y="556" text-anchor="start">(illustrative). Attention's own arithmetic is left out; it would add about 3% to the</text><text class="cap" x="40" y="576" text-anchor="start">step with the prompt.</text></svg><figcaption>The flat stretch is why a step costs the same whether it computes 32 tokens or 372. The ramp is what a joining prompt climbs.</figcaption></figure>
