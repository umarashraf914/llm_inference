<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 25:36</div><h3>Asking nicely is a bet placed on every token</h3><svg viewBox='0 0 680 458' role='img'><title>Asking nicely is a bet placed on every token</title><text class="hd" x="40" y="46">Chance that an output never strays, if each token strays one time in a thousand</text><g class="u"><rect x="40" y="64" width="330" height="34" rx="6"/><text class="sub" x="205.0" y="81.0" text-anchor="middle" dominant-baseline="central">chance all n tokens behave = 0.999^n</text></g><text class="cap" x="40" y="140" text-anchor="start">200 tokens</text><g class="u"><rect x="200" y="122" width="400" height="26" rx="3"/></g><g class="s"><rect x="200" y="122" width="327.45953179145425" height="26" rx="3"/><text class="sub" x="363.72976589572716" y="135.0" text-anchor="middle" dominant-baseline="central">81.9%</text></g><text class="cap" x="40" y="180" text-anchor="start">500 tokens</text><g class="u"><rect x="200" y="162" width="400" height="26" rx="3"/></g><g class="s"><rect x="200" y="162" width="242.55157794447388" height="26" rx="3"/><text class="sub" x="321.2757889722369" y="175.0" text-anchor="middle" dominant-baseline="central">60.6%</text></g><text class="cap" x="40" y="220" text-anchor="start">2,000 tokens</text><g class="u"><rect x="200" y="202" width="400" height="26" rx="3"/></g><g class="s"><rect x="200" y="202" width="54.07997015899978" height="26" rx="3"/><text class="sub" x="227.0399850794999" y="215.0" text-anchor="middle" dominant-baseline="central">13.5%</text></g><text class="sub2" x="600" y="246" text-anchor="end">100%</text><text class="cap" x="40" y="286" text-anchor="start">Asking for the format in the prompt is not a guarantee, because eventually the model</text><text class="cap" x="40" y="306" text-anchor="start">emits one stray token and the parser fails. Suppose each token has a 0.1% chance of</text><text class="cap" x="40" y="326" text-anchor="start">breaking the format, independently: an output survives only if every token behaves, a</text><text class="cap" x="40" y="346" text-anchor="start">chance of 0.999 multiplied by itself once per token.</text><text class="cap" x="40" y="386" text-anchor="start">A 200-token answer parses 81.9% of the time, a 500-token one 60.6%, a 2,000-token one</text><text class="cap" x="40" y="406" text-anchor="start">13.5%. The longer the output, the more certain the failure, and a program reading it</text><text class="cap" x="40" y="426" text-anchor="start">needs it to work every time.</text></svg><figcaption>Bars to scale; the rate is illustrative and the shape is not. Any per-token chance of error, however small, compounds over a long output.</figcaption></figure>
