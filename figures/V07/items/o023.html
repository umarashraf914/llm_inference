<figure><div class='ts'>Fig 23 &nbsp;&middot;&nbsp; 25:28</div><h3>Masking the logits</h3><svg viewBox="0 0 680 518" role="img"><title>Masking the logits</title><text class="hd" x="40" y="46">One stage earlier than the sampler</text><g class="u"><rect x="40" y="70" width="180" height="40" rx="4"></rect><text class="sub" x="130.0" y="90.0" text-anchor="middle" dominant-baseline="central">logits</text></g><line class="conn" x1="226" y1="90" x2="246" y2="90" marker-end="url(#arw)"></line><g class="h"><rect x="252" y="70" width="210" height="40" rx="4"></rect><text class="sub" x="357.0" y="90.0" text-anchor="middle" dominant-baseline="central">set illegal tokens to minus infinity</text></g><line class="conn" x1="468" y1="90" x2="488" y2="90" marker-end="url(#arw)"></line><g class="s"><rect x="494" y="70" width="146" height="40" rx="4"></rect><text class="sub" x="567.0" y="90.0" text-anchor="middle" dominant-baseline="central">sampler</text></g><text class="cap" x="40" y="148" text-anchor="start">Softmax turns minus infinity into exactly zero, and a token with probability zero can never be</text><text class="cap" x="40" y="168" text-anchor="start">drawn, whatever sampler is running above it.</text><text class="cap" x="40" y="208" text-anchor="start">You need this whenever the output will be read by a machine rather than a person: JSON a parser</text><text class="cap" x="40" y="228" text-anchor="start">will consume, a query matching a schema, a tool call whose arguments have to type check.</text><text class="cap" x="40" y="268" text-anchor="start">Asking for the format in the prompt is not a guarantee, because eventually the model emits one</text><text class="cap" x="40" y="288" text-anchor="start">stray token and the parser fails.</text><text class="hd" x="40" y="338">What decides which tokens would break the format</text><g class="s"><rect x="40" y="358" width="285" height="78" rx="8"></rect><text class="lbl" x="182.5" y="388.0" text-anchor="middle" dominant-baseline="central">A finite state machine</text><text class="sub" x="182.5" y="406.0" text-anchor="middle" dominant-baseline="central">enough for regular expressions</text></g><g class="m"><rect x="368" y="358" width="272" height="78" rx="8"></rect><text class="lbl" x="504.0" y="380.0" text-anchor="middle" dominant-baseline="central">A pushdown automaton</text><text class="sub" x="504.0" y="398.0" text-anchor="middle" dominant-baseline="central">a state machine plus a stack,</text><text class="sub" x="504.0" y="415.0" text-anchor="middle" dominant-baseline="central">for grammars that nest</text></g><text class="cap" x="40" y="476" text-anchor="start">A state machine cannot remember how many brackets are still open, which is why JSON and SQL</text><text class="cap" x="40" y="496" text-anchor="start">need the stack.</text></svg><figcaption>The mechanism is brutally simple. All the sophistication is in deciding what to mask.</figcaption></figure>
