<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 25:19</div><h3>Constrained decoding changes which tokens are on offer at all</h3><svg viewBox='0 0 680 402' role='img'><title>Constrained decoding changes which tokens are on offer at all</title><text class="hd" x="40" y="46">One stage before the sampler</text><g class="u"><rect x="40" y="66" width="150" height="44" rx="6"/><text class="lbl" x="115.0" y="88.0" text-anchor="middle" dominant-baseline="central">logits</text></g><line class="conn" x1="194" y1="88" x2="222" y2="88" marker-end="url(#arw)"/><g class="h"><rect x="226" y="66" width="220" height="44" rx="6"/><text class="lbl" x="336.0" y="88.0" text-anchor="middle" dominant-baseline="central">illegal tokens to −∞</text></g><line class="conn" x1="450" y1="88" x2="478" y2="88" marker-end="url(#arw)"/><g class="s"><rect x="482" y="66" width="158" height="44" rx="6"/><text class="lbl" x="561.0" y="88.0" text-anchor="middle" dominant-baseline="central">sampler</text></g><text class="cap" x="40" y="146" text-anchor="start">needed whenever a machine reads the output</text><g class="u"><rect x="40" y="158" width="194" height="28" rx="3"/><text class="sub" x="137.0" y="172.0" text-anchor="middle" dominant-baseline="central">JSON a parser will consume</text></g><g class="u"><rect x="242" y="158" width="194" height="28" rx="3"/><text class="sub" x="339.0" y="172.0" text-anchor="middle" dominant-baseline="central">a query matching a schema</text></g><g class="u"><rect x="444" y="158" width="194" height="28" rx="3"/><text class="sub" x="541.0" y="172.0" text-anchor="middle" dominant-baseline="central">tool calls that type-check</text></g><text class="cap" x="40" y="230" text-anchor="start">Sampling chooses among the tokens the model proposes. Constrained decoding changes which</text><text class="cap" x="40" y="250" text-anchor="start">tokens are on offer in the first place, one stage earlier: before the sampler runs, the</text><text class="cap" x="40" y="270" text-anchor="start">engine sets the logit of every token that would break the format to minus infinity.</text><text class="cap" x="40" y="310" text-anchor="start">It is needed whenever the output will be read by a machine rather than a person. A</text><text class="cap" x="40" y="330" text-anchor="start">schema is a written description of the shape data must have: which fields, in what</text><text class="cap" x="40" y="350" text-anchor="start">order, of what type. To type-check is to confirm each value has the type the schema</text><text class="cap" x="40" y="370" text-anchor="start">demands, a number where a number is required.</text></svg><figcaption>The mechanism is brutally simple. All the sophistication is in deciding what to mask.</figcaption></figure>
