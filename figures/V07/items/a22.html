="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="521" y="229" width="28" height="18" rx="2"/></g><g class="m"><rect x="551" y="229" width="28" height="18" rx="2"/></g><g class="m"><rect x="581" y="229" width="28" height="18" rx="2"/></g><text class="sub2" x="280" y="70" text-anchor="start">attention: which keys each token may see</text><text class="sub2" x="280" y="268" text-anchor="start">x11 to x13 and x21 come from the cache</text><text class="cap" x="40" y="306" text-anchor="start">Orca's example: x1 and x2 are decoding, one new token each (x14 and x22), and x3 and x4</text><text class="cap" x="40" y="326" text-anchor="start">have just arrived with prompts of 2 and 3 tokens: 7 tokens in all. Stacked, they form</text><text class="cap" x="40" y="346" text-anchor="start">one [7 × H] tensor, H numbers per token, and the projections run as a single multiply</text><text class="cap" x="40" y="366" text-anchor="start">with one read of the weights for all seven.</text><text class="cap" x="40" y="406" text-anchor="start">Attention is split out. A token may look only at its own request's tokens up to itself,</text><text class="cap" x="40" y="426" text-anchor="start">cached or new ({{fig:v03-o020}}): x14 sees x11 to x14, x22 sees x21 and x22, x32 sees</text><text class="cap" x="40" y="446" text-anchor="start">x31 and x32. Of the 77 query-key pairs, 15 are allowed, in blocks along the diagonal.</text><text class="cap" x="40" y="486" text-anchor="start">So attention runs request by request, each on its own block, and the results are stacked</text><text class="cap" x="40" y="506" text-anchor="start">back into [7 × H] for the next projection.</text></svg><figcaption>Stacked where nothing mixes, split where something does. The blank cells are why attention cannot be one batched rectangle.</figcaption></figure>
