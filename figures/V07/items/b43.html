<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 16:41</div><h3>Evict the stalest leaf, never one in use</h3><div class='wg'><div class='ctl'><label class='opt'><input type='checkbox' checked> B's request is still running</label><button type='button'>Evict one</button><button type='button'>Reset</button></div><svg viewBox='0 0 680 582' role='img'><title>Evict the stalest leaf, never one in use</title><text class="hd" x="40" y="34">Each node: when a request last used it, and how many running requests hold it</text><line class="conn" x1="158" y1="89" x2="174" y2="89"/><line class="conn" x1="246" y1="89" x2="262" y2="89"/><line class="conn" x1="334" y1="89" x2="350" y2="89"/><line class="conn" x1="446" y1="89" x2="462" y2="89"/><line class="conn" x1="528" y1="89" x2="544" y2="89"/><line class="conn" x1="446" y1="89" x2="454" y2="89"/><line class="conn" x1="454" y1="89" x2="454" y2="147"/><line class="conn" x1="454" y1="147" x2="462" y2="147"/><line class="conn" x1="158" y1="89" x2="166" y2="89"/><line class="conn" x1="166" y1="89" x2="166" y2="205"/><line class="conn" x1="166" y1="205" x2="174" y2="205"/><g class="u"><rect x="40" y="84" width="10" height="10" rx="5"/></g><line class="conn" x1="50" y1="89" x2="62" y2="89"/><g class="s" data-n="S"><rect x="62" y="76" width="96" height="26" rx="3"/><text class="sub" x="110.0" y="89" text-anchor="middle" dominant-baseline="central">system prompt</text></g><g data-x="S" style="display:none"><rect x="62" y="76" width="96" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="110.0" y="89.0" text-anchor="middle" dominant-baseline="central">evicted</text></g><text class="sub2" x="110.0" y="116" text-anchor="middle" data-r="S">used 95 · count 1</text><g class="u" data-n="A1"><rect x="174" y="76" width="72" height="26" rx="3"/><text class="sub" x="210.0" y="89" text-anchor="middle" dominant-baseline="central">A: turn 1</text></g><g data-x="A1" style="display:none"><rect x="174" y="76" width="72" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="210.0" y="89.0" text-anchor="middle" dominant-baseline="central">evicted</text></g><text class="sub2" x="210.0" y="116" text-anchor="middle" data-r="A1">used 71 · count 0</text><g class="u" data-n="A2"><rect x="262" y="76" width="72" height="26" rx="3"/><text class="sub" x="298.0" y="89" text-anchor="middle" dominant-baseline="central">A: turn 2</text></g><g data-x="A2" style="display:none"><rect x="262" y="76" width="72" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="298.0" y="89.0" text-anchor="middle" dominant-baseline="central">evicted</text></g><text class="sub2" x="298.0" y="116" text-anchor="middle" data-r="A2">used 71 · count 0</text><g class="u" data-n="A3q"><rect x="350" y="76" width="96" height="26" rx="3"/><text class="sub" x="398.0" y="89" text-anchor="middle" dominant-baseline="central">A: question 3</text></g><g data-x="A3q" style="display:none"><rect x="350" y="76" width="96" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="398.0" y="89.0" text-anchor="middle" dominant-baseline="central">evicted</text></g><text class="sub2" x="398.0" y="116" text-anchor="middle" data-r="A3q">used 71 · count 0</text><g class="u" data-n="A3a"><rect x="462" y="76" width="66" height="26" rx="3"/><text class="sub" x="495.0" y="89" text-anchor="middle" dominant-baseline="central">answer 3</text></g><g data-x="A3a" style="display:none"><rect x="462" y="76" width="66" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="495.0" y="89.0" text-anchor="middle" dominant-baseline="central">evicted</text></g><text class="sub2" x="495.0" y="116" text-anchor="middle" data-r="A3a">used 71 · count 0</text><g class="u" data-n="A4"><rect x="544" y="76" width="72" height="26" rx="3"/><text class="sub" x="580.0" y="89" text-anchor="middle" dominant-baseline="central">A: turn 4</text></g><g data-x="A4" style="display:none"><rect x="544" y="76" width="72" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="580.0" y="89.0" text-anchor="middle" dominant-baseline="central">evicted</text></g><text class="sub2" x="580.0" y="116" text-anchor="middle" data-r="A4">used 71 · count 0</text><g class="h" data-n="A3r"><rect x="462" y="134" width="120" height="26" rx="3"/><text class="sub" x="522.0" y="147" text-anchor="middle" dominant-baseline="central">answer 3, retried</text></g><g data-x="A3r" style="display:none"><rect x="462" y="134" width="120" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="522.0" y="147.0" text-anchor="middle" dominant-baseline="central">evicted</text></g><text class="sub2" x="522.0" y="174" text-anchor="middle" data-r="A3r">used 64 · count 0</text><g class="s" data-n="B1"><rect x="174" y="192" width="72" height="26" rx="3"/><text class="sub" x="210.0" y="205" text-anchor="middle" dominant-baseline="central">B: turn 1</text></g><g data-x="B1" style="display:none"><rect x="174" y="192" width="72" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="210.0" y="205.0" text-anchor="middle" dominant-baseline="central">evicted</text></g><text class="sub2" x="210.0" y="232" text-anchor="middle" data-r="B1">used 95 · count 1</text><text class="sub2" x="40" y="258" data-next="">next to go: answer 3, retried, the stalest leaf with count 0</text><text class="sub2" x="40" y="276" data-freed="">freed 0 tokens; 4,210 still cached</text><text class="cap" x="40" y="316" text-anchor="start">When memory runs short the tree gives up the least recently used leaf first. Only a leaf</text><text class="cap" x="40" y="336" text-anchor="start">can go, because removing a node from the middle would cut off everything below it; once</text><text class="cap" x="40" y="356" text-anchor="start">a leaf is gone its parent may become a leaf, so eviction works inward toward the shared</text><text class="cap" x="40" y="376" text-anchor="start">trunk.</text><text class="cap" x="40" y="416" text-anchor="start">A count on each node says how many running requests are using it. B's second turn is</text><text class="cap" x="40" y="436" text-anchor="start">running now, so B and the system prompt carry a count of 1 and cannot go. Answer 3 is</text><text class="cap" x="40" y="456" text-anchor="start">older than turn 4, but it must wait: while turn 4 is cached it is not a leaf.</text><text class="cap" x="40" y="496" text-anchor="start">Step it through: the retried answer goes first, then turn 4, then the rest of A, freeing</text><text class="cap" x="40" y="516" text-anchor="start">1,710 tokens in all; freeing 900 takes 4 steps. Untick the box and B's request ends: B</text><text class="cap" x="40" y="536" text-anchor="start">and then the system prompt become evictable too. The order was checked against the same</text><text class="cap" x="40" y="556" text-anchor="start">rule in Python.</text></svg></div><figcaption>Least recently used, leaves only, never anything in use: three rules, and together they peel a conversation back toward the trunk that everyone shares.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const N = [["S", "system prompt", 2000, null], ["A1", "A: turn 1", 400, "S"], ["A2", "A: turn 2", 350, "A1"], ["A3q", "A: question 3", 120, "A2"], ["A3a", "answer 3", 280, "A3q"], ["A4", "A: turn 4", 300, "A3a"], ["A3r", "answer 3, retried", 260, "A3q"], ["B1", "B: turn 1", 500, "S"]], LU = {"S": 95, "A1": 71, "A2": 71, "A3q": 71, "A3a": 71, "A3r": 64, "A4": 71, "B1": 95}, RUN = ["S", "B1"];
  const fx = (v, d = 2) => { const s = Math.abs(v).toFixed(d); return (v < 0 && +s !== 0 ? '\u2212' : '') + s; };const gx = (v, d = 0) => { const s = Math.abs(v).toFixed(d), [a, b] = s.split('.'); const t = a.replace(/\B(?=(\d{3})+(?!\d))/g, ','); return (v < 0 && +s !== 0 ? '\u2212' : '') + t + (b ? '.' + b : ''); };const pcx = (v, d = 1) => fx(100 * v, d) + '%';
  const q = s => fig.querySelector(s), box = fig.querySelector('input[type=checkbox]');
  const [stepB, resetB] = fig.querySelectorAll('button');
  let gone = [];
  function victim() {
    const ref = id => (box.checked && RUN.includes(id)) ? 1 : 0;
    const alive = N.filter(n => !gone.includes(n[0]));
    const leaves = alive.filter(n => !alive.some(m => m[3] === n[0]) && ref(n[0]) === 0);
    if (!leaves.length) return null;
    return leaves.reduce((a, b) => (LU[b[0]] < LU[a[0]] ? b : a));
  }
  function draw() {
    const v = victim();
    let freed = 0, kept = 0;
    N.forEach(n => {
      const g = q(`[data-n="${n[0]}"]`), r = g.querySelector('rect'), ghost = q(`[data-x="${n[0]}"]`);
      const out = gone.includes(n[0]);
      if (out) freed += n[2]; else kept += n[2];
      g.style.display = out ? 'none' : ''; ghost.style.display = out ? '' : 'none';
      const ref = (box.checked && RUN.includes(n[0])) ? 1 : 0;
      g.setAttribute('class', v && v[0] === n[0] ? 'h' : (ref ? 's' : 'u'));
      q(`[data-r="${n[0]}"]`).textContent = `used ${LU[n[0]]} · count ${ref}`;
    });
    q('[data-next]').textContent = v ? `next to go: ${v[1]}, the stalest leaf with count 0` : 'nothing left that can be evicted';
    q('[data-freed]').textContent = `freed ${gx(freed)} tokens; ${gx(kept)} still cached`;
    stepB.disabled = !v;
  }
  stepB.addEventListener('click', () => { const v = victim(); if (v) gone.push(v[0]); draw(); });
  resetB.addEventListener('click', () => { gone = []; box.checked = true; draw(); });
  box.addEventListener('change', draw);
  draw();
})();</script></figure>
