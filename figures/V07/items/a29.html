<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:58</div><h3>Under a p99 limit, Sarathi-Serve served 2.6 to 5.6 times what vLLM could</h3><svg viewBox='0 0 680 396' role='img'><title>Under a p99 limit, Sarathi-Serve served 2.6 to 5.6 times what vLLM could</title><text class="hd" x="40" y="46">Serving capacity under a p99 limit on the time between tokens, vLLM = 1, to scale</text><text class="cap" x="40" y="82" text-anchor="start">vLLM</text><g class="u"><rect x="230" y="70" width="67.85714285714286" height="26" rx="2"/></g><text class="sub2" x="307.9" y="88" text-anchor="start">1.0×</text><text class="cap" x="40" y="118" text-anchor="start">Mistral-7B</text><text class="sub2" x="40" y="133" text-anchor="start">1 A100</text><g class="s"><rect x="230" y="106" width="176.42857142857144" height="26" rx="2"/></g><text class="sub2" x="416.4" y="124" text-anchor="start">2.6×</text><text class="cap" x="40" y="154" text-anchor="start">Yi-34B</text><text class="sub2" x="40" y="169" text-anchor="start">2 A100s, up to</text><g class="s"><rect x="230" y="142" width="251.0714285714286" height="26" rx="2"/></g><text class="sub2" x="491.1" y="160" text-anchor="start">3.7×</text><text class="cap" x="40" y="190" text-anchor="start">Falcon-180B</text><text class="sub2" x="40" y="205" text-anchor="start">8 A100s, pipelined, up to</text><g class="s"><rect x="230" y="178" width="380.0" height="26" rx="2"/></g><text class="sub2" x="620.0" y="196" text-anchor="start">5.6×</text><text class="cap" x="40" y="244" text-anchor="start">Serving capacity is the highest request rate a deployment can sustain while the 99th</text><text class="cap" x="40" y="264" text-anchor="start">percentile of its time between tokens stays inside a limit. Sarathi-Serve set the limit</text><text class="cap" x="40" y="284" text-anchor="start">at 5 times, or in a relaxed setting 25 times, the time of an undisturbed decode step.</text><text class="cap" x="40" y="324" text-anchor="start">Against vLLM it reported 2.6 times the capacity for Mistral-7B on one A100, up to 3.7</text><text class="cap" x="40" y="344" text-anchor="start">times for Yi-34B on two, and up to 5.6 times for Falcon-180B split over two nodes of</text><text class="cap" x="40" y="364" text-anchor="start">four A100s with pipeline parallelism.</text></svg><figcaption>The largest gain came where even steps pay twice: once in stalls, and once in the pipeline bubbles the next figure counts.</figcaption></figure>
