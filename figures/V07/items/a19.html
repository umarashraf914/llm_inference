<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:26</div><h3>Four requests mid-flight have four different shapes</h3><svg viewBox='0 0 680 506' role='img'><title>Four requests mid-flight have four different shapes</title><text class="hd" x="40" y="46">Keys each request's new tokens must read this step, in Orca's example</text><text class="cap" x="40" y="86" text-anchor="start">x1: decoding its 4th token</text><g class="s"><rect x="236" y="70" width="22" height="22" rx="2"/></g><g class="s"><rect x="262" y="70" width="22" height="22" rx="2"/></g><g class="s"><rect x="288" y="70" width="22" height="22" rx="2"/></g><g class="s"><rect x="314" y="70" width="22" height="22" rx="2"/></g><g class="s"><rect x="430" y="70" width="22" height="22" rx="2"/></g><g class="s"><rect x="456" y="70" width="22" height="22" rx="2"/></g><g class="s"><rect x="482" y="70" width="22" height="22" rx="2"/></g><g class="s"><rect x="508" y="70" width="22" height="22" rx="2"/></g><text class="cap" x="40" y="118" text-anchor="start">x2: decoding its 2nd token</text><g class="s"><rect x="236" y="102" width="22" height="22" rx="2"/></g><g class="s"><rect x="262" y="102" width="22" height="22" rx="2"/></g><g class="s"><rect x="430" y="102" width="22" height="22" rx="2"/></g><g class="s"><rect x="456" y="102" width="22" height="22" rx="2"/></g><rect x="482" y="102" width="22" height="22" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="508" y="102" width="22" height="22" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="cap" x="40" y="150" text-anchor="start">x3: a 2-token prompt</text><g class="s"><rect x="236" y="134" width="22" height="22" rx="2"/></g><g class="s"><rect x="262" y="134" width="22" height="22" rx="2"/></g><g class="s"><rect x="430" y="134" width="22" height="22" rx="2"/></g><g class="s"><rect x="456" y="134" width="22" height="22" rx="2"/></g><rect x="482" y="134" width="22" height="22" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="508" y="134" width="22" height="22" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="cap" x="40" y="182" text-anchor="start">x4: a 3-token prompt</text><g class="s"><rect x="236" y="166" width="22" height="22" rx="2"/></g><g class="s"><rect x="262" y="166" width="22" height="22" rx="2"/></g><g class="s"><rect x="288" y="166" width="22" height="22" rx="2"/></g><g class="s"><rect x="430" y="166" width="22" height="22" rx="2"/></g><g class="s"><rect x="456" y="166" width="22" height="22" rx="2"/></g><g class="s"><rect x="482" y="166" width="22" height="22" rx="2"/></g><rect x="508" y="166" width="22" height="22" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="236" y="210" text-anchor="start">as they are: ragged</text><text class="sub2" x="430" y="210" text-anchor="start">padded: 16 cells for 11 real</text><text class="cap" x="40" y="254" text-anchor="start">Orca's paper follows four requests mid-flight. x1 is generating its 4th token, so its</text><text class="cap" x="40" y="274" text-anchor="start">new token attends over 4 keys; x2 is on its 2nd; x3 and x4 have just arrived with</text><text class="cap" x="40" y="294" text-anchor="start">prompts of 2 and 3 tokens. Each request's next step has a different shape: different</text><text class="cap" x="40" y="314" text-anchor="start">numbers of new tokens, and different numbers of keys behind them.</text><text class="cap" x="40" y="354" text-anchor="start">A batched operation works on one tensor, a block of numbers laid out along several</text><text class="cap" x="40" y="374" text-anchor="start">dimensions with every row the same length. Forcing these four into one means padding the</text><text class="cap" x="40" y="394" text-anchor="start">short rows with dummy entries: 16 cells for 11 real ones. With lengths like 7, 40, 900</text><text class="cap" x="40" y="414" text-anchor="start">and 2,000 keys, 63% of the rectangle would be padding.</text><text class="cap" x="40" y="454" text-anchor="start">That is what Orca means by no guarantee that the next iteration can be merged into one</text><text class="cap" x="40" y="474" text-anchor="start">batched operation.</text></svg><figcaption>A batched operation wants a rectangle. Requests at different points in their lives rarely form one, and padding them into one wastes most of it.</figcaption></figure>
