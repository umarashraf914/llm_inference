<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:24</div><h3>The same memory holds 2.5 to 4.7 times the sequences</h3><svg viewBox='0 0 680 436' role='img'><title>The same memory holds 2.5 to 4.7 times the sequences</title><text class="hd" x="40" y="46">Share of cache memory holding real tokens, measured, drawn to scale</text><text class="cap" x="40" y="87" text-anchor="start">reserve the model's maximum, 2,048</text><rect x="290" y="70" width="330" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="290" y="70" width="67.32" height="24" rx="2"/></g><text class="sub2" x="365.3" y="87" text-anchor="start">20.4%</text><text class="cap" x="40" y="123" text-anchor="start">reserve up to twice the true length</text><rect x="290" y="106" width="330" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="290" y="106" width="88.44" height="24" rx="2"/></g><text class="sub2" x="386.4" y="123" text-anchor="start">26.8%</text><text class="cap" x="40" y="159" text-anchor="start">reserve exactly the true length</text><rect x="290" y="142" width="330" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="290" y="142" width="126.06" height="24" rx="2"/></g><text class="sub2" x="424.1" y="159" text-anchor="start">38.2%</text><text class="cap" x="40" y="195" text-anchor="start">paged, vLLM</text><rect x="290" y="178" width="330" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="290" y="178" width="317.78999999999996" height="24" rx="2"/><text class="sub" x="448.895" y="190.0" text-anchor="middle" dominant-baseline="central">96.3%</text></g><text class="cap" x="40" y="244" text-anchor="start">The vLLM paper (Kwon et al., SOSP 2023) measured this directly. Its authors built three</text><text class="cap" x="40" y="264" text-anchor="start">versions of Orca's contiguous reservation: one reserving the model's maximum length, one</text><text class="cap" x="40" y="284" text-anchor="start">up to twice the true answer, one exactly the true answer, which no real system can know</text><text class="cap" x="40" y="304" text-anchor="start">in advance. Under those rules 20.4% to 38.2% of the memory held real tokens. Under</text><text class="cap" x="40" y="324" text-anchor="start">paging 96.3% did, wasting under 4%.</text><text class="cap" x="40" y="364" text-anchor="start">Real tokens per gigabyte therefore rise 2.5 times against the best of the three and 4.7</text><text class="cap" x="40" y="384" text-anchor="start">times against the worst. More sequences fit on the same card, the batch grows, and each</text><text class="cap" x="40" y="404" text-anchor="start">read of the weights covers more tokens.</text></svg><figcaption>Room is not yet speed. Capacity sets how large the batch can be; keeping it that large is the scheduling problem the next part takes up.</figcaption></figure>
