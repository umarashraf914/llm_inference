<figure><div class='ts'>Fig 03 &nbsp;&middot;&nbsp; 1:38</div><h3>Why batching works at all</h3><svg viewBox="0 0 680 492" role="img"><title>Why batching works at all</title><text class="hd" x="40" y="46">The weights belong to nobody</text><g class="h"><rect x="40" y="70" width="190" height="44" rx="4"></rect><text class="sub" x="135.0" y="92.0" text-anchor="middle" dominant-baseline="central">one weight matrix</text></g><line class="conn" x1="236" y1="92" x2="262" y2="78" marker-end="url(#arw)"></line><g class="s"><rect x="268" y="66" width="90" height="16" rx="2"></rect></g><line class="conn" x1="236" y1="92" x2="262" y2="98" marker-end="url(#arw)"></line><g class="s"><rect x="268" y="86" width="90" height="16" rx="2"></rect></g><line class="conn" x1="236" y1="92" x2="262" y2="118" marker-end="url(#arw)"></line><g class="s"><rect x="268" y="106" width="90" height="16" rx="2"></rect></g><line class="conn" x1="236" y1="92" x2="262" y2="138" marker-end="url(#arw)"></line><g class="s"><rect x="268" y="126" width="90" height="16" rx="2"></rect></g><line class="conn" x1="236" y1="92" x2="262" y2="158" marker-end="url(#arw)"></line><g class="s"><rect x="268" y="146" width="90" height="16" rx="2"></rect></g><text class="sub2" x="372" y="92" text-anchor="start">multiplied against N token vectors at once</text><text class="cap" x="40" y="200" text-anchor="start">Instead of reading the weights, computing one token, and starting over, the system gathers N</text><text class="cap" x="40" y="220" text-anchor="start">requests that each need a decode step and multiplies each matrix against all N together.</text><text class="cap" x="40" y="260" text-anchor="start">The thin matrix-vector product becomes a fat matrix-matrix product.</text><text class="cap" x="40" y="300" text-anchor="start">Bytes moved</text><g class="h"><rect x="240" y="284" width="300" height="30" rx="3"></rect><text class="sub" x="390.0" y="299.0" text-anchor="middle" dominant-baseline="central">almost flat, weights read once</text></g><text class="cap" x="40" y="350" text-anchor="start">Useful arithmetic</text><g class="m"><rect x="240" y="334" width="300" height="30" rx="3"></rect><text class="sub" x="390.0" y="349.0" text-anchor="middle" dominant-baseline="central">grows with N</text></g><text class="cap" x="40" y="410" text-anchor="start">Arithmetic intensity rises by roughly a factor of N, and decode walks up the roofline away from</text><text class="cap" x="40" y="430" text-anchor="start">the memory-bound floor toward where the tensor cores finally run hot.</text><text class="cap" x="40" y="470" text-anchor="start">One read of the weights now produces N tokens instead of one.</text></svg><figcaption>It works for exactly one reason: the weights are identical for every request. Nothing else in the forward pass has that property, which is what the next two figures are about.</figcaption></figure>
