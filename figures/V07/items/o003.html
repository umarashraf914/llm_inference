<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 1:47</div><h3>Why batching works at all</h3><svg viewBox='0 0 680 454' role='img'><title>Why batching works at all</title><text class="hd" x="40" y="46">The weights belong to nobody</text><g class="h"><rect x="40" y="84" width="190" height="56" rx="4"/><text class="lbl" x="135.0" y="103.0" text-anchor="middle" dominant-baseline="central">one weight matrix</text><text class="sub" x="135.0" y="121.0" text-anchor="middle" dominant-baseline="central">read once from memory</text></g><line class="conn" x1="236" y1="112" x2="280" y2="74" marker-end="url(#arw)"/><g class="s"><rect x="286" y="66" width="96" height="16" rx="2"/><text class="sub" x="334.0" y="74.0" text-anchor="middle" dominant-baseline="central">request 1</text></g><line class="conn" x1="236" y1="112" x2="280" y2="98" marker-end="url(#arw)"/><g class="s"><rect x="286" y="90" width="96" height="16" rx="2"/><text class="sub" x="334.0" y="98.0" text-anchor="middle" dominant-baseline="central">request 2</text></g><line class="conn" x1="236" y1="112" x2="280" y2="122" marker-end="url(#arw)"/><g class="s"><rect x="286" y="114" width="96" height="16" rx="2"/><text class="sub" x="334.0" y="122.0" text-anchor="middle" dominant-baseline="central">request 3</text></g><line class="conn" x1="236" y1="112" x2="280" y2="146" marker-end="url(#arw)"/><g class="s"><rect x="286" y="138" width="96" height="16" rx="2"/><text class="sub" x="334.0" y="146.0" text-anchor="middle" dominant-baseline="central">…</text></g><line class="conn" x1="236" y1="112" x2="280" y2="170" marker-end="url(#arw)"/><g class="s"><rect x="286" y="162" width="96" height="16" rx="2"/><text class="sub" x="334.0" y="170.0" text-anchor="middle" dominant-baseline="central">request N</text></g><text class="sub2" x="396" y="116" text-anchor="start">one token vector from each request,</text><text class="sub2" x="396" y="132" text-anchor="start">all multiplied by the same weights</text><text class="cap" x="40" y="222" text-anchor="start">When the GPU pulls a weight matrix out of high-bandwidth memory, nothing about that</text><text class="cap" x="40" y="242" text-anchor="start">matrix belongs to any particular user. So instead of reading the weights, computing one</text><text class="cap" x="40" y="262" text-anchor="start">token and starting over, the system gathers N requests that each need a decode step,</text><text class="cap" x="40" y="282" text-anchor="start">reads each weight matrix once, and multiplies it against all N token vectors at the same</text><text class="cap" x="40" y="302" text-anchor="start">time.</text><text class="cap" x="40" y="342" text-anchor="start">The thin matrix-vector product becomes a fat matrix-matrix product. The next two figures</text><text class="cap" x="40" y="362" text-anchor="start">count what that does: the bytes moved stay where they were, and the useful work grows N</text><text class="cap" x="40" y="382" text-anchor="start">times.</text><text class="cap" x="40" y="422" text-anchor="start">One read of the weights now produces N tokens instead of one.</text></svg><figcaption>It works for exactly one reason: the weights are identical for every request. Nothing else in the forward pass has that property, which is what {{ref:v07-o005}} is about.</figcaption></figure>
