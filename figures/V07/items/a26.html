<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:22</div><h3>A budget caps the step, however long the prompt</h3><svg viewBox='0 0 680 492' role='img'><title>A budget caps the step, however long the prompt</title><text class="hd" x="40" y="46">The longest step for three prompt lengths, admitted whole and under a 512 budget, to scale</text><text class="cap" x="40" y="87" text-anchor="start">500-token prompt</text><g class="h"><rect x="210" y="70" width="21.85756972111554" height="22" rx="2"/></g><text class="sub2" x="241.9" y="86" text-anchor="start">whole: 8.64 ms</text><g class="s"><rect x="210" y="96" width="21.03585657370518" height="22" rx="2"/></g><text class="sub2" x="241.0" y="112" text-anchor="start">budget 512: 8.31 ms</text><text class="cap" x="40" y="149" text-anchor="start">2,000-token prompt</text><g class="h"><rect x="210" y="132" width="83.48605577689243" height="22" rx="2"/></g><text class="sub2" x="303.5" y="148" text-anchor="start">whole: 33.0 ms</text><g class="s"><rect x="210" y="158" width="21.03585657370518" height="22" rx="2"/></g><text class="sub2" x="241.0" y="174" text-anchor="start">budget 512: 8.31 ms</text><text class="cap" x="40" y="211" text-anchor="start">8,000-token prompt</text><g class="h"><rect x="210" y="194" width="330.0" height="22" rx="2"/></g><text class="sub2" x="550.0" y="210" text-anchor="start">whole: 130.4 ms</text><g class="s"><rect x="210" y="220" width="21.03585657370518" height="22" rx="2"/></g><text class="sub2" x="241.0" y="236" text-anchor="start">budget 512: 8.31 ms</text><text class="cap" x="40" y="280" text-anchor="start">Admitted whole, a prompt's step grows with its length: 8.64 ms for 500 tokens, 33.0 ms</text><text class="cap" x="40" y="300" text-anchor="start">for 2,000, 130 ms for 8,000. Under a 512-token budget the longest step is 8.31 ms for</text><text class="cap" x="40" y="320" text-anchor="start">all three; a longer prompt only takes more steps.</text><text class="cap" x="40" y="360" text-anchor="start">And the first 340 prompt tokens of any step are free: until the step holds 372 tokens</text><text class="cap" x="40" y="380" text-anchor="start">the arithmetic still finishes inside the 6.04 ms read ({{fig:v07-a23}}). A budget near</text><text class="cap" x="40" y="400" text-anchor="start">that size would cost the running requests almost nothing.</text><text class="cap" x="40" y="440" text-anchor="start">Attention's own arithmetic, left out here, grows with the square of a prompt's length:</text><text class="cap" x="40" y="460" text-anchor="start">at 8,000 tokens it would add another 17 ms to the whole-prompt step.</text></svg><figcaption>The budget turns one unbounded stall into many bounded steps. Running requests stop paying for a stranger's length.</figcaption></figure>
