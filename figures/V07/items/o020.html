<figure><div class='ts'>Fig 20 &nbsp;&middot;&nbsp; 22:37</div><h3>Why picking the top token fails</h3><svg viewBox="0 0 680 502" role="img"><title>Why picking the top token fails</title><text class="hd" x="40" y="46">Every forward pass ends the same way</text><g class="u"><rect x="40" y="70" width="180" height="40" rx="4"></rect><text class="sub" x="130.0" y="90.0" text-anchor="middle" dominant-baseline="central">logits</text></g><line class="conn" x1="226" y1="90" x2="246" y2="90" marker-end="url(#arw)"></line><g class="u"><rect x="252" y="70" width="180" height="40" rx="4"></rect><text class="sub" x="342.0" y="90.0" text-anchor="middle" dominant-baseline="central">softmax</text></g><line class="conn" x1="438" y1="90" x2="458" y2="90" marker-end="url(#arw)"></line><g class="s"><rect x="464" y="70" width="176" height="40" rx="4"></rect><text class="sub" x="552.0" y="90.0" text-anchor="middle" dominant-baseline="central">pick one token</text></g><text class="cap" x="40" y="148" text-anchor="start">One raw score for every token in the vocabulary, turned into a probability distribution. Relative</text><text class="cap" x="40" y="168" text-anchor="start">to a forward pass over a trillion parameters, picking from it is nearly free.</text><text class="cap" x="40" y="208" text-anchor="start">It is also where every user-facing quality knob lives.</text><text class="hd" x="40" y="258">Neither extreme works</text><g class="h"><rect x="40" y="278" width="285" height="82" rx="8"></rect><text class="lbl" x="182.5" y="302.0" text-anchor="middle" dominant-baseline="central">Always take the highest</text><text class="sub" x="182.5" y="320.0" text-anchor="middle" dominant-baseline="central">degeneration: bland, incoherent,</text><text class="sub" x="182.5" y="337.0" text-anchor="middle" dominant-baseline="central">stuck in repetitive loops</text></g><g class="h"><rect x="368" y="278" width="272" height="82" rx="8"></rect><text class="lbl" x="504.0" y="302.0" text-anchor="middle" dominant-baseline="central">Sample from the raw tail</text><text class="sub" x="504.0" y="320.0" text-anchor="middle" dominant-baseline="central">thousands of tokens with tiny</text><text class="sub" x="504.0" y="337.0" text-anchor="middle" dominant-baseline="central">shares, drawn regularly</text></g><text class="cap" x="40" y="400" text-anchor="start">Models do assign high probability to well-formed text, but the highest-scoring long</text><text class="cap" x="40" y="420" text-anchor="start">continuations tend to be generic and repetitive. And a language model's tail is unreliable:</text><text class="cap" x="40" y="440" text-anchor="start">enough mass spread across thousands of tokens that incoherent choices get drawn.</text><text class="cap" x="40" y="480" text-anchor="start">So the sampler does two things. It reshapes the distribution, and it cuts off the tail.</text></svg><figcaption>Demonstrated in 2020 under the name degeneration. Both naive strategies fail, in opposite directions.</figcaption></figure>
