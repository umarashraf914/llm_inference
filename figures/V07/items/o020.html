<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 23:01</div><h3>Taking the top token fails, and so does sampling everything</h3><svg viewBox='0 0 680 368' role='img'><title>Taking the top token fails, and so does sampling everything</title><text class="hd" x="40" y="46">Neither extreme works</text><g class="h"><rect x="40" y="70" width="285" height="82" rx="8"/><text class="lbl" x="182.5" y="94.0" text-anchor="middle" dominant-baseline="central">Always take the highest</text><text class="sub" x="182.5" y="112.0" text-anchor="middle" dominant-baseline="central">degeneration: bland, incoherent,</text><text class="sub" x="182.5" y="129.0" text-anchor="middle" dominant-baseline="central">stuck in repetitive loops</text></g><g class="h"><rect x="355" y="70" width="285" height="82" rx="8"/><text class="lbl" x="497.5" y="94.0" text-anchor="middle" dominant-baseline="central">Sample from the raw shares</text><text class="sub" x="497.5" y="112.0" text-anchor="middle" dominant-baseline="central">thousands of tiny shares,</text><text class="sub" x="497.5" y="129.0" text-anchor="middle" dominant-baseline="central">and incoherent choices drawn</text></g><text class="cap" x="40" y="196" text-anchor="start">The obvious approach is to take the highest-scoring token every time. It does not work.</text><text class="cap" x="40" y="216" text-anchor="start">Holtzman and colleagues showed in 2020 that maximization-based decoding, choosing</text><text class="cap" x="40" y="236" text-anchor="start">greedily or by beam search, produces what they named degeneration: text that is bland,</text><text class="cap" x="40" y="256" text-anchor="start">incoherent, or stuck in repetitive loops.</text><text class="cap" x="40" y="296" text-anchor="start">Sampling straight from the raw distribution fails in the opposite direction. A language</text><text class="cap" x="40" y="316" text-anchor="start">model's tail is unreliable: thousands of tokens each hold a tiny share, and between them</text><text class="cap" x="40" y="336" text-anchor="start">enough probability that incoherent choices get drawn regularly.</text></svg><figcaption>Both naive strategies fail, in opposite directions. The next three figures take them apart: what maximising means, what it produces, and how a thin tail adds up.</figcaption></figure>
