<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 29:15</div><h3>Where the batching argument runs out</h3><svg viewBox='0 0 680 522' role='img'><title>Where the batching argument runs out</title><text class="hd" x="40" y="46">Tokens a second from the same reads of Llama 3 70B's weights, drawn to scale</text><text class="cap" x="40" y="84" text-anchor="start">one user</text><g class="h"><rect x="210" y="66" width="4.375" height="26" rx="3"/></g><text class="sub2" x="224.375" y="84" text-anchor="start">23.9 tokens a second</text><text class="cap" x="40" y="124" text-anchor="start">64 users, the same reads</text><g class="s"><rect x="210" y="106" width="280.0" height="26" rx="3"/></g><text class="sub2" x="500.0" y="124" text-anchor="start">1,531 tokens a second</text><g class="m"><rect x="90" y="166" width="500" height="40" rx="3"/><text class="sub" x="340.0" y="186.0" text-anchor="middle" dominant-baseline="central">so get more than one token out of a read, for the same request</text></g><text class="cap" x="40" y="250" text-anchor="start">Every technique in this document raises the number of tokens produced per read of the</text><text class="cap" x="40" y="270" text-anchor="start">weights, and each does it the same way: by putting more requests behind that one read.</text><text class="cap" x="40" y="290" text-anchor="start">So set the number of requests to one: a single user, one conversation, nothing else on</text><text class="cap" x="40" y="310" text-anchor="start">the machine.</text><text class="cap" x="40" y="350" text-anchor="start">Every technique still runs, and not one of them helps. On Llama 3 70B each read of</text><text class="cap" x="40" y="370" text-anchor="start">140 GB takes 140 GB ÷ 3.35 TB/s = 41.8 ms, so that one stream gets 23.9 tokens a second,</text><text class="cap" x="40" y="390" text-anchor="start">exactly as at the start ({{fig:v01-o130}}). The same reads shared by 64 requests would produce</text><text class="cap" x="40" y="410" text-anchor="start">1,531.</text><text class="cap" x="40" y="450" text-anchor="start">It is as memory-bound as it ever was, because there is nothing to share the read with.</text><text class="cap" x="40" y="470" text-anchor="start">If you cannot put more requests behind a weight read, the only direction left is to get</text><text class="cap" x="40" y="490" text-anchor="start">more than one token out of it for the same request. That is speculative decoding.</text></svg><figcaption>A clean limit. Everything in this document scales with the crowd; the single-user case needs a different idea entirely.</figcaption></figure>
