<figure><div class='ts'>Fig 26 &nbsp;&middot;&nbsp; 29:09</div><h3>Where the batching argument runs out</h3><svg viewBox="0 0 680 372" role="img"><title>Where the batching argument runs out</title><text class="hd" x="40" y="46">Now set the number of requests to one</text><g class="u"><rect x="40" y="70" width="600" height="40" rx="4"></rect><text class="sub" x="340.0" y="90.0" text-anchor="middle" dominant-baseline="central">a single user, one conversation, nothing else on the machine</text></g><text class="cap" x="40" y="154" text-anchor="start">Every technique in this document still runs, and not one of them helps. That stream pays a full</text><text class="cap" x="40" y="174" text-anchor="start">weight read for every single token it produces, exactly as it did at the start.</text><text class="cap" x="40" y="214" text-anchor="start">It is as memory-bound as it ever was, because there is nothing to share the read with.</text><g class="m"><rect x="90" y="246" width="500" height="42" rx="6"></rect><text class="sub" x="340.0" y="267.0" text-anchor="middle" dominant-baseline="central">so get more than one token out of a read, for the same request</text></g><text class="cap" x="40" y="330" text-anchor="start">If you cannot put more requests behind a weight read, the only direction left is to get more</text><text class="cap" x="40" y="350" text-anchor="start">tokens out of it. That is speculative decoding.</text></svg><figcaption>A clean limit. Everything in this episode scales with the crowd; the single-user case needs a different idea entirely.</figcaption></figure>
