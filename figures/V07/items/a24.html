<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 10:42</div><h3>One prompt joins, and every running request waits 5.5 times as long</h3><svg viewBox='0 0 680 446' role='img'><title>One prompt joins, and every running request waits 5.5 times as long</title><text class="hd" x="40" y="46">Seven steps of the engine, and one running user's tokens, drawn to scale in time</text><text class="cap" x="40" y="88" text-anchor="start">engine steps</text><text class="cap" x="40" y="134" text-anchor="start">one user's tokens</text><g class="u"><rect x="151.0" y="70" width="39.45" height="28" rx="2"/></g><g class="s"><rect x="189.45" y="120" width="4" height="20" rx="1"/></g><g class="u"><rect x="192.45" y="70" width="39.45" height="28" rx="2"/></g><g class="s"><rect x="230.9" y="120" width="4" height="20" rx="1"/></g><g class="u"><rect x="233.9" y="70" width="39.45" height="28" rx="2"/></g><g class="s"><rect x="272.35" y="120" width="4" height="20" rx="1"/></g><g class="h"><rect x="275.35" y="70" width="224.21" height="28" rx="2"/><text class="sub" x="387.45500000000004" y="84.0" text-anchor="middle" dominant-baseline="central">+ the 2,000-token prompt</text></g><g class="s"><rect x="498.57" y="120" width="4" height="20" rx="1"/></g><g class="u"><rect x="501.57" y="70" width="39.45" height="28" rx="2"/></g><g class="s"><rect x="540.02" y="120" width="4" height="20" rx="1"/></g><g class="u"><rect x="543.02" y="70" width="39.45" height="28" rx="2"/></g><g class="s"><rect x="581.47" y="120" width="4" height="20" rx="1"/></g><g class="u"><rect x="584.47" y="70" width="39.45" height="28" rx="2"/></g><g class="s"><rect x="622.92" y="120" width="4" height="20" rx="1"/></g><line class="tick" x1="274.3535622877612" y1="156" x2="500.566190705342" y2="156"/><line class="tick" x1="274.3535622877612" y1="151" x2="274.3535622877612" y2="156"/><line class="tick" x1="500.566190705342" y1="151" x2="500.566190705342" y2="156"/><text class="sub2" x="387.5" y="172" text-anchor="middle">33.0 ms with no token</text><line class="tick" x1="150" y1="156" x2="191.45118742925374" y2="156"/><line class="tick" x1="150" y1="151" x2="150" y2="156"/><line class="tick" x1="191.45118742925374" y1="151" x2="191.45118742925374" y2="156"/><text class="sub2" x="150" y="172" text-anchor="start">6.04 ms</text><line class="tick" x1="150.0" y1="190" x2="150.0" y2="195"/><text class="sub2" x="150.0" y="209" text-anchor="middle">0</text><line class="tick" x1="218.57142857142856" y1="190" x2="218.57142857142856" y2="195"/><text class="sub2" x="218.6" y="209" text-anchor="middle">10</text><line class="tick" x1="287.1428571428571" y1="190" x2="287.1428571428571" y2="195"/><text class="sub2" x="287.1" y="209" text-anchor="middle">20</text><line class="tick" x1="355.71428571428567" y1="190" x2="355.71428571428567" y2="195"/><text class="sub2" x="355.7" y="209" text-anchor="middle">30</text><line class="tick" x1="424.2857142857143" y1="190" x2="424.2857142857143" y2="195"/><text class="sub2" x="424.3" y="209" text-anchor="middle">40</text><line class="tick" x1="492.8571428571429" y1="190" x2="492.8571428571429" y2="195"/><text class="sub2" x="492.9" y="209" text-anchor="middle">50</text><line class="tick" x1="561.4285714285713" y1="190" x2="561.4285714285713" y2="195"/><text class="sub2" x="561.4" y="209" text-anchor="middle">60</text><line class="tick" x1="630.0" y1="190" x2="630.0" y2="195"/><text class="sub2" x="630.0" y="209" text-anchor="end">70 ms</text><line class="axis" x1="150" y1="190" x2="630" y2="190"/><text class="cap" x="40" y="254" text-anchor="start">Every running request gets its next token at the end of each step: with 32 decodes</text><text class="cap" x="40" y="274" text-anchor="start">alone, every 6.04 ms. The step that admits a 2,000-token prompt takes 33.0 ms, so each</text><text class="cap" x="40" y="294" text-anchor="start">of the 32 waits 5.5 times as long for that token, mid-answer.</text><text class="cap" x="40" y="334" text-anchor="start">Those numbers come from peak arithmetic on an 8B model with one prompt joining.</text><text class="cap" x="40" y="354" text-anchor="start">Measured, Sarathi-Serve found naive mixing stretched the time between tokens by up to</text><text class="cap" x="40" y="374" text-anchor="start">28.3 times, and in vLLM, which admitted waiting prompts eagerly, stalls lasted several</text><text class="cap" x="40" y="394" text-anchor="start">seconds (Yi-34B on two A100s): users mid-answer simply stop receiving text while a</text><text class="cap" x="40" y="414" text-anchor="start">stranger's prompt is processed.</text></svg><figcaption>The stall falls on people already being served, and it grows with every token of a stranger's prompt.</figcaption></figure>
