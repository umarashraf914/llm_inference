<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:16</div><h3>Once the caches count, intensity levels off below 64</h3><div class='wg'><div class='ctl'><label>context per request <input type='range' min='0' max='7' step='1' value='3'><span class='val'>2,048</span></label><button type='button'>Reset</button></div><svg viewBox='0 0 680 630' role='img'><title>Once the caches count, intensity levels off below 64</title><text class="hd" x="40" y="34">Operations per byte against batch size, Llama 3 8B, both axes logarithmic</text><line class="axis" x1="110" y1="262" x2="620" y2="262"/><line class="axis" x1="110" y1="70" x2="110" y2="262"/><line class="tick" x1="110.0" y1="262" x2="110.0" y2="267"/><text class="sub2" x="110.0" y="281" text-anchor="middle">1</text><line class="tick" x1="212.0" y1="262" x2="212.0" y2="267"/><text class="sub2" x="212.0" y="281" text-anchor="middle">4</text><line class="tick" x1="314.0" y1="262" x2="314.0" y2="267"/><text class="sub2" x="314.0" y="281" text-anchor="middle">16</text><line class="tick" x1="416.0" y1="262" x2="416.0" y2="267"/><text class="sub2" x="416.0" y="281" text-anchor="middle">64</text><line class="tick" x1="518.0" y1="262" x2="518.0" y2="267"/><text class="sub2" x="518.0" y="281" text-anchor="middle">256</text><line class="tick" x1="620.0" y1="262" x2="620.0" y2="267"/><text class="sub2" x="620.0" y="281" text-anchor="middle">1,024</text><line class="tick" x1="105" y1="262.0" x2="110" y2="262.0"/><text class="sub2" x="101" y="266.0" text-anchor="end">1</text><line class="tick" x1="105" y1="198.0" x2="110" y2="198.0"/><text class="sub2" x="101" y="202.0" text-anchor="end">10</text><line class="tick" x1="105" y1="134.0" x2="110" y2="134.0"/><text class="sub2" x="101" y="138.0" text-anchor="end">100</text><line class="tick" x1="105" y1="70.0" x2="110" y2="70.0"/><text class="sub2" x="101" y="74.0" text-anchor="end">1,000</text><text class="sub2" x="365.0" y="300" text-anchor="middle">batch size: requests in the step</text><text class="sub2" x="101" y="56" text-anchor="start">operations per byte</text><line class="mark" x1="110" y1="103.9" x2="620" y2="103.9"/><text class="sub2 halo" x="118" y="119.9" text-anchor="start" style="paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round">ridge, 295</text><polyline class="conn" points="110.0,262.0 618.3,70.0" style="stroke-dasharray:4 3"/><polyline class="pl-m" points="110.0,260.7 122.7,255.9 135.5,251.2 148.3,246.5 161.0,241.8 173.7,237.2 186.5,232.6 199.3,228.0 212.0,223.5 224.7,219.0 237.5,214.5 250.3,210.2 263.0,205.9 275.8,201.7 288.5,197.6 301.2,193.6 314.0,189.7 326.7,186.0 339.5,182.4 352.3,179.0 365.0,175.8 377.7,172.7 390.5,169.9 403.3,167.3 416.0,164.8 428.8,162.6 441.5,160.6 454.2,158.8 467.0,157.1 479.7,155.7 492.5,154.4 505.3,153.3 518.0,152.3 530.7,151.5 543.5,150.7 556.3,150.1 569.0,149.6 581.7,149.1 594.5,148.7 607.2,148.4 620.0,148.1" data-curve=""/><line class="tick" x1="110" y1="146.5" x2="620" y2="146.5" style="stroke-dasharray:1 3" data-limline=""/><text class="sub2 halo" x="616" y="140.5" text-anchor="end" style="paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round" data-lim="">limit 63.8</text><line class="pl-m" x1="300" y1="52" x2="324" y2="52"/><text class="sub2" x="332" y="56" text-anchor="start">with the caches counted</text><line class="conn" x1="478" y1="52" x2="502" y2="52" style="stroke-dasharray:4 3"/><text class="sub2" x="510" y="56" text-anchor="start">weights alone</text><text class="sub2" x="40" y="326" data-r1="">2,048 tokens of context: each request's cache adds 268 MB to every step's read</text><text class="sub2" x="40" y="346" data-r2="">at batch 64: 33.0 operations per byte; caches outweigh the weights from batch 60</text><text class="sub2" x="40" y="366" data-r3="">limit as the batch grows: weights ÷ one cache + 4 = 63.8, below the ridge's 295</text><text class="cap" x="40" y="404" text-anchor="start">Each request adds its weight work, 2 × 8.03 billion operations, plus attention's 4 per</text><text class="cap" x="40" y="424" text-anchor="start">cached byte. It also adds its whole cache to the bytes read: 268 MB at 2,048 tokens. The</text><text class="cap" x="40" y="444" text-anchor="start">weights' 16.06 GB are shared; the caches are not.</text><text class="cap" x="40" y="484" text-anchor="start">So intensity = N × (16.06 G + 4 × 268 MB) ÷ (16.06 GB + N × 268 MB). While the weights</text><text class="cap" x="40" y="504" text-anchor="start">dominate the bytes it climbs like N; once the caches do, it levels off at 16.06 GB ÷</text><text class="cap" x="40" y="524" text-anchor="start">268 MB + 4 = 63.8, far below the ridge.</text><text class="cap" x="40" y="564" text-anchor="start">Longer contexts lower the ceiling, to 19.0 at 8,192 tokens; only very short ones, around</text><text class="cap" x="40" y="584" text-anchor="start">256 tokens, ever reach the ridge. The widget's arithmetic was checked against Python at</text><text class="cap" x="40" y="604" text-anchor="start">every setting.</text></svg></div><figcaption>Batching's free lunch has a hidden bill. Past a few dozen requests the chip spends its time reading caches, not weights, and at ordinary context lengths no batch reaches the ridge.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const CTX = [256, 512, 1024, 2048, 4096, 8192, 16384, 32768], NPTS = [1.0, 1.1892, 1.4142, 1.6818, 2.0, 2.3784, 2.8284, 3.3636, 4.0, 4.7568, 5.6569, 6.7272, 8.0, 9.5137, 11.3137, 13.4543, 16.0, 19.0273, 22.6274, 26.9087, 32.0, 38.0546, 45.2548, 53.8174, 64.0, 76.1093, 90.5097, 107.6347, 128.0, 152.2185, 181.0193, 215.2695, 256.0, 304.437, 362.0387, 430.539, 512.0, 608.874, 724.0773, 861.0779, 1024.0], D = 3, A = {"X0": 110, "X1": 620, "Y0": 262, "Y1": 70, "xlo": 1, "xhi": 1024, "ylo": 1, "yhi": 1000};
  const W8 = 16056328192, KV8 = 131072, RIDGE = 295.2238805970149;
  const lg = Math.log10;
  const px = v => A.X0 + (lg(v) - lg(A.xlo)) / (lg(A.xhi) - lg(A.xlo)) * (A.X1 - A.X0);
  const py = v => A.Y0 - (lg(v) - lg(A.ylo)) / (lg(A.yhi) - lg(A.ylo)) * (A.Y0 - A.Y1);
  
  const fx = (v, d = 2) => { const s = Math.abs(v).toFixed(d); return (v < 0 && +s !== 0 ? '−' : '') + s; };
  const fcx = (v, d = 0) => { const s = fx(v, d), n = s.startsWith('−'), t = n ? s.slice(1) : s;
    const [w, fr] = t.split('.'); return (n ? '−' : '') + (+w).toLocaleString('en-US') + (fr ? '.' + fr : ''); };

  const fsize = c => c >= 1e9 ? fx(c / 1e9, 2) + ' GB' : (c >= 1e8 ? fx(c / 1e6, 0) + ' MB' : fx(c / 1e6, 1) + ' MB');
  const inten = (n, c) => n * (W8 + 4 * c) / (W8 + n * c);
  const sl = fig.querySelector('input[type=range]'), val = fig.querySelector('.val'), q = s => fig.querySelector(s);
  function draw() {
    const ctx = CTX[+sl.value], c = KV8 * ctx, lim = W8 / c + 4, cross = Math.floor(W8 / c) + 1;
    const den = W8 + 4 * c - RIDGE * c, nr = den <= 0 ? null : Math.ceil(RIDGE * W8 / den);
    val.textContent = fcx(ctx);
    q('[data-curve]').setAttribute('points', NPTS.map(n => px(n).toFixed(1) + ',' + py(inten(n, c)).toFixed(1)).join(' '));
    const yl = py(lim).toFixed(1);
    const L = q('[data-limline]'); L.setAttribute('y1', yl); L.setAttribute('y2', yl);
    const t = q('[data-lim]'); t.setAttribute('y', (py(lim) - 6).toFixed(1)); t.textContent = 'limit ' + fx(lim, 1);
    q('[data-r1]').textContent = `${fcx(ctx)} tokens of context: each request's cache adds ${fsize(c)} to every step's read`;
    q('[data-r2]').textContent = `at batch 64: ${fx(inten(64, c), 1)} operations per byte; caches outweigh the weights from batch ${fcx(cross)}`;
    q('[data-r3]').textContent = `limit as the batch grows: weights ÷ one cache + 4 = ${fx(lim, 1)}` + (nr ? `, past the ridge from batch ${fcx(nr)}` : `, below the ridge's 295`);
  }
  sl.addEventListener('input', draw);
  q('button').addEventListener('click', () => { sl.value = D; draw(); });
  draw();
})();</script></figure>
