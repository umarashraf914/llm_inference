<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 10:11</div><h3>One prompt brings 62 times the work of the whole decode batch</h3><svg viewBox='0 0 680 348' role='img'><title>One prompt brings 62 times the work of the whole decode batch</title><text class="hd" x="40" y="46">Tokens of work in one iteration, drawn to scale</text><text class="cap" x="40" y="88" text-anchor="start">an ordinary step</text><g class="m"><rect x="200" y="70" width="6.771653543307087" height="28" rx="2"/></g><text class="sub2" x="216.8" y="89" text-anchor="start">32 tokens: one for each running request</text><text class="cap" x="40" y="136" text-anchor="start">the step a prompt joins</text><g class="m"><rect x="200" y="118" width="6.771653543307087" height="28" rx="2"/></g><g class="h"><rect x="206.77" y="118" width="423.23" height="28" rx="2"/><text class="sub" x="418.385" y="132.0" text-anchor="middle" dominant-baseline="central">a new request's 2,000-token prompt</text></g><text class="cap" x="40" y="196" text-anchor="start">A decode step advances each running request by a single token: 32 running requests,</text><text class="cap" x="40" y="216" text-anchor="start">32 tokens of work. A request that has just been admitted must first process its whole</text><text class="cap" x="40" y="236" text-anchor="start">prompt, and prompts run to thousands of tokens ({{fig:v01-o109}}).</text><text class="cap" x="40" y="276" text-anchor="start">Both are one iteration to the scheduler. So the moment a new request joins, that</text><text class="cap" x="40" y="296" text-anchor="start">iteration stops being a step and becomes a bulk job, with everyone else's next token</text><text class="cap" x="40" y="316" text-anchor="start">sitting behind it.</text></svg><figcaption>Drawn to scale in tokens: the running requests are the sliver on the left. The next figure turns tokens into milliseconds.</figcaption></figure>
