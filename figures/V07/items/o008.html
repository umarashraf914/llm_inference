<figure><div class='ts'>Fig 08 &nbsp;&middot;&nbsp; 9:56</div><h3>The problem admitting new work creates</h3><svg viewBox="0 0 680 336" role="img"><title>The problem admitting new work creates</title><text class="hd" x="40" y="46">Both of these are one iteration</text><g class="s"><rect x="40" y="70" width="90" height="40" rx="4"></rect><text class="sub" x="85.0" y="90.0" text-anchor="middle" dominant-baseline="central">a decode</text></g><text class="sub2" x="146" y="92" text-anchor="start">advances a request by a single token</text><g class="h"><rect x="40" y="130" width="420" height="40" rx="4"></rect><text class="sub" x="250.0" y="150.0" text-anchor="middle" dominant-baseline="central">a new request's prefill</text></g><text class="sub2" x="476" y="152" text-anchor="start">thousands of tokens</text><text class="cap" x="40" y="214" text-anchor="start">The moment a new request joins, that iteration stops being a step and becomes a bulk job with</text><text class="cap" x="40" y="234" text-anchor="start">everyone else's next token sitting behind it.</text><text class="cap" x="40" y="274" text-anchor="start">Against a decode-only batch, mixing them naively stretched the time between tokens by as much</text><text class="cap" x="40" y="294" text-anchor="start">as 28 times, and produced generation stalls lasting several seconds, where users mid-answer</text><text class="cap" x="40" y="314" text-anchor="start">simply stop receiving text while a stranger's prompt is processed.</text></svg><figcaption>A latency failure visible directly to the user, caused by the very mechanism that keeps the batch full.</figcaption></figure>
