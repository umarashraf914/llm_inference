ct x="158" y="84" width="60" height="26" rx="3"/><text class="sub" x="188.0" y="97.0" text-anchor="middle" dominant-baseline="central">helpful</text></g><g class="u"><rect x="230" y="84" width="26" height="26" rx="3"/><text class="sub" x="243.0" y="97.0" text-anchor="middle" dominant-baseline="central">.</text></g><g class="u"><rect x="268" y="84" width="42" height="26" rx="3"/><text class="sub" x="289.0" y="97.0" text-anchor="middle" dominant-baseline="central">What</text></g><g class="u"><rect x="322" y="84" width="30" height="26" rx="3"/><text class="sub" x="337.0" y="97.0" text-anchor="middle" dominant-baseline="central">is</text></g><g class="u"><rect x="364" y="84" width="36" height="26" rx="3"/><text class="sub" x="382.0" y="97.0" text-anchor="middle" dominant-baseline="central">2+2</text></g><g class="u"><rect x="412" y="84" width="26" height="26" rx="3"/><text class="sub" x="425.0" y="97.0" text-anchor="middle" dominant-baseline="central">?</text></g><g class="u"><rect x="364" y="118" width="36" height="26" rx="3"/><text class="sub" x="382.0" y="131.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="u"><rect x="412" y="118" width="60" height="26" rx="3"/><text class="sub" x="442.0" y="131.0" text-anchor="middle" dominant-baseline="central">capital</text></g><g class="u"><rect x="484" y="118" width="30" height="26" rx="3"/><text class="sub" x="499.0" y="131.0" text-anchor="middle" dominant-baseline="central">of</text></g><g class="u"><rect x="526" y="118" width="54" height="26" rx="3"/><text class="sub" x="553.0" y="131.0" text-anchor="middle" dominant-baseline="central">France</text></g><g class="u"><rect x="592" y="118" width="26" height="26" rx="3"/><text class="sub" x="605.0" y="131.0" text-anchor="middle" dominant-baseline="central">?</text></g><g class="u"><rect x="268" y="152" width="72" height="26" rx="3"/><text class="sub" x="304.0" y="165.0" text-anchor="middle" dominant-baseline="central">Translate</text></g><g class="u"><rect x="352" y="152" width="36" height="26" rx="3"/><text class="sub" x="370.0" y="165.0" text-anchor="middle" dominant-baseline="central">cat</text></g><rect x="58" y="80" width="202" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="264" y="80" width="92" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="360" y="80" width="82" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="360" y="114" width="262" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="264" y="148" width="128" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="40" y="218" text-anchor="start">radix tree</text><g class="u"><rect x="40" y="238.0" width="10" height="10" rx="5"/></g><line class="conn" x1="50" y1="243.0" x2="56.0" y2="243.0"/><line class="conn" x1="56.0" y1="243.0" x2="62" y2="243.0"/><line class="conn" x1="182" y1="243.0" x2="196" y2="243.0"/><line class="conn" x1="256" y1="243.0" x2="270" y2="243.0"/><line class="conn" x1="256" y1="243.0" x2="263.0" y2="243.0"/><line class="conn" x1="263.0" y1="243.0" x2="263.0" y2="281.0"/><line class="conn" x1="263.0" y1="281.0" x2="270" y2="281.0"/><line class="conn" x1="182" y1="243.0" x2="189.0" y2="243.0"/><line class="conn" x1="189.0" y1="243.0" x2="189.0" y2="319.0"/><line class="conn" x1="189.0" y1="319.0" x2="196" y2="319.0"/><g class="s"><rect x="62" y="230" width="120" height="26" rx="3"/><text class="sub" x="122.0" y="243.0" text-anchor="middle" dominant-baseline="central">You are helpful .</text></g><g class="s"><rect x="196" y="230" width="60" height="26" rx="3"/><text class="sub" x="226.0" y="243.0" text-anchor="middle" dominant-baseline="central">What is</text></g><g class="s"><rect x="270" y="230" width="48" height="26" rx="3"/><text class="sub" x="294.0" y="243.0" text-anchor="middle" dominant-baseline="central">2+2 ?</text></g><g class="s"><rect x="270" y="268" width="156" height="26" rx="3"/><text class="sub" x="348.0" y="281.0" text-anchor="middle" dominant-baseline="central">the capital of France ?</text></g><g class="s"><rect x="196" y="306" width="96" height="26" rx="3"/><text class="sub" x="244.0" y="319.0" text-anchor="middle" dominant-baseline="central">Translate cat</text></g><text class="cap" x="40" y="354" text-anchor="start">A chain is a run of nodes that each have exactly one child. Nothing can branch inside</text><text class="cap" x="40" y="374" text-anchor="start">it, so it can be stored as one node holding the whole run. The 15 nodes fall into 5</text><text class="cap" x="40" y="394" text-anchor="start">chains.</text><text class="cap" x="40" y="434" text-anchor="start">A radix tree is a prefix tree built that way: its edges carry whole sequences of tokens</text><text class="cap" x="40" y="454" text-anchor="start">rather than one token each. The tokens, and their keys and values, are the same 15 as</text><text class="cap" x="40" y="474" text-anchor="start">before. What shrinks is the structure to store and walk, from 15 nodes to 5.</text><text class="cap" x="40" y="514" text-anchor="start">The saving grows with length. A 2,000-token system prompt is one node rather than a</text><text class="cap" x="40" y="534" text-anchor="start">chain of 2,000, and a lookup passes through it in one step.</text></svg><figcaption>Same contents, a fraction of the bookkeeping. This compact form is the tree SGLang's RadixAttention keeps.</figcaption></figure>
