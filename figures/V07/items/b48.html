chor="start">not: it stays near 100% while the GPU has slack, then falls away as a queue builds,</text><text class="cap" x="40" y="502" text-anchor="start">because every late request delays the ones behind it.</text><text class="cap" x="40" y="542" text-anchor="start">Per-GPU goodput is the highest rate at which 90% still make the target: 2.4 requests a</text><text class="cap" x="40" y="562" text-anchor="start">second here, with the GPU busy 62% of the time. At 3.9 a second it is busy 99% of the</text><text class="cap" x="40" y="582" text-anchor="start">time and only 10% are on time. This toy checks only the first-token target; a real</text><text class="cap" x="40" y="602" text-anchor="start">measurement checks both.</text><text class="cap" x="40" y="642" text-anchor="start">Counted per GPU, goodput becomes cost per query. The 96-GPU run's 20 cents per million</text><text class="cap" x="40" y="662" text-anchor="start">tokens, at 2,787.5 output tokens a second per GPU, implies $2.01 per GPU-hour. At 2.4</text><text class="cap" x="40" y="682" text-anchor="start">queries a second, 8,640 an hour, each costs $0.00023. Priced on raw throughput at 3.9 a</text><text class="cap" x="40" y="702" text-anchor="start">second it would look like $0.00014, for queries nine in ten of which arrived late. The</text><text class="cap" x="40" y="722" text-anchor="start">arithmetic was checked in Python.</text></svg></div><figcaption>A toy queue, exact for its assumptions. Utilisation climbs in a straight line while the share on time falls off a cliff: the GPU is busiest exactly when it is least useful.</figcaption><script>(() => {
