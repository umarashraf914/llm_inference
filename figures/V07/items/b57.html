<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 23:42</div><h3>A thin tail adds up</h3><svg viewBox='0 0 680 474' role='img'><title>A thin tail adds up</title><text class="hd" x="40" y="46">One step's probability: a few likely tokens, and a thousand unlikely ones</text><g class="m"><rect x="40" y="66" width="540.0" height="30" rx="3"/><text class="sub" x="310.0" y="81.0" text-anchor="middle" dominant-baseline="central">the top few tokens: 90%</text></g><g class="h"><rect x="580.0" y="66" width="60.0" height="30" rx="3"/></g><text class="sub2" x="640.0" y="114" text-anchor="end">1,000 tokens × 0.01% = 10%</text><g class="u"><rect x="40" y="140" width="172" height="34" rx="6"/><text class="sub" x="126.0" y="157.0" text-anchor="middle" dominant-baseline="central">no tail token, one step: 0.90</text></g><g class="u"><rect x="226" y="140" width="196" height="34" rx="6"/><text class="sub" x="324.0" y="157.0" text-anchor="middle" dominant-baseline="central">none in 100 steps: 0.90^100</text></g><g class="u"><rect x="436" y="140" width="204" height="34" rx="6"/><text class="sub" x="538.0" y="157.0" text-anchor="middle" dominant-baseline="central">= 0.0000266</text></g><g class="h"><rect x="40" y="188" width="290" height="34" rx="6"/><text class="sub" x="185.0" y="205.0" text-anchor="middle" dominant-baseline="central">at least one in 100: 99.997%</text></g><g class="h"><rect x="346" y="188" width="294" height="34" rx="6"/><text class="sub" x="493.0" y="205.0" text-anchor="middle" dominant-baseline="central">tail tokens drawn, on average: 10</text></g><text class="cap" x="40" y="262" text-anchor="start">Suppose a few top tokens hold 90% of the probability at every step and a thousand others</text><text class="cap" x="40" y="282" text-anchor="start">share the remaining 10%, 0.01% each. No single tail token is likely, but the tail as a</text><text class="cap" x="40" y="302" text-anchor="start">whole is drawn one step in ten.</text><text class="cap" x="40" y="342" text-anchor="start">Over a 100-token answer the chance of never touching the tail is 0.9 multiplied by</text><text class="cap" x="40" y="362" text-anchor="start">itself 100 times, 0.0000266, so at least one tail token appears in 99.997% of answers,</text><text class="cap" x="40" y="382" text-anchor="start">and about 10 on average. Even a 1% tail is hit at least once in 63% of answers. One</text><text class="cap" x="40" y="402" text-anchor="start">incoherent token can send the text somewhere odd, and everything after builds on it.</text><text class="cap" x="40" y="442" text-anchor="start">So the sampler does two things: it reshapes the distribution, and it cuts off the tail.</text></svg><figcaption>Masses illustrative, bar to scale. The danger is not any one unlikely token but how many there are: thousands of tiny shares add up, which is why the tail is cut rather than trusted.</figcaption></figure>
