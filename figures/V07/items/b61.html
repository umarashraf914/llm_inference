<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 24:36</div><h3>Top-p keeps two tokens when the model is sure, five when it is not</h3><svg viewBox='0 0 680 588' role='img'><title>Top-p keeps two tokens when the model is sure, five when it is not</title><text class="hd" x="40" y="46">Top-p with P = 0.9: add shares from the top until the total reaches 90%</text><text class="sub2" x="40" y="74" text-anchor="start">confident list</text><text class="sub2" x="470" y="74" text-anchor="start">running total</text><text class="cap" x="40" y="99" text-anchor="start">cat</text><g class="s"><rect x="120.0" y="84" width="223.48431333318732" height="20" rx="3"/></g><text class="sub2" x="470" y="99" text-anchor="start">74.5%  kept</text><text class="cap" x="40" y="125" text-anchor="start">dog</text><g class="u"><rect x="120" y="110" width="223.48431333318732" height="20" rx="3"/></g><g class="s"><rect x="343.4843133331873" y="110" width="74.39146556873926" height="20" rx="3"/></g><text class="sub2" x="470" y="125" text-anchor="start">99.3%  kept</text><text class="cap" x="40" y="151" text-anchor="start">the</text><g class="u"><rect x="120" y="136" width="297.8757789019266" height="20" rx="3"/></g><rect x="417.8757789019266" y="136" width="3" height="20" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="470" y="151" text-anchor="start">100.0%</text><text class="cap" x="40" y="177" text-anchor="start">banana</text><g class="u"><rect x="120" y="162" width="299.9084306595741" height="20" rx="3"/></g><rect x="419.9084306595741" y="162" width="3" height="20" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="470" y="177" text-anchor="start">100.0%</text><line class="mark xok" x1="390.0" y1="80" x2="390.0" y2="184"/><text class="sub2" x="40" y="218" text-anchor="start">unsure list</text><text class="sub2" x="470" y="218" text-anchor="start">running total</text><text class="cap" x="40" y="243" text-anchor="start">red</text><g class="s"><rect x="120.0" y="228" width="71.69326456250005" height="20" rx="3"/></g><text class="sub2" x="470" y="243" text-anchor="start">23.9%  kept</text><text class="cap" x="40" y="269" text-anchor="start">blue</text><g class="u"><rect x="120" y="254" width="71.69326456250005" height="20" rx="3"/></g><g class="s"><rect x="191.69326456250005" y="254" width="64.87074839730151" height="20" rx="3"/></g><text class="sub2" x="470" y="269" text-anchor="start">45.5%  kept</text><text class="cap" x="40" y="295" text-anchor="start">green</text><g class="u"><rect x="120" y="280" width="136.56401295980154" height="20" rx="3"/></g><g class="s"><rect x="256.5640129598015" y="280" width="58.69748048587465" height="20" rx="3"/></g><text class="sub2" x="470" y="295" text-anchor="start">65.1%  kept</text><text class="cap" x="40" y="321" text-anchor="start">gold</text><g class="u"><rect x="120" y="306" width="195.2614934456762" height="20" rx="3"/></g><g class="s"><rect x="315.2614934456762" y="306" width="53.11167668805495" height="20" rx="3"/></g><text class="sub2" x="470" y="321" text-anchor="start">82.8%  kept</text><text class="cap" x="40" y="347" text-anchor="start">grey</text><g class="u"><rect x="120" y="332" width="248.37317013373115" height="20" rx="3"/></g><g class="s"><rect x="368.37317013373115" y="332" width="48.05743240198031" height="20" rx="3"/></g><text class="sub2" x="470" y="347" text-anchor="start">98.8%  kept</text><text class="cap" x="40" y="373" text-anchor="start">the</text><g class="u"><rect x="120" y="358" width="296.43060253571144" height="20" rx="3"/></g><rect x="416.43060253571144" y="358" width="3.5693974642885475" height="20" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="470" y="373" text-anchor="start">100.0%</text><line class="mark xok" x1="390.0" y1="224" x2="390.0" y2="380"/><text class="cap" x="40" y="416" text-anchor="start">Top-p, also called nucleus sampling, sorts the tokens, adds up their probabilities from</text><text class="cap" x="40" y="436" text-anchor="start">the top, and keeps the fewest whose total reaches at least P. Each bar starts where the</text><text class="cap" x="40" y="456" text-anchor="start">one above ended, so its right end is the running total; the dashed line is 90%.</text><text class="cap" x="40" y="496" text-anchor="start">On the confident list cat alone reaches 74.5% and cat with dog 99.3%, so two tokens are</text><text class="cap" x="40" y="516" text-anchor="start">kept. On the unsure list the total passes 90% only at the fifth, 98.8%, so five are kept</text><text class="cap" x="40" y="536" text-anchor="start">and only the stray the is dropped. Because it reads the shape of the distribution, the</text><text class="cap" x="40" y="556" text-anchor="start">set is tiny when the model is confident and widens when it is unsure.</text></svg><figcaption>Bars to scale. The same P gives a short list or a long one, depending on what the model is telling it.</figcaption></figure>
