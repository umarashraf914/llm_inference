h="48" height="26" rx="3"/><text class="sub" x="294.0" y="165.0" text-anchor="middle" dominant-baseline="central">3+3 ?</text></g><g class="u"><rect x="196" y="188" width="96" height="26" rx="3"/><text class="sub" x="244.0" y="201.0" text-anchor="middle" dominant-baseline="central">Translate cat</text></g><text class="hd" x="40" y="264">You are kind .</text><text class="sub2" x="40" y="282" text-anchor="start">hits 2 tokens inside an edge: the edge splits there</text><g class="u"><rect x="40" y="306.0" width="10" height="10" rx="5"/></g><line class="conn" x1="50" y1="311.0" x2="56.0" y2="311.0"/><line class="conn" x1="56.0" y1="311.0" x2="62" y2="311.0"/><line class="conn" x1="122" y1="311.0" x2="136" y2="311.0"/><line class="conn" x1="208" y1="311.0" x2="222" y2="311.0"/><line class="conn" x1="282" y1="311.0" x2="296" y2="311.0"/><line class="conn" x1="282" y1="311.0" x2="289.0" y2="311.0"/><line class="conn" x1="289.0" y1="311.0" x2="289.0" y2="347.0"/><line class="conn" x1="289.0" y1="347.0" x2="296" y2="347.0"/><line class="conn" x1="208" y1="311.0" x2="215.0" y2="311.0"/><line class="conn" x1="215.0" y1="311.0" x2="215.0" y2="383.0"/><line class="conn" x1="215.0" y1="383.0" x2="222" y2="383.0"/><line class="conn" x1="122" y1="311.0" x2="129.0" y2="311.0"/><line class="conn" x1="129.0" y1="311.0" x2="129.0" y2="419.0"/><line class="conn" x1="129.0" y1="419.0" x2="136" y2="419.0"/><g class="s"><rect x="62" y="298" width="60" height="26" rx="3"/><text class="sub" x="92.0" y="311.0" text-anchor="middle" dominant-baseline="central">You are</text></g><g class="u"><rect x="136" y="298" width="72" height="26" rx="3"/><text class="sub" x="172.0" y="311.0" text-anchor="middle" dominant-baseline="central">helpful .</text></g><g class="u"><rect x="222" y="298" width="60" height="26" rx="3"/><text class="sub" x="252.0" y="311.0" text-anchor="middle" dominant-baseline="central">What is</text></g><g class="u"><rect x="296" y="298" width="48" height="26" rx="3"/><text class="sub" x="320.0" y="311.0" text-anchor="middle" dominant-baseline="central">2+2 ?</text></g><g class="u"><rect x="296" y="334" width="156" height="26" rx="3"/><text class="sub" x="374.0" y="347.0" text-anchor="middle" dominant-baseline="central">the capital of France ?</text></g><g class="u"><rect x="222" y="370" width="96" height="26" rx="3"/><text class="sub" x="270.0" y="383.0" text-anchor="middle" dominant-baseline="central">Translate cat</text></g><g class="m"><rect x="136" y="406" width="54" height="26" rx="3"/><text class="sub" x="163.0" y="419.0" text-anchor="middle" dominant-baseline="central">kind .</text></g><g class="s"><rect x="40" y="456" width="14" height="12" rx="3"/></g><text class="sub2" x="60" y="466" text-anchor="start">walked: a hit</text><g class="m"><rect x="170" y="456" width="14" height="12" rx="3"/></g><text class="sub2" x="190" y="466" text-anchor="start">added: must be prefilled</text><text class="cap" x="40" y="502" text-anchor="start">A lookup starts at the root and compares the prompt with an edge, token by token. If the</text><text class="cap" x="40" y="522" text-anchor="start">whole edge matches it moves on, to the child whose first token is the prompt's next one.</text><text class="cap" x="40" y="542" text-anchor="start">Wherever it stops, everything before that point is a hit and everything after must be</text><text class="cap" x="40" y="562" text-anchor="start">prefilled.</text><text class="cap" x="40" y="602" text-anchor="start">The first prompt matches You are helpful . and What is, then finds no child starting</text><text class="cap" x="40" y="622" text-anchor="start">with 3+3: a hit of 6 tokens, and the 2 left over become a new leaf. The second disagrees</text><text class="cap" x="40" y="642" text-anchor="start">inside the first edge, at kind against helpful: a hit of 2. That edge is split in two at</text><text class="cap" x="40" y="662" text-anchor="start">the point of difference, so the tree still branches only where prompts first differ.</text></svg><figcaption>Lookup and insertion are the same walk. The tree's shape always records exactly where any two cached prompts part company.</figcaption></figure>
