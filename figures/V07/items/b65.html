ext><g class="h"><rect x="338" y="324" width="44" height="24" rx="12"/><text class="sub" x="360.0" y="336.0" text-anchor="middle" dominant-baseline="central">✗</text></g><g class="h"><rect x="560" y="324" width="80" height="24" rx="3"/><text class="sub" x="600.0" y="336.0" text-anchor="middle" dominant-baseline="central">masked</text></g><text class="cap" x="40" y="388" text-anchor="start">The mask is applied to tokens, and a token is often several characters ({{fig:v01-o006}}). To</text><text class="cap" x="40" y="408" text-anchor="start">decide whether a token is allowed, the machine is fed its characters one at a time from</text><text class="cap" x="40" y="428" text-anchor="start">the current state; the token is allowed only if none of them reaches reject.</text><text class="cap" x="40" y="468" text-anchor="start">After 20 the machine is in state 2. The token 25 passes through 3 to 4, and 25- reaches</text><text class="cap" x="40" y="488" text-anchor="start">5. 250 puts a third digit where the dash must go and is refused, and 2025 fails the same</text><text class="cap" x="40" y="508" text-anchor="start">way. A real vocabulary has 128,256 tokens to test like this at every step, which is the</text><text class="cap" x="40" y="528" text-anchor="start">cost taken up below.</text></svg><figcaption>Token strings illustrative. Checking a token means running the machine over every character in it, which is why the work grows with the size of the vocabulary.</figcaption></figure>
