<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 10:57</div><h3>Sarathi-Serve gives every iteration the same token budget</h3><svg viewBox='0 0 680 426' role='img'><title>Sarathi-Serve gives every iteration the same token budget</title><text class="hd" x="40" y="46">One iteration under a 512-token budget, drawn to scale in tokens</text><g class="m"><rect x="40" y="70" width="37.5" height="34" rx="2"/><text class="sub" x="58.75" y="87.0" text-anchor="middle" dominant-baseline="central">32</text></g><g class="h"><rect x="77.5" y="70" width="562.5" height="34" rx="2"/><text class="sub" x="358.75" y="87.0" text-anchor="middle" dominant-baseline="central">480 tokens of a waiting prompt</text></g><text class="sub2" x="40" y="128" text-anchor="start">1. the 32 running decodes go in first, one token each</text><text class="sub2" x="40" y="146" text-anchor="start">2. what is left of the budget, 512 − 32 = 480, is filled with a chunk of a waiting prompt</text><text class="cap" x="40" y="194" text-anchor="start">Sarathi, a 2023 paper from Microsoft Research India and Georgia Tech, splits a prompt's</text><text class="cap" x="40" y="214" text-anchor="start">prefill into near-equal chunks; its follow-up, Sarathi-Serve, builds a scheduler around</text><text class="cap" x="40" y="234" text-anchor="start">them. Each iteration gets a fixed token budget.</text><text class="cap" x="40" y="274" text-anchor="start">The running decodes are packed in first, one token each, and whatever is left of the</text><text class="cap" x="40" y="294" text-anchor="start">budget is filled with a chunk of a waiting prompt. With a 512-token budget, one of the</text><text class="cap" x="40" y="314" text-anchor="start">two Sarathi-Serve uses, and 32 running requests, the chunk is 480 tokens.</text><text class="cap" x="40" y="354" text-anchor="start">That bounds the cost of every iteration, whatever the waiting prompt's length, so</text><text class="cap" x="40" y="374" text-anchor="start">admitting new work no longer pauses generation already in flight: what the authors call</text><text class="cap" x="40" y="394" text-anchor="start">a stall-free schedule.</text></svg><figcaption>The decodes always fit, because they go in first; only the newcomer waits its turn, in pieces.</figcaption></figure>
