<figure><div class='ts'>Fig 09 &nbsp;&middot;&nbsp; 10:44</div><h3>Slicing the prompt</h3><svg viewBox="0 0 680 518" role="img"><title>Slicing the prompt</title><text class="hd" x="40" y="46">Each iteration gets a fixed token budget</text><g class="s"><rect x="50" y="70" width="16" height="36" rx="3"></rect></g><g class="s"><rect x="72" y="70" width="16" height="36" rx="3"></rect></g><g class="s"><rect x="94" y="70" width="16" height="36" rx="3"></rect></g><g class="s"><rect x="116" y="70" width="16" height="36" rx="3"></rect></g><g class="s"><rect x="138" y="70" width="16" height="36" rx="3"></rect></g><g class="s"><rect x="160" y="70" width="16" height="36" rx="3"></rect></g><text class="sub2" x="190" y="92" text-anchor="start">running decodes packed in first, one token each</text><g class="h"><rect x="50" y="118" width="380" height="36" rx="3"></rect><text class="sub" x="240.0" y="136.0" text-anchor="middle" dominant-baseline="central">then a chunk of a waiting prompt fills the rest</text></g><text class="cap" x="40" y="198" text-anchor="start">That bounds the cost of an iteration and makes it nearly independent of how long the incoming</text><text class="cap" x="40" y="218" text-anchor="start">prompt is. Admitting new work no longer pauses generation already in flight.</text><text class="hd" x="40" y="268">Chunk size is a real trade</text><g class="s"><rect x="40" y="288" width="285" height="78" rx="8"></rect><text class="lbl" x="182.5" y="310.0" text-anchor="middle" dominant-baseline="central">Small chunks</text><text class="sub" x="182.5" y="328.0" text-anchor="middle" dominant-baseline="central">short iterations, smooth stream,</text><text class="sub" x="182.5" y="345.0" text-anchor="middle" dominant-baseline="central">but the prompt takes longer</text></g><g class="h"><rect x="368" y="288" width="272" height="78" rx="8"></rect><text class="lbl" x="504.0" y="310.0" text-anchor="middle" dominant-baseline="central">Large chunks</text><text class="sub" x="504.0" y="328.0" text-anchor="middle" dominant-baseline="central">prompt finishes sooner,</text><text class="sub" x="504.0" y="345.0" text-anchor="middle" dominant-baseline="central">but the stream stutters</text></g><text class="cap" x="40" y="396" text-anchor="start">And every chunk rereads the KV cache the earlier ones wrote, so more chunks means more</text><text class="cap" x="40" y="416" text-anchor="start">repeated reads.</text><text class="cap" x="40" y="456" text-anchor="start">Under tail latency limits the reported gains were 2.6 times the capacity of the baseline on a</text><text class="cap" x="40" y="476" text-anchor="start">7-billion model, up to 3.7 times on a 34-billion, and up to 5.6 times on a 180-billion with</text><text class="cap" x="40" y="496" text-anchor="start">pipeline parallelism, helped by uniform iterations leaving fewer pipeline bubbles.</text></svg><figcaption>Called a stall-free schedule. It is now enabled by default in the most widely used engine.</figcaption></figure>
