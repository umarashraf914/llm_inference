<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 16:11</div><h3>Fifty requests behind one system prompt need 15 times less prefill</h3><svg viewBox='0 0 680 438' role='img'><title>Fifty requests behind one system prompt need 15 times less prefill</title><text class="hd" x="40" y="46">Tokens to prefill for 50 requests sharing a 2,000-token system prompt</text><text class="cap" x="40" y="88" text-anchor="start">without reuse</text><text class="sub2" x="40" y="104" text-anchor="start">105,000 tokens</text><g class="h"><rect x="200" y="72" width="409.5238095238095" height="30" rx="3"/><text class="sub" x="404.76190476190476" y="87.0" text-anchor="middle" dominant-baseline="central">50 copies of the system prompt</text></g><g class="m"><rect x="609.5238095238095" y="72" width="20.476190476190478" height="30" rx="3"/></g><text class="cap" x="40" y="140" text-anchor="start">with reuse</text><text class="sub2" x="40" y="156" text-anchor="start">7,000 tokens</text><g class="s"><rect x="200" y="124" width="8.190476190476192" height="30" rx="3"/></g><g class="m"><rect x="208.1904761904762" y="124" width="20.476190476190478" height="30" rx="3"/></g><text class="sub2" x="238.66666666666666" y="143" text-anchor="start">one copy, then 50 questions: 15 times less</text><g class="m"><rect x="200" y="176" width="14" height="12" rx="3"/></g><text class="sub2" x="220" y="186" text-anchor="start">the 50 questions, 100 tokens each, needed either way</text><text class="cap" x="40" y="226" text-anchor="start">Without reuse every request prefills its own copy of the system prompt:</text><text class="cap" x="40" y="246" text-anchor="start">50 × (2,000 + 100) = 105,000 tokens. With reuse the system prompt is prefilled once and</text><text class="cap" x="40" y="266" text-anchor="start">each request computes only its own 100: 2,000 + 50 × 100 = 7,000.</text><text class="cap" x="40" y="306" text-anchor="start">Each request finds 2,000 of its 2,100 tokens already cached, a 95% hit, and its first</text><text class="cap" x="40" y="326" text-anchor="start">token arrives that much sooner. On Llama 3 8B at the H100's peak arithmetic, a</text><text class="cap" x="40" y="346" text-anchor="start">2,100-token prefill takes at least 34 ms; a 100-token one, 1.6 ms.</text><text class="cap" x="40" y="386" text-anchor="start">Decode is untouched: every output token still reads all the weights, cached prefix or</text><text class="cap" x="40" y="406" text-anchor="start">not ({{fig:v01-o055}}).</text></svg><figcaption>Drawn to scale. The saving grows with the number of requests behind the prefix, and it lands entirely on the time to the first token.</figcaption></figure>
