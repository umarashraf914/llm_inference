<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 14:47</div><h3>Mooncake keeps the cache in a pool that outlives any one GPU</h3><svg viewBox='0 0 680 532' role='img'><title>Mooncake keeps the cache in a pool that outlives any one GPU</title><text class="hd" x="40" y="46">Mooncake: caches kept in a pool built from every node's spare memory</text><g class="u"><rect x="40" y="62" width="600" height="196" rx="14"/><text class="lbl" x="62" y="86">the cluster</text></g><g class="m"><rect x="62" y="100" width="172" height="104" rx="10"/><text class="lbl" x="78" y="122">prefill node</text></g><g class="u"><rect x="78" y="134" width="140" height="20" rx="3"/><text class="sub" x="148.0" y="144.0" text-anchor="middle" dominant-baseline="central">GPU memory</text></g><g class="s"><rect x="78" y="160" width="66" height="20" rx="3"/><text class="sub" x="111.0" y="170.0" text-anchor="middle" dominant-baseline="central">DRAM</text></g><g class="s"><rect x="152" y="160" width="66" height="20" rx="3"/><text class="sub" x="185.0" y="170.0" text-anchor="middle" dominant-baseline="central">SSD</text></g><g class="m"><rect x="254" y="100" width="172" height="104" rx="10"/><text class="lbl" x="270" y="122">prefill node</text></g><g class="u"><rect x="270" y="134" width="140" height="20" rx="3"/><text class="sub" x="340.0" y="144.0" text-anchor="middle" dominant-baseline="central">GPU memory</text></g><g class="s"><rect x="270" y="160" width="66" height="20" rx="3"/><text class="sub" x="303.0" y="170.0" text-anchor="middle" dominant-baseline="central">DRAM</text></g><g class="s"><rect x="344" y="160" width="66" height="20" rx="3"/><text class="sub" x="377.0" y="170.0" text-anchor="middle" dominant-baseline="central">SSD</text></g><g class="h"><rect x="446" y="100" width="172" height="104" rx="10"/><text class="lbl" x="462" y="122">decode node</text></g><g class="u"><rect x="462" y="134" width="140" height="20" rx="3"/><text class="sub" x="532.0" y="144.0" text-anchor="middle" dominant-baseline="central">GPU memory</text></g><g class="s"><rect x="462" y="160" width="66" height="20" rx="3"/><text class="sub" x="495.0" y="170.0" text-anchor="middle" dominant-baseline="central">DRAM</text></g><g class="s"><rect x="536" y="160" width="66" height="20" rx="3"/><text class="sub" x="569.0" y="170.0" text-anchor="middle" dominant-baseline="central">SSD</text></g><text class="sub2" x="62" y="238" text-anchor="start">green: the shared KV cache pool, any node's prefix available to every prefill</text><text class="cap" x="40" y="300" text-anchor="start">Mooncake, the serving platform behind Kimi (Moonshot AI and Tsinghua University, 2024),</text><text class="cap" x="40" y="320" text-anchor="start">built its whole architecture around the KV cache. Besides splitting prefill from decode,</text><text class="cap" x="40" y="340" text-anchor="start">it gathers the cluster's otherwise idle CPU memory (DRAM) and solid-state drives (SSD)</text><text class="cap" x="40" y="360" text-anchor="start">into one store of caches.</text><text class="cap" x="40" y="400" text-anchor="start">A prefix's cache, once computed, is kept there and fetched by whichever prefill node</text><text class="cap" x="40" y="420" text-anchor="start">takes the next request that shares it, and a finished prefill streams its cache to the</text><text class="cap" x="40" y="440" text-anchor="start">decode node layer by layer. The scheduler sends each request where most of its cache</text><text class="cap" x="40" y="460" text-anchor="start">already sits.</text><text class="cap" x="40" y="500" text-anchor="start">Under real workloads, its paper reports, this let Kimi handle 75% more requests.</text></svg><figcaption>Once the cache is the thing being moved, it can also be kept. A KV-centric design treats prefill's output as an asset to store and reuse, not a by-product.</figcaption></figure>
