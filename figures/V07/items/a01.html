g class="u"><rect x="264" y="306" width="13" height="13" rx="2"/></g><g class="u"><rect x="280" y="306" width="13" height="13" rx="2"/></g><text class="sub2" x="40" y="341" text-anchor="start">8 experts run for this token; 248 sit idle</text><text class="sub2" x="334" y="86" text-anchor="start">tokens in the step</text><text class="sub2" x="446" y="86" text-anchor="start">expert visits, × 8</text><text class="sub2" x="640" y="86" text-anchor="end">per expert, ÷ 256</text><text class="cap" x="334" y="121" text-anchor="start">1</text><text class="sub2" x="446" y="121" text-anchor="start">8</text><g class="u"><rect x="576" y="104" width="64" height="26" rx="3"/><text class="sub" x="608.0" y="117.0" text-anchor="middle" dominant-baseline="central">0.03</text></g><text class="cap" x="334" y="165" text-anchor="start">32</text><text class="sub2" x="446" y="165" text-anchor="start">256</text><g class="u"><rect x="576" y="148" width="64" height="26" rx="3"/><text class="sub" x="608.0" y="161.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="cap" x="334" y="209" text-anchor="start">64</text><text class="sub2" x="446" y="209" text-anchor="start">512</text><g class="u"><rect x="576" y="192" width="64" height="26" rx="3"/><text class="sub" x="608.0" y="205.0" text-anchor="middle" dominant-baseline="central">2</text></g><text class="cap" x="334" y="253" text-anchor="start">9,440</text><text class="sub2" x="446" y="253" text-anchor="start">75,520</text><g class="m"><rect x="576" y="236" width="64" height="26" rx="3"/><text class="sub" x="608.0" y="249.0" text-anchor="middle" dominant-baseline="central">295</text></g><text class="sub2" x="334" y="288" text-anchor="start">about 295 tokens per expert reach the ridge</text><text class="cap" x="40" y="383" text-anchor="start">In DeepSeek V3, each token's router picks 8 of the 256 experts in every mixture-of-</text><text class="cap" x="40" y="403" text-anchor="start">experts layer ({{fig:v06-o009}}), while all of them stay resident in memory. A step that</text><text class="cap" x="40" y="423" text-anchor="start">carries N tokens hands out 8N expert visits, so each expert sees N × 8 ÷ 256 = N ÷ 32</text><text class="cap" x="40" y="443" text-anchor="start">tokens on average.</text><text class="cap" x="40" y="483" text-anchor="start">Whenever an expert runs, its whole weight matrix is read from memory, whether one token</text><text class="cap" x="40" y="503" text-anchor="start">uses it or three hundred. Only at about 295 tokens per expert does the arithmetic keep</text><text class="cap" x="40" y="523" text-anchor="start">pace with that read: the ridge, {{fig:v07-a03}}.</text><text class="cap" x="40" y="563" text-anchor="start">In decode each request adds one token per step, so 295 tokens per expert means 9,440</text><text class="cap" x="40" y="583" text-anchor="start">requests generating at the same moment across the deployment. Creating that crowd is the</text><text class="cap" x="40" y="603" text-anchor="start">serving system's job.</text></svg><figcaption>Sparsity saves arithmetic only when a crowd shows up. With one request in flight, eight experts each read their full weights to serve a single token.</figcaption></figure>
