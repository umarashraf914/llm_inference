<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:58</div><h3>Decode at batch one sits 295 times left of the ridge</h3><svg viewBox='0 0 680 590' role='img'><title>Decode at batch one sits 295 times left of the ridge</title><text class="hd" x="40" y="46">attainable = min(989 TFLOP/s, 3.35 TB/s × intensity), on logarithmic axes</text><line class="axis" x1="110" y1="280" x2="620" y2="280"/><line class="axis" x1="110" y1="76" x2="110" y2="280"/><line class="tick" x1="110.0" y1="280" x2="110.0" y2="285"/><text class="sub2" x="110.0" y="299" text-anchor="middle">0.1</text><line class="tick" x1="212.0" y1="280" x2="212.0" y2="285"/><text class="sub2" x="212.0" y="299" text-anchor="middle">1</text><line class="tick" x1="314.0" y1="280" x2="314.0" y2="285"/><text class="sub2" x="314.0" y="299" text-anchor="middle">10</text><line class="tick" x1="416.0" y1="280" x2="416.0" y2="285"/><text class="sub2" x="416.0" y="299" text-anchor="middle">100</text><line class="tick" x1="518.0" y1="280" x2="518.0" y2="285"/><text class="sub2" x="518.0" y="299" text-anchor="middle">1,000</text><line class="tick" x1="620.0" y1="280" x2="620.0" y2="285"/><text class="sub2" x="620.0" y="299" text-anchor="middle">10,000</text><line class="tick" x1="105" y1="280.0" x2="110" y2="280.0"/><text class="sub2" x="101" y="284.0" text-anchor="end">1</text><line class="tick" x1="105" y1="212.0" x2="110" y2="212.0"/><text class="sub2" x="101" y="216.0" text-anchor="end">10</text><line class="tick" x1="105" y1="144.0" x2="110" y2="144.0"/><text class="sub2" x="101" y="148.0" text-anchor="end">100</text><line class="tick" x1="105" y1="76.0" x2="110" y2="76.0"/><text class="sub2" x="101" y="80.0" text-anchor="end">1,000</text><text class="sub2" x="365.0" y="318" text-anchor="middle">arithmetic intensity: operations per byte moved</text><text class="sub2" x="101" y="62" text-anchor="start">TFLOP/s attainable</text><polyline class="pl-h" points="158.4,280.0 464.0,76.3 620.0,76.3"/><line class="mark" x1="464.0" y1="84.3" x2="464.0" y2="280"/><text class="sub2 halo" x="472.0" y="102" text-anchor="start" style="paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round">ridge, 295</text><g class="h"><rect x="207.0" y="239.3" width="10" height="10" rx="5"/></g><text class="sub2 halo" x="202.0" y="232.3" text-anchor="start" style="paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round">decode, one request: 1 op per byte, 3.35</text><line class="conn" x1="212.0" y1="270.3" x2="464.0" y2="270.3" marker-end="url(#arw)"/><text class="sub2 halo" x="338.0" y="286.3" text-anchor="middle" style="paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round">a factor of 295</text><text class="cap" x="40" y="358" text-anchor="start">Arithmetic intensity is the useful work done per byte moved ({{fig:v01-o120}}). In</text><text class="cap" x="40" y="378" text-anchor="start">decode at batch one, each 2-byte weight that is read feeds one multiply-add, 2</text><text class="cap" x="40" y="398" text-anchor="start">operations, so the intensity is 1 ({{fig:v01-o116}}).</text><text class="cap" x="40" y="438" text-anchor="start">Memory delivers 3.35 trillion bytes a second, so at 1 operation per byte the chip</text><text class="cap" x="40" y="458" text-anchor="start">reaches 3.35 TFLOP/s of its 989: the same 0.34% as the previous figure, seen from the</text><text class="cap" x="40" y="478" text-anchor="start">other side. The ridge, where memory and arithmetic run out together, is at 989 ÷ 3.35 =</text><text class="cap" x="40" y="498" text-anchor="start">295 operations per byte ({{fig:v01-o126}}).</text><text class="cap" x="40" y="538" text-anchor="start">Moving the point to the right means getting more operations out of every byte read.</text><text class="cap" x="40" y="558" text-anchor="start">Nothing about the model can do that at batch one. Sharing the read can.</text></svg><figcaption>Each grid step is ten times the last. The decode point sits 2.5 decades left of the corner, and that distance is what batching has to cover.</figcaption></figure>
