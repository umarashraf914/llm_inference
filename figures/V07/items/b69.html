<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 27:16</div><h3>The mask is built while the GPU is still working</h3><svg viewBox='0 0 680 412' role='img'><title>The mask is built while the GPU is still working</title><text class="hd" x="40" y="46">One decode step of Llama 3 8B, to scale</text><text class="cap" x="40" y="84" text-anchor="start">GPU</text><g class="m"><rect x="110" y="66" width="500.0" height="28" rx="3"/><text class="sub" x="360.0" y="80.0" text-anchor="middle" dominant-baseline="central">forward pass: weights read, 4.79 ms</text></g><text class="cap" x="40" y="130" text-anchor="start">CPU</text><g class="s"><rect x="545.8281444582815" y="112" width="4.171855541718556" height="28" rx="3"/></g><text class="sub2" x="537.8281444582815" y="130" text-anchor="end">the mask, under 40 µs</text><line class="tick" x1="610.0" y1="60" x2="610.0" y2="146"/><text class="sub2" x="610.0" y="162" text-anchor="end">logits ready: apply the mask, sample</text><text class="cap" x="40" y="200" text-anchor="start">XGrammar splits the vocabulary. For most tokens, whether they are allowed depends only</text><text class="cap" x="40" y="220" text-anchor="start">on the current position in the grammar, not on what lies deeper in the stack, so they</text><text class="cap" x="40" y="240" text-anchor="start">are checked ahead of time. For Llama 3.1 under a JSON grammar its authors found only</text><text class="cap" x="40" y="260" text-anchor="start">1,134 of about 128,000 tokens, under 1%, that need the live stack.</text><text class="cap" x="40" y="300" text-anchor="start">Those few are checked on the CPU while the GPU is still running the forward pass, so the</text><text class="cap" x="40" y="320" text-anchor="start">mask is ready when the logits are; the two run at once ({{fig:v03-o072}}). Their</text><text class="cap" x="40" y="340" text-anchor="start">measured masks took under 40 microseconds per token. A Llama 3 8B decode step reads</text><text class="cap" x="40" y="360" text-anchor="start">16.06 GB of weights, 4.79 ms at 3.35 TB/s, so 40 µs is 0.83% of it; for a 70B model,</text><text class="cap" x="40" y="380" text-anchor="start">0.10%.</text></svg><figcaption>Lanes to scale, the mask's 40 µs a sliver. It costs nothing in time, because it runs while the GPU is busy anyway.</figcaption></figure>
