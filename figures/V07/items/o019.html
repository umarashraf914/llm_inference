<figure><div class='ts'>Fig 19 &nbsp;&middot;&nbsp; 22:37</div><h3>What logits are</h3><svg viewBox="0 0 680 459" role="img"><title>What logits are</title><text class="hd" x="40" y="46">The model's last step: a score for every possible token</text><text class="cap" x="40" y="92" text-anchor="start">cat</text><g class="m"><rect x="210" y="74" width="320" height="30" rx="3"></rect></g><text class="cap" x="40" y="132" text-anchor="start">dog</text><g class="m"><rect x="210" y="114" width="180" height="30" rx="3"></rect></g><text class="cap" x="40" y="172" text-anchor="start">the</text><g class="u"><rect x="210" y="154" width="70" height="30" rx="3"></rect></g><text class="cap" x="40" y="212" text-anchor="start">banana</text><g class="u"><rect x="210" y="194" width="8" height="30" rx="3"></rect></g><text class="cap" x="40" y="252" text-anchor="start">... 127,996 more</text><g class="u"><rect x="210" y="234" width="4" height="30" rx="3"></rect></g><text class="cap" x="40" y="305" text-anchor="start">These raw scores are called logits. Softmax turns them into probabilities that add up to one,</text><text class="cap" x="40" y="325" text-anchor="start">and then exactly one token is picked.</text><text class="cap" x="40" y="361" text-anchor="start">Picking the highest every time sounds right and produces bland, repetitive text. Picking at</text><text class="cap" x="40" y="381" text-anchor="start">random from the full list produces nonsense. The sampler is everything in between.</text><text class="cap" x="40" y="417" text-anchor="start">Nothing here changes a single weight. The model has already spoken; this only decides how to</text><text class="cap" x="40" y="437" text-anchor="start">read what it said.</text></svg><figcaption>The last few microseconds of a forward pass, and where every user-facing quality knob lives.</figcaption></figure>
