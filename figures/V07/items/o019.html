<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 22:37</div><h3>Every forward pass ends in one score per token, and softmax makes them shares</h3><svg viewBox='0 0 680 474' role='img'><title>Every forward pass ends in one score per token, and softmax makes them shares</title><text class="hd" x="40" y="46">Each token's score, e to that score, and its share of the total</text><text class="sub2" x="150" y="72" text-anchor="start">score</text><text class="sub2" x="240" y="72" text-anchor="start">e to the score</text><text class="sub2" x="330" y="72" text-anchor="start">share</text><text class="cap" x="40" y="98" text-anchor="start">cat</text><text class="sub2" x="150" y="98" text-anchor="start">8.2</text><text class="sub2" x="240" y="98" text-anchor="start">3,641</text><g class="m"><rect x="330" y="84" width="193.68640488876235" height="20" rx="3"/></g><text class="sub2" x="531.6864048887624" y="99" text-anchor="start">74.5%</text><text class="cap" x="40" y="128" text-anchor="start">dog</text><text class="sub2" x="150" y="128" text-anchor="start">7.1</text><text class="sub2" x="240" y="128" text-anchor="start">1,212</text><g class="m"><rect x="330" y="114" width="64.47260349290735" height="20" rx="3"/></g><text class="sub2" x="402.47260349290735" y="129" text-anchor="start">24.8%</text><text class="cap" x="40" y="158" text-anchor="start">the</text><text class="sub2" x="150" y="158" text-anchor="start">3.5</text><text class="sub2" x="240" y="158" text-anchor="start">33</text><g class="m"><rect x="330" y="144" width="1.7616315232945463" height="20" rx="3"/></g><text class="sub2" x="339.76163152329457" y="159" text-anchor="start">0.68%</text><text class="cap" x="40" y="188" text-anchor="start">banana</text><text class="sub2" x="150" y="188" text-anchor="start">0.4</text><text class="sub2" x="240" y="188" text-anchor="start">1.49</text><g class="m"><rect x="330" y="174" width="1.5" height="20" rx="3"/></g><text class="sub2" x="339.5" y="189" text-anchor="start">0.03%</text><line class="tick" x1="240" y1="204" x2="300" y2="204"/><text class="sub2" x="150" y="222" text-anchor="start">total</text><text class="sub2" x="240" y="222" text-anchor="start">4,888</text><text class="cap" x="40" y="262" text-anchor="start">Every forward pass ends the same way: a vector of logits, one raw score for every token</text><text class="cap" x="40" y="282" text-anchor="start">in the vocabulary, 128,256 of them for Llama 3. Softmax raises e to each score and</text><text class="cap" x="40" y="302" text-anchor="start">divides by the total, so the scores become shares that add up to one ({{fig:v01-o009}}).</text><text class="cap" x="40" y="322" text-anchor="start">These four carry the illustrative scores used across the series ({{fig:v01-o008}}),</text><text class="cap" x="40" y="342" text-anchor="start">worked over the four alone.</text><text class="cap" x="40" y="382" text-anchor="start">The sampler's job is to pick one token from those shares. Next to the forward pass it is</text><text class="cap" x="40" y="402" text-anchor="start">nearly free: a list of 128,256 numbers, about half a megabyte, against 140 GB of weights</text><text class="cap" x="40" y="422" text-anchor="start">read for every token of a 70-billion-parameter model. It is also where every user-facing</text><text class="cap" x="40" y="442" text-anchor="start">quality knob lives.</text></svg><figcaption>Nearly free next to the forward pass, and yet where every user-facing quality knob lives. Small gaps in score become large gaps in share, which is what everything below works on.</figcaption></figure>
