<figure><div class='ts'>Fig 16 &nbsp;&middot;&nbsp; 19:20</div><h3>Goodput, per GPU</h3><svg viewBox="0 0 680 362" role="img"><title>Goodput, per GPU</title><text class="cap" x="40" y="78" text-anchor="start">Throughput</text><g class="u"><rect x="280" y="62" width="340" height="32" rx="3"></rect><text class="sub" x="450.0" y="78.0" text-anchor="middle" dominant-baseline="central">every token the cluster produces</text></g><text class="cap" x="40" y="138" text-anchor="start">Goodput</text><g class="s"><rect x="280" y="122" width="190" height="32" rx="3"></rect><text class="sub" x="375.0" y="138.0" text-anchor="middle" dominant-baseline="central">only the ones in time</text></g><rect x="280" y="122" width="340" height="32" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="cap" x="40" y="200" text-anchor="start">Serving adds a per-GPU version of the same idea: the highest request rate a single GPU can</text><text class="cap" x="40" y="220" text-anchor="start">sustain while 90% of requests still meet both their first-token and per-token targets.</text><text class="cap" x="40" y="260" text-anchor="start">A token generated for a request that already blew its deadline is work you paid for and cannot</text><text class="cap" x="40" y="280" text-anchor="start">sell. So a cluster can run at full utilisation and deliver very little.</text><text class="cap" x="40" y="320" text-anchor="start">Counted per GPU, goodput converts directly into the number the business cares about: cost per</text><text class="cap" x="40" y="340" text-anchor="start">query.</text></svg><figcaption>The metric from the first video, sharpened into something you can hold a single machine accountable for.</figcaption></figure>
