 stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="495" y="156" width="7" height="11" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="504" y="156" width="7" height="11" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="513" y="156" width="7" height="11" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="522" y="156" width="7" height="11" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="531" y="156" width="7" height="11" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="540" y="156" width="7" height="11" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="549" y="156" width="7" height="11" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="558" y="156" width="7" height="11" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="567" y="156" width="7" height="11" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="576" y="156" width="7" height="11" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="585" y="156" width="7" height="11" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="594" y="156" width="7" height="11" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="603" y="156" width="7" height="11" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="612" y="156" width="7" height="11" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="621" y="156" width="7" height="11" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="478" y="180" text-anchor="end">7</text><g class="s" data-p="112"><rect x="486" y="170" width="7" height="11" rx="1"/></g><g class="s" data-p="113"><rect x="495" y="170" width="7" height="11" rx="1"/></g><g class="s" data-p="114"><rect x="504" y="170" width="7" height="11" rx="1"/></g><g class="s" data-p="115"><rect x="513" y="170" width="7" height="11" rx="1"/></g><g class="s" data-p="116"><rect x="522" y="170" width="7" height="11" rx="1"/></g><g class="s" data-p="117"><rect x="531" y="170" width="7" height="11" rx="1"/></g><g class="s" data-p="118"><rect x="540" y="170" width="7" height="11" rx="1"/></g><g class="s" data-p="119"><rect x="549" y="170" width="7" height="11" rx="1"/></g><g class="s" data-p="120"><rect x="558" y="170" width="7" height="11" rx="1"/></g><g class="s" data-p="121"><rect x="567" y="170" width="7" height="11" rx="1"/></g><g class="s" data-p="122"><rect x="576" y="170" width="7" height="11" rx="1"/></g><g class="s" data-p="123"><rect x="585" y="170" width="7" height="11" rx="1"/></g><g class="s" data-p="124"><rect x="594" y="170" width="7" height="11" rx="1"/></g><g class="s" data-p="125"><rect x="603" y="170" width="7" height="11" rx="1"/></g><g class="s" data-p="126"><rect x="612" y="170" width="7" height="11" rx="1"/></g><g class="s" data-p="127"><rect x="621" y="170" width="7" height="11" rx="1"/></g><text class="sub2" x="640" y="196" text-anchor="end">green: this request · grey: others · dashed: free</text><text class="sub2" x="40" y="232" data-r1="">token 37 ÷ 16 = 2 remainder 5: logical block 2, position 5 in it</text><text class="sub2" x="40" y="252" data-r2="">block table, row 2 → physical block 3</text><text class="sub2" x="40" y="272" data-r3="">address: 3 × 16 + 5 = slot 53 of the cache memory</text><text class="cap" x="40" y="310" text-anchor="start">PagedAttention stores each request's cache in fixed blocks of 16 tokens, vLLM's default,</text><text class="cap" x="40" y="330" text-anchor="start">wherever memory is free ({{fig:v03-o086}}). A block table per request records where each</text><text class="cap" x="40" y="350" text-anchor="start">block went, as an operating system's page table does for a program ({{fig:v03-o085}}).</text><text class="cap" x="40" y="390" text-anchor="start">Finding token i takes one division with remainder and one lookup: 37 = 2 × 16 + 5, so</text><text class="cap" x="40" y="410" text-anchor="start">block 2, position 5. One block holds 16 × 131,072 bytes = 2 MiB of Llama 3 8B's cache,</text><text class="cap" x="40" y="430" text-anchor="start">64 KiB in each of its 32 layers.</text><text class="cap" x="40" y="470" text-anchor="start">Move the slider to any token; the arithmetic was checked against Python for every one.</text></svg></div><figcaption>Any free block will do, because the table remembers where each one went. That one indirection is what removes the need for unbroken runs.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const T = [7, 1, 3], BS = 16, D = 37;
  const sl = fig.querySelector('input[type=range]'), val = fig.querySelector('.val'), q = s => fig.querySelector(s);
  let last = null;
  function set(sel, cls) { const g = q(sel); if (g) g.setAttribute('class', cls); }
  function draw() {
    const i = +sl.value, blk = Math.floor(i / BS), off = i % BS, phys = T[blk], slot = phys * BS + off;
    if (last) { set(`[data-l="${last[0]}"]`, 's'); set(`[data-p="${last[1]}"]`, 's'); }
    for (let k = 0; k < T.length; k++) set(`[data-t="${k}"]`, k === blk ? 'm' : 'u');
    set(`[data-l="${i}"]`, 'm'); set(`[data-p="${slot}"]`, 'm');
    last = [i, slot];
    val.textContent = String(i);
    q('[data-r1]').textContent = `token ${i} ÷ 16 = ${blk} remainder ${off}: logical block ${blk}, position ${off} in it`;
    q('[data-r2]').textContent = `block table, row ${blk} → physical block ${phys}`;
    q('[data-r3]').textContent = `address: ${phys} × 16 + ${off} = slot ${slot} of the cache memory`;
  }
  sl.addEventListener('input', draw);
  q('button').addEventListener('click', () => { sl.value = D; draw(); });
  draw();
})();</script></figure>
