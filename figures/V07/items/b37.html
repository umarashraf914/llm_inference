<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 15:55</div><h3>Only a shared beginning can be reused, because attention looks back</h3><svg viewBox='0 0 680 484' role='img'><title>Only a shared beginning can be reused, because attention looks back</title><text class="hd" x="40" y="46">Compare from the first token, and stop at the first difference</text><line class="tick" x1="130" y1="86" x2="314" y2="86"/><line class="tick" x1="130" y1="86" x2="130" y2="91"/><line class="tick" x1="314" y1="86" x2="314" y2="91"/><text class="sub2" x="130" y="78" text-anchor="start">token 4's keys and values are computed from these 4 alone</text><text class="cap" x="40" y="113" text-anchor="start">cached</text><text class="cap" x="40" y="153" text-anchor="start">arriving</text><g class="s"><rect x="130" y="96" width="36" height="26" rx="3"/><text class="sub" x="148.0" y="109.0" text-anchor="middle" dominant-baseline="central">You</text></g><g class="s"><rect x="174" y="96" width="36" height="26" rx="3"/><text class="sub" x="192.0" y="109.0" text-anchor="middle" dominant-baseline="central">are</text></g><g class="s"><rect x="218" y="96" width="60" height="26" rx="3"/><text class="sub" x="248.0" y="109.0" text-anchor="middle" dominant-baseline="central">helpful</text></g><g class="s"><rect x="286" y="96" width="28" height="26" rx="3"/><text class="sub" x="300.0" y="109.0" text-anchor="middle" dominant-baseline="central">.</text></g><g class="u"><rect x="322" y="96" width="72" height="26" rx="3"/><text class="sub" x="358.0" y="109.0" text-anchor="middle" dominant-baseline="central">What</text></g><g class="u"><rect x="402" y="96" width="36" height="26" rx="3"/><text class="sub" x="420.0" y="109.0" text-anchor="middle" dominant-baseline="central">is</text></g><g class="u"><rect x="446" y="96" width="36" height="26" rx="3"/><text class="sub" x="464.0" y="109.0" text-anchor="middle" dominant-baseline="central">2+2</text></g><g class="u"><rect x="490" y="96" width="28" height="26" rx="3"/><text class="sub" x="504.0" y="109.0" text-anchor="middle" dominant-baseline="central">?</text></g><g class="s"><rect x="130" y="136" width="36" height="26" rx="3"/><text class="sub" x="148.0" y="149.0" text-anchor="middle" dominant-baseline="central">You</text></g><g class="s"><rect x="174" y="136" width="36" height="26" rx="3"/><text class="sub" x="192.0" y="149.0" text-anchor="middle" dominant-baseline="central">are</text></g><g class="s"><rect x="218" y="136" width="60" height="26" rx="3"/><text class="sub" x="248.0" y="149.0" text-anchor="middle" dominant-baseline="central">helpful</text></g><g class="s"><rect x="286" y="136" width="28" height="26" rx="3"/><text class="sub" x="300.0" y="149.0" text-anchor="middle" dominant-baseline="central">.</text></g><g class="m"><rect x="322" y="136" width="72" height="26" rx="3"/><text class="sub" x="358.0" y="149.0" text-anchor="middle" dominant-baseline="central">Translate</text></g><g class="m"><rect x="402" y="136" width="36" height="26" rx="3"/><text class="sub" x="420.0" y="149.0" text-anchor="middle" dominant-baseline="central">cat</text></g><line class="mark" x1="318" y1="94" x2="318" y2="166"/><text class="sub2" x="324" y="182" text-anchor="start">first difference</text><line class="tick" x1="130" y1="176" x2="314" y2="176"/><line class="tick" x1="130" y1="171" x2="130" y2="176"/><line class="tick" x1="314" y1="171" x2="314" y2="176"/><text class="sub2" x="222.0" y="192" text-anchor="middle">reused: 4 tokens</text><text class="cap" x="40" y="232" text-anchor="start">A token's keys and values are computed from that token and the ones before it, never</text><text class="cap" x="40" y="252" text-anchor="start">from the ones after, because attention is causal ({{fig:v01-o035}}). The first four tokens are</text><text class="cap" x="40" y="272" text-anchor="start">the same in both prompts, so their keys and values are the same, and the cached copies</text><text class="cap" x="40" y="292" text-anchor="start">can be used exactly as they are.</text><text class="cap" x="40" y="332" text-anchor="start">From the fifth token the texts differ. Every later key and value depends on that fifth</text><text class="cap" x="40" y="352" text-anchor="start">token, so nothing after the first difference can be reused, not even words that happen</text><text class="cap" x="40" y="372" text-anchor="start">to match again further on ({{fig:v01-o045}}).</text><text class="cap" x="40" y="412" text-anchor="start">A hit is therefore the length of the shared beginning: 4 of these 6 tokens, with 2 left</text><text class="cap" x="40" y="432" text-anchor="start">to prefill. For a real follow-up question it is usually most of the prompt: 784 of</text><text class="cap" x="40" y="452" text-anchor="start">788 tokens in {{fig:v01-o044}}.</text></svg><figcaption>Causality, which forced decode to run one token at a time, is here the permission for reuse: the same beginning always produces the same keys and values.</figcaption></figure>
