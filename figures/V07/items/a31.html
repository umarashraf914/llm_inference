<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 12:32</div><h3>Prefill and decode sit on opposite sides of the same ridge</h3><svg viewBox='0 0 680 550' role='img'><title>Prefill and decode sit on opposite sides of the same ridge</title><text class="hd" x="40" y="46">Llama 3 8B on an H100: one ridge, two workloads, logarithmic axes</text><line class="axis" x1="110" y1="282" x2="620" y2="282"/><line class="axis" x1="110" y1="84" x2="110" y2="282"/><line class="tick" x1="110.0" y1="282" x2="110.0" y2="287"/><text class="sub2" x="110.0" y="301" text-anchor="middle">0.1</text><line class="tick" x1="212.0" y1="282" x2="212.0" y2="287"/><text class="sub2" x="212.0" y="301" text-anchor="middle">1</text><line class="tick" x1="314.0" y1="282" x2="314.0" y2="287"/><text class="sub2" x="314.0" y="301" text-anchor="middle">10</text><line class="tick" x1="416.0" y1="282" x2="416.0" y2="287"/><text class="sub2" x="416.0" y="301" text-anchor="middle">100</text><line class="tick" x1="518.0" y1="282" x2="518.0" y2="287"/><text class="sub2" x="518.0" y="301" text-anchor="middle">1,000</text><line class="tick" x1="620.0" y1="282" x2="620.0" y2="287"/><text class="sub2" x="620.0" y="301" text-anchor="middle">10,000</text><line class="tick" x1="105" y1="282.0" x2="110" y2="282.0"/><text class="sub2" x="101" y="286.0" text-anchor="end">1</text><line class="tick" x1="105" y1="216.0" x2="110" y2="216.0"/><text class="sub2" x="101" y="220.0" text-anchor="end">10</text><line class="tick" x1="105" y1="150.0" x2="110" y2="150.0"/><text class="sub2" x="101" y="154.0" text-anchor="end">100</text><line class="tick" x1="105" y1="84.0" x2="110" y2="84.0"/><text class="sub2" x="101" y="88.0" text-anchor="end">1,000</text><text class="sub2" x="365.0" y="320" text-anchor="middle">operations per byte moved</text><text class="sub2" x="101" y="70" text-anchor="start">TFLOP/s attainable</text><polyline class="pl-h" points="158.4,282.0 464.0,84.3 620.0,84.3"/><line class="mark" x1="464.0" y1="92.3" x2="464.0" y2="282"/><text class="sub2 halo" x="456.0" y="110" text-anchor="end" style="paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round">ridge, 295</text><g class="m"><rect x="543.7" y="79.3" width="10" height="10" rx="5"/></g><text class="sub2 halo" x="548.7" y="70.3" text-anchor="middle" style="paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round">prefill, a 2,000-token prompt: 2,000</text><g class="h"><rect x="351.7" y="148.7" width="10" height="10" rx="5"/></g><text class="sub2 halo" x="366.7" y="171.7" text-anchor="start" style="paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round">decode, 32 requests: 26.2</text><g class="h"><rect x="208.1" y="241.7" width="10" height="10" rx="5"/></g><text class="sub2 halo" x="223.1" y="264.7" text-anchor="start" style="paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round">decode, one request: 1</text><text class="cap" x="40" y="358" text-anchor="start">Prefill processes thousands of prompt tokens at once and saturates the arithmetic units:</text><text class="cap" x="40" y="378" text-anchor="start">a 2,000-token prompt uses every weight it reads 2,000 times, about seven times past the</text><text class="cap" x="40" y="398" text-anchor="start">ridge ({{fig:v01-o129}}). Decode produces one token per request and leaves the same</text><text class="cap" x="40" y="418" text-anchor="start">units starved: even Part 4's batch of 32 requests reaches only 26.2 operations per byte,</text><text class="cap" x="40" y="438" text-anchor="start">because each brings its own cache to read ({{fig:v07-a09}}).</text><text class="cap" x="40" y="478" text-anchor="start">Chunked prefill lets the two share one GPU without stalls, but they remain opposite</text><text class="cap" x="40" y="498" text-anchor="start">workloads. One machine means one hardware choice and one way of splitting the model</text><text class="cap" x="40" y="518" text-anchor="start">across GPUs for both, which compromises each.</text></svg><figcaption>Same chip, same weights, about 76 times apart in intensity. Whatever suits one phase wastes the other.</figcaption></figure>
