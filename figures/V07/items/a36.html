<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 14:26</div><h3>A decode pool of 144 GPUs gives every expert a real batch</h3><svg viewBox='0 0 680 548' role='img'><title>A decode pool of 144 GPUs gives every expert a real batch</title><text class="hd" x="40" y="46">Tokens each expert gets per decode step, logarithmic scale</text><text class="cap" x="40" y="87" text-anchor="start">one GPU's requests</text><g class="h"><rect x="250" y="70" width="35.1" height="24" rx="2"/></g><text class="sub2" x="295.1" y="87" text-anchor="start">64 × 8 ÷ 256 = 2</text><text class="cap" x="40" y="121" text-anchor="start">one node of 8 GPUs</text><g class="h"><rect x="250" y="104" width="140.5" height="24" rx="2"/></g><text class="sub2" x="400.5" y="121" text-anchor="start">512 × 8 ÷ 256 = 16</text><text class="cap" x="40" y="155" text-anchor="start">the 144-GPU decode pool</text><g class="s"><rect x="250" y="138" width="286.9" height="24" rx="2"/></g><text class="sub2" x="546.9" y="155" text-anchor="start">9,216 × 8 ÷ 256 = 288</text><line class="axis" x1="250" y1="178" x2="600" y2="178"/><line class="tick" x1="250.0" y1="178" x2="250.0" y2="183"/><text class="sub2" x="250.0" y="197" text-anchor="middle">1</text><line class="tick" x1="366.66666666666663" y1="178" x2="366.66666666666663" y2="183"/><text class="sub2" x="366.7" y="197" text-anchor="middle">10</text><line class="tick" x1="483.3333333333333" y1="178" x2="483.3333333333333" y2="183"/><text class="sub2" x="483.3" y="197" text-anchor="middle">100</text><line class="tick" x1="600.0" y1="178" x2="600.0" y2="183"/><text class="sub2" x="600.0" y="197" text-anchor="middle">1,000</text><line class="mark xok" x1="538.2" y1="64" x2="538.2" y2="178"/><text class="sub2" x="544.2" y="214" text-anchor="middle">ridge, about 295</text><text class="cap" x="40" y="256" text-anchor="start">DeepSeek runs its prefill pool at 32-way expert parallelism and its decode pool at</text><text class="cap" x="40" y="276" text-anchor="start">144-way: the experts are spread over the pool's GPUs, and every token is shipped to the</text><text class="cap" x="40" y="296" text-anchor="start">GPUs holding its 8 chosen experts ({{fig:v05-o016}}).</text><text class="cap" x="40" y="336" text-anchor="start">The reason is sparsity. In decode each request adds one token per step, and each expert</text><text class="cap" x="40" y="356" text-anchor="start">sees the combined batch × 8 ÷ 256 tokens. If each decode GPU runs 64 requests</text><text class="cap" x="40" y="376" text-anchor="start">(illustrative), one GPU's batch gives each expert 2 tokens; the whole pool's 9,216 give</text><text class="cap" x="40" y="396" text-anchor="start">288, close to the 295 at which an expert's arithmetic keeps pace with reading its</text><text class="cap" x="40" y="416" text-anchor="start">weights, in FP8, 8-bit numbers of one byte each, as in 16 bits ({{fig:v07-a01}}).</text><text class="cap" x="40" y="456" text-anchor="start">DeepSeek's 2025 overview of its production system puts 2 routed experts on each of the</text><text class="cap" x="40" y="476" text-anchor="start">144 decode GPUs, (256 + 32 redundant copies of busy experts) ÷ 144, and 9 on each of the</text><text class="cap" x="40" y="496" text-anchor="start">32 prefill GPUs. Its V3 technical report of December 2024 described a decode unit of 320</text><text class="cap" x="40" y="516" text-anchor="start">GPUs, one expert each: the deployment in {{fig:v06-o019}}.</text></svg><figcaption>Decode is where the crowd has to be assembled, because each request brings one token per step. Pooling 144 GPUs' requests is how 8-of-256 sparsity gets fed.</figcaption></figure>
