<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 24:01</div><h3>Reshape, then cut, then draw</h3><svg viewBox='0 0 680 356' role='img'><title>Reshape, then cut, then draw</title><text class="hd" x="40" y="46">The order of operations, every token, after the forward pass</text><g class="u"><rect x="40" y="92" width="90" height="50" rx="6"/><text class="lbl" x="85.0" y="108.0" text-anchor="middle" dominant-baseline="central">logits</text><text class="sub" x="85.0" y="126.0" text-anchor="middle" dominant-baseline="central">per token</text></g><g class="m"><rect x="142" y="92" width="90" height="50" rx="6"/><text class="lbl" x="187.0" y="108.0" text-anchor="middle" dominant-baseline="central">÷ T</text><text class="sub" x="187.0" y="126.0" text-anchor="middle" dominant-baseline="central">reshape</text></g><line class="conn" x1="132" y1="117" x2="140" y2="117" marker-end="url(#arw)"/><g class="u"><rect x="244" y="92" width="90" height="50" rx="6"/><text class="lbl" x="289.0" y="108.0" text-anchor="middle" dominant-baseline="central">softmax</text><text class="sub" x="289.0" y="126.0" text-anchor="middle" dominant-baseline="central">shares</text></g><line class="conn" x1="234" y1="117" x2="242" y2="117" marker-end="url(#arw)"/><g class="s"><rect x="346" y="92" width="90" height="50" rx="6"/><text class="lbl" x="391.0" y="108.0" text-anchor="middle" dominant-baseline="central">cut</text><text class="sub" x="391.0" y="126.0" text-anchor="middle" dominant-baseline="central">drop the tail</text></g><line class="conn" x1="336" y1="117" x2="344" y2="117" marker-end="url(#arw)"/><g class="u"><rect x="448" y="92" width="90" height="50" rx="6"/><text class="lbl" x="493.0" y="108.0" text-anchor="middle" dominant-baseline="central">rescale</text><text class="sub" x="493.0" y="126.0" text-anchor="middle" dominant-baseline="central">sum to one</text></g><line class="conn" x1="438" y1="117" x2="446" y2="117" marker-end="url(#arw)"/><g class="u"><rect x="550" y="92" width="90" height="50" rx="6"/><text class="lbl" x="595.0" y="108.0" text-anchor="middle" dominant-baseline="central">draw</text><text class="sub" x="595.0" y="126.0" text-anchor="middle" dominant-baseline="central">one token</text></g><line class="conn" x1="540" y1="117" x2="548" y2="117" marker-end="url(#arw)"/><line class="tick" x1="142" y1="80" x2="334" y2="80"/><line class="tick" x1="142" y1="80" x2="142" y2="86"/><line class="tick" x1="334" y1="80" x2="334" y2="86"/><text class="sub2" x="238.0" y="72" text-anchor="middle">temperature reshapes</text><line class="tick" x1="346" y1="80" x2="538" y2="80"/><line class="tick" x1="346" y1="80" x2="346" y2="86"/><line class="tick" x1="538" y1="80" x2="538" y2="86"/><text class="sub2" x="442.0" y="72" text-anchor="middle">truncation cuts</text><text class="cap" x="40" y="184" text-anchor="start">Temperature does the reshaping: every logit is divided by a number T before the softmax.</text><text class="cap" x="40" y="204" text-anchor="start">Truncation does the cutting, in one of three ways. Top-k keeps a fixed number of the</text><text class="cap" x="40" y="224" text-anchor="start">best tokens. Top-p, or nucleus sampling, keeps the fewest top tokens whose probabilities</text><text class="cap" x="40" y="244" text-anchor="start">add up to at least P. Min-p keeps the tokens at least some fraction as likely as the</text><text class="cap" x="40" y="264" text-anchor="start">best one.</text><text class="cap" x="40" y="304" text-anchor="start">Whatever survives is renormalised to sum to one, and a single token is drawn in</text><text class="cap" x="40" y="324" text-anchor="start">proportion ({{fig:v01-o010}}). The next five figures work each step on numbers.</text></svg><figcaption>Two independent operations, usually applied together. Neither touches the model, which is why these are runtime knobs rather than training decisions.</figcaption></figure>
