<figure><div class='ts'>Fig 21 &nbsp;&middot;&nbsp; 24:01</div><h3>Reshape, then cut</h3><svg viewBox="0 0 680 418" role="img"><title>Reshape, then cut</title><text class="hd" x="40" y="46">Temperature reshapes</text><g class="m"><rect x="60" y="66" width="240" height="42" rx="6"></rect><text class="sub" x="180.0" y="87.0" text-anchor="middle" dominant-baseline="central">divide every logit by T</text></g><text class="sub2" x="320" y="90" text-anchor="start">below 1 sharpens toward greedy</text><text class="sub2" x="320" y="112" text-anchor="start">above 1 flattens toward unlikely tokens</text><text class="hd" x="40" y="172">Truncation cuts, in one of three ways</text><g class="s"><rect x="40" y="192" width="190" height="82" rx="8"></rect><text class="lbl" x="135.0" y="216.0" text-anchor="middle" dominant-baseline="central">Top K</text><text class="sub" x="135.0" y="234.0" text-anchor="middle" dominant-baseline="central">keep the K highest,</text><text class="sub" x="135.0" y="251.0" text-anchor="middle" dominant-baseline="central">ignoring confidence</text></g><g class="s"><rect x="246" y="192" width="190" height="82" rx="8"></rect><text class="lbl" x="341.0" y="216.0" text-anchor="middle" dominant-baseline="central">Top P</text><text class="sub" x="341.0" y="234.0" text-anchor="middle" dominant-baseline="central">keep the smallest set</text><text class="sub" x="341.0" y="251.0" text-anchor="middle" dominant-baseline="central">past a probability mass</text></g><g class="s"><rect x="452" y="192" width="188" height="82" rx="8"></rect><text class="lbl" x="546.0" y="216.0" text-anchor="middle" dominant-baseline="central">Min P</text><text class="sub" x="546.0" y="234.0" text-anchor="middle" dominant-baseline="central">keep tokens at least a</text><text class="sub" x="546.0" y="251.0" text-anchor="middle" dominant-baseline="central">fraction as likely as the best</text></g><text class="cap" x="40" y="316" text-anchor="start">Top P, also called nucleus sampling, reads the shape of the distribution: when the model is</text><text class="cap" x="40" y="336" text-anchor="start">confident the set is tiny, and when it is unsure the set widens.</text><text class="cap" x="40" y="376" text-anchor="start">Whatever survives is renormalised into a distribution summing to one, and a single token is</text><text class="cap" x="40" y="396" text-anchor="start">drawn. Not one weight has changed. The sampler only reshapes what the model already produced.</text></svg><figcaption>Two independent operations, usually applied together. Neither touches the model, which is why these are runtime knobs rather than training decisions.</figcaption></figure>
