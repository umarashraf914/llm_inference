<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 21:23</div><h3>The virtual token counter serves whoever has had least</h3><div class='wg'><div class='ctl'><label>B's requests, times A's <input type='range' min='1' max='20' step='1' value='5'><span class='val'>5×</span></label><label class='opt'><input type='radio' name='v07-b52-mode' value='vtc' checked> virtual token counter</label><label class='opt'><input type='radio' name='v07-b52-mode' value='turns'> take turns</label></div><div class='ctl'><button type='button'>Step</button><button type='button'>Run to 12</button><button type='button'>Start over</button><button type='button'>Reset</button></div><svg viewBox='0 0 680 606' role='img'><title>The virtual token counter serves whoever has had least</title><text class="hd" x="40" y="34">Each choice goes to the tenant whose counter is lower; a tie goes to A</text><text class="cap" x="40" y="66" text-anchor="start">choice</text><text class="sub2" x="170.0" y="66" text-anchor="middle">1</text><text class="sub2" x="210.0" y="66" text-anchor="middle">2</text><text class="sub2" x="250.0" y="66" text-anchor="middle">3</text><text class="sub2" x="290.0" y="66" text-anchor="middle">4</text><text class="sub2" x="330.0" y="66" text-anchor="middle">5</text><text class="sub2" x="370.0" y="66" text-anchor="middle">6</text><text class="sub2" x="410.0" y="66" text-anchor="middle">7</text><text class="sub2" x="450.0" y="66" text-anchor="middle">8</text><text class="sub2" x="490.0" y="66" text-anchor="middle">9</text><text class="sub2" x="530.0" y="66" text-anchor="middle">10</text><text class="sub2" x="570.0" y="66" text-anchor="middle">11</text><text class="sub2" x="610.0" y="66" text-anchor="middle">12</text><text class="cap" x="40" y="92" text-anchor="start">A's counter</text><text class="cap" x="40" y="118" text-anchor="start">B's counter</text><text class="cap" x="40" y="146" text-anchor="start">served</text><text class="sub2" x="170.0" y="92" text-anchor="middle" data-a="0">0</text><text class="sub2" x="170.0" y="118" text-anchor="middle" data-b="0">0</text><g class="s" data-cw="0"><rect x="156" y="128" width="28" height="26" rx="3"/><text class="sub" x="170.0" y="141" text-anchor="middle" dominant-baseline="central" data-w="0">A</text></g><text class="sub2" x="210.0" y="92" text-anchor="middle" data-a="1">100</text><text class="sub2" x="210.0" y="118" text-anchor="middle" data-b="1">0</text><g class="m" data-cw="1"><rect x="196" y="128" width="28" height="26" rx="3"/><text class="sub" x="210.0" y="141" text-anchor="middle" dominant-baseline="central" data-w="1">B</text></g><text class="sub2" x="250.0" y="92" text-anchor="middle" data-a="2">100</text><text class="sub2" x="250.0" y="118" text-anchor="middle" data-b="2">500</text><g class="s" data-cw="2"><rect x="236" y="128" width="28" height="26" rx="3"/><text class="sub" x="250.0" y="141" text-anchor="middle" dominant-baseline="central" data-w="2">A</text></g><text class="sub2" x="290.0" y="92" text-anchor="middle" data-a="3">200</text><text class="sub2" x="290.0" y="118" text-anchor="middle" data-b="3">500</text><g class="s" data-cw="3"><rect x="276" y="128" width="28" height="26" rx="3"/><text class="sub" x="290.0" y="141" text-anchor="middle" dominant-baseline="central" data-w="3">A</text></g><text class="sub2" x="330.0" y="92" text-anchor="middle" data-a="4">300</text><text class="sub2" x="330.0" y="118" text-anchor="middle" data-b="4">500</text><g class="s" data-cw="4"><rect x="316" y="128" width="28" height="26" rx="3"/><text class="sub" x="330.0" y="141" text-anchor="middle" dominant-baseline="central" data-w="4">A</text></g><text class="sub2" x="370.0" y="92" text-anchor="middle" data-a="5">400</text><text class="sub2" x="370.0" y="118" text-anchor="middle" data-b="5">500</text><g class="s" data-cw="5"><rect x="356" y="128" width="28" height="26" rx="3"/><text class="sub" x="370.0" y="141" text-anchor="middle" dominant-baseline="central" data-w="5">A</text></g><text class="sub2" x="410.0" y="92" text-anchor="middle" data-a="6">500</text><text class="sub2" x="410.0" y="118" text-anchor="middle" data-b="6">500</text><g class="s" data-cw="6"><rect x="396" y="128" width="28" height="26" rx="3"/><text class="sub" x="410.0" y="141" text-anchor="middle" dominant-baseline="central" data-w="6">A</text></g><text class="sub2" x="450.0" y="92" text-anchor="middle" data-a="7">600</text><text class="sub2" x="450.0" y="118" text-anchor="middle" data-b="7">500</text><g class="m" data-cw="7"><rect x="436" y="128" width="28" height="26" rx="3"/><text class="sub" x="450.0" y="141" text-anchor="middle" dominant-baseline="central" data-w="7">B</text></g><text class="sub2" x="490.0" y="92" text-anchor="middle" data-a="8">600</text><text class="sub2" x="490.0" y="118" text-anchor="middle" data-b="8">1,000</text><g class="s" data-cw="8"><rect x="476" y="128" width="28" height="26" rx="3"/><text class="sub" x="490.0" y="141" text-anchor="middle" dominant-baseline="central" data-w="8">A</text></g><text class="sub2" x="530.0" y="92" text-anchor="middle" data-a="9">700</text><text class="sub2" x="530.0" y="118" text-anchor="middle" data-b="9">1,000</text><g class="s" data-cw="9"><rect x="516" y="128" width="28" height="26" rx="3"/><text class="sub" x="530.0" y="141" text-anchor="middle" dominant-baseline="central" data-w="9">A</text></g><text class="sub2" x="570.0" y="92" text-anchor="middle" data-a="10">800</text><text class="sub2" x="570.0" y="118" text-anchor="middle" data-b="10">1,000</text><g class="s" data-cw="10"><rect x="556" y="128" width="28" height="26" rx="3"/><text class="sub" x="570.0" y="141" text-anchor="middle" dominant-baseline="central" data-w="10">A</text></g><text class="sub2" x="610.0" y="92" text-anchor="middle" data-a="11">900</text><text class="sub2" x="610.0" y="118" text-anchor="middle" data-b="11">1,000</text><g class="s" data-cw="11"><rect x="596" y="128" width="28" height="26" rx="3"/><text class="sub" x="610.0" y="141" text-anchor="middle" dominant-baseline="central" data-w="11">A</text></g><rect data-ptr="" x="0" y="160" width="6" height="6" style="display:none;fill:var(--h)"/><text class="sub2" x="40" y="204" text-anchor="start">GPU time, to scale</text><g data-strip=""><g class="s"><rect x="60.00" y="214" height="22" width="14.06" rx="2"/></g><g class="m"><rect x="75.56" y="214" height="22" width="76.28" rx="2"/></g><g class="s"><rect x="153.33" y="214" height="22" width="14.06" rx="2"/></g><g class="s"><rect x="168.89" y="214" height="22" width="14.06" rx="2"/></g><g class="s"><rect x="184.44" y="214" height="22" width="14.06" rx="2"/></g><g class="s"><rect x="200.00" y="214" height="22" width="14.06" rx="2"/></g><g class="s"><rect x="215.56" y="214" height="22" width="14.06" rx="2"/></g><g class="m"><rect x="231.11" y="214" height="22" width="76.28" rx="2"/></g><g class="s"><rect x="308.89" y="214" height="22" width="14.06" rx="2"/></g><g class="s"><rect x="324.44" y="214" height="22" width="14.06" rx="2"/></g><g class="s"><rect x="340.00" y="214" height="22" width="14.06" rx="2"/></g><g class="s"><rect x="355.56" y="214" height="22" width="14.06" rx="2"/></g></g><text class="sub2" x="40" y="262" data-sum="">after 12 choices: A served 10 requests, 1,000 units; B served 2, 1,000 units; B's share 50.0%</text><text class="sub2" x="40" y="280" data-next="">all twelve made</text><text class="cap" x="40" y="320" text-anchor="start">The virtual token counter, from a 2024 fairness paper by Sheng and colleagues, keeps a</text><text class="cap" x="40" y="340" text-anchor="start">running total for each tenant of the input and output tokens it has been served, and</text><text class="cap" x="40" y="360" text-anchor="start">always serves whoever has received least. Here a request is charged its input tokens</text><text class="cap" x="40" y="380" text-anchor="start">plus twice its output tokens, the weighting the paper's experiments used: A's 60 in and</text><text class="cap" x="40" y="400" text-anchor="start">20 out count 100, and B's, five times larger, 500. The paper adds output tokens as they</text><text class="cap" x="40" y="420" text-anchor="start">are generated; serving one request at a time, as here, that comes to the same total.</text><text class="cap" x="40" y="460" text-anchor="start">Step through it: B is served once and its counter jumps to 500, so A is served until it</text><text class="cap" x="40" y="480" text-anchor="start">catches up, then B again. After twelve choices A has had 10 requests and B 2, and each</text><text class="cap" x="40" y="500" text-anchor="start">has received 1,000 units. Switch to taking turns and B takes 83.3% of the machine.</text><text class="cap" x="40" y="540" text-anchor="start">A tenant that arrives late starts at the lowest counter among those waiting, not at</text><text class="cap" x="40" y="560" text-anchor="start">zero, so it cannot claim credit for time it was away. The choices were checked against</text><text class="cap" x="40" y="580" text-anchor="start">the same rule in Python for every size from 1 to 20.</text></svg></div><figcaption>Fairness measured in work rather than in requests. The heavy tenant still gets its share, but in proportion to what it consumes, not to how often it asks.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const C = {"WP": 1, "WQ": 2, "AIN": 60, "AOUT": 20, "N": 12, "X0": 150, "P": 40, "W": 560, "SX": 60, "SY": 214}, D = {"n": 12, "k": 5};
  const fx = (v, d = 2) => { const s = Math.abs(v).toFixed(d); return (v < 0 && +s !== 0 ? '\u2212' : '') + s; };const gx = (v, d = 0) => { const s = Math.abs(v).toFixed(d), [a, b] = s.split('.'); const t = a.replace(/\B(?=(\d{3})+(?!\d))/g, ','); return (v < 0 && +s !== 0 ? '\u2212' : '') + t + (b ? '.' + b : ''); };const pcx = (v, d = 1) => fx(100 * v, d) + '%';
  const sl = fig.querySelector('input[type=range]'), val = fig.querySelector('.val');
  const rad = [...fig.querySelectorAll('input[type=radio]')], q = s => fig.querySelector(s);
  const [stepB, runB, clearB, resetB] = fig.querySelectorAll('button');
  let n = D.n;
  function decide(mode, k, steps) {
    let ca = 0, cb = 0; const ua = C.WP * C.AIN + C.WQ * C.AOUT, ub = ua * k, out = [];
    for (let i = 0; i < steps; i++) {
      const who = mode === 'turns' ? (i % 2 === 0 ? 'A' : 'B') : (ca <= cb ? 'A' : 'B');
      out.push([ca, cb, who]); if (who === 'A') ca += ua; else cb += ub;
    }
    return [out, ca, cb, ua, ub];
  }
  function draw() {
    const k = +sl.value, mode = rad[1].checked ? 'turns' : 'vtc';
    val.textContent = `${k}×`;
    const [rows, ca, cb, ua, ub] = decide(mode, k, n), [all] = decide(mode, k, C.N);
    for (let i = 0; i < C.N; i++) {
      const has = i < n, r = all[i];
      [['a', has ? gx(r[0]) : ''], ['b', has ? gx(r[1]) : ''], ['w', has ? r[2] : '']].forEach(([key, s]) => {
        q(`[data-${key}="${i}"]`).textContent = s;
      });
      const cellg = q(`[data-cw="${i}"]`);
      cellg.setAttribute('class', has ? (r[2] === 'A' ? 's' : 'm') : 'u');
    }
    const pt = q('[data-ptr]');
    if (n < C.N) { pt.style.display = ''; pt.setAttribute('x', (C.X0 + n * C.P + C.P / 2 - 3).toFixed(1)); }
    else pt.style.display = 'none';
    const total = 6 * ua + 6 * ub, sc = C.W / total, strip = q('[data-strip]');
    while (strip.firstChild) strip.removeChild(strip.firstChild);
    let x = C.SX;
    rows.forEach(r => {
      const w = (r[2] === 'A' ? ua : ub) * sc, g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      g.setAttribute('class', r[2] === 'A' ? 's' : 'm');
      rect.setAttribute('x', x.toFixed(2)); rect.setAttribute('y', C.SY); rect.setAttribute('height', 22);
      rect.setAttribute('width', Math.max(w - 1.5, 1).toFixed(2)); rect.setAttribute('rx', 2);
      g.appendChild(rect); strip.appendChild(g); x += w;
    });
    const na = rows.filter(r => r[2] === 'A').length, nb = rows.length - na;
    const sa = na * ua, sb = nb * ub;
    q('[data-sum]').textContent = n ? `after ${n} choices: A served ${na} requests, ${gx(sa)} units; B served ${nb}, ${gx(sb)} units; B's share ${pcx(sb / (sa + sb))}` : 'no choices made yet';
    q('[data-next]').textContent = n < C.N ? `next: ${mode === 'turns' ? (n % 2 === 0 ? 'A, its turn' : 'B, its turn') : (ca <= cb ? `A, counter ${gx(ca)} against ${gx(cb)}` : `B, counter ${gx(cb)} against ${gx(ca)}`)}` : 'all twelve made';
    stepB.disabled = runB.disabled = n >= C.N;
  }
  stepB.addEventListener('click', () => { if (n < C.N) n++; draw(); });
  runB.addEventListener('click', () => { n = C.N; draw(); });
  clearB.addEventListener('click', () => { n = 0; draw(); });
  resetB.addEventListener('click', () => { n = D.n; sl.value = D.k; rad[0].checked = true; draw(); });
  sl.addEventListener('input', draw); rad.forEach(r => r.addEventListener('change', draw));
  draw();
})();</script></figure>
