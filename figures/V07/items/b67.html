<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 26:33</div><h3>A stack remembers how deep you are</h3><svg viewBox='0 0 680 426' role='img'><title>A stack remembers how deep you are</title><text class="hd" x="40" y="46">The stack after each bracket of [[1],[2,[3]]]</text><g class="m"><rect x="50" y="152" width="50" height="20" rx="3"/><text class="sub" x="75.0" y="162.0" text-anchor="middle" dominant-baseline="central">[</text></g><line class="tick" x1="46" y1="178" x2="104" y2="178"/><text class="sub2" x="75" y="196" text-anchor="middle">read [</text><text class="sub2" x="75" y="212" text-anchor="middle">height 1</text><g class="m"><rect x="124" y="152" width="50" height="20" rx="3"/><text class="sub" x="149.0" y="162.0" text-anchor="middle" dominant-baseline="central">[</text></g><g class="m"><rect x="124" y="128" width="50" height="20" rx="3"/><text class="sub" x="149.0" y="138.0" text-anchor="middle" dominant-baseline="central">[</text></g><line class="tick" x1="120" y1="178" x2="178" y2="178"/><text class="sub2" x="149" y="196" text-anchor="middle">read [</text><text class="sub2" x="149" y="212" text-anchor="middle">height 2</text><g class="m"><rect x="198" y="152" width="50" height="20" rx="3"/><text class="sub" x="223.0" y="162.0" text-anchor="middle" dominant-baseline="central">[</text></g><line class="tick" x1="194" y1="178" x2="252" y2="178"/><text class="sub2" x="223" y="196" text-anchor="middle">read ]</text><text class="sub2" x="223" y="212" text-anchor="middle">height 1</text><g class="m"><rect x="272" y="152" width="50" height="20" rx="3"/><text class="sub" x="297.0" y="162.0" text-anchor="middle" dominant-baseline="central">[</text></g><g class="m"><rect x="272" y="128" width="50" height="20" rx="3"/><text class="sub" x="297.0" y="138.0" text-anchor="middle" dominant-baseline="central">[</text></g><line class="tick" x1="268" y1="178" x2="326" y2="178"/><text class="sub2" x="297" y="196" text-anchor="middle">read [</text><text class="sub2" x="297" y="212" text-anchor="middle">height 2</text><g class="m"><rect x="346" y="152" width="50" height="20" rx="3"/><text class="sub" x="371.0" y="162.0" text-anchor="middle" dominant-baseline="central">[</text></g><g class="m"><rect x="346" y="128" width="50" height="20" rx="3"/><text class="sub" x="371.0" y="138.0" text-anchor="middle" dominant-baseline="central">[</text></g><g class="m"><rect x="346" y="104" width="50" height="20" rx="3"/><text class="sub" x="371.0" y="114.0" text-anchor="middle" dominant-baseline="central">[</text></g><line class="tick" x1="342" y1="178" x2="400" y2="178"/><text class="sub2" x="371" y="196" text-anchor="middle">read [</text><text class="sub2" x="371" y="212" text-anchor="middle">height 3</text><g class="m"><rect x="420" y="152" width="50" height="20" rx="3"/><text class="sub" x="445.0" y="162.0" text-anchor="middle" dominant-baseline="central">[</text></g><g class="m"><rect x="420" y="128" width="50" height="20" rx="3"/><text class="sub" x="445.0" y="138.0" text-anchor="middle" dominant-baseline="central">[</text></g><line class="tick" x1="416" y1="178" x2="474" y2="178"/><text class="sub2" x="445" y="196" text-anchor="middle">read ]</text><text class="sub2" x="445" y="212" text-anchor="middle">height 2</text><g class="m"><rect x="494" y="152" width="50" height="20" rx="3"/><text class="sub" x="519.0" y="162.0" text-anchor="middle" dominant-baseline="central">[</text></g><line class="tick" x1="490" y1="178" x2="548" y2="178"/><text class="sub2" x="519" y="196" text-anchor="middle">read ]</text><text class="sub2" x="519" y="212" text-anchor="middle">height 1</text><rect x="568" y="152" width="50" height="20" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="593.0" y="162.0" text-anchor="middle" dominant-baseline="central">empty</text><line class="tick" x1="564" y1="178" x2="622" y2="178"/><text class="sub2" x="593" y="196" text-anchor="middle">read ]</text><text class="sub2" x="593" y="212" text-anchor="middle">height 0</text><text class="cap" x="40" y="254" text-anchor="start">A stack is a pile you can only touch at the top: push puts an item on, pop takes the top</text><text class="cap" x="40" y="274" text-anchor="start">one off. A pushdown automaton is a state machine plus a stack. On [ it pushes; on ] it</text><text class="cap" x="40" y="294" text-anchor="start">pops, and it refuses a ] when there is nothing to pop. The stack's height is the depth,</text><text class="cap" x="40" y="314" text-anchor="start">and it has no limit.</text><text class="cap" x="40" y="354" text-anchor="start">Reading [[1],[2,[3]]], the stack after each bracket stands 1, 2, 1, 2, 3, 2, 1 and</text><text class="cap" x="40" y="374" text-anchor="start">finally 0 high. Empty at the end means every bracket was closed, so the text is</text><text class="cap" x="40" y="394" text-anchor="start">accepted. A pushdown automaton is what XGrammar runs.</text></svg><figcaption>One pile with no fixed height replaces an unlimited number of states. That is the whole difference between the two machines.</figcaption></figure>
