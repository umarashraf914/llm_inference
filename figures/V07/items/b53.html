<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 21:36</div><h3>Admit fifty-five and every one is late; admit forty-seven and all are on time</h3><svg viewBox='0 0 680 680' role='img'><title>Admit fifty-five and every one is late; admit forty-seven and all are on time</title><text class="hd" x="40" y="46">One decode step, to scale: the weights read once, then every request's cache</text><text class="cap" x="40" y="92" text-anchor="start">47 requests</text><g class="u"><rect x="150" y="74" width="86.29253731343283" height="28" rx="3"/><text class="sub" x="193.14626865671642" y="88.0" text-anchor="middle" dominant-baseline="central">weights</text></g><g class="s"><rect x="236.29253731343283" y="74" width="271.1598755534328" height="28" rx="3"/><text class="sub" x="371.87247509014924" y="88.0" text-anchor="middle" dominant-baseline="central">47 caches, 50.5 GB</text></g><text class="sub2" x="515.4524128668656" y="92" text-anchor="start">19.9 ms</text><text class="cap" x="40" y="142" text-anchor="start">55 requests</text><g class="u"><rect x="150" y="124" width="86.29253731343283" height="28" rx="3"/><text class="sub" x="193.14626865671642" y="138.0" text-anchor="middle" dominant-baseline="central">weights</text></g><g class="h"><rect x="236.29253731343283" y="124" width="317.31474798805965" height="28" rx="3"/><text class="sub" x="394.9499113074627" y="138.0" text-anchor="middle" dominant-baseline="central">55 caches, 59.1 GB</text></g><text class="sub2" x="561.6072853014925" y="142" text-anchor="start">22.4 ms</text><line class="mark xok" x1="510.0" y1="64" x2="510.0" y2="162"/><text class="sub2" x="510.0" y="182" text-anchor="middle">20 ms target</text><text class="sub2" x="250" y="218" text-anchor="middle">admit 47</text><text class="sub2" x="400" y="218" text-anchor="middle">admit 55</text><text class="cap" x="40" y="244" text-anchor="start">tokens a second</text><g class="s"><rect x="190" y="228" width="120" height="24" rx="3"/><text class="sub" x="250.0" y="240.0" text-anchor="middle" dominant-baseline="central">2,367</text></g><g class="u"><rect x="340" y="228" width="120" height="24" rx="3"/><text class="sub" x="400.0" y="240.0" text-anchor="middle" dominant-baseline="central">2,453</text></g><text class="cap" x="40" y="274" text-anchor="start">on time</text><g class="s"><rect x="190" y="258" width="120" height="24" rx="3"/><text class="sub" x="250.0" y="270.0" text-anchor="middle" dominant-baseline="central">2,367</text></g><g class="h"><rect x="340" y="258" width="120" height="24" rx="3"/><text class="sub" x="400.0" y="270.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="cap" x="40" y="304" text-anchor="start">GPU busy</text><g class="u"><rect x="190" y="288" width="120" height="24" rx="3"/><text class="sub" x="250.0" y="300.0" text-anchor="middle" dominant-baseline="central">100%</text></g><g class="u"><rect x="340" y="288" width="120" height="24" rx="3"/><text class="sub" x="400.0" y="300.0" text-anchor="middle" dominant-baseline="central">100%</text></g><text class="cap" x="40" y="348" text-anchor="start">Take Llama 3 8B on one H100, every request holding 8,192 tokens of context, 1.07 GB of</text><text class="cap" x="40" y="368" text-anchor="start">cache each ({{fig:v07-a07}}), and a target of 20 ms per output token. Requests in a</text><text class="cap" x="40" y="388" text-anchor="start">batch advance together, so they share one step time: the weights read once, plus every</text><text class="cap" x="40" y="408" text-anchor="start">request's cache ({{fig:v07-a23}}).</text><text class="cap" x="40" y="448" text-anchor="start">47 requests make a step of (16.06 + 47 × 1.07) GB ÷ 3.35 TB/s = 19.9 ms, and all are on</text><text class="cap" x="40" y="468" text-anchor="start">time. 55, all that memory holds ({{fig:v07-a10}}), make 22.4 ms, and every one is late.</text><text class="cap" x="40" y="488" text-anchor="start">The GPU turns out 4% more tokens and goodput falls from 2,367 tokens a second to none,</text><text class="cap" x="40" y="508" text-anchor="start">while utilisation, the share of time the GPU is busy, reads 100% throughout.</text><text class="cap" x="40" y="548" text-anchor="start">Admission control refuses the excess instead. The scheduler can predict that a 48th</text><text class="cap" x="40" y="568" text-anchor="start">request would push every step past 20 ms, and reject or defer it so the 47 still land.</text><text class="cap" x="40" y="588" text-anchor="start">Mooncake, the platform that serves Kimi, Moonshot AI's language-model service, does this</text><text class="cap" x="40" y="608" text-anchor="start">with a prediction-based early rejection policy: when a request arrives it predicts the</text><text class="cap" x="40" y="628" text-anchor="start">load that request will add to the decode pool once its prefill is done, and turns it</text><text class="cap" x="40" y="648" text-anchor="start">away before spending anything on it.</text></svg><figcaption>Bars to scale. Overload does not slow a few requests, it slows all of them, because they share the step. That is why goodput collapses instead of fading.</figcaption></figure>
