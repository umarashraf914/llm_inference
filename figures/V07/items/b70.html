<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 27:30</div><h3>The guarantee is exact and narrow, and a mask can steer</h3><svg viewBox='0 0 680 514' role='img'><title>The guarantee is exact and narrow, and a mask can steer</title><text class="hd" x="40" y="46">What a mask buys, exactly</text><g class="s"><rect x="40" y="66" width="285" height="60" rx="8"/><text class="lbl" x="182.5" y="87.0" text-anchor="middle" dominant-baseline="central">The output will parse</text><text class="sub" x="182.5" y="105.0" text-anchor="middle" dominant-baseline="central">guaranteed</text></g><g class="h"><rect x="355" y="66" width="285" height="60" rx="8"/><text class="lbl" x="497.5" y="87.0" text-anchor="middle" dominant-baseline="central">That it is true</text><text class="sub" x="497.5" y="105.0" text-anchor="middle" dominant-baseline="central">not guaranteed at all</text></g><text class="hd" x="40" y="166">Suppose the format forbids cat, the model's favourite</text><text class="sub2" x="170" y="188" text-anchor="start">the model's shares</text><text class="sub2" x="400" y="188" text-anchor="start">after the mask</text><text class="cap" x="40" y="211" text-anchor="start">cat</text><g class="u"><rect x="170" y="197" width="134.0905879999124" height="18" rx="3"/></g><text class="sub2" x="310.0905879999124" y="211" text-anchor="start">74.5%</text><text class="sub2" x="400" y="211" text-anchor="start">masked</text><text class="cap" x="40" y="239" text-anchor="start">dog</text><g class="u"><rect x="170" y="225" width="44.634879341243554" height="18" rx="3"/></g><text class="sub2" x="220.63487934124356" y="239" text-anchor="start">24.8%</text><g class="h"><rect x="400" y="225" width="175.00285739683414" height="18" rx="3"/></g><text class="sub2" x="581.0028573968341" y="239" text-anchor="start">97.22%</text><text class="cap" x="40" y="267" text-anchor="start">the</text><g class="u"><rect x="170" y="253" width="1.5" height="18" rx="3"/></g><text class="sub2" x="177.5" y="267" text-anchor="start">0.68%</text><g class="h"><rect x="400" y="253" width="4.781729502994217" height="18" rx="3"/></g><text class="sub2" x="410.7817295029942" y="267" text-anchor="start">2.66%</text><text class="cap" x="40" y="295" text-anchor="start">banana</text><g class="u"><rect x="170" y="281" width="1.5" height="18" rx="3"/></g><text class="sub2" x="177.5" y="295" text-anchor="start">0.03%</text><g class="h"><rect x="400" y="281" width="1.5" height="18" rx="3"/></g><text class="sub2" x="407.5" y="295" text-anchor="start">0.12%</text><text class="cap" x="40" y="342" text-anchor="start">The guarantee this buys is exact and narrow. The output will parse, because no token</text><text class="cap" x="40" y="362" text-anchor="start">that breaks the format can ever be drawn. Nothing about it is guaranteed to be true: a</text><text class="cap" x="40" y="382" text-anchor="start">well-formed answer can still be wrong.</text><text class="cap" x="40" y="422" text-anchor="start">And because the mask can remove the token the model most wanted, generation can be</text><text class="cap" x="40" y="442" text-anchor="start">pushed down a path it would not otherwise have taken. Forbid cat, the model's 74.5%</text><text class="cap" x="40" y="462" text-anchor="start">favourite, and its share is spread over the rest in proportion: dog rises from 24.8% to</text><text class="cap" x="40" y="482" text-anchor="start">97.22%. The output parses, but it is not what the model would have said.</text></svg><figcaption>A mask decides what may be said, not what is true. Forcing a format can force a worse answer, and nothing in the output will show it.</figcaption></figure>
