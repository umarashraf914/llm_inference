<figure><div class='ts'>Fig 10 &nbsp;&middot;&nbsp; 12:23</div><h3>Splitting prefill from decode</h3><svg viewBox="0 0 680 528" role="img"><title>Splitting prefill from decode</title><g class="m"><rect x="40" y="55" width="285" height="78" rx="8"></rect><text class="lbl" x="182.5" y="77.0" text-anchor="middle" dominant-baseline="central">Prefill</text><text class="sub" x="182.5" y="95.0" text-anchor="middle" dominant-baseline="central">thousands of tokens at once,</text><text class="sub" x="182.5" y="112.0" text-anchor="middle" dominant-baseline="central">saturates the arithmetic units</text></g><g class="h"><rect x="368" y="55" width="272" height="78" rx="8"></rect><text class="lbl" x="504.0" y="77.0" text-anchor="middle" dominant-baseline="central">Decode</text><text class="sub" x="504.0" y="95.0" text-anchor="middle" dominant-baseline="central">one token per request,</text><text class="sub" x="504.0" y="112.0" text-anchor="middle" dominant-baseline="central">held back by memory bandwidth</text></g><text class="cap" x="40" y="178" text-anchor="start">Chunked prefill lets them share one GPU without stalls, but they remain opposite workloads.</text><text class="cap" x="40" y="198" text-anchor="start">One machine means one hardware choice and one parallelism strategy for both, which compromises</text><text class="cap" x="40" y="218" text-anchor="start">each.</text><text class="hd" x="40" y="268">So give each its own pool</text><g class="m"><rect x="40" y="288" width="240" height="44" rx="4"></rect><text class="sub" x="160.0" y="310.0" text-anchor="middle" dominant-baseline="central">prefill pool</text></g><line class="conn" x1="286" y1="310" x2="330" y2="310" marker-end="url(#arw)"></line><g class="h"><rect x="336" y="288" width="304" height="44" rx="4"></rect><text class="sub" x="488.0" y="310.0" text-anchor="middle" dominant-baseline="central">decode pool</text></g><text class="sub2" x="286" y="356" text-anchor="start">the KV cache crosses the interconnect</text><text class="cap" x="40" y="406" text-anchor="start">That transfer is the price. A single 512-token request on a 66-billion model produces about</text><text class="cap" x="40" y="426" text-anchor="start">1.13 GB of KV cache, so at ten requests a second you need roughly 11 GB per second of network,</text><text class="cap" x="40" y="446" text-anchor="start">about 90 gigabits, just to keep the transfer invisible.</text><text class="cap" x="40" y="486" text-anchor="start">A cluster with InfiniBand or NVLink absorbs that. A small deployment does not, which makes</text><text class="cap" x="40" y="506" text-anchor="start">disaggregation a decision about how much traffic you have, not a default.</text></svg><figcaption>Two independent research efforts arrived at this conclusion at the same time, which is usually a sign the constraint is real rather than an artefact of one system.</figcaption></figure>
