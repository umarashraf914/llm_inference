<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 12:59</div><h3>Disaggregation gives prefill and decode a pool each</h3><svg viewBox='0 0 680 418' role='img'><title>Disaggregation gives prefill and decode a pool each</title><text class="hd" x="40" y="46">Disaggregation: a pool of GPUs for each phase, and a cache that crosses between them</text><g class="u"><rect x="40" y="98" width="70" height="26" rx="3"/><text class="sub" x="75.0" y="111.0" text-anchor="middle" dominant-baseline="central">prompt</text></g><line class="conn" x1="114" y1="111" x2="132" y2="111" marker-end="url(#arw)"/><g class="m"><rect x="138" y="66" width="200" height="92" rx="12"/><text class="lbl" x="156" y="88">prefill pool</text></g><g class="u"><rect x="156" y="104" width="38" height="34" rx="3"/><text class="sub" x="175.0" y="121.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="u"><rect x="200" y="104" width="38" height="34" rx="3"/><text class="sub" x="219.0" y="121.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="u"><rect x="244" y="104" width="38" height="34" rx="3"/><text class="sub" x="263.0" y="121.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="u"><rect x="288" y="104" width="38" height="34" rx="3"/><text class="sub" x="307.0" y="121.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="h"><rect x="430" y="66" width="200" height="92" rx="12"/><text class="lbl" x="448" y="88">decode pool</text></g><g class="u"><rect x="448" y="104" width="38" height="34" rx="3"/><text class="sub" x="467.0" y="121.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="u"><rect x="492" y="104" width="38" height="34" rx="3"/><text class="sub" x="511.0" y="121.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="u"><rect x="536" y="104" width="38" height="34" rx="3"/><text class="sub" x="555.0" y="121.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="u"><rect x="580" y="104" width="38" height="34" rx="3"/><text class="sub" x="599.0" y="121.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><line class="conn" x1="344" y1="111" x2="424" y2="111" marker-end="url(#arw)"/><text class="sub2" x="384" y="100" text-anchor="middle">KV cache</text><text class="sub2" x="384" y="136" text-anchor="middle">over the</text><text class="sub2" x="384" y="150" text-anchor="middle">interconnect</text><text class="sub2" x="430" y="180" text-anchor="start">then a token per step until the end</text><text class="cap" x="40" y="226" text-anchor="start">Prefill runs on one pool of GPUs and decode on another, each configured for its own</text><text class="cap" x="40" y="246" text-anchor="start">bottleneck: the prefill pool for arithmetic, the decode pool for memory and batch size.</text><text class="cap" x="40" y="266" text-anchor="start">The KV cache the prefill pool builds is shipped across the interconnect to the decode</text><text class="cap" x="40" y="286" text-anchor="start">pool, which carries on from it.</text><text class="cap" x="40" y="326" text-anchor="start">That transfer is the price, and DistServe put a number on it: a single 512-token request</text><text class="cap" x="40" y="346" text-anchor="start">on OPT-66B produces about 1.13 GB of KV cache, so at 10 requests a second the network</text><text class="cap" x="40" y="366" text-anchor="start">must carry roughly 90 gigabits a second just to keep the transfer invisible. The next</text><text class="cap" x="40" y="386" text-anchor="start">three figures check each part of that sentence.</text></svg><figcaption>The split buys each phase its own hardware and its own parallelism, at the price of moving every request's cache once.</figcaption></figure>
