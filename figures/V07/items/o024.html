<figure><div class='ts'>Fig 24 &nbsp;&middot;&nbsp; 26:43</div><h3>Making it cheap, and what it guarantees</h3><svg viewBox="0 0 680 596" role="img"><title>Making it cheap, and what it guarantees</title><text class="hd" x="40" y="46">The obvious worry is cost, at every single token</text><text class="cap" x="40" y="92" text-anchor="start">Naively</text><g class="h"><rect x="200" y="76" width="380" height="30" rx="3"></rect><text class="sub" x="390.0" y="91.0" text-anchor="middle" dominant-baseline="central">test all 100,000+ tokens against the automaton</text></g><text class="hd" x="40" y="152">Two ways around it</text><g class="s"><rect x="40" y="172" width="285" height="82" rx="8"></rect><text class="lbl" x="182.5" y="196.0" text-anchor="middle" dominant-baseline="central">Precompute an index</text><text class="sub" x="182.5" y="214.0" text-anchor="middle" dominant-baseline="central">once per schema, from each state</text><text class="sub" x="182.5" y="231.0" text-anchor="middle" dominant-baseline="central">to the allowed token set</text></g><g class="s"><rect x="368" y="172" width="272" height="82" rx="8"></rect><text class="lbl" x="504.0" y="196.0" text-anchor="middle" dominant-baseline="central">Split the vocabulary</text><text class="sub" x="504.0" y="214.0" text-anchor="middle" dominant-baseline="central">check most ahead of time, build</text><text class="sub" x="504.0" y="231.0" text-anchor="middle" dominant-baseline="central">the rest on the CPU</text></g><text class="cap" x="40" y="294" text-anchor="start">The first makes the per-step work a lookup, constant on average. The second builds the mask for</text><text class="cap" x="40" y="314" text-anchor="start">the few live cases on the CPU while the GPU is still running the forward pass, landing in under</text><text class="cap" x="40" y="334" text-anchor="start">40 microseconds per token against a decode step measured in milliseconds.</text><text class="hd" x="40" y="384">What this buys, exactly</text><g class="s"><rect x="40" y="404" width="285" height="66" rx="8"></rect><text class="lbl" x="182.5" y="428.0" text-anchor="middle" dominant-baseline="central">The output will parse</text><text class="sub" x="182.5" y="446.0" text-anchor="middle" dominant-baseline="central">guaranteed</text></g><g class="h"><rect x="368" y="404" width="272" height="66" rx="8"></rect><text class="lbl" x="504.0" y="420.0" text-anchor="middle" dominant-baseline="central">Nothing about it is true</text><text class="sub" x="504.0" y="438.0" text-anchor="middle" dominant-baseline="central">and the mask can remove the</text><text class="sub" x="504.0" y="455.0" text-anchor="middle" dominant-baseline="central">token the model most wanted</text></g><text class="cap" x="40" y="514" text-anchor="start">Generation can be pushed down a path it would not otherwise have taken. The mechanism also</text><text class="cap" x="40" y="534" text-anchor="start">generalises past formatting: restricting the next token to an approved set is how an agent's</text><text class="cap" x="40" y="554" text-anchor="start">actions are held inside a vetted schema. It cannot emit a call that is not on the list, because</text><text class="cap" x="40" y="574" text-anchor="start">those tokens are never available to it.</text></svg><figcaption>The guarantee is exact and narrow, and the last paragraph is why this matters well beyond JSON formatting.</figcaption></figure>
