<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 26:40</div><h3>Testing every token at every step is the cost to beat</h3><svg viewBox='0 0 680 448' role='img'><title>Testing every token at every step is the cost to beat</title><text class="hd" x="40" y="46">Naively: every token in the vocabulary through the automaton, at every step</text><g class="h"><rect x="40" y="66" width="600" height="30" rx="3"/><text class="sub" x="340.0" y="81.0" text-anchor="middle" dominant-baseline="central">128,256 tokens tested per output token</text></g><text class="hd" x="40" y="136">Two ways around it</text><g class="s"><rect x="40" y="152" width="290" height="82" rx="8"/><text class="lbl" x="185.0" y="176.0" text-anchor="middle" dominant-baseline="central">Outlines: an index</text><text class="sub" x="185.0" y="194.0" text-anchor="middle" dominant-baseline="central">once per schema, from each state</text><text class="sub" x="185.0" y="211.0" text-anchor="middle" dominant-baseline="central">to the tokens allowed in it</text></g><g class="s"><rect x="350" y="152" width="290" height="82" rx="8"/><text class="lbl" x="495.0" y="176.0" text-anchor="middle" dominant-baseline="central">XGrammar: split the vocabulary</text><text class="sub" x="495.0" y="194.0" text-anchor="middle" dominant-baseline="central">check most tokens ahead of time;</text><text class="sub" x="495.0" y="211.0" text-anchor="middle" dominant-baseline="central">the few that need the stack, live</text></g><text class="cap" x="40" y="276" text-anchor="start">The obvious worry is cost, because the mask is needed at every single token. Done</text><text class="cap" x="40" y="296" text-anchor="start">naively, every one of the 128,256 tokens in Llama 3's vocabulary would be run through</text><text class="cap" x="40" y="316" text-anchor="start">the automaton, character by character, at every step.</text><text class="cap" x="40" y="356" text-anchor="start">Outlines removes that by precomputing, once per schema, an index from each state of the</text><text class="cap" x="40" y="376" text-anchor="start">machine to the set of tokens allowed in it, so the per-step work becomes a lookup.</text><text class="cap" x="40" y="396" text-anchor="start">XGrammar splits the vocabulary instead: most tokens can be checked ahead of time, and</text><text class="cap" x="40" y="416" text-anchor="start">only a few need the live stack.</text></svg><figcaption>Two answers to one question: do the work once, before generation starts, or do at runtime only the part that cannot be done in advance.</figcaption></figure>
