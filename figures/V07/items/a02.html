<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:22</div><h3>A serving system makes two promises to every user</h3><svg viewBox='0 0 680 692' role='img'><title>A serving system makes two promises to every user</title><text class="hd" x="40" y="46">A fixed set of GPUs, a crowd of users, and a deadline for each of them</text><g class="u"><rect x="40" y="70" width="34" height="11" rx="2"/></g><line class="conn" x1="80" y1="75.5" x2="168" y2="84" marker-end="url(#arw)"/><g class="u"><rect x="40" y="86" width="34" height="11" rx="2"/></g><line class="conn" x1="80" y1="91.5" x2="168" y2="97" marker-end="url(#arw)"/><g class="u"><rect x="40" y="102" width="34" height="11" rx="2"/></g><line class="conn" x1="80" y1="107.5" x2="168" y2="110" marker-end="url(#arw)"/><g class="u"><rect x="40" y="118" width="34" height="11" rx="2"/></g><line class="conn" x1="80" y1="123.5" x2="168" y2="123" marker-end="url(#arw)"/><g class="u"><rect x="40" y="134" width="34" height="11" rx="2"/></g><line class="conn" x1="80" y1="139.5" x2="168" y2="136" marker-end="url(#arw)"/><g class="u"><rect x="40" y="150" width="34" height="11" rx="2"/></g><line class="conn" x1="80" y1="155.5" x2="168" y2="149" marker-end="url(#arw)"/><text class="sub2" x="40" y="184" text-anchor="start">users, arriving whenever they like</text><g class="u"><rect x="174" y="66" width="466" height="96" rx="14"/><text class="lbl" x="196" y="92">a fixed set of GPUs, all running the same model</text></g><g class="s"><rect x="196" y="108" width="46" height="34" rx="3"/><text class="sub" x="219.0" y="125.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="s"><rect x="250" y="108" width="46" height="34" rx="3"/><text class="sub" x="273.0" y="125.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="s"><rect x="304" y="108" width="46" height="34" rx="3"/><text class="sub" x="327.0" y="125.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="s"><rect x="358" y="108" width="46" height="34" rx="3"/><text class="sub" x="381.0" y="125.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="s"><rect x="412" y="108" width="46" height="34" rx="3"/><text class="sub" x="435.0" y="125.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="s"><rect x="466" y="108" width="46" height="34" rx="3"/><text class="sub" x="489.0" y="125.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="s"><rect x="520" y="108" width="46" height="34" rx="3"/><text class="sub" x="543.0" y="125.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="s"><rect x="574" y="108" width="46" height="34" rx="3"/><text class="sub" x="597.0" y="125.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><text class="hd" x="40" y="236">One user's request, start to finish</text><rect x="60" y="287" width="126" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="123.0" y="300.0" text-anchor="middle" dominant-baseline="central">waits in a queue</text><g class="m"><rect x="186" y="287" width="94" height="26" rx="3"/><text class="sub" x="233.0" y="300.0" text-anchor="middle" dominant-baseline="central">prefill</text></g><g class="s"><rect x="280" y="293" width="12" height="14" rx="2"/></g><g class="s"><rect x="315" y="293" width="12" height="14" rx="2"/></g><g class="s"><rect x="350" y="293" width="12" height="14" rx="2"/></g><g class="s"><rect x="385" y="293" width="12" height="14" rx="2"/></g><g class="s"><rect x="420" y="293" width="12" height="14" rx="2"/></g><g class="s"><rect x="455" y="293" width="12" height="14" rx="2"/></g><g class="s"><rect x="490" y="293" width="12" height="14" rx="2"/></g><g class="s"><rect x="525" y="293" width="12" height="14" rx="2"/></g><g class="s"><rect x="560" y="293" width="12" height="14" rx="2"/></g><g class="s"><rect x="595" y="293" width="12" height="14" rx="2"/></g><text class="sub2" x="60" y="330" text-anchor="start">arrives</text><text class="sub2" x="280" y="330" text-anchor="start">first token</text><line class="tick" x1="60" y1="274" x2="280" y2="274"/><line class="tick" x1="60" y1="274" x2="60" y2="280"/><line class="tick" x1="280" y1="274" x2="280" y2="280"/><text class="sub2" x="170.0" y="266" text-anchor="middle">time to first token, TTFT</text><line class="tick" x1="420" y1="344" x2="455" y2="344"/><line class="tick" x1="420" y1="344" x2="420" y2="338"/><line class="tick" x1="455" y1="344" x2="455" y2="338"/><text class="sub2" x="437.5" y="362" text-anchor="middle">time per output token, TPOT</text><text class="cap" x="40" y="400" text-anchor="start">A serving system takes a fixed set of GPUs running a model, a trillion parameters in the</text><text class="cap" x="40" y="420" text-anchor="start">largest cases, and serves as many users as it can without missing anyone's latency</text><text class="cap" x="40" y="440" text-anchor="start">target.</text><text class="cap" x="40" y="480" text-anchor="start">Each user is promised two things ({{fig:v01-o143}}). Time to first token covers the wait</text><text class="cap" x="40" y="500" text-anchor="start">in the queue plus the prefill, the single pass that reads the whole prompt. Time per</text><text class="cap" x="40" y="520" text-anchor="start">output token is the gap between tokens after that: one decode step each, so every user</text><text class="cap" x="40" y="540" text-anchor="start">in a step waits for the whole step. The targets depend on the product: DistServe's</text><text class="cap" x="40" y="560" text-anchor="start">chatbot settings ask for the first token within 0.25 to 4 seconds and each later one</text><text class="cap" x="40" y="580" text-anchor="start">within 0.1 to 0.2 seconds, looser for bigger models.</text><text class="cap" x="40" y="620" text-anchor="start">Putting more users in each step raises the tokens out of every read of the weights; the</text><text class="cap" x="40" y="640" text-anchor="start">two targets set how far that can be pushed. Every technique in this document trades</text><text class="cap" x="40" y="660" text-anchor="start">inside those two limits.</text></svg><figcaption>Throughput is the operator's number and the two latencies are the user's. A serving system is judged by how many users it can hold inside both at once.</figcaption></figure>
