<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:22</div><h3>A serving system makes two promises to every user</h3><svg viewBox='0 0 680 672' role='img'><title>A serving system makes two promises to every user</title><text class="hd" x="40" y="46">A fixed set of GPUs, a crowd of users, and a deadline for each of them</text><g class="u"><rect x="40" y="70" width="34" height="11" rx="2"/></g><line class="conn" x1="80" y1="75.5" x2="168" y2="112" marker-end="url(#arw)"/><g class="u"><rect x="40" y="86" width="34" height="11" rx="2"/></g><line class="conn" x1="80" y1="91.5" x2="168" y2="112" marker-end="url(#arw)"/><g class="u"><rect x="40" y="102" width="34" height="11" rx="2"/></g><line class="conn" x1="80" y1="107.5" x2="168" y2="112" marker-end="url(#arw)"/><g class="u"><rect x="40" y="118" width="34" height="11" rx="2"/></g><line class="conn" x1="80" y1="123.5" x2="168" y2="112" marker-end="url(#arw)"/><g class="u"><rect x="40" y="134" width="34" height="11" rx="2"/></g><line class="conn" x1="80" y1="139.5" x2="168" y2="112" marker-end="url(#arw)"/><g class="u"><rect x="40" y="150" width="34" height="11" rx="2"/></g><line class="conn" x1="80" y1="155.5" x2="168" y2="112" marker-end="url(#arw)"/><text class="sub2" x="40" y="184" text-anchor="start">users, arriving whenever they like</text><g class="u"><rect x="174" y="66" width="466" height="96" rx="14"/><text class="lbl" x="196" y="92">a fixed set of GPUs, all running the same model</text></g><g class="s"><rect x="196" y="108" width="46" height="34" rx="3"/><text class="sub" x="219.0" y="125.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="s"><rect x="250" y="108" width="46" height="34" rx="3"/><text class="sub" x="273.0" y="125.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="s"><rect x="304" y="108" width="46" height="34" rx="3"/><text class="sub" x="327.0" y="125.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="s"><rect x="358" y="108" width="46" height="34" rx="3"/><text class="sub" x="381.0" y="125.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="s"><rect x="412" y="108" width="46" height="34" rx="3"/><text class="sub" x="435.0" y="125.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="s"><rect x="466" y="108" width="46" height="34" rx="3"/><text class="sub" x="489.0" y="125.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="s"><rect x="520" y="108" width="46" height="34" rx="3"/><text class="sub" x="543.0" y="125.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><g class="s"><rect x="574" y="108" width="46" height="34" rx="3"/><text class="sub" x="597.0" y="125.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><text class="hd" x="40" y="236">One user's request, start to finish</text><rect x="60" y="287" width="90" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="105.0" y="300.0" text-anchor="middle" dominant-baseline="central">waits in a queue</text><g class="m"><rect x="150" y="287" width="102" height="26" rx="3"/><text class="sub" x="201.0" y="300.0" text-anchor="middle" dominant-baseline="central">prefill</text></g><g class="s"><rect x="252" y="293" width="12" height="14" rx="2"/></g><g class="s"><rect x="290" y="293" width="12" height="14" rx="2"/></g><g class="s"><rect x="328" y="293" width="12" height="14" rx="2"/></g><g class="s"><rect x="366" y="293" width="12" height="14" rx="2"/></g><g class="s"><rect x="404" y="293" width="12" height="14" rx="2"/></g><g class="s"><rect x="442" y="293" width="12" height="14" rx="2"/></g><g class="s"><rect x="480" y="293" width="12" height="14" rx="2"/></g><g class="s"><rect x="518" y="293" width="12" height="14" rx="2"/></g><g class="s"><rect x="556" y="293" width="12" height="14" rx="2"/></g><g class="s"><rect x="594" y="293" width="12" height="14" rx="2"/></g><text class="sub2" x="60" y="330" text-anchor="start">arrives</text><text class="sub2" x="252" y="330" text-anchor="start">first token</text><line class="tick" x1="60" y1="274" x2="252" y2="274"/><line class="tick" x1="60" y1="274" x2="60" y2="280"/><line class="tick" x1="252" y1="274" x2="252" y2="280"/><text class="sub2" x="156.0" y="266" text-anchor="middle">time to first token, TTFT</text><line class="tick" x1="404" y1="344" x2="442" y2="344"/><line class="tick" x1="404" y1="344" x2="404" y2="338"/><line class="tick" x1="442" y1="344" x2="442" y2="338"/><text class="sub2" x="423.0" y="362" text-anchor="middle">time per output token, TPOT</text><text class="cap" x="40" y="400" text-anchor="start">A serving system takes a fixed set of GPUs running a model, a trillion parameters in the</text><text class="cap" x="40" y="420" text-anchor="start">largest cases, and serves as many users as it can without missing anyone's latency</text><text class="cap" x="40" y="440" text-anchor="start">target.</text><text class="cap" x="40" y="480" text-anchor="start">Each user is promised two things ({{fig:v01-o143}}). Time to first token covers the wait</text><text class="cap" x="40" y="500" text-anchor="start">in the queue plus the prefill of the whole prompt. Time per output token is the gap</text><text class="cap" x="40" y="520" text-anchor="start">between tokens after that: one decode step each, so every user in a step waits for the</text><text class="cap" x="40" y="540" text-anchor="start">whole step. Typical targets are a fraction of a second for the first and tens of</text><text class="cap" x="40" y="560" text-anchor="start">milliseconds for the second.</text><text class="cap" x="40" y="600" text-anchor="start">Putting more users in each step raises the tokens out of every read of the weights; the</text><text class="cap" x="40" y="620" text-anchor="start">two targets set how far that can be pushed. Every technique in this document trades</text><text class="cap" x="40" y="640" text-anchor="start">inside those two limits.</text></svg><figcaption>Throughput is the operator's number and the two latencies are the user's. A serving system is judged by how many users it can hold inside both at once.</figcaption></figure>
