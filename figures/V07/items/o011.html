<figure><div class='ts'>Fig 11 &nbsp;&middot;&nbsp; 13:37</div><h3>What disaggregation buys</h3><svg viewBox="0 0 680 460" role="img"><title>What disaggregation buys</title><text class="cap" x="40" y="78" text-anchor="start">Requests served</text><g class="s"><rect x="280" y="62" width="340" height="32" rx="3"></rect><text class="sub" x="450.0" y="78.0" text-anchor="middle" dominant-baseline="central">7.4 times more</text></g><text class="cap" x="40" y="138" text-anchor="start">or targets met</text><g class="s"><rect x="280" y="122" width="340" height="32" rx="3"></rect><text class="sub" x="450.0" y="138.0" text-anchor="middle" dominant-baseline="central">12.6 times tighter</text></g><text class="cap" x="40" y="198" text-anchor="start">while holding over 90% of requests inside both their first-token and per-token budgets, on</text><text class="cap" x="40" y="218" text-anchor="start">models from 13 to 175 billion parameters.</text><text class="cap" x="40" y="258" text-anchor="start">A concurrent result reported 1.4 times the throughput at 20% lower cost, or 2.35 times at the</text><text class="cap" x="40" y="278" text-anchor="start">same cost and power.</text><text class="cap" x="40" y="318" text-anchor="start">Production pushed it further. One deployment runs its prefill pool at 32-way expert parallelism</text><text class="cap" x="40" y="338" text-anchor="start">and its decode pool at 144-way. The reason is sparsity: with eight of 256 experts firing per</text><text class="cap" x="40" y="358" text-anchor="start">token, only an enormous combined batch gives every expert enough tokens to be worth running,</text><text class="cap" x="40" y="378" text-anchor="start">and decode is where that batch gets assembled.</text><text class="cap" x="40" y="418" text-anchor="start">By 2025 the pattern was standard, and a 96-GPU reproduction sustained 52,300 input and 22,300</text><text class="cap" x="40" y="438" text-anchor="start">output tokens per second per node at about twenty cents per million output tokens.</text></svg><figcaption>Note the second paragraph: the two pools can run different parallelism strategies, which is a freedom a single shared pool does not have.</figcaption></figure>
