<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:53</div><h3>What disaggregation buys</h3><svg viewBox='0 0 680 540' role='img'><title>What disaggregation buys</title><text class="hd" x="40" y="46">Two kinds of gain, each drawn to its own scale</text><text class="sub2" x="40" y="76" text-anchor="start">DistServe, against systems serving both phases on the same GPUs</text><text class="cap" x="40" y="102" text-anchor="start">requests per GPU</text><g class="u"><rect x="260" y="88" width="50" height="18" rx="2"/></g><text class="sub2" x="318" y="102" text-anchor="start">before</text><g class="s"><rect x="260" y="112" width="370.0" height="18" rx="2"/><text class="sub" x="445.0" y="121.0" text-anchor="middle" dominant-baseline="central">up to 7.4 times more</text></g><text class="cap" x="40" y="160" text-anchor="start">tightest targets met</text><rect x="260" y="146" width="370.0" height="18" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="445.0" y="155.0" text-anchor="middle" dominant-baseline="central">before</text><g class="s"><rect x="260" y="170" width="29.365079365079364" height="18" rx="2"/></g><text class="sub2" x="297.4" y="184" text-anchor="start">up to 12.6 times tighter</text><text class="sub2" x="40" y="222" text-anchor="start">Splitwise, throughput per dollar against an ordinary cluster</text><text class="cap" x="40" y="248" text-anchor="start">1.4× throughput, 20% cheaper</text><g class="s"><rect x="260" y="234" width="244.99999999999997" height="18" rx="2"/><text class="sub" x="382.5" y="243.0" text-anchor="middle" dominant-baseline="central">1.75× per dollar</text></g><text class="cap" x="40" y="278" text-anchor="start">same cost and power</text><g class="s"><rect x="260" y="264" width="329.0" height="18" rx="2"/><text class="sub" x="424.5" y="273.0" text-anchor="middle" dominant-baseline="central">2.35× per dollar</text></g><text class="cap" x="40" y="328" text-anchor="start">DistServe (Peking University and UC San Diego) and Splitwise (University of Washington</text><text class="cap" x="40" y="348" text-anchor="start">and Microsoft) were concurrent, independent work that reached the same conclusion.</text><text class="cap" x="40" y="388" text-anchor="start">DistServe reported serving up to 7.4 times more requests, or meeting targets up to 12.6</text><text class="cap" x="40" y="408" text-anchor="start">times tighter, while keeping over 90% of requests inside both budgets, on OPT models</text><text class="cap" x="40" y="428" text-anchor="start">from 13 to 175 billion parameters. More requests make a longer bar; a tighter target</text><text class="cap" x="40" y="448" text-anchor="start">makes a shorter one.</text><text class="cap" x="40" y="488" text-anchor="start">Splitwise reported 1.4 times the throughput at 20% lower cost, which is 1.4 ÷ 0.8 = 1.75</text><text class="cap" x="40" y="508" text-anchor="start">times the throughput per dollar, or 2.35 times at the same cost and power.</text></svg><figcaption>Two independent groups reached the same split at the same time, usually a sign the constraint is real rather than an artefact of one system.</figcaption></figure>
