<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:54</div><h3>Normalising and activating also look at one token at a time</h3><svg viewBox='0 0 680 560' role='img'><title>Normalising and activating also look at one token at a time</title><text class="hd" x="40" y="46">One token's four numbers, before and after each per-token step</text><text class="cap" x="40" y="88" text-anchor="start">the token</text><line class="axis" x1="210" y1="84" x2="630" y2="84"/><line class="tick" x1="210.0" y1="84" x2="210.0" y2="88"/><text class="sub2" x="210.0" y="101" text-anchor="middle">0</text><line class="tick" x1="420.0" y1="84" x2="420.0" y2="88"/><text class="sub2" x="420.0" y="101" text-anchor="middle">5</text><line class="tick" x1="630.0" y1="84" x2="630.0" y2="88"/><text class="sub2" x="630.0" y="101" text-anchor="middle">10</text><g class="m"><rect x="290.0" y="80" width="8" height="8" rx="4"/></g><g class="m"><rect x="374.0" y="80" width="8" height="8" rx="4"/></g><g class="m"><rect x="458.0" y="80" width="8" height="8" rx="4"/></g><g class="m"><rect x="542.0" y="80" width="8" height="8" rx="4"/></g><text class="sub2" x="210" y="72" text-anchor="start">2, 4, 6, 8</text><text class="cap" x="40" y="144" text-anchor="start">layer norm</text><line class="axis" x1="210" y1="140" x2="630" y2="140"/><line class="tick" x1="210.0" y1="140" x2="210.0" y2="144"/><text class="sub2" x="210.0" y="157" text-anchor="middle">−2</text><line class="tick" x1="420.0" y1="140" x2="420.0" y2="144"/><text class="sub2" x="420.0" y="157" text-anchor="middle">0</text><line class="tick" x1="630.0" y1="140" x2="630.0" y2="144"/><text class="sub2" x="630.0" y="157" text-anchor="middle">2</text><g class="m"><rect x="275.1" y="136" width="8" height="8" rx="4"/></g><g class="m"><rect x="369.0" y="136" width="8" height="8" rx="4"/></g><g class="m"><rect x="463.0" y="136" width="8" height="8" rx="4"/></g><g class="m"><rect x="556.9" y="136" width="8" height="8" rx="4"/></g><text class="sub2" x="210" y="128" text-anchor="start">−1.342, −0.447, 0.447, 1.342</text><text class="cap" x="40" y="200" text-anchor="start">RMS norm, Llama</text><line class="axis" x1="210" y1="196" x2="630" y2="196"/><line class="tick" x1="210.0" y1="196" x2="210.0" y2="200"/><text class="sub2" x="210.0" y="213" text-anchor="middle">−2</text><line class="tick" x1="420.0" y1="196" x2="420.0" y2="200"/><text class="sub2" x="420.0" y="213" text-anchor="middle">0</text><line class="tick" x1="630.0" y1="196" x2="630.0" y2="200"/><text class="sub2" x="630.0" y="213" text-anchor="middle">2</text><g class="m"><rect x="454.3" y="192" width="8" height="8" rx="4"/></g><g class="m"><rect x="492.7" y="192" width="8" height="8" rx="4"/></g><g class="m"><rect x="531.0" y="192" width="8" height="8" rx="4"/></g><g class="m"><rect x="569.4" y="192" width="8" height="8" rx="4"/></g><text class="sub2" x="210" y="184" text-anchor="start">0.365, 0.730, 1.095, 1.461</text><text class="cap" x="40" y="262" text-anchor="start">SiLU, Llama</text><text class="sub2" x="210" y="262" text-anchor="start">x ÷ (1 + e^(−x)):  −1 → −0.269,  0.5 → 0.311,  2 → 1.762</text><text class="cap" x="40" y="308" text-anchor="start">Layer norm rescales one token's vector to average 0 and spread 1: subtract its mean,</text><text class="cap" x="40" y="328" text-anchor="start">(2 + 4 + 6 + 8) ÷ 4 = 5, then divide by its standard deviation, the square root of the</text><text class="cap" x="40" y="348" text-anchor="start">average squared distance from that mean: √((9 + 1 + 1 + 9) ÷ 4) = √5 = 2.236. A learned</text><text class="cap" x="40" y="368" text-anchor="start">scale is applied after.</text><text class="cap" x="40" y="408" text-anchor="start">Llama's RMS norm skips the subtraction and divides by the root of the mean square,</text><text class="cap" x="40" y="428" text-anchor="start">√((4 + 16 + 36 + 64) ÷ 4) = √30 = 5.477. The activation function then works on each</text><text class="cap" x="40" y="448" text-anchor="start">number alone; Llama's SiLU, x ÷ (1 + e^(−x)), passes large positives nearly unchanged</text><text class="cap" x="40" y="468" text-anchor="start">and squeezes negatives towards 0.</text><text class="cap" x="40" y="508" text-anchor="start">Every one of these needs only the token's own numbers, plus a few learned constants</text><text class="cap" x="40" y="528" text-anchor="start">shared by all tokens. None asks which request the token came from.</text></svg><figcaption>With the projections, that covers everything in a layer except attention: all of it can run on any stack of tokens, from any mix of requests.</figcaption></figure>
