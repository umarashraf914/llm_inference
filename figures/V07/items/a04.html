r="end">96</text><text class="cap" x="40" y="320" text-anchor="start">bytes of weights, 2 each</text><text class="sub2" x="250" y="320" text-anchor="end">32</text><text class="sub2" x="540" y="320" text-anchor="end">32</text><text class="cap" x="40" y="344" text-anchor="start">operations per byte</text><text class="sub2" x="250" y="344" text-anchor="end">1</text><text class="sub2" x="540" y="344" text-anchor="end">3</text><text class="cap" x="40" y="394" text-anchor="start">Each output number is one row of the matrix times the token's vector, multiplied pair by</text><text class="cap" x="40" y="414" text-anchor="start">pair and added: four multiply-adds ({{fig:v01-o085}}). Four rows make 16, and each of the 16</text><text class="cap" x="40" y="434" text-anchor="start">weights is used exactly once.</text><text class="cap" x="40" y="474" text-anchor="start">Put three tokens' vectors side by side and the same 16 weights, read once, each do three</text><text class="cap" x="40" y="494" text-anchor="start">multiply-adds: 48 in all. Column a's answer, 2, 2, 5, 5, is identical on both sides.</text><text class="cap" x="40" y="514" text-anchor="start">Batching changes nothing about what any request gets back.</text><text class="cap" x="40" y="554" text-anchor="start">At 2 bytes a weight, 32 bytes buy 32 operations on the left and 96 on the right. In a</text><text class="cap" x="40" y="574" text-anchor="start">real layer the vectors are tiny beside the matrix: a 4,096 × 4,096 matrix holds 16.8</text><text class="cap" x="40" y="594" text-anchor="start">million weights against 4,096 numbers per token, so the weights are the bytes that</text><text class="cap" x="40" y="614" text-anchor="start">count.</text></svg><figcaption>Three times the work for the same bytes. The weights stayed put; only the number of requests sharing them changed.</figcaption></figure>
