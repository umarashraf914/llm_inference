<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 27:46</div><h3>An agent cannot call a tool that is not on the list</h3><svg viewBox='0 0 680 458' role='img'><title>An agent cannot call a tool that is not on the list</title><text class="hd" x="40" y="46">The agent is writing a tool call; the next token is the tool's name</text><g class="u"><rect x="40" y="62" width="150" height="26" rx="3"/><text class="sub" x="115.0" y="75.0" text-anchor="middle" dominant-baseline="central">{"tool": "</text></g><text class="sub2" x="204" y="80" text-anchor="start">then one of:</text><text class="sub2" x="170" y="112" text-anchor="start">the model's shares</text><text class="sub2" x="400" y="112" text-anchor="start">allowed by the schema</text><text class="cap" x="40" y="135" text-anchor="start">search</text><g class="u"><rect x="170" y="121" width="68.9882678696412" height="18" rx="3"/></g><text class="sub2" x="244.98826786964122" y="135" text-anchor="start">38%</text><g class="s"><rect x="400" y="121" width="109.91506211085996" height="18" rx="3"/></g><text class="sub2" x="515.9150621108599" y="135" text-anchor="start">61.1%</text><text class="cap" x="40" y="163" text-anchor="start">read_file</text><g class="u"><rect x="170" y="149" width="43.9888617253071" height="18" rx="3"/></g><text class="sub2" x="219.98886172530712" y="163" text-anchor="start">24%</text><g class="s"><rect x="400" y="149" width="70.08493788914005" height="18" rx="3"/></g><text class="sub2" x="476.08493788914006" y="163" text-anchor="start">38.9%</text><text class="cap" x="40" y="191" text-anchor="start">delete_files</text><g class="u"><rect x="170" y="177" width="59.37875243514872" height="18" rx="3"/></g><text class="sub2" x="235.37875243514873" y="191" text-anchor="start">33%</text><text class="sub2" x="400" y="191" text-anchor="start">masked: never available</text><text class="cap" x="40" y="219" text-anchor="start">send_payment</text><g class="u"><rect x="170" y="205" width="7.644117969902964" height="18" rx="3"/></g><text class="sub2" x="183.64411796990296" y="219" text-anchor="start">4%</text><text class="sub2" x="400" y="219" text-anchor="start">masked: never available</text><text class="cap" x="40" y="266" text-anchor="start">The mechanism generalises past formatting. An agent acts by writing a tool call</text><text class="cap" x="40" y="286" text-anchor="start">({{fig:v07-b36}}); if the engine restricts the next token to an approved set, the agent's</text><text class="cap" x="40" y="306" text-anchor="start">actions are held inside a vetted schema. Here the name must be search or read_file, so</text><text class="cap" x="40" y="326" text-anchor="start">delete_files and send_payment are masked, however much the model leans toward them.</text><text class="cap" x="40" y="366" text-anchor="start">It cannot emit a call that is not on the list, because those tokens are never available</text><text class="cap" x="40" y="386" text-anchor="start">to it. The serving layer is the last place anything can be enforced before tokens reach</text><text class="cap" x="40" y="406" text-anchor="start">a user or a tool. Names are drawn as single tokens for clarity; in practice the machine</text><text class="cap" x="40" y="426" text-anchor="start">admits a name character by character, as in {{fig:v07-b65}}.</text></svg><figcaption>Shares illustrative. A rule enforced at the logits holds whatever the prompt says, which makes the serving layer the place for any rule that must not be argued with.</figcaption></figure>
