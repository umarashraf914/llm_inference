<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 16:24</div><h3>A prefix tree stores each shared beginning once</h3><svg viewBox='0 0 680 526' role='img'><title>A prefix tree stores each shared beginning once</title><text class="hd" x="40" y="46">Three prompts, one token per node: 25 tokens sent, 15 nodes stored</text><g class="u"><rect x="40" y="94.0" width="10" height="10" rx="5"/></g><line class="conn" x1="50" y1="99.0" x2="56.0" y2="99.0"/><line class="conn" x1="56.0" y1="99.0" x2="62" y2="99.0"/><line class="conn" x1="98" y1="99.0" x2="110" y2="99.0"/><line class="conn" x1="146" y1="99.0" x2="158" y2="99.0"/><line class="conn" x1="218" y1="99.0" x2="230" y2="99.0"/><line class="conn" x1="256" y1="99.0" x2="268" y2="99.0"/><line class="conn" x1="310" y1="99.0" x2="322" y2="99.0"/><line class="conn" x1="352" y1="99.0" x2="364" y2="99.0"/><line class="conn" x1="400" y1="99.0" x2="412" y2="99.0"/><line class="conn" x1="352" y1="99.0" x2="358.0" y2="99.0"/><line class="conn" x1="358.0" y1="99.0" x2="358.0" y2="137.0"/><line class="conn" x1="358.0" y1="137.0" x2="364" y2="137.0"/><line class="conn" x1="400" y1="137.0" x2="412" y2="137.0"/><line class="conn" x1="472" y1="137.0" x2="484" y2="137.0"/><line class="conn" x1="514" y1="137.0" x2="526" y2="137.0"/><line class="conn" x1="580" y1="137.0" x2="592" y2="137.0"/><line class="conn" x1="256" y1="99.0" x2="262.0" y2="99.0"/><line class="conn" x1="262.0" y1="99.0" x2="262.0" y2="175.0"/><line class="conn" x1="262.0" y1="175.0" x2="268" y2="175.0"/><line class="conn" x1="340" y1="175.0" x2="352" y2="175.0"/><g class="s"><rect x="62" y="86" width="36" height="26" rx="3"/><text class="sub" x="80.0" y="99.0" text-anchor="middle" dominant-baseline="central">You</text></g><g class="s"><rect x="110" y="86" width="36" height="26" rx="3"/><text class="sub" x="128.0" y="99.0" text-anchor="middle" dominant-baseline="central">are</text></g><g class="s"><rect x="158" y="86" width="60" height="26" rx="3"/><text class="sub" x="188.0" y="99.0" text-anchor="middle" dominant-baseline="central">helpful</text></g><g class="s"><rect x="230" y="86" width="26" height="26" rx="3"/><text class="sub" x="243.0" y="99.0" text-anchor="middle" dominant-baseline="central">.</text></g><g class="s"><rect x="268" y="86" width="42" height="26" rx="3"/><text class="sub" x="289.0" y="99.0" text-anchor="middle" dominant-baseline="central">What</text></g><g class="s"><rect x="322" y="86" width="30" height="26" rx="3"/><text class="sub" x="337.0" y="99.0" text-anchor="middle" dominant-baseline="central">is</text></g><g class="u"><rect x="364" y="86" width="36" height="26" rx="3"/><text class="sub" x="382.0" y="99.0" text-anchor="middle" dominant-baseline="central">2+2</text></g><g class="u"><rect x="412" y="86" width="26" height="26" rx="3"/><text class="sub" x="425.0" y="99.0" text-anchor="middle" dominant-baseline="central">?</text></g><g class="u"><rect x="364" y="124" width="36" height="26" rx="3"/><text class="sub" x="382.0" y="137.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="u"><rect x="412" y="124" width="60" height="26" rx="3"/><text class="sub" x="442.0" y="137.0" text-anchor="middle" dominant-baseline="central">capital</text></g><g class="u"><rect x="484" y="124" width="30" height="26" rx="3"/><text class="sub" x="499.0" y="137.0" text-anchor="middle" dominant-baseline="central">of</text></g><g class="u"><rect x="526" y="124" width="54" height="26" rx="3"/><text class="sub" x="553.0" y="137.0" text-anchor="middle" dominant-baseline="central">France</text></g><g class="u"><rect x="592" y="124" width="26" height="26" rx="3"/><text class="sub" x="605.0" y="137.0" text-anchor="middle" dominant-baseline="central">?</text></g><g class="u"><rect x="268" y="162" width="72" height="26" rx="3"/><text class="sub" x="304.0" y="175.0" text-anchor="middle" dominant-baseline="central">Translate</text></g><g class="u"><rect x="352" y="162" width="36" height="26" rx="3"/><text class="sub" x="370.0" y="175.0" text-anchor="middle" dominant-baseline="central">cat</text></g><line class="tick" x1="62" y1="74" x2="256" y2="74"/><line class="tick" x1="62" y1="74" x2="62" y2="79"/><line class="tick" x1="256" y1="74" x2="256" y2="79"/><text class="sub2" x="159.0" y="68" text-anchor="middle">in all three prompts</text><line class="tick" x1="268" y1="74" x2="352" y2="74"/><line class="tick" x1="268" y1="74" x2="268" y2="79"/><line class="tick" x1="352" y1="74" x2="352" y2="79"/><text class="sub2" x="310.0" y="68" text-anchor="middle">in two</text><text class="cap" x="40" y="210" text-anchor="start">prompt 1</text><text class="sub2" x="110" y="210" text-anchor="start">You are helpful . What is 2+2 ?</text><text class="sub2" x="430" y="210" text-anchor="start">8 tokens</text><text class="cap" x="40" y="230" text-anchor="start">prompt 2</text><text class="sub2" x="110" y="230" text-anchor="start">You are helpful . What is the capital of France ?</text><text class="sub2" x="430" y="230" text-anchor="start">11 tokens</text><text class="cap" x="40" y="250" text-anchor="start">prompt 3</text><text class="sub2" x="110" y="250" text-anchor="start">You are helpful . Translate cat</text><text class="sub2" x="430" y="250" text-anchor="start">6 tokens</text><text class="cap" x="40" y="294" text-anchor="start">Each node holds one token, and the path from the root to a node spells out the beginning</text><text class="cap" x="40" y="314" text-anchor="start">of a prompt. Prompts that start the same way walk the same nodes, so a shared beginning</text><text class="cap" x="40" y="334" text-anchor="start">is stored once however many prompts share it.</text><text class="cap" x="40" y="374" text-anchor="start">All three prompts begin You are helpful ., so those four nodes serve all three, and What</text><text class="cap" x="40" y="394" text-anchor="start">is serves two. 25 tokens arrive and 15 nodes hold them, each with that token's keys and</text><text class="cap" x="40" y="414" text-anchor="start">values. Words stand in for tokens here, one per word; a real tokenizer cuts text</text><text class="cap" x="40" y="434" text-anchor="start">differently ({{fig:v01-o006}}), and the sharing works the same way.</text><text class="cap" x="40" y="474" text-anchor="start">This is a prefix tree, also called a trie. One token per node makes it easy to follow</text><text class="cap" x="40" y="494" text-anchor="start">and wasteful to keep: a 2,000-token system prompt would be a chain of 2,000 nodes.</text></svg><figcaption>Every saving in this part comes from this one fact. What remains is making the structure cheap to keep and quick to search.</figcaption></figure>
