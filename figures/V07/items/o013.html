<figure><div class='ts'>Fig 13 &nbsp;&middot;&nbsp; 16:02</div><h3>Storing the prefixes in a tree</h3><svg viewBox="0 0 680 510" role="img"><title>Storing the prefixes in a tree</title><text class="hd" x="40" y="46">A radix tree keyed on token sequences</text><g class="s"><rect x="240" y="70" width="200" height="34" rx="4"></rect><text class="sub" x="340.0" y="87.0" text-anchor="middle" dominant-baseline="central">shared system prompt</text></g><line class="conn" x1="340" y1="106" x2="200" y2="128"></line><line class="conn" x1="340" y1="106" x2="480" y2="128"></line><g class="s"><rect x="110" y="130" width="180" height="34" rx="4"></rect><text class="sub" x="200.0" y="147.0" text-anchor="middle" dominant-baseline="central">conversation A</text></g><g class="s"><rect x="390" y="130" width="180" height="34" rx="4"></rect><text class="sub" x="480.0" y="147.0" text-anchor="middle" dominant-baseline="central">conversation B</text></g><line class="conn" x1="200" y1="166" x2="140" y2="188"></line><line class="conn" x1="200" y1="166" x2="260" y2="188"></line><g class="u"><rect x="70" y="190" width="140" height="34" rx="4"></rect><text class="sub" x="140.0" y="207.0" text-anchor="middle" dominant-baseline="central">turn 3</text></g><g class="u"><rect x="220" y="190" width="140" height="34" rx="4"></rect><text class="sub" x="290.0" y="207.0" text-anchor="middle" dominant-baseline="central">turn 4</text></g><text class="cap" x="40" y="268" text-anchor="start">A radix tree is a prefix tree whose edges can carry whole sequences rather than single tokens,</text><text class="cap" x="40" y="288" text-anchor="start">which is what makes it compact. Requests sharing a prefix walk the same path, and the tree</text><text class="cap" x="40" y="308" text-anchor="start">branches only at the token where their sequences first differ.</text><text class="cap" x="40" y="348" text-anchor="start">When memory runs short it evicts the least recently used leaf, working inward toward the shared</text><text class="cap" x="40" y="368" text-anchor="start">trunk, and a reference count on each node keeps it from evicting anything a running request is</text><text class="cap" x="40" y="388" text-anchor="start">still using.</text><text class="cap" x="40" y="428" text-anchor="start">This works because the cache was already paged. Sharing a prefix is two sequences pointing at</text><text class="cap" x="40" y="448" text-anchor="start">the same physical blocks. Nothing is copied, because those blocks can never change. Only the</text><text class="cap" x="40" y="468" text-anchor="start">one partially filled block at the point of divergence gets copied, exactly the copy-on-write an</text><text class="cap" x="40" y="488" text-anchor="start">operating system does when it forks a process.</text></svg><figcaption>Paging made this possible. Without fixed-size blocks, sharing a prefix would mean copying it.</figcaption></figure>
