<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 16:36</div><h3>A conversation grows down the tree, and branches only where texts differ</h3><svg viewBox='0 0 680 478' role='img'><title>A conversation grows down the tree, and branches only where texts differ</title><text class="hd" x="40" y="46">What SGLang's RadixAttention holds after two conversations</text><g class="u"><rect x="40" y="100.0" width="10" height="10" rx="5"/></g><line class="conn" x1="50" y1="105.0" x2="56.0" y2="105.0"/><line class="conn" x1="56.0" y1="105.0" x2="62" y2="105.0"/><line class="conn" x1="158" y1="105.0" x2="174" y2="105.0"/><line class="conn" x1="246" y1="105.0" x2="262" y2="105.0"/><line class="conn" x1="334" y1="105.0" x2="350" y2="105.0"/><line class="conn" x1="446" y1="105.0" x2="462" y2="105.0"/><line class="conn" x1="528" y1="105.0" x2="544" y2="105.0"/><line class="conn" x1="446" y1="105.0" x2="454.0" y2="105.0"/><line class="conn" x1="454.0" y1="105.0" x2="454.0" y2="163.0"/><line class="conn" x1="454.0" y1="163.0" x2="462" y2="163.0"/><line class="conn" x1="158" y1="105.0" x2="166.0" y2="105.0"/><line class="conn" x1="166.0" y1="105.0" x2="166.0" y2="221.0"/><line class="conn" x1="166.0" y1="221.0" x2="174" y2="221.0"/><g class="s"><rect x="62" y="92" width="96" height="26" rx="3"/><text class="sub" x="110.0" y="105.0" text-anchor="middle" dominant-baseline="central">system prompt</text></g><g class="u"><rect x="174" y="92" width="72" height="26" rx="3"/><text class="sub" x="210.0" y="105.0" text-anchor="middle" dominant-baseline="central">A: turn 1</text></g><g class="u"><rect x="262" y="92" width="72" height="26" rx="3"/><text class="sub" x="298.0" y="105.0" text-anchor="middle" dominant-baseline="central">A: turn 2</text></g><g class="u"><rect x="350" y="92" width="96" height="26" rx="3"/><text class="sub" x="398.0" y="105.0" text-anchor="middle" dominant-baseline="central">A: question 3</text></g><g class="u"><rect x="462" y="92" width="66" height="26" rx="3"/><text class="sub" x="495.0" y="105.0" text-anchor="middle" dominant-baseline="central">answer 3</text></g><g class="u"><rect x="544" y="92" width="72" height="26" rx="3"/><text class="sub" x="580.0" y="105.0" text-anchor="middle" dominant-baseline="central">A: turn 4</text></g><g class="m"><rect x="462" y="150" width="120" height="26" rx="3"/><text class="sub" x="522.0" y="163.0" text-anchor="middle" dominant-baseline="central">answer 3, retried</text></g><g class="m"><rect x="174" y="208" width="72" height="26" rx="3"/><text class="sub" x="210.0" y="221.0" text-anchor="middle" dominant-baseline="central">B: turn 1</text></g><text class="sub2" x="110.0" y="132" text-anchor="middle">2,000 tokens</text><text class="sub2" x="210.0" y="132" text-anchor="middle">400 tokens</text><text class="sub2" x="298.0" y="132" text-anchor="middle">350 tokens</text><text class="sub2" x="398.0" y="132" text-anchor="middle">120 tokens</text><text class="sub2" x="495.0" y="132" text-anchor="middle">280 tokens</text><text class="sub2" x="580.0" y="132" text-anchor="middle">300 tokens</text><text class="sub2" x="522.0" y="190" text-anchor="middle">260 tokens</text><text class="sub2" x="210.0" y="248" text-anchor="middle">500 tokens</text><line class="tick" x1="174" y1="80" x2="616" y2="80"/><line class="tick" x1="174" y1="80" x2="174" y2="85"/><line class="tick" x1="616" y1="80" x2="616" y2="85"/><text class="sub2" x="395.0" y="74" text-anchor="middle">one conversation: each turn a node below the last</text><text class="sub2" x="448" y="167" text-anchor="end">a retry forks where the answers differ</text><text class="sub2" x="258" y="225" text-anchor="start">another user branches after the system prompt</text><text class="cap" x="40" y="286" text-anchor="start">RadixAttention keeps the keys and values of every prompt and of every generated answer</text><text class="cap" x="40" y="306" text-anchor="start">in this tree. Each request's prompt is the whole conversation so far, so a new turn</text><text class="cap" x="40" y="326" text-anchor="start">walks the entire path, hits all of it, and adds one node at the end. Turn 4 hangs below</text><text class="cap" x="40" y="346" text-anchor="start">turn 3 because its prompt contains turn 3.</text><text class="cap" x="40" y="386" text-anchor="start">Branches appear only where two cached texts first differ. A second user shares only the</text><text class="cap" x="40" y="406" text-anchor="start">system prompt, so B branches right after it. Retrying answer 3 produces a second answer</text><text class="cap" x="40" y="426" text-anchor="start">to the same question, so the node that held question 3 and its answer was split where</text><text class="cap" x="40" y="446" text-anchor="start">the two answers begin.</text></svg><figcaption>Token counts illustrative. The shape of the tree is the history of the traffic: the system prompt at the trunk, each conversation a branch, each retry a fork.</figcaption></figure>
