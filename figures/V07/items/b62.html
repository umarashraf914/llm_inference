x="3"/></g><text class="sub2" x="440" y="243" text-anchor="start">23.9%</text><text class="sub2" x="540" y="243" text-anchor="start">24.2%</text><text class="cap" x="40" y="269" text-anchor="start">blue</text><g class="s"><rect x="120" y="254" width="64.87074839730151" height="20" rx="3"/></g><text class="sub2" x="440" y="269" text-anchor="start">21.6%</text><text class="sub2" x="540" y="269" text-anchor="start">21.9%</text><text class="cap" x="40" y="295" text-anchor="start">green</text><g class="s"><rect x="120" y="280" width="58.69748048587465" height="20" rx="3"/></g><text class="sub2" x="440" y="295" text-anchor="start">19.6%</text><text class="sub2" x="540" y="295" text-anchor="start">19.8%</text><text class="cap" x="40" y="321" text-anchor="start">gold</text><g class="s"><rect x="120" y="306" width="53.11167668805495" height="20" rx="3"/></g><text class="sub2" x="440" y="321" text-anchor="start">17.7%</text><text class="sub2" x="540" y="321" text-anchor="start">17.9%</text><text class="cap" x="40" y="347" text-anchor="start">grey</text><g class="s"><rect x="120" y="332" width="48.05743240198031" height="20" rx="3"/></g><text class="sub2" x="440" y="347" text-anchor="start">16.0%</text><text class="sub2" x="540" y="347" text-anchor="start">16.2%</text><text class="cap" x="40" y="373" text-anchor="start">the</text><rect x="120" y="358" width="3.5693974642885475" height="20" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="440" y="373" text-anchor="start">1.2%</text><text class="sub2" x="440" y="218" text-anchor="start">share</text><text class="sub2" x="540" y="218" text-anchor="start">kept, rescaled</text><line class="mark xok" x1="127.16932645625" y1="224" x2="127.16932645625" y2="380"/><text class="sub2" x="131.16932645625002" y="392" text-anchor="start">cut at 2.39%</text><text class="cap" x="40" y="424" text-anchor="start">Min-p sets its cut-off by scaling the top token's probability, keeping only tokens
