<figure><div class='ts'>Fig 14 &nbsp;&middot;&nbsp; 17:15</div><h3>What a prefix is worth</h3><svg viewBox="0 0 680 442" role="img"><title>What a prefix is worth</title><text class="cap" x="40" y="78" text-anchor="start">Normal input price</text><g class="u"><rect x="280" y="62" width="300" height="32" rx="3"></rect><text class="sub" x="430.0" y="78.0" text-anchor="middle" dominant-baseline="central">1.00</text></g><text class="cap" x="40" y="138" text-anchor="start">Reading a cached prompt</text><g class="s"><rect x="280" y="122" width="30" height="32" rx="3"></rect></g><text class="sub2" x="320" y="141" text-anchor="start">0.10</text><text class="cap" x="40" y="198" text-anchor="start">Writing the cache</text><g class="m"><rect x="280" y="182" width="375" height="32" rx="3"></rect><text class="sub" x="467.5" y="198.0" text-anchor="middle" dominant-baseline="central">1.25, for a five-minute lifetime</text></g><text class="cap" x="40" y="260" text-anchor="start">So a prefix used twice has already paid for itself: 1.25 plus 0.10 against 2.00 for two fresh</text><text class="cap" x="40" y="280" text-anchor="start">reads.</text><text class="cap" x="40" y="320" text-anchor="start">Agents lean on this hardest, because an agent replays its whole accumulated history on every</text><text class="cap" x="40" y="340" text-anchor="start">single step and almost all of it is a prefix it has sent before.</text><text class="cap" x="40" y="380" text-anchor="start">One consequence reaches up into the cluster. A cached prefix lives in one replica's memory, so a</text><text class="cap" x="40" y="400" text-anchor="start">request only benefits if it lands on that replica, and routing has to become cache-aware: send</text><text class="cap" x="40" y="420" text-anchor="start">each request to the machine already holding its prefix, not to whichever machine is least busy.</text></svg><figcaption>The pricing is the clearest statement of the value. A tenfold discount on cached reads is a direct measurement of how much of prefill was redundant.</figcaption></figure>
