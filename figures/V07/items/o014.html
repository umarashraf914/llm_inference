<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 17:35</div><h3>A cached read costs a tenth, and a write costs a quarter more</h3><svg viewBox='0 0 680 426' role='img'><title>A cached read costs a tenth, and a write costs a quarter more</title><text class="hd" x="40" y="46">Price of one input token, as a multiple of the normal price</text><text class="cap" x="40" y="89" text-anchor="start">normal input</text><g class="u"><rect x="230" y="70" width="140.0" height="28" rx="3"/></g><text class="sub2" x="380.0" y="89" text-anchor="start">1.00</text><text class="cap" x="40" y="131" text-anchor="start">cache write, kept 5 minutes</text><g class="m"><rect x="230" y="112" width="175.0" height="28" rx="3"/></g><text class="sub2" x="415.0" y="131" text-anchor="start">1.25 · Anthropic</text><text class="cap" x="40" y="173" text-anchor="start">cache write, kept an hour</text><g class="m"><rect x="230" y="154" width="280.0" height="28" rx="3"/></g><text class="sub2" x="520.0" y="173" text-anchor="start">2.00 · Anthropic</text><text class="cap" x="40" y="215" text-anchor="start">cache read</text><g class="s"><rect x="230" y="196" width="14.0" height="28" rx="3"/></g><text class="sub2" x="254.0" y="215" text-anchor="start">0.10 · Anthropic and OpenAI</text><text class="cap" x="40" y="274" text-anchor="start">Anthropic and OpenAI both bill a cached prompt read at a tenth of the normal input price</text><text class="cap" x="40" y="294" text-anchor="start">on most recent models, and a few newer models charge less still. Writing the cache can</text><text class="cap" x="40" y="314" text-anchor="start">cost extra: Anthropic charges 1.25 times normal for an entry kept five minutes and 2</text><text class="cap" x="40" y="334" text-anchor="start">times for one kept an hour, and each read restarts the clock.</text><text class="cap" x="40" y="374" text-anchor="start">The prices follow the work. A write is a normal prefill plus the memory to hold its keys</text><text class="cap" x="40" y="394" text-anchor="start">and values for the lifetime; a read skips the prefill and only loads what is stored.</text></svg><figcaption>Bars to scale. A price is a business decision, not a measurement, but a tenfold discount is the provider's own estimate of what a hit saves. Prices change, and differ by model.</figcaption></figure>
