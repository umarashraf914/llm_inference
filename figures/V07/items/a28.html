tion in the sorted line. Sort the measurements and count from the</text><text class="cap" x="40" y="528" text-anchor="start">fastest: the 90th percentile, p90, is the value 90% of them do not exceed, here the 90th</text><text class="cap" x="40" y="548" text-anchor="start">of 100; p99 is the 99th. The median is p50 ({{fig:v07-a17}}), and the slow end of the line is</text><text class="cap" x="40" y="568" text-anchor="start">the tail.</text><text class="cap" x="40" y="608" text-anchor="start">Admitted whole, each of three 2,000-token prompts makes one gap of 33.0 ms: the median</text><text class="cap" x="40" y="628" text-anchor="start">stays 6.04 ms but p99 is 33.0 ms. Under a 512-token budget each prompt makes four gaps</text><text class="cap" x="40" y="648" text-anchor="start">of 8.31 ms instead: the median is unchanged and p99 falls to 8.31 ms. The averages,</text><text class="cap" x="40" y="668" text-anchor="start">6.85 ms and 6.32 ms, hardly tell the two apart.</text><text class="cap" x="40" y="708" text-anchor="start">Sarathi-Serve was judged on exactly this, the 99th percentile of the time between</text><text class="cap" x="40" y="728" text-anchor="start">tokens, because every token produces one such gap and readers notice the worst ones.</text></svg><figcaption>Chunking leaves the median where it was and cuts the tail four times. Judged on the median or the average, the stalls would not exist.</figcaption></figure>
