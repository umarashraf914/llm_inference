<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:39</div><h3>One request at a time gets one token per read of the weights</h3><svg viewBox='0 0 680 586' role='img'><title>One request at a time gets one token per read of the weights</title><text class="hd" x="40" y="46">One decode step of the series' 70B model on an H100, drawn to scale in time</text><text class="cap" x="40" y="94" text-anchor="start">memory</text><g class="h"><rect x="150" y="72" width="480" height="34" rx="3"/><text class="sub" x="390.0" y="89.0" text-anchor="middle" dominant-baseline="central">reading 140 GB of weights at 3.35 TB/s: 41.8 ms</text></g><text class="cap" x="40" y="144" text-anchor="start">arithmetic</text><rect x="150" y="122" width="480" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="150" y="122" width="2" height="34" rx="1"/></g><text class="sub2" x="162" y="143" text-anchor="start">busy 0.142 ms: 140 billion operations at 989 trillion a second</text><line class="tick" x1="150.0" y1="162" x2="150.0" y2="167"/><text class="sub2" x="150.0" y="181" text-anchor="middle">0 ms</text><line class="tick" x1="264.8571428571429" y1="162" x2="264.8571428571429" y2="167"/><text class="sub2" x="264.9" y="181" text-anchor="middle">10</text><line class="tick" x1="379.7142857142857" y1="162" x2="379.7142857142857" y2="167"/><text class="sub2" x="379.7" y="181" text-anchor="middle">20</text><line class="tick" x1="494.57142857142856" y1="162" x2="494.57142857142856" y2="167"/><text class="sub2" x="494.6" y="181" text-anchor="middle">30</text><line class="tick" x1="609.4285714285714" y1="162" x2="609.4285714285714" y2="167"/><text class="sub2" x="609.4" y="181" text-anchor="middle">40 ms</text><g class="m"><rect x="90" y="456" width="500" height="42" rx="6"/><text class="sub" x="340.0" y="477.0" text-anchor="middle" dominant-baseline="central">how many tokens does the system get out of each full read of the weights?</text></g><text class="cap" x="40" y="226" text-anchor="start">To produce one token, the chip reads every weight out of high-bandwidth memory and</text><text class="cap" x="40" y="246" text-anchor="start">multiplies it against the token's vector, a thin matrix-vector product</text><text class="cap" x="40" y="266" text-anchor="start">({{fig:v01-o085}}). For the series' 70-billion-parameter example that is 140 GB of</text><text class="cap" x="40" y="286" text-anchor="start">reading against 140 billion operations ({{fig:v01-o114}}).</text><text class="cap" x="40" y="326" text-anchor="start">The read takes 41.8 ms and the arithmetic 0.142 ms, so the arithmetic units are busy</text><text class="cap" x="40" y="346" text-anchor="start">0.34% of the step: the tensor cores barely warm up. (140 GB is more than one 80 GB card</text><text class="cap" x="40" y="366" text-anchor="start">holds. Split over two cards, both times halve and their ratio stays.)</text><text class="cap" x="40" y="406" text-anchor="start">Nothing about that read was specific to the request. The same 140 GB would have crossed</text><text class="cap" x="40" y="426" text-anchor="start">the bus whether one user was connected or 64.</text><text class="cap" x="40" y="534" text-anchor="start">Serving one request at a time, it gets exactly one. Nearly every technique below is a</text><text class="cap" x="40" y="554" text-anchor="start">way of raising that number.</text></svg><figcaption>Drawn to scale: the arithmetic is a sliver two pixels wide. Carry the question through the whole document, and when a new technique appears, ask what it does to tokens per weight read.</figcaption></figure>
