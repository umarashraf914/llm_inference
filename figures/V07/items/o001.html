<figure><div class='ts'>Fig 01 &nbsp;&middot;&nbsp; 0:24</div><h3>The question this episode answers</h3><svg viewBox="0 0 680 386" role="img"><title>The question this episode answers</title><text class="hd" x="40" y="46">The worst case: one GPU, one request</text><g class="h"><rect x="40" y="70" width="160" height="40" rx="4"></rect><text class="sub" x="120.0" y="90.0" text-anchor="middle" dominant-baseline="central">read every weight</text></g><line class="conn" x1="206" y1="90" x2="226" y2="90" marker-end="url(#arw)"></line><g class="u"><rect x="232" y="70" width="190" height="40" rx="4"></rect><text class="sub" x="327.0" y="90.0" text-anchor="middle" dominant-baseline="central">thin matrix-vector product</text></g><line class="conn" x1="428" y1="90" x2="448" y2="90" marker-end="url(#arw)"></line><g class="s"><rect x="454" y="70" width="186" height="40" rx="4"></rect><text class="sub" x="547.0" y="90.0" text-anchor="middle" dominant-baseline="central">write one token back</text></g><text class="cap" x="40" y="148" text-anchor="start">The tensor cores barely warm up. Arithmetic intensity sits far to the left of the roofline's</text><text class="cap" x="40" y="168" text-anchor="start">ridge, and the chip spends nearly all its time waiting on memory.</text><text class="cap" x="40" y="208" text-anchor="start">And nothing about that expensive read was specific to the request. The same full pass over the</text><text class="cap" x="40" y="228" text-anchor="start">weights would have happened whether one user was connected or sixty-four.</text><g class="m"><rect x="90" y="260" width="500" height="42" rx="6"></rect><text class="sub" x="340.0" y="281.0" text-anchor="middle" dominant-baseline="central">how many tokens does the system get out of each full read of the weights?</text></g><text class="cap" x="40" y="344" text-anchor="start">Serving one request at a time, it gets exactly one. Nearly every technique below is a way of</text><text class="cap" x="40" y="364" text-anchor="start">raising that number.</text></svg><figcaption>One sentence to carry through the whole document. When a new technique appears, ask what it does to tokens-per-weight-read.</figcaption></figure>
