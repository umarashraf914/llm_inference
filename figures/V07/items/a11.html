<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:44</div><h3>Out of room at 55 requests, out of arithmetic at 295</h3><svg viewBox='0 0 680 358' role='img'><title>Out of room at 55 requests, out of arithmetic at 295</title><text class="hd" x="40" y="46">Requests the card can hold, against requests the ridge needs, on one scale</text><text class="cap" x="40" y="88" text-anchor="start">fit at 8,192 tokens</text><g class="h"><rect x="200" y="70" width="55.0" height="26" rx="2"/></g><text class="sub2" x="265.0" y="88" text-anchor="start">55 requests</text><text class="cap" x="40" y="128" text-anchor="start">fit at 2,048 tokens</text><g class="h"><rect x="200" y="110" width="223.0" height="26" rx="2"/></g><text class="sub2" x="433.0" y="128" text-anchor="start">223</text><text class="cap" x="40" y="168" text-anchor="start">the ridge needs</text><g class="m"><rect x="200" y="150" width="295.0" height="26" rx="2"/></g><text class="sub2" x="505.0" y="168" text-anchor="start">295 sharing each read</text><text class="cap" x="40" y="226" text-anchor="start">At 8,192 tokens of context the card holds 55 requests; at 2,048 it holds 223. Reaching</text><text class="cap" x="40" y="246" text-anchor="start">the ridge, counting the weights alone, takes 295 requests sharing each read: more than</text><text class="cap" x="40" y="266" text-anchor="start">the card holds at either length.</text><text class="cap" x="40" y="306" text-anchor="start">And 295 would not be enough anyway. With the caches counted, 55 requests at 8,192 tokens</text><text class="cap" x="40" y="326" text-anchor="start">run at 14.9 operations per byte, and no batch passes 19.0 at that length ({{fig:v07-a09}}).</text></svg><figcaption>The arithmetic units are not what runs out. Memory runs out first, which is why the rest of this part is about memory.</figcaption></figure>
