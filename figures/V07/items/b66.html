<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 26:29</div><h3>A machine that tracks depth needs a state for every depth</h3><svg viewBox='0 0 680 448' role='img'><title>A machine that tracks depth needs a state for every depth</title><text class="hd" x="40" y="46">Depth as states: [ moves one state right, ] one state left</text><g class="u"><rect x="60" y="86" width="56" height="30" rx="15"/><text class="sub" x="88.0" y="101.0" text-anchor="middle" dominant-baseline="central">depth 0</text></g><line class="conn" x1="120" y1="94" x2="176" y2="94" marker-end="url(#arw)"/><text class="sub2" x="148.0" y="84" text-anchor="middle">[</text><line class="conn" x1="176" y1="108" x2="120" y2="108" marker-end="url(#arw)"/><text class="sub2" x="148.0" y="126" text-anchor="middle">]</text><g class="u"><rect x="180" y="86" width="56" height="30" rx="15"/><text class="sub" x="208.0" y="101.0" text-anchor="middle" dominant-baseline="central">depth 1</text></g><line class="conn" x1="240" y1="94" x2="296" y2="94" marker-end="url(#arw)"/><text class="sub2" x="268.0" y="84" text-anchor="middle">[</text><line class="conn" x1="296" y1="108" x2="240" y2="108" marker-end="url(#arw)"/><text class="sub2" x="268.0" y="126" text-anchor="middle">]</text><g class="u"><rect x="300" y="86" width="56" height="30" rx="15"/><text class="sub" x="328.0" y="101.0" text-anchor="middle" dominant-baseline="central">depth 2</text></g><line class="conn" x1="360" y1="94" x2="416" y2="94" marker-end="url(#arw)"/><text class="sub2" x="388.0" y="84" text-anchor="middle">[</text><line class="conn" x1="416" y1="108" x2="360" y2="108" marker-end="url(#arw)"/><text class="sub2" x="388.0" y="126" text-anchor="middle">]</text><g class="u"><rect x="420" y="86" width="56" height="30" rx="15"/><text class="sub" x="448.0" y="101.0" text-anchor="middle" dominant-baseline="central">depth 3</text></g><line class="conn" x1="480" y1="94" x2="536" y2="94" stroke-dasharray="3 3" marker-end="url(#arw)"/><text class="sub2" x="508.0" y="84" text-anchor="middle">[</text><rect x="540" y="86" width="56" height="30" rx="15" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="568.0" y="101.0" text-anchor="middle" dominant-baseline="central">depth 4</text><text class="sub2" x="568" y="140" text-anchor="middle">no such state: reject</text><text class="cap" x="40" y="187" text-anchor="start">fed [[[[</text><g class="u"><rect x="160" y="170" width="50" height="26" rx="3"/><text class="sub" x="185.0" y="183.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="220" y="170" width="50" height="26" rx="3"/><text class="sub" x="245.0" y="183.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="u"><rect x="280" y="170" width="50" height="26" rx="3"/><text class="sub" x="305.0" y="183.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="h"><rect x="340" y="170" width="50" height="26" rx="3"/><text class="sub" x="365.0" y="183.0" text-anchor="middle" dominant-baseline="central">✗</text></g><text class="cap" x="40" y="236" text-anchor="start">A grammar is a set of rules for which texts are valid. Grammars that nest, like JSON's</text><text class="cap" x="40" y="256" text-anchor="start">or SQL's, which let a structure sit inside another to any depth, need more, because a</text><text class="cap" x="40" y="276" text-anchor="start">state machine cannot remember how many brackets are still open. To track depth it needs</text><text class="cap" x="40" y="296" text-anchor="start">a state for each depth: an opening bracket moves it one state right, a closing one one</text><text class="cap" x="40" y="316" text-anchor="start">state left.</text><text class="cap" x="40" y="356" text-anchor="start">With states for depths 0 to 3, the machine follows three open brackets and refuses a</text><text class="cap" x="40" y="376" text-anchor="start">fourth, though [[[[]]]] is perfectly good JSON. A machine with d + 1 states handles</text><text class="cap" x="40" y="396" text-anchor="start">depth d and fails at d + 1, and JSON sets no limit on depth, so no finite number of</text><text class="cap" x="40" y="416" text-anchor="start">states is enough.</text></svg><figcaption>The problem is not speed but memory: a finite machine can only count as high as it has states.</figcaption></figure>
