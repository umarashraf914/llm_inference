<figure><div class='ts'>Fig 25 &nbsp;&middot;&nbsp; 27:57</div><h3>The whole stack as one chain</h3><svg viewBox="0 0 680 522" role="img"><title>The whole stack as one chain</title><text class="hd" x="40" y="46">Each fix creates the problem the next one solves</text><g class="h"><rect x="40" y="70" width="270" height="36" rx="4"></rect><text class="sub" x="175.0" y="88.0" text-anchor="middle" dominant-baseline="central">one read serves one token</text></g><line class="conn" x1="316" y1="88" x2="336" y2="88" marker-end="url(#arw)"></line><g class="s"><rect x="342" y="70" width="298" height="36" rx="4"></rect><text class="sub" x="491.0" y="88.0" text-anchor="middle" dominant-baseline="central">batch the requests</text></g><g class="h"><rect x="40" y="122" width="270" height="36" rx="4"></rect><text class="sub" x="175.0" y="140.0" text-anchor="middle" dominant-baseline="central">static batches drain</text></g><line class="conn" x1="316" y1="140" x2="336" y2="140" marker-end="url(#arw)"></line><g class="s"><rect x="342" y="122" width="298" height="36" rx="4"></rect><text class="sub" x="491.0" y="140.0" text-anchor="middle" dominant-baseline="central">schedule one iteration at a time</text></g><g class="h"><rect x="40" y="174" width="270" height="36" rx="4"></rect><text class="sub" x="175.0" y="192.0" text-anchor="middle" dominant-baseline="central">caches cap how many fit</text></g><line class="conn" x1="316" y1="192" x2="336" y2="192" marker-end="url(#arw)"></line><g class="s"><rect x="342" y="174" width="298" height="36" rx="4"></rect><text class="sub" x="491.0" y="192.0" text-anchor="middle" dominant-baseline="central">page the cache</text></g><g class="h"><rect x="40" y="226" width="270" height="36" rx="4"></rect><text class="sub" x="175.0" y="244.0" text-anchor="middle" dominant-baseline="central">admitting work stalls generation</text></g><line class="conn" x1="316" y1="244" x2="336" y2="244" marker-end="url(#arw)"></line><g class="s"><rect x="342" y="226" width="298" height="36" rx="4"></rect><text class="sub" x="491.0" y="244.0" text-anchor="middle" dominant-baseline="central">slice prefills into chunks</text></g><g class="h"><rect x="40" y="278" width="270" height="36" rx="4"></rect><text class="sub" x="175.0" y="296.0" text-anchor="middle" dominant-baseline="central">the phases want different hardware</text></g><line class="conn" x1="316" y1="296" x2="336" y2="296" marker-end="url(#arw)"></line><g class="s"><rect x="342" y="278" width="298" height="36" rx="4"></rect><text class="sub" x="491.0" y="296.0" text-anchor="middle" dominant-baseline="central">split into separate pools</text></g><g class="h"><rect x="40" y="330" width="270" height="36" rx="4"></rect><text class="sub" x="175.0" y="348.0" text-anchor="middle" dominant-baseline="central">shared prompts get recomputed</text></g><line class="conn" x1="316" y1="348" x2="336" y2="348" marker-end="url(#arw)"></line><g class="s"><rect x="342" y="330" width="298" height="36" rx="4"></rect><text class="sub" x="491.0" y="348.0" text-anchor="middle" dominant-baseline="central">store prefixes in a tree</text></g><text class="cap" x="40" y="400" text-anchor="start">Around all of it, the scheduler defends goodput by choosing what to refuse, and the sampler and</text><text class="cap" x="40" y="420" text-anchor="start">the constraint machinery decide what actually comes out.</text><text class="cap" x="40" y="460" text-anchor="start">Now look at what every one of those has in common. Each raises the number of tokens produced per</text><text class="cap" x="40" y="480" text-anchor="start">read of the weights, and each does it the same way: by putting more requests behind that one</text><text class="cap" x="40" y="500" text-anchor="start">read.</text></svg><figcaption>Six repairs, one target. Reading it as a chain rather than a list is what makes the design feel inevitable rather than arbitrary.</figcaption></figure>
