<figure><div class='ts'>Fig 04 &nbsp;&middot;&nbsp; 3:17</div><h3>Why a static batch drains</h3><svg viewBox="0 0 680 510" role="img"><title>Why a static batch drains</title><text class="hd" x="40" y="46">Four requests needing 8, 24, 60 and 512 decode steps</text><text class="sub2" x="40" y="92" text-anchor="start">request 1</text><g class="m"><rect x="150" y="74" width="6.5625" height="30" rx="3"></rect></g><rect x="150" y="74" width="420" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="614" y="92" text-anchor="end">8</text><text class="sub2" x="40" y="134" text-anchor="start">request 2</text><g class="m"><rect x="150" y="116" width="19.6875" height="30" rx="3"></rect></g><rect x="150" y="116" width="420" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="614" y="134" text-anchor="end">24</text><text class="sub2" x="40" y="176" text-anchor="start">request 3</text><g class="m"><rect x="150" y="158" width="49.21875" height="30" rx="3"></rect></g><rect x="150" y="158" width="420" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="614" y="176" text-anchor="end">60</text><text class="sub2" x="40" y="218" text-anchor="start">request 4</text><g class="m"><rect x="150" y="200" width="420.0" height="30" rx="3"></rect></g><rect x="150" y="200" width="420" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="614" y="218" text-anchor="end">512</text><text class="cap" x="40" y="268" text-anchor="start">The batch is locked for 512 steps, because that is when the last one finishes. The first</text><text class="cap" x="40" y="288" text-anchor="start">request is done after eight, and its slot keeps running for the remaining 504.</text><text class="cap" x="40" y="328" text-anchor="start">Work delivered</text><g class="s"><rect x="240" y="312" width="88" height="30" rx="3"></rect></g><text class="sub2" x="340" y="331" text-anchor="start">under a third of the room it had</text><text class="cap" x="40" y="388" text-anchor="start">For the final 452 steps a single request is active while three slots compute nothing anyone</text><text class="cap" x="40" y="408" text-anchor="start">asked for. And a finished request cannot even be returned to its user until the whole batch</text><text class="cap" x="40" y="428" text-anchor="start">drains.</text><text class="cap" x="40" y="468" text-anchor="start">So tokens per weight read slide back toward one, exactly when a long generation is holding the</text><text class="cap" x="40" y="488" text-anchor="start">batch open.</text></svg><figcaption>The first serving systems scheduled at the granularity of a whole request. The waste is not subtle: two thirds of the capacity, on a realistic mix of lengths.</figcaption></figure>
