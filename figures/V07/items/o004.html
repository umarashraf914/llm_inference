<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:07</div><h3>A static batch drains to a single survivor</h3><svg viewBox='0 0 680 730' role='img'><title>A static batch drains to a single survivor</title><text class="hd" x="40" y="46">Four requests that need 8, 24, 60 and 512 decode steps, locked together</text><text class="cap" x="40" y="87" text-anchor="start">request 1, 8 steps</text><rect x="182" y="68" width="448" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="182" y="68" width="7.0" height="26" rx="2"/></g><text class="sub2" x="406.0" y="85" text-anchor="middle">seat held, computing nothing anyone asked for</text><text class="cap" x="40" y="125" text-anchor="start">request 2, 24 steps</text><rect x="182" y="106" width="448" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="182" y="106" width="21.0" height="26" rx="2"/></g><text class="cap" x="40" y="163" text-anchor="start">request 3, 60 steps</text><rect x="182" y="144" width="448" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="182" y="144" width="52.5" height="26" rx="2"/></g><text class="cap" x="40" y="201" text-anchor="start">request 4, 512 steps</text><rect x="182" y="182" width="448" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="182" y="182" width="448.0" height="26" rx="2"/></g><line class="tick" x1="182.0" y1="224" x2="182.0" y2="229"/><text class="sub2" x="182.0" y="243" text-anchor="middle">0</text><line class="tick" x1="294.0" y1="224" x2="294.0" y2="229"/><text class="sub2" x="294.0" y="243" text-anchor="middle">128</text><line class="tick" x1="406.0" y1="224" x2="406.0" y2="229"/><text class="sub2" x="406.0" y="243" text-anchor="middle">256</text><line class="tick" x1="518.0" y1="224" x2="518.0" y2="229"/><text class="sub2" x="518.0" y="243" text-anchor="middle">384</text><line class="tick" x1="630.0" y1="224" x2="630.0" y2="229"/><text class="sub2" x="630.0" y="243" text-anchor="end">512 steps</text><text class="cap" x="40" y="298" text-anchor="start">tokens per read</text><g class="s"><rect x="182.0" y="266" width="7.0" height="36" rx="1"/></g><g class="s"><rect x="189.0" y="275" width="14.0" height="27" rx="1"/></g><g class="s"><rect x="203.0" y="284" width="31.5" height="18" rx="1"/></g><g class="s"><rect x="234.5" y="293" width="395.5" height="9" rx="1"/></g><text class="sub2" x="182" y="320" text-anchor="start">4, then 3, then 2, then 1 for the last 452 steps</text><text class="cap" x="40" y="366" text-anchor="start">seats used</text><rect x="182" y="348" width="240" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="182" y="348" width="70.78125" height="26" rx="2"/></g><text class="sub2" x="434" y="366" text-anchor="start">604 of 2,048 seat-steps, 29.5%</text><text class="cap" x="40" y="418" text-anchor="start">That N is not a number anyone sets: it is however many requests are generating at that</text><text class="cap" x="40" y="438" text-anchor="start">step. The first serving systems fixed it when the batch formed. They scheduled whole</text><text class="cap" x="40" y="458" text-anchor="start">requests: collect a batch, run it, and hold its membership until every sequence has</text><text class="cap" x="40" y="478" text-anchor="start">emitted its end-of-sequence token, the stop signal a model produces when its answer is</text><text class="cap" x="40" y="498" text-anchor="start">done ({{fig:v01-o029}}).</text><text class="cap" x="40" y="538" text-anchor="start">Each request holds one of the batch's four seats, its place in every step. Here the</text><text class="cap" x="40" y="558" text-anchor="start">batch is locked for 512 steps, because that is when the last request finishes. The first</text><text class="cap" x="40" y="578" text-anchor="start">is done after 8 and its seat keeps running for the remaining 504; for the final 452</text><text class="cap" x="40" y="598" text-anchor="start">steps one request runs alone.</text><text class="cap" x="40" y="638" text-anchor="start">Seats used: 8 + 24 + 60 + 512 = 604 of 4 × 512 = 2,048, which is 29.5%. Tokens per read</text><text class="cap" x="40" y="658" text-anchor="start">of the weights slide from 4 to 1 and average 604 ÷ 512 = 1.18. And a finished request</text><text class="cap" x="40" y="678" text-anchor="start">cannot be returned to its user until the whole batch drains: the 8-step answer waits 504</text><text class="cap" x="40" y="698" text-anchor="start">steps.</text></svg><figcaption>More than two thirds of the capacity is wasted on this mix, 70.5%. The longest request sets the pace for everyone locked in with it.</figcaption></figure>
