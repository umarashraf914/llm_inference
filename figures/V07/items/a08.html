<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:04</div><h3>Attention's reads stay at 4 operations per byte, at any batch</h3><svg viewBox='0 0 680 562' role='img'><title>Attention's reads stay at 4 operations per byte, at any batch</title><text class="hd" x="40" y="46">One cached key, 128 numbers in one layer, met by the new token's queries</text><g class="m"><rect x="40" y="66" width="116" height="22" rx="3"/><text class="sub" x="98.0" y="77.0" text-anchor="middle" dominant-baseline="central">query head 1</text></g><line class="conn" x1="162" y1="77" x2="236" y2="111" marker-end="url(#arw)"/><g class="m"><rect x="40" y="96" width="116" height="22" rx="3"/><text class="sub" x="98.0" y="107.0" text-anchor="middle" dominant-baseline="central">query head 2</text></g><line class="conn" x1="162" y1="107" x2="236" y2="111" marker-end="url(#arw)"/><g class="m"><rect x="40" y="126" width="116" height="22" rx="3"/><text class="sub" x="98.0" y="137.0" text-anchor="middle" dominant-baseline="central">query head 3</text></g><line class="conn" x1="162" y1="137" x2="236" y2="111" marker-end="url(#arw)"/><g class="m"><rect x="40" y="156" width="116" height="22" rx="3"/><text class="sub" x="98.0" y="167.0" text-anchor="middle" dominant-baseline="central">query head 4</text></g><line class="conn" x1="162" y1="167" x2="236" y2="111" marker-end="url(#arw)"/><g class="h"><rect x="242" y="92" width="210" height="38" rx="3"/><text class="sub" x="347.0" y="111.0" text-anchor="middle" dominant-baseline="central">one key: 128 numbers, 256 bytes</text></g><text class="sub2" x="242" y="152" text-anchor="start">each query head: 128 multiply-adds = 256 operations</text><text class="sub2" x="242" y="170" text-anchor="start">4 heads: 1,024 operations on 256 bytes = 4 per byte</text><text class="hd" x="40" y="222">The same ratio at any batch, with 2,048 tokens cached per request</text><text class="sub2" x="90" y="248" text-anchor="end">batch</text><text class="sub2" x="300" y="248" text-anchor="end">attention operations</text><text class="sub2" x="440" y="248" text-anchor="end">cache bytes read</text><text class="sub2" x="600" y="248" text-anchor="end">per byte</text><text class="cap" x="90" y="272" text-anchor="end">1</text><text class="sub2" x="300" y="272" text-anchor="end">1.1 billion</text><text class="sub2" x="440" y="272" text-anchor="end">268 MB</text><text class="sub2" x="600" y="272" text-anchor="end">4</text><text class="cap" x="90" y="296" text-anchor="end">8</text><text class="sub2" x="300" y="296" text-anchor="end">8.6 billion</text><text class="sub2" x="440" y="296" text-anchor="end">2.15 GB</text><text class="sub2" x="600" y="296" text-anchor="end">4</text><text class="cap" x="90" y="320" text-anchor="end">64</text><text class="sub2" x="300" y="320" text-anchor="end">68.7 billion</text><text class="sub2" x="440" y="320" text-anchor="end">17.18 GB</text><text class="sub2" x="600" y="320" text-anchor="end">4</text><text class="cap" x="40" y="370" text-anchor="start">For each new token, every one of the 32 query heads compares itself with each cached key</text><text class="cap" x="40" y="390" text-anchor="start">and then blends the cached values ({{fig:v01-o094}}). Grouped-query attention lets 4</text><text class="cap" x="40" y="410" text-anchor="start">query heads share one key-value head ({{fig:v03-o089}}), so each cached number, once</text><text class="cap" x="40" y="430" text-anchor="start">read, is used 4 times: 4 multiply-adds, 8 operations, for its 2 bytes. The values work</text><text class="cap" x="40" y="450" text-anchor="start">the same way.</text><text class="cap" x="40" y="490" text-anchor="start">That ratio belongs to the cache, not to the batch. A second request brings a second</text><text class="cap" x="40" y="510" text-anchor="start">cache: twice the operations and twice the bytes. At batch 1 or batch 1,000 attention</text><text class="cap" x="40" y="530" text-anchor="start">runs at 4 operations per byte, against the 295 the chip needs.</text></svg><figcaption>Batching multiplies the cache reads along with the work, so the ratio never moves. Attention stays on the memory-bound floor however large the batch grows.</figcaption></figure>
