<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 16:19</div><h3>A tree gives every node exactly one path from the root</h3><svg viewBox='0 0 680 502' role='img'><title>A tree gives every node exactly one path from the root</title><text class="hd" x="40" y="46">Folders on a disk form a tree: one root, and one path to every file</text><line class="conn" x1="96" y1="89.0" x2="126" y2="89.0"/><line class="conn" x1="168" y1="89.0" x2="198" y2="89.0"/><line class="conn" x1="246" y1="89.0" x2="276" y2="89.0"/><line class="conn" x1="246" y1="89.0" x2="261.0" y2="89.0"/><line class="conn" x1="261.0" y1="89.0" x2="261.0" y2="129.0"/><line class="conn" x1="261.0" y1="129.0" x2="276" y2="129.0"/><line class="conn" x1="168" y1="89.0" x2="183.0" y2="89.0"/><line class="conn" x1="183.0" y1="89.0" x2="183.0" y2="169.0"/><line class="conn" x1="183.0" y1="169.0" x2="198" y2="169.0"/><line class="conn" x1="234" y1="169.0" x2="264" y2="169.0"/><line class="conn" x1="96" y1="89.0" x2="111.0" y2="89.0"/><line class="conn" x1="111.0" y1="89.0" x2="111.0" y2="209.0"/><line class="conn" x1="111.0" y1="209.0" x2="126" y2="209.0"/><line class="conn" x1="162" y1="209.0" x2="192" y2="209.0"/><g class="s"><rect x="70" y="76" width="26" height="26" rx="3"/><text class="sub" x="83.0" y="89.0" text-anchor="middle" dominant-baseline="central">/</text></g><g class="s"><rect x="126" y="76" width="42" height="26" rx="3"/><text class="sub" x="147.0" y="89.0" text-anchor="middle" dominant-baseline="central">home</text></g><g class="s"><rect x="198" y="76" width="48" height="26" rx="3"/><text class="sub" x="222.0" y="89.0" text-anchor="middle" dominant-baseline="central">alice</text></g><g class="s"><rect x="276" y="76" width="72" height="26" rx="3"/><text class="sub" x="312.0" y="89.0" text-anchor="middle" dominant-baseline="central">notes.txt</text></g><g class="u"><rect x="276" y="116" width="66" height="26" rx="3"/><text class="sub" x="309.0" y="129.0" text-anchor="middle" dominant-baseline="central">todo.txt</text></g><g class="u"><rect x="198" y="156" width="36" height="26" rx="3"/><text class="sub" x="216.0" y="169.0" text-anchor="middle" dominant-baseline="central">bob</text></g><g class="u"><rect x="264" y="156" width="72" height="26" rx="3"/><text class="sub" x="300.0" y="169.0" text-anchor="middle" dominant-baseline="central">draft.txt</text></g><g class="u"><rect x="126" y="196" width="36" height="26" rx="3"/><text class="sub" x="144.0" y="209.0" text-anchor="middle" dominant-baseline="central">etc</text></g><g class="u"><rect x="192" y="196" width="48" height="26" rx="3"/><text class="sub" x="216.0" y="209.0" text-anchor="middle" dominant-baseline="central">hosts</text></g><text class="sub2" x="83.0" y="118" text-anchor="middle">the root</text><line class="tick" x1="370" y1="80" x2="370" y2="218"/><text class="sub2" x="380" y="145.0" text-anchor="start">leaves: no children</text><text class="sub2" x="198" y="68" text-anchor="start">a node</text><text class="cap" x="40" y="270" text-anchor="start">SGLang, an inference engine, keeps its cached prefixes in a structure called a radix</text><text class="cap" x="40" y="290" text-anchor="start">tree; it calls the feature RadixAttention. First, what a tree is.</text><text class="cap" x="40" y="330" text-anchor="start">A tree is nodes joined by edges. Each edge runs from a parent to a child. The root is</text><text class="cap" x="40" y="350" text-anchor="start">the one node with no parent, and a leaf is a node with no children. Every other node has</text><text class="cap" x="40" y="370" text-anchor="start">exactly one parent, so from the root to any node there is exactly one path.</text><text class="cap" x="40" y="410" text-anchor="start">A file path is such a path: /home/alice/notes.txt names the four nodes passed through,</text><text class="cap" x="40" y="430" text-anchor="start">drawn here in teal. Two files in one folder share the beginning of their paths, and the</text><text class="cap" x="40" y="450" text-anchor="start">tree holds that shared part once: home and alice exist once, for both notes.txt and</text><text class="cap" x="40" y="470" text-anchor="start">todo.txt.</text></svg><figcaption>Swap folder names for tokens and this is the next figure: paths that begin the same way share their beginning, stored once.</figcaption></figure>
