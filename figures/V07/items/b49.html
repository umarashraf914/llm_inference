width="12" height="12" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="448" y="218" text-anchor="start">needed, not there</text><text class="cap" x="40" y="262" text-anchor="start">On one H100 serving Llama 3 8B, take 59.94 GB for caches: 80 GB, less 16.06 GB of</text><text class="cap" x="40" y="282" text-anchor="start">weights and an assumed 4 GB of working space ({{fig:v07-a10}}). In blocks of 16 tokens, 2 MiB</text><text class="cap" x="40" y="302" text-anchor="start">each, that is 28,581 blocks. A request holding about 2,048 tokens needs 128 of them, so</text><text class="cap" x="40" y="322" text-anchor="start">223 requests fit, with 37 blocks to spare.</text><text class="cap" x="40" y="362" text-anchor="start">Every step adds one token to every request, and a request needs a fresh block each time</text><text class="cap" x="40" y="382" text-anchor="start">its length passes a multiple of 16 ({{fig:v07-a14}}). Their lengths differ, so about 223 ÷ 16</text><text class="cap" x="40" y="402" text-anchor="start">≈ 14 need one at each step. The 37 spare blocks last two steps; on the third, 14</text><text class="cap" x="40" y="422" text-anchor="start">requests need a block and 9 are left.</text><text class="cap" x="40" y="462" text-anchor="start">At about 23 ms a step, that is under a tenth of a second. Admitting work against the</text><text class="cap" x="40" y="482" text-anchor="start">caches' size now is a bet on their size later, and when the bet fails something has to</text><text class="cap" x="40" y="502" text-anchor="start">be evicted.</text></svg><figcaption>Every cell drawn is one 2 MiB block. A cache grows with every token, so a full batch is always a few steps from overflowing, and eviction is part of running at capacity rather than an emergency.</figcaption></figure>
