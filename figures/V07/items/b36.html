<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 15:47</div><h3>An agent is a model in a loop that resends everything</h3><svg viewBox='0 0 680 474' role='img'><title>An agent is a model in a loop that resends everything</title><text class="hd" x="40" y="46">One lap: the model writes a call, a program runs it, the result joins the text</text><g class="u"><rect x="40" y="70" width="140" height="46" rx="8"/><text class="lbl" x="110.0" y="84.0" text-anchor="middle" dominant-baseline="central">context</text><text class="sub" x="110.0" y="102.0" text-anchor="middle" dominant-baseline="central">all the text so far</text></g><g class="m"><rect x="220" y="70" width="140" height="46" rx="8"/><text class="lbl" x="290.0" y="84.0" text-anchor="middle" dominant-baseline="central">model</text><text class="sub" x="290.0" y="102.0" text-anchor="middle" dominant-baseline="central">writes a tool call</text></g><g class="u"><rect x="220" y="172" width="140" height="46" rx="8"/><text class="lbl" x="290.0" y="186.0" text-anchor="middle" dominant-baseline="central">tool runs</text><text class="sub" x="290.0" y="204.0" text-anchor="middle" dominant-baseline="central">outside the model</text></g><g class="u"><rect x="40" y="172" width="140" height="46" rx="8"/><text class="lbl" x="110.0" y="186.0" text-anchor="middle" dominant-baseline="central">result</text><text class="sub" x="110.0" y="204.0" text-anchor="middle" dominant-baseline="central">appended as text</text></g><line class="conn" x1="184" y1="93" x2="214" y2="93" marker-end="url(#arw)"/><line class="conn" x1="290" y1="120" x2="290" y2="166" marker-end="url(#arw)"/><line class="conn" x1="216" y1="195" x2="186" y2="195" marker-end="url(#arw)"/><line class="conn" x1="110" y1="168" x2="110" y2="122" marker-end="url(#arw)"/><text class="sub2" x="400" y="70" text-anchor="start">tokens each lap sends</text><text class="cap" x="400" y="97" text-anchor="start">lap 1</text><g class="m"><rect x="448.0" y="82" width="45.0" height="22" rx="3"/></g><text class="sub2" x="501.0" y="97" text-anchor="start">1,000</text><text class="cap" x="400" y="131" text-anchor="start">lap 2</text><g class="s"><rect x="448" y="116" width="45.0" height="22" rx="3"/></g><g class="m"><rect x="493.0" y="116" width="45.0" height="22" rx="3"/></g><text class="sub2" x="546.0" y="131" text-anchor="start">2,000</text><text class="cap" x="400" y="165" text-anchor="start">lap 3</text><g class="s"><rect x="448" y="150" width="90.0" height="22" rx="3"/></g><g class="m"><rect x="538.0" y="150" width="45.0" height="22" rx="3"/></g><text class="sub2" x="591.0" y="165" text-anchor="start">3,000</text><text class="cap" x="400" y="199" text-anchor="start">lap 4</text><g class="s"><rect x="448" y="184" width="135.0" height="22" rx="3"/></g><g class="m"><rect x="583.0" y="184" width="45.0" height="22" rx="3"/></g><text class="sub2" x="636.0" y="199" text-anchor="start">4,000</text><text class="sub2" x="400" y="230" text-anchor="start">10,000 sent, 6,000 of them a repeat</text><text class="cap" x="40" y="262" text-anchor="start">A tool call is text in an agreed shape, such as {"tool": "search", "query": "…"}. The</text><text class="cap" x="40" y="282" text-anchor="start">model only writes it. Ordinary software outside the model reads it, runs the search, and</text><text class="cap" x="40" y="302" text-anchor="start">pastes the result back in as more text ({{fig:v01-o024}}).</text><text class="cap" x="40" y="342" text-anchor="start">The model keeps nothing between laps, so every lap sends the whole context again</text><text class="cap" x="40" y="362" text-anchor="start">({{fig:v01-o020}}). With 1,000 new tokens a lap, lap k sends k thousand tokens, and all but</text><text class="cap" x="40" y="382" text-anchor="start">the newest thousand went out on the lap before.</text><text class="cap" x="40" y="422" text-anchor="start">Four laps send 1,000 + 2,000 + 3,000 + 4,000 = 10,000 tokens, and 6,000 of them are a</text><text class="cap" x="40" y="442" text-anchor="start">repeat. The repeated share only grows: over twenty laps it is 90.5%.</text></svg><figcaption>Token counts illustrative, bars to scale. Agents run through the rest of this document, and this loop is all they are: a model, a tool, and a context resent in full on every lap.</figcaption></figure>
