<figure><div class='ts'>Fig 18 &nbsp;&middot;&nbsp; 20:58</div><h3>Deciding what to refuse</h3><svg viewBox="0 0 680 462" role="img"><title>Deciding what to refuse</title><text class="hd" x="40" y="46">Three ways the scheduler defends goodput</text><g class="s"><rect x="40" y="70" width="190" height="82" rx="8"></rect><text class="lbl" x="135.0" y="102.0" text-anchor="middle" dominant-baseline="central">Fair sharing</text><text class="sub" x="135.0" y="120.0" text-anchor="middle" dominant-baseline="central">count tokens, not requests</text></g><g class="s"><rect x="246" y="70" width="190" height="82" rx="8"></rect><text class="lbl" x="341.0" y="102.0" text-anchor="middle" dominant-baseline="central">Admission control</text><text class="sub" x="341.0" y="120.0" text-anchor="middle" dominant-baseline="central">refuse what cannot finish</text></g><g class="s"><rect x="452" y="70" width="188" height="82" rx="8"></rect><text class="lbl" x="546.0" y="102.0" text-anchor="middle" dominant-baseline="central">Auto-scaling</text><text class="sub" x="546.0" y="120.0" text-anchor="middle" dominant-baseline="central">reshape the pools</text></g><text class="cap" x="40" y="200" text-anchor="start">When one deployment serves many customers, a single heavy user can crowd out the rest, and</text><text class="cap" x="40" y="220" text-anchor="start">counting requests will not catch it because one request can be a hundred times the size of</text><text class="cap" x="40" y="240" text-anchor="start">another. A virtual token counter keeps a running total of what each tenant has consumed and</text><text class="cap" x="40" y="260" text-anchor="start">serves whoever has received the least.</text><text class="cap" x="40" y="300" text-anchor="start">When more requests arrive than the system can possibly finish in budget, accepting all of them</text><text class="cap" x="40" y="320" text-anchor="start">spreads the machine so thin that everyone misses their deadline and goodput goes to zero while</text><text class="cap" x="40" y="340" text-anchor="start">the GPUs sit at full utilisation. Admission control refuses the excess instead, predicting</text><text class="cap" x="40" y="360" text-anchor="start">which requests cannot finish in time and rejecting or deferring them so the remainder lands.</text><text class="cap" x="40" y="400" text-anchor="start">And when the pools themselves are the wrong shape, a planner watches load across prefill and</text><text class="cap" x="40" y="420" text-anchor="start">decode and moves GPUs between them, so the split tracks the traffic actually arriving rather</text><text class="cap" x="40" y="440" text-anchor="start">than the traffic someone assumed at deployment.</text></svg><figcaption>The counter-intuitive one is admission control. Accepting less work can be the only way to deliver more of it on time.</figcaption></figure>
