<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 21:10</div><h3>Defending goodput means deciding what to refuse</h3><svg viewBox='0 0 680 268' role='img'><title>Defending goodput means deciding what to refuse</title><text class="hd" x="40" y="46">Three ways the scheduler defends goodput</text><g class="s"><rect x="40" y="70" width="190" height="82" rx="8"/><text class="lbl" x="135.0" y="94.0" text-anchor="middle" dominant-baseline="central">Fair sharing</text><text class="sub" x="135.0" y="112.0" text-anchor="middle" dominant-baseline="central">count tokens, not requests</text><text class="sub" x="135.0" y="129.0" text-anchor="middle" dominant-baseline="central">virtual token counter</text></g><g class="s"><rect x="246" y="70" width="190" height="82" rx="8"/><text class="lbl" x="341.0" y="94.0" text-anchor="middle" dominant-baseline="central">Admission control</text><text class="sub" x="341.0" y="112.0" text-anchor="middle" dominant-baseline="central">refuse what cannot finish</text><text class="sub" x="341.0" y="129.0" text-anchor="middle" dominant-baseline="central">Mooncake's early rejection</text></g><g class="s"><rect x="452" y="70" width="188" height="82" rx="8"/><text class="lbl" x="546.0" y="94.0" text-anchor="middle" dominant-baseline="central">Autoscaling</text><text class="sub" x="546.0" y="112.0" text-anchor="middle" dominant-baseline="central">reshape the pools</text><text class="sub" x="546.0" y="129.0" text-anchor="middle" dominant-baseline="central">NVIDIA Dynamo's planner</text></g><text class="cap" x="40" y="196" text-anchor="start">When one deployment serves many customers, and more requests arrive than it can finish</text><text class="cap" x="40" y="216" text-anchor="start">in time, the scheduler has to decide whose work runs, what to turn away, and how many</text><text class="cap" x="40" y="236" text-anchor="start">GPUs each pool gets. The next four figures take these in turn.</text></svg><figcaption>The counter-intuitive one is admission control. Accepting less work can be the only way to deliver more of it on time.</figcaption></figure>
