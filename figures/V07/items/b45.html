<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 17:15</div><h3>Routing for hits fights routing for load</h3><svg viewBox='0 0 680 566' role='img'><title>Routing for hits fights routing for load</title><text class="hd" x="40" y="46">A returning conversation, four replicas, and two ways to choose</text><g class="u"><rect x="250" y="64" width="180" height="40" rx="8"/><text class="lbl" x="340.0" y="75.0" text-anchor="middle" dominant-baseline="central">router</text><text class="sub" x="340.0" y="93.0" text-anchor="middle" dominant-baseline="central">next turn of A</text></g><g class="u"><rect x="40" y="158" width="144" height="106" rx="10"/><text class="lbl" x="56" y="180">replica 1</text></g><text class="sub2" x="56" y="200" text-anchor="start">3 waiting</text><g class="u"><rect x="56" y="208" width="12" height="12" rx="3"/></g><g class="u"><rect x="74" y="208" width="12" height="12" rx="3"/></g><g class="u"><rect x="92" y="208" width="12" height="12" rx="3"/></g><g class="u"><rect x="192" y="158" width="144" height="106" rx="10"/><text class="lbl" x="208" y="180">replica 2</text></g><text class="sub2" x="208" y="200" text-anchor="start">6 waiting</text><g class="u"><rect x="208" y="208" width="12" height="12" rx="3"/></g><g class="u"><rect x="226" y="208" width="12" height="12" rx="3"/></g><g class="u"><rect x="244" y="208" width="12" height="12" rx="3"/></g><g class="u"><rect x="262" y="208" width="12" height="12" rx="3"/></g><g class="u"><rect x="280" y="208" width="12" height="12" rx="3"/></g><g class="u"><rect x="298" y="208" width="12" height="12" rx="3"/></g><g class="s"><rect x="208" y="228" width="112" height="20" rx="3"/><text class="sub" x="264.0" y="238.0" text-anchor="middle" dominant-baseline="central">A's history</text></g><g class="u"><rect x="344" y="158" width="144" height="106" rx="10"/><text class="lbl" x="360" y="180">replica 3</text></g><text class="sub2" x="360" y="200" text-anchor="start">2 waiting</text><g class="u"><rect x="360" y="208" width="12" height="12" rx="3"/></g><g class="u"><rect x="378" y="208" width="12" height="12" rx="3"/></g><g class="u"><rect x="496" y="158" width="144" height="106" rx="10"/><text class="lbl" x="512" y="180">replica 4</text></g><text class="sub2" x="512" y="200" text-anchor="start">4 waiting</text><g class="u"><rect x="512" y="208" width="12" height="12" rx="3"/></g><g class="u"><rect x="530" y="208" width="12" height="12" rx="3"/></g><g class="u"><rect x="548" y="208" width="12" height="12" rx="3"/></g><g class="u"><rect x="566" y="208" width="12" height="12" rx="3"/></g><line class="conn" x1="318" y1="106" x2="264" y2="154" marker-end="url(#arw)"/><line class="conn" x1="362" y1="106" x2="416" y2="154" marker-end="url(#arw)"/><text class="sub2" x="236" y="132" text-anchor="end">cache-aware: a hit</text><text class="sub2" x="444" y="132" text-anchor="start">least busy: a miss</text><text class="cap" x="40" y="314" text-anchor="start">A cached prefix lives in one replica's memory. A replica is a complete copy of the model</text><text class="cap" x="40" y="334" text-anchor="start">serving its own share of the traffic ({{fig:v05-o018}}), so a hit is only possible on</text><text class="cap" x="40" y="354" text-anchor="start">the replica that holds the prefix.</text><text class="cap" x="40" y="394" text-anchor="start">A router that ignores the cache sends the next turn wherever the queue is shortest. With</text><text class="cap" x="40" y="414" text-anchor="start">4 replicas the history is on that one 1 time in 4, a 25% chance. The other times the</text><text class="cap" x="40" y="434" text-anchor="start">whole 4,100-token prompt is prefilled again: at least 67 ms on Llama 3 8B at peak</text><text class="cap" x="40" y="454" text-anchor="start">arithmetic, against 1.6 ms for the 100 new tokens.</text><text class="cap" x="40" y="494" text-anchor="start">So routing has to become cache-aware: send each request to the machine already holding</text><text class="cap" x="40" y="514" text-anchor="start">its prefix, not to whichever is least busy. The two aims pull against each other,</text><text class="cap" x="40" y="534" text-anchor="start">because the replica with the hit may have the longest queue, as replica 2 does here.</text></svg><figcaption>Queue lengths illustrative. A cache pays only if traffic finds it: routed by load alone, a returning conversation lands on its own history 1 time in N.</figcaption></figure>
