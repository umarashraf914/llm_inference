<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:23</div><h3>Where DistServe's 1.13 GB comes from</h3><svg viewBox='0 0 680 474' role='img'><title>Where DistServe's 1.13 GB comes from</title><text class="hd" x="40" y="46">OPT-66B: bytes of cache per token, term by term</text><g class="u"><rect x="40" y="66" width="86" height="34" rx="6"/><text class="sub" x="83.0" y="83.0" text-anchor="middle" dominant-baseline="central">2, K and V</text></g><text class="sub2" x="134" y="88" text-anchor="middle">×</text><g class="u"><rect x="142" y="66" width="80" height="34" rx="6"/><text class="sub" x="182.0" y="83.0" text-anchor="middle" dominant-baseline="central">64 layers</text></g><text class="sub2" x="230" y="88" text-anchor="middle">×</text><g class="u"><rect x="238" y="66" width="132" height="34" rx="6"/><text class="sub" x="304.0" y="83.0" text-anchor="middle" dominant-baseline="central">9,216 = 72 × 128</text></g><text class="sub2" x="378" y="88" text-anchor="middle">×</text><g class="u"><rect x="386" y="66" width="66" height="34" rx="6"/><text class="sub" x="419.0" y="83.0" text-anchor="middle" dominant-baseline="central">2 bytes</text></g><text class="sub2" x="460" y="88" text-anchor="middle">=</text><g class="m"><rect x="468" y="66" width="124" height="34" rx="6"/><text class="sub" x="530.0" y="83.0" text-anchor="middle" dominant-baseline="central">2,359,296 bytes</text></g><text class="sub2" x="40" y="128" text-anchor="start">× 512 tokens = 1,207,959,552 bytes: 1.21 GB in decimal units, 1.125 GiB in binary ones</text><text class="hd" x="40" y="164">One 512-token request's cache, to scale</text><text class="cap" x="40" y="195" text-anchor="start">OPT-66B, 72 KV heads</text><g class="h"><rect x="230" y="178" width="380.0" height="24" rx="2"/></g><text class="sub2" x="620.0" y="195" text-anchor="start">1.21 GB</text><text class="cap" x="40" y="229" text-anchor="start">Llama 3 70B, 8 KV heads</text><g class="s"><rect x="230" y="212" width="52.77777777777778" height="24" rx="2"/></g><text class="sub2" x="292.8" y="229" text-anchor="start">168 MB</text><text class="cap" x="40" y="282" text-anchor="start">OPT-66B, Meta's 2022 model, keeps a key and a value for each of its 72 attention heads</text><text class="cap" x="40" y="302" text-anchor="start">of 128 numbers, 9,216 per layer, in each of 64 layers: 2 × 64 × 9,216 × 2 bytes =</text><text class="cap" x="40" y="322" text-anchor="start">2,359,296 bytes per token. A 512-token request holds 1,207,959,552 bytes.</text><text class="cap" x="40" y="362" text-anchor="start">That is 1.21 GB in decimal units and 1.125 GiB in binary ones ({{fig:v07-a07}}):</text><text class="cap" x="40" y="382" text-anchor="start">DistServe's “1.13 GB” is the binary figure, rounded.</text><text class="cap" x="40" y="422" text-anchor="start">OPT-66B predates grouped-query attention. Llama 3 70B shares 8 KV heads among its 64</text><text class="cap" x="40" y="442" text-anchor="start">query heads, so the same 512 tokens hold 168 MB, 7.2 times less ({{fig:v03-o089}}).</text></svg><figcaption>The handoff's size is the cache formula again. Grouped-query attention, built to save memory, also shrinks the bill for moving it.</figcaption></figure>
