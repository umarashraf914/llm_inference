<figure><div class='ts'>Fig 07 &nbsp;&middot;&nbsp; 8:43</div><h3>Selective batching</h3><svg viewBox="0 0 680 472" role="img"><title>Selective batching</title><text class="hd" x="40" y="46">The requests now sit at different positions in their sequences</text><g class="s"><rect x="40" y="70" width="285" height="78" rx="8"></rect><text class="lbl" x="182.5" y="92.0" text-anchor="middle" dominant-baseline="central">Most operations</text><text class="sub" x="182.5" y="110.0" text-anchor="middle" dominant-baseline="central">linear projections, layer norms,</text><text class="sub" x="182.5" y="127.0" text-anchor="middle" dominant-baseline="central">the activation function</text></g><g class="h"><rect x="368" y="70" width="272" height="78" rx="8"></rect><text class="lbl" x="504.0" y="92.0" text-anchor="middle" dominant-baseline="central">Attention</text><text class="sub" x="504.0" y="110.0" text-anchor="middle" dominant-baseline="central">the operation that mixes</text><text class="sub" x="504.0" y="127.0" text-anchor="middle" dominant-baseline="central">tokens with one another</text></g><text class="cap" x="40" y="190" text-anchor="start">Most of a layer treats each token on its own and does not need to know which request it came</text><text class="cap" x="40" y="210" text-anchor="start">from. So the engine stops organising by request and stacks every token from every request into</text><text class="cap" x="40" y="230" text-anchor="start">one flat tensor: four requests contributing seven tokens between them run as seven rows.</text><text class="cap" x="40" y="270" text-anchor="start">Attention is the exception, because a token may attend only to tokens from its own request, and</text><text class="cap" x="40" y="290" text-anchor="start">each request carries a different length of history.</text><text class="cap" x="40" y="330" text-anchor="start">Selective batching does both at once: batch every other operation across all tokens together,</text><text class="cap" x="40" y="350" text-anchor="start">and split attention out to run request by request.</text><text class="cap" x="40" y="390" text-anchor="start">Splitting it out costs almost nothing, and the reason reaches back to why batching worked at</text><text class="cap" x="40" y="410" text-anchor="start">all. Batching pays by making one read of the weights serve many requests. Attention has no</text><text class="cap" x="40" y="430" text-anchor="start">weights of its own, only keys and values belonging to individual requests. There was never</text><text class="cap" x="40" y="450" text-anchor="start">anything there to share.</text></svg><figcaption>A neat consequence: the operation that refuses to batch is exactly the operation that had nothing to gain from batching.</figcaption></figure>
