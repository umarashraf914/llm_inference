<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 9:39</div><h3>Selective batching: one matrix for everything but attention</h3><svg viewBox='0 0 680 542' role='img'><title>Selective batching: one matrix for everything but attention</title><text class="hd" x="40" y="46">One transformer layer under selective batching, top to bottom</text><g class="s"><rect x="40" y="66" width="238" height="30" rx="4"/><text class="sub" x="159.0" y="81.0" text-anchor="middle" dominant-baseline="central">layer norm</text></g><line class="conn" x1="159" y1="97" x2="159" y2="107" marker-end="url(#arw)"/><g class="s"><rect x="40" y="110" width="238" height="30" rx="4"/><text class="sub" x="159.0" y="125.0" text-anchor="middle" dominant-baseline="central">Q, K, V projection</text></g><line class="conn" x1="159" y1="141" x2="159" y2="151" marker-end="url(#arw)"/><g class="h"><rect x="40" y="154" width="55" height="30" rx="4"/><text class="sub" x="67.5" y="169.0" text-anchor="middle" dominant-baseline="central">x1</text></g><g class="h"><rect x="101" y="154" width="55" height="30" rx="4"/><text class="sub" x="128.5" y="169.0" text-anchor="middle" dominant-baseline="central">x2</text></g><g class="h"><rect x="162" y="154" width="55" height="30" rx="4"/><text class="sub" x="189.5" y="169.0" text-anchor="middle" dominant-baseline="central">x3</text></g><g class="h"><rect x="223" y="154" width="55" height="30" rx="4"/><text class="sub" x="250.5" y="169.0" text-anchor="middle" dominant-baseline="central">x4</text></g><line class="conn" x1="159" y1="185" x2="159" y2="195" marker-end="url(#arw)"/><g class="s"><rect x="40" y="198" width="238" height="30" rx="4"/><text class="sub" x="159.0" y="213.0" text-anchor="middle" dominant-baseline="central">output projection</text></g><line class="conn" x1="159" y1="229" x2="159" y2="239" marker-end="url(#arw)"/><g class="s"><rect x="40" y="242" width="238" height="30" rx="4"/><text class="sub" x="159.0" y="257.0" text-anchor="middle" dominant-baseline="central">layer norm</text></g><line class="conn" x1="159" y1="273" x2="159" y2="283" marker-end="url(#arw)"/><g class="s"><rect x="40" y="286" width="238" height="30" rx="4"/><text class="sub" x="159.0" y="301.0" text-anchor="middle" dominant-baseline="central">feed-forward network</text></g><text class="sub2" x="300" y="82" text-anchor="start">all 7 tokens as one [7 × H] tensor:</text><text class="sub2" x="300" y="98" text-anchor="start">one read of each weight matrix</text><text class="sub2" x="300" y="170" text-anchor="start">attention, split by request: each token</text><text class="sub2" x="300" y="186" text-anchor="start">sees only its own; no weights to read</text><text class="sub2" x="300" y="218" text-anchor="start">merged back into [7 × H]</text><text class="cap" x="40" y="350" text-anchor="start">Selective batching does both at once: it batches every other operation across all the</text><text class="cap" x="40" y="370" text-anchor="start">tokens together and splits attention out to run request by request. Orca's engine splits</text><text class="cap" x="40" y="390" text-anchor="start">the [7 × H] tensor just before attention and merges the four results back just after.</text><text class="cap" x="40" y="430" text-anchor="start">Splitting costs almost nothing, and the reason reaches back to why batching worked at</text><text class="cap" x="40" y="450" text-anchor="start">all. Batching pays by making one read of the weights serve many requests. Attention has</text><text class="cap" x="40" y="470" text-anchor="start">no weights of its own, only keys and values that belong to individual requests, so there</text><text class="cap" x="40" y="490" text-anchor="start">was never anything there to share. In Llama 3 8B all 218 million weights of a layer sit</text><text class="cap" x="40" y="510" text-anchor="start">in the batched steps; attention holds none.</text></svg><figcaption>A neat consequence: the operation that refuses to batch is exactly the operation that had nothing to gain from batching.</figcaption></figure>
