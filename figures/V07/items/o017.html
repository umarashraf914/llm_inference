<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 20:24</div><h3>vLLM evicts whole sequences, and gets them back one of two ways</h3><svg viewBox='0 0 680 456' role='img'><title>vLLM evicts whole sequences, and gets them back one of two ways</title><text class="hd" x="40" y="46">The sequence's blocks leave together, and come back one of two ways</text><text class="cap" x="40" y="76" text-anchor="start">swapping</text><g class="u"><rect x="40" y="88" width="120" height="50" rx="6"/><text class="lbl" x="100.0" y="113.0" text-anchor="middle" dominant-baseline="central">GPU memory</text></g><g class="u"><rect x="220" y="88" width="120" height="50" rx="6"/><text class="lbl" x="280.0" y="113.0" text-anchor="middle" dominant-baseline="central">CPU memory</text></g><line class="conn" x1="164" y1="104" x2="214" y2="104" marker-end="url(#arw)"/><line class="conn" x1="216" y1="124" x2="166" y2="124" marker-end="url(#arw)"/><text class="sub2" x="190" y="98" text-anchor="middle">out</text><text class="sub2" x="190" y="144" text-anchor="middle">back</text><text class="sub2" x="40" y="164" text-anchor="start">paid in bus bandwidth</text><text class="cap" x="380" y="76" text-anchor="start">recomputing</text><g class="u"><rect x="380" y="88" width="120" height="50" rx="6"/><text class="lbl" x="440.0" y="104.0" text-anchor="middle" dominant-baseline="central">prompt + output</text><text class="sub" x="440.0" y="122.0" text-anchor="middle" dominant-baseline="central">as text</text></g><g class="m"><rect x="540" y="88" width="100" height="50" rx="6"/><text class="lbl" x="590.0" y="113.0" text-anchor="middle" dominant-baseline="central">one prefill</text></g><line class="conn" x1="504" y1="113" x2="534" y2="113" marker-end="url(#arw)"/><text class="sub2" x="380" y="164" text-anchor="start">paid in arithmetic</text><text class="cap" x="40" y="204" text-anchor="start">vLLM evicts a whole sequence at a time, all of its blocks or none, because attention</text><text class="cap" x="40" y="224" text-anchor="start">needs all of them together anyway: a sequence missing one block cannot take its next</text><text class="cap" x="40" y="244" text-anchor="start">step. Getting it back costs one of two things.</text><text class="cap" x="40" y="284" text-anchor="start">Swapping copies the blocks out to CPU memory, the server's ordinary main memory, larger</text><text class="cap" x="40" y="304" text-anchor="start">and slower than the GPU's own, and back again when the sequence resumes. Recomputing</text><text class="cap" x="40" y="324" text-anchor="start">discards them and rebuilds them later.</text><text class="cap" x="40" y="364" text-anchor="start">Recomputing is cheaper than it sounds. The tokens the request has already generated are</text><text class="cap" x="40" y="384" text-anchor="start">appended to its original prompt, and the whole cache is rebuilt in a single prefill pass</text><text class="cap" x="40" y="404" text-anchor="start">instead of one token at a time. Which way wins depends on the machine: how much</text><text class="cap" x="40" y="424" text-anchor="start">bandwidth sits between CPU and GPU, against how much compute is spare.</text></svg><figcaption>A genuine hardware-dependent choice rather than a best practice. The next figure puts milliseconds on both.</figcaption></figure>
