<figure><div class='ts'>Fig 17 &nbsp;&middot;&nbsp; 20:08</div><h3>Eviction, and the two ways to get it back</h3><svg viewBox="0 0 680 392" role="img"><title>Eviction, and the two ways to get it back</title><text class="hd" x="40" y="46">Memory runs out first, and something has to be evicted</text><g class="h"><rect x="40" y="70" width="285" height="44" rx="4"></rect><text class="sub" x="182.5" y="92.0" text-anchor="middle" dominant-baseline="central">swapping: copy blocks out to CPU memory</text></g><g class="h"><rect x="368" y="70" width="272" height="44" rx="4"></rect><text class="sub" x="504.0" y="92.0" text-anchor="middle" dominant-baseline="central">recomputing: discard and rebuild</text></g><text class="sub2" x="40" y="140" text-anchor="start">paid in bus bandwidth</text><text class="sub2" x="368" y="140" text-anchor="start">paid in arithmetic</text><text class="cap" x="40" y="190" text-anchor="start">Caches grow as their sequences grow, so a batch that fit a minute ago may not fit now. Eviction</text><text class="cap" x="40" y="210" text-anchor="start">happens a whole sequence at a time, all of its blocks or none, because attention needs all of</text><text class="cap" x="40" y="230" text-anchor="start">them together anyway.</text><text class="cap" x="40" y="270" text-anchor="start">Recomputing is cheaper than it sounds, because the tokens the request already generated can be</text><text class="cap" x="40" y="290" text-anchor="start">appended to its original prompt and the whole cache rebuilt in a single prefill pass instead of</text><text class="cap" x="40" y="310" text-anchor="start">one token at a time.</text><text class="cap" x="40" y="350" text-anchor="start">Which one wins depends on the machine: how much bandwidth sits between CPU and GPU against how</text><text class="cap" x="40" y="370" text-anchor="start">much compute is spare.</text></svg><figcaption>A genuine hardware-dependent choice rather than a best practice. The right answer differs between deployments.</figcaption></figure>
