<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 17:56</div><h3>An agent's bill is almost all prefix</h3><div class='wg'><div class='ctl'><label>steps <input type='range' min='1' max='50' step='1' value='20'><span class='val'>20</span></label><label>new tokens a step <input type='range' min='100' max='5000' step='100' value='1000'><span class='val'>1,000</span></label></div><div class='ctl'><label>starting context <input type='range' min='0' max='20000' step='1000' value='0'><span class='val'>0</span></label><button type='button'>Reset</button></div><svg viewBox='0 0 680 650' role='img'><title>An agent's bill is almost all prefix</title><text class="hd" x="40" y="34">Tokens each step sends: the part sent before, and the part that is new</text><g data-bars=""><g class="m"><rect x="61.00" width="26.00" y="241.50" height="8.50" rx="1"/></g><g class="s"><rect x="89.00" width="26.00" y="241.50" height="8.50" rx="1"/></g><g class="m"><rect x="89.00" width="26.00" y="233.00" height="8.50" rx="1"/></g><g class="s"><rect x="117.00" width="26.00" y="233.00" height="17.00" rx="1"/></g><g class="m"><rect x="117.00" width="26.00" y="224.50" height="8.50" rx="1"/></g><g class="s"><rect x="145.00" width="26.00" y="224.50" height="25.50" rx="1"/></g><g class="m"><rect x="145.00" width="26.00" y="216.00" height="8.50" rx="1"/></g><g class="s"><rect x="173.00" width="26.00" y="216.00" height="34.00" rx="1"/></g><g class="m"><rect x="173.00" width="26.00" y="207.50" height="8.50" rx="1"/></g><g class="s"><rect x="201.00" width="26.00" y="207.50" height="42.50" rx="1"/></g><g class="m"><rect x="201.00" width="26.00" y="199.00" height="8.50" rx="1"/></g><g class="s"><rect x="229.00" width="26.00" y="199.00" height="51.00" rx="1"/></g><g class="m"><rect x="229.00" width="26.00" y="190.50" height="8.50" rx="1"/></g><g class="s"><rect x="257.00" width="26.00" y="190.50" height="59.50" rx="1"/></g><g class="m"><rect x="257.00" width="26.00" y="182.00" height="8.50" rx="1"/></g><g class="s"><rect x="285.00" width="26.00" y="182.00" height="68.00" rx="1"/></g><g class="m"><rect x="285.00" width="26.00" y="173.50" height="8.50" rx="1"/></g><g class="s"><rect x="313.00" width="26.00" y="173.50" height="76.50" rx="1"/></g><g class="m"><rect x="313.00" width="26.00" y="165.00" height="8.50" rx="1"/></g><g class="s"><rect x="341.00" width="26.00" y="165.00" height="85.00" rx="1"/></g><g class="m"><rect x="341.00" width="26.00" y="156.50" height="8.50" rx="1"/></g><g class="s"><rect x="369.00" width="26.00" y="156.50" height="93.50" rx="1"/></g><g class="m"><rect x="369.00" width="26.00" y="148.00" height="8.50" rx="1"/></g><g class="s"><rect x="397.00" width="26.00" y="148.00" height="102.00" rx="1"/></g><g class="m"><rect x="397.00" width="26.00" y="139.50" height="8.50" rx="1"/></g><g class="s"><rect x="425.00" width="26.00" y="139.50" height="110.50" rx="1"/></g><g class="m"><rect x="425.00" width="26.00" y="131.00" height="8.50" rx="1"/></g><g class="s"><rect x="453.00" width="26.00" y="131.00" height="119.00" rx="1"/></g><g class="m"><rect x="453.00" width="26.00" y="122.50" height="8.50" rx="1"/></g><g class="s"><rect x="481.00" width="26.00" y="122.50" height="127.50" rx="1"/></g><g class="m"><rect x="481.00" width="26.00" y="114.00" height="8.50" rx="1"/></g><g class="s"><rect x="509.00" width="26.00" y="114.00" height="136.00" rx="1"/></g><g class="m"><rect x="509.00" width="26.00" y="105.50" height="8.50" rx="1"/></g><g class="s"><rect x="537.00" width="26.00" y="105.50" height="144.50" rx="1"/></g><g class="m"><rect x="537.00" width="26.00" y="97.00" height="8.50" rx="1"/></g><g class="s"><rect x="565.00" width="26.00" y="97.00" height="153.00" rx="1"/></g><g class="m"><rect x="565.00" width="26.00" y="88.50" height="8.50" rx="1"/></g><g class="s"><rect x="593.00" width="26.00" y="88.50" height="161.50" rx="1"/></g><g class="m"><rect x="593.00" width="26.00" y="80.00" height="8.50" rx="1"/></g></g><line class="axis" x1="60" y1="250.5" x2="620" y2="250.5"/><text class="sub2" x="52" y="84" text-anchor="end" data-top="">20,000</text><text class="sub2" x="52" y="254" text-anchor="end">0</text><text class="sub2" x="60" y="268" text-anchor="start">step 1</text><text class="sub2" x="620" y="268" text-anchor="end" data-last="">step 20</text><g class="s"><rect x="180" y="258" width="12" height="12" rx="3"/></g><text class="sub2" x="198" y="268" text-anchor="start">sent before: read from the cache</text><g class="m"><rect x="400" y="258" width="12" height="12" rx="3"/></g><text class="sub2" x="418" y="268" text-anchor="start">new: written to it</text><text class="sub2" x="40" y="300" data-sent="">sent over 20 steps: 210,000 tokens, of which 190,000 (90.5%) are a cached prefix</text><text class="sub2" x="40" y="318" data-cost="">bill: 210,000 units fresh, or 1.25 × 20,000 + 0.10 × 190,000 = 44,000 with the cache</text><text class="hd" x="40" y="342" data-ratio="">4.77 times cheaper</text><text class="cap" x="40" y="384" text-anchor="start">Step k sends everything before it plus its own new tokens, so n steps of t new tokens</text><text class="cap" x="40" y="404" text-anchor="start">send t × (1 + 2 + … + n) = t × n(n + 1) ÷ 2 tokens: pair the first term with the last,</text><text class="cap" x="40" y="424" text-anchor="start">the second with the one before last, and each pair makes n + 1, with n ÷ 2 pairs. At</text><text class="cap" x="40" y="444" text-anchor="start">every step all but the newest t were sent before: t × n(n − 1) ÷ 2 of them.</text><text class="cap" x="40" y="484" text-anchor="start">Priced at 1.25 to write each step's new tokens and 0.10 to read the rest, twenty steps</text><text class="cap" x="40" y="504" text-anchor="start">of 1,000 tokens cost 25,000 + 19,000 = 44,000 units against 210,000, 4.77 times less.</text><text class="cap" x="40" y="524" text-anchor="start">With no starting context the tokens per step cancel out of that ratio, and only the</text><text class="cap" x="40" y="544" text-anchor="start">number of steps decides it; a starting context, such as a long system prompt, makes the</text><text class="cap" x="40" y="564" text-anchor="start">saving larger still.</text><text class="cap" x="40" y="604" text-anchor="start">This assumes each step writes only its new tokens and every read hits. The arithmetic</text><text class="cap" x="40" y="624" text-anchor="start">was checked against Python over many settings.</text></svg></div><figcaption>What an agent sends grows with the square of its steps, because it replays its whole history every time. With the cache, almost all of that replay is billed at a tenth.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const D = [20, 1000, 0], G = {"X": 60, "W": 560, "B": 250, "H": 170};
  const fx = (v, d = 2) => { const s = Math.abs(v).toFixed(d); return (v < 0 && +s !== 0 ? '\u2212' : '') + s; };const gx = (v, d = 0) => { const s = Math.abs(v).toFixed(d), [a, b] = s.split('.'); const t = a.replace(/\B(?=(\d{3})+(?!\d))/g, ','); return (v < 0 && +s !== 0 ? '\u2212' : '') + t + (b ? '.' + b : ''); };const pcx = (v, d = 1) => fx(100 * v, d) + '%';
  const sl = [...fig.querySelectorAll('input[type=range]')], val = [...fig.querySelectorAll('.val')];
  const q = s => fig.querySelector(s), NS = 'http://www.w3.org/2000/svg';
  function draw() {
    const n = +sl[0].value, t = +sl[1].value, p0 = +sl[2].value;
    val[0].textContent = n; val[1].textContent = gx(t); val[2].textContent = gx(p0);
    const sent = n * p0 + t * n * (n + 1) / 2, reads = (n - 1) * p0 + t * n * (n - 1) / 2;
    const writes = p0 + n * t, cost = 1.25 * writes + 0.10 * reads;
    const top = p0 + n * t, sc = G.H / top, bw = G.W / n;
    const bars = q('[data-bars]');
    while (bars.firstChild) bars.removeChild(bars.firstChild);
    for (let k = 1; k <= n; k++) {
      const tot = p0 + k * t, old = k === 1 ? 0 : p0 + (k - 1) * t, x = G.X + (k - 1) * bw;
      [[old, 0, 's'], [tot - old, old, 'm']].forEach(([h, base, c]) => {
        if (h <= 0) return;
        const g = document.createElementNS(NS, 'g'), r = document.createElementNS(NS, 'rect');
        g.setAttribute('class', c);
        r.setAttribute('x', (x + 1).toFixed(2)); r.setAttribute('width', Math.max(bw - 2, 1).toFixed(2));
        r.setAttribute('y', (G.B - (base + h) * sc).toFixed(2)); r.setAttribute('height', (h * sc).toFixed(2));
        r.setAttribute('rx', 1); g.appendChild(r); bars.appendChild(g);
      });
    }
    q('[data-top]').textContent = gx(top);
    q('[data-last]').textContent = `step ${n}`;
    q('[data-sent]').textContent = `sent over ${n} step${n > 1 ? 's' : ''}: ${gx(sent)} tokens, of which ${gx(reads)} (${pcx(reads / sent)}) are a cached prefix`;
    q('[data-cost]').textContent = `bill: ${gx(sent)} units fresh, or 1.25 × ${gx(writes)} + 0.10 × ${gx(reads)} = ${gx(cost)} with the cache`;
    q('[data-ratio]').textContent = `${fx(sent / cost)} times cheaper`;
  }
  sl.forEach(s => s.addEventListener('input', draw));
  q('button').addEventListener('click', () => { sl.forEach((s, i) => s.value = D[i]); draw(); });
  draw();
})();</script></figure>
