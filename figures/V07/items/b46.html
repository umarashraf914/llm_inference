<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 17:45</div><h3>A cached prefix pays for itself on its second use</h3><svg viewBox='0 0 680 554' role='img'><title>A cached prefix pays for itself on its second use</title><text class="hd" x="40" y="46">Total cost of a prefix used n times, in normal input prices</text><g class="u"><rect x="130" y="60" width="14" height="12" rx="3"/></g><text class="sub2" x="150" y="70" text-anchor="start">without the cache</text><g class="s"><rect x="290" y="60" width="14" height="12" rx="3"/></g><text class="sub2" x="310" y="70" text-anchor="start">with it: one write, then reads</text><text class="cap" x="40" y="106" text-anchor="start">1 use</text><g class="u"><rect x="130" y="84" width="80.0" height="16" rx="3"/></g><text class="sub2" x="218.0" y="96" text-anchor="start">1.00</text><g class="s"><rect x="130" y="103" width="100.0" height="16" rx="3"/></g><text class="sub2" x="238.0" y="115" text-anchor="start">1.25</text><text class="cap" x="40" y="152" text-anchor="start">2 uses</text><g class="u"><rect x="130" y="130" width="160.0" height="16" rx="3"/></g><text class="sub2" x="298.0" y="142" text-anchor="start">2.00</text><g class="s"><rect x="130" y="149" width="108.0" height="16" rx="3"/></g><text class="sub2" x="246.0" y="161" text-anchor="start">1.35</text><text class="cap" x="40" y="198" text-anchor="start">3 uses</text><g class="u"><rect x="130" y="176" width="240.0" height="16" rx="3"/></g><text class="sub2" x="378.0" y="188" text-anchor="start">3.00</text><g class="s"><rect x="130" y="195" width="116.0" height="16" rx="3"/></g><text class="sub2" x="254.0" y="207" text-anchor="start">1.45</text><text class="cap" x="40" y="244" text-anchor="start">4 uses</text><g class="u"><rect x="130" y="222" width="320.0" height="16" rx="3"/></g><text class="sub2" x="458.0" y="234" text-anchor="start">4.00</text><g class="s"><rect x="130" y="241" width="124.0" height="16" rx="3"/></g><text class="sub2" x="262.0" y="253" text-anchor="start">1.55</text><text class="cap" x="40" y="290" text-anchor="start">5 uses</text><g class="u"><rect x="130" y="268" width="400.0" height="16" rx="3"/></g><text class="sub2" x="538.0" y="280" text-anchor="start">5.00</text><g class="s"><rect x="130" y="287" width="132.0" height="16" rx="3"/></g><text class="sub2" x="270.0" y="299" text-anchor="start">1.65</text><g class="s"><rect x="40" y="328" width="190" height="34" rx="6"/><text class="sub" x="135.0" y="345.0" text-anchor="middle" dominant-baseline="central">cached: 1.25 + 0.10 × (n − 1)</text></g><g class="u"><rect x="246" y="328" width="120" height="34" rx="6"/><text class="sub" x="306.0" y="345.0" text-anchor="middle" dominant-baseline="central">fresh: 1.00 × n</text></g><g class="m"><rect x="382" y="328" width="258" height="34" rx="6"/><text class="sub" x="511.0" y="345.0" text-anchor="middle" dominant-baseline="central">equal at n = 1.15 ÷ 0.90 = 1.28</text></g><text class="cap" x="40" y="402" text-anchor="start">The first use pays 1.25 instead of 1.00, so the cache starts 0.25 behind. Every later</text><text class="cap" x="40" y="422" text-anchor="start">use costs 0.10 instead of 1.00, saving 0.90, so the deficit is repaid during the second</text><text class="cap" x="40" y="442" text-anchor="start">use: 1.25 + 0.10 = 1.35 against 2.00.</text><text class="cap" x="40" y="482" text-anchor="start">As lines, fresh costs n and cached costs 1.15 + 0.10 n. They cross where 1.15 = 0.90 n,</text><text class="cap" x="40" y="502" text-anchor="start">at n = 1.28 uses. For fifty requests behind one system prompt ({{fig:v07-b38}}) the prompt</text><text class="cap" x="40" y="522" text-anchor="start">costs 1.25 + 49 × 0.10 = 6.15 units instead of 50, about 8 times less.</text></svg><figcaption>Bars to scale. Anything used twice within its lifetime is worth caching; the only question is whether it will come back before it expires.</figcaption></figure>
