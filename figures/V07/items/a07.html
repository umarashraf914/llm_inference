<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:57</div><h3>One token of context costs 128 KiB on Llama 3 8B</h3><svg viewBox='0 0 680 574' role='img'><title>One token of context costs 128 KiB on Llama 3 8B</title><text class="hd" x="40" y="46">bytes of cache per token = 2 × layers × KV heads × numbers per head × bytes each</text><g class="u"><rect x="40" y="66" width="86" height="34" rx="6"/><text class="sub" x="83.0" y="83.0" text-anchor="middle" dominant-baseline="central">2, K and V</text></g><text class="sub2" x="134" y="88" text-anchor="middle">×</text><g class="u"><rect x="142" y="66" width="78" height="34" rx="6"/><text class="sub" x="181.0" y="83.0" text-anchor="middle" dominant-baseline="central">32 layers</text></g><text class="sub2" x="228" y="88" text-anchor="middle">×</text><g class="u"><rect x="236" y="66" width="84" height="34" rx="6"/><text class="sub" x="278.0" y="83.0" text-anchor="middle" dominant-baseline="central">8 KV heads</text></g><text class="sub2" x="328" y="88" text-anchor="middle">×</text><g class="u"><rect x="336" y="66" width="90" height="34" rx="6"/><text class="sub" x="381.0" y="83.0" text-anchor="middle" dominant-baseline="central">128 numbers</text></g><text class="sub2" x="434" y="88" text-anchor="middle">×</text><g class="u"><rect x="442" y="66" width="66" height="34" rx="6"/><text class="sub" x="475.0" y="83.0" text-anchor="middle" dominant-baseline="central">2 bytes</text></g><text class="sub2" x="516" y="88" text-anchor="middle">=</text><g class="m"><rect x="524" y="66" width="104" height="34" rx="6"/><text class="sub" x="576.0" y="83.0" text-anchor="middle" dominant-baseline="central">131,072 bytes</text></g><text class="sub2" x="40" y="134" text-anchor="start">131,072 bytes = 128 × 1,024 bytes = 128 KiB, about 131 kB in decimal units</text><text class="hd" x="40" y="170">One request's cache, drawn to scale</text><text class="cap" x="40" y="203" text-anchor="start">2,048 tokens</text><g class="h"><rect x="150" y="186" width="25.0" height="24" rx="2"/></g><text class="sub2" x="185.0" y="203" text-anchor="start">268 MB  (256 MiB)</text><text class="cap" x="40" y="237" text-anchor="start">8,192 tokens</text><g class="h"><rect x="150" y="220" width="100.0" height="24" rx="2"/></g><text class="sub2" x="260.0" y="237" text-anchor="start">1.07 GB  (1 GiB)</text><text class="cap" x="40" y="271" text-anchor="start">32,768 tokens</text><g class="h"><rect x="150" y="254" width="400.0" height="24" rx="2"/></g><text class="sub2" x="560.0" y="271" text-anchor="start">4.29 GB  (4 GiB)</text><text class="cap" x="40" y="322" text-anchor="start">From here the arithmetic needs one card, and the 70B model's 140 GB does not fit on an</text><text class="cap" x="40" y="342" text-anchor="start">80 GB H100. Llama 3 8B does: 32 layers, 8 key-value heads of 128 numbers, 8.03 billion</text><text class="cap" x="40" y="362" text-anchor="start">parameters, 16.06 GB at 16 bits. The rest of this part uses it.</text><text class="cap" x="40" y="402" text-anchor="start">Each token of context leaves a key and a value in every layer, for each KV head</text><text class="cap" x="40" y="422" text-anchor="start">({{fig:v01-o140}}); grouped-query attention is why there are 8 KV heads and not 32</text><text class="cap" x="40" y="442" text-anchor="start">({{fig:v03-o089}}). The 70B model came to 327,680 bytes; with 32 layers instead of 80,</text><text class="cap" x="40" y="462" text-anchor="start">the 8B keeps 2.5 times less per token.</text><text class="cap" x="40" y="502" text-anchor="start">Memory is counted in powers of two as often as in powers of ten ({{fig:v02-p16}}). A KiB</text><text class="cap" x="40" y="522" text-anchor="start">is 1,024 bytes, a MiB is 1,024 KiB and a GiB is 1,024 MiB, so 131,072 bytes is exactly</text><text class="cap" x="40" y="542" text-anchor="start">128 KiB, and 8,192 tokens fill exactly 1 GiB, which is 1.07 GB.</text></svg><figcaption>A request's cache is rent paid per token, and every request pays its own. At 8,192 tokens one conversation holds a gigabyte of the card.</figcaption></figure>
