y="386" text-anchor="start">hourly price behind it. Working back from its own numbers gives about $2 per GPU-hour,</text><text class="cap" x="40" y="406" text-anchor="start">counting the decode GPUs alone.</text><text class="cap" x="40" y="446" text-anchor="start">Turned around, the same division prices any deployment: dollars per GPU-hour ÷ millions</text><text class="cap" x="40" y="466" text-anchor="start">of tokens per GPU-hour = dollars per million tokens.</text></svg><figcaption>Every efficiency in this document ends here: more tokens per GPU-hour divides the same hourly price into a smaller cost per token.</figcaption></figure>
