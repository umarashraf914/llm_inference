<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:34</div><h3>One request's handoff takes 3 to 24 milliseconds, depending on the link</h3><svg viewBox='0 0 680 428' role='img'><title>One request's handoff takes 3 to 24 milliseconds, depending on the link</title><text class="hd" x="40" y="46">Time to move one 512-token request's cache, to scale</text><text class="cap" x="40" y="87" text-anchor="start">a 70B decode step, for scale</text><rect x="250" y="70" width="340.0" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="600.0" y="87" text-anchor="start">41.8 ms</text><text class="cap" x="40" y="121" text-anchor="start">OPT-66B, 400 Gb/s port</text><g class="h"><rect x="250" y="104" width="196.55227567542855" height="24" rx="2"/></g><text class="sub2" x="456.6" y="121" text-anchor="start">24.2 ms</text><text class="cap" x="40" y="155" text-anchor="start">Llama 3 70B, 400 Gb/s port</text><g class="s"><rect x="250" y="138" width="27.298927177142858" height="24" rx="2"/></g><text class="sub2" x="287.3" y="155" text-anchor="start">3.36 ms</text><text class="cap" x="40" y="189" text-anchor="start">OPT-66B, NVLink</text><g class="s"><rect x="250" y="172" width="21.839141741714283" height="24" rx="2"/></g><text class="sub2" x="281.8" y="189" text-anchor="start">2.68 ms</text><text class="cap" x="40" y="236" text-anchor="start">Each request's cache crosses once, between its prefill and its first decode step. Over a</text><text class="cap" x="40" y="256" text-anchor="start">400 Gb/s port OPT-66B's 1.21 GB takes 24.2 ms; over NVLink at 450 GB/s each way,</text><text class="cap" x="40" y="276" text-anchor="start">2.68 ms. Llama 3 70B's 168 MB takes 3.4 ms even over the network.</text><text class="cap" x="40" y="316" text-anchor="start">That time is added to the request's time to first token. It can also be hidden: Mooncake</text><text class="cap" x="40" y="336" text-anchor="start">streams a prefill's cache out layer by layer while the later layers are still computing.</text><text class="cap" x="40" y="376" text-anchor="start">A cluster with InfiniBand or NVLink absorbs that. A small deployment does not, which</text><text class="cap" x="40" y="396" text-anchor="start">makes disaggregation a decision about how much traffic you have, not a default.</text></svg><figcaption>Fast links make the transfer a rounding error and slow ones make it the bottleneck. Disaggregation is only as good as the wire between the pools.</figcaption></figure>
