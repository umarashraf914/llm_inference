<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 15:22</div><h3>The same text, computed again and again</h3><svg viewBox='0 0 680 546' role='img'><title>The same text, computed again and again</title><text class="hd" x="40" y="46">In each case the repeated text comes first, and only the end is new</text><g class="s"><rect x="40" y="62" width="14" height="12" rx="3"/></g><text class="sub2" x="60" y="72" text-anchor="start">repeated: sent before, in the same order</text><g class="m"><rect x="300" y="62" width="14" height="12" rx="3"/></g><text class="sub2" x="320" y="72" text-anchor="start">new on this request</text><text class="cap" x="40" y="106" text-anchor="start">system prompt</text><g class="s"><rect x="190" y="90" width="110.0" height="24" rx="3"/></g><g class="m"><rect x="300.0" y="90" width="3.3" height="24" rx="3"/></g><text class="sub2" x="313.3" y="106" text-anchor="start">2,000 + 60 tokens</text><text class="cap" x="40" y="144" text-anchor="start">few-shot examples</text><g class="s"><rect x="190" y="128" width="66.0" height="24" rx="3"/></g><g class="m"><rect x="256.0" y="128" width="4.4" height="24" rx="3"/></g><text class="sub2" x="270.4" y="144" text-anchor="start">1,200 + 80 tokens</text><text class="cap" x="40" y="182" text-anchor="start">retrieved document</text><g class="s"><rect x="190" y="166" width="165.0" height="24" rx="3"/></g><g class="m"><rect x="355.0" y="166" width="2.2" height="24" rx="3"/></g><text class="sub2" x="367.2" y="182" text-anchor="start">3,000 + 40 tokens</text><text class="cap" x="40" y="220" text-anchor="start">multi-turn chat</text><g class="s"><rect x="190" y="204" width="49.5" height="24" rx="3"/></g><g class="m"><rect x="239.5" y="204" width="16.5" height="24" rx="3"/></g><text class="sub2" x="266.0" y="220" text-anchor="start">900 + 300 tokens</text><text class="cap" x="40" y="258" text-anchor="start">agent loop</text><g class="s"><rect x="190" y="242" width="275.0" height="24" rx="3"/></g><g class="m"><rect x="465.0" y="242" width="55.0" height="24" rx="3"/></g><text class="sub2" x="530.0" y="258" text-anchor="start">5,000 + 1,000 tokens</text><text class="cap" x="40" y="314" text-anchor="start">The prefill pool computes every one of these from scratch on every request, even when</text><text class="cap" x="40" y="334" text-anchor="start">thousands of requests open with the same text. So compute the shared part once, and</text><text class="cap" x="40" y="354" text-anchor="start">reuse it.</text><text class="cap" x="40" y="394" text-anchor="start">Few-shot examples are worked question-and-answer pairs placed in front of the real</text><text class="cap" x="40" y="414" text-anchor="start">question to show the model the format wanted. A retrieved document is a passage found by</text><text class="cap" x="40" y="434" text-anchor="start">a search and pasted into the prompt, so the model can answer from it. The agent loop</text><text class="cap" x="40" y="454" text-anchor="start">gets the next figure.</text><text class="cap" x="40" y="494" text-anchor="start">In all five the repeated text comes first and the new text last. That order is not a</text><text class="cap" x="40" y="514" text-anchor="start">detail: two figures on, it turns out that only a shared beginning can be reused.</text></svg><figcaption>Bars to scale, token counts illustrative. Overlap is the normal case rather than the exception, and it nearly always sits at the front of the prompt, the one place a cache can use it.</figcaption></figure>
