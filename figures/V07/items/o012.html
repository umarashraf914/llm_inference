<figure><div class='ts'>Fig 12 &nbsp;&middot;&nbsp; 15:14</div><h3>The same text, computed again and again</h3><svg viewBox="0 0 680 478" role="img"><title>The same text, computed again and again</title><text class="hd" x="40" y="46">In production, overlap is the normal case</text><g class="u"><rect x="60" y="66" width="520" height="30" rx="3"></rect><text class="sub" x="320.0" y="81.0" text-anchor="middle" dominant-baseline="central">a system prompt sent on every call</text></g><g class="u"><rect x="60" y="104" width="520" height="30" rx="3"></rect><text class="sub" x="320.0" y="119.0" text-anchor="middle" dominant-baseline="central">the same few-shot examples</text></g><g class="u"><rect x="60" y="142" width="520" height="30" rx="3"></rect><text class="sub" x="320.0" y="157.0" text-anchor="middle" dominant-baseline="central">a retrieved document reused across questions</text></g><g class="u"><rect x="60" y="180" width="520" height="30" rx="3"></rect><text class="sub" x="320.0" y="195.0" text-anchor="middle" dominant-baseline="central">the growing transcript of a multi-turn chat</text></g><g class="u"><rect x="60" y="218" width="520" height="30" rx="3"></rect><text class="sub" x="320.0" y="233.0" text-anchor="middle" dominant-baseline="central">an agent resending its whole context every step</text></g><text class="cap" x="40" y="296" text-anchor="start">The prefill pool computes every prompt from scratch, even when requests share long stretches of</text><text class="cap" x="40" y="316" text-anchor="start">identical text. So compute the shared part once and reuse it.</text><text class="cap" x="40" y="356" text-anchor="start">That works because attention is causal. A token's keys and values are determined by the text up</text><text class="cap" x="40" y="376" text-anchor="start">to and including that token, and nothing that comes after changes them. The same prefix</text><text class="cap" x="40" y="396" text-anchor="start">produces the same keys and values every time.</text><text class="cap" x="40" y="436" text-anchor="start">A request arriving with that prefix skips straight past the shared part of its prefill to its</text><text class="cap" x="40" y="456" text-anchor="start">first new token.</text></svg><figcaption>Causality, which forced decode to be sequential in the first video, is here the property that makes reuse safe.</figcaption></figure>
