<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:10</div><h3>A 2,000-token prompt goes in over five iterations</h3><svg viewBox='0 0 680 422' role='img'><title>A 2,000-token prompt goes in over five iterations</title><text class="hd" x="40" y="46">Each iteration's 512 tokens: the decodes, then the prompt's next chunk, to scale</text><text class="cap" x="40" y="87" text-anchor="start">iteration 1</text><g class="m"><rect x="150" y="70" width="18.75" height="24" rx="2"/></g><g class="h"><rect x="168.75" y="70" width="281.25" height="24" rx="2"/><text class="sub" x="309.375" y="82.0" text-anchor="middle" dominant-baseline="central">480</text></g><text class="sub2" x="462" y="87" text-anchor="start">480 of 2,000 done · 8.31 ms</text><text class="cap" x="40" y="121" text-anchor="start">iteration 2</text><g class="m"><rect x="150" y="104" width="18.75" height="24" rx="2"/></g><g class="h"><rect x="168.75" y="104" width="281.25" height="24" rx="2"/><text class="sub" x="309.375" y="116.0" text-anchor="middle" dominant-baseline="central">480</text></g><text class="sub2" x="462" y="121" text-anchor="start">960 of 2,000 done · 8.31 ms</text><text class="cap" x="40" y="155" text-anchor="start">iteration 3</text><g class="m"><rect x="150" y="138" width="18.75" height="24" rx="2"/></g><g class="h"><rect x="168.75" y="138" width="281.25" height="24" rx="2"/><text class="sub" x="309.375" y="150.0" text-anchor="middle" dominant-baseline="central">480</text></g><text class="sub2" x="462" y="155" text-anchor="start">1,440 of 2,000 done · 8.31 ms</text><text class="cap" x="40" y="189" text-anchor="start">iteration 4</text><g class="m"><rect x="150" y="172" width="18.75" height="24" rx="2"/></g><g class="h"><rect x="168.75" y="172" width="281.25" height="24" rx="2"/><text class="sub" x="309.375" y="184.0" text-anchor="middle" dominant-baseline="central">480</text></g><text class="sub2" x="462" y="189" text-anchor="start">1,920 of 2,000 done · 8.31 ms</text><text class="cap" x="40" y="223" text-anchor="start">iteration 5</text><g class="m"><rect x="150" y="206" width="18.75" height="24" rx="2"/></g><g class="h"><rect x="168.75" y="206" width="46.88" height="24" rx="2"/><text class="sub" x="192.19" y="218.0" text-anchor="middle" dominant-baseline="central">80</text></g><text class="sub2" x="462" y="223" text-anchor="start">2,000 of 2,000 done · 6.12 ms</text><text class="cap" x="40" y="270" text-anchor="start">⌈2,000 ÷ 480⌉ = 5 iterations: four chunks of 480 and a last of 2,000 − 4 × 480 = 80. The</text><text class="cap" x="40" y="290" text-anchor="start">first four steps carry 512 tokens and are compute-bound, 8.31 ms each; the last carries</text><text class="cap" x="40" y="310" text-anchor="start">112 and rides under the read at 6.12 ms.</text><text class="cap" x="40" y="350" text-anchor="start">Each running request now waits at most 8.31 ms for a token, against 33.0 ms with the</text><text class="cap" x="40" y="370" text-anchor="start">prompt admitted whole. The prompt's own first token comes after</text><text class="cap" x="40" y="390" text-anchor="start">4 × 8.31 + 6.12 = 39.4 ms, against 33.0 ms.</text></svg><figcaption>The cost moved from the people already being served to the newcomer, whose first token now waits five steps instead of one.</figcaption></figure>
