text-anchor="middle" dominant-baseline="central">#2</text></g><g class="m"><rect x="258" y="250" width="84" height="32" rx="3"></rect><text class="sub" x="300.0" y="266.0" text-anchor="middle" dominant-baseline="central">#3</text></g><g class="m"><rect x="354" y="250" width="84" height="32" rx="3"></rect><text class="sub" x="396.0" y="266.0" text-anchor="middle" dominant-baseline="central">#4</text></g><g class="m"><rect x="450" y="250" width="84" height="32" rx="3"></rect><text class="sub" x="492.0" y="266.0" text-anchor="middle" dominant-baseline="central">#5</text></g><g class="m"><rect x="546" y="250" width="84" height="32" rx="3"></rect><text class="sub" x="588.0" y="266.0" text-anchor="middle" dominant-baseline="central">#6</text></g><text class="cap" x="40" y="348" text-anchor="start">A queue is about waiting. A batch is about sharing: several requests are pushed through the</text><text class="cap" x="40" y="368" text-anchor="start">model at the same moment, so one read of the weights serves all of them.</text><text class="cap" x="40" y="404" text-anchor="start">That sharing is the single most important idea in this video, and the queue is what feeds it.</text></svg><figcaption>Two words that sound similar and mean opposite things. One is a line of people waiting; the other is a group going through the door together.</figcaption></figure>
