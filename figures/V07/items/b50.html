<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 20:47</div><h3>Swap or recompute: milliseconds either way, and never token by token</h3><svg viewBox='0 0 680 582' role='img'><title>Swap or recompute: milliseconds either way, and never token by token</title><text class="hd" x="40" y="46">Getting back a Llama 3 8B request that held 2,500 tokens: 328 MB of cache</text><line class="tick" x1="216" y1="214" x2="216" y2="218"/><text class="sub2" x="216" y="232" text-anchor="middle">1 ms</text><line class="tick" x1="302" y1="214" x2="302" y2="218"/><text class="sub2" x="302" y="232" text-anchor="middle">10 ms</text><line class="tick" x1="388" y1="214" x2="388" y2="218"/><text class="sub2" x="388" y="232" text-anchor="middle">100 ms</text><line class="tick" x1="474" y1="214" x2="474" y2="218"/><text class="sub2" x="474" y="232" text-anchor="middle">1 s</text><line class="tick" x1="560" y1="214" x2="560" y2="218"/><text class="sub2" x="560" y="232" text-anchor="middle">10 s</text><line class="axis" x1="216" y1="214" x2="577.2" y2="214"/><text class="cap" x="40" y="87" text-anchor="start">swap, PCIe Gen5</text><g class="s"><rect x="216" y="70" width="87.46486717969509" height="24" rx="3"/></g><text class="sub2" x="311.4648671796951" y="87" text-anchor="start">10.4 ms</text><text class="cap" x="40" y="123" text-anchor="start">swap, PCIe Gen4</text><g class="s"><rect x="216" y="106" width="113.35344680679748" height="24" rx="3"/></g><text class="sub2" x="337.3534468067975" y="123" text-anchor="start">20.8 ms</text><text class="cap" x="40" y="159" text-anchor="start">recompute, one prefill</text><g class="m"><rect x="216" y="142" width="138.3300761895067" height="24" rx="3"/></g><text class="sub2" x="362.3300761895067" y="159" text-anchor="start">at least 40.6 ms</text><text class="cap" x="40" y="195" text-anchor="start">recompute, token by token</text><g class="h"><rect x="216" y="178" width="350.7631038616955" height="24" rx="3"/></g><text class="sub2" x="574.7631038616955" y="195" text-anchor="start">12.0 s</text><text class="cap" x="40" y="270" text-anchor="start">The request keeps 2,500 × 131,072 bytes = 328 MB of keys and values ({{fig:v07-a07}}).</text><text class="cap" x="40" y="290" text-anchor="start">Swapping moves them over PCIe, the bus between CPU and GPU ({{fig:v02-o007}}). A Gen5 link has</text><text class="cap" x="40" y="310" text-anchor="start">16 lanes, each carrying 32 billion bits a second, 128 of every 130 of them data:</text><text class="cap" x="40" y="330" text-anchor="start">16 × 32 × 128/130 ÷ 8 = 63.0 GB/s each way. Out and back takes 2 × 5.2 = 10.4 ms; on a</text><text class="cap" x="40" y="350" text-anchor="start">Gen4 link, half as fast, 20.8 ms. Those are the link's rates, and a real copy gets</text><text class="cap" x="40" y="370" text-anchor="start">somewhat less.</text><text class="cap" x="40" y="410" text-anchor="start">Recomputing as one prefill costs 2 × 8.03 billion × 2,500 operations: at least 40.6 ms</text><text class="cap" x="40" y="430" text-anchor="start">at the H100's peak. Rebuilt token by token, every token would read all 16.06 GB of</text><text class="cap" x="40" y="450" text-anchor="start">weights: 2,500 × 4.79 ms = 12.0 s, 295 times longer. That factor is the ridge again</text><text class="cap" x="40" y="470" text-anchor="start">({{fig:v01-o126}}).</text><text class="cap" x="40" y="510" text-anchor="start">On these numbers swapping wins when the bus is free. A busier bus, a GPU with arithmetic</text><text class="cap" x="40" y="530" text-anchor="start">to spare between memory-bound decode steps, or a model with a smaller cache per token</text><text class="cap" x="40" y="550" text-anchor="start">moves the line, which is why the choice depends on the machine.</text></svg><figcaption>Log scale, one division per factor of ten. The two sensible options sit within a factor of four of each other; the naive one takes 295 times as long as a single prefill.</figcaption></figure>
