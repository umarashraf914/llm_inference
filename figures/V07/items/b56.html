<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 23:21</div><h3>The most probable text repeats itself; the raw shares wander off</h3><svg viewBox='0 0 680 687' role='img'><title>The most probable text repeats itself; the raw shares wander off</title><text class="cap" x="40" y="40" text-anchor="start">the opening both were given</text><text class="sub2" x="40" y="60" text-anchor="start">In a shocking finding, scientist discovered a herd of unicorns living in a remote,</text><text class="sub2" x="40" y="77" text-anchor="start">previously unexplored valley, in the Andes Mountains. Even more surprising to the</text><text class="sub2" x="40" y="94" text-anchor="start">researchers was the fact that the unicorns spoke perfect English.</text><text class="cap" x="40" y="133" text-anchor="start">beam search, keeping 32 candidates</text><text class="sub2" x="40" y="153" text-anchor="start">“The study, published in the Proceedings of the National Academy of Sciences of the United</text><text class="sub2" x="40" y="170" text-anchor="start">States of America (PNAS), was conducted by researchers from the</text><g class="h"><rect x="40" y="189" width="270" height="22" rx="3"/><text class="sub" x="175.0" y="200.0" text-anchor="middle" dominant-baseline="central">Universidad Nacional Autónoma de México</text></g><text class="sub2" x="320" y="204" text-anchor="start">(UNAM) and the</text><g class="h"><rect x="40" y="216" width="270" height="22" rx="3"/><text class="sub" x="175.0" y="227.0" text-anchor="middle" dominant-baseline="central">Universidad Nacional Autónoma de México</text></g><text class="sub2" x="320" y="231" text-anchor="start">(UNAM/</text><g class="h"><rect x="40" y="243" width="270" height="22" rx="3"/><text class="sub" x="175.0" y="254.0" text-anchor="middle" dominant-baseline="central">Universidad Nacional Autónoma de México</text></g><text class="sub2" x="320" y="258" text-anchor="start">/</text><g class="h"><rect x="40" y="270" width="270" height="22" rx="3"/><text class="sub" x="175.0" y="281.0" text-anchor="middle" dominant-baseline="central">Universidad Nacional Autónoma de México</text></g><text class="sub2" x="320" y="285" text-anchor="start">/</text><g class="h"><rect x="40" y="297" width="270" height="22" rx="3"/><text class="sub" x="175.0" y="308.0" text-anchor="middle" dominant-baseline="central">Universidad Nacional Autónoma de México</text></g><text class="sub2" x="320" y="312" text-anchor="start">/</text><g class="h"><rect x="40" y="324" width="270" height="22" rx="3"/><text class="sub" x="175.0" y="335.0" text-anchor="middle" dominant-baseline="central">Universidad Nacional Autónoma de …”</text></g><text class="cap" x="40" y="377" text-anchor="start">sampling straight from the model's shares</text><text class="sub2" x="40" y="397" text-anchor="start">They were cattle called Bolivian Cavalleros; they live in a remote desert uninterrupted by</text><text class="sub2" x="40" y="414" text-anchor="start">town, and they speak huge, beautiful, paradisiacal Bolivian linguistic thing. They say,</text><text class="sub2" x="40" y="431" text-anchor="start">'Lunch, marge.' They don't tell what the lunch is,” director Professor Chuperas Omwell told</text><text class="sub2" x="40" y="448" text-anchor="start">Sky News.</text><text class="cap" x="40" y="495" text-anchor="start">Both continuations come from GPT-2 Large, a model of 774 million parameters, given the</text><text class="cap" x="40" y="515" text-anchor="start">same two-sentence opening (Holtzman et al., 2020, Figure 1). Beam search finds text the</text><text class="cap" x="40" y="535" text-anchor="start">model rates as highly probable, and it is one university's name, five times over and</text><text class="cap" x="40" y="555" text-anchor="start">starting a sixth.</text><text class="cap" x="40" y="595" text-anchor="start">Models do assign high probability to well-formed text, but the highest-scoring long</text><text class="cap" x="40" y="615" text-anchor="start">continuations tend to be generic and repetitive. Each repetition makes the next more</text><text class="cap" x="40" y="635" text-anchor="start">probable, a feedback loop the same paper measured. Sampling from the raw shares escapes</text><text class="cap" x="40" y="655" text-anchor="start">the loop and wanders into nonsense instead.</text></svg><figcaption>Quoted from the paper, repeats highlighted. Maximising probability and writing well turn out to be different goals.</figcaption></figure>
