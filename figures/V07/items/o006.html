<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:45</div><h3>Orca hands the engine one iteration, then rebuilds the batch</h3><svg viewBox='0 0 680 538' role='img'><title>Orca hands the engine one iteration, then rebuilds the batch</title><text class="hd" x="40" y="46">Iteration-level scheduling, drawn as the loop it is</text><g class="u"><rect x="40" y="92" width="60" height="13" rx="2"/></g><g class="u"><rect x="40" y="110" width="60" height="13" rx="2"/></g><g class="u"><rect x="40" y="128" width="60" height="13" rx="2"/></g><text class="sub2" x="40" y="160" text-anchor="start">waiting</text><line class="conn" x1="106" y1="112" x2="158" y2="112" marker-end="url(#arw)"/><text class="sub2" x="110" y="104" text-anchor="start">admit</text><g class="s"><rect x="164" y="84" width="176" height="58" rx="6"/><text class="lbl" x="252.0" y="104.0" text-anchor="middle" dominant-baseline="central">scheduler</text><text class="sub" x="252.0" y="122.0" text-anchor="middle" dominant-baseline="central">picks this step's batch</text></g><g class="m"><rect x="440" y="84" width="200" height="58" rx="6"/><text class="lbl" x="540.0" y="104.0" text-anchor="middle" dominant-baseline="central">engine</text><text class="sub" x="540.0" y="122.0" text-anchor="middle" dominant-baseline="central">one token for each request</text></g><line class="conn" x1="346" y1="100" x2="434" y2="100" marker-end="url(#arw)"/><text class="sub2" x="390" y="92" text-anchor="middle">one iteration</text><line class="conn" x1="434" y1="128" x2="346" y2="128" marker-end="url(#arw)"/><text class="sub2" x="390" y="146" text-anchor="middle">the new tokens</text><line class="conn" x1="252" y1="148" x2="252" y2="186" marker-end="url(#arw)"/><g class="u"><rect x="164" y="192" width="176" height="26" rx="3"/><text class="sub" x="252.0" y="205.0" text-anchor="middle" dominant-baseline="central">finished: back to its user</text></g><text class="sub2" x="264" y="172" text-anchor="start">end-of-sequence token</text><text class="cap" x="40" y="266" text-anchor="start">Orca (Yu et al., presented in 2022 at OSDI, a leading systems conference) changed what</text><text class="cap" x="40" y="286" text-anchor="start">the scheduler hands to the engine. Rather than a batch to run to completion, it hands</text><text class="cap" x="40" y="306" text-anchor="start">over a batch and asks for exactly one iteration, or step: one token for every active</text><text class="cap" x="40" y="326" text-anchor="start">request. The engine runs that step and returns.</text><text class="cap" x="40" y="366" text-anchor="start">Between steps the scheduler drops whatever just emitted an end-of-sequence token,</text><text class="cap" x="40" y="386" text-anchor="start">returning it to its user at once, admits whatever has been waiting, and rebuilds the</text><text class="cap" x="40" y="406" text-anchor="start">batch. Orca called this iteration-level scheduling; it is now usually called continuous</text><text class="cap" x="40" y="426" text-anchor="start">batching.</text><text class="cap" x="40" y="466" text-anchor="start">It works because one iteration is the same small unit of work for every request. Whether</text><text class="cap" x="40" y="486" text-anchor="start">a sequence is on its fifth token or its 500th, a step advances it by exactly one, so the</text><text class="cap" x="40" y="506" text-anchor="start">batch can be rebuilt between any two steps without interrupting anyone.</text></svg><figcaption>The change is to what the scheduler hands over, not to the model or the kernels. A loop that comes back every step can change its mind every step.</figcaption></figure>
