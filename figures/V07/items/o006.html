<figure><div class='ts'>Fig 06 &nbsp;&middot;&nbsp; 6:40</div><h3>Iteration-level scheduling</h3><svg viewBox="0 0 680 500" role="img"><title>Iteration-level scheduling</title><text class="hd" x="40" y="46">Hand the engine one iteration, not a whole batch</text><g class="s"><rect x="40" y="70" width="150" height="40" rx="4"></rect><text class="sub" x="115.0" y="90.0" text-anchor="middle" dominant-baseline="central">scheduler</text></g><line class="conn" x1="196" y1="90" x2="216" y2="90" marker-end="url(#arw)"></line><g class="u"><rect x="222" y="70" width="190" height="40" rx="4"></rect><text class="sub" x="317.0" y="90.0" text-anchor="middle" dominant-baseline="central">one token for each request</text></g><line class="conn" x1="418" y1="90" x2="438" y2="90" marker-end="url(#arw)"></line><g class="s"><rect x="444" y="70" width="196" height="40" rx="4"></rect><text class="sub" x="542.0" y="90.0" text-anchor="middle" dominant-baseline="central">engine returns, batch rebuilt</text></g><text class="cap" x="40" y="148" text-anchor="start">Between steps the scheduler drops whatever just emitted an end-of-sequence token, admits</text><text class="cap" x="40" y="168" text-anchor="start">whatever has been waiting, and rebuilds the batch for the next step.</text><text class="cap" x="40" y="208" text-anchor="start">It works because one iteration is the same small unit of work for every request. Whether a</text><text class="cap" x="40" y="228" text-anchor="start">sequence is on its fifth token or its five-hundredth, a step advances it by exactly one, so the</text><text class="cap" x="40" y="248" text-anchor="start">batch can be rebuilt between any two steps without interrupting anyone.</text><text class="cap" x="40" y="288" text-anchor="start">Take the same four requests. The eight-step one leaves at step eight and a waiting request</text><text class="cap" x="40" y="308" text-anchor="start">takes its seat, and the same happens at 24 and at 60. No seat sits idle for hundreds of steps.</text><text class="cap" x="40" y="348" text-anchor="start">Against a strong baseline on a 175-billion-parameter model, holding a median 190 milliseconds</text><text class="cap" x="40" y="368" text-anchor="start">per generated token</text><text class="cap" x="40" y="408" text-anchor="start">Iteration-level</text><g class="s"><rect x="240" y="392" width="340" height="30" rx="3"></rect><text class="sub" x="410.0" y="407.0" text-anchor="middle" dominant-baseline="central">6.81 requests per second</text></g><text class="cap" x="40" y="458" text-anchor="start">Request-level</text><g class="h"><rect x="240" y="442" width="10" height="30" rx="1"></rect></g><text class="sub2" x="260" y="461" text-anchor="start">0.185, a factor of 36.9</text></svg><figcaption>Presented in 2022 and now universally called continuous batching. The change is to what the scheduler hands over, not to the model or the kernels.</figcaption></figure>
