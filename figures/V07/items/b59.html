<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 24:10</div><h3>Dividing by T scales the gap in the exponent</h3><svg viewBox='0 0 680 484' role='img'><title>Dividing by T scales the gap in the exponent</title><text class="hd" x="40" y="46">Cat's chance against dog's, at temperature T</text><g class="u"><rect x="40" y="64" width="300" height="36" rx="6"/><text class="sub" x="190.0" y="82.0" text-anchor="middle" dominant-baseline="central">p(cat) ÷ p(dog) = e^(8.2 ÷ T) ÷ e^(7.1 ÷ T)</text></g><text class="sub2" x="356" y="86" text-anchor="start">softmax's shared total cancels</text><g class="m"><rect x="40" y="112" width="300" height="36" rx="6"/><text class="sub" x="190.0" y="130.0" text-anchor="middle" dominant-baseline="central">= e^((8.2 − 7.1) ÷ T) = e^(1.1 ÷ T)</text></g><text class="sub2" x="356" y="134" text-anchor="start">dividing powers of e subtracts exponents</text><text class="cap" x="40" y="184" text-anchor="start">T</text><text class="sub2" x="110" y="184" text-anchor="start">exponent 1.1 ÷ T</text><text class="sub2" x="250" y="184" text-anchor="start">ratio</text><text class="cap" x="40" y="210" text-anchor="start">0.5</text><text class="sub2" x="110" y="210" text-anchor="start">2.20</text><g class="m"><rect x="250" y="196" width="270.75040498302343" height="20" rx="3"/></g><text class="sub2" x="528.7504049830234" y="210" text-anchor="start">9.03 to 1</text><text class="cap" x="40" y="240" text-anchor="start">1.0</text><text class="sub2" x="110" y="240" text-anchor="start">1.10</text><g class="m"><rect x="250" y="226" width="90.12498071839296" height="20" rx="3"/></g><text class="sub2" x="348.124980718393" y="240" text-anchor="start">3.00 to 1</text><text class="cap" x="40" y="270" text-anchor="start">2.0</text><text class="sub2" x="110" y="270" text-anchor="start">0.55</text><g class="m"><rect x="250" y="256" width="51.997590536021846" height="20" rx="3"/></g><text class="sub2" x="309.99759053602185" y="270" text-anchor="start">1.73 to 1</text><text class="cap" x="40" y="312" text-anchor="start">Softmax divides every e-value by the same total, so in a ratio of two shares the total</text><text class="cap" x="40" y="332" text-anchor="start">cancels and only e^(score ÷ T) is left for each. Dividing one power of e by another</text><text class="cap" x="40" y="352" text-anchor="start">subtracts their exponents, so the ratio is e raised to the gap in scores divided by T.</text><text class="cap" x="40" y="392" text-anchor="start">The gap here is 1.1. Halving T doubles the exponent, and because it is an exponent the</text><text class="cap" x="40" y="412" text-anchor="start">ratio is squared: 3.00 to 1 becomes 9.03 to 1. Doubling T halves it, and the ratio falls</text><text class="cap" x="40" y="432" text-anchor="start">to its square root, 1.73. As T shrinks toward 0 the ratio grows without limit, which is</text><text class="cap" x="40" y="452" text-anchor="start">greedy; as T grows the ratio tends to 1, every token alike.</text></svg><figcaption>Bars to scale. One division, inside an exponential: that is why a small change in temperature makes a large change in how adventurous the text is.</figcaption></figure>
