<figure><div class='ts'>Fig 15 &nbsp;&middot;&nbsp; 18:04</div><h3>The two software layers</h3><svg viewBox="0 0 680 490" role="img"><title>The two software layers</title><g class="u"><rect x="40" y="40" width="600" height="116" rx="14"></rect><text class="lbl" x="62" y="66">Orchestration layer</text><text class="sub" x="62" y="84">coordinates a fleet</text></g><g class="s"><rect x="66" y="96" width="170" height="40" rx="4"></rect><text class="sub" x="151.0" y="116.0" text-anchor="middle" dominant-baseline="central">place the pools</text></g><g class="s"><rect x="250" y="96" width="180" height="40" rx="4"></rect><text class="sub" x="340.0" y="116.0" text-anchor="middle" dominant-baseline="central">route by prefix</text></g><g class="s"><rect x="444" y="96" width="170" height="40" rx="4"></rect><text class="sub" x="529.0" y="116.0" text-anchor="middle" dominant-baseline="central">move KV cache</text></g><g class="u"><rect x="40" y="180" width="600" height="116" rx="14"></rect><text class="lbl" x="62" y="206">Inference engine</text><text class="sub" x="62" y="224">runs the model on one GPU or one node</text></g><g class="m"><rect x="66" y="236" width="170" height="40" rx="4"></rect><text class="sub" x="151.0" y="256.0" text-anchor="middle" dominant-baseline="central">the scheduler</text></g><g class="m"><rect x="250" y="236" width="180" height="40" rx="4"></rect><text class="sub" x="340.0" y="256.0" text-anchor="middle" dominant-baseline="central">the KV cache</text></g><g class="m"><rect x="444" y="236" width="170" height="40" rx="4"></rect><text class="sub" x="529.0" y="256.0" text-anchor="middle" dominant-baseline="central">the kernels</text></g><text class="cap" x="40" y="348" text-anchor="start">An engine owns the scheduler, the cache and the kernels for one machine. One widely used engine</text><text class="cap" x="40" y="368" text-anchor="start">is now a PyTorch Foundation project and runs on Nvidia, AMD, Google TPUs, AWS Inferentia, Intel</text><text class="cap" x="40" y="388" text-anchor="start">and Apple Silicon; another was the engine behind the 96-GPU reproduction; Nvidia has its own</text><text class="cap" x="40" y="408" text-anchor="start">tuned hardest for its own hardware.</text><text class="cap" x="40" y="448" text-anchor="start">An orchestrator does the work no single engine can see. Neither replaces an engine. Both run</text><text class="cap" x="40" y="468" text-anchor="start">engines underneath, and that is the important distinction.</text></svg><figcaption>Reading a benchmark correctly depends on knowing which layer it measures. An engine number and a fleet number are not comparable.</figcaption></figure>
