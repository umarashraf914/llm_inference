<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 18:08</div><h3>An engine runs one machine; an orchestrator runs a fleet of engines</h3><svg viewBox='0 0 680 764' role='img'><title>An engine runs one machine; an orchestrator runs a fleet of engines</title><g class="u"><rect x="40" y="40" width="600" height="112" rx="14"/><text class="lbl" x="62" y="66">Orchestration layer</text><text class="sub" x="62" y="84">NVIDIA Dynamo, llm-d: one fleet of machines</text></g><g class="s"><rect x="62" y="100" width="200" height="30" rx="3"/><text class="sub" x="162.0" y="115.0" text-anchor="middle" dominant-baseline="central">place prefill and decode pools</text></g><g class="s"><rect x="276" y="100" width="150" height="30" rx="3"/><text class="sub" x="351.0" y="115.0" text-anchor="middle" dominant-baseline="central">route by prefix</text></g><g class="s"><rect x="440" y="100" width="178" height="30" rx="3"/><text class="sub" x="529.0" y="115.0" text-anchor="middle" dominant-baseline="central">move KV caches</text></g><line class="conn" x1="130" y1="156" x2="130" y2="186" marker-end="url(#arw)"/><g class="u"><rect x="40" y="190" width="180" height="140" rx="12"/><text class="lbl" x="58" y="214">engine, node 1</text></g><g class="m"><rect x="54" y="228" width="152" height="24" rx="3"/><text class="sub" x="130.0" y="240.0" text-anchor="middle" dominant-baseline="central">scheduler</text></g><g class="m"><rect x="54" y="258" width="152" height="24" rx="3"/><text class="sub" x="130.0" y="270.0" text-anchor="middle" dominant-baseline="central">KV cache</text></g><g class="m"><rect x="54" y="288" width="152" height="24" rx="3"/><text class="sub" x="130.0" y="300.0" text-anchor="middle" dominant-baseline="central">kernels</text></g><line class="conn" x1="340" y1="156" x2="340" y2="186" marker-end="url(#arw)"/><g class="u"><rect x="250" y="190" width="180" height="140" rx="12"/><text class="lbl" x="268" y="214">engine, node 2</text></g><g class="m"><rect x="264" y="228" width="152" height="24" rx="3"/><text class="sub" x="340.0" y="240.0" text-anchor="middle" dominant-baseline="central">scheduler</text></g><g class="m"><rect x="264" y="258" width="152" height="24" rx="3"/><text class="sub" x="340.0" y="270.0" text-anchor="middle" dominant-baseline="central">KV cache</text></g><g class="m"><rect x="264" y="288" width="152" height="24" rx="3"/><text class="sub" x="340.0" y="300.0" text-anchor="middle" dominant-baseline="central">kernels</text></g><line class="conn" x1="550" y1="156" x2="550" y2="186" marker-end="url(#arw)"/><g class="u"><rect x="460" y="190" width="180" height="140" rx="12"/><text class="lbl" x="478" y="214">engine, node 3</text></g><g class="m"><rect x="474" y="228" width="152" height="24" rx="3"/><text class="sub" x="550.0" y="240.0" text-anchor="middle" dominant-baseline="central">scheduler</text></g><g class="m"><rect x="474" y="258" width="152" height="24" rx="3"/><text class="sub" x="550.0" y="270.0" text-anchor="middle" dominant-baseline="central">KV cache</text></g><g class="m"><rect x="474" y="288" width="152" height="24" rx="3"/><text class="sub" x="550.0" y="300.0" text-anchor="middle" dominant-baseline="central">kernels</text></g><text class="cap" x="40" y="372" text-anchor="start">An inference engine runs the model on one GPU or one node and owns the scheduler, the KV</text><text class="cap" x="40" y="392" text-anchor="start">cache and the kernels, so batching, paging and prefix caching all happen inside one.</text><text class="cap" x="40" y="412" text-anchor="start">vLLM, now a project of the PyTorch Foundation (the body that looks after PyTorch, a</text><text class="cap" x="40" y="432" text-anchor="start">widely used open-source library for building neural networks), runs on NVIDIA and AMD</text><text class="cap" x="40" y="452" text-anchor="start">GPUs, on Google's and Amazon's own AI chips (TPUs and Inferentia), on Intel and on Apple</text><text class="cap" x="40" y="472" text-anchor="start">Silicon. SGLang is the engine behind the 96-GPU DeepSeek reproduction. TensorRT-LLM is</text><text class="cap" x="40" y="492" text-anchor="start">NVIDIA's own, tuned hardest for NVIDIA hardware. Hugging Face's Text Generation</text><text class="cap" x="40" y="512" text-anchor="start">Inference (TGI) is the serving toolkit built around models from the Hugging Face Hub, a</text><text class="cap" x="40" y="532" text-anchor="start">public library of model files.</text><text class="cap" x="40" y="572" text-anchor="start">An orchestration layer sits above the engines and coordinates a fleet of them. NVIDIA</text><text class="cap" x="40" y="592" text-anchor="start">Dynamo and llm-d place the prefill and decode pools across nodes, route each request to</text><text class="cap" x="40" y="612" text-anchor="start">the replica that already holds its prefix, and move KV caches between machines: work no</text><text class="cap" x="40" y="632" text-anchor="start">single engine can see. llm-d is Kubernetes-native: it is built to run on Kubernetes, the</text><text class="cap" x="40" y="652" text-anchor="start">standard open-source system for running programs across a fleet of machines, and uses</text><text class="cap" x="40" y="672" text-anchor="start">its machinery rather than its own.</text><text class="cap" x="40" y="712" text-anchor="start">Neither replaces an engine. Both run engines underneath, and that is the distinction</text><text class="cap" x="40" y="732" text-anchor="start">that matters.</text></svg><figcaption>Reading a benchmark correctly depends on knowing which layer it measures. An engine number and a fleet number are not comparable.</figcaption><!-- link: the 96-GPU DeepSeek reproduction (P35 or o011, Part 5): point 'SGLang is the engine behind' at it once Part 5 is built --></figure>
