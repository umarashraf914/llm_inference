<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:39</div><h3>The one thing no two requests share</h3><svg viewBox='0 0 680 462' role='img'><title>The one thing no two requests share</title><text class="hd" x="40" y="46">Shared by every request, against owned by one</text><g class="s"><rect x="40" y="70" width="130" height="126" rx="6"/><text class="lbl" x="105.0" y="124.0" text-anchor="middle" dominant-baseline="central">the weights</text><text class="sub" x="105.0" y="142.0" text-anchor="middle" dominant-baseline="central">read once</text></g><line class="conn" x1="176" y1="133" x2="214" y2="82" marker-end="url(#arw)"/><g class="u"><rect x="220" y="70" width="90" height="24" rx="3"/><text class="sub" x="265.0" y="82.0" text-anchor="middle" dominant-baseline="central">request 1</text></g><g class="h"><rect x="372" y="70" width="142" height="24" rx="3"/><text class="sub" x="443.0" y="82.0" text-anchor="middle" dominant-baseline="central">request 1's KV cache</text></g><line class="conn" x1="520" y1="82" x2="544" y2="82" marker-end="url(#arw)"/><g class="u"><rect x="550" y="70" width="90" height="24" rx="3"/><text class="sub" x="595.0" y="82.0" text-anchor="middle" dominant-baseline="central">request 1</text></g><line class="conn" x1="176" y1="133" x2="214" y2="116" marker-end="url(#arw)"/><g class="u"><rect x="220" y="104" width="90" height="24" rx="3"/><text class="sub" x="265.0" y="116.0" text-anchor="middle" dominant-baseline="central">request 2</text></g><g class="h"><rect x="372" y="104" width="142" height="24" rx="3"/><text class="sub" x="443.0" y="116.0" text-anchor="middle" dominant-baseline="central">request 2's KV cache</text></g><line class="conn" x1="520" y1="116" x2="544" y2="116" marker-end="url(#arw)"/><g class="u"><rect x="550" y="104" width="90" height="24" rx="3"/><text class="sub" x="595.0" y="116.0" text-anchor="middle" dominant-baseline="central">request 2</text></g><line class="conn" x1="176" y1="133" x2="214" y2="150" marker-end="url(#arw)"/><g class="u"><rect x="220" y="138" width="90" height="24" rx="3"/><text class="sub" x="265.0" y="150.0" text-anchor="middle" dominant-baseline="central">request 3</text></g><g class="h"><rect x="372" y="138" width="142" height="24" rx="3"/><text class="sub" x="443.0" y="150.0" text-anchor="middle" dominant-baseline="central">request 3's KV cache</text></g><line class="conn" x1="520" y1="150" x2="544" y2="150" marker-end="url(#arw)"/><g class="u"><rect x="550" y="138" width="90" height="24" rx="3"/><text class="sub" x="595.0" y="150.0" text-anchor="middle" dominant-baseline="central">request 3</text></g><line class="conn" x1="176" y1="133" x2="214" y2="184" marker-end="url(#arw)"/><g class="u"><rect x="220" y="172" width="90" height="24" rx="3"/><text class="sub" x="265.0" y="184.0" text-anchor="middle" dominant-baseline="central">request 4</text></g><g class="h"><rect x="372" y="172" width="142" height="24" rx="3"/><text class="sub" x="443.0" y="184.0" text-anchor="middle" dominant-baseline="central">request 4's KV cache</text></g><line class="conn" x1="520" y1="184" x2="544" y2="184" marker-end="url(#arw)"/><g class="u"><rect x="550" y="172" width="90" height="24" rx="3"/><text class="sub" x="595.0" y="184.0" text-anchor="middle" dominant-baseline="central">request 4</text></g><text class="sub2" x="40" y="222" text-anchor="start">one read serves the whole batch</text><text class="sub2" x="372" y="222" text-anchor="start">one read per request, on every step</text><text class="cap" x="40" y="270" text-anchor="start">The weights are identical for every request, which is why one read of them serves the</text><text class="cap" x="40" y="290" text-anchor="start">whole batch. A KV cache is the opposite: every request carries its own keys and values,</text><text class="cap" x="40" y="310" text-anchor="start">the vectors attention computed for each of its earlier tokens and keeps so that it never</text><text class="cap" x="40" y="330" text-anchor="start">recomputes them, the running record of its own sequence ({{fig:v01-o136}}).</text><text class="cap" x="40" y="370" text-anchor="start">So attention has to read each request's cache separately, one read per request on every</text><text class="cap" x="40" y="390" text-anchor="start">step. Those reads grow with the batch, and none of them is shared. Two consequences</text><text class="cap" x="40" y="410" text-anchor="start">follow, and the next figures work out both: attention's reads never amortise, and the</text><text class="cap" x="40" y="430" text-anchor="start">caches decide how many requests fit on the card.</text></svg><figcaption>Two separate consequences from one fact: the cache is why attention will not amortise, and it is also why the batch cannot grow past a few tens at long contexts.</figcaption></figure>
