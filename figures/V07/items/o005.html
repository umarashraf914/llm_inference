<figure><div class='ts'>Fig 05 &nbsp;&middot;&nbsp; 4:36</div><h3>The one thing no two requests share</h3><svg viewBox="0 0 680 460" role="img"><title>The one thing no two requests share</title><g class="s"><rect x="40" y="55" width="285" height="78" rx="8"></rect><text class="lbl" x="182.5" y="77.0" text-anchor="middle" dominant-baseline="central">The weights</text><text class="sub" x="182.5" y="95.0" text-anchor="middle" dominant-baseline="central">identical for every request,</text><text class="sub" x="182.5" y="112.0" text-anchor="middle" dominant-baseline="central">so one read serves the batch</text></g><g class="h"><rect x="368" y="55" width="272" height="78" rx="8"></rect><text class="lbl" x="504.0" y="77.0" text-anchor="middle" dominant-baseline="central">A KV cache</text><text class="sub" x="504.0" y="95.0" text-anchor="middle" dominant-baseline="central">belongs to one request,</text><text class="sub" x="504.0" y="112.0" text-anchor="middle" dominant-baseline="central">and never amortises</text></g><text class="cap" x="40" y="178" text-anchor="start">Attention has to read each cache separately, one read per request on every step. Those reads</text><text class="cap" x="40" y="198" text-anchor="start">scale with the batch and none of them are shared, so attention stays on the memory-bound floor</text><text class="cap" x="40" y="218" text-anchor="start">no matter how large the batch grows.</text><text class="cap" x="40" y="258" text-anchor="start">The same caches set the ceiling. Weights are a fixed cost in memory and activations take very</text><text class="cap" x="40" y="278" text-anchor="start">little, so whatever high-bandwidth memory is left over is what holds KV caches, and that is the</text><text class="cap" x="40" y="298" text-anchor="start">maximum batch size.</text><text class="cap" x="40" y="338" text-anchor="start">Hand every spare byte on the card to KV cache and you still fit only a few tens of concurrent</text><text class="cap" x="40" y="358" text-anchor="start">requests. You run out of room before you run out of arithmetic.</text><text class="cap" x="40" y="398" text-anchor="start">Which is what makes paged attention matter here: storing the cache in non-contiguous</text><text class="cap" x="40" y="418" text-anchor="start">fixed-size blocks brings the 20-to-38-percent utilisation of the old pre-allocated scheme near</text><text class="cap" x="40" y="438" text-anchor="start">zero waste, so more sequences fit and each weight read covers more tokens.</text></svg><figcaption>Two separate consequences from one fact. The cache is why attention will not amortise, and it is also why the batch cannot grow past a few tens.</figcaption></figure>
