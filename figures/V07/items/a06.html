<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:40</div><h3>Batch 295 is where decode reaches the ridge</h3><div class='wg'><div class='ctl'><label>batch size <input type='range' min='0' max='11' step='1' value='0'><span class='val'>1</span></label><button type='button'>Reset</button></div><svg viewBox='0 0 680 740' role='img'><title>Batch 295 is where decode reaches the ridge</title><text class="hd" x="40" y="34">One point per batch size, on the roofline of the 70B model's weights</text><line class="axis" x1="110" y1="262" x2="620" y2="262"/><line class="axis" x1="110" y1="70" x2="110" y2="262"/><line class="tick" x1="110.0" y1="262" x2="110.0" y2="267"/><text class="sub2" x="110.0" y="281" text-anchor="middle">0.1</text><line class="tick" x1="212.0" y1="262" x2="212.0" y2="267"/><text class="sub2" x="212.0" y="281" text-anchor="middle">1</text><line class="tick" x1="314.0" y1="262" x2="314.0" y2="267"/><text class="sub2" x="314.0" y="281" text-anchor="middle">10</text><line class="tick" x1="416.0" y1="262" x2="416.0" y2="267"/><text class="sub2" x="416.0" y="281" text-anchor="middle">100</text><line class="tick" x1="518.0" y1="262" x2="518.0" y2="267"/><text class="sub2" x="518.0" y="281" text-anchor="middle">1,000</text><line class="tick" x1="620.0" y1="262" x2="620.0" y2="267"/><text class="sub2" x="620.0" y="281" text-anchor="middle">10,000</text><line class="tick" x1="105" y1="262.0" x2="110" y2="262.0"/><text class="sub2" x="101" y="266.0" text-anchor="end">1</text><line class="tick" x1="105" y1="198.0" x2="110" y2="198.0"/><text class="sub2" x="101" y="202.0" text-anchor="end">10</text><line class="tick" x1="105" y1="134.0" x2="110" y2="134.0"/><text class="sub2" x="101" y="138.0" text-anchor="end">100</text><line class="tick" x1="105" y1="70.0" x2="110" y2="70.0"/><text class="sub2" x="101" y="74.0" text-anchor="end">1,000</text><text class="sub2" x="365.0" y="300" text-anchor="middle">arithmetic intensity: operations per byte moved</text><text class="sub2" x="101" y="56" text-anchor="start">TFLOP/s attainable</text><polyline class="pl-h" points="158.4,262.0 464.0,70.3 620.0,70.3"/><line class="mark" x1="464.0" y1="78.3" x2="464.0" y2="262"/><text class="sub2 halo" x="472.0" y="96" text-anchor="start" style="paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round">ridge, batch 295</text><g class="m"><rect x="207.0" y="223.4" width="10" height="10" rx="5" data-pt=""/></g><text class="cap" x="40" y="343" text-anchor="start">reading</text><g class="h"><rect x="150" y="328" width="133.7" height="22" rx="2"/></g><text class="cap" x="40" y="373" text-anchor="start">arithmetic</text><g class="m"><rect x="150" y="358" width="2.0" height="22" rx="2" data-bm=""/></g><text class="sub2" x="291.7" y="343" text-anchor="start">41.8 ms, whatever the batch</text><line class="axis" x1="150" y1="388" x2="630" y2="388"/><line class="tick" x1="150.0" y1="388" x2="150.0" y2="393"/><text class="sub2" x="150.0" y="410" text-anchor="middle">0</text><line class="tick" x1="310.0" y1="388" x2="310.0" y2="393"/><text class="sub2" x="310.0" y="410" text-anchor="middle">50</text><line class="tick" x1="470.0" y1="388" x2="470.0" y2="393"/><text class="sub2" x="470.0" y="410" text-anchor="middle">100</text><line class="tick" x1="630.0" y1="388" x2="630.0" y2="393"/><text class="sub2" x="630.0" y="410" text-anchor="end">150 ms</text><text class="sub2" x="40" y="436" data-r1="">batch 1: intensity 1 operation per byte, attainable 3.35 of 989 TFLOP/s</text><text class="sub2" x="40" y="456" data-r2="">step = the longer of 41.8 ms reading and 0.142 ms arithmetic = 41.8 ms</text><text class="sub2" x="40" y="476" data-r3="">23.9 tokens a second in total; each user waits 41.8 ms per token</text><text class="cap" x="40" y="514" text-anchor="start">Each request added to the step adds 2 × 70 billion operations, 0.142 ms of arithmetic,</text><text class="cap" x="40" y="534" text-anchor="start">and no bytes. Up to 295 requests the arithmetic still finishes inside the 41.8 ms read:</text><text class="cap" x="40" y="554" text-anchor="start">the step costs the same, and every added request is a token for free.</text><text class="cap" x="40" y="594" text-anchor="start">Past 295 the arithmetic is the longer of the two. Each further request lengthens the</text><text class="cap" x="40" y="614" text-anchor="start">step by 0.142 ms for every user, and the total stops rising at 989 trillion ÷ 140</text><text class="cap" x="40" y="634" text-anchor="start">billion = 7,064 tokens a second.</text><text class="cap" x="40" y="674" text-anchor="start">This counts the weights alone. The next figures add what every request brings with it,</text><text class="cap" x="40" y="694" text-anchor="start">and the curve bends long before 295 ({{fig:v07-a09}}). The widget's arithmetic was</text><text class="cap" x="40" y="714" text-anchor="start">checked against Python at every setting.</text></svg></div><figcaption>Batching is free up to the ridge and costs every user time past it. Real batches stop far short of 295, for a reason the cache figures below work out.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const NS = [1, 2, 4, 8, 16, 32, 64, 128, 256, 295, 512, 1024], PEAK = 989e12, BW = 3.35e12, W = 140e9, P = 70e9;
  const A = {"X0": 110, "X1": 620, "Y0": 262, "Y1": 70, "xlo": 0.1, "xhi": 10000.0, "ylo": 1, "yhi": 1000}, BX0 = 150, BSC = 3200.0;
  const lg = Math.log10;
  const px = v => A.X0 + (lg(v) - lg(A.xlo)) / (lg(A.xhi) - lg(A.xlo)) * (A.X1 - A.X0);
  const py = v => A.Y0 - (lg(v) - lg(A.ylo)) / (lg(A.yhi) - lg(A.ylo)) * (A.Y0 - A.Y1);
  
  const fx = (v, d = 2) => { const s = Math.abs(v).toFixed(d); return (v < 0 && +s !== 0 ? '−' : '') + s; };
  const fcx = (v, d = 0) => { const s = fx(v, d), n = s.startsWith('−'), t = n ? s.slice(1) : s;
    const [w, fr] = t.split('.'); return (n ? '−' : '') + (+w).toLocaleString('en-US') + (fr ? '.' + fr : ''); };

  const fa = v => v < 10 ? fx(v, 2) : fx(v, 1);
  const ft = s => { const m = s * 1e3; return m < 1 ? fx(m, 3) : (m < 10 ? fx(m, 2) : fx(m, 1)); };
  const ftps = v => v < 100 ? fcx(v, 1) : fcx(v);
  const sl = fig.querySelector('input[type=range]'), val = fig.querySelector('.val');
  const q = s => fig.querySelector(s);
  function draw() {
    const n = NS[+sl.value];
    const att = Math.min(PEAK, BW * n) / 1e12, tm = 2 * P * n / PEAK, tr = W / BW, step = Math.max(tm, tr);
    const tps = n / step;
    val.textContent = String(n);
    const d = q('[data-pt]');
    d.setAttribute('x', (px(n) - 5).toFixed(1)); d.setAttribute('y', (py(att) - 5).toFixed(1));
    q('[data-r1]').textContent = `batch ${n}: intensity ${n} operation${n > 1 ? 's' : ''} per byte, attainable ${fa(att)} of 989 TFLOP/s`;
    q('[data-r2]').textContent = `step = the longer of ${ft(tr)} ms reading and ${ft(tm)} ms arithmetic = ${ft(step)} ms`;
    q('[data-r3]').textContent = `${ftps(tps)} tokens a second in total; each user waits ${ft(step)} ms per token`;
    q('[data-bm]').setAttribute('width', Math.max(tm * BSC, 2).toFixed(1));
  }
  sl.addEventListener('input', draw);
  q('button').addEventListener('click', () => { sl.value = 0; draw(); });
  draw();
})();</script></figure>
