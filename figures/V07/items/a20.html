<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:50</div><h3>A linear layer treats every row on its own</h3><svg viewBox='0 0 680 542' role='img'><title>A linear layer treats every row on its own</title><text class="hd" x="40" y="46">One weight matrix W, three token rows: one at a time, then stacked</text><text class="cap" x="40" y="88" text-anchor="start">row a</text><g class="u"><rect x="96" y="70" width="30" height="26" rx="3"/><text class="sub" x="111.0" y="83.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="130" y="70" width="30" height="26" rx="3"/><text class="sub" x="145.0" y="83.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="170" y="88" text-anchor="start">× W =</text><g class="m"><rect x="212" y="70" width="30" height="26" rx="3"/><text class="sub" x="227.0" y="83.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="246" y="70" width="30" height="26" rx="3"/><text class="sub" x="261.0" y="83.0" text-anchor="middle" dominant-baseline="central">2</text></g><text class="cap" x="40" y="128" text-anchor="start">row b</text><g class="u"><rect x="96" y="110" width="30" height="26" rx="3"/><text class="sub" x="111.0" y="123.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="u"><rect x="130" y="110" width="30" height="26" rx="3"/><text class="sub" x="145.0" y="123.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="170" y="128" text-anchor="start">× W =</text><g class="m"><rect x="212" y="110" width="30" height="26" rx="3"/><text class="sub" x="227.0" y="123.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="246" y="110" width="30" height="26" rx="3"/><text class="sub" x="261.0" y="123.0" text-anchor="middle" dominant-baseline="central">5</text></g><text class="cap" x="40" y="168" text-anchor="start">row c</text><g class="u"><rect x="96" y="150" width="30" height="26" rx="3"/><text class="sub" x="111.0" y="163.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="130" y="150" width="30" height="26" rx="3"/><text class="sub" x="145.0" y="163.0" text-anchor="middle" dominant-baseline="central">3</text></g><text class="sub2" x="170" y="168" text-anchor="start">× W =</text><g class="m"><rect x="212" y="150" width="30" height="26" rx="3"/><text class="sub" x="227.0" y="163.0" text-anchor="middle" dominant-baseline="central">−3</text></g><g class="m"><rect x="246" y="150" width="30" height="26" rx="3"/><text class="sub" x="261.0" y="163.0" text-anchor="middle" dominant-baseline="central">3</text></g><text class="sub2" x="96" y="204" text-anchor="start">W, the same for every row</text><g class="h"><rect x="96" y="212" width="30" height="26" rx="3"/><text class="sub" x="111.0" y="225.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="h"><rect x="130" y="212" width="30" height="26" rx="3"/><text class="sub" x="145.0" y="225.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="h"><rect x="96" y="246" width="30" height="26" rx="3"/><text class="sub" x="111.0" y="259.0" text-anchor="middle" dominant-baseline="central">−1</text></g><g class="h"><rect x="130" y="246" width="30" height="26" rx="3"/><text class="sub" x="145.0" y="259.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="340" y="64" text-anchor="start">stacked</text><g class="u"><rect x="340" y="70" width="30" height="26" rx="3"/><text class="sub" x="355.0" y="83.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="374" y="70" width="30" height="26" rx="3"/><text class="sub" x="389.0" y="83.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="340" y="104" width="30" height="26" rx="3"/><text class="sub" x="355.0" y="117.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="u"><rect x="374" y="104" width="30" height="26" rx="3"/><text class="sub" x="389.0" y="117.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="340" y="138" width="30" height="26" rx="3"/><text class="sub" x="355.0" y="151.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="374" y="138" width="30" height="26" rx="3"/><text class="sub" x="389.0" y="151.0" text-anchor="middle" dominant-baseline="central">3</text></g><text class="sub2" x="414" y="122" text-anchor="middle">×</text><g class="h"><rect x="426" y="87" width="30" height="26" rx="3"/><text class="sub" x="441.0" y="100.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="h"><rect x="460" y="87" width="30" height="26" rx="3"/><text class="sub" x="475.0" y="100.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="h"><rect x="426" y="121" width="30" height="26" rx="3"/><text class="sub" x="441.0" y="134.0" text-anchor="middle" dominant-baseline="central">−1</text></g><g class="h"><rect x="460" y="121" width="30" height="26" rx="3"/><text class="sub" x="475.0" y="134.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="504" y="122" text-anchor="middle">=</text><g class="m"><rect x="518" y="70" width="30" height="26" rx="3"/><text class="sub" x="533.0" y="83.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="552" y="70" width="30" height="26" rx="3"/><text class="sub" x="567.0" y="83.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="m"><rect x="518" y="104" width="30" height="26" rx="3"/><text class="sub" x="533.0" y="117.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="552" y="104" width="30" height="26" rx="3"/><text class="sub" x="567.0" y="117.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="m"><rect x="518" y="138" width="30" height="26" rx="3"/><text class="sub" x="533.0" y="151.0" text-anchor="middle" dominant-baseline="central">−3</text></g><g class="m"><rect x="552" y="138" width="30" height="26" rx="3"/><text class="sub" x="567.0" y="151.0" text-anchor="middle" dominant-baseline="central">3</text></g><text class="sub2" x="340" y="196" text-anchor="start">[3 × 2] × [2 × 2] = [3 × 2]: one multiply, one read of W</text><text class="cap" x="40" y="310" text-anchor="start">A linear projection multiplies each token's vector by one weight matrix</text><text class="cap" x="40" y="330" text-anchor="start">({{fig:v01-o085}}). Row a gives [1 × 1 + 0 × (−1), 1 × 2 + 0 × 1] = [1, 2]; b gives</text><text class="cap" x="40" y="350" text-anchor="start">[1, 5]; c gives [−3, 3].</text><text class="cap" x="40" y="390" text-anchor="start">Stack the three rows into one matrix and multiply once, and the answer's rows are</text><text class="cap" x="40" y="410" text-anchor="start">exactly the three separate answers. Each output row depends only on its own input row</text><text class="cap" x="40" y="430" text-anchor="start">and the shared weights, never on which request the row came from or what the other rows</text><text class="cap" x="40" y="450" text-anchor="start">hold.</text><text class="cap" x="40" y="490" text-anchor="start">So rows from different requests, at any position in their sequences, can share one</text><text class="cap" x="40" y="510" text-anchor="start">multiply and one read of W.</text></svg><figcaption>Stacking changes nothing about any row's answer, which is exactly what makes stacking safe.</figcaption></figure>
