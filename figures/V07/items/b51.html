<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 21:15</div><h3>Counting requests hands the machine to the heaviest tenant</h3><svg viewBox='0 0 680 418' role='img'><title>Counting requests hands the machine to the heaviest tenant</title><text class="hd" x="40" y="46">Twelve turns taken one request each, drawn as GPU time to scale</text><text class="sub2" x="40" y="80" text-anchor="start">B's requests five times A's</text><g class="s"><rect x="60" y="88" width="14.06" height="26" rx="3"/></g><g class="m"><rect x="75.56" y="88" width="76.28" height="26" rx="3"/><text class="sub" x="113.7" y="101.0" text-anchor="middle" dominant-baseline="central">B</text></g><g class="s"><rect x="153.33" y="88" width="14.06" height="26" rx="3"/></g><g class="m"><rect x="168.89" y="88" width="76.28" height="26" rx="3"/><text class="sub" x="207.02999999999997" y="101.0" text-anchor="middle" dominant-baseline="central">B</text></g><g class="s"><rect x="246.67" y="88" width="14.06" height="26" rx="3"/></g><g class="m"><rect x="262.22" y="88" width="76.28" height="26" rx="3"/><text class="sub" x="300.36" y="101.0" text-anchor="middle" dominant-baseline="central">B</text></g><g class="s"><rect x="340.0" y="88" width="14.06" height="26" rx="3"/></g><g class="m"><rect x="355.56" y="88" width="76.28" height="26" rx="3"/><text class="sub" x="393.7" y="101.0" text-anchor="middle" dominant-baseline="central">B</text></g><g class="s"><rect x="433.33" y="88" width="14.06" height="26" rx="3"/></g><g class="m"><rect x="448.89" y="88" width="76.28" height="26" rx="3"/><text class="sub" x="487.03" y="101.0" text-anchor="middle" dominant-baseline="central">B</text></g><g class="s"><rect x="526.67" y="88" width="14.06" height="26" rx="3"/></g><g class="m"><rect x="542.22" y="88" width="76.28" height="26" rx="3"/><text class="sub" x="580.36" y="101.0" text-anchor="middle" dominant-baseline="central">B</text></g><text class="sub2" x="40" y="148" text-anchor="start">B's requests a hundred times A's: A's turns are slivers</text><g class="s"><rect x="60" y="156" width="1.0" height="26" rx="3"/></g><g class="m"><rect x="60.92" y="156" width="90.91" height="26" rx="3"/><text class="sub" x="106.375" y="169.0" text-anchor="middle" dominant-baseline="central">B</text></g><g class="s"><rect x="153.33" y="156" width="1.0" height="26" rx="3"/></g><g class="m"><rect x="154.26" y="156" width="90.91" height="26" rx="3"/><text class="sub" x="199.71499999999997" y="169.0" text-anchor="middle" dominant-baseline="central">B</text></g><g class="s"><rect x="246.67" y="156" width="1.0" height="26" rx="3"/></g><g class="m"><rect x="247.59" y="156" width="90.91" height="26" rx="3"/><text class="sub" x="293.045" y="169.0" text-anchor="middle" dominant-baseline="central">B</text></g><g class="s"><rect x="340.0" y="156" width="1.0" height="26" rx="3"/></g><g class="m"><rect x="340.92" y="156" width="90.91" height="26" rx="3"/><text class="sub" x="386.375" y="169.0" text-anchor="middle" dominant-baseline="central">B</text></g><g class="s"><rect x="433.33" y="156" width="1.0" height="26" rx="3"/></g><g class="m"><rect x="434.26" y="156" width="90.91" height="26" rx="3"/><text class="sub" x="479.715" y="169.0" text-anchor="middle" dominant-baseline="central">B</text></g><g class="s"><rect x="526.67" y="156" width="1.0" height="26" rx="3"/></g><g class="m"><rect x="527.59" y="156" width="90.91" height="26" rx="3"/><text class="sub" x="573.0450000000001" y="169.0" text-anchor="middle" dominant-baseline="central">B</text></g><g class="s"><rect x="60" y="196" width="12" height="12" rx="3"/></g><text class="sub2" x="78" y="206" text-anchor="start">A's request</text><g class="m"><rect x="170" y="196" width="12" height="12" rx="3"/></g><text class="sub2" x="188" y="206" text-anchor="start">B's request</text><text class="cap" x="40" y="246" text-anchor="start">Two customers, or tenants, share one deployment. A sends short requests, 80 tokens of</text><text class="cap" x="40" y="266" text-anchor="start">prompt and answer each; B sends long ones. A scheduler that takes one request from each</text><text class="cap" x="40" y="286" text-anchor="start">in turn looks fair: each gets half the requests.</text><text class="cap" x="40" y="326" text-anchor="start">But the machine's work is tokens, not requests. With B's requests five times A's, B gets</text><text class="cap" x="40" y="346" text-anchor="start">6 × 400 = 2,400 of 2,880 tokens of work, 83.3%. One request can be a hundred times the</text><text class="cap" x="40" y="366" text-anchor="start">size of another, and then B gets 99.0%, while A waits behind a hundred times its own</text><text class="cap" x="40" y="386" text-anchor="start">work for every request it sends.</text></svg><figcaption>Drawn to scale. Taking turns is fair to requests, not to customers: the heavy tenant takes the machine without ever sending more often.</figcaption></figure>
