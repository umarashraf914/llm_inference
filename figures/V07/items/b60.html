r="start">blue</text><g class="s"><rect x="120" y="254" width="64.87074839730151" height="20" rx="3"/></g><text class="sub2" x="440" y="269" text-anchor="start">21.6%</text><text class="sub2" x="540" y="269" text-anchor="start">47.5%</text><text class="cap" x="40" y="295" text-anchor="start">green</text><rect x="120" y="280" width="58.69748048587465" height="20" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="440" y="295" text-anchor="start">19.6%</text><text class="cap" x="40" y="321" text-anchor="start">gold</text><rect x="120" y="306" width="53.11167668805495" height="20" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="440" y="321" text-anchor="start">17.7%</text><text class="cap" x="40" y="347" text-anchor="start">grey</text><rect x="120" y="332" width="48.05743240198031" height="20" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="440" y="347" text-anchor="start">16.0%</text><text class="cap" x="40" y="373" text-anchor="start">the</text><rect x="120" y="358" width="3.5693974642885475" height="20" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="440" y="373" text-anchor="start">1.2%</text><text class="sub2" x="440" y="218" text-anchor="start">share</text><text class="sub2" x="540" y="218" text-anchor="start">kept, rescaled</text><text class="cap" x="40" y="416" text-anchor="start">Top-k ranks the tokens by probability, keeps the k highest, drops the rest and rescales</text><text class="cap" x="40" y="436" text-anchor="start">the survivors to sum to one. On the confident list with k = 2, cat and dog become 75.0%</text><text class="cap" x="40" y="456" text-anchor="start">and 25.0%.</text><text class="cap" x="40" y="496" text-anchor="start">On the unsure list the same k = 2 keeps red and blue and throws away green, gold and</text><text class="cap" x="
