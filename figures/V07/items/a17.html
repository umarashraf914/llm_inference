<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:02</div><h3>A median is the middle of the sorted line</h3><svg viewBox='0 0 680 646' role='img'><title>A median is the middle of the sorted line</title><text class="hd" x="40" y="46">Ten requests' time per generated token, in milliseconds (illustrative)</text><text class="cap" x="40" y="84" text-anchor="start">as they finished</text><g class="u"><rect x="170" y="68" width="41" height="24" rx="3"/><text class="sub" x="190.5" y="80.0" text-anchor="middle" dominant-baseline="central">200</text></g><g class="u"><rect x="217" y="68" width="41" height="24" rx="3"/><text class="sub" x="237.5" y="80.0" text-anchor="middle" dominant-baseline="central">150</text></g><g class="u"><rect x="264" y="68" width="41" height="24" rx="3"/><text class="sub" x="284.5" y="80.0" text-anchor="middle" dominant-baseline="central">600</text></g><g class="u"><rect x="311" y="68" width="41" height="24" rx="3"/><text class="sub" x="331.5" y="80.0" text-anchor="middle" dominant-baseline="central">185</text></g><g class="u"><rect x="358" y="68" width="41" height="24" rx="3"/><text class="sub" x="378.5" y="80.0" text-anchor="middle" dominant-baseline="central">170</text></g><g class="u"><rect x="405" y="68" width="41" height="24" rx="3"/><text class="sub" x="425.5" y="80.0" text-anchor="middle" dominant-baseline="central">240</text></g><g class="u"><rect x="452" y="68" width="41" height="24" rx="3"/><text class="sub" x="472.5" y="80.0" text-anchor="middle" dominant-baseline="central">195</text></g><g class="u"><rect x="499" y="68" width="41" height="24" rx="3"/><text class="sub" x="519.5" y="80.0" text-anchor="middle" dominant-baseline="central">160</text></g><g class="u"><rect x="546" y="68" width="41" height="24" rx="3"/><text class="sub" x="566.5" y="80.0" text-anchor="middle" dominant-baseline="central">210</text></g><g class="u"><rect x="593" y="68" width="41" height="24" rx="3"/><text class="sub" x="613.5" y="80.0" text-anchor="middle" dominant-baseline="central">180</text></g><text class="cap" x="40" y="242" text-anchor="start">sorted</text><g class="u"><rect x="170" y="220.0" width="41" height="30.0" rx="2"/></g><text class="sub2" x="190.5" y="214.0" text-anchor="middle">150</text><text class="sub2" x="190.5" y="266" text-anchor="middle">1</text><g class="u"><rect x="217" y="218.0" width="41" height="32.0" rx="2"/></g><text class="sub2" x="237.5" y="212.0" text-anchor="middle">160</text><text class="sub2" x="237.5" y="266" text-anchor="middle">2</text><g class="u"><rect x="264" y="216.0" width="41" height="34.0" rx="2"/></g><text class="sub2" x="284.5" y="210.0" text-anchor="middle">170</text><text class="sub2" x="284.5" y="266" text-anchor="middle">3</text><g class="u"><rect x="311" y="214.0" width="41" height="36.0" rx="2"/></g><text class="sub2" x="331.5" y="208.0" text-anchor="middle">180</text><text class="sub2" x="331.5" y="266" text-anchor="middle">4</text><g class="m"><rect x="358" y="213.0" width="41" height="37.0" rx="2"/></g><text class="sub2" x="378.5" y="207.0" text-anchor="middle">185</text><text class="sub2" x="378.5" y="266" text-anchor="middle">5</text><g class="m"><rect x="405" y="211.0" width="41" height="39.0" rx="2"/></g><text class="sub2" x="425.5" y="205.0" text-anchor="middle">195</text><text class="sub2" x="425.5" y="266" text-anchor="middle">6</text><g class="u"><rect x="452" y="210.0" width="41" height="40.0" rx="2"/></g><text class="sub2" x="472.5" y="204.0" text-anchor="middle">200</text><text class="sub2" x="472.5" y="266" text-anchor="middle">7</text><g class="u"><rect x="499" y="208.0" width="41" height="42.0" rx="2"/></g><text class="sub2" x="519.5" y="202.0" text-anchor="middle">210</text><text class="sub2" x="519.5" y="266" text-anchor="middle">8</text><g class="u"><rect x="546" y="202.0" width="41" height="48.0" rx="2"/></g><text class="sub2" x="566.5" y="196.0" text-anchor="middle">240</text><text class="sub2" x="566.5" y="266" text-anchor="middle">9</text><g class="u"><rect x="593" y="130.0" width="41" height="120.0" rx="2"/></g><text class="sub2" x="613.5" y="124.0" text-anchor="middle">600</text><text class="sub2" x="613.5" y="266" text-anchor="middle">10</text><text class="sub2" x="170" y="284" text-anchor="start">position in the sorted line</text><text class="hd" x="40" y="320">Two summaries of the same ten, on one scale</text><text class="cap" x="40" y="349" text-anchor="start">median</text><g class="m"><rect x="170" y="332" width="253.33333333333331" height="24" rx="2"/></g><text class="sub2" x="433.3" y="349" text-anchor="start">190 ms</text><text class="cap" x="40" y="383" text-anchor="start">average</text><g class="u"><rect x="170" y="366" width="305.3333333333333" height="24" rx="2"/></g><text class="sub2" x="485.3" y="383" text-anchor="start">229 ms</text><text class="cap" x="40" y="434" text-anchor="start">A median is the middle value once the measurements are sorted. With an odd count it is</text><text class="cap" x="40" y="454" text-anchor="start">the middle one; with an even count it is the average of the two middle ones: here the</text><text class="cap" x="40" y="474" text-anchor="start">5th and 6th, (185 + 195) ÷ 2 = 190 ms. Half the requests did better, half worse.</text><text class="cap" x="40" y="514" text-anchor="start">The average, total ÷ count = 2,290 ÷ 10 = 229 ms, is pulled up by the one slow request</text><text class="cap" x="40" y="534" text-anchor="start">at 600 ms. The median would not move if that request took a minute, which is why latency</text><text class="cap" x="40" y="554" text-anchor="start">is usually quoted as a median.</text><text class="cap" x="40" y="594" text-anchor="start">Orca's result uses one per request: its total time divided by the tokens it generated. A</text><text class="cap" x="40" y="614" text-anchor="start">median of 190 ms per generated token means half the requests did better than that.</text></svg><figcaption>The median says what a typical request saw and is blind to the slowest few, which is why {{ref:v07-a28}} adds the tail.</figcaption></figure>
