<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:08</div><h3>At the same median latency, Orca served 36.9 times the requests</h3><svg viewBox='0 0 680 418' role='img'><title>At the same median latency, Orca served 36.9 times the requests</title><text class="hd" x="40" y="46">GPT-3 175B on A100s, both held to a median 190 ms per generated token</text><text class="cap" x="40" y="88" text-anchor="start">Orca</text><g class="s"><rect x="210" y="70" width="400.0" height="26" rx="2"/><text class="sub" x="410.0" y="83.0" text-anchor="middle" dominant-baseline="central">6.81 requests a second</text></g><text class="cap" x="40" y="128" text-anchor="start">FasterTransformer</text><g class="h"><rect x="210" y="110" width="10.866372980910427" height="26" rx="2"/></g><text class="sub2" x="230.9" y="128" text-anchor="start">0.185 requests a second</text><text class="cap" x="40" y="186" text-anchor="start">Orca's paper set it against NVIDIA's FasterTransformer, a fast engine that batched whole</text><text class="cap" x="40" y="206" text-anchor="start">requests, both serving GPT-3 175B on A100s, the GPU generation before the H100.</text><text class="cap" x="40" y="226" text-anchor="start">Throughput only means something at a stated latency, because any system can serve more</text><text class="cap" x="40" y="246" text-anchor="start">by making everyone wait longer ({{fig:v01-o142}}); so both were held to the same median,</text><text class="cap" x="40" y="266" text-anchor="start">190 ms per generated token.</text><text class="cap" x="40" y="306" text-anchor="start">At that latency FasterTransformer served 0.185 requests a second and Orca 6.81: 36.9</text><text class="cap" x="40" y="326" text-anchor="start">times, as the paper reports. From the rounded rates the division gives 36.8.</text><text class="cap" x="40" y="366" text-anchor="start">vLLM, measured against Orca a year later, reported two to four times Orca's throughput</text><text class="cap" x="40" y="386" text-anchor="start">at the same latency, by fitting more sequences into the same memory.</text></svg><figcaption>Same model, same hardware, same median latency, drawn to scale. The gap is scheduling alone.</figcaption></figure>
