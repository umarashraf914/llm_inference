-anchor="start">and 1.2%.</text><text class="cap" x="40" y="354" text-anchor="start">At T = 1 nothing changes. Below 1 the distribution sharpens toward a spike on the top</text><text class="cap" x="40" y="374" text-anchor="start">score, approaching greedy; above 1 it flattens, spreading probability toward unlikely</text><text class="cap" x="40" y="394" text-anchor="start">tokens.</text></svg><figcaption>Bars to scale within each column. Temperature never changes the order of the tokens, only how far apart their chances are.</figcaption></figure>
