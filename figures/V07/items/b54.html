<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 22:08</div><h3>The right split between the pools follows the traffic</h3><svg viewBox='0 0 680 536' role='img'><title>The right split between the pools follows the traffic</title><text class="hd" x="40" y="46">GPUs needed at 10 requests a second, drawn to scale</text><text class="cap" x="40" y="90" text-anchor="start">long prompts, short answers</text><text class="sub2" x="40" y="106" text-anchor="start">2,000 in, 200 out</text><g class="m"><rect x="220" y="76" width="152.96367112810708" height="30" rx="3"/><text class="sub" x="296.48183556405354" y="91.0" text-anchor="middle" dominant-baseline="central">prefill</text></g><g class="s"><rect x="372.9636711281071" y="76" width="35.874439461883405" height="30" rx="3"/></g><text class="sub2" x="220" y="122" text-anchor="start">3.06 prefill + 0.72 decode GPUs: 81% prefill</text><text class="cap" x="40" y="164" text-anchor="start">short prompts, long answers</text><text class="sub2" x="40" y="180" text-anchor="start">200 in, 2,000 out</text><g class="m"><rect x="220" y="150" width="15.296367112810708" height="30" rx="3"/></g><g class="s"><rect x="235.2963671128107" y="150" width="358.7443946188341" height="30" rx="3"/><text class="sub" x="414.66856442222775" y="165.0" text-anchor="middle" dominant-baseline="central">decode</text></g><text class="sub2" x="220" y="196" text-anchor="start">0.31 prefill + 7.17 decode GPUs: 4% prefill</text><g class="m"><rect x="220" y="232" width="12" height="12" rx="3"/></g><text class="sub2" x="238" y="242" text-anchor="start">prefill GPUs</text><g class="s"><rect x="340" y="232" width="12" height="12" rx="3"/></g><text class="sub2" x="358" y="242" text-anchor="start">decode GPUs</text><text class="cap" x="40" y="284" text-anchor="start">Prefill GPUs are needed in proportion to prompt tokens, decode GPUs in proportion to</text><text class="cap" x="40" y="304" text-anchor="start">output tokens. Take the per-GPU rates of the 96-GPU SGLang run: 52,300 ÷ 8 = 6,537.5</text><text class="cap" x="40" y="324" text-anchor="start">prompt tokens a second on a prefill GPU, and 22,300 ÷ 8 = 2,787.5 output tokens on a</text><text class="cap" x="40" y="344" text-anchor="start">decode GPU. At 10 requests a second, long prompts with short answers need 10 × 2,000 ÷</text><text class="cap" x="40" y="364" text-anchor="start">6,537.5 = 3.06 prefill GPUs and 10 × 200 ÷ 2,787.5 = 0.72 decode GPUs.</text><text class="cap" x="40" y="404" text-anchor="start">Short prompts with long answers need the opposite, 0.31 and 7.17. The right split moves</text><text class="cap" x="40" y="424" text-anchor="start">from 81% prefill to 4% with nothing but the traffic changing.</text><text class="cap" x="40" y="464" text-anchor="start">NVIDIA Dynamo's planner watches load across the two pools and moves GPUs from one to the</text><text class="cap" x="40" y="484" text-anchor="start">other, so the split tracks the traffic actually arriving rather than the traffic someone</text><text class="cap" x="40" y="504" text-anchor="start">assumed when the cluster was deployed.</text></svg><figcaption>Rates borrowed from one measured run and applied to other mixes, so illustrative. The point survives any rates: the split is a property of the traffic, not of the model.</figcaption></figure>
