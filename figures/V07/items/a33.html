<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:29</div><h3>Networks count bits: 12.1 GB a second is 97 gigabits</h3><svg viewBox='0 0 680 530' role='img'><title>Networks count bits: 12.1 GB a second is 97 gigabits</title><text class="hd" x="40" y="46">10 requests a second, each moving one 1.21 GB cache: the traffic, then three links</text><g class="u"><rect x="40" y="66" width="330" height="34" rx="6"/><text class="sub" x="205.0" y="83.0" text-anchor="middle" dominant-baseline="central">10 × 1.208 GB = 12.08 GB/s</text></g><text class="sub2" x="386" y="88" text-anchor="start">× 8 bits per byte = 96.6 Gb/s</text><text class="hd" x="40" y="140">Share of each link this traffic takes</text><text class="cap" x="40" y="173" text-anchor="start">100 Gb/s Ethernet</text><rect x="230" y="156" width="330" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="230" y="156" width="318.90132172799997" height="24" rx="2"/></g><text class="sub2" x="570" y="173" text-anchor="start">97%</text><text class="cap" x="40" y="209" text-anchor="start">400 Gb/s network port</text><rect x="230" y="192" width="330" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="230" y="192" width="79.72533043199999" height="24" rx="2"/></g><text class="sub2" x="570" y="209" text-anchor="start">24%</text><text class="cap" x="40" y="245" text-anchor="start">NVLink, H100</text><rect x="230" y="228" width="330" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="230" y="228" width="4.429185024000001" height="24" rx="2"/></g><text class="sub2" x="570" y="245" text-anchor="start">1.3%</text><text class="cap" x="40" y="298" text-anchor="start">Memory and file sizes are counted in bytes, network links in bits, and a byte is 8 bits</text><text class="cap" x="40" y="318" text-anchor="start">({{fig:v01-o073}}): a link sold as 400 gigabits a second carries 50 gigabytes a second.</text><text class="cap" x="40" y="358" text-anchor="start">Ten 512-token OPT-66B requests a second move 10 × 1.208 GB = 12.08 GB/s, which is 96.6</text><text class="cap" x="40" y="378" text-anchor="start">Gb/s. DistServe wrote 11.3 GB/s and 90 Gbps by multiplying the binary 1.13 by 10 and by</text><text class="cap" x="40" y="398" text-anchor="start">8; in the decimal units links are sold in, the figure is 7% higher. Said as 90 GB per</text><text class="cap" x="40" y="418" text-anchor="start">second, the unit would be wrong by a factor of 8.</text><text class="cap" x="40" y="458" text-anchor="start">On one 100 Gb/s Ethernet link, the kind Sarathi-Serve's machines used, that traffic</text><text class="cap" x="40" y="478" text-anchor="start">alone takes 97% of the link; on a 400 Gb/s port, 24%; over NVLink inside a node, about</text><text class="cap" x="40" y="498" text-anchor="start">1%.</text></svg><figcaption>The traffic is the same however it is written. Whether it is a rounding error or the whole pipe depends on the link.</figcaption></figure>
