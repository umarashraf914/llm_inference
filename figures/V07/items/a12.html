<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:59</div><h3>Reserving for the longest answer leaves three-quarters of the memory empty</h3><svg viewBox='0 0 680 518' role='img'><title>Reserving for the longest answer leaves three-quarters of the memory empty</title><text class="hd" x="40" y="46">Four requests, each given one unbroken run of 2,048 slots, to scale</text><g class="s"><rect x="40" y="70" width="22.66" height="34" rx="2"/><text class="sub" x="51.33" y="87.0" text-anchor="middle" dominant-baseline="central">A</text></g><g class="h"><rect x="62.66" y="70" width="93.35" height="34" rx="2"/><text class="sub" x="109.335" y="87.0" text-anchor="middle" dominant-baseline="central">reserved</text></g><rect x="156.01" y="70" width="50.98" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="181.5" y="87.0" text-anchor="middle" dominant-baseline="central">free</text><g class="s"><rect x="206.99" y="70" width="39.65" height="34" rx="2"/><text class="sub" x="226.815" y="87.0" text-anchor="middle" dominant-baseline="central">B</text></g><g class="h"><rect x="246.65" y="70" width="76.36" height="34" rx="2"/><text class="sub" x="284.83" y="87.0" text-anchor="middle" dominant-baseline="central">reserved</text></g><rect x="323.01" y="70" width="39.65" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="342.835" y="87.0" text-anchor="middle" dominant-baseline="central">free</text><g class="s"><rect x="362.66" y="70" width="14.16" height="34" rx="2"/><text class="sub" x="369.74" y="87.0" text-anchor="middle" dominant-baseline="central">C</text></g><g class="h"><rect x="376.82" y="70" width="101.85" height="34" rx="2"/><text class="sub" x="427.745" y="87.0" text-anchor="middle" dominant-baseline="central">reserved</text></g><rect x="478.67" y="70" width="45.32" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="501.33000000000004" y="87.0" text-anchor="middle" dominant-baseline="central">free</text><g class="s"><rect x="523.99" y="70" width="62.31" height="34" rx="2"/><text class="sub" x="555.145" y="87.0" text-anchor="middle" dominant-baseline="central">D</text></g><g class="h"><rect x="586.3" y="70" width="53.7" height="34" rx="2"/></g><text class="sub2" x="40" y="126" text-anchor="start">real tokens are the green part of each run; the rest is reserved for tokens not yet written</text><rect x="40" y="146" width="116.01" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="98.005" y="159.0" text-anchor="middle" dominant-baseline="central">request E</text><text class="sub2" x="168.0" y="163" text-anchor="start">needs 2,048 slots in a row, and no free gap is longer than 900</text><text class="hd" x="40" y="204">Where the 10,592 slots went</text><g class="s"><rect x="40" y="216" width="138.78" height="30" rx="2"/><text class="sub" x="109.39" y="231.0" text-anchor="middle" dominant-baseline="central">real tokens 23.1%</text></g><g class="h"><rect x="178.78" y="216" width="325.26" height="30" rx="2"/><text class="sub" x="341.40999999999997" y="231.0" text-anchor="middle" dominant-baseline="central">reserved, empty 54.2%</text></g><rect x="504.05" y="216" width="135.95" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="572.025" y="231.0" text-anchor="middle" dominant-baseline="central">free, unusable 22.7%</text><text class="cap" x="40" y="286" text-anchor="start">Before paging, a system gave each request one unbroken run of memory, sized for the</text><text class="cap" x="40" y="306" text-anchor="start">longest answer it might produce, because the cache had to sit in one contiguous stretch</text><text class="cap" x="40" y="326" text-anchor="start">and could not grow ({{fig:v03-o083}}).</text><text class="cap" x="40" y="366" text-anchor="start">That wastes memory twice. Inside each run are slots reserved for tokens not yet written,</text><text class="cap" x="40" y="386" text-anchor="start">and perhaps never: 5,742 here. Between runs are gaps too small for anyone: 2,400 slots</text><text class="cap" x="40" y="406" text-anchor="start">are free, yet a fifth request needing 2,048 in a row fits nowhere.</text><text class="cap" x="40" y="446" text-anchor="start">Only 2,450 of the 10,592 slots hold real tokens, 23.1%. Profiling schemes like this one,</text><text class="cap" x="40" y="466" text-anchor="start">the vLLM paper (Kwon et al., 2023) found 20.4% to 38.2% of the cache memory holding real</text><text class="cap" x="40" y="486" text-anchor="start">tokens.</text></svg><figcaption>Free space that cannot be used is lost all the same. Both wastes come from one rule: a request's memory must be one unbroken run.</figcaption></figure>
