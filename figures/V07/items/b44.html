<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 16:57</div><h3>Two block tables share one physical copy until they disagree</h3><svg viewBox='0 0 680 848' role='img'><title>Two block tables share one physical copy until they disagree</title><text class="hd" x="40" y="46">Both sequences hold the same 40 tokens: 2 full blocks, and one holding 8</text><text class="sub2" x="206.0" y="70" text-anchor="middle">logical block 0</text><text class="sub2" x="332.0" y="70" text-anchor="middle">logical block 1</text><text class="sub2" x="458.0" y="70" text-anchor="middle">logical block 2</text><text class="cap" x="40" y="93" text-anchor="start">A's table</text><text class="cap" x="40" y="151" text-anchor="start">memory</text><text class="cap" x="40" y="209" text-anchor="start">B's table</text><g class="s"><rect x="150" y="124" width="112" height="44" rx="4"/><text class="lbl" x="206.0" y="137.0" text-anchor="middle" dominant-baseline="central">block 7</text><text class="sub" x="206.0" y="155.0" text-anchor="middle" dominant-baseline="central">0–15 · count 2</text></g><g class="s"><rect x="276" y="124" width="112" height="44" rx="4"/><text class="lbl" x="332.0" y="137.0" text-anchor="middle" dominant-baseline="central">block 1</text><text class="sub" x="332.0" y="155.0" text-anchor="middle" dominant-baseline="central">16–31 · count 2</text></g><g class="s"><rect x="402" y="124" width="112" height="44" rx="4"/><text class="lbl" x="458.0" y="137.0" text-anchor="middle" dominant-baseline="central">block 3</text><text class="sub" x="458.0" y="155.0" text-anchor="middle" dominant-baseline="central">32–39 · count 2</text></g><g class="u"><rect x="180.0" y="76" width="52" height="24" rx="3"/><text class="sub" x="206.0" y="88.0" text-anchor="middle" dominant-baseline="central">→ 7</text></g><line class="conn" x1="206.0" y1="102" x2="206.0" y2="120" marker-end="url(#arw)"/><g class="u"><rect x="306.0" y="76" width="52" height="24" rx="3"/><text class="sub" x="332.0" y="88.0" text-anchor="middle" dominant-baseline="central">→ 1</text></g><line class="conn" x1="332.0" y1="102" x2="332.0" y2="120" marker-end="url(#arw)"/><g class="u"><rect x="432.0" y="76" width="52" height="24" rx="3"/><text class="sub" x="458.0" y="88.0" text-anchor="middle" dominant-baseline="central">→ 3</text></g><line class="conn" x1="458.0" y1="102" x2="458.0" y2="120" marker-end="url(#arw)"/><g class="u"><rect x="180.0" y="192" width="52" height="24" rx="3"/><text class="sub" x="206.0" y="204.0" text-anchor="middle" dominant-baseline="central">→ 7</text></g><line class="conn" x1="206.0" y1="190" x2="206.0" y2="172" marker-end="url(#arw)"/><g class="u"><rect x="306.0" y="192" width="52" height="24" rx="3"/><text class="sub" x="332.0" y="204.0" text-anchor="middle" dominant-baseline="central">→ 1</text></g><line class="conn" x1="332.0" y1="190" x2="332.0" y2="172" marker-end="url(#arw)"/><g class="u"><rect x="432.0" y="192" width="52" height="24" rx="3"/><text class="sub" x="458.0" y="204.0" text-anchor="middle" dominant-baseline="central">→ 3</text></g><line class="conn" x1="458.0" y1="190" x2="458.0" y2="172" marker-end="url(#arw)"/><text class="hd" x="40" y="246">Each writes its token 40, which goes in block 2 at slot 8: copy that block first</text><text class="cap" x="40" y="293" text-anchor="start">A's table</text><text class="cap" x="40" y="351" text-anchor="start">memory</text><text class="cap" x="40" y="409" text-anchor="start">B's table</text><g class="s"><rect x="150" y="324" width="112" height="44" rx="4"/><text class="lbl" x="206.0" y="337.0" text-anchor="middle" dominant-baseline="central">block 7</text><text class="sub" x="206.0" y="355.0" text-anchor="middle" dominant-baseline="central">0–15 · count 2</text></g><g class="s"><rect x="276" y="324" width="112" height="44" rx="4"/><text class="lbl" x="332.0" y="337.0" text-anchor="middle" dominant-baseline="central">block 1</text><text class="sub" x="332.0" y="355.0" text-anchor="middle" dominant-baseline="central">16–31 · count 2</text></g><g class="m"><rect x="402" y="324" width="112" height="44" rx="4"/><text class="lbl" x="458.0" y="337.0" text-anchor="middle" dominant-baseline="central">block 3</text><text class="sub" x="458.0" y="355.0" text-anchor="middle" dominant-baseline="central">32–40 · count 1</text></g><g class="m"><rect x="528" y="324" width="112" height="44" rx="4"/><text class="lbl" x="584.0" y="337.0" text-anchor="middle" dominant-baseline="central">block 9</text><text class="sub" x="584.0" y="355.0" text-anchor="middle" dominant-baseline="central">copy · count 1</text></g><g class="u"><rect x="180.0" y="276" width="52" height="24" rx="3"/><text class="sub" x="206.0" y="288.0" text-anchor="middle" dominant-baseline="central">→ 7</text></g><line class="conn" x1="206.0" y1="302" x2="206.0" y2="320" marker-end="url(#arw)"/><g class="u"><rect x="306.0" y="276" width="52" height="24" rx="3"/><text class="sub" x="332.0" y="288.0" text-anchor="middle" dominant-baseline="central">→ 1</text></g><line class="conn" x1="332.0" y1="302" x2="332.0" y2="320" marker-end="url(#arw)"/><g class="u"><rect x="432.0" y="276" width="52" height="24" rx="3"/><text class="sub" x="458.0" y="288.0" text-anchor="middle" dominant-baseline="central">→ 3</text></g><line class="conn" x1="458.0" y1="302" x2="458.0" y2="320" marker-end="url(#arw)"/><g class="u"><rect x="180.0" y="392" width="52" height="24" rx="3"/><text class="sub" x="206.0" y="404.0" text-anchor="middle" dominant-baseline="central">→ 7</text></g><line class="conn" x1="206.0" y1="390" x2="206.0" y2="372" marker-end="url(#arw)"/><g class="u"><rect x="306.0" y="392" width="52" height="24" rx="3"/><text class="sub" x="332.0" y="404.0" text-anchor="middle" dominant-baseline="central">→ 1</text></g><line class="conn" x1="332.0" y1="390" x2="332.0" y2="372" marker-end="url(#arw)"/><g class="u"><rect x="432.0" y="392" width="52" height="24" rx="3"/><text class="sub" x="458.0" y="404.0" text-anchor="middle" dominant-baseline="central">→ 9</text></g><line class="conn" x1="458.0" y1="390" x2="458.0" y2="381"/><line class="conn" x1="458.0" y1="381" x2="584.0" y2="381"/><line class="conn" x1="584.0" y1="381" x2="584.0" y2="372" marker-end="url(#arw)"/><text class="cap" x="40" y="456" text-anchor="start">With paged memory a sequence's cache lives in blocks of 16 tokens, and its block table</text><text class="cap" x="40" y="476" text-anchor="start">lists which physical block holds each one ({{fig:v07-a13}}). Two sequences sharing a</text><text class="cap" x="40" y="496" text-anchor="start">40-token prefix simply list the same physical blocks: 40 = 2 × 16 + 8, so two blocks are</text><text class="cap" x="40" y="516" text-anchor="start">full and the third holds 8 tokens. A count on each block records how many tables point</text><text class="cap" x="40" y="536" text-anchor="start">at it.</text><text class="cap" x="40" y="576" text-anchor="start">Nothing shared is ever copied, because a token's keys and values never change once</text><text class="cap" x="40" y="596" text-anchor="start">written. Only the partly filled block is at risk: token 40 belongs in block 2 at slot 40</text><text class="cap" x="40" y="616" text-anchor="start">− 32 = 8, and the two sequences write different tokens there. So that block is copied</text><text class="cap" x="40" y="636" text-anchor="start">first, and each sequence writes into its own.</text><text class="cap" x="40" y="676" text-anchor="start">On Llama 3 8B a block is 16 × 131,072 bytes = 2 MiB, so diverging costs one 2 MiB copy</text><text class="cap" x="40" y="696" text-anchor="start">rather than the 5 MiB prefix. A 2,000-token system prompt fills 125 blocks exactly and</text><text class="cap" x="40" y="716" text-anchor="start">needs no copy at all. Shared by 50 requests, it is stored once instead of 50 times,</text><text class="cap" x="40" y="736" text-anchor="start">which saves 12.8 GB.</text><text class="cap" x="40" y="776" text-anchor="start">An operating system does the same when a program forks: the new copy of the running</text><text class="cap" x="40" y="796" text-anchor="start">program shares its parent's memory pages, marked read-only, and a page is copied only</text><text class="cap" x="40" y="816" text-anchor="start">when one side writes to it. That is what copy-on-write means.</text></svg><figcaption>Paging is what made sharing free. Without fixed-size blocks two sequences could not point at the same prefix, and sharing it would mean copying it.</figcaption></figure>
