iddle" dominant-baseline="central">4</text></g><text class="cap" x="40" y="177" text-anchor="start">per read</text><g class="s"><rect x="110.0" y="162" width="8.12" height="16" rx="0"/></g><g class="s"><rect x="118.12" y="166" width="16.25" height="12" rx="0"/></g><g class="s"><rect x="134.38" y="170" width="36.56" height="8" rx="0"/></g><g class="s"><rect x="170.94" y="174" width="459.06" height="4" rx="0"/></g><text class="sub2" x="110" y="208" text-anchor="start">continuous: a waiting request takes each seat the moment it frees</text><text class="cap" x="40" y="229" text-anchor="start">seat 1</text><rect x="110" y="216" width="520" height="18" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="110.0" y="216" width="8.12" height="18" rx="2"/></g><g class="m"><rect x="118.12" y="216" width="101.56" height="18" rx="2"/><text class="sub" x="168.9" y="225.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="m"><rect x="219.69" y="216" width="410.31" height="18" rx="2"/><text class="sub" x="424.845" y="225.0" text-anchor="middle" dominant-baseline="central">8</text></g><text class="cap" x="40" y="251" text-anchor="start">seat 2</text><rect x="110" y="238" width="520" height="18" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="110.0" y="238" width="24.38" height="18" rx="2"/><text class="sub" x="122.19" y="247.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="m"><rect x="134.38" y="238" width="304.69" height="18" rx="2"/><text class="sub" x="286.725" y="247.0" text-anchor="middle" dominant-baseline="central">6</text></g><g class="m"><rect x="439.06" y="238" width="81.25" height="18" rx="2"/><text class="sub" x="479.685" y="247.0" text-anchor="middle" dominant-baseline="central">10</text></g><g class="m"><rect x="520.31" y="238" width="109.69" height="18" rx="2"/><text class="sub" x="575.155" y="247.0" text-anchor="middle" dominant-baseline="central">11</text></g><text class="cap" x="40" y="273" text-anchor="start">seat 3</text><rect x="110" y="260" width="520" height="18" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="110.0" y="260" width="60.94" height="18" rx="2"/><text class="sub" x="140.47" y="269.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="m"><rect x="170.94" y="260" width="203.12" height="18" rx="2"/><text class="sub" x="272.5" y="269.0" text-anchor="middle" dominant-baseline="central">7</text></g><g class="m"><rect x="374.06" y="260" width="152.34" height="18" rx="2"/><text class="sub" x="450.23" y="269.0" text-anchor="middle" dominant-baseline="central">9</text></g><text class="cap" x="40" y="295" text-anchor="start">seat 4</text><rect x="110" y="282" width="520" height="18" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="110.0" y="282" width="520.0" height="18" rx="2"/><text class="sub" x="370.0" y="291.0" text-anchor="middle" dominant-baseline="central">4</text></g><text class="cap" x="40" y="325" text-anchor="start">per read</text><g class="s"><rect x="110.0" y="310" width="416.41" height="16" rx="0"/></g><g class="s"><rect x="526.41" y="314" width="103.59" height="12" rx="0"/></g><line class="axis" x1="110" y1="336" x2="630" y2="336"/><line class="tick" x1="110.0" y1="336" x2="110.0" y2="341"/><text class="sub2" x="110.0" y="355" text-anchor="middle">0</text><line class="tick" x1="240.0" y1="336" x2="240.0" y2="341"/><text class="sub2" x="240.0" y="355" text-anchor="middle">128</text><line class="tick" x1="370.0" y1="336" x2="370.0" y2="341"/><text class="sub2" x="370.0" y="355" text-anchor="middle">256</text><line class="tick" x1="500.0" y1="336" x2="500.0" y2="341"/><text class="sub2" x="500.0" y="355" text-anchor="middle">384</text><line class="tick" x1="630.0" y1="336" x2="630.0" y2="341"/><text class="sub2" x="630.0" y="355" text-anchor="end">512 steps</text><line class="mark xok" x1="630.0" y1="64" x2="630.0" y2="180" data-cur=""/><line class="mark xok" x1="630.0" y1="212" x2="630.0" y2="328" data-cur=""/><text class="sub2" x="40" y="386" data-r1="">step 512: seats working, static 1 of 4, continuous 3 of 4</text><text class="sub2" x="40" y="406" data-r2="">tokens so far: static 604, continuous 1,946; per read of the weights 1.18 against 3.80</text><text class="sub2" x="40" y="426" data-r3="">requests returned to their users: static 4, continuous 9</text><text class="cap" x="40" y="464" text-anchor="start">Take the same four requests: 8, 24, 60 and 512 steps. Static batching holds all four</text><text class="cap" x="40" y="484" text-anchor="start">seats until step 512. Continuous batching gives a seat to the next waiting request the</text><text class="cap" x="40" y="504" text-anchor="start">moment one frees: seven are queued, needing 100, 300, 200, 450, 150, 80 and 260 steps</text><text class="cap" x="40" y="524" text-anchor="start">(illustrative), and they join at steps 8, 24, 60, 108, 260, 324 and 404. Only after step</text><text class="cap" x="40" y="544" text-anchor="start">410, with the queue empty, does a seat sit idle.</text><text class="cap" x="40" y="584" text-anchor="start">Over the same 512 steps the static batch keeps 604 of its 2,048 seat-steps busy, 29.5%;</text><text class="cap" x="40" y="604" text-anchor="start">the continuous one keeps 1,946 busy, 95.0%. Tokens per read of the weights average 1.18</text><text class="cap" x="40" y="624" text-anchor="start">against 3.80, 3.2 times as many from the same reads.</text><text class="cap" x="40" y="664" text-anchor="start">Press Play to run it, or drag through the steps. The counts were checked against Python</text><text class="cap" x="40" y="684" text-anchor="start">at every one of the 512.</text></svg></div><figcaption>Drawn to scale over 512 steps. Nothing about the model changed; only the moment a seat is refilled did, and that alone more than triples the tokens from each read.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const STAT = [[[0, 8]], [[0, 24]], [[0, 60]], [[0, 512]]], CONT = [[[0, 8], [8, 108], [108, 558]], [[0, 24], [24, 324], [324, 404], [404, 664]], [[0, 60], [60, 260], [260, 410]], [[0, 512]]], T = 512, X0 = 110, SC = 1.015625;
  
  const fx = (v, d = 2) => { const s = Math.abs(v).toFixed(d); return (v < 0 && +s !== 0 ? '−' : '') + s; };
  const fcx = (v, d = 0) => { const s = fx(v, d), n = s.startsWith('−'), t = n ? s.slice(1) : s;
    const [w, fr] = t.split('.'); return (n ? '−' : '') + (+w).toLocaleString('en-US') + (fr ? '.' + fr : ''); };

  const done = (L, t) => L.flat().reduce((a, [b, e]) => a + Math.max(0, Math.min(e, t) - b), 0);
  const work = (L, t) => L.flat().filter(([b, e]) => b < t && t <= e).length;
  const sl = fig.querySelector('input[type=range]'), val = fig.querySelector('.val'), q = s => fig.querySelector(s);
  const play = q('[data-play]');
  let timer = null;
  function draw() {
    const t = +sl.value, S = done(STAT, t), C = done(CONT, t);
    val.textContent = String(t);
    const x = (X0 + t * SC).toFixed(1);
    fig.querySelectorAll('[data-cur]').forEach(l => { l.setAttribute('x1', x); l.setAttribute('x2', x); });
    q('[data-r1]').textContent = `step ${t}: seats working, static ${work(STAT, t)} of 4, continuous ${work(CONT, t)} of 4`;
    q('[data-r2]').textContent = `tokens so far: static ${fcx(S)}, continuous ${fcx(C)}; per read of the weights ${fx(S / t, 2)} against ${fx(C / t, 2)}`;
    q('[data-r3]').textContent = `requests returned to their users: static ${t >= T ? 4 : 0}, continuous ${CONT.flat().filter(([b, e]) => e <= t).length}`;
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } play.textContent = 'Play'; }
  play.addEventListener('click', () => {
    if (timer) { stop(); return; }
    if (+sl.value >= T) sl.value = 1;
    play.textContent = 'Pause';
    timer = setInterval(() => { const t = Math.min(T, +sl.value + 4); sl.value = t; draw(); if (t >= T) stop(); }, 40);
  });
  sl.addEventListener('input', () => { stop(); draw(); });
  q('[data-reset]').addEventListener('click', () => { stop(); sl.value = T; draw(); });
  draw();
})();</script></figure>
