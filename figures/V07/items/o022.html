<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 26:12</div><h3>A state machine is states, and the characters that move between them</h3><svg viewBox='0 0 680 604' role='img'><title>A state machine is states, and the characters that move between them</title><text class="hd" x="40" y="46">A state machine for [0-9]{4}-[0-9]{2}: four digits, a dash, two digits</text><g class="u"><rect x="40" y="80" width="44" height="30" rx="15"/><text class="sub" x="62.0" y="95.0" text-anchor="middle" dominant-baseline="central">0</text></g><line class="conn" x1="86" y1="95" x2="112" y2="95" marker-end="url(#arw)"/><text class="sub2" x="100.0" y="86" text-anchor="middle">digit</text><g class="u"><rect x="116" y="80" width="44" height="30" rx="15"/><text class="sub" x="138.0" y="95.0" text-anchor="middle" dominant-baseline="central">1</text></g><line class="conn" x1="162" y1="95" x2="188" y2="95" marker-end="url(#arw)"/><text class="sub2" x="176.0" y="86" text-anchor="middle">digit</text><g class="u"><rect x="192" y="80" width="44" height="30" rx="15"/><text class="sub" x="214.0" y="95.0" text-anchor="middle" dominant-baseline="central">2</text></g><line class="conn" x1="238" y1="95" x2="264" y2="95" marker-end="url(#arw)"/><text class="sub2" x="252.0" y="86" text-anchor="middle">digit</text><g class="u"><rect x="268" y="80" width="44" height="30" rx="15"/><text class="sub" x="290.0" y="95.0" text-anchor="middle" dominant-baseline="central">3</text></g><line class="conn" x1="314" y1="95" x2="340" y2="95" marker-end="url(#arw)"/><text class="sub2" x="328.0" y="86" text-anchor="middle">digit</text><g class="u"><rect x="344" y="80" width="44" height="30" rx="15"/><text class="sub" x="366.0" y="95.0" text-anchor="middle" dominant-baseline="central">4</text></g><line class="conn" x1="390" y1="95" x2="416" y2="95" marker-end="url(#arw)"/><text class="sub2" x="404.0" y="86" text-anchor="middle">-</text><g class="u"><rect x="420" y="80" width="44" height="30" rx="15"/><text class="sub" x="442.0" y="95.0" text-anchor="middle" dominant-baseline="central">5</text></g><line class="conn" x1="466" y1="95" x2="492" y2="95" marker-end="url(#arw)"/><text class="sub2" x="480.0" y="86" text-anchor="middle">digit</text><g class="u"><rect x="496" y="80" width="44" height="30" rx="15"/><text class="sub" x="518.0" y="95.0" text-anchor="middle" dominant-baseline="central">6</text></g><line class="conn" x1="542" y1="95" x2="568" y2="95" marker-end="url(#arw)"/><text class="sub2" x="556.0" y="86" text-anchor="middle">digit</text><g class="s"><rect x="572" y="80" width="44" height="30" rx="15"/><text class="sub" x="594.0" y="95.0" text-anchor="middle" dominant-baseline="central">7</text></g><text class="sub2" x="62" y="128" text-anchor="middle">start</text><text class="sub2" x="594" y="128" text-anchor="middle">accept</text><g class="h"><rect x="270" y="150" width="120" height="30" rx="15"/><text class="sub" x="330.0" y="165.0" text-anchor="middle" dominant-baseline="central">reject</text></g><line class="conn" x1="366" y1="112" x2="330" y2="146" marker-end="url(#arw)"/><text class="sub2" x="404" y="170" text-anchor="start">any other character, from any state</text><text class="cap" x="40" y="231" text-anchor="start">fed</text><text class="cap" x="40" y="263" text-anchor="start">state after</text><g class="u"><rect x="140" y="214" width="44" height="26" rx="3"/><text class="sub" x="162.0" y="227.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="s"><rect x="140" y="246" width="44" height="26" rx="3"/><text class="sub" x="162.0" y="259.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="196" y="214" width="44" height="26" rx="3"/><text class="sub" x="218.0" y="227.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="s"><rect x="196" y="246" width="44" height="26" rx="3"/><text class="sub" x="218.0" y="259.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="u"><rect x="252" y="214" width="44" height="26" rx="3"/><text class="sub" x="274.0" y="227.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="s"><rect x="252" y="246" width="44" height="26" rx="3"/><text class="sub" x="274.0" y="259.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="u"><rect x="308" y="214" width="44" height="26" rx="3"/><text class="sub" x="330.0" y="227.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="s"><rect x="308" y="246" width="44" height="26" rx="3"/><text class="sub" x="330.0" y="259.0" text-anchor="middle" dominant-baseline="central">4</text></g><g class="u"><rect x="364" y="214" width="44" height="26" rx="3"/><text class="sub" x="386.0" y="227.0" text-anchor="middle" dominant-baseline="central">-</text></g><g class="s"><rect x="364" y="246" width="44" height="26" rx="3"/><text class="sub" x="386.0" y="259.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="u"><rect x="420" y="214" width="44" height="26" rx="3"/><text class="sub" x="442.0" y="227.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="420" y="246" width="44" height="26" rx="3"/><text class="sub" x="442.0" y="259.0" text-anchor="middle" dominant-baseline="central">6</text></g><g class="u"><rect x="476" y="214" width="44" height="26" rx="3"/><text class="sub" x="498.0" y="227.0" text-anchor="middle" dominant-baseline="central">x</text></g><g class="h"><rect x="476" y="246" width="44" height="26" rx="3"/><text class="sub" x="498.0" y="259.0" text-anchor="middle" dominant-baseline="central">✗</text></g><text class="cap" x="40" y="312" text-anchor="start">What decides which tokens would break the format is an automaton, a machine that reads</text><text class="cap" x="40" y="332" text-anchor="start">text one character at a time and changes state as it goes, tracking the output so far.</text><text class="cap" x="40" y="352" text-anchor="start">For output shaped like a regular expression, a pattern language for text in which</text><text class="cap" x="40" y="372" text-anchor="start">[0-9]{4}-[0-9]{2} means four digits, a dash and two digits (a year and a month, like</text><text class="cap" x="40" y="392" text-anchor="start">2025-10), a finite state machine is enough.</text><text class="cap" x="40" y="432" text-anchor="start">A state machine is a set of states, with a rule for each saying which characters move it</text><text class="cap" x="40" y="452" text-anchor="start">to which state. This one counts its way through the pattern: four digits take it from</text><text class="cap" x="40" y="472" text-anchor="start">state 0 to 4, a dash to 5, two more digits to 7, which accepts. Any other character goes</text><text class="cap" x="40" y="492" text-anchor="start">to reject, and nothing leaves reject.</text><text class="cap" x="40" y="532" text-anchor="start">Fed 2025-1x, it reaches state 6 after 2025-1 and is refused at x. Outlines, a</text><text class="cap" x="40" y="552" text-anchor="start">constrained-decoding library, takes this approach, reformulating generation as</text><text class="cap" x="40" y="572" text-anchor="start">transitions between the states of a state machine.</text></svg><figcaption>A finite set of states is enough for any pattern that never has to remember an unbounded amount: here, only how far through the date it has got.</figcaption></figure>
