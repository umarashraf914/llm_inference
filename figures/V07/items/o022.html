<figure><div class='ts'>Fig 22 &nbsp;&middot;&nbsp; 25:28</div><h3>What a state machine is</h3><svg viewBox="0 0 680 354" role="img"><title>What a state machine is</title><text class="hd" x="40" y="46">A state machine: rules about what may come next</text><g class="s"><rect x="60" y="80" width="110" height="40" rx="6"></rect><text class="sub" x="115.0" y="100.0" text-anchor="middle" dominant-baseline="central">start</text></g><line class="conn" x1="176" y1="100" x2="200" y2="100" marker-end="url(#arw)"></line><g class="m"><rect x="206" y="80" width="110" height="40" rx="6"></rect><text class="sub" x="261.0" y="100.0" text-anchor="middle" dominant-baseline="central">saw a brace</text></g><line class="conn" x1="322" y1="100" x2="346" y2="100" marker-end="url(#arw)"></line><g class="m"><rect x="352" y="80" width="130" height="40" rx="6"></rect><text class="sub" x="417.0" y="100.0" text-anchor="middle" dominant-baseline="central">reading a key</text></g><line class="conn" x1="488" y1="100" x2="512" y2="100" marker-end="url(#arw)"></line><g class="s"><rect x="518" y="80" width="120" height="40" rx="6"></rect><text class="sub" x="578.0" y="100.0" text-anchor="middle" dominant-baseline="central">done</text></g><text class="sub2" x="60" y="150" text-anchor="start">at each state, only some next tokens are legal</text><text class="cap" x="40" y="200" text-anchor="start">Feed it a token and it moves to a new state, or refuses. That is enough to enforce a format</text><text class="cap" x="40" y="220" text-anchor="start">like a date or a phone number.</text><text class="cap" x="40" y="256" text-anchor="start">What it cannot do is count. To know how many brackets are still open you need a stack: a pile</text><text class="cap" x="40" y="276" text-anchor="start">you push onto when one opens and pop from when one closes.</text><text class="cap" x="40" y="312" text-anchor="start">A state machine plus a stack is called a pushdown automaton, and that is the machinery needed</text><text class="cap" x="40" y="332" text-anchor="start">for anything that nests, which includes JSON.</text></svg><figcaption>Two levels of machinery, and the difference between them is exactly the ability to remember how deep you are.</figcaption></figure>
