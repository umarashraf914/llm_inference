<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 23:07</div><h3>Greedy and beam search both chase the most probable text</h3><svg viewBox='0 0 680 540' role='img'><title>Greedy and beam search both chase the most probable text</title><text class="hd" x="40" y="46">Two steps of choices, each with its probability; a text's probability is the product</text><g class="u"><rect x="40" y="150" width="56" height="26" rx="3"/><text class="sub" x="68.0" y="163.0" text-anchor="middle" dominant-baseline="central">start</text></g><line class="conn" x1="96" y1="163" x2="150" y2="121.0"/><g class="s"><rect x="150" y="108.0" width="86" height="26" rx="3"/><text class="sub" x="193.0" y="121.0" text-anchor="middle" dominant-baseline="central">The · 0.5</text></g><line class="conn" x1="236" y1="121.0" x2="290" y2="87"/><g class="s"><rect x="290" y="74" width="86" height="26" rx="3"/><text class="sub" x="333.0" y="87.0" text-anchor="middle" dominant-baseline="central">cat · 0.4</text></g><text class="sub2" x="392" y="91" text-anchor="start">0.5 × 0.4 = 0.20   greedy's pick</text><line class="conn" x1="236" y1="121.0" x2="290" y2="121"/><g class="u"><rect x="290" y="108" width="86" height="26" rx="3"/><text class="sub" x="333.0" y="121.0" text-anchor="middle" dominant-baseline="central">dog · 0.3</text></g><text class="sub2" x="392" y="125" text-anchor="start">0.5 × 0.3 = 0.15</text><line class="conn" x1="236" y1="121.0" x2="290" y2="155"/><g class="u"><rect x="290" y="142" width="86" height="26" rx="3"/><text class="sub" x="333.0" y="155.0" text-anchor="middle" dominant-baseline="central">end · 0.3</text></g><text class="sub2" x="392" y="159" text-anchor="start">0.5 × 0.3 = 0.15</text><line class="conn" x1="96" y1="163" x2="150" y2="206.0"/><g class="s"><rect x="150" y="193.0" width="86" height="26" rx="3"/><text class="sub" x="193.0" y="206.0" text-anchor="middle" dominant-baseline="central">A · 0.4</text></g><line class="conn" x1="236" y1="206.0" x2="290" y2="189"/><g class="s"><rect x="290" y="176" width="86" height="26" rx="3"/><text class="sub" x="333.0" y="189.0" text-anchor="middle" dominant-baseline="central">cat · 0.9</text></g><text class="sub2" x="392" y="193" text-anchor="start">0.4 × 0.9 = 0.36   beam search's pick</text><line class="conn" x1="236" y1="206.0" x2="290" y2="223"/><g class="u"><rect x="290" y="210" width="86" height="26" rx="3"/><text class="sub" x="333.0" y="223.0" text-anchor="middle" dominant-baseline="central">dog · 0.1</text></g><text class="sub2" x="392" y="227" text-anchor="start">0.4 × 0.1 = 0.04</text><line class="conn" x1="96" y1="163" x2="150" y2="257.0"/><g class="u"><rect x="150" y="244.0" width="86" height="26" rx="3"/><text class="sub" x="193.0" y="257.0" text-anchor="middle" dominant-baseline="central">One · 0.1</text></g><text class="sub2" x="250" y="261.0" text-anchor="start">dropped after step one by a beam of two</text><text class="cap" x="40" y="308" text-anchor="start">A text's probability is the product of its tokens' probabilities, each one given the</text><text class="cap" x="40" y="328" text-anchor="start">tokens before it: A then cat is 0.4 × 0.9 = 0.36. Maximization-based decoding hunts for</text><text class="cap" x="40" y="348" text-anchor="start">the text with the highest product.</text><text class="cap" x="40" y="388" text-anchor="start">Greedy decoding takes the best token at each step: The, at 0.5, then cat, for</text><text class="cap" x="40" y="408" text-anchor="start">0.5 × 0.4 = 0.20. It never looks back, so it misses that A, a slightly worse start,</text><text class="cap" x="40" y="428" text-anchor="start">leads somewhere much better.</text><text class="cap" x="40" y="468" text-anchor="start">Beam search keeps the best few partial texts, here two, extends each, and keeps the best</text><text class="cap" x="40" y="488" text-anchor="start">two again. It keeps The and A, extends both, and finds A cat at 0.36. A wider beam finds</text><text class="cap" x="40" y="508" text-anchor="start">still more probable text, and the next figure shows why that is the problem.</text></svg><figcaption>Probabilities illustrative; highlighted boxes are what a beam of two keeps. Both methods aim at the most probable text, and beam search is simply better at finding it.</figcaption></figure>
