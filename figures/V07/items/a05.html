<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:21</div><h3>Intensity rises one for one with the batch</h3><svg viewBox='0 0 680 588' role='img'><title>Intensity rises one for one with the batch</title><text class="hd" x="40" y="46">The same count for a model of P weights and a batch of N requests</text><g class="u"><rect x="40" y="66" width="280" height="38" rx="6"/><text class="sub" x="180.0" y="85.0" text-anchor="middle" dominant-baseline="central">operations per step  =  2 × P × N</text></g><text class="sub2" x="336" y="89" text-anchor="start">2 operations per weight, for each of N tokens</text><g class="u"><rect x="40" y="124" width="280" height="38" rx="6"/><text class="sub" x="180.0" y="143.0" text-anchor="middle" dominant-baseline="central">bytes per step  =  2 × P</text></g><text class="sub2" x="336" y="147" text-anchor="start">each weight read once, 2 bytes, whoever uses it</text><g class="m"><rect x="40" y="182" width="280" height="38" rx="6"/><text class="sub" x="180.0" y="201.0" text-anchor="middle" dominant-baseline="central">intensity  =  2PN ÷ 2P  =  N</text></g><text class="sub2" x="336" y="205" text-anchor="start">the 2 and the P cancel: only the batch is left</text><text class="hd" x="40" y="274">The series' 70B model, P = 70 billion, on an H100</text><text class="sub2" x="70" y="302" text-anchor="end">N</text><text class="sub2" x="190" y="302" text-anchor="end">operations</text><text class="sub2" x="290" y="302" text-anchor="end">bytes read</text><text class="sub2" x="400" y="302" text-anchor="end">arithmetic</text><text class="sub2" x="490" y="302" text-anchor="end">read</text><text class="sub2" x="640" y="302" text-anchor="end">tokens a second</text><text class="cap" x="70" y="328" text-anchor="end">1</text><text class="sub2" x="190" y="328" text-anchor="end">140 billion</text><text class="sub2" x="290" y="328" text-anchor="end">140 GB</text><text class="sub2" x="400" y="328" text-anchor="end">0.142 ms</text><text class="sub2" x="490" y="328" text-anchor="end">41.8 ms</text><g class="u"><rect x="570" y="313" width="70" height="21" rx="3"/><text class="sub" x="605.0" y="323.5" text-anchor="middle" dominant-baseline="central">23.9</text></g><text class="cap" x="70" y="354" text-anchor="end">8</text><text class="sub2" x="190" y="354" text-anchor="end">1.12 trillion</text><text class="sub2" x="290" y="354" text-anchor="end">140 GB</text><text class="sub2" x="400" y="354" text-anchor="end">1.13 ms</text><text class="sub2" x="490" y="354" text-anchor="end">41.8 ms</text><g class="s"><rect x="570" y="339" width="70" height="21" rx="3"/><text class="sub" x="605.0" y="349.5" text-anchor="middle" dominant-baseline="central">191</text></g><text class="cap" x="70" y="380" text-anchor="end">64</text><text class="sub2" x="190" y="380" text-anchor="end">8.96 trillion</text><text class="sub2" x="290" y="380" text-anchor="end">140 GB</text><text class="sub2" x="400" y="380" text-anchor="end">9.06 ms</text><text class="sub2" x="490" y="380" text-anchor="end">41.8 ms</text><g class="s"><rect x="570" y="365" width="70" height="21" rx="3"/><text class="sub" x="605.0" y="375.5" text-anchor="middle" dominant-baseline="central">1,531</text></g><text class="cap" x="40" y="436" text-anchor="start">A step takes the longer of its reading and its arithmetic ({{fig:v01-o123}}). At 64 requests</text><text class="cap" x="40" y="456" text-anchor="start">the arithmetic has grown to 9.06 ms, still well inside the 41.8 ms read, so the step</text><text class="cap" x="40" y="476" text-anchor="start">costs exactly what it cost for one request.</text><text class="cap" x="40" y="516" text-anchor="start">Every extra request is therefore an extra token for free: 64 requests get 1,531 tokens a</text><text class="cap" x="40" y="536" text-anchor="start">second out of reads that gave one request 23.9. That is the intensity rising from 1 to</text><text class="cap" x="40" y="556" text-anchor="start">64, read as a speed.</text></svg><figcaption>The cancelled P is the whole trick: intensity stops depending on the model and depends only on how many requests share each read.</figcaption></figure>
