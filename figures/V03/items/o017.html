<figure><div class='ts'>Fig 17 &nbsp;&middot;&nbsp; 5:42</div><h3>The shapes</h3><svg viewBox="0 0 680 342" role="img"><title>The shapes</title><text class="hd" x="40" y="46">One token contributes a row, not a matrix</text><g class="s"><rect x="60" y="66" width="300" height="26" rx="3"></rect><text class="sub" x="210.0" y="79.0" text-anchor="middle" dominant-baseline="central">token 1</text></g><g class="s"><rect x="60" y="98" width="300" height="26" rx="3"></rect><text class="sub" x="210.0" y="111.0" text-anchor="middle" dominant-baseline="central">token 2</text></g><text class="sub2" x="60" y="148" text-anchor="start">Q for a 2-token prompt: one matrix, 2 rows tall, 4096 wide</text><text class="hd" x="40" y="200">But this repeats</text><g class="u"><rect x="60" y="220" width="34" height="34" rx="3"></rect></g><g class="u"><rect x="102" y="220" width="34" height="34" rx="3"></rect></g><g class="u"><rect x="144" y="220" width="34" height="34" rx="3"></rect></g><g class="u"><rect x="186" y="220" width="34" height="34" rx="3"></rect></g><g class="u"><rect x="228" y="220" width="34" height="34" rx="3"></rect></g><g class="u"><rect x="270" y="220" width="34" height="34" rx="3"></rect></g><g class="u"><rect x="312" y="220" width="34" height="34" rx="3"></rect></g><g class="u"><rect x="354" y="220" width="34" height="34" rx="3"></rect></g><text class="sub2" x="406" y="240" text-anchor="start">x 32 layers</text><text class="cap" x="40" y="300" text-anchor="start">Three matrices per layer, thirty-two layers, so 96 matrices in a forward pass. Each is still</text><text class="cap" x="40" y="320" text-anchor="start">only 2 rows tall. Within a layer they are sliced across heads: a 2 x 128 slice per head.</text></svg><figcaption>Rows count tokens, columns count features. However wide the model, a 2-token prompt gives three matrices per layer, each exactly two rows tall.</figcaption></figure>
