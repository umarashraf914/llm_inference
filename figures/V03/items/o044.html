<figure><div class='ts'>Fig 44 &nbsp;&middot;&nbsp; 11:13</div><h3>A 200-token prompt, before anything runs</h3><svg viewBox="0 0 680 268" role="img"><title>Step 0 — the moment before you press enter</title><g class="h"><rect x="40" y="36" width="600" height="168" rx="14"></rect><text class="lbl" x="62" y="62">HBM, 80 GB</text></g><g class="h"><rect x="66" y="96" width="380" height="40" rx="4"></rect><text class="sub" x="256.0" y="116.0" text-anchor="middle" dominant-baseline="central">model weights, 16 GB, read every forward pass</text></g><rect x="66" y="148" width="380" height="36" rx="4" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="256.0" y="166.0" text-anchor="middle" dominant-baseline="central">KV cache: empty, this is the first message</text><g class="s"><rect x="466" y="96" width="148" height="40" rx="4"></rect><text class="sub" x="540.0" y="116.0" text-anchor="middle" dominant-baseline="central">200 token IDs</text></g><text class="sub2" x="466" y="166" text-anchor="start">800 bytes</text><text class="cap" x="40" y="238" text-anchor="start">Nothing is on the chip yet. The prompt is 200 integers; the model is 16 GB. That ratio is the</text><text class="cap" x="40" y="258" text-anchor="start">whole story of what happens next.</text></svg><figcaption>A Llama-3-8B-shaped model in FP16: 32 layers, 4,096 wide, 32 query heads of dimension 128 sharing 8 key-value heads (grouped-query attention, Part 14).</figcaption></figure>
