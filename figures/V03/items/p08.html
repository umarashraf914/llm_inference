<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 9:06</div><h3>541 MB at 3.35 TB/s takes 162 µs; the arithmetic needs 17</h3><svg viewBox='0 0 680 482' role='img'><title>541 MB at 3.35 TB/s takes 162 µs; the arithmetic needs 17</title><text class="hd" x="40" y="46">Time for one head at the H100's two limits, drawn to scale</text><text class="hd" x="40" y="84" text-anchor="start">three kernels</text><text class="cap" x="60" y="118" text-anchor="start">moving the bytes</text><g class="h"><rect x="230" y="102" width="400.00000000000006" height="24" rx="3"/><text class="sub" x="430.0" y="114.0" text-anchor="middle" dominant-baseline="central">161.5 µs</text></g><text class="cap" x="60" y="152" text-anchor="start">doing the arithmetic</text><g class="m"><rect x="230" y="136" width="43.020825985060476" height="24" rx="3"/></g><text class="sub2" x="281.02082598506047" y="153" text-anchor="start">17.4 µs</text><text class="hd" x="40" y="198" text-anchor="start">every byte once</text><text class="cap" x="60" y="232" text-anchor="start">moving the bytes</text><g class="s"><rect x="230" y="216" width="3.10077519379845" height="24" rx="3"/></g><text class="sub2" x="241.10077519379846" y="233" text-anchor="start">1.25 µs</text><text class="cap" x="60" y="266" text-anchor="start">doing the arithmetic</text><g class="m"><rect x="230" y="250" width="43.020825985060476" height="24" rx="3"/></g><text class="sub2" x="281.02082598506047" y="267" text-anchor="start">17.4 µs</text><text class="cap" x="40" y="312" text-anchor="start">Moving bytes takes bytes ÷ bandwidth: 541 MB ÷ 3.35 TB/s = 161.5 µs. The arithmetic</text><text class="cap" x="40" y="332" text-anchor="start">takes operations ÷ peak: 4·n²·d = 17.2 billion operations ÷ 989 trillion a second =</text><text class="cap" x="40" y="352" text-anchor="start">17.4 µs. The two run at the same time, so the longer one sets the pace.</text><text class="cap" x="40" y="392" text-anchor="start">For the three-kernel version that is the memory: the bus is saturated for 162 µs while</text><text class="cap" x="40" y="412" text-anchor="start">the tensor cores need only 17, so they work 10.8% of the time and wait the rest. Moving</text><text class="cap" x="40" y="432" text-anchor="start">every byte just once would take the memory down to 1.25 µs, and the arithmetic would be</text><text class="cap" x="40" y="452" text-anchor="start">the limit instead.</text></svg><figcaption>A saturated bus and idle tensor cores are one fact seen twice: 10.8% is also the most of peak the roofline allowed this schedule. To go faster, cut the bytes; nothing else on this chart is the limit.</figcaption></figure>
