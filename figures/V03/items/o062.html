<figure><div class='ts'>Fig 62 &nbsp;&middot;&nbsp; 14:37</div><h3>The recomputation trade</h3><svg viewBox='0 0 680 356' role='img'><title>The recomputation trade</title><text class="hd" x="40" y="46">Store it, or make it again</text><g class="h"><rect x="40" y="76" width="285" height="82" rx="8"/><text class="lbl" x="182.5" y="100.0" text-anchor="middle" dominant-baseline="central">Store</text><text class="sub" x="182.5" y="118.0" text-anchor="middle" dominant-baseline="central">spend memory and bandwidth</text><text class="sub" x="182.5" y="135.0" text-anchor="middle" dominant-baseline="central">keeping it</text></g><g class="s"><rect x="355" y="76" width="285" height="82" rx="8"/><text class="lbl" x="497.5" y="100.0" text-anchor="middle" dominant-baseline="central">Recompute</text><text class="sub" x="497.5" y="118.0" text-anchor="middle" dominant-baseline="central">spend arithmetic making it</text><text class="sub" x="497.5" y="135.0" text-anchor="middle" dominant-baseline="central">again when needed</text></g><text class="cap" x="40" y="202" text-anchor="start">On a chip where arithmetic is nearly free and bandwidth is scarce, the second is cheaper. That</text><text class="cap" x="40" y="222" text-anchor="start">is a statement about this hardware, not about computing in general.</text><text class="cap" x="40" y="258" text-anchor="start">It works here because the two running numbers per row are enough to rebuild any tile exactly.</text><text class="cap" x="40" y="278" text-anchor="start">The tile is remade on the chip, from data already there, and never travels.</text><text class="cap" x="40" y="314" text-anchor="start">The general principle: never spend a journey through memory on something you could make again</text><text class="cap" x="40" y="334" text-anchor="start">on the spot.</text></svg><figcaption>A trade that would be absurd on a machine where arithmetic was expensive. It is only obviously right given the ratio established in Part 2.</figcaption></figure>
