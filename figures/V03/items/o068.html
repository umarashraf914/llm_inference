 width="12" height="12" rx="1"></rect></g><g class="u"><rect x="320" y="136" width="12" height="12" rx="1"></rect></g><g class="u"><rect x="334" y="136" width="12" height="12" rx="1"></rect></g><text class="cap" x="370" y="96" text-anchor="start">32 blocks of work</text><text class="cap" x="370" y="118" text-anchor="start">132 multiprocessors</text><text class="sub2" x="370" y="148" text-anchor="start">a hundred sit idle</text><text class="cap" x="40" y="200" text-anchor="start">A thread block runs on one multiprocessor to completion, so the number of blocks caps how</text><text class="cap" x="40" y="220" text-anchor="start">much of the chip can be busy. Batch times heads was the only source of parallelism.</text><text class="cap" x="40" y="250" text-anchor="start">The fix is to split the query rows of a single sequence across many blocks, so one long</text><text class="cap" x="40" y="270" text-anchor="start">sequence can fill the chip by itself.</text></svg><figcaption>The thread block from Part 1 doing real work here. Occupancy is limited by how the problem is decomposed, not by the hardware.</figcaption></figure>
