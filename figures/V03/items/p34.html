<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 33:49</div><h3>Beam search keeps several answers alive over one stored prompt</h3><svg viewBox='0 0 680 628' role='img'><title>Beam search keeps several answers alive over one stored prompt</title><text class="hd" x="40" y="46">Three candidates for one prompt, as blocks: ×3 means three tables point there</text><line class="conn" x1="136" y1="129" x2="150" y2="129"/><line class="conn" x1="246" y1="129" x2="260" y2="107"/><line class="conn" x1="246" y1="129" x2="260" y2="169"/><line class="conn" x1="356" y1="107" x2="390" y2="85"/><line class="conn" x1="356" y1="107" x2="390" y2="129"/><line class="conn" x1="356" y1="169" x2="390" y2="173"/><g class="u"><rect x="40" y="116" width="96" height="26" rx="3"/><text class="sub" x="88.0" y="129.0" text-anchor="middle" dominant-baseline="central">prompt 0  ×3</text></g><g class="u"><rect x="150" y="116" width="96" height="26" rx="3"/><text class="sub" x="198.0" y="129.0" text-anchor="middle" dominant-baseline="central">prompt 1  ×3</text></g><g class="u"><rect x="260" y="94" width="110" height="26" rx="3"/><text class="sub" x="315.0" y="107.0" text-anchor="middle" dominant-baseline="central">shared 2  ×2</text></g><g class="s"><rect x="260" y="156" width="96" height="26" rx="3"/><text class="sub" x="308.0" y="169.0" text-anchor="middle" dominant-baseline="central">own 2</text></g><g class="s"><rect x="390" y="72" width="110" height="26" rx="3"/><text class="sub" x="445.0" y="85.0" text-anchor="middle" dominant-baseline="central">candidate 1</text></g><g class="s"><rect x="390" y="116" width="110" height="26" rx="3"/><text class="sub" x="445.0" y="129.0" text-anchor="middle" dominant-baseline="central">candidate 2</text></g><g class="s"><rect x="390" y="160" width="110" height="26" rx="3"/><text class="sub" x="445.0" y="173.0" text-anchor="middle" dominant-baseline="central">candidate 3</text></g><text class="hd" x="40" y="230">Measured on OPT-13B, Alpaca dataset (bars to scale)</text><text class="cap" x="40" y="260" text-anchor="start">cache memory saved, beam search</text><rect x="260" y="244" width="360" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><g class="s"><rect x="395.36" y="244" width="63.360000000000014" height="24" rx="3"/></g><text class="sub2" x="466.72" y="261" text-anchor="start">37.6% to 55.2%</text><text class="sub2" x="260" y="286" text-anchor="middle">0%</text><text class="sub2" x="620" y="286" text-anchor="middle">100%</text><text class="cap" x="40" y="321" text-anchor="start">request rate vs Orca (Oracle), plain sampling</text><g class="s"><rect x="320" y="304" width="169.56521739130437" height="24" rx="3"/><text class="sub" x="404.7826086956522" y="316.0" text-anchor="middle" dominant-baseline="central">1.3×</text></g><text class="cap" x="40" y="353" text-anchor="start">the same, beam search 6 wide</text><g class="s"><rect x="320" y="336" width="300.0" height="24" rx="3"/><text class="sub" x="470.0" y="348.0" text-anchor="middle" dominant-baseline="central">2.3×</text></g><text class="cap" x="40" y="398" text-anchor="start">Sometimes a server explores several candidate continuations of one prompt at once and</text><text class="cap" x="40" y="418" text-anchor="start">keeps the most promising: beam search. Every candidate gets its own block table, and the</text><text class="cap" x="40" y="438" text-anchor="start">tables share every block the candidates have in common. Each block carries a count of</text><text class="cap" x="40" y="458" text-anchor="start">the tables pointing at it. A block is copied only when a candidate writes into one it</text><text class="cap" x="40" y="478" text-anchor="start">shares, and freed when its count falls to zero.</text><text class="cap" x="40" y="518" text-anchor="start">Measured on OPT-13B with the Alpaca dataset, sharing saved 37.6% to 55.2% of the cache</text><text class="cap" x="40" y="538" text-anchor="start">memory on beam search. That memory goes straight back into batch size. Against Orca</text><text class="cap" x="40" y="558" text-anchor="start">(Oracle), an earlier system given the true output lengths in advance, vLLM sustained 1.3</text><text class="cap" x="40" y="578" text-anchor="start">times the request rate at the same latency on plain sampling, and 2.3 times on beam</text><text class="cap" x="40" y="598" text-anchor="start">search six candidates wide.</text></svg><figcaption>The vLLM paper calls the copying rule copy-on-write, after the operating-system technique it borrows. The more the candidates share, the larger the saving.</figcaption></figure>
