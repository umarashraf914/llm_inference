<figure><div class='ts'>Fig 24 &nbsp;&middot;&nbsp; 6:20</div><h3>Why the subtraction is not optional</h3><svg viewBox='0 0 680 444' role='img'><title>Why the subtraction is not optional</title><text class="hd" x="40" y="46">How quickly the exponential runs out of room</text><text class="cap" x="40" y="92" text-anchor="start">FP16 holds up to</text><g class="u"><rect x="280" y="76" width="200" height="30" rx="3"/><text class="sub" x="380.0" y="91.0" text-anchor="middle" dominant-baseline="central">65,504</text></g><text class="cap" x="40" y="152" text-anchor="start">so exp(x) overflows above</text><g class="h"><rect x="280" y="136" width="200" height="30" rx="3"/><text class="sub" x="380.0" y="151.0" text-anchor="middle" dominant-baseline="central">x = 11.09</text></g><text class="cap" x="40" y="212" text-anchor="start">and attention scores</text><g class="h"><rect x="280" y="196" width="300" height="30" rx="3"/><text class="sub" x="430.0" y="211.0" text-anchor="middle" dominant-baseline="central">routinely exceed that</text></g><text class="cap" x="40" y="290" text-anchor="start">Eleven is not a large number. Written the obvious way, softmax in half precision fails almost</text><text class="cap" x="40" y="310" text-anchor="start">immediately, producing infinity and then nonsense.</text><text class="cap" x="40" y="346" text-anchor="start">Subtracting the row's largest score first pins the biggest exponent at exactly zero, so the</text><text class="cap" x="40" y="366" text-anchor="start">largest term becomes 1 and nothing can overflow.</text><text class="cap" x="40" y="402" text-anchor="start">The result is unchanged, because the same factor cancels top and bottom. It is a free fix, and</text><text class="cap" x="40" y="422" text-anchor="start">it is the reason the maximum has to be known before anything else can be computed.</text></svg><figcaption>The threshold is exact: the natural logarithm of the largest FP16 value. Below it the naive formula works; above it, it produces infinity.</figcaption></figure>
