<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:56</div><h3>FP16 runs out at 65,504, and e¹² is already past it</h3><svg viewBox='0 0 680 590' role='img'><title>FP16 runs out at 65,504, and e¹² is already past it</title><text class="hd" x="40" y="46">Sixteen bits: the largest number they can hold, worked out</text><g class="u"><rect x="40" y="66" width="34" height="26" rx="3"/><text class="sub" x="57.0" y="79.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="h"><rect x="76" y="66" width="34" height="26" rx="3"/><text class="sub" x="93.0" y="79.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="h"><rect x="112" y="66" width="34" height="26" rx="3"/><text class="sub" x="129.0" y="79.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="h"><rect x="148" y="66" width="34" height="26" rx="3"/><text class="sub" x="165.0" y="79.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="h"><rect x="184" y="66" width="34" height="26" rx="3"/><text class="sub" x="201.0" y="79.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="h"><rect x="220" y="66" width="34" height="26" rx="3"/><text class="sub" x="237.0" y="79.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="s"><rect x="256" y="66" width="34" height="26" rx="3"/><text class="sub" x="273.0" y="79.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="292" y="66" width="34" height="26" rx="3"/><text class="sub" x="309.0" y="79.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="328" y="66" width="34" height="26" rx="3"/><text class="sub" x="345.0" y="79.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="364" y="66" width="34" height="26" rx="3"/><text class="sub" x="381.0" y="79.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="400" y="66" width="34" height="26" rx="3"/><text class="sub" x="417.0" y="79.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="436" y="66" width="34" height="26" rx="3"/><text class="sub" x="453.0" y="79.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="472" y="66" width="34" height="26" rx="3"/><text class="sub" x="489.0" y="79.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="508" y="66" width="34" height="26" rx="3"/><text class="sub" x="525.0" y="79.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="544" y="66" width="34" height="26" rx="3"/><text class="sub" x="561.0" y="79.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="580" y="66" width="34" height="26" rx="3"/><text class="sub" x="597.0" y="79.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="40" y="112" text-anchor="start">sign</text><text class="sub2" x="76" y="112" text-anchor="start">exponent: 11110 = 30</text><text class="sub2" x="256" y="112" text-anchor="start">fraction: all ten bits set</text><g class="u"><rect x="40" y="130" width="600" height="36" rx="6"/><text class="sub" x="340.0" y="148.0" text-anchor="middle" dominant-baseline="central">(2 − 2⁻¹⁰) × 2^(30 − 15)  =  1.9990234375 × 32,768  =  65,504</text></g><text class="sub2" x="40" y="200" text-anchor="start">x</text><text class="sub2" x="250" y="200" text-anchor="end">e to the x</text><text class="sub2" x="290" y="200" text-anchor="start">in FP16</text><text class="sub2" x="40" y="222" text-anchor="start">8</text><text class="sub2" x="250" y="222" text-anchor="end">2,981</text><text class="sub2" x="290" y="222" text-anchor="start">fits</text><text class="sub2" x="40" y="244" text-anchor="start">10</text><text class="sub2" x="250" y="244" text-anchor="end">22,026</text><text class="sub2" x="290" y="244" text-anchor="start">fits</text><text class="sub2" x="40" y="266" text-anchor="start">11.09</text><text class="sub2" x="250" y="266" text-anchor="end">65,504</text><text class="sub2" x="290" y="266" text-anchor="start">the largest there is</text><text class="sub2" x="40" y="288" text-anchor="start">12</text><text class="sub2" x="250" y="288" text-anchor="end">162,755</text><text class="sub2" x="290" y="288" text-anchor="start">infinity: overflowed</text><text class="cap" x="40" y="340" text-anchor="start">A floating-point number is a sign, an exponent and a fraction ({{fig:v02-o086}}). FP16</text><text class="cap" x="40" y="360" text-anchor="start">stores its exponent with 15 added, so that negative ones can be written, and keeps the</text><text class="cap" x="40" y="380" text-anchor="start">top pattern, 11111, for infinity. The largest usable exponent is 11110 = 30, which means</text><text class="cap" x="40" y="400" text-anchor="start">2^(30 − 15) = 2¹⁵. With all ten fraction bits set, the number in front is 1.1111111111</text><text class="cap" x="40" y="420" text-anchor="start">in binary, which is 2 − 2⁻¹⁰. Multiplied out: 65,504.</text><text class="cap" x="40" y="460" text-anchor="start">e^x passes that at x = ln 65,504 = 11.09. A score of 12 already gives 162,755, which</text><text class="cap" x="40" y="480" text-anchor="start">FP16 can only call infinity, and the softmax built on it turns to nonsense. Scores above</text><text class="cap" x="40" y="500" text-anchor="start">eleven are entirely possible, so the obvious formula is not safe in sixteen bits.</text><text class="cap" x="40" y="540" text-anchor="start">FP32 has eight exponent bits and reaches 3.40 × 10³⁸, so its exponentials are safe up to</text><text class="cap" x="40" y="560" text-anchor="start">88.7. Kernels do the softmax's arithmetic in FP32 for this reason among others.</text></svg><figcaption>The threshold is exact and low: the natural logarithm of the largest FP16 number. Subtracting the row's maximum, next, is what keeps every exponent at or below zero.</figcaption></figure>
