<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 17:04</div><h3>Wait one: scalar work between the matrix multiplies</h3><svg viewBox='0 0 680 540' role='img'><title>Wait one: scalar work between the matrix multiplies</title><text class="hd" x="40" y="46">The two kinds of arithmetic unit on an A100, drawn to scale</text><text class="cap" x="40" y="89" text-anchor="start">tensor cores</text><g class="s"><rect x="170" y="72" width="400.0" height="26" rx="3"/><text class="sub" x="370.0" y="85.0" text-anchor="middle" dominant-baseline="central">312 trillion a second: matrix multiplies only</text></g><text class="cap" x="40" y="129" text-anchor="start">CUDA cores</text><g class="h"><rect x="170" y="112" width="25.0" height="26" rx="3"/></g><text class="sub2" x="203.0" y="130" text-anchor="start">19.5 trillion a second: everything else</text><text class="hd" x="40" y="170">One score at d = 128: what it costs, as an illustration</text><text class="cap" x="40" y="200" text-anchor="start">tensor-core operations</text><text class="sub2" x="300" y="200" text-anchor="start">512: 2 × 128 for QKᵀ and 2 × 128 for PV</text><text class="cap" x="40" y="224" text-anchor="start">scalar operations</text><text class="sub2" x="300" y="224" text-anchor="start">about 5: max, subtract, add, convert, rescale</text><text class="cap" x="40" y="248" text-anchor="start">share of the operations</text><text class="sub2" x="300" y="248" text-anchor="start">5 ÷ 517 = 1%</text><text class="cap" x="40" y="272" text-anchor="start">share of the time</text><text class="sub2" x="300" y="272" text-anchor="start">5 × 16 = 80;  80 ÷ (512 + 80) = 13.5%</text><text class="cap" x="40" y="310" text-anchor="start">Softmax is not a matrix multiply, so it cannot run on the tensor cores. Its maximums,</text><text class="cap" x="40" y="330" text-anchor="start">rescales and divisions run on the CUDA cores, the general-purpose units</text><text class="cap" x="40" y="350" text-anchor="start">({{fig:v02-o078}}), and its exponentials on the multi-function unit, which is scarcer</text><text class="cap" x="40" y="370" text-anchor="start">still. On an A100 the tensor cores deliver 312 trillion operations a second and the</text><text class="cap" x="40" y="390" text-anchor="start">scalar path 19.5: 312 ÷ 19.5 = 16.</text><text class="cap" x="40" y="430" text-anchor="start">So every scalar operation the kernel cannot avoid costs about 16 matrix operations'</text><text class="cap" x="40" y="450" text-anchor="start">worth of time, and while it runs between two matrix multiplies, the tensor cores hold. A</text><text class="cap" x="40" y="470" text-anchor="start">handful of scalar steps per score is about 1% of the operations and, at sixteen times</text><text class="cap" x="40" y="490" text-anchor="start">the price, 14% of the time, before the exponentials are counted at all. The count of</text><text class="cap" x="40" y="510" text-anchor="start">five is illustrative; the multiplier is not.</text></svg><figcaption>Not a memory problem at all. A chip with two kinds of arithmetic unit is fast only while the expensive kind is the one that is busy, so the first fix is to give the slow units less to do.</figcaption></figure>
