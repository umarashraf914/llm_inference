<figure><div class='ts'>Fig 65 &nbsp;&middot;&nbsp; 16:42</div><h3>Why scalar work between matmuls is expensive</h3><svg viewBox='0 0 680 408' role='img'><title>Why scalar work between matmuls is expensive</title><text class="hd" x="40" y="46">Two kinds of arithmetic unit, wildly different speeds</text><text class="cap" x="40" y="92" text-anchor="start">Tensor cores</text><g class="m"><rect x="260" y="76" width="360" height="30" rx="3"/><text class="sub" x="440.0" y="91.0" text-anchor="middle" dominant-baseline="central">312 trillion operations a second</text></g><text class="cap" x="40" y="152" text-anchor="start">The ordinary units</text><g class="h"><rect x="260" y="136" width="23" height="30" rx="3"/></g><text class="sub2" x="294" y="155" text-anchor="start">19.5 trillion</text><g class="u"><rect x="190" y="190" width="300" height="42" rx="6"/><text class="sub" x="340.0" y="211.0" text-anchor="middle" dominant-baseline="central">sixteen times apart</text></g><text class="cap" x="40" y="274" text-anchor="start">Softmax does not run on tensor cores. Exponentials, maximums and divisions run on the ordinary</text><text class="cap" x="40" y="294" text-anchor="start">units, which are sixteen times slower.</text><text class="cap" x="40" y="330" text-anchor="start">So every scalar step wedged between two matrix multiplies stalls the fast units while the slow</text><text class="cap" x="40" y="350" text-anchor="start">ones catch up.</text><text class="cap" x="40" y="386" text-anchor="start">Figures are for an A100. The ratio is what matters, and it is similar on every generation.</text></svg><figcaption>Not a memory problem at all. A chip with two kinds of arithmetic unit is only fast when the expensive kind is the one that is busy.</figcaption></figure>
