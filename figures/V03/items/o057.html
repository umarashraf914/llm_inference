<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:14</div><h3>Every term folded in so far is too large by the same factor</h3><svg viewBox='0 0 680 434' role='img'><title>Every term folded in so far is too large by the same factor</title><text class="hd" x="40" y="46">Tile 2 arrives holding a 5: the maximum moves from 3 to 5</text><text class="sub2" x="40" y="84" text-anchor="start">tile 1 score</text><text class="sub2" x="250" y="84" text-anchor="end">folded in as e^(x − 3)</text><text class="sub2" x="440" y="84" text-anchor="end">should be e^(x − 5)</text><text class="sub2" x="600" y="84" text-anchor="end">too large by</text><text class="cap" x="40" y="110" text-anchor="start">3</text><text class="sub2" x="250" y="110" text-anchor="end">1.0000</text><text class="sub2" x="440" y="110" text-anchor="end">0.1353</text><text class="sub2" x="600" y="110" text-anchor="end">7.389</text><text class="cap" x="40" y="136" text-anchor="start">2</text><text class="sub2" x="250" y="136" text-anchor="end">0.3679</text><text class="sub2" x="440" y="136" text-anchor="end">0.0498</text><text class="sub2" x="600" y="136" text-anchor="end">7.389</text><text class="cap" x="40" y="162" text-anchor="start">1.5</text><text class="sub2" x="250" y="162" text-anchor="end">0.2231</text><text class="sub2" x="440" y="162" text-anchor="end">0.0302</text><text class="sub2" x="600" y="162" text-anchor="end">7.389</text><g class="u"><rect x="40" y="188" width="600" height="34" rx="6"/><text class="sub" x="340.0" y="205.0" text-anchor="middle" dominant-baseline="central">e^(x − 3)  =  e^(x − 5 + 2)  =  e^(x − 5) × e²</text></g><text class="sub2" x="40" y="248" text-anchor="start">adding exponents is multiplying powers:  e^(a + b) = e^a × e^b</text><text class="cap" x="40" y="284" text-anchor="start">Every term already folded into the 1.59 subtracted the old maximum, 3. Against the true</text><text class="cap" x="40" y="304" text-anchor="start">maximum, 5, each is too large. And not by different amounts: every one is too large by</text><text class="cap" x="40" y="324" text-anchor="start">exactly e^(5 − 3) = e² = 7.389, because subtracting 3 instead of 5 adds 2 to every</text><text class="cap" x="40" y="344" text-anchor="start">exponent, and adding 2 to an exponent multiplies the power by e².</text><text class="cap" x="40" y="384" text-anchor="start">They all subtracted the same wrong number, so they are all wrong by the same factor.</text><text class="cap" x="40" y="404" text-anchor="start">That shared error is what will make the repair cheap.</text></svg><figcaption>The last column is the whole idea: one number, the same in every row. If the errors were different, no single correction could repair them.</figcaption></figure>
