<figure><div class='ts'>Fig 57 &nbsp;&middot;&nbsp; 12:40</div><h3>The rescale, with numbers</h3><svg viewBox="0 0 680 414" role="img"><title>The rescale, with numbers</title><g class="u"><rect x="60" y="40" width="560" height="50" rx="8"></rect><text class="lbl" x="340.0" y="56.0" text-anchor="middle" dominant-baseline="central">Tile 1 arrives</text><text class="sub" x="340.0" y="74.0" text-anchor="middle" dominant-baseline="central">running max = 3, denominator = 1.59</text></g><line class="conn" x1="340" y1="92" x2="340" y2="100" marker-end="url(#arw)"></line><g class="u"><rect x="60" y="102" width="560" height="50" rx="8"></rect><text class="lbl" x="340.0" y="118.0" text-anchor="middle" dominant-baseline="central">Tile 2 arrives carrying a 5</text><text class="sub" x="340.0" y="136.0" text-anchor="middle" dominant-baseline="central">the running maximum updates from 3 to 5</text></g><line class="conn" x1="340" y1="154" x2="340" y2="162" marker-end="url(#arw)"></line><g class="h"><rect x="60" y="164" width="560" height="50" rx="8"></rect><text class="lbl" x="340.0" y="180.0" text-anchor="middle" dominant-baseline="central">Every term already folded in subtracted 3</text><text class="sub" x="340.0" y="198.0" text-anchor="middle" dominant-baseline="central">so all of them are too large by the same factor</text></g><line class="conn" x1="340" y1="216" x2="340" y2="224" marker-end="url(#arw)"></line><g class="m"><rect x="60" y="226" width="560" height="50" rx="8"></rect><text class="lbl" x="340.0" y="242.0" text-anchor="middle" dominant-baseline="central">One multiplication repairs the whole sum</text><text class="sub" x="340.0" y="260.0" text-anchor="middle" dominant-baseline="central">scale 1.59 by exp(3 - 5), about 0.135</text></g><line class="conn" x1="340" y1="278" x2="340" y2="286" marker-end="url(#arw)"></line><g class="s"><rect x="60" y="288" width="560" height="50" rx="8"></rect><text class="lbl" x="340.0" y="304.0" text-anchor="middle" dominant-baseline="central">The output carries the identical factor</text><text class="sub" x="340.0" y="322.0" text-anchor="middle" dominant-baseline="central">denominator and output stay in step</text></g><text class="cap" x="60" y="372" text-anchor="start">They all subtracted the same wrong number, so they are all wrong by the same amount. That</text><text class="cap" x="60" y="392" text-anchor="start">shared error is what makes one multiplication sufficient.</text></svg><figcaption>Follow the arithmetic once and the algorithm stops looking clever and starts looking obvious.</figcaption></figure>
