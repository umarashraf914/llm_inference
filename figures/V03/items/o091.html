<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 37:09</div><h3>Multi-head latent attention</h3><svg viewBox='0 0 680 572' role='img'><title>Multi-head latent attention</title><text class="hd" x="40" y="46">Numbers stored per token per layer (areas to scale)</text><g class="h"><rect x="40" y="66" width="220.0" height="220.0" rx="3"/><text class="sub" x="150.0" y="176.0" text-anchor="middle" dominant-baseline="central">32,768</text></g><text class="sub2" x="40" y="306" text-anchor="start">full keys and values:</text><text class="sub2" x="40" y="323" text-anchor="start">128 heads × 128 × 2</text><g class="s"><rect x="300" y="66" width="29.168154723945083" height="29.168154723945083" rx="3"/></g><text class="sub2" x="339.16815472394507" y="84" text-anchor="start">576: a 512 latent and a 64-wide</text><text class="sub2" x="339.16815472394507" y="101" text-anchor="start">companion that carries position</text><text class="cap" x="300" y="170" text-anchor="start">ratio</text><text class="sub2" x="300" y="187" text-anchor="start">32,768 ÷ 576 = 56.9, about 57</text><text class="cap" x="300" y="206" text-anchor="start">as grouped-query</text><text class="sub2" x="300" y="223" text-anchor="start">one group stores 2 × 128 = 256; 576 ÷ 256 = 2.25 groups</text><text class="cap" x="300" y="242" text-anchor="start">what is lost</text><text class="sub2" x="300" y="259" text-anchor="start">nothing at serving time: keys and values are rebuilt from it</text><text class="cap" x="40" y="362" text-anchor="start">Multi-head latent attention, MLA, from DeepSeek-V2 (May 2024), does not keep keys and</text><text class="cap" x="40" y="382" text-anchor="start">values at all. For each token it stores one short vector, the latent, a compressed</text><text class="cap" x="40" y="402" text-anchor="start">summary the model learns to write during training. DeepSeek-V2 has 128 heads of</text><text class="cap" x="40" y="422" text-anchor="start">dimension 128, so full keys and values are 32,768 numbers per token per layer. The</text><text class="cap" x="40" y="442" text-anchor="start">latent stores 512, and a small 64-number companion rides beside it to carry position:</text><text class="cap" x="40" y="462" text-anchor="start">576 in place of 32,768, 57 times fewer.</text><text class="cap" x="40" y="502" text-anchor="start">That is the footprint of a grouped-query model with just 2.25 groups, and nothing is</text><text class="cap" x="40" y="522" text-anchor="start">discarded. The full keys and values are rebuilt from the latent, by two learned</text><text class="cap" x="40" y="542" text-anchor="start">decompression matrices, only for the tokens being attended to.</text></svg><figcaption>Compression built into the architecture rather than applied afterwards. The next figures show how a latent can rebuild keys at all, why the rebuilding is nearly free, and where the extra 64 comes from.</figcaption></figure>
