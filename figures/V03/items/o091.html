<figure><div class='ts'>Fig 91 &nbsp;&middot;&nbsp; 36:48</div><h3>Multi-head latent attention</h3><svg viewBox="0 0 680 422" role="img"><title>Multi-head latent attention</title><text class="cap" x="40" y="78" text-anchor="start">Full keys and values</text><g class="h"><rect x="300" y="62" width="320" height="32" rx="3"></rect><text class="sub" x="460.0" y="78.0" text-anchor="middle" dominant-baseline="central">32,768 elements</text></g><text class="cap" x="40" y="138" text-anchor="start">One learned latent</text><g class="s"><rect x="300" y="122" width="6" height="32" rx="1"></rect></g><text class="sub2" x="316" y="141" text-anchor="start">576 elements</text><text class="cap" x="40" y="200" text-anchor="start">128 heads of dimension 128, for keys and values, is 32,768 numbers per token per layer. A</text><text class="cap" x="40" y="220" text-anchor="start">latent of 512 plus a 64-wide companion is 576, which is 57 times smaller.</text><text class="cap" x="40" y="260" text-anchor="start">Keys and values are rebuilt from the latent on the fly. The decompression matrices fold into</text><text class="cap" x="40" y="280" text-anchor="start">the query and output projections, so no step ever materialises full keys and values.</text><text class="cap" x="40" y="320" text-anchor="start">Rotary position embeddings break that folding, because they apply a position-dependent</text><text class="cap" x="40" y="340" text-anchor="start">rotation that does not commute with the merge. So a small separate channel carries the</text><text class="cap" x="40" y="360" text-anchor="start">position-aware part, which is what the extra 64 dimensions are for.</text><text class="cap" x="40" y="400" text-anchor="start">The cache shrinks 93.3 percent and maximum generation throughput rises 5.76 times.</text></svg><figcaption>Compression built into the architecture rather than applied afterwards. The folding trick is what makes it free at inference time.</figcaption></figure>
