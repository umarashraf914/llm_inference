<figure><div class='ts'>Fig 88 &nbsp;&middot;&nbsp; 34:32</div><h3>Why the number of KV heads is the dial</h3><svg viewBox='0 0 680 434' role='img'><title>Why the number of KV heads is the dial</title><text class="hd" x="40" y="46">What one token costs to keep, per layer</text><text class="cap" x="40" y="96" text-anchor="start">32 KV heads</text><g class="h"><rect x="220" y="78" width="340" height="30" rx="3"/></g><text class="sub2" x="572" y="96" text-anchor="start">16 KB</text><text class="cap" x="40" y="146" text-anchor="start">8 KV heads</text><g class="m"><rect x="220" y="128" width="85" height="30" rx="3"/></g><text class="sub2" x="317" y="146" text-anchor="start">4 KB</text><text class="cap" x="40" y="196" text-anchor="start">1 KV head</text><g class="s"><rect x="220" y="178" width="11" height="30" rx="3"/></g><text class="sub2" x="243" y="196" text-anchor="start">0.5 KB</text><g class="u"><rect x="120" y="236" width="440" height="42" rx="6"/><text class="sub" x="340.0" y="257.0" text-anchor="middle" dominant-baseline="central">2  ×  KV heads  ×  128  ×  2 bytes</text></g><text class="cap" x="40" y="320" text-anchor="start">The 2 at the front is one key and one value. Head dimension 128, sixteen-bit storage.</text><text class="cap" x="40" y="356" text-anchor="start">Nothing here depends on the number of query heads. The cache holds one key and one value per</text><text class="cap" x="40" y="376" text-anchor="start">KV head, so cutting KV heads from 32 to 8 cuts the cache by exactly four.</text><text class="cap" x="40" y="412" text-anchor="start">Queries are recomputed fresh each step and never stored, which is why they do not appear.</text></svg><figcaption>The formula makes the saving exact and linear. Every architecture in this part is a different setting of one term in it.</figcaption></figure>
