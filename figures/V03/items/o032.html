<figure><div class='ts'>Fig 32 &nbsp;&middot;&nbsp; 9:44</div><h3>Changing the cost model</h3><svg viewBox="0 0 680 236" role="img"><title>Changing the cost model</title><g class="u"><rect x="50" y="55" width="265" height="76" rx="8"></rect><text class="lbl" x="182.5" y="76.0" text-anchor="middle" dominant-baseline="central">Count operations</text><text class="sub" x="182.5" y="94.0" text-anchor="middle" dominant-baseline="central">the classical way to compare</text><text class="sub" x="182.5" y="111.0" text-anchor="middle" dominant-baseline="central">two algorithms</text></g><g class="m"><rect x="365" y="55" width="265" height="76" rx="8"></rect><text class="lbl" x="497.5" y="84.0" text-anchor="middle" dominant-baseline="central">Count bytes moved</text><text class="sub" x="497.5" y="102.0" text-anchor="middle" dominant-baseline="central">between HBM and SRAM</text></g><text class="cap" x="40" y="178" text-anchor="start">Both kernels perform the same number of operations, so by the classical measure they are</text><text class="cap" x="40" y="198" text-anchor="start">equally good. Under the second measure they are not remotely equal.</text><text class="cap" x="40" y="226" text-anchor="start">Choosing the right thing to count is what the whole line of work is built on.</text></svg><figcaption>Sometimes called IO-awareness. Once you count bytes rather than operations, the design follows almost mechanically.</figcaption></figure>
