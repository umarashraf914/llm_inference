<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 23:01</div><h3>What FP8 is</h3><svg viewBox='0 0 680 376' role='img'><title>What FP8 is</title><text class="hd" x="40" y="46">Eight bits, arranged two ways, drawn at the same width per bit as FP16</text><text class="cap" x="40" y="86" text-anchor="start">E4M3</text><g class="u"><rect x="120" y="68" width="34" height="28" rx="3"/><text class="sub" x="137.0" y="82.0" text-anchor="middle" dominant-baseline="central">±</text></g><g class="h"><rect x="156" y="68" width="142" height="28" rx="3"/><text class="sub" x="227.0" y="82.0" text-anchor="middle" dominant-baseline="central">exponent, 4</text></g><g class="s"><rect x="300" y="68" width="106" height="28" rx="3"/><text class="sub" x="353.0" y="82.0" text-anchor="middle" dominant-baseline="central">fraction, 3</text></g><text class="sub2" x="422" y="86" text-anchor="start">253 values, up to 448</text><text class="cap" x="40" y="132" text-anchor="start">E5M2</text><g class="u"><rect x="120" y="114" width="34" height="28" rx="3"/><text class="sub" x="137.0" y="128.0" text-anchor="middle" dominant-baseline="central">±</text></g><g class="h"><rect x="156" y="114" width="178" height="28" rx="3"/><text class="sub" x="245.0" y="128.0" text-anchor="middle" dominant-baseline="central">exponent, 5</text></g><g class="s"><rect x="336" y="114" width="70" height="28" rx="3"/><text class="sub" x="371.0" y="128.0" text-anchor="middle" dominant-baseline="central">frac, 2</text></g><text class="sub2" x="422" y="132" text-anchor="start">247 values, up to 57,344</text><text class="cap" x="40" y="186" text-anchor="start">Both formats are the same three fields as every floating-point number</text><text class="cap" x="40" y="206" text-anchor="start">({{fig:v03-o024}}), squeezed into eight bits. E4M3 spends four bits on the exponent and</text><text class="cap" x="40" y="226" text-anchor="start">three on the fraction; E5M2 moves one bit across, trading fineness for reach. Hopper's</text><text class="cap" x="40" y="246" text-anchor="start">tensor cores multiply either at about twice the rate they manage in 16 bits.</text><text class="cap" x="40" y="286" text-anchor="start">Eight bits make 256 patterns, but not 256 numbers. Plus zero and minus zero are the same</text><text class="cap" x="40" y="306" text-anchor="start">value, and some patterns are kept for 'not a number': E4M3 holds 253 distinct values and</text><text class="cap" x="40" y="326" text-anchor="start">has no infinity, E5M2 holds 247. A couple of hundred values, to stand in for every</text><text class="cap" x="40" y="346" text-anchor="start">number a tensor might hold.</text></svg><figcaption>Two formats, one width. Where those values sit, and how far apart, decides everything that follows in this part.</figcaption></figure>
