<figure><div class='ts'>Fig 75 &nbsp;&middot;&nbsp; 22:52</div><h3>What FP8 is</h3><svg viewBox='0 0 680 370' role='img'><title>What FP8 is</title><text class="hd" x="40" y="46">Eight bits, arranged two different ways</text><text class="cap" x="40" y="92" text-anchor="start">E4M3</text><g class="u"><rect x="150" y="76" width="40" height="30" rx="3"/></g><g class="h"><rect x="194" y="76" width="160" height="30" rx="3"/><text class="sub" x="274.0" y="91.0" text-anchor="middle" dominant-baseline="central">4 exponent</text></g><g class="s"><rect x="358" y="76" width="120" height="30" rx="3"/><text class="sub" x="418.0" y="91.0" text-anchor="middle" dominant-baseline="central">3 fraction</text></g><text class="sub2" x="496" y="96" text-anchor="start">more precision</text><text class="cap" x="40" y="152" text-anchor="start">E5M2</text><g class="u"><rect x="150" y="136" width="40" height="30" rx="3"/></g><g class="h"><rect x="194" y="136" width="200" height="30" rx="3"/><text class="sub" x="294.0" y="151.0" text-anchor="middle" dominant-baseline="central">5 exponent</text></g><g class="s"><rect x="398" y="136" width="80" height="30" rx="3"/><text class="sub" x="438.0" y="151.0" text-anchor="middle" dominant-baseline="central">2 fraction</text></g><text class="sub2" x="496" y="156" text-anchor="start">more range</text><text class="cap" x="40" y="216" text-anchor="start">Both are eight bits. Moving one bit from the fraction to the exponent trades how finely values</text><text class="cap" x="40" y="236" text-anchor="start">can be told apart for how large and small they may get.</text><text class="cap" x="40" y="272" text-anchor="start">Eight bits is not many. The whole format holds 256 distinct values, so a single outlier far</text><text class="cap" x="40" y="292" text-anchor="start">from the rest wastes most of them.</text><text class="cap" x="40" y="328" text-anchor="start">That is why the FP8 attention kernel needs both a separate scale per block and a rotation that</text><text class="cap" x="40" y="348" text-anchor="start">smears outliers across channels before anything is stored.</text></svg><figcaption>Two formats, one width. The narrowness is the whole problem: 256 values cannot straddle a cluster and an outlier at the same time.</figcaption></figure>
