" x2="400" y2="130" marker-end="url(#arw)"></line><g class="u"><rect x="372" y="134" width="60" height="28" rx="3"></rect><text class="sub" x="402.0" y="148.0" text-anchor="middle" dominant-baseline="central">6</text></g><g class="s"><rect x="480" y="70" width="54" height="30" rx="3"></rect><text class="sub" x="507.0" y="85.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="542" y="90" text-anchor="start">x</text><g class="m"><rect x="556" y="70" width="54" height="30" rx="3"></rect><text class="sub" x="583.0" y="85.0" text-anchor="middle" dominant-baseline="central">5</text></g><line class="conn" x1="530" y1="106" x2="530" y2="130" marker-end="url(#arw)"></line><g class="u"><rect x="502" y="134" width="60" height="28" rx="3"></rect><text class="sub" x="532.0" y="148.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="s"><rect x="190" y="186" width="300" height="42" rx="6"></rect><text class="sub" x="340.0" y="207.0" text-anchor="middle" dominant-baseline="central">2 + 0 + 6 + 5  =  13</text></g><text class="cap" x="40" y="266" text-anchor="start">Two lists in, one number out. It measures how much the two lists agree: large when they are</text><text class="cap" x="40" y="286" text-anchor="start">big in the same places, near zero when they are not.</text><text class="cap" x="40" y="322" text-anchor="start">A matrix multiply is nothing but a great many of these, and attention scores every query</text><text class="cap" x="40" y="342" text-anchor="start">against every key with exactly this operation.</text></svg><figcaption>The single most-used operation in the whole subject, and it is four multiplications and three additions.</figcaption></figure>
