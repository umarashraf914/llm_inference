ill)" stroke="var(--s)" stroke-width="0.4"/><rect x="597.8" y="230.0" width="3.69" height="0.6" fill="var(--s-fill)" stroke="var(--s)" stroke-width="0.4"/><rect x="602.5" y="230.0" width="3.69" height="1.8" fill="var(--s-fill)" stroke="var(--s)" stroke-width="0.4"/><rect x="607.2" y="230.0" width="3.69" height="1.1" fill="var(--s-fill)" stroke="var(--s)" stroke-width="0.4"/><rect x="611.9" y="221.3" width="3.69" height="8.7" fill="var(--s-fill)" stroke="var(--s)" stroke-width="0.4"/><rect x="616.6" y="230.0" width="3.69" height="9.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="0.4"/><rect x="621.2" y="229.3" width="3.69" height="0.7" fill="var(--s-fill)" stroke="var(--s)" stroke-width="0.4"/><rect x="625.9" y="228.8" width="3.69" height="1.2" fill="var(--s-fill)" stroke="var(--s)" stroke-width="0.4"/><rect x="630.6" y="230.0" width="3.69" height="5.6" fill="var(--s-fill)" stroke="var(--s)" stroke-width="0.4"/><rect x="635.3" y="224.5" width="3.69" height="5.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="0.4"/><line class="axis" x1="40.0" y1="230.0" x2="640.0" y2="230.0"/><text class="cap" x="40" y="296" text-anchor="start">error in the scores, one scale per tensor, E4M3</text><g class="h"><rect x="220" y="308" width="380.0" height="24" rx="3"/><text class="sub" x="410.0" y="320.0" text-anchor="middle" dominant-baseline="central">before: 3.8%</text></g><g class="s"><rect x="220" y="340" width="57.230718481371696" height="24" rx="3"/></g><text class="sub2" x="285.2307184813717" y="356.0" text-anchor="start">after: 0.57%</text><text class="cap" x="40" y="400" text-anchor="start">In transformers a few channels of Q and K run far larger than the rest, and they run</text><text class="cap" x="40" y="420" text-anchor="start">large in every token. Then each score, a sum of 128 products, is carried by the two or</text><text class="cap" x="40" y="440" text-anchor="start">three products of those channels. Rounding each number to E4M3 costs it up to a few</text><text class="cap" x="40" y="460" text-anchor="start">percent, so the score inherits a few percent of error from those two products, and</text><text class="cap" x="40" y="480" text-anchor="start">nothing averages it away.</text><text class="cap" x="40" y="520" text-anchor="start">A Hadamard matrix is a rotation built from +1s and −1s: on four numbers it turns (10, 0,</text><text class="cap" x="40" y="540" text-anchor="start">0, 0) into (5, 5, 5, 5). Applied with random signs at d = 128, it spreads a spike s</text><text class="cap" x="40" y="560" text-anchor="start">across all 128 coordinates at ±s ÷ 11.3, and the score becomes a sum of 128 comparable</text><text class="cap" x="40" y="580" text-anchor="start">products. Their rounding errors are independent and partly cancel, while the products</text><text class="cap" x="40" y="600" text-anchor="start">themselves add up to the same score as before.</text><text class="cap" x="40" y="640" text-anchor="start">Simulated with two channels 20 times larger in both Q and K, one scale per tensor, d =</text><text class="cap" x="40" y="660" text-anchor="start">128: the scores' error falls from 3.8% to 0.57%, 6.6 times smaller. Without outlier</text><text class="cap" x="40" y="680" text-anchor="start">channels the rotation changes nothing, because there was nothing to spread.</text></svg><figcaption>Both rows have the same length, and every score they make is unchanged; only how the size is shared among coordinates differs. The simulation illustrates the mechanism, averaged over five random draws; the paper's own measurement is in the next figure.</figcaption></figure>
