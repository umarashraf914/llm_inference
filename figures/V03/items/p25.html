128, it spreads a spike s</text><text class="cap" x="40" y="478" text-anchor="start">across all 128 coordinates at ±s ÷ 11.3, and the score becomes a sum of 128 comparable</text><text class="cap" x="40" y="498" text-anchor="start">products. Their rounding errors are independent and partly cancel, while the products</text><text class="cap" x="40" y="518" text-anchor="start">themselves add up to the same score as before.</text><text class="cap" x="40" y="558" text-anchor="start">Simulated with two channels 20 times larger in both Q and K, one scale per tensor, d =</text><text class="cap" x="40" y="578" text-anchor="start">128: the scores' error falls from 3.8% to 0.57%, 6.6 times smaller. Without outlier</text><text class="cap" x="40" y="598" text-anchor="start">channels the rotation changes nothing, because there was nothing to spread.</text></svg><figcaption>The bars are the products of one query with one key; both panels sum to the same score. The simulation is an illustration of the mechanism, averaged over five random draws; the paper's own measurement is in the next figure.</figcaption></figure>
