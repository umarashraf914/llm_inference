<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 38:32</div><h3>Rebuilt literally at every step, the keys and values would cost more than reading them</h3><svg viewBox='0 0 680 468' role='img'><title>Rebuilt literally at every step, the keys and values would cost more than reading them</title><text class="hd" x="40" y="46">Time per generated token, 8,192 tokens of context, 60 layers, one H100 (log scale)</text><text class="cap" x="40" y="82" text-anchor="start">rebuild keys and values</text><text class="sub2" x="40" y="99" text-anchor="start">arithmetic, at full tensor-core speed</text><g class="h"><rect x="260" y="70" width="266.65137528212995" height="24" rx="3"/></g><text class="sub2" x="534.65137528213" y="87" text-anchor="start">16.7 ms</text><text class="cap" x="40" y="128" text-anchor="start">read a full multi-head cache</text><text class="sub2" x="40" y="145" text-anchor="start">32.2 GB</text><g class="m"><rect x="260" y="116" width="237.95715811227035" height="24" rx="3"/></g><text class="sub2" x="505.95715811227035" y="133" text-anchor="start">9.6 ms</text><text class="cap" x="40" y="174" text-anchor="start">read the latents</text><text class="sub2" x="40" y="191" text-anchor="start">0.57 GB</text><g class="s"><rect x="260" y="162" width="27.353863927889677" height="24" rx="3"/></g><text class="sub2" x="295.3538639278897" y="179" text-anchor="start">0.17 ms</text><line class="tick" x1="260.0" y1="204.0" x2="260.0" y2="208.0"/><text class="sub2" x="260.0" y="222" text-anchor="middle">0.1 ms</text><line class="tick" x1="380.0" y1="204.0" x2="380.0" y2="208.0"/><text class="sub2" x="380.0" y="222" text-anchor="middle">1 ms</text><line class="tick" x1="500.0" y1="204.0" x2="500.0" y2="208.0"/><text class="sub2" x="500.0" y="222" text-anchor="middle">10 ms</text><line class="tick" x1="620.0" y1="204.0" x2="620.0" y2="208.0"/><text class="sub2" x="620.0" y="222" text-anchor="middle">100 ms</text><text class="cap" x="40" y="258" text-anchor="start">Rebuilding the keys and values costs extra matrix multiplies on every step, and decode</text><text class="cap" x="40" y="278" text-anchor="start">leaves the tensor cores mostly idle. But done literally, the rebuild is not small. Every</text><text class="cap" x="40" y="298" text-anchor="start">cached token's latent is multiplied by the two 512 × 16,384 matrices: 2 × 512 × 32,768</text><text class="cap" x="40" y="318" text-anchor="start">operations per token per layer, 16.5 trillion for one new token at 8,192 tokens of</text><text class="cap" x="40" y="338" text-anchor="start">context.</text><text class="cap" x="40" y="378" text-anchor="start">Even at the H100's full 989 trillion a second that is 16.7 ms, longer than simply</text><text class="cap" x="40" y="398" text-anchor="start">reading a full multi-head cache, 9.6 ms. Reading the latents alone would take 0.17 ms.</text><text class="cap" x="40" y="418" text-anchor="start">So the saving needs one more step: never rebuilding at all, which the next figure shows</text><text class="cap" x="40" y="438" text-anchor="start">is possible.</text></svg><figcaption>DeepSeek-V2 makes the same point: recomputing the keys and values for every query would be a real overhead, which its inference avoids by folding the matrices together.</figcaption></figure>
