x="482.0" y="197.0" text-anchor="middle" dominant-baseline="central">O = 24.05</text></g><text class="sub2" x="556" y="202" text-anchor="start">m = 3</text><text class="cap" x="40" y="246" text-anchor="start">The first tile's largest score is 3, so each exponential is taken as e^(score − 3): 1,</text><text class="cap" x="40" y="266" text-anchor="start">e⁻¹ and e^(−1.5). They add to 1.591, the running denominator l. The scores are chosen so</text><text class="cap" x="40" y="286" text-anchor="start">this sum is the 1.59 quoted for the first tile; any scores would do.</text><text class="cap" x="40" y="326" text-anchor="start">The same exponentials weight the values, and their weighted sum is the running output O</text><text class="cap" x="40" y="346" text-anchor="start">= 24.05. Nothing has been divided yet: O and l are carried, and the answer will be O ÷ l</text><text class="cap" x="40" y="366" text-anchor="start">when the row is finished. Only m, l and O need to be remembered; the scores themselves</text><text class="cap" x="40" y="386" text-anchor="start">can go.</text></svg><figcaption>Every number the kernel keeps for this row is in the bottom line. The next tile will show why they cannot simply be kept as they are.</figcaption></figure>
