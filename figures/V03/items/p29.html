<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 28:06</div><h3>The copy engine moves data; tensor memory keeps it</h3><svg viewBox='0 0 680 638' role='img'><title>The copy engine moves data; tensor memory keeps it</title><text class="hd" x="40" y="46">One B200 multiprocessor, and the two ways a tile gets near the tensor cores</text><g class="u"><rect x="40" y="90" width="110" height="64" rx="8"/><text class="lbl" x="95.0" y="113.0" text-anchor="middle" dominant-baseline="central">HBM</text><text class="sub" x="95.0" y="131.0" text-anchor="middle" dominant-baseline="central">off the chip</text></g><g class="u"><rect x="184" y="64" width="456" height="248" rx="14"/><text class="lbl" x="206" y="90">one multiprocessor</text></g><g class="h"><rect x="206" y="106" width="150" height="56" rx="8"/><text class="lbl" x="281.0" y="125.0" text-anchor="middle" dominant-baseline="central">TMA copy engine</text><text class="sub" x="281.0" y="143.0" text-anchor="middle" dominant-baseline="central">moves tiles in</text></g><g class="m"><rect x="206" y="190" width="150" height="56" rx="8"/><text class="lbl" x="281.0" y="209.0" text-anchor="middle" dominant-baseline="central">shared memory</text><text class="sub" x="281.0" y="227.0" text-anchor="middle" dominant-baseline="central">up to 228 KB</text></g><g class="s"><rect x="398" y="106" width="220" height="56" rx="8"/><text class="lbl" x="508.0" y="125.0" text-anchor="middle" dominant-baseline="central">tensor cores</text><text class="sub" x="508.0" y="143.0" text-anchor="middle" dominant-baseline="central">BF16 multiply-adds</text></g><g class="s"><rect x="398" y="190" width="220" height="56" rx="8"/><text class="lbl" x="508.0" y="209.0" text-anchor="middle" dominant-baseline="central">tensor memory, TMEM</text><text class="sub" x="508.0" y="227.0" text-anchor="middle" dominant-baseline="central">256 KB, new on Blackwell</text></g><g class="u"><rect x="206" y="262" width="412" height="26" rx="4"/><text class="lbl" x="412.0" y="275.0" text-anchor="middle" dominant-baseline="central">registers, 256 KB: the warps' own working values</text></g><line class="conn" x1="152" y1="122" x2="202" y2="130" marker-end="url(#arw)"/><line class="conn" x1="281" y1="164" x2="281" y2="186" marker-end="url(#arw)"/><line class="conn" x1="360" y1="212" x2="394" y2="140" marker-end="url(#arw)"/><line class="conn" x1="470" y1="164" x2="470" y2="186" marker-end="url(#arw)"/><line class="conn" x1="546" y1="186" x2="546" y2="166" marker-end="url(#arw)"/><text class="hd" x="40" y="346" text-anchor="start">TMEM in version 4's forward pass: four 64 KB tiles, FP32, fill it exactly</text><g class="s"><rect x="40" y="360" width="146" height="30" rx="3"/><text class="sub" x="113.0" y="375.0" text-anchor="middle" dominant-baseline="central">output 1</text></g><g class="s"><rect x="190" y="360" width="146" height="30" rx="3"/><text class="sub" x="263.0" y="375.0" text-anchor="middle" dominant-baseline="central">output 2</text></g><g class="m"><rect x="340" y="360" width="146" height="30" rx="3"/><text class="sub" x="413.0" y="375.0" text-anchor="middle" dominant-baseline="central">scores → weights 1</text></g><g class="m"><rect x="490" y="360" width="146" height="30" rx="3"/><text class="sub" x="563.0" y="375.0" text-anchor="middle" dominant-baseline="central">scores → weights 2</text></g><text class="sub2" x="40" y="410" text-anchor="start">1 and 2 are the two blocks of 128 query rows that the kernel works on in turn</text><text class="cap" x="40" y="448" text-anchor="start">Blackwell adds a memory beside the tensor cores: tensor memory, TMEM, 256 KB per</text><text class="cap" x="40" y="468" text-anchor="start">multiprocessor, as large as the register file. The tensor cores write their results into</text><text class="cap" x="40" y="488" text-anchor="start">it directly and asynchronously. On the H100 a matrix multiply's result went into the</text><text class="cap" x="40" y="508" text-anchor="start">issuing warps' registers, which the kernel then had to keep free.</text><text class="cap" x="40" y="548" text-anchor="start">The TMA from {{fig:v02-o035}} is a copy engine: it moves tiles from HBM into shared memory.</text><text class="cap" x="40" y="568" text-anchor="start">TMEM is a place to keep data, next to the units that make and use it. Version 4's</text><text class="cap" x="40" y="588" text-anchor="start">forward pass keeps two output tiles there and two tiles of scores, which softmax turns</text><text class="cap" x="40" y="608" text-anchor="start">into weights in place and the next multiply reads straight back.</text></svg><figcaption>Sizes per multiprocessor: TMEM and its use from the version 4 paper; registers and shared memory from CUDA's table for compute capability 10.0, the B200's, the same as the H100's.</figcaption></figure>
