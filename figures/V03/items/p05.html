<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:34</div><h3>Attention's arithmetic could sit past the ridge; its naive schedule cannot</h3><div class='wg'><div class='ctl'><label>sequence length <input type='range' min='0' max='7' step='1' value='4'></label></div><div class='ctl'><label class='opt'>head dimension</label><label class='opt'><input type='radio' name='v03-p05-d' value='64' checked> 64</label><label class='opt'><input type='radio' name='v03-p05-d' value='128'> 128</label><label class='opt'><input type='radio' name='v03-p05-d' value='256'> 256</label><button type='button'>Reset</button></div><svg viewBox='0 0 680 814' role='img'><title>Attention's arithmetic could sit past the ridge; its naive schedule cannot</title><text class="hd" x="40" y="34">One head of naive attention on an H100, FP16, sequence of <tspan data-n="">8,192</tspan> tokens</text><line class="axis" x1="96.0" y1="72.0" x2="96.0" y2="262.0"/><text class="sub2" x="96.0" y="280" text-anchor="middle">0.1</text><line class="axis" x1="182.7" y1="72.0" x2="182.7" y2="262.0"/><text class="sub2" x="182.66666666666666" y="280" text-anchor="middle">1</text><line class="axis" x1="269.3" y1="72.0" x2="269.3" y2="262.0"/><text class="sub2" x="269.3333333333333" y="280" text-anchor="middle">10</text><line class="axis" x1="356.0" y1="72.0" x2="356.0" y2="262.0"/><text class="sub2" x="356.0" y="280" text-anchor="middle">100</text><line class="axis" x1="442.7" y1="72.0" x2="442.7" y2="262.0"/><text class="sub2" x="442.66666666666663" y="280" text-anchor="middle">1,000</text><line class="axis" x1="529.3" y1="72.0" x2="529.3" y2="262.0"/><text class="sub2" x="529.3333333333334" y="280" text-anchor="middle">10,000</text><line class="axis" x1="616.0" y1="72.0" x2="616.0" y2="262.0"/><text class="sub2" x="616.0" y="280" text-anchor="middle">100,000</text><line class="axis" x1="96.0" y1="262.0" x2="616.0" y2="262.0"/><text class="sub2" x="88" y="266.0" text-anchor="end">0.1</text><line class="axis" x1="96.0" y1="214.5" x2="616.0" y2="214.5"/><text class="sub2" x="88" y="218.5" text-anchor="end">1</text><line class="axis" x1="96.0" y1="167.0" x2="616.0" y2="167.0"/><text class="sub2" x="88" y="171.0" text-anchor="end">10</text><line class="axis" x1="96.0" y1="119.5" x2="616.0" y2="119.5"/><text class="sub2" x="88" y="123.5" text-anchor="end">100</text><line class="axis" x1="96.0" y1="72.0" x2="616.0" y2="72.0"/><text class="sub2" x="88" y="76.0" text-anchor="end">1,000</text><text class="sub2" x="356.0" y="300" text-anchor="middle">operations per byte, log scale</text><text class="sub2" x="88" y="58" text-anchor="start">trillion operations a second, at most (log)</text><polyline points="96.0,237.1 396.7,72.2 616.0,72.2" fill="none" stroke="var(--h)" stroke-width="2"/><line class="xok" x1="396.7" y1="78.2" x2="396.7" y2="262.0" stroke="var(--h)" stroke-width="1.2" stroke-dasharray="4 3"/><text class="sub2 halo" x="402.7464619952289" y="254" text-anchor="start">ridge 295</text><text class="sub2 halo" x="189.5290413241275" y="117.39711206656588" text-anchor="start">memory bound</text><text class="sub2 halo" x="484.01717540903746" y="90.22817614913399" text-anchor="start">compute bound: 989</text><circle cx="338.6" cy="104.1" r="5" fill="var(--paper)" stroke="var(--m)" stroke-width="2" data-pt="0"/><text class="sub2 halo" x="329.6" y="95.1" text-anchor="end" data-lt="0">A</text><circle cx="191.1" cy="185.0" r="5" fill="var(--paper)" stroke="var(--m)" stroke-width="2" data-pt="1"/><text class="sub2 halo" x="182.1" y="176.0" text-anchor="end" data-lt="1">B</text><circle cx="312.8" cy="118.2" r="5" fill="var(--paper)" stroke="var(--m)" stroke-width="2" data-pt="2"/><text class="sub2 halo" x="303.8" y="109.2" text-anchor="end" data-lt="2">C</text><circle cx="495.7" cy="72.2" r="5" fill="var(--paper)" stroke="var(--m)" stroke-width="2" data-pt="3"/><text class="sub2 halo" x="486.7" y="63.2" text-anchor="end" data-lt="3">D</text><text class="sub2" x="40" y="336" text-anchor="start">point</text><text class="sub2" x="104" y="336" text-anchor="start">what</text><text class="sub2" x="500" y="336" text-anchor="end">per byte</text><text class="sub2" x="640" y="336" text-anchor="end">most of peak</text><text class="cap" x="40" y="362" text-anchor="start">A</text><text class="cap" x="104" y="362" text-anchor="start">pass 1 or pass 3: a matrix multiply</text><text class="sub2" x="500" y="362" text-anchor="end" data-i="0">63.0</text><text class="sub2" x="640" y="362" text-anchor="end" data-s="0">21.3%</text><text class="cap" x="40" y="386" text-anchor="start">B</text><text class="cap" x="104" y="386" text-anchor="start">pass 2: the softmax</text><text class="sub2" x="500" y="386" text-anchor="end" data-i="1">1.25</text><text class="sub2" x="640" y="386" text-anchor="end" data-s="1">0.4%</text><text class="cap" x="40" y="410" text-anchor="start">C</text><text class="cap" x="104" y="410" text-anchor="start">all three passes together</text><text class="sub2" x="500" y="410" text-anchor="end" data-i="2">31.8</text><text class="sub2" x="640" y="410" text-anchor="end" data-s="2">10.8%</text><text class="cap" x="40" y="434" text-anchor="start">D</text><text class="cap" x="104" y="434" text-anchor="start">the same work, every byte moved once</text><text class="sub2" x="500" y="434" text-anchor="end" data-i="3">4,096</text><text class="sub2" x="640" y="434" text-anchor="end" data-s="3">all of it</text><text class="sub2" x="104" y="464">C: <tspan data-ops="">17.2</tspan> billion operations on <tspan data-bytes="">541</tspan> MB</text><text class="cap" x="40" y="508" text-anchor="start">The H100's roofline ({{fig:v01-o123}}): at I operations per byte a kernel can run at</text><text class="cap" x="40" y="528" text-anchor="start">most 3.35 × I trillion operations a second, until the 989 ceiling at I = 295</text><text class="cap" x="40" y="548" text-anchor="start">({{fig:v02-o074}}). Divided by 989, that is the most of peak it can ever reach: I ÷ 295</text><text class="cap" x="40" y="568" text-anchor="start">below the ridge, all of it past it.</text><text class="cap" x="40" y="608" text-anchor="start">The points are one head of attention done the naive way (Part 4). Each matrix-multiply</text><text class="cap" x="40" y="628" text-anchor="start">pass does 2·n²·d operations on its inputs and its n × n output: 63.0 per byte at 8,192</text><text class="cap" x="40" y="648" text-anchor="start">tokens. The softmax pass does about five operations per score on four bytes, 1.25 per</text><text class="cap" x="40" y="668" text-anchor="start">byte, and those are not even tensor-core work. Together: 31.8 per byte, at most 10.8% of</text><text class="cap" x="40" y="688" text-anchor="start">peak.</text><text class="cap" x="40" y="728" text-anchor="start">Point D is the same arithmetic with every byte moved once. Drag the length: D moves</text><text class="cap" x="40" y="748" text-anchor="start">right with n, while C settles near d ÷ 2 however long the sequence, because the score</text><text class="cap" x="40" y="768" text-anchor="start">matrix's bytes grow exactly as fast as its arithmetic. The arithmetic here was checked</text><text class="cap" x="40" y="788" text-anchor="start">against Python.</text></svg></div><figcaption>Attention is not memory-bound by nature: its own arithmetic could sit far past the ridge. What pins it at a tenth of peak is the naive schedule's bytes, and those are the lever.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const NS = [512, 1024, 2048, 4096, 8192, 16384, 32768, 65536], DS = [64, 128, 256], RIDGE = 295.2238805970149, BW = 3350000000000.0, PEAK = 989000000000000.0, SOFT = 5;
  const X0 = 96, X1 = 616, Y0 = 262, Y1 = 72, N0 = 4, D0 = 0;
  const q = s => fig.querySelector(s), sl = q('input[type=range]'), rad = [...fig.querySelectorAll('input[type=radio]')];
  const IX = i => X0 + (Math.log10(i) + 1) / 6 * (X1 - X0);
  const TY = t => Y0 - (Math.log10(t) + 1) / 4 * (Y0 - Y1);
  const ATT = i => Math.min(PEAK, BW * i) / 1e12;
  const grp = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const fx = (v, d) => grp(v.toFixed(d));
  const fmtI = v => v < 10 ? fx(v, 2) : (v < 100 ? fx(v, 1) : fx(v, 0));
  const share = v => { const s = Math.min(1, v / RIDGE); return s >= 1 ? 'all of it' : fx(100 * s, 1) + '%'; };
  function draw() {
    const n = NS[+sl.value], d = DS[rad.findIndex(r => r.checked)];
    q('[data-n]').textContent = grp(String(n));
    const P = [[2*n*n*d, 4*n*d + 2*n*n], [SOFT*n*n, 4*n*n], [4*n*n*d, 8*n*d + 8*n*n], [4*n*n*d, 8*n*d]];
    P.forEach(([o, b], k) => {
      const i = o / b, x = IX(i), y = TY(ATT(i));
      const c = q(`[data-pt="${k}"]`); c.setAttribute('cx', x.toFixed(1)); c.setAttribute('cy', y.toFixed(1));
      const t = q(`[data-lt="${k}"]`); t.setAttribute('x', (x - 9).toFixed(1)); t.setAttribute('y', (y - 9).toFixed(1));
      q(`[data-i="${k}"]`).textContent = fmtI(i);
      q(`[data-s="${k}"]`).textContent = share(i);
    });
    q('[data-ops]').textContent = fx(4*n*n*d / 1e9, 1);
    q('[data-bytes]').textContent = fx((8*n*d + 8*n*n) / 1e6, 0);
  }
  sl.addEventListener('input', draw);
  rad.forEach(r => r.addEventListener('change', draw));
  q('button').addEventListener('click', () => { sl.value = N0; rad[D0].checked = true; draw(); });
  draw();
})();</script></figure>
