<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 14:18</div><h3>The recurrence is exact, up to rounding</h3><svg viewBox='0 0 680 420' role='img'><title>The recurrence is exact, up to rounding</title><text class="hd" x="40" y="46">Why the repair is exact, and what 'exact' means in floating point</text><g class="u"><rect x="40" y="66" width="600" height="34" rx="6"/><text class="sub" x="340.0" y="83.0" text-anchor="middle" dominant-baseline="central">e^(x − m_old)  ×  e^(m_old − m_new)  =  e^(x − m_new)</text></g><text class="sub2" x="40" y="130" text-anchor="start">the row of the last figures, in 64-bit floating point:</text><g class="s"><rect x="40" y="144" width="260" height="28" rx="3"/><text class="sub" x="170.0" y="158.0" text-anchor="middle" dominant-baseline="central">tile by tile, with the correction</text></g><text class="lbl" x="320" y="163" text-anchor="start">39.18035943419077</text><g class="u"><rect x="40" y="182" width="260" height="28" rx="3"/><text class="sub" x="170.0" y="196.0" text-anchor="middle" dominant-baseline="central">all six at once</text></g><text class="lbl" x="320" y="201" text-anchor="start">39.18035943419078</text><text class="cap" x="40" y="250" text-anchor="start">The correction is not a heuristic. Multiplying a term made against one maximum by</text><text class="cap" x="40" y="270" text-anchor="start">e^(m_old − m_new) gives exactly the term made against the other, by the exponent law. So</text><text class="cap" x="40" y="290" text-anchor="start">by the last tile the running maximum is the true maximum, the running sum is the true</text><text class="cap" x="40" y="310" text-anchor="start">sum, and the output is the true weighted average.</text><text class="cap" x="40" y="350" text-anchor="start">Carried out in floating point, the two routes agree to fifteen significant figures and</text><text class="cap" x="40" y="370" text-anchor="start">differ in the sixteenth: the additions happened in a different order, and floating point</text><text class="cap" x="40" y="390" text-anchor="start">rounds after each one ({{fig:v03-p12}}). Exact means the same function, up to that rounding.</text></svg><figcaption>Worth stating plainly, because the algorithm is often mistaken for an approximation. It is attention computed in a different order, which is why it can be dropped into a trained model unchanged.</figcaption></figure>
