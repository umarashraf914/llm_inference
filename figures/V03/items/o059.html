<figure><div class='ts'>Fig 59 &nbsp;&middot;&nbsp; 13:40</div><h3>The recurrence is exact</h3><svg viewBox="0 0 680 364" role="img"><title>The recurrence is exact</title><text class="hd" x="40" y="46">Why the result is exact, not approximate</text><g class="s"><rect x="60" y="70" width="560" height="42" rx="6"></rect><text class="sub" x="340.0" y="91.0" text-anchor="middle" dominant-baseline="central">exp(x - m_old) x exp(m_old - m_new)  =  exp(x - m_new)</text></g><text class="cap" x="40" y="152" text-anchor="start">The correction is not a heuristic. It is the exact algebraic identity that converts a term</text><text class="cap" x="40" y="172" text-anchor="start">normalised against one maximum into the same term normalised against another.</text><text class="cap" x="40" y="212" text-anchor="start">Streaming, two tiles</text><g class="s"><rect x="300" y="196" width="300" height="30" rx="3"></rect><text class="sub" x="450.0" y="211.0" text-anchor="middle" dominant-baseline="central">28.012368407149</text></g><text class="cap" x="40" y="262" text-anchor="start">Direct softmax, all at once</text><g class="s"><rect x="300" y="246" width="300" height="30" rx="3"></rect><text class="sub" x="450.0" y="261.0" text-anchor="middle" dominant-baseline="central">28.012368407149</text></g><text class="cap" x="40" y="322" text-anchor="start">Identical to the last digit that floating point can express. FlashAttention is not an</text><text class="cap" x="40" y="342" text-anchor="start">approximation to attention; it is attention, computed in a different order.</text></svg><figcaption>Worth stating plainly because the algorithm is often mistaken for an approximation. It is not, and that is why it can be dropped into a trained model unchanged.</figcaption></figure>
