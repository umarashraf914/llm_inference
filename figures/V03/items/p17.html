<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 17:47</div><h3>Divide once, at the end</h3><svg viewBox='0 0 680 468' role='img'><title>Divide once, at the end</title><text class="hd" x="40" y="46">The worked row, with the output kept two ways</text><text class="sub2" x="40" y="82" text-anchor="start"></text><text class="sub2" x="330" y="82" text-anchor="end">version 1: an average at every step</text><text class="sub2" x="640" y="82" text-anchor="end">version 2: unnormalised until the end</text><text class="cap" x="40" y="106" text-anchor="start">after tile 1</text><text class="sub2" x="330" y="106" text-anchor="end">24.05 ÷ 1.591 = 15.12</text><text class="sub2" x="640" y="106" text-anchor="end">24.05</text><text class="cap" x="40" y="134" text-anchor="start">after tile 2</text><text class="sub2" x="330" y="134" text-anchor="end">(rescale, add, ÷ 1.602) = 39.18</text><text class="sub2" x="640" y="134" text-anchor="end">62.75</text><text class="cap" x="40" y="162" text-anchor="start">at the end</text><text class="sub2" x="330" y="162" text-anchor="end">39.18</text><text class="sub2" x="640" y="162" text-anchor="end">62.75 ÷ 1.6015 = 39.18</text><text class="cap" x="40" y="190" text-anchor="start">divisions per row</text><text class="sub2" x="330" y="190" text-anchor="end">one per tile</text><text class="sub2" x="640" y="190" text-anchor="end">one</text><g class="h"><rect x="40" y="228" width="290" height="32" rx="6"/><text class="sub" x="185.0" y="244.0" text-anchor="middle" dominant-baseline="central">O = (l·c·O + new terms) ÷ l_new</text></g><g class="s"><rect x="350" y="228" width="290" height="32" rx="6"/><text class="sub" x="495.0" y="244.0" text-anchor="middle" dominant-baseline="central">Õ = c·Õ + new terms;  O = Õ ÷ l, once</text></g><text class="cap" x="40" y="298" text-anchor="start">The first version kept the running output as a finished weighted average, so after every</text><text class="cap" x="40" y="318" text-anchor="start">tile it multiplied the old average back up by its old sum and divided by the new one.</text><text class="cap" x="40" y="338" text-anchor="start">Version 2 lets the output run unnormalised, exactly as the worked row did in Part 7, and</text><text class="cap" x="40" y="358" text-anchor="start">divides once when the row is done. Both end at the same answer.</text><text class="cap" x="40" y="398" text-anchor="start">At 8,192 tokens and blocks of 128, that is 64 divisions of every output row against one,</text><text class="cap" x="40" y="418" text-anchor="start">and the multiplications that undid each division go too. Version 2 also stores a single</text><text class="cap" x="40" y="438" text-anchor="start">number per row for the backward pass, m + ln l, instead of two.</text></svg><figcaption>The result is unchanged and the scalar work shrinks. It is the first wait removed, and it is pure bookkeeping: the order of a multiplication and a division.</figcaption></figure>
