<figure><div class='ts'>Fig 25 &nbsp;&middot;&nbsp; 7:03</div><h3>Softmax, and why it subtracts the maximum</h3><svg viewBox="0 0 680 422" role="img"><title>Softmax, and why it subtracts the maximum</title><g class="u"><rect x="60" y="46" width="250" height="42" rx="6"></rect><text class="sub" x="185.0" y="67.0" text-anchor="middle" dominant-baseline="central">softmax(x)_i = e^x_i / sum e^x_j</text></g><g class="s"><rect x="340" y="46" width="280" height="42" rx="6"></rect><text class="sub" x="480.0" y="67.0" text-anchor="middle" dominant-baseline="central">= e^(x_i - m) / sum e^(x_j - m)</text></g><text class="sub2" x="60" y="116" text-anchor="start">the definition</text><text class="sub2" x="340" y="116" text-anchor="start">and the version everyone actually uses</text><text class="cap" x="40" y="166" text-anchor="start">Subtracting any constant m from every element leaves the result unchanged, because the same</text><text class="cap" x="40" y="186" text-anchor="start">factor appears in numerator and denominator and cancels.</text><text class="cap" x="40" y="226" text-anchor="start">That freedom is not cosmetic. Scores can reach values where the exponential overflows:</text><g class="h"><rect x="90" y="250" width="220" height="34" rx="4"></rect><text class="sub" x="200.0" y="267.0" text-anchor="middle" dominant-baseline="central">exp(1000) overflows</text></g><g class="s"><rect x="340" y="250" width="250" height="34" rx="4"></rect><text class="sub" x="465.0" y="267.0" text-anchor="middle" dominant-baseline="central">exp(1000 - 1000) = 1</text></g><text class="cap" x="40" y="330" text-anchor="start">So m is chosen as the largest score in the row. Every exponent becomes zero or negative, the</text><text class="cap" x="40" y="350" text-anchor="start">largest term is exactly 1, and nothing can overflow.</text><text class="cap" x="40" y="380" text-anchor="start">Remember that the maximum has to be known before any exponential can be taken. That</text><text class="cap" x="40" y="400" text-anchor="start">requirement is what makes tiling difficult later.</text></svg><figcaption>A numerical-safety trick that turns into the central algorithmic obstacle. Worth understanding completely before going further.</figcaption></figure>
