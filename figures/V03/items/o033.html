<figure><div class='ts'>Fig 33 &nbsp;&middot;&nbsp; 9:25</div><h3>What fusion means</h3><svg viewBox='0 0 680 404' role='img'><title>What fusion means</title><text class="hd" x="40" y="46">Fusion: doing several steps in one visit</text><text class="cap" x="40" y="92" text-anchor="start">Three kernels</text><g class="m"><rect x="200" y="76" width="110" height="30" rx="3"/><text class="sub" x="255.0" y="91.0" text-anchor="middle" dominant-baseline="central">step 1</text></g><g class="h"><rect x="316" y="76" width="40" height="30" rx="3"/></g><g class="m"><rect x="362" y="76" width="110" height="30" rx="3"/><text class="sub" x="417.0" y="91.0" text-anchor="middle" dominant-baseline="central">step 2</text></g><g class="h"><rect x="478" y="76" width="40" height="30" rx="3"/></g><g class="m"><rect x="524" y="76" width="110" height="30" rx="3"/><text class="sub" x="579.0" y="91.0" text-anchor="middle" dominant-baseline="central">step 3</text></g><text class="sub2" x="200" y="132" text-anchor="start">red is a round trip through memory between steps</text><text class="cap" x="40" y="182" text-anchor="start">One fused kernel</text><g class="s"><rect x="200" y="166" width="434" height="30" rx="3"/><text class="sub" x="417.0" y="181.0" text-anchor="middle" dominant-baseline="central">step 1, step 2 and step 3, without leaving the chip</text></g><text class="cap" x="40" y="250" text-anchor="start">The value produced by step one is still in a register when step two needs it. Nothing is</text><text class="cap" x="40" y="270" text-anchor="start">written out and nothing is read back.</text><text class="cap" x="40" y="306" text-anchor="start">Fusion is the general name for this, and it is used throughout deep learning, not only in</text><text class="cap" x="40" y="326" text-anchor="start">attention.</text><text class="cap" x="40" y="362" text-anchor="start">What makes attention hard to fuse is that softmax appears to need the whole row before it can</text><text class="cap" x="40" y="382" text-anchor="start">start, and that is the obstacle the next parts remove.</text></svg><figcaption>The general technique. Attention resisted it for years for one specific reason, which is the subject of Part 7.</figcaption></figure>
