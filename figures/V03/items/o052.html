<figure><div class='ts'>Fig 52 &nbsp;&middot;&nbsp; 11:13</div><h3>The same tally at 8,192 tokens</h3><svg viewBox="0 0 680 390" role="img"><title>Step 9 — the same tally at 8,192 tokens</title><text class="cap" x="40" y="78" text-anchor="start">Model weights</text><g class="h"><rect x="250" y="62" width="12" height="32" rx="1"></rect></g><text class="sub2" x="268" y="81" text-anchor="start">16 GB</text><text class="cap" x="40" y="138" text-anchor="start">KV cache written</text><g class="s"><rect x="250" y="122" width="1" height="32" rx="1"></rect></g><text class="sub2" x="258" y="141" text-anchor="start">1 GB</text><text class="cap" x="40" y="198" text-anchor="start">Score matrices, naive</text><g class="m"><rect x="250" y="182" width="370" height="32" rx="3"></rect><text class="sub" x="435.0" y="198.0" text-anchor="middle" dominant-baseline="central">550 GB</text></g><text class="cap" x="40" y="258" text-anchor="start">Score matrices, tiled</text><g class="s"><rect x="250" y="242" width="3" height="32" rx="1"></rect></g><text class="sub2" x="264" y="261" text-anchor="start">zero: S never leaves the chip</text><text class="cap" x="40" y="320" text-anchor="start">Same model, same weights, only the prompt is longer. The weight bar has not moved at all;</text><text class="cap" x="40" y="340" text-anchor="start">the score-matrix bar has grown 1,678-fold, (8,192 ÷ 200)², and is 97% of the traffic.</text><text class="cap" x="40" y="368" text-anchor="start">Now removing it is almost the whole job. The tiled kernel's rereads ({{fig:v03-p10}}) remain.</text></svg><figcaption>The n squared term grows while everything else stays fixed. How many of the tiled kernel's rereads reach HBM is the loop-order question of Part 9.</figcaption></figure>
