<figure><div class='ts'>Fig 98 &nbsp;&middot;&nbsp; 46:12</div><h3>Precision as the last lever</h3><svg viewBox="0 0 680 226" role="img"><title>Precision as the last lever</title><g class="u"><rect x="50" y="55" width="265" height="70" rx="8"></rect><text class="lbl" x="182.5" y="81.0" text-anchor="middle" dominant-baseline="central">Sixteen bits to eight</text><text class="sub" x="182.5" y="99.0" text-anchor="middle" dominant-baseline="central">halves the traffic again</text></g><g class="h"><rect x="365" y="55" width="265" height="70" rx="8"></rect><text class="lbl" x="497.5" y="81.0" text-anchor="middle" dominant-baseline="central">What fails first</text><text class="sub" x="497.5" y="99.0" text-anchor="middle" dominant-baseline="central">accuracy, not the hardware</text></g><text class="cap" x="40" y="170" text-anchor="start">Every technique above rearranged where bytes went. Narrowing the numbers themselves shrinks</text><text class="cap" x="40" y="190" text-anchor="start">the bytes at source, and it is the one lever that runs out for a reason other than engineering.</text></svg><figcaption>Which is why quantization gets a video of its own, and why the limit there is a question about models rather than about kernels.</figcaption></figure>
