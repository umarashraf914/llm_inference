<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 46:24</div><h3>Precision as the last lever</h3><svg viewBox='0 0 680 520' role='img'><title>Precision as the last lever</title><text class="hd" x="40" y="46">Bytes per number, and so bytes moved per number (bars to scale)</text><text class="cap" x="40" y="83" text-anchor="start">16-bit, BF16</text><g class="u"><rect x="170" y="66" width="200.0" height="26" rx="3"/><text class="sub" x="270.0" y="79.0" text-anchor="middle" dominant-baseline="central">2 bytes</text></g><text class="sub2" x="390" y="83" text-anchor="start">the headline numbers of versions 3 and 4</text><text class="cap" x="40" y="121" text-anchor="start">8-bit, FP8</text><g class="m"><rect x="170" y="104" width="100.0" height="26" rx="3"/><text class="sub" x="220.0" y="117.0" text-anchor="middle" dominant-baseline="central">1 byte</text></g><text class="sub2" x="390" y="121" text-anchor="start">Hopper's tensor cores; version 3's FP8 path</text><text class="cap" x="40" y="159" text-anchor="start">4-bit, FP4</text><g class="s"><rect x="170" y="142" width="50.0" height="26" rx="3"/></g><text class="sub2" x="228.0" y="159.0" text-anchor="start">0.5 bytes</text><text class="sub2" x="390" y="159" text-anchor="start">Blackwell's tensor cores reach this far</text><text class="cap" x="40" y="210" text-anchor="start">The levers so far: kernel intermediates, cache layout, cache size, parallel cache reads</text><text class="cap" x="40" y="230" text-anchor="start">and launch overhead. Each made the bytes cheaper to move or rarer to need. One lever</text><text class="cap" x="40" y="250" text-anchor="start">remains, which version 4's BF16 headline already hinted at: the width of each number</text><text class="cap" x="40" y="270" text-anchor="start">itself.</text><text class="cap" x="40" y="310" text-anchor="start">It follows the same logic. Wall-clock time tracks bytes moved, so cutting each number</text><text class="cap" x="40" y="330" text-anchor="start">from 16 bits to 8 halves the memory traffic outright, and the arithmetic gets cheaper</text><text class="cap" x="40" y="350" text-anchor="start">too, because fewer bits per operand means more tensor-core operations in each cycle.</text><text class="cap" x="40" y="370" text-anchor="start">Hopper's tensor cores run FP8; Blackwell's reach down to 4-bit FP4.</text><text class="cap" x="40" y="410" text-anchor="start">Yet version 4's headline numbers still run in BF16. Accuracy gives out before the</text><text class="cap" x="40" y="430" text-anchor="start">hardware floor is reached: even at 8 bits, holding the error down took everything in</text><text class="cap" x="40" y="450" text-anchor="start">Part 11, a separate scale for every block and outliers spread out by random rotations.</text><text class="cap" x="40" y="470" text-anchor="start">Lower precision is faster, but accuracy fails first; steering between the two is the</text><text class="cap" x="40" y="490" text-anchor="start">discipline called quantization, the subject of {{ref:v04-o001}} onwards.</text></svg><figcaption>The one lever whose limit is not set by engineering: how few bits the model's numbers can lose is a question about the model, not about the kernel.</figcaption></figure>
