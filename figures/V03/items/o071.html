<figure><div class='ts'>Fig 71 &nbsp;&middot;&nbsp; 20:31</div><h3>A kernel can fall behind its hardware</h3><svg viewBox="0 0 680 354" role="img"><title>A kernel can fall behind its hardware</title><text class="cap" x="40" y="78" text-anchor="start">FlashAttention 2 on A100</text><g class="s"><rect x="300" y="62" width="292" height="32" rx="3"></rect><text class="sub" x="446.0" y="78.0" text-anchor="middle" dominant-baseline="central">50 to 73%</text></g><text class="cap" x="40" y="138" text-anchor="start">The same kernel on H100</text><g class="h"><rect x="300" y="122" width="140" height="32" rx="3"></rect><text class="sub" x="370.0" y="138.0" text-anchor="middle" dominant-baseline="central">about 35%</text></g><rect x="300" y="122" width="292" height="32" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="cap" x="40" y="206" text-anchor="start">The chip got faster and the kernel got relatively worse, because Hopper added two features</text><text class="cap" x="40" y="226" text-anchor="start">the kernel did not know about.</text><g class="m"><rect x="40" y="258" width="285" height="74" rx="8"></rect><text class="lbl" x="182.5" y="278.0" text-anchor="middle" dominant-baseline="central">WGMMA</text><text class="sub" x="182.5" y="296.0" text-anchor="middle" dominant-baseline="central">an asynchronous matmul issued</text><text class="sub" x="182.5" y="313.0" text-anchor="middle" dominant-baseline="central">by a group of four warps</text></g><g class="m"><rect x="368" y="258" width="272" height="74" rx="8"></rect><text class="lbl" x="504.0" y="278.0" text-anchor="middle" dominant-baseline="central">TMA</text><text class="sub" x="504.0" y="296.0" text-anchor="middle" dominant-baseline="central">a copy engine that moves blocks</text><text class="sub" x="504.0" y="313.0" text-anchor="middle" dominant-baseline="central">without using threads</text></g></svg><figcaption>Both new units are asynchronous, which is the key word: they let something else happen while they work, and a synchronous kernel cannot take advantage of that.</figcaption></figure>
