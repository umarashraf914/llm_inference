linear: 2</text><text class="sub2" x="600" y="74.0" text-anchor="start">square: 4</text><text class="cap" x="40" y="344" text-anchor="start">Both curves are drawn to one scale and pass through the same value at n. Doubling the</text><text class="cap" x="40" y="364" text-anchor="start">input doubles the straight line and quadruples the curve. At ten times the input the gap</text><text class="cap" x="40" y="384" text-anchor="start">is ten-fold; at a thousand times, a thousand-fold.</text><text class="cap" x="40" y="424" text-anchor="start">In attention, Q, K and V grow with the number of tokens, the straight line. The score</text><text class="cap" x="40" y="444" text-anchor="start">matrix S has an entry for every pair of tokens, so it grows as the square. Everything</text><text class="cap" x="40" y="464" text-anchor="start">else in sight is on the straight line; S is the only thing on the curve.</text></svg><figcaption>A shape worth recognising instantly. Whenever one term grows quadratically and the rest do not, the quadratic one eventually decides everything.</figcaption></figure>
