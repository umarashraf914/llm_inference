<figure><div class='ts'>Fig 26 &nbsp;&middot;&nbsp; 7:38</div><h3>Linear against quadratic</h3><svg viewBox="0 0 680 502" role="img"><title>Linear against quadratic</title><text class="hd" x="40" y="92">Linear</text><text class="sub2" x="40" y="114" text-anchor="start">double the input,</text><text class="sub2" x="40" y="134" text-anchor="start">double the work</text><line class="axis" x1="250" y1="150" x2="590" y2="150"></line><line class="axis" x1="250" y1="60" x2="250" y2="150"></line><polyline class="pl-h" points="256,146 340,128 424,110 570,78"></polyline><text class="sub2" x="604" y="84" text-anchor="start">n</text><text class="hd" x="40" y="292">Quadratic</text><text class="sub2" x="40" y="314" text-anchor="start">double the input,</text><text class="sub2" x="40" y="334" text-anchor="start">quadruple the work</text><line class="axis" x1="250" y1="350" x2="590" y2="350"></line><line class="axis" x1="250" y1="214" x2="250" y2="350"></line><polyline class="pl-h" points="256,348 340,340 424,306 500,240 570,222"></polyline><text class="sub2" x="604" y="228" text-anchor="start">n squared</text><text class="cap" x="40" y="404" text-anchor="start">At small sizes the difference is barely visible. At large ones it is everything: at a thousand</text><text class="cap" x="40" y="424" text-anchor="start">the second is a thousand times worse than the first, at a million it is a million times.</text><text class="cap" x="40" y="460" text-anchor="start">The score matrix in attention grows quadratically with the number of tokens. Every other object</text><text class="cap" x="40" y="480" text-anchor="start">in sight grows linearly. That asymmetry is the whole of this video.</text></svg><figcaption>A shape worth recognising instantly. Whenever one term grows quadratically and the rest do not, the quadratic one eventually decides everything.</figcaption></figure>
