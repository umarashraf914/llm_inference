<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 37:29</div><h3>A big matrix that is really two thin ones</h3><svg viewBox='0 0 680 660' role='img'><title>A big matrix that is really two thin ones</title><text class="hd" x="40" y="46">Sixteen numbers built from eight: a column times a row</text><g class="m"><rect x="40" y="66" width="30" height="30" rx="3"/><text class="sub" x="55.0" y="81.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="40" y="100" width="30" height="30" rx="3"/><text class="sub" x="55.0" y="115.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="m"><rect x="40" y="134" width="30" height="30" rx="3"/><text class="sub" x="55.0" y="149.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="m"><rect x="40" y="168" width="30" height="30" rx="3"/><text class="sub" x="55.0" y="183.0" text-anchor="middle" dominant-baseline="central">4</text></g><text class="hd" x="90" y="132" text-anchor="middle">×</text><g class="s"><rect x="110" y="66" width="30" height="30" rx="3"/><text class="sub" x="125.0" y="81.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="s"><rect x="144" y="66" width="30" height="30" rx="3"/><text class="sub" x="159.0" y="81.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="s"><rect x="178" y="66" width="30" height="30" rx="3"/><text class="sub" x="193.0" y="81.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="212" y="66" width="30" height="30" rx="3"/><text class="sub" x="227.0" y="81.0" text-anchor="middle" dominant-baseline="central">3</text></g><text class="hd" x="270" y="132" text-anchor="middle">=</text><g class="u"><rect x="292" y="66" width="30" height="30" rx="3"/><text class="sub" x="307.0" y="81.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="u"><rect x="326" y="66" width="30" height="30" rx="3"/><text class="sub" x="341.0" y="81.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="360" y="66" width="30" height="30" rx="3"/><text class="sub" x="375.0" y="81.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="394" y="66" width="30" height="30" rx="3"/><text class="sub" x="409.0" y="81.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="u"><rect x="292" y="100" width="30" height="30" rx="3"/><text class="sub" x="307.0" y="115.0" text-anchor="middle" dominant-baseline="central">4</text></g><g class="u"><rect x="326" y="100" width="30" height="30" rx="3"/><text class="sub" x="341.0" y="115.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="360" y="100" width="30" height="30" rx="3"/><text class="sub" x="375.0" y="115.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="u"><rect x="394" y="100" width="30" height="30" rx="3"/><text class="sub" x="409.0" y="115.0" text-anchor="middle" dominant-baseline="central">6</text></g><g class="u"><rect x="292" y="134" width="30" height="30" rx="3"/><text class="sub" x="307.0" y="149.0" text-anchor="middle" dominant-baseline="central">6</text></g><g class="u"><rect x="326" y="134" width="30" height="30" rx="3"/><text class="sub" x="341.0" y="149.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="360" y="134" width="30" height="30" rx="3"/><text class="sub" x="375.0" y="149.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="u"><rect x="394" y="134" width="30" height="30" rx="3"/><text class="sub" x="409.0" y="149.0" text-anchor="middle" dominant-baseline="central">9</text></g><g class="u"><rect x="292" y="168" width="30" height="30" rx="3"/><text class="sub" x="307.0" y="183.0" text-anchor="middle" dominant-baseline="central">8</text></g><g class="u"><rect x="326" y="168" width="30" height="30" rx="3"/><text class="sub" x="341.0" y="183.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="360" y="168" width="30" height="30" rx="3"/><text class="sub" x="375.0" y="183.0" text-anchor="middle" dominant-baseline="central">4</text></g><g class="u"><rect x="394" y="168" width="30" height="30" rx="3"/><text class="sub" x="409.0" y="183.0" text-anchor="middle" dominant-baseline="central">12</text></g><text class="sub2" x="450" y="90" text-anchor="start">every row is a multiple</text><text class="sub2" x="450" y="108" text-anchor="start">of the same row (2, 0, 1, 3)</text><text class="sub2" x="450" y="140" text-anchor="start">store 4 + 4 = 8 numbers,</text><text class="sub2" x="450" y="158" text-anchor="start">rebuild all 16 on demand</text><text class="hd" x="40" y="236">The same shape in MLA: keys for n tokens (widths to scale, n schematic)</text><g class="m"><rect x="40" y="266" width="7.5" height="110" rx="1"/></g><text class="sub2" x="40" y="394" text-anchor="start">latents, n × 512:</text><text class="sub2" x="40" y="410" text-anchor="start">the only thing cached</text><text class="hd" x="64" y="326.0" text-anchor="middle">×</text><g class="s"><rect x="80" y="266" width="240.0" height="7.5" rx="1"/></g><text class="sub2" x="80" y="294" text-anchor="start">512 × 16,384: one learned</text><text class="sub2" x="80" y="310" text-anchor="start">matrix, the same for every token</text><text class="hd" x="342" y="326.0" text-anchor="middle">=</text><rect x="362" y="266" width="240.0" height="110" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="482.0" y="317.0" text-anchor="middle">n × 16,384 keys,</text><text class="sub2" x="482.0" y="335.0" text-anchor="middle">rebuilt, never stored</text><text class="cap" x="40" y="450" text-anchor="start">A matrix built as a column times a row holds 16 numbers but only 8 numbers' worth of</text><text class="cap" x="40" y="470" text-anchor="start">information: every row is a multiple of one row. A matrix that factors into a tall thin</text><text class="cap" x="40" y="490" text-anchor="start">piece times a short wide one is called low rank, and storing the two pieces costs far</text><text class="cap" x="40" y="510" text-anchor="start">less than storing the product.</text><text class="cap" x="40" y="550" text-anchor="start">DeepSeek-V2 trains its keys to have exactly this shape, which its paper calls low-rank</text><text class="cap" x="40" y="570" text-anchor="start">joint compression. Each token stores a latent of 512 numbers. One fixed 512 × 16,384</text><text class="cap" x="40" y="590" text-anchor="start">matrix, learned in training and shared by every token, turns any latent into that</text><text class="cap" x="40" y="610" text-anchor="start">token's 16,384 key numbers, and a second one turns the same latent into its 16,384 value</text><text class="cap" x="40" y="630" text-anchor="start">numbers.</text></svg><figcaption>Nothing is thrown away at serving time: the model learned to make its keys and values from the latent, so the latent is all there is to keep.</figcaption></figure>
