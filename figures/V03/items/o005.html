<figure><div class='ts'>Fig 05 &nbsp;&middot;&nbsp; 0:21</div><h3>What launching a kernel looks like</h3><svg viewBox='0 0 680 310' role='img'><title>What launching a kernel looks like</title><text class="hd" x="40" y="46">What one launch looks like from the outside</text><g class="u"><rect x="40" y="76" width="150" height="40" rx="4"/><text class="sub" x="115.0" y="96.0" text-anchor="middle" dominant-baseline="central">the CPU asks</text></g><line class="conn" x1="196" y1="96" x2="216" y2="96" marker-end="url(#arw)"/><g class="m"><rect x="222" y="76" width="200" height="40" rx="4"/><text class="sub" x="322.0" y="96.0" text-anchor="middle" dominant-baseline="central">the GPU runs the kernel</text></g><line class="conn" x1="428" y1="96" x2="448" y2="96" marker-end="url(#arw)"/><g class="s"><rect x="454" y="76" width="186" height="40" rx="4"/><text class="sub" x="547.0" y="96.0" text-anchor="middle" dominant-baseline="central">results land in memory</text></g><text class="cap" x="40" y="156" text-anchor="start">The CPU does not wait and watch. It hands over the work, carries on, and finds out later that</text><text class="cap" x="40" y="176" text-anchor="start">it finished.</text><text class="cap" x="40" y="212" text-anchor="start">Between the launch and the finish, the GPU is on its own. Whatever the kernel needs must</text><text class="cap" x="40" y="232" text-anchor="start">already be in memory, and whatever it produces must be left there.</text><text class="cap" x="40" y="268" text-anchor="start">Which is why a boundary between two kernels forces a round trip: the second one cannot see</text><text class="cap" x="40" y="288" text-anchor="start">anything the first one left on the chip.</text></svg><figcaption>The handover is what makes kernel boundaries expensive. Everything held on-chip vanishes at the moment of handing back.</figcaption></figure>
