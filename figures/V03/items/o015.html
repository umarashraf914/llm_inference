<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:30</div><h3>Q, K and V: three roles, made before attention runs</h3><svg viewBox='0 0 680 488' role='img'><title>Q, K and V: three roles, made before attention runs</title><text class="hd" x="40" y="46">Each token's vector, times three learned matrices, gives three new vectors</text><g class="u"><rect x="40" y="70" width="150" height="70" rx="8"/><text class="lbl" x="115.0" y="88.0" text-anchor="middle" dominant-baseline="central">X</text><text class="sub" x="115.0" y="106.0" text-anchor="middle" dominant-baseline="central">the layer's input</text><text class="sub" x="115.0" y="123.0" text-anchor="middle" dominant-baseline="central">one row per token</text></g><line class="conn" x1="196" y1="105" x2="236" y2="76" marker-end="url(#arw)"/><g class="m"><rect x="242" y="64" width="130" height="24" rx="3"/><text class="sub" x="307.0" y="76.0" text-anchor="middle" dominant-baseline="central">× W_Q</text></g><line class="conn" x1="378" y1="76" x2="398" y2="76" marker-end="url(#arw)"/><g class="s"><rect x="404" y="64" width="236" height="24" rx="3"/><text class="sub" x="522.0" y="76.0" text-anchor="middle" dominant-baseline="central">Q: what this token looks for</text></g><line class="conn" x1="196" y1="105" x2="236" y2="106" marker-end="url(#arw)"/><g class="m"><rect x="242" y="94" width="130" height="24" rx="3"/><text class="sub" x="307.0" y="106.0" text-anchor="middle" dominant-baseline="central">× W_K</text></g><line class="conn" x1="378" y1="106" x2="398" y2="106" marker-end="url(#arw)"/><g class="s"><rect x="404" y="94" width="236" height="24" rx="3"/><text class="sub" x="522.0" y="106.0" text-anchor="middle" dominant-baseline="central">K: what it offers to others</text></g><line class="conn" x1="196" y1="105" x2="236" y2="136" marker-end="url(#arw)"/><g class="m"><rect x="242" y="124" width="130" height="24" rx="3"/><text class="sub" x="307.0" y="136.0" text-anchor="middle" dominant-baseline="central">× W_V</text></g><line class="conn" x1="378" y1="136" x2="398" y2="136" marker-end="url(#arw)"/><g class="s"><rect x="404" y="124" width="236" height="24" rx="3"/><text class="sub" x="522.0" y="136.0" text-anchor="middle" dominant-baseline="central">V: what it contributes</text></g><g class="u"><rect x="40" y="172" width="600" height="112" rx="14"/><text class="lbl" x="62" y="198">Two kernels, one hand-off through HBM</text></g><g class="m"><rect x="62" y="216" width="180" height="46" rx="8"/><text class="lbl" x="152.0" y="230.0" text-anchor="middle" dominant-baseline="central">projection kernel</text><text class="sub" x="152.0" y="248.0" text-anchor="middle" dominant-baseline="central">writes Q, K, V</text></g><line class="conn" x1="248" y1="239" x2="278" y2="239" marker-end="url(#arw)"/><g class="h"><rect x="284" y="216" width="150" height="46" rx="8"/><text class="lbl" x="359.0" y="230.0" text-anchor="middle" dominant-baseline="central">HBM</text><text class="sub" x="359.0" y="248.0" text-anchor="middle" dominant-baseline="central">1 MB each, per head</text></g><line class="conn" x1="440" y1="239" x2="470" y2="239" marker-end="url(#arw)"/><g class="m"><rect x="476" y="216" width="142" height="46" rx="8"/><text class="lbl" x="547.0" y="230.0" text-anchor="middle" dominant-baseline="central">attention kernel</text><text class="sub" x="547.0" y="248.0" text-anchor="middle" dominant-baseline="central">reads them back</text></g><text class="cap" x="40" y="318" text-anchor="start">Q, K and V are made inside each layer by multiplying the layer's input by three learned</text><text class="cap" x="40" y="338" text-anchor="start">weight matrices. Each has one row per token, sliced into heads of width d: at</text><text class="cap" x="40" y="358" text-anchor="start">8,192 tokens and d = 64, one head's Q is 8,192 × 64 numbers, 1 MB in 16-bit.</text><text class="cap" x="40" y="398" text-anchor="start">They are made by a kernel of their own, the projection, which writes them to HBM. The</text><text class="cap" x="40" y="418" text-anchor="start">attention kernel then reads them back. That read is real traffic, but it is the small</text><text class="cap" x="40" y="438" text-anchor="start">term: four n × d matrices, against the n × n ones attention builds from them (Part 4). K</text><text class="cap" x="40" y="458" text-anchor="start">and V also stay in HBM afterwards, as the cache later tokens read (next figures).</text></svg><figcaption>Inputs to the attention kernel, outputs of the one before it. They do cross HBM, but they grow with n, not n², so they are never the expensive part.</figcaption></figure>
