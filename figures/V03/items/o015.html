<figure><div class='ts'>Fig 15 &nbsp;&middot;&nbsp; 5:12</div><h3>Q, K and V</h3><svg viewBox="0 0 680 242" role="img"><title>Q, K and V</title><g class="s"><rect x="40" y="55" width="175" height="74" rx="8"></rect><text class="lbl" x="127.5" y="83.0" text-anchor="middle" dominant-baseline="central">Q, queries</text><text class="sub" x="127.5" y="101.0" text-anchor="middle" dominant-baseline="central">what each token is looking for</text></g><g class="s"><rect x="250" y="55" width="175" height="74" rx="8"></rect><text class="lbl" x="337.5" y="83.0" text-anchor="middle" dominant-baseline="central">K, keys</text><text class="sub" x="337.5" y="101.0" text-anchor="middle" dominant-baseline="central">what each token offers</text></g><g class="s"><rect x="460" y="55" width="180" height="74" rx="8"></rect><text class="lbl" x="550.0" y="83.0" text-anchor="middle" dominant-baseline="central">V, values</text><text class="sub" x="550.0" y="101.0" text-anchor="middle" dominant-baseline="central">what each token contributes</text></g><text class="cap" x="40" y="170" text-anchor="start">All three are produced inside the layer by multiplying the incoming activations by learned</text><text class="cap" x="40" y="190" text-anchor="start">weight matrices. Each has one row per token.</text><text class="cap" x="40" y="220" text-anchor="start">For a sequence of n tokens and head dimension d, each is n by d.</text></svg><figcaption>They are outputs of a matrix multiply, not objects fetched from memory. That distinction matters once we start counting bytes.</figcaption></figure>
