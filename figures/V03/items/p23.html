 times larger, has set the scale. An 8-bit integer format has</text><text class="cap" x="40" y="310" text-anchor="start">255 evenly spaced levels, so with the scale stretched to 100 they are 0.787 apart, and</text><text class="cap" x="40" y="330" text-anchor="start">every typical value lands on 0 or on the first level. Almost all of the resolution sits</text><text class="cap" x="40" y="350" text-anchor="start">where no value ever falls.</text><text class="cap" x="40" y="390" text-anchor="start">E4M3's values are spaced by powers of two, so after the same scaling 72 of its 126</text><text class="cap" x="40" y="410" text-anchor="start">positive values still land between 0 and 1, packed toward zero where the values are.</text><text class="cap" x="40" y="430" text-anchor="start">Each typical value keeps its few percent of precision. For a float format, one large</text><text class="cap" x="40" y="450" text-anchor="start">outlier costs much less than the integer picture suggests.</text><text class="cap" x="40" y="490" text-anchor="start">The outliers still do damage, just elsewhere: inside the scores, as the next figures</text><text class="cap" x="40" y="510" text-anchor="start">show. A separate scale for every block of 128 rows also helps, because an outlier then</text><text class="cap" x="40" y="530" text-anchor="start">stretches only its own block's scale.</text></svg><figcaption>The crowding-onto-a-few-levels story is exactly right for integers, and the next atlas works it through in full ({{ref:v04-o035}}). For FP8 the real damage comes from what large values do to the sums.</figcaption></figure>
