<figure><div class='ts'>Fig 80 &nbsp;&middot;&nbsp; 25:57</div><h3>What approximating the exponential means</h3><svg viewBox='0 0 680 490' role='img'><title>What approximating the exponential means</title><text class="hd" x="40" y="46">Approximating a curve with a polynomial</text><line class="axis" x1="70" y1="240" x2="380" y2="240"/><line class="axis" x1="70" y1="60" x2="70" y2="240"/><polyline class="pl-h" points="76,236 140,226 200,206 260,168 310,110 350,66"/><polyline class="pl-m" points="76,234 140,224 200,208 260,170 310,112 350,70"/><text class="cap" x="410" y="120" text-anchor="start">the true exponential</text><text class="cap" x="410" y="150" text-anchor="start">a short polynomial, close enough</text><text class="cap" x="40" y="300" text-anchor="start">A polynomial is just multiplies and adds: the operations the ordinary arithmetic units already</text><text class="cap" x="40" y="320" text-anchor="start">do, and do quickly.</text><text class="cap" x="40" y="356" text-anchor="start">The special hardware for exponentials is fast but there is very little of it. Approximating on</text><text class="cap" x="40" y="376" text-anchor="start">the ordinary units, which are otherwise idle, adds a second path.</text><text class="cap" x="40" y="412" text-anchor="start">The work is then split between the two, and neither is the bottleneck on its own.</text><text class="cap" x="40" y="448" text-anchor="start">The curves are illustrative. The accuracy actually required is set by the format the result</text><text class="cap" x="40" y="468" text-anchor="start">will be stored in, which is why a short polynomial suffices.</text></svg><figcaption>Not a loss of correctness so much as a choice of which units do the work. The approximation only has to be as accurate as the storage format can record.</figcaption></figure>
