<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 26:48</div><h3>e to any power is a power of two times a short polynomial</h3><svg viewBox='0 0 680 780' role='img'><title>e to any power is a power of two times a short polynomial</title><text class="hd" x="40" y="46">Computing e^1.7 without the exponential unit</text><text class="cap" x="40" y="76" text-anchor="start">1  change base</text><text class="hd" x="150" y="76" text-anchor="start">e^1.7 = 2^(1.7 × log₂e) = 2^2.4526</text><text class="sub2" x="150" y="94" text-anchor="start">one multiplication, which the score scaling can absorb</text><text class="cap" x="40" y="120" text-anchor="start">2  split</text><text class="hd" x="150" y="120" text-anchor="start">2^2.4526 = 2² × 2^0.4526</text><text class="sub2" x="150" y="138" text-anchor="start">a whole power, and a fraction between 0 and 1</text><text class="cap" x="40" y="164" text-anchor="start">3  whole part</text><text class="hd" x="150" y="164" text-anchor="start">2² goes straight into the exponent field</text><text class="sub2" x="150" y="182" text-anchor="start">a shift and an integer add on the exponent bits</text><text class="cap" x="40" y="208" text-anchor="start">4  fraction</text><text class="hd" x="150" y="208" text-anchor="start">1 + 0.6951f + 0.2276f² + 0.0771f³ = 1.3684</text><text class="sub2" x="150" y="226" text-anchor="start">three multiply-adds; the true value is 1.3685</text><text class="cap" x="40" y="252" text-anchor="start">5  combine</text><text class="hd" x="150" y="252" text-anchor="start">4 × 1.3684 = 5.4735</text><text class="sub2" x="150" y="270" text-anchor="start">e^1.7 = 5.4739; in BF16 both are 5.46875</text><text class="hd" x="40" y="322">The cubic's relative error across the whole fraction range, to scale</text><line class="tick" x1="150.0" y1="392.0" x2="620.0" y2="392.0"/><line class="xok" x1="150.0" y1="346.0" x2="620.0" y2="346.0" stroke="var(--rule)" stroke-width="1.2" stroke-dasharray="4 3"/><text class="sub2" x="142" y= .8,368.8 493.1,367.4 495.5,366.1 497.8,364.9 500.2,363.7 502.5,362.5 504.9,361.4 507.2,360.4 509.6,359.4 511.9,358.4 514.2,357.5 516.6,356.7 519.0,355.9 521.3,355.3 523.7,354.6 526.0,354.1 528.4,353.6 530.7,353.3 533.0,353.0 535.4,352.8 537.8,352.7 540.1,352.6 542.5,352.7 544.8,352.9 547.2,353.2 549.5,353.6 551.9,354.1 554.2,354.7 556.6,355.4 558.9,356.2 561.2,357.2 563.6,358.3 566.0,359.5 568.3,360.9 570.7,362.4 573.0,364.0 575.4,365.8 577.7,367.7 580.0,369.8 582.4,372.1 584.8,374.4 587.1,377.0 589.5,379.7 591.8,382.6 594.2,385.6 596.5,388.8 598.9,392.2 601.2,395.8 603.5,399.6 605.9,403.5 608.2,407.7 610.6,412.0 613.0,416.5 615.3,421.3 617.7,426.2 620.0,431.4" fill="none" stroke="var(--s)" stroke-width="2"/><text class="sub2" x="150" y="458" text-anchor="middle">f = 0</text><text class="sub2" x="620" y="458" text-anchor="middle">f = 1</text><text class="cap" x="40" y="490" text-anchor="start">Version 4 computes some exponentials without the multi-function unit, in five steps. A</text><text class="cap" x="40" y="510" text-anchor="start">power of two splits cleanly into a whole power and a fractional one. The whole power</text><text class="cap" x="40" y="530" text-anchor="start">needs no floating-point arithmetic: floating-point numbers store a power of two in their</text><text class="cap" x="40" y="550" text-anchor="start">exponent field ({{fig:v02-o086}}), so 2² is an addition to that field.</text><text class="cap" x="40" y="590" text-anchor="start">Only the fraction needs approximating, and only between 0 and 1, where a cubic does it</text><text class="cap" x="40" y="610" text-anchor="start">closely. The cubic here is fitted to make its worst relative error as small as possible:</text><text class="cap" x="40" y="630" text-anchor="start">8.6e-05, the paper's own cubic 8.8 × 10⁻⁵. BF16 rounds every result to within 2⁻⁸ = 3.9</text><text class="cap" x="40" y="650" text-anchor="start">× 10⁻³ anyway, 46 times coarser, so after rounding the two paths agree to within one</text><text class="cap" x="40" y="670" text-anchor="start">BF16 step on 99% of inputs (the paper's measurement).</text><text class="cap" x="40" y="710" text-anchor="start">The polynomial runs on the CUDA cores, which this kernel otherwise leaves idle. It costs</text><text class="cap" x="40" y="730" text-anchor="start">registers, so only 10 to 25% of each row's exponentials take this path, tuned to the</text><text class="cap" x="40" y="750" text-anchor="start">tile; the rest stay on the multi-function unit, and the two run side by side.</text></svg><figcaption>The trick is called range reduction, and it is decades older than GPUs: shrink the problem to a small interval where a polynomial is easy, then put the scale back exactly.</figcaption></figure>
