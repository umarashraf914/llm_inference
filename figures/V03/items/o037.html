<figure><div class='ts'>Fig 37 &nbsp;&middot;&nbsp; 10:50</div><h3>Tiling: S never reaches HBM</h3><svg viewBox="0 0 680 348" role="img"><title>Tiling: S never reaches HBM</title><g class="h"><rect x="40" y="55" width="200" height="175" rx="14"></rect><text class="lbl" x="62" y="81">HBM</text></g><g class="u"><rect x="60" y="100" width="160" height="30" rx="3"></rect><text class="sub" x="140.0" y="115.0" text-anchor="middle" dominant-baseline="central">Q blocks</text></g><g class="u"><rect x="60" y="140" width="160" height="30" rx="3"></rect><text class="sub" x="140.0" y="155.0" text-anchor="middle" dominant-baseline="central">K blocks</text></g><g class="u"><rect x="60" y="180" width="160" height="30" rx="3"></rect><text class="sub" x="140.0" y="195.0" text-anchor="middle" dominant-baseline="central">V blocks</text></g><g class="s"><rect x="300" y="55" width="340" height="183" rx="14"></rect><text class="lbl" x="322" y="81">SRAM, one multiprocessor</text></g><g class="m"><rect x="320" y="100" width="300" height="34" rx="3"></rect><text class="sub" x="470.0" y="117.0" text-anchor="middle" dominant-baseline="central">one tile of S is computed</text></g><g class="m"><rect x="320" y="142" width="300" height="34" rx="3"></rect><text class="sub" x="470.0" y="159.0" text-anchor="middle" dominant-baseline="central">folded into the output</text></g><rect x="320" y="184" width="300" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="470.0" y="201.0" text-anchor="middle" dominant-baseline="central">then overwritten</text><line class="conn" x1="244" y1="143" x2="296" y2="143" marker-end="url(#arw)"></line><text class="cap" x="40" y="276" text-anchor="start">Q, K and V are cut to block sizes that fit in SRAM. The full n by n matrix is still built,</text><text class="cap" x="40" y="296" text-anchor="start">tile by tile, on chip, and never reaches HBM.</text><text class="cap" x="40" y="326" text-anchor="start">This is exact attention. Nothing is approximated or discarded.</text></svg><figcaption>The n squared object still exists in full. It just never exists all at once, anywhere. Watch it happen on four tokens in <a class='xref' href='V03_Kernels_and_Memory_animation.html'>the companion animation</a>, where the fused kernel's panel never writes a score to HBM.</figcaption></figure>
