<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 33:19</div><h3>Wasted cache is lost batch</h3><svg viewBox='0 0 680 414' role='img'><title>Wasted cache is lost batch</title><text class="hd" x="40" y="46">Requests of 2,000 tokens that fit in 40 GB of cache (bars to scale)</text><text class="cap" x="40" y="83" text-anchor="start">every slot holds a token (paged)</text><g class="s"><rect x="260" y="66" width="380.0" height="24" rx="3"/><text class="sub" x="450.0" y="78.0" text-anchor="middle" dominant-baseline="central">152</text></g><text class="cap" x="40" y="119" text-anchor="start">38.2% of the memory holds tokens</text><g class="h"><rect x="260" y="102" width="145.0" height="24" rx="3"/><text class="sub" x="332.5" y="114.0" text-anchor="middle" dominant-baseline="central">58</text></g><text class="cap" x="40" y="155" text-anchor="start">20.4% of the memory holds tokens</text><g class="h"><rect x="260" y="138" width="77.5" height="24" rx="3"/><text class="sub" x="298.75" y="150.0" text-anchor="middle" dominant-baseline="central">31</text></g><text class="cap" x="40" y="204" text-anchor="start">Memory that sat reserved and empty can now hold other requests, and more requests in a</text><text class="cap" x="40" y="224" text-anchor="start">batch means more throughput. Take requests of 2,000 tokens on the same Llama 3 8B shape:</text><text class="cap" x="40" y="244" text-anchor="start">2,000 × 128 KiB = 262 MB of cache each. An illustrative 40 GB of HBM set aside for cache</text><text class="cap" x="40" y="264" text-anchor="start">holds 152 of them when every slot holds a token, but only 58 when 38.2% of the memory</text><text class="cap" x="40" y="284" text-anchor="start">holds tokens, and 31 at 20.4%.</text><text class="cap" x="40" y="324" text-anchor="start">That is a batch 2.6 to 4.9 times larger. vLLM measured 2 to 4 times the throughput of</text><text class="cap" x="40" y="344" text-anchor="start">the serving systems before it, at the same latency. Throughput grows less than the batch</text><text class="cap" x="40" y="364" text-anchor="start">does, because every request in the batch adds its own cache to read at every step</text><text class="cap" x="40" y="384" text-anchor="start">({{fig:v01-o141}}).</text></svg><figcaption>The 40 GB and the 2,000-token requests are illustrative; the 20.4% and 38.2% are vLLM's measurements of the systems before it.</figcaption></figure>
