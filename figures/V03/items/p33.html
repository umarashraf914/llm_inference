<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 32:36</div><h3>Finding token 37 takes one division and one lookup</h3><svg viewBox='0 0 680 586' role='img'><title>Finding token 37 takes one division and one lookup</title><text class="hd" x="40" y="46">Where is token 37 of request A? Blocks of 16 tokens</text><g class="u"><rect x="40" y="62" width="280" height="34" rx="6"/><text class="sub" x="180.0" y="79.0" text-anchor="middle" dominant-baseline="central">37 = 2 × 16 + 5</text></g><text class="sub2" x="336" y="84" text-anchor="start">logical block 2, offset 5</text><text class="cap" x="40" y="128" text-anchor="start">A's block table</text><text class="sub2" x="182" y="114" text-anchor="middle">0</text><g class="u"><rect x="160" y="120" width="44" height="28" rx="3"/><text class="sub" x="182.0" y="134.0" text-anchor="middle" dominant-baseline="central">7</text></g><text class="sub2" x="232" y="114" text-anchor="middle">1</text><g class="u"><rect x="210" y="120" width="44" height="28" rx="3"/><text class="sub" x="232.0" y="134.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="282" y="114" text-anchor="middle">2</text><g class="s"><rect x="260" y="120" width="44" height="28" rx="3"/><text class="sub" x="282.0" y="134.0" text-anchor="middle" dominant-baseline="central">9</text></g><text class="sub2" x="332" y="114" text-anchor="middle">3</text><g class="u"><rect x="310" y="120" width="44" height="28" rx="3"/><text class="sub" x="332.0" y="134.0" text-anchor="middle" dominant-baseline="central">4</text></g><text class="sub2" x="370" y="139" text-anchor="start">entry 2 says physical block 9</text><text class="cap" x="40" y="192" text-anchor="start">physical block 9</text><g class="u"><rect x="160" y="176" width="24" height="24" rx="3"/></g><g class="u"><rect x="188" y="176" width="24" height="24" rx="3"/></g><g class="u"><rect x="216" y="176" width="24" height="24" rx="3"/></g><g class="u"><rect x="244" y="176" width="24" height="24" rx="3"/></g><g class="u"><rect x="272" y="176" width="24" height="24" rx="3"/></g><g class="s"><rect x="300" y="176" width="24" height="24" rx="3"/><text class="sub" x="312.0" y="188.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="u"><rect x="328" y="176" width="24" height="24" rx="3"/></g><g class="u"><rect x="356" y="176" width="24" height="24" rx="3"/></g><g class="u"><rect x="384" y="176" width="24" height="24" rx="3"/></g><g class="u"><rect x="412" y="176" width="24" height="24" rx="3"/></g><g class="u"><rect x="440" y="176" width="24" height="24" rx="3"/></g><g class="u"><rect x="468" y="176" width="24" height="24" rx="3"/></g><g class="u"><rect x="496" y="176" width="24" height="24" rx="3"/></g><g class="u"><rect x="524" y="176" width="24" height="24" rx="3"/></g><g class="u"><rect x="552" y="176" width="24" height="24" rx="3"/></g><g class="u"><rect x="580" y="176" width="24" height="24" rx="3"/></g><text class="sub2" x="160" y="220" text-anchor="start">slots 144 to 159 of the pool; offset 5 is slot 149</text><g class="s"><rect x="40" y="236" width="600" height="34" rx="6"/><text class="sub" x="340.0" y="253.0" text-anchor="middle" dominant-baseline="central">slot = 9 × 16 + 5 = 149</text></g><text class="hd" x="40" y="306">The waste bound, for the 200-token answer</text><text class="cap" x="40" y="334" text-anchor="start">one contiguous reservation</text><text class="sub2" x="230" y="334" text-anchor="start">4,096 slots, 3,896 empty</text><text class="sub2" x="640" y="334" text-anchor="end">95.1%</text><text class="cap" x="40" y="360" text-anchor="start">blocks of 16</text><text class="sub2" x="230" y="360" text-anchor="start">200 ÷ 16 = 12.5, so 13 blocks: 208 slots, 8 empty</text><text class="sub2" x="640" y="360" text-anchor="end">3.8%</text><text class="cap" x="40" y="416" text-anchor="start">Token 37 sits in logical block 37 ÷ 16 = 2, rounding down, at offset 37 − 2 × 16 = 5.</text><text class="cap" x="40" y="436" text-anchor="start">Entry 2 of A's block table says that logical block is physical block 9, so the kernel</text><text class="cap" x="40" y="456" text-anchor="start">reads slot 9 × 16 + 5 = 149 of the cache pool. One division and one lookup, done once</text><text class="cap" x="40" y="476" text-anchor="start">for each block the kernel gathers rather than once per token.</text><text class="cap" x="40" y="516" text-anchor="start">The waste is now bounded by one partly filled block per request. The 200-token answer of</text><text class="cap" x="40" y="536" text-anchor="start">{{fig:v03-p32}} takes 13 blocks, 208 slots, of which 8 are empty: 3.8%, where one reservation</text><text class="cap" x="40" y="556" text-anchor="start">left 95.1% empty. A request grows one block at a time, as its answer grows.</text></svg><figcaption>The indirection is the whole cost of paging, and it is paid in arithmetic the chip has plenty of.</figcaption></figure>
