<figure><div class='ts'>Fig 90 &nbsp;&middot;&nbsp; 36:48</div><h3>What compressing the cache means</h3><svg viewBox='0 0 680 394' role='img'><title>What compressing the cache means</title><text class="hd" x="40" y="46">Compression: keep something smaller that the rest can be rebuilt from</text><g class="h"><rect x="40" y="76" width="400" height="40" rx="4"/><text class="sub" x="240.0" y="96.0" text-anchor="middle" dominant-baseline="central">the full keys and values</text></g><line class="conn" x1="240" y1="124" x2="240" y2="146" marker-end="url(#arw)"/><g class="s"><rect x="180" y="150" width="120" height="40" rx="4"/><text class="sub" x="240.0" y="170.0" text-anchor="middle" dominant-baseline="central">a short vector</text></g><line class="conn" x1="310" y1="170" x2="340" y2="170" marker-end="url(#arw)"/><g class="m"><rect x="346" y="150" width="294" height="40" rx="4"/><text class="sub" x="493.0" y="170.0" text-anchor="middle" dominant-baseline="central">rebuilt on the fly when needed</text></g><text class="cap" x="40" y="240" text-anchor="start">Store the small thing, keep the recipe for turning it back, and pay a little arithmetic each</text><text class="cap" x="40" y="260" text-anchor="start">time instead of a great deal of memory all the time.</text><text class="cap" x="40" y="296" text-anchor="start">On this chip that is a good trade, for the same reason recomputation was: arithmetic is cheap</text><text class="cap" x="40" y="316" text-anchor="start">and bandwidth is not.</text><text class="cap" x="40" y="352" text-anchor="start">It is also a change to the model itself rather than to the kernel. The model has to be trained</text><text class="cap" x="40" y="372" text-anchor="start">with this structure; it cannot be applied to an existing one afterwards.</text></svg><figcaption>The last line is the important distinction. Everything before this part was a better way to run an unchanged model; this is a different model.</figcaption></figure>
