<figure><div class='ts'>Fig 10 &nbsp;&middot;&nbsp; 3:49</div><h3>What a working set is</h3><svg viewBox='0 0 680 448' role='img'><title>What a working set is</title><text class="hd" x="40" y="46">A working set is what must be reachable at once</text><g class="s"><rect x="40" y="74" width="600" height="128" rx="14"/><text class="lbl" x="62" y="100">in fast memory, right now</text></g><g class="m"><rect x="66" y="130" width="130" height="46" rx="4"/><text class="sub" x="131.0" y="153.0" text-anchor="middle" dominant-baseline="central">a piece of Q</text></g><g class="m"><rect x="210" y="130" width="130" height="46" rx="4"/><text class="sub" x="275.0" y="153.0" text-anchor="middle" dominant-baseline="central">a piece of K</text></g><g class="m"><rect x="354" y="130" width="130" height="46" rx="4"/><text class="sub" x="419.0" y="153.0" text-anchor="middle" dominant-baseline="central">a piece of V</text></g><g class="s"><rect x="498" y="130" width="116" height="46" rx="4"/><text class="sub" x="556.0" y="153.0" text-anchor="middle" dominant-baseline="central">the total</text></g><rect x="40" y="224" width="600" height="40" rx="6" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="340.0" y="244.0" text-anchor="middle" dominant-baseline="central">everything else stays in the slow memory</text><text class="cap" x="40" y="314" text-anchor="start">Not everything the computation touches. Only what the current step needs simultaneously, because</text><text class="cap" x="40" y="334" text-anchor="start">that is what has to fit.</text><text class="cap" x="40" y="370" text-anchor="start">Choosing a block size is exactly the act of making this list fit inside 228 kilobytes, and it</text><text class="cap" x="40" y="390" text-anchor="start">is the one decision the whole algorithm turns on.</text><text class="cap" x="40" y="426" text-anchor="start">Too large and it spills. Too small and the same data is fetched again and again.</text></svg><figcaption>The quantity every tiling decision is measured against. It is not the size of the problem; it is the size of the moment.</figcaption></figure>
