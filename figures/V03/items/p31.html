<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 28:52</div><h3>The compiler's speed sets the pace of every experiment</h3><svg viewBox='0 0 680 484' role='img'><title>The compiler's speed sets the pace of every experiment</title><text class="hd" x="40" y="46">Seconds to compile one kernel (bars to scale)</text><text class="cap" x="40" y="80" text-anchor="start">forward kernel</text><text class="sub2" x="60" y="106" text-anchor="start">C++ templates (v3)</text><g class="h"><rect x="190" y="90" width="440.0" height="22" rx="3"/><text class="sub" x="410.0" y="101.0" text-anchor="middle" dominant-baseline="central">55 s</text></g><text class="sub2" x="60" y="134" text-anchor="start">CuTe DSL (v4)</text><g class="s"><rect x="190" y="118" width="20.0" height="22" rx="3"/></g><text class="sub2" x="218.0" y="133.0" text-anchor="start">2.5 s</text><text class="cap" x="40" y="176" text-anchor="start">backward kernel</text><text class="sub2" x="60" y="202" text-anchor="start">C++ templates (v3)</text><g class="h"><rect x="190" y="186" width="360.0" height="22" rx="3"/><text class="sub" x="370.0" y="197.0" text-anchor="middle" dominant-baseline="central">45 s</text></g><text class="sub2" x="60" y="230" text-anchor="start">CuTe DSL (v4)</text><g class="s"><rect x="190" y="214" width="11.2" height="22" rx="3"/></g><text class="sub2" x="209.2" y="229.0" text-anchor="start">1.4 s</text><text class="cap" x="40" y="274" text-anchor="start">Version 4 is written entirely in CuTe DSL, NVIDIA's language for kernels embedded in</text><text class="cap" x="40" y="294" text-anchor="start">Python, where earlier versions were C++ templates. It gives up no reach: it lowers to</text><text class="cap" x="40" y="314" text-anchor="start">PTX, the same intermediate code C++ kernels compile to, and lets hand-written PTX</text><text class="cap" x="40" y="334" text-anchor="start">through where needed. But a kernel compiles in seconds: 22 times faster for the forward</text><text class="cap" x="40" y="354" text-anchor="start">kernel, 32 times for the backward.</text><text class="cap" x="40" y="394" text-anchor="start">A kernel at this level is tuned by changing something, rebuilding and measuring,</text><text class="cap" x="40" y="414" text-anchor="start">hundreds of times over. 200 rebuilds of the forward kernel cost 3.1 hours of compiling</text><text class="cap" x="40" y="434" text-anchor="start">at 55 seconds each and 8 minutes at 2.5. The speed of the compiler becomes the speed of</text><text class="cap" x="40" y="454" text-anchor="start">every experiment.</text></svg><figcaption>Compile times from the version 4 paper's Table 4, one kernel each; the 200 rebuilds are illustrative. Versions 2 and 3 also precompile hundreds of kernels, one per attention variant.</figcaption></figure>
