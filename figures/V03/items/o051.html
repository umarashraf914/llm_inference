<figure><div class='ts'>Fig 51 &nbsp;&middot;&nbsp; 11:13</div><h3>The traffic tally at 200 tokens</h3><svg viewBox="0 0 680 370" role="img"><title>Step 8 — the traffic tally at 200 tokens</title><text class="cap" x="40" y="78" text-anchor="start">Model weights</text><g class="h"><rect x="250" y="62" width="370" height="32" rx="3"></rect><text class="sub" x="435.0" y="78.0" text-anchor="middle" dominant-baseline="central">16 GB</text></g><text class="cap" x="40" y="138" text-anchor="start">KV cache written</text><g class="s"><rect x="250" y="122" width="4" height="32" rx="1"></rect></g><text class="sub2" x="264" y="141" text-anchor="start">26 MB</text><text class="cap" x="40" y="198" text-anchor="start">Score matrices, naive</text><g class="m"><rect x="250" y="182" width="8" height="32" rx="1"></rect></g><text class="sub2" x="268" y="201" text-anchor="start">0.3 GB</text><text class="cap" x="40" y="258" text-anchor="start">Score matrices, tiled</text><g class="s"><rect x="250" y="242" width="3" height="32" rx="1"></rect></g><text class="sub2" x="264" y="261" text-anchor="start">zero: S never leaves the chip</text><text class="cap" x="40" y="320" text-anchor="start">At 200 tokens, attention traffic is 2% of the total. FlashAttention saves you 2%.</text><text class="cap" x="40" y="348" text-anchor="start">Not a criticism: the claim was always conditional, on long sequences.</text></svg><figcaption>The entire prefill is dominated by reading the model once: the memory wall of the first atlas ({{ref:v01-o105}}), not an attention problem.</figcaption></figure>
