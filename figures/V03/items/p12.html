<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:29</div><h3>Exact, up to the order of additions</h3><svg viewBox='0 0 680 630' role='img'><title>Exact, up to the order of additions</title><text class="hd" x="40" y="46">FP16 near 2,048: whole numbers below it, only even numbers from it on</text><line class="axis" x1="70.0" y1="110.0" x2="610.0" y2="110.0"/><line class="tick" x1="70.0" y1="104.0" x2="70.0" y2="116.0"/><text class="sub2" x="70.0" y="134" text-anchor="middle">2,044</text><line class="tick" x1="137.5" y1="104.0" x2="137.5" y2="116.0"/><text class="sub2" x="137.5" y="134" text-anchor="middle">2,045</text><line class="tick" x1="205.0" y1="104.0" x2="205.0" y2="116.0"/><text class="sub2" x="205.0" y="134" text-anchor="middle">2,046</text><line class="tick" x1="272.5" y1="104.0" x2="272.5" y2="116.0"/><text class="sub2" x="272.5" y="134" text-anchor="middle">2,047</text><line class="tick" x1="340.0" y1="104.0" x2="340.0" y2="116.0"/><text class="sub2" x="340.0" y="134" text-anchor="middle">2,048</text><line class="tick" x1="475.0" y1="104.0" x2="475.0" y2="116.0"/><text class="sub2" x="475.0" y="134" text-anchor="middle">2,050</text><line class="tick" x1="610.0" y1="104.0" x2="610.0" y2="116.0"/><text class="sub2" x="610.0" y="134" text-anchor="middle">2,052</text><circle cx="407.5" cy="110.0" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2" x="407.5" y="94" text-anchor="middle">2,049: no such FP16 number</text><g class="h"><rect x="40" y="162" width="150" height="28" rx="3"/><text class="sub" x="115.0" y="176.0" text-anchor="middle" dominant-baseline="central">(2,048 + 1) + 1</text></g><text class="sub2" x="204" y="181" text-anchor="start">2,048 + 1 rounds back to 2,048, twice</text><text class="sub2" x="640" y="181" text-anchor="end">= 2,048</text><g class="s"><rect x="40" y="200" width="150" height="28" rx="3"/><text class="sub" x="115.0" y="214.0" text-anchor="middle" dominant-baseline="central">2,048 + (1 + 1)</text></g><text class="sub2" x="204" y="219" text-anchor="start">1 + 1 = 2 first, then 2,048 + 2</text><text class="sub2" x="640" y="219" text-anchor="end">= 2,050</text><text class="hd" x="40" y="272">The tiled softmax against the direct one, in FP32</text><text class="sub2" x="40" y="300" text-anchor="start">200 rows of 4,096 random scores, tiles of 128: the answers differ in 160 rows,</text><text class="sub2" x="40" y="320" text-anchor="start">never by more than 2⁻²⁴ = 6.0 × 10⁻⁸, the spacing of FP32 numbers between 0.5 and 1</text><text class="cap" x="40" y="360" text-anchor="start">Floating point rounds after every operation, so the order in which numbers are added can</text><text class="cap" x="40" y="380" text-anchor="start">change the last bits of the answer. In FP16 the numbers from 2,048 to 4,096 are spaced 2</text><text class="cap" x="40" y="400" text-anchor="start">apart, so adding 1 to 2,048 lands exactly between two of them and rounds back down;</text><text class="cap" x="40" y="420" text-anchor="start">adding the two 1s first gives 2, which fits.</text><text class="cap" x="40" y="460" text-anchor="start">A tiled kernel adds the same terms as the three-kernel one, in a different order: tile</text><text class="cap" x="40" y="480" text-anchor="start">by tile, with the rescaling multiplications of Part 7 in between. So its output is the</text><text class="cap" x="40" y="500" text-anchor="start">same function, identical up to the order of floating-point sums, not identical bit for</text><text class="cap" x="40" y="520" text-anchor="start">bit.</text><text class="cap" x="40" y="560" text-anchor="start">Against a high-precision reference the tiled answers are, if anything, closer:</text><text class="cap" x="40" y="580" text-anchor="start">FlashAttention 3 measured an error of 1.9 × 10⁻⁴ in FP16 against 3.2 × 10⁻⁴ for the</text><text class="cap" x="40" y="600" text-anchor="start">standard implementation, because its softmax runs in FP32.</text></svg><figcaption>Exact in the mathematician's sense, not bit for bit. Any two correct ways of adding a long list differ like this, which is why nobody retrains a model to switch kernels.</figcaption></figure>
