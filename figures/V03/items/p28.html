<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 27:26</div><h3>Skipping the rescale gives the same answer</h3><svg viewBox='0 0 680 582' role='img'><title>Skipping the rescale gives the same answer</title><text class="hd" x="40" y="46">The worked row's second tile, scores 5, 4 and 1, taken two ways</text><text class="sub2" x="400" y="80" text-anchor="end">every rise rescales (versions 1–3)</text><text class="sub2" x="640" y="80" text-anchor="end">rescale only past 8 doublings (version 4)</text><text class="cap" x="40" y="106" text-anchor="start">after tile 1: maximum, sum, output</text><text class="sub2" x="400" y="106" text-anchor="end">3,  1.591,  24.05</text><text class="sub2" x="640" y="106" text-anchor="end">the same</text><text class="cap" x="40" y="132" text-anchor="start">tile 2's maximum is 5: keep which?</text><text class="sub2" x="400" y="132" text-anchor="end">move to 5</text><text class="sub2" x="640" y="132" text-anchor="end">keep 3: a rise of 2.9 doublings</text><text class="cap" x="40" y="158" text-anchor="start">old sum and output multiplied by</text><text class="sub2" x="400" y="158" text-anchor="end">e⁻² = 0.1353</text><text class="sub2" x="640" y="158" text-anchor="end">nothing</text><text class="cap" x="40" y="184" text-anchor="start">tile 2's terms</text><text class="sub2" x="400" y="184" text-anchor="end">1.000, 0.368, 0.018</text><text class="sub2" x="640" y="184" text-anchor="end">7.389, 2.718, 0.135</text><text class="cap" x="40" y="210" text-anchor="start">sum l</text><text class="sub2" x="400" y="210" text-anchor="end">1.6015</text><text class="sub2" x="640" y="210" text-anchor="end">11.83</text><text class="cap" x="40" y="236" text-anchor="start">output O</text><text class="sub2" x="400" y="236" text-anchor="end">62.75</text><text class="sub2" x="640" y="236" text-anchor="end">463.6</text><text class="cap" x="40" y="262" text-anchor="start">answer O ÷ l</text><text class="sub2" x="400" y="262" text-anchor="end">39.18</text><text class="sub2" x="640" y="262" text-anchor="end">39.18</text><text class="cap" x="40" y="312" text-anchor="start">Version 4 computes in powers of two, so its threshold τ = 8 counts doublings: the</text><text class="cap" x="40" y="332" text-anchor="start">running maximum may fall behind the true one by up to a factor of 2⁸ = 256 before a</text><text class="cap" x="40" y="352" text-anchor="start">rescale fires. In the worked row the maximum rises from 3 to 5, a factor of e² = 7.39,</text><text class="cap" x="40" y="372" text-anchor="start">under 3 doublings. So version 4 keeps 3, multiplies nothing, and takes tile 2's terms</text><text class="cap" x="40" y="392" text-anchor="start">against the stale 3: e², e¹ and e⁻², larger than 1 but nowhere near 256.</text><text class="cap" x="40" y="432" text-anchor="start">Its sum and output both come out 7.39 times larger than in the left column, the same</text><text class="cap" x="40" y="452" text-anchor="start">factor in each, and the final division cancels it: 39.18 either way. Nothing can</text><text class="cap" x="40" y="472" text-anchor="start">overflow, because no term exceeds 256 and an FP32 sum can hold numbers up to 3.4 × 10³⁸.</text><text class="cap" x="40" y="512" text-anchor="start">The paper says only that the skipped rescales save significant work. The figure of about</text><text class="cap" x="40" y="532" text-anchor="start">ten times fewer rescales comes from Tri Dao's Hot Chips talk rather than from the paper.</text><text class="cap" x="40" y="552" text-anchor="start">The widget in {{fig:v03-p16}} has this rule as a checkbox.</text></svg><figcaption>The online softmax only ever needed the maximum to be close enough to keep the terms in range, not to be the true one. The true one is applied once, in the final division.</figcaption></figure>
