<figure><div class='ts'>Fig 77 &nbsp;&middot;&nbsp; 24:57</div><h3>Asymmetric hardware scaling</h3><svg viewBox="0 0 680 336" role="img"><title>Asymmetric hardware scaling</title><text class="cap" x="40" y="75" text-anchor="start">BF16 tensor cores</text><g class="u"><rect x="230" y="55" width="140" height="14" rx="2"></rect></g><g class="s"><rect x="230" y="73" width="315" height="14" rx="2"></rect></g><text class="sub2" x="555" y="75" text-anchor="start">1 -&gt; 2.25 POPS</text><text class="cap" x="40" y="131" text-anchor="start">Exponential unit</text><g class="u"><rect x="230" y="111" width="140" height="14" rx="2"></rect></g><g class="u"><rect x="230" y="129" width="140" height="14" rx="2"></rect></g><text class="sub2" x="380" y="131" text-anchor="start">unchanged</text><text class="cap" x="40" y="187" text-anchor="start">Shared memory bandwidth</text><g class="u"><rect x="230" y="167" width="140" height="14" rx="2"></rect></g><g class="u"><rect x="230" y="185" width="140" height="14" rx="2"></rect></g><text class="sub2" x="380" y="187" text-anchor="start">unchanged</text><text class="cap" x="40" y="244" text-anchor="start">Upper bar H100, lower bar B200.</text><text class="cap" x="40" y="274" text-anchor="start">When one unit gets 2.25 times faster and the units feeding it do not, the bottleneck moves</text><text class="cap" x="40" y="294" text-anchor="start">rather than disappearing. On Blackwell the forward pass becomes limited by the exponentials</text><text class="cap" x="40" y="314" text-anchor="start">and the backward pass by shared-memory bandwidth.</text></svg><figcaption>Raising tensor-core utilisation stops being the lever. That change of target is what version 4 had to answer.</figcaption></figure>
