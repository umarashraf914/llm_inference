<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 25:05</div><h3>Asymmetric hardware scaling</h3><svg viewBox='0 0 680 658' role='img'><title>Asymmetric hardware scaling</title><text class="hd" x="40" y="46">Per clock, per multiprocessor: H100 against B200 (each pair to its own scale)</text><text class="cap" x="40" y="74" text-anchor="start">tensor cores: BF16 operations</text><text class="sub2" x="60" y="101" text-anchor="start">H100</text><g class="u"><rect x="120" y="84" width="150.0" height="24" rx="3"/><text class="sub" x="195.0" y="96.0" text-anchor="middle" dominant-baseline="central">4,096 per clock</text></g><text class="sub2" x="60" y="131" text-anchor="start">B200</text><g class="s"><rect x="120" y="114" width="300.0" height="24" rx="3"/><text class="sub" x="270.0" y="126.0" text-anchor="middle" dominant-baseline="central">8,192 per clock</text></g><text class="sub2" x="640" y="131" text-anchor="end">doubled</text><text class="cap" x="40" y="170" text-anchor="start">multi-function unit: exponentials</text><text class="sub2" x="60" y="197" text-anchor="start">H100</text><g class="u"><rect x="120" y="180" width="150.0" height="24" rx="3"/><text class="sub" x="195.0" y="192.0" text-anchor="middle" dominant-baseline="central">16 per clock</text></g><text class="sub2" x="60" y="227" text-anchor="start">B200</text><g class="h"><rect x="120" y="210" width="150.0" height="24" rx="3"/><text class="sub" x="195.0" y="222.0" text-anchor="middle" dominant-baseline="central">16 per clock</text></g><text class="sub2" x="640" y="227" text-anchor="end">unchanged</text><text class="cap" x="40" y="266" text-anchor="start">shared memory: bytes read</text><text class="sub2" x="60" y="293" text-anchor="start">H100</text><g class="u"><rect x="120" y="276" width="150.0" height="24" rx="3"/><text class="sub" x="195.0" y="288.0" text-anchor="middle" dominant-baseline="central">128 per clock</text></g><text class="sub2" x="60" y="323" text-anchor="start">B200</text><g class="h"><rect x="120" y="306" width="150.0" height="24" rx="3"/><text class="sub" x="195.0" y="318.0" text-anchor="middle" dominant-baseline="central">128 per clock</text></g><text class="sub2" x="640" y="323" text-anchor="end">unchanged</text><text class="cap" x="40" y="368" text-anchor="start">From the H100 to the B200 the tensor cores' throughput in BF16, the 16-bit format that</text><text class="cap" x="40" y="388" text-anchor="start">keeps FP32's range with fewer fraction bits ({{fig:v02-o088}}), rises from about 1</text><text class="cap" x="40" y="408" text-anchor="start">quadrillion operations a second to 2.25 quadrillion. Per multiprocessor per clock they</text><text class="cap" x="40" y="428" text-anchor="start">exactly double, 4,096 to 8,192; more multiprocessors supply most of the rest. The</text><text class="cap" x="40" y="448" text-anchor="start">multi-function unit that computes exponentials does not grow at all, and neither does</text><text class="cap" x="40" y="468" text-anchor="start">the rate at which a multiprocessor reads its own shared memory.</text><text class="cap" x="40" y="508" text-anchor="start">When one unit gets faster and its neighbours do not, the bottleneck moves rather than</text><text class="cap" x="40" y="528" text-anchor="start">disappearing. On the B200 the forward pass becomes limited by the exponentials and the</text><text class="cap" x="40" y="548" text-anchor="start">backward pass by shared-memory reads, which in the version 4 paper's own estimate now</text><text class="cap" x="40" y="568" text-anchor="start">exceed the matrix-multiply time by 25 to 60% for typical attention shapes.</text><text class="cap" x="40" y="608" text-anchor="start">A kernel balanced for the H100 is unbalanced on the B200 without a line of it changing.</text><text class="cap" x="40" y="628" text-anchor="start">That is why each generation of this hardware has needed its own version of the kernel.</text></svg><figcaption>Tri Dao's group calls this asymmetric hardware scaling, and it changes the job: raising tensor-core utilisation stops being the lever. Per-clock rates from the version 4 paper.</figcaption></figure>
