<figure><div class='ts'>Fig 60 &nbsp;&middot;&nbsp; 14:50</div><h3>What a backward pass is</h3><svg viewBox='0 0 680 348' role='img'><title>What a backward pass is</title><text class="hd" x="40" y="46">Training runs the model twice per step</text><g class="s"><rect x="40" y="76" width="285" height="40" rx="4"/><text class="sub" x="182.5" y="96.0" text-anchor="middle" dominant-baseline="central">forward: compute the answer</text></g><line class="conn" x1="331" y1="96" x2="351" y2="96" marker-end="url(#arw)"/><g class="m"><rect x="357" y="76" width="283" height="40" rx="4"/><text class="sub" x="498.5" y="96.0" text-anchor="middle" dominant-baseline="central">backward: compute how to improve</text></g><text class="cap" x="40" y="158" text-anchor="start">The backward pass needs values the forward pass produced, because working out how to adjust a</text><text class="cap" x="40" y="178" text-anchor="start">weight requires knowing what flowed through it.</text><text class="cap" x="40" y="214" text-anchor="start">So the forward pass either keeps those intermediates, or the backward pass rebuilds them.</text><text class="cap" x="40" y="250" text-anchor="start">Keeping the n-squared score matrix for the backward pass would undo everything tiling</text><text class="cap" x="40" y="270" text-anchor="start">achieved, which is why the choice matters here specifically.</text><text class="cap" x="40" y="306" text-anchor="start">Inference never runs a backward pass. This part is about training, and is included because</text><text class="cap" x="40" y="326" text-anchor="start">the technique it describes is what made the method usable at all.</text></svg><figcaption>Two runs per training step, and the second one wants what the first one saw. Nothing in inference does this, which is why the next figure is a training-only concern.</figcaption></figure>
