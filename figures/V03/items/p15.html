end</text><text class="sub2" x="186" y="280" text-anchor="start">all six scores at once, the direct way: 39.18</text><text class="cap" x="40" y="318" text-anchor="start">The running output was built from the same stale exponentials, so it is off by the same</text><text class="cap" x="40" y="338" text-anchor="start">factor, and the same multiplication repairs it. Then each sum takes tile 2's own terms,</text><text class="cap" x="40" y="358" text-anchor="start">and the row is done.</text><text class="cap" x="40" y="398" text-anchor="start">Only now is anything divided: the answer is O ÷ l = 39.18, the weighted average of the</text><text class="cap" x="40" y="418" text-anchor="start">six values. Computed directly, with all six scores at once, it is the same number. The</text><text class="cap" x="40" y="438" text-anchor="start">division happens once per row, at the very end.</text></svg><figcaption>Denominator and output stay in step because they are rescaled by the same number at the same moment. Their ratio was never wrong; only their common scale was.</figcaption></figure>
