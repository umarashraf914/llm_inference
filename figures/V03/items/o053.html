<figure><div class='ts'>Fig 53 &nbsp;&middot;&nbsp; 11:31</div><h3>The obstacle</h3><svg viewBox="0 0 680 254" role="img"><title>The obstacle</title><g class="h"><rect x="50" y="55" width="265" height="76" rx="8"></rect><text class="lbl" x="182.5" y="76.0" text-anchor="middle" dominant-baseline="central">Softmax needs</text><text class="sub" x="182.5" y="94.0" text-anchor="middle" dominant-baseline="central">the maximum of the whole row,</text><text class="sub" x="182.5" y="111.0" text-anchor="middle" dominant-baseline="central">before any exponential</text></g><g class="u"><rect x="365" y="55" width="265" height="76" rx="8"></rect><text class="lbl" x="497.5" y="76.0" text-anchor="middle" dominant-baseline="central">Tiling supplies</text><text class="sub" x="497.5" y="94.0" text-anchor="middle" dominant-baseline="central">one tile at a time,</text><text class="sub" x="497.5" y="111.0" text-anchor="middle" dominant-baseline="central">never a whole row</text></g><text class="cap" x="40" y="176" text-anchor="start">A later tile can always contain a larger score than anything seen so far, and that would</text><text class="cap" x="40" y="196" text-anchor="start">change the normalisation of every term already processed.</text><text class="cap" x="40" y="226" text-anchor="start">So the naive fix is to make two passes over the row, which reintroduces exactly the traffic</text><text class="cap" x="40" y="246" text-anchor="start">tiling was meant to remove.</text></svg><figcaption>This is a real conflict, not a detail. Without a resolution, tiled attention would not be possible.</figcaption></figure>
