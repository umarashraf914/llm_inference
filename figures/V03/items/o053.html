back the traffic tiling removed</text><g class="h"><rect x="40" y="254" width="250" height="30" rx="3"/><text class="sub" x="165.0" y="269.0" text-anchor="middle" dominant-baseline="central">trust the tiles seen so far</text></g><text class="sub2" x="306" y="274" text-anchor="start">wrong as soon as a later tile beats the maximum</text><g class="s"><rect x="40" y="294" width="250" height="30" rx="3"/><text class="sub" x="165.0" y="309.0" text-anchor="middle" dominant-baseline="central">be provisionally right, repair later</text></g><text class="sub2" x="306" y="314" text-anchor="start">online softmax: one multiplication per tile</text><text class="cap" x="40" y="364" text-anchor="start">Softmax divides every exponential by the row's sum and subtracts the row's maximum first</text><text class="cap" x="40" y="384" text-anchor="start">({{fig:v03-p07}}). Both are row-wide: they depend on every score in the row. A tile only</text><text class="cap" x="40" y="404" text-anchor="start">ever sees a slice of it, so as softmax is normally written, nothing in the row can be</text><text class="cap" x="40" y="424" text-anchor="start">finished until the whole row exists.</text><text class="cap" x="40" y="464" text-anchor="start">The first three ways out all fail: waiting holds the quadratic object, two passes bring</text><text class="cap" x="40" y="484" text-anchor="start">the traffic back, and trusting the tiles seen so far gives wrong answers when a later</text><text class="cap" x="40" y="504" text-anchor="start">tile holds a larger score. The fourth works, and the rest of this part shows why it</text><text class="cap" x="40" y="524" text-anchor="start">costs almost nothing.</text></svg><figcaption>A real conflict, not a detail. Without the fourth row, tiled attention would not be possible; the fix was published in 2018 by Milakov and Gimelshein at NVIDIA, four years before FlashAttention.</figcaption></figure>
