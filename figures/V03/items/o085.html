<figure><div class='ts'>Fig 85 &nbsp;&middot;&nbsp; 32:20</div><h3>What virtual memory is</h3><svg viewBox='0 0 680 418' role='img'><title>What virtual memory is</title><text class="hd" x="40" y="46">The idea an operating system uses for exactly this</text><text class="cap" x="40" y="92" text-anchor="start">What the program sees</text><g class="s"><rect x="280" y="76" width="340" height="30" rx="3"/><text class="sub" x="450.0" y="91.0" text-anchor="middle" dominant-baseline="central">one continuous run</text></g><line class="conn" x1="450" y1="118" x2="450" y2="140" marker-end="url(#arw)"/><text class="cap" x="40" y="168" text-anchor="start">Where it actually is</text><g class="m"><rect x="280" y="152" width="60" height="30" rx="3"/></g><g class="m"><rect x="356" y="152" width="60" height="30" rx="3"/></g><g class="m"><rect x="432" y="152" width="60" height="30" rx="3"/></g><g class="m"><rect x="508" y="152" width="60" height="30" rx="3"/></g><g class="m"><rect x="584" y="152" width="60" height="30" rx="3"/></g><text class="sub2" x="280" y="214" text-anchor="start">scattered blocks, in any order</text><text class="cap" x="40" y="264" text-anchor="start">A table maps each position the program thinks it is using to wherever that block really sits.</text><text class="cap" x="40" y="284" text-anchor="start">The program never learns the difference.</text><text class="cap" x="40" y="320" text-anchor="start">Every operating system does this, and has for decades, because it solves fragmentation</text><text class="cap" x="40" y="340" text-anchor="start">completely: any free block will do, since blocks need no longer be adjacent.</text><text class="cap" x="40" y="376" text-anchor="start">Applying it to the key-value cache is the whole of paged attention. The kernel is handed a</text><text class="cap" x="40" y="396" text-anchor="start">table and reads through it.</text></svg><figcaption>Every operating system does this for every program it runs. Paged attention only had to notice that the KV cache had the same problem.</figcaption></figure>
