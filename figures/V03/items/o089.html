<figure><div class='ts'>Fig 89 &nbsp;&middot;&nbsp; 34:30</div><h3>Multi-head, grouped-query, multi-query</h3><svg viewBox="0 0 680 504" role="img"><title>Multi-head, grouped-query, multi-query</title><text class="hd" x="40" y="46">Multi-head: every query head has its own K and V</text><g class="m"><rect x="60" y="64" width="120" height="32" rx="3"></rect><text class="sub" x="120.0" y="80.0" text-anchor="middle" dominant-baseline="central">Q0</text></g><g class="m"><rect x="200" y="64" width="120" height="32" rx="3"></rect><text class="sub" x="260.0" y="80.0" text-anchor="middle" dominant-baseline="central">Q1</text></g><g class="m"><rect x="340" y="64" width="120" height="32" rx="3"></rect><text class="sub" x="400.0" y="80.0" text-anchor="middle" dominant-baseline="central">Q2</text></g><g class="m"><rect x="480" y="64" width="120" height="32" rx="3"></rect><text class="sub" x="540.0" y="80.0" text-anchor="middle" dominant-baseline="central">Q3</text></g><g class="s"><rect x="60" y="104" width="120" height="32" rx="3"></rect><text class="sub" x="120.0" y="120.0" text-anchor="middle" dominant-baseline="central">KV0</text></g><g class="s"><rect x="200" y="104" width="120" height="32" rx="3"></rect><text class="sub" x="260.0" y="120.0" text-anchor="middle" dominant-baseline="central">KV1</text></g><g class="s"><rect x="340" y="104" width="120" height="32" rx="3"></rect><text class="sub" x="400.0" y="120.0" text-anchor="middle" dominant-baseline="central">KV2</text></g><g class="s"><rect x="480" y="104" width="120" height="32" rx="3"></rect><text class="sub" x="540.0" y="120.0" text-anchor="middle" dominant-baseline="central">KV3</text></g><text class="hd" x="40" y="162">Grouped-query: several query heads share one</text><g class="m"><rect x="60" y="180" width="120" height="32" rx="3"></rect><text class="sub" x="120.0" y="196.0" text-anchor="middle" dominant-baseline="central">Q0</text></g><g class="m"><rect x="200" y="180" width="120" height="32" rx="3"></rect><text class="sub" x="260.0" y="196.0" text-anchor="middle" dominant-baseline="central">Q1</text></g><g class="m"><rect x="340" y="180" width="120" height="32" rx="3"></rect><text class="sub" x="400.0" y="196.0" text-anchor="middle" dominant-baseline="central">Q2</text></g><g class="m"><rect x="480" y="180" width="120" height="32" rx="3"></rect><text class="sub" x="540.0" y="196.0" text-anchor="middle" dominant-baseline="central">Q3</text></g><g class="s"><rect x="60" y="220" width="260" height="32" rx="3"></rect><text class="sub" x="190.0" y="236.0" text-anchor="middle" dominant-baseline="central">KV0</text></g><g class="s"><rect x="340" y="220" width="260" height="32" rx="3"></rect><text class="sub" x="470.0" y="236.0" text-anchor="middle" dominant-baseline="central">KV1</text></g><text class="hd" x="40" y="278">Multi-query: all of them share one</text><g class="m"><rect x="60" y="296" width="120" height="32" rx="3"></rect><text class="sub" x="120.0" y="312.0" text-anchor="middle" dominant-baseline="central">Q0</text></g><g class="m"><rect x="200" y="296" width="120" height="32" rx="3"></rect><text class="sub" x="260.0" y="312.0" text-anchor="middle" dominant-baseline="central">Q1</text></g><g class="m"><rect x="340" y="296" width="120" height="32" rx="3"></rect><text class="sub" x="400.0" y="312.0" text-anchor="middle" dominant-baseline="central">Q2</text></g><g class="m"><rect x="480" y="296" width="120" height="32" rx="3"></rect><text class="sub" x="540.0" y="312.0" text-anchor="middle" dominant-baseline="central">Q3</text></g><g class="s"><rect x="60" y="336" width="540" height="32" rx="3"></rect><text class="sub" x="330.0" y="352.0" text-anchor="middle" dominant-baseline="central">KV</text></g><text class="cap" x="40" y="412" text-anchor="start">The cache stores one key and value per KV head, not per query head. Cutting KV heads by eight</text><text class="cap" x="40" y="432" text-anchor="start">cuts the cache by eight, and the queries are unaffected.</text><text class="cap" x="40" y="462" text-anchor="start">Multi-query goes furthest and measurably costs accuracy. Grouping is the compromise, and an</text><text class="cap" x="40" y="482" text-anchor="start">existing model can be converted with roughly 5 percent of its original training compute.</text></svg><figcaption>One dial with three settings. The cache formula makes the saving exact: it is linear in the number of KV heads.</figcaption></figure>
