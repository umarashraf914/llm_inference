<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 35:31</div><h3>Multi-head, grouped-query, multi-query</h3><svg viewBox='0 0 680 694' role='img'><title>Multi-head, grouped-query, multi-query</title><text class="hd" x="40" y="46">Multi-head: every query head has its own key and value head</text><g class="m"><rect x="40" y="60" width="140" height="26" rx="3"/><text class="sub" x="110.0" y="73.0" text-anchor="middle" dominant-baseline="central">Q0</text></g><g class="m"><rect x="192" y="60" width="140" height="26" rx="3"/><text class="sub" x="262.0" y="73.0" text-anchor="middle" dominant-baseline="central">Q1</text></g><g class="m"><rect x="344" y="60" width="140" height="26" rx="3"/><text class="sub" x="414.0" y="73.0" text-anchor="middle" dominant-baseline="central">Q2</text></g><g class="m"><rect x="496" y="60" width="140" height="26" rx="3"/><text class="sub" x="566.0" y="73.0" text-anchor="middle" dominant-baseline="central">Q3</text></g><g class="s"><rect x="40" y="92" width="140" height="26" rx="3"/><text class="sub" x="110.0" y="105.0" text-anchor="middle" dominant-baseline="central">KV0</text></g><g class="s"><rect x="192" y="92" width="140" height="26" rx="3"/><text class="sub" x="262.0" y="105.0" text-anchor="middle" dominant-baseline="central">KV1</text></g><g class="s"><rect x="344" y="92" width="140" height="26" rx="3"/><text class="sub" x="414.0" y="105.0" text-anchor="middle" dominant-baseline="central">KV2</text></g><g class="s"><rect x="496" y="92" width="140" height="26" rx="3"/><text class="sub" x="566.0" y="105.0" text-anchor="middle" dominant-baseline="central">KV3</text></g><text class="hd" x="40" y="162">Grouped-query: each group of query heads shares one</text><g class="m"><rect x="40" y="176" width="140" height="26" rx="3"/><text class="sub" x="110.0" y="189.0" text-anchor="middle" dominant-baseline="central">Q0</text></g><g class="m"><rect x="192" y="176" width="140" height="26" rx="3"/><text class="sub" x="262.0" y="189.0" text-anchor="middle" dominant-baseline="central">Q1</text></g><g class="m"><rect x="344" y="176" width="140" height="26" rx="3"/><text class="sub" x="414.0" y="189.0" text-anchor="middle" dominant-baseline="central">Q2</text></g><g class="m"><rect x="496" y="176" width="140" height="26" rx="3"/><text class="sub" x="566.0" y="189.0" text-anchor="middle" dominant-baseline="central">Q3</text></g><g class="s"><rect x="40" y="208" width="292" height="26" rx="3"/><text class="sub" x="186.0" y="221.0" text-anchor="middle" dominant-baseline="central">KV0</text></g><g class="s"><rect x="344" y="208" width="292" height="26" rx="3"/><text class="sub" x="490.0" y="221.0" text-anchor="middle" dominant-baseline="central">KV1</text></g><text class="hd" x="40" y="278">Multi-query: all of them share one</text><g class="m"><rect x="40" y="292" width="140" height="26" rx="3"/><text class="sub" x="110.0" y="305.0" text-anchor="middle" dominant-baseline="central">Q0</text></g><g class="m"><rect x="192" y="292" width="140" height="26" rx="3"/><text class="sub" x="262.0" y="305.0" text-anchor="middle" dominant-baseline="central">Q1</text></g><g class="m"><rect x="344" y="292" width="140" height="26" rx="3"/><text class="sub" x="414.0" y="305.0" text-anchor="middle" dominant-baseline="central">Q2</text></g><g class="m"><rect x="496" y="292" width="140" height="26" rx="3"/><text class="sub" x="566.0" y="305.0" text-anchor="middle" dominant-baseline="central">Q3</text></g><g class="s"><rect x="40" y="324" width="596" height="26" rx="3"/><text class="sub" x="338.0" y="337.0" text-anchor="middle" dominant-baseline="central">KV</text></g><text class="cap" x="40" y="384" text-anchor="start">Shazeer's proposal, multi-query attention: keep all the query heads, but let them share</text><text class="cap" x="40" y="404" text-anchor="start">one key head and one value head. The head count in the cache formula drops to one, so</text><text class="cap" x="40" y="424" text-anchor="start">the cache, and the bandwidth bill with it, shrinks by the full head count. PaLM, among</text><text class="cap" x="40" y="444" text-anchor="start">others, shipped it.</text><text class="cap" x="40" y="484" text-anchor="start">The price is quality. Query heads trained to ask different kinds of questions now all</text><text class="cap" x="40" y="504" text-anchor="start">consult the same single description of each token, and accuracy measurably drops; the</text><text class="cap" x="40" y="524" text-anchor="start">grouped-query paper also reports training instability.</text><text class="cap" x="40" y="564" text-anchor="start">Grouped-query attention, from 2023, turns that all-or-nothing choice into a dial: split</text><text class="cap" x="40" y="584" text-anchor="start">the query heads into groups and give each group its own key and value head. One group is</text><text class="cap" x="40" y="604" text-anchor="start">multi-query; one group per head is multi-head. Eight groups hold quality close to</text><text class="cap" x="40" y="624" text-anchor="start">multi-head at close to multi-query speed, and an existing multi-head model can be</text><text class="cap" x="40" y="644" text-anchor="start">converted for about 5% of its original pre-training compute, which the paper calls</text><text class="cap" x="40" y="664" text-anchor="start">uptraining.</text></svg><figcaption>One dial with three settings. The cache shrinks exactly in proportion to the KV heads removed; the quality cost is what has to be measured.</figcaption></figure>
