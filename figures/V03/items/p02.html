<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 1:03</div><h3>The mathematics fixes the answer; the kernel decides five things</h3><svg viewBox='0 0 680 546' role='img'><title>The mathematics fixes the answer; the kernel decides five things</title><text class="hd" x="40" y="46">The formula fixes the answer and nothing else</text><g class="u"><rect x="40" y="64" width="600" height="40" rx="8"/><text class="lbl" x="340.0" y="84.0" text-anchor="middle" dominant-baseline="central">softmax( Q Kᵀ ) V  — one output row per token, the same for every kernel</text></g><text class="sub2" x="40" y="134" text-anchor="start">the kernel decides</text><text class="sub2" x="262" y="134" text-anchor="start">for attention, the choice</text><text class="sub2" x="640" y="134" text-anchor="end">where</text><g class="m"><rect x="40" y="146" width="206" height="32" rx="3"/><text class="sub" x="143.0" y="162.0" text-anchor="middle" dominant-baseline="central">which threads do which work</text></g><text class="sub2" x="262" y="167" text-anchor="start">one block per head, or per block of query rows</text><text class="sub2" x="640" y="167" text-anchor="end">Part 9</text><g class="m"><rect x="40" y="190" width="206" height="32" rx="3"/><text class="sub" x="143.0" y="206.0" text-anchor="middle" dominant-baseline="central">which bytes, from which memory</text></g><text class="sub2" x="262" y="211" text-anchor="start">tiles on chip; the score matrix never in HBM</text><text class="sub2" x="640" y="211" text-anchor="end">Parts 5–6</text><g class="m"><rect x="40" y="234" width="206" height="32" rx="3"/><text class="sub" x="143.0" y="250.0" text-anchor="middle" dominant-baseline="central">in what order</text></g><text class="sub2" x="262" y="255" text-anchor="start">the loop order, and a softmax that runs as tiles arrive</text><text class="sub2" x="640" y="255" text-anchor="end">Parts 5, 7</text><g class="m"><rect x="40" y="278" width="206" height="32" rx="3"/><text class="sub" x="143.0" y="294.0" text-anchor="middle" dominant-baseline="central">at what precision</text></g><text class="sub2" x="262" y="299" text-anchor="start">16-bit or 8-bit numbers; exponentials by polynomial</text><text class="sub2" x="640" y="299" text-anchor="end">Parts 11–12</text><g class="m"><rect x="40" y="322" width="206" height="32" rx="3"/><text class="sub" x="143.0" y="338.0" text-anchor="middle" dominant-baseline="central">where each result is written</text></g><text class="sub2" x="262" y="343" text-anchor="start">the output stays on chip until it is finished</text><text class="sub2" x="640" y="343" text-anchor="end">Parts 5, 9</text><text class="cap" x="40" y="396" text-anchor="start">The formula says which numbers must come out. It does not say who computes which part,</text><text class="cap" x="40" y="416" text-anchor="start">where the inputs wait while they are used, in which order the additions happen, how many</text><text class="cap" x="40" y="436" text-anchor="start">bits each number gets, or where the results go.</text><text class="cap" x="40" y="476" text-anchor="start">Each of those is a choice about moving data, and two kernels can make them differently</text><text class="cap" x="40" y="496" text-anchor="start">while producing the same output. The whole difference in speed between them lives in</text><text class="cap" x="40" y="516" text-anchor="start">this table.</text></svg><figcaption>Read the rest of the atlas as answers to these five rows. None of them changes the formula; two of them change the rounding, which Part 17 settles.</figcaption></figure>
