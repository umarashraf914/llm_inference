<figure><div class='ts'>Fig 100 &nbsp;&middot;&nbsp; 47:43</div><h3>Everything that moved, and the one thing that did not</h3><svg viewBox="0 0 680 530" role="img"><title>Everything that moved, and the one thing that did not</title><g class="s"><rect x="40" y="50" width="600" height="62" rx="8"></rect><text class="lbl" x="340.0" y="72.0" text-anchor="middle" dominant-baseline="central">The function never changed</text><text class="sub" x="340.0" y="90.0" text-anchor="middle" dominant-baseline="central">same inputs, same outputs, same operations, from first kernel to last</text></g><g class="m"><rect x="40" y="136" width="560" height="30" rx="3"></rect><text class="sub" x="320.0" y="151.0" text-anchor="middle" dominant-baseline="central">tiling</text></g><g class="m"><rect x="40" y="176" width="480" height="30" rx="3"></rect><text class="sub" x="280.0" y="191.0" text-anchor="middle" dominant-baseline="central">recomputation</text></g><g class="m"><rect x="40" y="216" width="400" height="30" rx="3"></rect><text class="sub" x="240.0" y="231.0" text-anchor="middle" dominant-baseline="central">warp specialisation</text></g><g class="m"><rect x="40" y="256" width="320" height="30" rx="3"></rect><text class="sub" x="200.0" y="271.0" text-anchor="middle" dominant-baseline="central">paging</text></g><g class="m"><rect x="40" y="296" width="240" height="30" rx="3"></rect><text class="sub" x="160.0" y="311.0" text-anchor="middle" dominant-baseline="central">fewer KV heads</text></g><g class="m"><rect x="40" y="336" width="160" height="30" rx="3"></rect><text class="sub" x="120.0" y="351.0" text-anchor="middle" dominant-baseline="central">splitting the cache</text></g><g class="m"><rect x="40" y="376" width="80" height="30" rx="3"></rect><text class="sub" x="80.0" y="391.0" text-anchor="middle" dominant-baseline="central">graph replay</text></g><text class="cap" x="40" y="438" text-anchor="start">Seven different techniques, one target. Each one changes the route the bytes take, or how many</text><text class="cap" x="40" y="458" text-anchor="start">of them there are, and none of them changes the arithmetic.</text><text class="cap" x="40" y="488" text-anchor="start">That is what makes the whole family safe to deploy: a model quantized differently behaves</text><text class="cap" x="40" y="508" text-anchor="start">differently, but a model with a better kernel does not.</text></svg><figcaption>The organising idea of the entire video. Operations are fixed by the mathematics; bytes are a scheduling decision, and scheduling is where all the performance lives.</figcaption></figure>
