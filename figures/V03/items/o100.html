<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 48:08</div><h3>Everything that moved, and the one thing that did not</h3><svg viewBox='0 0 680 832' role='img'><title>Everything that moved, and the one thing that did not</title><text class="hd" x="40" y="46">What moved, sorted by whether the output can change</text><g class="s"><rect x="40" y="62" width="600" height="324" rx="14"/><text class="lbl" x="62" y="88">same function, up to rounding</text></g><text class="cap" x="62" y="114" text-anchor="start">tiling</text><text class="sub2" x="230" y="114" text-anchor="start">keeps the n × n scores out of HBM</text><text class="cap" x="62" y="148" text-anchor="start">online softmax</text><text class="sub2" x="230" y="148" text-anchor="start">two running numbers per row make tiling legal</text><text class="cap" x="62" y="182" text-anchor="start">recomputation</text><text class="sub2" x="230" y="182" text-anchor="start">13% more arithmetic, the same result</text><text class="cap" x="62" y="216" text-anchor="start">asynchrony</text><text class="sub2" x="230" y="216" text-anchor="start">copies and arithmetic overlap instead of taking turns</text><text class="cap" x="62" y="250" text-anchor="start">the polynomial</text><text class="sub2" x="230" y="250" text-anchor="start">exponentials on idle cores, within one BF16 step</text><text class="cap" x="62" y="284" text-anchor="start">paging</text><text class="sub2" x="230" y="284" text-anchor="start">moves the cache without touching the arithmetic</text><text class="cap" x="62" y="318" text-anchor="start">splitting the cache</text><text class="sub2" x="230" y="318" text-anchor="start">one token reads it with the whole chip</text><text class="cap" x="62" y="352" text-anchor="start">graph replay</text><text class="sub2" x="230" y="352" text-anchor="start">cuts the bookkeeping between kernels</text><g class="h"><rect x="40" y="408" width="600" height="154" rx="14"/><text class="lbl" x="62" y="434">a different model, or different numbers</text></g><text class="cap" x="62" y="460" text-anchor="start">grouped and multi-query heads</text><text class="sub2" x="290" y="460" text-anchor="start">fewer KV heads: a different model</text><text class="cap" x="62" y="494" text-anchor="start">latent compression, MLA</text><text class="sub2" x="290" y="494" text-anchor="start">stores a latent: a different model</text><text class="cap" x="62" y="528" text-anchor="start">FP8, and narrower still</text><text class="sub2" x="290" y="528" text-anchor="start">different numbers, error measured</text><text class="cap" x="40" y="602" text-anchor="start">Tiling kept the n × n score matrix out of HBM entirely; the online softmax made that</text><text class="cap" x="40" y="622" text-anchor="start">legal by carrying two running numbers per row; asynchrony let the copies and the</text><text class="cap" x="40" y="642" text-anchor="start">arithmetic overlap; and when the exponential unit saturated, a polynomial on the idle</text><text class="cap" x="40" y="662" text-anchor="start">multiply-add units routed the work around it. Beyond the kernel the pattern held: paging</text><text class="cap" x="40" y="682" text-anchor="start">moved the cache, splitting let one token read it in parallel, graph replay cut the</text><text class="cap" x="40" y="702" text-anchor="start">bookkeeping. None of those changed the model's output.</text><text class="cap" x="40" y="742" text-anchor="start">Grouping and latent compression were the exception: they shrank the cache by changing</text><text class="cap" x="40" y="762" text-anchor="start">the model itself, what attention stores in the first place. The tensor cores began</text><text class="cap" x="40" y="782" text-anchor="start">mostly idle, stalled on memory, and by version 4 run at nearly three quarters of peak</text><text class="cap" x="40" y="802" text-anchor="start">({{fig:v03-o081}}). Every point of that climb came from changing the route the bytes take.</text></svg><figcaption>Operations are fixed by the mathematics; bytes are a scheduling decision, and that decision is where the performance lives.</figcaption></figure>
