<figure><div class='ts'>Fig 40 &nbsp;&middot;&nbsp; 10:50</div><h3>SRAM is a window, not a destination</h3><svg viewBox="0 0 680 320" role="img"><title>Where do they go after leaving HBM?</title><text class="hd" x="40" y="46">HBM holds the whole thing</text><g class="h"><rect x="40" y="62" width="600" height="34" rx="4"></rect></g><line class="tick xok" x1="115" y1="62" x2="115" y2="96"></line><line class="tick xok" x1="190" y1="62" x2="190" y2="96"></line><line class="tick xok" x1="265" y1="62" x2="265" y2="96"></line><line class="tick xok" x1="340" y1="62" x2="340" y2="96"></line><line class="tick xok" x1="415" y1="62" x2="415" y2="96"></line><line class="tick xok" x1="490" y1="62" x2="490" y2="96"></line><line class="tick xok" x1="565" y1="62" x2="565" y2="96"></line><g class="m"><rect x="190" y="62" width="74" height="34" rx="4"></rect></g><text class="sub2" x="40" y="122" text-anchor="start">K, all 8,192 rows</text><line class="conn" x1="227" y1="104" x2="227" y2="140" marker-end="url(#arw)"></line><text class="hd" x="40" y="168">SRAM holds one block at a time</text><g class="m"><rect x="190" y="178" width="74" height="34" rx="4"></rect><text class="sub" x="227.0" y="195.0" text-anchor="middle" dominant-baseline="central">block</text></g><rect x="40" y="178" width="140" height="34" rx="4" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="110.0" y="195.0" text-anchor="middle" dominant-baseline="central">empty</text><rect x="274" y="178" width="366" height="34" rx="4" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="457.0" y="195.0" text-anchor="middle" dominant-baseline="central">empty</text><text class="cap" x="40" y="250" text-anchor="start">SRAM is a window, not a destination. A block arrives, is used, and is overwritten by the next.</text><text class="cap" x="40" y="270" text-anchor="start">The other seven eighths of K never move. Nothing is 'stored' in SRAM in any lasting sense.</text><text class="cap" x="40" y="298" text-anchor="start">This is the direct answer to your question: they do not all leave HBM. They take turns.</text></svg><figcaption>The premise to drop is that the matrices move to the chip as a unit. They stream through it.</figcaption></figure>
