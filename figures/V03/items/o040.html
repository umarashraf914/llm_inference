"/></g><g class="h"><rect x="506.0" y="186" width="6.875" height="22" rx="1"/></g><g class="h"><rect x="514.375" y="186" width="6.875" height="22" rx="1"/></g><g class="h"><rect x="522.75" y="186" width="6.875" height="22" rx="1"/></g><g class="h"><rect x="531.125" y="186" width="6.875" height="22" rx="1"/></g><g class="h"><rect x="539.5" y="186" width="6.875" height="22" rx="1"/></g><g class="h"><rect x="547.875" y="186" width="6.875" height="22" rx="1"/></g><g class="h"><rect x="556.25" y="186" width="6.875" height="22" rx="1"/></g><g class="h"><rect x="564.625" y="186" width="6.875" height="22" rx="1"/></g><g class="h"><rect x="573.0" y="186" width="6.875" height="22" rx="1"/></g><g class="h"><rect x="581.375" y="186" width="6.875" height="22" rx="1"/></g><g class="h"><rect x="589.75" y="186" width="6.875" height="22" rx="1"/></g><g class="h"><rect x="598.125" y="186" width="6.875" height="22" rx="1"/></g><g class="h"><rect x="606.5" y="186" width="6.875" height="22" rx="1"/></g><g class="h"><rect x="614.875" y="186" width="6.875" height="22" rx="1"/></g><g class="h"><rect x="623.25" y="186" width="6.875" height="22" rx="1"/></g><g class="h"><rect x="631.625" y="186" width="6.875" height="22" rx="1"/></g><text class="sub2" x="120.75" y="224" text-anchor="start">↑ on chip</text><text class="cap" x="40" y="262" text-anchor="start">At any instant one block of K, 128 rows of 64 numbers, is on the chip. It is used, and</text><text class="cap" x="40" y="282" text-anchor="start">the next block overwrites it in the same space. The other 63 blocks never move while it</text><text class="cap" x="40" y="302" text-anchor="start">is in use.</text><text class="cap" x="40" y="342" text-anchor="start">So SRAM is not a destination the matrix is copied to. It is a window the matrix passes</text><text class="cap" x="40" y="362" text-anchor="start">through, and the same few kilobytes serve all of it over time. Asking where a tiled</text><text class="cap" x="40" y="382" text-anchor="start">matrix goes has no answer: it never goes anywhere; its blocks take turns.</text></svg><figcaption>Replace the picture of copying with the picture of taking turns, and the working-set arithmetic in the next figure becomes obvious.</figcaption></figure>
