<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 18:52</div><h3>Every block of queries reads all of K and V, and the L2 cache catches the repeats</h3><svg viewBox='0 0 680 518' role='img'><title>Every block of queries reads all of K and V, and the L2 cache catches the repeats</title><text class="hd" x="40" y="46">One head, 8,192 tokens, d = 64, blocks of 128, if every read came from HBM</text><text class="cap" x="40" y="85" text-anchor="start">version 1's order</text><g class="h"><rect x="190" y="68" width="400.0" height="24" rx="3"/><text class="sub" x="390.0" y="80.0" text-anchor="middle" dominant-baseline="central">211.8 MB: Q and O make the trips</text></g><text class="cap" x="40" y="121" text-anchor="start">version 2's order</text><g class="h"><rect x="190" y="104" width="257.48762376237624" height="24" rx="3"/></g><text class="sub2" x="455.48762376237624" y="120.0" text-anchor="start">136.3 MB: K and V make them</text><text class="cap" x="40" y="157" text-anchor="start">every byte once</text><g class="s"><rect x="190" y="140" width="7.920792079207921" height="24" rx="3"/></g><text class="sub2" x="205.92079207920793" y="156.0" text-anchor="start">4.2 MB: the floor</text><g class="u"><rect x="40" y="198" width="600" height="34" rx="6"/><text class="sub" x="340.0" y="215.0" text-anchor="middle" dominant-baseline="central">intensity ≈ 4·n²·d ÷ ( n/128 trips × 4·n·d bytes )  =  128:   here 126 per byte, under the ridge of 295</text></g><text class="cap" x="40" y="268" text-anchor="start">In version 2's order each block of queries reads all of K and V, so K and V are read 64</text><text class="cap" x="40" y="288" text-anchor="start">times. Counted that way the head moves 136 MB, less than version 1's 212, because only K</text><text class="cap" x="40" y="308" text-anchor="start">and V travel now, but still 33 times the floor. The arithmetic per byte works out to</text><text class="cap" x="40" y="328" text-anchor="start">about the block height: a block of 128 queries reuses each byte of K and V 128 times.</text><text class="cap" x="40" y="368" text-anchor="start">They mostly do not come from HBM. The repeats are the same 2.1 MB of K and V, requested</text><text class="cap" x="40" y="388" text-anchor="start">by query blocks of the same head running side by side, and the H100's 50 MB L2 cache,</text><text class="cap" x="40" y="408" text-anchor="start">shared by every multiprocessor ({{fig:v02-o052}}), holds that 25 times over. Version 4 orders</text><text class="cap" x="40" y="428" text-anchor="start">its blocks deliberately so that these loads hit in L2.</text><text class="cap" x="40" y="468" text-anchor="start">How large a share the cache catches is something a profiler measures, not something this</text><text class="cap" x="40" y="488" text-anchor="start">count can settle; the count is the worst case.</text></svg><figcaption>The swap traded trips by Q and O, each private to one block, for trips by K and V, which every block shares. Shared trips are the kind a cache can absorb.</figcaption></figure>
