<figure><div class='ts'>Fig 41 &nbsp;&middot;&nbsp; 10:50</div><h3>What streaming means</h3><svg viewBox='0 0 680 386' role='img'><title>What streaming means</title><text class="hd" x="40" y="46">Streaming: the data flows past, it does not arrive</text><g class="h"><rect x="40" y="76" width="600" height="30" rx="4"/><text class="sub halo" x="340.0" y="91.0" text-anchor="middle" dominant-baseline="central">the full matrix, in slow memory</text></g><line class="tick xok" x1="115" y1="76" x2="115" y2="106"/><line class="tick xok" x1="190" y1="76" x2="190" y2="106"/><line class="tick xok" x1="265" y1="76" x2="265" y2="106"/><line class="tick xok" x1="340" y1="76" x2="340" y2="106"/><line class="tick xok" x1="415" y1="76" x2="415" y2="106"/><line class="tick xok" x1="490" y1="76" x2="490" y2="106"/><line class="tick xok" x1="565" y1="76" x2="565" y2="106"/><line class="conn" x1="190" y1="118" x2="190" y2="144" marker-end="url(#arw)"/><g class="m"><rect x="140" y="148" width="100" height="34" rx="4"/><text class="sub" x="190.0" y="165.0" text-anchor="middle" dominant-baseline="central">on chip</text></g><rect x="260" y="148" width="380" height="34" rx="4" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="450.0" y="165.0" text-anchor="middle" dominant-baseline="central">the other seven eighths have not moved</text><text class="cap" x="40" y="232" text-anchor="start">At any instant one piece is on the chip. It is used, and the next piece overwrites it in the</text><text class="cap" x="40" y="252" text-anchor="start">same space.</text><text class="cap" x="40" y="288" text-anchor="start">So the fast memory is not a destination the data is copied to. It is a window the data passes</text><text class="cap" x="40" y="308" text-anchor="start">through, and the same 228 kilobytes serves the whole matrix over time.</text><text class="cap" x="40" y="344" text-anchor="start">Asking where a matrix goes when it is tiled has no answer. It never goes anywhere; pieces of</text><text class="cap" x="40" y="364" text-anchor="start">it take turns.</text></svg><figcaption>The mental picture people usually arrive with is copying. Replacing it with taking turns makes the working-set arithmetic obvious.</figcaption></figure>
