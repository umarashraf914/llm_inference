"402.0" y="184.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="u"><rect x="418" y="171" width="26" height="26" rx="3"/><text class="sub" x="431.0" y="184.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="u"><rect x="447" y="171" width="26" height="26" rx="3"/><text class="sub" x="460.0" y="184.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="520" y="104" text-anchor="start">gold: first pieces</text><text class="sub2" x="520" y="122" text-anchor="start">teal: second pieces</text><text class="sub2" x="520" y="140" text-anchor="start">red: the block</text><text class="cap" x="40" y="234" text-anchor="start">first pieces</text><text class="sub2" x="160" y="234" text-anchor="start">(1, 2) (0, 1) × (1, 0) (0, 1)  =  (1, 2) (0, 1)</text><text class="cap" x="40" y="260" text-anchor="start">second pieces</text><text class="sub2" x="160" y="260" text-anchor="start">(0, 1) (3, 2) × (1, 2) (2, 1)  =  (2, 1) (7, 8)</text><text class="cap" x="40" y="286" text-anchor="start">add</text><text class="sub2" x="160" y="286" text-anchor="start">(1, 2) (0, 1) + (2, 1) (7, 8)  =  (3, 3) (7, 9)</text><text class="cap" x="40" y="342" text-anchor="start">Each pair of brackets is one row of a 2 × 2 piece. The block needs rows 1–2 of A and</text><text class="cap" x="40" y="362" text-anchor="start">columns 1–2 of B. Cut each strip into two 2 × 2 pieces, multiply the gold pieces</text><text class="cap" x="40" y="382" text-anchor="start">together and the teal pieces together, and add: the result is exactly the top-left</text><text class="cap" x="40" y="402" text-anchor="start">corner of the full product.</text><text class="cap" x="40" y="442" text-anchor="start">Nothing else was needed, and the two piece-products did not have to be present at the</text><text class="cap" x="40" y="462" text-anchor="start">same time: the first can be added into a running total, and the second added when it</text><text class="cap" x="40" y="482" text-anchor="start">arrives. That running total is called an accumulator, and it is how a tiled kernel</text><text class="cap" x="40" y="502" text-anchor="start">builds a block from pieces that stream past.</text></svg><figcaption>Checked against the full product. Two strips in, one block out, and each strip can arrive a piece at a time: the whole of tiling, on sixteen numbers.</figcaption></figure>
