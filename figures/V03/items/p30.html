<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 28:26</div><h3>Two thread blocks, one multiply, half the staging</h3><svg viewBox='0 0 680 670' role='img'><title>Two thread blocks, one multiply, half the staging</title><text class="hd" x="40" y="46">Operand B for one multiply, staged once per block or shared by a pair</text><g class="u"><rect x="40" y="62" width="280" height="112" rx="14"/><text class="lbl" x="62" y="88">1-CTA: one block</text></g><g class="m"><rect x="58" y="100" width="110" height="56" rx="8"/><text class="lbl" x="113.0" y="119.0" text-anchor="middle" dominant-baseline="central">its A rows</text><text class="sub" x="113.0" y="137.0" text-anchor="middle" dominant-baseline="central">128</text></g><g class="h"><rect x="186" y="100" width="116" height="56" rx="8"/><text class="lbl" x="244.0" y="119.0" text-anchor="middle" dominant-baseline="central">all of B</text><text class="sub" x="244.0" y="137.0" text-anchor="middle" dominant-baseline="central">staged here</text></g><g class="u"><rect x="360" y="62" width="280" height="112" rx="14"/><text class="lbl" x="382" y="88">2-CTA: a pair, one multiply</text></g><g class="m"><rect x="378" y="100" width="116" height="56" rx="8"/><text class="lbl" x="436.0" y="119.0" text-anchor="middle" dominant-baseline="central">block 1</text><text class="sub" x="436.0" y="137.0" text-anchor="middle" dominant-baseline="central">128 rows, half B</text></g><g class="m"><rect x="506" y="100" width="116" height="56" rx="8"/><text class="lbl" x="564.0" y="119.0" text-anchor="middle" dominant-baseline="central">block 2</text><text class="sub" x="564.0" y="137.0" text-anchor="middle" dominant-baseline="central">128 rows, half B</text></g><text class="hd" x="40" y="214">Shared-memory cycles per block, one backward step (bars to scale)</text><text class="cap" x="40" y="252" text-anchor="start">1-CTA</text><g class="u"><rect x="120" y="234" width="306.6923076923077" height="26" rx="3"/><text class="sub" x="273.3461538461538" y="247.0" text-anchor="middle" dominant-baseline="central">2,048</text></g><g class="m"><rect x="427.6923076923077" y="234" width="37.46153846153846" height="26" rx="3"/></g><g class="s"><rect x="466.15384615384613" y="234" width="152.84615384615384" height="26" rx="3"/><text class="sub" x="542.5769230769231" y="247.0" text-anchor="middle" dominant-baseline="central">1,024</text></g><text class="sub2" x="628.0" y="252" text-anchor="start">3,328</text><text class="cap" x="40" y="292" text-anchor="start">2-CTA</text><g class="u"><rect x="120" y="274" width="229.76923076923077" height="26" rx="3"/><text class="sub" x="234.8846153846154" y="287.0" text-anchor="middle" dominant-baseline="central">1,536</text></g><g class="m"><rect x="350.7692307692308" y="274" width="37.46153846153846" height="26" rx="3"/></g><g class="h"><rect x="389.2307692307692" y="274" width="56.69230769230769" height="26" rx="3"/><text class="sub" x="417.5769230769231" y="287.0" text-anchor="middle" dominant-baseline="central">384</text></g><g class="s"><rect x="446.9230769230769" y="274" width="75.92307692307692" height="26" rx="3"/><text class="sub" x="484.88461538461536" y="287.0" text-anchor="middle" dominant-baseline="central">512</text></g><text class="sub2" x="531.8461538461538" y="292" text-anchor="start">2,688</text><line class="xok" x1="504.6" y1="226.0" x2="504.6" y2="318.0" stroke="var(--s)" stroke-width="1.2" stroke-dasharray="4 3"/><text class="sub2" x="504.6153846153846" y="334" text-anchor="middle">matrix multiplies: 2,560</text><g class="u"><rect x="40" y="350" width="12" height="12" rx="3"/></g><text class="sub2" x="58" y="360" text-anchor="start">operand reads</text><g class="m"><rect x="192" y="350" width="12" height="12" rx="3"/></g><text class="sub2" x="210" y="360" text-anchor="start">writing dS</text><g class="h"><rect x="344" y="350" width="12" height="12" rx="3"/></g><text class="sub2" x="362" y="360" text-anchor="start">swapping half of dS</text><g class="s"><rect x="496" y="350" width="12" height="12" rx="3"/></g><text class="sub2" x="514" y="360" text-anchor="start">dQ out and back</text><text class="cap" x="40" y="400" text-anchor="start">In 2-CTA mode two thread blocks on neighbouring multiprocessors drive one matrix</text><text class="cap" x="40" y="420" text-anchor="start">multiply of 256 rows. Each keeps its own 128 rows of A and its own slice of the result,</text><text class="cap" x="40" y="440" text-anchor="start">and stages only half of operand B; the hardware reads both halves for the one multiply.</text><text class="cap" x="40" y="460" text-anchor="start">A single copy of the shared data serves both blocks.</text><text class="cap" x="40" y="500" text-anchor="start">In the backward pass, where shared memory is the wall, the paper's cycle count per block</text><text class="cap" x="40" y="520" text-anchor="start">falls from 3,328 to 2,688, against 2,560 cycles of matrix multiply: from 30% over the</text><text class="cap" x="40" y="540" text-anchor="start">tensor cores' time to 5%. Operand B's share of the reads halves, and so does the traffic</text><text class="cap" x="40" y="560" text-anchor="start">for the gradient dQ; swapping half of the dS tile with the partner adds a new 384. The</text><text class="cap" x="40" y="580" text-anchor="start">total falls 19%: the halving is of those terms, not of the whole.</text><text class="cap" x="40" y="620" text-anchor="start">Both bars already count the backward pass's use of TMEM, which holds two of the ten</text><text class="cap" x="40" y="640" text-anchor="start">matrix operands so they need not be read from shared memory at all.</text></svg><figcaption>Cycle counts from version 4's Table 3, at M = N = d = 128. Halving dQ's traffic also halves the global atomic additions that sum it, which are slow and make results vary run to run.</figcaption></figure>
