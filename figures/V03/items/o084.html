<figure><div class='ts'>Fig 84 &nbsp;&middot;&nbsp; 30:48</div><h3>Why the cache was mostly empty</h3><svg viewBox="0 0 680 235" role="img"><title>Why the cache was mostly empty</title><text class="hd" x="40" y="46">Before: one contiguous reservation per request</text><rect x="60" y="58" width="180" height="40" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="s"><rect x="60" y="58" width="44" height="40" rx="3"></rect></g><rect x="250" y="58" width="180" height="40" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="s"><rect x="250" y="58" width="96" height="40" rx="3"></rect></g><rect x="440" y="58" width="150" height="40" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="s"><rect x="440" y="58" width="34" height="40" rx="3"></rect></g><text class="cap" x="40" y="139" text-anchor="start">Reserved for the longest sequence the request might reach, because the allocation has to be</text><text class="cap" x="40" y="159" text-anchor="start">contiguous and cannot grow. Only 20 to 38 percent held real tokens.</text><text class="cap" x="40" y="193" text-anchor="start">Two separate wastes: space reserved inside a request and never used, and gaps between</text><text class="cap" x="40" y="213" text-anchor="start">requests too small for the next one to fit.</text></svg><figcaption>The same two failure modes an operating system faces with contiguous memory allocation, and the solution turns out to be the same one.</figcaption></figure>
