<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 39:37</div><h3>Rotary position turns each query and key by an angle set by its position</h3><svg viewBox='0 0 680 542' role='img'><title>Rotary position turns each query and key by an angle set by its position</title><text class="hd" x="40" y="46">Query q = (2, 1) and key k = (1, 1), each turned by its position × 0.5 radians</text><line class="tick" x1="50.0" y1="150.0" x2="210.0" y2="150.0"/><line class="tick" x1="130.0" y1="70.0" x2="130.0" y2="230.0"/><polyline points="130.0,150.0 138.1,74.4" fill="none" stroke="var(--m)" stroke-width="2.5"/><circle cx="138.1" cy="74.4" r="3" fill="var(--m)" stroke="var(--m)" stroke-width="1.5"/><text class="sub2" x="146.13054331556503" y="78.40969463354628" text-anchor="start">q at 2</text><polyline points="130.0,150.0 82.4,156.9" fill="none" stroke="var(--s)" stroke-width="2.5"/><circle cx="82.4" cy="156.9" r="3" fill="var(--s)" stroke="var(--s)" stroke-width="1.5"/><text class="sub2" x="74.41306417186973" y="170.89083002906122" text-anchor="end">k at 5</text><text class="cap" x="130" y="254" text-anchor="middle">positions 2 and 5</text><text class="sub2" x="130" y="272" text-anchor="middle">q · k = −0.785</text><line class="tick" x1="260.0" y1="150.0" x2="420.0" y2="150.0"/><line class="tick" x1="340.0" y1="70.0" x2="340.0" y2="230.0"/><polyline points="340.0,150.0 391.9,205.6" fill="none" stroke="var(--m)" stroke-width="2.5"/><circle cx="391.9" cy="205.6" r="3" fill="var(--m)" stroke="var(--m)" stroke-width="1.5"/><text class="sub2" x="399.8924539500461" y="219.56233637134372" text-anchor="start">q at 10</text><polyline points="340.0,150.0 365.9,109.5" fill="none" stroke="var(--s)" stroke-width="2.5"/><circle cx="365.9" cy="109.5" r="3" fill="var(--s)" stroke="var(--s)" stroke-width="1.5"/><text class="sub2" x="373.8898996797671" y="113.48194113026148" text-anchor="start">k at 13</text><text class="cap" x="340" y="254" text-anchor="middle">positions 10 and 13</text><text class="sub2" x="340" y="272" text-anchor="middle">q · k = −0.785</text><line class="tick" x1="470.0" y1="150.0" x2="630.0" y2="150.0"/><line class="tick" x1="550.0" y1="70.0" x2="550.0" y2="230.0"/><polyline points="550.0,150.0 618.0,116.0" fill="none" stroke="var(--m)" stroke-width="2.5"/><circle cx="618.0" cy="116.0" r="3" fill="var(--m)" stroke="var(--m)" stroke-width="1.5"/><text class="sub2" x="626.0" y="120.0" text-anchor="start">q at 0</text><polyline points="550.0,150.0 518.5,113.7" fill="none" stroke="var(--s)" stroke-width="2.5"/><circle cx="518.5" cy="113.7" r="3" fill="var(--s)" stroke="var(--s)" stroke-width="1.5"/><text class="sub2" x="510.49023531216403" y="117.68010559876025" text-anchor="end">k at 3</text><text class="cap" x="550" y="254" text-anchor="middle">positions 0 and 3</text><text class="sub2" x="550" y="272" text-anchor="middle">q · k = −0.785</text><text class="cap" x="40" y="312" text-anchor="start">Transformers encode each token's position by rotating its query and key vectors by an</text><text class="cap" x="40" y="332" text-anchor="start">angle set by the position: rotary position embedding. Real models rotate many pairs of</text><text class="cap" x="40" y="352" text-anchor="start">coordinates at many speeds; one pair at 0.5 radians per position is enough to see it</text><text class="cap" x="40" y="372" text-anchor="start">work. The arrows move with position, but the angle between query and key, and so their</text><text class="cap" x="40" y="392" text-anchor="start">dot product, depends only on how far apart the two tokens are: three positions apart</text><text class="cap" x="40" y="412" text-anchor="start">gives −0.785 every time.</text><text class="cap" x="40" y="452" text-anchor="start">That is exactly what breaks the fold. The score becomes x W_Q R W_UKᵀ c, with a rotation</text><text class="cap" x="40" y="472" text-anchor="start">R in the middle that changes with every pair of positions, so no single matrix M can be</text><text class="cap" x="40" y="492" text-anchor="start">computed ahead of time. Applied to a rebuilt key, the rotation wedges an unmergeable</text><text class="cap" x="40" y="512" text-anchor="start">step into the chain.</text></svg><figcaption>Drawn to scale, one unit = 34 px. Rotation keeps lengths, so only the angle between the two arrows can carry position, and it carries only the distance between them.</figcaption></figure>
