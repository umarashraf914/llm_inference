<figure><div class='ts'>Fig 56 &nbsp;&middot;&nbsp; 12:11</div><h3>What is actually being remembered</h3><svg viewBox='0 0 680 350' role='img'><title>What is actually being remembered</title><text class="hd" x="40" y="46">The two numbers carried per row</text><g class="s"><rect x="40" y="76" width="285" height="76" rx="8"/><text class="lbl" x="182.5" y="105.0" text-anchor="middle" dominant-baseline="central">m, the running maximum</text><text class="sub" x="182.5" y="123.0" text-anchor="middle" dominant-baseline="central">the largest score seen so far</text></g><g class="s"><rect x="355" y="76" width="285" height="76" rx="8"/><text class="lbl" x="497.5" y="105.0" text-anchor="middle" dominant-baseline="central">l, the running denominator</text><text class="sub" x="497.5" y="123.0" text-anchor="middle" dominant-baseline="central">the sum of the terms so far</text></g><text class="cap" x="40" y="196" text-anchor="start">Two numbers, per row, for the whole computation. Not two per tile, and not two per token</text><text class="cap" x="40" y="216" text-anchor="start">pair: two per row.</text><text class="cap" x="40" y="252" text-anchor="start">For a block of 128 rows that is 256 numbers, about a kilobyte, sitting in fast memory</text><text class="cap" x="40" y="272" text-anchor="start">alongside the output accumulator.</text><text class="cap" x="40" y="308" text-anchor="start">Against the megabytes the score matrix would have needed, it is nothing. That is the trade the</text><text class="cap" x="40" y="328" text-anchor="start">whole technique rests on: replace a quadratic object with two numbers per row.</text></svg><figcaption>Stating the size makes the trade concrete. A quadratic object becomes two scalars per row, and the arithmetic that makes that legitimate is the next figure.</figcaption></figure>
