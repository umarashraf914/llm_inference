<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 32:24</div><h3>Paged attention</h3><svg viewBox='0 0 680 528' role='img'><title>Paged attention</title><text class="hd" x="40" y="46">Two requests' logical blocks, and where the block tables put them</text><g class="s"><rect x="40" y="66" width="40" height="30" rx="3"/><text class="sub" x="60.0" y="81.0" text-anchor="middle" dominant-baseline="central">A0</text></g><g class="s"><rect x="86" y="66" width="40" height="30" rx="3"/><text class="sub" x="106.0" y="81.0" text-anchor="middle" dominant-baseline="central">A1</text></g><g class="s"><rect x="132" y="66" width="40" height="30" rx="3"/><text class="sub" x="152.0" y="81.0" text-anchor="middle" dominant-baseline="central">A2</text></g><g class="s"><rect x="178" y="66" width="40" height="30" rx="3"/><text class="sub" x="198.0" y="81.0" text-anchor="middle" dominant-baseline="central">A3</text></g><g class="m"><rect x="380" y="66" width="40" height="30" rx="3"/><text class="sub" x="400.0" y="81.0" text-anchor="middle" dominant-baseline="central">B0</text></g><g class="m"><rect x="426" y="66" width="40" height="30" rx="3"/><text class="sub" x="446.0" y="81.0" text-anchor="middle" dominant-baseline="central">B1</text></g><g class="m"><rect x="472" y="66" width="40" height="30" rx="3"/><text class="sub" x="492.0" y="81.0" text-anchor="middle" dominant-baseline="central">B2</text></g><text class="sub2" x="230" y="86" text-anchor="start">A's table: 7, 1, 9, 4</text><text class="sub2" x="524" y="86" text-anchor="start">B's table: 12, 3, 14</text><rect x="40" y="186" width="36" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="58.0" y="201.0" text-anchor="middle" dominant-baseline="central">0</text><g class="s"><rect x="78" y="186" width="36" height="30" rx="3"/><text class="sub" x="96.0" y="201.0" text-anchor="middle" dominant-baseline="central">1</text></g><rect x="116" y="186" width="36" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="134.0" y="201.0" text-anchor="middle" dominant-baseline="central">2</text><g class="m"><rect x="154" y="186" width="36" height="30" rx="3"/><text class="sub" x="172.0" y="201.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="s"><rect x="192" y="186" width="36" height="30" rx="3"/><text class="sub" x="210.0" y="201.0" text-anchor="middle" dominant-baseline="central">4</text></g><rect x="230" y="186" width="36" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="248.0" y="201.0" text-anchor="middle" dominant-baseline="central">5</text><rect x="268" y="186" width="36" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="286.0" y="201.0" text-anchor="middle" dominant-baseline="central">6</text><g class="s"><rect x="306" y="186" width="36" height="30" rx="3"/><text class="sub" x="324.0" y="201.0" text-anchor="middle" dominant-baseline="central">7</text></g><rect x="344" y="186" width="36" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="362.0" y="201.0" text-anchor="middle" dominant-baseline="central">8</text><g class="s"><rect x="382" y="186" width="36" height="30" rx="3"/><text class="sub" x="400.0" y="201.0" text-anchor="middle" dominant-baseline="central">9</text></g><rect x="420" y="186" width="36" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="438.0" y="201.0" text-anchor="middle" dominant-baseline="central">10</text><rect x="458" y="186" width="36" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="476.0" y="201.0" text-anchor="middle" dominant-baseline="central">11</text><g class="m"><rect x="496" y="186" width="36" height="30" rx="3"/><text class="sub" x="514.0" y="201.0" text-anchor="middle" dominant-baseline="central">12</text></g><rect x="534" y="186" width="36" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="552.0" y="201.0" text-anchor="middle" dominant-baseline="central">13</text><g class="m"><rect x="572" y="186" width="36" height="30" rx="3"/><text class="sub" x="590.0" y="201.0" text-anchor="middle" dominant-baseline="central">14</text></g><rect x="610" y="186" width="36" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="628.0" y="201.0" text-anchor="middle" dominant-baseline="central">15</text><line class="conn" x1="60" y1="98" x2="324.0" y2="184"/><line class="conn" x1="106" y1="98" x2="96.0" y2="184"/><line class="conn" x1="152" y1="98" x2="400.0" y2="184"/><line class="conn" x1="198" y1="98" x2="210.0" y2="184"/><line class="conn" x1="400" y1="98" x2="514.0" y2="184"/><line class="conn" x1="446" y1="98" x2="172.0" y2="184"/><line class="conn" x1="492" y1="98" x2="590.0" y2="184"/><text class="sub2" x="40" y="238" text-anchor="start">physical blocks in HBM, 16 tokens each; dashed blocks are free, and any of them will do</text><text class="cap" x="40" y="278" text-anchor="start">Paged attention, published in 2023 with the vLLM serving system, carries the operating</text><text class="cap" x="40" y="298" text-anchor="start">system's answer over almost unchanged. The cache is cut into fixed-size blocks of 16 or</text><text class="cap" x="40" y="318" text-anchor="start">32 tokens, and every request gets a block table that maps its logical blocks, in order,</text><text class="cap" x="40" y="338" text-anchor="start">to physical blocks that can sit anywhere in HBM.</text><text class="cap" x="40" y="378" text-anchor="start">The attention kernel follows the table and sees one contiguous sequence. It computes the</text><text class="cap" x="40" y="398" text-anchor="start">same function as before and gathers each block by following the table: what is new is</text><text class="cap" x="40" y="418" text-anchor="start">where the bytes live, plus one lookup per block to find them.</text><text class="cap" x="40" y="458" text-anchor="start">Internal fragmentation shrinks to at most one partly filled block per request. External</text><text class="cap" x="40" y="478" text-anchor="start">fragmentation disappears entirely, because every free block is the same size and any of</text><text class="cap" x="40" y="498" text-anchor="start">them will do.</text></svg><figcaption>Logical order lives in the table, not in memory: request A's tokens 0 to 63 sit in blocks 7, 1, 9 and 4, in that order.</figcaption></figure>
