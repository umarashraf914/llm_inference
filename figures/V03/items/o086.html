<figure><div class='ts'>Fig 86 &nbsp;&middot;&nbsp; 32:13</div><h3>Paged attention</h3><svg viewBox="0 0 680 355" role="img"><title>Paged attention</title><text class="hd" x="40" y="46">After: fixed-size blocks and a lookup table</text><g class="s"><rect x="60" y="62" width="32" height="40" rx="3"></rect></g><g class="s"><rect x="95" y="62" width="32" height="40" rx="3"></rect></g><g class="s"><rect x="130" y="62" width="32" height="40" rx="3"></rect></g><g class="s"><rect x="165" y="62" width="32" height="40" rx="3"></rect></g><g class="s"><rect x="200" y="62" width="32" height="40" rx="3"></rect></g><g class="s"><rect x="235" y="62" width="32" height="40" rx="3"></rect></g><g class="s"><rect x="270" y="62" width="32" height="40" rx="3"></rect></g><g class="s"><rect x="305" y="62" width="32" height="40" rx="3"></rect></g><g class="s"><rect x="340" y="62" width="32" height="40" rx="3"></rect></g><g class="s"><rect x="375" y="62" width="32" height="40" rx="3"></rect></g><g class="s"><rect x="410" y="62" width="32" height="40" rx="3"></rect></g><g class="s"><rect x="445" y="62" width="32" height="40" rx="3"></rect></g><g class="s"><rect x="480" y="62" width="32" height="40" rx="3"></rect></g><g class="u"><rect x="515" y="62" width="32" height="40" rx="3"></rect></g><g class="u"><rect x="550" y="62" width="32" height="40" rx="3"></rect></g><g class="u"><rect x="585" y="62" width="32" height="40" rx="3"></rect></g><text class="cap" x="40" y="143" text-anchor="start">Blocks of 16 or 32 tokens sit anywhere in HBM. A per-request table maps logical positions to</text><text class="cap" x="40" y="163" text-anchor="start">physical blocks, so the kernel sees a contiguous sequence that does not physically exist.</text><text class="cap" x="40" y="203" text-anchor="start">This is exactly virtual memory: the block table is a page table, the blocks are pages, and the</text><text class="cap" x="40" y="223" text-anchor="start">kernel is the process that never learns the difference.</text><text class="cap" x="40" y="263" text-anchor="start">Internal waste falls to at most one partial block. External waste disappears entirely. Two to</text><text class="cap" x="40" y="283" text-anchor="start">four times the throughput at the same latency.</text><text class="cap" x="40" y="313" text-anchor="start">Sharing follows for free: two requests with the same prefix can point at the same physical</text><text class="cap" x="40" y="333" text-anchor="start">blocks, which is worth up to 55 percent on beam search.</text></svg><figcaption>One of the clearest cases in systems of importing a solved idea wholesale. Recognising the fragmentation as a virtual-memory problem was most of the work.</figcaption></figure>
