<figure><div class='ts'>Fig 07 &nbsp;&middot;&nbsp; 9:59</div><h3>What IO means in this context</h3><svg viewBox='0 0 680 352' role='img'><title>What IO means in this context</title><text class="hd" x="40" y="46">The word IO, and what it covers here</text><g class="s"><rect x="40" y="76" width="285" height="78" rx="8"/><text class="lbl" x="182.5" y="98.0" text-anchor="middle" dominant-baseline="central">Not disks, not networks</text><text class="sub" x="182.5" y="116.0" text-anchor="middle" dominant-baseline="central">no file is opened and nothing</text><text class="sub" x="182.5" y="133.0" text-anchor="middle" dominant-baseline="central">leaves the machine</text></g><g class="h"><rect x="355" y="76" width="285" height="78" rx="8"/><text class="lbl" x="497.5" y="98.0" text-anchor="middle" dominant-baseline="central">Just this one journey</text><text class="sub" x="497.5" y="116.0" text-anchor="middle" dominant-baseline="central">between the memory beside the chip</text><text class="sub" x="497.5" y="133.0" text-anchor="middle" dominant-baseline="central">and the chip itself</text></g><text class="cap" x="40" y="198" text-anchor="start">In most of computing, IO means talking to the world outside. Here it means the trip across a</text><text class="cap" x="40" y="218" text-anchor="start">few millimetres of package, and nothing else.</text><text class="cap" x="40" y="254" text-anchor="start">IO-aware therefore means an algorithm designed around how many times data makes that specific</text><text class="cap" x="40" y="274" text-anchor="start">trip, rather than around how many operations it performs.</text><text class="cap" x="40" y="310" text-anchor="start">The two measures disagree, which is the entire point: the naive and the tiled version do</text><text class="cap" x="40" y="330" text-anchor="start">identical arithmetic and are not remotely equally fast.</text></svg><figcaption>A word borrowed from a different scale. Reading it as file access will make the rest of this atlas confusing.</figcaption></figure>
