harray="3 3"></rect><rect x="330" y="66" width="180" height="86" rx="4" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><rect x="146" y="156" width="180" height="86" rx="4" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><rect x="330" y="156" width="180" height="86" rx="4" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="150" y="280" text-anchor="start">the same numbers, grouped into four tiles</text><text class="cap" x="40" y="330" text-anchor="start">Nothing has changed about the values. A tile is just a decision about which part to work on</text><text class="cap" x="40" y="350" text-anchor="start">next, so that the part you are working on fits somewhere small and fast.</text><text class="cap" x="40" y="386" text-anchor="start">The words block and tile are used interchangeably throughout.</text></svg><figcaption>A bookkeeping idea, not a mathematical one. The whole grid still gets computed; only the order and the working set change.</figcaption></figure>
