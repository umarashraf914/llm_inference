<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:02</div><h3>A matrix times a matrix is a grid of dot products</h3><svg viewBox='0 0 680 458' role='img'><title>A matrix times a matrix is a grid of dot products</title><text class="hd" x="40" y="46">Entry (i, j) of Q Kᵀ is row i of Q dotted with row j of K</text><text class="sub2" x="60" y="110" text-anchor="start">Q, 3 × 2</text><g class="u"><rect x="60" y="122" width="30" height="30" rx="3"/><text class="sub" x="75.0" y="137.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="94" y="122" width="30" height="30" rx="3"/><text class="sub" x="109.0" y="137.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="u"><rect x="60" y="156" width="30" height="30" rx="3"/><text class="sub" x="75.0" y="171.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="94" y="156" width="30" height="30" rx="3"/><text class="sub" x="109.0" y="171.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="60" y="190" width="30" height="30" rx="3"/><text class="sub" x="75.0" y="205.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="m"><rect x="94" y="190" width="30" height="30" rx="3"/><text class="sub" x="109.0" y="205.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="190" y="80" text-anchor="start">Kᵀ, 2 × 3</text><g class="m"><rect x="190" y="88" width="30" height="30" rx="3"/><text class="sub" x="205.0" y="103.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="u"><rect x="224" y="88" width="30" height="30" rx="3"/><text class="sub" x="239.0" y="103.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="258" y="88" width="30" height="30" rx="3"/><text class="sub" x="273.0" y="103.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="m"><rect x="190" y="122" width="30" height="30" rx="3"/><text class="sub" x="205.0" y="137.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="224" y="122" width="30" height="30" rx="3"/><text class="sub" x="239.0" y="137.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="258" y="122" width="30" height="30" rx="3"/><text class="sub" x="273.0" y="137.0" text-anchor="middle" dominant-baseline="central">3</text></g><text class="sub2" x="330" y="110" text-anchor="start">S = Q Kᵀ, 3 × 3</text><g class="u"><rect x="330" y="122" width="30" height="30" rx="3"/><text class="sub" x="345.0" y="137.0" text-anchor="middle" dominant-baseline="central">4</text></g><g class="u"><rect x="364" y="122" width="30" height="30" rx="3"/><text class="sub" x="379.0" y="137.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="398" y="122" width="30" height="30" rx="3"/><text class="sub" x="413.0" y="137.0" text-anchor="middle" dominant-baseline="central">6</text></g><g class="u"><rect x="330" y="156" width="30" height="30" rx="3"/><text class="sub" x="345.0" y="171.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="364" y="156" width="30" height="30" rx="3"/><text class="sub" x="379.0" y="171.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="398" y="156" width="30" height="30" rx="3"/><text class="sub" x="413.0" y="171.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="s"><rect x="330" y="190" width="30" height="30" rx="3"/><text class="sub" x="345.0" y="205.0" text-anchor="middle" dominant-baseline="central">7</text></g><g class="u"><rect x="364" y="190" width="30" height="30" rx="3"/><text class="sub" x="379.0" y="205.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="u"><rect x="398" y="190" width="30" height="30" rx="3"/><text class="sub" x="413.0" y="205.0" text-anchor="middle" dominant-baseline="central">3</text></g><text class="sub2" x="470" y="142" text-anchor="start">row 3 of Q: (3, 1)</text><text class="sub2" x="470" y="162" text-anchor="start">row 1 of K: (2, 1)</text><text class="sub2" x="470" y="182" text-anchor="start">3×2 + 1×1 = 7</text><text class="cap" x="40" y="268" text-anchor="start">Multiplying two matrices is a grid of dot products ({{fig:v03-o014}}). Each entry of the</text><text class="cap" x="40" y="288" text-anchor="start">answer takes one row of the left matrix and one column of the right, multiplies them</text><text class="cap" x="40" y="308" text-anchor="start">pair by pair and adds. Transposing K turns its rows into columns, so column j of Kᵀ is</text><text class="cap" x="40" y="328" text-anchor="start">row j of K ({{fig:v03-o019}}).</text><text class="cap" x="40" y="368" text-anchor="start">So S = Q Kᵀ holds one score for every pair of tokens: query i against key j. With n</text><text class="cap" x="40" y="388" text-anchor="start">tokens and head width d, that is n × n entries, each a dot product of d multiply-adds,</text><text class="cap" x="40" y="408" text-anchor="start">n·n·d in all; the multiply by V is the same count again. Those are the two halves of</text><text class="cap" x="40" y="428" text-anchor="start">attention's 4·n²·d operations ({{fig:v03-p03}}).</text></svg><figcaption>The one operation everything else in this atlas is built from. Its output here is 3 × 3 from inputs of 3 × 2: the output grows with the square of the token count, the inputs do not.</figcaption></figure>
