<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:26</div><h3>Six levers, one target</h3><svg viewBox='0 0 680 526' role='img'><title>Six levers, one target</title><text class="hd" x="40" y="46">Six levers, each one a way to move fewer bytes or cheaper ones</text><text class="sub2" x="40" y="82" text-anchor="start">the lever</text><text class="sub2" x="318" y="82" text-anchor="start">what pulls it</text><text class="sub2" x="640" y="82" text-anchor="end">Part</text><g class="s"><rect x="40" y="94" width="262" height="30" rx="3"/><text class="sub" x="171.0" y="109.0" text-anchor="middle" dominant-baseline="central">the kernel's own intermediates</text></g><text class="sub2" x="318" y="114" text-anchor="start">FlashAttention, four versions</text><text class="sub2" x="640" y="114" text-anchor="end">4–12</text><g class="u"><rect x="40" y="136" width="262" height="30" rx="3"/><text class="sub" x="171.0" y="151.0" text-anchor="middle" dominant-baseline="central">a model that keeps a smaller cache</text></g><text class="sub2" x="318" y="156" text-anchor="start">grouped-query and latent attention</text><text class="sub2" x="640" y="156" text-anchor="end">14</text><g class="u"><rect x="40" y="178" width="262" height="30" rx="3"/><text class="sub" x="171.0" y="193.0" text-anchor="middle" dominant-baseline="central">a cache packed without waste</text></g><text class="sub2" x="318" y="198" text-anchor="start">paged attention</text><text class="sub2" x="640" y="198" text-anchor="end">13</text><g class="u"><rect x="40" y="220" width="262" height="30" rx="3"/><text class="sub" x="171.0" y="235.0" text-anchor="middle" dominant-baseline="central">decode split across the chip</text></g><text class="sub2" x="318" y="240" text-anchor="start">Flash-Decoding</text><text class="sub2" x="640" y="240" text-anchor="end">15</text><g class="u"><rect x="40" y="262" width="262" height="30" rx="3"/><text class="sub" x="171.0" y="277.0" text-anchor="middle" dominant-baseline="central">each launch paid for once</text></g><text class="sub2" x="318" y="282" text-anchor="start">CUDA graphs</text><text class="sub2" x="640" y="282" text-anchor="end">16</text><g class="u"><rect x="40" y="304" width="262" height="30" rx="3"/><text class="sub" x="171.0" y="319.0" text-anchor="middle" dominant-baseline="central">every number in fewer bits</text></g><text class="sub2" x="318" y="324" text-anchor="start">FP8 and FP4; the next atlas</text><text class="sub2" x="640" y="324" text-anchor="end">11, 17</text><text class="cap" x="40" y="376" text-anchor="start">FlashAttention is the one kernel followed through all four of its versions. The other</text><text class="cap" x="40" y="396" text-anchor="start">five levers come after it, and each is a different answer to the same question: which</text><text class="cap" x="40" y="416" text-anchor="start">bytes can be made smaller, rarer, or cheaper to move.</text><text class="cap" x="40" y="456" text-anchor="start">Two of the six change the answer on purpose: a model that keeps fewer keys and values is</text><text class="cap" x="40" y="476" text-anchor="start">a different model, and fewer bits round more coarsely. The other four compute the same</text><text class="cap" x="40" y="496" text-anchor="start">attention, up to the order of additions (Part 17).</text></svg><figcaption>A map for the whole atlas. The recap in Part 17 comes back to this list and sorts it by what each lever left untouched.</figcaption></figure>
