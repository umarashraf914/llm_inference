<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 10:58</div><h3>In the first version, Q and O make a trip for every block of K and V</h3><svg viewBox='0 0 680 658' role='img'><title>In the first version, Q and O make a trip for every block of K and V</title><text class="hd" x="40" y="46">The order of the published algorithm: K and V outside, Q inside</text><g class="u"><rect x="40" y="62" width="600" height="196" rx="14"/><text class="lbl" x="62" y="88">for each block of K and V: 64 times</text></g><g class="s"><rect x="62" y="102" width="556" height="26" rx="3"/><text class="sub" x="340.0" y="115.0" text-anchor="middle" dominant-baseline="central">load this block of K and V: once, for good</text></g><g class="u"><rect x="62" y="138" width="556" height="108" rx="14"/><text class="lbl" x="84" y="164">for each block of Q: 64 times, inside every outer step</text></g><g class="h"><rect x="84" y="174" width="160" height="56" rx="3"/><text class="sub" x="164.0" y="202.0" text-anchor="middle" dominant-baseline="central">read Qᵢ, Oᵢ, m, l</text></g><line class="conn" x1="250" y1="202" x2="266" y2="202" marker-end="url(#arw)"/><g class="m"><rect x="272" y="174" width="170" height="56" rx="3"/><text class="sub" x="357.0" y="202.0" text-anchor="middle" dominant-baseline="central">fold the S tile in, on chip</text></g><line class="conn" x1="448" y1="202" x2="464" y2="202" marker-end="url(#arw)"/><g class="h"><rect x="470" y="174" width="126" height="56" rx="3"/><text class="sub" x="533.0" y="202.0" text-anchor="middle" dominant-baseline="central">write Oᵢ, m, l</text></g><text class="hd" x="40" y="288">HBM traffic, one head, 8,192 tokens, d = 64, blocks of 128</text><text class="cap" x="40" y="325" text-anchor="start">three kernels</text><g class="h"><rect x="200" y="308" width="360.0" height="24" rx="3"/></g><text class="sub2" x="568.0" y="325" text-anchor="start">541.1 MB</text><text class="cap" x="40" y="361" text-anchor="start">this loop order</text><g class="h"><rect x="200" y="344" width="140.93023255813955" height="24" rx="3"/></g><text class="sub2" x="348.93023255813955" y="361" text-anchor="start">211.8 MB</text><text class="cap" x="40" y="397" text-anchor="start">every byte once</text><g class="s"><rect x="200" y="380" width="2.7906976744186047" height="24" rx="3"/></g><text class="sub2" x="210.7906976744186" y="397" text-anchor="start">4.2 MB</text><text class="cap" x="40" y="448" text-anchor="start">This is the loop of the paper's algorithm: load one block of K and V, then sweep every</text><text class="cap" x="40" y="468" text-anchor="start">block of Q past it. Each K and V block is read once. But the running output Oᵢ for a</text><text class="cap" x="40" y="488" text-anchor="start">block of queries cannot stay on the chip: the next visit to block i comes only after the</text><text class="cap" x="40" y="508" text-anchor="start">other 63 Q blocks have had their turn. So every inner step reads Qᵢ, Oᵢ and the two</text><text class="cap" x="40" y="528" text-anchor="start">running numbers per row that Part 7 explains, and writes Oᵢ and those numbers back.</text><text class="cap" x="40" y="568" text-anchor="start">Counted from the algorithm, with O kept in 16-bit between visits: K and V 2.1 MB, Q read</text><text class="cap" x="40" y="588" text-anchor="start">64 times 67.1 MB, O read and written 64 times 134.2 MB, the statistics 8.4 MB. 212 MB in</text><text class="cap" x="40" y="608" text-anchor="start">all: 2.6 times less than three kernels, because S never moves, and 50 times the floor of</text><text class="cap" x="40" y="628" text-anchor="start">touching each input once.</text></svg><figcaption>S is gone, but the bill did not vanish with it: it became repeated trips for Q and for the output. Bigger blocks mean fewer trips, and which matrix makes the trips is a choice; version 2 makes the other one (Part 9).</figcaption></figure>
