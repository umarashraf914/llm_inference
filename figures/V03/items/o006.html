<figure><div class='ts'>Fig 06 &nbsp;&middot;&nbsp; 0:12</div><h3>Why kernel boundaries cost bytes</h3><svg viewBox="0 0 680 342" role="img"><title>Why kernel boundaries cost bytes</title><g class="h"><rect x="40" y="60" width="600" height="26" rx="4"></rect><text class="sub" x="340.0" y="73.0" text-anchor="middle" dominant-baseline="central">HBM</text></g><g class="u"><rect x="60" y="122" width="165" height="56" rx="8"></rect><text class="lbl" x="142.5" y="141.0" text-anchor="middle" dominant-baseline="central">Kernel 1</text><text class="sub" x="142.5" y="159.0" text-anchor="middle" dominant-baseline="central">computes S</text></g><line class="conn" x1="120" y1="90" x2="120" y2="118" marker-end="url(#arw)"></line><line class="conn" x1="165" y1="118" x2="165" y2="96" marker-end="url(#arw)"></line><g class="u"><rect x="255" y="122" width="165" height="56" rx="8"></rect><text class="lbl" x="337.5" y="141.0" text-anchor="middle" dominant-baseline="central">Kernel 2</text><text class="sub" x="337.5" y="159.0" text-anchor="middle" dominant-baseline="central">softmax</text></g><line class="conn" x1="315" y1="90" x2="315" y2="118" marker-end="url(#arw)"></line><line class="conn" x1="360" y1="118" x2="360" y2="96" marker-end="url(#arw)"></line><g class="u"><rect x="450" y="122" width="165" height="56" rx="8"></rect><text class="lbl" x="532.5" y="141.0" text-anchor="middle" dominant-baseline="central">Kernel 3</text><text class="sub" x="532.5" y="159.0" text-anchor="middle" dominant-baseline="central">multiplies by V</text></g><line class="conn" x1="510" y1="90" x2="510" y2="118" marker-end="url(#arw)"></line><line class="conn" x1="555" y1="118" x2="555" y2="96" marker-end="url(#arw)"></line><text class="cap" x="40" y="220" text-anchor="start">When a kernel finishes, its multiprocessors are reassigned and everything in their registers</text><text class="cap" x="40" y="240" text-anchor="start">and shared memory is gone. The only thing that survives is what was written to HBM.</text><text class="cap" x="40" y="270" text-anchor="start">So a boundary between two kernels forces a full round trip through main memory, whether or not</text><text class="cap" x="40" y="290" text-anchor="start">the mathematics wanted one.</text><text class="cap" x="40" y="320" text-anchor="start">That single fact is what FlashAttention exploits.</text></svg><figcaption>Not a subtle point, but easy to miss: the cost is imposed by the software structure, not by the computation.</figcaption></figure>
