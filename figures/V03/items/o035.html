<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 10:40</div><h3>Why the computation can be cut up</h3><svg viewBox='0 0 680 432' role='img'><title>Why the computation can be cut up</title><text class="hd" x="40" y="46">A block of the answer needs only a strip of each input</text><g class="s"><rect x="60" y="70" width="132" height="132" rx="3"/></g><g class="m"><rect x="60" y="70" width="132" height="30" rx="3"/><text class="sub" x="126.0" y="85.0" text-anchor="middle" dominant-baseline="central">rows i</text></g><text class="lbl" x="210" y="140.0" text-anchor="middle">×</text><g class="s"><rect x="228" y="70" width="132" height="132" rx="3"/></g><g class="m"><rect x="228" y="70" width="30" height="132" rx="3"/></g><text class="lbl" x="378" y="140.0" text-anchor="middle">=</text><g class="u"><rect x="396" y="70" width="132" height="132" rx="3"/></g><g class="m"><rect x="396" y="70" width="30" height="30" rx="3"/></g><text class="sub2" x="60" y="222" text-anchor="start">A: one strip of rows</text><text class="sub2" x="228" y="222" text-anchor="start">B: one strip of columns</text><text class="sub2" x="396" y="222" text-anchor="start">C: the block where they cross</text><text class="cap" x="40" y="262" text-anchor="start">Every entry of C = A × B is a row of A dotted with a column of B ({{fig:v03-n07}}). So a</text><text class="cap" x="40" y="282" text-anchor="start">whole block of C, the entries where a band of rows meets a band of columns, needs only</text><text class="cap" x="40" y="302" text-anchor="start">that strip of A and that strip of B. Nothing outside the two strips affects it.</text><text class="cap" x="40" y="342" text-anchor="start">The strips can therefore be brought onto the chip on their own, the block computed, and</text><text class="cap" x="40" y="362" text-anchor="start">both discarded. Repeat for every block and the whole product is built without either</text><text class="cap" x="40" y="382" text-anchor="start">input ever being present in full. Every large matrix multiply on a GPU is done this way,</text><text class="cap" x="40" y="402" text-anchor="start">the one in {{fig:v03-p01}} included; attention is not a special case.</text></svg><figcaption>The mathematical permission for tiling, and a property of multiplication itself. FlashAttention exploits it; it did not invent it.</figcaption></figure>
