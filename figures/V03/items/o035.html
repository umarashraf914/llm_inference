<figure><div class='ts'>Fig 35 &nbsp;&middot;&nbsp; 10:28</div><h3>Why the computation can be cut up</h3><svg viewBox="0 0 680 318" role="img"><title>Why the computation can be cut up</title><text class="hd" x="40" y="46">Matrix multiplication decomposes into blocks</text><g class="s"><rect x="60" y="70" width="110" height="110" rx="4"></rect><text class="hd" x="115.0" y="64" text-anchor="middle">A</text></g><text class="hd" x="182" y="128" text-anchor="start">x</text><g class="s"><rect x="206" y="70" width="110" height="110" rx="4"></rect><text class="hd" x="261.0" y="64" text-anchor="middle">B</text></g><text class="hd" x="328" y="128" text-anchor="start">=</text><g class="u"><rect x="352" y="70" width="110" height="110" rx="4"></rect><text class="hd" x="407.0" y="64" text-anchor="middle">C</text></g><line class="tick xok" x1="115" y1="72" x2="115" y2="180"></line><line class="tick xok" x1="60" y1="125" x2="170" y2="125"></line><line class="tick xok" x1="261" y1="72" x2="261" y2="180"></line><line class="tick xok" x1="206" y1="125" x2="316" y2="125"></line><line class="tick xok" x1="407" y1="72" x2="407" y2="180"></line><line class="tick xok" x1="352" y1="125" x2="462" y2="125"></line><line class="tick xok" x1="115" y1="72" x2="115" y2="180"></line><line class="tick xok" x1="60" y1="125" x2="170" y2="125"></line><line class="tick xok" x1="261" y1="72" x2="261" y2="180"></line><line class="tick xok" x1="206" y1="125" x2="316" y2="125"></line><line class="tick xok" x1="407" y1="72" x2="407" y2="180"></line><line class="tick xok" x1="352" y1="125" x2="462" y2="125"></line><line class="tick xok" x1="115" y1="72" x2="115" y2="180"></line><line class="tick xok" x1="60" y1="125" x2="170" y2="125"></line><line class="tick xok" x1="261" y1="72" x2="261" y2="180"></line><line class="tick xok" x1="206" y1="125" x2="316" y2="125"></line><line class="tick xok" x1="407" y1="72" x2="407" y2="180"></line><line class="tick xok" x1="352" y1="125" x2="462" y2="125"></line><line class="tick xok" x1="115" y1="72" x2="115" y2="180"></line><line class="tick xok" x1="60" y1="125" x2="170" y2="125"></line><line class="tick xok" x1="261" y1="72" x2="261" y2="180"></line><line class="tick xok" x1="206" y1="125" x2="316" y2="125"></line><line class="tick xok" x1="407" y1="72" x2="407" y2="180"></line><line class="tick xok" x1="352" y1="125" x2="462" y2="125"></line><text class="sub2" x="490" y="118" text-anchor="start">each block of C is a sum</text><text class="sub2" x="490" y="140" text-anchor="start">of block products</text><text class="cap" x="40" y="226" text-anchor="start">A tile of the result depends only on a strip of A and a strip of B. You never need the whole</text><text class="cap" x="40" y="246" text-anchor="start">of either operand at once.</text><text class="cap" x="40" y="276" text-anchor="start">This is why tiling is possible at all, and it is not specific to attention. Every large matrix</text><text class="cap" x="40" y="296" text-anchor="start">multiply on a GPU is tiled for exactly this reason.</text></svg><figcaption>A property of the mathematics, not of any particular implementation. FlashAttention exploits it; it does not invent it.</figcaption></figure>
