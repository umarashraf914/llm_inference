<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 14:28</div><h3>Push one row through the tiles</h3><div class='wg'><div class='ctl'><label class='opt'>scores</label><label class='opt'><input type='number' step='any' data-x='0' value='3' style='width:4.4em;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:2px 4px'></label><label class='opt'><input type='number' step='any' data-x='1' value='2' style='width:4.4em;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:2px 4px'></label><label class='opt'><input type='number' step='any' data-x='2' value='1.5' style='width:4.4em;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:2px 4px'></label><label class='opt'><input type='number' step='any' data-x='3' value='5' style='width:4.4em;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:2px 4px'></label><label class='opt'><input type='number' step='any' data-x='4' value='4' style='width:4.4em;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:2px 4px'></label><label class='opt'><input type='number' step='any' data-x='5' value='1' style='width:4.4em;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:2px 4px'></label></div><div class='ctl'><label class='opt'>values</label><label class='opt'><input type='number' step='any' data-v='0' value='10' style='width:4.4em;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:2px 4px'></label><label class='opt'><input type='number' step='any' data-v='1' value='20' style='width:4.4em;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:2px 4px'></label><label class='opt'><input type='number' step='any' data-v='2' value='30' style='width:4.4em;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:2px 4px'></label><label class='opt'><input type='number' step='any' data-v='3' value='40' style='width:4.4em;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:2px 4px'></label><label class='opt'><input type='number' step='any' data-v='4' value='50' style='width:4.4em;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:2px 4px'></label><label class='opt'><input type='number' step='any' data-v='5' value='60' style='width:4.4em;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:2px 4px'></label></div><div class='ctl'><label class='opt'>scores per tile</label><label class='opt'><input type='radio' name='v03-p16-w' value='1'> 1</label><label class='opt'><input type='radio' name='v03-p16-w' value='2'> 2</label><label class='opt'><input type='radio' name='v03-p16-w' value='3' checked> 3</label><label class='opt'><input type='radio' name='v03-p16-w' value='6'> 6</label><label class='opt'><input type='checkbox'> skip small rescales (version 4)</label><button type='button'>Reset</button></div><svg viewBox='0 0 680 568' role='img'><title>Push one row through the tiles</title><text class="hd" x="40" y="30">The running numbers after each tile, and the answer both ways</text><text class="sub2" x="40" y="58" text-anchor="start">tile</text><text class="sub2" x="90" y="58" text-anchor="start">its scores</text><text class="sub2" x="300" y="58" text-anchor="end">its max</text><text class="sub2" x="370" y="58" text-anchor="end">m</text><text class="sub2" x="450" y="58" text-anchor="end">correction</text><text class="sub2" x="540" y="58" text-anchor="end">l</text><text class="sub2" x="640" y="58" text-anchor="end">O</text><text class="sub2" x="40" y="82" data-k="0">1</text><text class="sub2" x="90" y="82" text-anchor="start" data-t="0">3.0, 2.0, 1.5</text><text class="sub2" x="300" y="82" text-anchor="end" data-tm="0">3.00</text><text class="sub2" x="370" y="82" text-anchor="end" data-m="0">3.00</text><text class="sub2" x="450" y="82" text-anchor="end" data-c="0">start</text><text class="sub2" x="540" y="82" text-anchor="end" data-l="0">1.5910</text><text class="sub2" x="640" y="82" text-anchor="end" data-o="0">24.0515</text><text class="sub2" x="40" y="106" data-k="1">2</text><text class="sub2" x="90" y="106" text-anchor="start" data-t="1">5.0, 4.0, 1.0</text><text class="sub2" x="300" y="106" text-anchor="end" data-tm="1">5.00</text><text class="sub2" x="370" y="106" text-anchor="end" data-m="1">5.00</text><text class="sub2" x="450" y="106" text-anchor="end" data-c="1">0.1353</text><text class="sub2" x="540" y="106" text-anchor="end" data-l="1">1.6015</text><text class="sub2" x="640" y="106" text-anchor="end" data-o="1">62.7479</text><text class="sub2" x="40" y="130" data-k="2"></text><text class="sub2" x="90" y="130" text-anchor="start" data-t="2"></text><text class="sub2" x="300" y="130" text-anchor="end" data-tm="2"></text><text class="sub2" x="370" y="130" text-anchor="end" data-m="2"></text><text class="sub2" x="450" y="130" text-anchor="end" data-c="2"></text><text class="sub2" x="540" y="130" text-anchor="end" data-l="2"></text><text class="sub2" x="640" y="130" text-anchor="end" data-o="2"></text><text class="sub2" x="40" y="154" data-k="3"></text><text class="sub2" x="90" y="154" text-anchor="start" data-t="3"></text><text class="sub2" x="300" y="154" text-anchor="end" data-tm="3"></text><text class="sub2" x="370" y="154" text-anchor="end" data-m="3"></text><text class="sub2" x="450" y="154" text-anchor="end" data-c="3"></text><text class="sub2" x="540" y="154" text-anchor="end" data-l="3"></text><text class="sub2" x="640" y="154" text-anchor="end" data-o="3"></text><text class="sub2" x="40" y="178" data-k="4"></text><text class="sub2" x="90" y="178" text-anchor="start" data-t="4"></text><text class="sub2" x="300" y="178" text-anchor="end" data-tm="4"></text><text class="sub2" x="370" y="178" text-anchor="end" data-m="4"></text><text class="sub2" x="450" y="178" text-anchor="end" data-c="4"></text><text class="sub2" x="540" y="178" text-anchor="end" data-l="4"></text><text class="sub2" x="640" y="178" text-anchor="end" data-o="4"></text><text class="sub2" x="40" y="202" data-k="5"></text><text class="sub2" x="90" y="202" text-anchor="start" data-t="5"></text><text class="sub2" x="300" y="202" text-anchor="end" data-tm="5"></text><text class="sub2" x="370" y="202" text-anchor="end" data-m="5"></text><text class="sub2" x="450" y="202" text-anchor="end" data-c="5"></text><text class="sub2" x="540" y="202" text-anchor="end" data-l="5"></text><text class="sub2" x="640" y="202" text-anchor="end" data-o="5"></text><text class="cap" x="40" y="240">tile by tile, O ÷ l: <tspan data-ans="">39.180359</tspan></text><text class="cap" x="40" y="262">all at once, the direct way: <tspan data-dir="">39.180359</tspan>  —  <tspan data-agree="">the same</tspan></text><text class="cap" x="40" y="302" text-anchor="start">Type any six scores and values, choose how many scores arrive per tile, and follow m, l</text><text class="cap" x="40" y="322" text-anchor="start">and O. The correction column is e^(m_old − m_new): 1 when the maximum holds still, small</text><text class="cap" x="40" y="342" text-anchor="start">when it jumps.</text><text class="cap" x="40" y="382" text-anchor="start">Put a 1,000 anywhere after the first tile. Before it arrives the sums are ordinary; when</text><text class="cap" x="40" y="402" text-anchor="start">it arrives the correction is e^(−995) or smaller, the earlier terms vanish, and the</text><text class="cap" x="40" y="422" text-anchor="start">answer becomes that score's value, as the direct softmax says it must. Nothing</text><text class="cap" x="40" y="442" text-anchor="start">overflows, whatever the order.</text><text class="cap" x="40" y="482" text-anchor="start">The checkbox applies version 4's rule (Part 12): move the maximum only when a tile's</text><text class="cap" x="40" y="502" text-anchor="start">maximum beats it by more than 8 doublings, a factor of 256. Smaller rises are skipped, l</text><text class="cap" x="40" y="522" text-anchor="start">and O grow larger, and the answer does not change. The arithmetic was checked against</text><text class="cap" x="40" y="542" text-anchor="start">Python.</text></svg></div><figcaption>Attention never needed the whole row at once: three running numbers per row, corrected by one multiplication whenever the maximum moves.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const X0 = [3, 2, 1.5, 5, 4, 1], V0 = [10, 20, 30, 40, 50, 60], W0 = 3, TAU = 5.545177444479562, WIDTHS = [1, 2, 3, 6];
  const q = s => fig.querySelector(s), qa = s => [...fig.querySelectorAll(s)];
  const xs = qa('input[data-x]'), vs = qa('input[data-v]'), rad = qa('input[type=radio]'), skip = q('input[type=checkbox]');
  const fx = (v, d) => (v < 0 && Math.abs(v).toFixed(d) !== (0).toFixed(d) ? '−' : '') + Math.abs(v).toFixed(d);
  const num = el => { const v = parseFloat(el.value); return isFinite(v) ? v : 0; };
  function run(x, v, w, tau) {
    let m = -Infinity, l = 0, O = 0; const rows = [];
    for (let s = 0; s < x.length; s += w) {
      const tx = x.slice(s, s + w), tv = v.slice(s, s + w), tmax = Math.max(...tx);
      let mn, c, fired;
      if (m === -Infinity || tau === null || tmax - m > tau) { mn = Math.max(m, tmax); c = m === -Infinity ? 0 : Math.exp(m - mn); fired = m !== -Infinity && mn > m; }
      else { mn = m; c = 1; fired = false; }
      const t = tx.map(a => Math.exp(a - mn));
      l = l * c + t.reduce((a, b) => a + b, 0);
      O = O * c + t.reduce((a, b, i) => a + b * tv[i], 0);
      rows.push({tx, tmax, m: mn, c, l, O, fired}); m = mn;
    }
    return {rows, ans: O / l};
  }
  function draw() {
    const x = xs.map(num), v = vs.map(num), w = WIDTHS[rad.findIndex(r => r.checked)];
    const tau = skip.checked ? TAU : null, R = run(x, v, w, tau);
    const mx = Math.max(...x), e = x.map(a => Math.exp(a - mx));
    const dir = e.reduce((a, b, i) => a + b * v[i], 0) / e.reduce((a, b) => a + b, 0);
    for (let k = 0; k < 6; k++) {
      const r = R.rows[k], set = (f, s) => q(`[data-${f}="${k}"]`).textContent = s;
      if (!r) { ['k','t','tm','m','c','l','o'].forEach(f => set(f, '')); continue; }
      set('k', String(k + 1));
      set('t', r.tx.map(a => fx(a, 1)).join(', '));
      set('tm', fx(r.tmax, 2)); set('m', fx(r.m, 2));
      set('c', k === 0 ? 'start' : (r.c === 1 && !r.fired ? (tau !== null && r.tmax > r.m ? 'skipped' : '1') : fx(r.c, 4)));
      set('l', fx(r.l, 4)); set('o', fx(r.O, 4));
    }
    q('[data-ans]').textContent = fx(R.ans, 6);
    q('[data-dir]').textContent = fx(dir, 6);
    q('[data-agree]').textContent = Math.abs(R.ans - dir) < 1e-9 * Math.max(1, Math.abs(dir)) ? 'the same' : 'different';
  }
  qa('input').forEach(el => el.addEventListener('input', draw));
  rad.forEach(r => r.addEventListener('change', draw)); skip.addEventListener('change', draw);
  q('button').addEventListener('click', () => { xs.forEach((el, i) => el.value = X0[i]); vs.forEach((el, i) => el.value = V0[i]);
    rad[WIDTHS.indexOf(W0)].checked = true; skip.checked = false; draw(); });
  draw();
})();</script></figure>
