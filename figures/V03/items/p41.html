<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 42:51</div><h3>Merging two chunks is the online-softmax correction, applied once</h3><svg viewBox='0 0 680 504' role='img'><title>Merging two chunks is the online-softmax correction, applied once</title><text class="hd" x="40" y="46">The worked row of Part 7, its two tiles now two chunks on two multiprocessors</text><text class="sub2" x="40" y="80" text-anchor="start"></text><text class="sub2" x="240" y="80" text-anchor="end">scores</text><text class="sub2" x="330" y="80" text-anchor="end">m</text><text class="sub2" x="410" y="80" text-anchor="end">l</text><text class="sub2" x="510" y="80" text-anchor="end">chunk's answer</text><text class="sub2" x="640" y="80" text-anchor="end">weight l · e^(m − 5)</text><text class="cap" x="40" y="106" text-anchor="start">chunk A</text><text class="sub2" x="240" y="106" text-anchor="end">3, 2, 1.5</text><text class="sub2" x="330" y="106" text-anchor="end">3</text><text class="sub2" x="410" y="106" text-anchor="end">1.591</text><text class="sub2" x="510" y="106" text-anchor="end">15.12</text><text class="sub2" x="640" y="106" text-anchor="end">0.2153</text><text class="cap" x="40" y="134" text-anchor="start">chunk B</text><text class="sub2" x="240" y="134" text-anchor="end">5, 4, 1</text><text class="sub2" x="330" y="134" text-anchor="end">5</text><text class="sub2" x="410" y="134" text-anchor="end">1.386</text><text class="sub2" x="510" y="134" text-anchor="end">42.92</text><text class="sub2" x="640" y="134" text-anchor="end">1.3862</text><g class="u"><rect x="40" y="168" width="600" height="34" rx="6"/><text class="sub" x="340.0" y="185.0" text-anchor="middle" dominant-baseline="central">shares: 0.2153 ÷ 1.6015 = 0.134   and   1.3862 ÷ 1.6015 = 0.866</text></g><g class="s"><rect x="40" y="212" width="600" height="34" rx="6"/><text class="sub" x="340.0" y="229.0" text-anchor="middle" dominant-baseline="central">merged: 0.134 × 15.12 + 0.866 × 42.92 = 39.18, the whole row's answer</text></g><text class="sub2" x="40" y="272" text-anchor="start">a plain average, (15.12 + 42.92) ÷ 2 = 29.02: wrong, because chunk B's scores are larger</text><text class="cap" x="40" y="314" text-anchor="start">Each chunk reports its maximum m, its sum of exponentials l, and its own answer, already</text><text class="cap" x="40" y="334" text-anchor="start">divided by its own l. The global maximum is 5. Chunk A's sum was taken against 3, so it</text><text class="cap" x="40" y="354" text-anchor="start">is moved onto the common scale by e^(3 − 5) = 0.1353: 1.591 × 0.1353 = 0.2153. Chunk B's</text><text class="cap" x="40" y="374" text-anchor="start">already is. Each chunk's share of the whole row is its weight over the total.</text><text class="cap" x="40" y="414" text-anchor="start">The shares weight the two answers, and the result is 39.18, exactly what the full row</text><text class="cap" x="40" y="434" text-anchor="start">gave in Part 7. The correction is the one the online softmax applies down a row; here it</text><text class="cap" x="40" y="454" text-anchor="start">is applied once, to chunks that ran at the same time. Flash-Decoding stores each chunk's</text><text class="cap" x="40" y="474" text-anchor="start">m + ln l as one number, 3.464 and 5.327, which gives the same shares.</text></svg><figcaption>Two numbers per chunk are enough to merge exactly. That is why the split costs only a small second kernel, and why the answer does not change.</figcaption></figure>
