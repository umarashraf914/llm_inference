<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 7:09</div><h3>Subtracting the maximum, on one row of scores</h3><svg viewBox='0 0 680 540' role='img'><title>Subtracting the maximum, on one row of scores</title><text class="hd" x="40" y="46">One row of three scores, the obvious way and the safe way</text><text class="sub2" x="40" y="84" text-anchor="start">score x</text><text class="sub2" x="176" y="84" text-anchor="end">e^x</text><text class="sub2" x="290" y="84" text-anchor="end">in FP16</text><text class="sub2" x="430" y="84" text-anchor="end">e^(x − 12)</text><text class="sub2" x="530" y="84" text-anchor="end">shifted weight</text><text class="sub2" x="640" y="84" text-anchor="end">exact weight</text><text class="cap" x="40" y="108" text-anchor="start">8</text><text class="sub2" x="176" y="108" text-anchor="end">2,981</text><text class="sub2" x="290" y="108" text-anchor="end">2,980</text><text class="sub2" x="430" y="108" text-anchor="end">0.0183</text><text class="sub2" x="530" y="108" text-anchor="end">0.0159</text><text class="sub2" x="640" y="108" text-anchor="end">0.0159</text><text class="cap" x="40" y="134" text-anchor="start">10</text><text class="sub2" x="176" y="134" text-anchor="end">22,026</text><text class="sub2" x="290" y="134" text-anchor="end">22,032</text><text class="sub2" x="430" y="134" text-anchor="end">0.1353</text><text class="sub2" x="530" y="134" text-anchor="end">0.1173</text><text class="sub2" x="640" y="134" text-anchor="end">0.1173</text><text class="cap" x="40" y="160" text-anchor="start">12</text><text class="sub2" x="176" y="160" text-anchor="end">162,755</text><text class="sub2" x="290" y="160" text-anchor="end">infinity</text><text class="sub2" x="430" y="160" text-anchor="end">1.0000</text><text class="sub2" x="530" y="160" text-anchor="end">0.8668</text><text class="sub2" x="640" y="160" text-anchor="end">0.8668</text><line class="tick" x1="110.0" y1="174.0" x2="640.0" y2="174.0"/><text class="cap" x="40" y="196" text-anchor="start">total</text><text class="sub2" x="176" y="196" text-anchor="end">187,762</text><text class="sub2" x="290" y="196" text-anchor="end">infinity</text><text class="sub2" x="430" y="196" text-anchor="end">1.1537</text><text class="sub2" x="530" y="196" text-anchor="end">1</text><text class="sub2" x="640" y="196" text-anchor="end">1</text><g class="u"><rect x="40" y="222" width="600" height="36" rx="6"/><text class="sub" x="340.0" y="240.0" text-anchor="middle" dominant-baseline="central">e^(x − 12)  =  e^x × e^(−12):  every term, top and bottom, carries the same e^(−12)</text></g><text class="cap" x="40" y="290" text-anchor="start">The obvious way exponentiates the scores as they are. e¹² is 162,755, past FP16's</text><text class="cap" x="40" y="310" text-anchor="start">65,504, so it becomes infinity, the total becomes infinity, and the weights come out as</text><text class="cap" x="40" y="330" text-anchor="start">2,980 ÷ infinity = 0 and infinity ÷ infinity, which is not a number at all.</text><text class="cap" x="40" y="370" text-anchor="start">The safe way first subtracts the row's largest score, 12. The exponents become −4, −2</text><text class="cap" x="40" y="390" text-anchor="start">and 0, every exponential lies between 0 and 1, and nothing can overflow. The weights it</text><text class="cap" x="40" y="410" text-anchor="start">gives are the exact ones, the last column, computed in full precision.</text><text class="cap" x="40" y="450" text-anchor="start">Why they agree: each shifted term is the original times e^(−12). The weight is a term</text><text class="cap" x="40" y="470" text-anchor="start">divided by the total, and the total is also multiplied by e^(−12), so the factor</text><text class="cap" x="40" y="490" text-anchor="start">cancels. Done in FP16 itself, the safe way gives 0.0159, 0.117 and 0.867: the same</text><text class="cap" x="40" y="510" text-anchor="start">weights, to the three digits FP16 carries.</text></svg><figcaption>A shift that changes no weight and removes every overflow: whatever the scores were, every exponential now lands between 0 and 1.</figcaption></figure>
