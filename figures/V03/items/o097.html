<figure><div class='ts'>Fig 97 &nbsp;&middot;&nbsp; 43:57</div><h3>What recording and replaying means</h3><svg viewBox='0 0 680 416' role='img'><title>What recording and replaying means</title><text class="hd" x="40" y="46">Record once, replay many times</text><text class="cap" x="40" y="92" text-anchor="start">Every step</text><g class="s"><rect x="200" y="76" width="26" height="30" rx="2"/></g><rect x="228" y="76" width="26" height="30" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="262" y="76" width="26" height="30" rx="2"/></g><rect x="290" y="76" width="26" height="30" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="324" y="76" width="26" height="30" rx="2"/></g><rect x="352" y="76" width="26" height="30" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="386" y="76" width="26" height="30" rx="2"/></g><rect x="414" y="76" width="26" height="30" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="448" y="76" width="26" height="30" rx="2"/></g><rect x="476" y="76" width="26" height="30" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="510" y="76" width="26" height="30" rx="2"/></g><rect x="538" y="76" width="26" height="30" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="572" y="76" width="26" height="30" rx="2"/></g><rect x="600" y="76" width="26" height="30" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="200" y="132" text-anchor="start">solid is GPU work, dashed is the CPU talking to the driver</text><text class="cap" x="40" y="192" text-anchor="start">After recording</text><g class="h"><rect x="200" y="176" width="26" height="30" rx="2"/></g><g class="s"><rect x="230" y="176" width="26" height="30" rx="2"/></g><g class="s"><rect x="260" y="176" width="26" height="30" rx="2"/></g><g class="s"><rect x="290" y="176" width="26" height="30" rx="2"/></g><g class="s"><rect x="320" y="176" width="26" height="30" rx="2"/></g><g class="s"><rect x="350" y="176" width="26" height="30" rx="2"/></g><g class="s"><rect x="380" y="176" width="26" height="30" rx="2"/></g><g class="s"><rect x="410" y="176" width="26" height="30" rx="2"/></g><text class="sub2" x="200" y="232" text-anchor="start">one call replays the whole recorded sequence</text><text class="cap" x="40" y="282" text-anchor="start">The sequence of launches is captured once as a unit and afterwards submitted with a single</text><text class="cap" x="40" y="302" text-anchor="start">call, so the per-launch bookkeeping happens once instead of hundreds of times.</text><text class="cap" x="40" y="338" text-anchor="start">The condition is that the replayed sequence must touch the same memory addresses every time,</text><text class="cap" x="40" y="358" text-anchor="start">which sits awkwardly with a cache whose blocks move around.</text><text class="cap" x="40" y="394" text-anchor="start">Serving systems therefore lay out fixed buffers for decode so the recording stays valid.</text></svg><figcaption>A fix for overhead rather than for computation. The constraint it imposes on memory layout is why it interacts with paged caches at all.</figcaption></figure>
