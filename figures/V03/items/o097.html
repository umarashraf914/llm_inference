<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 45:25</div><h3>What recording and replaying means</h3><svg viewBox='0 0 680 474' role='img'><title>What recording and replaying means</title><text class="hd" x="40" y="46">The same five kernels, launched one by one and replayed as a graph (schematic)</text><text class="cap" x="40" y="84" text-anchor="start">every launch</text><text class="sub2" x="40" y="100" text-anchor="start">paid each time</text><g class="h"><rect x="210.0" y="66" width="38.0" height="14" rx="2"/></g><g class="s"><rect x="250.0" y="84" width="14.0" height="14" rx="2"/></g><g class="h"><rect x="250.0" y="66" width="38.0" height="14" rx="2"/></g><g class="s"><rect x="290.0" y="84" width="14.0" height="14" rx="2"/></g><g class="h"><rect x="290.0" y="66" width="38.0" height="14" rx="2"/></g><g class="s"><rect x="330.0" y="84" width="14.0" height="14" rx="2"/></g><g class="h"><rect x="330.0" y="66" width="38.0" height="14" rx="2"/></g><g class="s"><rect x="370.0" y="84" width="14.0" height="14" rx="2"/></g><g class="h"><rect x="370.0" y="66" width="38.0" height="14" rx="2"/></g><g class="s"><rect x="410.0" y="84" width="14.0" height="14" rx="2"/></g><text class="sub2" x="434.0" y="96" text-anchor="start">done at 27 µs</text><text class="cap" x="40" y="144" text-anchor="start">one replay</text><text class="sub2" x="40" y="160" text-anchor="start">the graph, launched once</text><g class="h"><rect x="210" y="126" width="38.0" height="14" rx="2"/></g><g class="s"><rect x="250.0" y="144" width="14.0" height="14" rx="2"/></g><g class="s"><rect x="266.0" y="144" width="14.0" height="14" rx="2"/></g><g class="s"><rect x="282.0" y="144" width="14.0" height="14" rx="2"/></g><g class="s"><rect x="298.0" y="144" width="14.0" height="14" rx="2"/></g><g class="s"><rect x="314.0" y="144" width="14.0" height="14" rx="2"/></g><text class="sub2" x="338.0" y="156" text-anchor="start">done at 15 µs</text><g class="h"><rect x="40" y="190" width="12" height="12" rx="3"/></g><text class="sub2" x="58" y="200" text-anchor="start">CPU launching</text><g class="s"><rect x="170" y="190" width="12" height="12" rx="3"/></g><text class="sub2" x="188" y="200" text-anchor="start">GPU computing</text><text class="cap" x="40" y="244" text-anchor="start">CUDA graphs pay that overhead once instead of per kernel. During a warm-up step the</text><text class="cap" x="40" y="264" text-anchor="start">runtime records the entire launch sequence into a graph object. From then on a single</text><text class="cap" x="40" y="284" text-anchor="start">call replays the whole graph, and hundreds of kernels are dispatched for the price of</text><text class="cap" x="40" y="304" text-anchor="start">one launch.</text><text class="cap" x="40" y="344" text-anchor="start">The one constraint is that a replayed graph must touch the same memory addresses every</text><text class="cap" x="40" y="364" text-anchor="start">time. That is awkward for a paged cache whose blocks are allocated as requests grow, so</text><text class="cap" x="40" y="384" text-anchor="start">serving systems lay out fixed buffers to keep their decode graphs replayable.</text><text class="cap" x="40" y="424" text-anchor="start">Prefill runs a few large kernels and gains little. Decode at small batch gains the most,</text><text class="cap" x="40" y="444" text-anchor="start">which is why the major serving systems all replay their decode steps this way.</text></svg><figcaption>A fix for overhead rather than for computation: the kernels, and every operation in them, are exactly the same.</figcaption></figure>
