<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 44:18</div><h3>One token takes hundreds of launches</h3><svg viewBox='0 0 680 476' role='img'><title>One token takes hundreds of launches</title><text class="hd" x="40" y="46">One layer's kernels, in order (a typical list; models differ)</text><g class="u"><rect x="40" y="62" width="114" height="30" rx="3"/><text class="sub" x="97.0" y="77.0" text-anchor="middle" dominant-baseline="central">normalise</text></g><g class="s"><rect x="160" y="62" width="114" height="30" rx="3"/><text class="sub" x="217.0" y="77.0" text-anchor="middle" dominant-baseline="central">make Q, K, V</text></g><g class="u"><rect x="280" y="62" width="114" height="30" rx="3"/><text class="sub" x="337.0" y="77.0" text-anchor="middle" dominant-baseline="central">rotate Q, K</text></g><g class="s"><rect x="400" y="62" width="114" height="30" rx="3"/><text class="sub" x="457.0" y="77.0" text-anchor="middle" dominant-baseline="central">attention</text></g><g class="s"><rect x="520" y="62" width="114" height="30" rx="3"/><text class="sub" x="577.0" y="77.0" text-anchor="middle" dominant-baseline="central">combine heads</text></g><g class="u"><rect x="40" y="102" width="114" height="30" rx="3"/><text class="sub" x="97.0" y="117.0" text-anchor="middle" dominant-baseline="central">add</text></g><g class="u"><rect x="160" y="102" width="114" height="30" rx="3"/><text class="sub" x="217.0" y="117.0" text-anchor="middle" dominant-baseline="central">normalise</text></g><g class="s"><rect x="280" y="102" width="114" height="30" rx="3"/><text class="sub" x="337.0" y="117.0" text-anchor="middle" dominant-baseline="central">feed-forward 1</text></g><g class="s"><rect x="400" y="102" width="114" height="30" rx="3"/><text class="sub" x="457.0" y="117.0" text-anchor="middle" dominant-baseline="central">feed-forward 2</text></g><g class="u"><rect x="520" y="102" width="114" height="30" rx="3"/><text class="sub" x="577.0" y="117.0" text-anchor="middle" dominant-baseline="central">add</text></g><text class="sub2" x="40" y="154" text-anchor="start">teal: attention and the big matrix multiplies;  grey: the small steps between</text><text class="hd" x="40" y="186">× 32 layers: one generated token</text><g class="u"><rect x="40.0" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="58.75" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="77.5" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="96.25" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="115.0" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="133.75" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="152.5" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="171.25" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="190.0" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="208.75" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="227.5" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="246.25" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="265.0" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="283.75" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="302.5" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="321.25" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="340.0" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="358.75" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="377.5" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="396.25" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="415.0" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="433.75" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="452.5" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="471.25" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="490.0" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="508.75" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="527.5" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="546.25" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="565.0" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="583.75" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="602.5" y="200" width="16.5" height="26" rx="2"/></g><g class="u"><rect x="621.25" y="200" width="16.5" height="26" rx="2"/></g><text class="sub2" x="40" y="246" text-anchor="start">32 layers × 10 kernels = 320 launches</text><text class="sub2" x="640" y="246" text-anchor="end">at 3 to 5 µs each: about 1.0 to 1.6 ms of CPU time</text><text class="cap" x="40" y="286" text-anchor="start">Producing a single token at batch size one runs a long chain of small kernels. Each</text><text class="cap" x="40" y="306" text-anchor="start">layer launches a handful: one makes the queries, keys and values, one applies the</text><text class="cap" x="40" y="326" text-anchor="start">position rotation, one runs attention, one combines the heads' outputs, two do the</text><text class="cap" x="40" y="346" text-anchor="start">feed-forward network's big multiplies, and a few more do the small add-and-normalise</text><text class="cap" x="40" y="366" text-anchor="start">steps between them. About ten per layer.</text><text class="cap" x="40" y="406" text-anchor="start">Across a 32-layer model that is some 320 kernel launches for every generated token, and</text><text class="cap" x="40" y="426" text-anchor="start">each costs the CPU a few microseconds of bookkeeping: at 3 to 5 µs each, 1.0 to 1.6 ms</text><text class="cap" x="40" y="446" text-anchor="start">of work per token before the GPU has computed anything.</text></svg><figcaption>Counts and times are illustrative: real models fuse some of these steps and split others. Hundreds per token is the order of magnitude that matters.</figcaption></figure>
