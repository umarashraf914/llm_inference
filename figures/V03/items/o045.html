<figure><div class='ts'>Fig 45 &nbsp;&middot;&nbsp; 10:50</div><h3>Embedding turns IDs into activations</h3><svg viewBox="0 0 680 236" role="img"><title>Step 1 — embedding turns IDs into activations</title><g class="s"><rect x="50" y="60" width="150" height="62" rx="8"></rect><text class="lbl" x="125.0" y="82.0" text-anchor="middle" dominant-baseline="central">200 token IDs</text><text class="sub" x="125.0" y="100.0" text-anchor="middle" dominant-baseline="central">800 bytes</text></g><line class="conn" x1="206" y1="91" x2="250" y2="91" marker-end="url(#arw)"></line><g class="h"><rect x="256" y="60" width="170" height="62" rx="8"></rect><text class="lbl" x="341.0" y="82.0" text-anchor="middle" dominant-baseline="central">embedding table</text><text class="sub" x="341.0" y="100.0" text-anchor="middle" dominant-baseline="central">read from HBM</text></g><line class="conn" x1="432" y1="91" x2="476" y2="91" marker-end="url(#arw)"></line><g class="m"><rect x="482" y="60" width="158" height="62" rx="8"></rect><text class="lbl" x="561.0" y="82.0" text-anchor="middle" dominant-baseline="central">X</text><text class="sub" x="561.0" y="100.0" text-anchor="middle" dominant-baseline="central">200 x 4096, 1.6 MB</text></g><text class="cap" x="40" y="172" text-anchor="start">X is the activation matrix: one row per token, 4096 numbers wide. At 1.6 MB it is far too big</text><text class="cap" x="40" y="192" text-anchor="start">for SRAM, so it lives in HBM and is streamed in blocks by whichever kernel needs it.</text><text class="cap" x="40" y="220" text-anchor="start">This X is the input to layer 1.</text></svg><figcaption>Everything from here is a loop over 32 layers, and X is what passes between them.</figcaption></figure>
