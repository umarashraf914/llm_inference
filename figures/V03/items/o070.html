<figure><div class='ts'>Fig 70 &nbsp;&middot;&nbsp; 19:03</div><h3>Why splitting Q rather than K</h3><svg viewBox='0 0 680 416' role='img'><title>Why splitting Q rather than K</title><text class="hd" x="40" y="46">Split one way and the groups must talk; split the other and they need not</text><text class="cap" x="40" y="92" text-anchor="start">Split K and V</text><g class="h"><rect x="230" y="76" width="68" height="30" rx="3"/><text class="sub" x="264.0" y="91.0" text-anchor="middle" dominant-baseline="central">w1</text></g><g class="h"><rect x="308" y="76" width="68" height="30" rx="3"/><text class="sub" x="342.0" y="91.0" text-anchor="middle" dominant-baseline="central">w2</text></g><g class="h"><rect x="386" y="76" width="68" height="30" rx="3"/><text class="sub" x="420.0" y="91.0" text-anchor="middle" dominant-baseline="central">w3</text></g><g class="h"><rect x="464" y="76" width="68" height="30" rx="3"/><text class="sub" x="498.0" y="91.0" text-anchor="middle" dominant-baseline="central">w4</text></g><text class="sub2" x="230" y="132" text-anchor="start">each warp has part of every row's answer, so they must combine</text><text class="cap" x="40" y="192" text-anchor="start">Split Q instead</text><g class="s"><rect x="230" y="176" width="68" height="30" rx="3"/><text class="sub" x="264.0" y="191.0" text-anchor="middle" dominant-baseline="central">w1</text></g><g class="s"><rect x="308" y="176" width="68" height="30" rx="3"/><text class="sub" x="342.0" y="191.0" text-anchor="middle" dominant-baseline="central">w2</text></g><g class="s"><rect x="386" y="176" width="68" height="30" rx="3"/><text class="sub" x="420.0" y="191.0" text-anchor="middle" dominant-baseline="central">w3</text></g><g class="s"><rect x="464" y="176" width="68" height="30" rx="3"/><text class="sub" x="498.0" y="191.0" text-anchor="middle" dominant-baseline="central">w4</text></g><text class="sub2" x="230" y="232" text-anchor="start">each warp owns whole rows and finishes them alone</text><text class="cap" x="40" y="282" text-anchor="start">A row's softmax has to be normalised over the whole row. If four warps each hold a quarter of</text><text class="cap" x="40" y="302" text-anchor="start">a row, they must exchange partial sums through shared memory and wait for each other.</text><text class="cap" x="40" y="338" text-anchor="start">Give each warp entire rows and there is nothing to exchange. The rows were already independent;</text><text class="cap" x="40" y="358" text-anchor="start">the first split broke that independence and the second respects it.</text><text class="cap" x="40" y="394" text-anchor="start">No arithmetic changed. Only which warp was given which piece.</text></svg><figcaption>Rows are independent, established back in Part 3. Any decomposition that cuts across a row manufactures a need to communicate that the mathematics never had.</figcaption></figure>
