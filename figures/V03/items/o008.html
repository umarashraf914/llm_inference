<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:47</div><h3>The two tiers that decide everything</h3><svg viewBox='0 0 680 556' role='img'><title>The two tiers that decide everything</title><text class="hd" x="40" y="46">Capacity drawn as area, read rate as length, both to scale</text><g class="h"><rect x="40" y="70" width="250" height="250" rx="2"/></g><text class="lbl" x="165.0" y="187.0" text-anchor="middle">HBM</text><text class="sub" x="165.0" y="207.0" text-anchor="middle">80 GB, beside the die</text><g class="s"><rect x="312" y="315.0931884079374" width="4.90681159206261" height="4.90681159206261" rx="1"/></g><text class="sub2" x="326.9068115920626" y="319.0931884079374" text-anchor="start">all the SRAM on the chip:</text><text class="sub2" x="326.9068115920626" y="335.0931884079374" text-anchor="start">132 × 228 KiB = 30.8 MB</text><text class="sub2" x="330" y="86" text-anchor="start">read rate</text><g class="h"><rect x="330" y="96" width="31.338709677419352" height="24" rx="3"/></g><text class="sub2" x="369.33870967741933" y="113" text-anchor="start">HBM, 3.35 TB/s</text><g class="s"><rect x="330" y="128" width="289.2486193548387" height="24" rx="3"/></g><text class="sub" x="338" y="145" text-anchor="start">SRAM, about 31 TB/s across the chip</text><text class="cap" x="40" y="366" text-anchor="start">The square is the 80 GB of high-bandwidth memory stacked beside the GPU die. The dot</text><text class="cap" x="40" y="386" text-anchor="start">beside it is every byte of on-chip SRAM on all 132 multiprocessors added together, 30.8</text><text class="cap" x="40" y="406" text-anchor="start">MB ({{fig:v02-o031}}). The slow tier holds about 2,600 times as much.</text><text class="cap" x="40" y="446" text-anchor="start">The fast tier wins on speed: it sits beside the arithmetic units, and the chip reads it</text><text class="cap" x="40" y="466" text-anchor="start">at about 31 TB/s against HBM's 3.35, roughly 9 times faster.</text><text class="cap" x="40" y="506" text-anchor="start">So the fast tier can never hold the data. It holds only the piece being worked on at</text><text class="cap" x="40" y="526" text-anchor="start">this instant, and choosing that piece is what tiling is (Part 5).</text></svg><figcaption>Drawn to scale, and the dot really is that small: a 2,600-to-1 ratio drawn as area. Vast and slow, or tiny and fast; every technique in this atlas keeps the working piece in the dot.</figcaption></figure>
