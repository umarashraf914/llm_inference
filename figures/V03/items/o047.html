<figure><div class='ts'>Fig 47 &nbsp;&middot;&nbsp; 11:13</div><h3>Why 200 tokens already does not fit</h3><svg viewBox="0 0 680 318" role="img"><title>Step 3 — why 200 tokens already does not fit</title><text class="hd" x="40" y="46">One attention head wants all of this resident at once</text><g class="h"><rect x="46" y="62" width="85.35000000000001" height="46" rx="3"></rect><text class="sub" x="88.67500000000001" y="85.0" text-anchor="middle" dominant-baseline="central">Q_h</text></g><text class="sub2" x="88.67500000000001" y="124" text-anchor="middle">50 KB</text><g class="h"><rect x="131.35000000000002" y="62" width="85.35000000000001" height="46" rx="3"></rect><text class="sub" x="174.02500000000003" y="85.0" text-anchor="middle" dominant-baseline="central">K_h</text></g><text class="sub2" x="174.02500000000003" y="124" text-anchor="middle">50 KB</text><g class="h"><rect x="216.70000000000005" y="62" width="85.35000000000001" height="46" rx="3"></rect><text class="sub" x="259.37500000000006" y="85.0" text-anchor="middle" dominant-baseline="central">V_h</text></g><text class="sub2" x="259.37500000000006" y="124" text-anchor="middle">50 KB</text><g class="m"><rect x="302.05000000000007" y="62" width="133.14600000000002" height="46" rx="3"></rect><text class="sub" x="368.62300000000005" y="85.0" text-anchor="middle" dominant-baseline="central">S</text></g><text class="sub2" x="368.62300000000005" y="124" text-anchor="middle">78 KB</text><g class="h"><rect x="435.1960000000001" y="62" width="170.70000000000002" height="46" rx="3"></rect><text class="sub" x="520.546" y="85.0" text-anchor="middle" dominant-baseline="central">O_h</text></g><text class="sub2" x="520.546" y="124" text-anchor="middle">100 KB</text><text class="hd" x="40" y="160" text-anchor="start">328 KB in total</text><g class="s"><rect x="46" y="178" width="389.196" height="30" rx="3"></rect><text class="sub" x="240.598" y="193.0" text-anchor="middle" dominant-baseline="central">228 KB of SRAM</text></g><text class="sub2" x="445.196" y="197" text-anchor="start">the budget</text><text class="cap" x="40" y="248" text-anchor="start">It overflows by a hundred kilobytes, at a prompt length people actually type. This is</text><text class="cap" x="40" y="268" text-anchor="start">the situation tiling exists for.</text><text class="cap" x="40" y="296" text-anchor="start">Note what pushes it over: the score matrix and the FP32 output accumulator, not Q, K and V.</text></svg><figcaption>Both bars drawn to the same scale. The top bar is what one head wants; the bottom bar is what it gets.</figcaption></figure>
