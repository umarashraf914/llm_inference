<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:26</div><h3>Why the naive kernel is expensive</h3><svg viewBox='0 0 680 456' role='img'><title>Why the naive kernel is expensive</title><text class="hd" x="40" y="46">Three kernels, and every hand-off between them goes through HBM</text><g class="h"><rect x="40" y="64" width="600" height="36" rx="3"/><text class="sub" x="340.0" y="82.0" text-anchor="middle" dominant-baseline="central">HBM: S and P are parked here, 134 MB each for one head at 8,192 tokens</text></g><g class="m"><rect x="40" y="170" width="170" height="52" rx="8"/><text class="lbl" x="125.0" y="187.0" text-anchor="middle" dominant-baseline="central">kernel 1</text><text class="sub" x="125.0" y="205.0" text-anchor="middle" dominant-baseline="central">S = Q Kᵀ, the scores</text></g><g class="m"><rect x="255" y="170" width="170" height="52" rx="8"/><text class="lbl" x="340.0" y="187.0" text-anchor="middle" dominant-baseline="central">kernel 2</text><text class="sub" x="340.0" y="205.0" text-anchor="middle" dominant-baseline="central">softmax, row by row</text></g><g class="m"><rect x="470" y="170" width="170" height="52" rx="8"/><text class="lbl" x="555.0" y="187.0" text-anchor="middle" dominant-baseline="central">kernel 3</text><text class="sub" x="555.0" y="205.0" text-anchor="middle" dominant-baseline="central">P × V</text></g><line class="conn" x1="100" y1="166" x2="100" y2="104" marker-end="url(#arw)"/><text class="sub2" x="108" y="140" text-anchor="start">writes S</text><line class="conn" x1="300" y1="104" x2="300" y2="166" marker-end="url(#arw)"/><text class="sub2" x="308" y="124" text-anchor="start">reads S</text><line class="conn" x1="380" y1="166" x2="380" y2="104" marker-end="url(#arw)"/><text class="sub2" x="388" y="152" text-anchor="start">writes P</text><line class="conn" x1="530" y1="104" x2="530" y2="166" marker-end="url(#arw)"/><text class="sub2" x="538" y="140" text-anchor="start">reads P</text><line class="conn" x1="232.5" y1="170.0" x2="232.5" y2="226.0" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3"/><line class="conn" x1="447.5" y1="170.0" x2="447.5" y2="226.0" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3"/><text class="sub2" x="40" y="250" text-anchor="start">on chip: lost the moment each kernel ends</text><text class="cap" x="40" y="286" text-anchor="start">When a kernel finishes, its multiprocessors are handed to the next one and everything in</text><text class="cap" x="40" y="306" text-anchor="start">their registers and shared memory is gone. Only what was written to HBM survives, so</text><text class="cap" x="40" y="326" text-anchor="start">each boundary forces a full round trip through main memory, whether or not the</text><text class="cap" x="40" y="346" text-anchor="start">mathematics wanted one ({{fig:v03-o005}}).</text><text class="cap" x="40" y="386" text-anchor="start">Written as three kernels, attention parks two full n × n matrices in HBM: the scores S</text><text class="cap" x="40" y="406" text-anchor="start">and the weights P, each written once and read once. The arithmetic suits the tensor</text><text class="cap" x="40" y="426" text-anchor="start">cores perfectly; the traffic grows as n² while the work done per byte does not.</text></svg><figcaption>The kernel is not badly written. It is correctly written against a cost model that stopped being the right one: its cost is set by where the boundaries fall, not by the arithmetic.</figcaption></figure>
