<figure><div class='ts'>Fig 64 &nbsp;&middot;&nbsp; 16:00</div><h3>Solving one bottleneck reveals the next</h3><svg viewBox='0 0 680 366' role='img'><title>Solving one bottleneck reveals the next</title><text class="hd" x="40" y="46">What the first version left on the table</text><text class="cap" x="40" y="92" text-anchor="start">Memory traffic</text><g class="s"><rect x="280" y="76" width="340" height="30" rx="3"/><text class="sub" x="450.0" y="91.0" text-anchor="middle" dominant-baseline="central">solved</text></g><text class="cap" x="40" y="152" text-anchor="start">Fraction of the chip's arithmetic used</text><g class="h"><rect x="280" y="136" width="130" height="30" rx="3"/><text class="sub" x="345.0" y="151.0" text-anchor="middle" dominant-baseline="central">25 to 40%</text></g><rect x="280" y="136" width="340" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="cap" x="40" y="212" text-anchor="start">The stated problem was fixed and the kernel still spent most of its time not computing. So</text><text class="cap" x="40" y="232" text-anchor="start">something else was in the way.</text><text class="cap" x="40" y="268" text-anchor="start">Three somethings, as it turns out, and none of them memory: work done on the wrong units,</text><text class="cap" x="40" y="288" text-anchor="start">not enough independent pieces to fill the chip, and groups waiting on each other.</text><text class="cap" x="40" y="324" text-anchor="start">Each is diagnosed and removed in the next part. This pattern, where solving the stated</text><text class="cap" x="40" y="344" text-anchor="start">bottleneck reveals the next one, repeats through the rest of the video.</text></svg><figcaption>Worth expecting rather than being surprised by. A system has a bottleneck at all times; removing one promotes another.</figcaption></figure>
