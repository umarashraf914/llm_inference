<figure><div class='ts'>Fig 79 &nbsp;&middot;&nbsp; 25:57</div><h3>Two ways around the exponential</h3><svg viewBox="0 0 680 398" role="img"><title>Two ways around the exponential</title><text class="cap" x="40" y="78" text-anchor="start">Exponentials per cycle</text><g class="h"><rect x="280" y="62" width="6" height="32" rx="1"></rect></g><text class="sub2" x="296" y="81" text-anchor="start">16</text><text class="cap" x="40" y="138" text-anchor="start">Tensor core operations</text><g class="s"><rect x="280" y="122" width="340" height="32" rx="3"></rect></g><text class="sub2" x="280" y="182" text-anchor="start">8,192</text><text class="cap" x="40" y="226" text-anchor="start">A gap of 512 times. Softmax needs one exponential per score, so on a wide enough tile the</text><text class="cap" x="40" y="246" text-anchor="start">special-function unit cannot keep up with the matmul feeding it.</text><text class="cap" x="40" y="286" text-anchor="start">The fix is a second path: approximate the exponential with a short polynomial evaluated on</text><text class="cap" x="40" y="306" text-anchor="start">the ordinary CUDA cores, which are otherwise idle, and split the work between the two.</text><text class="cap" x="40" y="336" text-anchor="start">A second change reduces how often rescaling happens at all. Instead of correcting whenever the</text><text class="cap" x="40" y="356" text-anchor="start">running maximum moves, the kernel tolerates drift up to a threshold, which cuts the number of</text><text class="cap" x="40" y="376" text-anchor="start">rescales by roughly ten times.</text></svg><figcaption>Both changes follow from the previous figure. Once you know which unit is saturated, the optimisations pick themselves.</figcaption></figure>
