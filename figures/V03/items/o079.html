<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 26:15</div><h3>At head dimension 128, the exponentials take as long as the matrix multiplies</h3><svg viewBox='0 0 680 616' role='img'><title>At head dimension 128, the exponentials take as long as the matrix multiplies</title><text class="hd" x="40" y="46">Cycles on one multiprocessor for a 128 × 128 tile of scores, head dimension 128</text><text class="cap" x="40" y="85" text-anchor="start">H100</text><text class="sub2" x="100" y="85" text-anchor="start">matrix multiplies</text><g class="s"><rect x="250" y="68" width="400.0" height="24" rx="3"/><text class="sub" x="450.0" y="80.0" text-anchor="middle" dominant-baseline="central">2,048</text></g><text class="sub2" x="100" y="117" text-anchor="start">exponentials</text><g class="m"><rect x="250" y="100" width="200.0" height="24" rx="3"/><text class="sub" x="350.0" y="112.0" text-anchor="middle" dominant-baseline="central">1,024</text></g><text class="cap" x="40" y="161" text-anchor="start">B200</text><text class="sub2" x="100" y="161" text-anchor="start">matrix multiplies</text><g class="s"><rect x="250" y="144" width="200.0" height="24" rx="3"/><text class="sub" x="350.0" y="156.0" text-anchor="middle" dominant-baseline="central">1,024</text></g><text class="sub2" x="100" y="193" text-anchor="start">exponentials</text><g class="m"><rect x="250" y="176" width="200.0" height="24" rx="3"/><text class="sub" x="350.0" y="188.0" text-anchor="middle" dominant-baseline="central">1,024</text></g><text class="sub2" x="100" y="225" text-anchor="start">shared-memory reads</text><g class="u"><rect x="250" y="208" width="150.0" height="24" rx="3"/><text class="sub" x="325.0" y="220.0" text-anchor="middle" dominant-baseline="central">768</text></g><g class="u"><rect x="40" y="254" width="600" height="36" rx="6"/><text class="sub" x="340.0" y="272.0" text-anchor="middle" dominant-baseline="central">per score: 1 exponential, and 4d = 512 tensor-core operations;   B200 per clock: 8,192 ÷ 16 = 512</text></g><text class="cap" x="40" y="326" text-anchor="start">Every score needs one exponential, plus its share of the two matrix multiplies: 2d</text><text class="cap" x="40" y="346" text-anchor="start">operations for its entry of S = QKᵀ and 2d more when its weight multiplies a row of V.</text><text class="cap" x="40" y="366" text-anchor="start">At head dimension 128 that is 512 operations, and 512 is exactly the B200's ratio: 8,192</text><text class="cap" x="40" y="386" text-anchor="start">tensor-core operations per clock per multiprocessor against 16 exponentials.</text><text class="cap" x="40" y="426" text-anchor="start">So on the B200 the exponentials take as long as both matrix multiplies, 1,024 cycles</text><text class="cap" x="40" y="446" text-anchor="start">each for this tile. On the H100 the same tile took 2,048 cycles of multiplies, and the</text><text class="cap" x="40" y="466" text-anchor="start">exponentials' 1,024 hid inside them ({{fig:v03-p21}}). The tile's size cancels out: the ratio</text><text class="cap" x="40" y="486" text-anchor="start">is d/128 for any tile, so the head dimension sets it, and at d = 64 the exponentials</text><text class="cap" x="40" y="506" text-anchor="start">would take twice as long as the multiplies.</text><text class="cap" x="40" y="546" text-anchor="start">With no slack left, everything else the softmax does lands on the critical path. Version</text><text class="cap" x="40" y="566" text-anchor="start">4 answers twice: it computes some exponentials another way, with a polynomial on</text><text class="cap" x="40" y="586" text-anchor="start">otherwise idle cores, and it skips most rescales.</text></svg><figcaption>Bars to scale. Cycle counts from version 4's own roofline (its Table 1); the H100 rows use the H100's 4,096 operations per clock. Shared memory is left out for the H100, whose smaller tiles read their operands differently.</figcaption></figure>
