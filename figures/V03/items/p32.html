<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 31:16</div><h3>A reservation sized for the longest answer is 95% empty when the answer is short</h3><svg viewBox='0 0 680 616' role='img'><title>A reservation sized for the longest answer is 95% empty when the answer is short</title><text class="hd" x="40" y="46">One request's reservation: 4,096 token slots, 64 to a row</text><g class="u"><rect x="40" y="66" width="320" height="320" rx="2"/></g><g class="s"><rect x="40" y="66" width="320" height="15" rx="1"/></g><g class="s"><rect x="40" y="81" width="40" height="5" rx="1"/></g><text class="cap" x="400" y="84" text-anchor="start">4,096 slots reserved, one contiguous run</text><g class="s"><rect x="400" y="104" width="14" height="14" rx="3"/></g><text class="sub2" x="422" y="116" text-anchor="start">200 hold tokens: 4.9%</text><g class="u"><rect x="400" y="130" width="14" height="14" rx="3"/></g><text class="sub2" x="422" y="142" text-anchor="start">3,896 sit empty: 95.1%</text><text class="cap" x="400" y="184" text-anchor="start">at 128 KiB of cache per token</text><text class="sub2" x="400" y="204" text-anchor="start">537 MB held</text><text class="sub2" x="400" y="222" text-anchor="start">for 26 MB of keys and values</text><text class="cap" x="40" y="426" text-anchor="start">A serving system cannot know in advance how long a response will run, so the systems</text><text class="cap" x="40" y="446" text-anchor="start">before 2023 played it safe: each request got one contiguous stretch of HBM, sized for</text><text class="cap" x="40" y="466" text-anchor="start">the longest sequence it might reach. With a limit of 4,096 tokens and a response that</text><text class="cap" x="40" y="486" text-anchor="start">stops at 200, the other 3,896 slots, 95.1% of the reservation, sit reserved and empty</text><text class="cap" x="40" y="506" text-anchor="start">until the request finishes.</text><text class="cap" x="40" y="546" text-anchor="start">On the Llama 3 8B shape of Part 6, 128 KiB of keys and values per token, that is 537 MB</text><text class="cap" x="40" y="566" text-anchor="start">held for 26 MB of cache. Waste inside a reservation like this is called internal</text><text class="cap" x="40" y="586" text-anchor="start">fragmentation.</text></svg><figcaption>Areas to scale: the square is the reservation, the teal strip the 200 tokens actually generated.</figcaption></figure>
