<figure><div class='ts'>Fig 74 &nbsp;&middot;&nbsp; 21:49</div><h3>What a producer-consumer pipeline is</h3><svg viewBox='0 0 680 404' role='img'><title>What a producer-consumer pipeline is</title><text class="hd" x="40" y="46">Producer and consumer, with a buffer between</text><g class="h"><rect x="40" y="76" width="170" height="44" rx="6"/><text class="sub" x="125.0" y="98.0" text-anchor="middle" dominant-baseline="central">producers</text></g><text class="sub2" x="40" y="138" text-anchor="start">warps that only fetch</text><line class="conn" x1="216" y1="98" x2="246" y2="98" marker-end="url(#arw)"/><g class="u"><rect x="252" y="76" width="170" height="44" rx="6"/><text class="sub" x="337.0" y="98.0" text-anchor="middle" dominant-baseline="central">a shared buffer</text></g><line class="conn" x1="428" y1="98" x2="458" y2="98" marker-end="url(#arw)"/><g class="m"><rect x="464" y="76" width="176" height="44" rx="6"/><text class="sub" x="552.0" y="98.0" text-anchor="middle" dominant-baseline="central">consumers</text></g><text class="sub2" x="464" y="138" text-anchor="start">warps that only compute</text><text class="cap" x="40" y="194" text-anchor="start">The producers keep the buffer full. The consumers take from it and never wait for memory,</text><text class="cap" x="40" y="214" text-anchor="start">because somebody else already fetched what they need.</text><text class="cap" x="40" y="250" text-anchor="start">The same arrangement as a kitchen with someone prepping and someone cooking. Neither waits for</text><text class="cap" x="40" y="270" text-anchor="start">the other as long as the buffer never empties.</text><text class="cap" x="40" y="306" text-anchor="start">This is warp specialisation: warps inside one block taking different roles rather than all</text><text class="cap" x="40" y="326" text-anchor="start">doing the same thing.</text><text class="cap" x="40" y="362" text-anchor="start">It is a scheduling idea, not a mathematical one, which is where kernel work starts to look</text><text class="cap" x="40" y="382" text-anchor="start">like systems programming rather than numerics.</text></svg><figcaption>A pattern from operating systems, applied inside a single kernel. The buffer is what decouples the two roles.</figcaption></figure>
