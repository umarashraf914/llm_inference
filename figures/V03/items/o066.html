<figure><div class='ts'>Fig 66 &nbsp;&middot;&nbsp; 16:42</div><h3>Wait one: scalar work between matmuls</h3><svg viewBox="0 0 680 270" role="img"><title>Wait one: scalar work between matmuls</title><g class="h"><rect x="40" y="55" width="280" height="78" rx="8"></rect><text class="lbl" x="180.0" y="77.0" text-anchor="middle" dominant-baseline="central">Softmax bookkeeping</text><text class="sub" x="180.0" y="95.0" text-anchor="middle" dominant-baseline="central">runs on the CUDA cores,</text><text class="sub" x="180.0" y="112.0" text-anchor="middle" dominant-baseline="central">not the tensor cores</text></g><line class="conn" x1="326" y1="94" x2="356" y2="94" marker-end="url(#arw)"></line><g class="s"><rect x="362" y="55" width="278" height="78" rx="8"></rect><text class="lbl" x="501.0" y="85.0" text-anchor="middle" dominant-baseline="central">Divide once at the end</text><text class="sub" x="501.0" y="103.0" text-anchor="middle" dominant-baseline="central">the output rides through unnormalised</text></g><text class="cap" x="40" y="178" text-anchor="start">On an A100 the tensor cores reach 312 TFLOP/s and the scalar units 19.5. A 16-fold gap, so</text><text class="cap" x="40" y="198" text-anchor="start">every scalar operation interleaved between matmuls stalls the expensive units.</text><text class="cap" x="40" y="228" text-anchor="start">The fix is to notice the denominator divides the whole row, so it can be applied once at the</text><text class="cap" x="40" y="248" text-anchor="start">very end rather than after every tile.</text></svg><figcaption>Not a memory problem at all. The chip has two kinds of arithmetic unit and only one of them is fast.</figcaption></figure>
