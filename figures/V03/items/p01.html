<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:37</div><h3>One line of PyTorch is one kernel launch</h3><svg viewBox='0 0 680 645' role='img'><title>One line of PyTorch is one kernel launch</title><text class="hd" x="40" y="46">Each line hands the GPU one kernel, launched as a grid of thread blocks</text><g class="u"><rect x="40" y="80" width="190" height="56" rx="8"/><text class="lbl" x="135.0" y="99.0" text-anchor="middle" dominant-baseline="central">C = A @ B</text><text class="sub" x="135.0" y="117.0" text-anchor="middle" dominant-baseline="central">A, B: 4,096 × 4,096</text></g><line class="conn" x1="236" y1="108" x2="266" y2="108" marker-end="url(#arw)"/><g class="m"><rect x="272" y="74" width="191" height="191" rx="2"/></g><line class="xok" x1="277.5" y1="74" x2="277.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="79.5" x2="463" y2="79.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="283.5" y1="74" x2="283.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="85.5" x2="463" y2="85.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="289.5" y1="74" x2="289.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="91.5" x2="463" y2="91.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="295.5" y1="74" x2="295.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="97.5" x2="463" y2="97.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="301.5" y1="74" x2="301.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="103.5" x2="463" y2="103.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="307.5" y1="74" x2="307.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="109.5" x2="463" y2="109.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="313.5" y1="74" x2="313.5" y2="265" stroke="var(--paper)" stroke-width 3" y2="175.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="379.5" y1="74" x2="379.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="181.5" x2="463" y2="181.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="385.5" y1="74" x2="385.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="187.5" x2="463" y2="187.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="391.5" y1="74" x2="391.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="193.5" x2="463" y2="193.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="397.5" y1="74" x2="397.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="199.5" x2="463" y2="199.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="403.5" y1="74" x2="403.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="205.5" x2="463" y2="205.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="409.5" y1="74" x2="409.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="211.5" x2="463" y2="211.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="415.5" y1="74" x2="415.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="217.5" x2="463" y2="217.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="421.5" y1="74" x2="421.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="223.5" x2="463" y2="223.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="427.5" y1="74" x2="427.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="229.5" x2="463" y2="229.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="433.5" y1="74" x2="433.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="235.5" x2="463" y2="235.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="439.5" y1="74" x2="439.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="241.5" x2="463" y2="241.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="445.5" y1="74" x2="445.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="247.5" x2="463" y2="247.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="451.5" y1="74" x2="451.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="253.5" x2="463" y2="253.5" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="457.5" y1="74" x2="457.5" y2="265" stroke="var(--paper)" stroke-width="1"/><line class="xok" x1="272" y1="259.5" x2="463" y2="259.5" stroke="var(--paper)" stroke-width="1"/><text class="sub2" x="482" y="96" text-anchor="start">one launch</text><text class="sub2" x="482" y="116" text-anchor="start">32 × 32 = 1,024 blocks</text><text class="sub2" x="482" y="136" text-anchor="start">each block computes one</text><text class="sub2" x="482" y="156" text-anchor="start">128 × 128 tile of C, with</text><text class="sub2" x="482" y="176" text-anchor="start">256 threads: 262,144 in all</text><g class="u"><rect x="40" y="295" width="190" height="56" rx="8"/><text class="lbl" x="135.0" y="314.0" text-anchor="middle" dominant-baseline="central">P = softmax(S)</text><text class="sub" x="135.0" y="332.0" text-anchor="middle" dominant-baseline="central">the next line</text></g><line class="conn" x1="236" y1="323" x2="266" y2="323" marker-end="url(#arw)"/><rect x="272" y="295" width="190" height="56" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="367.0" y="323.0" text-anchor="middle" dominant-baseline="central">a second launch, its own grid</text><text class="cap" x="40" y="395" text-anchor="start">PyTorch does not do the arithmetic itself. Each operation hands the GPU a kernel, a</text><text class="cap" x="40" y="415" text-anchor="start">program written in advance for that one job, and launches it as a grid of thread blocks</text><text class="cap" x="40" y="435" text-anchor="start">({{fig:v03-o004}}).</text><text class="cap" x="40" y="475" text-anchor="start">Multiplying two 4,096 × 4,096 matrices produces 16.8 million outputs. A typical matrix-</text><text class="cap" x="40" y="495" text-anchor="start">multiply kernel gives each thread block one 128 × 128 tile of them, so the grid is 32 ×</text><text class="cap" x="40" y="515" text-anchor="start">32 = 1,024 blocks. At 256 threads a block that is 262,144 threads, close to the 270,336</text><text class="cap" x="40" y="535" text-anchor="start">an H100 can hold at once ({{fig:v02-o044}}).</text><text class="cap" x="40" y="575" text-anchor="start">The tile and block sizes are the author's choices, and other kernels choose differently.</text><text class="cap" x="40" y="595" text-anchor="start">What does not change is the shape of it: one line, one launch, and the next line is a</text><text class="cap" x="40" y="615" text-anchor="start">separate launch with its own grid.</text></svg><figcaption>Every technique in this atlas changes what happens inside one of these grids, or how many of them are launched.</figcaption></figure>
