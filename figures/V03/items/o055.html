<figure><div class='ts'>Fig 55 &nbsp;&middot;&nbsp; 12:11</div><h3>The recurrence</h3><svg viewBox="0 0 680 476" role="img"><title>The recurrence</title><text class="hd" x="40" y="46">Carry two running numbers per row</text><g class="s"><rect x="60" y="66" width="250" height="60" rx="8"></rect><text class="lbl" x="185.0" y="87.0" text-anchor="middle" dominant-baseline="central">m</text><text class="sub" x="185.0" y="105.0" text-anchor="middle" dominant-baseline="central">the largest score seen so far</text></g><g class="s"><rect x="360" y="66" width="250" height="60" rx="8"></rect><text class="lbl" x="485.0" y="87.0" text-anchor="middle" dominant-baseline="central">l</text><text class="sub" x="485.0" y="105.0" text-anchor="middle" dominant-baseline="central">the running denominator</text></g><text class="hd" x="40" y="168">When a new tile arrives</text><g class="u"><rect x="60" y="186" width="550" height="42" rx="6"></rect><text class="sub" x="335.0" y="207.0" text-anchor="middle" dominant-baseline="central">m_new = max(m_old, max of tile)</text></g><g class="m"><rect x="60" y="240" width="550" height="42" rx="6"></rect><text class="sub" x="335.0" y="261.0" text-anchor="middle" dominant-baseline="central">correction = exp(m_old - m_new)</text></g><g class="s"><rect x="60" y="294" width="550" height="42" rx="6"></rect><text class="sub" x="335.0" y="315.0" text-anchor="middle" dominant-baseline="central">l = l x correction + sum of exp(tile - m_new)</text></g><g class="s"><rect x="60" y="348" width="550" height="42" rx="6"></rect><text class="sub" x="335.0" y="369.0" text-anchor="middle" dominant-baseline="central">O = O x correction + (exp(tile - m_new)) V</text></g><text class="cap" x="40" y="434" text-anchor="start">Four lines. Everything already accumulated was scaled by the old maximum, so multiplying it by</text><text class="cap" x="40" y="454" text-anchor="start">one correction factor brings it onto the new one.</text></svg><figcaption>The denominator and the output carry the same correction, which is why they stay consistent with each other at every step.</figcaption></figure>
