<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 14:00</div><h3>The recurrence</h3><svg viewBox='0 0 680 492' role='img'><title>The recurrence</title><text class="hd" x="40" y="46">Per row: a running maximum m, a running sum l, a running output O</text><text class="cap" x="40" y="87" text-anchor="start">when a tile arrives</text><g class="u"><rect x="190" y="66" width="450" height="32" rx="6"/><text class="sub" x="415.0" y="82.0" text-anchor="middle" dominant-baseline="central">m_new  =  max( m,  the tile's largest score )</text></g><g class="u"><rect x="190" y="108" width="450" height="32" rx="6"/><text class="sub" x="415.0" y="124.0" text-anchor="middle" dominant-baseline="central">c  =  e^(m − m_new)        the correction, 1 if the maximum did not move</text></g><g class="u"><rect x="190" y="150" width="450" height="32" rx="6"/><text class="sub" x="415.0" y="166.0" text-anchor="middle" dominant-baseline="central">l  =  l × c  +  sum of e^(score − m_new) over the tile</text></g><g class="u"><rect x="190" y="192" width="450" height="32" rx="6"/><text class="sub" x="415.0" y="208.0" text-anchor="middle" dominant-baseline="central">O  =  O × c  +  sum of e^(score − m_new) × value over the tile</text></g><text class="cap" x="40" y="255" text-anchor="start">after the last tile</text><g class="m"><rect x="190" y="234" width="450" height="32" rx="6"/><text class="sub" x="415.0" y="250.0" text-anchor="middle" dominant-baseline="central">answer  =  O ÷ l</text></g><text class="cap" x="40" y="302" text-anchor="start">The worked row in general form. Everything already accumulated was made against the old</text><text class="cap" x="40" y="322" text-anchor="start">maximum, so one correction factor moves it onto the new one; the tile's own terms are</text><text class="cap" x="40" y="342" text-anchor="start">then added. Start with m at minus infinity and l and O at zero, and the first tile</text><text class="cap" x="40" y="362" text-anchor="start">simply fills them.</text><text class="cap" x="40" y="402" text-anchor="start">Written this way the output stays unnormalised until the end. The first version of</text><text class="cap" x="40" y="422" text-anchor="start">FlashAttention instead divided O by l after every tile, so that O was always a finished</text><text class="cap" x="40" y="442" text-anchor="start">average; the arithmetic is the same plus one division per tile, which version 2 removed</text><text class="cap" x="40" y="462" text-anchor="start">(Part 9).</text></svg><figcaption>Four lines and a division. The denominator and the output carry the same correction, which is why they stay consistent with each other at every step.</figcaption></figure>
