<figure><div class='ts'>Fig 54 &nbsp;&middot;&nbsp; 11:31</div><h3>Why waiting or guessing both fail</h3><svg viewBox='0 0 680 348' role='img'><title>Why waiting or guessing both fail</title><text class="hd" x="40" y="46">Why the maximum cannot simply be found afterwards</text><g class="s"><rect x="40" y="76" width="140" height="36" rx="4"/><text class="sub" x="110.0" y="94.0" text-anchor="middle" dominant-baseline="central">tile 1 arrives</text></g><line class="conn" x1="186" y1="94" x2="206" y2="94" marker-end="url(#arw)"/><g class="h"><rect x="212" y="76" width="200" height="36" rx="4"/><text class="sub" x="312.0" y="94.0" text-anchor="middle" dominant-baseline="central">exponentiate it now?</text></g><line class="conn" x1="418" y1="94" x2="438" y2="94" marker-end="url(#arw)"/><g class="h"><rect x="444" y="76" width="196" height="36" rx="4"/><text class="sub" x="542.0" y="94.0" text-anchor="middle" dominant-baseline="central">tile 2 may hold a bigger score</text></g><text class="cap" x="40" y="158" text-anchor="start">If you exponentiate using the largest value seen so far, and a later tile turns out to contain</text><text class="cap" x="40" y="178" text-anchor="start">something larger, every term already computed used the wrong offset.</text><text class="cap" x="40" y="214" text-anchor="start">Waiting instead means holding the whole row, which is the n-squared object tiling exists to</text><text class="cap" x="40" y="234" text-anchor="start">avoid. Two passes over the row would work, and reintroduce exactly the traffic just removed.</text><text class="cap" x="40" y="270" text-anchor="start">So the choice looks like: be wrong, or be slow.</text><text class="cap" x="40" y="306" text-anchor="start">The way out is to be provisionally right and repair the earlier terms when a larger value</text><text class="cap" x="40" y="326" text-anchor="start">appears, which is what the recurrence does.</text></svg><figcaption>Framing the obstacle as a genuine dilemma first makes the resolution land. It is not an optimisation; it is the only remaining option.</figcaption></figure>
