<figure><div class='ts'>Fig 58 &nbsp;&middot;&nbsp; 12:40</div><h3>Why one multiplication is enough</h3><svg viewBox='0 0 680 444' role='img'><title>Why one multiplication is enough</title><text class="hd" x="40" y="46">Repairing what was already added up</text><text class="cap" x="40" y="92" text-anchor="start">computed with max = 3</text><g class="h"><rect x="300" y="76" width="300" height="30" rx="3"/><text class="sub" x="450.0" y="91.0" text-anchor="middle" dominant-baseline="central">every term too large</text></g><text class="cap" x="40" y="152" text-anchor="start">multiply by exp(3 - 5)</text><g class="m"><rect x="300" y="136" width="300" height="30" rx="3"/><text class="sub" x="450.0" y="151.0" text-anchor="middle" dominant-baseline="central">one multiplication</text></g><text class="cap" x="40" y="212" text-anchor="start">now consistent with max = 5</text><g class="s"><rect x="300" y="196" width="300" height="30" rx="3"/><text class="sub" x="450.0" y="211.0" text-anchor="middle" dominant-baseline="central">exactly correct</text></g><text class="cap" x="40" y="290" text-anchor="start">Every term already accumulated subtracted the same wrong number, so every term is wrong by the</text><text class="cap" x="40" y="310" text-anchor="start">same factor. One multiplication fixes all of them at once.</text><text class="cap" x="40" y="346" text-anchor="start">That shared error is the whole reason this works. Had the terms been wrong by different</text><text class="cap" x="40" y="366" text-anchor="start">amounts, no single correction could repair them.</text><text class="cap" x="40" y="402" text-anchor="start">The output accumulator carries the identical factor, so the numerator and denominator stay in</text><text class="cap" x="40" y="422" text-anchor="start">step and the ratio is right at every intermediate stage, not only at the end.</text></svg><figcaption>The step that turns an impossible-looking constraint into two lines of arithmetic. Everything already accumulated shares one error, so it takes one correction.</figcaption></figure>
