<figure><div class='ts'>Fig 99 &nbsp;&middot;&nbsp; 47:43</div><h3>Exactness is what makes these safe to deploy</h3><svg viewBox='0 0 680 378' role='img'><title>Exactness is what makes these safe to deploy</title><text class="hd" x="40" y="46">What every technique in this video preserved</text><g class="s"><rect x="40" y="76" width="600" height="44" rx="6"/><text class="sub" x="340.0" y="98.0" text-anchor="middle" dominant-baseline="central">the same inputs produce exactly the same outputs</text></g><text class="cap" x="40" y="168" text-anchor="start">Tiling, the online recurrence, recomputation, warp specialisation, paging, splitting and</text><text class="cap" x="40" y="188" text-anchor="start">merging: not one of them changes a single arithmetic result.</text><text class="cap" x="40" y="224" text-anchor="start">They change the route the bytes take, the order the work is done in, and where things are</text><text class="cap" x="40" y="244" text-anchor="start">stored. The function computed is untouched.</text><text class="cap" x="40" y="280" text-anchor="start">Which is why any of them can be switched on for a model already in production without</text><text class="cap" x="40" y="300" text-anchor="start">retesting what it says.</text><text class="cap" x="40" y="336" text-anchor="start">The two exceptions are flagged where they appear: eight-bit storage is a numerical change, and</text><text class="cap" x="40" y="356" text-anchor="start">fewer KV heads is a different model. Everything else is a rearrangement.</text></svg><figcaption>The property that separates a kernel improvement from a model change. It is the reason this video's techniques were adopted so quickly and so widely.</figcaption></figure>
