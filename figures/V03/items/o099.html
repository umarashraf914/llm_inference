<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 47:43</div><h3>Exactness is what makes these safe to deploy</h3><svg viewBox='0 0 680 482' role='img'><title>Exactness is what makes these safe to deploy</title><text class="hd" x="40" y="46">Versions 1 to 4, each in its headline precision, compute one function</text><g class="s"><rect x="40" y="62" width="600" height="38" rx="6"/><text class="sub" x="340.0" y="81.0" text-anchor="middle" dominant-baseline="central">O = softmax(Q Kᵀ ÷ √d) V,  row by row</text></g><g class="u"><rect x="40" y="116" width="144" height="30" rx="3"/><text class="sub" x="112.0" y="131.0" text-anchor="middle" dominant-baseline="central">version 1</text></g><g class="u"><rect x="192" y="116" width="144" height="30" rx="3"/><text class="sub" x="264.0" y="131.0" text-anchor="middle" dominant-baseline="central">version 2</text></g><g class="u"><rect x="344" y="116" width="144" height="30" rx="3"/><text class="sub" x="416.0" y="131.0" text-anchor="middle" dominant-baseline="central">version 3</text></g><g class="u"><rect x="496" y="116" width="144" height="30" rx="3"/><text class="sub" x="568.0" y="131.0" text-anchor="middle" dominant-baseline="central">version 4</text></g><text class="sub2" x="40" y="172" text-anchor="start">identical up to the order in which floating-point sums are added</text><text class="cap" x="40" y="212" text-anchor="start">Four generations of FlashAttention compute exact attention: the same S = QKᵀ, the same</text><text class="cap" x="40" y="232" text-anchor="start">row-wise softmax, the same multiply by V, identical up to the reordering of</text><text class="cap" x="40" y="252" text-anchor="start">floating-point sums ({{fig:v03-p12}}). Across four generations the function never moved.</text><text class="cap" x="40" y="292" text-anchor="start">That is what makes a kernel change safe to deploy. The same inputs give the same</text><text class="cap" x="40" y="312" text-anchor="start">outputs, to the last bits rounding allows, so a better kernel can be switched on under a</text><text class="cap" x="40" y="332" text-anchor="start">model already in production without retesting what the model says.</text><text class="cap" x="40" y="372" text-anchor="start">Version 4's polynomial exponential is an approximation, but one held within a single</text><text class="cap" x="40" y="392" text-anchor="start">BF16 rounding step of the hardware's result on 99% of inputs ({{fig:v03-o080}}), so it</text><text class="cap" x="40" y="412" text-anchor="start">counts with the rounding. FP8 storage, fewer KV heads and latent compression are</text><text class="cap" x="40" y="432" text-anchor="start">different in kind: they change the numbers or the model itself, and their effect on</text><text class="cap" x="40" y="452" text-anchor="start">quality has to be measured.</text></svg><figcaption>The property that separates a kernel improvement from a model change, and the reason the kernel improvements in this atlas spread so quickly.</figcaption></figure>
