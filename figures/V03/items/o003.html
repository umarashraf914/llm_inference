<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:51</div><h3>A ninefold cut in traffic gave a 5.7-fold speed-up</h3><svg viewBox='0 0 680 520' role='img'><title>A ninefold cut in traffic gave a 5.7-fold speed-up</title><text class="hd" x="40" y="46">GPT-2 medium on an A100, attention forward and backward, as measured</text><text class="cap" x="40" y="104" text-anchor="start">HBM traffic</text><g class="h"><rect x="210" y="78" width="340.0" height="22" rx="3"/></g><text class="sub2" x="558.0" y="94" text-anchor="start">40.3 GB</text><text class="sub2" x="198" y="94" text-anchor="end">standard</text><g class="s"><rect x="210" y="108" width="37.12158808933003" height="22" rx="3"/></g><text class="sub2" x="255.12158808933003" y="124" text-anchor="start">4.4 GB</text><text class="sub2" x="198" y="124" text-anchor="end">FlashAttention</text><text class="sub2" x="40" y="126" text-anchor="start">9.2× less</text><text class="cap" x="40" y="188" text-anchor="start">time</text><g class="h"><rect x="210" y="162" width="340.0" height="22" rx="3"/></g><text class="sub2" x="558.0" y="178" text-anchor="start">41.7 ms</text><text class="sub2" x="198" y="178" text-anchor="end">standard</text><g class="s"><rect x="210" y="192" width="59.52038369304556" height="22" rx="3"/></g><text class="sub2" x="277.5203836930456" y="208" text-anchor="start">7.3 ms</text><text class="sub2" x="198" y="208" text-anchor="end">FlashAttention</text><text class="sub2" x="40" y="210" text-anchor="start">5.7× faster</text><text class="cap" x="40" y="272" text-anchor="start">arithmetic</text><g class="h"><rect x="210" y="246" width="301.11702127659566" height="22" rx="3"/></g><text class="sub2" x="519.1170212765957" y="262" text-anchor="start">66.6 GFLOP</text><text class="sub2" x="198" y="262" text-anchor="end">standard</text><g class="s"><rect x="210" y="276" width="340.0" height="22" rx="3"/></g><text class="sub2" x="558.0" y="292" text-anchor="start">75.2 GFLOP</text><text class="sub2" x="198" y="292" text-anchor="end">FlashAttention</text><text class="sub2" x="40" y="294" text-anchor="start">13% more</text><text class="cap" x="40" y="350" text-anchor="start">Both kernels compute the same attention. The fused one moves about a ninth of the bytes,</text><text class="cap" x="40" y="370" text-anchor="start">and finishes in under a fifth of the time. It even does 13% more arithmetic, because its</text><text class="cap" x="40" y="390" text-anchor="start">backward pass rebuilds the score matrix instead of storing it (Part 8).</text><text class="cap" x="40" y="430" text-anchor="start">A 9.2-fold cut in traffic gave a 5.7-fold cut in time, not 9.2: only the time spent</text><text class="cap" x="40" y="450" text-anchor="start">waiting on memory can be removed, and the rest of the step, the arithmetic and the</text><text class="cap" x="40" y="470" text-anchor="start">launches, stays. The up to 7.6 times quoted for GPT-2 is the same paper's measurement of</text><text class="cap" x="40" y="490" text-anchor="start">the attention computation alone.</text></svg><figcaption>Each pair is drawn to its own scale. The lesson to carry: removing a bottleneck gives back what the bottleneck was costing, and no more, and less arithmetic was never the reason.</figcaption></figure>
