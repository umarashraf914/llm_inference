<figure><div class='ts'>Fig 03 &nbsp;&middot;&nbsp; 0:42</div><h3>Why a 135-fold saving gives 7.6 times</h3><svg viewBox='0 0 680 392' role='img'><title>Why a 135-fold saving gives 7.6 times</title><text class="hd" x="40" y="46">Where the 7.6 times actually comes from</text><text class="cap" x="40" y="92" text-anchor="start">Bytes moved, naive</text><g class="h"><rect x="280" y="76" width="340" height="30" rx="3"/><text class="sub" x="450.0" y="91.0" text-anchor="middle" dominant-baseline="central">about 540 MB</text></g><text class="cap" x="40" y="152" text-anchor="start">Bytes moved, tiled</text><g class="s"><rect x="280" y="136" width="3" height="30" rx="1"/></g><text class="sub2" x="294" y="155" text-anchor="start">about 4 MB</text><text class="cap" x="40" y="212" text-anchor="start">Wall-clock speed-up</text><g class="m"><rect x="280" y="196" width="200" height="30" rx="3"/><text class="sub" x="380.0" y="211.0" text-anchor="middle" dominant-baseline="central">7.6x</text></g><text class="cap" x="40" y="274" text-anchor="start">A hundred and thirty-five times less traffic, and only seven and a half times faster. The gap</text><text class="cap" x="40" y="294" text-anchor="start">is everything that was never about memory: the arithmetic itself, the launches, the parts of</text><text class="cap" x="40" y="314" text-anchor="start">the model that were already efficient.</text><text class="cap" x="40" y="350" text-anchor="start">Removing a bottleneck gives you back what the bottleneck was costing, and no more. That is why</text><text class="cap" x="40" y="370" text-anchor="start">the video's next question is what the new bottleneck is.</text></svg><figcaption>A useful check on any optimisation claim: a large improvement in one resource turns into a smaller improvement overall, bounded by how much of the time that resource was costing.</figcaption></figure>
