<figure><div class='ts'>Fig 16 &nbsp;&middot;&nbsp; 5:12</div><h3>Q, K and V are computed, not fetched</h3><svg viewBox="0 0 680 300" role="img"><title>Q, K and V are computed, not fetched</title><g class="u"><rect x="40" y="36" width="600" height="190" rx="14"></rect><text class="lbl" x="62" y="62">Inside one layer</text><text class="sub" x="62" y="80">this happens 32 times, once per layer</text></g><g class="m"><rect x="66" y="96" width="130" height="62" rx="8"></rect><text class="lbl" x="131.0" y="118.0" text-anchor="middle" dominant-baseline="central">X</text><text class="sub" x="131.0" y="136.0" text-anchor="middle" dominant-baseline="central">2 rows of 4096</text></g><g class="h"><rect x="238" y="96" width="150" height="62" rx="8"></rect><text class="lbl" x="313.0" y="118.0" text-anchor="middle" dominant-baseline="central">W_Q, W_K, W_V</text><text class="sub" x="313.0" y="136.0" text-anchor="middle" dominant-baseline="central">read from HBM</text></g><g class="s"><rect x="430" y="96" width="184" height="62" rx="8"></rect><text class="lbl" x="522.0" y="118.0" text-anchor="middle" dominant-baseline="central">Q, K, V</text><text class="sub" x="522.0" y="136.0" text-anchor="middle" dominant-baseline="central">2 rows each</text></g><line class="conn" x1="200" y1="127" x2="234" y2="127" marker-end="url(#arw)"></line><line class="conn" x1="392" y1="127" x2="426" y2="127" marker-end="url(#arw)"></line><text class="sub2" x="66" y="190" text-anchor="start">the layer's input activations, times its weights, gives Q, K and V</text><text class="cap" x="40" y="258" text-anchor="start">What HBM holds is the weight matrices. Q, K and V are the product of a matrix multiply,</text><text class="cap" x="40" y="278" text-anchor="start">produced on chip. They were never sitting in memory waiting to be fetched.</text></svg><figcaption>This is the correction that unlocks the rest. Q, K and V are outputs, not inputs.</figcaption></figure>
