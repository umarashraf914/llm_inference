<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 24:27</div><h3>Making FP8 attention numerically safe</h3><svg viewBox='0 0 680 542' role='img'><title>Making FP8 attention numerically safe</title><text class="hd" x="40" y="46">Error against an exact reference: FlashAttention 3's own test, FP8</text><text class="cap" x="40" y="84" text-anchor="start">per-tensor scale, no rotation</text><g class="h"><rect x="250" y="68" width="380.0" height="24" rx="3"/><text class="sub" x="440.0" y="80.0" text-anchor="middle" dominant-baseline="central">24.0 × 10⁻³</text></g><text class="cap" x="40" y="118" text-anchor="start">version 3: block scales and rotation</text><g class="s"><rect x="250" y="102" width="144.08333333333334" height="24" rx="3"/><text class="sub" x="322.0416666666667" y="114.0" text-anchor="middle" dominant-baseline="central">9.1 × 10⁻³</text></g><text class="cap" x="40" y="152" text-anchor="start">without the block scales</text><g class="s"><rect x="250" y="136" width="147.24999999999997" height="24" rx="3"/><text class="sub" x="323.625" y="148.0" text-anchor="middle" dominant-baseline="central">9.3 × 10⁻³</text></g><text class="cap" x="40" y="186" text-anchor="start">without the rotation</text><g class="h"><rect x="250" y="170" width="380.0" height="24" rx="3"/><text class="sub" x="440.0" y="182.0" text-anchor="middle" dominant-baseline="central">24.0 × 10⁻³</text></g><text class="hd" x="40" y="230">Speed on an H100</text><text class="cap" x="40" y="254" text-anchor="start">FP16, against version 2</text><text class="sub2" x="250" y="254" text-anchor="start">1.5 to 2.0 times faster</text><text class="cap" x="40" y="278" text-anchor="start">FP16, best case</text><text class="sub2" x="250" y="278" text-anchor="start">740 trillion a second: 75% of peak</text><text class="cap" x="40" y="302" text-anchor="start">FP8</text><text class="sub2" x="250" y="302" text-anchor="start">close to 1.2 quadrillion a second</text><text class="cap" x="40" y="352" text-anchor="start">The paper filled Q, K and V with ordinary numbers plus, in one entry in a thousand, an</text><text class="cap" x="40" y="372" text-anchor="start">extra one ten times larger, and measured the root-mean-square error of the attention</text><text class="cap" x="40" y="392" text-anchor="start">output against a 64-bit reference. With one scale per tensor and no rotation the error</text><text class="cap" x="40" y="412" text-anchor="start">was 2.4 × 10⁻²; with both fixes, 9.1 × 10⁻³, 2.6 times lower.</text><text class="cap" x="40" y="452" text-anchor="start">Its ablation says which fix did the work in that test: dropping the block scales barely</text><text class="cap" x="40" y="472" text-anchor="start">moved the error, while dropping the rotation put it straight back to the baseline. In 16</text><text class="cap" x="40" y="492" text-anchor="start">bits, version 3 runs 1.5 to 2.0 times faster than version 2 and reaches 740 trillion</text><text class="cap" x="40" y="512" text-anchor="start">operations a second; in FP8 it climbs close to 1.2 quadrillion.</text></svg><figcaption>Bars to scale. Measured by the authors on their own test distribution: the 2.6 is the honest headline, and the ablation is the more useful number.</figcaption></figure>
