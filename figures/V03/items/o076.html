<figure><div class='ts'>Fig 76 &nbsp;&middot;&nbsp; 22:52</div><h3>Making FP8 attention numerically safe</h3><svg viewBox="0 0 680 368" role="img"><title>Making FP8 attention numerically safe</title><text class="hd" x="40" y="46">Transformer values: a tight cluster and a few extremes</text><line class="axis" x1="50" y1="150" x2="630" y2="150"></line><g class="s"><rect x="90" y="128" width="11" height="22" rx="1"></rect></g><g class="s"><rect x="105" y="95" width="11" height="55" rx="1"></rect></g><g class="s"><rect x="118" y="62" width="11" height="88" rx="1"></rect></g><g class="s"><rect x="131" y="50" width="11" height="100" rx="1"></rect></g><g class="s"><rect x="144" y="74" width="11" height="76" rx="1"></rect></g><g class="s"><rect x="158" y="110" width="11" height="40" rx="1"></rect></g><g class="s"><rect x="172" y="132" width="11" height="18" rx="1"></rect></g><g class="h"><rect x="520" y="138" width="9" height="12" rx="1"></rect></g><g class="h"><rect x="575" y="142" width="9" height="8" rx="1"></rect></g><text class="cap" x="40" y="196" text-anchor="start">An 8-bit format has 256 levels. One shared scale must stretch to the largest value, so if the</text><text class="cap" x="40" y="216" text-anchor="start">extremes are a hundred times the typical value, almost everything lands on the first tick or</text><text class="cap" x="40" y="236" text-anchor="start">two and most of the format is wasted.</text><text class="cap" x="40" y="276" text-anchor="start">Two fixes together: a separate scale per block rather than per tensor, and a random rotation</text><text class="cap" x="40" y="296" text-anchor="start">applied to Q and K that spreads each outlier thinly across all channels.</text><text class="cap" x="40" y="326" text-anchor="start">The rotation cancels inside Q K transpose, so the scores are unchanged. Numerical error falls</text><text class="cap" x="40" y="346" text-anchor="start">by 2.6 times, and FP8 attention reaches around 1.2 PFLOP/s against 740 TFLOP/s in FP16.</text></svg><figcaption>An orthogonal rotation preserves every dot product, so the outputs are identical while the outlier structure that ruins low-precision formats is destroyed.</figcaption></figure>
