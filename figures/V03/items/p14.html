<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:29</div><h3>Multiply the sum, and every term inside it moves</h3><svg viewBox='0 0 680 440' role='img'><title>Multiply the sum, and every term inside it moves</title><text class="hd" x="40" y="46">The repair, one law at a time</text><g class="u"><rect x="40" y="66" width="600" height="34" rx="6"/><text class="sub" x="340.0" y="83.0" text-anchor="middle" dominant-baseline="central">1.591 × e⁻²  =  (e⁰ + e⁻¹ + e^(−1.5)) × e⁻²</text></g><text class="sub2" x="52" y="124" text-anchor="start">distributive law: c × (a + b + d) = c×a + c×b + c×d</text><g class="u"><rect x="40" y="136" width="600" height="34" rx="6"/><text class="sub" x="340.0" y="153.0" text-anchor="middle" dominant-baseline="central">=  e⁻²  +  e⁻³  +  e^(−3.5)</text></g><text class="sub2" x="52" y="194" text-anchor="start">adding exponents: e^a × e^b = e^(a + b)</text><g class="s"><rect x="40" y="206" width="600" height="34" rx="6"/><text class="sub" x="340.0" y="223.0" text-anchor="middle" dominant-baseline="central">=  0.1353  +  0.0498  +  0.0302  =  0.2153</text></g><text class="cap" x="40" y="270" text-anchor="start">The sum 1.591 was made with the old maximum. Multiplying it by the correction</text><text class="cap" x="40" y="290" text-anchor="start">e^(3 − 5) = 0.135 multiplies each of its three terms by the same factor, because a</text><text class="cap" x="40" y="310" text-anchor="start">factor outside a sum reaches every term inside it. Each term then becomes exactly what</text><text class="cap" x="40" y="330" text-anchor="start">it would have been had the maximum been 5 all along.</text><text class="cap" x="40" y="370" text-anchor="start">So one multiplication repairs the whole sum, 0.2153, without remembering a single one of</text><text class="cap" x="40" y="390" text-anchor="start">the terms that made it. Tile 2's own exponentials, taken against 5, can now be added on</text><text class="cap" x="40" y="410" text-anchor="start">cleanly.</text></svg><figcaption>Two facts from school algebra carry the algorithm: adding exponents multiplies powers, and a factor distributes over a sum. The correction factor here is the 0.135 quoted for this step.</figcaption></figure>
