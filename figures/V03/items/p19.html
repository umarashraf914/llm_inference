<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 19:58</div><h3>Seventy-two percent of a whole training run</h3><svg viewBox='0 0 680 456' role='img'><title>Seventy-two percent of a whole training run</title><text class="hd" x="40" y="46">Fraction of the A100's 312 trillion, drawn to scale</text><text class="cap" x="40" y="89" text-anchor="start">version 1, attention alone</text><rect x="230" y="72" width="380" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><g class="u"><rect x="325.0" y="72" width="57.0" height="24" rx="3"/></g><text class="sub2" x="390.0" y="89" text-anchor="start">25–40%</text><text class="cap" x="40" y="129" text-anchor="start">version 2, attention alone</text><rect x="230" y="112" width="380" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><g class="s"><rect x="420.0" y="112" width="87.39999999999998" height="24" rx="3"/></g><text class="sub2" x="515.4" y="129" text-anchor="start">50–73%</text><text class="cap" x="40" y="169" text-anchor="start">version 2, a whole training run</text><rect x="230" y="152" width="380" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><g class="s"><rect x="230" y="152" width="274.03846153846155" height="24" rx="3"/><text class="sub" x="367.0192307692308" y="164.0" text-anchor="middle" dominant-baseline="central">225 trillion = 72%</text></g><line class="tick" x1="230.0" y1="192.0" x2="230.0" y2="196.0"/><text class="sub2" x="230" y="210" text-anchor="middle">0%</text><line class="tick" x1="420.0" y1="192.0" x2="420.0" y2="196.0"/><text class="sub2" x="420.0" y="210" text-anchor="middle">50%</text><line class="tick" x1="610.0" y1="192.0" x2="610.0" y2="196.0"/><text class="sub2" x="610" y="210" text-anchor="middle">100%</text><text class="cap" x="40" y="246" text-anchor="start">The three rearrangements roughly doubled the number being tracked: 25 to 40% of peak</text><text class="cap" x="40" y="266" text-anchor="start">became 50 to 73% on the A100, for the attention kernel measured on its own.</text><text class="cap" x="40" y="306" text-anchor="start">The cleanest end-to-end test of a kernel is a whole training run, so the headline here</text><text class="cap" x="40" y="326" text-anchor="start">is a training number rather than an inference one. GPT-style models trained at up to 225</text><text class="cap" x="40" y="346" text-anchor="start">trillion operations a second per A100: 225 ÷ 312 = 72%. That figure is the model FLOPs</text><text class="cap" x="40" y="366" text-anchor="start">utilisation: the operations the model needs by its own arithmetic, done per second, as a</text><text class="cap" x="40" y="386" text-anchor="start">fraction of what the hardware could do.</text><text class="cap" x="40" y="426" text-anchor="start">Those are A100 numbers, measured on the chip the kernel was written for.</text></svg><figcaption>Model FLOPs utilisation counts only the arithmetic the model requires, so recomputation and every other overhead count against it. It is the same fraction of peak, measured on a whole run.</figcaption></figure>
