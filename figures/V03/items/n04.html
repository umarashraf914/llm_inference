times faster than FlashAttention without the split</text><text class="cap" x="40" y="344" text-anchor="start">as length grows</text><text class="sub2" x="170" y="344" text-anchor="start">every other implementation slows; this one barely does</text><text class="cap" x="40" y="394" text-anchor="start">Every other attention implementation in the published comparison slows as the context</text><text class="cap" x="40" y="414" text-anchor="start">grows. With Flash-Decoding, sequence length has little impact on generation speed: the</text><text class="cap" x="40" y="434" text-anchor="start">serial walk of {{fig:v03-p40}} is gone, and the decoding gain at the long end, up to 8 times,</text><text class="cap" x="40" y="454" text-anchor="start">rests on an attention operation up to 50 times faster.</text><text class="cap" x="40" y="494" text-anchor="start">The gain concentrates where decode hurt most, at long context and small batch. A large</text><text class="cap" x="40" y="514" text-anchor="start">batch already fills the chip through the batch dimension, by the same block counting:</text><text class="cap" x="40" y="534" text-anchor="start">with 32 heads, a batch of 8 gives 256 blocks, more than the 132 multiprocessors, before</text><text class="cap" x="40" y="554" text-anchor="start">any splitting.</text></svg><figcaption>Flash-Decoding's own write-up makes the block-count argument with the A100's 108 multiprocessors; the H100's 132 change only where the line falls.</figcaption></figure>
