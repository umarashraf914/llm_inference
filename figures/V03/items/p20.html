<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 20:54</div><h3>A warpgroup is four warps issuing one matrix multiply</h3><svg viewBox='0 0 680 562' role='img'><title>A warpgroup is four warps issuing one matrix multiply</title><text class="hd" x="40" y="46">Who issues what, from the whole launch down to one thread</text><g class="u"><rect x="40" y="62" width="600" height="300" rx="14"/><text class="lbl" x="62" y="88">grid: the whole launch, every thread block of one kernel</text></g><g class="u"><rect x="62" y="110" width="556" height="238" rx="14"/><text class="lbl" x="84" y="136">cluster: thread blocks placed on neighbouring multiprocessors</text></g><g class="m"><rect x="84" y="158" width="512" height="176" rx="14"/><text class="lbl" x="106" y="184">thread block: runs on one multiprocessor, shares its SRAM</text></g><g class="s"><rect x="106" y="206" width="468" height="114" rx="14"/><text class="lbl" x="128" y="232">warpgroup: 4 warps, 128 threads, issue one WGMMA together</text></g><g class="s"><rect x="128" y="252" width="100" height="52" rx="8"/><text class="lbl" x="178.0" y="269.0" text-anchor="middle" dominant-baseline="central">warp 1</text><text class="sub" x="178.0" y="287.0" text-anchor="middle" dominant-baseline="central">32 threads</text></g><g class="s"><rect x="238" y="252" width="100" height="52" rx="8"/><text class="lbl" x="288.0" y="269.0" text-anchor="middle" dominant-baseline="central">warp 2</text><text class="sub" x="288.0" y="287.0" text-anchor="middle" dominant-baseline="central">32 threads</text></g><g class="s"><rect x="348" y="252" width="100" height="52" rx="8"/><text class="lbl" x="398.0" y="269.0" text-anchor="middle" dominant-baseline="central">warp 3</text><text class="sub" x="398.0" y="287.0" text-anchor="middle" dominant-baseline="central">32 threads</text></g><g class="s"><rect x="458" y="252" width="100" height="52" rx="8"/><text class="lbl" x="508.0" y="269.0" text-anchor="middle" dominant-baseline="central">warp 4</text><text class="sub" x="508.0" y="287.0" text-anchor="middle" dominant-baseline="central">32 threads</text></g><text class="cap" x="40" y="392" text-anchor="start">Threads run in warps of 32 that move in lockstep ({{fig:v02-o037}}), and a thread block is the</text><text class="cap" x="40" y="412" text-anchor="start">group of warps placed on one multiprocessor ({{fig:v03-o004}}). Hopper adds a level between</text><text class="cap" x="40" y="432" text-anchor="start">them: the warpgroup, four consecutive warps, 128 threads. Its tensor-core instruction,</text><text class="cap" x="40" y="452" text-anchor="start">WGMMA, is issued by a whole warpgroup at once, and it is asynchronous: it starts a</text><text class="cap" x="40" y="472" text-anchor="start">matrix multiply on a tile and lets the warps move on to other work while it runs.</text><text class="cap" x="40" y="512" text-anchor="start">Hopper also groups thread blocks into clusters placed on neighbouring multiprocessors,</text><text class="cap" x="40" y="532" text-anchor="start">which can reach each other's shared memory. Version 4 uses pairs of them (Part 12).</text></svg><figcaption>Nested, because each level really contains the next. The new level matters for one reason: the unit that issues a matrix multiply is now big enough to keep Hopper's tensor cores busy.</figcaption></figure>
