<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 33:38</div><h3>Sharing comes free with the table</h3><svg viewBox='0 0 680 448' role='img'><title>Sharing comes free with the table</title><text class="hd" x="40" y="46">Two requests that begin with the same system prompt (×2: two tables point there)</text><text class="cap" x="40" y="85" text-anchor="start">A's table</text><g class="u"><rect x="140" y="66" width="44" height="28" rx="3"/><text class="sub" x="162.0" y="80.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="u"><rect x="190" y="66" width="44" height="28" rx="3"/><text class="sub" x="212.0" y="80.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="u"><rect x="240" y="66" width="44" height="28" rx="3"/><text class="sub" x="262.0" y="80.0" text-anchor="middle" dominant-baseline="central">8</text></g><g class="s"><rect x="290" y="66" width="44" height="28" rx="3"/><text class="sub" x="312.0" y="80.0" text-anchor="middle" dominant-baseline="central">11</text></g><text class="cap" x="40" y="125" text-anchor="start">B's table</text><g class="u"><rect x="140" y="106" width="44" height="28" rx="3"/><text class="sub" x="162.0" y="120.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="u"><rect x="190" y="106" width="44" height="28" rx="3"/><text class="sub" x="212.0" y="120.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="u"><rect x="240" y="106" width="44" height="28" rx="3"/><text class="sub" x="262.0" y="120.0" text-anchor="middle" dominant-baseline="central">8</text></g><g class="m"><rect x="290" y="106" width="44" height="28" rx="3"/><text class="sub" x="312.0" y="120.0" text-anchor="middle" dominant-baseline="central">13</text></g><text class="sub2" x="350" y="85" text-anchor="start">entries 0 to 2: the shared prompt</text><text class="sub2" x="350" y="125" text-anchor="start">entry 3: where the two part ways</text><text class="cap" x="40" y="187" text-anchor="start">physical blocks</text><g class="u"><rect x="140" y="168" width="86" height="28" rx="3"/><text class="sub" x="183.0" y="182.0" text-anchor="middle" dominant-baseline="central">block 2  ×2</text></g><g class="u"><rect x="232" y="168" width="86" height="28" rx="3"/><text class="sub" x="275.0" y="182.0" text-anchor="middle" dominant-baseline="central">block 5  ×2</text></g><g class="u"><rect x="324" y="168" width="86" height="28" rx="3"/><text class="sub" x="367.0" y="182.0" text-anchor="middle" dominant-baseline="central">block 8  ×2</text></g><g class="s"><rect x="416" y="168" width="86" height="28" rx="3"/><text class="sub" x="459.0" y="182.0" text-anchor="middle" dominant-baseline="central">block 11</text></g><g class="m"><rect x="508" y="168" width="86" height="28" rx="3"/><text class="sub" x="551.0" y="182.0" text-anchor="middle" dominant-baseline="central">block 13</text></g><text class="cap" x="40" y="238" text-anchor="start">Sometimes many sequences begin identically: requests that share a system prompt or a</text><text class="cap" x="40" y="258" text-anchor="start">long instruction preamble. Their tables can point at the same physical blocks for that</text><text class="cap" x="40" y="278" text-anchor="start">shared beginning, here blocks 2, 5 and 8, so it is stored once however many requests use</text><text class="cap" x="40" y="298" text-anchor="start">it.</text><text class="cap" x="40" y="338" text-anchor="start">Nothing has to be copied to make this safe, because a token's keys and values never</text><text class="cap" x="40" y="358" text-anchor="start">change once computed. Each block keeps a count of the tables that point at it, so it is</text><text class="cap" x="40" y="378" text-anchor="start">freed only when the last one lets go, and a shared block is copied only when one</text><text class="cap" x="40" y="398" text-anchor="start">sequence must write into it: the partly filled block where the sequences part ways.</text><text class="cap" x="40" y="418" text-anchor="start">Operating systems call this copy-on-write.</text></svg><figcaption>Immutability is what makes pointing at the same block safe; the count is what makes freeing it safe.</figcaption></figure>
