<figure><div class='ts'>Fig 87 &nbsp;&middot;&nbsp; 32:13</div><h3>Sharing comes free with the table</h3><svg viewBox='0 0 680 400' role='img'><title>Sharing comes free with the table</title><text class="hd" x="40" y="46">What a table of pointers buys, beyond tidiness</text><g class="s"><rect x="40" y="76" width="285" height="40" rx="4"/><text class="sub" x="182.5" y="96.0" text-anchor="middle" dominant-baseline="central">request A's table</text></g><g class="s"><rect x="355" y="76" width="285" height="40" rx="4"/><text class="sub" x="497.5" y="96.0" text-anchor="middle" dominant-baseline="central">request B's table</text></g><line class="conn" x1="182" y1="122" x2="300" y2="152" marker-end="url(#arw)"/><line class="conn" x1="497" y1="122" x2="380" y2="152" marker-end="url(#arw)"/><g class="m"><rect x="240" y="156" width="200" height="40" rx="4"/><text class="sub" x="340.0" y="176.0" text-anchor="middle" dominant-baseline="central">the same physical blocks</text></g><text class="cap" x="40" y="246" text-anchor="start">Two requests that begin with the same text can point at the same blocks. Nothing is copied,</text><text class="cap" x="40" y="266" text-anchor="start">because those blocks can never change: the keys and values for a token are fixed once it has</text><text class="cap" x="40" y="286" text-anchor="start">been processed.</text><text class="cap" x="40" y="322" text-anchor="start">Only the one partly filled block where the two sequences first differ has to be duplicated.</text><text class="cap" x="40" y="358" text-anchor="start">So a shared system prompt is stored once for every user on the machine, and the saving is a</text><text class="cap" x="40" y="378" text-anchor="start">consequence of the table rather than an extra feature.</text></svg><figcaption>The second benefit, and the larger one in production. Immutability is what makes pointing at the same block safe.</figcaption></figure>
