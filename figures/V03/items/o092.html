<figure><div class='ts'>Fig 92 &nbsp;&middot;&nbsp; 36:48</div><h3>Why there is an extra 64</h3><svg viewBox='0 0 680 356' role='img'><title>Why there is an extra 64</title><text class="hd" x="40" y="46">Why position information gets its own channel</text><g class="s"><rect x="40" y="76" width="285" height="82" rx="8"/><text class="lbl" x="182.5" y="100.0" text-anchor="middle" dominant-baseline="central">The compression trick</text><text class="sub" x="182.5" y="118.0" text-anchor="middle" dominant-baseline="central">folds two matrices into one,</text><text class="sub" x="182.5" y="135.0" text-anchor="middle" dominant-baseline="central">so keys are never built</text></g><g class="h"><rect x="355" y="76" width="285" height="82" rx="8"/><text class="lbl" x="497.5" y="100.0" text-anchor="middle" dominant-baseline="central">Position rotation</text><text class="sub" x="497.5" y="118.0" text-anchor="middle" dominant-baseline="central">depends on where the token sits,</text><text class="sub" x="497.5" y="135.0" text-anchor="middle" dominant-baseline="central">so it cannot be folded in</text></g><text class="cap" x="40" y="202" text-anchor="start">The saving works by merging the decompression step into the neighbouring weights ahead of time.</text><text class="cap" x="40" y="222" text-anchor="start">That merge only works if the operations commute, and a position-dependent rotation does not.</text><text class="cap" x="40" y="258" text-anchor="start">So the position-carrying part is split off into a small separate channel, kept uncompressed,</text><text class="cap" x="40" y="278" text-anchor="start">and the rest is folded as intended.</text><text class="cap" x="40" y="314" text-anchor="start">That is why the stored vector is 512 numbers plus a 64-wide companion rather than a single</text><text class="cap" x="40" y="334" text-anchor="start">round number. The extra 64 is the part that could not be merged.</text></svg><figcaption>An oddity in the numbers that turns out to have a precise reason. Position information resists the very trick the rest of the method depends on.</figcaption></figure>
