<figure><div class='ts'>Fig 72 &nbsp;&middot;&nbsp; 20:58</div><h3>What asynchronous means</h3><svg viewBox='0 0 680 422' role='img'><title>What asynchronous means</title><text class="hd" x="40" y="46">Synchronous: ask, then wait</text><g class="m"><rect x="40" y="76" width="130" height="30" rx="3"/><text class="sub" x="105.0" y="91.0" text-anchor="middle" dominant-baseline="central">issue</text></g><g class="h"><rect x="176" y="76" width="300" height="30" rx="3"/><text class="sub" x="326.0" y="91.0" text-anchor="middle" dominant-baseline="central">wait for it to finish</text></g><g class="m"><rect x="482" y="76" width="130" height="30" rx="3"/><text class="sub" x="547.0" y="91.0" text-anchor="middle" dominant-baseline="central">use it</text></g><text class="hd" x="40" y="158">Asynchronous: ask, do something else, collect later</text><g class="m"><rect x="40" y="188" width="130" height="30" rx="3"/><text class="sub" x="105.0" y="203.0" text-anchor="middle" dominant-baseline="central">issue</text></g><g class="s"><rect x="176" y="188" width="300" height="30" rx="3"/><text class="sub" x="326.0" y="203.0" text-anchor="middle" dominant-baseline="central">do other work meanwhile</text></g><g class="m"><rect x="482" y="188" width="130" height="30" rx="3"/><text class="sub" x="547.0" y="203.0" text-anchor="middle" dominant-baseline="central">collect</text></g><text class="cap" x="40" y="268" text-anchor="start">The operation takes the same time either way. What changes is whether the issuing unit stands</text><text class="cap" x="40" y="288" text-anchor="start">idle while it happens.</text><text class="cap" x="40" y="324" text-anchor="start">Both new units on this generation are asynchronous: the copy engine and the matrix multiply</text><text class="cap" x="40" y="344" text-anchor="start">instruction. A kernel written to wait after each one gets none of the benefit.</text><text class="cap" x="40" y="380" text-anchor="start">Which is why a kernel can run relatively worse on newer hardware: the hardware offered an</text><text class="cap" x="40" y="400" text-anchor="start">overlap the code was not written to take.</text></svg><figcaption>The word behind the whole of this part. Asynchronous hardware only helps code that has other work ready to do.</figcaption></figure>
