<figure><div class='ts'>Fig 95 &nbsp;&middot;&nbsp; 43:57</div><h3>What the CPU is doing while the GPU waits</h3><svg viewBox='0 0 680 404' role='img'><title>What the CPU is doing while the GPU waits</title><text class="hd" x="40" y="46">What the CPU does between kernels</text><text class="cap" x="40" y="96" text-anchor="start">check the arguments</text><g class="h"><rect x="280" y="78" width="120" height="30" rx="3"/></g><text class="cap" x="40" y="142" text-anchor="start">talk to the driver</text><g class="h"><rect x="280" y="124" width="140" height="30" rx="3"/></g><text class="cap" x="40" y="188" text-anchor="start">the GPU actually works</text><g class="s"><rect x="280" y="170" width="300" height="30" rx="3"/></g><text class="cap" x="40" y="250" text-anchor="start">A few microseconds each, and a forward pass launches hundreds of kernels. At batch size one</text><text class="cap" x="40" y="270" text-anchor="start">the GPU work per kernel is so small that this bookkeeping becomes a fifth to a third of the</text><text class="cap" x="40" y="290" text-anchor="start">total step.</text><text class="cap" x="40" y="326" text-anchor="start">Nothing is wrong with the GPU. The machine is limited by how fast work can be handed to it.</text><text class="cap" x="40" y="362" text-anchor="start">Proportions are illustrative. The measured share, twenty to thirty percent at batch one, is</text><text class="cap" x="40" y="382" text-anchor="start">not.</text></svg><figcaption>The only figure in this video about the other processor. At small batch it is the one holding everything up.</figcaption></figure>
