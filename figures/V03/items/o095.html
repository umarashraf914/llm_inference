<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 44:54</div><h3>What the CPU is doing while the GPU waits</h3><svg viewBox='0 0 680 376' role='img'><title>What the CPU is doing while the GPU waits</title><text class="hd" x="40" y="46">One launch, from the CPU's side (durations schematic)</text><text class="cap" x="40" y="84" text-anchor="start">CPU</text><g class="h"><rect x="110" y="66" width="146" height="28" rx="3"/><text class="sub" x="183.0" y="80.0" text-anchor="middle" dominant-baseline="central">validate the arguments</text></g><g class="h"><rect x="260" y="66" width="116" height="28" rx="3"/><text class="sub" x="318.0" y="80.0" text-anchor="middle" dominant-baseline="central">queue the work</text></g><g class="h"><rect x="380" y="66" width="136" height="28" rx="3"/><text class="sub" x="448.0" y="80.0" text-anchor="middle" dominant-baseline="central">talk to the driver</text></g><text class="cap" x="40" y="128" text-anchor="start">GPU</text><rect x="110" y="110" width="406" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="313.0" y="124.0" text-anchor="middle" dominant-baseline="central">waiting</text><g class="s"><rect x="520" y="110" width="120" height="28" rx="3"/><text class="sub" x="580.0" y="124.0" text-anchor="middle" dominant-baseline="central">kernel runs</text></g><text class="sub2" x="110" y="166" text-anchor="start">a few microseconds of CPU work, then a few microseconds of GPU work, per kernel</text><text class="cap" x="40" y="206" text-anchor="start">Each launch costs the CPU a few microseconds of bookkeeping: validating the arguments,</text><text class="cap" x="40" y="226" text-anchor="start">queuing the work, talking to the driver. A few microseconds would not normally matter.</text><text class="cap" x="40" y="246" text-anchor="start">But at batch size one the kernels themselves often run for only a few microseconds too,</text><text class="cap" x="40" y="266" text-anchor="start">so the GPU finishes each piece of work and then idles, waiting for the CPU to hand it</text><text class="cap" x="40" y="286" text-anchor="start">the next.</text><text class="cap" x="40" y="326" text-anchor="start">Nothing is wrong with the GPU. The machine is limited by how fast work can be handed to</text><text class="cap" x="40" y="346" text-anchor="start">it, which makes the CPU, for once, the part that sets the pace.</text></svg><figcaption>At small batch the slowest part of producing a token can be the processor that does no arithmetic on it at all.</figcaption></figure>
