<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 19:21</div><h3>A barrier makes every warp wait for the slowest</h3><svg viewBox='0 0 680 574' role='img'><title>A barrier makes every warp wait for the slowest</title><text class="hd" x="40" y="46">Split K: every warp waits at the barrier for the slowest (durations schematic)</text><text class="cap" x="40" y="86" text-anchor="start">warp 1</text><g class="s"><rect x="110.0" y="70" width="233.69230769230768" height="20" rx="2"/></g><rect x="343.7" y="70" width="124.4" height="20" rx="2" fill="none" stroke="var(--h)" stroke-dasharray="3 3"/><g class="h"><rect x="472.07692307692304" y="70" width="109.07692307692315" height="20" rx="2"/></g><text class="cap" x="40" y="116" text-anchor="start">warp 2</text><g class="s"><rect x="110.0" y="100" width="301.53846153846155" height="20" rx="2"/></g><rect x="411.5" y="100" width="56.5" height="20" rx="2" fill="none" stroke="var(--h)" stroke-dasharray="3 3"/><g class="h"><rect x="472.07692307692304" y="100" width="109.07692307692315" height="20" rx="2"/></g><text class="cap" x="40" y="146" text-anchor="start">warp 3</text><g class="s"><rect x="110.0" y="130" width="263.8461538461538" height="20" rx="2"/></g><rect x="373.8" y="130" width="94.2" height="20" rx="2" fill="none" stroke="var(--h)" stroke-dasharray="3 3"/><g class="h"><rect x="472.07692307692304" y="130" width="109.07692307692315" height="20" rx="2"/></g><text class="cap" x="40" y="176" text-anchor="start">warp 4</text><g class="s"><rect x="110.0" y="160" width="358.07692307692304" height="20" rx="2"/></g><g class="h"><rect x="472.07692307692304" y="160" width="109.07692307692315" height="20" rx="2"/></g><line class="xok" x1="470.1" y1="64.0" x2="470.1" y2="194.0" stroke="var(--h)" stroke-width="1.2" stroke-dasharray="4 3"/><text class="sub2" x="470.07692307692304" y="210" text-anchor="middle">barrier</text><text class="sub2" x="110" y="230" text-anchor="start">teal: own share of the work;  dashed: waiting;  red: exchanging partial sums</text><text class="hd" x="40" y="260" text-anchor="start">Split Q: no barrier</text><text class="cap" x="40" y="290" text-anchor="start">warp 1</text><g class="s"><rect x="110.0" y="274" width="233.69230769230768" height="20" rx="2"/></g><text class="sub2" x="351.6923076923077" y="289" text-anchor="start">rows done</text><text class="cap" x="40" y="320" text-anchor="start">warp 2</text><g class="s"><rect x="110.0" y="304" width="301.53846153846155" height="20" rx="2"/></g><text class="sub2" x="419.53846153846155" y="319" text-anchor="start">rows done</text><text class="cap" x="40" y="350" text-anchor="start">warp 3</text><g class="s"><rect x="110.0" y="334" width="263.8461538461538" height="20" rx="2"/></g><text class="sub2" x="381.8461538461538" y="349" text-anchor="start">rows done</text><text class="cap" x="40" y="380" text-anchor="start">warp 4</text><g class="s"><rect x="110.0" y="364" width="358.07692307692304" height="20" rx="2"/></g><text class="sub2" x="476.07692307692304" y="379" text-anchor="start">rows done</text><text class="cap" x="40" y="424" text-anchor="start">A barrier is a point in the code that no warp may pass until every warp in the block has</text><text class="cap" x="40" y="444" text-anchor="start">reached it. Split K needs one: the partial sums can only be added once all four exist.</text><text class="cap" x="40" y="464" text-anchor="start">So every warp's time becomes the slowest warp's time, and then the exchange through</text><text class="cap" x="40" y="484" text-anchor="start">shared memory comes on top.</text><text class="cap" x="40" y="524" text-anchor="start">Split Q needs no barrier for this: each warp's rows are finished when its own work is.</text><text class="cap" x="40" y="544" text-anchor="start">The warps still differ in speed, but nobody waits for anybody.</text></svg><figcaption>Waiting time is the gap between each warp and the slowest one, plus the exchange. Removing the need to exchange removes both.</figcaption></figure>
