h="44" height="34" rx="3"></rect><text class="sub" x="196.0" y="167.0" text-anchor="middle" dominant-baseline="central">22</text></g><g class="m"><rect x="226" y="150" width="44" height="34" rx="3"></rect><text class="sub" x="248.0" y="167.0" text-anchor="middle" dominant-baseline="central">23</text></g><text class="sub2" x="70" y="200" text-anchor="start">K, three rows of four</text><text class="hd" x="300" y="145" text-anchor="start">becomes</text><g class="s"><rect x="400" y="70" width="44" height="34" rx="3"></rect><text class="sub" x="422.0" y="87.0" text-anchor="middle" dominant-baseline="central">00</text></g><g class="s"><rect x="452" y="70" width="44" height="34" rx="3"></rect><text class="sub" x="474.0" y="87.0" text-anchor="middle" dominant-baseline="central">10</text></g><g class="s"><rect x="504" y="70" width="44" height="34" rx="3"></rect><text class="sub" x="526.0" y="87.0" text-anchor="middle" dominant-baseline="central">20</text></g><g class="s"><rect x="400" y="110" width="44" height="34" rx="3"></rect><text class="sub" x="422.0" y="127.0" text-anchor="middle" dominant-baseline="central">01</text></g><g class="s"><rect x="452" y="110" width="44" height="34" rx="3"></rect><text class="sub" x="474.0" y="127.0" text-anchor="middle" dominant-baseline="central">11</text></g><g class="s"><rect x="504" y="110" width="44" height="34" rx="3"></rect><text class="sub" x="526.0" y="127.0" text-anchor="middle" dominant-baseline="central">21</text></g><g class="s"><rect x="400" y="150" width="44" height="34" rx="3"></rect><text class="sub" x="422.0" y="167.0" text-anchor="middle" dominant-baseline="central">02</text></g><g class="s"><rect x="452" y="150" width="44" height="34" rx="3"></rect><text class="sub" x="474.0" y="167.0" text-anchor="middle" dominant-baseline="central">12</text></g><g class="s"><rect x="504" y="150" width="44" height="34" rx="3"></rect><text class="sub" x="526.0" y="167.0" text-anchor="middle" dominant-baseline="central">22</text></g><g class="s"><rect x="400" y="190" width="44" height="34" rx="3"></rect><text class="sub" x="422.0" y="207.0" text-anchor="middle" dominant-baseline="central">03</text></g><g class="s"><rect x="452" y="190" width="44" height="34" rx="3"></rect><text class="sub" x="474.0" y="207.0" text-anchor="middle" dominant-baseline="central">13</text></g><g class="s"><rect x="504" y="190" width="44" height="34" rx="3"></rect><text class="sub" x="526.0" y="207.0" text-anchor="middle" dominant-baseline="central">23</text></g><text class="sub2" x="400" y="250" text-anchor="start">K transpose, four rows of three</text><text class="cap" x="40" y="300" text-anchor="start">Row and column swap places. Nothing is computed and no value changes; the same numbers are</text><text class="cap" x="40" y="320" text-anchor="start">simply read in the other direction.</text><text class="cap" x="40" y="356" text-anchor="start">It appears in Q times K transpose because a dot product needs the two lists laid out head to</text><text class="cap" x="40" y="376" text-anchor="start">head, and the transpose is what turns K's rows into columns so they line up.</text></svg><figcaption>Notation, not arithmetic. Worth naming once so the formula stops looking like it contains a mystery operation.</figcaption></figure>
