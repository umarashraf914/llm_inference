<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 24:07</div><h3>A rotation turns arrows without changing the angle between them</h3><svg viewBox='0 0 680 522' role='img'><title>A rotation turns arrows without changing the angle between them</title><text class="hd" x="40" y="46">Turn both arrows by 30°: lengths, angle and dot product stay put</text><line class="axis" x1="110.0" y1="262.0" x2="342.0" y2="262.0"/><line class="axis" x1="150.0" y1="282.0" x2="150.0" y2="86.0"/><line x1="150" y1="262" x2="246.0" y2="134.0" stroke="var(--u)" stroke-width="2"/><circle cx="246.0" cy="134.0" r="3" fill="var(--paper)" stroke="var(--u)" stroke-width="1.5"/><text class="sub2 halo" x="254" y="128" text-anchor="start">q = (3, 4)</text><line x1="150" y1="262" x2="182.0" y2="198.0" stroke="var(--u)" stroke-width="2"/><circle cx="182.0" cy="198.0" r="3" fill="var(--paper)" stroke="var(--u)" stroke-width="1.5"/><text class="sub2 halo" x="190" y="192" text-anchor="start">k = (1, 2)</text><line x1="150" y1="262" x2="169.1" y2="103.1" stroke="var(--m)" stroke-width="2"/><circle cx="169.1" cy="103.1" r="3" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><text class="sub2 halo" x="161.1384387633061" y="97.14874831559186" text-anchor="end">q turned</text><line x1="150" y1="262" x2="145.7" y2="190.6" stroke="var(--m)" stroke-width="2"/><circle cx="145.7" cy="190.6" r="3" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><text class="sub2 halo" x="137.71281292110206" y="184.57437415779594" text-anchor="end">k turned</text><text class="sub2" x="330" y="92" text-anchor="start">(1, 0) turned by 30° lands on (0.866, 0.500)</text><text class="sub2" x="330" y="116" text-anchor="start">(0, 1) turned by 30° lands on (−0.500, 0.866)</text><text class="sub2" x="330" y="140" text-anchor="start">q turned = 3 × the first + 4 × the second</text><text class="sub2" x="330" y="164" text-anchor="start">            = (0.598, 4.964)</text><text class="sub2" x="330" y="188" text-anchor="start">k turned = 1 × the first + 2 × the second = (−0.134, 2.232)</text><text class="sub2" x="330" y="212" text-anchor="start">before: q · k = 3×1 + 4×2 = 11</text><text class="sub2" x="330" y="236" text-anchor="start">after: 0.598×(−0.134) + 4.964×2.232 = 11.000</text><text class="cap" x="40" y="312" text-anchor="start">A rotation turns every arrow by the same angle about the origin. Where it sends (1, 0)</text><text class="cap" x="40" y="332" text-anchor="start">and (0, 1) says everything: those two landing points, (0.866, 0.5) and (−0.5, 0.866) for</text><text class="cap" x="40" y="352" text-anchor="start">30°, are called the cosine and sine of the angle, and any other arrow lands on the same</text><text class="cap" x="40" y="372" text-anchor="start">mix of them as before. Turned together, two arrows keep their lengths and the angle</text><text class="cap" x="40" y="392" text-anchor="start">between them, so their dot product, 11 here, does not change.</text><text class="cap" x="40" y="432" text-anchor="start">A score is a dot product of a row of Q with a row of K. Multiply every row of both by</text><text class="cap" x="40" y="452" text-anchor="start">the same rotation M and every score is unchanged: (QM)(KM)ᵀ = QKᵀ. In matrix language</text><text class="cap" x="40" y="472" text-anchor="start">that is M Mᵀ = I, the identity, and a matrix with that property is called orthogonal. In</text><text class="cap" x="40" y="492" text-anchor="start">128 dimensions there are far more ways to turn, but the arithmetic is the same.</text></svg><figcaption>The licence for the trick: the attention scores cannot tell whether Q and K were rotated. What the rotation does change is how each vector's size is shared among its coordinates.</figcaption></figure>
