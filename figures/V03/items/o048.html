<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:13</div><h3>Picking a block size that fits</h3><svg viewBox='0 0 680 476' role='img'><title>Picking a block size that fits</title><text class="hd" x="40" y="46">One head of this model, d = 128: what each block size needs at once</text><text class="sub2" x="40" y="82" text-anchor="start">block</text><text class="sub2" x="140" y="82" text-anchor="start">working set, to scale</text><text class="sub2" x="640" y="82" text-anchor="end">tiles at 200 tokens</text><text class="cap" x="40" y="113" text-anchor="start">256</text><g class="h"><rect x="140" y="96" width="300.0" height="24" rx="3"/></g><text class="sub2" x="448.0" y="113" text-anchor="start">450 KB</text><text class="sub2" x="640" y="113" text-anchor="end">1 × 1</text><text class="cap" x="40" y="153" text-anchor="start">128</text><g class="s"><rect x="140" y="136" width="128.66666666666666" height="24" rx="3"/></g><text class="sub2" x="276.66666666666663" y="153" text-anchor="start">193 KB</text><text class="sub2" x="640" y="153" text-anchor="end">2 × 2</text><text class="cap" x="40" y="193" text-anchor="start">64</text><g class="u"><rect x="140" y="176" width="59.0" height="24" rx="3"/></g><text class="sub2" x="207.0" y="193" text-anchor="start">88.5 KB</text><text class="sub2" x="640" y="193" text-anchor="end">4 × 4</text><text class="cap" x="40" y="233" text-anchor="start">32</text><g class="u"><rect x="140" y="216" width="28.166666666666664" height="24" rx="3"/></g><text class="sub2" x="176.16666666666666" y="233" text-anchor="start">42.3 KB</text><text class="sub2" x="640" y="233" text-anchor="end">7 × 7</text><line class="xok" x1="292.0" y1="88.0" x2="292.0" y2="254.0" stroke="var(--s)" stroke-width="1.2" stroke-dasharray="4 3"/><text class="sub2" x="298.0" y="268" text-anchor="start">228 KB budget</text><text class="cap" x="40" y="306" text-anchor="start">Each row adds up one step's needs: blocks of Q, K and V and the tile of scores in</text><text class="cap" x="40" y="326" text-anchor="start">16-bit, the running output in FP32, and two numbers per row. The dashed line is the 228</text><text class="cap" x="40" y="346" text-anchor="start">KB of shared memory on one multiprocessor.</text><text class="cap" x="40" y="386" text-anchor="start">Bigger blocks mean fewer trips and less repeated traffic ({{fig:v03-p10}}), so the rule</text><text class="cap" x="40" y="406" text-anchor="start">is to take the largest block that fits: 128, at 193 KB. The next size up, 256, needs 450</text><text class="cap" x="40" y="426" text-anchor="start">KB and spills. At 200 tokens, blocks of 128 cut the sequence into two: 128 tokens and</text><text class="cap" x="40" y="446" text-anchor="start">72.</text></svg><figcaption>Red does not fit, teal is the choice. Real kernels also leave room for the next blocks to load while the current ones are used, which can push the choice down a size.</figcaption></figure>
