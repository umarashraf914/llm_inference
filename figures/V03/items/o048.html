<figure><div class='ts'>Fig 48 &nbsp;&middot;&nbsp; 10:50</div><h3>Picking a block size that fits</h3><svg viewBox="0 0 680 314" role="img"><title>Step 4 — pick a block size that fits</title><text class="hd" x="40" y="50" text-anchor="start">Block size</text><text class="hd" x="190" y="50" text-anchor="start">Working set</text><text class="hd" x="420" y="50" text-anchor="start">Tiles of S</text><text class="cap" x="40" y="90" text-anchor="start">128</text><g class="s"><rect x="190" y="72" width="173.70000000000002" height="30" rx="3"></rect></g><text class="sub2" x="371.70000000000005" y="90" text-anchor="start">193 KB</text><text class="sub2" x="420" y="90" text-anchor="start">2 x 2 tiles</text><text class="cap" x="40" y="136" text-anchor="start">64</text><g class="s"><rect x="190" y="118" width="79.65" height="30" rx="3"></rect></g><text class="sub2" x="277.65" y="136" text-anchor="start">88 KB</text><text class="sub2" x="420" y="136" text-anchor="start">4 x 4 tiles</text><text class="cap" x="40" y="182" text-anchor="start">32</text><g class="s"><rect x="190" y="164" width="37.980000000000004" height="30" rx="3"></rect></g><text class="sub2" x="235.98000000000002" y="182" text-anchor="start">42 KB</text><text class="sub2" x="420" y="182" text-anchor="start">7 x 7 tiles</text><text class="cap" x="40" y="244" text-anchor="start">Choosing the block size is precisely the act of making that list fit. Bigger blocks mean fewer</text><text class="cap" x="40" y="264" text-anchor="start">sweeps and less repeated traffic, so you take the largest that still fits.</text><text class="cap" x="40" y="292" text-anchor="start">Take 64. Now the whole working set is 88 KB, comfortably inside 228 KB.</text></svg><figcaption>Working sets computed for Q, K, V blocks plus the S tile, an FP32 output accumulator, and the two running statistics per row.</figcaption></figure>
