<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 23:14</div><h3>To quantise is to divide by a scale and round</h3><svg viewBox='0 0 680 458' role='img'><title>To quantise is to divide by a scale and round</title><text class="hd" x="40" y="46">Four numbers into E4M3, with one scale for all of them</text><g class="u"><rect x="40" y="62" width="600" height="32" rx="6"/><text class="sub" x="340.0" y="78.0" text-anchor="middle" dominant-baseline="central">scale = largest ÷ 448 = 2.9 ÷ 448 = 0.006473</text></g><text class="sub2" x="40" y="122" text-anchor="start">number</text><text class="sub2" x="200" y="122" text-anchor="end">÷ scale</text><text class="sub2" x="320" y="122" text-anchor="end">nearest E4M3</text><text class="sub2" x="460" y="122" text-anchor="end">× scale</text><text class="sub2" x="600" y="122" text-anchor="end">error</text><text class="cap" x="40" y="146" text-anchor="start">0.37</text><text class="sub2" x="200" y="146" text-anchor="end">57.16</text><text class="sub2" x="320" y="146" text-anchor="end">56</text><text class="sub2" x="460" y="146" text-anchor="end">0.3625</text><text class="sub2" x="600" y="146" text-anchor="end">−2.0%</text><text class="cap" x="40" y="170" text-anchor="start">−1.2</text><text class="sub2" x="200" y="170" text-anchor="end">−185.38</text><text class="sub2" x="320" y="170" text-anchor="end">−192</text><text class="sub2" x="460" y="170" text-anchor="end">−1.2429</text><text class="sub2" x="600" y="170" text-anchor="end">3.6%</text><text class="cap" x="40" y="194" text-anchor="start">2.9</text><text class="sub2" x="200" y="194" text-anchor="end">448.00</text><text class="sub2" x="320" y="194" text-anchor="end">448</text><text class="sub2" x="460" y="194" text-anchor="end">2.9000</text><text class="sub2" x="600" y="194" text-anchor="end">0</text><text class="cap" x="40" y="218" text-anchor="start">0.05</text><text class="sub2" x="200" y="218" text-anchor="end">7.72</text><text class="sub2" x="320" y="218" text-anchor="end">7.5</text><text class="sub2" x="460" y="218" text-anchor="end">0.0485</text><text class="sub2" x="600" y="218" text-anchor="end">−2.9%</text><text class="cap" x="40" y="268" text-anchor="start">Quantising means storing each number as the nearest value the format can hold. A raw</text><text class="cap" x="40" y="288" text-anchor="start">tensor's numbers can be any size, so first everything is divided by one scale, chosen so</text><text class="cap" x="40" y="308" text-anchor="start">the largest magnitude lands exactly on 448, E4M3's top. Then each scaled number is</text><text class="cap" x="40" y="328" text-anchor="start">rounded to the nearest E4M3 value ({{fig:v03-p22}}). To use them, multiply back by the scale.</text><text class="cap" x="40" y="368" text-anchor="start">Here 57.16 rounds to 56, because between 32 and 64 the values are 4 apart; 7.72 rounds</text><text class="cap" x="40" y="388" text-anchor="start">to 7.5, where they are half a unit apart. Every number comes back within a few percent</text><text class="cap" x="40" y="408" text-anchor="start">of where it started, and the scale is stored once, in higher precision, beside the</text><text class="cap" x="40" y="428" text-anchor="start">tensor.</text></svg><figcaption>The scale is set by the single largest magnitude. That one sentence is the whole of the problem the next figure shows.</figcaption></figure>
