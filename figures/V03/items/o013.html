<figure><div class='ts'>Fig 13 &nbsp;&middot;&nbsp; 5:52</div><h3>What a head is</h3><svg viewBox='0 0 680 406' role='img'><title>What a head is</title><text class="hd" x="40" y="46">A head is one independent copy of attention</text><g class="u"><rect x="40" y="74" width="138" height="106" rx="14"/><text class="lbl" x="62" y="100">head 1</text></g><g class="m"><rect x="56" y="126" width="106" height="40" rx="4"/><text class="sub" x="109.0" y="146.0" text-anchor="middle" dominant-baseline="central">Q, K, V</text></g><g class="u"><rect x="192" y="74" width="138" height="106" rx="14"/><text class="lbl" x="214" y="100">head 2</text></g><g class="m"><rect x="208" y="126" width="106" height="40" rx="4"/><text class="sub" x="261.0" y="146.0" text-anchor="middle" dominant-baseline="central">Q, K, V</text></g><g class="u"><rect x="344" y="74" width="138" height="106" rx="14"/><text class="lbl" x="366" y="100">head 3</text></g><g class="m"><rect x="360" y="126" width="106" height="40" rx="4"/><text class="sub" x="413.0" y="146.0" text-anchor="middle" dominant-baseline="central">Q, K, V</text></g><g class="u"><rect x="496" y="74" width="138" height="106" rx="14"/><text class="lbl" x="518" y="100">head 4</text></g><g class="m"><rect x="512" y="126" width="106" height="40" rx="4"/><text class="sub" x="565.0" y="146.0" text-anchor="middle" dominant-baseline="central">Q, K, V</text></g><text class="cap" x="40" y="216" text-anchor="start">Each head gets its own slice of the token's vector and its own weights, and computes attention</text><text class="cap" x="40" y="236" text-anchor="start">over that slice alone. They never look at each other.</text><text class="cap" x="40" y="272" text-anchor="start">A model with 32 heads and head dimension 128 has vectors 4,096 wide: 32 times 128. The heads</text><text class="cap" x="40" y="292" text-anchor="start">divide that width between them.</text><text class="cap" x="40" y="328" text-anchor="start">Because they are independent, they can all run at the same time. That independence is what the</text><text class="cap" x="40" y="348" text-anchor="start">chip needs, and it is where much of the parallelism in attention comes from.</text><text class="cap" x="40" y="384" text-anchor="start">Their outputs are concatenated back into one vector at the end of the layer.</text></svg><figcaption>The word appears in every figure below. One head is one complete attention computation on a slice of the vector, and there are dozens running side by side.</figcaption></figure>
