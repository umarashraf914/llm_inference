<figure><div class='ts'>Fig 12 &nbsp;&middot;&nbsp; 3:49</div><h3>Why intensity is something you choose</h3><svg viewBox='0 0 680 432' role='img'><title>Why intensity is something you choose</title><text class="hd" x="40" y="46">Two kernels, same answer, different traffic</text><text class="cap" x="40" y="92" text-anchor="start">Version A</text><g class="h"><rect x="230" y="76" width="380" height="30" rx="3"/><text class="sub" x="420.0" y="91.0" text-anchor="middle" dominant-baseline="central">fetches the same data many times</text></g><text class="cap" x="40" y="152" text-anchor="start">Version B</text><g class="s"><rect x="230" y="136" width="90" height="30" rx="3"/><text class="sub" x="275.0" y="151.0" text-anchor="middle" dominant-baseline="central">fetches once</text></g><g class="u"><rect x="190" y="194" width="300" height="42" rx="6"/><text class="sub" x="340.0" y="215.0" text-anchor="middle" dominant-baseline="central">identical output, either way</text></g><text class="cap" x="40" y="278" text-anchor="start">Operations are fixed by the mathematics: multiply these numbers, add those. Nothing a</text><text class="cap" x="40" y="298" text-anchor="start">programmer does changes that count.</text><text class="cap" x="40" y="334" text-anchor="start">Bytes are not fixed. They depend on the order the work is done in and on what is kept nearby</text><text class="cap" x="40" y="354" text-anchor="start">while it is done.</text><text class="cap" x="40" y="390" text-anchor="start">So intensity, which is one divided by the other, is something a programmer sets. That is what</text><text class="cap" x="40" y="410" text-anchor="start">makes it a lever rather than a property.</text></svg><figcaption>The single most important idea in this video, stated before the machinery arrives. Two programs computing the same function can sit on opposite sides of the ridge.</figcaption></figure>
