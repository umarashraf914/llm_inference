<figure><div class='ts'>Fig 93 &nbsp;&middot;&nbsp; 40:36</div><h3>What splitting and merging means</h3><svg viewBox='0 0 680 456' role='img'><title>What splitting and merging means</title><text class="hd" x="40" y="46">Split the work, then merge the answers</text><g class="m"><rect x="60" y="76" width="128" height="40" rx="4"/><text class="sub" x="124.0" y="96.0" text-anchor="middle" dominant-baseline="central">chunk 1</text></g><line class="conn" x1="124" y1="122" x2="340" y2="152" marker-end="url(#arw)"/><g class="m"><rect x="208" y="76" width="128" height="40" rx="4"/><text class="sub" x="272.0" y="96.0" text-anchor="middle" dominant-baseline="central">chunk 2</text></g><line class="conn" x1="272" y1="122" x2="340" y2="152" marker-end="url(#arw)"/><g class="m"><rect x="356" y="76" width="128" height="40" rx="4"/><text class="sub" x="420.0" y="96.0" text-anchor="middle" dominant-baseline="central">chunk 3</text></g><line class="conn" x1="420" y1="122" x2="340" y2="152" marker-end="url(#arw)"/><g class="m"><rect x="504" y="76" width="128" height="40" rx="4"/><text class="sub" x="568.0" y="96.0" text-anchor="middle" dominant-baseline="central">chunk 4</text></g><line class="conn" x1="568" y1="122" x2="340" y2="152" marker-end="url(#arw)"/><g class="s"><rect x="240" y="156" width="200" height="40" rx="4"/><text class="sub" x="340.0" y="176.0" text-anchor="middle" dominant-baseline="central">merge</text></g><text class="cap" x="40" y="246" text-anchor="start">Each chunk computes attention over its own slice of the cache, keeping its own running maximum</text><text class="cap" x="40" y="266" text-anchor="start">and denominator, exactly as a tile does inside the main loop.</text><text class="cap" x="40" y="302" text-anchor="start">A second small kernel then combines them, rescaling each by the difference between its local</text><text class="cap" x="40" y="322" text-anchor="start">maximum and the global one.</text><text class="cap" x="40" y="358" text-anchor="start">It is the same correction as the online recurrence, applied one level up. Because that</text><text class="cap" x="40" y="378" text-anchor="start">correction is exact, splitting and merging changes nothing about the answer.</text><text class="cap" x="40" y="414" text-anchor="start">The dimension being split is the cache, which at long context is the only one large enough to</text><text class="cap" x="40" y="434" text-anchor="start">fill the chip.</text></svg><figcaption>Machinery from Part 7 reused at a different level. Exactness is what makes it a free rearrangement rather than an approximation.</figcaption></figure>
