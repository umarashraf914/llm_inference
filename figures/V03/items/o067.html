="340" y="190" width="24" height="24" rx="3"/></g><g class="u"><rect x="370" y="190" width="24" height="24" rx="3"/></g><g class="u"><rect x="400" y="190" width="24" height="24" rx="3"/></g><g class="u"><rect x="430" y="190" width="24" height="24" rx="3"/></g><g class="u"><rect x="460" y="190" width="24" height="24" rx="3"/></g><g class="u"><rect x="490" y="190" width="24" height="24" rx="3"/></g><g class="u"><rect x="520" y="190" width="24" height="24" rx="3"/></g><g class="u"><rect x="550" y="190" width="24" height="24" rx="3"/></g><g class="u"><rect x="580" y="190" width="24" height="24" rx="3"/></g><g class="u"><rect x="70" y="220" width="24" height="24" rx="3"/></g><g class="u"><rect x="100" y="220" width="24" height="24" rx="3"/></g><g class="u"><rect x="130" y="220" width="24" height="24" rx="3"/></g><g class="u"><rect x="160" y="220" width="24" height="24" rx="3"/></g><g class="u"><rect x="190" y="220" width="24" height="24" rx="3"/></g><g class="u"><rect x="220" y="220" width="24" height="24" rx="3"/></g><g class="u"><rect x="250" y="220" width="24" height="24" rx="3"/></g><g class="u"><rect x="280" y="220" width="24" height="24" rx="3"/></g><g class="u"><rect x="310" y="220" width="24" height="24" rx="3"/></g><g class="u"><rect x="340" y="220" width="24" height="24" rx="3"/></g><g class="u"><rect x="370" y="220" width="24" height="24" rx="3"/></g><g class="u"><rect x="400" y="220" width="24" height="24" rx="3"/></g><g class="u"><rect x="430" y="220" width="24" height="24" rx="3"/></g><g class="u"><rect x="460" y="220" width="24" height="24" rx="3"/></g><g class="u"><rect x="490" y="220" width="24" height="24" rx="3"/></g><g class="u"><rect x="520" y="220" width="24" height="24" rx="3"/></g><g class="u"><rect x="550" y="220" width="24" height="24" rx="3"/></g><g class="u"><rect x="580" y="220" width="24" height="24" rx="3"/></g><text class="sub2" x="70" y="266" text-anchor="start">teal: the 32 multiprocessors given a block;  grey: the 76 with nothing to do</text><text class="cap" x="40" y="306" text-anchor="start">A kernel's work is handed out as thread blocks, and each block runs on one</text><text class="cap" x="40" y="326" text-anchor="start">multiprocessor until it finishes ({{fig:v03-o004}}). So the number of blocks caps how</text><text class="cap" x="40" y="346" text-anchor="start">much of the chip can be busy.</text><text class="cap" x="40" y="386" text-anchor="start">The first version made one block per head per sequence in the batch, the batch being</text><text class="cap" x="40" y="406" text-anchor="start">however many separate sequences the chip is processing at once. Serve two long sequences</text><text class="cap" x="40" y="426" text-anchor="start">on a model with 16 heads and that is 2 × 16 = 32 blocks. An A100 has 108</text><text class="cap" x="40" y="446" text-anchor="start">multiprocessors, so 76 of them, 70%, sit idle however well each block is written.</text></svg><figcaption>Occupancy is set by how the problem is cut up, not by the hardware. Long sequences make it worse, because they force small batches.</figcaption></figure>
