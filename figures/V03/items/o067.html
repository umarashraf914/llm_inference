<figure><div class='ts'>Fig 67 &nbsp;&middot;&nbsp; 18:22</div><h3>Why the number of blocks matters</h3><svg viewBox='0 0 680 416' role='img'><title>Why the number of blocks matters</title><text class="hd" x="40" y="46">A block of work is what one multiprocessor is given</text><g class="u"><rect x="40" y="74" width="600" height="108" rx="14"/><text class="lbl" x="62" y="100">the chip: 132 multiprocessors, each wanting a block</text></g><g class="m"><rect x="66" y="126" width="38" height="34" rx="3"/></g><g class="m"><rect x="112" y="126" width="38" height="34" rx="3"/></g><g class="m"><rect x="158" y="126" width="38" height="34" rx="3"/></g><g class="m"><rect x="204" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="250" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="296" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="342" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="388" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="434" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="480" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="526" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="572" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="66" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="112" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="158" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="204" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="250" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="296" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="342" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="388" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="434" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="480" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="526" y="126" width="38" height="34" rx="3"/></g><g class="u"><rect x="572" y="126" width="38" height="34" rx="3"/></g><text class="sub2" x="66" y="212" text-anchor="start">if the kernel only creates four blocks, 128 multiprocessors idle</text><text class="cap" x="40" y="262" text-anchor="start">The number of blocks a kernel launches is decided by how the problem is cut up, not by the</text><text class="cap" x="40" y="282" text-anchor="start">hardware. Too few and most of the chip has nothing to do.</text><text class="cap" x="40" y="318" text-anchor="start">The first version cut the work by batch and by head. With a small batch that is only a few</text><text class="cap" x="40" y="338" text-anchor="start">dozen pieces for 132 multiprocessors.</text><text class="cap" x="40" y="374" text-anchor="start">The fix is to cut along another dimension as well, so one long sequence can fill the chip on</text><text class="cap" x="40" y="394" text-anchor="start">its own.</text></svg><figcaption>Occupancy is set by the decomposition, not by the chip. A kernel that creates too few pieces leaves silicon idle no matter how well each piece is written.</figcaption></figure>
