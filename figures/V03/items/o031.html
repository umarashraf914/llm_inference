<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:54</div><h3>The traffic tally</h3><svg viewBox='0 0 680 424' role='img'><title>The traffic tally</title><text class="hd" x="40" y="46">One head, 8,192 tokens, head dimension 64, 16-bit: every bar on one scale</text><text class="cap" x="40" y="90" text-anchor="start">Q, K, V read, output written</text><g class="s"><rect x="230" y="72" width="3.10077519379845" height="28" rx="3"/></g><text class="sub2" x="241.10077519379846" y="91" text-anchor="start">4.2 MB</text><text class="cap" x="40" y="134" text-anchor="start">S written, then read</text><g class="h"><rect x="233.10077519379846" y="116" width="198.4496124031008" height="28" rx="3"/><text class="sub" x="332.3255813953489" y="130.0" text-anchor="middle" dominant-baseline="central">268.4 MB</text></g><text class="cap" x="40" y="178" text-anchor="start">P written, then read</text><g class="h"><rect x="431.5503875968992" y="160" width="198.4496124031008" height="28" rx="3"/><text class="sub" x="530.7751937984497" y="174.0" text-anchor="middle" dominant-baseline="central">268.4 MB</text></g><line class="axis" x1="40.0" y1="210.0" x2="640.0" y2="210.0"/><text class="cap" x="40" y="242" text-anchor="start">total</text><g class="h"><rect x="230" y="224" width="400.0" height="28" rx="3"/><text class="sub" x="430.0" y="238.0" text-anchor="middle" dominant-baseline="central">541.1 MB</text></g><text class="cap" x="40" y="294" text-anchor="start">Laid end to end, the three bars make the total. The useful data, Q, K and V in and the</text><text class="cap" x="40" y="314" text-anchor="start">output out, is 4.2 MB. The scratch matrices, each written out in full and read straight</text><text class="cap" x="40" y="334" text-anchor="start">back, are 536.9 MB: 99.2% of everything that crosses the bus.</text><text class="cap" x="40" y="374" text-anchor="start">So the kernel moves 129 times the bytes its inputs and output need, and every one of the</text><text class="cap" x="40" y="394" text-anchor="start">extra bytes exists only because a kernel boundary sits between the steps.</text></svg><figcaption>The shape to remember: the useful data is a sliver, and the bookkeeping is the bar. <a class='xref' href='V03_Kernels_and_Memory_animation.html'>The companion animation</a> runs these three kernels step by step on four tokens, counting every number that crosses the bus.</figcaption></figure>
