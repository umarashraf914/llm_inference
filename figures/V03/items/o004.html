<figure><div class='ts'>Fig 04 &nbsp;&middot;&nbsp; 0:16</div><h3>What a kernel is</h3><svg viewBox="0 0 680 332" role="img"><title>What a kernel is</title><g class="u"><rect x="40" y="50" width="250" height="66" rx="8"></rect><text class="lbl" x="165.0" y="74.0" text-anchor="middle" dominant-baseline="central">CPU</text><text class="sub" x="165.0" y="92.0" text-anchor="middle" dominant-baseline="central">issues one launch</text></g><line class="conn" x1="296" y1="83" x2="326" y2="83" marker-end="url(#arw)"></line><g class="m"><rect x="334" y="44" width="306" height="130" rx="14"></rect><text class="lbl" x="356" y="70">GPU</text></g><g class="s"><rect x="356" y="92" width="80" height="28" rx="3"></rect><text class="sub" x="396.0" y="106.0" text-anchor="middle" dominant-baseline="central">block 0</text></g><g class="s"><rect x="446" y="92" width="80" height="28" rx="3"></rect><text class="sub" x="486.0" y="106.0" text-anchor="middle" dominant-baseline="central">block 1</text></g><g class="s"><rect x="536" y="92" width="80" height="28" rx="3"></rect><text class="sub" x="576.0" y="106.0" text-anchor="middle" dominant-baseline="central">block 2</text></g><g class="s"><rect x="356" y="128" width="80" height="28" rx="3"></rect><text class="sub" x="396.0" y="142.0" text-anchor="middle" dominant-baseline="central">block 3</text></g><g class="s"><rect x="446" y="128" width="80" height="28" rx="3"></rect><text class="sub" x="486.0" y="142.0" text-anchor="middle" dominant-baseline="central">block 4</text></g><g class="s"><rect x="536" y="128" width="80" height="28" rx="3"></rect><text class="sub" x="576.0" y="142.0" text-anchor="middle" dominant-baseline="central">block 5</text></g><text class="cap" x="40" y="210" text-anchor="start">A kernel is one function, compiled for the GPU and launched as a grid of thread blocks. Each</text><text class="cap" x="40" y="230" text-anchor="start">block is placed on one multiprocessor ({{fig:v02-o024}}) and runs there to completion.</text><text class="cap" x="40" y="260" text-anchor="start">Inside a block, threads can cooperate through shared memory. Across blocks they cannot; blocks</text><text class="cap" x="40" y="280" text-anchor="start">are independent by design, which is what lets the hardware schedule them freely.</text><text class="cap" x="40" y="310" text-anchor="start">The number of blocks a kernel launches decides how much of the chip it can occupy.</text></svg><figcaption>Thread block is the term the rest of this document leans on hardest. It is the unit of cooperation and the unit of scheduling.</figcaption></figure>
