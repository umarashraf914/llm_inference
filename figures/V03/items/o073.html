<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 22:00</div><h3>Warp specialisation</h3><svg viewBox='0 0 680 480' role='img'><title>Warp specialisation</title><text class="hd" x="40" y="46">Producers fill a ring of shared-memory slots; consumers empty it</text><g class="h"><rect x="40" y="74" width="170" height="64" rx="8"/><text class="lbl" x="125.0" y="89.0" text-anchor="middle" dominant-baseline="central">producer warps</text><text class="sub" x="125.0" y="107.0" text-anchor="middle" dominant-baseline="central">only issue TMA loads</text><text class="sub" x="125.0" y="124.0" text-anchor="middle" dominant-baseline="central">of K and V tiles</text></g><line class="conn" x1="216" y1="106" x2="246" y2="106" marker-end="url(#arw)"/><g class="u"><rect x="252" y="64" width="176" height="84" rx="14"/><text class="lbl" x="274" y="90">a ring of 2 slots</text></g><g class="s"><rect x="270" y="96" width="66" height="36" rx="8"/><text class="lbl" x="303.0" y="114.0" text-anchor="middle" dominant-baseline="central">slot 1</text></g><g class="s"><rect x="350" y="96" width="66" height="36" rx="8"/><text class="lbl" x="383.0" y="114.0" text-anchor="middle" dominant-baseline="central">slot 2</text></g><line class="conn" x1="434" y1="106" x2="464" y2="106" marker-end="url(#arw)"/><g class="m"><rect x="470" y="74" width="170" height="64" rx="8"/><text class="lbl" x="555.0" y="89.0" text-anchor="middle" dominant-baseline="central">consumer warps</text><text class="sub" x="555.0" y="107.0" text-anchor="middle" dominant-baseline="central">only compute: WGMMA</text><text class="sub" x="555.0" y="124.0" text-anchor="middle" dominant-baseline="central">and the softmax</text></g><text class="sub2" x="252" y="172" text-anchor="start">a producer waits only when the ring is full; a consumer only when it is empty</text><text class="cap" x="40" y="210" text-anchor="start">The general pattern first: one party produces, another consumes, and a buffer between</text><text class="cap" x="40" y="230" text-anchor="start">them lets both run. Neither waits for the other as long as the buffer is neither full</text><text class="cap" x="40" y="250" text-anchor="start">nor empty. Operating systems have used it for decades.</text><text class="cap" x="40" y="290" text-anchor="start">Version 3 builds it inside a single thread block. Instead of every warp doing every job,</text><text class="cap" x="40" y="310" text-anchor="start">the warps divide by occupation. Producer warps do nothing but issue TMA loads, pulling</text><text class="cap" x="40" y="330" text-anchor="start">the next tiles of K and V out of HBM into a ring of shared-memory slots. Consumer warps</text><text class="cap" x="40" y="350" text-anchor="start">do nothing but compute on tiles that have landed, and free each slot when they are done</text><text class="cap" x="40" y="370" text-anchor="start">with it.</text><text class="cap" x="40" y="410" text-anchor="start">Issuing a copy takes almost no registers, so Hopper lets the producers hand most of</text><text class="cap" x="40" y="430" text-anchor="start">theirs to the consumers, who need them for the tiles they work on. Data movement and</text><text class="cap" x="40" y="450" text-anchor="start">computation finally overlap, each hiding the other.</text></svg><figcaption>A scheduling idea rather than a mathematical one, and the point where kernel engineering starts to look like systems programming: the arithmetic is unchanged, only who does what, and when.</figcaption></figure>
