ext-anchor="start">block becomes a producer-consumer pipeline with a shared-memory buffer between the two roles.</text><text class="cap" x="40" y="304" text-anchor="start">Copy engine and tensor cores finally run at the same time, each hiding the other.</text><text class="cap" x="40" y="334" text-anchor="start">A second overlap runs alongside it: the exponentials on the special-function units are issued</text><text class="cap" x="40" y="354" text-anchor="start">so they execute while the tensor cores work on the next tile.</text></svg><figcaption>Warps within a block taking different roles. This is a scheduling idea rather than a mathematical one, and it is where kernel engineering starts to resemble systems programming.</figcaption></figure>
