<figure><div class='ts'>Fig 20 &nbsp;&middot;&nbsp; 7:22</div><h3>Why attention only looks backwards</h3><svg viewBox='0 0 680 506' role='img'><title>Why attention only looks backwards</title><text class="hd" x="40" y="46">A token may look back, never forward</text><g class="s"><rect x="200" y="70" width="48" height="28" rx="3"/></g><g class="u"><rect x="256" y="70" width="48" height="28" rx="3"/></g><g class="u"><rect x="312" y="70" width="48" height="28" rx="3"/></g><g class="u"><rect x="368" y="70" width="48" height="28" rx="3"/></g><g class="u"><rect x="424" y="70" width="48" height="28" rx="3"/></g><g class="u"><rect x="480" y="70" width="48" height="28" rx="3"/></g><g class="s"><rect x="200" y="104" width="48" height="28" rx="3"/></g><g class="s"><rect x="256" y="104" width="48" height="28" rx="3"/></g><g class="u"><rect x="312" y="104" width="48" height="28" rx="3"/></g><g class="u"><rect x="368" y="104" width="48" height="28" rx="3"/></g><g class="u"><rect x="424" y="104" width="48" height="28" rx="3"/></g><g class="u"><rect x="480" y="104" width="48" height="28" rx="3"/></g><g class="s"><rect x="200" y="138" width="48" height="28" rx="3"/></g><g class="s"><rect x="256" y="138" width="48" height="28" rx="3"/></g><g class="s"><rect x="312" y="138" width="48" height="28" rx="3"/></g><g class="u"><rect x="368" y="138" width="48" height="28" rx="3"/></g><g class="u"><rect x="424" y="138" width="48" height="28" rx="3"/></g><g class="u"><rect x="480" y="138" width="48" height="28" rx="3"/></g><g class="s"><rect x="200" y="172" width="48" height="28" rx="3"/></g><g class="s"><rect x="256" y="172" width="48" height="28" rx="3"/></g><g class="s"><rect x="312" y="172" width="48" height="28" rx="3"/></g><g class="s"><rect x="368" y="172" width="48" height="28" rx="3"/></g><g class="u"><rect x="424" y="172" width="48" height="28" rx="3"/></g><g class="u"><rect x="480" y="172" width="48" height="28" rx="3"/></g><g class="s"><rect x="200" y="206" width="48" height="28" rx="3"/></g><g class="s"><rect x="256" y="206" width="48" height="28" rx="3"/></g><g class="s"><rect x="312" y="206" width="48" height="28" rx="3"/></g><g class="s"><rect x="368" y="206" width="48" height="28" rx="3"/></g><g class="s"><rect x="424" y="206" width="48" height="28" rx="3"/></g><g class="u"><rect x="480" y="206" width="48" height="28" rx="3"/></g><g class="s"><rect x="200" y="240" width="48" height="28" rx="3"/></g><g class="s"><rect x="256" y="240" width="48" height="28" rx="3"/></g><g class="s"><rect x="312" y="240" width="48" height="28" rx="3"/></g><g class="s"><rect x="368" y="240" width="48" height="28" rx="3"/></g><g class="s"><rect x="424" y="240" width="48" height="28" rx="3"/></g><g class="s"><rect x="480" y="240" width="48" height="28" rx="3"/></g><text class="sub2" x="40" y="88" text-anchor="start">token 1</text><text class="sub2" x="40" y="258" text-anchor="start">token 6</text><text class="sub2" x="200" y="302" text-anchor="start">which earlier tokens each one may attend to</text><text class="cap" x="40" y="352" text-anchor="start">Just under half the grid is unusable: n(n − 1)/2 of the n² entries, 49.99% at</text><text class="cap" x="40" y="372" text-anchor="start">8,192 tokens. The 6 × 6 drawn here masks 15 of 36.</text><text class="cap" x="40" y="408" text-anchor="start">The rule is not a performance trick. It is what makes the model a next-token predictor: a</text><text class="cap" x="40" y="428" text-anchor="start">token that could see its own future would have nothing to predict.</text><text class="cap" x="40" y="464" text-anchor="start">A tiled kernel can skip whole tiles that lie entirely in the grey region, which is one of the</text><text class="cap" x="40" y="484" text-anchor="start">savings the naive version never gets.</text></svg><figcaption>A recap of {{ref:v01-o132}}. Two consequences from one rule: almost half the score matrix never needs computing, and decode has to be sequential. Both return below.</figcaption></figure>
