<figure><div class='ts'>Fig 36 &nbsp;&middot;&nbsp; 10:28</div><h3>Why a block only needs strips</h3><svg viewBox='0 0 680 394' role='img'><title>Why a block only needs strips</title><text class="hd" x="40" y="46">A block of the answer needs only a strip of each input</text><g class="s"><rect x="60" y="74" width="96" height="96" rx="4"/></g><g class="m"><rect x="60" y="74" width="96" height="24" rx="4"/></g><text class="sub2" x="60" y="190" text-anchor="start">one strip of rows</text><text class="hd" x="176" y="128" text-anchor="start">x</text><g class="s"><rect x="200" y="74" width="96" height="96" rx="4"/></g><g class="m"><rect x="200" y="74" width="24" height="96" rx="4"/></g><text class="sub2" x="200" y="190" text-anchor="start">one strip of columns</text><text class="hd" x="316" y="128" text-anchor="start">=</text><g class="u"><rect x="340" y="74" width="96" height="96" rx="4"/></g><g class="m"><rect x="340" y="74" width="24" height="24" rx="4"/></g><text class="sub2" x="340" y="190" text-anchor="start">one block of the answer</text><text class="cap" x="40" y="240" text-anchor="start">Nothing outside those two strips affects that block. So the two strips can be brought onto the</text><text class="cap" x="40" y="260" text-anchor="start">chip on their own, the block computed, and both discarded.</text><text class="cap" x="40" y="296" text-anchor="start">Repeat for every block and the whole product is built, without either input ever being fully</text><text class="cap" x="40" y="316" text-anchor="start">present at once.</text><text class="cap" x="40" y="352" text-anchor="start">This is a property of matrix multiplication itself. Every large matmul on every accelerator is</text><text class="cap" x="40" y="372" text-anchor="start">done this way; attention is not a special case.</text></svg><figcaption>The mathematical permission for tiling. Without it there would be no way to compute part of the answer from part of the input.</figcaption></figure>
