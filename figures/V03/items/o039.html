ass="sub" x="427.0" y="127.0" text-anchor="middle" dominant-baseline="central">streams in</text></g><g class="m"><rect x="368" y="158" width="118" height="52" rx="8"></rect><text class="lbl" x="427.0" y="175.0" text-anchor="middle" dominant-baseline="central">S tile</text><text class="sub" x="427.0" y="193.0" text-anchor="middle" dominant-baseline="central">born, used, gone</text></g><line class="conn" x1="427" y1="148" x2="427" y2="154" marker-end="url(#arw)"></line><line class="conn" x1="488" y1="118" x2="502" y2="118" marker-end="url(#arw)"></line><g class="h"><rect x="506" y="92" width="118" height="52" rx="8"></rect><text class="lbl" x="565.0" y="109.0" text-anchor="middle" dominant-baseline="central">K, V block 3</text><text class="sub" x="565.0" y="127.0" text-anchor="middle" dominant-baseline="central">streams in</text></g><g class="m"><rect x="506" y="158" width="118" height="52" rx="8"></rect><text class="lbl" x="565.0" y="175.0" text-anchor="middle" dominant-baseline="central">S tile</text><text class="sub" x="565.0" y="193.0" text-anchor="middle" dominant-baseline="central">born, used, gone</text></g><line class="conn" x1="565" y1="148" x2="565" y2="154" marker-end="url(#arw)"></line><text class="sub2" x="230" y="240" text-anchor="start">each S tile is overwritten by the next</text><text class="cap" x="40" y="300" text-anchor="start">The output is not written per tile. It accumulates in place in SRAM, and is written to HBM</text><text class="cap" x="40" y="320" text-anchor="start">exactly once when the inner loop ends.</text><text class="cap" x="40" y="350" text-anchor="start">Teal things stay for the whole loop. Red things stream through. Gold exists for microseconds.</text></svg><figcaption>The output accumulator is the piece most descriptions skip, and it is the direct answer to where a tiled computation puts its partial results.</figcaption></figure>
