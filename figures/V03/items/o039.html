<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 18:52</div><h3>Swapping the loops keeps the output on chip and gives every query block its own thread block</h3><svg viewBox='0 0 680 576' role='img'><title>Swapping the loops keeps the output on chip and gives every query block its own thread block</title><text class="hd" x="40" y="46">Version 2: Q outside, K and V inside, one thread block per block of queries</text><g class="u"><rect x="40" y="62" width="600" height="166" rx="14"/><text class="lbl" x="62" y="88">on one multiprocessor, for the whole inner loop</text></g><g class="s"><rect x="62" y="100" width="170" height="42" rx="8"/><text class="lbl" x="147.0" y="112.0" text-anchor="middle" dominant-baseline="central">Q block</text><text class="sub" x="147.0" y="130.0" text-anchor="middle" dominant-baseline="central">loaded once</text></g><g class="s"><rect x="62" y="152" width="170" height="42" rx="8"/><text class="lbl" x="147.0" y="164.0" text-anchor="middle" dominant-baseline="central">O, m and l</text><text class="sub" x="147.0" y="182.0" text-anchor="middle" dominant-baseline="central">stay on the chip</text></g><g class="h"><rect x="252" y="100" width="112" height="42" rx="8"/><text class="lbl" x="308.0" y="112.0" text-anchor="middle" dominant-baseline="central">K, V block 1</text><text class="sub" x="308.0" y="130.0" text-anchor="middle" dominant-baseline="central">streams in</text></g><g class="m"><rect x="252" y="152" width="112" height="42" rx="8"/><text class="lbl" x="308.0" y="164.0" text-anchor="middle" dominant-baseline="central">S tile</text><text class="sub" x="308.0" y="182.0" text-anchor="middle" dominant-baseline="central">made, used, gone</text></g><g class="h"><rect x="380" y="100" width="112" height="42" rx="8"/><text class="lbl" x="436.0" y="112.0" text-anchor="middle" dominant-baseline="central">K, V block 2</text><text class="sub" x="436.0" y="130.0" text-anchor="middle" dominant-baseline="central">streams in</text></g><line class="conn" x1="366" y1="121" x2="378" y2="121" marker-end="url(#arw)"/><g class="m"><rect x="380" y="152" width="112" height="42" rx="8"/><text class="lbl" x="436.0" y="164.0" text-anchor="middle" dominant-baseline="central">S tile</text><text class="sub" x="436.0" y="182.0" text-anchor="middle" dominant-baseline="central">made, used, gone</text></g><g class="h"><rect x="508" y="100" width="112" height="42" rx="8"/><text class="lbl" x="564.0" y="112.0" text-anchor="middle" dominant-baseline="central">K, V block 3</text><text class="sub" x="564.0" y="130.0" text-anchor="middle" dominant-baseline="central">streams in</text></g><line class="conn" x1="494" y1="121" x2="506" y2="121" marker-end="url(#arw)"/><g class="m"><rect x="508" y="152" width="112" height="42" rx="8"/><text class="lbl" x="564.0" y="164.0" text-anchor="middle" dominant-baseline="central">S tile</text><text class="sub" x="564.0" y="182.0" text-anchor="middle" dominant-baseline="central">made, used, gone</text></g><text class="cap" x="40" y="258" text-anchor="start">blocks of work at 2 sequences × 16 heads, 8,192 tokens:</text><text class="cap" x="40" y="292" text-anchor="start">version 1</text><g class="h"><rect x="200" y="276" width="6.25" height="24" rx="3"/></g><text class="sub2" x="229.09375" y="293" text-anchor="start">32 blocks</text><text class="cap" x="40" y="326" text-anchor="start">version 2: × 64</text><g class="s"><rect x="200" y="310" width="400.0" height="24" rx="3"/><text class="sub" x="400.0" y="322.0" text-anchor="middle" dominant-baseline="central">2,048 blocks</text></g><line class="xok" x1="221.1" y1="268.0" x2="221.1" y2="342.0" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3"/><text class="sub2" x="227.09375" y="354" text-anchor="start">108 multiprocessors</text><text class="cap" x="40" y="386" text-anchor="start">Version 2 swaps the loops. Each thread block takes one block of queries, keeps it and</text><text class="cap" x="40" y="406" text-anchor="start">its running output on the chip, and streams every block of K and V past them. The output</text><text class="cap" x="40" y="426" text-anchor="start">is written to HBM once, when the row of tiles is finished, instead of making a trip on</text><text class="cap" x="40" y="446" text-anchor="start">every step as in version 1 ({{fig:v03-p10}}).</text><text class="cap" x="40" y="486" text-anchor="start">The swap also makes the blocks of queries independent of each other, so each can be its</text><text class="cap" x="40" y="506" text-anchor="start">own thread block. At 8,192 tokens that is 64 per head: the 32 blocks of version 1 become</text><text class="cap" x="40" y="526" text-anchor="start">2,048, about 19 rounds of work for 108 multiprocessors, and one long sequence can fill</text><text class="cap" x="40" y="546" text-anchor="start">the chip on its own.</text></svg><figcaption>Teal stays for the whole loop, red streams through, gold lives for microseconds. The trips did not disappear: K and V now make them instead, and the next figure counts what that costs.</figcaption></figure>
