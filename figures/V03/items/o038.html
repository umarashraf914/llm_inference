<figure><div class='ts'>Fig 38 &nbsp;&middot;&nbsp; 10:58</div><h3>What an accumulator is</h3><svg viewBox="0 0 680 286" role="img"><title>What an accumulator is</title><text class="hd" x="40" y="46">An accumulator is a running total you keep adding into</text><g class="u"><rect x="60" y="70" width="110" height="34" rx="4"></rect><text class="sub" x="115.0" y="87.0" text-anchor="middle" dominant-baseline="central">start at 0</text></g><line class="conn" x1="176" y1="87" x2="196" y2="87" marker-end="url(#arw)"></line><g class="m"><rect x="202" y="70" width="110" height="34" rx="4"></rect><text class="sub" x="257.0" y="87.0" text-anchor="middle" dominant-baseline="central">+ first piece</text></g><line class="conn" x1="318" y1="87" x2="338" y2="87" marker-end="url(#arw)"></line><g class="m"><rect x="344" y="70" width="110" height="34" rx="4"></rect><text class="sub" x="399.0" y="87.0" text-anchor="middle" dominant-baseline="central">+ next piece</text></g><line class="conn" x1="460" y1="87" x2="480" y2="87" marker-end="url(#arw)"></line><g class="s"><rect x="486" y="70" width="134" height="34" rx="4"></rect><text class="sub" x="553.0" y="87.0" text-anchor="middle" dominant-baseline="central">the finished total</text></g><text class="cap" x="40" y="152" text-anchor="start">You never hold all the pieces at once. Each one arrives, is added in, and can then be thrown</text><text class="cap" x="40" y="172" text-anchor="start">away. Only the running total has to be kept.</text><text class="cap" x="40" y="208" text-anchor="start">That is the trick behind tiling: the enormous intermediate is consumed a piece at a time and</text><text class="cap" x="40" y="228" text-anchor="start">never exists as a whole.</text><text class="cap" x="40" y="264" text-anchor="start">In place means the running total is updated where it sits rather than copied somewhere new.</text></svg><figcaption>A tiny idea with enormous consequences here. If a result can be accumulated, the thing producing it never needs to be stored.</figcaption></figure>
