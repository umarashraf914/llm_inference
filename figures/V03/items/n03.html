<g class="u"><rect x="414" y="236" width="14" height="14" rx="2"/></g><g class="u"><rect x="431" y="236" width="14" height="14" rx="2"/></g><g class="u"><rect x="448" y="236" width="14" height="14" rx="2"/></g><g class="u"><rect x="465" y="236" width="14" height="14" rx="2"/></g><g class="u"><rect x="482" y="236" width="14" height="14" rx="2"/></g><g class="u"><rect x="499" y="236" width="14" height="14" rx="2"/></g><g class="u"><rect x="516" y="236" width="14" height="14" rx="2"/></g><g class="u"><rect x="533" y="236" width="14" height="14" rx="2"/></g><g class="u"><rect x="550" y="236" width="14" height="14" rx="2"/></g><g class="u"><rect x="567" y="236" width="14" height="14" rx="2"/></g><text class="cap" x="40" y="283" text-anchor="start">prefill, 8,192 tokens: 2,048 blocks</text><text class="sub2" x="40" y="301" text-anchor="start">about 15.5 waves of 132, every one busy</text><text class="cap" x="380" y="283" text-anchor="start">decode, one new token: 32 blocks</text><text class="sub2" x="380" y="301" text-anchor="start">32 busy, 100 idle</text><text class="cap" x="40" y="341" text-anchor="start">FlashAttention 2 fills a chip by handing out many independent blocks of work, each one</text><text class="cap" x="40" y="361" text-anchor="start">bundle of query rows for one head of one sequence in the batch ({{fig:v03-o039}}). The number</text><text class="cap" x="40" y="381" text-anchor="start">of blocks is the number of multiprocessors it can keep busy.</text><text class="cap" x="40" y="421" text-anchor="start">Prefill produces thousands. At 8,192 tokens, blocks of 128 query rows and 32 heads, that</text><text class="cap" x="40" y="441" text-anchor="start">is 64 × 32 = 2,048 blocks, about 15.5 waves, a wave being one round in which every</text><text class="cap" x="40" y="461" text-anchor="start">multiprocessor takes a block. Decode produces almost none. Its query is one new token, a</text><text class="cap" x="40" y="481" text-anchor="start">single row, so the query dimension contributes exactly one block, and the count</text><text class="cap" x="40" y="501" text-anchor="start">collapses to batch × heads. One request on a 32-head model gives 32 pieces of work, and</text><text class="cap" x="40" y="521" text-anchor="start">100 multiprocessors stand idle.</text></svg><figcaption>The same kernel on the same chip: only the shape of the work changed, from a tall block of queries to a single row.</figcaption></figure>
