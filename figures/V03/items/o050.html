<figure><div class='ts'>Fig 50 &nbsp;&middot;&nbsp; 11:13</div><h3>The rest of the layer, then repeat</h3><svg viewBox="0 0 680 256" role="img"><title>Step 7 — the rest of the layer, then repeat</title><g class="s"><rect x="40" y="50" width="175" height="66" rx="8"></rect><text class="lbl" x="127.5" y="74.0" text-anchor="middle" dominant-baseline="central">Attention output</text><text class="sub" x="127.5" y="92.0" text-anchor="middle" dominant-baseline="central">32 heads, concatenated</text></g><line class="conn" x1="221" y1="83" x2="251" y2="83" marker-end="url(#arw)"></line><g class="h"><rect x="257" y="50" width="145" height="66" rx="8"></rect><text class="lbl" x="329.5" y="74.0" text-anchor="middle" dominant-baseline="central">W_O</text><text class="sub" x="329.5" y="92.0" text-anchor="middle" dominant-baseline="central">33.6 MB</text></g><line class="conn" x1="408" y1="83" x2="438" y2="83" marker-end="url(#arw)"></line><g class="m"><rect x="444" y="50" width="196" height="66" rx="8"></rect><text class="lbl" x="542.0" y="74.0" text-anchor="middle" dominant-baseline="central">Feed-forward network</text><text class="sub" x="542.0" y="92.0" text-anchor="middle" dominant-baseline="central">three matrices, 350 MB</text></g><text class="cap" x="40" y="158" text-anchor="start">Attention is not the end of the layer. The output projection and the feed-forward network</text><text class="cap" x="40" y="178" text-anchor="start">follow, and between them they read far more weight bytes than attention did.</text><text class="cap" x="40" y="206" text-anchor="start">Then the result becomes X for layer 2, and the whole thing repeats 31 more times.</text><text class="cap" x="40" y="234" text-anchor="start">K and V for this layer stay in HBM. They are now the KV cache.</text></svg><figcaption>A useful corrective: in most people's mental picture attention is the layer. In byte terms it is a minority of it, especially at short context.</figcaption></figure>
