<figure><div class='ts'>Fig 82 &nbsp;&middot;&nbsp; 30:07</div><h3>How big the cache gets</h3><svg viewBox="0 0 680 355" role="img"><title>How big the cache gets</title><g class="m"><rect x="60" y="46" width="560" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">cache bytes = 2 x layers x batch x sequence x KV heads x head dim x bytes</text></g><text class="cap" x="40" y="129" text-anchor="start">For a 70-billion-parameter model with 80 layers, 8 KV heads and head dimension 128, in FP16,</text><text class="cap" x="40" y="149" text-anchor="start">that is 320 KB for every token held in context.</text><text class="cap" x="40" y="191" text-anchor="start">Weights</text><g class="h"><rect x="230" y="175" width="390" height="30" rx="3"></rect><text class="sub" x="425.0" y="190" text-anchor="middle" dominant-baseline="central">140 GB, fixed</text></g><text class="cap" x="40" y="251" text-anchor="start">Cache at 8k x batch 32</text><g class="s"><rect x="230" y="235" width="240" height="30" rx="3"></rect><text class="sub" x="350.0" y="250" text-anchor="middle" dominant-baseline="central">86 GB, and growing</text></g><text class="cap" x="40" y="313" text-anchor="start">The weights are a fixed cost. The cache scales with batch size and sequence length together,</text><text class="cap" x="40" y="333" text-anchor="start">so at long context it overtakes them, both to fit in memory and to reread on every token.</text></svg><figcaption>Two different memory problems in one system. Attention traffic is about the n squared matrix; the cache is about storage that persists between tokens.</figcaption></figure>
