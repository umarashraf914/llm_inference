<figure><div class='ts'>Fig 09 &nbsp;&middot;&nbsp; 2:47</div><h3>How small the fast memory really is</h3><svg viewBox='0 0 680 408' role='img'><title>How small the fast memory really is</title><text class="hd" x="40" y="46">The two tiers, drawn honestly</text><text class="cap" x="40" y="92" text-anchor="start">All the fast memory on the chip</text><g class="s"><rect x="340" y="76" width="3" height="30" rx="1"/></g><text class="sub2" x="354" y="96" text-anchor="start">about 31 MB in total</text><text class="cap" x="40" y="152" text-anchor="start">The memory beside it</text><g class="h"><rect x="340" y="136" width="300" height="30" rx="3"/><text class="sub" x="490.0" y="151.0" text-anchor="middle" dominant-baseline="central">80 GB</text></g><g class="u"><rect x="190" y="190" width="300" height="42" rx="6"/><text class="sub" x="340.0" y="211.0" text-anchor="middle" dominant-baseline="central">2,600 times more capacity</text></g><text class="cap" x="40" y="274" text-anchor="start">132 multiprocessors with 228 kilobytes each. Added up, the entire fast memory of the chip is</text><text class="cap" x="40" y="294" text-anchor="start">about four hundredths of one percent of the slow memory.</text><text class="cap" x="40" y="330" text-anchor="start">Which is why the fast tier can never simply hold the data. It can only ever hold the small</text><text class="cap" x="40" y="350" text-anchor="start">piece being worked on at this instant.</text><text class="cap" x="40" y="386" text-anchor="start">The craft is choosing that piece, and that is what tiling is.</text></svg><figcaption>The ratio is easy to underestimate from the words alone. Drawn to scale, the strategy of keeping things on chip stops sounding like an option and starts sounding like a constraint.</figcaption></figure>
