<figure><div class='ts'>Fig 21 &nbsp;&middot;&nbsp; 5:34</div><h3>Attention in three steps</h3><svg viewBox="0 0 680 254" role="img"><title>Attention in three steps</title><g class="u"><rect x="40" y="55" width="180" height="66" rx="8"></rect><text class="lbl" x="130.0" y="79.0" text-anchor="middle" dominant-baseline="central">S = Q K transpose</text><text class="sub" x="130.0" y="97.0" text-anchor="middle" dominant-baseline="central">every query against every key</text></g><line class="conn" x1="226" y1="88" x2="250" y2="88" marker-end="url(#arw)"></line><g class="u"><rect x="256" y="55" width="180" height="66" rx="8"></rect><text class="lbl" x="346.0" y="79.0" text-anchor="middle" dominant-baseline="central">softmax, row by row</text><text class="sub" x="346.0" y="97.0" text-anchor="middle" dominant-baseline="central">turn scores into weights</text></g><line class="conn" x1="442" y1="88" x2="466" y2="88" marker-end="url(#arw)"></line><g class="u"><rect x="472" y="55" width="168" height="66" rx="8"></rect><text class="lbl" x="556.0" y="79.0" text-anchor="middle" dominant-baseline="central">multiply by V</text><text class="sub" x="556.0" y="97.0" text-anchor="middle" dominant-baseline="central">blend the values</text></g><text class="cap" x="40" y="162" text-anchor="start">Two matrix multiplies with a normalisation between them. Row i of the output is a weighted</text><text class="cap" x="40" y="182" text-anchor="start">average of every value vector, weighted by how well query i matched each key.</text><text class="cap" x="40" y="212" text-anchor="start">A layer runs a few dozen of these side by side, one per head, on different slices of the</text><text class="cap" x="40" y="232" text-anchor="start">same activations.</text></svg><figcaption>Everything in this document is about the middle object, S, and the fact that it is far larger than anything else in sight.</figcaption></figure>
