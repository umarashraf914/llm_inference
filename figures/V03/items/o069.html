<figure><div class='ts'>Fig 69 &nbsp;&middot;&nbsp; 19:03</div><h3>Wait three: warps talking to each other</h3><svg viewBox="0 0 680 250" role="img"><title>Wait three: warps talking to each other</title><g class="h"><rect x="40" y="55" width="280" height="80" rx="8"></rect><text class="lbl" x="180.0" y="78.0" text-anchor="middle" dominant-baseline="central">Version 1</text><text class="sub" x="180.0" y="96.0" text-anchor="middle" dominant-baseline="central">split K and V across warps,</text><text class="sub" x="180.0" y="113.0" text-anchor="middle" dominant-baseline="central">so partial results had to be exchanged</text></g><line class="conn" x1="326" y1="95" x2="356" y2="95" marker-end="url(#arw)"></line><g class="s"><rect x="362" y="55" width="278" height="80" rx="8"></rect><text class="lbl" x="501.0" y="78.0" text-anchor="middle" dominant-baseline="central">Version 2</text><text class="sub" x="501.0" y="96.0" text-anchor="middle" dominant-baseline="central">split Q instead,</text><text class="sub" x="501.0" y="113.0" text-anchor="middle" dominant-baseline="central">each warp owns its rows to the end</text></g><text class="cap" x="40" y="178" text-anchor="start">Exchanging partial sums between warps means a round trip through shared memory and a</text><text class="cap" x="40" y="198" text-anchor="start">synchronisation barrier, both of which stall the tensor cores.</text><text class="cap" x="40" y="228" text-anchor="start">Splitting the other operand removes the need to communicate at all.</text></svg><figcaption>Three waits, three rearrangements, and none of them changed a single arithmetic operation. 25 to 40 percent of peak becomes 50 to 73 on the A100.</figcaption></figure>
