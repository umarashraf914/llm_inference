<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 19:12</div><h3>Wait three: warps talking to each other</h3><svg viewBox='0 0 680 464' role='img'><title>Wait three: warps talking to each other</title><text class="hd" x="40" y="46">Four warps share one block of work: who gets which part</text><text class="hd" x="40" y="80" text-anchor="start">version 1: split K and V</text><g class="h"><rect x="40.0" y="94" width="56.0" height="120" rx="3"/><text class="sub" x="68.0" y="154.0" text-anchor="middle" dominant-baseline="central">w1</text></g><g class="h"><rect x="100.0" y="94" width="56.0" height="120" rx="3"/><text class="sub" x="128.0" y="154.0" text-anchor="middle" dominant-baseline="central">w2</text></g><g class="h"><rect x="160.0" y="94" width="56.0" height="120" rx="3"/><text class="sub" x="188.0" y="154.0" text-anchor="middle" dominant-baseline="central">w3</text></g><g class="h"><rect x="220.0" y="94" width="56.0" height="120" rx="3"/><text class="sub" x="248.0" y="154.0" text-anchor="middle" dominant-baseline="central">w4</text></g><text class="sub2" x="40" y="236" text-anchor="start">each warp: part of every row's answer</text><text class="sub2" x="40" y="254" text-anchor="start">so they must add up through shared memory</text><text class="hd" x="360" y="80" text-anchor="start">version 2: split Q</text><g class="s"><rect x="360" y="94.0" width="240" height="26.0" rx="3"/><text class="sub" x="480.0" y="107.0" text-anchor="middle" dominant-baseline="central">w1</text></g><g class="s"><rect x="360" y="124.0" width="240" height="26.0" rx="3"/><text class="sub" x="480.0" y="137.0" text-anchor="middle" dominant-baseline="central">w2</text></g><g class="s"><rect x="360" y="154.0" width="240" height="26.0" rx="3"/><text class="sub" x="480.0" y="167.0" text-anchor="middle" dominant-baseline="central">w3</text></g><g class="s"><rect x="360" y="184.0" width="240" height="26.0" rx="3"/><text class="sub" x="480.0" y="197.0" text-anchor="middle" dominant-baseline="central">w4</text></g><text class="sub2" x="360" y="236" text-anchor="start">each warp: whole rows, finished alone</text><text class="sub2" x="360" y="254" text-anchor="start">nothing to exchange</text><text class="cap" x="40" y="294" text-anchor="start">A thread block's warps, the 32-thread groups that run in lockstep ({{fig:v02-o037}}),</text><text class="cap" x="40" y="314" text-anchor="start">divide its work among them. Version 1 gave each warp a slice of K and V. Every warp then</text><text class="cap" x="40" y="334" text-anchor="start">held a part of every query row's answer, and the parts had to be written to shared</text><text class="cap" x="40" y="354" text-anchor="start">memory, waited for, and added before any row could finish.</text><text class="cap" x="40" y="394" text-anchor="start">Version 2 gives each warp a slice of Q instead. Rows are independent ({{fig:v03-o023}}),</text><text class="cap" x="40" y="414" text-anchor="start">so a warp with whole rows carries them all the way to the output on its own, and the</text><text class="cap" x="40" y="434" text-anchor="start">exchange disappears. No arithmetic changed; only which warp was given which piece.</text></svg><figcaption>Any split that cuts across a row manufactures a need to communicate that the mathematics never had. Three waits, three rearrangements, and none of them changed the result.</figcaption></figure>
