<figure><div class='ts'>Fig 46 &nbsp;&middot;&nbsp; 10:50</div><h3>Layer 1 produces Q, K and V</h3><svg viewBox="0 0 680 300" role="img"><title>Step 2 — layer 1 produces Q, K and V</title><g class="u"><rect x="40" y="36" width="600" height="176" rx="14"></rect><text class="lbl" x="62" y="62">Inside layer 1</text></g><g class="m"><rect x="64" y="96" width="120" height="56" rx="8"></rect><text class="lbl" x="124.0" y="115.0" text-anchor="middle" dominant-baseline="central">X</text><text class="sub" x="124.0" y="133.0" text-anchor="middle" dominant-baseline="central">1.6 MB</text></g><g class="h"><rect x="210" y="84" width="160" height="40" rx="8"></rect><text class="lbl" x="290.0" y="104.0" text-anchor="middle" dominant-baseline="central">W_Q  33.6 MB</text></g><g class="h"><rect x="210" y="130" width="160" height="40" rx="8"></rect><text class="lbl" x="290.0" y="150.0" text-anchor="middle" dominant-baseline="central">W_K, W_V  8.4 MB each</text></g><line class="conn" x1="190" y1="118" x2="206" y2="108" marker-end="url(#arw)"></line><line class="conn" x1="190" y1="128" x2="206" y2="145" marker-end="url(#arw)"></line><g class="s"><rect x="400" y="84" width="216" height="40" rx="8"></rect><text class="lbl" x="508.0" y="104.0" text-anchor="middle" dominant-baseline="central">Q  200 x 4096, 1.6 MB</text></g><g class="s"><rect x="400" y="130" width="216" height="40" rx="8"></rect><text class="lbl" x="508.0" y="150.0" text-anchor="middle" dominant-baseline="central">K, V  200 x 1024, 0.4 MB</text></g><line class="conn" x1="376" y1="104" x2="396" y2="104" marker-end="url(#arw)"></line><line class="conn" x1="376" y1="150" x2="396" y2="150" marker-end="url(#arw)"></line><text class="cap" x="40" y="244" text-anchor="start">Note the sizes. The weights are 50 MB; the things they produce are 2.4 MB. Even this first</text><text class="cap" x="40" y="264" text-anchor="start">matrix multiply cannot fit its operands in 228 KB, so it is tiled too.</text><text class="cap" x="40" y="292" text-anchor="start">Tiling is not a FlashAttention invention. Every large matmul on a GPU is tiled.</text></svg><figcaption>This is worth sitting with: reading W_Q alone moves twenty times more bytes than the entire Q it produces. At 200 tokens the weights dominate everything.</figcaption></figure>
