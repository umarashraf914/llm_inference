<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 29:47</div><h3>The climb, and where it plateaus</h3><svg viewBox='0 0 680 588' role='img'><title>The climb, and where it plateaus</title><text class="hd" x="40" y="46">Fraction of peak, on the chip each version was built for</text><text class="sub2" x="575" y="64" text-anchor="middle">trillion operations a second</text><text class="sub2" x="510" y="80" text-anchor="start">ceiling</text><text class="sub2" x="640" y="80" text-anchor="end">reached</text><line class="xok" x1="410.0" y1="84.0" x2="410.0" y2="258.0" stroke="var(--m)" stroke-width="1.2" stroke-dasharray="4 3"/><text class="cap" x="40" y="108" text-anchor="start">version 1</text><text class="sub2" x="110" y="108" text-anchor="start">A100</text><rect x="200" y="92" width="280" height="22" rx="3" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><g class="s"><rect x="270.0" y="92" width="42.0" height="22" rx="3"/></g><text class="sub2" x="320.0" y="108" text-anchor="start">25–40%</text><text class="sub2" x="510" y="108" text-anchor="start">312</text><text class="sub2" x="640" y="108" text-anchor="end">78–125</text><text class="cap" x="40" y="142" text-anchor="start">version 2</text><text class="sub2" x="110" y="142" text-anchor="start">A100</text><rect x="200" y="126" width="280" height="22" rx="3" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><g class="s"><rect x="340.0" y="126" width="64.39999999999998" height="22" rx="3"/></g><text class="sub2" x="332.0" y="142" text-anchor="end">50–73%</text><text class="sub2" x="510" y="142" text-anchor="start">312</text><text class="sub2" x="640" y="142" text-anchor="end">156–228</text><text class="cap" x="40" y="176" text-anchor="start">version 2</text><text class="sub2" x="110" y="176" text-anchor="start">H100</text><rect x="200" y="160" width="280" height="22" rx="3" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><g class="h"><rect x="295.0" y="160" width="6" height="22" rx="3"/></g><text class="sub2" x="306.0" y="176" text-anchor="start">35%</text><text class="sub2" x="510" y="176" text-anchor="start">989</text><text class="sub2" x="640" y="176" text-anchor="end">346</text><text class="cap" x="40" y="210" text-anchor="start">version 3</text><text class="sub2" x="110" y="210" text-anchor="start">H100, FP16</text><rect x="200" y="194" width="280" height="22" rx="3" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><g class="s"><rect x="406.5045500505561" y="194" width="6" height="22" rx="3"/></g><text class="sub2" x="401.5045500505561" y="210" text-anchor="end">75%</text><text class="sub2" x="510" y="210" text-anchor="start">989</text><text class="sub2" x="640" y="210" text-anchor="end">740</text><text class="cap" x="40" y="244" text-anchor="start">version 4</text><text class="sub2" x="110" y="244" text-anchor="start">B200, BF16</text><rect x="200" y="228" width="280" height="22" rx="3" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><g class="s"><rect x="396.73333333333335" y="228" width="6" height="22" rx="3"/></g><text class="sub2" x="391.73333333333335" y="244" text-anchor="end">71%</text><text class="sub2" x="510" y="244" text-anchor="start">2,250</text><text class="sub2" x="640" y="244" text-anchor="end">1,605</text><line class="tick" x1="200.0" y1="262.0" x2="200.0" y2="266.0"/><text class="sub2" x="200" y="280" text-anchor="middle">0%</text><line class="tick" x1="340.0" y1="262.0" x2="340.0" y2="266.0"/><text class="sub2" x="340.0" y="280" text-anchor="middle">50%</text><line class="tick" x1="410.0" y1="262.0" x2="410.0" y2="266.0"/><text class="sub2" x="410.0" y="280" text-anchor="middle">75%</text><line class="tick" x1="480.0" y1="262.0" x2="480.0" y2="266.0"/><text class="sub2" x="480" y="280" text-anchor="middle">100%</text><text class="cap" x="40" y="318" text-anchor="start">Fraction of peak, the measure this atlas has tracked since {{fig:v03-p03}}, for each</text><text class="cap" x="40" y="338" text-anchor="start">version on the chip it was built for. On the A100 the first two versions climbed from</text><text class="cap" x="40" y="358" text-anchor="start">25–40% to 50–73%. On the H100, version 2, which used none of its new hardware, fell to</text><text class="cap" x="40" y="378" text-anchor="start">35%, and version 3 brought it back to 75%. On the B200, version 4 reaches about 1,605</text><text class="cap" x="40" y="398" text-anchor="start">trillion operations a second (the paper's abstract says up to 1,613), 71% of the peak.</text><text class="cap" x="40" y="438" text-anchor="start">The ceiling underneath grew 7.2 times from the A100 and more than doubled from the H100,</text><text class="cap" x="40" y="458" text-anchor="start">yet the fraction has held near three quarters, the dashed line. It is held there by the</text><text class="cap" x="40" y="478" text-anchor="start">same three costs: the exponentials, the rescales and the backward pass's shared-memory</text><text class="cap" x="40" y="498" text-anchor="start">traffic.</text><text class="cap" x="40" y="538" text-anchor="start">Every number on the last two rows is 16-bit: FP16 for version 3, BF16 for version 4. In</text><text class="cap" x="40" y="558" text-anchor="start">FP8, version 3 reached close to 1.2 quadrillion a second (Part 11).</text></svg><figcaption>Ranges are drawn as ranges: each paper reports a span over sequence lengths and settings, not one number. The fraction makes chips comparable; the column on the right is what a user gets.</figcaption></figure>
