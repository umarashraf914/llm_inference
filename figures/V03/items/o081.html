<figure><div class='ts'>Fig 81 &nbsp;&middot;&nbsp; 29:47</div><h3>The climb, and where it plateaus</h3><svg viewBox="0 0 680 374" role="img"><title>The climb, and where it plateaus</title><text class="cap" x="40" y="70" text-anchor="start">FlashAttention 1</text><rect x="190" y="50" width="340" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="s"><rect x="190" y="50" width="136.0" height="30" rx="3"></rect></g><text class="sub2" x="542" y="70" text-anchor="start">25 to 40% of peak</text><text class="cap" x="40" y="116" text-anchor="start">FlashAttention 2</text><rect x="190" y="96" width="340" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="s"><rect x="190" y="96" width="248.2" height="30" rx="3"></rect></g><text class="sub2" x="542" y="116" text-anchor="start">50 to 73%, A100</text><text class="cap" x="40" y="162" text-anchor="start">FlashAttention 3</text><rect x="190" y="142" width="340" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="s"><rect x="190" y="142" width="255.0" height="30" rx="3"></rect></g><text class="sub2" x="542" y="162" text-anchor="start">about 75%, H100</text><text class="cap" x="40" y="208" text-anchor="start">FlashAttention 4</text><rect x="190" y="188" width="340" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="s"><rect x="190" y="188" width="241.39999999999998" height="30" rx="3"></rect></g><text class="sub2" x="542" y="208" text-anchor="start">about 71%, B200</text><text class="cap" x="40" y="262" text-anchor="start">The ceiling underneath grew 2.25 times from H100 to B200, yet the fraction held near three</text><text class="cap" x="40" y="282" text-anchor="start">quarters. On sequences of 4,000 tokens and up, version 4 runs 1.1 to 1.3 times faster than</text><text class="cap" x="40" y="302" text-anchor="start">the vendor's own library and 2.1 to 2.7 times faster than a Triton implementation.</text><text class="cap" x="40" y="332" text-anchor="start">Three quarters appears to be where this shape of kernel plateaus, held there by the same</text><text class="cap" x="40" y="352" text-anchor="start">three costs: the exponentials, the rescales, and the backward pass's memory traffic.</text></svg><figcaption>Four generations of the same kernel, each chasing whichever unit had become the constraint.</figcaption></figure>
