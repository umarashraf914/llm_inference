"196" text-anchor="start">version 3</text><text class="sub2" x="110" y="196" text-anchor="start">H100, FP16</text><rect x="200" y="180" width="280" height="22" rx="3" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><g class="s"><rect x="409.5045500505561" y="180" width="3" height="22" rx="3"/></g><text class="sub2" x="403.5045500505561" y="196" text-anchor="end">75%</text><text class="sub2" x="510" y="196" text-anchor="start">989</text><text class="sub2" x="640" y="196" text-anchor="end">740</text><text class="cap" x="40" y="230" text-anchor="start">version 4</text><text class="sub2" x="110" y="230" text-anchor="start">B200, BF16</text><rect x="200" y="214" width="280" height="22" rx="3" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><g class="s"><rect x="399.73333333333335" y="214" width="3" height="22" rx="3"/></g><text class="sub2" x="393.73333333333335" y="230" text-anchor="end">71%</text><text class="sub2" x="510" y="230" text-anchor="start">2,250</text><text class="sub2" x="640" y="230" text-anchor="end">1,605</text><line class="tick" x1="200.0" y1="248.0" x2="200.0" y2="252.0"/><text class="sub2" x="200" y="266" text-anchor="middle">0%</text><line class="tick" x1="340.0" y1="248.0" x2="340.0" y2="252.0"/><text class="sub2" x="340.0" y="266" text-anchor="middle">50%</text><line class="tick" x1="410.0" y1="248.0" x2="410.0" y2="252.0"/><text class="sub2" x="410.0" y="266" text-anchor="middle">75%</text><line class="tick" x1="480.0" y1="248.0" x2="480.0" y2="252.0"/><text class="sub2" x="480" y="266" text-anchor="middle">100%</text><line class="xok" x1="410.0" y1="70.0" x2="410.0" y2="248.0" stroke="var(--m)" stroke-width="1.2" stroke-dasharray="4 3"/><text class="sub2" x="510" y="266" text-anchor="start">trillion operations a second</text><text class="cap" x="40" y="304" text-anchor="start">Fraction of peak, the measure this atlas has tracked since {{fig:v03-p03}}, for each</text><text class="cap" x="40" y="324" text-anchor="start">version on the chip it was built for. On the A100 the first two versions climbed from</text><text class="cap" x="40" y="344" text-anchor="start">25–40% to 50–73%. On the H100, version 2, which used none of its new hardware, fell to</text><text class="cap" x="40" y="364" text-anchor="start">35%, and version 3 brought it back to 75%. On the B200, version 4 reaches about 1,605</text><text class="cap" x="40" y="384" text-anchor="start">trillion operations a second (the paper's abstract says up to 1,613), 71% of the peak.</text><text class="cap" x="40" y="424" text-anchor="start">The ceiling underneath grew 7.2 times from the A100 and more than doubled from the H100,</text><text class="cap" x="40" y="444" text-anchor="start">yet the fraction has held near three quarters, the dashed line. It is held there by the</text><text class="cap" x="40" y="464" text-anchor="start">same three costs: the exponentials, the rescales and the backward pass's shared-memory</text><text class="cap" x="40" y="484" text-anchor="start">traffic.</text><text class="cap" x="40" y="524" text-anchor="start">Every number on the last two rows is 16-bit: FP16 for version 3, BF16 for version 4. In</text><text class="cap" x="40" y="544" text-anchor="start">FP8, version 3 reached close to 1.2 quadrillion a second (Part 11).</text></svg><figcaption>Ranges are drawn as ranges: each paper reports a span over sequence lengths and settings, not one number. The fraction makes chips comparable; the column on the right is what a user gets.</figcaption></figure>
