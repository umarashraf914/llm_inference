<figure><div class='ts'>Fig 28 &nbsp;&middot;&nbsp; 8:19</div><h3>What a pass over the data is</h3><svg viewBox='0 0 680 322' role='img'><title>What a pass over the data is</title><text class="hd" x="40" y="46">A pass is one sweep over the data</text><g class="h"><rect x="40" y="76" width="600" height="34" rx="4"/><text class="sub" x="340.0" y="93.0" text-anchor="middle" dominant-baseline="central">read all of it, do something, write all of it</text></g><text class="cap" x="40" y="152" text-anchor="start">Three passes means the same data is read three times and written twice, whether or not the</text><text class="cap" x="40" y="172" text-anchor="start">arithmetic needed it that way.</text><text class="cap" x="40" y="208" text-anchor="start">The count of passes, not the count of operations, is what a memory-bound kernel is priced by.</text><text class="cap" x="40" y="244" text-anchor="start">The naive attention kernel makes three, because it is written as three separate programs and a</text><text class="cap" x="40" y="264" text-anchor="start">program cannot hand anything to the next except through memory.</text><text class="cap" x="40" y="300" text-anchor="start">The tiled version makes no pass over S at all; what it pays instead is counted in Part 5.</text></svg><figcaption>A unit worth counting. For anything memory-bound, halving the passes halves the runtime far more reliably than halving the arithmetic.</figcaption></figure>
