.0" height="22" rx="2"/><text class="sub" x="282.16666666666663" y="135.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="s"><rect x="338.0" y="124" width="45.0" height="22" rx="2"/><text class="sub" x="360.5" y="135.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="s"><rect x="416.3333333333333" y="124" width="45.0" height="22" rx="2"/><text class="sub" x="438.8333333333333" y="135.0" text-anchor="middle" dominant-baseline="central">4</text></g><g class="s"><rect x="494.66666666666663" y="124" width="45.0" height="22" rx="2"/><text class="sub" x="517.1666666666666" y="135.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="s"><rect x="573.0" y="124" width="45.0" height="22" rx="2"/><text class="sub" x="595.5" y="135.0" text-anchor="middle" dominant-baseline="central">6</text></g><text class="sub2" x="620.0" y="166" text-anchor="end">15 units</text><text class="hd" x="40" y="204" text-anchor="start">overlapped</text><text class="cap" x="40" y="231" text-anchor="start">copy engine</text><g class="h"><rect x="150.0" y="216" width="29.333333333333332" height="22" rx="2"/><text class="sub" x="164.66666666666666" y="227.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="h"><rect x="197.0" y="216" width="29.333333333333332" height="22" rx="2"/><text class="sub" x="211.66666666666666" y="227.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="h"><rect x="244.0" y="216" width="29.333333333333332" height="22" rx="2"/><text class="sub" x="258.6666666666667" y="227.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="h"><rect x="291.0" y="216" width="29.333333333333332" height="22" rx="2"/><text class="sub" x="305.6666666666667" y="227.0" text-anchor="middle" dominant-baseline="central">4</text></g><g class="h"><rect x="338.0" y="216" width="29.333333333333332" height="22" rx="2"/><text class="sub" x="352.6666666666667" y="227.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="h"><rect x="385.0" y="216" width="29.333333333333332" height="22" rx="2"/><text class="sub" x="399.6666666666667" y="227.0" text-anchor="middle" dominant-baseline="central">6</text></g><text class="cap" x="40" y="259" text-anchor="start">tensor cores</text><g class="s"><rect x="181.33333333333334" y="244" width="45.0" height="22" rx="2"/><text class="sub" x="203.83333333333334" y="255.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="228.33333333333331" y="244" width="45.0" height="22" rx="2"/><text class="sub" x="250.83333333333331" y="255.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="s"><rect x="275.3333333333333" y="244" width="45.0" height="22" rx="2"/><text class="sub" x="297.8333333333333" y="255.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="s"><rect x="322.3333333333333" y="244" width="45.0" height="22" rx="2"/><text class="sub" x="344.8333333333333" y="255.0" text-anchor="middle" dominant-baseline="central">4</text></g><g class="s"><rect x="369.3333333333333" y="244" width="45.0" height="22" rx="2"/><text class="sub" x="391.8333333333333" y="255.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="s"><rect x="416.3333333333333" y="244" width="45.0" height="22" rx="2"/><text class="sub" x="438.8333333333333" y="255.0" text-anchor="middle" dominant-baseline="central">6</text></g><text class="sub2" x="463.3333333333333" y="286" text-anchor="start">10 units</text><text class="cap" x="40" y="324" text-anchor="start">Done in turn, each tile costs its load plus its compute, and the units take turns being</text><text class="cap" x="40" y="344" text-anchor="start">idle: 6 × (1 + 1.5) = 15 units, with the tensor cores busy 60% of the time. Overlapped,</text><text class="cap" x="40" y="364" text-anchor="start">the next tile loads while the current one is computed, and each tile costs only the</text><text class="cap" x="40" y="384" text-anchor="start">longer of the two: 1 + 6 × 1.5 = 10 units, tensor cores busy 90%.</text><text class="cap" x="40" y="424" text-anchor="start">Overlap needs hardware that can start a job and let go of it: a copy engine that moves</text><text class="cap" x="40" y="444" text-anchor="start">tiles on its own, and a matrix multiply that runs while the warps do something else.</text><text class="cap" x="40" y="464" text-anchor="start">Hopper has both, the TMA ({{fig:v02-o035}}) and WGMMA. Version 2, written for the A100, did</text><text class="cap" x="40" y="484" text-anchor="start">its loads and its arithmetic strictly in turn.</text></svg><figcaption>Durations are illustrative; the shape is not. Whichever job is longer sets the pace, and the other one is hidden behind it for free.</figcaption></figure>
