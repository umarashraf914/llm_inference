<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 39:20</div><h3>After folding, every cached byte feeds all 128 heads</h3><svg viewBox='0 0 680 416' role='img'><title>After folding, every cached byte feeds all 128 heads</title><text class="hd" x="40" y="46">Operations per byte of cache read, attention at decode (log scale)</text><line class="tick" x1="60.0" y1="150.0" x2="620.0" y2="150.0"/><line class="tick" x1="111.1" y1="150.0" x2="111.1" y2="154.0"/><text class="sub2" x="111.06793873223236" y="168" text-anchor="middle">1</text><line class="tick" x1="280.7" y1="150.0" x2="280.7" y2="154.0"/><text class="sub2" x="280.71195915482156" y="168" text-anchor="middle">10</text><line class="tick" x1="450.4" y1="150.0" x2="450.4" y2="154.0"/><text class="sub2" x="450.35597957741084" y="168" text-anchor="middle">100</text><line class="tick" x1="620.0" y1="150.0" x2="620.0" y2="154.0"/><text class="sub2" x="620.0" y="168" text-anchor="middle">1,000</text><line class="xok" x1="530.1" y1="64.0" x2="530.1" y2="150.0" stroke="var(--h)" stroke-width="1.2" stroke-dasharray="4 3"/><text class="sub2" x="536.1143676258748" y="76" text-anchor="start">H100 ridge, 295</text><line class="tick" x1="111.1" y1="118.0" x2="111.1" y2="150.0"/><circle cx="111.1" cy="150.0" r="5" fill="var(--paper)" stroke="var(--s)" stroke-width="1.5"/><text class="sub2" x="117.06793873223236" y="112" text-anchor="start">multi-head: 1</text><line class="tick" x1="264.3" y1="94.0" x2="264.3" y2="150.0"/><circle cx="264.3" cy="150.0" r="5" fill="var(--paper)" stroke="var(--s)" stroke-width="1.5"/><text class="sub2" x="270.27175492892945" y="88" text-anchor="start">grouped, 8 per KV head: 8</text><line class="tick" x1="515.4" y1="118.0" x2="515.4" y2="150.0"/><circle cx="515.4" cy="150.0" r="5" fill="var(--paper)" stroke="var(--s)" stroke-width="1.5"/><text class="sub2" x="509.40027604568013" y="112" text-anchor="end">MLA, folded: 241.8</text><text class="cap" x="40" y="206" text-anchor="start">In multi-head attention each cached key and value serves exactly one query head: per</text><text class="cap" x="40" y="226" text-anchor="start">cached token, one head does a 128-long dot product for its score and a 128-long weighted</text><text class="cap" x="40" y="246" text-anchor="start">add for its output, 512 operations on 512 bytes, 1 per byte. Grouping eight query heads</text><text class="cap" x="40" y="266" text-anchor="start">on each KV head makes it 8.</text><text class="cap" x="40" y="306" text-anchor="start">After folding, every one of DeepSeek-V2's 128 heads works directly on the same cached</text><text class="cap" x="40" y="326" text-anchor="start">latent: a 576-long dot product for the score and a 512-long accumulation for the output.</text><text class="cap" x="40" y="346" text-anchor="start">That is 278,528 operations on 1,152 bytes, 242 per byte, close to the H100's ridge of</text><text class="cap" x="40" y="366" text-anchor="start">295 ({{fig:v03-p05}}). The arithmetic that decode used to leave idle is now spent buying back</text><text class="cap" x="40" y="386" text-anchor="start">bytes.</text></svg><figcaption>Counted for one new token, batch 1, 16-bit cache, ignoring the softmax and the projections. A kernel near the ridge is no longer simply waiting on memory.</figcaption></figure>
