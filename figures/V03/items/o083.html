<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 31:33</div><h3>Free memory that cannot be used</h3><svg viewBox='0 0 680 508' role='img'><title>Free memory that cannot be used</title><text class="hd" x="40" y="46">The cache region after requests have come and gone: A, B, C, in token slots</text><g class="s"><rect x="40" y="66" width="198.0" height="34" rx="3"/><text class="sub" x="139.0" y="83.0" text-anchor="middle" dominant-baseline="central">A: 4,096</text></g><rect x="240.0" y="66" width="73.0" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="276.5" y="118" text-anchor="middle">1,536</text><g class="s"><rect x="315.0" y="66" width="98.0" height="34" rx="3"/><text class="sub" x="364.0" y="83.0" text-anchor="middle" dominant-baseline="central">B: 2,048</text></g><rect x="415.0" y="66" width="48.0" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="439.0" y="118" text-anchor="middle">1,024</text><g class="s"><rect x="465.0" y="66" width="148.0" height="34" rx="3"/><text class="sub" x="539.0" y="83.0" text-anchor="middle" dominant-baseline="central">C: 3,072</text></g><rect x="615.0" y="66" width="23.0" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="626.5" y="118" text-anchor="middle">512</text><text class="cap" x="40" y="140" text-anchor="start">free in total: 1,536 + 1,024 + 512 = 3,072 slots</text><rect x="40" y="154" width="100.0" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="90.0" y="169.0" text-anchor="middle" dominant-baseline="central">2,048</text><text class="sub2" x="152.0" y="174" text-anchor="start">a new request needs 2,048 slots in one run, and no gap is that large</text><text class="hd" x="40" y="222">Share of cache memory holding token states, in the serving systems of the time</text><rect x="40" y="236" width="560" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><g class="s"><rect x="154.24" y="236" width="99.68" height="24" rx="3"/></g><text class="sub2" x="261.92" y="253" text-anchor="start">20.4% to 38.2%</text><line class="tick" x1="40.0" y1="264.0" x2="40.0" y2="268.0"/><text class="sub2" x="40" y="282" text-anchor="middle">0%</text><line class="tick" x1="320.0" y1="264.0" x2="320.0" y2="268.0"/><text class="sub2" x="320.0" y="282" text-anchor="middle">50%</text><line class="tick" x1="600.0" y1="264.0" x2="600.0" y2="268.0"/><text class="sub2" x="600" y="282" text-anchor="middle">100%</text><text class="cap" x="40" y="318" text-anchor="start">There is a second kind of waste. As requests of different lengths start and finish, the</text><text class="cap" x="40" y="338" text-anchor="start">free memory between reservations turns ragged. Here 3,072 slots are free in total,</text><text class="cap" x="40" y="358" text-anchor="start">enough for a new request of 2,048, yet no single gap holds more than 1,536, and a</text><text class="cap" x="40" y="378" text-anchor="start">reservation has to be one continuous run. That is external fragmentation.</text><text class="cap" x="40" y="398" text-anchor="start">Operating-system textbooks have described both kinds since the 1960s.</text><text class="cap" x="40" y="438" text-anchor="start">The vLLM team measured what the two cost together. In the serving systems of the time,</text><text class="cap" x="40" y="458" text-anchor="start">only 20.4% to 38.2% of the KV-cache memory held actual token states. More than half of</text><text class="cap" x="40" y="478" text-anchor="start">the most expensive memory in the machine was storing nothing.</text></svg><figcaption>Strip and bar to scale; the request sizes are illustrative, the 20.4–38.2% measured. Two wastes, one cause: insisting that a request's memory be one continuous run, sized in advance.</figcaption></figure>
