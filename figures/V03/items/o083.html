<figure><div class='ts'>Fig 83 &nbsp;&middot;&nbsp; 30:48</div><h3>What fragmentation is</h3><svg viewBox='0 0 680 378' role='img'><title>What fragmentation is</title><text class="hd" x="40" y="46">Fragmentation: space that exists but cannot be used</text><g class="u"><rect x="40" y="76" width="600" height="34" rx="4"/><text class="sub" x="340.0" y="93.0" text-anchor="middle" dominant-baseline="central">the memory set aside for caches</text></g><g class="s"><rect x="60" y="130" width="150" height="34" rx="3"/><text class="sub" x="135.0" y="147.0" text-anchor="middle" dominant-baseline="central">request A</text></g><rect x="216" y="130" width="60" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="282" y="130" width="190" height="34" rx="3"/><text class="sub" x="377.0" y="147.0" text-anchor="middle" dominant-baseline="central">request B</text></g><rect x="478" y="130" width="50" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="534" y="130" width="90" height="34" rx="3"/><text class="sub" x="579.0" y="147.0" text-anchor="middle" dominant-baseline="central">C</text></g><text class="sub2" x="60" y="194" text-anchor="start">the dashed gaps are free, and too small for the next request</text><text class="cap" x="40" y="244" text-anchor="start">There may be plenty of free space in total and still nowhere to put a new request, because</text><text class="cap" x="40" y="264" text-anchor="start">each block had to be one continuous run.</text><text class="cap" x="40" y="300" text-anchor="start">There is a second waste inside each block: it was sized for the longest answer the request</text><text class="cap" x="40" y="320" text-anchor="start">might produce, and most requests stop well short.</text><text class="cap" x="40" y="356" text-anchor="start">Between them, only twenty to thirty-eight percent of the reserved space held real tokens.</text></svg><figcaption>Two separate wastes with one cause: insisting that a request's memory be one continuous run.</figcaption></figure>
