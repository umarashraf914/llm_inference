<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 38:54</div><h3>Two multiplies in a row are one multiply</h3><svg viewBox='0 0 680 552' role='img'><title>Two multiplies in a row are one multiply</title><text class="hd" x="40" y="46">One head, made small: a 2-number query input x and a 2-number cached latent c</text><text class="cap" x="40" y="84" text-anchor="start">x = (2, 1)</text><text class="cap" x="40" y="104" text-anchor="start">c = (1, −2)</text><text class="sub2" x="150" y="76" text-anchor="start">W_Q makes the query</text><g class="m"><rect x="150" y="84" width="30" height="30" rx="3"/><text class="sub" x="165.0" y="99.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="184" y="84" width="30" height="30" rx="3"/><text class="sub" x="199.0" y="99.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="m"><rect x="150" y="118" width="30" height="30" rx="3"/><text class="sub" x="165.0" y="133.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="m"><rect x="184" y="118" width="30" height="30" rx="3"/><text class="sub" x="199.0" y="133.0" text-anchor="middle" dominant-baseline="central">−1</text></g><text class="sub2" x="330" y="76" text-anchor="start">W_UK rebuilds a key</text><g class="m"><rect x="330" y="84" width="30" height="30" rx="3"/><text class="sub" x="345.0" y="99.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="m"><rect x="364" y="84" width="30" height="30" rx="3"/><text class="sub" x="379.0" y="99.0" text-anchor="middle" dominant-baseline="central">−1</text></g><g class="m"><rect x="330" y="118" width="30" height="30" rx="3"/><text class="sub" x="345.0" y="133.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="364" y="118" width="30" height="30" rx="3"/><text class="sub" x="379.0" y="133.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="u"><rect x="40" y="180" width="290" height="146" rx="14"/><text class="lbl" x="62" y="206">rebuild the key, then score</text></g><text class="sub2" x="60" y="238" text-anchor="start">query q = x W_Q = (4, −1)</text><text class="sub2" x="60" y="260" text-anchor="start">key k = c W_UK = (0, −7)</text><text class="sub2" x="60" y="282" text-anchor="start">score q · k = 4 × 0 + (−1) × (−7) = 7</text><text class="sub2" x="60" y="304" text-anchor="start">a key built for every cached token</text><g class="s"><rect x="350" y="180" width="290" height="146" rx="14"/><text class="lbl" x="372" y="206">fold first, then score</text></g><text class="sub2" x="560" y="224" text-anchor="start">M</text><g class="s"><rect x="560" y="232" width="30" height="30" rx="3"/><text class="sub" x="575.0" y="247.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="s"><rect x="594" y="232" width="30" height="30" rx="3"/><text class="sub" x="609.0" y="247.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="560" y="266" width="30" height="30" rx="3"/><text class="sub" x="575.0" y="281.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="s"><rect x="594" y="266" width="30" height="30" rx="3"/><text class="sub" x="609.0" y="281.0" text-anchor="middle" dominant-baseline="central">−1</text></g><text class="sub2" x="370" y="238" text-anchor="start">M = W_Q W_UKᵀ, once</text><text class="sub2" x="370" y="260" text-anchor="start">x M = (9, 1)</text><text class="sub2" x="370" y="282" text-anchor="start">score = (9, 1) · c = 7</text><text class="sub2" x="370" y="304" text-anchor="start">no key is ever built</text><text class="cap" x="40" y="362" text-anchor="start">Two matrix multiplies in a row are the same as one multiply by their product. A query</text><text class="cap" x="40" y="382" text-anchor="start">only ever meets a rebuilt key inside such a chain, (x W_Q) · (c W_UK), so the key's</text><text class="cap" x="40" y="402" text-anchor="start">matrix can be folded into the query's matrix ahead of time: M = W_Q W_UKᵀ, computed once</text><text class="cap" x="40" y="422" text-anchor="start">when the model is loaded. Both routes give a score of 7.</text><text class="cap" x="40" y="462" text-anchor="start">At decode, the new token's query side is multiplied by M, and the result is dotted</text><text class="cap" x="40" y="482" text-anchor="start">straight with each cached latent. In the same way the values' decompression matrix folds</text><text class="cap" x="40" y="502" text-anchor="start">into the matrix that produces the output. The kernel simply reorders its multiplies, and</text><text class="cap" x="40" y="522" text-anchor="start">no step ever rebuilds the full keys and values from the latents.</text></svg><figcaption>Associativity, (AB)C = A(BC), doing real work. DeepSeek-V2 describes this as absorbing W_UK into the query projection and W_UV into the output projection.</figcaption></figure>
