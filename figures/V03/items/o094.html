s="s"><rect x="334" y="132" width="12" height="12" rx="1"></rect></g><g class="u"><rect x="654" y="132" width="12" height="12" rx="1"></rect></g><text class="cap" x="40" y="185" text-anchor="start">The query at decode is a single row, so the block count collapses to batch times heads. One</text><text class="cap" x="40" y="205" text-anchor="start">request with 32 heads gives 32 pieces of work for 132 multiprocessors.</text><text class="cap" x="40" y="245" text-anchor="start">The unsplit dimension is the cache itself. Splitting it into chunks gives every multiprocessor</text><text class="cap" x="40" y="265" text-anchor="start">a block: each computes attention against its own chunk, keeping its own running maximum and</text><text class="cap" x="40" y="285" text-anchor="start">denominator.</text><text class="cap" x="40" y="325" text-anchor="start">A small second kernel then merges the partial results, rescaling each by the difference</text><text class="cap" x="40" y="345" text-anchor="start">between its local maximum and the global one. The same correction as the inner loop, applied</text><text class="cap" x="40" y="365" text-anchor="start">once across chunks.</text><text class="cap" x="40" y="405" text-anchor="start">Up to 8 times faster decode at long context, and up to 50 times on the attention operation.</text></svg><figcaption>The online-softmax machinery reused at a different level. Because the correction is exact, splitting and merging changes nothing about the answer.</figcaption></figure>
