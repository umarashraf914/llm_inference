<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 42:07</div><h3>Flash-Decoding</h3><svg viewBox='0 0 680 696' role='img'><title>Flash-Decoding</title><text class="hd" x="40" y="46">Split the cache, give every chunk its own block, merge the partial answers</text><g class="s"><rect x="40" y="66" width="144" height="30" rx="3"/><text class="sub" x="112.0" y="81.0" text-anchor="middle" dominant-baseline="central">chunk 1 of the cache</text></g><line class="conn" x1="112" y1="98" x2="112" y2="118" marker-end="url(#arw)"/><g class="u"><rect x="40" y="122" width="144" height="50" rx="8"/><text class="lbl" x="112.0" y="138.0" text-anchor="middle" dominant-baseline="central">its own block</text><text class="sub" x="112.0" y="156.0" text-anchor="middle" dominant-baseline="central">m, l, partial output</text></g><line class="conn" x1="112" y1="174" x2="340" y2="212"/><g class="s"><rect x="190" y="66" width="144" height="30" rx="3"/><text class="sub" x="262.0" y="81.0" text-anchor="middle" dominant-baseline="central">chunk 2 of the cache</text></g><line class="conn" x1="262" y1="98" x2="262" y2="118" marker-end="url(#arw)"/><g class="u"><rect x="190" y="122" width="144" height="50" rx="8"/><text class="lbl" x="262.0" y="138.0" text-anchor="middle" dominant-baseline="central">its own block</text><text class="sub" x="262.0" y="156.0" text-anchor="middle" dominant-baseline="central">m, l, partial output</text></g><line class="conn" x1="262" y1="174" x2="340" y2="212"/><g class="s"><rect x="340" y="66" width="144" height="30" rx="3"/><text class="sub" x="412.0" y="81.0" text-anchor="middle" dominant-baseline="central">chunk 3 of the cache</text></g><line class="conn" x1="412" y1="98" x2="412" y2="118" marker-end="url(#arw)"/><g class="u"><rect x="340" y="122" width="144" height="50" rx="8"/><text class="lbl" x="412.0" y="138.0" text-anchor="middle" dominant-baseline="central">its own block</text><text class="sub" x="412.0" y="156.0" text-anchor="middle" dominant-baseline="central">m, l, partial output</text></g><line class="conn" x1="412" y1="174" x2="340" y2="212"/><g class="s"><rect x="490" y="66" width="144" height="30" rx="3"/><text class="sub" x="562.0" y="81.0" text-anchor="middle" dominant-baseline="central">chunk 4 of the cache</text></g><line class="conn" x1="562" y1="98" x2="562" y2="118" marker-end="url(#arw)"/><g class="u"><rect x="490" y="122" width="144" height="50" rx="8"/><text class="lbl" x="562.0" y="138.0" text-anchor="middle" dominant-baseline="central">its own block</text><text class="sub" x="562.0" y="156.0" text-anchor="middle" dominant-baseline="central">m, l, partial output</text></g><line class="conn" x1="562" y1="174" x2="340" y2="212"/><g class="m"><rect x="190" y="214" width="300" height="50" rx="8"/><text class="lbl" x="340.0" y="230.0" text-anchor="middle" dominant-baseline="central">merge kernel</text><text class="sub" x="340.0" y="248.0" text-anchor="middle" dominant-baseline="central">rescale each by its maximum's gap, add</text></g><line class="conn" x1="340" y1="266" x2="340" y2="286" marker-end="url(#arw)"/><g class="s"><rect x="240" y="290" width="200" height="36" rx="8"/><text class="lbl" x="340.0" y="308.0" text-anchor="middle" dominant-baseline="central">exact attention output</text></g><text class="cap" x="40" y="366" text-anchor="start">Flash-Decoding, published in October 2023 by Tri Dao and collaborators, splits the</text><text class="cap" x="40" y="386" text-anchor="start">cached keys and values into chunks. Every chunk gets its own block of work, and so its</text><text class="cap" x="40" y="406" text-anchor="start">own multiprocessor, which computes the new token's attention against that chunk as if it</text><text class="cap" x="40" y="426" text-anchor="start">were the whole sequence.</text><text class="cap" x="40" y="466" text-anchor="start">Softmax should forbid that: its normalisation couples every position in a row to every</text><text class="cap" x="40" y="486" text-anchor="start">other, so partial results cannot simply be added. What makes the split legal is the</text><text class="cap" x="40" y="506" text-anchor="start">bookkeeping the online softmax already keeps. Each chunk keeps its own running maximum</text><text class="cap" x="40" y="526" text-anchor="start">and its own sum of exponentials, and writes them out beside its partial output, in</text><text class="cap" x="40" y="546" text-anchor="start">practice as one number per row, m + ln l, the same number version 2 keeps for the</text><text class="cap" x="40" y="566" text-anchor="start">backward pass.</text><text class="cap" x="40" y="606" text-anchor="start">A small second kernel merges the partial outputs, rescaling each by how far its local</text><text class="cap" x="40" y="626" text-anchor="start">maximum sits below the global one: the online softmax's correction, run in parallel</text><text class="cap" x="40" y="646" text-anchor="start">across the chunks of the cache instead of serially down one row. The merged answer is</text><text class="cap" x="40" y="666" text-anchor="start">exact attention.</text></svg><figcaption>Machinery from Part 7 reused one level up. The next figure runs the merge on numbers.</figcaption></figure>
