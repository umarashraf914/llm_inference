<figure><div class='ts'>Fig 22 &nbsp;&middot;&nbsp; 6:20</div><h3>What the exponential does</h3><svg viewBox="0 0 680 404" role="img"><title>What the exponential does</title><text class="hd" x="40" y="46">The exponential turns any number into a positive one</text><line class="axis" x1="60" y1="240" x2="380" y2="240"></line><line class="axis" x1="220" y1="60" x2="220" y2="250"></line><polyline class="pl-m" points="70,238 120,234 170,224 220,204 260,170 295,120 320,70"></polyline><text class="sub2" x="226" y="258" text-anchor="start">0</text><text class="sub2" x="90" y="258" text-anchor="start">negative</text><text class="sub2" x="300" y="258" text-anchor="start">positive</text><text class="sub2 halo" x="226" y="200" text-anchor="start">1</text><text class="cap" x="420" y="100" text-anchor="start">big negative in, near zero out</text><text class="cap" x="420" y="126" text-anchor="start">zero in, exactly one out</text><text class="cap" x="420" y="152" text-anchor="start">big positive in, enormous out</text><text class="cap" x="40" y="306" text-anchor="start">Softmax uses it to turn scores, which can be negative, into weights that are all positive and</text><text class="cap" x="40" y="326" text-anchor="start">can be added up into a total.</text><text class="cap" x="40" y="362" text-anchor="start">It also explains why softmax subtracts the largest score first: the curve climbs so steeply</text><text class="cap" x="40" y="382" text-anchor="start">that without that subtraction the numbers overflow what the format can hold.</text></svg><figcaption>Two properties are doing the work: it is always positive, and it grows explosively. The first makes softmax possible, the second makes it dangerous.</figcaption></figure>
