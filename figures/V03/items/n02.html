<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 29:13</div><h3>The lead is claimed from 4,000 tokens up</h3><svg viewBox='0 0 680 462' role='img'><title>The lead is claimed from 4,000 tokens up</title><text class="hd" x="40" y="46">Sequence lengths the paper benchmarks, and where it claims a lead</text><line class="tick" x1="120.0" y1="112.0" x2="620.0" y2="112.0"/><line class="tick" x1="120.0" y1="108.0" x2="120.0" y2="116.0"/><text class="sub2" x="120.0" y="134" text-anchor="middle">1k</text><line class="tick" x1="220.0" y1="108.0" x2="220.0" y2="116.0"/><text class="sub2" x="220.0" y="134" text-anchor="middle">2k</text><line class="tick" x1="320.0" y1="108.0" x2="320.0" y2="116.0"/><text class="sub2" x="320.0" y="134" text-anchor="middle">4k</text><line class="tick" x1="420.0" y1="108.0" x2="420.0" y2="116.0"/><text class="sub2" x="420.0" y="134" text-anchor="middle">8k</text><line class="tick" x1="520.0" y1="108.0" x2="520.0" y2="116.0"/><text class="sub2" x="520.0" y="134" text-anchor="middle">16k</text><line class="tick" x1="620.0" y1="108.0" x2="620.0" y2="116.0"/><text class="sub2" x="620.0" y="134" text-anchor="middle">32k</text><g class="s"><rect x="320.0" y="66" width="300.0" height="30" rx="3"/><text class="sub" x="470.0" y="81.0" text-anchor="middle" dominant-baseline="central">consistently ahead of every baseline</text></g><rect x="120" y="66" width="196.0" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="218.0" y="81.0" text-anchor="middle" dominant-baseline="central">no consistent lead</text><text class="cap" x="40" y="116" text-anchor="start">tokens</text><text class="cap" x="40" y="170" text-anchor="start">against cuDNN 9.13</text><text class="hd" x="200" y="170" text-anchor="start">1.1 to 1.3 times faster</text><text class="sub2" x="200" y="187" text-anchor="start">NVIDIA's own attention library, tuned for the B200</text><text class="cap" x="40" y="210" text-anchor="start">against Triton</text><text class="hd" x="200" y="210" text-anchor="start">2.1 to 2.7 times faster</text><text class="sub2" x="200" y="227" text-anchor="start">the open-source kernel language much of the field uses</text><text class="cap" x="40" y="250" text-anchor="start">measured as</text><text class="hd" x="200" y="250" text-anchor="start">forward pass, BF16, B200</text><text class="sub2" x="200" y="267" text-anchor="start">head dimension 64, 128 or (192, 128); 32k tokens a batch</text><text class="cap" x="40" y="312" text-anchor="start">The gains are real but regime specific. The paper sweeps sequence lengths from 1k to 32k</text><text class="cap" x="40" y="332" text-anchor="start">tokens, sizing the batch so that 32k tokens are processed at once, and claims a</text><text class="cap" x="40" y="352" text-anchor="start">consistent lead over every baseline from 4k up. Version 4's BF16 forward pass runs 1.1</text><text class="cap" x="40" y="372" text-anchor="start">to 1.3 times faster than cuDNN 9.13 and 2.1 to 2.7 times faster than Triton.</text><text class="cap" x="40" y="412" text-anchor="start">Below 4,000 tokens it claims no consistent lead. The paper also notes that later cuDNN</text><text class="cap" x="40" y="432" text-anchor="start">releases have taken up many of these techniques and now perform about the same.</text></svg><figcaption>A speed-up is a sentence with conditions attached: a range of lengths, a precision, a pass, and a baseline with a version number.</figcaption></figure>
