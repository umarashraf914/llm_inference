<figure><div class='ts'>Fig 43 &nbsp;&middot;&nbsp; 11:20</div><h3>How much traffic tiling actually saves</h3><svg viewBox="0 0 680 354" role="img"><title>How much traffic tiling actually saves</title><g class="h"><rect x="60" y="46" width="260" height="42" rx="6"></rect><text class="sub" x="190.0" y="67.0" text-anchor="middle" dominant-baseline="central">naive  ~  4 n squared</text></g><g class="s"><rect x="360" y="46" width="260" height="42" rx="6"></rect><text class="sub" x="490.0" y="67.0" text-anchor="middle" dominant-baseline="central">flash  ~  4 n squared d squared / M</text></g><text class="sub2" x="60" y="116" text-anchor="start">bytes, dominated by S and P</text><text class="sub2" x="360" y="116" text-anchor="start">M is the SRAM budget</text><g class="m"><rect x="190" y="152" width="300" height="42" rx="6"></rect><text class="sub" x="340.0" y="173.0" text-anchor="middle" dominant-baseline="central">ratio  =  M / d squared</text></g><text class="cap" x="40" y="232" text-anchor="start">The saving is the ratio of on-chip memory to the square of the head dimension. With about</text><text class="cap" x="40" y="252" text-anchor="start">100,000 elements of SRAM and a head dimension of 64, that predicts roughly 24 times less</text><text class="cap" x="40" y="272" text-anchor="start">traffic, which is what a direct byte count gives.</text><text class="cap" x="40" y="312" text-anchor="start">Two consequences: more shared memory helps linearly, and a larger head dimension hurts</text><text class="cap" x="40" y="332" text-anchor="start">quadratically. Every later generation fights for shared-memory headroom for this reason.</text></svg><figcaption>One expression captures the whole benefit, and it explains why the technique's advantage varies so much between model architectures.</figcaption></figure>
