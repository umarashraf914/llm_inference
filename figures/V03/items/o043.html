<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:07</div><h3>How much tiling saves depends on the SRAM and the head size</h3><svg viewBox='0 0 680 602' role='img'><title>How much tiling saves depends on the SRAM and the head size</title><text class="hd" x="40" y="46">Where n² d² / M comes from, step by step</text><text class="cap" x="40" y="86" text-anchor="start">a block of K and V must fit</text><g class="u"><rect x="250" y="66" width="220" height="30" rx="3"/><text class="sub" x="360.0" y="81.0" text-anchor="middle" dominant-baseline="central">block rows × d: a share of M</text></g><text class="sub2" x="484" y="86" text-anchor="start">rows go as M ÷ d</text><text class="cap" x="40" y="126" text-anchor="start">the number of trips</text><g class="u"><rect x="250" y="106" width="220" height="30" rx="3"/><text class="sub" x="360.0" y="121.0" text-anchor="middle" dominant-baseline="central">n ÷ block rows</text></g><text class="sub2" x="484" y="126" text-anchor="start">goes as n·d ÷ M</text><text class="cap" x="40" y="166" text-anchor="start">each trip moves Q and O once</text><g class="u"><rect x="250" y="146" width="220" height="30" rx="3"/><text class="sub" x="360.0" y="161.0" text-anchor="middle" dominant-baseline="central">about n·d numbers</text></g><text class="cap" x="40" y="206" text-anchor="start">traffic</text><g class="m"><rect x="250" y="186" width="220" height="30" rx="3"/><text class="sub" x="360.0" y="201.0" text-anchor="middle" dominant-baseline="central">trips × n·d</text></g><text class="sub2" x="484" y="206" text-anchor="start">goes as n²·d² ÷ M</text><text class="cap" x="40" y="248" text-anchor="start">double the SRAM:</text><text class="sub2" x="250" y="248" text-anchor="start">half the traffic</text><text class="cap" x="40" y="272" text-anchor="start">double the head dimension:</text><text class="sub2" x="250" y="272" text-anchor="start">four times the traffic, at the same SRAM</text><text class="cap" x="40" y="312" text-anchor="start">The paper proves that standard attention needs on the order of N·d + N² HBM accesses and</text><text class="cap" x="40" y="332" text-anchor="start">its algorithm on the order of N²·d² ÷ M, for SRAM of size M. The steps above are where</text><text class="cap" x="40" y="352" text-anchor="start">that comes from: the blocks must fit, so their size is set by M ÷ d, and every trip</text><text class="cap" x="40" y="372" text-anchor="start">costs a full pass over n·d numbers.</text><text class="cap" x="40" y="412" text-anchor="start">So the saving over the n² of the naive kernel goes as M ÷ d²: it grows in proportion to</text><text class="cap" x="40" y="432" text-anchor="start">on-chip memory and falls with the square of the head size. The constants are dropped, so</text><text class="cap" x="40" y="452" text-anchor="start">this predicts how the saving moves, not its size; a direct count at one size is the</text><text class="cap" x="40" y="472" text-anchor="start">previous figures' job, and the paper's measurement on GPT-2 medium found 9.2 times less</text><text class="cap" x="40" y="492" text-anchor="start">traffic in all ({{fig:v03-o003}}).</text><text class="cap" x="40" y="532" text-anchor="start">That measurement is a whole training step, whose standard attention also writes masked</text><text class="cap" x="40" y="552" text-anchor="start">and dropped-out copies of the score matrix (the paper's Figure 1 shows those passes), so</text><text class="cap" x="40" y="572" text-anchor="start">its saving is not the count for one plain head.</text></svg><figcaption>Tiling does not make attention's traffic linear in n: it is still n², with a smaller constant. Every later generation fights for on-chip memory because M is the lever in that constant.</figcaption></figure>
