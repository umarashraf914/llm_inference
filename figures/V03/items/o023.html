<figure><div class='ts'>Fig 23 &nbsp;&middot;&nbsp; 6:20</div><h3>Softmax is row by row</h3><svg viewBox='0 0 680 420' role='img'><title>Softmax is row by row</title><text class="hd" x="40" y="46">Softmax works across a row, not the whole grid</text><g class="u"><rect x="150" y="70" width="54" height="30" rx="3"/></g><g class="u"><rect x="212" y="70" width="54" height="30" rx="3"/></g><g class="u"><rect x="274" y="70" width="54" height="30" rx="3"/></g><g class="u"><rect x="336" y="70" width="54" height="30" rx="3"/></g><g class="u"><rect x="398" y="70" width="54" height="30" rx="3"/></g><g class="u"><rect x="460" y="70" width="54" height="30" rx="3"/></g><g class="u"><rect x="522" y="70" width="54" height="30" rx="3"/></g><g class="m"><rect x="150" y="108" width="54" height="30" rx="3"/></g><g class="m"><rect x="212" y="108" width="54" height="30" rx="3"/></g><g class="m"><rect x="274" y="108" width="54" height="30" rx="3"/></g><g class="m"><rect x="336" y="108" width="54" height="30" rx="3"/></g><g class="m"><rect x="398" y="108" width="54" height="30" rx="3"/></g><g class="m"><rect x="460" y="108" width="54" height="30" rx="3"/></g><g class="m"><rect x="522" y="108" width="54" height="30" rx="3"/></g><g class="u"><rect x="150" y="146" width="54" height="30" rx="3"/></g><g class="u"><rect x="212" y="146" width="54" height="30" rx="3"/></g><g class="u"><rect x="274" y="146" width="54" height="30" rx="3"/></g><g class="u"><rect x="336" y="146" width="54" height="30" rx="3"/></g><g class="u"><rect x="398" y="146" width="54" height="30" rx="3"/></g><g class="u"><rect x="460" y="146" width="54" height="30" rx="3"/></g><g class="u"><rect x="522" y="146" width="54" height="30" rx="3"/></g><g class="u"><rect x="150" y="184" width="54" height="30" rx="3"/></g><g class="u"><rect x="212" y="184" width="54" height="30" rx="3"/></g><g class="u"><rect x="274" y="184" width="54" height="30" rx="3"/></g><g class="u"><rect x="336" y="184" width="54" height="30" rx="3"/></g><g class="u"><rect x="398" y="184" width="54" height="30" rx="3"/></g><g class="u"><rect x="460" y="184" width="54" height="30" rx="3"/></g><g class="u"><rect x="522" y="184" width="54" height="30" rx="3"/></g><rect x="146" y="104" width="442" height="38" rx="4" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="150" y="236" text-anchor="start">one row: one token's scores against every earlier token</text><text class="cap" x="40" y="286" text-anchor="start">Each row is normalised on its own, so its weights add up to one. A row knows nothing about</text><text class="cap" x="40" y="306" text-anchor="start">any other row.</text><text class="cap" x="40" y="342" text-anchor="start">That independence is what allows the rows to be split across the chip, and it is why the</text><text class="cap" x="40" y="362" text-anchor="start">running maximum and denominator later are kept per row rather than per tile.</text><text class="cap" x="40" y="398" text-anchor="start">Two numbers per row, for every row. That is all the tiled version has to carry.</text></svg><figcaption>The row is the unit of the whole computation. Everything about the online algorithm follows from rows being independent of each other.</figcaption></figure>
