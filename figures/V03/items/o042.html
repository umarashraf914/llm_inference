<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:07</div><h3>What is in SRAM at any one instant</h3><svg viewBox='0 0 680 526' role='img'><title>What is in SRAM at any one instant</title><text class="hd" x="40" y="46">A working set: everything the current step needs within reach at once</text><rect x="40" y="70" width="560.0" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><g class="s"><rect x="40" y="70" width="39.29824561403509" height="34" rx="1"/></g><g class="h"><rect x="79.2982456140351" y="70" width="39.29824561403509" height="34" rx="1"/></g><g class="h"><rect x="118.59649122807019" y="70" width="39.29824561403509" height="34" rx="1"/></g><g class="m"><rect x="157.8947368421053" y="70" width="78.59649122807018" height="34" rx="1"/></g><g class="s"><rect x="236.49122807017545" y="70" width="78.59649122807018" height="34" rx="1"/></g><g class="s"><rect x="315.08771929824564" y="70" width="2.456140350877193" height="34" rx="1"/></g><text class="sub2" x="600.0" y="124" text-anchor="end">228 KB of shared memory</text><text class="sub2" x="40" y="124" text-anchor="start">113 KB in use</text><g class="s"><rect x="40" y="147" width="12" height="12" rx="2"/></g><text class="cap" x="60" y="158" text-anchor="start">Q block</text><text class="sub2" x="200" y="158" text-anchor="start">128 × 64</text><text class="sub2" x="360" y="158" text-anchor="end">16 KB</text><g class="h"><rect x="40" y="169" width="12" height="12" rx="2"/></g><text class="cap" x="60" y="180" text-anchor="start">K block</text><text class="sub2" x="200" y="180" text-anchor="start">128 × 64</text><text class="sub2" x="360" y="180" text-anchor="end">16 KB</text><g class="h"><rect x="40" y="191" width="12" height="12" rx="2"/></g><text class="cap" x="60" y="202" text-anchor="start">V block</text><text class="sub2" x="200" y="202" text-anchor="start">128 × 64</text><text class="sub2" x="360" y="202" text-anchor="end">16 KB</text><g class="m"><rect x="40" y="213" width="12" height="12" rx="2"/></g><text class="cap" x="60" y="224" text-anchor="start">S tile</text><text class="sub2" x="200" y="224" text-anchor="start">128 × 128</text><text class="sub2" x="360" y="224" text-anchor="end">32 KB</text><g class="s"><rect x="40" y="235" width="12" height="12" rx="2"/></g><text class="cap" x="60" y="246" text-anchor="start">O accumulator</text><text class="sub2" x="200" y="246" text-anchor="start">128 × 64, FP32</text><text class="sub2" x="360" y="246" text-anchor="end">32 KB</text><g class="s"><rect x="40" y="257" width="12" height="12" rx="2"/></g><text class="cap" x="60" y="268" text-anchor="start">m and l</text><text class="sub2" x="200" y="268" text-anchor="start">128 rows, FP32</text><text class="sub2" x="360" y="268" text-anchor="end">1 KB</text><text class="cap" x="40" y="316" text-anchor="start">Not everything the computation touches: only what one step needs at the same moment,</text><text class="cap" x="40" y="336" text-anchor="start">because that is what has to fit. With blocks of 128 and head dimension 64, one step</text><text class="cap" x="40" y="356" text-anchor="start">needs a block each of Q, K and V, the tile of scores they make, the running output, and</text><text class="cap" x="40" y="376" text-anchor="start">two numbers per row. Drawn end to end that is 113 KB, inside the 228 KB of shared memory</text><text class="cap" x="40" y="396" text-anchor="start">one multiprocessor has.</text><text class="cap" x="40" y="436" text-anchor="start">The n × n matrix that would have been 134 MB for this head never exists as a whole. In a</text><text class="cap" x="40" y="456" text-anchor="start">real kernel the S tile and the output accumulator usually sit in the registers, the</text><text class="cap" x="40" y="476" text-anchor="start">multiprocessor's other on-chip store ({{fig:v02-o030}}); the budget arithmetic is the</text><text class="cap" x="40" y="496" text-anchor="start">same.</text></svg><figcaption>Bars to scale against the budget. Too large a block and the list spills; too small and the same data is fetched again and again. Choosing the block size is the act of making this list fit.</figcaption></figure>
