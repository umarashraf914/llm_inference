<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 15:28</div><h3>Recomputation instead of storage</h3><svg viewBox='0 0 680 492' role='img'><title>Recomputation instead of storage</title><text class="hd" x="40" y="46">What the backward pass needs, kept two ways, for one head at 8,192 tokens</text><g class="h"><rect x="40" y="66" width="230" height="32" rx="3"/><text class="sub" x="155.0" y="82.0" text-anchor="middle" dominant-baseline="central">store the weights P</text></g><text class="sub2" x="286" y="87" text-anchor="start">an n × n matrix in HBM</text><text class="sub2" x="640" y="87" text-anchor="end">134 MB</text><g class="s"><rect x="40" y="110" width="230" height="32" rx="3"/><text class="sub" x="155.0" y="126.0" text-anchor="middle" dominant-baseline="central">store m and l, rebuild P</text></g><text class="sub2" x="286" y="131" text-anchor="start">two numbers per row</text><text class="sub2" x="640" y="131" text-anchor="end">64 KB</text><text class="hd" x="40" y="182">The price, as measured on GPT-2 medium, forward and backward</text><text class="cap" x="40" y="218" text-anchor="start">standard</text><g class="h"><rect x="200" y="202" width="265.6914893617021" height="24" rx="3"/></g><text class="sub2" x="473.6914893617021" y="219" text-anchor="start">66.6 billion operations</text><text class="cap" x="40" y="252" text-anchor="start">FlashAttention</text><g class="s"><rect x="200" y="236" width="300.0" height="24" rx="3"/></g><text class="sub2" x="508.0" y="253" text-anchor="start">75.2 billion operations</text><text class="cap" x="40" y="302" text-anchor="start">Training runs a backward pass that needs the attention weights again ({{fig:v03-o060}}).</text><text class="cap" x="40" y="322" text-anchor="start">Stored, they are a fresh n × n matrix in HBM, 134 MB for this one head. The first</text><text class="cap" x="40" y="342" text-anchor="start">version stored only the running maximum and sum of each row, 64 KB, 2,048 times less;</text><text class="cap" x="40" y="362" text-anchor="start">version 2 stores a single number per row, m + ln l.</text><text class="cap" x="40" y="402" text-anchor="start">In the backward pass the kernel reloads Q, K and V tile by tile and rebuilds each tile</text><text class="cap" x="40" y="422" text-anchor="start">of S and P on chip, from m and l, at the moment it is needed. The extra multiplications</text><text class="cap" x="40" y="442" text-anchor="start">run on data already in SRAM. They added 13% to the arithmetic, and the kernel was still</text><text class="cap" x="40" y="462" text-anchor="start">5.7 times faster, because the HBM traffic they replaced is the expensive kind.</text></svg><figcaption>Never spend HBM traffic on anything you can rebuild from what is already on chip. A trade that would be absurd if arithmetic were expensive, and is obviously right on a chip where it is the cheap side of a 295-to-1 ratio.</figcaption></figure>
