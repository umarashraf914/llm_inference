<figure><div class='ts'>Fig 61 &nbsp;&middot;&nbsp; 14:37</div><h3>Recomputation instead of storage</h3><svg viewBox="0 0 680 214" role="img"><title>Recomputation instead of storage</title><g class="h"><rect x="40" y="55" width="280" height="80" rx="8"></rect><text class="lbl" x="180.0" y="86.0" text-anchor="middle" dominant-baseline="central">Store the n by n matrix</text><text class="sub" x="180.0" y="104.0" text-anchor="middle" dominant-baseline="central">quadratic in sequence length</text></g><line class="conn" x1="324" y1="95" x2="356" y2="95" marker-end="url(#arw)"></line><g class="s"><rect x="360" y="55" width="280" height="80" rx="8"></rect><text class="lbl" x="500.0" y="86.0" text-anchor="middle" dominant-baseline="central">Store two numbers per row</text><text class="sub" x="500.0" y="104.0" text-anchor="middle" dominant-baseline="central">the maximum and the denominator</text></g><text class="cap" x="40" y="174" text-anchor="start">The backward pass rebuilds each tile on chip at the moment it is needed. Extra multiplies are</text><text class="cap" x="40" y="194" text-anchor="start">cheap because the data is already in SRAM; the HBM traffic avoided is the expensive kind.</text></svg><figcaption>A training detail, since inference never runs a backward pass. It completes the principle: never spend HBM traffic on anything you can rebuild on chip.</figcaption></figure>
