<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 40:20</div><h3>The 93.3 percent has three sources</h3><svg viewBox='0 0 680 500' role='img'><title>The 93.3 percent has three sources</title><text class="hd" x="40" y="46">Cache bytes per token, all layers (bars to scale)</text><text class="cap" x="40" y="83" text-anchor="start">DeepSeek 67B, 16-bit</text><g class="h"><rect x="250" y="66" width="380.0" height="26" rx="3"/><text class="sub" x="440.0" y="79.0" text-anchor="middle" dominant-baseline="central">389.1 KB</text></g><text class="cap" x="40" y="121" text-anchor="start">DeepSeek-V2, MLA, 16-bit</text><g class="m"><rect x="250" y="104" width="67.5" height="26" rx="3"/></g><text class="sub2" x="325.5" y="121.0" text-anchor="start">69.1 KB: −82.2%</text><text class="cap" x="40" y="159" text-anchor="start">DeepSeek-V2, ~6-bit cache</text><g class="s"><rect x="250" y="142" width="25.3125" height="26" rx="3"/></g><text class="sub2" x="283.3125" y="159.0" text-anchor="start">25.9 KB: −93.3%</text><text class="cap" x="40" y="210" text-anchor="start">Measured against DeepSeek's own previous 67-billion-parameter model, the KV cache</text><text class="cap" x="40" y="230" text-anchor="start">shrinks by 93.3% and maximum generation throughput rises to 5.76 times. The arithmetic</text><text class="cap" x="40" y="250" text-anchor="start">shows where that comes from. The 67B already used grouped-query attention, 8 KV heads</text><text class="cap" x="40" y="270" text-anchor="start">over 95 layers: 389 KB per token in 16 bits. MLA's 576 numbers a layer, over 60 layers</text><text class="cap" x="40" y="290" text-anchor="start">instead of 95, are 69 KB in 16 bits, 82.2% less.</text><text class="cap" x="40" y="330" text-anchor="start">The rest is precision: the deployed model compressed its cache to about 6 bits a number,</text><text class="cap" x="40" y="350" text-anchor="start">and 25.9 KB is exactly 93.3% less. The 5.76 times was also measured with the weights in</text><text class="cap" x="40" y="370" text-anchor="start">FP8. So the headline mixes three levers: fewer stored numbers, fewer layers, and fewer</text><text class="cap" x="40" y="390" text-anchor="start">bits.</text><text class="cap" x="40" y="430" text-anchor="start">DeepSeek also reports quality at or above full multi-head attention. That last claim is</text><text class="cap" x="40" y="450" text-anchor="start">one to read carefully, since it comes from their own comparisons inside their own</text><text class="cap" x="40" y="470" text-anchor="start">training recipe.</text></svg><figcaption>Every input is from the DeepSeek-V2 and DeepSeek LLM papers; the split into sources is this figure's arithmetic, and it lands on their 93.3% exactly.</figcaption></figure>
