<figure><div class='ts'>Fig 01 &nbsp;&middot;&nbsp; 0:00</div><h3>What moving data actually means</h3><svg viewBox='0 0 680 380' role='img'><title>What moving data actually means</title><text class="hd" x="40" y="46">Moving data is a real, countable action</text><g class="h"><rect x="40" y="76" width="170" height="70" rx="6"/><text class="sub" x="125.0" y="111.0" text-anchor="middle" dominant-baseline="central">memory</text></g><g class="m"><rect x="224" y="82" width="232" height="8" rx="2"/></g><g class="m"><rect x="224" y="95" width="232" height="8" rx="2"/></g><g class="m"><rect x="224" y="108" width="232" height="8" rx="2"/></g><g class="m"><rect x="224" y="121" width="232" height="8" rx="2"/></g><g class="m"><rect x="224" y="134" width="232" height="8" rx="2"/></g><g class="s"><rect x="470" y="76" width="170" height="70" rx="6"/><text class="sub" x="555.0" y="111.0" text-anchor="middle" dominant-baseline="central">the chip</text></g><text class="sub2" x="224" y="176" text-anchor="start">every byte crosses these wires, one journey each way</text><text class="cap" x="40" y="226" text-anchor="start">A byte does not become available to the arithmetic by being asked for. It has to physically</text><text class="cap" x="40" y="246" text-anchor="start">travel, and the wires have a fixed capacity per second.</text><text class="cap" x="40" y="282" text-anchor="start">So bytes moved is not a metaphor. It is a count of journeys, and it can be worked out exactly</text><text class="cap" x="40" y="302" text-anchor="start">from an algorithm before any code is written.</text><text class="cap" x="40" y="338" text-anchor="start">This whole document is an argument about that count. The arithmetic never changes; the number</text><text class="cap" x="40" y="358" text-anchor="start">of journeys changes enormously.</text></svg><figcaption>Worth making concrete at the start. Everything that follows is a comparison between two counts of the same thing.</figcaption></figure>
