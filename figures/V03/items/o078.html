<figure><div class='ts'>Fig 78 &nbsp;&middot;&nbsp; 24:57</div><h3>Why a faster chip can need a different kernel</h3><svg viewBox='0 0 680 446' role='img'><title>Why a faster chip can need a different kernel</title><text class="hd" x="40" y="46">One unit gets faster, its neighbours do not</text><text class="cap" x="40" y="92" text-anchor="start">Matrix multiply</text><g class="u"><rect x="260" y="76" width="180" height="30" rx="3"/></g><g class="m"><rect x="260" y="112" width="360" height="30" rx="3"/><text class="sub" x="440.0" y="127.0" text-anchor="middle" dominant-baseline="central">2.25 times faster</text></g><text class="cap" x="40" y="192" text-anchor="start">Exponentials</text><g class="u"><rect x="260" y="176" width="180" height="30" rx="3"/></g><g class="h"><rect x="260" y="212" width="180" height="30" rx="3"/><text class="sub" x="350.0" y="227.0" text-anchor="middle" dominant-baseline="central">unchanged</text></g><text class="cap" x="40" y="292" text-anchor="start">Upper bar the previous generation, lower bar the new one. When one unit more than doubles and</text><text class="cap" x="40" y="312" text-anchor="start">the unit feeding it does not, the bottleneck simply moves.</text><text class="cap" x="40" y="348" text-anchor="start">A kernel perfectly tuned for the old balance is mistuned for the new one, without a line of it</text><text class="cap" x="40" y="368" text-anchor="start">changing.</text><text class="cap" x="40" y="404" text-anchor="start">Which is why each generation of this hardware needs its own version of the kernel, and why</text><text class="cap" x="40" y="424" text-anchor="start">there have been four.</text></svg><figcaption>Progress is uneven across units, so the constraint moves. The optimisation target changes even when nothing about the algorithm does.</figcaption></figure>
