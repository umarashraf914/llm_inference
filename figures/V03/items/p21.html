<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 22:29</div><h3>Three units busy at once</h3><svg viewBox='0 0 680 504' role='img'><title>Three units busy at once</title><text class="hd" x="40" y="46">Two warpgroups take turns, so each unit always has work (durations schematic)</text><text class="cap" x="40" y="87" text-anchor="start">tensor cores</text><g class="s"><rect x="160" y="72" width="101" height="22" rx="2"/><text class="sub" x="210.5" y="83.0" text-anchor="middle" dominant-baseline="central">group 1</text></g><g class="s"><rect x="264" y="72" width="101" height="22" rx="2"/><text class="sub" x="314.5" y="83.0" text-anchor="middle" dominant-baseline="central">group 2</text></g><g class="s"><rect x="368" y="72" width="101" height="22" rx="2"/><text class="sub" x="418.5" y="83.0" text-anchor="middle" dominant-baseline="central">group 1</text></g><g class="s"><rect x="472" y="72" width="101" height="22" rx="2"/><text class="sub" x="522.5" y="83.0" text-anchor="middle" dominant-baseline="central">group 2</text></g><text class="cap" x="40" y="117" text-anchor="start">multi-function unit</text><g class="m"><rect x="264" y="102" width="80.2" height="22" rx="2"/><text class="sub" x="304.1" y="113.0" text-anchor="middle" dominant-baseline="central">group 2: e^x</text></g><g class="m"><rect x="368" y="102" width="80.2" height="22" rx="2"/><text class="sub" x="408.1" y="113.0" text-anchor="middle" dominant-baseline="central">group 1: e^x</text></g><g class="m"><rect x="472" y="102" width="80.2" height="22" rx="2"/><text class="sub" x="512.1" y="113.0" text-anchor="middle" dominant-baseline="central">group 2: e^x</text></g><text class="cap" x="40" y="147" text-anchor="start">copy engine</text><g class="h"><rect x="160.0" y="132" width="64.60000000000001" height="22" rx="2"/><text class="sub" x="192.3" y="143.0" text-anchor="middle" dominant-baseline="central">tile 3</text></g><g class="h"><rect x="238.0" y="132" width="64.60000000000001" height="22" rx="2"/><text class="sub" x="270.3" y="143.0" text-anchor="middle" dominant-baseline="central">tile 4</text></g><g class="h"><rect x="316.0" y="132" width="64.60000000000001" height="22" rx="2"/><text class="sub" x="348.3" y="143.0" text-anchor="middle" dominant-baseline="central">tile 5</text></g><g class="h"><rect x="394.0" y="132" width="64.60000000000001" height="22" rx="2"/><text class="sub" x="426.3" y="143.0" text-anchor="middle" dominant-baseline="central">tile 6</text></g><g class="h"><rect x="472.0" y="132" width="64.60000000000001" height="22" rx="2"/><text class="sub" x="504.3" y="143.0" text-anchor="middle" dominant-baseline="central">tile 7</text></g><text class="sub2" x="160" y="176" text-anchor="start">time →</text><text class="cap" x="40" y="214" text-anchor="start">The exponentials in softmax run on neither the tensor cores nor the ordinary CUDA cores</text><text class="cap" x="40" y="234" text-anchor="start">but on a third unit, the multi-function unit, MUFU, which handles exponentials and</text><text class="cap" x="40" y="254" text-anchor="start">similar functions. It is scarce: 16 results per clock per multiprocessor, about 3.9</text><text class="cap" x="40" y="274" text-anchor="start">trillion a second on an H100, against 989 trillion tensor-core operations, 256 times</text><text class="cap" x="40" y="294" text-anchor="start">fewer.</text><text class="cap" x="40" y="334" text-anchor="start">Each score needs one exponential and, at head dimension 128, 512 tensor-core operations.</text><text class="cap" x="40" y="354" text-anchor="start">So the exponentials take 50% as long as the matrix multiplies: far too long to leave</text><text class="cap" x="40" y="374" text-anchor="start">them waiting in line. Version 3 runs two warpgroups in pingpong: while one does its</text><text class="cap" x="40" y="394" text-anchor="start">matrix multiplies, the other does its softmax on the MUFU, and then they swap. The copy</text><text class="cap" x="40" y="414" text-anchor="start">engine keeps loading tiles throughout.</text><text class="cap" x="40" y="454" text-anchor="start">In the paper's measurement the pingpong alone took the forward pass from 570 to 620–640</text><text class="cap" x="40" y="474" text-anchor="start">trillion operations a second.</text></svg><figcaption>Second overlap, one level down: not memory against arithmetic this time, but one kind of arithmetic against another. The scarcest unit sets the rhythm, and version 4 will be about exactly that unit.</figcaption></figure>
