<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 45:03</div><h3>The GPU starves only when its kernels are shorter than their launches</h3><div class='wg'><div class='ctl'><label>kernel time K <input type='range' min='1' max='12' step='0.5' value='4'></label><label>launch cost L <input type='range' min='2' max='8' step='0.5' value='5'></label><button type='button'>Reset</button></div><svg viewBox='0 0 680 444' role='img'><title>The GPU starves only when its kernels are shorter than their launches</title><text class="hd" x="40" y="34">8 kernels in a row, kernels of K µs, launches of L µs</text><text class="sub2" x="40" y="58">K = <tspan data-k="">4.0</tspan> µs,  L = <tspan data-l="">5.0</tspan> µs</text><text class="cap" x="40" y="90" text-anchor="start">CPU</text><text class="cap" x="40" y="130" text-anchor="start">GPU</text><g class="h"><rect x="120.0" y="72" width="23.0" height="26" rx="2" data-cpu="0"/></g><g class="s"><rect x="145.0" y="112" width="18.0" height="26" rx="2" data-gpu="0"/></g><g class="h"><rect x="145.0" y="72" width="23.0" height="26" rx="2" data-cpu="1"/></g><g class="s"><rect x="170.0" y="112" width="18.0" height="26" rx="2" data-gpu="1"/></g><g class="h"><rect x="170.0" y="72" width="23.0" height="26" rx="2" data-cpu="2"/></g><g class="s"><rect x="195.0" y="112" width="18.0" height="26" rx="2" data-gpu="2"/></g><g class="h"><rect x="195.0" y="72" width="23.0" height="26" rx="2" data-cpu="3"/></g><g class="s"><rect x="220.0" y="112" width="18.0" height="26" rx="2" data-gpu="3"/></g><g class="h"><rect x="220.0" y="72" width="23.0" height="26" rx="2" data-cpu="4"/></g><g class="s"><rect x="245.0" y="112" width="18.0" height="26" rx="2" data-gpu="4"/></g><g class="h"><rect x="245.0" y="72" width="23.0" height="26" rx="2" data-cpu="5"/></g><g class="s"><rect x="270.0" y="112" width="18.0" height="26" rx="2" data-gpu="5"/></g><g class="h"><rect x="270.0" y="72" width="23.0" height="26" rx="2" data-cpu="6"/></g><g class="s"><rect x="295.0" y="112" width="18.0" height="26" rx="2" data-gpu="6"/></g><g class="h"><rect x="295.0" y="72" width="23.0" height="26" rx="2" data-cpu="7"/></g><g class="s"><rect x="320.0" y="112" width="18.0" height="26" rx="2" data-gpu="7"/></g><line class="tick" x1="120.0" y1="146.0" x2="120.0" y2="150.0"/><text class="sub2" x="120.0" y="164" text-anchor="middle">0 µs</text><line class="tick" x1="220.0" y1="146.0" x2="220.0" y2="150.0"/><text class="sub2" x="220.0" y="164" text-anchor="middle">20 µs</text><line class="tick" x1="320.0" y1="146.0" x2="320.0" y2="150.0"/><text class="sub2" x="320.0" y="164" text-anchor="middle">40 µs</text><line class="tick" x1="420.0" y1="146.0" x2="420.0" y2="150.0"/><text class="sub2" x="420.0" y="164" text-anchor="middle">60 µs</text><line class="tick" x1="520.0" y1="146.0" x2="520.0" y2="150.0"/><text class="sub2" x="520.0" y="164" text-anchor="middle">80 µs</text><line class="tick" x1="620.0" y1="146.0" x2="620.0" y2="150.0"/><text class="sub2" x="620.0" y="164" text-anchor="middle">100 µs</text><text class="sub2" x="40" y="194">all 8 done at <tspan data-end="">44.0</tspan> µs</text><text class="cap" x="40" y="216">GPU idle in the steady state: <tspan data-idle="">20%: the GPU waits 1.0 µs in every 5.0</tspan></text><text class="cap" x="40" y="258" text-anchor="start">The CPU issues launches one after another, each taking L microseconds, and a kernel can</text><text class="cap" x="40" y="278" text-anchor="start">start once its launch is done and the kernel before it has finished. When kernels run</text><text class="cap" x="40" y="298" text-anchor="start">longer than launches, the CPU gets ahead, a queue builds, and the GPU never waits. When</text><text class="cap" x="40" y="318" text-anchor="start">they are shorter, the GPU finishes each one and waits for the next launch: it idles for</text><text class="cap" x="40" y="338" text-anchor="start">L − K of every L microseconds.</text><text class="cap" x="40" y="378" text-anchor="start">At batch size one, kernels of a few microseconds against launches of a few microseconds</text><text class="cap" x="40" y="398" text-anchor="start">give idle shares like these, and at small batch that dispatch overhead can reach 20 to</text><text class="cap" x="40" y="418" text-anchor="start">30% of the whole step. The arithmetic here was checked against Python.</text></svg></div><figcaption>Two lanes, one rule: the GPU idles max(0, L − K) ÷ L of the time. Small batches shrink K, and that is what exposes the launch cost.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const N = 8, X0 = 120, SC = 5.0, K0 = 4.0, L0 = 5.0;
  const q = s => fig.querySelector(s), sl = [...fig.querySelectorAll('input[type=range]')];
  const fx = (v, d) => v.toFixed(d);
  function draw() {
    const K = +sl[0].value, L = +sl[1].value;
    let end = 0;
    for (let i = 0; i < N; i++) {
      const c = q(`[data-cpu="${i}"]`), g = q(`[data-gpu="${i}"]`);
      c.setAttribute('x', fx(X0 + i * L * SC, 1)); c.setAttribute('width', fx(L * SC - 2, 1));
      const s = Math.max((i + 1) * L, end); end = s + K;
      g.setAttribute('x', fx(X0 + s * SC, 1)); g.setAttribute('width', fx(K * SC - 2, 1));
    }
    const sh = Math.max(0, L - K) / L;
    q('[data-k]').textContent = fx(K, 1); q('[data-l]').textContent = fx(L, 1);
    q('[data-end]').textContent = fx(end, 1);
    q('[data-idle]').textContent = sh === 0 ? '0%: kernels outlast launches, a queue builds, the GPU never waits'
      : `${fx(100 * sh, 0)}%: the GPU waits ${fx(L - K, 1)} µs in every ${fx(L, 1)}`;
  }
  sl.forEach(s => s.addEventListener('input', draw));
  q('button').addEventListener('click', () => { sl[0].value = K0; sl[1].value = L0; draw(); });
  draw();
})();</script></figure>
