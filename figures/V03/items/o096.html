<figure><div class='ts'>Fig 96 &nbsp;&middot;&nbsp; 43:57</div><h3>Kernel launch overhead</h3><svg viewBox="0 0 680 412" role="img"><title>Kernel launch overhead</title><text class="cap" x="40" y="74" text-anchor="start">Per-kernel launch</text><text class="sub2" x="40" y="94" text-anchor="start">batch size 1</text><g class="s"><rect x="190" y="58" width="22" height="32" rx="2"></rect></g><rect x="214" y="58" width="22" height="32" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="s"><rect x="240" y="58" width="22" height="32" rx="2"></rect></g><rect x="264" y="58" width="22" height="32" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="s"><rect x="290" y="58" width="22" height="32" rx="2"></rect></g><rect x="314" y="58" width="22" height="32" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="s"><rect x="340" y="58" width="22" height="32" rx="2"></rect></g><rect x="364" y="58" width="22" height="32" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="s"><rect x="390" y="58" width="22" height="32" rx="2"></rect></g><rect x="414" y="58" width="22" height="32" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="s"><rect x="440" y="58" width="22" height="32" rx="2"></rect></g><rect x="464" y="58" width="22" height="32" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="s"><rect x="490" y="58" width="22" height="32" rx="2"></rect></g><rect x="514" y="58" width="22" height="32" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="s"><rect x="540" y="58" width="22" height="32" rx="2"></rect></g><rect x="564" y="58" width="22" height="32" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="s"><rect x="590" y="58" width="22" height="32" rx="2"></rect></g><rect x="614" y="58" width="22" height="32" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="cap" x="40" y="168" text-anchor="start">CUDA graph replay</text><g class="s"><rect x="190" y="152" width="22" height="32" rx="2"></rect></g><g class="s"><rect x="216" y="152" width="22" height="32" rx="2"></rect></g><g class="s"><rect x="242" y="152" width="22" height="32" rx="2"></rect></g><g class="s"><rect x="268" y="152" width="22" height="32" rx="2"></rect></g><g class="s"><rect x="294" y="152" width="22" height="32" rx="2"></rect></g><g class="s"><rect x="320" y="152" width="22" height="32" rx="2"></rect></g><g class="s"><rect x="346" y="152" width="22" height="32" rx="2"></rect></g><g class="s"><rect x="372" y="152" width="22" height="32" rx="2"></rect></g><g class="s"><rect x="398" y="152" width="22" height="32" rx="2"></rect></g><text class="sub2" x="430" y="172" text-anchor="start">one call replays the whole graph</text><text class="cap" x="40" y="220" text-anchor="start">Solid blocks are GPU work; dashed gaps are the CPU validating arguments and talking to the</text><text class="cap" x="40" y="240" text-anchor="start">driver. A few microseconds each, hundreds per token.</text><text class="cap" x="40" y="280" text-anchor="start">At batch size 1 that dispatch overhead reaches 20 to 30 percent of the step. Recording the</text><text class="cap" x="40" y="300" text-anchor="start">sequence once and replaying it as a single unit removes almost all of it.</text><text class="cap" x="40" y="340" text-anchor="start">The constraint is that a replayed graph must touch the same addresses every time, which sits</text><text class="cap" x="40" y="360" text-anchor="start">awkwardly with a paged cache. Serving systems lay out fixed buffers to keep decode replayable.</text><text class="cap" x="40" y="390" text-anchor="start">Prefill gains little, because its kernels are large enough that launch cost disappears.</text></svg><figcaption>The only figure here about the CPU. At small batch the machine can be limited by how fast work is handed to it rather than by the work itself.</figcaption></figure>
