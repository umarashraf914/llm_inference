<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:56</div><h3>Intensity is a lever, not a property</h3><svg viewBox='0 0 680 574' role='img'><title>Intensity is a lever, not a property</title><text class="hd" x="40" y="46">One multiply, two ways to feed it</text><g class="u"><rect x="40" y="64" width="600" height="36" rx="6"/><text class="sub" x="340.0" y="82.0" text-anchor="middle" dominant-baseline="central">arithmetic intensity  =  operations  ÷  bytes moved</text></g><text class="sub2" x="40" y="128" text-anchor="start">C = A × B, both 4,096 × 4,096 in 16-bit:  2 × 4,096³ = 137.4 billion operations, whatever the schedule</text><g class="h"><rect x="40" y="146" width="300" height="32" rx="3"/><text class="sub" x="190.0" y="162.0" text-anchor="middle" dominant-baseline="central">fetch both inputs for every multiply-add</text></g><text class="sub2" x="356" y="167" text-anchor="start">275 GB moved</text><text class="sub2" x="640" y="167" text-anchor="end">0.5 per byte</text><g class="s"><rect x="40" y="190" width="300" height="32" rx="3"/><text class="sub" x="190.0" y="206.0" text-anchor="middle" dominant-baseline="central">fetch every input once, write the output once</text></g><text class="sub2" x="356" y="211" text-anchor="start">101 MB moved</text><text class="sub2" x="640" y="211" text-anchor="end">1,365 per byte</text><line class="axis" x1="90.0" y1="268.0" x2="600.0" y2="268.0"/><line class="tick" x1="90.0" y1="268.0" x2="90.0" y2="273.0"/><text class="sub2" x="90.0" y="288" text-anchor="middle">0.1</text><line class="tick" x1="192.0" y1="268.0" x2="192.0" y2="273.0"/><text class="sub2" x="192.0" y="288" text-anchor="middle">1</text><line class="tick" x1="294.0" y1="268.0" x2="294.0" y2="273.0"/><text class="sub2" x="294.0" y="288" text-anchor="middle">10</text><line class="tick" x1="396.0" y1="268.0" x2="396.0" y2="273.0"/><text class="sub2" x="396.0" y="288" text-anchor="middle">100</text><line class="tick" x1="498.0" y1="268.0" x2="498.0" y2="273.0"/><text class="sub2" x="498.0" y="288" text-anchor="middle">1,000</text><line class="tick" x1="600.0" y1="268.0" x2="600.0" y2="273.0"/><text class="sub2" x="600.0" y="288" text-anchor="middle">10,000</text><line class="xok" x1="444.0" y1="234.0" x2="444.0" y2="268.0" stroke="var(--h)" stroke-width="1.2" stroke-dasharray="4 3"/><text class="sub2" x="449.9554514251541" y="242" text-anchor="start">ridge, 295</text><circle cx="161.3" cy="268.0" r="5" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><circle cx="511.8" cy="268.0" r="5" fill="var(--paper)" stroke="var(--s)" stroke-width="1.5"/><text class="sub2" x="90" y="308" text-anchor="start">operations per byte, log scale</text><text class="cap" x="40" y="344" text-anchor="start">The operations are fixed by the mathematics: every one of the 16.8 million outputs needs</text><text class="cap" x="40" y="364" text-anchor="start">its 4,096 multiply-adds, however the work is arranged. The bytes are not. They depend on</text><text class="cap" x="40" y="384" text-anchor="start">how often each input is fetched from HBM, and that is a decision the kernel makes.</text><text class="cap" x="40" y="424" text-anchor="start">Fetched afresh for every multiply-add, the inputs cost 275 GB and the multiply runs at</text><text class="cap" x="40" y="444" text-anchor="start">0.5 operations per byte, deep on the memory side of the ridge. Fetched once, they cost</text><text class="cap" x="40" y="464" text-anchor="start">101 MB and the same arithmetic sits at 1,365, far past it: 2,731 times the intensity for</text><text class="cap" x="40" y="484" text-anchor="start">identical work.</text><text class="cap" x="40" y="524" text-anchor="start">Real kernels land between the two. Tiling (Part 5) is the craft of getting close to the</text><text class="cap" x="40" y="544" text-anchor="start">second.</text></svg><figcaption>One of the two numbers in the ratio is fixed by the mathematics and the other is a decision. Everything in this atlas pulls on the second.</figcaption></figure>
