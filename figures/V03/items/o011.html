<figure><div class='ts'>Fig 11 &nbsp;&middot;&nbsp; 3:49</div><h3>Intensity is a lever, not a property</h3><svg viewBox="0 0 680 402" role="img"><title>Intensity is a lever, not a property</title><g class="m"><rect x="90" y="46" width="500" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">arithmetic intensity  =  operations / bytes moved</text></g><line class="axis" x1="90" y1="264" x2="620" y2="264"></line><line class="axis" x1="90" y1="120" x2="90" y2="264"></line><polyline class="pl-h" points="90,264 330,156 620,156"></polyline><line class="tick" x1="330" y1="156" x2="330" y2="264"></line><text class="sub2" x="330" y="288" text-anchor="middle">the ridge, just under 300 on an H100</text><text class="sub2 halo" x="150" y="226" text-anchor="start">memory bound</text><text class="sub2" x="430" y="226" text-anchor="start">compute bound</text><text class="cap" x="40" y="330" text-anchor="start">The operations a computation performs are fixed by the mathematics. The bytes it moves are</text><text class="cap" x="40" y="350" text-anchor="start">not: they depend entirely on how the work is scheduled against the memory hierarchy.</text><text class="cap" x="40" y="380" text-anchor="start">So intensity is a lever, and it is pulled by changing the denominator.</text></svg><figcaption>The single most important idea in this document. Two kernels computing the same function can sit on opposite sides of the ridge.</figcaption></figure>
