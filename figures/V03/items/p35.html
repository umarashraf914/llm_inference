<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 35:08</div><h3>Every new token rereads the whole cache, so head count is a bandwidth bill</h3><svg viewBox='0 0 680 446' role='img'><title>Every new token rereads the whole cache, so head count is a bandwidth bill</title><text class="hd" x="40" y="46">Cache read for every generated token: Llama 3 70B, one sequence of 8,192 tokens</text><text class="cap" x="40" y="83" text-anchor="start">64 KV heads</text><g class="h"><rect x="170" y="66" width="440.0" height="26" rx="3"/><text class="sub" x="390.0" y="79.0" text-anchor="middle" dominant-baseline="central">21.5 GB: 6.4 ms at 3.35 TB/s</text></g><text class="cap" x="40" y="121" text-anchor="start">8 KV heads</text><g class="s"><rect x="170" y="104" width="55.0" height="26" rx="3"/></g><text class="sub2" x="233.0" y="121.0" text-anchor="start">2.68 GB: 0.80 ms</text><text class="cap" x="40" y="176" text-anchor="start">In 2019 Noam Shazeer pointed at where the bill lands. Generating each token means</text><text class="cap" x="40" y="196" text-anchor="start">reloading every cached key and value from HBM, and that reloading is bandwidth bound,</text><text class="cap" x="40" y="216" text-anchor="start">the constraint behind every technique so far. Most of those bytes exist only because</text><text class="cap" x="40" y="236" text-anchor="start">every head keeps a private copy.</text><text class="cap" x="40" y="276" text-anchor="start">Llama 3 70B keeps 8 KV heads for its 64 query heads ({{fig:v01-p29}}). At 8,192 tokens</text><text class="cap" x="40" y="296" text-anchor="start">of context, each new token rereads 2.68 GB of cache, 0.80 ms at the H100's 3.35 TB/s.</text><text class="cap" x="40" y="316" text-anchor="start">With a key and value head for every query head the same token would reread 21.5 GB, 6.4</text><text class="cap" x="40" y="336" text-anchor="start">ms, eight times the bill; with a single shared head, 0.34 GB.</text><text class="cap" x="40" y="376" text-anchor="start">A batch multiplies it. Thirty-two such sequences reread 86 GB every step with 8 KV</text><text class="cap" x="40" y="396" text-anchor="start">heads, the whole cache of {{fig:v03-o082}}; with 64 they would hold 687 GB, more than</text><text class="cap" x="40" y="416" text-anchor="start">any single GPU's memory.</text></svg><figcaption>Bars to scale. The formula is the one from Part 13, 2 × layers × KV heads × head dimension × 2 bytes per token, times the tokens held.</figcaption></figure>
