" y1="150.0" x2="592.2" y2="176.0"/><line class="tick" x1="595.4" y1="150.0" x2="595.4" y2="176.0"/><line class="tick" x1="600.7" y1="150.0" x2="600.7" y2="176.0"/><line class="tick" x1="605.0" y1="150.0" x2="605.0" y2="176.0"/><line class="tick" x1="608.6" y1="150.0" x2="608.6" y2="176.0"/><line class="axis" x1="70.0" y1="210.0" x2="620.0" y2="210.0"/><line class="tick" x1="86.4" y1="210.0" x2="86.4" y2="215.0"/><text class="sub2" x="86.4179104477612" y="230" text-anchor="middle">2^-16</text><line class="tick" x1="152.1" y1="210.0" x2="152.1" y2="215.0"/><text class="sub2" x="152.089552238806" y="230" text-anchor="middle">2^-12</text><line class="tick" x1="217.8" y1="210.0" x2="217.8" y2="215.0"/><text class="sub2" x="217.76119402985074" y="230" text-anchor="middle">2^-8</text><line class="tick" x1="283.4" y1="210.0" x2="283.4" y2="215.0"/><text class="sub2" x="283.4328358208955" y="230" text-anchor="middle">2^-4</text><line class="tick" x1="349.1" y1="210.0" x2="349.1" y2="215.0"/><text class="sub2" x="349.1044776119403" y="230" text-anchor="middle">1</text><line class="tick" x1="414.8" y1="210.0" x2="414.8" y2="215.0"/><text class="sub2" x="414.7761194029851" y="230" text-anchor="middle">2^4</text><line class="tick" x1="480.4" y1="210.0" x2="480.4" y2="215.0"/><text class="sub2" x="480.4477611940298" y="230" text-anchor="middle">2^8</text><line class="tick" x1="546.1" y1="210.0" x2="546.1" y2="215.0"/><text class="sub2" x="546.1194029850747" y="230" text-anchor="middle">2^12</text><line class="tick" x1="611.8" y1="210.0" x2="611.8" y2="215.0"/><text class="sub2" x="611.7910447761194" y="230" text-anchor="middle">2^16</text><text class="sub2" x="201.34328358208955" y="118" text-anchor="middle">2⁻⁹, the smallest</text><text class="sub2" x="493.7028420039308" y="118" text-anchor="middle">448</text><text class="sub2" x="608.6282151382592" y="188" text-anchor="end">57,344</text><text class="sub2" x="86.4179104477612" y="188" text-anchor="middle">2⁻¹⁶</text><text class="cap" x="40" y="266" text-anchor="start">Each tick is one value. Within every doubling, from 1 to 2 or from 64 to 128, E4M3 has</text><text class="cap" x="40" y="286" text-anchor="start">the same 8 values, because its three fraction bits split each doubling into eight equal</text><text class="cap" x="40" y="306" text-anchor="start">steps. So the steps are tiny near zero and large far out: 0.125 apart between 1 and 2,</text><text class="cap" x="40" y="326" text-anchor="start">but 32 apart between 256 and 448.</text><text class="cap" x="40" y="366" text-anchor="start">Below 2⁻⁶ the format runs out of exponents and has 7 evenly spaced subnormals down to</text><text class="cap" x="40" y="386" text-anchor="start">2⁻⁹; below that, everything rounds to zero. Its top doubling has 7 values, not 8,</text><text class="cap" x="40" y="406" text-anchor="start">because the very top pattern means 'not a number'. E5M2 covers far more range with half</text><text class="cap" x="40" y="426" text-anchor="start">as many values per doubling.</text><text class="cap" x="40" y="466" text-anchor="start">Every value carries the same relative precision: a number is never more than 1/16,</text><text class="cap" x="40" y="486" text-anchor="start">6.25%, from the nearest E4M3 value, wherever it sits on the axis.</text></svg><figcaption>Spacing that grows with size is the floating-point bargain: the same few percent of precision at every scale, in place of the same absolute step everywhere.</figcaption></figure>
