<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:13</div><h3>Four tiles, and the mask skips one</h3><svg viewBox='0 0 680 582' role='img'><title>Four tiles, and the mask skips one</title><text class="hd" x="40" y="46">One head's 200 × 200 scores, cut by blocks of 128, in the order they are visited</text><text class="sub2" x="259.6" y="82" text-anchor="middle">keys 1–128</text><text class="sub2" x="399.6" y="82" text-anchor="middle">keys 129–200</text><text class="sub2" x="158" y="185.6" text-anchor="end">queries 1–128</text><text class="sub2" x="158" y="325.6" text-anchor="end">queries 129–200</text><g class="m"><rect x="170.0" y="92.0" width="176.2" height="176.2" rx="3"/></g><polygon points="170.0,92.0 346.2,92.0 346.2,268.2" fill="var(--u-fill)" stroke="none"/><text class="lbl" x="184.0" y="256.2" text-anchor="start">1</text><rect x="349.2" y="92.0" width="97.8" height="176.2" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="398.09999999999997" y="180.1" text-anchor="middle" dominant-baseline="central">skipped: all masked</text><g class="m"><rect x="170.0" y="271.2" width="176.2" height="97.8" rx="3"/></g><text class="lbl" x="184.0" y="357.0" text-anchor="start">2</text><g class="m"><rect x="349.2" y="271.2" width="97.8" height="97.8" rx="3"/></g><polygon points="349.2,271.2 447.0,271.2 447.0,369.0" fill="var(--u-fill)" stroke="none"/><text class="lbl" x="363.2" y="357.0" text-anchor="start">3</text><text class="sub2" x="466.0" y="112" text-anchor="start">gold: computed</text><text class="sub2" x="466.0" y="130" text-anchor="start">grey: masked</text><text class="sub2" x="466.0" y="148" text-anchor="start">1, 2, 3: visit order</text><text class="cap" x="40" y="412.0" text-anchor="start">With blocks of 128, one head's score matrix is four tiles. In the first version's order</text><text class="cap" x="40" y="432.0" text-anchor="start">the kernel loads K and V block 1 and sweeps both blocks of queries past it, then loads K</text><text class="cap" x="40" y="452.0" text-anchor="start">and V block 2: a column at a time.</text><text class="cap" x="40" y="492.0" text-anchor="start">Queries 1–128 need nothing from the second column. Keys 129–200 all lie in their future,</text><text class="cap" x="40" y="512.0" text-anchor="start">the causal mask hides every one ({{fig:v03-o020}}), and the kernel skips the tile. Three</text><text class="cap" x="40" y="532.0" text-anchor="start">tiles are computed, and the two on the diagonal are half hidden inside. The largest tile</text><text class="cap" x="40" y="552.0" text-anchor="start">is 128 × 128 scores, 32 KB, and it lives on the chip only while it is used.</text></svg><figcaption>Drawn to scale. The 200 × 200 matrix exists only as these pieces, each made and discarded on the chip, and the masked one is never made at all: a saving the three-kernel version, which writes every entry, cannot have.</figcaption></figure>
