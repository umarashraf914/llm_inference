<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 1:59</div><h3>Fraction of peak is operations done per second over operations possible</h3><svg viewBox='0 0 680 676' role='img'><title>Fraction of peak is operations done per second over operations possible</title><text class="hd" x="40" y="46">Count the operations, time them, divide by what the chip could do</text><text class="cap" x="40" y="84" text-anchor="start">1  count</text><g class="m"><rect x="140" y="64" width="150" height="34" rx="6"/><text class="sub" x="215.0" y="81.0" text-anchor="middle" dominant-baseline="central">QKᵀ: n·n·d</text></g><text class="sub2" x="298" y="86" text-anchor="start">+</text><g class="m"><rect x="312" y="64" width="150" height="34" rx="6"/><text class="sub" x="387.0" y="81.0" text-anchor="middle" dominant-baseline="central">PV: n·d·n</text></g><text class="sub2" x="470" y="86" text-anchor="start">multiply-adds, ×2</text><g class="m"><rect x="140" y="108" width="322" height="34" rx="6"/><text class="sub" x="301.0" y="125.0" text-anchor="middle" dominant-baseline="central">= 4 · n² · d operations per head</text></g><text class="cap" x="40" y="170" text-anchor="start">2  worked</text><text class="sub2" x="140" y="170" text-anchor="start">4 × 8,192² × 128 × 32 heads = 1.10 × 10¹² operations</text><text class="cap" x="40" y="204" text-anchor="start">3  time it</text><text class="sub2" x="140" y="204" text-anchor="start">if the kernel takes 1.486 ms:  1.10 × 10¹² ÷ 0.001486 s = 740 × 10¹² per second</text><text class="cap" x="40" y="238" text-anchor="start">4  divide</text><g class="s"><rect x="140" y="218" width="322" height="34" rx="6"/><text class="sub" x="301.0" y="235.0" text-anchor="middle" dominant-baseline="central">740 ÷ 989 = 75% of peak</text></g><text class="sub2" x="470" y="240" text-anchor="start">989: the H100's ceiling</text><text class="hd" x="40" y="276">The number tracked from here on</text><text class="cap" x="40" y="313" text-anchor="start">version 1, A100</text><rect x="200" y="302" width="400" height="14" rx="3" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><g class="s"><rect x="300.0" y="302" width="60.0" height="14" rx="3"/></g><text class="sub2" x="368.0" y="314" text-anchor="start">25–40%</text><text class="cap" x="40" y="343" text-anchor="start">version 2, A100</text><rect x="200" y="332" width="400" height="14" rx="3" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><g class="s"><rect x="400.0" y="332" width="92.0" height="14" rx="3"/></g><text class="sub2" x="500.0" y="344" text-anchor="start">50–73%</text><text class="cap" x="40" y="373" text-anchor="start">version 2, H100</text><rect x="200" y="362" width="400" height="14" rx="3" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><g class="s"><rect x="338.5" y="362" width="3" height="14" rx="3"/></g><text class="sub2" x="348.0" y="374" text-anchor="start">35%</text><text class="cap" x="40" y="403" text-anchor="start">version 3, H100</text><rect x="200" y="392" width="400" height="14" rx="3" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><g class="s"><rect x="498.5" y="392" width="3" height="14" rx="3"/></g><text class="sub2" x="508.0" y="404" text-anchor="start">75%</text><text class="cap" x="40" y="433" text-anchor="start">version 4, B200</text><rect x="200" y="422" width="400" height="14" rx="3" fill="none" stroke="var(--rule)" stroke-dasharray="3 3"/><g class="s"><rect x="482.5" y="422" width="3" height="14" rx="3"/></g><text class="sub2" x="492.0" y="434" text-anchor="start">71%</text><line class="tick" x1="200.0" y1="452.0" x2="200.0" y2="456.0"/><text class="sub2" x="200.0" y="470" text-anchor="middle">0%</text><line class="tick" x1="400.0" y1="452.0" x2="400.0" y2="456.0"/><text class="sub2" x="400.0" y="470" text-anchor="middle">50%</text><line class="tick" x1="600.0" y1="452.0" x2="600.0" y2="456.0"/><text class="sub2" x="600.0" y="470" text-anchor="middle">100%</text><text class="cap" x="40" y="506" text-anchor="start">The count comes from the shapes alone: two matrix multiplies of n·n·d multiply-adds</text><text class="cap" x="40" y="526" text-anchor="start">each, and a multiply-add counts as two operations ({{fig:v01-o111}}). Only the time is</text><text class="cap" x="40" y="546" text-anchor="start">measured. Their ratio is the rate the kernel achieved, and dividing by the chip's peak</text><text class="cap" x="40" y="566" text-anchor="start">({{fig:v02-o082}}) says how much of its arithmetic the kernel actually used.</text><text class="cap" x="40" y="606" text-anchor="start">A kernel that waits on memory is slow however fast its chip, so its fraction is low.</text><text class="cap" x="40" y="626" text-anchor="start">That is why the fraction, not the speed, is the score kept from generation to</text><text class="cap" x="40" y="646" text-anchor="start">generation.</text></svg><figcaption>Measured against its own chip, so kernels on different generations share one scale. The strip is the climb from a quarter to three quarters, and the dip when a kernel met a chip it was not written for.</figcaption></figure>
