<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 25:43</div><h3>The whole rule, in one line</h3><svg viewBox='0 0 680 378' role='img'><title>The whole rule, in one line</title><g class="m"><rect x="90" y="46" width="500" height="42" rx="6"/><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">compare from token 1, stop at the first difference</text></g><text class="cap" x="40" y="118" text-anchor="start">Everything before that point is a hit and is reused. Everything from that point onward</text><text class="cap" x="40" y="138" text-anchor="start">is a miss and must be prefilled.</text><text class="hd" x="40" y="188">So the question is never how similar two prompts are, but how far they are identical</text><text class="cap" x="40" y="236" text-anchor="start">Two 788-token prompts that differ only in their last token: 787 tokens hit.</text><text class="cap" x="40" y="276" text-anchor="start">Two that differ only in their first token: none hit, though 787 of their 788 tokens are</text><text class="cap" x="40" y="296" text-anchor="start">identical.</text><text class="cap" x="40" y="336" text-anchor="start">This is why the order of a prompt matters as much as its contents, and why the stable</text><text class="cap" x="40" y="356" text-anchor="start">parts belong at the front.</text></svg><figcaption>Everything in the next part is this sentence applied to one conversation.</figcaption></figure>
