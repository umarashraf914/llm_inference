<figure><div class='ts'>Fig 46 &nbsp;&middot;&nbsp; 0:46</div><h3>The whole rule, in one line</h3><svg viewBox='0 0 680 350' role='img'><title>The whole rule, in one line</title><g class="m"><rect x="90" y="46" width="500" height="42" rx="6"/><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">compare from token 1, stop at the first difference</text></g><text class="cap" x="40" y="118" text-anchor="start">Everything before that point is a hit and is reused. Everything from that point onward is a</text><text class="cap" x="40" y="138" text-anchor="start">miss and must be prefilled.</text><text class="hd" x="40" y="188">Which means the useful question is never how similar, but how identical, and from where</text><text class="cap" x="40" y="236" text-anchor="start">Two prompts sharing a long opening and diverging at the end: almost all hit.</text><text class="cap" x="40" y="272" text-anchor="start">Two prompts differing in the first word and identical thereafter: no hit at all.</text><text class="cap" x="40" y="308" text-anchor="start">This is why the order of a prompt matters as much as its contents, and why the stable parts</text><text class="cap" x="40" y="328" text-anchor="start">belong at the front.</text></svg><figcaption>Everything in the rest of this part is this sentence applied to a particular case.</figcaption></figure>
