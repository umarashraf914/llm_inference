<figure><div class='ts'>Fig 113 &nbsp;&middot;&nbsp; 11:46</div><h3>Summing over the whole model</h3><svg viewBox="0 0 680 422" role="img"><title>Summing over the whole model</title><g class="u"><rect x="40" y="40" width="600" height="158" rx="14"></rect><text class="lbl" x="62" y="66">One layer, all of it matrix multiplies</text></g><g class="m"><rect x="66" y="96" width="128" height="34" rx="4"></rect><text class="sub" x="130.0" y="113.0" text-anchor="middle" dominant-baseline="central">query</text></g><g class="m"><rect x="202" y="96" width="128" height="34" rx="4"></rect><text class="sub" x="266.0" y="113.0" text-anchor="middle" dominant-baseline="central">key</text></g><g class="m"><rect x="338" y="96" width="128" height="34" rx="4"></rect><text class="sub" x="402.0" y="113.0" text-anchor="middle" dominant-baseline="central">value</text></g><g class="m"><rect x="474" y="96" width="140" height="34" rx="4"></rect><text class="sub" x="544.0" y="113.0" text-anchor="middle" dominant-baseline="central">combine</text></g><g class="m"><rect x="66" y="142" width="264" height="34" rx="4"></rect><text class="sub" x="198.0" y="159.0" text-anchor="middle" dominant-baseline="central">feed-forward, first</text></g><g class="m"><rect x="338" y="142" width="276" height="34" rx="4"></rect><text class="sub" x="476.0" y="159.0" text-anchor="middle" dominant-baseline="central">feed-forward, second</text></g><text class="cap" x="40" y="244" text-anchor="start">Six matrices, and the rule holds for each of them separately. Add them up and you have every</text><text class="cap" x="40" y="264" text-anchor="start">weight in the layer. Add up the layers and you have every parameter in the model.</text><g class="s"><rect x="140" y="296" width="400" height="42" rx="6"></rect><text class="sub" x="340.0" y="317.0" text-anchor="middle" dominant-baseline="central">operations per token  =  2  x  parameter count</text></g><text class="cap" x="40" y="380" text-anchor="start">So a parameter count, which is the one number every model is advertised with, converts straight</text><text class="cap" x="40" y="400" text-anchor="start">into an operation count. Nothing else about the architecture needs to be known.</text></svg><figcaption>The rule survives the sum because it holds matrix by matrix. That is why a single headline number is enough to price a forward pass.</figcaption></figure>
