<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:46</div><h3>Summing over the whole model</h3><svg viewBox='0 0 680 674' role='img'><title>Summing over the whole model</title><text class="hd" x="40" y="46">One layer, matrix by matrix: the operations are twice the weights</text><text class="sub2" x="40" y="74" text-anchor="start">matrix</text><text class="sub2" x="140" y="74" text-anchor="start">rows × columns</text><text class="sub2" x="300" y="74" text-anchor="start">weights</text><text class="sub2" x="470" y="74" text-anchor="start">operations per token</text><text class="cap" x="40" y="98" text-anchor="start">W_Q</text><text class="sub2" x="140" y="98" text-anchor="start">8,192 × 8,192</text><text class="sub2" x="300" y="98" text-anchor="start">67.1 million</text><text class="sub2" x="470" y="98" text-anchor="start">134.2 million</text><text class="cap" x="40" y="122" text-anchor="start">W_K</text><text class="sub2" x="140" y="122" text-anchor="start">1,024 × 8,192</text><text class="sub2" x="300" y="122" text-anchor="start">8.4 million</text><text class="sub2" x="470" y="122" text-anchor="start">16.8 million</text><text class="cap" x="40" y="146" text-anchor="start">W_V</text><text class="sub2" x="140" y="146" text-anchor="start">1,024 × 8,192</text><text class="sub2" x="300" y="146" text-anchor="start">8.4 million</text><text class="sub2" x="470" y="146" text-anchor="start">16.8 million</text><text class="cap" x="40" y="170" text-anchor="start">W_O</text><text class="sub2" x="140" y="170" text-anchor="start">8,192 × 8,192</text><text class="sub2" x="300" y="170" text-anchor="start">67.1 million</text><text class="sub2" x="470" y="170" text-anchor="start">134.2 million</text><text class="cap" x="40" y="194" text-anchor="start">gate</text><text class="sub2" x="140" y="194" text-anchor="start">28,672 × 8,192</text><text class="sub2" x="300" y="194" text-anchor="start">234.9 million</text><text class="sub2" x="470" y="194" text-anchor="start">469.8 million</text><text class="cap" x="40" y="218" text-anchor="start">up</text><text class="sub2" x="140" y="218" text-anchor="start">28,672 × 8,192</text><text class="sub2" x="300" y="218" text-anchor="start">234.9 million</text><text class="sub2" x="470" y="218" text-anchor="start">469.8 million</text><text class="cap" x="40" y="242" text-anchor="start">down</text><text class="sub2" x="140" y="242" text-anchor="start">8,192 × 28,672</text><text class="sub2" x="300" y="242" text-anchor="start">234.9 million</text><text class="sub2" x="470" y="242" text-anchor="start">469.8 million</text><line class="axis" x1="40" y1="252" x2="640" y2="252"/><text class="cap" x="40" y="286" text-anchor="start">one layer</text><text class="sub2" x="300" y="286" text-anchor="start">855.6 million</text><text class="sub2" x="470" y="286" text-anchor="start">1.71 billion</text><text class="sub2" x="340" y="318" text-anchor="start">× 80 layers = 136.9 billion</text><text class="sub2" x="340" y="340" text-anchor="start">+ the output projection, 2.1 billion</text><text class="sub2" x="340" y="362" text-anchor="start">= 139.0 billion operations per token</text><g class="s"><rect x="140" y="390" width="400" height="42" rx="6"/><text class="sub" x="340.0" y="411.0" text-anchor="middle" dominant-baseline="central">operations per token  ≈  2 × parameter count</text></g><text class="cap" x="40" y="468" text-anchor="start">The rule of {{fig:v01-o112}} holds for each matrix separately, so it holds for their sum. Add</text><text class="cap" x="40" y="488" text-anchor="start">the seven and you have every weight in the layer; add 80 layers and the output</text><text class="cap" x="40" y="508" text-anchor="start">projection and you have nearly every parameter in the model.</text><text class="cap" x="40" y="548" text-anchor="start">The exception is the embedding table, 1.05 billion parameters read as a lookup with no</text><text class="cap" x="40" y="568" text-anchor="start">arithmetic ({{fig:v01-o088}}). That is why the exact count, 139.0 billion, is 1.5% under twice</text><text class="cap" x="40" y="588" text-anchor="start">the parameter count, 141.1 billion.</text><text class="cap" x="40" y="628" text-anchor="start">So a parameter count, the one number every model is advertised with, converts straight</text><text class="cap" x="40" y="648" text-anchor="start">into an operation count, to within a few percent.</text></svg><figcaption>The rule survives the sum because it holds matrix by matrix. That is why a single headline number is enough to price a forward pass.</figcaption></figure>
