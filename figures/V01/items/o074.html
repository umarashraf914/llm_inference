<figure><div class='ts'>Fig 74 &nbsp;&middot;&nbsp; 4:02</div><h3>What bandwidth is</h3><svg viewBox="0 0 680 412" role="img"><title>What bandwidth is</title><g class="m"><rect x="90" y="46" width="500" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">bandwidth  =  how many wires  x  how often each one carries a bit</text></g><text class="cap" x="40" y="122" text-anchor="start">Bandwidth is not speed in the everyday sense. It is a width multiplied by a frequency.</text><text class="hd" x="40" y="172">A narrow pipe, running fast</text><g class="h"><rect x="280" y="158" width="40" height="24" rx="3"></rect></g><text class="sub2" x="332" y="176" text-anchor="start">not much gets through</text><text class="hd" x="40" y="232">A wide pipe, running steadily</text><g class="s"><rect x="280" y="218" width="300" height="24" rx="3"></rect></g><text class="sub2" x="280" y="264" text-anchor="start">far more, at the same clock</text><text class="cap" x="40" y="314" text-anchor="start">Which is why memory gets faster mostly by getting wider, and why the memory sits packed</text><text class="cap" x="40" y="334" text-anchor="start">physically against the chip: a wide connection needs an enormous number of wires and they</text><text class="cap" x="40" y="354" text-anchor="start">cannot be long.</text><text class="cap" x="40" y="390" text-anchor="start">The figure quoted for a modern chip is around three trillion bytes per second.</text></svg><figcaption>Width times frequency. It explains both why memory is where it is and why it is hard to make much faster.</figcaption></figure>
