<figure><div class='ts'>Fig 110 &nbsp;&middot;&nbsp; 10:39</div><h3>Why one phase can be parallel and the other cannot</h3><svg viewBox='0 0 680 416' role='img'><title>Why one phase can be parallel and the other cannot</title><text class="hd" x="40" y="46">Prefill: the prompt already exists, so nothing has to wait</text><g class="m"><rect x="60" y="70" width="62" height="36" rx="3"/><text class="sub" x="91.0" y="88.0" text-anchor="middle" dominant-baseline="central">t1</text></g><g class="m"><rect x="132" y="70" width="62" height="36" rx="3"/><text class="sub" x="163.0" y="88.0" text-anchor="middle" dominant-baseline="central">t2</text></g><g class="m"><rect x="204" y="70" width="62" height="36" rx="3"/><text class="sub" x="235.0" y="88.0" text-anchor="middle" dominant-baseline="central">t3</text></g><g class="m"><rect x="276" y="70" width="62" height="36" rx="3"/><text class="sub" x="307.0" y="88.0" text-anchor="middle" dominant-baseline="central">t4</text></g><g class="m"><rect x="348" y="70" width="62" height="36" rx="3"/><text class="sub" x="379.0" y="88.0" text-anchor="middle" dominant-baseline="central">t5</text></g><g class="m"><rect x="420" y="70" width="62" height="36" rx="3"/><text class="sub" x="451.0" y="88.0" text-anchor="middle" dominant-baseline="central">t6</text></g><g class="m"><rect x="492" y="70" width="62" height="36" rx="3"/><text class="sub" x="523.0" y="88.0" text-anchor="middle" dominant-baseline="central">t7</text></g><g class="m"><rect x="564" y="70" width="62" height="36" rx="3"/><text class="sub" x="595.0" y="88.0" text-anchor="middle" dominant-baseline="central">t8</text></g><text class="sub2" x="60" y="132" text-anchor="start">all eight go through the model together</text><text class="hd" x="40" y="182">Decode: token nine does not exist until token eight is chosen</text><g class="m"><rect x="60" y="206" width="62" height="36" rx="3"/><text class="sub" x="91.0" y="224.0" text-anchor="middle" dominant-baseline="central">t9</text></g><rect x="132" y="206" width="62" height="36" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="204" y="206" width="62" height="36" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="276" y="206" width="62" height="36" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="60" y="268" text-anchor="start">one at a time, each waiting on the one before</text><text class="cap" x="40" y="318" text-anchor="start">The difference is not the model and not the hardware. It is that the prompt's tokens are all</text><text class="cap" x="40" y="338" text-anchor="start">known in advance and the answer's tokens are not.</text><text class="cap" x="40" y="374" text-anchor="start">Work that has no dependencies can be spread across a chip. Work that forms a chain cannot,</text><text class="cap" x="40" y="394" text-anchor="start">however many arithmetic units are sitting idle.</text></svg><figcaption>The dependency condition from Part 1, meeting the two phases. This single distinction produces every difference between them.</figcaption></figure>
