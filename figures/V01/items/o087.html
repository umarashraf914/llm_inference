<figure><div class='ts'>Fig 87 &nbsp;&middot;&nbsp; 6:58</div><h3>A token ID is a row number</h3><svg viewBox="0 0 680 438" role="img"><title>A token ID is a row number</title><text class="hd" x="40" y="46">The embedding table: one row per token in the vocabulary</text><g class="u"><rect x="180" y="70" width="320" height="26" rx="3"></rect></g><text class="sub2" x="192" y="83" text-anchor="start" dominant-baseline="central">0</text><g class="u"><rect x="180" y="100" width="320" height="26" rx="3"></rect></g><text class="sub2" x="192" y="113" text-anchor="start" dominant-baseline="central">1</text><g class="u"><rect x="180" y="130" width="320" height="26" rx="3"></rect></g><text class="sub2" x="192" y="143" text-anchor="start" dominant-baseline="central">2</text><g class="u"><rect x="180" y="160" width="320" height="26" rx="3"></rect></g><text class="sub2" x="192" y="173" text-anchor="start" dominant-baseline="central">...</text><g class="m"><rect x="180" y="190" width="320" height="26" rx="3"></rect></g><text class="sub2" x="192" y="203" text-anchor="start" dominant-baseline="central">4271</text><text class="sub2" x="430" y="203" text-anchor="middle" dominant-baseline="central">8,192 numbers</text><g class="u"><rect x="180" y="220" width="320" height="26" rx="3"></rect></g><text class="sub2" x="192" y="233" text-anchor="start" dominant-baseline="central">...</text><g class="u"><rect x="180" y="250" width="320" height="26" rx="3"></rect></g><text class="sub2" x="192" y="263" text-anchor="start" dominant-baseline="central">128254</text><g class="u"><rect x="180" y="280" width="320" height="26" rx="3"></rect></g><text class="sub2" x="192" y="293" text-anchor="start" dominant-baseline="central">128255</text><g class="s"><rect x="40" y="185" width="122" height="36" rx="6"></rect><text class="sub" x="101.0" y="203.0" text-anchor="middle" dominant-baseline="central">ID 4271</text></g><line class="conn" x1="168" y1="203" x2="176" y2="203" marker-end="url(#arw)"></line><line class="conn" x1="506" y1="203" x2="528" y2="203" marker-end="url(#arw)"></line><g class="s"><rect x="534" y="183" width="106" height="40" rx="6"></rect><text class="sub" x="587.0" y="203.0" text-anchor="middle" dominant-baseline="central">that row</text></g><text class="cap" x="40" y="340" text-anchor="start">The tokeniser turns a piece of text into an integer. That integer is not fed into a function;</text><text class="cap" x="40" y="360" text-anchor="start">it is a row number. The model goes to that row of the table and copies it out.</text><text class="cap" x="40" y="396" text-anchor="start">Nothing is calculated. No multiplication, no addition, no arithmetic of any kind. The whole</text><text class="cap" x="40" y="416" text-anchor="start">operation is a memory read at a computed address.</text></svg><figcaption>This is what a lookup means. The table is a learned parameter like any other, but reaching into it costs zero floating-point operations.</figcaption></figure>
