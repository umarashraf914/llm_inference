<figure><div class='ts'>Fig 102 &nbsp;&middot;&nbsp; 7:15</div><h3>Why stack so many layers</h3><svg viewBox='0 0 680 390' role='img'><title>Why stack so many layers</title><text class="hd" x="40" y="46">Depth, one layer at a time</text><g class="m"><rect x="40" y="70" width="150" height="34" rx="4"/><text class="sub" x="115.0" y="87.0" text-anchor="middle" dominant-baseline="central">after 1 layer</text></g><text class="sub2" x="206" y="92" text-anchor="start">a token knows its neighbours</text><g class="m"><rect x="40" y="118" width="150" height="34" rx="4"/><text class="sub" x="115.0" y="135.0" text-anchor="middle" dominant-baseline="central">after 10</text></g><text class="sub2" x="206" y="140" text-anchor="start">it knows the phrase it sits in</text><g class="m"><rect x="40" y="166" width="150" height="34" rx="4"/><text class="sub" x="115.0" y="183.0" text-anchor="middle" dominant-baseline="central">after 40</text></g><text class="sub2" x="206" y="188" text-anchor="start">it knows the sentence</text><g class="m"><rect x="40" y="214" width="150" height="34" rx="4"/><text class="sub" x="115.0" y="231.0" text-anchor="middle" dominant-baseline="central">after 80</text></g><text class="sub2" x="206" y="236" text-anchor="start">it can carry the whole passage</text><text class="cap" x="40" y="292" text-anchor="start">A rough picture rather than a measured one: nobody can point at layer 40 and read off what it</text><text class="cap" x="40" y="312" text-anchor="start">knows. What is certain is that each layer can only build on what the one below it produced.</text><text class="cap" x="40" y="348" text-anchor="start">The cost is linear in depth. Eighty layers means eighty times the weights and eighty times the</text><text class="cap" x="40" y="368" text-anchor="start">reading, for every single token.</text></svg><figcaption>The middle column is intuition, not measurement, and is flagged as such. The last line is exact and is what the byte count later depends on.</figcaption></figure>
