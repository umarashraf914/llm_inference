<figure><div class='ts'>Fig 20 &nbsp;&middot;&nbsp; 0:46</div><h3>What one request contains</h3><svg viewBox='0 0 680 342' role='img'><title>What one request contains</title><g class="u"><rect x="40" y="40" width="600" height="150" rx="14"/><text class="lbl" x="62" y="66">What arrives at the server</text></g><g class="s"><rect x="66" y="96" width="250" height="34" rx="4"/><text class="sub" x="191.0" y="113.0" text-anchor="middle" dominant-baseline="central">the conversation so far</text></g><g class="s"><rect x="340" y="96" width="274" height="34" rx="4"/><text class="sub" x="477.0" y="113.0" text-anchor="middle" dominant-baseline="central">the new question</text></g><g class="u"><rect x="66" y="140" width="548" height="34" rx="4"/><text class="sub" x="340.0" y="157.0" text-anchor="middle" dominant-baseline="central">settings: how long, how random, when to stop</text></g><text class="cap" x="40" y="244" text-anchor="start">The whole conversation is sent every time, not just the new question. The model has no memory</text><text class="cap" x="40" y="264" text-anchor="start">between requests, so anything it needs to know must arrive with the request.</text><text class="cap" x="40" y="300" text-anchor="start">A long conversation therefore means a long input, every single turn. That fact returns near</text><text class="cap" x="40" y="320" text-anchor="start">the end of this video as the reason one particular cost keeps growing.</text></svg><figcaption>The stateless part is the surprise. Each turn re-sends everything, which is why conversation length becomes a hardware problem rather than a bookkeeping one.</figcaption></figure>
