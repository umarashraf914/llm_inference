<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:21</div><h3>What one request contains</h3><svg viewBox='0 0 680 432' role='img'><title>What one request contains</title><g class="u"><rect x="40" y="30" width="600" height="176" rx="14"/><text class="lbl" x="62" y="56">What arrives at the server, every turn</text></g><g class="u"><rect x="62" y="70" width="118" height="32" rx="4"/><text class="sub" x="121.0" y="86.0" text-anchor="middle" dominant-baseline="central">system prompt</text></g><g class="u"><rect x="190" y="70" width="128" height="32" rx="4"/><text class="sub" x="254.0" y="86.0" text-anchor="middle" dominant-baseline="central">tool descriptions</text></g><g class="s"><rect x="328" y="70" width="170" height="32" rx="4"/><text class="sub" x="413.0" y="86.0" text-anchor="middle" dominant-baseline="central">the conversation so far</text></g><g class="s"><rect x="508" y="70" width="110" height="32" rx="4"/><text class="sub" x="563.0" y="86.0" text-anchor="middle" dominant-baseline="central">the new message</text></g><text class="sub2" x="190.0" y="122" text-anchor="middle">written by the operator</text><text class="sub2" x="473.0" y="122" text-anchor="middle">written by the user, and the model's replies</text><g class="u"><rect x="62" y="144" width="556" height="32" rx="4"/><text class="sub" x="340.0" y="160.0" text-anchor="middle" dominant-baseline="central">settings: how long the answer may be, how random, when to stop</text></g><text class="cap" x="40" y="246" text-anchor="start">The system prompt is the operator's standing instructions to the model: what it is for,</text><text class="cap" x="40" y="266" text-anchor="start">what tone to take, what to refuse. The tool descriptions list the outside programs the</text><text class="cap" x="40" y="286" text-anchor="start">model may ask to have run ({{fig:v01-o024}}).</text><text class="cap" x="40" y="326" text-anchor="start">Then comes the whole conversation so far, not just the new message. The model keeps</text><text class="cap" x="40" y="346" text-anchor="start">nothing between requests, so anything it needs to know must arrive with the request.</text><text class="cap" x="40" y="386" text-anchor="start">A long conversation therefore means a long input, every single turn. That fact returns</text><text class="cap" x="40" y="406" text-anchor="start">in Part 11 as the reason one particular cost keeps growing.</text></svg><figcaption>The stateless part is the surprise. Each turn re-sends everything, which is why conversation length becomes a hardware problem rather than a bookkeeping one.</figcaption></figure>
