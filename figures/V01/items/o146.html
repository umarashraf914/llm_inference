<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 29:31</div><h3>The recap</h3><svg viewBox='0 0 680 596' role='img'><title>The recap</title><text class="hd" x="40" y="46">The factor of 300, as one division</text><g class="h"><rect x="60" y="66" width="560" height="36" rx="6"/><text class="sub" x="340.0" y="84.0" text-anchor="middle" dominant-baseline="central">bandwidth ÷ bytes per token  =  3.35 TB/s ÷ 140 GB  =  23.9 tokens/s</text></g><g class="m"><rect x="60" y="112" width="560" height="36" rx="6"/><text class="sub" x="340.0" y="130.0" text-anchor="middle" dominant-baseline="central">peak ÷ operations per token  =  989 T/s ÷ 140 billion  =  7,064 tokens/s</text></g><g class="u"><rect x="60" y="158" width="560" height="36" rx="6"/><text class="sub" x="340.0" y="176.0" text-anchor="middle" dominant-baseline="central">7,064 ÷ 23.9  =  295:  the ridge ÷ an intensity of 1</text></g><text class="cap" x="40" y="226" text-anchor="start">The gap between what the arithmetic implies and what the chip delivers is not a mystery.</text><text class="cap" x="40" y="246" text-anchor="start">Bandwidth divided by bytes per token is the rate decode actually gets; the factor of 300</text><text class="cap" x="40" y="266" text-anchor="start">is how far that falls short of the rate the arithmetic alone would allow ({{fig:v01-p22}}).</text><text class="hd" x="40" y="316">The chain, in five links</text><g class="s"><rect x="60" y="338" width="480" height="32" rx="4"/><text class="sub" x="300.0" y="354.0" text-anchor="middle" dominant-baseline="central">compute outgrows bandwidth</text></g><line class="conn" x1="300" y1="372" x2="300" y2="378" marker-end="url(#arw)"/><g class="s"><rect x="60" y="380" width="480" height="32" rx="4"/><text class="sub" x="300.0" y="396.0" text-anchor="middle" dominant-baseline="central">a forward pass streams every weight</text></g><line class="conn" x1="300" y1="414" x2="300" y2="420" marker-end="url(#arw)"/><g class="s"><rect x="60" y="422" width="480" height="32" rx="4"/><text class="sub" x="300.0" y="438.0" text-anchor="middle" dominant-baseline="central">prefill amortises, decode does not</text></g><line class="conn" x1="300" y1="456" x2="300" y2="462" marker-end="url(#arw)"/><g class="m"><rect x="60" y="464" width="480" height="32" rx="4"/><text class="sub" x="300.0" y="480.0" text-anchor="middle" dominant-baseline="central">the KV cache adds to the bill</text></g><line class="conn" x1="300" y1="498" x2="300" y2="504" marker-end="url(#arw)"/><g class="m"><rect x="60" y="506" width="480" height="32" rx="4"/><text class="sub" x="300.0" y="522.0" text-anchor="middle" dominant-baseline="central">the user feels TTFT and TPOT; the operator optimises goodput</text></g><text class="cap" x="40" y="574" text-anchor="start">Every link is a division or a multiplication that can be done by hand.</text></svg><figcaption>Five sentences that between them explain the thirty milliseconds. Nothing in the chain requires anything beyond arithmetic.</figcaption></figure>
