<figure><div class='ts'>Fig 146 &nbsp;&middot;&nbsp; 29:42</div><h3>The recap</h3><svg viewBox="0 0 680 474" role="img"><title>The recap</title><g class="m"><rect x="60" y="46" width="560" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">the factor of 300  =  bandwidth  /  bytes per token</text></g><text class="cap" x="40" y="124" text-anchor="start">The gap between what the arithmetic implies and what the chip delivers is not a mystery. It is</text><text class="cap" x="40" y="144" text-anchor="start">a division between two hardware numbers and one property of the workload.</text><text class="hd" x="40" y="194">The chain, in five links</text><g class="s"><rect x="60" y="216" width="480" height="32" rx="4"></rect><text class="sub" x="300.0" y="232.0" text-anchor="middle" dominant-baseline="central">compute outgrows bandwidth</text></g><line class="conn" x1="300" y1="250" x2="300" y2="256" marker-end="url(#arw)"></line><g class="s"><rect x="60" y="258" width="480" height="32" rx="4"></rect><text class="sub" x="300.0" y="274.0" text-anchor="middle" dominant-baseline="central">a forward pass streams every weight</text></g><line class="conn" x1="300" y1="292" x2="300" y2="298" marker-end="url(#arw)"></line><g class="s"><rect x="60" y="300" width="480" height="32" rx="4"></rect><text class="sub" x="300.0" y="316.0" text-anchor="middle" dominant-baseline="central">prefill amortises, decode does not</text></g><line class="conn" x1="300" y1="334" x2="300" y2="340" marker-end="url(#arw)"></line><g class="m"><rect x="60" y="342" width="480" height="32" rx="4"></rect><text class="sub" x="300.0" y="358.0" text-anchor="middle" dominant-baseline="central">the KV cache adds to the bill</text></g><line class="conn" x1="300" y1="376" x2="300" y2="382" marker-end="url(#arw)"></line><g class="m"><rect x="60" y="384" width="480" height="32" rx="4"></rect><text class="sub" x="300.0" y="400.0" text-anchor="middle" dominant-baseline="central">goodput is what is actually sold</text></g><text class="cap" x="40" y="452" text-anchor="start">Every link is a division or a multiplication you can now do yourself.</text></svg><figcaption>Five sentences that between them explain the thirty milliseconds. Nothing in the chain requires anything beyond arithmetic.</figcaption></figure>
