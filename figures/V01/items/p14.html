<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 7:53</div><h3>Softmax turns each row of scores into weights that add to one</h3><svg viewBox='0 0 680 598' role='img'><title>Softmax turns each row of scores into weights that add to one</title><text class="hd" x="40" y="46">The query of “down” against four keys: e to each score, divided by the total</text><text class="sub2" x="140" y="84" text-anchor="start">score</text><text class="sub2" x="220" y="84" text-anchor="start">e to that</text><text class="sub2" x="320" y="84" text-anchor="start">weight, to scale</text><text class="cap" x="40" y="117" text-anchor="start">the</text><text class="sub2" x="140" y="117" text-anchor="start">0.5</text><text class="sub2" x="220" y="117" text-anchor="start">1.65</text><g class="u"><rect x="320" y="100" width="15.3" height="26" rx="3"/></g><text class="sub2" x="345.3" y="117" text-anchor="start">0.05</text><text class="cap" x="40" y="159" text-anchor="start">cat</text><text class="sub2" x="140" y="159" text-anchor="start">3.0</text><text class="sub2" x="220" y="159" text-anchor="start">20.09</text><g class="m"><rect x="320" y="142" width="185.9" height="26" rx="3"/></g><text class="sub2" x="515.9" y="159" text-anchor="start">0.62</text><text class="cap" x="40" y="201" text-anchor="start">sat</text><text class="sub2" x="140" y="201" text-anchor="start">2.2</text><text class="sub2" x="220" y="201" text-anchor="start">9.03</text><g class="m"><rect x="320" y="184" width="83.5" height="26" rx="3"/></g><text class="sub2" x="413.5" y="201" text-anchor="start">0.28</text><text class="cap" x="40" y="243" text-anchor="start">down</text><text class="sub2" x="140" y="243" text-anchor="start">0.5</text><text class="sub2" x="220" y="243" text-anchor="start">1.65</text><g class="u"><rect x="320" y="226" width="15.3" height="26" rx="3"/></g><text class="sub2" x="345.3" y="243" text-anchor="start">0.05</text><line class="tick" x1="220" y1="270" x2="270" y2="270"/><text class="sub2" x="140" y="290" text-anchor="start">total</text><text class="sub2" x="220" y="290" text-anchor="start">32.41</text><text class="sub2" x="320" y="290" text-anchor="start">1.00</text><text class="cap" x="40" y="332" text-anchor="start">Scores can be any size and either sign, but the weights of an average must be positive</text><text class="cap" x="40" y="352" text-anchor="start">and add to one ({{fig:v01-o093}}). Softmax, the same step that turned word scores into</text><text class="cap" x="40" y="372" text-anchor="start">probabilities ({{fig:v01-o009}}), makes them so: raise e to each score and divide by the</text><text class="cap" x="40" y="392" text-anchor="start">total.</text><text class="cap" x="40" y="432" text-anchor="start">So “down” gives 62% of its attention to “cat” and 28% to “sat”: the exponential turns a</text><text class="cap" x="40" y="452" text-anchor="start">lead of 0.8 in score into more than twice the weight, since e^0.8 = 2.2. These are the</text><text class="cap" x="40" y="472" text-anchor="start">weights {{fig:v01-o094}} blends with.</text><text class="cap" x="40" y="512" text-anchor="start">Real models first divide every score by the square root of the key's length, √128 ≈</text><text class="cap" x="40" y="532" text-anchor="start">11.3, so that long vectors do not produce scores so large that softmax gives everything</text><text class="cap" x="40" y="552" text-anchor="start">to one token ({{fig:v03-o021}}). The scores here are shown after that division, and are</text><text class="cap" x="40" y="572" text-anchor="start">illustrative.</text></svg><figcaption>Every row of the score grid gets its own softmax, so every token ends up with its own set of weights over the tokens before it.</figcaption></figure>
