<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:41</div><h3>3.35 TB/s is 5,120 wires, each carrying 5.2 billion bits a second</h3><svg viewBox='0 0 680 610' role='img'><title>3.35 TB/s is 5,120 wires, each carrying 5.2 billion bits a second</title><g class="u"><rect x="40" y="30" width="600" height="200" rx="14"/><text class="lbl" x="62" y="56">One H100 package, seen from above</text></g><g class="m"><rect x="240" y="80" width="200" height="120" rx="6"/><text class="sub" x="340.0" y="140.0" text-anchor="middle" dominant-baseline="central">the GPU die</text></g><g class="h"><rect x="60" y="70" width="150" height="40" rx="4"/><text class="sub" x="135.0" y="90.0" text-anchor="middle" dominant-baseline="central">stack 1: 1,024 wires</text></g><g class="h"><rect x="60" y="120" width="150" height="40" rx="4"/><text class="sub" x="135.0" y="140.0" text-anchor="middle" dominant-baseline="central">stack 2: 1,024 wires</text></g><g class="h"><rect x="60" y="170" width="150" height="40" rx="4"/><text class="sub" x="135.0" y="190.0" text-anchor="middle" dominant-baseline="central">stack 3: 1,024 wires</text></g><g class="h"><rect x="470" y="70" width="150" height="40" rx="4"/><text class="sub" x="545.0" y="90.0" text-anchor="middle" dominant-baseline="central">stack 4: 1,024 wires</text></g><g class="h"><rect x="470" y="120" width="150" height="40" rx="4"/><text class="sub" x="545.0" y="140.0" text-anchor="middle" dominant-baseline="central">stack 5: 1,024 wires</text></g><rect x="470" y="170" width="150" height="40" rx="4" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="545.0" y="190.0" text-anchor="middle" dominant-baseline="central">sixth site, unused</text><g class="u"><rect x="40" y="260" width="110" height="34" rx="5"/><text class="sub" x="95.0" y="277.0" text-anchor="middle" dominant-baseline="central">5 stacks</text></g><text class="hd" x="157" y="282" text-anchor="start">×</text><g class="u"><rect x="174" y="260" width="150" height="34" rx="5"/><text class="sub" x="249.0" y="277.0" text-anchor="middle" dominant-baseline="central">1,024 wires each</text></g><text class="hd" x="331" y="282" text-anchor="start">×</text><g class="u"><rect x="348" y="260" width="250" height="34" rx="5"/><text class="sub" x="473.0" y="277.0" text-anchor="middle" dominant-baseline="central">5.23 billion bits a second, per wire</text></g><text class="hd" x="40" y="332" text-anchor="start">=</text><g class="u"><rect x="62" y="310" width="200" height="34" rx="5"/><text class="sub" x="162.0" y="327.0" text-anchor="middle" dominant-baseline="central">26.8 trillion bits a second</text></g><text class="hd" x="268" y="332" text-anchor="start">÷</text><g class="u"><rect x="286" y="310" width="120" height="34" rx="5"/><text class="sub" x="346.0" y="327.0" text-anchor="middle" dominant-baseline="central">8 bits a byte</text></g><text class="hd" x="412" y="332" text-anchor="start">=</text><g class="h"><rect x="430" y="310" width="210" height="34" rx="5"/><text class="sub" x="535.0" y="327.0" text-anchor="middle" dominant-baseline="central">3.35 trillion bytes a second</text></g><text class="cap" x="40" y="384" text-anchor="start">The three factors of {{fig:v01-o078}}, multiplied out. Each stack of memory talks to the chip</text><text class="cap" x="40" y="404" text-anchor="start">over 1,024 data wires, and the H100 has five stacks: 5,120 wires, the 5120-bit interface</text><text class="cap" x="40" y="424" text-anchor="start">on NVIDIA's specification. The full design has six sites; this product uses five.</text><text class="cap" x="40" y="464" text-anchor="start">Each wire carries one bit at a time, 5.23 billion times a second. Multiply, divide by</text><text class="cap" x="40" y="484" text-anchor="start">eight bits to a byte, and the result is the 3.35 TB/s on the specification sheet.</text><text class="cap" x="40" y="524" text-anchor="start">The rate per wire is not published directly; it is what the other numbers imply. Each</text><text class="cap" x="40" y="544" text-anchor="start">factor runs into something physical: more wires need more room on the package, more</text><text class="cap" x="40" y="564" text-anchor="start">stacks need more edge around the die, and a faster rate per wire runs into electrical</text><text class="cap" x="40" y="584" text-anchor="start">noise.</text></svg><figcaption>Drawing schematic, numbers exact. Bandwidth is a count of wires times a rate per wire, and every term is geometry or physics, which is why it grows so slowly.</figcaption></figure>
