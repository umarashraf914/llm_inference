<figure><div class='ts'>Fig 120 &nbsp;&middot;&nbsp; 14:02</div><h3>Arithmetic intensity</h3><svg viewBox="0 0 680 338" role="img"><title>Arithmetic intensity</title><g class="m"><rect x="90" y="46" width="500" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">arithmetic intensity  =  operations performed / bytes moved</text></g><text class="cap" x="40" y="122" text-anchor="start">How much work the chip gets out of each byte it drags in from off-chip memory.</text><text class="cap" x="40" y="172" text-anchor="start">High intensity</text><g class="s"><rect x="300" y="156" width="320" height="32" rx="3"></rect><text class="sub" x="460.0" y="172.0" text-anchor="middle" dominant-baseline="central">reuses each byte many times</text></g><text class="cap" x="40" y="232" text-anchor="start">Low intensity</text><g class="h"><rect x="300" y="216" width="40" height="32" rx="3"></rect></g><text class="sub2" x="356" y="235" text-anchor="start">loads a byte, does almost nothing, needs another</text><text class="cap" x="40" y="296" text-anchor="start">The point of the metric is that it tells you in advance which resource a workload will</text><text class="cap" x="40" y="316" text-anchor="start">exhaust, before you run anything.</text></svg><figcaption>One ratio, computed from the shapes of the problem alone. It is the single most useful number in this series.</figcaption></figure>
