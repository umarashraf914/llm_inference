class="hd" x="492" y="140" text-anchor="start">=</text><g class="u"><rect x="516" y="70" width="54" height="130" rx="4"></rect><text class="sub" x="543.0" y="135.0" text-anchor="middle" dominant-baseline="central">out</text></g><text class="cap" x="40" y="250" text-anchor="start">Each row of the matrix meets the input vector: multiply the pairs, add the results, and that</text><text class="cap" x="40" y="270" text-anchor="start">single number is one entry of the output.</text><text class="cap" x="40" y="306" text-anchor="start">Do that for every row and you have the whole output vector. Twenty weights are drawn here, so</text><text class="cap" x="40" y="326" text-anchor="start">twenty multiplications and twenty additions.</text><text class="cap" x="40" y="362" text-anchor="start">This is the only heavy operation in the entire model. Everything else is a rounding error</text><text class="cap" x="40" y="382" text-anchor="start">beside it.</text></svg><figcaption>The pattern from the very first part, scaled up. Every weight is touched exactly once, which is the fact the operation count later depends on.</figcaption></figure>
