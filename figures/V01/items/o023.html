<figure><div class='ts'>Fig 23 &nbsp;&middot;&nbsp; 0:21</div><h3>Where the text is stored before it is assembled</h3><svg viewBox='0 0 680 548' role='img'><title>Where the text is stored before it is assembled</title><text class="hd" x="40" y="46">Three places the text can sit before the request is assembled</text><g class="u"><rect x="40" y="74" width="230" height="44" rx="5"/><text class="sub" x="155.0" y="96.0" text-anchor="middle" dominant-baseline="central">On the user's device</text></g><text class="sub2" x="292" y="94" text-anchor="start">the app holds it and sends it</text><text class="sub2" x="292" y="114" text-anchor="start">a developer's own system prompt</text><g class="s"><rect x="40" y="140" width="230" height="44" rx="5"/><text class="sub" x="155.0" y="162.0" text-anchor="middle" dominant-baseline="central">On the server, for one user</text></g><text class="sub2" x="292" y="160" text-anchor="start">stored against the user's account</text><text class="sub2" x="292" y="180" text-anchor="start">custom instructions, project files</text><g class="m"><rect x="40" y="206" width="230" height="44" rx="5"/><text class="sub" x="155.0" y="228.0" text-anchor="middle" dominant-baseline="central">On the server, for everyone</text></g><text class="sub2" x="292" y="226" text-anchor="start">one copy, shared by all users</text><text class="sub2" x="292" y="246" text-anchor="start">the provider's system prompt</text><line class="conn" x1="340" y1="282" x2="340" y2="306" marker-end="url(#arw)"/><g class="h"><rect x="190" y="310" width="300" height="40" rx="5"/><text class="sub" x="340.0" y="330.0" text-anchor="middle" dominant-baseline="central">all three end up in one assembled prompt</text></g><text class="cap" x="40" y="406" text-anchor="start">The serving system glues them together in a fixed order before the model sees anything:</text><text class="cap" x="40" y="426" text-anchor="start">the most shared text first, then anything specific to this user, then the conversation,</text><text class="cap" x="40" y="446" text-anchor="start">then the newest message.</text><text class="cap" x="40" y="486" text-anchor="start">That order is not cosmetic. It makes consecutive requests share the longest possible</text><text class="cap" x="40" y="506" text-anchor="start">identical opening, and a server can skip work for an opening it has already processed</text><text class="cap" x="40" y="526" text-anchor="start">({{fig:v01-o044}}).</text></svg><figcaption>Three storage locations, one destination. The order is deliberate: stable text first, so that as much as possible of each request matches the one before it.</figcaption></figure>
