<figure><div class='ts'>Fig 106 &nbsp;&middot;&nbsp; 9:49</div><h3>Three places, three speeds</h3><svg viewBox='0 0 680 396' role='img'><title>Three places, three speeds</title><text class="hd" x="40" y="46">Reading 140 gigabytes from each place</text><text class="cap" x="40" y="92" text-anchor="start">From a disk</text><g class="h"><rect x="330" y="74" width="300" height="30" rx="3"/></g><text class="sub2" x="340" y="94" text-anchor="start">about 20,000 ms</text><text class="cap" x="40" y="146" text-anchor="start">From the memory beside the chip</text><g class="s"><rect x="330" y="128" width="60" height="30" rx="3"/></g><text class="sub2" x="400" y="146" text-anchor="start">about 42 ms</text><text class="cap" x="40" y="200" text-anchor="start">From the chip's own memory</text><g class="u"><rect x="330" y="182" width="4" height="30" rx="3"/></g><text class="sub2" x="344" y="200" text-anchor="start">it does not fit</text><text class="cap" x="40" y="262" text-anchor="start">Roughly five hundred times between the first two rows. That is why the model is loaded into</text><text class="cap" x="40" y="282" text-anchor="start">the memory beside the chip and stays there.</text><text class="cap" x="40" y="318" text-anchor="start">The third row is not slow, it is impossible: the chip holds a few hundred kilobytes of fast</text><text class="cap" x="40" y="338" text-anchor="start">memory, not a hundred and forty gigabytes.</text><text class="cap" x="40" y="374" text-anchor="start">Disk figures are approximate and vary widely by hardware. The gap between the tiers does not.</text></svg><figcaption>The disk row explains why start-up is slow and why nobody streams weights from storage. After load, it never appears again.</figcaption></figure>
