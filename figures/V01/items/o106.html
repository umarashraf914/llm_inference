<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 9:49</div><h3>Three places, three speeds</h3><svg viewBox='0 0 680 520' role='img'><title>Three places, three speeds</title><text class="hd" x="40" y="46">Reading the 140 GB of weights from each place; time on a log scale</text><line class="axis" x1="260" y1="214" x2="640.0" y2="214"/><line class="tick" x1="260.0" y1="214" x2="260.0" y2="218"/><text class="sub2" x="260.0" y="232" text-anchor="middle">1 ms</text><line class="tick" x1="336.0" y1="214" x2="336.0" y2="218"/><text class="sub2" x="336.0" y="232" text-anchor="middle">10 ms</text><line class="tick" x1="412.0" y1="214" x2="412.0" y2="218"/><text class="sub2" x="412.0" y="232" text-anchor="middle">100 ms</text><line class="tick" x1="488.0" y1="214" x2="488.0" y2="218"/><text class="sub2" x="488.0" y="232" text-anchor="middle">1 s</text><line class="tick" x1="564.0" y1="214" x2="564.0" y2="218"/><text class="sub2" x="564.0" y="232" text-anchor="middle">10 s</text><line class="tick" x1="640.0" y1="214" x2="640.0" y2="218"/><text class="sub2" x="640.0" y="232" text-anchor="middle">100 s</text><text class="cap" x="40" y="90" text-anchor="start">from a fast disk</text><g class="h"><rect x="260" y="70" width="326.9" height="30" rx="3"/></g><text class="sub2" x="596.9" y="90" text-anchor="start">about 20 s</text><text class="cap" x="40" y="136" text-anchor="start">from the memory beside the chip</text><g class="s"><rect x="260" y="116" width="123.2" height="30" rx="3"/></g><text class="sub2" x="393.2" y="136" text-anchor="start">41.8 ms</text><text class="cap" x="40" y="182" text-anchor="start">from the chip's own memory</text><text class="sub2" x="260" y="182" text-anchor="start">it does not fit: about 114 MB, a thousandth of the model</text><text class="cap" x="40" y="274" text-anchor="start">Between runs the model file is kept on a disk. While the service runs, it sits in the</text><text class="cap" x="40" y="294" text-anchor="start">memory beside the chip. The chip itself holds only about 114 MB of fast memory, 1/1,229</text><text class="cap" x="40" y="314" text-anchor="start">of the model, so the weights cannot live there.</text><text class="cap" x="40" y="354" text-anchor="start">Reading the weights off a fast disk, taken here as 7 GB a second, takes about 20</text><text class="cap" x="40" y="374" text-anchor="start">seconds: some 480 times as long as from the memory beside the chip. So the model is</text><text class="cap" x="40" y="394" text-anchor="start">loaded once at start-up and then left in place for as long as the service runs,</text><text class="cap" x="40" y="414" text-anchor="start">answering millions of tokens.</text><text class="cap" x="40" y="454" text-anchor="start">That is the first example of a pattern that runs through the series: a fixed cost stops</text><text class="cap" x="40" y="474" text-anchor="start">mattering once it is spread over enough work. The rest of the atlas is about a cost that</text><text class="cap" x="40" y="494" text-anchor="start">refuses to spread that way, the 41.8 ms read paid again for every token.</text></svg><figcaption>Disk speeds vary widely, so the top row is approximate; the gap between the tiers is not. The chip's own memory is a ladder of its own, which the next video climbs ({{ref:v02-o051}}).</figcaption></figure>
