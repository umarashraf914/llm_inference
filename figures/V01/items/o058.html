<figure><div class='ts'>Fig 58 &nbsp;&middot;&nbsp; 0:21</div><h3>A token is sent the moment it is made</h3><svg viewBox='0 0 680 292' role='img'><title>A token is sent the moment it is made</title><text class="hd" x="40" y="46">One token, in three places, moments apart</text><g class="m"><rect x="40" y="76" width="170" height="44" rx="6"/><text class="sub" x="125.0" y="98.0" text-anchor="middle" dominant-baseline="central">made on the server</text></g><line class="conn" x1="216" y1="98" x2="266" y2="98" marker-end="url(#arw)"/><g class="u"><rect x="272" y="76" width="150" height="44" rx="6"/><text class="sub" x="347.0" y="98.0" text-anchor="middle" dominant-baseline="central">in flight</text></g><line class="conn" x1="428" y1="98" x2="478" y2="98" marker-end="url(#arw)"/><g class="s"><rect x="484" y="76" width="156" height="44" rx="6"/><text class="sub" x="562.0" y="98.0" text-anchor="middle" dominant-baseline="central">on the screen</text></g><text class="sub2" x="40" y="138" text-anchor="start">at time t</text><text class="sub2" x="272" y="138" text-anchor="start">one one-way trip</text><text class="sub2" x="484" y="138" text-anchor="start">at t + 65 ms</text><text class="cap" x="40" y="190" text-anchor="start">The token is not held back. The instant it exists it is written to the open connection,</text><text class="cap" x="40" y="210" text-anchor="start">and it appears on the user's screen one one-way trip later.</text><text class="cap" x="40" y="250" text-anchor="start">So the two things happen at once from any human point of view. There is no phase where</text><text class="cap" x="40" y="270" text-anchor="start">the answer is complete on the server and not yet on the screen.</text></svg><figcaption>Generation and display are the same event, offset by a network trip. Nothing waits for the answer to finish.</figcaption></figure>
