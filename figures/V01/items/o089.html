<figure><div class='ts'>Fig 89 &nbsp;&middot;&nbsp; 6:29</div><h3>The same shape, read two opposite ways</h3><svg viewBox="0 0 680 486" role="img"><title>The same shape, read two opposite ways</title><text class="hd" x="40" y="46">Two matrices of identical shape, 128,000 x 4,096</text><text class="cap" x="40" y="92" text-anchor="start">Input embedding</text><text class="sub2" x="40" y="112" text-anchor="start">a 200-token prompt</text><rect x="280" y="76" width="300" height="32" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="s"><rect x="280" y="76" width="1" height="32" rx="1"></rect></g><text class="sub2" x="592" y="96" text-anchor="start">0.15%</text><text class="cap" x="40" y="172" text-anchor="start">Output projection</text><text class="sub2" x="40" y="192" text-anchor="start">every single token</text><rect x="280" y="156" width="300" height="32" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="h"><rect x="280" y="156" width="300" height="32" rx="3"></rect><text class="sub" x="450.0" y="172.0" text-anchor="middle" dominant-baseline="central">100%</text></g><text class="cap" x="40" y="250" text-anchor="start">Bytes moved</text><g class="s"><rect x="280" y="234" width="2" height="30" rx="1"></rect></g><text class="sub2" x="292" y="253" text-anchor="start">1.6 MB</text><g class="h"><rect x="280" y="274" width="300" height="30" rx="3"></rect><text class="sub" x="450.0" y="289.0" text-anchor="middle" dominant-baseline="central">1.05 GB, again for the next token</text></g><text class="sub2" x="40" y="290" text-anchor="start"></text><text class="cap" x="40" y="352" text-anchor="start">The input embedding touches 200 rows out of 128,000 and never looks at the rest. The output</text><text class="cap" x="40" y="372" text-anchor="start">projection has to score every token in the vocabulary, so it reads all of them, every time.</text><text class="cap" x="40" y="408" text-anchor="start">Zero floating-point operations against 1.05 billion, for the same quantity of stored weights.</text><text class="cap" x="40" y="444" text-anchor="start">Some models share one set of weights between the two. Even then the reading is not shared:</text><text class="cap" x="40" y="464" text-anchor="start">one end gathers a handful of rows, the other end streams all of them.</text></svg><figcaption>A genuine exception to every token reads every weight. The embedding table is one of the largest single matrices in the model and contributes almost nothing to the traffic on the way in.</figcaption></figure>
