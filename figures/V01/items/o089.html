<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:58</div><h3>The same shape, read two opposite ways</h3><svg viewBox='0 0 680 524' role='img'><title>The same shape, read two opposite ways</title><text class="hd" x="40" y="46">Two matrices of identical shape, 128,256 × 8,192</text><text class="cap" x="40" y="82" text-anchor="start">Input embedding</text><text class="sub2" x="40" y="100" text-anchor="start">a 200-token prompt</text><rect x="220" y="68" width="300" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="220" y="68" width="2" height="30" rx="3"/></g><text class="sub2" x="532" y="88" text-anchor="start">0.16% of the rows</text><text class="cap" x="40" y="134" text-anchor="start">Output projection</text><text class="sub2" x="40" y="152" text-anchor="start">every single token</text><rect x="220" y="120" width="300" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="220" y="120" width="300.0" height="30" rx="3"/><text class="sub" x="370.0" y="135.0" text-anchor="middle" dominant-baseline="central">every row, 100%</text></g><text class="hd" x="40" y="186">Bytes moved, to scale</text><text class="cap" x="40" y="220" text-anchor="start">Input embedding</text><rect x="220" y="200" width="300" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="220" y="200" width="2" height="30" rx="3"/></g><text class="sub2" x="532" y="220" text-anchor="start">3.28 MB, once</text><text class="cap" x="40" y="268" text-anchor="start">Output projection</text><rect x="220" y="248" width="300" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="220" y="248" width="300.0" height="30" rx="3"/><text class="sub" x="370.0" y="263.0" text-anchor="middle" dominant-baseline="central">2.10 GB, every token</text></g><text class="cap" x="40" y="318" text-anchor="start">The input embedding touches 200 rows out of 128,256 and never looks at the rest. The</text><text class="cap" x="40" y="338" text-anchor="start">output projection has to score every token in the vocabulary, so it reads all of them,</text><text class="cap" x="40" y="358" text-anchor="start">every time.</text><text class="cap" x="40" y="398" text-anchor="start">Zero arithmetic against 2.10 billion operations, for the same quantity of stored</text><text class="cap" x="40" y="418" text-anchor="start">weights: 2.10 GB each.</text><text class="cap" x="40" y="458" text-anchor="start">Some models share one set of weights between the two; the model this atlas follows keeps</text><text class="cap" x="40" y="478" text-anchor="start">two copies. Even when shared, the reading is not: one end gathers a handful of rows, the</text><text class="cap" x="40" y="498" text-anchor="start">other end streams all of them.</text></svg><figcaption>Bars to scale, the input side drawn at the narrowest visible width. A genuine exception to every token reading every weight: one of the largest matrices in the model adds almost nothing to the traffic on the way in.</figcaption></figure>
