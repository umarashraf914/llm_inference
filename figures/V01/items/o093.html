<figure><div class='ts'>Fig 93 &nbsp;&middot;&nbsp; 7:15</div><h3>What a weighted average is</h3><svg viewBox='0 0 680 386' role='img'><title>What a weighted average is</title><text class="hd" x="40" y="46">A plain average counts everything equally</text><g class="u"><rect x="60" y="66" width="74" height="34" rx="3"/><text class="sub" x="97.0" y="83.0" text-anchor="middle" dominant-baseline="central">10</text></g><g class="u"><rect x="150" y="66" width="74" height="34" rx="3"/><text class="sub" x="187.0" y="83.0" text-anchor="middle" dominant-baseline="central">20</text></g><g class="u"><rect x="240" y="66" width="74" height="34" rx="3"/><text class="sub" x="277.0" y="83.0" text-anchor="middle" dominant-baseline="central">30</text></g><g class="u"><rect x="340" y="62" width="280" height="42" rx="6"/><text class="sub" x="480.0" y="83.0" text-anchor="middle" dominant-baseline="central">(10 + 20 + 30) / 3  =  20</text></g><text class="hd" x="40" y="156">A weighted average lets some count more than others</text><g class="s"><rect x="60" y="176" width="74" height="34" rx="3"/><text class="sub" x="97.0" y="193.0" text-anchor="middle" dominant-baseline="central">10</text></g><text class="sub2" x="97" y="228" text-anchor="middle">x 0.5</text><g class="s"><rect x="150" y="176" width="74" height="34" rx="3"/><text class="sub" x="187.0" y="193.0" text-anchor="middle" dominant-baseline="central">20</text></g><text class="sub2" x="187" y="228" text-anchor="middle">x 0.3</text><g class="s"><rect x="240" y="176" width="74" height="34" rx="3"/><text class="sub" x="277.0" y="193.0" text-anchor="middle" dominant-baseline="central">30</text></g><text class="sub2" x="277" y="228" text-anchor="middle">x 0.2</text><g class="m"><rect x="340" y="172" width="280" height="42" rx="6"/><text class="sub" x="480.0" y="193.0" text-anchor="middle" dominant-baseline="central">5 + 6 + 6  =  17</text></g><text class="cap" x="40" y="288" text-anchor="start">The weights add up to one, so the answer stays inside the range of the values. Here the first</text><text class="cap" x="40" y="308" text-anchor="start">value counts for half, so the result is pulled down towards it.</text><text class="cap" x="40" y="344" text-anchor="start">Change the weights and the answer changes without any of the values changing. That separation,</text><text class="cap" x="40" y="364" text-anchor="start">between what the values are and how much each one counts, is exactly what attention does.</text></svg><figcaption>One idea, and the next figure is nothing but this applied to a sequence of tokens.</figcaption></figure>
