<figure><div class='ts'>Fig 97 &nbsp;&middot;&nbsp; 9:10</div><h3>The picture that seems natural</h3><svg viewBox='0 0 680 474' role='img'><title>The picture that seems natural</title><text class="hd" x="40" y="46">One natural picture: computed once, then carried upward</text><g class="s"><rect x="40" y="74" width="150" height="40" rx="5"/><text class="sub" x="115.0" y="94.0" text-anchor="middle" dominant-baseline="central">embedding</text></g><line class="conn" x1="196" y1="94" x2="220" y2="94" marker-end="url(#arw)"/><g class="m"><rect x="226" y="74" width="140" height="40" rx="5"/><text class="sub" x="296.0" y="94.0" text-anchor="middle" dominant-baseline="central">W_Q, W_K, W_V</text></g><line class="conn" x1="372" y1="94" x2="396" y2="94" marker-end="url(#arw)"/><g class="u"><rect x="402" y="74" width="110" height="40" rx="5"/><text class="sub" x="457.0" y="94.0" text-anchor="middle" dominant-baseline="central">Q, K, V</text></g><g class="u"><rect x="402" y="138" width="110" height="30" rx="3"/><text class="sub" x="457.0" y="153.0" text-anchor="middle" dominant-baseline="central">layer 2</text></g><line class="conn" x1="457" y1="170" x2="457" y2="180" marker-end="url(#arw)"/><g class="u"><rect x="402" y="182" width="110" height="30" rx="3"/><text class="sub" x="457.0" y="197.0" text-anchor="middle" dominant-baseline="central">layer 3</text></g><line class="conn" x1="457" y1="214" x2="457" y2="224" marker-end="url(#arw)"/><g class="u"><rect x="402" y="226" width="110" height="30" rx="3"/><text class="sub" x="457.0" y="241.0" text-anchor="middle" dominant-baseline="central">layer 4</text></g><line class="conn" x1="457" y1="258" x2="457" y2="268" marker-end="url(#arw)"/><g class="u"><rect x="402" y="270" width="110" height="30" rx="3"/><text class="sub" x="457.0" y="285.0" text-anchor="middle" dominant-baseline="central">layer 5</text></g><line class="conn" x1="457" y1="118" x2="457" y2="134" marker-end="url(#arw)"/><text class="cap" x="40" y="340" text-anchor="start">It is a reasonable reading. The projections are fixed after training, the embedding is computed</text><text class="cap" x="40" y="360" text-anchor="start">once, so why would you do the multiplication more than once?</text><text class="cap" x="40" y="396" text-anchor="start">But that is not what happens, and the reason is worth following because it explains the shape of</text><text class="cap" x="40" y="416" text-anchor="start">the cache formula.</text><text class="cap" x="40" y="452" text-anchor="start">Every layer has its own W_Q, its own W_K and its own W_V, and computes Q, K and V afresh.</text></svg><figcaption>Worth stating clearly before correcting it: a fixed matrix and a token that never changes make it look as if the work could be done once.</figcaption></figure>
