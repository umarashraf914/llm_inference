" y="160" width="80" height="24" rx="3"></rect><text class="sub" x="220.0" y="172.0" text-anchor="middle" dominant-baseline="central">weight</text></g><line class="conn" x1="266" y1="172" x2="320" y2="132" marker-end="url(#arw)"></line><g class="s"><rect x="60" y="190" width="90" height="24" rx="3"></rect><text class="sub" x="105.0" y="202.0" text-anchor="middle" dominant-baseline="central">input 5</text></g><text class="sub2" x="162" y="206" text-anchor="start">x</text><g class="m"><rect x="180" y="190" width="80" height="24" rx="3"></rect><text class="sub" x="220.0" y="202.0" text-anchor="middle" dominant-baseline="central">weight</text></g><line class="conn" x1="266" y1="202" x2="320" y2="132" marker-end="url(#arw)"></line><g class="u"><rect x="330" y="118" width="130" height="28" rx="4"></rect><text class="sub" x="395.0" y="132.0" text-anchor="middle" dominant-baseline="central">add them up</text></g><line class="conn" x1="466" y1="132" x2="496" y2="132" marker-end="url(#arw)"></line><g class="s"><rect x="502" y="118" width="118" height="28" rx="4"></rect><text class="sub" x="561.0" y="132.0" text-anchor="middle" dominant-baseline="central">one output</text></g><text class="cap" x="40" y="246.0" text-anchor="start">Multiply each input by its own weight, then add the results together. That is one output</text><text class="cap" x="40" y="266.0" text-anchor="start">value, and the operation has a name, a dot product; {{fig:v01-p12}} shows what it</text><text class="cap" x="40" y="286.0" text-anchor="start">measures.</text><text class="cap" x="40" y="326.0" text-anchor="start">Nearly all of the arithmetic in every large language model is this pattern, repeated at</text><text class="cap" x="40" y="346.0" text-anchor="start">enormous scale.</text></svg><figcaption>Multiply and add. Hold onto this picture: the operation count later in this document is built directly out of it.</figcaption></figure>
