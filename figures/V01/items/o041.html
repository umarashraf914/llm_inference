<figure><div class='ts'>Fig 41 &nbsp;&middot;&nbsp; 0:46</div><h3>Measured on a small transformer</h3><svg viewBox='0 0 680 424' role='img'><title>Measured on a small transformer</title><text class="hd" x="40" y="46">Change token 2, then measure token 5's key at each layer</text><text class="cap" x="40" y="96" text-anchor="start">layer 1</text><g class="s"><rect x="180" y="78" width="170" height="30" rx="3"/><text class="sub" x="265.0" y="93.0" text-anchor="middle" dominant-baseline="central">0.000000</text></g><text class="sub2" x="370" y="96" text-anchor="start">identical</text><text class="cap" x="40" y="142" text-anchor="start">layer 2</text><g class="h"><rect x="180" y="124" width="170" height="30" rx="3"/><text class="sub" x="265.0" y="139.0" text-anchor="middle" dominant-baseline="central">3.538930</text></g><text class="sub2" x="370" y="142" text-anchor="start">different</text><text class="cap" x="40" y="188" text-anchor="start">layer 3</text><g class="h"><rect x="180" y="170" width="170" height="30" rx="3"/><text class="sub" x="265.0" y="185.0" text-anchor="middle" dominant-baseline="central">16.746760</text></g><text class="sub2" x="370" y="188" text-anchor="start">different</text><text class="cap" x="40" y="234" text-anchor="start">layer 4</text><g class="h"><rect x="180" y="216" width="170" height="30" rx="3"/><text class="sub" x="265.0" y="231.0" text-anchor="middle" dominant-baseline="central">20.102747</text></g><text class="sub2" x="370" y="234" text-anchor="start">different</text><text class="cap" x="40" y="290" text-anchor="start">A four-layer transformer, built and run for this figure: causal attention, a feed-forward block,</text><text class="cap" x="40" y="310" text-anchor="start">residual connections. Only token 2 was altered.</text><text class="cap" x="40" y="346" text-anchor="start">Layer 1 does not move at all, to the last bit. Layer 2 does, and the difference grows with</text><text class="cap" x="40" y="366" text-anchor="start">depth as the mixing compounds.</text><text class="cap" x="40" y="402" text-anchor="start">The pattern is what matters, not the magnitudes, which depend on the random weights used.</text></svg><figcaption>Not an argument from authority. A four-layer model was run twice with one token changed, and layer 1's key was identical to the last bit while every layer above it moved.</figcaption></figure>
