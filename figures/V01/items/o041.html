<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 25:43</div><h3>Measured on a small transformer</h3><svg viewBox='0 0 680 542' role='img'><title>Measured on a small transformer</title><text class="hd" x="40" y="46">Change token 2, then compare token 5's key at each layer</text><text class="cap" x="40" y="90" text-anchor="start">layer 1</text><text class="sub2" x="130" y="90" text-anchor="start">0: identical, to the last bit</text><text class="cap" x="40" y="134" text-anchor="start">layer 2</text><g class="h"><rect x="130" y="114" width="163.6" height="30" rx="3"/></g><text class="sub2" x="303.6" y="134" text-anchor="start">20.5% of the key's length</text><text class="cap" x="40" y="178" text-anchor="start">layer 3</text><g class="h"><rect x="130" y="158" width="211.6" height="30" rx="3"/></g><text class="sub2" x="351.6" y="178" text-anchor="start">26.5% of the key's length</text><text class="cap" x="40" y="222" text-anchor="start">layer 4</text><g class="h"><rect x="130" y="202" width="236.1" height="30" rx="3"/></g><text class="sub2" x="376.1" y="222" text-anchor="start">29.5% of the key's length</text><text class="cap" x="40" y="280" text-anchor="start">A four-layer transformer with random, untrained weights: positions added at the start,</text><text class="cap" x="40" y="300" text-anchor="start">causal attention, a gated feed-forward block like Llama's ({{fig:v01-p18}}) and residual</text><text class="cap" x="40" y="320" text-anchor="start">connections. It was run on five tokens, then again with only token 2 replaced, and token</text><text class="cap" x="40" y="340" text-anchor="start">5's keys compared: each bar is the length of the difference between the two keys, as a</text><text class="cap" x="40" y="360" text-anchor="start">share of the key's own length.</text><text class="cap" x="40" y="400" text-anchor="start">Layer 1's key does not move at all, to the last bit: its input is token 5 and its</text><text class="cap" x="40" y="420" text-anchor="start">position, and neither changed. Every layer above it differs, because its input already</text><text class="cap" x="40" y="440" text-anchor="start">carries token 2.</text><text class="cap" x="40" y="480" text-anchor="start">The sizes depend on the random weights. In six random models the differences above layer</text><text class="cap" x="40" y="500" text-anchor="start">1 ran from 13% to 67%, rising with depth in five and not in the sixth. Layer 1 was</text><text class="cap" x="40" y="520" text-anchor="start">exactly zero in all six.</text></svg><figcaption>Not an argument from authority: run a small model twice with one token changed, and layer 1's key comes out identical to the last bit while every layer above it moves. Bars to scale.</figcaption></figure>
