<figure><div class='ts'>Fig 30 &nbsp;&middot;&nbsp; 0:46</div><h3>Why there is not a round trip per token</h3><svg viewBox='0 0 680 502' role='img'><title>Why there is not a round trip per token</title><text class="hd" x="40" y="46">A network round trip against the time to make one token</text><text class="cap" x="40" y="92" text-anchor="start">Making one token</text><g class="m"><rect x="300" y="74" width="74.4" height="30" rx="3"/></g><text class="sub2" x="386.4" y="92" text-anchor="start">30 ms</text><text class="cap" x="40" y="138" text-anchor="start">Same city, there and back</text><g class="h"><rect x="300" y="120" width="12.4" height="30" rx="3"/></g><text class="sub2" x="324.4" y="138" text-anchor="start">5 ms</text><text class="cap" x="40" y="184" text-anchor="start">Seoul to Tokyo</text><g class="h"><rect x="300" y="166" width="86.8" height="30" rx="3"/></g><text class="sub2" x="398.8" y="184" text-anchor="start">35 ms</text><text class="cap" x="40" y="230" text-anchor="start">Seoul to the US west coast</text><g class="h"><rect x="300" y="212" width="320" height="30" rx="3"/></g><text class="sub2" x="632" y="230" text-anchor="start">130 ms</text><text class="hd" x="40" y="268">A 500-token answer, either way</text><text class="cap" x="40" y="314" text-anchor="start">Streamed, one connection</text><g class="s"><rect x="300" y="298" width="120" height="30" rx="3"/><text class="sub" x="360.0" y="313.0" text-anchor="middle" dominant-baseline="central">15 s</text></g><text class="cap" x="40" y="364" text-anchor="start">A round trip per token</text><g class="h"><rect x="300" y="348" width="320" height="30" rx="3"/><text class="sub" x="460.0" y="363.0" text-anchor="middle" dominant-baseline="central">80 s, from Seoul</text></g><text class="cap" x="40" y="424" text-anchor="start">The waiting would dominate completely. Making the token is the cheap part; asking for it</text><text class="cap" x="40" y="444" text-anchor="start">across an ocean is not.</text><text class="cap" x="40" y="480" text-anchor="start">Which is why nothing works that way, and why the connection is opened once and held.</text></svg><figcaption>Round-trip figures are typical rather than measured, and vary by route. The conclusion does not: per-token round trips would make generation several times slower than the generation itself.</figcaption></figure>
