<figure><div class='ts'>Fig 24 &nbsp;&middot;&nbsp; 0:46</div><h3>Descriptions go into the context, code does not</h3><svg viewBox='0 0 680 382' role='img'><title>Descriptions go into the context, code does not</title><text class="hd" x="40" y="46">For a tool, two very different things exist</text><g class="s"><rect x="40" y="74" width="285" height="90" rx="8"/><text class="lbl" x="182.5" y="102.0" text-anchor="middle" dominant-baseline="central">The description</text><text class="sub" x="182.5" y="120.0" text-anchor="middle" dominant-baseline="central">name, arguments, what it returns.</text><text class="sub" x="182.5" y="137.0" text-anchor="middle" dominant-baseline="central">Text. Goes into the context.</text></g><g class="h"><rect x="355" y="74" width="285" height="90" rx="8"/><text class="lbl" x="497.5" y="102.0" text-anchor="middle" dominant-baseline="central">The implementation</text><text class="sub" x="497.5" y="120.0" text-anchor="middle" dominant-baseline="central">the code that actually runs.</text><text class="sub" x="497.5" y="137.0" text-anchor="middle" dominant-baseline="central">Never enters the context.</text></g><text class="cap" x="40" y="208" text-anchor="start">The model cannot execute anything. It emits text in a shape the serving system recognises as a</text><text class="cap" x="40" y="228" text-anchor="start">call, and ordinary software outside the model runs the code and hands back a result.</text><text class="cap" x="40" y="264" text-anchor="start">So a plugin's code lives wherever it lives, on a server or on your machine, and the model never</text><text class="cap" x="40" y="284" text-anchor="start">sees a line of it. What the model needs is only enough description to know the tool exists and</text><text class="cap" x="40" y="304" text-anchor="start">how to phrase a call.</text><text class="cap" x="40" y="340" text-anchor="start">That is why a tool with a long description costs you tokens on every turn while a tool with a</text><text class="cap" x="40" y="360" text-anchor="start">thousand lines of code costs you none.</text></svg><figcaption>The distinction that makes tools affordable. The expensive part of a tool, by token count, is its documentation, not its behaviour.</figcaption></figure>
