<figure><div class='ts'>Fig 24 &nbsp;&middot;&nbsp; 0:21</div><h3>Descriptions go into the context, code does not</h3><svg viewBox='0 0 680 430' role='img'><title>Descriptions go into the context, code does not</title><text class="hd" x="40" y="46">For a tool, two very different things exist</text><g class="s"><rect x="40" y="74" width="285" height="90" rx="8"/><text class="lbl" x="182.5" y="102.0" text-anchor="middle" dominant-baseline="central">The description</text><text class="sub" x="182.5" y="120.0" text-anchor="middle" dominant-baseline="central">name, arguments, what it returns.</text><text class="sub" x="182.5" y="137.0" text-anchor="middle" dominant-baseline="central">Text. Goes into the context.</text></g><g class="h"><rect x="355" y="74" width="285" height="90" rx="8"/><text class="lbl" x="497.5" y="102.0" text-anchor="middle" dominant-baseline="central">The implementation</text><text class="sub" x="497.5" y="120.0" text-anchor="middle" dominant-baseline="central">the code that actually runs.</text><text class="sub" x="497.5" y="137.0" text-anchor="middle" dominant-baseline="central">Never enters the context.</text></g><text class="cap" x="40" y="208" text-anchor="start">A tool is a program outside the model that the model can ask to have run: a weather</text><text class="cap" x="40" y="228" text-anchor="start">lookup, a web search, a calculator. The model cannot execute anything itself. It emits</text><text class="cap" x="40" y="248" text-anchor="start">text in a shape the serving system recognises as a call, and ordinary software outside</text><text class="cap" x="40" y="268" text-anchor="start">the model runs the code and hands back a result.</text><text class="cap" x="40" y="308" text-anchor="start">So a tool's code lives wherever it lives, on a server or on the user's machine, and the</text><text class="cap" x="40" y="328" text-anchor="start">model never sees a line of it. What the model needs is only enough description to know</text><text class="cap" x="40" y="348" text-anchor="start">the tool exists and how to phrase a call.</text><text class="cap" x="40" y="388" text-anchor="start">That is why a tool with a long description costs tokens on every turn while a tool with</text><text class="cap" x="40" y="408" text-anchor="start">a thousand lines of code costs none.</text></svg><figcaption>The distinction that makes tools affordable. The expensive part of a tool, by token count, is its documentation, not its behaviour.</figcaption></figure>
