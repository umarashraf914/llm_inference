<figure><div class='ts'>Fig 107 &nbsp;&middot;&nbsp; 9:30</div><h3>What high bandwidth memory is</h3><svg viewBox='0 0 680 380' role='img'><title>What high bandwidth memory is</title><g class="u"><rect x="40" y="40" width="600" height="156" rx="14"/><text class="lbl" x="62" y="66">One package</text></g><g class="h"><rect x="66" y="96" width="100" height="34" rx="3"/><text class="sub" x="116.0" y="113.0" text-anchor="middle" dominant-baseline="central">memory</text></g><g class="h"><rect x="66" y="138" width="100" height="34" rx="3"/><text class="sub" x="116.0" y="155.0" text-anchor="middle" dominant-baseline="central">memory</text></g><g class="m"><rect x="180" y="96" width="250" height="76" rx="6"/><text class="sub" x="305.0" y="134.0" text-anchor="middle" dominant-baseline="central">the processing chip</text></g><g class="h"><rect x="444" y="96" width="100" height="34" rx="3"/><text class="sub" x="494.0" y="113.0" text-anchor="middle" dominant-baseline="central">memory</text></g><g class="h"><rect x="444" y="138" width="100" height="34" rx="3"/><text class="sub" x="494.0" y="155.0" text-anchor="middle" dominant-baseline="central">memory</text></g><text class="sub2" x="66" y="232" text-anchor="start">stacks of memory bonded millimetres from the chip, on the same slab</text><text class="cap" x="40" y="282" text-anchor="start">This is what high bandwidth memory means: not faster memory chips, but memory placed as close</text><text class="cap" x="40" y="302" text-anchor="start">as physically possible and joined by a very wide bus.</text><text class="cap" x="40" y="338" text-anchor="start">Wide needs short. The thousands of connections that give it its bandwidth only work over</text><text class="cap" x="40" y="358" text-anchor="start">millimetres, which is why the memory cannot simply be moved further away and made bigger.</text></svg><figcaption>The name describes a placement, not a technology. Close and wide, at the cost of being small and expensive.</figcaption></figure>
