<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 9:54</div><h3>What high bandwidth memory is</h3><svg viewBox='0 0 680 526' role='img'><title>What high bandwidth memory is</title><text class="hd" x="40" y="46">One package, seen from the side (schematic)</text><g class="u"><rect x="60" y="214" width="560" height="26" rx="3"/><text class="sub" x="340.0" y="227.0" text-anchor="middle" dominant-baseline="central">the package: the slab everything is mounted on</text></g><g class="h"><rect x="90" y="192" width="150" height="18" rx="2"/></g><g class="h"><rect x="90" y="170" width="150" height="18" rx="2"/></g><g class="h"><rect x="90" y="148" width="150" height="18" rx="2"/><text class="sub" x="165.0" y="157.0" text-anchor="middle" dominant-baseline="central">memory die</text></g><g class="h"><rect x="90" y="126" width="150" height="18" rx="2"/></g><g class="h"><rect x="90" y="104" width="150" height="18" rx="2"/></g><g class="h"><rect x="90" y="82" width="150" height="18" rx="2"/></g><g class="m"><rect x="300" y="144" width="220" height="64" rx="4"/><text class="sub" x="410.0" y="176.0" text-anchor="middle" dominant-baseline="central">the GPU die</text></g><text class="sub2" x="165" y="70" text-anchor="middle">one memory stack</text><text class="sub2" x="410" y="132" text-anchor="middle">the processing chip</text><text class="sub2" x="270" y="260" text-anchor="middle">millimetres apart, joined through the package by a very wide bus</text><text class="cap" x="40" y="300" text-anchor="start">A die is one piece of silicon cut from a larger disc called a wafer. The processing chip</text><text class="cap" x="40" y="320" text-anchor="start">is one die. A memory stack is several memory dies bonded on top of one another, which is</text><text class="cap" x="40" y="340" text-anchor="start">the stack in high bandwidth memory, HBM.</text><text class="cap" x="40" y="380" text-anchor="start">This is what HBM means: not faster memory chips, but memory placed as close as</text><text class="cap" x="40" y="400" text-anchor="start">physically possible to the processing die, on the same package, and joined to it by a</text><text class="cap" x="40" y="420" text-anchor="start">very wide bus ({{fig:v01-p09}} counts the wires).</text><text class="cap" x="40" y="460" text-anchor="start">Wide needs short. The thousands of connections that give it its bandwidth only work over</text><text class="cap" x="40" y="480" text-anchor="start">millimetres, which is why the memory cannot simply be moved further away and made</text><text class="cap" x="40" y="500" text-anchor="start">bigger.</text></svg><figcaption>The name describes a placement, not a technology. Close and wide, at the cost of being small and expensive.</figcaption></figure>
