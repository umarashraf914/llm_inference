<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 9:43</div><h3>140 GB does not fit in one H100's 80 GB</h3><svg viewBox='0 0 680 520' role='img'><title>140 GB does not fit in one H100's 80 GB</title><text class="hd" x="40" y="46">The weights against the memory that has to hold them, to scale</text><text class="cap" x="40" y="90" text-anchor="start">the weights</text><g class="h"><rect x="200" y="70" width="332.5" height="30" rx="3"/></g><text class="sub2" x="542.5" y="90" text-anchor="start">140 GB</text><text class="cap" x="40" y="136" text-anchor="start">one H100</text><g class="u"><rect x="200" y="116" width="190.0" height="30" rx="3"/></g><text class="sub2" x="400.0" y="136" text-anchor="start">80 GB: 60 GB too small</text><text class="cap" x="40" y="182" text-anchor="start">two H100s</text><g class="s"><rect x="200" y="162" width="190.0" height="30" rx="3"/></g><g class="s"><rect x="390.0" y="162" width="190.0" height="30" rx="3"/></g><text class="sub2" x="590.0" y="182" text-anchor="start">160 GB: fits</text><text class="hd" x="40" y="232">A trillion parameters at 2 bytes each: 2 TB, in 80 GB chips</text><g class="u"><rect x="40" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="64" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="88" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="112" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="136" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="160" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="184" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="208" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="232" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="256" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="280" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="304" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="328" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="352" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="376" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="400" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="424" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="448" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="472" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="496" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="520" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="544" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="568" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="592" y="248" width="20" height="26" rx="2"/></g><g class="u"><rect x="616" y="248" width="20" height="26" rx="2"/></g><text class="sub2" x="644" y="266" text-anchor="start">25</text><text class="cap" x="40" y="314" text-anchor="start">Capacity is the first limit on a specification sheet ({{fig:v01-o080}}): whether the model</text><text class="cap" x="40" y="334" text-anchor="start">fits at all. The model this atlas follows needs 140 GB and one H100 holds 80, so it does</text><text class="cap" x="40" y="354" text-anchor="start">not fit on one chip; it needs at least two.</text><text class="cap" x="40" y="394" text-anchor="start">Split across two, each chip holds 70 GB and reads it once per token: 70 GB ÷ 3.35 TB/s =</text><text class="cap" x="40" y="414" text-anchor="start">20.9 ms, if the two work perfectly side by side. What splitting really costs is the</text><text class="cap" x="40" y="434" text-anchor="start">fifth video's subject ({{fig:v05-o001}}).</text><text class="cap" x="40" y="474" text-anchor="start">A trillion-parameter model like Kimi K2 ({{fig:v01-p03}}) needs 2 TB at two bytes a</text><text class="cap" x="40" y="494" text-anchor="start">parameter: 25 H100s just to hold its weights.</text></svg><figcaption>The rest of this atlas works with one 70-billion-parameter model on one H100, because the arithmetic per chip is the same. In practice that model needs at least two.</figcaption></figure>
