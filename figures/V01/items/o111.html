<figure><div class='ts'>Fig 111 &nbsp;&middot;&nbsp; 11:46</div><h3>Where the 2 comes from</h3><svg viewBox="0 0 680 404" role="img"><title>Where the 2 comes from</title><text class="hd" x="40" y="46">One output value is a sum of weighted inputs</text><g class="u"><rect x="120" y="66" width="440" height="42" rx="6"></rect><text class="sub" x="340.0" y="87.0" text-anchor="middle" dominant-baseline="central">y  =  w1 x1  +  w2 x2  +  w3 x3  +  ...</text></g><text class="hd" x="40" y="152">Each term costs two operations</text><g class="m"><rect x="120" y="172" width="130" height="40" rx="6"></rect><text class="sub" x="185.0" y="192.0" text-anchor="middle" dominant-baseline="central">w1 x x1</text></g><text class="sub2" x="266" y="196" text-anchor="start">one multiply</text><g class="m"><rect x="120" y="222" width="130" height="40" rx="6"></rect><text class="sub" x="185.0" y="242.0" text-anchor="middle" dominant-baseline="central">add to y</text></g><text class="sub2" x="266" y="246" text-anchor="start">one addition</text><text class="cap" x="40" y="306" text-anchor="start">The processor does not do these separately. It has a single instruction, the multiply-accumulate,</text><text class="cap" x="40" y="326" text-anchor="start">that multiplies two numbers and adds the result into a running total in one step.</text><text class="cap" x="40" y="362" text-anchor="start">It is still counted as two floating-point operations, because two arithmetic results are</text><text class="cap" x="40" y="382" text-anchor="start">produced. That convention is where the 2 comes from, and it is the only place it comes from.</text></svg><figcaption>Not a fudge factor or a rule of thumb. Every weight in the model participates in exactly one multiply-accumulate per token, and that instruction counts as two operations.</figcaption></figure>
