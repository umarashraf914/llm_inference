idth="12" height="12" rx="1"/></g><g class="u"><rect x="102" y="358" width="12" height="12" rx="1"/></g><g class="u"><rect x="116" y="358" width="12" height="12" rx="1"/></g><g class="u"><rect x="130" y="358" width="12" height="12" rx="1"/></g><g class="u"><rect x="144" y="358" width="12" height="12" rx="1"/></g><g class="u"><rect x="158" y="358" width="12" height="12" rx="1"/></g><g class="u"><rect x="172" y="358" width="12" height="12" rx="1"/></g><g class="u"><rect x="186" y="358" width="12" height="12" rx="1"/></g><g class="u"><rect x="60" y="372" width="12" height="12" rx="1"/></g><g class="u"><rect x="74" y="372" width="12" height="12" rx="1"/></g><g class="u"><rect x="88" y="372" width="12" height="12" rx="1"/></g><g class="u"><rect x="102" y="372" width="12" height="12" rx="1"/></g><g class="u"><rect x="116" y="372" width="12" height="12" rx="1"/></g><g class="u"><rect x="130" y="372" width="12" height="12" rx="1"/></g><g class="u"><rect x="144" y="372" width="12" height="12" rx="1"/></g><g class="u"><rect x="158" y="372" width="12" height="12" rx="1"/></g><g class="u"><rect x="172" y="372" width="12" height="12" rx="1"/></g><g class="u"><rect x="186" y="372" width="12" height="12" rx="1"/></g><g class="u"><rect x="60" y="386" width="12" height="12" rx="1"/></g><g class="u"><rect x="74" y="386" width="12" height="12" rx="1"/></g><g class="u"><rect x="88" y="386" width="12" height="12" rx="1"/></g><g class="u"><rect x="102" y="386" width="12" height="12" rx="1"/></g><g class="u"><rect x="116" y="386" width="12" height="12" rx="1"/></g><g class="u"><rect x="130" y="386" width="12" height="12" rx="1"/></g><g class="u"><rect x="144" y="386" width="12" height="12" rx="1"/></g><g class="u"><rect x="158" y="386" width="12" height="12" rx="1"/></g><g class="u"><rect x="172" y="386" width="12" height="12" rx="1"/></g><g class="u"><rect x="186" y="386" width="12" height="12" rx="1"/></g><g class="u"><rect x="60" y="400" width="12" height="12" rx="1"/></g><g class="u"><rect x="74" y="400" width="12" height="12" rx="1"/></g><g class="u"><rect x="88" y="400" width="12" height="12" rx="1"/></g><g class="u"><rect x="102" y="400" width="12" height="12" rx="1"/></g><g class="u"><rect x="116" y="400" width="12" height="12" rx="1"/></g><g class="u"><rect x="130" y="400" width="12" height="12" rx="1"/></g><g class="u"><rect x="144" y="400" width="12" height="12" rx="1"/></g><g class="u"><rect x="158" y="400" width="12" height="12" rx="1"/></g><g class="u"><rect x="172" y="400" width="12" height="12" rx="1"/></g><g class="u"><rect x="186" y="400" width="12" height="12" rx="1"/></g><g class="u"><rect x="60" y="414" width="12" height="12" rx="1"/></g><g class="u"><rect x="74" y="414" width="12" height="12" rx="1"/></g><g class="u"><rect x="88" y="414" width="12" height="12" rx="1"/></g><g class="u"><rect x="102" y="414" width="12" height="12" rx="1"/></g><g class="u"><rect x="116" y="414" width="12" height="12" rx="1"/></g><g class="u"><rect x="130" y="414" width="12" height="12" rx="1"/></g><g class="u"><rect x="144" y="414" width="12" height="12" rx="1"/></g><g class="u"><rect x="158" y="414" width="12" height="12" rx="1"/></g><g class="u"><rect x="172" y="414" width="12" height="12" rx="1"/></g><g class="u"><rect x="186" y="414" width="12" height="12" rx="1"/></g><text class="sub2" x="220" y="310" text-anchor="start">a row for each token's query, a column for each token's key</text><text class="sub2" x="220" y="334" text-anchor="start">10 tokens drawn: 10 × 10 = 100 scores</text><text class="sub2" x="220" y="358" text-anchor="start">a 2,000-token prompt: 2,000 × 2,000 = 4,000,000 scores</text><text class="cap" x="40" y="466" text-anchor="start">A query is compared with a key by their dot product ({{fig:v01-p12}}). Key 1 points exactly</text><text class="cap" x="40" y="486" text-anchor="start">the way the query does and scores 6; key 3 points exactly the opposite way and scores</text><text class="cap" x="40" y="506" text-anchor="start">−6; key 2 is partly aligned and scores 2. The score is how relevant that key's token is</text><text class="cap" x="40" y="526" text-anchor="start">to the query's.</text><text class="cap" x="40" y="566" text-anchor="start">Every token in the prompt has a query and a key, and every query is scored against every</text><text class="cap" x="40" y="586" text-anchor="start">key. At 2,000 tokens that is 4,000,000 scores for one attention computation in one</text><text class="cap" x="40" y="606" text-anchor="start">layer, and each layer runs many side by side ({{fig:v01-p28}}).</text><text class="cap" x="40" y="646" text-anchor="start">About half the grid goes unused, because a token may not look at tokens after it;</text><text class="cap" x="40" y="666" text-anchor="start">{{fig:v01-o132}} shows why.</text></svg><figcaption>The grid grows with the square of the prompt: ten times the tokens, a hundred times the scores. That square is why long prompts are expensive in ways the weights alone do not explain.</figcaption></figure>
