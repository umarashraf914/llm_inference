<figure><div class='ts'>Fig 61 &nbsp;&middot;&nbsp; 2:41</div><h3>What counts as one operation</h3><svg viewBox="0 0 680 310" role="img"><title>What counts as one operation</title><text class="hd" x="40" y="46">An operation is one piece of arithmetic</text><g class="m"><rect x="60" y="70" width="250" height="40" rx="6"></rect><text class="sub" x="185.0" y="90.0" text-anchor="middle" dominant-baseline="central">one multiplication</text></g><g class="m"><rect x="340" y="70" width="250" height="40" rx="6"></rect><text class="sub" x="465.0" y="90.0" text-anchor="middle" dominant-baseline="central">one addition</text></g><text class="cap" x="40" y="156" text-anchor="start">That is all. Not a line of code, not a step of reasoning. One multiply, or one add, on two</text><text class="cap" x="40" y="176" text-anchor="start">numbers.</text><text class="cap" x="40" y="212" text-anchor="start">The unit is a floating-point operation, usually shortened to FLOP. Floating point just means</text><text class="cap" x="40" y="232" text-anchor="start">the numbers can have a fractional part, which the model's weights certainly do.</text><text class="cap" x="40" y="268" text-anchor="start">Counting them is how the size of a job is measured, in the same way distance is measured in</text><text class="cap" x="40" y="288" text-anchor="start">metres.</text></svg><figcaption>Deliberately small. When a figure later says a token costs 140 billion operations, it means 140 billion of these.</figcaption></figure>
