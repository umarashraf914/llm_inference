<figure><div class='ts'>Fig 16 &nbsp;&middot;&nbsp; 0:21</div><h3>What a server is</h3><svg viewBox='0 0 680 426' role='img'><title>What a server is</title><g class="u"><rect x="40" y="40" width="285" height="150" rx="14"/><text class="lbl" x="62" y="66">A server</text></g><g class="m"><rect x="62" y="96" width="240" height="34" rx="4"/><text class="sub" x="182.0" y="113.0" text-anchor="middle" dominant-baseline="central">a few GPUs</text></g><g class="u"><rect x="62" y="140" width="240" height="34" rx="4"/><text class="sub" x="182.0" y="157.0" text-anchor="middle" dominant-baseline="central">always on, in a data centre</text></g><g class="h"><rect x="368" y="40" width="272" height="150" rx="14"/><text class="lbl" x="390" y="66">The user's laptop</text></g><g class="u"><rect x="390" y="96" width="228" height="34" rx="4"/><text class="sub" x="504.0" y="113.0" text-anchor="middle" dominant-baseline="central">one small chip</text></g><g class="u"><rect x="390" y="140" width="228" height="34" rx="4"/><text class="sub" x="504.0" y="157.0" text-anchor="middle" dominant-baseline="central">on when it is in use</text></g><text class="cap" x="40" y="244" text-anchor="start">The model does not run on the user's device. It runs on machines in a building</text><text class="cap" x="40" y="264" text-anchor="start">somewhere, and each question travels there and back over the network.</text><text class="cap" x="40" y="304" text-anchor="start">A data centre is a warehouse full of those machines, with the power and cooling to keep</text><text class="cap" x="40" y="324" text-anchor="start">them running continuously. Each machine holds a few GPUs: chips built to do enormous</text><text class="cap" x="40" y="344" text-anchor="start">numbers of multiplications at once ({{fig:v01-o070}} explains why that kind of chip).</text><text class="cap" x="40" y="384" text-anchor="start">Everything in this series is about what happens inside one of those machines in the</text><text class="cap" x="40" y="404" text-anchor="start">fraction of a second after a question arrives.</text></svg><figcaption>Grounding for the word production. The constraints below only make sense for hardware that is shared, always on, and paid for by the hour.</figcaption></figure>
