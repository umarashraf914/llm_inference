<figure><div class='ts'>Fig 55 &nbsp;&middot;&nbsp; 28:34</div><h3>What a cache hit saves, and what it does not</h3><svg viewBox='0 0 680 400' role='img'><title>What a cache hit saves, and what it does not</title><text class="hd" x="40" y="46">A hit changes one phase and leaves the other untouched</text><text class="cap" x="40" y="92" text-anchor="start">Prefill</text><g class="s"><rect x="230" y="76" width="340" height="30" rx="3"/><text class="sub" x="400.0" y="91.0" text-anchor="middle" dominant-baseline="central">skipped, for every matched token</text></g><text class="cap" x="40" y="152" text-anchor="start">Decode</text><g class="h"><rect x="230" y="136" width="340" height="30" rx="3"/><text class="sub" x="400.0" y="151.0" text-anchor="middle" dominant-baseline="central">identical, every token still reads all 140 GB</text></g><text class="cap" x="40" y="226" text-anchor="start">Caching is entirely a prefill optimisation. It cannot make the answer come out faster once it</text><text class="cap" x="40" y="246" text-anchor="start">has started, because generating a token never depended on how the context was assembled.</text><text class="cap" x="40" y="282" text-anchor="start">So a warm cache improves time to first token and does nothing at all for time per output</text><text class="cap" x="40" y="302" text-anchor="start">token ({{fig:v01-o143}}). Those are the two numbers a user feels, and this touches only</text><text class="cap" x="40" y="322" text-anchor="start">one of them.</text><text class="cap" x="40" y="358" text-anchor="start">Which matches the experience: a warm follow-up starts sooner, and then streams at exactly the</text><text class="cap" x="40" y="378" text-anchor="start">same speed as a cold one.</text></svg><figcaption>Worth being precise, because caching is often described as making the model faster. It makes it start sooner, which is a different claim; against a promise about the first token, it is the one that counts for goodput.</figcaption></figure>
