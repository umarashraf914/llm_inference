<figure><div class='ts'>Fig 38 &nbsp;&middot;&nbsp; 25:43</div><h3>At layer 1, a key ignores every other token</h3><svg viewBox='0 0 680 472' role='img'><title>At layer 1, a key ignores every other token</title><text class="hd" x="40" y="46">At layer 1, the input is the token and its position, nothing more</text><g class="s"><rect x="40" y="74" width="150" height="40" rx="5"/><text class="sub" x="115.0" y="94.0" text-anchor="middle" dominant-baseline="central">token 5's ID</text></g><text class="hd" x="206" y="98" text-anchor="start">+</text><g class="s"><rect x="232" y="74" width="150" height="40" rx="5"/><text class="sub" x="307.0" y="94.0" text-anchor="middle" dominant-baseline="central">position 5</text></g><line class="conn" x1="398" y1="94" x2="424" y2="94" marker-end="url(#arw)"/><g class="u"><rect x="430" y="74" width="210" height="40" rx="5"/><text class="sub" x="535.0" y="94.0" text-anchor="middle" dominant-baseline="central">the vector fed to W_K</text></g><text class="cap" x="40" y="154" text-anchor="start">Nothing in that depends on tokens 1 to 4. Change token 2 and this vector is bit-for-bit</text><text class="cap" x="40" y="174" text-anchor="start">identical.</text><g class="s"><rect x="140" y="206" width="400" height="42" rx="6"/><text class="sub" x="340.0" y="227.0" text-anchor="middle" dominant-baseline="central">so at layer 1, the key is the same in every sentence</text></g><text class="cap" x="40" y="290" text-anchor="start">Token 5's key and value at layer 1 are a function of token 5 and its position alone.</text><text class="cap" x="40" y="310" text-anchor="start">They could be looked up in a table and would be correct in any sentence whatsoever.</text><text class="cap" x="40" y="350" text-anchor="start">Llama applies the position inside attention instead, by rotating each query and key</text><text class="cap" x="40" y="370" text-anchor="start">({{fig:v01-o090}}), and the conclusion is the same: at layer 1 nothing but the token and</text><text class="cap" x="40" y="390" text-anchor="start">its position goes in.</text><text class="cap" x="40" y="430" text-anchor="start">If a model had only one layer, a server could reuse the key and value of any token whose</text><text class="cap" x="40" y="450" text-anchor="start">ID and position matched, whatever came before it.</text></svg><figcaption>The independence is real, and it survives exactly one layer.</figcaption></figure>
