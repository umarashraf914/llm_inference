<figure><div class='ts'>Fig 67 &nbsp;&middot;&nbsp; 3:29</div><h3>The gap, drawn to scale</h3><svg viewBox="0 0 680 252" role="img"><title>The gap, drawn to scale</title><text class="hd" x="40" y="46">Where the 30 milliseconds goes</text><g class="m"><rect x="60" y="66" width="4" height="44" rx="1"></rect></g><text class="sub2" x="72" y="92" text-anchor="start">arithmetic, under 1%</text><g class="h"><rect x="66" y="66" width="554" height="44" rx="4"></rect><text class="sub" x="343.0" y="88.0" text-anchor="middle" dominant-baseline="central">something else, 99%</text></g><text class="cap" x="40" y="160" text-anchor="start">Less than one percent of a decode step is spent doing mathematics. The chip is not slow and</text><text class="cap" x="40" y="180" text-anchor="start">the model is not badly written.</text><text class="cap" x="40" y="210" text-anchor="start">By the end of this video the other ninety-nine percent has a name, and the thirty milliseconds</text><text class="cap" x="40" y="230" text-anchor="start">can be derived from just two hardware numbers, for any model on any chip.</text></svg><figcaption>This bar is the thesis of the whole series. Everything later is an attempt to shrink the red part.</figcaption></figure>
