<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:25</div><h3>Under one percent of each step is arithmetic</h3><svg viewBox='0 0 680 428' role='img'><title>Under one percent of each step is arithmetic</title><text class="hd" x="40" y="46">Where the 30 milliseconds of one token go, drawn to scale</text><g class="m"><rect x="60" y="92" width="1.87" height="44" rx="0"/></g><g class="h"><rect x="61.87" y="92" width="558.13" height="44" rx="3"/><text class="sub" x="340.935" y="114.0" text-anchor="middle" dominant-baseline="central">everything else: 29.9 ms, 99.67%</text></g><text class="sub2" x="60" y="80" text-anchor="start">arithmetic: 0.1 ms, 0.33%, the sliver at the left edge</text><g class="u"><rect x="150" y="162" width="380" height="42" rx="6"/><text class="sub" x="340.0" y="183.0" text-anchor="middle" dominant-baseline="central">0.1 ÷ 30  =  0.0033  =  0.33 percent</text></g><text class="cap" x="40" y="242" text-anchor="start">Drawn to scale, the arithmetic is under two pixels wide. Everything else in a decode</text><text class="cap" x="40" y="262" text-anchor="start">step is something other than mathematics.</text><text class="cap" x="40" y="302" text-anchor="start">A percentage is a fraction written out of a hundred: 0.1 out of 30 is 0.33 out of 100, a</text><text class="cap" x="40" y="322" text-anchor="start">third of one percent. The exact share depends on the model and the chip; that it is</text><text class="cap" x="40" y="342" text-anchor="start">under one percent does not.</text><text class="cap" x="40" y="382" text-anchor="start">By the end of this atlas the other 99 percent has a name, and the time per token can be</text><text class="cap" x="40" y="402" text-anchor="start">derived from two hardware numbers, for any model on any chip.</text></svg><figcaption>This bar is the thesis of the whole series. Everything later is an attempt to shrink the red part.</figcaption></figure>
