<figure><div class='ts'>Fig 29 &nbsp;&middot;&nbsp; 0:21</div><h3>The loop on the server</h3><svg viewBox='0 0 680 498' role='img'><title>The loop on the server</title><text class="hd" x="40" y="46">What the server does with every token it makes</text><g class="m"><rect x="250" y="84" width="180" height="46" rx="6"/><text class="sub" x="340.0" y="107.0" text-anchor="middle" dominant-baseline="central">one token appears</text></g><line class="conn" x1="246" y1="107" x2="206" y2="107" marker-end="url(#arw)"/><line class="conn" x1="434" y1="107" x2="474" y2="107" marker-end="url(#arw)"/><g class="s"><rect x="40" y="88" width="162" height="38" rx="5"/><text class="sub" x="121.0" y="107.0" text-anchor="middle" dominant-baseline="central">down the wire, to the user</text></g><g class="h"><rect x="478" y="88" width="162" height="38" rx="5"/><text class="sub" x="559.0" y="107.0" text-anchor="middle" dominant-baseline="central">kept on the server</text></g><text class="sub2" x="478" y="148" text-anchor="start">part of the model's working</text><line class="conn" x1="340" y1="136" x2="340" y2="186" marker-end="url(#arw)"/><g class="u"><rect x="230" y="190" width="220" height="38" rx="5"/><text class="sub" x="340.0" y="209.0" text-anchor="middle" dominant-baseline="central">and it becomes the next input</text></g><line class="conn" x1="226" y1="209" x2="150" y2="209"/><line class="conn" x1="150" y1="209" x2="150" y2="152"/><line class="conn" x1="150" y1="152" x2="340" y2="152"/><line class="conn" x1="340" y1="152" x2="340" y2="138" marker-end="url(#arw)"/><text class="cap" x="40" y="276" text-anchor="start">Three things happen to each token, not one. It goes to the user, the server keeps part</text><text class="cap" x="40" y="296" text-anchor="start">of the model's working for it, and the token itself becomes part of the input for the</text><text class="cap" x="40" y="316" text-anchor="start">step after it.</text><text class="cap" x="40" y="356" text-anchor="start">That third arrow is what autoregressive means: the model's own output is its next input.</text><text class="cap" x="40" y="376" text-anchor="start">It is also why an answer cannot be written in parallel, because token 9 does not exist</text><text class="cap" x="40" y="396" text-anchor="start">until token 8 is chosen.</text><text class="cap" x="40" y="436" text-anchor="start">The loop runs until the model emits a stop token or reaches a length limit. What exactly</text><text class="cap" x="40" y="456" text-anchor="start">the server keeps for each token, and why keeping it matters so much, is the subject of</text><text class="cap" x="40" y="476" text-anchor="start">Part 11 ({{fig:v01-o136}}).</text></svg><figcaption>The arrow most pictures of streaming leave out: the server feeds every token back to itself as well as sending it to the user.</figcaption></figure>
