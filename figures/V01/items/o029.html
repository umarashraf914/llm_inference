<figure><div class='ts'>Fig 29 &nbsp;&middot;&nbsp; 0:21</div><h3>The loop on the server</h3><svg viewBox='0 0 680 430' role='img'><title>The loop on the server</title><text class="hd" x="40" y="46">What the server does with every token it makes</text><g class="m"><rect x="250" y="84" width="180" height="46" rx="6"/><text class="sub" x="340.0" y="107.0" text-anchor="middle" dominant-baseline="central">one token appears</text></g><line class="conn" x1="246" y1="107" x2="206" y2="107" marker-end="url(#arw)"/><line class="conn" x1="434" y1="107" x2="474" y2="107" marker-end="url(#arw)"/><g class="s"><rect x="40" y="88" width="162" height="38" rx="5"/><text class="sub" x="121.0" y="107.0" text-anchor="middle" dominant-baseline="central">down the wire, to you</text></g><g class="h"><rect x="478" y="88" width="162" height="38" rx="5"/><text class="sub" x="559.0" y="107.0" text-anchor="middle" dominant-baseline="central">into the cache</text></g><text class="sub2" x="478" y="148" text-anchor="start">its keys and values, appended</text><line class="conn" x1="340" y1="136" x2="340" y2="186" marker-end="url(#arw)"/><g class="u"><rect x="230" y="190" width="220" height="38" rx="5"/><text class="sub" x="340.0" y="209.0" text-anchor="middle" dominant-baseline="central">and it becomes the next input</text></g><line class="conn" x1="226" y1="209" x2="150" y2="209"/><line class="conn" x1="150" y1="209" x2="150" y2="152"/><line class="conn" x1="150" y1="152" x2="340" y2="152"/><line class="conn" x1="340" y1="152" x2="340" y2="138" marker-end="url(#arw)"/><text class="cap" x="40" y="276" text-anchor="start">Three things happen to each token, not one. It goes to you, its keys and values are appended</text><text class="cap" x="40" y="296" text-anchor="start">to the cache, and the token itself becomes part of the input for the step after it.</text><text class="cap" x="40" y="332" text-anchor="start">That third arrow is what autoregressive means: the model's own output is its next input. It is</text><text class="cap" x="40" y="352" text-anchor="start">also why decode cannot be parallelised, because token 9 does not exist until token 8 is chosen.</text><text class="cap" x="40" y="388" text-anchor="start">The loop runs until the model emits a stop token or reaches a length limit, and the cache is one</text><text class="cap" x="40" y="408" text-anchor="start">entry longer after every turn of it.</text></svg><figcaption>The arrow the previous figure left out. Your instinct was right: the server is feeding itself while it is feeding you.</figcaption></figure>
