<figure><div class='ts'>Fig 142 &nbsp;&middot;&nbsp; 26:06</div><h3>Latency and throughput</h3><svg viewBox='0 0 680 386' role='img'><title>Latency and throughput</title><text class="hd" x="40" y="46">Latency and throughput, away from computers</text><g class="s"><rect x="40" y="70" width="285" height="82" rx="8"/><text class="lbl" x="182.5" y="94.0" text-anchor="middle" dominant-baseline="central">Latency</text><text class="sub" x="182.5" y="112.0" text-anchor="middle" dominant-baseline="central">how long one letter takes</text><text class="sub" x="182.5" y="129.0" text-anchor="middle" dominant-baseline="central">to arrive</text></g><g class="m"><rect x="355" y="70" width="285" height="82" rx="8"/><text class="lbl" x="497.5" y="94.0" text-anchor="middle" dominant-baseline="central">Throughput</text><text class="sub" x="497.5" y="112.0" text-anchor="middle" dominant-baseline="central">how many letters the service</text><text class="sub" x="497.5" y="129.0" text-anchor="middle" dominant-baseline="central">delivers in a day</text></g><text class="cap" x="40" y="196" text-anchor="start">A van that leaves once a week, crammed full, has enormous throughput and terrible latency. A</text><text class="cap" x="40" y="216" text-anchor="start">motorcycle courier carrying one letter has the reverse.</text><text class="cap" x="40" y="252" text-anchor="start">Neither is better. They answer different questions, and improving one often costs the other.</text><text class="cap" x="40" y="288" text-anchor="start">A serving system faces exactly this choice: wait to gather more requests and get more done, or</text><text class="cap" x="40" y="308" text-anchor="start">answer immediately and get less done.</text><text class="cap" x="40" y="344" text-anchor="start">That tension is why the last measurement in this video counts only the tokens that arrived in</text><text class="cap" x="40" y="364" text-anchor="start">time.</text></svg><figcaption>An example with no computers in it, because the trade-off is not a computing idea and is much easier to see in a delivery van.</figcaption></figure>
