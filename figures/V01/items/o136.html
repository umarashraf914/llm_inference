<figure><div class='ts'>Fig 136 &nbsp;&middot;&nbsp; 23:17</div><h3>The key-value cache</h3><svg viewBox="0 0 680 358" role="img"><title>The key-value cache</title><g class="u"><rect x="40" y="40" width="600" height="140" rx="14"></rect><text class="lbl" x="62" y="66">Each decode step</text></g><g class="m"><rect x="66" y="96" width="160" height="40" rx="4"></rect><text class="sub" x="146.0" y="116.0" text-anchor="middle" dominant-baseline="central">compute one K and V</text></g><line class="conn" x1="232" y1="116" x2="256" y2="116" marker-end="url(#arw)"></line><g class="s"><rect x="262" y="96" width="140" height="40" rx="4"></rect><text class="sub" x="332.0" y="116.0" text-anchor="middle" dominant-baseline="central">append to cache</text></g><line class="conn" x1="408" y1="116" x2="432" y2="116" marker-end="url(#arw)"></line><g class="s"><rect x="438" y="96" width="178" height="40" rx="4"></rect><text class="sub" x="527.0" y="116.0" text-anchor="middle" dominant-baseline="central">read the whole cache</text></g><text class="cap" x="40" y="216" text-anchor="start">Every key and value a token produces is written into a dedicated region of HBM. The next token</text><text class="cap" x="40" y="236" text-anchor="start">computes only its own, appends it, and reads the accumulated cache to compute attention.</text><text class="cap" x="40" y="276" text-anchor="start">Linear work per token instead of quadratic. It is an obvious optimisation once seen, every</text><text class="cap" x="40" y="296" text-anchor="start">serving system implements it, and it is the reason decode is tractable at all.</text><text class="cap" x="40" y="336" text-anchor="start">It is also the reason every other optimisation in this series exists.</text></svg><figcaption>A caching trick that solves one problem and creates the one that dominates everything downstream.</figcaption></figure>
