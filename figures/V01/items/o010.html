<figure><div class='ts'>Fig 10 &nbsp;&middot;&nbsp; 0:00</div><h3>Why the same question gives different answers</h3><svg viewBox='0 0 680 350' role='img'><title>Why the same question gives different answers</title><text class="hd" x="40" y="46">One probability list, two different answers</text><g class="m"><rect x="60" y="70" width="260" height="34" rx="3"/><text class="sub" x="190.0" y="87.0" text-anchor="middle" dominant-baseline="central">cat, 74.5%</text></g><g class="m"><rect x="60" y="114" width="92" height="34" rx="3"/><text class="sub" x="106.0" y="131.0" text-anchor="middle" dominant-baseline="central">dog, 24.8%</text></g><text class="sub2" x="370" y="92" text-anchor="start">run once, and cat is likely</text><text class="sub2" x="370" y="134" text-anchor="start">run again, and dog can win</text><text class="cap" x="40" y="196" text-anchor="start">The model gives the same list every time. What varies is the draw made from it: a token is</text><text class="cap" x="40" y="216" text-anchor="start">picked at random, in proportion to those shares.</text><text class="cap" x="40" y="252" text-anchor="start">So a quarter of the time the second candidate is chosen, and the answer takes a different turn</text><text class="cap" x="40" y="272" text-anchor="start">from there on.</text><text class="cap" x="40" y="308" text-anchor="start">That is why the same question can produce different answers, and why nothing about the model</text><text class="cap" x="40" y="328" text-anchor="start">itself has changed when it does.</text></svg><figcaption>A frequent source of confusion, and the answer is entirely in the last step rather than in the model.</figcaption></figure>
