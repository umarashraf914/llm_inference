<figure><div class='ts'>Fig 72 &nbsp;&middot;&nbsp; 4:02</div><h3>Why computers use two states</h3><svg viewBox='0 0 680 340' role='img'><title>Why computers use two states</title><text class="hd" x="40" y="46">Why two states, and not ten</text><g class="s"><rect x="60" y="70" width="240" height="44" rx="6"/><text class="sub" x="180.0" y="92.0" text-anchor="middle" dominant-baseline="central">voltage high</text></g><g class="u"><rect x="320" y="70" width="240" height="44" rx="6"/><text class="sub" x="440.0" y="92.0" text-anchor="middle" dominant-baseline="central">voltage low</text></g><text class="sub2" x="60" y="136" text-anchor="start">call them 1 and 0</text><text class="cap" x="40" y="186" text-anchor="start">A wire could in principle carry ten different voltage levels and hold a decimal digit. Nobody</text><text class="cap" x="40" y="206" text-anchor="start">builds it that way, because telling ten levels apart reliably, billions of times a second,</text><text class="cap" x="40" y="226" text-anchor="start">across a warm chip, is far harder than telling two apart.</text><text class="cap" x="40" y="262" text-anchor="start">Two states tolerate noise. A signal that should be high can sag a long way and still be read</text><text class="cap" x="40" y="282" text-anchor="start">correctly.</text><text class="cap" x="40" y="318" text-anchor="start">So everything is built out of yes-or-no, and any other number has to be assembled from them.</text></svg><figcaption>Not a mathematical preference. It is an engineering one, and the reason every quantity in this series is eventually counted in bits.</figcaption></figure>
