<figure><div class='ts'>Fig 28 &nbsp;&middot;&nbsp; 0:21</div><h3>How a device and the server actually talk</h3><svg viewBox='0 0 680 476' role='img'><title>How a device and the server actually talk</title><text class="hd" x="40" y="46">Up: once, at the start</text><g class="s"><rect x="40" y="74" width="150" height="40" rx="6"/><text class="sub" x="115.0" y="94.0" text-anchor="middle" dominant-baseline="central">the user's device</text></g><line class="conn" x1="200" y1="94" x2="470" y2="94" marker-end="url(#arw)"/><text class="sub2" x="220" y="84" text-anchor="start">the whole prompt, every token of it</text><g class="h"><rect x="480" y="74" width="160" height="40" rx="6"/><text class="sub" x="560.0" y="94.0" text-anchor="middle" dominant-baseline="central">the server</text></g><text class="hd" x="40" y="168">Down: continuously, as each token is made</text><g class="s"><rect x="40" y="196" width="150" height="40" rx="6"/><text class="sub" x="115.0" y="216.0" text-anchor="middle" dominant-baseline="central">the user's device</text></g><g class="h"><rect x="480" y="196" width="160" height="40" rx="6"/><text class="sub" x="560.0" y="216.0" text-anchor="middle" dominant-baseline="central">the server</text></g><line class="conn" x1="470" y1="216" x2="442" y2="216" marker-end="url(#arw)"/><line class="conn" x1="440" y1="216" x2="412" y2="216" marker-end="url(#arw)"/><line class="conn" x1="410" y1="216" x2="382" y2="216" marker-end="url(#arw)"/><line class="conn" x1="380" y1="216" x2="352" y2="216" marker-end="url(#arw)"/><line class="conn" x1="350" y1="216" x2="322" y2="216" marker-end="url(#arw)"/><line class="conn" x1="320" y1="216" x2="292" y2="216" marker-end="url(#arw)"/><line class="conn" x1="290" y1="216" x2="262" y2="216" marker-end="url(#arw)"/><line class="conn" x1="260" y1="216" x2="232" y2="216" marker-end="url(#arw)"/><line class="conn" x1="230" y1="216" x2="202" y2="216" marker-end="url(#arw)"/><text class="sub2" x="200" y="262" text-anchor="start">one small frame per token, down the connection that is already open</text><text class="cap" x="40" y="314" text-anchor="start">One request goes up. The connection stays open, and the answer comes back a token at a</text><text class="cap" x="40" y="334" text-anchor="start">time as it is produced.</text><text class="cap" x="40" y="374" text-anchor="start">Nothing travels upward during generation. The user's device sends nothing between the</text><text class="cap" x="40" y="394" text-anchor="start">question and the end of the answer; it only listens.</text><text class="cap" x="40" y="434" text-anchor="start">So neither of the two obvious pictures is right. The text is not re-sent word by word,</text><text class="cap" x="40" y="454" text-anchor="start">and the answer is not finished before any of it leaves.</text></svg><figcaption>One journey up, many small journeys down, over a single open connection. This is what streaming means on the wire.</figcaption></figure>
