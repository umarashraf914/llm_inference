<figure><div class='ts'>Fig 98 &nbsp;&middot;&nbsp; 7:15</div><h3>What actually happens</h3><svg viewBox='0 0 680 502' role='img'><title>What actually happens</title><text class="hd" x="40" y="46">Each layer owns its own three matrices</text><g class="u"><rect x="40" y="70" width="600" height="58" rx="14"/><text class="lbl" x="62" y="104">layer 1</text></g><g class="m"><rect x="200" y="84" width="124" height="30" rx="4"/><text class="sub" x="262.0" y="99.0" text-anchor="middle" dominant-baseline="central">W_Q  layer 1</text></g><g class="m"><rect x="334" y="84" width="124" height="30" rx="4"/><text class="sub" x="396.0" y="99.0" text-anchor="middle" dominant-baseline="central">W_K  layer 1</text></g><g class="m"><rect x="468" y="84" width="124" height="30" rx="4"/><text class="sub" x="530.0" y="99.0" text-anchor="middle" dominant-baseline="central">W_V  layer 1</text></g><g class="u"><rect x="40" y="140" width="600" height="58" rx="14"/><text class="lbl" x="62" y="174">layer 2</text></g><g class="m"><rect x="200" y="154" width="124" height="30" rx="4"/><text class="sub" x="262.0" y="169.0" text-anchor="middle" dominant-baseline="central">W_Q  layer 2</text></g><g class="m"><rect x="334" y="154" width="124" height="30" rx="4"/><text class="sub" x="396.0" y="169.0" text-anchor="middle" dominant-baseline="central">W_K  layer 2</text></g><g class="m"><rect x="468" y="154" width="124" height="30" rx="4"/><text class="sub" x="530.0" y="169.0" text-anchor="middle" dominant-baseline="central">W_V  layer 2</text></g><g class="u"><rect x="40" y="210" width="600" height="58" rx="14"/><text class="lbl" x="62" y="244">layer 3</text></g><g class="m"><rect x="200" y="224" width="124" height="30" rx="4"/><text class="sub" x="262.0" y="239.0" text-anchor="middle" dominant-baseline="central">W_Q  layer 3</text></g><g class="m"><rect x="334" y="224" width="124" height="30" rx="4"/><text class="sub" x="396.0" y="239.0" text-anchor="middle" dominant-baseline="central">W_K  layer 3</text></g><g class="m"><rect x="468" y="224" width="124" height="30" rx="4"/><text class="sub" x="530.0" y="239.0" text-anchor="middle" dominant-baseline="central">W_V  layer 3</text></g><g class="u"><rect x="40" y="280" width="600" height="58" rx="14"/><text class="lbl" x="62" y="314">layer 4</text></g><g class="m"><rect x="200" y="294" width="124" height="30" rx="4"/><text class="sub" x="262.0" y="309.0" text-anchor="middle" dominant-baseline="central">W_Q  layer 4</text></g><g class="m"><rect x="334" y="294" width="124" height="30" rx="4"/><text class="sub" x="396.0" y="309.0" text-anchor="middle" dominant-baseline="central">W_K  layer 4</text></g><g class="m"><rect x="468" y="294" width="124" height="30" rx="4"/><text class="sub" x="530.0" y="309.0" text-anchor="middle" dominant-baseline="central">W_V  layer 4</text></g><text class="cap" x="40" y="368" text-anchor="start">Eighty layers means eighty separate W_Q matrices, eighty W_K and eighty W_V, all learned</text><text class="cap" x="40" y="388" text-anchor="start">independently during training and all different from one another.</text><text class="cap" x="40" y="424" text-anchor="start">So the multiplication happens eighty times per token, not once, each time against a different</text><text class="cap" x="40" y="444" text-anchor="start">matrix and a different input.</text><text class="cap" x="40" y="480" text-anchor="start">They are not shared and they are not reused. Layer 40's W_K has nothing to do with layer 39's.</text></svg><figcaption>The correction, and the reason the earlier figures said above the first layer rather than after the embedding.</figcaption></figure>
