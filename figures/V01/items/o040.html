<figure><div class='ts'>Fig 40 &nbsp;&middot;&nbsp; 25:43</div><h3>Where the dependence actually enters</h3><svg viewBox='0 0 680 384' role='img'><title>Where the dependence actually enters</title><text class="hd" x="40" y="46">The same fixed matrix, a different vector going into it</text><text class="cap" x="40" y="92" text-anchor="start">layer 1</text><g class="s"><rect x="200" y="76" width="180" height="32" rx="4"/><text class="sub" x="290.0" y="92.0" text-anchor="middle" dominant-baseline="central">embedding + position</text></g><line class="conn" x1="390" y1="92" x2="414" y2="92" marker-end="url(#arw)"/><g class="m"><rect x="420" y="76" width="90" height="32" rx="4"/><text class="sub" x="465.0" y="92.0" text-anchor="middle" dominant-baseline="central">W_K</text></g><line class="conn" x1="516" y1="92" x2="540" y2="92" marker-end="url(#arw)"/><g class="s"><rect x="546" y="76" width="94" height="32" rx="4"/><text class="sub" x="593.0" y="92.0" text-anchor="middle" dominant-baseline="central">key</text></g><text class="cap" x="40" y="152" text-anchor="start">layer 2</text><g class="h"><rect x="200" y="136" width="180" height="32" rx="4"/><text class="sub" x="290.0" y="152.0" text-anchor="middle" dominant-baseline="central">layer 1's output here</text></g><line class="conn" x1="390" y1="152" x2="414" y2="152" marker-end="url(#arw)"/><g class="m"><rect x="420" y="136" width="90" height="32" rx="4"/><text class="sub" x="465.0" y="152.0" text-anchor="middle" dominant-baseline="central">W_K</text></g><line class="conn" x1="516" y1="152" x2="540" y2="152" marker-end="url(#arw)"/><g class="h"><rect x="546" y="136" width="94" height="32" rx="4"/><text class="sub" x="593.0" y="152.0" text-anchor="middle" dominant-baseline="central">key</text></g><text class="cap" x="40" y="214" text-anchor="start">W_K is the same matrix in both rows. The vector it multiplies is not.</text><text class="cap" x="40" y="250" text-anchor="start">By layer 2 the input already contains information from tokens 1 to 5, so the key it produces</text><text class="cap" x="40" y="270" text-anchor="start">does too. And layer 3's input contains layer 2's mixing, and so on.</text><text class="cap" x="40" y="306" text-anchor="start">Across 80 layers, position 5's representation is blended with the earlier positions 80 times</text><text class="cap" x="40" y="326" text-anchor="start">over. By the top it is thoroughly contextual.</text><text class="cap" x="40" y="362" text-anchor="start">The dependence enters through the residual stream, never through the weights.</text></svg><figcaption>The precise answer to the objection. Fixed function, changing input. The weights never learn anything about your sentence; the vector arriving at them already knows.</figcaption></figure>
