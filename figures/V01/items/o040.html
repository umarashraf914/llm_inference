<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 25:43</div><h3>Where the dependence actually enters</h3><svg viewBox='0 0 680 500' role='img'><title>Where the dependence actually enters</title><text class="hd" x="40" y="46">Token 5's key at one layer, in two sentences that differ at token 2</text><text class="cap" x="40" y="90" text-anchor="start">layer 1, sentence A</text><g class="s"><rect x="196" y="70" width="170" height="30" rx="3"/><text class="sub" x="281.0" y="85.0" text-anchor="middle" dominant-baseline="central">token 5 + position 5</text></g><line class="conn" x1="370" y1="85" x2="390" y2="85" marker-end="url(#arw)"/><g class="m"><rect x="396" y="70" width="112" height="30" rx="3"/><text class="sub" x="452.0" y="85.0" text-anchor="middle" dominant-baseline="central">layer 1's W_K</text></g><line class="conn" x1="512" y1="85" x2="532" y2="85" marker-end="url(#arw)"/><g class="s"><rect x="538" y="70" width="102" height="30" rx="3"/><text class="sub" x="589.0" y="85.0" text-anchor="middle" dominant-baseline="central">key</text></g><text class="cap" x="40" y="128" text-anchor="start">layer 1, sentence B</text><g class="s"><rect x="196" y="108" width="170" height="30" rx="3"/><text class="sub" x="281.0" y="123.0" text-anchor="middle" dominant-baseline="central">token 5 + position 5</text></g><line class="conn" x1="370" y1="123" x2="390" y2="123" marker-end="url(#arw)"/><g class="m"><rect x="396" y="108" width="112" height="30" rx="3"/><text class="sub" x="452.0" y="123.0" text-anchor="middle" dominant-baseline="central">layer 1's W_K</text></g><line class="conn" x1="512" y1="123" x2="532" y2="123" marker-end="url(#arw)"/><g class="s"><rect x="538" y="108" width="102" height="30" rx="3"/><text class="sub" x="589.0" y="123.0" text-anchor="middle" dominant-baseline="central">identical</text></g><text class="cap" x="40" y="188" text-anchor="start">layer 2, sentence A</text><g class="h"><rect x="196" y="168" width="170" height="30" rx="3"/><text class="sub" x="281.0" y="183.0" text-anchor="middle" dominant-baseline="central">stream at position 5</text></g><line class="conn" x1="370" y1="183" x2="390" y2="183" marker-end="url(#arw)"/><g class="m"><rect x="396" y="168" width="112" height="30" rx="3"/><text class="sub" x="452.0" y="183.0" text-anchor="middle" dominant-baseline="central">layer 2's W_K</text></g><line class="conn" x1="512" y1="183" x2="532" y2="183" marker-end="url(#arw)"/><g class="h"><rect x="538" y="168" width="102" height="30" rx="3"/><text class="sub" x="589.0" y="183.0" text-anchor="middle" dominant-baseline="central">key</text></g><text class="cap" x="40" y="226" text-anchor="start">layer 2, sentence B</text><g class="h"><rect x="196" y="206" width="170" height="30" rx="3"/><text class="sub" x="281.0" y="221.0" text-anchor="middle" dominant-baseline="central">stream at position 5</text></g><line class="conn" x1="370" y1="221" x2="390" y2="221" marker-end="url(#arw)"/><g class="m"><rect x="396" y="206" width="112" height="30" rx="3"/><text class="sub" x="452.0" y="221.0" text-anchor="middle" dominant-baseline="central">layer 2's W_K</text></g><line class="conn" x1="512" y1="221" x2="532" y2="221" marker-end="url(#arw)"/><g class="h"><rect x="538" y="206" width="102" height="30" rx="3"/><text class="sub" x="589.0" y="221.0" text-anchor="middle" dominant-baseline="central">different</text></g><text class="cap" x="40" y="278" text-anchor="start">Within one layer, W_K is the same matrix for both sentences. At layer 1 the vector it</text><text class="cap" x="40" y="298" text-anchor="start">multiplies is the same too, so the two keys are identical. At layer 2 that vector has</text><text class="cap" x="40" y="318" text-anchor="start">been through layer 1, whose attention blended token 2 into position 5</text><text class="cap" x="40" y="338" text-anchor="start">({{fig:v01-o039}}), so the keys differ.</text><text class="cap" x="40" y="378" text-anchor="start">Layer 3's input carries layer 2's mixing, and so on up: across 80 layers, position 5's</text><text class="cap" x="40" y="398" text-anchor="start">vector is blended with the earlier positions 80 times over.</text><text class="cap" x="40" y="438" text-anchor="start">It is the fact that put the factor of 80 into the cache's size ({{fig:v01-o138}}), seen</text><text class="cap" x="40" y="458" text-anchor="start">across sentences instead of across layers. The dependence enters through the residual</text><text class="cap" x="40" y="478" text-anchor="start">stream ({{fig:v01-p19}}), never through the weights.</text></svg><figcaption>Fixed function, changing input. The weights never learn anything about the sentence; the vector arriving at them already carries it.</figcaption></figure>
