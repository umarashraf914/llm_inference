<figure><div class='ts'>Fig 79 &nbsp;&middot;&nbsp; 4:36</div><h3>Why memory is a separate chip</h3><svg viewBox='0 0 680 350' role='img'><title>Why memory is a separate chip</title><text class="hd" x="40" y="46">Why the memory is not on the chip</text><g class="m"><rect x="40" y="70" width="190" height="78" rx="8"/><text class="lbl" x="135.0" y="92.0" text-anchor="middle" dominant-baseline="central">Fast logic</text><text class="sub" x="135.0" y="110.0" text-anchor="middle" dominant-baseline="central">needs one kind of</text><text class="sub" x="135.0" y="127.0" text-anchor="middle" dominant-baseline="central">silicon process</text></g><g class="h"><rect x="246" y="70" width="190" height="78" rx="8"/><text class="lbl" x="341.0" y="100.0" text-anchor="middle" dominant-baseline="central">Dense storage</text><text class="sub" x="341.0" y="118.0" text-anchor="middle" dominant-baseline="central">needs a different one</text></g><g class="u"><rect x="452" y="70" width="188" height="78" rx="8"/><text class="lbl" x="546.0" y="92.0" text-anchor="middle" dominant-baseline="central">Nobody has made</text><text class="sub" x="546.0" y="110.0" text-anchor="middle" dominant-baseline="central">both work well on</text><text class="sub" x="546.0" y="127.0" text-anchor="middle" dominant-baseline="central">one piece of silicon</text></g><text class="cap" x="40" y="196" text-anchor="start">A chip is optimised for one job. The process that makes fast switching transistors is not the</text><text class="cap" x="40" y="216" text-anchor="start">process that packs the most storage into the least area.</text><text class="cap" x="40" y="252" text-anchor="start">There is also simply not enough room. A hundred and forty gigabytes of storage will not fit</text><text class="cap" x="40" y="272" text-anchor="start">on a piece of silicon the size of a postage stamp, at any price.</text><text class="cap" x="40" y="308" text-anchor="start">So the memory sits on separate chips, as close as physically possible, joined by the widest</text><text class="cap" x="40" y="328" text-anchor="start">bus that can be built. Close is not the same as on, and the difference is the memory wall.</text></svg><figcaption>The wall is not a design oversight anybody could have avoided. It follows from what silicon can and cannot do.</figcaption></figure>
