y="124" text-anchor="start">a key and a value at every one of the eighty</text><text class="cap" x="40" y="174" text-anchor="start">per layer, per token</text><g class="u"><rect x="300" y="158" width="50" height="30" rx="3"/><text class="sub" x="325.0" y="173.0" text-anchor="middle" dominant-baseline="central">4 KB</text></g><text class="cap" x="40" y="234" text-anchor="start">x 80 layers</text><g class="h"><rect x="300" y="218" width="320" height="30" rx="3"/><text class="sub" x="460.0" y="233.0" text-anchor="middle" dominant-baseline="central">320 KB for one token</text></g><text class="cap" x="40" y="296" text-anchor="start">That is the number the rest of this video uses. It is large because of the eighty, and the</text><text class="cap" x="40" y="316" text-anchor="start">eighty is there because each layer works on a different representation of the same token.</text><text class="cap" x="40" y="352" text-anchor="start">Cutting KV heads from 64 to 8 cuts it eightfold, which is what grouped-query attention does.</text><text class="cap" x="40" y="372" text-anchor="start">Nothing cuts the number of layers, because that is the model.</text><text class="cap" x="40" y="408" text-anchor="start">So every technique that shrinks this cache attacks one of the other terms in that formula.</text></svg><figcaption>The 320 kilobytes decomposed. Knowing which term each later technique attacks makes the rest of the series much easier to follow.</figcaption></figure>
