<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 24:03</div><h3>Eighty keys and eighty values, per token</h3><svg viewBox='0 0 680 390' role='img'><title>Eighty keys and eighty values, per token</title><text class="hd" x="40" y="46">One token, eighty layers deep: a key and a value kept at every one</text><g class="s"><rect x="60" y="64" width="46" height="26" rx="3"/><text class="sub" x="83.0" y="77.0" text-anchor="middle" dominant-baseline="central">L1</text></g><g class="s"><rect x="112" y="64" width="46" height="26" rx="3"/><text class="sub" x="135.0" y="77.0" text-anchor="middle" dominant-baseline="central">L2</text></g><g class="s"><rect x="164" y="64" width="46" height="26" rx="3"/><text class="sub" x="187.0" y="77.0" text-anchor="middle" dominant-baseline="central">L3</text></g><g class="s"><rect x="216" y="64" width="46" height="26" rx="3"/><text class="sub" x="239.0" y="77.0" text-anchor="middle" dominant-baseline="central">L4</text></g><g class="s"><rect x="268" y="64" width="46" height="26" rx="3"/><text class="sub" x="291.0" y="77.0" text-anchor="middle" dominant-baseline="central">L5</text></g><g class="s"><rect x="320" y="64" width="46" height="26" rx="3"/><text class="sub" x="343.0" y="77.0" text-anchor="middle" dominant-baseline="central">L6</text></g><g class="s"><rect x="372" y="64" width="46" height="26" rx="3"/><text class="sub" x="395.0" y="77.0" text-anchor="middle" dominant-baseline="central">L7</text></g><g class="s"><rect x="424" y="64" width="46" height="26" rx="3"/><text class="sub" x="447.0" y="77.0" text-anchor="middle" dominant-baseline="central">L8</text></g><g class="s"><rect x="476" y="64" width="46" height="26" rx="3"/><text class="sub" x="499.0" y="77.0" text-anchor="middle" dominant-baseline="central">L9</text></g><g class="s"><rect x="528" y="64" width="46" height="26" rx="3"/><text class="sub" x="551.0" y="77.0" text-anchor="middle" dominant-baseline="central">L10</text></g><text class="sub2" x="586" y="82" text-anchor="start">… L80</text><text class="cap" x="40" y="135" text-anchor="start">per layer, per token</text><g class="u"><rect x="220" y="116" width="420" height="28" rx="3"/><text class="sub" x="430.0" y="130.0" text-anchor="middle" dominant-baseline="central">a key and a value: 2 × 8 heads × 128 = 2,048 numbers</text></g><text class="cap" x="40" y="175" text-anchor="start">× 80 layers</text><g class="h"><rect x="220" y="156" width="420" height="28" rx="3"/><text class="sub" x="430.0" y="170.0" text-anchor="middle" dominant-baseline="central">163,840 numbers kept for one token</text></g><text class="cap" x="40" y="224" text-anchor="start">Each layer computes a key and a value for every token from its own input</text><text class="cap" x="40" y="244" text-anchor="start">({{fig:v01-o098}}), and every one is kept. With eight key-value heads of 128 numbers</text><text class="cap" x="40" y="264" text-anchor="start">({{fig:v01-p29}}), that is 2,048 numbers per layer per token, and 163,840 across the</text><text class="cap" x="40" y="284" text-anchor="start">eighty layers.</text><text class="cap" x="40" y="324" text-anchor="start">If every query head had its own key and value head, it would be eight times as many</text><text class="cap" x="40" y="344" text-anchor="start">({{fig:v01-p29}}). The techniques in this series leave the number of layers alone, so</text><text class="cap" x="40" y="364" text-anchor="start">every way of shrinking the cache attacks one of the other factors.</text></svg><figcaption>Counted in numbers first, bytes next. The eighty is the factor nobody in this series can touch, which is why the others get so much attention.</figcaption></figure>
