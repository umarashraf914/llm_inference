<figure><div class='ts'>Fig 12 &nbsp;&middot;&nbsp; 0:00</div><h3>Where the file actually lives</h3><svg viewBox='0 0 680 414' role='img'><title>Where the file actually lives</title><text class="hd" x="40" y="46">The same file, in three places</text><g class="u"><rect x="40" y="70" width="600" height="40" rx="4"/><text class="sub" x="340.0" y="90.0" text-anchor="middle" dominant-baseline="central">A disk</text></g><text class="sub2" x="40" y="126" text-anchor="start">where the file is kept between runs</text><g class="h"><rect x="40" y="132" width="380" height="40" rx="4"/><text class="sub" x="230.0" y="152.0" text-anchor="middle" dominant-baseline="central">Memory beside the chip</text></g><text class="sub2" x="40" y="188" text-anchor="start">where it sits while the service runs</text><g class="s"><rect x="40" y="194" width="60" height="40" rx="4"/></g><text class="cap" x="112" y="219" text-anchor="start">The chip itself</text><text class="sub2" x="40" y="250" text-anchor="start">holds a few hundred kilobytes at a time</text><text class="cap" x="40" y="296" text-anchor="start">Bars are roughly to scale for capacity. The disk holds far more than it needs to; the memory</text><text class="cap" x="40" y="316" text-anchor="start">holds exactly the model; the chip holds almost nothing.</text><text class="cap" x="40" y="352" text-anchor="start">Reading all 140 gigabytes off a disk takes many seconds. From the memory beside the chip it</text><text class="cap" x="40" y="372" text-anchor="start">takes tens of milliseconds. That is why the model is loaded once at start-up and then left</text><text class="cap" x="40" y="392" text-anchor="start">there for as long as the service runs.</text></svg><figcaption>Three tiers, and the middle one is where this whole series takes place. The disk appears once, at start-up, and is never mentioned again.</figcaption></figure>
