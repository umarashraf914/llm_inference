<figure><div class='ts'>Fig 13 &nbsp;&middot;&nbsp; 0:00</div><h3>Loading happens once</h3><svg viewBox='0 0 680 290' role='img'><title>Loading happens once</title><text class="hd" x="40" y="46">Once at start-up, then never again</text><g class="h"><rect x="40" y="70" width="200" height="40" rx="4"/><text class="sub" x="140.0" y="90.0" text-anchor="middle" dominant-baseline="central">load: many seconds</text></g><line class="conn" x1="246" y1="90" x2="266" y2="90" marker-end="url(#arw)"/><g class="s"><rect x="272" y="70" width="368" height="40" rx="4"/><text class="sub" x="456.0" y="90.0" text-anchor="middle" dominant-baseline="central">serve: milliseconds per token, for hours</text></g><text class="cap" x="40" y="156" text-anchor="start">The loading cost is real but it is paid once. A server that has been up for a day has paid it</text><text class="cap" x="40" y="176" text-anchor="start">once and answered millions of tokens.</text><text class="cap" x="40" y="212" text-anchor="start">This is the first example of a pattern that runs through the whole series: a fixed cost stops</text><text class="cap" x="40" y="232" text-anchor="start">mattering once it is spread over enough work.</text><text class="cap" x="40" y="268" text-anchor="start">The rest of the series is about a cost that refuses to spread that way.</text></svg><figcaption>Introduces amortisation gently, on a cost where it obviously works, before meeting the cost where it obviously does not.</figcaption></figure>
