<figure><div class='ts'>Fig 15 &nbsp;&middot;&nbsp; 0:00</div><h3>One token, every 30 milliseconds</h3><svg viewBox="0 0 680 210" role="img"><title>One token, every 30 milliseconds</title><g class="u"><rect x="40" y="55" width="265" height="66" rx="8"></rect><text class="lbl" x="172.5" y="79.0" text-anchor="middle" dominant-baseline="central">A trained checkpoint</text><text class="sub" x="172.5" y="97.0" text-anchor="middle" dominant-baseline="central">weights on disk</text></g><line class="conn" x1="311" y1="88" x2="361" y2="88" marker-end="url(#arw)"></line><g class="s"><rect x="368" y="55" width="272" height="66" rx="8"></rect><text class="lbl" x="504.0" y="79.0" text-anchor="middle" dominant-baseline="central">A service that responds</text><text class="sub" x="504.0" y="97.0" text-anchor="middle" dominant-baseline="central">a token every 30 ms</text></g><text class="cap" x="40" y="168" text-anchor="start">Everything between those two boxes is inference. This atlas is about why each token</text><text class="cap" x="40" y="188" text-anchor="start">takes 30 milliseconds to cross that gap, and not something much smaller.</text></svg><figcaption>Training produces the weights. Inference is the discipline of turning them into something a user can actually talk to, at a price that works.</figcaption></figure>
