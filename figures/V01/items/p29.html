b" x="86.0" y="243.0" text-anchor="middle" dominant-baseline="central">50</text></g><g class="s"><rect x="104" y="232" width="28" height="22" rx="2"/><text class="sub" x="118.0" y="243.0" text-anchor="middle" dominant-baseline="central">51</text></g><g class="s"><rect x="136" y="232" width="28" height="22" rx="2"/><text class="sub" x="150.0" y="243.0" text-anchor="middle" dominant-baseline="central">52</text></g><g class="s"><rect x="168" y="232" width="28" height="22" rx="2"/><text class="sub" x="182.0" y="243.0" text-anchor="middle" dominant-baseline="central">53</text></g><g class="s"><rect x="200" y="232" width="28" height="22" rx="2"/><text class="sub" x="214.0" y="243.0" text-anchor="middle" dominant-baseline="central">54</text></g><g class="s"><rect x="232" y="232" width="28" height="22" rx="2"/><text class="sub" x="246.0" y="243.0" text-anchor="middle" dominant-baseline="central">55</text></g><g class="s"><rect x="264" y="232" width="28" height="22" rx="2"/><text class="sub" x="278.0" y="243.0" text-anchor="middle" dominant-baseline="central">56</text></g><line class="conn" x1="300" y1="243" x2="336" y2="243" marker-end="url(#arw)"/><g class="h"><rect x="342" y="232" width="100" height="22" rx="2"/><text class="sub" x="392.0" y="243.0" text-anchor="middle" dominant-baseline="central">KV head 7</text></g><g class="s"><rect x="40" y="260" width="28" height="22" rx="2"/><text class="sub" x="54.0" y="271.0" text-anchor="middle" dominant-baseline="central">57</text></g><g class="s"><rect x="72" y="260" width="28" height="22" rx="2"/><text class="sub" x="86.0" y="271.0" text-anchor="middle" dominant-baseline="central">58</text></g><g class="s"><rect x="104" y="260" width="28" height="22" rx="2"/><text class="sub" x="118.0" y="271.0" text-anchor="middle" dominant-baseline="central">59</text></g><g class="s"><rect x="136" y="260" width="28" height="22" rx="2"/><text class="sub" x="150.0" y="271.0" text-anchor="middle" dominant-baseline="central">60</text></g><g class="s"><rect x="168" y="260" width="28" height="22" rx="2"/><text class="sub" x="182.0" y="271.0" text-anchor="middle" dominant-baseline="central">61</text></g><g class="s"><rect x="200" y="260" width="28" height="22" rx="2"/><text class="sub" x="214.0" y="271.0" text-anchor="middle" dominant-baseline="central">62</text></g><g class="s"><rect x="232" y="260" width="28" height="22" rx="2"/><text class="sub" x="246.0" y="271.0" text-anchor="middle" dominant-baseline="central">63</text></g><g class="s"><rect x="264" y="260" width="28" height="22" rx="2"/><text class="sub" x="278.0" y="271.0" text-anchor="middle" dominant-baseline="central">64</text></g><line class="conn" x1="300" y1="271" x2="336" y2="271" marker-end="url(#arw)"/><g class="h"><rect x="342" y="260" width="100" height="22" rx="2"/><text class="sub" x="392.0" y="271.0" text-anchor="middle" dominant-baseline="central">KV head 8</text></g><text class="sub2" x="452" y="90" text-anchor="start">64 query heads in 8 groups</text><text class="sub2" x="452" y="110" text-anchor="start">8 key heads, 8 value heads</text><text class="sub2" x="452" y="130" text-anchor="start">K and V: 8 × 128 = 1,024 wide</text><text class="hd" x="40" y="318">Attention weights in one layer, to scale</text><text class="cap" x="40" y="355" text-anchor="start">every head its own K and V</text><g class="u"><rect x="250" y="336" width="280.0" height="28" rx="3"/></g><text class="sub2" x="540.0" y="355" text-anchor="start">268.4 million</text><text class="cap" x="40" y="395" text-anchor="start">8 shared key and value heads</text><g class="s"><rect x="250" y="376" width="157.5" height="28" rx="3"/></g><text class="sub2" x="417.5" y="395" text-anchor="start">151.0 million</text><text class="cap" x="40" y="448" text-anchor="start">Each group of eight query heads computes its scores against the same keys and blends the</text><text class="cap" x="40" y="468" text-anchor="start">same values; only the queries differ. This is grouped-query attention, GQA. The model</text><text class="cap" x="40" y="488" text-anchor="start">this atlas follows has 64 query heads and 8 key-value (KV) heads.</text><text class="cap" x="40" y="528" text-anchor="start">So the key and value vectors need only 8 heads × 128 = 1,024 numbers each, against 8,192</text><text class="cap" x="40" y="548" text-anchor="start">for the query, and W_K and W_V are an eighth the size of W_Q. A layer's four attention</text><text class="cap" x="40" y="568" text-anchor="start">matrices hold 151.0 million weights instead of 268.4 million: the 151.0 of {{fig:v01-o101}}.</text><text class="cap" x="40" y="608" text-anchor="start">The weights are the small saving. Part 11 shows the large one: every token leaves its</text><text class="cap" x="40" y="628" text-anchor="start">keys and values behind, and with eight key-value heads there is an eighth as much to</text><text class="cap" x="40" y="648" text-anchor="start">keep.</text></svg><figcaption>The model is trained this way from the start, so sharing is not an approximation added at serving time. It is a design choice made for inference, and its payoff arrives in Part 11.</figcaption></figure>
