<figure><div class='ts'>Fig 83 &nbsp;&middot;&nbsp; 6:07</div><h3>The asymmetry everything else assumes</h3><svg viewBox="0 0 680 210" role="img"><title>The asymmetry everything else assumes</title><g class="m"><rect x="50" y="55" width="265" height="66" rx="8"></rect><text class="lbl" x="182.5" y="79.0" text-anchor="middle" dominant-baseline="central">Arithmetic</text><text class="sub" x="182.5" y="97.0" text-anchor="middle" dominant-baseline="central">cheap</text></g><g class="h"><rect x="365" y="55" width="265" height="66" rx="8"></rect><text class="lbl" x="497.5" y="79.0" text-anchor="middle" dominant-baseline="central">Data movement</text><text class="sub" x="497.5" y="97.0" text-anchor="middle" dominant-baseline="central">expensive</text></g><text class="cap" x="40" y="162" text-anchor="start">Every architectural decision in production inference, and every paper in this series, takes</text><text class="cap" x="40" y="182" text-anchor="start">this sentence as given.</text></svg><figcaption>If one line from this atlas is worth remembering, it is this one. The rest is working out what it implies.</figcaption></figure>
