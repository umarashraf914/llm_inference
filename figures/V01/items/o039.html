<figure><div class='ts'>Fig 39 &nbsp;&middot;&nbsp; 0:46</div><h3>Attention mixes the earlier tokens in</h3><svg viewBox='0 0 680 390' role='img'><title>Attention mixes the earlier tokens in</title><text class="hd" x="40" y="46">What layer 1 hands upward at position 5</text><g class="s"><rect x="60" y="74" width="74" height="32" rx="3"/><text class="sub" x="97.0" y="90.0" text-anchor="middle" dominant-baseline="central">t1</text></g><g class="s"><rect x="144" y="74" width="74" height="32" rx="3"/><text class="sub" x="181.0" y="90.0" text-anchor="middle" dominant-baseline="central">t2</text></g><g class="s"><rect x="228" y="74" width="74" height="32" rx="3"/><text class="sub" x="265.0" y="90.0" text-anchor="middle" dominant-baseline="central">t3</text></g><g class="s"><rect x="312" y="74" width="74" height="32" rx="3"/><text class="sub" x="349.0" y="90.0" text-anchor="middle" dominant-baseline="central">t4</text></g><g class="m"><rect x="396" y="74" width="74" height="32" rx="3"/><text class="sub" x="433.0" y="90.0" text-anchor="middle" dominant-baseline="central">t5</text></g><line class="conn" x1="96" y1="112" x2="300" y2="148" marker-end="url(#arw)"/><line class="conn" x1="180" y1="112" x2="310" y2="148" marker-end="url(#arw)"/><line class="conn" x1="264" y1="112" x2="320" y2="148" marker-end="url(#arw)"/><line class="conn" x1="348" y1="112" x2="330" y2="148" marker-end="url(#arw)"/><line class="conn" x1="432" y1="112" x2="340" y2="148" marker-end="url(#arw)"/><g class="u"><rect x="240" y="152" width="200" height="40" rx="5"/><text class="sub" x="340.0" y="172.0" text-anchor="middle" dominant-baseline="central">a weighted blend of all five</text></g><text class="cap" x="40" y="236" text-anchor="start">Attention at position 5 produces a weighted average over positions 1 to 5. That blend is added</text><text class="cap" x="40" y="256" text-anchor="start">back into the representation at position 5.</text><text class="cap" x="40" y="292" text-anchor="start">So what comes out of layer 1 at position 5 is no longer a function of token 5 alone. It now</text><text class="cap" x="40" y="312" text-anchor="start">carries something of every token before it.</text><text class="cap" x="40" y="348" text-anchor="start">That is not a side effect. It is the entire purpose of the layer: to make each position's</text><text class="cap" x="40" y="368" text-anchor="start">representation reflect its context.</text></svg><figcaption>The step that breaks the independence, and the step the model exists to perform. You cannot have contextual representations and context-free keys at the same time.</figcaption></figure>
