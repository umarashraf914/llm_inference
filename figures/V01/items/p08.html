<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:30</div><h3>989 trillion is arithmetic units × operations per tick × ticks per second</h3><svg viewBox='0 0 680 610' role='img'><title>989 trillion is arithmetic units × operations per tick × ticks per second</title><text class="hd" x="40" y="46">Peak arithmetic is three numbers multiplied</text><g class="u"><rect x="40" y="70" width="150" height="36" rx="5"/><text class="sub" x="115.0" y="88.0" text-anchor="middle" dominant-baseline="central">528 tensor cores</text></g><text class="sub2" x="115.0" y="124" text-anchor="middle">132 multiprocessors × 4</text><text class="hd" x="196" y="93" text-anchor="start">×</text><g class="m"><rect x="212" y="70" width="160" height="36" rx="5"/><text class="sub" x="292.0" y="88.0" text-anchor="middle" dominant-baseline="central">1,024 operations a tick</text></g><text class="sub2" x="292.0" y="124" text-anchor="middle">512 multiply-adds each</text><text class="hd" x="378" y="93" text-anchor="start">×</text><g class="u"><rect x="394" y="70" width="196" height="36" rx="5"/><text class="sub" x="492.0" y="88.0" text-anchor="middle" dominant-baseline="central">1.83 billion ticks a second</text></g><text class="sub2" x="492.0" y="124" text-anchor="middle">the clock, 1.83 GHz</text><text class="hd" x="340" y="160" text-anchor="start">=</text><g class="m"><rect x="170" y="172" width="340" height="36" rx="5"/><text class="sub" x="340.0" y="190.0" text-anchor="middle" dominant-baseline="central">989 trillion operations a second</text></g><text class="sub2" x="340" y="226" text-anchor="middle">the 989 on the specification sheet</text><text class="hd" x="40" y="268">Where the units come from: transistors</text><g class="u"><rect x="40" y="286" width="200" height="36" rx="5"/><text class="sub" x="140.0" y="304.0" text-anchor="middle" dominant-baseline="central">80 billion transistors</text></g><text class="sub2" x="252" y="309" text-anchor="start">on</text><g class="u"><rect x="276" y="286" width="160" height="36" rx="5"/><text class="sub" x="356.0" y="304.0" text-anchor="middle" dominant-baseline="central">814 mm² of silicon</text></g><text class="sub2" x="40" y="344" text-anchor="start">on average, each transistor gets a square of silicon about 100 nanometres on a side</text><text class="cap" x="40" y="384" text-anchor="start">A tensor core is a block of circuitry that does nothing but multiply small grids of</text><text class="cap" x="40" y="404" text-anchor="start">numbers. Each of the H100's 528 completes 512 multiply-adds every tick of the chip's</text><text class="cap" x="40" y="424" text-anchor="start">clock, and a multiply-add counts as two operations ({{fig:v01-o111}}).</text><text class="cap" x="40" y="464" text-anchor="start">A tick is one beat of the clock that paces every circuit on the chip. NVIDIA publishes</text><text class="cap" x="40" y="484" text-anchor="start">the core count and the per-core rate (twice the previous generation's, tick for tick);</text><text class="cap" x="40" y="504" text-anchor="start">the 1.83 billion ticks a second is what the 989 trillion then implies.</text><text class="cap" x="40" y="544" text-anchor="start">Every one of those circuits is built from transistors, microscopic electrical switches.</text><text class="cap" x="40" y="564" text-anchor="start">Fitting more of them into the same area fits more arithmetic units on the chip, which is</text><text class="cap" x="40" y="584" text-anchor="start">why compute grows with transistor density.</text></svg><figcaption>From the A100 to the H100, NVIDIA's own tables give 1.22 times the cores, twice the work per core per tick and 1.30 times the clock: 3.2 times in all. The counts of circuits did most of it, and transistors are what they are made of.</figcaption></figure>
