rk as multiplying</text><text class="cap" x="40" y="446" text-anchor="start">matrices, so the hardware built for one was already right for the other.</text><text class="cap" x="40" y="482" text-anchor="start">It is a poor choice for anything with a chain of dependencies, which is exactly the weakness</text><text class="cap" x="40" y="502" text-anchor="start">that shows up in decode later in this video.</text></svg><figcaption>Not chosen for cleverness. Chosen because the workload is a vast number of identical, independent multiplications, which is the only thing this shape of chip is good at.</figcaption></figure>
