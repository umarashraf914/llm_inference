<figure><div class='ts'>Fig 02 &nbsp;&middot;&nbsp; 0:00</div><h3>Two phases of a model's life</h3><svg viewBox='0 0 680 324' role='img'><title>Two phases of a model's life</title><g class="m"><rect x="50" y="55" width="265" height="82" rx="8"/><text class="lbl" x="182.5" y="79.0" text-anchor="middle" dominant-baseline="central">Training</text><text class="sub" x="182.5" y="97.0" text-anchor="middle" dominant-baseline="central">months, thousands of chips,</text><text class="sub" x="182.5" y="114.0" text-anchor="middle" dominant-baseline="central">done once</text></g><line class="conn" x1="321" y1="96" x2="359" y2="96" marker-end="url(#arw)"/><g class="s"><rect x="365" y="55" width="265" height="82" rx="8"/><text class="lbl" x="497.5" y="79.0" text-anchor="middle" dominant-baseline="central">Inference</text><text class="sub" x="497.5" y="97.0" text-anchor="middle" dominant-baseline="central">milliseconds, one chip or a few,</text><text class="sub" x="497.5" y="114.0" text-anchor="middle" dominant-baseline="central">done every time anyone asks</text></g><text class="cap" x="40" y="190" text-anchor="start">Training is the search for the seventy billion numbers. It reads an enormous amount of text and</text><text class="cap" x="40" y="210" text-anchor="start">adjusts them until the model predicts well.</text><text class="cap" x="40" y="246" text-anchor="start">Inference is using those numbers. They never change again. Every answer the model ever gives</text><text class="cap" x="40" y="266" text-anchor="start">comes from the same fixed list.</text><text class="cap" x="40" y="302" text-anchor="start">This entire series is about the second box. The first is finished before anything here begins.</text></svg><figcaption>Worth separating at the outset, because almost every confusing claim about cost or speed turns out to be about the wrong one of these two.</figcaption></figure>
