<figure><div class='ts'>Fig 92 &nbsp;&middot;&nbsp; 7:15</div><h3>Attention: query, key, value</h3><svg viewBox="0 0 680 270" role="img"><title>Attention: query, key, value</title><g class="s"><rect x="50" y="55" width="175" height="74" rx="8"></rect><text class="lbl" x="137.5" y="75.0" text-anchor="middle" dominant-baseline="central">Query</text><text class="sub" x="137.5" y="93.0" text-anchor="middle" dominant-baseline="central">what this token</text><text class="sub" x="137.5" y="110.0" text-anchor="middle" dominant-baseline="central">is looking for</text></g><g class="s"><rect x="252" y="55" width="175" height="74" rx="8"></rect><text class="lbl" x="339.5" y="75.0" text-anchor="middle" dominant-baseline="central">Key</text><text class="sub" x="339.5" y="93.0" text-anchor="middle" dominant-baseline="central">what it can offer</text><text class="sub" x="339.5" y="110.0" text-anchor="middle" dominant-baseline="central">to other tokens</text></g><g class="s"><rect x="454" y="55" width="186" height="74" rx="8"></rect><text class="lbl" x="547.0" y="75.0" text-anchor="middle" dominant-baseline="central">Value</text><text class="sub" x="547.0" y="93.0" text-anchor="middle" dominant-baseline="central">what it contributes</text><text class="sub" x="547.0" y="110.0" text-anchor="middle" dominant-baseline="central">when matched</text></g><text class="cap" x="40" y="168" text-anchor="start">Each token's vector is projected into three separate vectors. Every query is then compared</text><text class="cap" x="40" y="188" text-anchor="start">against every key, producing a matrix of similarity scores.</text><text class="cap" x="40" y="228" text-anchor="start">Those scores are used to blend the values into an updated vector for each position. That is</text><text class="cap" x="40" y="248" text-anchor="start">how context from one token reaches another.</text></svg><figcaption>Three roles from one vector. The matrix of scores in the middle is small here and becomes the central object of the third video.</figcaption></figure>
