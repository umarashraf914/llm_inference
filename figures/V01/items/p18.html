<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:17</div><h3>Llama's feed-forward block has three matrices, and one of them is a gate</h3><svg viewBox='0 0 680 702' role='img'><title>Llama's feed-forward block has three matrices, and one of them is a gate</title><text class="hd" x="40" y="46">Two matrices side by side, a bend on one, a multiply, then a third</text><g class="s"><rect x="40" y="96" width="120" height="34" rx="4"/><text class="sub" x="100.0" y="113.0" text-anchor="middle" dominant-baseline="central">token's vector</text></g><text class="sub2" x="100" y="146" text-anchor="middle">8,192 numbers</text><line class="conn" x1="162" y1="104" x2="196" y2="82" marker-end="url(#arw)"/><line class="conn" x1="162" y1="122" x2="196" y2="144" marker-end="url(#arw)"/><g class="m"><rect x="200" y="64" width="150" height="34" rx="4"/><text class="sub" x="275.0" y="81.0" text-anchor="middle" dominant-baseline="central">× gate: 28,672 rows</text></g><g class="m"><rect x="200" y="128" width="150" height="34" rx="4"/><text class="sub" x="275.0" y="145.0" text-anchor="middle" dominant-baseline="central">× up: 28,672 rows</text></g><line class="conn" x1="352" y1="81" x2="380" y2="81" marker-end="url(#arw)"/><g class="u"><rect x="384" y="64" width="70" height="34" rx="4"/><text class="sub" x="419.0" y="81.0" text-anchor="middle" dominant-baseline="central">SiLU</text></g><line class="conn" x1="456" y1="81" x2="480" y2="100" marker-end="url(#arw)"/><line class="conn" x1="352" y1="145" x2="480" y2="122" marker-end="url(#arw)"/><g class="u"><rect x="484" y="94" width="40" height="34" rx="4"/><text class="sub" x="504.0" y="111.0" text-anchor="middle" dominant-baseline="central">×</text></g><line class="conn" x1="526" y1="111" x2="548" y2="111" marker-end="url(#arw)"/><g class="m"><rect x="552" y="94" width="88" height="34" rx="4"/><text class="sub" x="596.0" y="111.0" text-anchor="middle" dominant-baseline="central">× down</text></g><text class="sub2" x="596" y="146" text-anchor="middle">back to 8,192</text><text class="hd" x="40" y="196">Three of the 28,672 numbers, worked</text><text class="cap" x="40" y="231" text-anchor="start">gate's result</text><g class="u"><rect x="260" y="212" width="66" height="26" rx="3"/><text class="sub" x="293.0" y="225.0" text-anchor="middle" dominant-baseline="central">1.000</text></g><g class="u"><rect x="334" y="212" width="66" height="26" rx="3"/><text class="sub" x="367.0" y="225.0" text-anchor="middle" dominant-baseline="central">−2.000</text></g><g class="u"><rect x="408" y="212" width="66" height="26" rx="3"/><text class="sub" x="441.0" y="225.0" text-anchor="middle" dominant-baseline="central">0.500</text></g><text class="cap" x="40" y="263" text-anchor="start">after SiLU</text><g class="u"><rect x="260" y="244" width="66" height="26" rx="3"/><text class="sub" x="293.0" y="257.0" text-anchor="middle" dominant-baseline="central">0.731</text></g><g class="u"><rect x="334" y="244" width="66" height="26" rx="3"/><text class="sub" x="367.0" y="257.0" text-anchor="middle" dominant-baseline="central">−0.238</text></g><g class="u"><rect x="408" y="244" width="66" height="26" rx="3"/><text class="sub" x="441.0" y="257.0" text-anchor="middle" dominant-baseline="central">0.311</text></g><text class="cap" x="40" y="295" text-anchor="start">up's result</text><g class="u"><rect x="260" y="276" width="66" height="26" rx="3"/><text class="sub" x="293.0" y="289.0" text-anchor="middle" dominant-baseline="central">2.000</text></g><g class="u"><rect x="334" y="276" width="66" height="26" rx="3"/><text class="sub" x="367.0" y="289.0" text-anchor="middle" dominant-baseline="central">1.000</text></g><g class="u"><rect x="408" y="276" width="66" height="26" rx="3"/><text class="sub" x="441.0" y="289.0" text-anchor="middle" dominant-baseline="central">−1.000</text></g><text class="cap" x="40" y="327" text-anchor="start">multiplied, number by number</text><g class="m"><rect x="260" y="308" width="66" height="26" rx="3"/><text class="sub" x="293.0" y="321.0" text-anchor="middle" dominant-baseline="central">1.462</text></g><g class="m"><rect x="334" y="308" width="66" height="26" rx="3"/><text class="sub" x="367.0" y="321.0" text-anchor="middle" dominant-baseline="central">−0.238</text></g><g class="m"><rect x="408" y="308" width="66" height="26" rx="3"/><text class="sub" x="441.0" y="321.0" text-anchor="middle" dominant-baseline="central">−0.311</text></g><text class="hd" x="40" y="372">Where one layer's weights are, to scale</text><g class="s"><rect x="40" y="388" width="98.8" height="30" rx="3"/></g><text class="sub2" x="40" y="434" text-anchor="start">attention, 151.0 M, 18%</text><g class="m"><rect x="138.8" y="388" width="461.2" height="30" rx="3"/><text class="sub" x="369.4" y="403.0" text-anchor="middle" dominant-baseline="central">feed-forward, 3 × 8,192 × 28,672 = 704.6 M, 82%</text></g><text class="cap" x="40" y="476" text-anchor="start">The block of {{fig:v01-p15}} has two matrices with a bend between them, the original</text><text class="cap" x="40" y="496" text-anchor="start">design of 2017. Llama, like most current models, uses a gated version with three. The</text><text class="cap" x="40" y="516" text-anchor="start">vector is multiplied by two matrices side by side, gate and up; SiLU bends the gate's</text><text class="cap" x="40" y="536" text-anchor="start">result; the two results are multiplied number by number; and a third matrix, down,</text><text class="cap" x="40" y="556" text-anchor="start">brings 28,672 numbers back to 8,192.</text><text class="cap" x="40" y="596" text-anchor="start">The gate decides, number by number, how much of up's result gets through: above, the</text><text class="cap" x="40" y="616" text-anchor="start">first number is passed at 0.731 of its size and the second is nearly shut off. So a</text><text class="cap" x="40" y="636" text-anchor="start">layer's feed-forward block holds three matrices, 704.6 million weights and 82% of the</text><text class="cap" x="40" y="656" text-anchor="start">layer, which is why {{fig:v01-o100}} counts three per layer and why {{fig:v01-o101}}</text><text class="cap" x="40" y="676" text-anchor="start">adds up.</text></svg><figcaption>Four fifths of every layer is this block. Whatever makes reading the weights expensive, it is mostly these three matrices being read.</figcaption></figure>
