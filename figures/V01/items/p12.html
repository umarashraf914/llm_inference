<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 7:49</div><h3>A dot product is large when two vectors point the same way</h3><div class='wg'><div class='ctl'><label>b₁ <input type='range' min='-3' max='3' step='0.5' value='2'><span class='val'>2</span></label><label>b₂ <input type='range' min='-3' max='3' step='0.5' value='2'><span class='val'>2</span></label><button type='button'>Reset</button></div><svg viewBox='0 0 680 572' role='img'><title>A dot product is large when two vectors point the same way</title><text class="hd" x="40" y="34">Drag b and watch its dot product with a</text><line class="axis" x1="62" y1="62" x2="62" y2="318"/><line class="axis" x1="62" y1="62" x2="318" y2="62"/><line class="axis" x1="94" y1="62" x2="94" y2="318"/><line class="axis" x1="62" y1="94" x2="318" y2="94"/><line class="axis" x1="126" y1="62" x2="126" y2="318"/><line class="axis" x1="62" y1="126" x2="318" y2="126"/><line class="axis" x1="158" y1="62" x2="158" y2="318"/><line class="axis" x1="62" y1="158" x2="318" y2="158"/><line class="axis" x1="190" y1="62" x2="190" y2="318"/><line class="axis" x1="62" y1="190" x2="318" y2="190"/><line class="axis" x1="222" y1="62" x2="222" y2="318"/><line class="axis" x1="62" y1="222" x2="318" y2="222"/><line class="axis" x1="254" y1="62" x2="254" y2="318"/><line class="axis" x1="62" y1="254" x2="318" y2="254"/><line class="axis" x1="286" y1="62" x2="286" y2="318"/><line class="axis" x1="62" y1="286" x2="318" y2="286"/><line class="axis" x1="318" y1="62" x2="318" y2="318"/><line class="axis" x1="62" y1="318" x2="318" y2="318"/><text class="sub2" x="62" y="334" text-anchor="middle">−4</text><text class="sub2" x="54" y="322" text-anchor="end">−4</text><text class="sub2" x="126" y="334" text-anchor="middle">−2</text><text class="sub2" x="54" y="258" text-anchor="end">−2</text><text class="sub2" x="254" y="334" text-anchor="middle">2</text><text class="sub2" x="54" y="130" text-anchor="end">2</text><text class="sub2" x="318" y="334" text-anchor="middle">4</text><text class="sub2" x="54" y="66" text-anchor="end">4</text><line x1="190" y1="190" x2="286" y2="158" style="stroke:var(--m);stroke-width:2.5"/><circle cx="286" cy="158" r="4" style="fill:var(--m)"/><text class="hd halo" x="294" y="152" text-anchor="start">a</text><line data-b="" x1="190" y1="190" x2="254" y2="126" style="stroke:var(--s);stroke-width:2.5"/><circle data-bt="" cx="254" cy="126" r="4" style="fill:var(--s)"/><text class="hd halo" data-bl="" x="262" y="120">b</text><text class="sub2" x="360" y="76" text-anchor="start">a = (3, 1), fixed</text><text class="sub2" x="360" y="100" data-bv="">b = (2, 2)</text><text class="sub2" x="360" y="136" text-anchor="start">a · b = first × first + second × second</text><text class="sub2" x="360" y="160" data-sum="">= 3 × 2 + 1 × 2 = 8</text><g class="m"><rect x="360" y="182" width="270" height="34" rx="5"/><text class="sub" x="495" y="199" text-anchor="middle" dominant-baseline="central" data-verdict="">points the same way: positive</text></g><text class="cap" x="40" y="370" text-anchor="start">A dot product multiplies two lists pair by pair and adds the results: the operation each</text><text class="cap" x="40" y="390" text-anchor="start">output of a matrix multiply is made of ({{fig:v01-o005}}). Read as arrows, it measures how far</text><text class="cap" x="40" y="410" text-anchor="start">two vectors point the same way.</text><text class="cap" x="40" y="450" text-anchor="start">Here b = (2, 2) gives 3 × 2 + 1 × 2 = 8: the arrows roughly agree. b = (−2, 1) gives</text><text class="cap" x="40" y="470" text-anchor="start">−6 + 1 = −5: they point apart. b = (1, −3) gives 3 − 3 = 0: they stand at right angles.</text><text class="cap" x="40" y="490" text-anchor="start">Longer arrows give bigger numbers either way.</text><text class="cap" x="40" y="530" text-anchor="start">Drag b with the sliders. The figure's arithmetic was checked against Python at every</text><text class="cap" x="40" y="550" text-anchor="start">slider setting.</text></svg></div><figcaption>Agreement as a single number. Attention uses exactly this to decide which earlier tokens matter to the current one.</figcaption><script>(() => {

  const MINUS = '−';
  const fx = (v, d = 2) => { const s = Math.abs(v).toFixed(d); return (v < 0 && +s !== 0 ? MINUS : '') + s; };
  const gx = (v, d = 0) => { const s = Math.abs(v).toFixed(d); const [a, b] = s.split('.');
    const t = a.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (v < 0 && +s !== 0 ? MINUS : '') + t + (b !== undefined ? '.' + b : ''); };

  const fig = document.currentScript.closest('figure');
  const A = [3, 1], OX = 190, OY = 190, U = 32, B0 = [2, 2];
  const sl = [...fig.querySelectorAll('input[type=range]')], val = [...fig.querySelectorAll('.val')];
  const q = s => fig.querySelector(s);
  const nf = v => (v < 0 ? '−' : '') + String(Math.abs(v));
  function draw() {
    const b = sl.map(s => +s.value);
    b.forEach((v, i) => val[i].textContent = nf(v));
    const x = OX + b[0] * U, y = OY - b[1] * U, s = A[0] * b[0] + A[1] * b[1];
    const ln = q('[data-b]'); ln.setAttribute('x2', x); ln.setAttribute('y2', y);
    const t = q('[data-bt]'); t.setAttribute('cx', x); t.setAttribute('cy', y);
    const l = q('[data-bl]'); l.setAttribute('x', x + 8); l.setAttribute('y', y - 6);
    q('[data-bv]').textContent = `b = (${nf(b[0])}, ${nf(b[1])})`;
    q('[data-sum]').textContent = `= 3 × ${nf(b[0])} + 1 × ${nf(b[1])} = ${nf(s)}`;
    q('[data-verdict]').textContent = s > 0 ? 'points the same way: positive' : s === 0 ? 'at right angles: zero' : 'points away: negative';
  }
  sl.forEach(s => s.addEventListener('input', draw));
  q('button').addEventListener('click', () => { sl.forEach((s, i) => s.value = B0[i]); draw(); });
  draw();
})();</script></figure>
