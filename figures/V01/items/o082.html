<figure><div class='ts'>Fig 82 &nbsp;&middot;&nbsp; 5:44</div><h3>The memory wall has a name and a date</h3><svg viewBox="0 0 680 240" role="img"><title>The memory wall has a name and a date</title><g class="u"><rect x="50" y="55" width="265" height="76" rx="8"></rect><text class="lbl" x="182.5" y="76.0" text-anchor="middle" dominant-baseline="central">Wulf and McKee, 1995</text><text class="sub" x="182.5" y="94.0" text-anchor="middle" dominant-baseline="central">more than twenty years before</text><text class="sub" x="182.5" y="111.0" text-anchor="middle" dominant-baseline="central">the transformer existed</text></g><g class="h"><rect x="365" y="55" width="265" height="76" rx="8"></rect><text class="lbl" x="497.5" y="76.0" text-anchor="middle" dominant-baseline="central">What changed</text><text class="sub" x="497.5" y="94.0" text-anchor="middle" dominant-baseline="central">not the hardware trend,</text><text class="sub" x="497.5" y="111.0" text-anchor="middle" dominant-baseline="central">the workload</text></g><text class="cap" x="40" y="178" text-anchor="start">The gap was always there. What is new is a computation hungry enough for bytes that the gap</text><text class="cap" x="40" y="198" text-anchor="start">became the dominant concern rather than one concern among many.</text><text class="cap" x="40" y="226" text-anchor="start">Large language model inference is among the most byte-hungry workloads ever built.</text></svg><figcaption>A useful piece of perspective: this is not an AI problem that hardware failed to anticipate. It is a long-standing architectural trend that AI happened to walk straight into.</figcaption></figure>
