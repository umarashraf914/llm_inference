<figure><div class='ts'>Fig 125 &nbsp;&middot;&nbsp; 16:21</div><h3>Why the ratio is the interesting number</h3><svg viewBox='0 0 680 410' role='img'><title>Why the ratio is the interesting number</title><text class="hd" x="40" y="46">What a ratio tells you that two numbers do not</text><text class="cap" x="40" y="92" text-anchor="start">Chip A</text><g class="m"><rect x="180" y="76" width="200" height="30" rx="3"/><text class="sub" x="280.0" y="91.0" text-anchor="middle" dominant-baseline="central">500 ops/s</text></g><g class="h"><rect x="400" y="76" width="100" height="30" rx="3"/><text class="sub" x="450.0" y="91.0" text-anchor="middle" dominant-baseline="central">50 B/s</text></g><text class="sub2" x="516" y="96" text-anchor="start">ratio 10</text><text class="cap" x="40" y="152" text-anchor="start">Chip B</text><g class="m"><rect x="180" y="136" width="400" height="30" rx="3"/><text class="sub" x="380.0" y="151.0" text-anchor="middle" dominant-baseline="central">1,000 ops/s</text></g><g class="h"><rect x="180" y="176" width="200" height="30" rx="3"/><text class="sub" x="280.0" y="191.0" text-anchor="middle" dominant-baseline="central">100 B/s</text></g><text class="sub2" x="400" y="196" text-anchor="start">ratio 10</text><text class="cap" x="40" y="256" text-anchor="start">Chip B is twice the chip in both directions, and the ratio is identical. A workload sits on the</text><text class="cap" x="40" y="276" text-anchor="start">same side of the corner on both.</text><text class="cap" x="40" y="312" text-anchor="start">So the ratio says what kind of work a chip suits, and the absolute numbers say how fast it</text><text class="cap" x="40" y="332" text-anchor="start">gets through it. Two different questions.</text><text class="cap" x="40" y="368" text-anchor="start">The memory wall is a statement about the ratio: the top number has been growing faster than</text><text class="cap" x="40" y="388" text-anchor="start">the bottom one for a decade.</text></svg><figcaption>A ratio is scale-free, which is exactly why it is the right way to describe a trend that has held across many generations of hardware.</figcaption></figure>
