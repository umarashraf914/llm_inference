<figure><div class='ts'>Fig 99 &nbsp;&middot;&nbsp; 7:15</div><h3>What travels between layers</h3><svg viewBox='0 0 680 440' role='img'><title>What travels between layers</title><text class="hd" x="40" y="46">One thing flows upward; three things are made fresh at every stop</text><g class="s"><rect x="40" y="74" width="600" height="32" rx="5"/><text class="sub" x="340.0" y="90.0" text-anchor="middle" dominant-baseline="central">the residual stream: one vector per token, 8,192 numbers wide</text></g><line class="conn" x1="170" y1="112" x2="170" y2="136" marker-end="url(#arw)"/><g class="m"><rect x="90" y="140" width="160" height="34" rx="4"/><text class="sub" x="170.0" y="157.0" text-anchor="middle" dominant-baseline="central">layer 1 makes Q, K, V</text></g><line class="conn" x1="170" y1="178" x2="170" y2="202" marker-end="url(#arw)"/><line class="conn" x1="366" y1="112" x2="366" y2="136" marker-end="url(#arw)"/><g class="m"><rect x="286" y="140" width="160" height="34" rx="4"/><text class="sub" x="366.0" y="157.0" text-anchor="middle" dominant-baseline="central">layer 2 makes Q, K, V</text></g><line class="conn" x1="366" y1="178" x2="366" y2="202" marker-end="url(#arw)"/><line class="conn" x1="562" y1="112" x2="562" y2="136" marker-end="url(#arw)"/><g class="m"><rect x="482" y="140" width="160" height="34" rx="4"/><text class="sub" x="562.0" y="157.0" text-anchor="middle" dominant-baseline="central">layer 3 makes Q, K, V</text></g><line class="conn" x1="562" y1="178" x2="562" y2="202" marker-end="url(#arw)"/><g class="s"><rect x="40" y="206" width="600" height="32" rx="5"/><text class="sub" x="340.0" y="222.0" text-anchor="middle" dominant-baseline="central">the residual stream, updated</text></g><text class="cap" x="40" y="286" text-anchor="start">The stream is what carries information from layer to layer. Q, K and V are not carried; they</text><text class="cap" x="40" y="306" text-anchor="start">are made from the stream, used inside that layer, and discarded.</text><text class="cap" x="40" y="342" text-anchor="start">Which is why the stream keeps the same width all the way up, and why layers can simply be</text><text class="cap" x="40" y="362" text-anchor="start">stacked.</text><text class="cap" x="40" y="398" text-anchor="start">Keys and values are the one partial exception: they are kept, but only for the cache, and each</text><text class="cap" x="40" y="418" text-anchor="start">layer keeps its own.</text></svg><figcaption>The residual stream is the only thing that flows. Everything else is manufactured and consumed within a single layer.</figcaption></figure>
