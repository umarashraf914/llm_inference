<figure><div class='ts'>Fig 75 &nbsp;&middot;&nbsp; 3:51</div><h3>What per second means</h3><svg viewBox='0 0 680 366' role='img'><title>What per second means</title><text class="hd" x="40" y="46">A rate is an amount divided by a time</text><g class="u"><rect x="60" y="70" width="200" height="40" rx="4"/><text class="sub" x="160.0" y="90.0" text-anchor="middle" dominant-baseline="central">bytes</text></g><text class="sub2" x="276" y="96" text-anchor="start">per</text><g class="u"><rect x="320" y="70" width="200" height="40" rx="4"/><text class="sub" x="420.0" y="90.0" text-anchor="middle" dominant-baseline="central">second</text></g><text class="hd" x="40" y="158">So a rate times a time gives back an amount</text><g class="m"><rect x="60" y="182" width="520" height="42" rx="6"/><text class="sub" x="320.0" y="203.0" text-anchor="middle" dominant-baseline="central">3.35 TB/s  x  0.03 s  =  about 100 GB moved in one token's budget</text></g><text class="cap" x="40" y="268" text-anchor="start">Which is not quite the 140 gigabytes the model needs, and that gap is the whole story of this</text><text class="cap" x="40" y="288" text-anchor="start">video in a single line of arithmetic.</text><text class="cap" x="40" y="324" text-anchor="start">Every specification you will meet is one of these two shapes: an amount, or an amount per</text><text class="cap" x="40" y="344" text-anchor="start">second. Keeping them apart is most of the skill.</text></svg><figcaption>The multiplication runs the other way from the division in Part 3, and gives the same answer from the other side.</figcaption></figure>
