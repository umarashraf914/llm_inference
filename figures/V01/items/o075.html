<figure><div class='ts'>Fig 75 &nbsp;&middot;&nbsp; 4:02</div><h3>What per second means</h3><svg viewBox='0 0 680 390' role='img'><title>What per second means</title><text class="hd" x="40" y="46">A rate is an amount divided by a time</text><g class="u"><rect x="60" y="70" width="200" height="40" rx="4"/><text class="sub" x="160.0" y="90.0" text-anchor="middle" dominant-baseline="central">bytes</text></g><text class="sub2" x="276" y="96" text-anchor="start">per</text><g class="u"><rect x="320" y="70" width="200" height="40" rx="4"/><text class="sub" x="420.0" y="90.0" text-anchor="middle" dominant-baseline="central">second</text></g><text class="hd" x="40" y="158">So a rate times a time gives back an amount</text><g class="m"><rect x="60" y="182" width="520" height="42" rx="6"/><text class="sub" x="320.0" y="203.0" text-anchor="middle" dominant-baseline="central">3.35 TB/s  x  0.03 s  =  about 100 GB moved in one token's budget</text></g><text class="cap" x="40" y="268" text-anchor="start">The model's weights are 140 GB, so on this chip reading them once takes 140 ÷ 3.35 =</text><text class="cap" x="40" y="288" text-anchor="start">41.8 ms. Reading the weights alone would use up more than the whole 30 ms budget, before</text><text class="cap" x="40" y="308" text-anchor="start">a single multiplication.</text><text class="cap" x="40" y="348" text-anchor="start">Every specification you will meet is one of these two shapes: an amount, or an amount</text><text class="cap" x="40" y="368" text-anchor="start">per second. Keeping them apart is most of the skill.</text></svg><figcaption>A rate times a time gives an amount, the reverse of Part 3's division. Here it shows that just moving the weights takes longer than a whole token is supposed to.</figcaption></figure>
