<figure><div class='ts'>Fig 04 &nbsp;&middot;&nbsp; 0:00</div><h3>What one weight does</h3><svg viewBox="0 0 680 290" role="img"><title>What one weight does</title><text class="hd" x="40" y="46">What one weight does</text><g class="s"><rect x="60" y="70" width="110" height="40" rx="6"></rect><text class="sub" x="115.0" y="90.0" text-anchor="middle" dominant-baseline="central">input</text></g><text class="hd" x="190" y="96" text-anchor="start">x</text><g class="m"><rect x="214" y="70" width="110" height="40" rx="6"></rect><text class="sub" x="269.0" y="90.0" text-anchor="middle" dominant-baseline="central">weight</text></g><text class="hd" x="344" y="96" text-anchor="start">=</text><g class="u"><rect x="368" y="70" width="150" height="40" rx="6"></rect><text class="sub" x="443.0" y="90.0" text-anchor="middle" dominant-baseline="central">contribution</text></g><text class="cap" x="40" y="156" text-anchor="start">A weight is a dial. It decides how much one number influences the next one.</text><text class="cap" x="40" y="192" text-anchor="start">A weight of 0 means the input is ignored entirely. A large weight means it dominates. A</text><text class="cap" x="40" y="212" text-anchor="start">negative weight means it pushes the other way.</text><text class="cap" x="40" y="248" text-anchor="start">That is the whole of what a weight does. Training was the process of finding seventy billion</text><text class="cap" x="40" y="268" text-anchor="start">settings for these dials such that the output text is useful.</text></svg><figcaption>A single multiplication. The model's intelligence is not in any one of these; it is in how seventy billion of them combine.</figcaption></figure>
