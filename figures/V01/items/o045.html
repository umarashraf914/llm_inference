<figure><div class='ts'>Fig 45 &nbsp;&middot;&nbsp; 25:43</div><h3>Words in common are not a cache hit</h3><svg viewBox='0 0 680 474' role='img'><title>Words in common are not a cache hit</title><text class="hd" x="40" y="46">Four words in common, and not one of them helps</text><text class="sub2" x="40" y="92" text-anchor="start">cached</text><g class="s"><rect x="130" y="74" width="70" height="30" rx="3"/><text class="sub" x="165.0" y="89.0" text-anchor="middle" dominant-baseline="central">What</text></g><g class="s"><rect x="206" y="74" width="70" height="30" rx="3"/><text class="sub" x="241.0" y="89.0" text-anchor="middle" dominant-baseline="central">is</text></g><g class="s"><rect x="282" y="74" width="70" height="30" rx="3"/><text class="sub" x="317.0" y="89.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="s"><rect x="358" y="74" width="70" height="30" rx="3"/><text class="sub" x="393.0" y="89.0" text-anchor="middle" dominant-baseline="central">capital</text></g><g class="s"><rect x="434" y="74" width="70" height="30" rx="3"/><text class="sub" x="469.0" y="89.0" text-anchor="middle" dominant-baseline="central">of</text></g><g class="s"><rect x="510" y="74" width="70" height="30" rx="3"/><text class="sub" x="545.0" y="89.0" text-anchor="middle" dominant-baseline="central">France</text></g><g class="s"><rect x="586" y="74" width="70" height="30" rx="3"/><text class="sub" x="621.0" y="89.0" text-anchor="middle" dominant-baseline="central">?</text></g><text class="sub2" x="40" y="166" text-anchor="start">arriving</text><g class="h"><rect x="130" y="148" width="70" height="30" rx="3"/><text class="sub" x="165.0" y="163.0" text-anchor="middle" dominant-baseline="central">Tell</text></g><g class="h"><rect x="206" y="148" width="70" height="30" rx="3"/><text class="sub" x="241.0" y="163.0" text-anchor="middle" dominant-baseline="central">me</text></g><g class="h"><rect x="282" y="148" width="70" height="30" rx="3"/><text class="sub" x="317.0" y="163.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="h"><rect x="358" y="148" width="70" height="30" rx="3"/><text class="sub" x="393.0" y="163.0" text-anchor="middle" dominant-baseline="central">capital</text></g><g class="h"><rect x="434" y="148" width="70" height="30" rx="3"/><text class="sub" x="469.0" y="163.0" text-anchor="middle" dominant-baseline="central">of</text></g><g class="h"><rect x="510" y="148" width="70" height="30" rx="3"/><text class="sub" x="545.0" y="163.0" text-anchor="middle" dominant-baseline="central">France</text></g><g class="h"><rect x="586" y="148" width="70" height="30" rx="3"/><text class="sub" x="621.0" y="163.0" text-anchor="middle" dominant-baseline="central">please</text></g><text class="sub2" x="40" y="226" text-anchor="start">Words appearing in both: the, capital, of, France. Four of them.</text><g class="h"><rect x="140" y="256" width="400" height="42" rx="6"/><text class="sub" x="340.0" y="277.0" text-anchor="middle" dominant-baseline="central">tokens matched from the front:  0</text></g><text class="cap" x="40" y="340" text-anchor="start">The very first token differs, so not one token of the question matches. Everything</text><text class="cap" x="40" y="360" text-anchor="start">shared sits behind that difference and is worthless, however much of it there is.</text><text class="cap" x="40" y="396" text-anchor="start">A cache hit is not about words in common. It is about the sequence being identical from the</text><text class="cap" x="40" y="416" text-anchor="start">beginning, in order, with nothing changed.</text><text class="cap" x="40" y="452" text-anchor="start">It is an easy mistake to make about prompt caching, and an expensive one.</text></svg><figcaption>The one thing to take from this part: shared vocabulary counts for nothing; only a shared beginning counts.</figcaption></figure>
