<figure><div class='ts'>Fig 126 &nbsp;&middot;&nbsp; 16:44</div><h3>Deriving the ridge</h3><svg viewBox="0 0 680 476" role="img"><title>Deriving the ridge</title><text class="hd" x="40" y="46">The ridge is where the two ceilings meet</text><g class="u"><rect x="60" y="70" width="250" height="42" rx="6"></rect><text class="sub" x="185.0" y="91.0" text-anchor="middle" dominant-baseline="central">bandwidth x intensity = peak</text></g><line class="conn" x1="324" y1="91" x2="352" y2="91" marker-end="url(#arw)"></line><g class="m"><rect x="360" y="70" width="260" height="42" rx="6"></rect><text class="sub" x="490.0" y="91.0" text-anchor="middle" dominant-baseline="central">intensity = peak / bandwidth</text></g><text class="cap" x="40" y="158" text-anchor="start">Solve for the intensity at which the slanted line reaches the flat one. That crossing point is</text><text class="cap" x="40" y="178" text-anchor="start">the ridge, and it is a property of the chip alone, not of any workload.</text><text class="hd" x="40" y="228">For an H100</text><text class="cap" x="40" y="268" text-anchor="start">peak</text><g class="m"><rect x="180" y="252" width="200" height="32" rx="3"></rect><text class="sub" x="280.0" y="268.0" text-anchor="middle" dominant-baseline="central">989 trillion ops/s</text></g><text class="cap" x="40" y="318" text-anchor="start">bandwidth</text><g class="h"><rect x="180" y="302" width="200" height="32" rx="3"></rect><text class="sub" x="280.0" y="318.0" text-anchor="middle" dominant-baseline="central">3.35 trillion bytes/s</text></g><g class="s"><rect x="180" y="352" width="200" height="42" rx="6"></rect><text class="sub" x="280.0" y="373.0" text-anchor="middle" dominant-baseline="central">= 295 ops per byte</text></g><text class="cap" x="40" y="434" text-anchor="start">Below 295 operations per byte, a workload is memory bound on this chip. Above it, compute</text><text class="cap" x="40" y="454" text-anchor="start">bound. One division, and the chip is characterised.</text></svg><figcaption>Worth doing yourself once for whatever hardware you use. It is the number every workload gets compared against.</figcaption></figure>
