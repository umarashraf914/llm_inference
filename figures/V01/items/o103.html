<figure><div class='ts'>Fig 103 &nbsp;&middot;&nbsp; 8:30</div><h3>How the model gets back to words</h3><svg viewBox='0 0 680 340' role='img'><title>How the model gets back to words</title><text class="hd" x="40" y="46">The last step: from a vector to a word</text><g class="s"><rect x="40" y="76" width="150" height="40" rx="4"/><text class="sub" x="115.0" y="96.0" text-anchor="middle" dominant-baseline="central">final vector</text></g><line class="conn" x1="196" y1="96" x2="220" y2="96" marker-end="url(#arw)"/><g class="m"><rect x="226" y="76" width="190" height="40" rx="4"/><text class="sub" x="321.0" y="96.0" text-anchor="middle" dominant-baseline="central">score every token</text></g><line class="conn" x1="422" y1="96" x2="446" y2="96" marker-end="url(#arw)"/><g class="s"><rect x="452" y="76" width="188" height="40" rx="4"/><text class="sub" x="546.0" y="96.0" text-anchor="middle" dominant-baseline="central">pick one</text></g><text class="sub2" x="40" y="156" text-anchor="start">8,192 numbers</text><text class="sub2" x="226" y="156" text-anchor="start">128,256 numbers</text><text class="sub2" x="452" y="156" text-anchor="start">1 token</text><text class="cap" x="40" y="206" text-anchor="start">The vector coming out of the last layer is not text and not a word. It is turned into a score</text><text class="cap" x="40" y="226" text-anchor="start">for every token in the vocabulary by one more matrix multiply.</text><text class="cap" x="40" y="262" text-anchor="start">Then softmax turns those scores into shares, and one token is drawn.</text><text class="cap" x="40" y="298" text-anchor="start">That token is appended to the input, and the entire eighty-layer journey begins again for the</text><text class="cap" x="40" y="318" text-anchor="start">next one.</text></svg><figcaption>Closes the loop opened in Part 1. Everything between the first embedding lookup and this step is arithmetic on arrays of numbers.</figcaption></figure>
