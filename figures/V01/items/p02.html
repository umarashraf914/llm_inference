<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 1:11</div><h3>Cost per token is an hourly price divided by the tokens made in that hour</h3><svg viewBox='0 0 680 510' role='img'><title>Cost per token is an hourly price divided by the tokens made in that hour</title><text class="hd" x="40" y="46">An operator rents chips by the hour and sells what they produce, token by token</text><g class="m"><rect x="40" y="72" width="170" height="42" rx="6"/><text class="sub" x="125.0" y="93.0" text-anchor="middle" dominant-baseline="central">cost per token</text></g><text class="hd" x="222" y="98" text-anchor="start">=</text><g class="h"><rect x="240" y="72" width="170" height="42" rx="6"/><text class="sub" x="325.0" y="93.0" text-anchor="middle" dominant-baseline="central">dollars per hour</text></g><text class="hd" x="422" y="98" text-anchor="start">÷</text><g class="s"><rect x="440" y="72" width="200" height="42" rx="6"/><text class="sub" x="540.0" y="93.0" text-anchor="middle" dominant-baseline="central">tokens made per hour</text></g><text class="sub2" x="40" y="168" text-anchor="start">and</text><g class="s"><rect x="80" y="142" width="200" height="42" rx="6"/><text class="sub" x="180.0" y="163.0" text-anchor="middle" dominant-baseline="central">tokens made per hour</text></g><text class="hd" x="292" y="168" text-anchor="start">=</text><g class="s"><rect x="310" y="142" width="170" height="42" rx="6"/><text class="sub" x="395.0" y="163.0" text-anchor="middle" dominant-baseline="central">tokens per second</text></g><text class="hd" x="492" y="168" text-anchor="start">×</text><g class="u"><rect x="510" y="142" width="130" height="42" rx="6"/><text class="sub" x="575.0" y="163.0" text-anchor="middle" dominant-baseline="central">3,600</text></g><text class="sub2" x="575" y="204" text-anchor="middle">seconds in an hour</text><text class="hd" x="40" y="246">Worked with round numbers: a $3 hour, 100 tokens a second</text><text class="sub2" x="60" y="276" text-anchor="start">100 tokens a second × 3,600 = 360,000 tokens an hour</text><text class="sub2" x="60" y="302" text-anchor="start">$3 ÷ 360,000 = $0.0000083 per token</text><text class="sub2" x="60" y="328" text-anchor="start">× 1,000,000 = $8.33 per million tokens, the unit prices are quoted in</text><text class="cap" x="40" y="384" text-anchor="start">Only the bottom of the division is engineering. The hourly price is set by the market;</text><text class="cap" x="40" y="404" text-anchor="start">how many tokens a chip makes in a second is what every technique in this series changes.</text><text class="cap" x="40" y="444" text-anchor="start">The $3 is a typical rental for one high-end chip and the 100 tokens a second is a round</text><text class="cap" x="40" y="464" text-anchor="start">number for illustration. {{fig:v01-p34}} works the same division with rates derived for a</text><text class="cap" x="40" y="484" text-anchor="start">real chip.</text></svg><figcaption>Halve the time a token takes and the cost per token halves with it. That is why a lecture about milliseconds is also a lecture about money.</figcaption></figure>
