<figure><div class='ts'>Fig 57 &nbsp;&middot;&nbsp; 0:21</div><h3>How to tell that it streams rather than buffers</h3><svg viewBox='0 0 680 394' role='img'><title>How to tell that it streams rather than buffers</title><text class="hd" x="40" y="46">Two things anyone can check</text><g class="s"><rect x="40" y="74" width="285" height="86" rx="8"/><text class="lbl" x="182.5" y="100.0" text-anchor="middle" dominant-baseline="central">Text appears steadily</text><text class="sub" x="182.5" y="118.0" text-anchor="middle" dominant-baseline="central">at a roughly constant rate,</text><text class="sub" x="182.5" y="135.0" text-anchor="middle" dominant-baseline="central">not all at once</text></g><g class="s"><rect x="355" y="74" width="285" height="86" rx="8"/><text class="lbl" x="497.5" y="100.0" text-anchor="middle" dominant-baseline="central">Stopping mid-answer works</text><text class="sub" x="497.5" y="118.0" text-anchor="middle" dominant-baseline="central">and the server stops</text><text class="sub" x="497.5" y="135.0" text-anchor="middle" dominant-baseline="central">generating, saving compute</text></g><text class="cap" x="40" y="204" text-anchor="start">If the answer were finished before being sent, it would arrive in one piece and pressing stop</text><text class="cap" x="40" y="224" text-anchor="start">halfway through would save nothing.</text><text class="cap" x="40" y="260" text-anchor="start">Both observations point the same way: the tokens leave as they are made.</text><text class="cap" x="40" y="296" text-anchor="start">There is a non-streaming mode, where the caller waits and receives the whole answer at once.</text><text class="cap" x="40" y="316" text-anchor="start">It is the same generation underneath; only the delivery differs.</text><text class="cap" x="40" y="352" text-anchor="start">A chat window uses streaming because the first token can then be shown in under a second,</text><text class="cap" x="40" y="372" text-anchor="start">rather than after the whole answer is complete.</text></svg><figcaption>Two observable behaviours that would both be impossible if the answer were assembled first and sent afterwards.</figcaption></figure>
