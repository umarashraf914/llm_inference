<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:04</div><h3>The feed-forward block widens each vector 3.5 times, then narrows it back</h3><svg viewBox='0 0 680 526' role='img'><title>The feed-forward block widens each vector 3.5 times, then narrows it back</title><text class="hd" x="40" y="46">One token's vector through the feed-forward block, lengths to scale</text><g class="s"><rect x="150" y="70" width="140.0" height="30" rx="3"/></g><text class="sub2" x="300.0" y="90" text-anchor="start">8,192 numbers</text><text class="cap" x="40" y="90" text-anchor="start">in</text><g class="m"><rect x="150" y="150" width="490.0" height="30" rx="3"/><text class="sub" x="395.0" y="165.0" text-anchor="middle" dominant-baseline="central">28,672 numbers, 3.5 times as many</text></g><text class="cap" x="40" y="170" text-anchor="start">widened</text><g class="s"><rect x="150" y="230" width="140.0" height="30" rx="3"/></g><text class="sub2" x="300.0" y="250" text-anchor="start">8,192 numbers</text><text class="cap" x="40" y="250" text-anchor="start">narrowed back</text><line class="conn" x1="166" y1="104" x2="166" y2="146" marker-end="url(#arw)"/><text class="sub2" x="180" y="129" text-anchor="start">× matrix 1: 28,672 rows of 8,192, then a bend applied to every number</text><line class="conn" x1="166" y1="184" x2="166" y2="226" marker-end="url(#arw)"/><text class="sub2" x="180" y="209" text-anchor="start">× matrix 2: 8,192 rows of 28,672</text><text class="cap" x="40" y="300" text-anchor="start">The feed-forward block works on one token's vector at a time and never looks at the</text><text class="cap" x="40" y="320" text-anchor="start">others. It multiplies the vector by a matrix with 28,672 rows, making a vector 3.5 times</text><text class="cap" x="40" y="340" text-anchor="start">as long; bends every one of those numbers; and multiplies by a second matrix that brings</text><text class="cap" x="40" y="360" text-anchor="start">it back to 8,192.</text><text class="cap" x="40" y="400" text-anchor="start">Each of the two matrices holds 8,192 × 28,672 = 234.9 million weights, more than all</text><text class="cap" x="40" y="420" text-anchor="start">four of attention's matrices together (151.0 million). Most of a layer's weights live</text><text class="cap" x="40" y="440" text-anchor="start">here.</text><text class="cap" x="40" y="480" text-anchor="start">Why the bend is there at all is the next figure. How much to widen is a design choice</text><text class="cap" x="40" y="500" text-anchor="start">settled by experiment rather than derived; 3.5 times is this model's.</text></svg><figcaption>Two matrix multiplies with a bend between them, applied to each token separately. Attention mixes tokens together; this block works on what each token already carries.</figcaption></figure>
