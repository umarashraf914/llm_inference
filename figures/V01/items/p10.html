<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:19</div><h3>Eighty-fold in a decade is ×1.55 a year; seventeen-fold is ×1.33</h3><svg viewBox='0 0 680 458' role='img'><title>Eighty-fold in a decade is ×1.55 a year; seventeen-fold is ×1.33</title><text class="hd" x="40" y="46">Ten years of steady growth, two years at a time</text><text class="sub2" x="50" y="74" text-anchor="start">years</text><text class="sub2" x="150" y="74" text-anchor="start">compute, ×1.55 a year</text><text class="sub2" x="300" y="74" text-anchor="start">bandwidth, ×1.33 a year</text><text class="sub2" x="460" y="74" text-anchor="start">compute ÷ bandwidth</text><text class="sub2" x="50" y="98" text-anchor="start">0  (2012)</text><text class="sub2" x="150" y="98" text-anchor="start">× 1.00</text><text class="sub2" x="300" y="98" text-anchor="start">× 1.00</text><text class="sub2" x="460" y="98" text-anchor="start">× 1.00</text><text class="sub2" x="50" y="124" text-anchor="start">2  (2014)</text><text class="sub2" x="150" y="124" text-anchor="start">× 2.40</text><text class="sub2" x="300" y="124" text-anchor="start">× 1.76</text><text class="sub2" x="460" y="124" text-anchor="start">× 1.36</text><text class="sub2" x="50" y="150" text-anchor="start">4  (2016)</text><text class="sub2" x="150" y="150" text-anchor="start">× 5.77</text><text class="sub2" x="300" y="150" text-anchor="start">× 3.11</text><text class="sub2" x="460" y="150" text-anchor="start">× 1.86</text><text class="sub2" x="50" y="176" text-anchor="start">6  (2018)</text><text class="sub2" x="150" y="176" text-anchor="start">× 13.9</text><text class="sub2" x="300" y="176" text-anchor="start">× 5.47</text><text class="sub2" x="460" y="176" text-anchor="start">× 2.53</text><text class="sub2" x="50" y="202" text-anchor="start">8  (2020)</text><text class="sub2" x="150" y="202" text-anchor="start">× 33.3</text><text class="sub2" x="300" y="202" text-anchor="start">× 9.65</text><text class="sub2" x="460" y="202" text-anchor="start">× 3.45</text><text class="sub2" x="50" y="228" text-anchor="start">10  (2022)</text><text class="sub2" x="150" y="228" text-anchor="start">× 80.0</text><text class="sub2" x="300" y="228" text-anchor="start">× 17.0</text><text class="sub2" x="460" y="228" text-anchor="start">× 4.71</text><text class="cap" x="40" y="272" text-anchor="start">Exponential growth means the same multiplier every year, not the same addition.</text><text class="cap" x="40" y="292" text-anchor="start">Eighty-fold in ten years is the tenth root of 80 each year: 80^(1/10) = 1.55, a rise of</text><text class="cap" x="40" y="312" text-anchor="start">55% every year, because 1.55 multiplied by itself ten times is 80.</text><text class="cap" x="40" y="352" text-anchor="start">Seventeen-fold is 17^(1/10) = 1.33, 33% a year. The gap between them widens by 1.55 ÷</text><text class="cap" x="40" y="372" text-anchor="start">1.33 = 1.17 every year, about 17%, which compounds to 80 ÷ 17 = 4.7 after ten.</text><text class="cap" x="40" y="412" text-anchor="start">A steady multiplier draws as a straight line on a logarithmic axis, which is how the</text><text class="cap" x="40" y="432" text-anchor="start">next figure draws both.</text></svg><figcaption>Two steady percentages are all it takes. The gap between them compounds the same way the quantities do, so it never stops growing on its own.</figcaption></figure>
