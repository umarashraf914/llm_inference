<figure><div class='ts'>Fig 137 &nbsp;&middot;&nbsp; 23:17</div><h3>What actually re-enters the model each step</h3><svg viewBox='0 0 680 462' role='img'><title>What actually re-enters the model each step</title><text class="hd" x="40" y="46">What you might picture: the whole text fed in again</text><g class="h"><rect x="60" y="70" width="54" height="30" rx="3"/></g><g class="h"><rect x="122" y="70" width="54" height="30" rx="3"/></g><g class="h"><rect x="184" y="70" width="54" height="30" rx="3"/></g><g class="h"><rect x="246" y="70" width="54" height="30" rx="3"/></g><g class="h"><rect x="308" y="70" width="54" height="30" rx="3"/></g><g class="h"><rect x="370" y="70" width="54" height="30" rx="3"/></g><g class="h"><rect x="432" y="70" width="54" height="30" rx="3"/></g><g class="h"><rect x="494" y="70" width="54" height="30" rx="3"/></g><g class="h"><rect x="556" y="70" width="54" height="30" rx="3"/></g><text class="sub2" x="620" y="90" text-anchor="start">...</text><text class="sub2" x="60" y="126" text-anchor="start">all 1,032 tokens, through the model, every step</text><text class="hd" x="40" y="178">What actually happens: one token, plus the cache</text><rect x="60" y="202" width="54" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="122" y="202" width="54" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="184" y="202" width="54" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="246" y="202" width="54" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="308" y="202" width="54" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="370" y="202" width="54" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="432" y="202" width="54" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="494" y="202" width="54" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="556" y="202" width="54" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="618" y="202" width="54" height="30" rx="3"/></g><text class="sub2" x="60" y="258" text-anchor="start">the dashed ones are already in the cache and are not recomputed</text><text class="cap" x="40" y="308" text-anchor="start">Only the newest token goes through the model. Everything before it is represented by keys and</text><text class="cap" x="40" y="328" text-anchor="start">values computed once and kept, which is exactly what the cache is for.</text><text class="cap" x="40" y="364" text-anchor="start">Re-running the whole context every step would be a thousand times the work at this length, and</text><text class="cap" x="40" y="384" text-anchor="start">worse as the conversation grows.</text><text class="cap" x="40" y="420" text-anchor="start">So the growing text is not fed back in. It is already there, in a form the model can attend to</text><text class="cap" x="40" y="440" text-anchor="start">without recomputing it.</text></svg><figcaption>The correction most people need. The sequence grows, but the work per step does not grow with it in the way the picture suggests.</figcaption></figure>
