<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:58</div><h3>Doing the division, and checking the units</h3><svg viewBox='0 0 680 520' role='img'><title>Doing the division, and checking the units</title><text class="hd" x="40" y="46">The numbers: subtract the exponents</text><text class="hd" x="350" y="46">The units: they cancel</text><g class="m"><rect x="40" y="66" width="290" height="42" rx="6"/><text class="sub" x="185.0" y="87.0" text-anchor="middle" dominant-baseline="central">10^11  ÷  10^15</text></g><g class="u"><rect x="350" y="66" width="290" height="42" rx="6"/><text class="sub" x="495.0" y="87.0" text-anchor="middle" dominant-baseline="central">operations  ÷  operations per second</text></g><g class="m"><rect x="40" y="128" width="290" height="42" rx="6"/><text class="sub" x="185.0" y="149.0" text-anchor="middle" dominant-baseline="central">=  10^(11 − 15)  =  10^−4</text></g><g class="u"><rect x="350" y="128" width="290" height="42" rx="6"/><text class="sub" x="495.0" y="149.0" text-anchor="middle" dominant-baseline="central">=  operations  ×  seconds per operation</text></g><line class="conn" x1="185" y1="110" x2="185" y2="125" marker-end="url(#arw)"/><line class="conn" x1="495" y1="110" x2="495" y2="125" marker-end="url(#arw)"/><g class="m"><rect x="40" y="190" width="290" height="42" rx="6"/><text class="sub" x="185.0" y="211.0" text-anchor="middle" dominant-baseline="central">=  0.0001</text></g><g class="u"><rect x="350" y="190" width="290" height="42" rx="6"/><text class="sub" x="495.0" y="211.0" text-anchor="middle" dominant-baseline="central">=  seconds</text></g><line class="conn" x1="185" y1="172" x2="185" y2="187" marker-end="url(#arw)"/><line class="conn" x1="495" y1="172" x2="495" y2="187" marker-end="url(#arw)"/><g class="s"><rect x="150" y="256" width="380" height="42" rx="6"/><text class="sub" x="340.0" y="277.0" text-anchor="middle" dominant-baseline="central">together:  0.0001 seconds  =  0.1 milliseconds</text></g><text class="cap" x="40" y="334" text-anchor="start">A negative exponent means a fraction: ten to the minus four is one ten-thousandth.</text><text class="cap" x="40" y="374" text-anchor="start">Dividing by a rate is multiplying by the rate turned over: operations per second becomes</text><text class="cap" x="40" y="394" text-anchor="start">seconds per operation. The operations then cancel, as any quantity divided by itself</text><text class="cap" x="40" y="414" text-anchor="start">does, and seconds are left, which is what a duration should be.</text><text class="cap" x="40" y="454" text-anchor="start">Divide the other way round, operations per second by operations, and what is left is per</text><text class="cap" x="40" y="474" text-anchor="start">second: a frequency, not a duration. When the units do not come out as the thing being</text><text class="cap" x="40" y="494" text-anchor="start">asked for, the calculation is wrong.</text></svg><figcaption>The whole puzzle is one division, so it is worth doing slowly. The unit check takes five seconds and catches the most common class of error in this subject; use it on every claim in this series, including the ones made here.</figcaption></figure>
