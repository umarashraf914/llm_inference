<figure><div class='ts'>Fig 65 &nbsp;&middot;&nbsp; 2:41</div><h3>Doing the division</h3><svg viewBox='0 0 680 394' role='img'><title>Doing the division</title><text class="hd" x="40" y="46">Dividing powers of ten: subtract the exponents</text><g class="u"><rect x="90" y="70" width="500" height="42" rx="6"/><text class="sub" x="340.0" y="91.0" text-anchor="middle" dominant-baseline="central">10^11 operations  /  10^15 operations per second</text></g><line class="conn" x1="340" y1="124" x2="340" y2="144" marker-end="url(#arw)"/><g class="m"><rect x="90" y="150" width="500" height="42" rx="6"/><text class="sub" x="340.0" y="171.0" text-anchor="middle" dominant-baseline="central">=  10^(11 - 15)  =  10^-4 seconds</text></g><line class="conn" x1="340" y1="204" x2="340" y2="224" marker-end="url(#arw)"/><g class="s"><rect x="90" y="230" width="500" height="42" rx="6"/><text class="sub" x="340.0" y="251.0" text-anchor="middle" dominant-baseline="central">=  0.0001 seconds  =  0.1 milliseconds</text></g><text class="cap" x="40" y="316" text-anchor="start">A negative exponent means a fraction: ten to the minus four is one ten-thousandth.</text><text class="cap" x="40" y="352" text-anchor="start">And the units work out. Operations divided by operations-per-second leaves seconds, which is</text><text class="cap" x="40" y="372" text-anchor="start">what a duration should be. If they had not cancelled, something would be wrong.</text></svg><figcaption>The whole puzzle is one division, so it is worth doing slowly. Checking that the units cancel is the habit that catches most errors in this subject.</figcaption></figure>
