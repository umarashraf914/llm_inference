<figure><div class='ts'>Fig 138 &nbsp;&middot;&nbsp; 24:03</div><h3>Where the L in the cache formula comes from</h3><svg viewBox='0 0 680 424' role='img'><title>Where the L in the cache formula comes from</title><g class="m"><rect x="40" y="46" width="600" height="42" rx="6"/><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">cache = 2  x  layers  x  KV heads  x  head dimension  x  bytes</text></g><text class="cap" x="40" y="122" text-anchor="start">You have seen this formula already. The question you just asked is exactly what the second term</text><text class="cap" x="40" y="142" text-anchor="start">is doing there.</text><text class="hd" x="40" y="192">If Q, K and V were computed once</text><g class="h"><rect x="340" y="192" width="110" height="28" rx="3"/><text class="sub" x="395.0" y="206.0" text-anchor="middle" dominant-baseline="central">no L at all</text></g><text class="hd" x="40" y="244">Because every layer computes its own</text><g class="s"><rect x="340" y="244" width="110" height="28" rx="3"/><text class="sub" x="395.0" y="258.0" text-anchor="middle" dominant-baseline="central">x 80</text></g><text class="cap" x="40" y="306" text-anchor="start">Each layer produces a different key and a different value for the same token, from a different</text><text class="cap" x="40" y="326" text-anchor="start">input and with different weights. All eighty have to be kept, because layer 40 attending to an</text><text class="cap" x="40" y="346" text-anchor="start">earlier token needs layer 40's key for it, not layer 1's.</text><text class="cap" x="40" y="382" text-anchor="start">So the cache holds eighty keys and eighty values per token, and the L in that formula is the</text><text class="cap" x="40" y="402" text-anchor="start">direct consequence of what you asked about.</text></svg><figcaption>The payoff. If the projection happened once, the cache would be eighty times smaller and most of this series would not exist.</figcaption></figure>
