<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 24:10</div><h3>Where the 80 in the cache comes from</h3><svg viewBox='0 0 680 346' role='img'><title>Where the 80 in the cache comes from</title><text class="hd" x="40" y="46">Why every layer's key has to be kept, not just one</text><text class="cap" x="40" y="72" text-anchor="start">if the key were computed once, from the token alone</text><g class="u"><rect x="60" y="82" width="360" height="30" rx="4"/><text class="sub" x="240.0" y="97.0" text-anchor="middle" dominant-baseline="central">one key per token: no factor of 80</text></g><text class="cap" x="40" y="144" text-anchor="start">each layer computes its own, from its own input</text><g class="s"><rect x="60" y="154" width="360" height="30" rx="4"/><text class="sub" x="240.0" y="169.0" text-anchor="middle" dominant-baseline="central">80 keys per token, all different</text></g><text class="cap" x="40" y="220" text-anchor="start">A layer's key for a token is that layer's input vector times that layer's W_K</text><text class="cap" x="40" y="240" text-anchor="start">({{fig:v01-o098}}). The input differs at every layer, because each layer adds its result to</text><text class="cap" x="40" y="260" text-anchor="start">the residual stream ({{fig:v01-p19}}), and so does W_K. So the key differs at every layer.</text><text class="cap" x="40" y="300" text-anchor="start">Layer 40, attending to an earlier token, needs layer 40's key for it, not layer 1's. All</text><text class="cap" x="40" y="320" text-anchor="start">eighty have to be kept, which is where the factor of 80 in the cache's size comes from.</text></svg><figcaption>If the projection happened once, the cache would be eighty times smaller and most of this series would not exist.</figcaption></figure>
