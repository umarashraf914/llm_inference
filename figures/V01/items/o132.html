<figure><div class='ts'>Fig 132 &nbsp;&middot;&nbsp; 21:23</div><h3>Why decode cannot be parallelised</h3><svg viewBox="0 0 680 442" role="img"><title>Why decode cannot be parallelised</title><text class="hd" x="40" y="46">Attention is causal: a token sees only what came before it</text><g class="s"><rect x="200" y="66" width="48" height="32" rx="3"></rect></g><g class="u"><rect x="256" y="66" width="48" height="32" rx="3"></rect></g><g class="u"><rect x="312" y="66" width="48" height="32" rx="3"></rect></g><g class="u"><rect x="368" y="66" width="48" height="32" rx="3"></rect></g><g class="u"><rect x="424" y="66" width="48" height="32" rx="3"></rect></g><g class="s"><rect x="200" y="106" width="48" height="32" rx="3"></rect></g><g class="s"><rect x="256" y="106" width="48" height="32" rx="3"></rect></g><g class="u"><rect x="312" y="106" width="48" height="32" rx="3"></rect></g><g class="u"><rect x="368" y="106" width="48" height="32" rx="3"></rect></g><g class="u"><rect x="424" y="106" width="48" height="32" rx="3"></rect></g><g class="s"><rect x="200" y="146" width="48" height="32" rx="3"></rect></g><g class="s"><rect x="256" y="146" width="48" height="32" rx="3"></rect></g><g class="s"><rect x="312" y="146" width="48" height="32" rx="3"></rect></g><g class="u"><rect x="368" y="146" width="48" height="32" rx="3"></rect></g><g class="u"><rect x="424" y="146" width="48" height="32" rx="3"></rect></g><g class="s"><rect x="200" y="186" width="48" height="32" rx="3"></rect></g><g class="s"><rect x="256" y="186" width="48" height="32" rx="3"></rect></g><g class="s"><rect x="312" y="186" width="48" height="32" rx="3"></rect></g><g class="s"><rect x="368" y="186" width="48" height="32" rx="3"></rect></g><g class="u"><rect x="424" y="186" width="48" height="32" rx="3"></rect></g><g class="s"><rect x="200" y="226" width="48" height="32" rx="3"></rect></g><g class="s"><rect x="256" y="226" width="48" height="32" rx="3"></rect></g><g class="s"><rect x="312" y="226" width="48" height="32" rx="3"></rect></g><g class="s"><rect x="368" y="226" width="48" height="32" rx="3"></rect></g><g class="s"><rect x="424" y="226" width="48" height="32" rx="3"></rect></g><text class="sub2" x="40" y="88" text-anchor="start">token 1</text><text class="sub2" x="40" y="248" text-anchor="start">token 5</text><text class="sub2" x="200" y="296" text-anchor="start">keys it may attend to</text><text class="cap" x="40" y="340" text-anchor="start">A token at position t can attend to positions 0 through t, never forward. In prefill every</text><text class="cap" x="40" y="360" text-anchor="start">token exists at once, so all of this can be computed in parallel.</text><text class="cap" x="40" y="400" text-anchor="start">In decode the token at position t does not exist until the one before it has been generated.</text><text class="cap" x="40" y="420" text-anchor="start">That is the sequential dependency, and it comes from the mask, not from the hardware.</text></svg><figcaption>The triangle is the whole reason the two phases behave differently. Prefill fills it in one shot; decode adds one row at a time.</figcaption></figure>
