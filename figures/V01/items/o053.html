<figure><div class='ts'>Fig 53 &nbsp;&middot;&nbsp; 0:46</div><h3>A day later: what survives and what does not</h3><svg viewBox='0 0 680 434' role='img'><title>A day later: what survives and what does not</title><text class="hd" x="40" y="46">One day later, the same follow-up as case A</text><text class="sub2" x="40" y="92" text-anchor="start">arriving</text><g class="s"><rect x="150" y="76" width="90" height="30" rx="3"/><text class="sub" x="195.0" y="91.0" text-anchor="middle" dominant-baseline="central">system</text></g><g class="s"><rect x="244" y="76" width="110" height="30" rx="3"/><text class="sub" x="299.0" y="91.0" text-anchor="middle" dominant-baseline="central">tools</text></g><g class="h"><rect x="358" y="76" width="110" height="30" rx="3"/><text class="sub" x="413.0" y="91.0" text-anchor="middle" dominant-baseline="central">question 1</text></g><g class="h"><rect x="472" y="76" width="96" height="30" rx="3"/><text class="sub" x="520.0" y="91.0" text-anchor="middle" dominant-baseline="central">answer 1</text></g><g class="h"><rect x="572" y="76" width="68" height="30" rx="3"/><text class="sub" x="606.0" y="91.0" text-anchor="middle" dominant-baseline="central">new</text></g><text class="sub2" x="40" y="152" text-anchor="start">in the cache</text><g class="s"><rect x="150" y="136" width="90" height="30" rx="3"/></g><g class="s"><rect x="244" y="136" width="110" height="30" rx="3"/></g><rect x="358" y="136" width="282" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="499.0" y="151.0" text-anchor="middle" dominant-baseline="central">evicted overnight</text><g class="h"><rect x="140" y="196" width="400" height="42" rx="6"/><text class="sub" x="340.0" y="217.0" text-anchor="middle" dominant-baseline="central">hit 770   ·   prefill 18 tokens</text></g><text class="cap" x="40" y="280" text-anchor="start">Your conversation is gone, so its history has to be turned back into keys and values from the</text><text class="cap" x="40" y="300" text-anchor="start">text, which is what prefill is.</text><text class="cap" x="40" y="336" text-anchor="start">The preamble is probably still there. Thousands of other conversations share those exact 770</text><text class="cap" x="40" y="356" text-anchor="start">tokens, so on a busy machine somebody has kept them warm for you.</text><text class="cap" x="40" y="392" text-anchor="start">That only helps if your request lands on the same machine, which is why serving systems route</text><text class="cap" x="40" y="412" text-anchor="start">requests by which machine already holds their prefix.</text></svg><figcaption>The shared preamble usually survives because it is shared. Your own conversation does not, because nobody else was keeping it alive.</figcaption></figure>
