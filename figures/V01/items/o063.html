<figure><div class='ts'>Fig 63 &nbsp;&middot;&nbsp; 2:43</div><h3>A count and a rate are different things</h3><svg viewBox="0 0 680 342" role="img"><title>A count and a rate are different things</title><g class="m"><rect x="50" y="55" width="265" height="76" rx="8"></rect><text class="lbl" x="182.5" y="76.0" text-anchor="middle" dominant-baseline="central">A count</text><text class="sub" x="182.5" y="94.0" text-anchor="middle" dominant-baseline="central">how many operations a job needs</text><text class="sub" x="182.5" y="111.0" text-anchor="middle" dominant-baseline="central">no time in it at all</text></g><g class="h"><rect x="365" y="55" width="265" height="76" rx="8"></rect><text class="lbl" x="497.5" y="76.0" text-anchor="middle" dominant-baseline="central">A rate</text><text class="sub" x="497.5" y="94.0" text-anchor="middle" dominant-baseline="central">how many a chip does per second</text><text class="sub" x="497.5" y="111.0" text-anchor="middle" dominant-baseline="central">time is built in</text></g><g class="s"><rect x="190" y="156" width="300" height="42" rx="6"></rect><text class="sub" x="340.0" y="177.0" text-anchor="middle" dominant-baseline="central">count / rate  =  seconds</text></g><text class="cap" x="40" y="244" text-anchor="start">The two are written almost identically, FLOP and FLOPS, and confusing them is the single most</text><text class="cap" x="40" y="264" text-anchor="start">common mistake in this subject.</text><text class="cap" x="40" y="300" text-anchor="start">A useful test: if a sentence about performance does not survive being checked for units, one</text><text class="cap" x="40" y="320" text-anchor="start">of the two is being used where the other belongs.</text></svg><figcaption>The division in the middle is the entire calculation the next few figures perform.</figcaption></figure>
