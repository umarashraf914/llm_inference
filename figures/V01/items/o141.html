<figure><div class='ts'>Fig 141 &nbsp;&middot;&nbsp; 25:00</div><h3>The cache and the weights compete</h3><svg viewBox="0 0 680 394" role="img"><title>The cache and the weights compete</title><g class="h"><rect x="40" y="40" width="600" height="148" rx="14"></rect><text class="lbl" x="62" y="66">HBM, one bandwidth budget</text></g><g class="h"><rect x="66" y="96" width="300" height="40" rx="4"></rect><text class="sub" x="216.0" y="116.0" text-anchor="middle" dominant-baseline="central">the weights, read every step</text></g><g class="s"><rect x="378" y="96" width="238" height="40" rx="4"></rect><text class="sub" x="497.0" y="116.0" text-anchor="middle" dominant-baseline="central">the cache, read every step</text></g><text class="sub2" x="66" y="164" text-anchor="start">both draw on the same bus</text><text class="cap" x="40" y="232" text-anchor="start">Every decode step reads every weight and also reads every cache entry up to the current</text><text class="cap" x="40" y="252" text-anchor="start">position. The bigger the cache grows, the more bytes per token, and the lower the throughput</text><text class="cap" x="40" y="272" text-anchor="start">ceiling derived earlier.</text><text class="cap" x="40" y="312" text-anchor="start">The model and the conversational state of the request compete for the same resource. That</text><text class="cap" x="40" y="332" text-anchor="start">competition shapes every technique in the rest of the series: shrinking the cache, sharing it</text><text class="cap" x="40" y="352" text-anchor="start">across requests with a common prefix, splitting it across machines, or refusing to materialise</text><text class="cap" x="40" y="372" text-anchor="start">parts of it at all.</text></svg><figcaption>Two different things reading from one budget. Once the cache is large, optimising the weights alone stops being enough.</figcaption></figure>
