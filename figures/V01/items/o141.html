<figure><div class='ts'>Fig 141 &nbsp;&middot;&nbsp; 25:00</div><h3>The cache and the weights compete</h3><svg viewBox="0 0 680 434" role="img"><title>The cache and the weights compete</title><g class="h"><rect x="40" y="40" width="600" height="148" rx="14"></rect><text class="lbl" x="62" y="66">HBM, one bandwidth budget</text></g><g class="h"><rect x="66" y="96" width="300" height="40" rx="4"></rect><text class="sub" x="216.0" y="116.0" text-anchor="middle" dominant-baseline="central">the weights, read every step</text></g><g class="s"><rect x="378" y="96" width="238" height="40" rx="4"></rect><text class="sub" x="497.0" y="116.0" text-anchor="middle" dominant-baseline="central">the cache, read every step</text></g><text class="sub2" x="66" y="164" text-anchor="start">both draw on the same bus</text><text class="cap" x="40" y="232" text-anchor="start">Every decode step reads every weight and also every key and value kept so far. The</text><text class="cap" x="40" y="252" text-anchor="start">bigger the cache grows, the more bytes per token, and the lower the throughput ceiling</text><text class="cap" x="40" y="272" text-anchor="start">of {{fig:v01-o130}}.</text><text class="cap" x="40" y="312" text-anchor="start">The model and the conversation compete for the same resource, and that competition</text><text class="cap" x="40" y="332" text-anchor="start">shapes every technique in the rest of the series. Some shrink the cache by storing keys</text><text class="cap" x="40" y="352" text-anchor="start">and values differently; some share it across requests that begin with the same text</text><text class="cap" x="40" y="372" text-anchor="start">(Parts 12 to 14); some split it across machines; some refuse to keep parts of it at all;</text><text class="cap" x="40" y="392" text-anchor="start">and some accept that one conversation cannot be sped up past a point and spread the cost</text><text class="cap" x="40" y="412" text-anchor="start">across many conversations running at once.</text></svg><figcaption>Two different things reading from one budget. Once the cache is large, optimising the weights alone stops being enough.</figcaption></figure>
