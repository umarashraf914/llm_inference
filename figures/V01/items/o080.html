<figure><div class='ts'>Fig 80 &nbsp;&middot;&nbsp; 4:36</div><h3>Reading a specification</h3><svg viewBox='0 0 680 374' role='img'><title>Reading a specification</title><text class="hd" x="40" y="46">A specification sheet, and what each line is</text><text class="cap" x="40" y="92" text-anchor="start">Memory capacity</text><g class="u"><rect x="250" y="74" width="140" height="30" rx="3"/><text class="sub" x="320.0" y="89.0" text-anchor="middle" dominant-baseline="central">80 GB</text></g><text class="sub2" x="410" y="92" text-anchor="start">an amount</text><text class="cap" x="40" y="136" text-anchor="start">Memory bandwidth</text><g class="h"><rect x="250" y="118" width="140" height="30" rx="3"/><text class="sub" x="320.0" y="133.0" text-anchor="middle" dominant-baseline="central">3.35 TB/s</text></g><text class="sub2" x="410" y="136" text-anchor="start">a rate</text><text class="cap" x="40" y="180" text-anchor="start">Peak compute</text><g class="m"><rect x="250" y="162" width="140" height="30" rx="3"/><text class="sub" x="320.0" y="177.0" text-anchor="middle" dominant-baseline="central">989 TFLOP/s</text></g><text class="sub2" x="410" y="180" text-anchor="start">a rate</text><text class="cap" x="40" y="224" text-anchor="start">Power draw</text><g class="u"><rect x="250" y="206" width="140" height="30" rx="3"/><text class="sub" x="320.0" y="221.0" text-anchor="middle" dominant-baseline="central">700 W</text></g><text class="sub2" x="410" y="224" text-anchor="start">a rate</text><text class="cap" x="40" y="276" text-anchor="start">Three of the four are rates and one is an amount. Confusing capacity with bandwidth is the</text><text class="cap" x="40" y="296" text-anchor="start">single most common error when reading these.</text><text class="cap" x="40" y="332" text-anchor="start">Capacity says whether the model fits at all. Bandwidth says how fast it can be read once it</text><text class="cap" x="40" y="352" text-anchor="start">does. They are separate limits and a chip can fail either one.</text></svg><figcaption>Every figure quoted in this series comes off a sheet like this. Knowing which line is an amount and which is a rate is enough to sort most claims.</figcaption></figure>
