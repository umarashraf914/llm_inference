<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:50</div><h3>The arithmetic finishes almost instantly</h3><svg viewBox='0 0 680 424' role='img'><title>The arithmetic finishes almost instantly</title><text class="cap" x="40" y="82" text-anchor="start">What the chip can do</text><g class="s"><rect x="250" y="62" width="300" height="32" rx="3"/><text class="sub" x="400.0" y="78.0" text-anchor="middle" dominant-baseline="central">about 10^15 operations per second</text></g><text class="cap" x="40" y="134" text-anchor="start">What one token needs</text><g class="m"><rect x="250" y="114" width="300" height="32" rx="3"/><text class="sub" x="400.0" y="130.0" text-anchor="middle" dominant-baseline="central">about 10^11 operations</text></g><g class="m"><rect x="140" y="176" width="400" height="42" rx="6"/><text class="sub" x="340.0" y="197.0" text-anchor="middle" dominant-baseline="central">10^11 ÷ 10^15  =  0.1 milliseconds of arithmetic</text></g><text class="cap" x="40" y="258" text-anchor="start">A quadrillion operations a second is a trillion in every millisecond. The arithmetic for</text><text class="cap" x="40" y="278" text-anchor="start">one token, a hundred billion operations, takes a tenth of a millisecond.</text><text class="cap" x="40" y="318" text-anchor="start">The budget is thirty milliseconds. On the arithmetic alone the chip could have finished</text><text class="cap" x="40" y="338" text-anchor="start">299 more tokens in the time left over: 300 in all.</text><text class="cap" x="40" y="378" text-anchor="start">The 10^11 is two operations for each of the model's 70 billion weights; {{fig:v01-o111}}</text><text class="cap" x="40" y="398" text-anchor="start">shows where the two comes from.</text></svg><figcaption>Two numbers and a division. Everything in this atlas is an answer to why the remaining 29.9 milliseconds are not free.</figcaption></figure>
