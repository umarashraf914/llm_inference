<figure><div class='ts'>Fig 64 &nbsp;&middot;&nbsp; 2:41</div><h3>The arithmetic finishes almost instantly</h3><svg viewBox="0 0 680 350" role="img"><title>The arithmetic finishes almost instantly</title><text class="cap" x="40" y="78" text-anchor="start">What the chip can do</text><g class="s"><rect x="280" y="62" width="340" height="32" rx="3"></rect><text class="sub" x="450.0" y="78.0" text-anchor="middle" dominant-baseline="central">about 10^15 operations per second</text></g><text class="cap" x="40" y="138" text-anchor="start">What one token needs</text><g class="m"><rect x="280" y="122" width="34" height="32" rx="3"></rect></g><text class="sub2" x="324" y="141" text-anchor="start">about 10^11 operations</text><g class="m"><rect x="140" y="176" width="400" height="42" rx="6"></rect><text class="sub" x="340.0" y="197.0" text-anchor="middle" dominant-baseline="central">10^11 / 10^15  =  0.1 milliseconds of arithmetic</text></g><text class="cap" x="40" y="258" text-anchor="start">A quadrillion operations a second is a trillion in every millisecond. The arithmetic for one</text><text class="cap" x="40" y="278" text-anchor="start">token takes a tenth of a millisecond.</text><text class="cap" x="40" y="308" text-anchor="start">The budget is thirty milliseconds. On the arithmetic alone the chip could have finished three</text><text class="cap" x="40" y="328" text-anchor="start">hundred more tokens in the time left over.</text></svg><figcaption>Two numbers and a division. Everything in this video is an answer to why the remaining 29.9 milliseconds are not free.</figcaption></figure>
