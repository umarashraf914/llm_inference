one weight to useful accuracy</text><g class="h"><rect x="120" y="250" width="440" height="42" rx="6"></rect><text class="sub" x="340.0" y="271.0" text-anchor="middle" dominant-baseline="central">70 billion weights  x  2 bytes  =  140 gigabytes</text></g><text class="cap" x="40" y="336" text-anchor="start">A gigabyte is a billion bytes. So the model, written down, is a hundred and forty</text><text class="cap" x="40" y="356" text-anchor="start">billion bytes: a file far too large to sit anywhere except in the memory.</text><text class="cap" x="40" y="396" text-anchor="start">How many bits a weight gets is a real design choice, and shrinking it is the subject of</text><text class="cap" x="40" y="416" text-anchor="start">the fourth video. Sixteen is the common default. The next two figures show what a</text><text class="cap" x="40" y="436" text-anchor="start">pattern of bits means and what sixteen of them can hold.</text></svg><figcaption>This conversion, from a parameter count to a byte count, is used constantly from here on.</figcaption></figure>
