<figure><div class='ts'>Fig 68 &nbsp;&middot;&nbsp; 3:04</div><h3>What three hundred times looks like</h3><svg viewBox='0 0 680 372' role='img'><title>What three hundred times looks like</title><text class="hd" x="40" y="46">The gap, as a ratio</text><text class="cap" x="40" y="92" text-anchor="start">arithmetic</text><g class="m"><rect x="230" y="76" width="1.3" height="32" rx="1"/></g><text class="sub2" x="244" y="96" text-anchor="start">0.1 ms</text><text class="cap" x="40" y="152" text-anchor="start">the budget</text><g class="h"><rect x="230" y="136" width="390" height="32" rx="3"/><text class="sub" x="425.0" y="152.0" text-anchor="middle" dominant-baseline="central">30 ms</text></g><g class="s"><rect x="190" y="190" width="300" height="42" rx="6"/><text class="sub" x="340.0" y="211.0" text-anchor="middle" dominant-baseline="central">30 / 0.1  =  300</text></g><text class="cap" x="40" y="274" text-anchor="start">Three hundred times. Both bars are drawn to the same scale, which is why the first one is</text><text class="cap" x="40" y="294" text-anchor="start">barely visible.</text><text class="cap" x="40" y="330" text-anchor="start">Another way to say it: on the arithmetic alone, the chip could have produced three hundred</text><text class="cap" x="40" y="350" text-anchor="start">tokens in the time it takes to produce one.</text></svg><figcaption>Ratios stated in words are easy to nod along to. Drawn to scale, the same claim is much harder to skim past.</figcaption></figure>
