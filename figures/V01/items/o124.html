<figure><div class='ts'>Fig 124 &nbsp;&middot;&nbsp; 16:08</div><h3>Why the roofline bends</h3><svg viewBox='0 0 680 458' role='img'><title>Why the roofline bends</title><text class="hd" x="40" y="46">Why the picture has a corner</text><line class="axis" x1="90" y1="250" x2="620" y2="250"/><line class="axis" x1="90" y1="60" x2="90" y2="250"/><polyline class="pl-h" points="90,250 330,120 620,120"/><text class="sub2 halo" x="150" y="210" text-anchor="start">here, more arithmetic per byte</text><text class="sub2 halo" x="150" y="232" text-anchor="start">means more speed</text><text class="sub2" x="370" y="168" text-anchor="start">here it does not: the arithmetic</text><text class="sub2" x="370" y="190" text-anchor="start">units are already full</text><line class="tick xok" x1="330" y1="120" x2="330" y2="250"/><text class="sub2" x="330" y="274" text-anchor="middle">the corner</text><text class="cap" x="40" y="324" text-anchor="start">On the left the memory is the bottleneck, so anything that gets more work out of each byte</text><text class="cap" x="40" y="344" text-anchor="start">raises the line. On the right the arithmetic is the bottleneck, and it cannot go faster.</text><text class="cap" x="40" y="380" text-anchor="start">The corner is where the two limits are equal. Left of it, improve the bytes; right of it,</text><text class="cap" x="40" y="400" text-anchor="start">improving the bytes buys nothing.</text><text class="cap" x="40" y="436" text-anchor="start">That is the entire diagram. The next figure gives the corner a number.</text></svg><figcaption>Schematic. The shape is not a convention to memorise: it is what happens when two independent limits are drawn on the same axes and the lower one always wins.</figcaption></figure>
