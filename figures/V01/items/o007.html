<figure><div class='ts'>Fig 07 &nbsp;&middot;&nbsp; 0:00</div><h3>Generating means running the model again and again</h3><svg viewBox="0 0 680 362" role="img"><title>Generating means running the model again and again</title><g class="u"><rect x="40" y="40" width="600" height="148" rx="14"></rect><text class="lbl" x="62" y="66">One turn of the loop</text></g><g class="s"><rect x="66" y="96" width="150" height="44" rx="4"></rect><text class="sub" x="141.0" y="118.0" text-anchor="middle" dominant-baseline="central">text so far</text></g><line class="conn" x1="222" y1="118" x2="246" y2="118" marker-end="url(#arw)"></line><g class="h"><rect x="252" y="96" width="170" height="44" rx="4"></rect><text class="sub" x="337.0" y="118.0" text-anchor="middle" dominant-baseline="central">run the whole model</text></g><line class="conn" x1="428" y1="118" x2="452" y2="118" marker-end="url(#arw)"></line><g class="m"><rect x="458" y="96" width="156" height="44" rx="4"></rect><text class="sub" x="536.0" y="118.0" text-anchor="middle" dominant-baseline="central">one new token</text></g><line class="conn" x1="536" y1="146" x2="536" y2="166" marker-end="url(#arw)"></line><line class="conn" x1="536" y1="166" x2="142" y2="166"></line><line class="conn" x1="142" y1="166" x2="142" y2="146" marker-end="url(#arw)"></line><text class="sub2" x="66" y="214" text-anchor="start">append it to the text and go round again</text><text class="cap" x="40" y="264" text-anchor="start">The model does not write a sentence. It predicts one token, that token is added to the end of</text><text class="cap" x="40" y="284" text-anchor="start">the text, and the entire model runs again from the start to predict the next one.</text><text class="cap" x="40" y="320" text-anchor="start">A two-hundred-word answer means running the whole seventy-billion-parameter model about three</text><text class="cap" x="40" y="340" text-anchor="start">hundred times, once per token.</text></svg><figcaption>This loop is the shape of the
