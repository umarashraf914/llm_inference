<figure><div class='ts'>Fig 33 &nbsp;&middot;&nbsp; 25:43</div><h3>Two things the cache does</h3><svg viewBox='0 0 680 398' role='img'><title>Two things the cache does</title><text class="hd" x="40" y="46">The same cache, doing two quite different jobs</text><g class="m"><rect x="40" y="74" width="285" height="88" rx="8"/><text class="lbl" x="182.5" y="101.0" text-anchor="middle" dominant-baseline="central">During a turn</text><text class="sub" x="182.5" y="119.0" text-anchor="middle" dominant-baseline="central">it grows.</text><text class="sub" x="182.5" y="136.0" text-anchor="middle" dominant-baseline="central">One new entry per token, no lookup.</text></g><g class="s"><rect x="355" y="74" width="285" height="88" rx="8"/><text class="lbl" x="497.5" y="101.0" text-anchor="middle" dominant-baseline="central">At the start of a turn</text><text class="sub" x="497.5" y="119.0" text-anchor="middle" dominant-baseline="central">it is searched.</text><text class="sub" x="497.5" y="136.0" text-anchor="middle" dominant-baseline="central">How much of the prompt is already held?</text></g><text class="cap" x="40" y="208" text-anchor="start">Inside an answer there is no such thing as a cache hit. Nothing is looked up; each token</text><text class="cap" x="40" y="228" text-anchor="start">simply appends its keys and values to the end ({{fig:v01-o136}}).</text><text class="cap" x="40" y="264" text-anchor="start">The lookup happens once, when a new request arrives. The server asks: do I already hold keys</text><text class="cap" x="40" y="284" text-anchor="start">and values for the beginning of this prompt?</text><text class="cap" x="40" y="320" text-anchor="start">If yes, those tokens skip prefill entirely. That is a cache hit, and it is what people mean by</text><text class="cap" x="40" y="340" text-anchor="start">a warm cache.</text><text class="cap" x="40" y="376" text-anchor="start">Two jobs, two different moments. Confusing them makes the word cache do too much work.</text></svg><figcaption>Growing and being searched are different operations at different times. Only the second one can hit or miss.</figcaption></figure>
