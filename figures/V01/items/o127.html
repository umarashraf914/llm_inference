<figure><div class='ts'>Fig 127 &nbsp;&middot;&nbsp; 16:21</div><h3>What the roofline ignores</h3><svg viewBox="0 0 680 214" role="img"><title>What the roofline ignores</title><g class="u"><rect x="40" y="55" width="185" height="70" rx="8"></rect><text class="lbl" x="132.5" y="81.0" text-anchor="middle" dominant-baseline="central">One memory level</text><text class="sub" x="132.5" y="99.0" text-anchor="middle" dominant-baseline="central">no cache hierarchy</text></g><g class="u"><rect x="248" y="55" width="185" height="70" rx="8"></rect><text class="lbl" x="340.5" y="81.0" text-anchor="middle" dominant-baseline="central">No launch latency</text><text class="sub" x="340.5" y="99.0" text-anchor="middle" dominant-baseline="central">work starts instantly</text></g><g class="u"><rect x="456" y="55" width="184" height="70" rx="8"></rect><text class="lbl" x="548.0" y="81.0" text-anchor="middle" dominant-baseline="central">Perfect pipelining</text><text class="sub" x="548.0" y="99.0" text-anchor="middle" dominant-baseline="central">no bubbles</text></g><text class="cap" x="40" y="166" text-anchor="start">A simplification on every count. As a first-order diagnostic for whether a workload will</text><text class="cap" x="40" y="186" text-anchor="start">starve the maths units or starve the memory bus, it has held up since 2009.</text></svg><figcaption>Knowing the model's assumptions is what lets you trust it where it applies and distrust it where it does not.</figcaption></figure>
