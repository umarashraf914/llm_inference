<figure><div class='ts'>Fig 94 &nbsp;&middot;&nbsp; 7:53</div><h3>Attention, in one sentence</h3><svg viewBox='0 0 680 582' role='img'><title>Attention, in one sentence</title><text class="hd" x="40" y="46">Attention is a weighted average of the other tokens</text><g class="u"><rect x="40" y="76" width="130" height="34" rx="4"/><text class="sub" x="105.0" y="93.0" text-anchor="middle" dominant-baseline="central">this token asks</text></g><text class="cap" x="40" y="150" text-anchor="start">the</text><g class="u"><rect x="150" y="132" width="21.0" height="30" rx="3"/></g><text class="sub2" x="183.0" y="150" text-anchor="start">0.05</text><text class="cap" x="40" y="190" text-anchor="start">cat</text><g class="m"><rect x="150" y="172" width="260.4" height="30" rx="3"/></g><text class="sub2" x="422.4" y="190" text-anchor="start">0.62</text><text class="cap" x="40" y="230" text-anchor="start">sat</text><g class="m"><rect x="150" y="212" width="117.60000000000001" height="30" rx="3"/></g><text class="sub2" x="279.6" y="230" text-anchor="start">0.28</text><text class="cap" x="40" y="270" text-anchor="start">down</text><g class="u"><rect x="150" y="252" width="21.0" height="30" rx="3"/></g><text class="sub2" x="183.0" y="270" text-anchor="start">0.05</text><text class="sub2" x="150" y="322" text-anchor="start">how much each earlier token counts, adding to 1.00</text><line class="conn" x1="340" y1="340" x2="340" y2="362" marker-end="url(#arw)"/><g class="s"><rect x="230" y="366" width="220" height="34" rx="4"/><text class="sub" x="340.0" y="383.0" text-anchor="middle" dominant-baseline="central">the blended result</text></g><text class="cap" x="40" y="448" text-anchor="start">The values being blended are the earlier tokens' vectors. The weights are worked out by</text><text class="cap" x="40" y="468" text-anchor="start">comparing this token's query against each of their keys.</text><text class="cap" x="40" y="504" text-anchor="start">So query, key and value are three roles in one weighted average: the query asks, the keys</text><text class="cap" x="40" y="524" text-anchor="start">decide the weights, and the values are what gets averaged.</text><text class="cap" x="40" y="560" text-anchor="start">Weights are illustrative. What is not illustrative is that they always add to one.</text></svg><figcaption>The three-letter names stop being mysterious once you see they are the three parts of a weighted average: who is asking, how much each counts, and what is being averaged.</figcaption></figure>
