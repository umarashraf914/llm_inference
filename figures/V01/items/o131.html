<figure><div class='ts'>Fig 131 &nbsp;&middot;&nbsp; 20:42</div><h3>Why the work grows as the answer gets longer</h3><svg viewBox='0 0 680 418' role='img'><title>Why the work grows as the answer gets longer</title><text class="hd" x="40" y="46">Every new token re-reads the whole conversation</text><g class="s"><rect x="60" y="70" width="64" height="34" rx="3"/><text class="sub" x="92.0" y="87.0" text-anchor="middle" dominant-baseline="central">t1</text></g><g class="s"><rect x="134" y="70" width="64" height="34" rx="3"/><text class="sub" x="166.0" y="87.0" text-anchor="middle" dominant-baseline="central">t2</text></g><g class="s"><rect x="208" y="70" width="64" height="34" rx="3"/><text class="sub" x="240.0" y="87.0" text-anchor="middle" dominant-baseline="central">t3</text></g><g class="m"><rect x="282" y="70" width="64" height="34" rx="3"/><text class="sub" x="314.0" y="87.0" text-anchor="middle" dominant-baseline="central">t4</text></g><text class="sub2" x="366" y="92" text-anchor="start">reads 4</text><g class="s"><rect x="60" y="124" width="64" height="34" rx="3"/><text class="sub" x="92.0" y="141.0" text-anchor="middle" dominant-baseline="central">t1</text></g><g class="s"><rect x="134" y="124" width="64" height="34" rx="3"/><text class="sub" x="166.0" y="141.0" text-anchor="middle" dominant-baseline="central">t2</text></g><g class="s"><rect x="208" y="124" width="64" height="34" rx="3"/><text class="sub" x="240.0" y="141.0" text-anchor="middle" dominant-baseline="central">t3</text></g><g class="s"><rect x="282" y="124" width="64" height="34" rx="3"/><text class="sub" x="314.0" y="141.0" text-anchor="middle" dominant-baseline="central">t4</text></g><g class="m"><rect x="356" y="124" width="64" height="34" rx="3"/><text class="sub" x="388.0" y="141.0" text-anchor="middle" dominant-baseline="central">t5</text></g><text class="sub2" x="440" y="146" text-anchor="start">reads 5</text><g class="s"><rect x="60" y="178" width="64" height="34" rx="3"/><text class="sub" x="92.0" y="195.0" text-anchor="middle" dominant-baseline="central">t1</text></g><g class="s"><rect x="134" y="178" width="64" height="34" rx="3"/><text class="sub" x="166.0" y="195.0" text-anchor="middle" dominant-baseline="central">t2</text></g><g class="s"><rect x="208" y="178" width="64" height="34" rx="3"/><text class="sub" x="240.0" y="195.0" text-anchor="middle" dominant-baseline="central">t3</text></g><g class="s"><rect x="282" y="178" width="64" height="34" rx="3"/><text class="sub" x="314.0" y="195.0" text-anchor="middle" dominant-baseline="central">t4</text></g><g class="s"><rect x="356" y="178" width="64" height="34" rx="3"/><text class="sub" x="388.0" y="195.0" text-anchor="middle" dominant-baseline="central">t5</text></g><g class="m"><rect x="430" y="178" width="64" height="34" rx="3"/><text class="sub" x="462.0" y="195.0" text-anchor="middle" dominant-baseline="central">t6</text></g><text class="sub2" x="514" y="200" text-anchor="start">reads 6</text><text class="cap" x="40" y="264" text-anchor="start">The gold token is the new one. To produce it the model must attend over every token before it,</text><text class="cap" x="40" y="284" text-anchor="start">so the amount read grows with every step.</text><text class="cap" x="40" y="320" text-anchor="start">The model has no memory between steps. Whatever it needs about the earlier tokens must either</text><text class="cap" x="40" y="340" text-anchor="start">be recomputed or kept somewhere.</text><text class="cap" x="40" y="376" text-anchor="start">Recomputing means redoing the same work again and again. Keeping it means storing something</text><text class="cap" x="40" y="396" text-anchor="start">that grows. The next figures are about which of those is cheaper.</text></svg><figcaption>The picture behind the quadratic cost. Each row is one decode step, and each is longer than the last.</figcaption></figure>
