<figure><div class='ts'>Fig 122 &nbsp;&middot;&nbsp; 14:51</div><h3>How to read the diagram that follows</h3><svg viewBox='0 0 680 474' role='img'><title>How to read the diagram that follows</title><text class="hd" x="40" y="46">Reading a plot with two axes</text><line class="axis" x1="120" y1="250" x2="600" y2="250"/><line class="axis" x1="120" y1="70" x2="120" y2="250"/><g class="h"><rect x="340" y="150" width="10" height="10" rx="5"/></g><line class="tick" x1="120" y1="155" x2="336" y2="155"/><line class="tick" x1="345" y1="250" x2="345" y2="164"/><text class="sub2" x="112" y="158" text-anchor="end">y</text><text class="sub2" x="345" y="274" text-anchor="middle">x</text><text class="sub2" x="370" y="152" text-anchor="start">one point: one x, one y</text><text class="cap" x="40" y="320" text-anchor="start">A point is a pair. Read across to the vertical axis for one number, down to the horizontal</text><text class="cap" x="40" y="340" text-anchor="start">axis for the other.</text><text class="cap" x="40" y="376" text-anchor="start">On the diagram that follows, the horizontal axis is how much arithmetic a workload does per</text><text class="cap" x="40" y="396" text-anchor="start">byte, and the vertical axis is how fast it therefore runs.</text><text class="cap" x="40" y="432" text-anchor="start">Each workload is one point. Where it sits left to right is a property of the workload; how</text><text class="cap" x="40" y="452" text-anchor="start">high it can rise is a property of the chip.</text></svg><figcaption>Two sentences of orientation that make the next three figures readable, rather than a shape to be taken on trust.</figcaption></figure>
