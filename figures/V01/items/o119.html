<figure><div class='ts'>Fig 119 &nbsp;&middot;&nbsp; 14:04</div><h3>What bound by means</h3><svg viewBox='0 0 680 310' role='img'><title>What bound by means</title><text class="hd" x="40" y="46">A bottleneck is whichever step is slowest</text><g class="s"><rect x="40" y="70" width="170" height="40" rx="4"/><text class="sub" x="125.0" y="90.0" text-anchor="middle" dominant-baseline="central">fast step</text></g><line class="conn" x1="216" y1="90" x2="236" y2="90" marker-end="url(#arw)"/><g class="h"><rect x="242" y="70" width="170" height="40" rx="4"/><text class="sub" x="327.0" y="90.0" text-anchor="middle" dominant-baseline="central">slow step</text></g><line class="conn" x1="418" y1="90" x2="438" y2="90" marker-end="url(#arw)"/><g class="s"><rect x="444" y="70" width="170" height="40" rx="4"/><text class="sub" x="529.0" y="90.0" text-anchor="middle" dominant-baseline="central">fast step</text></g><text class="cap" x="40" y="156" text-anchor="start">Speeding up either fast step changes nothing at all. Only the slow one sets the pace, and</text><text class="cap" x="40" y="176" text-anchor="start">improving it is the only change that helps.</text><text class="cap" x="40" y="212" text-anchor="start">Everything on this chip has two possible bottlenecks: the arithmetic, or the memory. A</text><text class="cap" x="40" y="232" text-anchor="start">workload is described as bound by whichever it runs out of first.</text><text class="cap" x="40" y="268" text-anchor="start">Memory bound means the arithmetic units are idle waiting for data. Compute bound means the</text><text class="cap" x="40" y="288" text-anchor="start">memory has capacity to spare. Both are wasteful; they waste different things.</text></svg><figcaption>Two words used constantly and rarely defined. Nothing is ever bound by both at once, which is what makes the roofline a picture with two regions.</figcaption></figure>
