<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:27</div><h3>Each block adds its result to the vector it was handed</h3><svg viewBox='0 0 680 462' role='img'><title>Each block adds its result to the vector it was handed</title><text class="hd" x="40" y="46">One token's vector through one layer: two additions</text><text class="cap" x="40" y="85" text-anchor="start">the vector into the layer</text><g class="s"><rect x="270" y="66" width="62" height="28" rx="3"/><text class="sub" x="301.0" y="80.0" text-anchor="middle" dominant-baseline="central">0.4</text></g><g class="s"><rect x="340" y="66" width="62" height="28" rx="3"/><text class="sub" x="371.0" y="80.0" text-anchor="middle" dominant-baseline="central">−1.2</text></g><g class="s"><rect x="410" y="66" width="62" height="28" rx="3"/><text class="sub" x="441.0" y="80.0" text-anchor="middle" dominant-baseline="central">0.0</text></g><g class="s"><rect x="480" y="66" width="62" height="28" rx="3"/><text class="sub" x="511.0" y="80.0" text-anchor="middle" dominant-baseline="central">0.9</text></g><text class="cap" x="40" y="125" text-anchor="start">+ attention's change</text><g class="u"><rect x="270" y="106" width="62" height="28" rx="3"/><text class="sub" x="301.0" y="120.0" text-anchor="middle" dominant-baseline="central">0.1</text></g><g class="u"><rect x="340" y="106" width="62" height="28" rx="3"/><text class="sub" x="371.0" y="120.0" text-anchor="middle" dominant-baseline="central">0.3</text></g><g class="u"><rect x="410" y="106" width="62" height="28" rx="3"/><text class="sub" x="441.0" y="120.0" text-anchor="middle" dominant-baseline="central">−0.2</text></g><g class="u"><rect x="480" y="106" width="62" height="28" rx="3"/><text class="sub" x="511.0" y="120.0" text-anchor="middle" dominant-baseline="central">0.0</text></g><text class="cap" x="40" y="165" text-anchor="start">= after attention</text><g class="s"><rect x="270" y="146" width="62" height="28" rx="3"/><text class="sub" x="301.0" y="160.0" text-anchor="middle" dominant-baseline="central">0.5</text></g><g class="s"><rect x="340" y="146" width="62" height="28" rx="3"/><text class="sub" x="371.0" y="160.0" text-anchor="middle" dominant-baseline="central">−0.9</text></g><g class="s"><rect x="410" y="146" width="62" height="28" rx="3"/><text class="sub" x="441.0" y="160.0" text-anchor="middle" dominant-baseline="central">−0.2</text></g><g class="s"><rect x="480" y="146" width="62" height="28" rx="3"/><text class="sub" x="511.0" y="160.0" text-anchor="middle" dominant-baseline="central">0.9</text></g><line class="tick" x1="270" y1="140" x2="542" y2="140"/><text class="cap" x="40" y="205" text-anchor="start">+ feed-forward's change</text><g class="u"><rect x="270" y="186" width="62" height="28" rx="3"/><text class="sub" x="301.0" y="200.0" text-anchor="middle" dominant-baseline="central">0.0</text></g><g class="u"><rect x="340" y="186" width="62" height="28" rx="3"/><text class="sub" x="371.0" y="200.0" text-anchor="middle" dominant-baseline="central">0.2</text></g><g class="u"><rect x="410" y="186" width="62" height="28" rx="3"/><text class="sub" x="441.0" y="200.0" text-anchor="middle" dominant-baseline="central">0.1</text></g><g class="u"><rect x="480" y="186" width="62" height="28" rx="3"/><text class="sub" x="511.0" y="200.0" text-anchor="middle" dominant-baseline="central">−0.3</text></g><text class="cap" x="40" y="245" text-anchor="start">= the vector out of the layer</text><g class="s"><rect x="270" y="226" width="62" height="28" rx="3"/><text class="sub" x="301.0" y="240.0" text-anchor="middle" dominant-baseline="central">0.5</text></g><g class="s"><rect x="340" y="226" width="62" height="28" rx="3"/><text class="sub" x="371.0" y="240.0" text-anchor="middle" dominant-baseline="central">−0.7</text></g><g class="s"><rect x="410" y="226" width="62" height="28" rx="3"/><text class="sub" x="441.0" y="240.0" text-anchor="middle" dominant-baseline="central">−0.1</text></g><g class="s"><rect x="480" y="226" width="62" height="28" rx="3"/><text class="sub" x="511.0" y="240.0" text-anchor="middle" dominant-baseline="central">0.6</text></g><line class="tick" x1="270" y1="220" x2="542" y2="220"/><text class="cap" x="40" y="296" text-anchor="start">Neither block replaces the vector it is given. Each computes a change, and the change is</text><text class="cap" x="40" y="316" text-anchor="start">added to what came in, number by number: first plus first, second plus second. That is</text><text class="cap" x="40" y="336" text-anchor="start">all vector addition is.</text><text class="cap" x="40" y="376" text-anchor="start">The running vector that every layer adds to is called the residual stream. It is 8,192</text><text class="cap" x="40" y="396" text-anchor="start">numbers wide for every token from the first layer to the last, which is why layers can</text><text class="cap" x="40" y="416" text-anchor="start">be stacked: each hands on a vector of the shape it received ({{fig:v01-o096}}). Four</text><text class="cap" x="40" y="436" text-anchor="start">numbers are drawn; the values are illustrative.</text></svg><figcaption>Each layer writes into the same running sum instead of starting afresh. That is what lets eighty of them be stacked, each refining what the ones below produced.</figcaption></figure>
