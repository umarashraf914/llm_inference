<figure><div class='ts'>Fig 140 &nbsp;&middot;&nbsp; 24:21</div><h3>How big the cache gets</h3><svg viewBox="0 0 680 482" role="img"><title>How big the cache gets</title><g class="m"><rect x="40" y="46" width="600" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">cache per token = 2 x layers x KV heads x head dimension x bytes</text></g><text class="cap" x="40" y="120" text-anchor="start">The 2 is one key and one value. For Llama 3 70B: 80 layers, 8 key-value heads of dimension</text><text class="cap" x="40" y="140" text-anchor="start">128, at 16-bit precision.</text><g class="s"><rect x="120" y="170" width="440" height="42" rx="6"></rect><text class="sub" x="340.0" y="191.0" text-anchor="middle" dominant-baseline="central">2 x 80 x 8 x 128 x 2  =  327,680 bytes</text></g><text class="cap" x="40" y="250" text-anchor="start">About 320 kilobytes for every token held in context, and it scales linearly with conversation</text><text class="cap" x="40" y="270" text-anchor="start">length.</text><text class="cap" x="40" y="322" text-anchor="start">1,000 tokens</text><g class="h"><rect x="220" y="304" width="8" height="30" rx="3"></rect></g><text class="sub2" x="238" y="322" text-anchor="start">0.33 GB</text><text class="cap" x="40" y="366" text-anchor="start">10,000 tokens</text><g class="h"><rect x="220" y="348" width="40" height="30" rx="3"></rect></g><text class="sub2" x="270" y="366" text-anchor="start">3.3 GB</text><text class="cap" x="40" y="410" text-anchor="start">100,000 tokens</text><g class="h"><rect x="220" y="392" width="340" height="30" rx="3"></rect></g><text class="sub2" x="570" y="410" text-anchor="start">33 GB</text><text class="cap" x="40" y="460" text-anchor="start">At a hundred thousand tokens the cache is already about a quarter of the model's own footprint.</text></svg><figcaption>A formula worth memorising. It converts any model shape and any context length straight into gigabytes.</figcaption></figure>
