<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 24:21</div><h3>How big the cache gets</h3><svg viewBox='0 0 680 476' role='img'><title>How big the cache gets</title><text class="hd" x="40" y="46">Bytes per token, built term by term</text><g class="u"><rect x="40" y="66" width="64" height="32" rx="4"/><text class="sub" x="72.0" y="82.0" text-anchor="middle" dominant-baseline="central">2</text></g><text class="sub2" x="72" y="116" text-anchor="middle">key and value</text><text class="hd" x="112" y="87" text-anchor="start">×</text><g class="u"><rect x="130" y="66" width="64" height="32" rx="4"/><text class="sub" x="162.0" y="82.0" text-anchor="middle" dominant-baseline="central">80</text></g><text class="sub2" x="162" y="116" text-anchor="middle">layers</text><text class="hd" x="202" y="87" text-anchor="start">×</text><g class="u"><rect x="220" y="66" width="64" height="32" rx="4"/><text class="sub" x="252.0" y="82.0" text-anchor="middle" dominant-baseline="central">8</text></g><text class="sub2" x="252" y="116" text-anchor="middle">KV heads</text><text class="hd" x="292" y="87" text-anchor="start">×</text><g class="u"><rect x="310" y="66" width="64" height="32" rx="4"/><text class="sub" x="342.0" y="82.0" text-anchor="middle" dominant-baseline="central">128</text></g><text class="sub2" x="342" y="116" text-anchor="middle">per head</text><text class="hd" x="382" y="87" text-anchor="start">×</text><g class="u"><rect x="400" y="66" width="64" height="32" rx="4"/><text class="sub" x="432.0" y="82.0" text-anchor="middle" dominant-baseline="central">2</text></g><text class="sub2" x="432" y="116" text-anchor="middle">bytes each</text><text class="hd" x="472" y="87" text-anchor="start">=</text><g class="h"><rect x="490" y="66" width="150" height="32" rx="4"/><text class="sub" x="565.0" y="82.0" text-anchor="middle" dominant-baseline="central">327,680 bytes</text></g><text class="hd" x="40" y="160">How it grows with the conversation, to scale against the weights</text><text class="cap" x="40" y="197" text-anchor="start">1,000 tokens</text><g class="h"><rect x="200" y="178" width="2" height="28" rx="3"/></g><text class="sub2" x="210" y="197" text-anchor="start">0.33 GB</text><text class="cap" x="40" y="233" text-anchor="start">10,000 tokens</text><g class="h"><rect x="200" y="214" width="7.0" height="28" rx="3"/></g><text class="sub2" x="215.0" y="233" text-anchor="start">3.3 GB</text><text class="cap" x="40" y="269" text-anchor="start">100,000 tokens</text><g class="h"><rect x="200" y="250" width="69.7" height="28" rx="3"/></g><text class="sub2" x="277.7" y="269" text-anchor="start">33 GB</text><text class="cap" x="40" y="305" text-anchor="start">the weights</text><g class="u"><rect x="200" y="286" width="300" height="28" rx="3"/></g><text class="sub2" x="508" y="305" text-anchor="start">141.1 GB</text><text class="cap" x="40" y="350" text-anchor="start">The 2 is one key and one value; 80 is the layers ({{fig:v01-o138}}); 8 key-value heads</text><text class="cap" x="40" y="370" text-anchor="start">of 128 numbers each come from {{fig:v01-p29}}; and each number is stored in 2 bytes. For</text><text class="cap" x="40" y="390" text-anchor="start">Llama 3 70B that is 327,680 bytes for every token in the conversation.</text><text class="cap" x="40" y="430" text-anchor="start">It grows in step with the conversation: 0.33 GB at a thousand tokens, 33 GB at a hundred</text><text class="cap" x="40" y="450" text-anchor="start">thousand, which is already 23% of the model's own 141.1 GB.</text></svg><figcaption>A formula worth memorising. It turns any model's shape and any conversation's length straight into gigabytes, and each later technique changes exactly one of its five terms.</figcaption></figure>
