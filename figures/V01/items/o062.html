<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:39</div><h3>How to read a number like ten to the fifteen</h3><svg viewBox='0 0 680 548' role='img'><title>How to read a number like ten to the fifteen</title><text class="hd" x="40" y="46">Reading the big numbers</text><g class="u"><rect x="60" y="70" width="78" height="30" rx="3"/><text class="sub" x="99.0" y="85.0" text-anchor="middle" dominant-baseline="central">10^3</text></g><text class="cap" x="152" y="90" text-anchor="start">thousand</text><g class="m"><rect x="280" y="72" width="68" height="26" rx="3"/></g><g class="u"><rect x="60" y="114" width="78" height="30" rx="3"/><text class="sub" x="99.0" y="129.0" text-anchor="middle" dominant-baseline="central">10^6</text></g><text class="cap" x="152" y="134" text-anchor="start">million</text><g class="m"><rect x="280" y="116" width="136" height="26" rx="3"/></g><g class="u"><rect x="60" y="158" width="78" height="30" rx="3"/><text class="sub" x="99.0" y="173.0" text-anchor="middle" dominant-baseline="central">10^9</text></g><text class="cap" x="152" y="178" text-anchor="start">billion</text><g class="m"><rect x="280" y="160" width="204" height="26" rx="3"/></g><g class="u"><rect x="60" y="202" width="78" height="30" rx="3"/><text class="sub" x="99.0" y="217.0" text-anchor="middle" dominant-baseline="central">10^12</text></g><text class="cap" x="152" y="222" text-anchor="start">trillion</text><g class="m"><rect x="280" y="204" width="272" height="26" rx="3"/></g><g class="u"><rect x="60" y="246" width="78" height="30" rx="3"/><text class="sub" x="99.0" y="261.0" text-anchor="middle" dominant-baseline="central">10^15</text></g><text class="cap" x="152" y="266" text-anchor="start">quadrillion</text><g class="m"><rect x="280" y="248" width="340" height="26" rx="3"/></g><text class="sub2" x="60" y="298" text-anchor="start">each bar is one equal step longer than the one above it, and each step is ×1,000</text><text class="cap" x="40" y="342" text-anchor="start">The small raised number, written here after a ^, counts the zeros. Ten to the fifteen,</text><text class="cap" x="40" y="362" text-anchor="start">10^15, is a one followed by fifteen zeros: a thousand million million.</text><text class="cap" x="40" y="402" text-anchor="start">Each step down the list is a thousand times the one above, and each bar is the same</text><text class="cap" x="40" y="422" text-anchor="start">length longer than the one above it. That is a logarithmic scale, taken apart in the</text><text class="cap" x="40" y="442" text-anchor="start">next figure. On an ordinary scale the first four bars would be invisible beside the</text><text class="cap" x="40" y="462" text-anchor="start">last.</text><text class="cap" x="40" y="502" text-anchor="start">Only two of these matter here: a chip does about ten to the fifteen operations a second,</text><text class="cap" x="40" y="522" text-anchor="start">and one token costs about ten to the eleven.</text></svg><figcaption>Worth a moment, because the whole argument compares two of these numbers, 10^15 and 10^11. They are four powers of ten apart: a factor of 10,000.</figcaption></figure>
