<figure><div class='ts'>Fig 62 &nbsp;&middot;&nbsp; 2:39</div><h3>How to read a number like ten to the fifteen</h3><svg viewBox="0 0 680 470" role="img"><title>How to read a number like ten to the fifteen</title><text class="hd" x="40" y="46">Reading the big numbers</text><g class="u"><rect x="60" y="70" width="78" height="30" rx="3"></rect><text class="sub" x="99.0" y="85.0" text-anchor="middle" dominant-baseline="central">10^3</text></g><text class="cap" x="150" y="90" text-anchor="start">thousand</text><g class="m"><rect x="280" y="72" width="3" height="26" rx="3"></rect></g><g class="u"><rect x="60" y="114" width="78" height="30" rx="3"></rect><text class="sub" x="99.0" y="129.0" text-anchor="middle" dominant-baseline="central">10^6</text></g><text class="cap" x="150" y="134" text-anchor="start">million</text><g class="m"><rect x="280" y="116" width="15" height="26" rx="3"></rect></g><g class="u"><rect x="60" y="158" width="78" height="30" rx="3"></rect><text class="sub" x="99.0" y="173.0" text-anchor="middle" dominant-baseline="central">10^9</text></g><text class="cap" x="150" y="178" text-anchor="start">billion</text><g class="m"><rect x="280" y="160" width="60" height="26" rx="3"></rect></g><g class="u"><rect x="60" y="202" width="78" height="30" rx="3"></rect><text class="sub" x="99.0" y="217.0" text-anchor="middle" dominant-baseline="central">10^12</text></g><text class="cap" x="150" y="222" text-anchor="start">trillion</text><g class="m"><rect x="280" y="204" width="150" height="26" rx="3"></rect></g><g class="u"><rect x="60" y="246" width="78" height="30" rx="3"></rect><text class="sub" x="99.0" y="261.0" text-anchor="middle" dominant-baseline="central">10^15</text></g><text class="cap" x="150" y="266" text-anchor="start">quadrillion</text><g class="m"><rect x="280" y="248" width="340" height="26" rx="3"></rect></g><text class="cap" x="40" y="316" text-anchor="start">The small raised number counts the zeros. Ten to the fifteen is a one followed by fifteen</text><text class="cap" x="40" y="336" text-anchor="start">zeros, which is a thousand million million.</text><text class="cap" x="40" y="372" text-anchor="start">Each step down this list is a thousand times the one above. The bars are drawn on a</text><text class="cap" x="40" y="392" text-anchor="start">logarithmic scale, because on a normal scale the top four would be invisible.</text><text class="cap" x="40" y="428" text-anchor="start">Only two of these matter here: a chip does about ten to the fifteen operations a second, and</text><text class="cap" x="40" y="448" text-anchor="start">one token costs about ten to the eleven.</text></svg><figcaption>Worth a moment, because the whole argument is a comparison between two of these and they are four steps apart.</figcaption></figure>
