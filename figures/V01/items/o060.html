<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 1:54</div><h3>The route this series takes</h3><svg viewBox='0 0 680 530' role='img'><title>The route this series takes</title><text class="hd" x="40" y="46">One token, end to end, from pressing enter to the screen</text><g class="s"><rect x="60" y="66" width="160" height="30" rx="4"/><text class="sub" x="140.0" y="81.0" text-anchor="middle" dominant-baseline="central">router</text></g><text class="sub2" x="236" y="86" text-anchor="start">picks which machine handles the request</text><g class="s"><rect x="60" y="110" width="160" height="30" rx="4"/><text class="sub" x="140.0" y="125.0" text-anchor="middle" dominant-baseline="central">scheduler</text></g><text class="sub2" x="236" y="130" text-anchor="start">batches it with others</text><line class="conn" x1="140" y1="97" x2="140" y2="109" marker-end="url(#arw)"/><g class="s"><rect x="60" y="154" width="160" height="30" rx="4"/><text class="sub" x="140.0" y="169.0" text-anchor="middle" dominant-baseline="central">prefill cluster</text></g><text class="sub2" x="236" y="174" text-anchor="start">machines that read the whole prompt</text><line class="conn" x1="140" y1="141" x2="140" y2="153" marker-end="url(#arw)"/><g class="s"><rect x="60" y="198" width="160" height="30" rx="4"/><text class="sub" x="140.0" y="213.0" text-anchor="middle" dominant-baseline="central">KV transfer</text></g><text class="sub2" x="236" y="218" text-anchor="start">hands their results to other machines</text><line class="conn" x1="140" y1="185" x2="140" y2="197" marker-end="url(#arw)"/><g class="s"><rect x="60" y="242" width="160" height="30" rx="4"/><text class="sub" x="140.0" y="257.0" text-anchor="middle" dominant-baseline="central">decode cluster</text></g><text class="sub2" x="236" y="262" text-anchor="start">machines that write the answer, a token at a time</text><line class="conn" x1="140" y1="229" x2="140" y2="241" marker-end="url(#arw)"/><g class="s"><rect x="60" y="286" width="160" height="30" rx="4"/><text class="sub" x="140.0" y="301.0" text-anchor="middle" dominant-baseline="central">multi-token loop</text></g><text class="sub2" x="236" y="306" text-anchor="start">making several tokens per pass</text><line class="conn" x1="140" y1="273" x2="140" y2="285" marker-end="url(#arw)"/><g class="s"><rect x="60" y="330" width="160" height="30" rx="4"/><text class="sub" x="140.0" y="345.0" text-anchor="middle" dominant-baseline="central">the user's screen</text></g><text class="sub2" x="236" y="350" text-anchor="start">where each token appears</text><line class="conn" x1="140" y1="317" x2="140" y2="329" marker-end="url(#arw)"/><text class="cap" x="40" y="404" text-anchor="start">The series traces exactly this path. Each stage gets its own engineering problem and its</text><text class="cap" x="40" y="424" text-anchor="start">own answer, and every term above, prefill, decode and KV included, is built from scratch</text><text class="cap" x="40" y="444" text-anchor="start">before it is used.</text><text class="cap" x="40" y="484" text-anchor="start">This atlas covers the ground underneath all of them: where the 30 milliseconds of a</text><text class="cap" x="40" y="504" text-anchor="start">token actually go.</text></svg><figcaption>Worth returning to. Most of what follows in later videos is an optimisation of one of these seven stages.</figcaption></figure>
