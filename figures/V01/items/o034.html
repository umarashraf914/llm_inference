<figure><div class='ts'>Fig 34 &nbsp;&middot;&nbsp; 0:46</div><h3>What is actually in the cache</h3><svg viewBox='0 0 680 310' role='img'><title>What is actually in the cache</title><text class="hd" x="40" y="46">The cache does not hold text, and it does not hold answers</text><g class="u"><rect x="40" y="74" width="285" height="40" rx="5"/><text class="sub" x="182.5" y="94.0" text-anchor="middle" dominant-baseline="central">the words: kept in a database</text></g><g class="s"><rect x="355" y="74" width="285" height="40" rx="5"/><text class="sub" x="497.5" y="94.0" text-anchor="middle" dominant-baseline="central">the keys and values: kept on the GPU</text></g><text class="cap" x="40" y="156" text-anchor="start">For every token the model has processed, it worked out two vectors: a key and a value. Those</text><text class="cap" x="40" y="176" text-anchor="start">are what later tokens attend to, and those are what the cache holds.</text><text class="cap" x="40" y="212" text-anchor="start">They are not the token. They are the model's processed form of it, in the context it appeared</text><text class="cap" x="40" y="232" text-anchor="start">in, and producing them is exactly what prefill does.</text><text class="cap" x="40" y="268" text-anchor="start">So a cache hit does not save you from sending the text. It saves the server from turning that</text><text class="cap" x="40" y="288" text-anchor="start">text into keys and values a second time.</text></svg><figcaption>The distinction that makes everything else make sense. Text is cheap and travels every turn; keys and values are expensive and are what the cache is for.</figcaption></figure>
