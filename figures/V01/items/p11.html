ine="central">1</text></g><g class="u"><rect x="40" y="174" width="26" height="26" rx="3"/><text class="sub" x="53.0" y="187.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="70" y="174" width="26" height="26" rx="3"/><text class="sub" x="83.0" y="187.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="100" y="174" width="26" height="26" rx="3"/><text class="sub" x="113.0" y="187.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="130" y="174" width="26" height="26" rx="3"/><text class="sub" x="143.0" y="187.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="166" y="192" text-anchor="start">→</text><g class="m"><rect x="184" y="174" width="30" height="26" rx="3"/><text class="sub" x="199.0" y="187.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="40" y="228" text-anchor="start">q, the query</text><text class="cap" x="245" y="132" text-anchor="start">W_K</text><g class="u"><rect x="245" y="142" width="26" height="26" rx="3"/><text class="sub" x="258.0" y="155.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="275" y="142" width="26" height="26" rx="3"/><text class="sub" x="288.0" y="155.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="305" y="142" width="26" height="26" rx="3"/><text class="sub" x="318.0" y="155.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="335" y="142" width="26" height="26" rx="3"/><text class="sub" x="348.0" y="155.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="371" y="160" text-anchor="start">→</text><g class="m"><rect x="389" y="142" width="30" height="26" rx="3"/><text class="sub" x="404.0" y="155.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="u"><rect x="245" y="174" width="26" height="26" rx="3"/><text class="sub" x="258.0" y="187.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="275" y="174" width="26" height="26" rx="3"/><text class="sub" x="288.0" y="187.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="305" y="174" width="26" height="26" rx="3"/><text class="sub" x="318.0" y="187.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="335" y="174" width="26" height="26" rx="3"/><text class="sub" x="348.0" y="187.0" text-anchor="middle" dominant-baseline="central">−1</text></g><text class="sub2" x="371" y="192" text-anchor="start">→</text><g class="m"><rect x="389" y="174" width="30" height="26" rx="3"/><text class="sub" x="404.0" y="187.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="245" y="228" text-anchor="start">k, the key</text><text class="cap" x="450" y="132" text-anchor="start">W_V</text><g class="u"><rect x="450" y="142" width="26" height="26" rx="3"/><text class="sub" x="463.0" y="155.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="480" y="142" width="26" height="26" rx="3"/><text class="sub" x="493.0" y="155.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="510" y="142" width="26" height="26" rx="3"/><text class="sub" x="523.0" y="155.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="540" y="142" width="26" height="26" rx="3"/><text class="sub" x="553.0" y="155.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="576" y="160" text-anchor="start">→</text><g class="m"><rect x="594" y="142" width="30" height="26" rx="3"/><text class="sub" x="609.0" y="155.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="u"><rect x="450" y="174" width="26" height="26" rx="3"/><text class="sub" x="463.0" y="187.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="480" y="174" width="26" height="26" rx="3"/><text class="sub" x="493.0" y="187.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="510" y="174" width="26" height="26" rx="3"/><text class="sub" x="523.0" y="187.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="540" y="174" width="26" height="26" rx="3"/><text class="sub" x="553.0" y="187.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="576" y="192" text-anchor="start">→</text><g class="m"><rect x="594" y="174" width="30" height="26" rx="3"/><text class="sub" x="609.0" y="187.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="450" y="228" text-anchor="start">v, the value</text><text class="sub2" x="40" y="256" text-anchor="start">for example, the first row of W_K with x:  1×1 + 1×2 + 0×0 + 0×(−1)  =  3</text><text class="hd" x="40" y="300">The same thing at the real size, in the model this atlas follows</text><text class="sub2" x="60" y="326" text-anchor="start">W_Q: 8,192 rows of 8,192  →  q has 8,192 numbers</text><text class="sub2" x="420" y="326" text-anchor="start">67.1 million weights</text><text class="sub2" x="60" y="350" text-anchor="start">W_K: 1,024 rows of 8,192  →  k has 1,024 numbers</text><text class="sub2" x="420" y="350" text-anchor="start">8.4 million weights</text><text class="sub2" x="60" y="374" text-anchor="start">W_V: 1,024 rows of 8,192  →  v has 1,024 numbers</text><text class="sub2" x="420" y="374" text-anchor="start">8.4 million weights</text><text class="cap" x="40" y="420" text-anchor="start">Projecting a vector means multiplying it by a matrix: each row of the matrix, multiplied</text><text class="cap" x="40" y="440" text-anchor="start">pair by pair with the vector and added up, gives one number of the result</text><text class="cap" x="40" y="460" text-anchor="start">({{fig:v01-o085}}). Three different matrices turn one vector into three: the query, the</text><text class="cap" x="40" y="480" text-anchor="start">key and the value.</text><text class="cap" x="40" y="520" text-anchor="start">Nothing about the arithmetic decides which is which. The three matrices were learned in</text><text class="cap" x="40" y="540" text-anchor="start">training and are the same for every token; what differs from token to token is the</text><text class="cap" x="40" y="560" text-anchor="start">vector it brings. The small weights above are illustrative.</text><text class="cap" x="40" y="600" text-anchor="start">In the real model the token's vector holds 8,192 numbers. W_Q has 8,192 rows, so the</text><text class="cap" x="40" y="620" text-anchor="start">query is as long as the input; W_K and W_V have only 1,024, so keys and values are eight</text><text class="cap" x="40" y="640" text-anchor="start">times shorter. Why is the subject of {{fig:v01-p29}}.</text></svg><figcaption>Projection is the same multiply-and-add as everywhere else in the model. The three roles come from three learned matrices, not from anything special in the arithmetic.</figcaption></figure>
