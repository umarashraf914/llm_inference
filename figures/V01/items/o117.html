<figure><div class='ts'>Fig 117 &nbsp;&middot;&nbsp; 12:09</div><h3>The same toll, a different payoff</h3><svg viewBox="0 0 680 414" role="img"><title>The same toll, a different payoff</title><text class="hd" x="40" y="46">Prefill: one weight load, thousands of tokens</text><g class="h"><rect x="60" y="66" width="120" height="34" rx="4"></rect><text class="sub" x="120.0" y="83.0" text-anchor="middle" dominant-baseline="central">load once</text></g><line class="conn" x1="186" y1="83" x2="210" y2="83" marker-end="url(#arw)"></line><g class="m"><rect x="216" y="66" width="38" height="34" rx="3"></rect></g><g class="m"><rect x="261" y="66" width="38" height="34" rx="3"></rect></g><g class="m"><rect x="306" y="66" width="38" height="34" rx="3"></rect></g><g class="m"><rect x="351" y="66" width="38" height="34" rx="3"></rect></g><g class="m"><rect x="396" y="66" width="38" height="34" rx="3"></rect></g><g class="m"><rect x="441" y="66" width="38" height="34" rx="3"></rect></g><g class="m"><rect x="486" y="66" width="38" height="34" rx="3"></rect></g><g class="m"><rect x="531" y="66" width="38" height="34" rx="3"></rect></g><g class="m"><rect x="576" y="66" width="38" height="34" rx="3"></rect></g><text class="sub2" x="216" y="124" text-anchor="start">every byte pulled is used in roughly 2,000 multiply-accumulates</text><text class="hd" x="40" y="178">Decode: one weight load, one token</text><g class="h"><rect x="60" y="198" width="120" height="34" rx="4"></rect><text class="sub" x="120.0" y="215.0" text-anchor="middle" dominant-baseline="central">load once</text></g><line class="conn" x1="186" y1="215" x2="210" y2="215" marker-end="url(#arw)"></line><g class="m"><rect x="216" y="198" width="38" height="34" rx="3"></rect></g><text class="sub2" x="268" y="217" text-anchor="start">one</text><text class="cap" x="40" y="292" text-anchor="start">The memory bus pays exactly the same toll in both phases. The payoff from that toll differs by</text><text class="cap" x="40" y="312" text-anchor="start">a factor of thousands.</text><text class="cap" x="40" y="352" text-anchor="start">A natural first guess is that decode is slow because the model is large. That is true and it</text><text class="cap" x="40" y="372" text-anchor="start">misses the point: the model is the same size in both phases and moves the same bytes. What</text><text class="cap" x="40" y="392" text-anchor="start">changes is how much useful computation those bytes perform.</text></svg><figcaption>This is the structural fact that defines LLM inference. Prefill amortises the cost of moving the model across thousands of tokens; decode has nobody to share it with.</figcaption></figure>
