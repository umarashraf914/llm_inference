<figure><div class='ts'>Fig 108 &nbsp;&middot;&nbsp; 10:16</div><h3>The weights are read, never written</h3><svg viewBox='0 0 680 310' role='img'><title>The weights are read, never written</title><text class="hd" x="40" y="46">Nothing about the weights changes while the service runs</text><g class="m"><rect x="40" y="70" width="600" height="40" rx="4"/><text class="sub" x="340.0" y="90.0" text-anchor="middle" dominant-baseline="central">the same 140 GB, for every request from every user</text></g><text class="cap" x="40" y="156" text-anchor="start">The weights are read, used, and left exactly as they were. Two different users, two different</text><text class="cap" x="40" y="176" text-anchor="start">questions, and the same numbers do the work.</text><text class="cap" x="40" y="212" text-anchor="start">That is why one copy in memory can serve everybody, and it is the fact that makes batching</text><text class="cap" x="40" y="232" text-anchor="start">possible in a later video.</text><text class="cap" x="40" y="268" text-anchor="start">It also means the reading is pure overhead. The same bytes cross the same bus for every token</text><text class="cap" x="40" y="288" text-anchor="start">and nothing is learned or saved by having read them before.</text></svg><figcaption>Two consequences pointing opposite ways: one copy can serve everyone, and yet the same bytes must be re-read every single time.</figcaption></figure>
