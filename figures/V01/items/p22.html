<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 19:10</div><h3>The 300 from the opening and the ridge are the same number</h3><svg viewBox='0 0 680 632' role='img'><title>The 300 from the opening and the ridge are the same number</title><text class="hd" x="40" y="46">The opening's puzzle, worked with the H100's exact numbers</text><text class="cap" x="40" y="91" text-anchor="start">time to read the weights</text><g class="h"><rect x="240" y="70" width="400" height="32" rx="5"/><text class="sub" x="440.0" y="86.0" text-anchor="middle" dominant-baseline="central">140 GB ÷ 3.35 TB/s = 41.8 ms</text></g><text class="cap" x="40" y="137" text-anchor="start">time to do the arithmetic</text><g class="m"><rect x="240" y="116" width="400" height="32" rx="5"/><text class="sub" x="440.0" y="132.0" text-anchor="middle" dominant-baseline="central">140 billion ÷ 989 trillion a second = 0.142 ms</text></g><text class="cap" x="40" y="183" text-anchor="start">their ratio</text><g class="u"><rect x="240" y="162" width="400" height="32" rx="5"/><text class="sub" x="440.0" y="178.0" text-anchor="middle" dominant-baseline="central">41.8 ÷ 0.142 = 295</text></g><text class="hd" x="40" y="230">Rearranged, the same division is the ridge over the intensity</text><g class="u"><rect x="140" y="246" width="400" height="38" rx="6"/><text class="sub" x="340.0" y="265.0" text-anchor="middle" dominant-baseline="central">(bytes ÷ bandwidth) ÷ (operations ÷ peak)</text></g><g class="u"><rect x="140" y="296" width="400" height="38" rx="6"/><text class="sub" x="340.0" y="315.0" text-anchor="middle" dominant-baseline="central">=  (peak ÷ bandwidth)  ÷  (operations ÷ bytes)</text></g><g class="s"><rect x="140" y="346" width="400" height="38" rx="6"/><text class="sub" x="340.0" y="365.0" text-anchor="middle" dominant-baseline="central">=  ridge ÷ intensity  =  295 ÷ 1</text></g><text class="cap" x="40" y="426" text-anchor="start">Part 3 found that the chip could finish the arithmetic for about 300 tokens in the time</text><text class="cap" x="40" y="446" text-anchor="start">one token takes ({{fig:v01-o068}}). With the H100's exact figures that ratio is 295, and</text><text class="cap" x="40" y="466" text-anchor="start">it is no coincidence that the ridge is 295 too.</text><text class="cap" x="40" y="506" text-anchor="start">Dividing the time to read by the time to compute is the same as dividing the chip's</text><text class="cap" x="40" y="526" text-anchor="start">ridge by the workload's intensity. Decode's intensity is 1, so the chip waits on memory</text><text class="cap" x="40" y="546" text-anchor="start">exactly as many times longer than it computes as its ridge is high.</text><text class="cap" x="40" y="586" text-anchor="start">The arithmetic share is then 1/295 = 0.34%: Part 3's 0.33%, worked with exact numbers</text><text class="cap" x="40" y="606" text-anchor="start">instead of round ones.</text></svg><figcaption>The puzzle of Part 3 and the roofline of Part 8 are one calculation. The chip waits 295 times longer than it computes because decode does one operation per byte and the chip needs 295.</figcaption></figure>
