<figure><div class='ts'>Fig 03 &nbsp;&middot;&nbsp; 0:00</div><h3>Where the numbers came from</h3><svg viewBox='0 0 680 334' role='img'><title>Where the numbers came from</title><text class="hd" x="40" y="46">How the numbers were found, in three steps</text><g class="u"><rect x="40" y="70" width="180" height="40" rx="4"/><text class="sub" x="130.0" y="90.0" text-anchor="middle" dominant-baseline="central">guess the next word</text></g><line class="conn" x1="226" y1="90" x2="246" y2="90" marker-end="url(#arw)"/><g class="u"><rect x="252" y="70" width="180" height="40" rx="4"/><text class="sub" x="342.0" y="90.0" text-anchor="middle" dominant-baseline="central">compare with the real one</text></g><line class="conn" x1="438" y1="90" x2="458" y2="90" marker-end="url(#arw)"/><g class="m"><rect x="464" y="70" width="176" height="40" rx="4"/><text class="sub" x="552.0" y="90.0" text-anchor="middle" dominant-baseline="central">nudge every weight</text></g><line class="conn" x1="552" y1="116" x2="552" y2="134" marker-end="url(#arw)"/><line class="conn" x1="552" y1="134" x2="130" y2="134"/><line class="conn" x1="130" y1="134" x2="130" y2="116" marker-end="url(#arw)"/><text class="sub2" x="40" y="186" text-anchor="start">repeat, over an enormous amount of text</text><text class="cap" x="40" y="236" text-anchor="start">Each nudge is tiny and there are trillions of them. Nobody chooses the values by hand and</text><text class="cap" x="40" y="256" text-anchor="start">nobody can look at one and say what it is for.</text><text class="cap" x="40" y="292" text-anchor="start">The result is a file of numbers that happens to predict text well. That is the whole of what a</text><text class="cap" x="40" y="312" text-anchor="start">trained model is, and why the next figure matters.</text></svg><figcaption>Deliberately brief: this series never trains anything. It is here so the word trained stops being a black box.</figcaption></figure>
