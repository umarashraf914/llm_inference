<figure><div class='ts'>Fig 06 &nbsp;&middot;&nbsp; 0:00</div><h3>What a token is</h3><svg viewBox="0 0 680 338" role="img"><title>What a token is</title><text class="hd" x="40" y="46">Text is cut into pieces called tokens</text><g class="u"><rect x="60" y="70" width="500" height="34" rx="4"></rect><text class="sub" x="310.0" y="87.0" text-anchor="middle" dominant-baseline="central">the quick brown fox jumps</text></g><g class="s"><rect x="60" y="130" width="58" height="30" rx="3"></rect><text class="sub" x="89.0" y="145.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="s"><rect x="126" y="130" width="78" height="30" rx="3"></rect><text class="sub" x="165.0" y="145.0" text-anchor="middle" dominant-baseline="central">quick</text></g><g class="s"><rect x="212" y="130" width="74" height="30" rx="3"></rect><text class="sub" x="249.0" y="145.0" text-anchor="middle" dominant-baseline="central">brown</text></g><g class="s"><rect x="294" y="130" width="52" height="30" rx="3"></rect><text class="sub" x="320.0" y="145.0" text-anchor="middle" dominant-baseline="central">fox</text></g><g class="s"><rect x="354" y="130" width="76" height="30" rx="3"></rect><text class="sub" x="392.0" y="145.0" text-anchor="middle" dominant-baseline="central">jumps</text></g><text class="sub2" x="60" y="190" text-anchor="start">five tokens</text><text class="cap" x="40" y="240" text-anchor="start">Roughly a word each, though not exactly. Common words are one token; rarer ones split into</text><text class="cap" x="40" y="260" text-anchor="start">two or three pieces. Five hundred words of English comes to about six to eight hundred tokens.</text><text class="cap" x="40" y="296" text-anchor="start">The model never sees letters. It works only in these pieces, and it produces them one at a</text><text class="cap" x="40" y="316" text-anchor="start">time.</text></svg><figcaption>The unit everything in this series is counted in: tokens per second, cost per token, milliseconds per token.</figcaption></figure>
