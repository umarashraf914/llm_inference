<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 25:43</div><h3>Case A: the chat continues</h3><svg viewBox='0 0 680 382' role='img'><title>Case A: the chat continues</title><text class="hd" x="40" y="46">One minute later, the same conversation continues</text><text class="sub2" x="40" y="92" text-anchor="start">arriving</text><g class="s"><rect x="150" y="76" width="90" height="30" rx="3"/><text class="sub" x="195.0" y="91.0" text-anchor="middle" dominant-baseline="central">system</text></g><g class="s"><rect x="244" y="76" width="110" height="30" rx="3"/><text class="sub" x="299.0" y="91.0" text-anchor="middle" dominant-baseline="central">tools</text></g><g class="s"><rect x="358" y="76" width="110" height="30" rx="3"/><text class="sub" x="413.0" y="91.0" text-anchor="middle" dominant-baseline="central">question 1</text></g><g class="s"><rect x="472" y="76" width="96" height="30" rx="3"/><text class="sub" x="520.0" y="91.0" text-anchor="middle" dominant-baseline="central">answer 1</text></g><g class="h"><rect x="572" y="76" width="68" height="30" rx="3"/><text class="sub" x="606.0" y="91.0" text-anchor="middle" dominant-baseline="central">new</text></g><text class="sub2" x="40" y="152" text-anchor="start">in the cache</text><g class="s"><rect x="150" y="136" width="90" height="30" rx="3"/></g><g class="s"><rect x="244" y="136" width="110" height="30" rx="3"/></g><g class="s"><rect x="358" y="136" width="110" height="30" rx="3"/></g><g class="s"><rect x="472" y="136" width="96" height="30" rx="3"/></g><rect x="572" y="136" width="68" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><line class="mark xok" x1="570" y1="66" x2="570" y2="172"/><g class="s"><rect x="140" y="196" width="400" height="42" rx="6"/><text class="sub" x="340.0" y="217.0" text-anchor="middle" dominant-baseline="central">hit 784   ·   prefill 4 tokens</text></g><text class="cap" x="40" y="280" text-anchor="start">The answer the model produced a minute ago had its keys and values kept as it was</text><text class="cap" x="40" y="300" text-anchor="start">generated, so the whole history matches and only the follow-up's 4 tokens are new.</text><text class="cap" x="40" y="340" text-anchor="start">This is the best case and the most common one. It is why a conversation stays quick for</text><text class="cap" x="40" y="360" text-anchor="start">as long as the user keeps replying.</text></svg><figcaption>A perfect prefix. The model's own previous answer is part of the cached prefix, because its keys and values were kept as it was written. Widths schematic.</figcaption></figure>
