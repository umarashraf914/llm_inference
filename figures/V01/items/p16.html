<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:12</div><h3>Without a bend between them, two matrices are just one matrix</h3><div class='wg'><div class='ctl'><label>a <input type='range' min='-3' max='3' step='0.5' value='2'><span class='val'>2</span></label><label>b <input type='range' min='-3' max='3' step='0.5' value='3'><span class='val'>3</span></label><button type='button'>Reset</button></div><svg viewBox='0 0 680 616' role='img'><title>Without a bend between them, two matrices are just one matrix</title><text class="hd" x="40" y="34">Two steps, multiply by a and then by b, with and without a bend between</text><line class="axis" x1="80" y1="190.0" x2="330" y2="190.0"/><line class="axis" x1="205.0" y1="70" x2="205.0" y2="310"/><line class="tick" x1="80.0" y1="190.0" x2="80.0" y2="194.0"/><text class="sub2 halo" x="80.0" y="206.0" text-anchor="middle">−2</text><line class="tick" x1="142.5" y1="190.0" x2="142.5" y2="194.0"/><text class="sub2 halo" x="142.5" y="206.0" text-anchor="middle">−1</text><line class="tick" x1="205.0" y1="190.0" x2="205.0" y2="194.0"/><line class="tick" x1="267.5" y1="190.0" x2="267.5" y2="194.0"/><text class="sub2 halo" x="267.5" y="206.0" text-anchor="middle">1</text><line class="tick" x1="330.0" y1="190.0" x2="330.0" y2="194.0"/><text class="sub2 halo" x="330.0" y="206.0" text-anchor="middle">2</text><line class="tick" x1="201.0" y1="270.0" x2="205.0" y2="270.0"/><text class="sub2 halo" x="197.0" y="274.0" text-anchor="end">−12</text><line class="tick" x1="201.0" y1="230.0" x2="205.0" y2="230.0"/><text class="sub2 halo" x="197.0" y="234.0" text-anchor="end">−6</text><line class="tick" x1="201.0" y1="150.0" x2="205.0" y2="150.0"/><text class="sub2 halo" x="197.0" y="154.0" text-anchor="end">6</text><line class="tick" x1="201.0" y1="110.0" x2="205.0" y2="110.0"/><text class="sub2 halo" x="197.0" y="114.0" text-anchor="end">12</text><line class="tick" x1="201.0" y1="70.0" x2="205.0" y2="70.0"/><text class="sub2 halo" x="197.0" y="74.0" text-anchor="end">18</text><polyline class="pl-h" data-line="straight" points="80.0,270.0 83.1,268.0 86.3,266.0 89.4,264.0 92.5,262.0 95.6,260.0 98.8,258.0 101.9,256.0 105.0,254.0 108.1,252.0 111.3,250.0 114.4,248.0 117.5,246.0 120.6,244.0 123.8,242.0 126.9,240.0 130.0,238.0 133.1,236.0 136.3,234.0 139.4,232.0 142.5,230.0 145.6,228.0 148.8,226.0 151.9,224.0 155.0,222.0 158.1,220.0 161.3,218.0 164.4,216.0 167.5,214.0 170.6,212.0 173.8,210.0 176.9,208.0 180.0,206.0 183.1,204.0 186.3,202.0 189.4,200.0 192.5,198.0 195.6,196.0 198.8,194.0 201.9,192.0 205.0,190.0 208.1,188.0 211.3,186.0 214.4,184.0 217.5,182.0 220.6,180.0 223.8,178.0 226.9,176.0 230.0,174.0 233.1,172.0 236.3,170.0 239.4,168.0 242.5,166.0 245.6,164.0 248.8,162.0 251.9,160.0 255.0,158.0 258.1,156.0 261.3,154.0 264.4,152.0 267.5,150.0 270.6,148.0 273.8,146.0 276.9,144.0 280.0,142.0 283.1,140.0 286.3,138.0 289.4,136.0 292.5,134.0 295.6,132.0 298.8,130.0 301.9,128.0 305.0,126.0 308.1,124.0 311.3,122.0 314.4,120.0 317.5,118.0 320.6,116.0 323.8,114.0 326.9,112.0 330.0,110.0"/><polyline class="pl-m" data-line="bent" points="80.0,190.0 83.1,190.0 86.3,190.0 89.4,190.0 92.5,190.0 95.6,190.0 98.8,190.0 101.9,190.0 105.0,190.0 108.1,190.0 111.3,190.0 114.4,190.0 117.5,190.0 120.6,190.0 123.8,190.0 126.9,190.0 130.0,190.0 133.1,190.0 136.3,190.0 139.4,190.0 142.5,190.0 145.6,190.0 148.8,190.0 151.9,190.0 155.0,190.0 158.1,190.0 161.3,190.0 164.4,190.0 167.5,190.0 170.6,190.0 173.8,190.0 176.9,190.0 180.0,190.0 183.1,190.0 186.3,190.0 189.4,190.0 192.5,190.0 195.6,190.0 198.8,190.0 201.9,190.0 205.0,190.0 208.1,188.0 211.3,186.0 214.4,184.0 217.5,182.0 220.6,180.0 223.8,178.0 226.9,176.0 230.0,174.0 233.1,172.0 236.3,170.0 239.4,168.0 242.5,166.0 245.6,164.0 248.8,162.0 251.9,160.0 255.0,158.0 258.1,156.0 261.3,154.0 264.4,152.0 267.5,150.0 270.6,148.0 273.8,146.0 276.9,144.0 280.0,142.0 283.1,140.0 286.3,138.0 289.4,136.0 292.5,134.0 295.6,132.0 298.8,130.0 301.9,128.0 305.0,126.0 308.1,124.0 311.3,122.0 314.4,120.0 317.5,118.0 320.6,116.0 323.8,114.0 326.9,112.0 330.0,110.0"/><line class="pl-h" x1="80" y1="332" x2="104" y2="332"/><text class="sub2" x="112" y="336" text-anchor="start">b × (a × x), no bend</text><line class="pl-m" x1="80" y1="350" x2="104" y2="350"/><text class="sub2" x="112" y="354" text-anchor="start">b × ReLU(a × x), with a bend</text><text class="sub2" x="360" y="86" text-anchor="start">x</text><text class="sub2" x="420" y="86" text-anchor="start">no bend</text><text class="sub2" x="500" y="86" text-anchor="start">with bend</text><text class="sub2" x="360" y="112" text-anchor="start">−2</text><text class="sub2" x="420" y="112" data-s="0">−12</text><text class="sub2" x="500" y="112" data-b="0">0</text><text class="sub2" x="360" y="138" text-anchor="start">−1</text><text class="sub2" x="420" y="138" data-s="1">−6</text><text class="sub2" x="500" y="138" data-b="1">0</text><text class="sub2" x="360" y="164" text-anchor="start">0</text><text class="sub2" x="420" y="164" data-s="2">0</text><text class="sub2" x="500" y="164" data-b="2">0</text><text class="sub2" x="360" y="190" text-anchor="start">1</text><text class="sub2" x="420" y="190" data-s="3">6</text><text class="sub2" x="500" y="190" data-b="3">6</text><text class="sub2" x="360" y="216" text-anchor="start">2</text><text class="sub2" x="420" y="216" data-s="4">12</text><text class="sub2" x="500" y="216" data-b="4">12</text><text class="sub2" x="360" y="252" data-one="">no bend is one step: × 6</text><text class="cap" x="40" y="394" text-anchor="start">Multiplying by 2 and then by 3 is the same as multiplying by 6: two straight-line steps</text><text class="cap" x="40" y="414" text-anchor="start">make one straight line, however many are chained. The same holds for matrices: W₂ times</text><text class="cap" x="40" y="434" text-anchor="start">(W₁ times x) equals (W₂W₁) times x, and W₂W₁ is a single matrix. Without something in</text><text class="cap" x="40" y="454" text-anchor="start">between, the second matrix adds nothing one matrix could not do.</text><text class="cap" x="40" y="494" text-anchor="start">Put a bend between them, here ReLU, which replaces negative numbers with zero, and the</text><text class="cap" x="40" y="514" text-anchor="start">result is no longer a line: flat on one side, steep on the other. Thousands of bends</text><text class="cap" x="40" y="534" text-anchor="start">like this, one per number, let the block represent shapes no single matrix can.</text><text class="cap" x="40" y="574" text-anchor="start">Drag the slopes. Every number in the table was checked against Python at every slider</text><text class="cap" x="40" y="594" text-anchor="start">setting.</text></svg></div><figcaption>The bend is what makes depth worth having. Without it, eighty layers of matrices would collapse into one matrix, and the model could only draw straight lines.</figcaption><script>(() => {

  const MINUS = '−';
  const fx = (v, d = 2) => { const s = Math.abs(v).toFixed(d); return (v < 0 && +s !== 0 ? MINUS : '') + s; };
  const gx = (v, d = 0) => { const s = Math.abs(v).toFixed(d); const [a, b] = s.split('.');
    const t = a.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (v < 0 && +s !== 0 ? MINUS : '') + t + (b !== undefined ? '.' + b : ''); };

  const fig = document.currentScript.closest('figure');
  const XS = [-2, -1, 0, 1, 2], A0 = 2.0, B0 = 3.0, PL = 80, PR = 330, PT = 70, PB = 310;
  const sl = [...fig.querySelectorAll('input[type=range]')], val = [...fig.querySelectorAll('.val')];
  const q = s => fig.querySelector(s);
  const nf = v => { v = Math.round(v * 1e9) / 1e9 + 0; return (v < 0 ? '−' : '') + String(Math.abs(v)); };
  const px = x => +(PL + (x + 2) / 4 * (PR - PL)).toFixed(1);
  const py = y => +(PT + (18 - y) / 36 * (PB - PT)).toFixed(1);
  const relu = v => Math.max(0, v);
  const pts = fn => { const o = []; for (let i = -40; i <= 40; i++) { const x = i / 20;
    o.push(`${px(x)},${py(Math.max(-18, Math.min(18, fn(x))))}`); } return o.join(' '); };
  function draw() {
    const [a, b] = sl.map(s => +s.value);
    val[0].textContent = nf(a); val[1].textContent = nf(b);
    q('[data-line="straight"]').setAttribute('points', pts(x => b * (a * x)));
    q('[data-line="bent"]').setAttribute('points', pts(x => b * relu(a * x)));
    XS.forEach((x, k) => { q(`[data-s="${k}"]`).textContent = nf(b * (a * x));
                           q(`[data-b="${k}"]`).textContent = nf(b * relu(a * x)); });
    q('[data-one]').textContent = `no bend is one step: × ${nf(a * b)}`;
  }
  sl.forEach(s => s.addEventListener('input', draw));
  q('button').addEventListener('click', () => { sl[0].value = A0; sl[1].value = B0; draw(); });
  draw();
})();</script></figure>
