<figure><div class='ts'>Fig 86 &nbsp;&middot;&nbsp; 6:42</div><h3>From text to vectors</h3><svg viewBox="0 0 680 320" role="img"><title>From text to vectors</title><g class="u"><rect x="40" y="55" width="175" height="62" rx="8"></rect><text class="lbl" x="127.5" y="77.0" text-anchor="middle" dominant-baseline="central">Text</text><text class="sub" x="127.5" y="95.0" text-anchor="middle" dominant-baseline="central">a 500-word prompt</text></g><line class="conn" x1="221" y1="86" x2="245" y2="86" marker-end="url(#arw)"></line><g class="u"><rect x="251" y="55" width="175" height="62" rx="8"></rect><text class="lbl" x="338.5" y="77.0" text-anchor="middle" dominant-baseline="central">Tokens</text><text class="sub" x="338.5" y="95.0" text-anchor="middle" dominant-baseline="central">roughly 600 to 800</text></g><line class="conn" x1="432" y1="86" x2="456" y2="86" marker-end="url(#arw)"></line><g class="s"><rect x="462" y="55" width="178" height="62" rx="8"></rect><text class="lbl" x="551.0" y="77.0" text-anchor="middle" dominant-baseline="central">Vectors</text><text class="sub" x="551.0" y="95.0" text-anchor="middle" dominant-baseline="central">8,192 numbers each</text></g><text class="cap" x="40" y="158" text-anchor="start">Part 1 cut text into tokens ({{fig:v01-o006}}): a 500-word prompt becomes 600 to 800 of</text><text class="cap" x="40" y="178" text-anchor="start">them. Each token is then replaced by a vector, a list of numbers ({{fig:v01-o084}}),</text><text class="cap" x="40" y="198" text-anchor="start">8,192 numbers long in the model this atlas follows.</text><text class="cap" x="40" y="238" text-anchor="start">So a 700-token prompt enters the model as a grid of 700 × 8,192 = 5,734,400 numbers. The</text><text class="cap" x="40" y="258" text-anchor="start">vector encodes which token it is and, once position is added ({{fig:v01-o090}}), where</text><text class="cap" x="40" y="278" text-anchor="start">it sits. That grid is what the model actually processes; the text itself never appears</text><text class="cap" x="40" y="298" text-anchor="start">again.</text></svg><figcaption>Two conversions, and neither is a calculation: the tokeniser cuts the text up, and the embedding step reads a row of a table per token (next figure). From here on there is no text left in the system, only arrays of numbers.</figcaption></figure>
