<figure><div class='ts'>Fig 86 &nbsp;&middot;&nbsp; 6:42</div><h3>From text to vectors</h3><svg viewBox="0 0 680 280" role="img"><title>From text to vectors</title><g class="u"><rect x="40" y="55" width="175" height="62" rx="8"></rect><text class="lbl" x="127.5" y="77.0" text-anchor="middle" dominant-baseline="central">Text</text><text class="sub" x="127.5" y="95.0" text-anchor="middle" dominant-baseline="central">a 500-word prompt</text></g><line class="conn" x1="221" y1="86" x2="245" y2="86" marker-end="url(#arw)"></line><g class="u"><rect x="251" y="55" width="175" height="62" rx="8"></rect><text class="lbl" x="338.5" y="77.0" text-anchor="middle" dominant-baseline="central">Tokens</text><text class="sub" x="338.5" y="95.0" text-anchor="middle" dominant-baseline="central">roughly 600 to 800</text></g><line class="conn" x1="432" y1="86" x2="456" y2="86" marker-end="url(#arw)"></line><g class="s"><rect x="462" y="55" width="178" height="62" rx="8"></rect><text class="lbl" x="551.0" y="77.0" text-anchor="middle" dominant-baseline="central">Vectors</text><text class="sub" x="551.0" y="95.0" text-anchor="middle" dominant-baseline="central">several thousand wide</text></g><text class="cap" x="40" y="158" text-anchor="start">Tokens are the units the model works with, on average a little smaller than words. Common</text><text class="cap" x="40" y="178" text-anchor="start">words are usually one token; rare words break into several.</text><text class="cap" x="40" y="218" text-anchor="start">Each token is then mapped to a fixed-length vector encoding both which token it is and where</text><text class="cap" x="40" y="238" text-anchor="start">in the sequence it sits. That vector is what the model actually processes; the text itself</text><text class="cap" x="40" y="258" text-anchor="start">never appears again.</text></svg><figcaption>Two conversions, and neither is a calculation. The tokeniser splits text by table lookup; the embedding step then reads a row per token. From here on there is no text left in the system, only arrays of numbers, and everything downstream is linear algebra.</figcaption></figure>
