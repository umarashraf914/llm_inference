<figure><div class='ts'>Fig 147 &nbsp;&middot;&nbsp; 30:35</div><h3>The road ahead</h3><svg viewBox="0 0 680 396" role="img"><title>The road ahead</title><g class="u"><rect x="40" y="40" width="600" height="190" rx="14"></rect><text class="lbl" x="62" y="66">Where the series goes from here</text></g><g class="s"><rect x="62" y="96" width="130" height="46" rx="4"></rect><text class="sub" x="127.0" y="119.0" text-anchor="middle" dominant-baseline="central">the accelerator</text></g><g class="s"><rect x="207" y="96" width="130" height="46" rx="4"></rect><text class="sub" x="272.0" y="119.0" text-anchor="middle" dominant-baseline="central">the code on it</text></g><g class="s"><rect x="352" y="96" width="130" height="46" rx="4"></rect><text class="sub" x="417.0" y="119.0" text-anchor="middle" dominant-baseline="central">fewer bits</text></g><g class="s"><rect x="497" y="96" width="130" height="46" rx="4"></rect><text class="sub" x="562.0" y="119.0" text-anchor="middle" dominant-baseline="central">across many chips</text></g><g class="s"><rect x="62" y="158" width="130" height="46" rx="4"></rect><text class="sub" x="127.0" y="181.0" text-anchor="middle" dominant-baseline="central">part of itself</text></g><g class="s"><rect x="207" y="158" width="130" height="46" rx="4"></rect><text class="sub" x="272.0" y="181.0" text-anchor="middle" dominant-baseline="central">serving at scale</text></g><g class="s"><rect x="352" y="158" width="130" height="46" rx="4"></rect><text class="sub" x="417.0" y="181.0" text-anchor="middle" dominant-baseline="central">idle units in decode</text></g><g class="s"><rect x="497" y="158" width="130" height="46" rx="4"></rect><text class="sub" x="562.0" y="181.0" text-anchor="middle" dominant-baseline="central">one real request</text></g><text class="cap" x="40" y="274" text-anchor="start">Open up the hardware, look at the kernels, store the weights in fewer bits, split the model</text><text class="cap" x="40" y="294" text-anchor="start">across chips, build models that only use part of themselves per token, serve at production</text><text class="cap" x="40" y="314" text-anchor="start">scale, exploit the idle arithmetic units during decode, and finally trace one real request end</text><text class="cap" x="40" y="334" text-anchor="start">to end through the whole stack.</text><text class="cap" x="40" y="374" text-anchor="start">Every one of them is an attack on the same division.</text></svg><figcaption>Each later video takes one term in the ratio and tries to move it. Holding that frame makes the whole series read as a single argument.</figcaption></figure>
