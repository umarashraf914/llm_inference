<figure><div class='ts'>Fig 118 &nbsp;&middot;&nbsp; 13:40</div><h3>What amortising means</h3><svg viewBox='0 0 680 446' role='img'><title>What amortising means</title><text class="hd" x="40" y="46">Amortise: spread a fixed cost over more work</text><g class="m"><rect x="90" y="70" width="500" height="42" rx="6"/><text class="sub" x="340.0" y="91.0" text-anchor="middle" dominant-baseline="central">cost per token  =  140 GB  /  how many tokens share the read</text></g><text class="cap" x="40" y="158" text-anchor="start">1 token</text><g class="h"><rect x="220" y="140" width="400" height="30" rx="3"/></g><text class="sub2" x="230" y="160" text-anchor="start">140 GB</text><text class="cap" x="40" y="204" text-anchor="start">10 tokens</text><g class="s"><rect x="220" y="186" width="56" height="30" rx="3"/></g><text class="sub2" x="286" y="204" text-anchor="start">14 GB</text><text class="cap" x="40" y="250" text-anchor="start">200 tokens</text><g class="s"><rect x="220" y="232" width="8" height="30" rx="3"/></g><text class="sub2" x="238" y="250" text-anchor="start">0.7 GB</text><text class="cap" x="40" y="296" text-anchor="start">2,000 tokens</text><g class="s"><rect x="220" y="278" width="4" height="30" rx="3"/></g><text class="sub2" x="234" y="296" text-anchor="start">0.07 GB</text><text class="cap" x="40" y="348" text-anchor="start">The read costs the same every time. What changes is how many tokens are produced from it, and</text><text class="cap" x="40" y="368" text-anchor="start">the per-token cost falls in exact proportion.</text><text class="cap" x="40" y="404" text-anchor="start">Prefill sits at the bottom of this list. Decode sits at the top, and cannot move down on its</text><text class="cap" x="40" y="424" text-anchor="start">own, because there is only ever one token to show for the read.</text></svg><figcaption>The word appears constantly from here on. It is division, and the last line is why decode is stuck at the worst row.</figcaption></figure>
