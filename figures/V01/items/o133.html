<figure><div class='ts'>Fig 133 &nbsp;&middot;&nbsp; 22:19</div><h3>The redundant work, quantified</h3><svg viewBox="0 0 680 442" role="img"><title>The redundant work, quantified</title><text class="hd" x="40" y="46">The observation that saves everything</text><g class="s"><rect x="60" y="70" width="560" height="60" rx="8"></rect><text class="lbl" x="340.0" y="100.0" text-anchor="middle" dominant-baseline="central">The keys and values for earlier positions do not depend on the new token</text></g><text class="cap" x="40" y="168" text-anchor="start">They were fully determined when those earlier tokens were processed, and they never change</text><text class="cap" x="40" y="188" text-anchor="start">afterwards. So recomputing them for every new token would be doing identical work repeatedly.</text><text class="hd" x="40" y="238">How bad that would get</text><g class="u"><rect x="60" y="258" width="250" height="42" rx="6"></rect><text class="sub" x="185.0" y="279.0" text-anchor="middle" dominant-baseline="central">generating token 1,000</text></g><g class="h"><rect x="360" y="258" width="260" height="42" rx="6"></rect><text class="sub" x="490.0" y="279.0" text-anchor="middle" dominant-baseline="central">recompute 999 positions</text></g><g class="u"><rect x="60" y="316" width="250" height="42" rx="6"></rect><text class="sub" x="185.0" y="337.0" text-anchor="middle" dominant-baseline="central">total over n tokens</text></g><g class="h"><rect x="360" y="316" width="260" height="42" rx="6"></rect><text class="sub" x="490.0" y="337.0" text-anchor="middle" dominant-baseline="central">n(n-1)/2, quadratic in n</text></g><text class="cap" x="40" y="400" text-anchor="start">For a thousand tokens that is about half a million position-recomputations instead of a</text><text class="cap" x="40" y="420" text-anchor="start">thousand. The waste grows with the square of the conversation length.</text></svg><figcaption>Quadratic against linear. Without a fix, long conversations would become impossible rather than merely expensive.</figcaption></figure>
