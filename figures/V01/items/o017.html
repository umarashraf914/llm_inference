<figure><div class='ts'>Fig 17 &nbsp;&middot;&nbsp; 0:23</div><h3>The components</h3><svg viewBox="0 0 680 318" role="img"><title>The components</title><g class="u"><rect x="40" y="40" width="600" height="200" rx="14"></rect><text class="lbl" x="62" y="66">The stack a request passes through</text></g><g class="u"><rect x="62" y="96" width="176" height="56" rx="8"></rect><text class="lbl" x="150.0" y="115.0" text-anchor="middle" dominant-baseline="central">Router</text><text class="sub" x="150.0" y="133.0" text-anchor="middle" dominant-baseline="central">which machine</text></g><g class="u"><rect x="254" y="96" width="176" height="56" rx="8"></rect><text class="lbl" x="342.0" y="115.0" text-anchor="middle" dominant-baseline="central">Scheduler</text><text class="sub" x="342.0" y="133.0" text-anchor="middle" dominant-baseline="central">batch with others</text></g><g class="u"><rect x="446" y="96" width="176" height="56" rx="8"></rect><text class="lbl" x="534.0" y="115.0" text-anchor="middle" dominant-baseline="central">Memory manager</text><text class="sub" x="534.0" y="133.0" text-anchor="middle" dominant-baseline="central">which weights, which chip</text></g><g class="s"><rect x="62" y="164" width="176" height="56" rx="8"></rect><text class="lbl" x="150.0" y="183.0" text-anchor="middle" dominant-baseline="central">Kernels</text><text class="sub" x="150.0" y="201.0" text-anchor="middle" dominant-baseline="central">the actual arithmetic</text></g><g class="u"><rect x="254" y="164" width="176" height="56" rx="8"></rect><text class="lbl" x="342.0" y="183.0" text-anchor="middle" dominant-baseline="central">Orchestration</text><text class="sub" x="342.0" y="201.0" text-anchor="middle" dominant-baseline="central">wiring it together</text></g><text class="cap" x="40" y="276" text-anchor="start">Five layers, each solving a different problem. By the end of this series you should be able to</text><text class="cap" x="40" y="296" text-anchor="start">look at any production system and say why each one is there.</text></svg><figcaption>Only one of these does arithmetic. The other four exist because arithmetic is not the thing that makes inference hard.</figcaption></figure>
