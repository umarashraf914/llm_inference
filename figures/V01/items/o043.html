<figure><div class='ts'>Fig 43 &nbsp;&middot;&nbsp; 25:43</div><h3>Why layer 1 surviving does not rescue the cache</h3><svg viewBox='0 0 680 380' role='img'><title>Why layer 1 surviving does not rescue the cache</title><text class="hd" x="40" y="46">So could the cache keep layer 1 and throw away the rest?</text><text class="cap" x="40" y="92" text-anchor="start">layer 1, still valid</text><g class="s"><rect x="300" y="76" width="4" height="30" rx="1"/></g><text class="sub2" x="316" y="96" text-anchor="start">1.25% of the prefill work</text><text class="cap" x="40" y="152" text-anchor="start">layers 2 to 80, invalid</text><g class="h"><rect x="300" y="136" width="320" height="30" rx="3"/><text class="sub" x="460.0" y="151.0" text-anchor="middle" dominant-baseline="central">98.75%, all of it recomputed</text></g><text class="cap" x="40" y="226" text-anchor="start">In principle yes, for the positions whose token did not change. In practice it buys almost</text><text class="cap" x="40" y="246" text-anchor="start">nothing, because one layer out of eighty is a rounding error.</text><text class="cap" x="40" y="282" text-anchor="start">And to compute layer 2 you need layer 1's attention output, which means running layer 1's</text><text class="cap" x="40" y="302" text-anchor="start">attention anyway. The saving is smaller still.</text><text class="cap" x="40" y="338" text-anchor="start">So serving systems treat a prefix mismatch as invalidating everything from that point, which is</text><text class="cap" x="40" y="358" text-anchor="start">correct for layers 2 upward and not worth an exception for layer 1.</text></svg><figcaption>Your observation is correct and the engineering conclusion is unchanged. One layer in eighty is not worth the bookkeeping.</figcaption></figure>
