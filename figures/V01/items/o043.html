<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 25:43</div><h3>Why layer 1 surviving does not rescue the cache</h3><svg viewBox='0 0 680 448' role='img'><title>Why layer 1 surviving does not rescue the cache</title><text class="hd" x="40" y="46">So could the cache keep layer 1's keys and values and redo the rest?</text><text class="cap" x="40" y="96" text-anchor="start">layer 1, still valid</text><g class="s"><rect x="300" y="76" width="4.1" height="30" rx="1"/></g><text class="sub2" x="316.1" y="96" text-anchor="start">1 of 80 layers: 1.25% of the work</text><text class="cap" x="40" y="156" text-anchor="start">layers 2 to 80, invalid</text><g class="h"><rect x="300" y="136" width="320" height="30" rx="3"/><text class="sub" x="460.0" y="151.0" text-anchor="middle" dominant-baseline="central">79 of 80: 98.75%, redone</text></g><text class="cap" x="40" y="226" text-anchor="start">In principle yes, for the positions whose token and position did not change. In practice</text><text class="cap" x="40" y="246" text-anchor="start">it buys almost nothing, because one layer out of eighty is a small share to begin with.</text><text class="cap" x="40" y="286" text-anchor="start">And the share actually saved is smaller still. Layer 2 needs layer 1's output, so layer</text><text class="cap" x="40" y="306" text-anchor="start">1 has to run anyway, and all that would be skipped is its key and value projections.</text><text class="cap" x="40" y="326" text-anchor="start">Those use 2 × 8,192 × 1,024 = 16.8 million of the model's 70.55 billion weights: about</text><text class="cap" x="40" y="346" text-anchor="start">0.02% of the work.</text><text class="cap" x="40" y="386" text-anchor="start">So serving systems treat a changed token as invalidating everything after it, which is</text><text class="cap" x="40" y="406" text-anchor="start">correct for layers 2 upward and not worth an exception for layer 1. The next part turns</text><text class="cap" x="40" y="426" text-anchor="start">that into the rule they use.</text></svg><figcaption>Layer 1's keys really do survive, and the engineering conclusion is unchanged: one layer in eighty, and in practice a fiftieth of that layer, is not worth the bookkeeping. Bars to scale.</figcaption></figure>
