<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:02</div><h3>Eight bits count from 0 to 255</h3><div class='wg'><div class='ctl'><label class='opt'><input type='checkbox'> 128</label><label class='opt'><input type='checkbox' checked> 64</label><label class='opt'><input type='checkbox'> 32</label><label class='opt'><input type='checkbox' checked> 16</label><label class='opt'><input type='checkbox'> 8</label><label class='opt'><input type='checkbox' checked> 4</label><label class='opt'><input type='checkbox'> 2</label><label class='opt'><input type='checkbox' checked> 1</label></div><div class='ctl'><button type='button'>All 0</button><button type='button'>All 1</button><button type='button'>Reset</button></div><svg viewBox='0 0 680 436' role='img'><title>Eight bits count from 0 to 255</title><text class="hd" x="40" y="34">Eight bits, each worth twice the one to its right</text><text class="sub2" x="116.0" y="60" text-anchor="middle">worth 128</text><g class="u" data-cell="0"><rect x="88" y="70" width="56" height="40" rx="4"/><text class="lbl" x="116.0" y="90" text-anchor="middle" dominant-baseline="central" data-bit="0">0</text></g><text class="sub2" x="116.0" y="132" text-anchor="middle" data-part="0">0</text><text class="sub2" x="180.0" y="60" text-anchor="middle">worth 64</text><g class="m" data-cell="1"><rect x="152" y="70" width="56" height="40" rx="4"/><text class="lbl" x="180.0" y="90" text-anchor="middle" dominant-baseline="central" data-bit="1">1</text></g><text class="sub2" x="180.0" y="132" text-anchor="middle" data-part="1">64</text><text class="sub2" x="244.0" y="60" text-anchor="middle">worth 32</text><g class="u" data-cell="2"><rect x="216" y="70" width="56" height="40" rx="4"/><text class="lbl" x="244.0" y="90" text-anchor="middle" dominant-baseline="central" data-bit="2">0</text></g><text class="sub2" x="244.0" y="132" text-anchor="middle" data-part="2">0</text><text class="sub2" x="308.0" y="60" text-anchor="middle">worth 16</text><g class="m" data-cell="3"><rect x="280" y="70" width="56" height="40" rx="4"/><text class="lbl" x="308.0" y="90" text-anchor="middle" dominant-baseline="central" data-bit="3">1</text></g><text class="sub2" x="308.0" y="132" text-anchor="middle" data-part="3">16</text><text class="sub2" x="372.0" y="60" text-anchor="middle">worth 8</text><g class="u" data-cell="4"><rect x="344" y="70" width="56" height="40" rx="4"/><text class="lbl" x="372.0" y="90" text-anchor="middle" dominant-baseline="central" data-bit="4">0</text></g><text class="sub2" x="372.0" y="132" text-anchor="middle" data-part="4">0</text><text class="sub2" x="436.0" y="60" text-anchor="middle">worth 4</text><g class="m" data-cell="5"><rect x="408" y="70" width="56" height="40" rx="4"/><text class="lbl" x="436.0" y="90" text-anchor="middle" dominant-baseline="central" data-bit="5">1</text></g><text class="sub2" x="436.0" y="132" text-anchor="middle" data-part="5">4</text><text class="sub2" x="500.0" y="60" text-anchor="middle">worth 2</text><g class="u" data-cell="6"><rect x="472" y="70" width="56" height="40" rx="4"/><text class="lbl" x="500.0" y="90" text-anchor="middle" dominant-baseline="central" data-bit="6">0</text></g><text class="sub2" x="500.0" y="132" text-anchor="middle" data-part="6">0</text><text class="sub2" x="564.0" y="60" text-anchor="middle">worth 1</text><g class="m" data-cell="7"><rect x="536" y="70" width="56" height="40" rx="4"/><text class="lbl" x="564.0" y="90" text-anchor="middle" dominant-baseline="central" data-bit="7">1</text></g><text class="sub2" x="564.0" y="132" text-anchor="middle" data-part="7">1</text><g class="m"><rect x="90" y="154" width="500" height="40" rx="6"/><text class="sub" x="340" y="174" text-anchor="middle" dominant-baseline="central" data-sum="">0 + 64 + 0 + 16 + 0 + 4 + 0 + 1  =  85</text></g><text class="cap" x="40" y="234" text-anchor="start">Each position is worth twice the one to its right, just as each decimal place is worth</text><text class="cap" x="40" y="254" text-anchor="start">ten times the one to its right. A 1 switches that position's value on and a 0 leaves it</text><text class="cap" x="40" y="274" text-anchor="start">off; the number is the sum of the values switched on.</text><text class="cap" x="40" y="314" text-anchor="start">So 01010101 is 64 + 16 + 4 + 1 = 85. All ones is</text><text class="cap" x="40" y="334" text-anchor="start">128 + 64 + 32 + 16 + 8 + 4 + 2 + 1 = 255 and all zeros is 0, so eight bits count from 0</text><text class="cap" x="40" y="354" text-anchor="start">to 255: 2^8 = 256 different patterns.</text><text class="cap" x="40" y="394" text-anchor="start">Tick the boxes to set the bits. The sum the figure shows was checked against Python for</text><text class="cap" x="40" y="414" text-anchor="start">all 256 patterns.</text></svg></div><figcaption>A bit pattern is a number written in twos instead of tens. Every quantity in this series, weights included, is stored as patterns like this one.</figcaption><script>(() => {

  const MINUS = '−';
  const fx = (v, d = 2) => { const s = Math.abs(v).toFixed(d); return (v < 0 && +s !== 0 ? MINUS : '') + s; };
  const gx = (v, d = 0) => { const s = Math.abs(v).toFixed(d); const [a, b] = s.split('.');
    const t = a.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (v < 0 && +s !== 0 ? MINUS : '') + t + (b !== undefined ? '.' + b : ''); };

  const fig = document.currentScript.closest('figure');
  const P = [128, 64, 32, 16, 8, 4, 2, 1], START = [0, 1, 0, 1, 0, 1, 0, 1];
  const box = [...fig.querySelectorAll('input[type=checkbox]')], q = s => fig.querySelector(s);
  function draw() {
    const bits = box.map(c => c.checked ? 1 : 0);
    let total = 0;
    bits.forEach((v, i) => {
      q(`[data-bit="${i}"]`).textContent = v;
      q(`[data-cell="${i}"]`).setAttribute('class', v ? 'm' : 'u');
      q(`[data-part="${i}"]`).textContent = P[i] * v;
      total += P[i] * v;
    });
    q('[data-sum]').textContent = bits.map((v, i) => P[i] * v).join(' + ') + '  =  ' + total;
  }
  const set = v => { box.forEach((c, i) => c.checked = Array.isArray(v) ? !!v[i] : v); draw(); };
  box.forEach(c => c.addEventListener('change', draw));
  const [z, o, r] = fig.querySelectorAll('button');
  z.addEventListener('click', () => set(false));
  o.addEventListener('click', () => set(true));
  r.addEventListener('click', () => set(START));
  draw();
})();</script></figure>
