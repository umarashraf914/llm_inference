<figure><div class='ts'>Fig 52 &nbsp;&middot;&nbsp; 0:46</div><h3>The three cases, on your words alone</h3><svg viewBox='0 0 680 386' role='img'><title>The three cases, on your words alone</title><text class="hd" x="40" y="46">Your seven tokens only, with the shared preamble set aside</text><text class="cap" x="40" y="96" text-anchor="start">A  continue the chat</text><rect x="280" y="78" width="280" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="280" y="78" width="280" height="30" rx="3"/></g><text class="sub2" x="572" y="96" text-anchor="start">7 / 7</text><text class="sub2" x="280" y="122" text-anchor="start">all of it, plus the whole history</text><text class="cap" x="40" y="150" text-anchor="start">B  France to Japan</text><rect x="280" y="132" width="280" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="280" y="132" width="200" height="30" rx="3"/></g><text class="sub2" x="572" y="150" text-anchor="start">5 / 7</text><text class="cap" x="40" y="204" text-anchor="start">C  same words, reordered</text><rect x="280" y="186" width="280" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="280" y="186" width="3" height="30" rx="3"/></g><text class="sub2" x="572" y="204" text-anchor="start">0 / 7</text><text class="cap" x="40" y="268" text-anchor="start">Measured against the whole prompt all three look excellent, at 99.1% or better, because the</text><text class="cap" x="40" y="288" text-anchor="start">770-token preamble dominates and always matches.</text><text class="cap" x="40" y="308" text-anchor="start">That number flatters everything and hides the part you control.</text><text class="cap" x="40" y="344" text-anchor="start">Measured against your own words the three cases are completely different, and the difference is</text><text class="cap" x="40" y="364" text-anchor="start">decided by where the first divergence falls.</text></svg><figcaption>Two ways of quoting the same hit rate. The flattering one is the one usually reported, so it is worth knowing what it is hiding.</figcaption></figure>
