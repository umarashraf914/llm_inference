<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 1:24</div><h3>Frontier models carry up to fourteen times the parameters this atlas follows</h3><svg viewBox='0 0 680 428' role='img'><title>Frontier models carry up to fourteen times the parameters this atlas follows</title><text class="hd" x="40" y="46">Parameter counts, drawn to scale</text><text class="cap" x="40" y="90" text-anchor="start">the model this atlas follows</text><g class="s"><rect x="230" y="70" width="28.0" height="30" rx="3"/></g><text class="sub2" x="268.0" y="90" text-anchor="start">70 billion</text><text class="cap" x="40" y="136" text-anchor="start">Kimi K2, an open model</text><g class="h"><rect x="230" y="116" width="400.0" height="30" rx="3"/></g><text class="sub" x="430.0" y="136" text-anchor="middle">1 trillion</text><text class="cap" x="40" y="202" text-anchor="start">The frontier systems in production today hold from the high hundreds of billions of</text><text class="cap" x="40" y="222" text-anchor="start">parameters to over a trillion. Kimi K2, an open model of this generation, holds one</text><text class="cap" x="40" y="242" text-anchor="start">trillion: 1,000 ÷ 70 = 14.3 times the model this atlas follows. DeepSeek V4 and the</text><text class="cap" x="40" y="262" text-anchor="start">closed models from OpenAI, Anthropic and Google are the same kind of workload.</text><text class="cap" x="40" y="302" text-anchor="start">Kimi K2 is a mixture of experts: it uses only 32 billion of its parameters for each</text><text class="cap" x="40" y="322" text-anchor="start">token, a design the sixth video in the series is about. Every one of its trillion</text><text class="cap" x="40" y="342" text-anchor="start">parameters still has to be stored somewhere.</text><text class="cap" x="40" y="382" text-anchor="start">This atlas follows a 70-billion-parameter model throughout, because every number about</text><text class="cap" x="40" y="402" text-anchor="start">it can be worked by hand. The arithmetic scales with the parameter count.</text></svg><figcaption>The trillion is Kimi K2's own published figure. The captions spell the model Chimera 2, so a search of them for Kimi will fail.</figcaption></figure>
