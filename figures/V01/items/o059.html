<figure><div class='ts'>Fig 59 &nbsp;&middot;&nbsp; 0:21</div><h3>Why the network delay does not slow the answer</h3><svg viewBox='0 0 680 530' role='img'><title>Why the network delay does not slow the answer</title><text class="hd" x="40" y="46">The lag is the same for every token, so it does not slow the stream</text><line class="axis" x1="150" y1="150" x2="620" y2="150"/><g class="m"><rect x="160" y="120" width="14" height="26" rx="2"/></g><g class="s"><rect x="182" y="196" width="14" height="26" rx="2"/></g><line class="conn" x1="167" y1="150" x2="189" y2="192" marker-end="url(#arw)"/><g class="m"><rect x="212" y="120" width="14" height="26" rx="2"/></g><g class="s"><rect x="234" y="196" width="14" height="26" rx="2"/></g><line class="conn" x1="219" y1="150" x2="241" y2="192" marker-end="url(#arw)"/><g class="m"><rect x="264" y="120" width="14" height="26" rx="2"/></g><g class="s"><rect x="286" y="196" width="14" height="26" rx="2"/></g><line class="conn" x1="271" y1="150" x2="293" y2="192" marker-end="url(#arw)"/><g class="m"><rect x="316" y="120" width="14" height="26" rx="2"/></g><g class="s"><rect x="338" y="196" width="14" height="26" rx="2"/></g><line class="conn" x1="323" y1="150" x2="345" y2="192" marker-end="url(#arw)"/><g class="m"><rect x="368" y="120" width="14" height="26" rx="2"/></g><g class="s"><rect x="390" y="196" width="14" height="26" rx="2"/></g><line class="conn" x1="375" y1="150" x2="397" y2="192" marker-end="url(#arw)"/><g class="m"><rect x="420" y="120" width="14" height="26" rx="2"/></g><g class="s"><rect x="442" y="196" width="14" height="26" rx="2"/></g><line class="conn" x1="427" y1="150" x2="449" y2="192" marker-end="url(#arw)"/><g class="m"><rect x="472" y="120" width="14" height="26" rx="2"/></g><g class="s"><rect x="494" y="196" width="14" height="26" rx="2"/></g><line class="conn" x1="479" y1="150" x2="501" y2="192" marker-end="url(#arw)"/><g class="m"><rect x="524" y="120" width="14" height="26" rx="2"/></g><g class="s"><rect x="546" y="196" width="14" height="26" rx="2"/></g><line class="conn" x1="531" y1="150" x2="553" y2="192" marker-end="url(#arw)"/><g class="m"><rect x="576" y="120" width="14" height="26" rx="2"/></g><g class="s"><rect x="598" y="196" width="14" height="26" rx="2"/></g><line class="conn" x1="583" y1="150" x2="605" y2="192" marker-end="url(#arw)"/><text class="sub2" x="40" y="138" text-anchor="start">made</text><text class="sub2" x="40" y="214" text-anchor="start">seen</text><text class="sub2" x="150" y="258" text-anchor="start">each arrow is one one-way trip, and they are all the same length</text><text class="cap" x="40" y="308" text-anchor="start">Because the offset never grows, the spacing between tokens on the screen matches the</text><text class="cap" x="40" y="328" text-anchor="start">spacing between tokens on the server exactly. The reader sees text at exactly the rate</text><text class="cap" x="40" y="348" text-anchor="start">the model generates it.</text><text class="cap" x="40" y="388" text-anchor="start">What the trip delays is only the beginning. It adds tens of milliseconds to the wait for</text><text class="cap" x="40" y="408" text-anchor="start">the first token, against the hundreds the model spends reading the prompt before it can</text><text class="cap" x="40" y="428" text-anchor="start">start.</text><text class="cap" x="40" y="468" text-anchor="start">Had the server buffered the whole answer, a five-hundred-token reply would show nothing</text><text class="cap" x="40" y="488" text-anchor="start">for about fifteen seconds and then appear at once. That is the difference a user would</text><text class="cap" x="40" y="508" text-anchor="start">notice.</text></svg><figcaption>A constant offset shifts a stream without stretching it. This is why the answer feels smooth even from the other side of the world.</figcaption></figure>
