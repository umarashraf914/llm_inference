h="8.18" height="30" rx="1"/></g><g class="u"><rect x="508.75" y="66" width="8.18" height="30" rx="1"/></g><g class="u"><rect x="518.12" y="66" width="8.18" height="30" rx="1"/></g><g class="u"><rect x="527.5" y="66" width="8.18" height="30" rx="1"/></g><g class="u"><rect x="536.88" y="66" width="8.18" height="30" rx="1"/></g><g class="u"><rect x="546.25" y="66" width="8.18" height="30" rx="1"/></g><g class="u"><rect x="555.62" y="66" width="8.18" height="30" rx="1"/></g><g class="u"><rect x="565.0" y="66" width="8.18" height="30" rx="1"/></g><g class="u"><rect x="574.38" y="66" width="8.18" height="30" rx="1"/></g><g class="u"><rect x="583.75" y="66" width="8.18" height="30" rx="1"/></g><g class="u"><rect x="593.12" y="66" width="8.18" height="30" rx="1"/></g><g class="u"><rect x="602.5" y="66" width="8.18" height="30" rx="1"/></g><g class="u"><rect x="611.88" y="66" width="8.18" height="30" rx="1"/></g><g class="u"><rect x="621.25" y="66" width="8.18" height="30" rx="1"/></g><g class="u"><rect x="630.62" y="66" width="8.18" height="30" rx="1"/></g><text class="sub2" x="40" y="116" text-anchor="start">heads 1 and 2 highlighted; 64 heads in all, each a slice of 128 numbers</text><text class="hd" x="40" y="150">Each head does all of attention on its own slice</text><g class="u"><rect x="60" y="168" width="360" height="28" rx="4"/><text class="sub" x="240.0" y="182.0" text-anchor="middle" dominant-baseline="central">its own scores against its own 128-number keys</text></g><g class="u"><rect x="60" y="204" width="360" height="28" rx="4"/><text class="sub" x="240.0" y="218.0" text-anchor="middle" dominant-baseline="central">its own softmax</text></g><line class="conn" x1="240" y1="196" x2="240" y2="203" marker-end="url(#arw)"/><g class="u"><rect x="60" y="240" width="360" height="28" rx="4"/><text class="sub" x="240.0" y="254.0" text-anchor="middle" dominant-baseline="central">its own weighted average of 128-number values</text></g><line class="conn" x1="240" y1="232" x2="240" y2="239" marker-end="url(#arw)"/><text class="sub2" x="440" y="223" text-anchor="start">× 64 heads, side by side</text><g class="s"><rect x="60" y="290" width="560" height="30" rx="4"/><text class="sub" x="340.0" y="305.0" text-anchor="middle" dominant-baseline="central">64 results × 128 numbers, laid end to end = 8,192 numbers, then × W_O</text></g><text class="cap" x="40" y="358" text-anchor="start">One big attention over whole vectors is not what real models run. The 8,192-number query</text><text class="cap" x="40" y="378" text-anchor="start">is cut into 64 slices of 128, and so are the keys and values. Each slice, called a head,</text><text class="cap" x="40" y="398" text-anchor="start">does the whole of the last three figures on its own: its own scores, its own softmax,</text><text class="cap" x="40" y="418" text-anchor="start">its own weighted average.</text><text class="cap" x="40" y="458" text-anchor="start">Heads are free to learn different patterns, which is the point of having many: one can</text><text class="cap" x="40" y="478" text-anchor="start">follow grammar while another tracks a name. Their 64 results, 128 numbers each, are laid</text><text class="cap" x="40" y="498" text-anchor="start">end to end into one 8,192-number vector, and a fourth matrix, W_O, mixes them; it is the</text><text class="cap" x="40" y="518" text-anchor="start">combine matrix of {{fig:v01-o104}}.</text><text class="cap" x="40" y="558" text-anchor="start">So the grid of {{fig:v01-p13}} is computed 64 times per layer, once per head: 256 million</text><text class="cap" x="40" y="578" text-anchor="start">scores at 2,000 tokens.</text></svg><figcaption>Heads cost nothing extra in weights: the same three matrices, cut into slices. What they buy is 64 independent ways of deciding what matters.</figcaption></figure>
