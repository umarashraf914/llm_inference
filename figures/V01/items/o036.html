<figure><div class='ts'>Fig 36 &nbsp;&middot;&nbsp; 25:43</div><h3>Why a mismatch poisons everything after it</h3><svg viewBox='0 0 680 420' role='img'><title>Why a mismatch poisons everything after it</title><text class="hd" x="40" y="46">Change one token early, and everything after it becomes wrong</text><g class="s"><rect x="130" y="70" width="70" height="30" rx="3"/><text class="sub" x="165.0" y="85.0" text-anchor="middle" dominant-baseline="central">t1</text></g><g class="s"><rect x="206" y="70" width="70" height="30" rx="3"/><text class="sub" x="241.0" y="85.0" text-anchor="middle" dominant-baseline="central">t2</text></g><g class="s"><rect x="282" y="70" width="70" height="30" rx="3"/><text class="sub" x="317.0" y="85.0" text-anchor="middle" dominant-baseline="central">t3</text></g><g class="s"><rect x="358" y="70" width="70" height="30" rx="3"/><text class="sub" x="393.0" y="85.0" text-anchor="middle" dominant-baseline="central">t4</text></g><g class="s"><rect x="434" y="70" width="70" height="30" rx="3"/><text class="sub" x="469.0" y="85.0" text-anchor="middle" dominant-baseline="central">t5</text></g><g class="s"><rect x="510" y="70" width="70" height="30" rx="3"/><text class="sub" x="545.0" y="85.0" text-anchor="middle" dominant-baseline="central">t6</text></g><g class="s"><rect x="586" y="70" width="70" height="30" rx="3"/><text class="sub" x="621.0" y="85.0" text-anchor="middle" dominant-baseline="central">t7</text></g><text class="sub2" x="40" y="90" text-anchor="start">cached</text><g class="s"><rect x="130" y="152" width="70" height="30" rx="3"/><text class="sub" x="165.0" y="167.0" text-anchor="middle" dominant-baseline="central">t1</text></g><g class="h"><rect x="206" y="152" width="70" height="30" rx="3"/><text class="sub" x="241.0" y="167.0" text-anchor="middle" dominant-baseline="central">XX</text></g><g class="h"><rect x="282" y="152" width="70" height="30" rx="3"/><text class="sub" x="317.0" y="167.0" text-anchor="middle" dominant-baseline="central">t3</text></g><g class="h"><rect x="358" y="152" width="70" height="30" rx="3"/><text class="sub" x="393.0" y="167.0" text-anchor="middle" dominant-baseline="central">t4</text></g><g class="h"><rect x="434" y="152" width="70" height="30" rx="3"/><text class="sub" x="469.0" y="167.0" text-anchor="middle" dominant-baseline="central">t5</text></g><g class="h"><rect x="510" y="152" width="70" height="30" rx="3"/><text class="sub" x="545.0" y="167.0" text-anchor="middle" dominant-baseline="central">t6</text></g><g class="h"><rect x="586" y="152" width="70" height="30" rx="3"/><text class="sub" x="621.0" y="167.0" text-anchor="middle" dominant-baseline="central">t7</text></g><text class="sub2" x="40" y="172" text-anchor="start">arriving</text><line class="mark xok" x1="206" y1="62" x2="206" y2="190"/><text class="sub2" x="206" y="236" text-anchor="middle">differs here</text><text class="cap" x="40" y="286" text-anchor="start">Token 3 has not changed, but its key and value were computed in a context that included token</text><text class="cap" x="40" y="306" text-anchor="start">2. With a different token 2, the old key and value for token 3 are simply wrong.</text><text class="cap" x="40" y="342" text-anchor="start">So the match cannot skip over a difference and pick up again. Everything from the first</text><text class="cap" x="40" y="362" text-anchor="start">mismatch onward has to be recomputed, identical or not.</text><text class="cap" x="40" y="398" text-anchor="start">That is why it is a prefix rule and not a search for matching pieces.</text></svg><figcaption>The reason the rule is so unforgiving. It is not a design choice; it follows from what a key and value are.</figcaption></figure>
