<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 24:31</div><h3>“Kilo” means 1,000, except in “320 KB”, where it means 1,024</h3><svg viewBox='0 0 680 486' role='img'><title>“Kilo” means 1,000, except in “320 KB”, where it means 1,024</title><text class="hd" x="40" y="46">The same byte counts, read with kilo as 1,000 and as 1,024</text><text class="sub2" x="40" y="76" text-anchor="start">bytes</text><text class="sub2" x="230" y="76" text-anchor="start">in thousands (kB, MB, GB)</text><text class="sub2" x="380" y="76" text-anchor="start">in 1,024s (KiB, MiB, GiB)</text><text class="sub2" x="40" y="100" text-anchor="start">one layer, one token: 4,096</text><text class="sub2" x="230" y="100" text-anchor="start">4.096 kB</text><text class="sub2" x="380" y="100" text-anchor="start">4 KiB</text><text class="sub2" x="40" y="126" text-anchor="start">one token: 327,680</text><text class="sub2" x="230" y="126" text-anchor="start">327.7 kB</text><text class="sub2" x="380" y="126" text-anchor="start">320 KiB</text><text class="sub2" x="40" y="152" text-anchor="start">1,000 tokens: 327,680,000</text><text class="sub2" x="230" y="152" text-anchor="start">327.7 MB</text><text class="sub2" x="380" y="152" text-anchor="start">312.5 MiB</text><text class="sub2" x="40" y="178" text-anchor="start">10,000 tokens: 3,276,800,000</text><text class="sub2" x="230" y="178" text-anchor="start">3.277 GB</text><text class="sub2" x="380" y="178" text-anchor="start">3.052 GiB</text><text class="sub2" x="40" y="204" text-anchor="start">100,000 tokens: 32,768,000,000</text><text class="sub2" x="230" y="204" text-anchor="start">32.77 GB</text><text class="sub2" x="380" y="204" text-anchor="start">30.52 GiB</text><text class="cap" x="40" y="260" text-anchor="start">Kilo means a thousand everywhere except in computer memory, which is built in powers of</text><text class="cap" x="40" y="280" text-anchor="start">two: 2^10 = 1,024 is close to a thousand, so it borrowed the name. To keep them apart,</text><text class="cap" x="40" y="300" text-anchor="start">1,024 bytes is written KiB, a kibibyte, and 1,000 bytes kB ({{fig:v01-p05}}).</text><text class="cap" x="40" y="340" text-anchor="start">The cache per token is 327,680 bytes: exactly 320 KiB, or 327.68 kB. The '320 kilobytes'</text><text class="cap" x="40" y="360" text-anchor="start">often quoted is the binary one. Multiplied by a thousand tokens it is 312.5 MiB or</text><text class="cap" x="40" y="380" text-anchor="start">327.7 MB; round figures such as 320 MB, 3.2 GB and 32 GB mix the two, and this atlas's</text><text class="cap" x="40" y="400" text-anchor="start">0.33, 3.3 and 33 GB are decimal.</text><text class="cap" x="40" y="440" text-anchor="start">The difference is 2.4% per factor of 1,024, so it never changes a conclusion. It only</text><text class="cap" x="40" y="460" text-anchor="start">explains why two correct sources can print different numbers for the same memory.</text></svg><figcaption>Two conventions, both in daily use. Specification sheets for bandwidth are decimal; memory sizes are often binary; and a careful reader checks which before comparing.</figcaption></figure>
