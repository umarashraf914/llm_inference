<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 25:43</div><h3>Why the front of the prompt is the expensive place to edit</h3><svg viewBox='0 0 680 404' role='img'><title>Why the front of the prompt is the expensive place to edit</title><text class="hd" x="40" y="46">Change one token near the very front</text><g class="s"><rect x="40" y="74" width="70" height="30" rx="3"/><text class="sub" x="75.0" y="89.0" text-anchor="middle" dominant-baseline="central">first 4</text></g><g class="m"><rect x="114" y="74" width="50" height="30" rx="3"/><text class="sub" x="139.0" y="89.0" text-anchor="middle" dominant-baseline="central">edit</text></g><g class="h"><rect x="168" y="74" width="190" height="30" rx="3"/><text class="sub" x="263.0" y="89.0" text-anchor="middle" dominant-baseline="central">rest of system prompt</text></g><g class="h"><rect x="362" y="74" width="110" height="30" rx="3"/><text class="sub" x="417.0" y="89.0" text-anchor="middle" dominant-baseline="central">tools</text></g><g class="h"><rect x="476" y="74" width="164" height="30" rx="3"/><text class="sub" x="558.0" y="89.0" text-anchor="middle" dominant-baseline="central">everything after</text></g><line class="mark xok" x1="112" y1="66" x2="112" y2="112"/><text class="sub2" x="112" y="132" text-anchor="middle">the match ends here</text><text class="cap" x="40" y="182" text-anchor="start">Because the match runs from the front, a difference at the fifth token ends it at the</text><text class="cap" x="40" y="202" text-anchor="start">fifth token. Nothing after that point can be reused, however identical it is.</text><text class="cap" x="40" y="242" text-anchor="start">So editing the system prompt does not cost a little. It invalidates every cached</text><text class="cap" x="40" y="262" text-anchor="start">conversation on the machine at once, for every user, because they all share that prefix.</text><text class="cap" x="40" y="302" text-anchor="start">For the follow-up of {{fig:v01-o049}}: 784 tokens to prefill instead of 4, 196 times the work,</text><text class="cap" x="40" y="322" text-anchor="start">from a one-token change.</text><text class="cap" x="40" y="362" text-anchor="start">Which is why prompts are built with the most stable text first and the most variable</text><text class="cap" x="40" y="382" text-anchor="start">text last, and why operators are careful about editing a system prompt in production.</text></svg><figcaption>A practical consequence that falls straight out of prefix matching. Order matters: stable text at the front, variable text at the back. Widths schematic.</figcaption></figure>
