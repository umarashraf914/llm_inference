<figure><div class='ts'>Fig 56 &nbsp;&middot;&nbsp; 25:43</div><h3>Why the front of the prompt is the expensive place to edit</h3><svg viewBox='0 0 680 372' role='img'><title>Why the front of the prompt is the expensive place to edit</title><text class="hd" x="40" y="46">Change one token at the very front</text><g class="m"><rect x="40" y="74" width="60" height="30" rx="3"/><text class="sub" x="70.0" y="89.0" text-anchor="middle" dominant-baseline="central">edit</text></g><g class="u"><rect x="104" y="74" width="180" height="30" rx="3"/><text class="sub" x="194.0" y="89.0" text-anchor="middle" dominant-baseline="central">rest of the system prompt</text></g><g class="u"><rect x="288" y="74" width="160" height="30" rx="3"/><text class="sub" x="368.0" y="89.0" text-anchor="middle" dominant-baseline="central">tools</text></g><g class="u"><rect x="452" y="74" width="188" height="30" rx="3"/><text class="sub" x="546.0" y="89.0" text-anchor="middle" dominant-baseline="central">everything after</text></g><line class="mark xok" x1="100" y1="66" x2="100" y2="112"/><text class="sub2" x="100" y="132" text-anchor="middle">the match ends here</text><text class="cap" x="40" y="182" text-anchor="start">Because the match runs from the front, a difference at position five ends it at position five.</text><text class="cap" x="40" y="202" text-anchor="start">Nothing after that point can be reused, however identical it is.</text><text class="cap" x="40" y="238" text-anchor="start">So editing the system prompt does not cost a little. It invalidates every cached conversation on</text><text class="cap" x="40" y="258" text-anchor="start">the machine at once, for every user, because they all share that prefix.</text><text class="cap" x="40" y="294" text-anchor="start">206 times the prefill work, from a one-token change.</text><text class="cap" x="40" y="330" text-anchor="start">Which is why serving systems put the most stable text first and the most variable text last, and</text><text class="cap" x="40" y="350" text-anchor="start">why operators are careful about editing a system prompt in production.</text></svg><figcaption>A practical consequence that falls straight out of prefix matching. Order matters: stable text at the front, variable text at the back.</figcaption></figure>
