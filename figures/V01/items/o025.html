<figure><div class='ts'>Fig 25 &nbsp;&middot;&nbsp; 0:21</div><h3>Why skills are loaded only when needed</h3><svg viewBox='0 0 680 458' role='img'><title>Why skills are loaded only when needed</title><text class="hd" x="40" y="46">Always present: just enough to know what exists</text><g class="s"><rect x="50" y="70" width="66" height="28" rx="3"/><text class="sub" x="83.0" y="84.0" text-anchor="middle" dominant-baseline="central">skill 1</text></g><g class="s"><rect x="124" y="70" width="66" height="28" rx="3"/><text class="sub" x="157.0" y="84.0" text-anchor="middle" dominant-baseline="central">skill 2</text></g><g class="s"><rect x="198" y="70" width="66" height="28" rx="3"/><text class="sub" x="231.0" y="84.0" text-anchor="middle" dominant-baseline="central">skill 3</text></g><g class="s"><rect x="272" y="70" width="66" height="28" rx="3"/><text class="sub" x="305.0" y="84.0" text-anchor="middle" dominant-baseline="central">skill 4</text></g><g class="s"><rect x="346" y="70" width="66" height="28" rx="3"/><text class="sub" x="379.0" y="84.0" text-anchor="middle" dominant-baseline="central">skill 5</text></g><g class="s"><rect x="420" y="70" width="66" height="28" rx="3"/><text class="sub" x="453.0" y="84.0" text-anchor="middle" dominant-baseline="central">skill 6</text></g><g class="s"><rect x="494" y="70" width="66" height="28" rx="3"/><text class="sub" x="527.0" y="84.0" text-anchor="middle" dominant-baseline="central">skill 7</text></g><g class="s"><rect x="568" y="70" width="66" height="28" rx="3"/><text class="sub" x="601.0" y="84.0" text-anchor="middle" dominant-baseline="central">skill 8</text></g><text class="sub2" x="50" y="124" text-anchor="start">a name and one sentence each, about 30 tokens apiece</text><text class="hd" x="40" y="174">Loaded only when one is actually needed</text><g class="s"><rect x="50" y="198" width="66" height="28" rx="3"/><text class="sub" x="83.0" y="212.0" text-anchor="middle" dominant-baseline="central">skill 1</text></g><g class="m"><rect x="124" y="198" width="66" height="28" rx="3"/><text class="sub" x="157.0" y="212.0" text-anchor="middle" dominant-baseline="central">skill 2</text></g><rect x="198" y="198" width="438" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="417.0" y="212.0" text-anchor="middle" dominant-baseline="central">the other six stay as one-line descriptions</text><text class="sub2" x="124" y="254" text-anchor="start">its full instructions enter the context, about 2,000 tokens</text><text class="cap" x="40" y="304" text-anchor="start">Forty skills at thirty tokens is 1,200 tokens, which is affordable. The same forty fully loaded</text><text class="cap" x="40" y="324" text-anchor="start">would be 80,000 tokens and would fill 40% of a large window before you typed anything.</text><text class="cap" x="40" y="360" text-anchor="start">So the descriptions are always there and the contents are fetched when the description matches</text><text class="cap" x="40" y="380" text-anchor="start">what you asked for. Loading one costs about 3,200 tokens instead of 80,000.</text><text class="cap" x="40" y="416" text-anchor="start">A plugin is a bundle of skills and tools, and it behaves the same way: the catalogue is cheap,</text><text class="cap" x="40" y="436" text-anchor="start">the contents are fetched on demand.</text></svg><figcaption>Progressive disclosure, and the arithmetic that forces it. Keeping every skill's full text resident would cost more window than the conversation.</figcaption></figure>
