<figure><div class='ts'>Fig 77 &nbsp;&middot;&nbsp; 4:14</div><h3>The two specifications that matter</h3><svg viewBox="0 0 680 244" role="img"><title>The two specifications that matter</title><g class="m"><rect x="50" y="55" width="265" height="76" rx="8"></rect><text class="lbl" x="182.5" y="76.0" text-anchor="middle" dominant-baseline="central">Compute throughput</text><text class="sub" x="182.5" y="94.0" text-anchor="middle" dominant-baseline="central">floating-point operations</text><text class="sub" x="182.5" y="111.0" text-anchor="middle" dominant-baseline="central">per second</text></g><g class="h"><rect x="365" y="55" width="265" height="76" rx="8"></rect><text class="lbl" x="497.5" y="76.0" text-anchor="middle" dominant-baseline="central">Memory bandwidth</text><text class="sub" x="497.5" y="94.0" text-anchor="middle" dominant-baseline="central">bytes per second, between</text><text class="sub" x="497.5" y="111.0" text-anchor="middle" dominant-baseline="central">off-chip memory and the chip</text></g><text class="cap" x="40" y="178" text-anchor="start">Producing a token needs both: fetch weights from memory, then multiply them against the input.</text><text class="cap" x="40" y="206" text-anchor="start">If either channel is too slow, the other sits idle. Performance is set by whichever runs out</text><text class="cap" x="40" y="226" text-anchor="start">first, never by an average of the two.</text></svg><figcaption>Two independent resources. Almost every performance question in this series reduces to asking which of them a workload exhausts.</figcaption></figure>
