<figure><div class='ts'>Fig 42 &nbsp;&middot;&nbsp; 25:43</div><h3>Why context-dependent keys are the point</h3><svg viewBox='0 0 680 410' role='img'><title>Why context-dependent keys are the point</title><text class="hd" x="40" y="46">The same word, two sentences, two different keys</text><g class="u"><rect x="60" y="74" width="110" height="32" rx="3"/><text class="sub" x="115.0" y="90.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="u"><rect x="174" y="74" width="110" height="32" rx="3"/><text class="sub" x="229.0" y="90.0" text-anchor="middle" dominant-baseline="central">river</text></g><g class="m"><rect x="288" y="74" width="110" height="32" rx="3"/><text class="sub" x="343.0" y="90.0" text-anchor="middle" dominant-baseline="central">bank</text></g><text class="sub2" x="420" y="96" text-anchor="start">a key that leans toward water</text><g class="u"><rect x="60" y="126" width="110" height="32" rx="3"/><text class="sub" x="115.0" y="142.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="u"><rect x="174" y="126" width="110" height="32" rx="3"/><text class="sub" x="229.0" y="142.0" text-anchor="middle" dominant-baseline="central">savings</text></g><g class="m"><rect x="288" y="126" width="110" height="32" rx="3"/><text class="sub" x="343.0" y="142.0" text-anchor="middle" dominant-baseline="central">bank</text></g><text class="sub2" x="420" y="148" text-anchor="start">a key that leans toward money</text><text class="cap" x="40" y="208" text-anchor="start">Identical token, identical position, identical W_K. Above layer 1 the two keys are</text><text class="cap" x="40" y="228" text-anchor="start">different, because the vectors going into W_K are different.</text><text class="cap" x="40" y="268" text-anchor="start">Those vectors differ because attention has already blended river or savings into bank</text><text class="cap" x="40" y="288" text-anchor="start">({{fig:v01-o039}}). That blending is how the model tells the two senses apart, and the</text><text class="cap" x="40" y="308" text-anchor="start">keys inherit it.</text><text class="cap" x="40" y="348" text-anchor="start">A key that stayed the same in both sentences would hide the difference from every later</text><text class="cap" x="40" y="368" text-anchor="start">token that looks back at bank. Keys that depend on context are not a flaw to engineer</text><text class="cap" x="40" y="388" text-anchor="start">around; they are how the meaning travels.</text></svg><figcaption>The limitation and the capability are the same phenomenon. Keys depend on context because that is how meaning reaches later tokens, and the same dependence decides which cached keys a server may reuse, the subject of the next part.</figcaption></figure>
