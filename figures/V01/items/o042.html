<figure><div class='ts'>Fig 42 &nbsp;&middot;&nbsp; 25:43</div><h3>Why context-dependent keys are the point</h3><svg viewBox='0 0 680 362' role='img'><title>Why context-dependent keys are the point</title><text class="hd" x="40" y="46">The same word, two sentences, two different keys</text><g class="u"><rect x="60" y="74" width="110" height="32" rx="3"/><text class="sub" x="115.0" y="90.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="u"><rect x="174" y="74" width="110" height="32" rx="3"/><text class="sub" x="229.0" y="90.0" text-anchor="middle" dominant-baseline="central">river</text></g><g class="m"><rect x="288" y="74" width="110" height="32" rx="3"/><text class="sub" x="343.0" y="90.0" text-anchor="middle" dominant-baseline="central">bank</text></g><text class="sub2" x="420" y="96" text-anchor="start">a key that leans toward water</text><g class="u"><rect x="60" y="126" width="110" height="32" rx="3"/><text class="sub" x="115.0" y="142.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="u"><rect x="174" y="126" width="110" height="32" rx="3"/><text class="sub" x="229.0" y="142.0" text-anchor="middle" dominant-baseline="central">savings</text></g><g class="m"><rect x="288" y="126" width="110" height="32" rx="3"/><text class="sub" x="343.0" y="142.0" text-anchor="middle" dominant-baseline="central">bank</text></g><text class="sub2" x="420" y="148" text-anchor="start">a key that leans toward money</text><text class="cap" x="40" y="208" text-anchor="start">Identical token, identical position, identical W_K. Above layer 1 the two keys are different,</text><text class="cap" x="40" y="228" text-anchor="start">because the vectors going into W_K are different.</text><text class="cap" x="40" y="264" text-anchor="start">This is the same fact seen from the other side, and it is the reason the model can tell the two</text><text class="cap" x="40" y="284" text-anchor="start">sentences apart at all.</text><text class="cap" x="40" y="320" text-anchor="start">A model whose keys really were independent of context would be unable to disambiguate anything.</text><text class="cap" x="40" y="340" text-anchor="start">The property you spotted, if it held all the way up, would make the model useless.</text></svg><figcaption>The objection and the capability are the same phenomenon. Keys have to depend on context for the model to work, and that dependence is exactly what makes the prefix rule necessary.</figcaption></figure>
