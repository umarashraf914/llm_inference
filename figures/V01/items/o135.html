<figure><div class='ts'>Fig 135 &nbsp;&middot;&nbsp; 23:09</div><h3>What a cache is, in general</h3><svg viewBox='0 0 680 360' role='img'><title>What a cache is, in general</title><text class="hd" x="40" y="46">A cache is something kept so it need not be made again</text><g class="h"><rect x="40" y="70" width="285" height="40" rx="4"/><text class="sub" x="182.5" y="90.0" text-anchor="middle" dominant-baseline="central">work it out every time</text></g><g class="s"><rect x="355" y="70" width="285" height="40" rx="4"/><text class="sub" x="497.5" y="90.0" text-anchor="middle" dominant-baseline="central">work it out once, keep it</text></g><text class="cap" x="40" y="150" text-anchor="start">The trade is always the same: memory in exchange for time. You spend space to avoid repeating</text><text class="cap" x="40" y="170" text-anchor="start">an effort.</text><text class="cap" x="40" y="206" text-anchor="start">It pays off only when the kept thing is used again. Something computed once and never needed</text><text class="cap" x="40" y="226" text-anchor="start">again is worth nothing to keep.</text><text class="cap" x="40" y="262" text-anchor="start">In decode, every earlier token is needed at every later step, which is about as favourable as</text><text class="cap" x="40" y="282" text-anchor="start">a cache can get. The cost is that the kept thing grows with every token.</text><text class="cap" x="40" y="318" text-anchor="start">That growing store is the key-value cache, and it becomes the central problem of most of the</text><text class="cap" x="40" y="338" text-anchor="start">videos that follow.</text></svg><figcaption>Stated generally first, because the specific one is easier to judge once you know what the trade always is.</figcaption></figure>
