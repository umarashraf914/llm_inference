<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 28:06</div><h3>When 64 users share each read, the cost per token falls sixty-four-fold</h3><svg viewBox='0 0 680 790' role='img'><title>When 64 users share each read, the cost per token falls sixty-four-fold</title><text class="hd" x="40" y="46">One H100 at $3 an hour, decoding the 70B model, weights only</text><g class="u"><rect x="60" y="66" width="560" height="36" rx="6"/><text class="sub" x="340.0" y="84.0" text-anchor="middle" dominant-baseline="central">one request:  3.35 TB/s ÷ 140 GB  =  23.9 tokens a second</text></g><g class="u"><rect x="60" y="112" width="560" height="36" rx="6"/><text class="sub" x="340.0" y="130.0" text-anchor="middle" dominant-baseline="central">23.9 × 3,600 seconds  =  86,143 tokens an hour</text></g><g class="h"><rect x="60" y="158" width="560" height="36" rx="6"/><text class="sub" x="340.0" y="176.0" text-anchor="middle" dominant-baseline="central">$3 ÷ 86,143 tokens  =  $34.83 per million tokens</text></g><text class="hd" x="40" y="222">Sixty-four requests sharing each read</text><g class="u"><rect x="60" y="242" width="560" height="36" rx="6"/><text class="sub" x="340.0" y="260.0" text-anchor="middle" dominant-baseline="central">each read makes 64 tokens:  64 × 23.9  =  1,531 tokens a second</text></g><g class="u"><rect x="60" y="288" width="560" height="36" rx="6"/><text class="sub" x="340.0" y="306.0" text-anchor="middle" dominant-baseline="central">1,531 × 3,600 seconds  =  5.51 million tokens an hour</text></g><g class="s"><rect x="60" y="334" width="560" height="36" rx="6"/><text class="sub" x="340.0" y="352.0" text-anchor="middle" dominant-baseline="central">$3 ÷ 5.51 million tokens  =  $0.54 per million tokens</text></g><text class="hd" x="40" y="402">Cost per million tokens (log scale)</text><text class="cap" x="40" y="441" text-anchor="start">one request</text><g class="h"><rect x="200" y="422" width="330.4" height="28" rx="3"/></g><text class="sub2" x="540.4" y="441" text-anchor="start">$34.83</text><text class="cap" x="40" y="481" text-anchor="start">a batch of 64</text><g class="s"><rect x="200" y="462" width="95.60000000000002" height="28" rx="3"/></g><text class="sub2" x="305.6" y="481" text-anchor="start">$0.54</text><line class="tick" x1="200" y1="506" x2="590.0" y2="506"/><line class="tick" x1="200.0" y1="506" x2="200.0" y2="512"/><text class="sub2" x="200.0" y="528" text-anchor="middle">$0.10</text><line class="tick" x1="330.0" y1="506" x2="330.0" y2="512"/><text class="sub2" x="330.0" y="528" text-anchor="middle">$1</text><line class="tick" x1="460.0" y1="506" x2="460.0" y2="512"/><text class="sub2" x="460.0" y="528" text-anchor="middle">$10</text><line class="tick" x1="590.0" y1="506" x2="590.0" y2="512"/><text class="sub2" x="590.0" y="528" text-anchor="middle">$100</text><text class="cap" x="40" y="568" text-anchor="start">The operator pays for the chip by the hour and sells tokens, so a token's cost is the</text><text class="cap" x="40" y="588" text-anchor="start">hourly price divided by the tokens made in that hour ({{fig:v01-p02}}).</text><text class="cap" x="40" y="628" text-anchor="start">Alone, one request gets 23.9 tokens a second, one per read of the weights ({{fig:v01-o014}}).</text><text class="cap" x="40" y="648" text-anchor="start">In a batch of 64 every read makes 64 tokens ({{fig:v01-p24}}) and the step takes just as</text><text class="cap" x="40" y="668" text-anchor="start">long, because 64 operations per byte is still below the ridge of 295. Same hour, same</text><text class="cap" x="40" y="688" text-anchor="start">price, 64 times the tokens: the cost per token falls 64-fold.</text><text class="cap" x="40" y="728" text-anchor="start">This counts the weights only. Each request also reads its own cache, which is not shared</text><text class="cap" x="40" y="748" text-anchor="start">({{fig:v01-p32}}), so a real batch falls short of the full 64-fold. The $3 is an illustrative</text><text class="cap" x="40" y="768" text-anchor="start">rental price, as in {{fig:v08-o029}}, which sets two published measurements side by side.</text></svg><figcaption>Why operators batch: the hour costs the same however many users share it, so every user added to each read of the weights divides the price of a token. Log scale.</figcaption></figure>
