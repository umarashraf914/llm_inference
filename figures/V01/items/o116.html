<figure><div class='ts'>Fig 116 &nbsp;&middot;&nbsp; 11:46</div><h3>Why operations and bytes come out equal</h3><svg viewBox="0 0 680 648" role="img"><title>Why operations and bytes come out equal</title><text class="hd" x="40" y="46">The same parameter count drives both sides</text><text class="cap" x="40" y="92" text-anchor="start">Operations</text><g class="m"><rect x="230" y="76" width="300" height="32" rx="3"></rect><text class="sub" x="380.0" y="92.0" text-anchor="middle" dominant-baseline="central">2 x N  =  140 billion</text></g><text class="cap" x="40" y="152" text-anchor="start">Bytes, at 16 bits</text><g class="h"><rect x="230" y="136" width="300" height="32" rx="3"></rect><text class="sub" x="380.0" y="152.0" text-anchor="middle" dominant-baseline="central">N x 2  =  140 gigabytes</text></g><g class="s"><rect x="190" y="190" width="300" height="42" rx="6"></rect><text class="sub" x="340.0" y="211.0" text-anchor="middle" dominant-baseline="central">1 operation per byte</text></g><text class="cap" x="40" y="274" text-anchor="start">The 2 in the operation count and the 2 bytes of a 16-bit weight are unrelated quantities that</text><text class="cap" x="40" y="294" text-anchor="start">happen to be the same number. Their ratio is exactly 1, and that is the arithmetic intensity of</text><text class="cap" x="40" y="314" text-anchor="start">a single-token decode step.</text><text class="cap" x="40" y="350" text-anchor="start">The chip needs about 295 to keep its arithmetic units busy.</text><text class="hd" x="40" y="398">And the coincidence is specific to 16 bits</text><text class="cap" x="40" y="438" text-anchor="start">FP32</text><g class="h"><rect x="150" y="422" width="30" height="28" rx="3"></rect></g><text class="sub2" x="192" y="438" text-anchor="start">0.5 per byte</text><text class="sub2" x="480" y="438" text-anchor="start">ridge at batch 590</text><text class="cap" x="40" y="478" text-anchor="start">FP16</text><g class="h"><rect x="150" y="462" width="60" height="28" rx="3"></rect></g><text class="sub2" x="222" y="478" text-anchor="start">1 per byte</text><text class="sub2" x="480" y="478" text-anchor="start">ridge at batch 295</text><text class="cap" x="40" y="518" text-anchor="start">INT8</text><g class="s"><rect x="150" y="502" width="120" height="28" rx="3"></rect></g><text class="sub2" x="282" y="518" text-anchor="start">2 per byte</text><text class="sub2" x="480" y="518" text-anchor="start">ridge at batch 148</text><text class="cap" x="40" y="558" text-anchor="start">INT4</text><g class="s"><rect x="150" y="542" width="240" height="28" rx="3"></rect></g><text class="sub2" x="402" y="558" text-anchor="start">4 per byte</text><text class="sub2" x="480" y="558" text-anchor="start">ridge at batch 74</text><text class="cap" x="40" y="606" text-anchor="start">Narrower weights do not change the operation count at all. They only shrink the bytes, which</text><text class="cap" x="40" y="626" text-anchor="start">is why quantization moves this number and why batching moves it further.</text></svg><figcaption>This is the payoff of the whole derivation. One rule for operations, one for bytes, and their ratio is the number that decides whether a chip is waiting on maths or on memory.</figcaption></figure>
