<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:46</div><h3>Why operations and bytes come out equal</h3><svg viewBox='0 0 680 694' role='img'><title>Why operations and bytes come out equal</title><text class="hd" x="40" y="46">The same parameter count drives both sides</text><text class="cap" x="40" y="92" text-anchor="start">Operations</text><g class="m"><rect x="250" y="72" width="260" height="30" rx="4"/><text class="sub" x="380.0" y="87.0" text-anchor="middle" dominant-baseline="central">2 × N  =  140 billion</text></g><text class="cap" x="40" y="138" text-anchor="start">Bytes, at 16 bits</text><g class="h"><rect x="250" y="118" width="260" height="30" rx="4"/><text class="sub" x="380.0" y="133.0" text-anchor="middle" dominant-baseline="central">N × 2  =  140 gigabytes</text></g><g class="s"><rect x="220" y="168" width="320" height="34" rx="6"/><text class="sub" x="380.0" y="185.0" text-anchor="middle" dominant-baseline="central">1 operation per byte</text></g><text class="cap" x="40" y="240" text-anchor="start">The 2 in the operation count and the 2 bytes of a 16-bit weight are unrelated quantities</text><text class="cap" x="40" y="260" text-anchor="start">that happen to be the same number. Their ratio is exactly 1, and that is the arithmetic</text><text class="cap" x="40" y="280" text-anchor="start">intensity of a single-token decode step. The chip needs about 295 to keep its arithmetic</text><text class="cap" x="40" y="300" text-anchor="start">units busy (Part 8).</text><text class="hd" x="40" y="344">Stored in fewer bits, still multiplied in 16</text><text class="cap" x="40" y="380" text-anchor="start">32 bits, 4 bytes</text><g class="h"><rect x="250" y="362" width="25.0" height="26" rx="3"/></g><text class="sub2" x="285.0" y="380" text-anchor="start">0.5 operations per byte</text><text class="cap" x="40" y="414" text-anchor="start">16 bits, 2 bytes</text><g class="h"><rect x="250" y="396" width="50" height="26" rx="3"/></g><text class="sub2" x="310" y="414" text-anchor="start">1 operation per byte</text><text class="cap" x="40" y="448" text-anchor="start">8 bits, 1 byte</text><g class="s"><rect x="250" y="430" width="100" height="26" rx="3"/></g><text class="sub2" x="360" y="448" text-anchor="start">2 operations per byte</text><text class="cap" x="40" y="482" text-anchor="start">4 bits, half a byte</text><g class="s"><rect x="250" y="464" width="200" height="26" rx="3"/></g><text class="sub2" x="460" y="482" text-anchor="start">4 operations per byte</text><text class="cap" x="40" y="528" text-anchor="start">Narrower weights do not change the operation count at all; they only shrink the bytes.</text><text class="cap" x="40" y="548" text-anchor="start">These rows assume the weights are widened back to 16 bits on the chip just before each</text><text class="cap" x="40" y="568" text-anchor="start">multiply ({{fig:v04-o057}}), so the chip's peak stays at 989 trillion operations a</text><text class="cap" x="40" y="588" text-anchor="start">second.</text><text class="cap" x="40" y="628" text-anchor="start">If the arithmetic itself is done in 8 bits, the H100's peak doubles as well, to 1,979</text><text class="cap" x="40" y="648" text-anchor="start">trillion operations a second, and so does the intensity the chip needs. Quantization</text><text class="cap" x="40" y="668" text-anchor="start">moves the bytes; batching, in Part 10, moves the operations.</text></svg><figcaption>The payoff of the whole derivation. One rule for operations, one for bytes, and their ratio is the number that decides whether a chip is waiting on maths or on memory.</figcaption></figure>
