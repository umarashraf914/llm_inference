<figure><div class='ts'>Fig 09 &nbsp;&middot;&nbsp; 0:00</div><h3>Turning scores into probabilities</h3><svg viewBox='0 0 680 450' role='img'><title>Turning scores into probabilities</title><text class="hd" x="40" y="46">Scores become shares of one whole</text><g class="u"><rect x="120" y="66" width="440" height="42" rx="6"/><text class="sub" x="340.0" y="87.0" text-anchor="middle" dominant-baseline="central">each score becomes e to that power, then divide by the total</text></g><text class="cap" x="40" y="150" text-anchor="start">cat</text><text class="sub2" x="110" y="150" text-anchor="start">8.2</text><text class="sub2" x="180" y="150" text-anchor="start">3,641</text><g class="m"><rect x="250" y="134" width="380" height="28" rx="3"/></g><text class="sub2" x="640" y="150" text-anchor="start">74.5%</text><text class="cap" x="40" y="190" text-anchor="start">dog</text><text class="sub2" x="110" y="190" text-anchor="start">7.1</text><text class="sub2" x="180" y="190" text-anchor="start">1,212</text><g class="m"><rect x="250" y="174" width="126" height="28" rx="3"/></g><text class="sub2" x="386" y="190" text-anchor="start">24.8%</text><text class="cap" x="40" y="230" text-anchor="start">the</text><text class="sub2" x="110" y="230" text-anchor="start">3.5</text><text class="sub2" x="180" y="230" text-anchor="start">33</text><g class="u"><rect x="250" y="214" width="6" height="28" rx="3"/></g><text class="sub2" x="266" y="230" text-anchor="start">0.68%</text><text class="cap" x="40" y="270" text-anchor="start">banana</text><text class="sub2" x="110" y="270" text-anchor="start">0.4</text><text class="sub2" x="180" y="270" text-anchor="start">1.5</text><g class="u"><rect x="250" y="254" width="3" height="28" rx="3"/></g><text class="sub2" x="263" y="270" text-anchor="start">0.03%</text><text class="cap" x="40" y="316" text-anchor="start">The four shares add up to 1.00. Raising e to each score makes every value positive, and</text><text class="cap" x="40" y="336" text-anchor="start">dividing by the total turns them into shares of one whole.</text><text class="cap" x="40" y="372" text-anchor="start">That step is called softmax, and it is why a model's output is described as a probability.</text><text class="cap" x="40" y="408" text-anchor="start">Notice what the exponential did: a score of 8.2 against 7.1 is a gap of one, but the shares</text><text class="cap" x="40" y="428" text-anchor="start">come out 74% against 25%. Small differences in score become large differences in confidence.</text></svg><figcaption>Worked with real arithmetic. The last line is the part that surprises people: the exponential exaggerates every gap.</figcaption></figure>
