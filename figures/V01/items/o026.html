<figure><div class='ts'>Fig 26 &nbsp;&middot;&nbsp; 25:43</div><h3>Why the shared preamble is almost always warm</h3><svg viewBox='0 0 680 482' role='img'><title>Why the shared preamble is almost always warm</title><text class="hd" x="40" y="46">The most shared text in the whole system</text><g class="s"><rect x="43" y="74" width="58" height="30" rx="3"/><text class="sub" x="72.0" y="89.0" text-anchor="middle" dominant-baseline="central">user</text></g><g class="s"><rect x="109" y="74" width="58" height="30" rx="3"/><text class="sub" x="138.0" y="89.0" text-anchor="middle" dominant-baseline="central">user</text></g><g class="s"><rect x="175" y="74" width="58" height="30" rx="3"/><text class="sub" x="204.0" y="89.0" text-anchor="middle" dominant-baseline="central">user</text></g><g class="s"><rect x="241" y="74" width="58" height="30" rx="3"/><text class="sub" x="270.0" y="89.0" text-anchor="middle" dominant-baseline="central">user</text></g><g class="s"><rect x="307" y="74" width="58" height="30" rx="3"/><text class="sub" x="336.0" y="89.0" text-anchor="middle" dominant-baseline="central">user</text></g><g class="s"><rect x="373" y="74" width="58" height="30" rx="3"/><text class="sub" x="402.0" y="89.0" text-anchor="middle" dominant-baseline="central">user</text></g><g class="s"><rect x="439" y="74" width="58" height="30" rx="3"/><text class="sub" x="468.0" y="89.0" text-anchor="middle" dominant-baseline="central">user</text></g><g class="s"><rect x="505" y="74" width="58" height="30" rx="3"/><text class="sub" x="534.0" y="89.0" text-anchor="middle" dominant-baseline="central">user</text></g><g class="s"><rect x="571" y="74" width="58" height="30" rx="3"/><text class="sub" x="600.0" y="89.0" text-anchor="middle" dominant-baseline="central">user</text></g><line class="conn" x1="340" y1="112" x2="340" y2="136" marker-end="url(#arw)"/><g class="m"><rect x="190" y="140" width="300" height="40" rx="5"/><text class="sub" x="340.0" y="160.0" text-anchor="middle" dominant-baseline="central">the same system prompt, token for token</text></g><text class="cap" x="40" y="232" text-anchor="start">Because it is identical for everyone, its keys and values are computed once per machine and</text><text class="cap" x="40" y="252" text-anchor="start">then reused for every request that lands there.</text><text class="cap" x="40" y="288" text-anchor="start">It is the single most reliable cache hit in the system, and it stays warm precisely</text><text class="cap" x="40" y="308" text-anchor="start">because so many people share it. A single user's conversation is evicted once it falls</text><text class="cap" x="40" y="328" text-anchor="start">idle and others need the room ({{fig:v01-o054}}); this is not.</text><text class="cap" x="40" y="364" text-anchor="start">Which is why providers bill a cached read at a fraction of the normal price, a tenth on</text><text class="cap" x="40" y="384" text-anchor="start">many current models. A large fixed preamble is cheap to serve, and the discount reflects</text><text class="cap" x="40" y="404" text-anchor="start">that.</text><text class="cap" x="40" y="440" text-anchor="start">It is also why editing it is expensive: one changed token invalidates that shared prefix for</text><text class="cap" x="40" y="460" text-anchor="start">every user at once.</text></svg><figcaption>The one block of text everybody using the service shares. Its warmth is not luck; it is a consequence of being shared, and it is why cached input is priced separately ({{ref:v07-o014}}).</figcaption></figure>
