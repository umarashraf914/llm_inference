<figure><div class='ts'>Fig 26 &nbsp;&middot;&nbsp; 25:43</div><h3>Why the shared preamble is always warm</h3><svg viewBox='0 0 680 442' role='img'><title>Why the shared preamble is always warm</title><text class="hd" x="40" y="46">The most shared text in the whole system</text><g class="s"><rect x="46" y="74" width="62" height="30" rx="3"/><text class="sub" x="77.0" y="89.0" text-anchor="middle" dominant-baseline="central">user</text></g><g class="s"><rect x="116" y="74" width="62" height="30" rx="3"/><text class="sub" x="147.0" y="89.0" text-anchor="middle" dominant-baseline="central">user</text></g><g class="s"><rect x="186" y="74" width="62" height="30" rx="3"/><text class="sub" x="217.0" y="89.0" text-anchor="middle" dominant-baseline="central">user</text></g><g class="s"><rect x="256" y="74" width="62" height="30" rx="3"/><text class="sub" x="287.0" y="89.0" text-anchor="middle" dominant-baseline="central">user</text></g><g class="s"><rect x="326" y="74" width="62" height="30" rx="3"/><text class="sub" x="357.0" y="89.0" text-anchor="middle" dominant-baseline="central">user</text></g><g class="s"><rect x="396" y="74" width="62" height="30" rx="3"/><text class="sub" x="427.0" y="89.0" text-anchor="middle" dominant-baseline="central">user</text></g><g class="s"><rect x="466" y="74" width="62" height="30" rx="3"/><text class="sub" x="497.0" y="89.0" text-anchor="middle" dominant-baseline="central">user</text></g><g class="s"><rect x="536" y="74" width="62" height="30" rx="3"/><text class="sub" x="567.0" y="89.0" text-anchor="middle" dominant-baseline="central">user</text></g><g class="s"><rect x="606" y="74" width="62" height="30" rx="3"/><text class="sub" x="637.0" y="89.0" text-anchor="middle" dominant-baseline="central">user</text></g><line class="conn" x1="340" y1="112" x2="340" y2="136" marker-end="url(#arw)"/><g class="m"><rect x="190" y="140" width="300" height="40" rx="5"/><text class="sub" x="340.0" y="160.0" text-anchor="middle" dominant-baseline="central">the same system prompt, token for token</text></g><text class="cap" x="40" y="232" text-anchor="start">Because it is identical for everyone, its keys and values are computed once per machine and</text><text class="cap" x="40" y="252" text-anchor="start">then reused for every request that lands there.</text><text class="cap" x="40" y="288" text-anchor="start">It is the single most reliable cache hit in the system, and it stays warm precisely because so</text><text class="cap" x="40" y="308" text-anchor="start">many people share it. Your own conversation is evicted overnight; this is not.</text><text class="cap" x="40" y="344" text-anchor="start">Which is why providers price a cached read at about a tenth of a fresh one. A large fixed</text><text class="cap" x="40" y="364" text-anchor="start">preamble is cheap to serve, and the discount reflects that.</text><text class="cap" x="40" y="400" text-anchor="start">It is also why editing it is expensive: one changed token invalidates that shared prefix for</text><text class="cap" x="40" y="420" text-anchor="start">every user at once.</text></svg><figcaption>The one block of text everybody in the world is sharing. Its warmth is not luck; it is a consequence of being shared, and it is why cached input is priced separately.</figcaption></figure>
