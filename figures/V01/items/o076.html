<figure><div class='ts'>Fig 76 &nbsp;&middot;&nbsp; 3:51</div><h3>Latency and bandwidth are different things</h3><svg viewBox="0 0 680 418" role="img"><title>Latency and bandwidth are different things</title><text class="hd" x="40" y="46">Latency: how long one request takes</text><g class="u"><rect x="150" y="62" width="40" height="26" rx="3"></rect><text class="sub" x="170.0" y="75.0" text-anchor="middle" dominant-baseline="central">ask</text></g><rect x="196" y="62" width="330" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="361.0" y="75.0" text-anchor="middle" dominant-baseline="central">wait</text><g class="s"><rect x="532" y="62" width="60" height="26" rx="3"></rect><text class="sub" x="562.0" y="75.0" text-anchor="middle" dominant-baseline="central">arrive</text></g><text class="hd" x="40" y="148">Bandwidth: how many can be travelling at once</text><g class="s"><rect x="150" y="164" width="442" height="16" rx="2"></rect></g><g class="s"><rect x="150" y="186" width="442" height="16" rx="2"></rect></g><g class="s"><rect x="150" y="208" width="442" height="16" rx="2"></rect></g><g class="s"><rect x="150" y="230" width="442" height="16" rx="2"></rect></g><g class="s"><rect x="150" y="252" width="442" height="16" rx="2"></rect></g><g class="s"><rect x="150" y="274" width="442" height="16" rx="2"></rect></g><text class="cap" x="40" y="320" text-anchor="start">These are independent. A wide slow pipe has high bandwidth and high latency; a narrow quick</text><text class="cap" x="40" y="340" text-anchor="start">one has the reverse.</text><text class="cap" x="40" y="376" text-anchor="start">You cannot make the memory low-latency, because the distance and the physics are what they</text><text class="cap" x="40" y="396" text-anchor="start">are. What you can do is keep enough requests in flight that the pipe never runs dry.</text></svg><figcaption>Confusing these two produces most of the wrong intuitions in this field. Hold them apart.</figcaption></figure>
