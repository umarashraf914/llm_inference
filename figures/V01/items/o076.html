<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:02</div><h3>Latency and bandwidth are different things</h3><svg viewBox='0 0 680 592' role='img'><title>Latency and bandwidth are different things</title><text class="hd" x="40" y="46">Two pipes with the same bandwidth and different latency (illustrative)</text><line class="axis" x1="90" y1="270" x2="560" y2="270"/><line class="axis" x1="90" y1="80" x2="90" y2="270"/><line class="tick" x1="90.0" y1="270" x2="90.0" y2="274"/><text class="sub2" x="90.0" y="288" text-anchor="middle">0 ns</text><line class="tick" x1="207.5" y1="270" x2="207.5" y2="274"/><text class="sub2" x="207.5" y="288" text-anchor="middle">250 ns</text><line class="tick" x1="325.0" y1="270" x2="325.0" y2="274"/><text class="sub2" x="325.0" y="288" text-anchor="middle">500 ns</text><line class="tick" x1="442.5" y1="270" x2="442.5" y2="274"/><text class="sub2" x="442.5" y="288" text-anchor="middle">750 ns</text><line class="tick" x1="560.0" y1="270" x2="560.0" y2="274"/><text class="sub2" x="560.0" y="288" text-anchor="middle">1000 ns</text><line class="tick" x1="86" y1="270.0" x2="90" y2="270.0"/><text class="sub2" x="82" y="274.0" text-anchor="end">0 MB</text><line class="tick" x1="86" y1="215.7" x2="90" y2="215.7"/><text class="sub2" x="82" y="219.7" text-anchor="end">1 MB</text><line class="tick" x1="86" y1="161.4" x2="90" y2="161.4"/><text class="sub2" x="82" y="165.4" text-anchor="end">2 MB</text><line class="tick" x1="86" y1="107.1" x2="90" y2="107.1"/><text class="sub2" x="82" y="111.1" text-anchor="end">3 MB</text><polyline class="pl-m" points="90.0,270.0 137.0,270.0 560.0,106.3"/><text class="sub2" x="568.0" y="110.3" text-anchor="start">near</text><polyline class="pl-h" points="90.0,270.0 278.0,270.0 560.0,160.9"/><text class="sub2" x="568.0" y="164.9" text-anchor="start">far</text><text class="sub2 halo" x="145.0" y="262.0" text-anchor="start">100 ns</text><text class="sub2 halo" x="286.0" y="262.0" text-anchor="start">400 ns</text><text class="sub2" x="94" y="72" text-anchor="start">bytes arrived</text><text class="sub2" x="560" y="308" text-anchor="end">time since the first request</text><text class="cap" x="40" y="346" text-anchor="start">Latency is the wait from asking for data to the first of it arriving: where each line</text><text class="cap" x="40" y="366" text-anchor="start">leaves the axis. Bandwidth is how many bytes arrive each second once data is flowing:</text><text class="cap" x="40" y="386" text-anchor="start">how steeply the line climbs. Both lines climb at 3.35 TB/s; one starts 300 ns later, and</text><text class="cap" x="40" y="406" text-anchor="start">neither number tells you the other.</text><text class="cap" x="40" y="446" text-anchor="start">Measured on a Hopper-class GPU, one read from its memory takes about 480 clock ticks,</text><text class="cap" x="40" y="466" text-anchor="start">about 270 ns. To keep 3.35 TB/s arriving, everything due in the next 273 ns must already</text><text class="cap" x="40" y="486" text-anchor="start">have been asked for: 3.35 TB/s × 273 ns = 0.91 MB in flight at every moment.</text><text class="cap" x="40" y="526" text-anchor="start">The memory cannot be made low-latency; distance and the physics of a memory cell are</text><text class="cap" x="40" y="546" text-anchor="start">what they are. What a chip can do is keep enough requests in flight that the pipe never</text><text class="cap" x="40" y="566" text-anchor="start">runs dry, the subject of the next video ({{fig:v02-o055}}).</text></svg><figcaption>The two pipes are illustrative; the 270 ns was measured by Luo and colleagues in 2024 on the H800, a close relative of the H100. A slow first byte and a slow stream are different problems with different cures.</figcaption></figure>
