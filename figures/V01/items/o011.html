<figure><div class='ts'>Fig 11 &nbsp;&middot;&nbsp; 0:00</div><h3>Thirty milliseconds, per token</h3><svg viewBox="0 0 680 304" role="img"><title>Thirty milliseconds, per token</title><text class="hd" x="40" y="46">One turn of that loop takes about 30 milliseconds</text><line class="axis" x1="60" y1="110" x2="620" y2="110"></line><g class="s"><rect x="60" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="88" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="116" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="144" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="172" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="200" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="228" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="256" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="284" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="312" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="340" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="368" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="396" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="424" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="452" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="480" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="508" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="536" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="564" y="96" width="22" height="28" rx="2"></rect></g><g class="s"><rect x="592" y="96" width="22" height="28" rx="2"></rect></g><text class="sub2" x="60" y="156" text-anchor="start">one second of output: about 33 tokens</text><text class="cap" x="40" y="206" text-anchor="start">Thirty milliseconds is three hundredths of a second. Fast enough that the text appears to</text><text class="cap" x="40" y="226" text-anchor="start">stream out at reading speed, which is exactly the target.</text><text class="cap" x="40" y="262" text-anchor="start">This number is the subject of the whole video. By the end you will be able to derive it from</text><text class="cap" x="40" y="282" text-anchor="start">two hardware specifications, for any model on any chip.</text></svg><figcaption>Not an arbitrary figure. It is roughly the slowest a model can generate while still feeling responsive to a reader.</figcaption></figure>
