idth="14.8" height="28" rx="2"/></g><g class="s"><rect x="464.2" y="84" width="14.8" height="28" rx="2"/></g><g class="s"><rect x="481.0" y="84" width="14.8" height="28" rx="2"/></g><g class="s"><rect x="497.8" y="84" width="14.8" height="28" rx="2"/></g><g class="s"><rect x="514.6" y="84" width="14.8" height="28" rx="2"/></g><g class="s"><rect x="531.4" y="84" width="14.8" height="28" rx="2"/></g><g class="s"><rect x="548.2" y="84" width="14.8" height="28" rx="2"/></g><g class="s"><rect x="565.0" y="84" width="14.8" height="28" rx="2"/></g><g class="s"><rect x="581.8" y="84" width="14.8" height="28" rx="2"/></g><g class="s"><rect x="598.6" y="84" width="14.8" height="28" rx="2"/></g><line class="axis" x1="60" y1="124" x2="620" y2="124"/><line class="tick" x1="60.0" y1="124" x2="60.0" y2="129"/><text class="sub2" x="60.0" y="144" text-anchor="middle">0</text><line class="tick" x1="200.0" y1="124" x2="200.0" y2="129"/><text class="sub2" x="200.0" y="144" text-anchor="middle">0.25 s</text><line class="tick" x1="340.0" y1="124" x2="340.0" y2="129"/><text class="sub2" x="340.0" y="144" text-anchor="middle">0.5 s</text><line class="tick" x1="480.0" y1="124" x2="480.0" y2="129"/><text class="sub2" x="480.0" y="144" text-anchor="middle">0.75 s</text><line class="tick" x1="620.0" y1="124" x2="620.0" y2="129"/><text class="sub2" x="620.0" y="144" text-anchor="middle">1 s</text><text class="sub2" x="60" y="74" text-anchor="start">one token, 30 ms</text><text class="cap" x="40" y="194" text-anchor="start">Thirty milliseconds is three hundredths of a second, so one second holds 1,000 ÷ 30 =</text><text class="cap" x="40" y="214" text-anchor="start">33.3 of them: the 33 slots above, with a sliver left over. That is several times faster</text><text class="cap" x="40" y="234" text-anchor="start">than anyone reads.</text><text class="cap" x="40" y="274" text-anchor="start">The figure is a round one for a large model serving real traffic, not a law of nature.</text><text class="cap" x="40" y="294" text-anchor="start">By the end of this atlas the time per token can be worked out from two numbers printed</text><text class="cap" x="40" y="314" text-anchor="start">on a chip's specification sheet, for any model on any chip ({{fig:v01-p36}}).</text></svg><figcaption>One turn of the generate-one-token loop. The whole atlas is about where those 30 milliseconds go, and the answer is that almost none of them is spent on arithmetic.</figcaption></figure>
