<figure><div class='ts'>Fig 121 &nbsp;&middot;&nbsp; 14:51</div><h3>What a logarithmic axis means</h3><svg viewBox="0 0 680 432" role="img"><title>What a logarithmic axis means</title><text class="hd" x="40" y="46">On an ordinary scale, small things vanish</text><line class="axis" x1="60" y1="110" x2="620" y2="110"></line><g class="s"><rect x="60" y="96" width="1" height="14" rx="1"></rect></g><g class="s"><rect x="64" y="96" width="3" height="14" rx="1"></rect></g><g class="s"><rect x="70" y="96" width="28" height="14" rx="1"></rect></g><g class="h"><rect x="102" y="96" width="280" height="14" rx="2"></rect></g><text class="sub2" x="60" y="142" text-anchor="start">1, 3, 30 and 300 on a linear axis: the first three are invisible</text><text class="hd" x="40" y="192">On a logarithmic scale, each equal step is a multiplication</text><line class="axis" x1="60" y1="256" x2="620" y2="256"></line><line class="tick" x1="60" y1="248" x2="60" y2="264"></line><text class="sub2" x="60" y="284" text-anchor="middle">1</text><line class="tick" x1="200" y1="248" x2="200" y2="264"></line><text class="sub2" x="200" y="284" text-anchor="middle">10</text><line class="tick" x1="340" y1="248" x2="340" y2="264"></line><text class="sub2" x="340" y="284" text-anchor="middle">100</text><line class="tick" x1="480" y1="248" x2="480" y2="264"></line><text class="sub2" x="480" y="284" text-anchor="middle">1,000</text><line class="tick" x1="620" y1="248" x2="620" y2="264"></line><text class="sub2" x="620" y="284" text-anchor="middle">10,000</text><text class="cap" x="40" y="334" text-anchor="start">Same distance along the axis, but now it means ten times rather than plus ten. Both axes of</text><text class="cap" x="40" y="354" text-anchor="start">the roofline diagram later are drawn this way.</text><text class="cap" x="40" y="390" text-anchor="start">It is the only way to put a quantity of 1 and a quantity of 300 on the same picture and still</text><text class="cap" x="40" y="410" text-anchor="start">see both of them.</text></svg><figcaption>Needed to read the next figure honestly. A straight line on log axes is a multiplication, not an addition.</figcaption></figure>
