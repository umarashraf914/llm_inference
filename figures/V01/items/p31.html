<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 25:04</div><h3>At 100,000 tokens the cache costs one conversation a fifth of its speed</h3><svg viewBox='0 0 680 364' role='img'><title>At 100,000 tokens the cache costs one conversation a fifth of its speed</title><text class="hd" x="40" y="46">Bytes read for each token, weights plus cache, to scale</text><text class="cap" x="40" y="90" text-anchor="start">0 tokens of context</text><g class="u"><rect x="200" y="70" width="235.0" height="30" rx="3"/><text class="sub" x="317.5" y="85.0" text-anchor="middle" dominant-baseline="central">weights, 140 GB</text></g><text class="sub2" x="443.0" y="90" text-anchor="start">140.0 GB: 23.9 tokens/s</text><text class="cap" x="40" y="136" text-anchor="start">10,000 tokens of context</text><g class="u"><rect x="200" y="116" width="235.0" height="30" rx="3"/></g><g class="h"><rect x="435.0" y="116" width="5.5" height="30" rx="3"/></g><text class="sub2" x="448.5" y="136" text-anchor="start">143.3 GB: 23.4 tokens/s</text><text class="cap" x="40" y="182" text-anchor="start">100,000 tokens of context</text><g class="u"><rect x="200" y="162" width="235.0" height="30" rx="3"/></g><g class="h"><rect x="435.0" y="162" width="55.0" height="30" rx="3"/></g><text class="sub2" x="498.0" y="182" text-anchor="start">172.8 GB: 19.4 tokens/s</text><text class="cap" x="40" y="238" text-anchor="start">Every decode step reads all the weights and every key and value kept so far, through the</text><text class="cap" x="40" y="258" text-anchor="start">same 3.35 TB/s. So the speed limit of {{fig:v01-o130}} becomes bandwidth ÷ (weights + cache).</text><text class="cap" x="40" y="298" text-anchor="start">At ten thousand tokens the cache adds 3.3 GB and costs 2% of the speed. At a hundred</text><text class="cap" x="40" y="318" text-anchor="start">thousand it adds 32.8 GB and costs 19%: the conversation runs at 19.4 tokens a second</text><text class="cap" x="40" y="338" text-anchor="start">instead of 23.9.</text></svg><figcaption>For one user the cache is a tax that grows with the conversation. Batching, the next figure, turns it into the main cost.</figcaption></figure>
