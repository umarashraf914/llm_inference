<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:43</div><h3>Unit prefixes are powers of ten with names</h3><svg viewBox='0 0 680 596' role='img'><title>Unit prefixes are powers of ten with names</title><text class="hd" x="40" y="46">A prefix in front of a unit is a name for a power of ten</text><text class="sub2" x="96" y="76" text-anchor="start">name</text><text class="sub2" x="196" y="76" text-anchor="start">means</text><text class="sub2" x="286" y="76" text-anchor="start">in words</text><text class="sub2" x="390" y="76" text-anchor="start">seen in this atlas as</text><text class="sub2" x="196" y="106" text-anchor="start">10^3</text><g class="u"><rect x="40" y="88" width="40" height="26" rx="3"/><text class="sub" x="60.0" y="101.0" text-anchor="middle" dominant-baseline="central">k</text></g><text class="sub2" x="390" y="106" text-anchor="start">a few KB of prompt on the network</text><text class="cap" x="96" y="106" text-anchor="start">kilo</text><text class="sub2" x="286" y="106" text-anchor="start">thousand</text><text class="sub2" x="196" y="140" text-anchor="start">10^6</text><g class="u"><rect x="40" y="122" width="40" height="26" rx="3"/><text class="sub" x="60.0" y="135.0" text-anchor="middle" dominant-baseline="central">M</text></g><text class="sub2" x="390" y="140" text-anchor="start">prices per million tokens</text><text class="cap" x="96" y="140" text-anchor="start">mega</text><text class="sub2" x="286" y="140" text-anchor="start">million</text><text class="sub2" x="196" y="174" text-anchor="start">10^9</text><g class="u"><rect x="40" y="156" width="40" height="26" rx="3"/><text class="sub" x="60.0" y="169.0" text-anchor="middle" dominant-baseline="central">G</text></g><text class="sub2" x="390" y="174" text-anchor="start">140 GB of weights</text><text class="cap" x="96" y="174" text-anchor="start">giga</text><text class="sub2" x="286" y="174" text-anchor="start">billion</text><text class="sub2" x="196" y="208" text-anchor="start">10^12</text><g class="u"><rect x="40" y="190" width="40" height="26" rx="3"/><text class="sub" x="60.0" y="203.0" text-anchor="middle" dominant-baseline="central">T</text></g><text class="sub2" x="390" y="208" text-anchor="start">3.35 TB/s read from memory</text><text class="cap" x="96" y="208" text-anchor="start">tera</text><text class="sub2" x="286" y="208" text-anchor="start">trillion</text><text class="sub2" x="196" y="242" text-anchor="start">10^15</text><g class="u"><rect x="40" y="224" width="40" height="26" rx="3"/><text class="sub" x="60.0" y="237.0" text-anchor="middle" dominant-baseline="central">P</text></g><text class="sub2" x="390" y="242" text-anchor="start">about 1 PFLOP/s of arithmetic</text><text class="cap" x="96" y="242" text-anchor="start">peta</text><text class="sub2" x="286" y="242" text-anchor="start">quadrillion</text><line class="axis" x1="40" y1="268" x2="640" y2="268"/><text class="sub2" x="196" y="300" text-anchor="start">10^−3</text><g class="u"><rect x="40" y="282" width="40" height="26" rx="3"/><text class="sub" x="60.0" y="295.0" text-anchor="middle" dominant-baseline="central">m</text></g><text class="sub2" x="390" y="300" text-anchor="start">30 ms for one token</text><text class="cap" x="96" y="300" text-anchor="start">milli</text><text class="sub2" x="286" y="300" text-anchor="start">thousandth</text><text class="sub2" x="196" y="334" text-anchor="start">10^−6</text><g class="u"><rect x="40" y="316" width="40" height="26" rx="3"/><text class="sub" x="60.0" y="329.0" text-anchor="middle" dominant-baseline="central">µ</text></g><text class="sub2" x="390" y="334" text-anchor="start">100 µs of arithmetic per token</text><text class="cap" x="96" y="334" text-anchor="start">micro</text><text class="sub2" x="286" y="334" text-anchor="start">millionth</text><text class="sub2" x="196" y="368" text-anchor="start">10^−9</text><g class="u"><rect x="40" y="350" width="40" height="26" rx="3"/><text class="sub" x="60.0" y="363.0" text-anchor="middle" dominant-baseline="central">n</text></g><text class="sub2" x="390" y="368" text-anchor="start">about 270 ns for one memory read</text><text class="cap" x="96" y="368" text-anchor="start">nano</text><text class="sub2" x="286" y="368" text-anchor="start">billionth</text><text class="cap" x="40" y="410" text-anchor="start">A prefix multiplies its unit by its power of ten: 140 GB is 140 × 10^9 bytes, 30 ms is</text><text class="cap" x="40" y="430" text-anchor="start">30 × 10^−3 seconds, and 3.35 TB/s is 3.35 × 10^12 bytes every second. B is for bytes</text><text class="cap" x="40" y="450" text-anchor="start">({{fig:v01-o073}}).</text><text class="cap" x="40" y="490" text-anchor="start">Each row is a thousand times the one below it, so converting is moving the decimal point</text><text class="cap" x="40" y="510" text-anchor="start">three places: 0.1 ms = 100 µs, and 989 TFLOP/s = 0.989 PFLOP/s.</text><text class="cap" x="40" y="550" text-anchor="start">In computer memory k, M and G are sometimes powers of two instead, 1,024 rather than</text><text class="cap" x="40" y="570" text-anchor="start">1,000 for k. {{fig:v01-p30}} shows where that difference becomes visible.</text></svg><figcaption>Eight prefixes cover every quantity in this series, from nanoseconds to petaflops. Reading them without stopping is most of what reading a specification sheet takes.</figcaption></figure>
