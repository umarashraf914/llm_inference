<figure><div class='ts'>Fig 115 &nbsp;&middot;&nbsp; 11:46</div><h3>What the rule does not count</h3><svg viewBox="0 0 680 554" role="img"><title>What the rule does not count</title><text class="hd" x="40" y="46">Attention itself has no weights in it</text><g class="h"><rect x="60" y="66" width="250" height="42" rx="6"></rect><text class="sub" x="185.0" y="87.0" text-anchor="middle" dominant-baseline="central">the scores and the blend</text></g><text class="sub2" x="330" y="92" text-anchor="start">activation times activation,</text><text class="sub2" x="330" y="112" text-anchor="start">so no parameter is involved</text><text class="cap" x="40" y="168" text-anchor="start">The scores, every query times every key ({{fig:v01-p13}}), are written Q Kᵀ; the T, for</text><text class="cap" x="40" y="188" text-anchor="start">transpose, only turns the keys so the pairs line up ({{fig:v03-o019}}). The blend, the</text><text class="cap" x="40" y="208" text-anchor="start">softmax weights times the values, is written softmax × V. Both multiply activations by</text><text class="cap" x="40" y="228" text-anchor="start">activations, so there is no weight to attach them to and the rule does not count them.</text><text class="cap" x="40" y="248" text-anchor="start">Their cost grows with context length instead of with model size.</text><text class="cap" x="40" y="306" text-anchor="start">context 2,048</text><g class="h"><rect x="230" y="288" width="3" height="30" rx="3"></rect></g><text class="sub2" x="243" y="306" text-anchor="start">5.4 GFLOP, +4%</text><text class="cap" x="40" y="350" text-anchor="start">context 8,192</text><g class="h"><rect x="230" y="332" width="10" height="30" rx="3"></rect></g><text class="sub2" x="250" y="350" text-anchor="start">21.5 GFLOP, +15%</text><text class="cap" x="40" y="394" text-anchor="start">context 128,000</text><g class="h"><rect x="230" y="376" width="160" height="30" rx="3"></rect></g><text class="sub2" x="400" y="394" text-anchor="start">335.5 GFLOP, +240%</text><text class="cap" x="40" y="456" text-anchor="start">At a short context it is a rounding error. At 128,000 tokens it is more than twice the work the</text><text class="cap" x="40" y="476" text-anchor="start">weights do, and the rule has stopped being a useful estimate.</text><text class="cap" x="40" y="512" text-anchor="start">Two smaller corrections in the other direction: the embedding table is about 1.5% of the</text><text class="cap" x="40" y="532" text-anchor="start">parameters and only one row of it is read, and softmax and normalisation add a little back.</text></svg><figcaption>Worth knowing the boundary. The rule prices the weights, and the weights are the whole story only while the context is short.</figcaption></figure>
