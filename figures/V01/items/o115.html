<figure><div class='ts'>Fig 115 &nbsp;&middot;&nbsp; 11:46</div><h3>What the rule does not count</h3><svg viewBox="0 0 680 494" role="img"><title>What the rule does not count</title><text class="hd" x="40" y="46">Attention itself has no weights in it</text><g class="h"><rect x="60" y="66" width="250" height="42" rx="6"></rect><text class="sub" x="185.0" y="87.0" text-anchor="middle" dominant-baseline="central">Q Kt  and  softmax x V</text></g><text class="sub2" x="330" y="92" text-anchor="start">activation times activation,</text><text class="sub2" x="330" y="112" text-anchor="start">so no parameter is involved</text><text class="cap" x="40" y="168" text-anchor="start">Those multiplies are real work and the rule does not count them, because there is no weight to</text><text class="cap" x="40" y="188" text-anchor="start">attach them to. Their cost grows with context length instead of with model size.</text><text class="cap" x="40" y="246" text-anchor="start">context 2,048</text><g class="h"><rect x="230" y="228" width="3" height="30" rx="3"></rect></g><text class="sub2" x="243" y="246" text-anchor="start">5.4 GFLOP, +4%</text><text class="cap" x="40" y="290" text-anchor="start">context 8,192</text><g class="h"><rect x="230" y="272" width="10" height="30" rx="3"></rect></g><text class="sub2" x="250" y="290" text-anchor="start">21.5 GFLOP, +15%</text><text class="cap" x="40" y="334" text-anchor="start">context 128,000</text><g class="h"><rect x="230" y="316" width="160" height="30" rx="3"></rect></g><text class="sub2" x="400" y="334" text-anchor="start">335.5 GFLOP, +240%</text><text class="cap" x="40" y="396" text-anchor="start">At a short context it is a rounding error. At 128,000 tokens it is more than twice the work the</text><text class="cap" x="40" y="416" text-anchor="start">weights do, and the rule has stopped being a useful estimate.</text><text class="cap" x="40" y="452" text-anchor="start">Two smaller corrections in the other direction: the embedding table is about 1.5% of the</text><text class="cap" x="40" y="472" text-anchor="start">parameters and only one row of it is read, and softmax and normalisation add a little back.</text></svg><figcaption>Worth knowing the boundary. The rule prices the weights, and the weights are the whole story only while the context is short.</figcaption></figure>
