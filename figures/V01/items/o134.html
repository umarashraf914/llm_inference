<figure><div class='ts'>Fig 134 &nbsp;&middot;&nbsp; 22:31</div><h3>Linear against quadratic</h3><svg viewBox='0 0 680 454' role='img'><title>Linear against quadratic</title><text class="hd" x="40" y="46">Two ways to grow</text><text class="cap" x="40" y="92" text-anchor="start">Linear</text><text class="sub2" x="40" y="112" text-anchor="start">work per token stays flat</text><line class="axis" x1="250" y1="150" x2="590" y2="150"/><line class="axis" x1="250" y1="66" x2="250" y2="150"/><polyline class="pl-h" points="256,146 340,130 424,114 570,88"/><text class="cap" x="40" y="244" text-anchor="start">Quadratic</text><text class="sub2" x="40" y="264" text-anchor="start">work per token keeps rising</text><line class="axis" x1="250" y1="302" x2="590" y2="302"/><line class="axis" x1="250" y1="176" x2="250" y2="302"/><polyline class="pl-h" points="256,300 340,294 424,264 500,212 570,186"/><text class="cap" x="40" y="356" text-anchor="start">At ten tokens the two are barely different. At ten thousand the second is a thousand times</text><text class="cap" x="40" y="376" text-anchor="start">worse, because each token costs more than the last.</text><text class="cap" x="40" y="412" text-anchor="start">Recomputing everything at every step is the second shape. That is why nobody does it, and why</text><text class="cap" x="40" y="432" text-anchor="start">the thing described next exists.</text></svg><figcaption>Two shapes worth being able to recognise. Almost every scaling problem in this series is one term of the second kind growing past everything of the first.</figcaption></figure>
