<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 22:52</div><h3>Per step, flat against rising; in total, linear against quadratic</h3><svg viewBox='0 0 680 586' role='img'><title>Per step, flat against rising; in total, linear against quadratic</title><text class="hd" x="40" y="46">Positions put through the layers at each step, without and with a cache, to scale</text><line class="axis" x1="110" y1="290" x2="570" y2="290"/><g class="h"><rect x="120" y="272" width="18" height="18" rx="2"/></g><g class="s"><rect x="140" y="272" width="18" height="18" rx="2"/></g><text class="sub2" x="139" y="306" text-anchor="middle">1</text><g class="h"><rect x="164" y="254" width="18" height="36" rx="2"/></g><g class="s"><rect x="184" y="272" width="18" height="18" rx="2"/></g><text class="sub2" x="183" y="306" text-anchor="middle">2</text><g class="h"><rect x="208" y="236" width="18" height="54" rx="2"/></g><g class="s"><rect x="228" y="272" width="18" height="18" rx="2"/></g><text class="sub2" x="227" y="306" text-anchor="middle">3</text><g class="h"><rect x="252" y="218" width="18" height="72" rx="2"/></g><g class="s"><rect x="272" y="272" width="18" height="18" rx="2"/></g><text class="sub2" x="271" y="306" text-anchor="middle">4</text><g class="h"><rect x="296" y="200" width="18" height="90" rx="2"/></g><g class="s"><rect x="316" y="272" width="18" height="18" rx="2"/></g><text class="sub2" x="315" y="306" text-anchor="middle">5</text><g class="h"><rect x="340" y="182" width="18" height="108" rx="2"/></g><g class="s"><rect x="360" y="272" width="18" height="18" rx="2"/></g><text class="sub2" x="359" y="306" text-anchor="middle">6</text><g class="h"><rect x="384" y="164" width="18" height="126" rx="2"/></g><g class="s"><rect x="404" y="272" width="18" height="18" rx="2"/></g><text class="sub2" x="403" y="306" text-anchor="middle">7</text><g class="h"><rect x="428" y="146" width="18" height="144" rx="2"/></g><g class="s"><rect x="448" y="272" width="18" height="18" rx="2"/></g><text class="sub2" x="447" y="306" text-anchor="middle">8</text><g class="h"><rect x="472" y="128" width="18" height="162" rx="2"/></g><g class="s"><rect x="492" y="272" width="18" height="18" rx="2"/></g><text class="sub2" x="491" y="306" text-anchor="middle">9</text><g class="h"><rect x="516" y="110" width="18" height="180" rx="2"/></g><g class="s"><rect x="536" y="272" width="18" height="18" rx="2"/></g><text class="sub2" x="535" y="306" text-anchor="middle">10</text><text class="sub2" x="340.0" y="326" text-anchor="middle">the token being generated</text><g class="h"><rect x="40" y="76" width="16" height="16" rx="2"/></g><text class="sub2" x="62" y="89" text-anchor="start">without a cache: every position again, t of them</text><g class="s"><rect x="40" y="100" width="16" height="16" rx="2"/></g><text class="sub2" x="62" y="113" text-anchor="start">with a cache: only the new one</text><text class="cap" x="40" y="360" text-anchor="start">Without a cache, generating token t means putting all t positions through every layer</text><text class="cap" x="40" y="380" text-anchor="start">again; with it, only the new one. Per step that is a rising staircase against a flat</text><text class="cap" x="40" y="400" text-anchor="start">line.</text><text class="cap" x="40" y="440" text-anchor="start">The total is the area: 1 + 2 + … + n against n. At ten tokens, 55 against 10. At ten</text><text class="cap" x="40" y="460" text-anchor="start">thousand, 50,005,000 against 10,000, five thousand times as much. The staircase's area</text><text class="cap" x="40" y="480" text-anchor="start">grows with the square of n; that is what quadratic means.</text><text class="cap" x="40" y="520" text-anchor="start">With the cache the work per step on the layers is flat, but each step still reads every</text><text class="cap" x="40" y="540" text-anchor="start">key and value kept so far, so the bytes per step keep growing with the conversation</text><text class="cap" x="40" y="560" text-anchor="start">({{fig:v01-o141}}).</text></svg><figcaption>Two shapes worth being able to recognise. Almost every scaling problem in this series is a term of the second kind growing past everything of the first.</figcaption></figure>
