<figure><div class='ts'>Fig 143 &nbsp;&middot;&nbsp; 26:44</div><h3>The two latencies a user experiences</h3><svg viewBox="0 0 680 402" role="img"><title>The two latencies a user experiences</title><line class="axis" x1="60" y1="110" x2="620" y2="110"></line><g class="h"><rect x="60" y="94" width="180" height="32" rx="4"></rect><text class="sub" x="150.0" y="110.0" text-anchor="middle" dominant-baseline="central">a pause</text></g><g class="s"><rect x="250" y="94" width="34" height="32" rx="3"></rect></g><g class="s"><rect x="292" y="94" width="34" height="32" rx="3"></rect></g><g class="s"><rect x="334" y="94" width="34" height="32" rx="3"></rect></g><g class="s"><rect x="376" y="94" width="34" height="32" rx="3"></rect></g><g class="s"><rect x="418" y="94" width="34" height="32" rx="3"></rect></g><g class="s"><rect x="460" y="94" width="34" height="32" rx="3"></rect></g><g class="s"><rect x="502" y="94" width="34" height="32" rx="3"></rect></g><g class="s"><rect x="544" y="94" width="34" height="32" rx="3"></rect></g><g class="s"><rect x="586" y="94" width="34" height="32" rx="3"></rect></g><text class="hd" x="60" y="160" text-anchor="start">time to first token</text><text class="sub2" x="60" y="182" text-anchor="start">TTFT</text><text class="hd" x="250" y="160" text-anchor="start">time per output token</text><text class="sub2" x="250" y="182" text-anchor="start">TPOT, or inter-token latency</text><text class="cap" x="40" y="240" text-anchor="start">TTFT is governed by prefill, because the whole prompt must pass through every layer</text><text class="cap" x="40" y="260" text-anchor="start">before any output can appear: half a second for a short prompt, several seconds for a</text><text class="cap" x="40" y="280" text-anchor="start">long one, in a real product ({{fig:v01-p33}}).</text><text class="cap" x="40" y="320" text-anchor="start">TPOT is governed by decode, because each output token needs its own complete forward pass.</text><text class="cap" x="40" y="360" text-anchor="start">TTFT decides whether a product feels responsive. TPOT decides whether the text arrives fast</text><text class="cap" x="40" y="380" text-anchor="start">enough to read comfortably or stutters in a way that breaks concentration.</text></svg><figcaption>Both are visible to the person waiting, and they are produced by phases with opposite resource profiles.</figcaption></figure>
