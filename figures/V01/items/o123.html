<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 15:07</div><h3>The roofline</h3><svg viewBox='0 0 680 692' role='img'><title>The roofline</title><text class="hd" x="40" y="34">The H100's roofline, both axes logarithmic and drawn to scale</text><line class="axis" x1="100" y1="390" x2="500" y2="390"/><line class="axis" x1="100" y1="70" x2="100" y2="390"/><line class="tick" x1="100" y1="390" x2="100" y2="394"/><text class="sub2" x="100" y="408" text-anchor="middle">0.1</text><line class="tick" x1="180" y1="390" x2="180" y2="394"/><text class="sub2" x="180" y="408" text-anchor="middle">1</text><line class="tick" x1="260" y1="390" x2="260" y2="394"/><text class="sub2" x="260" y="408" text-anchor="middle">10</text><line class="tick" x1="340" y1="390" x2="340" y2="394"/><text class="sub2" x="340" y="408" text-anchor="middle">100</text><line class="tick" x1="420" y1="390" x2="420" y2="394"/><text class="sub2" x="420" y="408" text-anchor="middle">1,000</text><line class="tick" x1="500" y1="390" x2="500" y2="394"/><text class="sub2" x="500" y="408" text-anchor="middle">10,000</text><line class="tick" x1="96" y1="390" x2="100" y2="390"/><text class="sub2" x="92" y="394" text-anchor="end">100 G</text><line class="tick" x1="96" y1="326" x2="100" y2="326"/><text class="sub2" x="92" y="330" text-anchor="end">1 T</text><line class="tick" x1="96" y1="262" x2="100" y2="262"/><text class="sub2" x="92" y="266" text-anchor="end">10 T</text><line class="tick" x1="96" y1="198" x2="100" y2="198"/><text class="sub2" x="92" y="202" text-anchor="end">100 T</text><line class="tick" x1="96" y1="134" x2="100" y2="134"/><text class="sub2" x="92" y="138" text-anchor="end">1 P</text><line class="tick" x1="96" y1="70" x2="100" y2="70"/><text class="sub2" x="92" y="74" text-anchor="end">10 P</text><text class="sub2" x="300.0" y="428" text-anchor="middle">arithmetic intensity: operations per byte (log scale)</text><text class="sub2" x="92" y="56" text-anchor="start">operations per second (log scale)</text><polyline class="pl-m" points="100.0,356.4 377.6,134.3 500.0,134.3"/><line class="mark" x1="377.6" y1="138.3" x2="377.6" y2="390"/><text class="sub2 halo" x="383.6" y="380" text-anchor="start">the ridge, 295</text><text class="sub2 halo" x="420.0" y="124.30000000000001" text-anchor="middle">flat ceiling: 989 trillion a second</text><circle cx="180.0" cy="292.4" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2 halo" x="188.0" y="308.4" text-anchor="start">1 per byte: 3.35 trillion a second</text><circle cx="260.0" cy="228.4" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2 halo" x="268.0" y="244.4" text-anchor="start">10 per byte: 33.5 trillion</text><text class="sub2 halo" x="130" y="352" text-anchor="start">slanted ceiling: bandwidth × intensity</text><g class="m"><rect x="140" y="448" width="400" height="42" rx="6"/><text class="sub" x="340.0" y="469.0" text-anchor="middle" dominant-baseline="central">attainable  =  the lower of:  peak,  bandwidth × intensity</text></g><text class="cap" x="40" y="526" text-anchor="start">Both axes are logarithmic ({{fig:v01-o121}}): each labelled step is ten times the one before.</text><text class="cap" x="40" y="546" text-anchor="start">The slanted ceiling is the bandwidth times the intensity: at one operation per byte,</text><text class="cap" x="40" y="566" text-anchor="start">3.35 TB/s supports 3.35 trillion operations a second; at ten, 33.5 trillion. On these</text><text class="cap" x="40" y="586" text-anchor="start">axes it is a straight line.</text><text class="cap" x="40" y="626" text-anchor="start">The flat ceiling is the peak arithmetic rate, 989 trillion operations a second, which no</text><text class="cap" x="40" y="646" text-anchor="start">workload can beat however much work it gets from each byte. A workload sits on whichever</text><text class="cap" x="40" y="666" text-anchor="start">ceiling is lower at its intensity.</text></svg><figcaption>Introduced by Williams, Waterman and Patterson at Berkeley in 2009. Drawn to scale, the corner sits at 295 operations per byte, far to the right of where a single decoding token lives.</figcaption></figure>
