<figure><div class='ts'>Fig 123 &nbsp;&middot;&nbsp; 15:07</div><h3>The roofline</h3><svg viewBox="0 0 680 494" role="img"><title>The roofline</title><line class="axis" x1="90" y1="264" x2="620" y2="264"></line><line class="axis" x1="90" y1="50" x2="90" y2="264"></line><polyline class="pl-h" points="90,264 330,120 620,120"></polyline><line class="tick" x1="330" y1="120" x2="330" y2="264"></line><text class="sub2" x="330" y="288" text-anchor="middle">the ridge</text><text class="sub2" x="96" y="106" text-anchor="start">flat ceiling: peak arithmetic</text><text class="sub2 halo" x="150" y="200" text-anchor="start">slanted ceiling: bandwidth</text><text class="sub2" x="160" y="240" text-anchor="start">memory bound</text><text class="sub2" x="430" y="240" text-anchor="start">compute bound</text><g class="m"><rect x="150" y="320" width="380" height="42" rx="6"></rect><text class="sub" x="340.0" y="341.0" text-anchor="middle" dominant-baseline="central">attainable  =  min( peak,  bandwidth x intensity )</text></g><text class="cap" x="40" y="402" text-anchor="start">Both axes are logarithmic. The slanted ceiling rises at a rate that is exactly the memory</text><text class="cap" x="40" y="422" text-anchor="start">bandwidth: at one operation per byte with 3 TB/s you can reach 3 trillion operations a second;</text><text class="cap" x="40" y="442" text-anchor="start">at ten operations per byte, thirty trillion.</text><text class="cap" x="40" y="472" text-anchor="start">A workload hits whichever ceiling is lower.</text></svg><figcaption>Introduced by Williams, Waterman and Patterson in 2009. Two ceilings and one rule for choosing between them.</figcaption></figure>
