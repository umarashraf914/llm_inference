<figure><div class='ts'>Fig 90 &nbsp;&middot;&nbsp; 7:07</div><h3>Why position has to be encoded</h3><svg viewBox='0 0 680 348' role='img'><title>Why position has to be encoded</title><text class="hd" x="40" y="46">The same words, a different order</text><g class="s"><rect x="60" y="70" width="80" height="34" rx="3"/><text class="sub" x="100.0" y="87.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="s"><rect x="152" y="70" width="80" height="34" rx="3"/><text class="sub" x="192.0" y="87.0" text-anchor="middle" dominant-baseline="central">dog</text></g><g class="s"><rect x="244" y="70" width="80" height="34" rx="3"/><text class="sub" x="284.0" y="87.0" text-anchor="middle" dominant-baseline="central">bit</text></g><g class="s"><rect x="336" y="70" width="80" height="34" rx="3"/><text class="sub" x="376.0" y="87.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="s"><rect x="428" y="70" width="80" height="34" rx="3"/><text class="sub" x="468.0" y="87.0" text-anchor="middle" dominant-baseline="central">man</text></g><g class="m"><rect x="60" y="130" width="80" height="34" rx="3"/><text class="sub" x="100.0" y="147.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="m"><rect x="152" y="130" width="80" height="34" rx="3"/><text class="sub" x="192.0" y="147.0" text-anchor="middle" dominant-baseline="central">man</text></g><g class="m"><rect x="244" y="130" width="80" height="34" rx="3"/><text class="sub" x="284.0" y="147.0" text-anchor="middle" dominant-baseline="central">bit</text></g><g class="m"><rect x="336" y="130" width="80" height="34" rx="3"/><text class="sub" x="376.0" y="147.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="m"><rect x="428" y="130" width="80" height="34" rx="3"/><text class="sub" x="468.0" y="147.0" text-anchor="middle" dominant-baseline="central">dog</text></g><text class="cap" x="40" y="214" text-anchor="start">Identical tokens, entirely different meaning. So the model cannot treat the input as an</text><text class="cap" x="40" y="234" text-anchor="start">unordered bag; where each token sits has to be part of what it is.</text><text class="cap" x="40" y="270" text-anchor="start">Each token's vector therefore carries both which token it is and where in the sequence it</text><text class="cap" x="40" y="290" text-anchor="start">appeared, either added in at the start or applied inside attention.</text><text class="cap" x="40" y="326" text-anchor="start">Without it, both lines above would produce the same answer.</text></svg><figcaption>A small figure for a fact that is easy to state and easy to forget: the vectors alone do not say what order anything came in.</figcaption></figure>
