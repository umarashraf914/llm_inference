<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 17:04</div><h3>Slide a workload along the roofline</h3><div class='wg'><div class='ctl'><label>intensity <input type='range' min='-1' max='4' step='0.01' value='0'><span class='val'>1.00</span></label></div><div class='ctl'><label class='opt'><input type='radio' name='v01-p21-chip' value='H100' checked> H100</label><label class='opt'><input type='radio' name='v01-p21-chip' value='H200'> H200</label><label class='opt'><input type='radio' name='v01-p21-chip' value='B200'> B200</label><button type='button'>Reset</button></div><svg viewBox='0 0 680 782' role='img'><title>Slide a workload along the roofline</title><text class="hd" x="40" y="34">Slide a workload along the roofline of a chosen chip</text><line class="axis" x1="100" y1="390" x2="500" y2="390"/><line class="axis" x1="100" y1="70" x2="100" y2="390"/><line class="tick" x1="100" y1="390" x2="100" y2="394"/><text class="sub2" x="100" y="408" text-anchor="middle">0.1</text><line class="tick" x1="180" y1="390" x2="180" y2="394"/><text class="sub2" x="180" y="408" text-anchor="middle">1</text><line class="tick" x1="260" y1="390" x2="260" y2="394"/><text class="sub2" x="260" y="408" text-anchor="middle">10</text><line class="tick" x1="340" y1="390" x2="340" y2="394"/><text class="sub2" x="340" y="408" text-anchor="middle">100</text><line class="tick" x1="420" y1="390" x2="420" y2="394"/><text class="sub2" x="420" y="408" text-anchor="middle">1,000</text><line class="tick" x1="500" y1="390" x2="500" y2="394"/><text class="sub2" x="500" y="408" text-anchor="middle">10,000</text><line class="tick" x1="96" y1="390" x2="100" y2="390"/><text class="sub2" x="92" y="394" text-anchor="end">100 G</text><line class="tick" x1="96" y1="326" x2="100" y2="326"/><text class="sub2" x="92" y="330" text-anchor="end">1 T</text><line class="tick" x1="96" y1="262" x2="100" y2="262"/><text class="sub2" x="92" y="266" text-anchor="end">10 T</text><line class="tick" x1="96" y1="198" x2="100" y2="198"/><text class="sub2" x="92" y="202" text-anchor="end">100 T</text><line class="tick" x1="96" y1="134" x2="100" y2="134"/><text class="sub2" x="92" y="138" text-anchor="end">1 P</text><line class="tick" x1="96" y1="70" x2="100" y2="70"/><text class="sub2" x="92" y="74" text-anchor="end">10 P</text><text class="sub2" x="300.0" y="428" text-anchor="middle">arithmetic intensity: operations per byte (log scale)</text><text class="sub2" x="92" y="56" text-anchor="start">operations per second (log scale)</text><polyline class="pl-m" data-roof="" points="100.0,356.4 377.6,134.3 500.0,134.3"/><line class="mark" data-ridge="" x1="377.6" y1="138.3" x2="377.6" y2="390"/><circle data-pt="" cx="180.0" cy="292.4" r="6" fill="var(--s-fill)" stroke="var(--s)" stroke-width="2"/><text class="sub2" x="140" y="460" data-r="0">intensity: 1.00 operations per byte</text><text class="sub2" x="140" y="480" data-r="1">attainable: 3.35 trillion operations a second</text><text class="sub2" x="140" y="500" data-r="2">arithmetic units busy: 0.339% of the time</text><text class="sub2" x="140" y="520" data-r="3">memory bound: below the ridge of 295</text><text class="cap" x="40" y="560" text-anchor="start">Move the intensity and the point rides the lower ceiling. Below the ridge, every extra</text><text class="cap" x="40" y="580" text-anchor="start">operation per byte buys speed in proportion; above it, nothing does, because the</text><text class="cap" x="40" y="600" text-anchor="start">arithmetic units are already full.</text><text class="cap" x="40" y="640" text-anchor="start">Switch chips and the corner moves. The H200 has the H100's arithmetic with 4.8 TB/s of</text><text class="cap" x="40" y="660" text-anchor="start">bandwidth, so its ridge drops to 206; the B200 raises both, to 2,250 trillion operations</text><text class="cap" x="40" y="680" text-anchor="start">a second and 8 TB/s, a ridge of 281. Every figure comes from NVIDIA's specifications,</text><text class="cap" x="40" y="700" text-anchor="start">dense 16-bit.</text><text class="cap" x="40" y="740" text-anchor="start">The readouts were checked against Python at every position of the slider, for all three</text><text class="cap" x="40" y="760" text-anchor="start">chips.</text></svg></div><figcaption>The roofline as an instrument rather than a picture. Any workload whose operations and bytes can be counted can be placed on it before it is run.</figcaption><script>(() => {

  const MINUS = '−';
  const fx = (v, d = 2) => { const s = Math.abs(v).toFixed(d); return (v < 0 && +s !== 0 ? MINUS : '') + s; };
  const gx = (v, d = 0) => { const s = Math.abs(v).toFixed(d); const [a, b] = s.split('.');
    const t = a.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (v < 0 && +s !== 0 ? MINUS : '') + t + (b !== undefined ? '.' + b : ''); };

  const RL = 100, RR = 500, RT = 70, RB = 390, XD = 80, YD = 64;
  const xs = i => +(RL + (Math.log10(i) + 1) * XD).toFixed(1);
  const ys = p => +(RB - (Math.log10(p) - 11) * YD).toFixed(1);
  const roofPts = (peak, bw) => { const r = peak / bw;
    return `${xs(0.1)},${ys(bw * 0.1)} ${xs(r)},${ys(peak)} ${xs(1e4)},${ys(peak)}`; };
  const sig3 = v => { if (v === 0) return '0'; const d = Math.max(0, 2 - Math.floor(Math.log10(Math.abs(v))));
    return gx(v, d); };

  const fig = document.currentScript.closest('figure');
  const CHIPS = {"H100": {"peak": 989000000000000.0, "bw": 3350000000000.0}, "H200": {"peak": 989000000000000.0, "bw": 4800000000000.0}, "B200": {"peak": 2250000000000000.0, "bw": 8000000000000.0}}, V0 = 0.0;
  const sl = fig.querySelector('input[type=range]'), val = fig.querySelector('.val');
  const rad = [...fig.querySelectorAll('input[type=radio]')], q = s => fig.querySelector(s);
  function draw() {
    const v = +sl.value, i = +(Math.pow(10, v)).toPrecision(3);
    const name = rad.find(r => r.checked).value, c = CHIPS[name];
    const a = Math.min(c.peak, c.bw * i), ridge = c.peak / c.bw, busy = a / c.peak * 100;
    val.textContent = sig3(i);
    q('[data-roof]').setAttribute('points', roofPts(c.peak, c.bw));
    const rl = q('[data-ridge]'); rl.setAttribute('x1', xs(ridge)); rl.setAttribute('x2', xs(ridge));
    rl.setAttribute('y1', ys(c.peak) + 4);
    const pt = q('[data-pt]'); pt.setAttribute('cx', xs(i)); pt.setAttribute('cy', ys(a));
    const R = Math.round(ridge);
    const lines = [`intensity: ${sig3(i)} operations per byte`,
      `attainable: ${sig3(a / 1e12)} trillion operations a second`,
      `arithmetic units busy: ${sig3(busy)}% of the time`,
      i < ridge ? `memory bound: below the ridge of ${R}` : `compute bound: at or above the ridge of ${R}`];
    lines.forEach((t, k) => q(`[data-r="${k}"]`).textContent = t);
  }
  sl.addEventListener('input', draw);
  rad.forEach(r => r.addEventListener('change', draw));
  q('button').addEventListener('click', () => { sl.value = V0; rad[0].checked = true; draw(); });
  draw();
})();</script></figure>
