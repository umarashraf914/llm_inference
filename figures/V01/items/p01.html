<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:26</div><h3>A batch is several requests going through the model in one pass</h3><svg viewBox='0 0 680 472' role='img'><title>A batch is several requests going through the model in one pass</title><text class="hd" x="40" y="46">Four users each need their next token</text><text class="cap" x="40" y="92" text-anchor="start">one at a time</text><g class="u"><rect x="170" y="72" width="104" height="32" rx="4"/><text class="sub" x="222.0" y="88.0" text-anchor="middle" dominant-baseline="central">pass 1: user A</text></g><g class="u"><rect x="282" y="72" width="104" height="32" rx="4"/><text class="sub" x="334.0" y="88.0" text-anchor="middle" dominant-baseline="central">pass 2: user B</text></g><g class="u"><rect x="394" y="72" width="104" height="32" rx="4"/><text class="sub" x="446.0" y="88.0" text-anchor="middle" dominant-baseline="central">pass 3: user C</text></g><g class="u"><rect x="506" y="72" width="104" height="32" rx="4"/><text class="sub" x="558.0" y="88.0" text-anchor="middle" dominant-baseline="central">pass 4: user D</text></g><text class="sub2" x="170" y="124" text-anchor="start">four passes, each running the whole model</text><text class="cap" x="40" y="186" text-anchor="start">as a batch</text><g class="m"><rect x="170" y="150" width="440" height="92" rx="14"/><text class="lbl" x="192" y="176">one pass through the model</text></g><g class="s"><rect x="192" y="190" width="90" height="32" rx="4"/><text class="sub" x="237.0" y="206.0" text-anchor="middle" dominant-baseline="central">user A</text></g><g class="s"><rect x="294" y="190" width="90" height="32" rx="4"/><text class="sub" x="339.0" y="206.0" text-anchor="middle" dominant-baseline="central">user B</text></g><g class="s"><rect x="396" y="190" width="90" height="32" rx="4"/><text class="sub" x="441.0" y="206.0" text-anchor="middle" dominant-baseline="central">user C</text></g><g class="s"><rect x="498" y="190" width="90" height="32" rx="4"/><text class="sub" x="543.0" y="206.0" text-anchor="middle" dominant-baseline="central">user D</text></g><text class="cap" x="40" y="286" text-anchor="start">A pass means running the whole model once, which is what producing one token takes</text><text class="cap" x="40" y="306" text-anchor="start">({{fig:v01-o007}}). Run separately, four users need four passes.</text><text class="cap" x="40" y="346" text-anchor="start">Batched, the scheduler gathers the four users' inputs and sends them through the model</text><text class="cap" x="40" y="366" text-anchor="start">together. One pass then produces the next token for each of them. A batch is several</text><text class="cap" x="40" y="386" text-anchor="start">requests going through the model in a single pass, and the batch size is how many.</text><text class="cap" x="40" y="426" text-anchor="start">Why that is worth doing is the subject of most of this atlas. The short answer is that</text><text class="cap" x="40" y="446" text-anchor="start">the costly part of a pass is not the arithmetic, and a batch shares the costly part.</text></svg><figcaption>A batch is not a queue. The four requests are not served one after another but together, which is how a crowd of users becomes an advantage rather than a burden.</figcaption></figure>
