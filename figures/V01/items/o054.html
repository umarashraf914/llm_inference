<figure><div class='ts'>Fig 54 &nbsp;&middot;&nbsp; 25:43</div><h3>Why a minute is warm and a day is not</h3><svg viewBox='0 0 680 470' role='img'><title>Why a minute is warm and a day is not</title><text class="hd" x="40" y="46">The cache is a fixed pool that everyone is competing for</text><g class="u"><rect x="40" y="74" width="600" height="34" rx="5"/><text class="sub" x="340.0" y="91.0" text-anchor="middle" dominant-baseline="central">one machine's cache memory</text></g><g class="s"><rect x="48" y="122" width="36" height="26" rx="3"/></g><g class="s"><rect x="90" y="122" width="36" height="26" rx="3"/></g><g class="s"><rect x="132" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="174" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="216" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="258" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="300" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="342" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="384" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="426" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="468" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="510" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="552" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="594" y="122" width="36" height="26" rx="3"/></g><text class="sub2" x="48" y="178" text-anchor="start">this user's are the three on the left; the rest are other people's</text><text class="cap" x="40" y="228" text-anchor="start">The cache is held in fixed-size blocks of memory. When a new request needs room, the</text><text class="cap" x="40" y="248" text-anchor="start">engine drops the blocks used least recently. Nothing in the engine is on a timer; it is</text><text class="cap" x="40" y="268" text-anchor="start">pure pressure.</text><text class="cap" x="40" y="308" text-anchor="start">So a minute later, on a quiet machine, this user's blocks may still be there. A minute</text><text class="cap" x="40" y="328" text-anchor="start">later on a very busy one, they may already be gone.</text><text class="cap" x="40" y="368" text-anchor="start">A day later they are gone on any machine, because a day of other people's conversations</text><text class="cap" x="40" y="388" text-anchor="start">will have cycled through that pool many times over.</text><text class="cap" x="40" y="428" text-anchor="start">Providers quote a lifetime for a cached prefix, often five minutes since it was last</text><text class="cap" x="40" y="448" text-anchor="start">used ({{fig:v07-o014}}). After that, an idle prefix should be assumed gone.</text></svg><figcaption>In the engine, eviction is driven by demand for the space, not by elapsed time: warmth is likely rather than certain, and it fades with load rather than on a schedule. Schematic.</figcaption></figure>
