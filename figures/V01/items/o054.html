<figure><div class='ts'>Fig 54 &nbsp;&middot;&nbsp; 25:43</div><h3>Why a minute is warm and a day is not</h3><svg viewBox='0 0 680 438' role='img'><title>Why a minute is warm and a day is not</title><text class="hd" x="40" y="46">The cache is a fixed pool that everyone is competing for</text><g class="u"><rect x="40" y="74" width="600" height="34" rx="5"/><text class="sub" x="340.0" y="91.0" text-anchor="middle" dominant-baseline="central">one machine's cache memory</text></g><g class="s"><rect x="48" y="122" width="36" height="26" rx="3"/></g><g class="s"><rect x="90" y="122" width="36" height="26" rx="3"/></g><g class="s"><rect x="132" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="174" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="216" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="258" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="300" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="342" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="384" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="426" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="468" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="510" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="552" y="122" width="36" height="26" rx="3"/></g><g class="u"><rect x="594" y="122" width="36" height="26" rx="3"/></g><text class="sub2" x="48" y="178" text-anchor="start">yours are the three on the left; the rest belong to other people</text><text class="cap" x="40" y="228" text-anchor="start">When a new request needs room, the least recently used blocks are dropped. Nothing is on a</text><text class="cap" x="40" y="248" text-anchor="start">timer; it is pure pressure.</text><text class="cap" x="40" y="284" text-anchor="start">So a minute later, on a quiet machine, your blocks may still be there. A minute later on a very</text><text class="cap" x="40" y="304" text-anchor="start">busy one, they may already be gone.</text><text class="cap" x="40" y="340" text-anchor="start">A day later they are gone on any machine, because a day of other people's conversations will</text><text class="cap" x="40" y="360" text-anchor="start">have cycled through that pool many times over.</text><text class="cap" x="40" y="396" text-anchor="start">Providers quote a nominal lifetime, often a few minutes, but it is a guideline about typical</text><text class="cap" x="40" y="416" text-anchor="start">load rather than a guarantee.</text></svg><figcaption>Eviction is driven by demand for the space, not by elapsed time. That is why warmth is likely rather than certain, and why it degrades gracefully rather than expiring.</figcaption></figure>
