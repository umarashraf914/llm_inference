<figure><div class='ts'>Fig 32 &nbsp;&middot;&nbsp; 0:21</div><h3>Two different things called re-sending</h3><svg viewBox='0 0 680 426' role='img'><title>Two different things called re-sending</title><text class="hd" x="40" y="46">Two things that both get called re-sending</text><g class="s"><rect x="40" y="74" width="285" height="86" rx="8"/><text class="lbl" x="182.5" y="100.0" text-anchor="middle" dominant-baseline="central">Within one answer</text><text class="sub" x="182.5" y="118.0" text-anchor="middle" dominant-baseline="central">nothing is re-sent.</text><text class="sub" x="182.5" y="135.0" text-anchor="middle" dominant-baseline="central">The server holds the state.</text></g><g class="h"><rect x="355" y="74" width="285" height="86" rx="8"/><text class="lbl" x="497.5" y="100.0" text-anchor="middle" dominant-baseline="central">Between two turns</text><text class="sub" x="497.5" y="118.0" text-anchor="middle" dominant-baseline="central">everything is re-sent.</text><text class="sub" x="497.5" y="135.0" text-anchor="middle" dominant-baseline="central">The server holds nothing.</text></g><text class="cap" x="40" y="204" text-anchor="start">While an answer is streaming, the user's device sends nothing, and the server keeps what</text><text class="cap" x="40" y="224" text-anchor="start">it needs from one token to the next ({{fig:v01-o029}}).</text><text class="cap" x="40" y="264" text-anchor="start">The next message is a brand new request, and it carries the entire conversation again</text><text class="cap" x="40" y="284" text-anchor="start">({{fig:v01-o020}}).</text><text class="cap" x="40" y="324" text-anchor="start">The server may still hold its working from last time, which makes processing the repeat</text><text class="cap" x="40" y="344" text-anchor="start">cheap; {{fig:v01-o047}} shows when it does. But the text still travels, every turn.</text><text class="cap" x="40" y="384" text-anchor="start">Confusing these two is what makes the whole picture hard to hold. One is per token and</text><text class="cap" x="40" y="404" text-anchor="start">costs nothing; the other is per turn and costs everything.</text></svg><figcaption>Per token, nothing repeats. Per turn, everything does. Almost every misunderstanding about how this works comes from mixing the two.</figcaption></figure>
