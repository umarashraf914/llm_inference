<figure><div class='ts'>Fig 32 &nbsp;&middot;&nbsp; 0:21</div><h3>Two different things called re-sending</h3><svg viewBox='0 0 680 414' role='img'><title>Two different things called re-sending</title><text class="hd" x="40" y="46">Two things that both get called re-sending</text><g class="s"><rect x="40" y="74" width="285" height="86" rx="8"/><text class="lbl" x="182.5" y="100.0" text-anchor="middle" dominant-baseline="central">Within one answer</text><text class="sub" x="182.5" y="118.0" text-anchor="middle" dominant-baseline="central">nothing is re-sent.</text><text class="sub" x="182.5" y="135.0" text-anchor="middle" dominant-baseline="central">The server holds the state.</text></g><g class="h"><rect x="355" y="74" width="285" height="86" rx="8"/><text class="lbl" x="497.5" y="100.0" text-anchor="middle" dominant-baseline="central">Between two turns</text><text class="sub" x="497.5" y="118.0" text-anchor="middle" dominant-baseline="central">everything is re-sent.</text><text class="sub" x="497.5" y="135.0" text-anchor="middle" dominant-baseline="central">The server holds nothing.</text></g><text class="cap" x="40" y="204" text-anchor="start">While an answer is streaming, your device sends nothing and the server keeps the conversation</text><text class="cap" x="40" y="224" text-anchor="start">in its cache from one token to the next.</text><text class="cap" x="40" y="260" text-anchor="start">When you type your next message, that is a brand new request, and it carries the entire</text><text class="cap" x="40" y="280" text-anchor="start">conversation again, because the request is the only thing the server is given.</text><text class="cap" x="40" y="316" text-anchor="start">The cache may still be warm from last time, which makes processing that repeat cheap. But the</text><text class="cap" x="40" y="336" text-anchor="start">text still travels, every turn.</text><text class="cap" x="40" y="372" text-anchor="start">Confusing these two is what makes the whole picture hard to hold. One is per token and costs</text><text class="cap" x="40" y="392" text-anchor="start">nothing; the other is per turn and costs everything.</text></svg><figcaption>Per token, nothing repeats. Per turn, everything does. Almost every misunderstanding about how this works comes from mixing the two.</figcaption></figure>
