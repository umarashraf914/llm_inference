<figure><div class='ts'>Fig 130 &nbsp;&middot;&nbsp; 19:37</div><h3>The hard throughput ceiling</h3><svg viewBox="0 0 680 504" role="img"><title>The hard throughput ceiling</title><g class="m"><rect x="60" y="46" width="560" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">maximum tokens per second  =  bandwidth / bytes per token</text></g><text class="cap" x="40" y="130" text-anchor="start">3.35 TB/s</text><g class="h"><rect x="240" y="114" width="120" height="30" rx="3"></rect><text class="sub" x="300.0" y="129.0" text-anchor="middle" dominant-baseline="central">divided by</text></g><text class="sub2" x="380" y="133" text-anchor="start">140 GB per token</text><g class="s"><rect x="240" y="164" width="300" height="42" rx="6"></rect><text class="sub" x="390.0" y="185.0" text-anchor="middle" dominant-baseline="central">= about 24 tokens per second</text></g><text class="cap" x="40" y="246" text-anchor="start">A physical ceiling, not a software one. No kernel, however well written</text><text class="cap" x="40" y="266" text-anchor="start">({{fig:v01-o017}}), can exceed it, because the limit is simply how fast the bus can</text><text class="cap" x="40" y="286" text-anchor="start">deliver weights.</text><text class="hd" x="40" y="336">The only three ways past it</text><g class="s"><rect x="40" y="356" width="190" height="66" rx="8"></rect><text class="lbl" x="135.0" y="380" text-anchor="middle" dominant-baseline="central">Raise bandwidth</text><text class="sub" x="135.0" y="398" text-anchor="middle" dominant-baseline="central">a different chip</text></g><g class="s"><rect x="246" y="356" width="190" height="66" rx="8"></rect><text class="lbl" x="341.0" y="380" text-anchor="middle" dominant-baseline="central">Shrink bytes per token</text><text class="sub" x="341.0" y="398" text-anchor="middle" dominant-baseline="central">lower precision, compression</text></g><g class="s"><rect x="452" y="356" width="188" height="66" rx="8"></rect><text class="lbl" x="546.0" y="380" text-anchor="middle" dominant-baseline="central">Amortise the transfer</text><text class="sub" x="546.0" y="398" text-anchor="middle" dominant-baseline="central">batching, or several at once</text></g><text class="cap" x="40" y="462.0" text-anchor="start">The next five figures work each route with numbers; later videos in the series take them</text><text class="cap" x="40" y="482.0" text-anchor="start">apart.</text></svg><figcaption>Derivable in one line, and it bounds every serving system ever built on this hardware. The three escape routes are the entire roadmap.</figcaption></figure>
