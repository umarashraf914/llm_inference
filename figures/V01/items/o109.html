<figure><div class='ts'>Fig 109 &nbsp;&middot;&nbsp; 10:39</div><h3>Prefill and decode</h3><svg viewBox="0 0 680 446" role="img"><title>Prefill and decode</title><g class="s"><rect x="40" y="40" width="600" height="128" rx="14"></rect><text class="lbl" x="62" y="66">Prefill</text><text class="sub" x="62" y="84">the whole prompt at once</text></g><g class="m"><rect x="66" y="96" width="60" height="32" rx="3"></rect><text class="sub" x="96.0" y="112.0" text-anchor="middle" dominant-baseline="central">t0</text></g><g class="m"><rect x="136" y="96" width="60" height="32" rx="3"></rect><text class="sub" x="166.0" y="112.0" text-anchor="middle" dominant-baseline="central">t1</text></g><g class="m"><rect x="206" y="96" width="60" height="32" rx="3"></rect><text class="sub" x="236.0" y="112.0" text-anchor="middle" dominant-baseline="central">t2</text></g><g class="m"><rect x="276" y="96" width="60" height="32" rx="3"></rect><text class="sub" x="306.0" y="112.0" text-anchor="middle" dominant-baseline="central">t3</text></g><g class="m"><rect x="346" y="96" width="60" height="32" rx="3"></rect><text class="sub" x="376.0" y="112.0" text-anchor="middle" dominant-baseline="central">t4</text></g><g class="m"><rect x="416" y="96" width="60" height="32" rx="3"></rect><text class="sub" x="446.0" y="112.0" text-anchor="middle" dominant-baseline="central">t5</text></g><g class="m"><rect x="486" y="96" width="60" height="32" rx="3"></rect><text class="sub" x="516.0" y="112.0" text-anchor="middle" dominant-baseline="central">t6</text></g><g class="m"><rect x="556" y="96" width="60" height="32" rx="3"></rect><text class="sub" x="586.0" y="112.0" text-anchor="middle" dominant-baseline="central">t7</text></g><text class="sub2" x="66" y="152" text-anchor="start">every position through every layer, in parallel</text><g class="h"><rect x="40" y="196" width="600" height="148" rx="14"></rect><text class="lbl" x="62" y="222">Decode</text><text class="sub" x="62" y="240">one token at a time</text></g><g class="m"><rect x="66" y="252" width="60" height="32" rx="3"></rect><text class="sub" x="96.0" y="268.0" text-anchor="middle" dominant-baseline="central">t8</text></g><rect x="136" y="252" width="60" height="32" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><rect x="206" y="252" width="60" height="32" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><rect x="276" y="252" width="60" height="32" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="66" y="308" text-anchor="start">a full forward pass for each one, then again, and again</text><text class="cap" x="40" y="384" text-anchor="start">Prefill finishes with a representation for every position and is ready to generate. Decode then</text><text class="cap" x="40" y="404" text-anchor="start">produces output tokens one at a time, each paying for its own complete trip through the model,</text><text class="cap" x="40" y="424" text-anchor="start">until a stop signal or a length limit.</text></svg><figcaption>They run on the same chip with the same weights and the same code. Everything that differs between them comes from how many tokens share each load of the weights.</figcaption></figure>
