<figure><div class='ts'>Fig 18 &nbsp;&middot;&nbsp; 0:41</div><h3>Why this matters commercially</h3><svg viewBox="0 0 680 428" role="img"><title>Why this matters commercially</title><text class="cap" x="40" y="78" text-anchor="start">Share of AI compute</text><g class="h"><rect x="280" y="62" width="227" height="32" rx="3"></rect><text class="sub" x="393.5" y="78.0" text-anchor="middle" dominant-baseline="central">about two thirds, 2026</text></g><text class="cap" x="40" y="138" text-anchor="start">Hyperscaler AI capex</text><g class="h"><rect x="280" y="122" width="340" height="32" rx="3"></rect><text class="sub" x="450.0" y="138.0" text-anchor="middle" dominant-baseline="central">around $700 billion this year</text></g><text class="cap" x="40" y="198" text-anchor="start">One API's daily volume</text><g class="h"><rect x="280" y="182" width="300" height="32" rx="3"></rect><text class="sub" x="430.0" y="198.0" text-anchor="middle" dominant-baseline="central">over 20 trillion tokens</text></g><text class="cap" x="40" y="258" text-anchor="start">At this scale every architectural decision, from chip layout to memory hierarchy to scheduling</text><text class="cap" x="40" y="278" text-anchor="start">policy, collapses into one number.</text><g class="m"><rect x="190" y="306" width="300" height="42" rx="6"></rect><text class="sub" x="340.0" y="327.0" text-anchor="middle" dominant-baseline="central">cost per token</text></g><text class="cap" x="40" y="386" text-anchor="start">Inference is now the majority of the spend, not training. That is a recent inversion, and it is</text><text class="cap" x="40" y="406" text-anchor="start">why this stack gets so much engineering attention.</text></svg><figcaption>The projections are inherently uncertain, but the direction is not: serving models is where the compute and the money now go.</figcaption></figure>
