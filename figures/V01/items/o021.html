<figure><div class='ts'>Fig 21 &nbsp;&middot;&nbsp; 0:46</div><h3>Nothing lives in the model</h3><svg viewBox='0 0 680 390' role='img'><title>Nothing lives in the model</title><text class="hd" x="40" y="46">The weights do not know your system prompt</text><g class="h"><rect x="40" y="74" width="600" height="40" rx="5"/><text class="sub" x="340.0" y="94.0" text-anchor="middle" dominant-baseline="central">140 GB of weights: identical for every user, every request, forever</text></g><text class="cap" x="40" y="156" text-anchor="start">Nothing the operator writes is stored in the model. Training finished long before that text</text><text class="cap" x="40" y="176" text-anchor="start">existed, and the weights have not changed since.</text><g class="m"><rect x="90" y="208" width="500" height="42" rx="6"/><text class="sub" x="340.0" y="229.0" text-anchor="middle" dominant-baseline="central">so anything that shapes the answer must be in the context, that pass</text></g><text class="cap" x="40" y="292" text-anchor="start">There is no other channel. The model conditions on exactly one thing: the tokens in front of it</text><text class="cap" x="40" y="312" text-anchor="start">at that moment.</text><text class="cap" x="40" y="348" text-anchor="start">So the answer to your question is already half settled. The system prompt, the tool definitions</text><text class="cap" x="40" y="368" text-anchor="start">and any loaded skill are in your context every single turn, without exception.</text></svg><figcaption>The architectural fact everything else hangs on. There is no cupboard on the server the model can reach into; the context window is the only input it has.</figcaption></figure>
