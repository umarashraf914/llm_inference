<figure><div class='ts'>Fig 21 &nbsp;&middot;&nbsp; 0:21</div><h3>Nothing lives in the model</h3><svg viewBox='0 0 680 414' role='img'><title>Nothing lives in the model</title><text class="hd" x="40" y="46">The weights do not know the system prompt</text><g class="h"><rect x="40" y="74" width="600" height="40" rx="5"/><text class="sub" x="340.0" y="94.0" text-anchor="middle" dominant-baseline="central">70 billion weights: identical for every user, every request, forever</text></g><text class="cap" x="40" y="156" text-anchor="start">Nothing the operator writes is stored in the model. Training finished long before that text</text><text class="cap" x="40" y="176" text-anchor="start">existed, and the weights have not changed since.</text><g class="m"><rect x="90" y="208" width="500" height="42" rx="6"/><text class="sub" x="340.0" y="229.0" text-anchor="middle" dominant-baseline="central">so anything that shapes the answer must be in the context, that pass</text></g><text class="cap" x="40" y="292" text-anchor="start">There is no other channel. The model conditions on exactly one thing, the tokens in</text><text class="cap" x="40" y="312" text-anchor="start">front of it on that pass, which are called its context. The most it can take at once is</text><text class="cap" x="40" y="332" text-anchor="start">its context window, a fixed number of tokens set when the model was built.</text><text class="cap" x="40" y="372" text-anchor="start">So the system prompt, the tool descriptions and any loaded skill are in the context on</text><text class="cap" x="40" y="392" text-anchor="start">every single turn, without exception, and each one takes up room in the window.</text></svg><figcaption>The architectural fact everything else hangs on. There is no cupboard on the server the model can reach into; the context is the only input it has.</figcaption></figure>
