<figure><div class='ts'>Fig 35 &nbsp;&middot;&nbsp; 0:46</div><h3>Why a key and value can be reused</h3><svg viewBox='0 0 680 346' role='img'><title>Why a key and value can be reused</title><text class="hd" x="40" y="46">A token's key and value depend only on what came before it</text><g class="s"><rect x="60" y="70" width="76" height="32" rx="3"/><text class="sub" x="98.0" y="86.0" text-anchor="middle" dominant-baseline="central">t1</text></g><g class="s"><rect x="144" y="70" width="76" height="32" rx="3"/><text class="sub" x="182.0" y="86.0" text-anchor="middle" dominant-baseline="central">t2</text></g><g class="s"><rect x="228" y="70" width="76" height="32" rx="3"/><text class="sub" x="266.0" y="86.0" text-anchor="middle" dominant-baseline="central">t3</text></g><g class="s"><rect x="312" y="70" width="76" height="32" rx="3"/><text class="sub" x="350.0" y="86.0" text-anchor="middle" dominant-baseline="central">t4</text></g><g class="s"><rect x="396" y="70" width="76" height="32" rx="3"/><text class="sub" x="434.0" y="86.0" text-anchor="middle" dominant-baseline="central">t5</text></g><g class="u"><rect x="480" y="70" width="76" height="32" rx="3"/><text class="sub" x="518.0" y="86.0" text-anchor="middle" dominant-baseline="central">t6</text></g><g class="u"><rect x="564" y="70" width="76" height="32" rx="3"/><text class="sub" x="602.0" y="86.0" text-anchor="middle" dominant-baseline="central">t7</text></g><line class="tick" x1="60" y1="116" x2="480" y2="116"/><text class="sub2" x="60" y="140" text-anchor="start">token 5's key and value are computed from these five</text><text class="cap" x="40" y="192" text-anchor="start">Attention is causal, so nothing after token 5 can affect it. Its key and value are settled the</text><text class="cap" x="40" y="212" text-anchor="start">moment token 5 is processed and never change again.</text><text class="cap" x="40" y="248" text-anchor="start">That is the whole permission for caching. A value that could still change would be unsafe to</text><text class="cap" x="40" y="268" text-anchor="start">keep; one that is settled forever is safe to keep for as long as there is room.</text><text class="cap" x="40" y="304" text-anchor="start">It also tells you exactly when a cached value is still valid: when every token before it is the</text><text class="cap" x="40" y="324" text-anchor="start">same as it was.</text></svg><figcaption>Causality again, doing a third job. It forced decode to be sequential, it halved the score matrix, and here it is what makes caching sound.</figcaption></figure>
