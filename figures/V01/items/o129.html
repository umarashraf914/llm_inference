<figure><div class='ts'>Fig 129 &nbsp;&middot;&nbsp; 18:15</div><h3>Both phases on one diagram</h3><svg viewBox="0 0 680 478" role="img"><title>Both phases on one diagram</title><line class="axis" x1="90" y1="250" x2="620" y2="250"></line><line class="axis" x1="90" y1="50" x2="90" y2="250"></line><polyline class="pl-h" points="90,250 330,110 620,110"></polyline><line class="mark" x1="330" y1="110" x2="330" y2="250"></line><text class="sub2" x="330" y="274" text-anchor="middle">ridge, 295</text><g class="h"><rect x="126" y="214" width="12" height="12" rx="6"></rect></g><text class="sub2 halo" x="146" y="224" text-anchor="start">decode, intensity 1</text><g class="s"><rect x="534" y="104" width="12" height="12" rx="6"></rect></g><text class="sub2" x="430" y="92" text-anchor="start">prefill, intensity 2,000</text><text class="cap" x="40" y="316" text-anchor="start">Prefill sits about seven times to the right of the ridge, up on the flat ceiling: the arithmetic</text><text class="cap" x="40" y="336" text-anchor="start">units are saturated and the memory bus has bandwidth to spare.</text><text class="cap" x="40" y="376" text-anchor="start">Decode sits nearly three hundred times to the left, deep on the slanted ceiling, with HBM at</text><text class="cap" x="40" y="396" text-anchor="start">close to 100% utilisation and the arithmetic units running at under 1%.</text><text class="cap" x="40" y="436" text-anchor="start">That is the structural answer to where the thirty milliseconds went. Nothing is broken. The</text><text class="cap" x="40" y="456" text-anchor="start">workload's shape forces the chip into a regime where it can only wait.</text></svg><figcaption>Two points on the same picture, separated by a factor of two thousand. Everything the rest of this series does is an attempt to move the left-hand point rightward.</figcaption></figure>
