<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 18:15</div><h3>Both phases on one diagram</h3><svg viewBox='0 0 680 682' role='img'><title>Both phases on one diagram</title><text class="hd" x="40" y="34">Both phases on the H100's roofline, to scale</text><line class="axis" x1="100" y1="390" x2="500" y2="390"/><line class="axis" x1="100" y1="70" x2="100" y2="390"/><line class="tick" x1="100" y1="390" x2="100" y2="394"/><text class="sub2" x="100" y="408" text-anchor="middle">0.1</text><line class="tick" x1="180" y1="390" x2="180" y2="394"/><text class="sub2" x="180" y="408" text-anchor="middle">1</text><line class="tick" x1="260" y1="390" x2="260" y2="394"/><text class="sub2" x="260" y="408" text-anchor="middle">10</text><line class="tick" x1="340" y1="390" x2="340" y2="394"/><text class="sub2" x="340" y="408" text-anchor="middle">100</text><line class="tick" x1="420" y1="390" x2="420" y2="394"/><text class="sub2" x="420" y="408" text-anchor="middle">1,000</text><line class="tick" x1="500" y1="390" x2="500" y2="394"/><text class="sub2" x="500" y="408" text-anchor="middle">10,000</text><line class="tick" x1="96" y1="390" x2="100" y2="390"/><text class="sub2" x="92" y="394" text-anchor="end">100 G</text><line class="tick" x1="96" y1="326" x2="100" y2="326"/><text class="sub2" x="92" y="330" text-anchor="end">1 T</text><line class="tick" x1="96" y1="262" x2="100" y2="262"/><text class="sub2" x="92" y="266" text-anchor="end">10 T</text><line class="tick" x1="96" y1="198" x2="100" y2="198"/><text class="sub2" x="92" y="202" text-anchor="end">100 T</text><line class="tick" x1="96" y1="134" x2="100" y2="134"/><text class="sub2" x="92" y="138" text-anchor="end">1 P</text><line class="tick" x1="96" y1="70" x2="100" y2="70"/><text class="sub2" x="92" y="74" text-anchor="end">10 P</text><text class="sub2" x="300.0" y="428" text-anchor="middle">arithmetic intensity: operations per byte (log scale)</text><text class="sub2" x="92" y="56" text-anchor="start">operations per second (log scale)</text><polyline class="pl-m" points="100.0,356.4 377.6,134.3 500.0,134.3"/><line class="mark" x1="377.6" y1="138.3" x2="377.6" y2="390"/><text class="sub2 halo" x="383.6" y="380" text-anchor="start">ridge, 295</text><circle cx="180.0" cy="292.4" r="6" fill="var(--h-fill)" stroke="var(--h)" stroke-width="2"/><circle cx="444.1" cy="134.3" r="6" fill="var(--s-fill)" stroke="var(--s)" stroke-width="2"/><text class="sub2 halo" x="190.0" y="310.4" text-anchor="start">decode: 1 operation per byte</text><text class="sub2 halo" x="444.1" y="120.30000000000001" text-anchor="middle">prefill: 2,000</text><line class="tick" x1="180.0" y1="350" x2="377.6" y2="350"/><text class="sub2 halo" x="278.8" y="342" text-anchor="middle">× 295</text><line class="tick" x1="377.6" y1="350" x2="444.1" y2="350"/><text class="sub2 halo" x="410.85" y="342" text-anchor="middle">× 6.8</text><text class="cap" x="40" y="456" text-anchor="start">Prefill sits 6.8 times to the right of the ridge, up on the flat ceiling: the arithmetic</text><text class="cap" x="40" y="476" text-anchor="start">units are saturated and the memory bus has bandwidth to spare.</text><text class="cap" x="40" y="516" text-anchor="start">Decode sits 295 times to the left, deep on the slanted ceiling, with the memory bus at</text><text class="cap" x="40" y="536" text-anchor="start">close to full use and the arithmetic units busy 1/295 of the time, 0.34%. On a</text><text class="cap" x="40" y="556" text-anchor="start">logarithmic axis equal lengths are equal ratios, so the left-hand gap is drawn almost</text><text class="cap" x="40" y="576" text-anchor="start">three times as long as the right.</text><text class="cap" x="40" y="616" text-anchor="start">A prompt's intensity is simply its length: P tokens make P × 2N operations from the same</text><text class="cap" x="40" y="636" text-anchor="start">2N bytes. So prefill reaches the ridge at a prompt of about 295 tokens, and shorter</text><text class="cap" x="40" y="656" text-anchor="start">prompts are memory bound too.</text></svg><figcaption>Two points on the same picture, separated by a factor of two thousand. Everything the rest of this series does is an attempt to move the left-hand point rightward.</figcaption></figure>
