<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 20:22</div><h3>In a batch, one read of the weights makes one token for every user in it</h3><svg viewBox='0 0 680 438' role='img'><title>In a batch, one read of the weights makes one token for every user in it</title><text class="hd" x="40" y="46">Route three: four users, one token each; time runs to the right, to scale</text><text class="cap" x="40" y="92" text-anchor="start">one at a time</text><g class="h"><rect x="170.0" y="72" width="108.0" height="32" rx="3"/><text class="sub" x="224.0" y="88.0" text-anchor="middle" dominant-baseline="central">read: A's token</text></g><g class="h"><rect x="280.0" y="72" width="108.0" height="32" rx="3"/><text class="sub" x="334.0" y="88.0" text-anchor="middle" dominant-baseline="central">read: B's token</text></g><g class="h"><rect x="390.0" y="72" width="108.0" height="32" rx="3"/><text class="sub" x="444.0" y="88.0" text-anchor="middle" dominant-baseline="central">read: C's token</text></g><g class="h"><rect x="500.0" y="72" width="108.0" height="32" rx="3"/><text class="sub" x="554.0" y="88.0" text-anchor="middle" dominant-baseline="central">read: D's token</text></g><text class="sub2" x="610.0" y="124" text-anchor="end">167.2 ms</text><text class="cap" x="40" y="176" text-anchor="start">as a batch of four</text><g class="s"><rect x="170" y="156" width="108.0" height="32" rx="3"/><text class="sub" x="224.0" y="172.0" text-anchor="middle" dominant-baseline="central">one read</text></g><text class="sub2" x="288.0" y="177" text-anchor="start">41.8 ms: tokens for A, B, C and D</text><text class="cap" x="40" y="232" text-anchor="start">Each pass reads all 140 GB of weights whether it makes one token or many. One at a time,</text><text class="cap" x="40" y="252" text-anchor="start">four users need four reads: 167.2 ms. As a batch ({{fig:v01-p01}}), one read feeds all four,</text><text class="cap" x="40" y="272" text-anchor="start">and the step still takes 41.8 ms.</text><text class="cap" x="40" y="312" text-anchor="start">The batch does four times the arithmetic, 0.57 ms of it at full speed. That is still a</text><text class="cap" x="40" y="332" text-anchor="start">sliver of the read, so the step is no slower; each user gets a token in the same time,</text><text class="cap" x="40" y="352" text-anchor="start">and the chip makes four.</text><text class="cap" x="40" y="392" text-anchor="start">The weights are the same for every user ({{fig:v01-o108}}), which is the only reason one read</text><text class="cap" x="40" y="412" text-anchor="start">can serve them all.</text></svg><figcaption>Batching does not make anyone's token faster. It makes the expensive part shared, which is what moves the cost per token.</figcaption></figure>
