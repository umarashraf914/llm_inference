<figure><div class='ts'>Fig 104 &nbsp;&middot;&nbsp; 8:50</div><h3>Where the parameters live</h3><svg viewBox="0 0 680 348" role="img"><title>Where the parameters live</title><g class="u"><rect x="40" y="40" width="600" height="158" rx="14"></rect><text class="lbl" x="62" y="66">Every layer is parameterised by weight matrices</text></g><g class="s"><rect x="66" y="96" width="128" height="34" rx="4"></rect><text class="sub" x="130.0" y="113.0" text-anchor="middle" dominant-baseline="central">query</text></g><g class="s"><rect x="202" y="96" width="128" height="34" rx="4"></rect><text class="sub" x="266.0" y="113.0" text-anchor="middle" dominant-baseline="central">key</text></g><g class="s"><rect x="338" y="96" width="128" height="34" rx="4"></rect><text class="sub" x="402.0" y="113.0" text-anchor="middle" dominant-baseline="central">value</text></g><g class="s"><rect x="474" y="96" width="140" height="34" rx="4"></rect><text class="sub" x="544.0" y="113.0" text-anchor="middle" dominant-baseline="central">combine</text></g><g class="m"><rect x="66" y="142" width="264" height="34" rx="4"></rect><text class="sub" x="198.0" y="159.0" text-anchor="middle" dominant-baseline="central">feed-forward, first</text></g><g class="m"><rect x="338" y="142" width="276" height="34" rx="4"></rect><text class="sub" x="476.0" y="159.0" text-anchor="middle" dominant-baseline="central">feed-forward, second</text></g><text class="cap" x="40" y="236" text-anchor="start">Six matrices per layer, times sixty to a hundred layers. These weights are what the model</text><text class="cap" x="40" y="256" text-anchor="start">learned during training. They are the model.</text><text class="cap" x="40" y="286" text-anchor="start">After the last layer, the final vector at the last position is multiplied against a vocabulary</text><text class="cap" x="40" y="306" text-anchor="start">projection that scores every possible next token, and one is picked. That whole journey is one</text><text class="cap" x="40" y="326" text-anchor="start">forward pass.</text></svg><figcaption>The count of these matrices, and their size, is the number everything else in this video divides by or multiplies against.</figcaption></figure>
