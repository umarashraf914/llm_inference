<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 9:10</div><h3>Where the parameters live</h3><svg viewBox='0 0 680 358' role='img'><title>Where the parameters live</title><g class="u"><rect x="40" y="30" width="600" height="142" rx="14"/><text class="lbl" x="62" y="56">Every layer is parameterised by seven weight matrices</text></g><g class="s"><rect x="62" y="64" width="133" height="30" rx="4"/><text class="sub" x="128.5" y="79.0" text-anchor="middle" dominant-baseline="central">query, W_Q</text></g><g class="s"><rect x="203" y="64" width="133" height="30" rx="4"/><text class="sub" x="269.5" y="79.0" text-anchor="middle" dominant-baseline="central">key, W_K</text></g><g class="s"><rect x="344" y="64" width="133" height="30" rx="4"/><text class="sub" x="410.5" y="79.0" text-anchor="middle" dominant-baseline="central">value, W_V</text></g><g class="s"><rect x="485" y="64" width="133" height="30" rx="4"/><text class="sub" x="551.5" y="79.0" text-anchor="middle" dominant-baseline="central">combine, W_O</text></g><g class="m"><rect x="62" y="112" width="180" height="30" rx="4"/><text class="sub" x="152.0" y="127.0" text-anchor="middle" dominant-baseline="central">feed-forward gate</text></g><g class="m"><rect x="250" y="112" width="180" height="30" rx="4"/><text class="sub" x="340.0" y="127.0" text-anchor="middle" dominant-baseline="central">feed-forward up</text></g><g class="m"><rect x="438" y="112" width="180" height="30" rx="4"/><text class="sub" x="528.0" y="127.0" text-anchor="middle" dominant-baseline="central">feed-forward down</text></g><text class="cap" x="40" y="212" text-anchor="start">Four matrices for attention and three for the feed-forward block, in each of 80 layers:</text><text class="cap" x="40" y="232" text-anchor="start">560 matrices. These weights are what the model learned during training. They are the</text><text class="cap" x="40" y="252" text-anchor="start">model.</text><text class="cap" x="40" y="292" text-anchor="start">One forward pass is the whole journey: from the embedding lookup, through all 80 layers,</text><text class="cap" x="40" y="312" text-anchor="start">to the vocabulary projection and the choice of one token ({{fig:v01-o103}}). Every one</text><text class="cap" x="40" y="332" text-anchor="start">of these matrices is used exactly once on the way.</text></svg><figcaption>The count of these matrices, and their size, is the number everything else in this atlas divides by or multiplies against.</figcaption></figure>
