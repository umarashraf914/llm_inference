"28" rx="3"></rect></g><g class="m"><rect x="420" y="172" width="48" height="28" rx="3"></rect></g><text class="sub2" x="40" y="92" text-anchor="start">rows =</text><text class="sub2" x="40" y="112" text-anchor="start">outputs</text><text class="sub2" x="150" y="232" text-anchor="start">columns = inputs</text><g class="s"><rect x="500" y="70" width="48" height="130" rx="4"></rect></g><text class="sub2" x="524" y="232" text-anchor="middle">the token</text><g class="u"><rect x="580" y="70" width="48" height="130" rx="4"></rect></g><text class="sub2" x="604" y="232" text-anchor="middle">the output</text><text class="cap" x="40" y="282" text-anchor="start">Every cell of the matrix is a weight. Output row i is the sum over j of weight(i,j) times</text><text class="cap" x="40" y="302" text-anchor="start">input j, so each weight is touched in exactly one term of exactly one output.</text><text class="cap" x="40" y="338" text-anchor="start">Not once per layer. Not once per head. Once, full stop.</text><text class="cap" x="40" y="374" text-anchor="start">24 weights drawn, so 24 multiply-accumulates, so 48 operations. Whatever the shape, the</text><text class="cap" x="40" y="394" text-anchor="start">operation count is twice the number of cells.</text></svg><figcaption>This is the step that makes the rule exact rather than approximate. A weight cannot be reused within one token's pass, because there is only one input vector for it to act on.</figcaption></figure>
