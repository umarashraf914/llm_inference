<figure><div class='ts'>Fig 78 &nbsp;&middot;&nbsp; 4:26</div><h3>Why they scale differently</h3><svg viewBox="0 0 680 356" role="img"><title>Why they scale differently</title><text class="hd" x="40" y="46">Compute scales with one thing</text><g class="m"><rect x="60" y="66" width="200" height="34" rx="4"></rect><text class="sub" x="160.0" y="83.0" text-anchor="middle" dominant-baseline="central">transistor density</text></g><text class="sub2" x="276" y="89" text-anchor="start">no hard ceiling reached yet</text><text class="hd" x="40" y="148">Bandwidth is the product of three, each with its own physical limit</text><g class="h"><rect x="60" y="168" width="172" height="40" rx="4"></rect><text class="sub" x="146.0" y="188.0" text-anchor="middle" dominant-baseline="central">signalling rate per pin</text></g><text class="hd" x="240" y="192" text-anchor="start">x</text><g class="h"><rect x="262" y="168" width="160" height="40" rx="4"></rect><text class="sub" x="342.0" y="188.0" text-anchor="middle" dominant-baseline="central">pins per stack</text></g><text class="hd" x="430" y="192" text-anchor="start">x</text><g class="h"><rect x="452" y="168" width="168" height="40" rx="4"></rect><text class="sub" x="536.0" y="188.0" text-anchor="middle" dominant-baseline="central">stacks per chip</text></g><text class="cap" x="40" y="254" text-anchor="start">Pins can only switch so fast before signal integrity fails. Stacks need physical area on the</text><text class="cap" x="40" y="274" text-anchor="start">package, and the package has edges. Every term is bounded by geometry or by physics.</text><text class="cap" x="40" y="314" text-anchor="start">So one curve keeps climbing and the other is fighting three ceilings at once. The divergence is</text><text class="cap" x="40" y="334" text-anchor="start">not a failure of engineering effort; it is built into what the two things are.</text></svg><figcaption>This is the mechanism behind the memory wall. Compute has one lever and memory has three constrained ones.</figcaption></figure>
