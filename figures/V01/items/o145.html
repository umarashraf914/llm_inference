<figure><div class='ts'>Fig 145 &nbsp;&middot;&nbsp; 28:20</div><h3>Throughput against goodput</h3><svg viewBox="0 0 680 422" role="img"><title>Throughput against goodput</title><text class="cap" x="40" y="78" text-anchor="start">Throughput</text><g class="u"><rect x="280" y="62" width="340" height="32" rx="3"></rect><text class="sub" x="450.0" y="78.0" text-anchor="middle" dominant-baseline="central">all tokens generated per second</text></g><text class="cap" x="40" y="138" text-anchor="start">Goodput</text><g class="s"><rect x="280" y="122" width="190" height="32" rx="3"></rect><text class="sub" x="375.0" y="138.0" text-anchor="middle" dominant-baseline="central">only the ones in time</text></g><rect x="280" y="122" width="340" height="32" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="cap" x="40" y="200" text-anchor="start">Goodput is not a separate measurement so much as a filter on throughput: count only the tokens</text><text class="cap" x="40" y="220" text-anchor="start">delivered inside the system's promised latency targets.</text><text class="cap" x="40" y="260" text-anchor="start">You can run enormous throughput by packing thousands of requests into huge batches and</text><text class="cap" x="40" y="280" text-anchor="start">processing them slowly. The tokens get generated and the counter looks impressive.</text><text class="cap" x="40" y="320" text-anchor="start">But if every user stares at a blank screen for forty seconds before their first character, every</text><text class="cap" x="40" y="340" text-anchor="start">one of those tokens missed its TTFT target and goodput is zero. The system is producing tokens</text><text class="cap" x="40" y="360" text-anchor="start">nobody was willing to wait for.</text><text class="cap" x="40" y="400" text-anchor="start">Goodput, not raw throughput, is what a production system is optimising for.</text></svg><figcaption>The most important distinction in the video for anyone who operates a system rather than benchmarks one.</figcaption></figure>
