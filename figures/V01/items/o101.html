<figure><div class='ts'>Fig 101 &nbsp;&middot;&nbsp; 7:15</div><h3>The parameter count settles it</h3><svg viewBox='0 0 680 482' role='img'><title>The parameter count settles it</title><text class="hd" x="40" y="46">Add it up and check against the advertised size</text><text class="cap" x="40" y="94" text-anchor="start">attention, per layer</text><g class="m"><rect x="340" y="76" width="180" height="28" rx="3"/><text class="sub" x="430.0" y="90.0" text-anchor="middle" dominant-baseline="central">151.0 M</text></g><text class="cap" x="40" y="134" text-anchor="start">feed-forward, per layer</text><g class="m"><rect x="340" y="116" width="180" height="28" rx="3"/><text class="sub" x="430.0" y="130.0" text-anchor="middle" dominant-baseline="central">704.6 M</text></g><text class="cap" x="40" y="174" text-anchor="start">one layer</text><g class="u"><rect x="340" y="156" width="180" height="28" rx="3"/><text class="sub" x="430.0" y="170.0" text-anchor="middle" dominant-baseline="central">855.6 M</text></g><text class="cap" x="40" y="214" text-anchor="start">x 80 layers</text><g class="s"><rect x="340" y="196" width="180" height="28" rx="3"/><text class="sub" x="430.0" y="210.0" text-anchor="middle" dominant-baseline="central">68.5 B</text></g><text class="cap" x="40" y="254" text-anchor="start">plus embedding and output head</text><g class="s"><rect x="340" y="236" width="180" height="28" rx="3"/><text class="sub" x="430.0" y="250.0" text-anchor="middle" dominant-baseline="central">2.1 B</text></g><line class="axis" x1="40" y1="278" x2="640" y2="278"/><text class="sub2" x="40" y="306" text-anchor="start">total</text><g class="s"><rect x="340" y="290" width="180" height="28" rx="3"/><text class="sub" x="430.0" y="304.0" text-anchor="middle" dominant-baseline="central">70.6 B</text></g><text class="sub2" x="556" y="310" text-anchor="start">advertised: 70 B</text><text class="cap" x="40" y="368" text-anchor="start">It lands, to within rounding. Now do the same sum assuming W_Q, W_K and W_V exist only once</text><text class="cap" x="40" y="388" text-anchor="start">for the whole model rather than once per layer.</text><text class="cap" x="40" y="424" text-anchor="start">You get 63.9 billion, and the model would be six billion parameters short of what it is.</text><text class="cap" x="40" y="460" text-anchor="start">So the per-layer answer is not a design opinion. It is the only version that adds up.</text></svg><figcaption>Shapes taken from a published 70-billion-parameter model. The arithmetic is the evidence: the count only works if every layer has its own three matrices.</figcaption></figure>
