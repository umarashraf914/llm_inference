<figure><div class='ts'>Fig 105 &nbsp;&middot;&nbsp; 9:30</div><h3>140 gigabytes, moved every pass</h3><svg viewBox="0 0 680 454" role="img"><title>140 gigabytes, moved every pass</title><g class="m"><rect x="60" y="46" width="560" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">memory  =  parameter count  x  bytes per parameter</text></g><text class="cap" x="40" y="122" text-anchor="start">70 billion parameters</text><g class="s"><rect x="300" y="106" width="100" height="32" rx="3"></rect><text class="sub" x="350.0" y="122.0" text-anchor="middle" dominant-baseline="central">x 2 bytes</text></g><text class="sub2" x="416" y="125" text-anchor="start">= 140 GB, in 16-bit precision</text><text class="cap" x="40" y="182" text-anchor="start">That is the entire model, sitting in the chip's off-chip memory pool. It does not change</text><text class="cap" x="40" y="202" text-anchor="start">between requests. It is the model.</text><text class="hd" x="40" y="252">What HBM physically is</text><g class="h"><rect x="60" y="272" width="120" height="30" rx="3"></rect><text class="sub" x="120.0" y="287.0" text-anchor="middle" dominant-baseline="central">die</text></g><g class="h"><rect x="60" y="306" width="120" height="30" rx="3"></rect><text class="sub" x="120.0" y="321.0" text-anchor="middle" dominant-baseline="central">die</text></g><g class="h"><rect x="60" y="340" width="120" height="30" rx="3"></rect><text class="sub" x="120.0" y="355.0" text-anchor="middle" dominant-baseline="central">die</text></g><g class="u"><rect x="200" y="272" width="120" height="98" rx="4"></rect><text class="sub" x="260.0" y="321.0" text-anchor="middle" dominant-baseline="central">GPU die</text></g><line class="conn" x1="184" y1="320" x2="196" y2="320"></line><text class="sub2" x="346" y="300" text-anchor="start">Stacks of memory chips bonded beside</text><text class="sub2" x="346" y="320" text-anchor="start">the GPU on the same package, joined by</text><text class="sub2" x="346" y="340" text-anchor="start">a very wide parallel bus.</text><text class="cap" x="40" y="412" text-anchor="start">Every forward pass reads all 140 GB out of HBM and moves them across that bus into the</text><text class="cap" x="40" y="432" text-anchor="start">arithmetic units. Every single time.</text></svg><figcaption>High bandwidth memory is close and wide, but it is still off the compute die, and that trip is what the rest of the video is about.</figcaption></figure>
