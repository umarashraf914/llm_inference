<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 9:33</div><h3>140 gigabytes, moved every pass</h3><svg viewBox='0 0 680 332' role='img'><title>140 gigabytes, moved every pass</title><g class="m"><rect x="40" y="30" width="600" height="42" rx="6"/><text class="sub" x="340.0" y="51.0" text-anchor="middle" dominant-baseline="central">memory  =  parameter count  ×  bytes per parameter</text></g><text class="cap" x="40" y="112" text-anchor="start">70 billion parameters</text><g class="s"><rect x="220" y="92" width="90" height="30" rx="4"/><text class="sub" x="265.0" y="107.0" text-anchor="middle" dominant-baseline="central">× 2 bytes</text></g><text class="sub2" x="322" y="112" text-anchor="start">= 140 GB, at 16 bits per parameter</text><text class="cap" x="40" y="166" text-anchor="start">That is the entire model, sitting in the memory beside the chip. It does not change</text><text class="cap" x="40" y="186" text-anchor="start">between requests. It is the model.</text><text class="cap" x="40" y="226" text-anchor="start">Every forward pass reads all 140 GB out of that memory and moves it across the bus into</text><text class="cap" x="40" y="246" text-anchor="start">the arithmetic units. Every single time.</text><text class="cap" x="40" y="286" text-anchor="start">The next figures ask whether 140 GB fits on one chip, where else the weights could sit,</text><text class="cap" x="40" y="306" text-anchor="start">and what the memory beside the chip physically is.</text></svg><figcaption>One multiplication turns a parameter count into a byte count, and the byte count is what every token has to pay to move.</figcaption></figure>
