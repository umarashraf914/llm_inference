<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 20:27</div><h3>Checking several guessed tokens in one pass is the other way to share a read</h3><svg viewBox='0 0 680 508' role='img'><title>Checking several guessed tokens in one pass is the other way to share a read</title><text class="hd" x="40" y="46">Route three, again: four guessed tokens checked in one pass (illustrative)</text><text class="cap" x="40" y="92" text-anchor="start">a small model guesses</text><g class="u"><rect x="210" y="72" width="62" height="30" rx="3"/><text class="sub" x="241.0" y="87.0" text-anchor="middle" dominant-baseline="central">guess 1</text></g><g class="u"><rect x="280" y="72" width="62" height="30" rx="3"/><text class="sub" x="311.0" y="87.0" text-anchor="middle" dominant-baseline="central">guess 2</text></g><g class="u"><rect x="350" y="72" width="62" height="30" rx="3"/><text class="sub" x="381.0" y="87.0" text-anchor="middle" dominant-baseline="central">guess 3</text></g><g class="u"><rect x="420" y="72" width="62" height="30" rx="3"/><text class="sub" x="451.0" y="87.0" text-anchor="middle" dominant-baseline="central">guess 4</text></g><text class="cap" x="40" y="152" text-anchor="start">the large model checks</text><g class="h"><rect x="210" y="132" width="272" height="30" rx="3"/><text class="sub" x="346.0" y="147.0" text-anchor="middle" dominant-baseline="central">one pass: one read of 140 GB</text></g><text class="cap" x="40" y="212" text-anchor="start">tokens kept</text><g class="s"><rect x="210" y="192" width="62" height="30" rx="3"/><text class="sub" x="241.0" y="207.0" text-anchor="middle" dominant-baseline="central">kept</text></g><g class="s"><rect x="280" y="192" width="62" height="30" rx="3"/><text class="sub" x="311.0" y="207.0" text-anchor="middle" dominant-baseline="central">kept</text></g><g class="s"><rect x="350" y="192" width="62" height="30" rx="3"/><text class="sub" x="381.0" y="207.0" text-anchor="middle" dominant-baseline="central">kept</text></g><g class="m"><rect x="420" y="192" width="62" height="30" rx="3"/><text class="sub" x="451.0" y="207.0" text-anchor="middle" dominant-baseline="central">replaced</text></g><text class="sub2" x="500" y="212" text-anchor="start">four tokens, one read</text><text class="cap" x="40" y="262" text-anchor="start">A second way to share one read is to give the large model several positions to work on</text><text class="cap" x="40" y="282" text-anchor="start">at once. A much smaller model writes a few guesses quickly; the large model then checks</text><text class="cap" x="40" y="302" text-anchor="start">all of them in a single pass, because attention lets every position be scored in</text><text class="cap" x="40" y="322" text-anchor="start">parallel ({{fig:v08-o003}}).</text><text class="cap" x="40" y="362" text-anchor="start">Here the first three guesses agree with what the large model would have written and are</text><text class="cap" x="40" y="382" text-anchor="start">kept. The fourth does not, so it is replaced by the large model's own choice. Four</text><text class="cap" x="40" y="402" text-anchor="start">tokens for one read of the weights, plus four passes of the small model, which reads far</text><text class="cap" x="40" y="422" text-anchor="start">fewer bytes.</text><text class="cap" x="40" y="462" text-anchor="start">How many guesses survive depends on the text and the guesser, so these numbers are</text><text class="cap" x="40" y="482" text-anchor="start">illustrative; the eighth video is about this technique, speculative decoding.</text></svg><figcaption>Batching shares a read across users; speculation shares it across positions in one user's answer. Both work because arithmetic was never what decode waited on.</figcaption></figure>
