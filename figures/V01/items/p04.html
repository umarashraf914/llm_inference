r(--m)" stroke-width="1.5"/><text class="sub2" x="338.0" y="318" text-anchor="start">PagedAttention (V3)</text><line class="tick" x1="388.0" y1="342" x2="388.0" y2="356"/><circle cx="388.0" cy="360" r="3.5" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><text class="sub2" x="394.0" y="338" text-anchor="start">prefill and decode split apart (V7)</text><text class="cap" x="40" y="418" text-anchor="start">The memory wall was named in 1995 and the roofline model drawn in 2009, so the problem</text><text class="cap" x="40" y="438" text-anchor="start">is old. The transformer, the design every model here uses, dates from 2017. Almost every</text><text class="cap" x="40" y="458" text-anchor="start">technique that makes serving one affordable appeared between 2022 and 2024.</text><text class="cap" x="40" y="498" text-anchor="start">Each date is the first public version of the paper that introduced the idea; the label</text><text class="cap" x="40" y="518" text-anchor="start">in brackets is the video in this series that takes it apart.</text></svg><figcaption>The physics is decades old and the workload is recent. That combination is why the field changes so fast: the constraint is fixed, and people only recently had a reason to fight it.</figcaption></figure>
