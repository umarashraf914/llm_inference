<figure><div class='ts'>Fig 114 &nbsp;&middot;&nbsp; 11:46</div><h3>Counting operations from the parameter count</h3><svg viewBox="0 0 680 344" role="img"><title>Counting operations from the parameter count</title><g class="m"><rect x="60" y="46" width="560" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">operations per token  =  2  x  parameter count</text></g><text class="cap" x="40" y="122" text-anchor="start">Every parameter is used exactly once per forward pass, in one multiply and one add. Two</text><text class="cap" x="40" y="142" text-anchor="start">operations per parameter.</text><text class="cap" x="40" y="182" text-anchor="start">70 billion parameters</text><g class="s"><rect x="300" y="166" width="100" height="32" rx="3"></rect><text class="sub" x="350.0" y="182.0" text-anchor="middle" dominant-baseline="central">x 2</text></g><text class="sub2" x="416" y="185" text-anchor="start">= 140 billion operations</text><text class="cap" x="40" y="242" text-anchor="start">And the bytes moved are the same count times the bytes per parameter, which for 16-bit weights</text><text class="cap" x="40" y="262" text-anchor="start">is 140 gigabytes.</text><text class="cap" x="40" y="302" text-anchor="start">So for a single token, the operations and the bytes are numerically almost the same. Hold that</text><text class="cap" x="40" y="322" text-anchor="start">thought; it is about to matter enormously.</text></svg><figcaption>A derivation worth being able to do from memory. It turns any parameter count straight into both an operation count and a byte count.</figcaption></figure>
