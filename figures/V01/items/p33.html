<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 26:52</div><h3>The pause before the first token is prefill, and its length is arithmetic</h3><svg viewBox='0 0 680 618' role='img'><title>The pause before the first token is prefill, and its length is arithmetic</title><text class="hd" x="40" y="46">One prompt's prefill, alone on an H100 at full peak (log scale)</text><text class="cap" x="40" y="90" text-anchor="start">200 tokens</text><text class="sub2" x="40" y="110" text-anchor="start">42.1 ms: memory</text><g class="h"><rect x="190" y="76" width="75.0" height="16" rx="2"/></g><text class="sub2" x="273.0" y="89" text-anchor="start">reading, 42.1 ms</text><g class="m"><rect x="190" y="96" width="54.69999999999999" height="16" rx="2"/></g><text class="sub2" x="252.7" y="109" text-anchor="start">arithmetic, 28.6 ms</text><text class="cap" x="40" y="160" text-anchor="start">2,000 tokens</text><text class="sub2" x="40" y="180" text-anchor="start">291 ms: arithmetic</text><g class="h"><rect x="190" y="146" width="75.19999999999999" height="16" rx="2"/></g><text class="sub2" x="273.2" y="159" text-anchor="start">reading, 42.3 ms</text><g class="m"><rect x="190" y="166" width="175.60000000000002" height="16" rx="2"/></g><text class="sub2" x="373.6" y="179" text-anchor="start">arithmetic, 291 ms</text><text class="cap" x="40" y="230" text-anchor="start">20,000 tokens</text><text class="sub2" x="40" y="250" text-anchor="start">3.38 s: arithmetic</text><g class="h"><rect x="190" y="216" width="77.30000000000001" height="16" rx="2"/></g><text class="sub2" x="275.3" y="229" text-anchor="start">reading, 44.1 ms</text><g class="m"><rect x="190" y="236" width="303.5" height="16" rx="2"/></g><text class="sub2" x="501.5" y="249" text-anchor="start">arithmetic, 3.38 s</text><line class="tick" x1="190" y1="272" x2="550.0" y2="272"/><line class="tick" x1="190.0" y1="272" x2="190.0" y2="278"/><text class="sub2" x="190.0" y="294" text-anchor="middle">10 ms</text><line class="tick" x1="310.0" y1="272" x2="310.0" y2="278"/><text class="sub2" x="310.0" y="294" text-anchor="middle">100 ms</text><line class="tick" x1="430.0" y1="272" x2="430.0" y2="278"/><text class="sub2" x="430.0" y="294" text-anchor="middle">1 s</text><line class="tick" x1="550.0" y1="272" x2="550.0" y2="278"/><text class="sub2" x="550.0" y="294" text-anchor="middle">10 s</text><text class="cap" x="40" y="336" text-anchor="start">A prompt goes through prefill in a single pass, so its pause is the longer of two times:</text><text class="cap" x="40" y="356" text-anchor="start">reading the weights once, 141.1 GB at 3.35 TB/s (with the prompt's keys and values</text><text class="cap" x="40" y="376" text-anchor="start">written), and the arithmetic, two operations per weight for every token plus attention's</text><text class="cap" x="40" y="396" text-anchor="start">scores and blend ({{fig:v01-o128}}), at 989 trillion a second.</text><text class="cap" x="40" y="436" text-anchor="start">Reading takes about 42 ms whatever the length. The arithmetic grows with the prompt and</text><text class="cap" x="40" y="456" text-anchor="start">overtakes the reading at 295 tokens, the ridge ({{fig:v01-o129}}): a 200-token prompt</text><text class="cap" x="40" y="476" text-anchor="start">waits on memory, a 2,000-token one on arithmetic. At 20,000 tokens attention's share,</text><text class="cap" x="40" y="496" text-anchor="start">which grows with the square of the length, is already 16% of the arithmetic.</text><text class="cap" x="40" y="536" text-anchor="start">These are floors: one request alone on a chip at full peak, counted as if one H100 held</text><text class="cap" x="40" y="556" text-anchor="start">the whole model ({{fig:v01-o014}}). Real pauses are longer, with queueing and other</text><text class="cap" x="40" y="576" text-anchor="start">requests sharing the chip, which is how a user comes to see half a second for a short</text><text class="cap" x="40" y="596" text-anchor="start">prompt and several seconds for a long one.</text></svg><figcaption>The wait for the first word is the longer of one read of the weights and the prompt's arithmetic, so short prompts wait on memory and long ones on the arithmetic units. Log scale.</figcaption></figure>
