<figure><div class='ts'>Fig 14 &nbsp;&middot;&nbsp; 0:00</div><h3>Where the thirty milliseconds comes from</h3><svg viewBox='0 0 680 470' role='img'><title>Where the thirty milliseconds comes from</title><text class="hd" x="40" y="46">Where thirty milliseconds comes from</text><g class="m"><rect x="90" y="70" width="500" height="42" rx="6"/><text class="sub" x="340.0" y="91.0" text-anchor="middle" dominant-baseline="central">time per token  =  bytes to read  /  bytes read per second</text></g><text class="cap" x="40" y="162" text-anchor="start">H100, 3.35 TB/s</text><g class="u"><rect x="240" y="144" width="334.4" height="30" rx="3"/></g><text class="sub2" x="586.4" y="162" text-anchor="start">41.8 ms per token</text><text class="cap" x="40" y="208" text-anchor="start">H200, 4.8 TB/s</text><g class="s"><rect x="240" y="190" width="233.6" height="30" rx="3"/></g><text class="sub2" x="485.6" y="208" text-anchor="start">29.2 ms per token</text><text class="cap" x="40" y="254" text-anchor="start">B200, 8 TB/s</text><g class="u"><rect x="240" y="236" width="140.0" height="30" rx="3"/></g><text class="sub2" x="392.0" y="254" text-anchor="start">17.5 ms per token</text><text class="cap" x="40" y="316" text-anchor="start">140 gigabytes of weights, divided by how fast each chip can read. The middle row lands on</text><text class="cap" x="40" y="336" text-anchor="start">twenty-nine milliseconds, which is where the video's round figure of thirty comes from.</text><text class="cap" x="40" y="372" text-anchor="start">The number is not a guess or a benchmark. It is a division, and it changes when either the</text><text class="cap" x="40" y="392" text-anchor="start">model size or the memory speed changes.</text><text class="cap" x="40" y="428" text-anchor="start">Later in this video the same division is done on the H100 and gives about twenty-four tokens a</text><text class="cap" x="40" y="448" text-anchor="start">second. Both are correct; they are different chips.</text></svg><figcaption>Two figures in this video that look inconsistent are reconciled here. Worth doing, because noticing the tension and resolving it is exactly the habit this material rewards.</figcaption></figure>
