<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 20:10</div><h3>Route one: a faster memory</h3><svg viewBox='0 0 680 464' role='img'><title>Route one: a faster memory</title><text class="hd" x="40" y="46">Route one: the same 140 GB, read by three chips; time per token to scale</text><text class="cap" x="40" y="90" text-anchor="start">H100, 3.35 TB/s</text><g class="h"><rect x="190" y="70" width="380.0" height="30" rx="3"/></g><text class="sub2" x="580.0" y="90" text-anchor="start">41.8 ms</text><text class="cap" x="40" y="136" text-anchor="start">H200, 4.8 TB/s</text><g class="s"><rect x="190" y="116" width="265.2" height="30" rx="3"/></g><text class="sub2" x="465.2" y="136" text-anchor="start">29.2 ms</text><text class="cap" x="40" y="182" text-anchor="start">B200, 8 TB/s</text><g class="s"><rect x="190" y="162" width="159.1" height="30" rx="3"/></g><text class="sub2" x="359.1" y="182" text-anchor="start">17.5 ms</text><text class="cap" x="40" y="238" text-anchor="start">Time per token = bytes to read ÷ bytes read per second. A chip with faster memory reads</text><text class="cap" x="40" y="258" text-anchor="start">the same 140 GB sooner: the H200 has the H100's arithmetic and 4.8 TB/s, the B200 8</text><text class="cap" x="40" y="278" text-anchor="start">TB/s. The numbers are NVIDIA's specifications.</text><text class="cap" x="40" y="318" text-anchor="start">The bound moves exactly in proportion to bandwidth, which is what makes this route</text><text class="cap" x="40" y="338" text-anchor="start">reliable and also what limits it: bandwidth is the number that grows slowest</text><text class="cap" x="40" y="358" text-anchor="start">({{fig:v01-o081}}).</text><text class="cap" x="40" y="398" text-anchor="start">For the opening's 30 ms: that is a round figure for a large model serving real traffic.</text><text class="cap" x="40" y="418" text-anchor="start">The 41.8 ms here is the bound for this 70-billion-parameter model in 16 bits on one</text><text class="cap" x="40" y="438" text-anchor="start">H100, a chip that in fact cannot hold it alone ({{fig:v01-p20}}).</text></svg><figcaption>The simplest route, and the one this series spends least time on: it is bought, not engineered.</figcaption></figure>
