<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 20:15</div><h3>Halving the bits halves the wait</h3><svg viewBox='0 0 680 424' role='img'><title>Halving the bits halves the wait</title><text class="hd" x="40" y="46">Route two: the same 70 billion weights in fewer bits, on one H100, to scale</text><text class="cap" x="40" y="90" text-anchor="start">16 bits: 140 GB</text><g class="h"><rect x="190" y="70" width="380.0" height="30" rx="3"/></g><text class="sub2" x="580.0" y="90" text-anchor="start">41.8 ms per token</text><text class="cap" x="40" y="136" text-anchor="start">8 bits: 70 GB</text><g class="s"><rect x="190" y="116" width="190.0" height="30" rx="3"/></g><text class="sub2" x="390.0" y="136" text-anchor="start">20.9 ms per token</text><text class="cap" x="40" y="182" text-anchor="start">4 bits: 35 GB</text><g class="s"><rect x="190" y="162" width="95.0" height="30" rx="3"/></g><text class="sub2" x="295.0" y="182" text-anchor="start">10.4 ms per token</text><text class="cap" x="40" y="238" text-anchor="start">Bytes per token are parameters × bytes per parameter, so halving the bits halves the</text><text class="cap" x="40" y="258" text-anchor="start">bytes and halves the wait: 70 GB in 8 bits reads in 20.9 ms, 35 GB in 4 bits in 10.4 ms.</text><text class="cap" x="40" y="298" text-anchor="start">The arithmetic does not shrink, but it was never the bottleneck. What can shrink is</text><text class="cap" x="40" y="318" text-anchor="start">quality: every weight is rounded to one of fewer values ({{fig:v01-p07}}), and the</text><text class="cap" x="40" y="338" text-anchor="start">fourth video is about how far that can go before the answers suffer ({{fig:v04-o057}}).</text><text class="cap" x="40" y="378" text-anchor="start">The same lever works on the other bytes decode reads: Part 11 meets the keys and values</text><text class="cap" x="40" y="398" text-anchor="start">kept for every token, and they can be stored in fewer bits too.</text></svg><figcaption>Route two attacks the numerator of the division. It is the cheapest of the three, and it costs accuracy rather than money.</figcaption></figure>
