t="194.7" rx="0.5"/></g><g class="h" data-k="99"><rect x="595.6" y="110.1" width="3.6" height="209.9" rx="0.5"/></g><line class="mark" data-line="" x1="76" y1="196.4" x2="600.0" y2="196.4"/><text class="sub2 halo" x="40" y="66" data-lab="">the promise, the dashed line: first token within 1.0 s</text><text class="sub2" x="82.6" y="340" text-anchor="middle">1</text><text class="sub2" x="337.4" y="340" text-anchor="middle">50</text><text class="sub2" x="597.4" y="340" text-anchor="middle">100</text><text class="sub2" x="340.0" y="360" text-anchor="middle">requests, quickest first</text><text class="sub2" x="40" y="396" data-r="0">60 of 100 requests had their first token within 1.0 s</text><text class="sub2" x="40" y="418" text-anchor="start">throughput: 100 × 500 tokens in 60 s = 833 tokens a second</text><text class="sub2" x="40" y="440" data-r="1">goodput: 60 × 500 tokens in 60 s = 500 tokens a second</text><text class="cap" x="40" y="488" text-anchor="start">Each bar is one request: how long it waited for its first token, quickest on the left,</text><text class="cap" x="40" y="508" text-anchor="start">on a log scale. The dashed line is the promise. Throughput counts every token produced;</text><text class="cap" x="40" y="528" text-anchor="start">goodput counts only the tokens of requests that kept the promise ({{fig:v01-o145}}).</text><text class="cap" x="40" y="568" text-anchor="start">At a one-second promise 60 of the 100 requests make it. The machine produced 833 tokens</text><text class="cap" x="40" y="588" text-anchor="start">a second, but only 500 a second reached people within the time they were promised.</text><text class="cap" x="40" y="608" text-anchor="start">Tighten the promise and goodput falls, though the machine did exactly the same work.</text><text class="cap" x="40" y="648" text-anchor="start">The waits are illustrative. Reading such a sorted list by position, the median and the</text><text class="cap" x="40" y="668" text-anchor="start">99th, is {{fig:v08-o025}}. The readouts were checked against Python at every position of the</text><text class="cap" x="40" y="688" text-anchor="start">slider.</text></svg></div><figcaption>Goodput is throughput with a filter on it, and the filter is the promise. The same minute of work is worth 833 or 500 tokens a second, depending on what the users were promised.</figcaption><script>(() => {

  const MINUS = '−';
  const fx = (v, d = 2) => { const s = Math.abs(v).toFixed(d); return (v < 0 && +s !== 0 ? MINUS : '') + s; };
  const gx = (v, d = 0) => { const s = Math.abs(v).toFixed(d); const [a, b] = s.split('.');
    const t = a.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (v < 0 && +s !== 0 ? MINUS : '') + t + (b !== undefined ? '.' + b : ''); };

  const fig = document.currentScript.closest('figure');
  const T = [8, 11, 14, 16, 17, 19, 20, 22, 23, 24, 26, 27, 28, 29, 31, 32, 33, 34, 36, 37, 38, 39, 40, 42, 43, 44, 45, 46, 48, 49, 50, 52, 53, 54, 56, 57, 58, 60, 61, 63, 64, 66, 67, 69, 70, 72, 74, 75, 77, 79, 81, 82, 84, 86, 88, 90, 92, 94, 97, 99, 101, 104, 106, 109, 111, 114, 117, 120, 123, 126, 129, 133, 136, 140, 144, 148, 153, 157, 162, 167, 173, 178, 185, 191, 199, 206, 215, 224, 235, 246, 259, 274, 291, 311, 335, 366, 407, 465, 561, 809], TOK = 500, WIN = 60, T0 = 10, YB = 320, PX = 95;
  const sl = fig.querySelector('input[type=range]'), val = fig.querySelector('.val'), q = s => fig.querySelector(s);
  const ty = h => +(YB - PX * Math.log10(h / 5)).toFixed(1);
  function draw() {
    const k = +sl.value, m = T.filter(t => t <= 10 * k).length;
    val.textContent = fx(k / 10, 1) + ' s';
    T.forEach((t, i) => q(`[data-k="${i}"]`).setAttribute('class', t <= 10 * k ? 's' : 'h'));
    const y = ty(10 * k), ln = q('[data-line]'); ln.setAttribute('y1', y); ln.setAttribute('y2', y);
    q('[data-lab]').textContent = `the promise, the dashed line: first token within ${fx(k / 10, 1)} s`;
    q('[data-r="0"]').textContent = `${m} of ${T.length} requests had their first token within ${fx(k / 10, 1)} s`;
    q('[data-r="1"]').textContent = `goodput: ${m} × ${TOK} tokens in ${WIN} s = ${gx(m * TOK / WIN)} tokens a second`;
  }
  sl.addEventListener('input', draw);
  q('button').addEventListener('click', () => { sl.value = T0; draw(); });
  draw();
})();</script></figure>
