<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:02</div><h3>Sixteen bits give 65,536 patterns, so every weight is rounded to the nearest one</h3><svg viewBox='0 0 680 666' role='img'><title>Sixteen bits give 65,536 patterns, so every weight is rounded to the nearest one</title><text class="hd" x="40" y="46">Each extra bit doubles the number of patterns</text><text class="sub2" x="60" y="82" text-anchor="start">1 bit</text><text class="sub2" x="150" y="82" text-anchor="start">2^1 = 2 patterns</text><text class="sub2" x="60" y="112" text-anchor="start">2 bits</text><text class="sub2" x="150" y="112" text-anchor="start">2^2 = 4 patterns</text><text class="sub2" x="60" y="142" text-anchor="start">4 bits</text><text class="sub2" x="150" y="142" text-anchor="start">2^4 = 16 patterns</text><text class="sub2" x="60" y="172" text-anchor="start">8 bits</text><text class="sub2" x="150" y="172" text-anchor="start">2^8 = 256 patterns</text><text class="sub2" x="60" y="202" text-anchor="start">16 bits</text><text class="sub2" x="150" y="202" text-anchor="start">2^16 = 65,536 patterns</text><text class="hd" x="40" y="250">So a weight is stored as the nearest of them: FP16 near 0.13, to scale</text><line class="axis" x1="70" y1="336" x2="610" y2="336"/><line class="tick" x1="70.0" y1="330" x2="70.0" y2="342"/><text class="sub2" x="70.0" y="360" text-anchor="middle">0.129639</text><line class="tick" x1="178.0" y1="330" x2="178.0" y2="342"/><text class="sub2" x="178.0" y="360" text-anchor="middle">0.129761</text><line class="tick" x1="286.0" y1="330" x2="286.0" y2="342"/><text class="sub2" x="286.0" y="360" text-anchor="middle">0.129883</text><line class="tick" x1="394.0" y1="330" x2="394.0" y2="342"/><text class="sub2" x="394.0" y="360" text-anchor="middle">0.130005</text><line class="tick" x1="502.0" y1="330" x2="502.0" y2="342"/><text class="sub2" x="502.0" y="360" text-anchor="middle">0.130127</text><line class="tick" x1="610.0" y1="330" x2="610.0" y2="342"/><text class="sub2" x="610.0" y="360" text-anchor="middle">0.130249</text><line class="mark" x1="389.7" y1="292" x2="389.7" y2="334"/><text class="sub2" x="383.7" y="286" text-anchor="end">0.13, as training left it</text><circle cx="394.0" cy="336" r="4.5" fill="var(--m-fill)" stroke="var(--m)" stroke-width="1.5"/><text class="sub2" x="402.0" y="286" text-anchor="start">stored as 0.1300049</text><text class="sub2" x="232.0" y="380" text-anchor="middle">neighbours are 2^−13 = 0.000122 apart</text><text class="cap" x="40" y="420" text-anchor="start">Every extra bit doubles the number of patterns, so 16 bits give 256 × 256 = 65,536. A</text><text class="cap" x="40" y="440" text-anchor="start">weight stored in 16 bits can be only one of those 65,536 values.</text><text class="cap" x="40" y="480" text-anchor="start">The formats used for weights spread their values unevenly: crowded near zero, where most</text><text class="cap" x="40" y="500" text-anchor="start">weights sit, and sparse far from it. They work like scientific notation in base two</text><text class="cap" x="40" y="520" text-anchor="start">({{fig:v04-o006}}). In FP16, a common 16-bit format, neighbouring values near 0.13 are</text><text class="cap" x="40" y="540" text-anchor="start">2^−13 apart.</text><text class="cap" x="40" y="580" text-anchor="start">So a weight that training left at 0.13 is stored as the nearest one, 0.1300049: an error</text><text class="cap" x="40" y="600" text-anchor="start">of 4.9 millionths. The model this atlas follows uses BF16, a 16-bit format whose values</text><text class="cap" x="40" y="620" text-anchor="start">near 0.13 are eight times farther apart, so it would store 0.1298828; it gives up</text><text class="cap" x="40" y="640" text-anchor="start">precision to reach much larger and smaller numbers ({{fig:v04-o030}}).</text></svg><figcaption>Two bytes per weight is a budget of 65,536 numbers. Every weight is rounded to one of them, and the fourth video in the series is about how far that budget can be cut.</figcaption></figure>
