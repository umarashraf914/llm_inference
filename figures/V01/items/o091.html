<figure><div class='ts'>Fig 91 &nbsp;&middot;&nbsp; 7:15</div><h3>A layer does two things</h3><svg viewBox="0 0 680 338" role="img"><title>A layer does two things</title><g class="u"><rect x="40" y="40" width="600" height="220" rx="14"></rect><text class="lbl" x="62" y="66">One transformer layer</text></g><g class="s"><rect x="70" y="96" width="250" height="66" rx="8"></rect><text class="lbl" x="195.0" y="120.0" text-anchor="middle" dominant-baseline="central">Attention</text><text class="sub" x="195.0" y="138.0" text-anchor="middle" dominant-baseline="central">moves information between tokens</text></g><line class="conn" x1="330" y1="129" x2="358" y2="129" marker-end="url(#arw)"></line><g class="m"><rect x="366" y="96" width="250" height="66" rx="8"></rect><text class="lbl" x="491.0" y="120.0" text-anchor="middle" dominant-baseline="central">Feed-forward network</text><text class="sub" x="491.0" y="138.0" text-anchor="middle" dominant-baseline="central">transforms each token alone</text></g><text class="sub2" x="70" y="196" text-anchor="start">attention is the only place where one token's representation can affect another's</text><text class="sub2" x="70" y="222" text-anchor="start">the feed-forward step treats every position independently</text><text class="cap" x="40" y="296" text-anchor="start">A modern large model stacks 60 to over 100 of these. The output of one layer is the input to</text><text class="cap" x="40" y="316" text-anchor="start">the next, and every layer has its own separate set of weights.</text></svg><figcaption>The division of labour is worth holding: one operation mixes across positions, the other does not. Nearly every optimisation later treats them separately.</figcaption></figure>
