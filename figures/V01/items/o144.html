<figure><div class='ts'>Fig 144 &nbsp;&middot;&nbsp; 27:40</div><h3>Two metrics, two different levers</h3><svg viewBox="0 0 680 232" role="img"><title>Two metrics, two different levers</title><g class="m"><rect x="50" y="55" width="265" height="76" rx="8"></rect><text class="lbl" x="182.5" y="76.0" text-anchor="middle" dominant-baseline="central">Improving TTFT</text><text class="sub" x="182.5" y="94.0" text-anchor="middle" dominant-baseline="central">is a compute problem:</text><text class="sub" x="182.5" y="111.0" text-anchor="middle" dominant-baseline="central">keep the arithmetic units fed</text></g><g class="h"><rect x="365" y="55" width="265" height="76" rx="8"></rect><text class="lbl" x="497.5" y="76.0" text-anchor="middle" dominant-baseline="central">Improving TPOT</text><text class="sub" x="497.5" y="94.0" text-anchor="middle" dominant-baseline="central">is a bandwidth problem:</text><text class="sub" x="497.5" y="111.0" text-anchor="middle" dominant-baseline="central">move fewer bytes per token</text></g><text class="cap" x="40" y="178" text-anchor="start">Different bottlenecks, different engineering. A change that helps one may do nothing at all</text><text class="cap" x="40" y="198" text-anchor="start">for the other, and occasionally makes it worse.</text></svg><figcaption>This is why serving systems eventually separate the two phases onto different hardware entirely.</figcaption></figure>
