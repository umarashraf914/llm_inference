ext><text class="sub2" x="400" y="112" text-anchor="start">−2</text><text class="sub2" x="470" y="112" text-anchor="start">0</text><text class="sub2" x="550" y="112" text-anchor="start">−0.238</text><text class="sub2" x="400" y="138" text-anchor="start">−1</text><text class="sub2" x="470" y="138" text-anchor="start">0</text><text class="sub2" x="550" y="138" text-anchor="start">−0.269</text><text class="sub2" x="400" y="164" text-anchor="start">0</text><text class="sub2" x="470" y="164" text-anchor="start">0</text><text class="sub2" x="550" y="164" text-anchor="start">0.000</text><text class="sub2" x="400" y="190" text-anchor="start">1</text><text class="sub2" x="470" y="190" text-anchor="start">1</text><text class="sub2" x="550" y="190" text-anchor="start">0.731</text><text class="sub2" x="400" y="216" text-anchor="start">2</text><text class="sub2" x="470" y="216" text-anchor="start">2</text><text class="sub2" x="550" y="216" text-anchor="start">1.762</text><text class="cap" x="40" y="370" text-anchor="start">The bend is applied to each of the 28,672 numbers on its own: no number affects another,</text><text class="cap" x="40" y="390" text-anchor="start">and the bend has no weights. ReLU keeps a positive number as it is and replaces a</text><text class="cap" x="40" y="410" text-anchor="start">negative one with zero.</text><text class="cap" x="40" y="450" text-anchor="start">SiLU is a smoothed version: near zero for large negative numbers, near x itself for</text><text class="cap" x="40" y="470" text-anchor="start">large positive ones, with a small dip below zero in between; at −1 it gives −1 ÷ (1 + e)</text><text class="cap" x="40" y="490" text-anchor="start">= −0.269. The model this atlas follows uses SiLU.</text></svg><figcaption>Cheap to compute and free of weights, so it costs nothing in memory traffic. Its whole job is to stop the two matrices around it from collapsing into one.</figcaption></figure>
