<figure><div class='ts'>Fig 71 &nbsp;&middot;&nbsp; 3:51</div><h3>The arithmetic and the numbers are in different places</h3><svg viewBox="0 0 680 342" role="img"><title>The arithmetic and the numbers are in different places</title><g class="m"><rect x="40" y="40" width="285" height="150" rx="14"></rect><text class="lbl" x="62" y="66">The chip</text></g><g class="m"><rect x="62" y="96" width="240" height="34" rx="4"></rect><text class="sub" x="182.0" y="113.0" text-anchor="middle" dominant-baseline="central">does the arithmetic</text></g><g class="u"><rect x="62" y="142" width="240" height="34" rx="4"></rect><text class="sub" x="182.0" y="159.0" text-anchor="middle" dominant-baseline="central">holds almost nothing</text></g><g class="h"><rect x="368" y="40" width="272" height="150" rx="14"></rect><text class="lbl" x="390" y="66">The memory</text></g><g class="h"><rect x="390" y="96" width="228" height="34" rx="4"></rect><text class="sub" x="504.0" y="113.0" text-anchor="middle" dominant-baseline="central">holds all 70 billion weights</text></g><g class="u"><rect x="390" y="142" width="228" height="34" rx="4"></rect><text class="sub" x="504.0" y="159.0" text-anchor="middle" dominant-baseline="central">does no arithmetic</text></g><line class="conn" x1="331" y1="100" x2="362" y2="100" marker-end="url(#arw)"></line><line class="conn" x1="362" y1="130" x2="331" y2="130" marker-end="url(#arw)"></line><text class="cap" x="40" y="244" text-anchor="start">These are two separate pieces of silicon with a bus between them. The weights live in the</text><text class="cap" x="40" y="264" text-anchor="start">memory. The arithmetic happens on the chip. So every weight has to travel across that bus</text><text class="cap" x="40" y="284" text-anchor="start">before it can be used.</text><text class="cap" x="40" y="320" text-anchor="start">That journey, repeated for every weight on every token, is what this video is about.</text></svg><figcaption>If they were in the same place there would be no memory wall and no need for this series.</figcaption></figure>
