<figure><div class='ts'>Fig 96 &nbsp;&middot;&nbsp; 7:15</div><h3>What a layer produces</h3><svg viewBox='0 0 680 354' role='img'><title>What a layer produces</title><g class="u"><rect x="40" y="40" width="600" height="132" rx="14"/><text class="lbl" x="62" y="66">One layer</text></g><g class="s"><rect x="66" y="96" width="130" height="46" rx="4"/><text class="sub" x="131.0" y="119.0" text-anchor="middle" dominant-baseline="central">vectors in</text></g><line class="conn" x1="202" y1="119" x2="226" y2="119" marker-end="url(#arw)"/><g class="m"><rect x="232" y="96" width="200" height="46" rx="4"/><text class="sub" x="332.0" y="119.0" text-anchor="middle" dominant-baseline="central">mix, then transform</text></g><line class="conn" x1="438" y1="119" x2="462" y2="119" marker-end="url(#arw)"/><g class="s"><rect x="468" y="96" width="146" height="46" rx="4"/><text class="sub" x="541.0" y="119.0" text-anchor="middle" dominant-baseline="central">vectors out</text></g><text class="cap" x="40" y="220" text-anchor="start">Same count, same width. A layer does not shorten or lengthen anything; it replaces each</text><text class="cap" x="40" y="240" text-anchor="start">token's vector with a better one.</text><text class="cap" x="40" y="276" text-anchor="start">Better means carrying more of what the surrounding text implies. The first layers pick up</text><text class="cap" x="40" y="296" text-anchor="start">local patterns, and the later ones work with what the earlier ones produced.</text><text class="cap" x="40" y="332" text-anchor="start">Because input and output have the same shape, layers can simply be stacked.</text></svg><figcaption>The shape-preserving property is what makes depth possible at all. Eighty layers is eighty rounds of the same refinement.</figcaption></figure>
