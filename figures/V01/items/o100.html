<figure><div class='ts'>Fig 100 &nbsp;&middot;&nbsp; 7:15</div><h3>How many of these there are</h3><svg viewBox='0 0 680 458' role='img'><title>How many of these there are</title><text class="hd" x="40" y="46">Counting the attention matrices in one model</text><text class="cap" x="40" y="96" text-anchor="start">W_Q</text><g class="m"><rect x="180" y="78" width="280" height="30" rx="3"/><text class="sub" x="320.0" y="93.0" text-anchor="middle" dominant-baseline="central">80 of them, one per layer</text></g><text class="cap" x="40" y="140" text-anchor="start">W_K</text><g class="m"><rect x="180" y="122" width="280" height="30" rx="3"/><text class="sub" x="320.0" y="137.0" text-anchor="middle" dominant-baseline="central">80 of them, one per layer</text></g><text class="cap" x="40" y="184" text-anchor="start">W_V</text><g class="m"><rect x="180" y="166" width="280" height="30" rx="3"/><text class="sub" x="320.0" y="181.0" text-anchor="middle" dominant-baseline="central">80 of them, one per layer</text></g><text class="cap" x="40" y="228" text-anchor="start">W_O</text><g class="u"><rect x="180" y="210" width="280" height="30" rx="3"/><text class="sub" x="320.0" y="225.0" text-anchor="middle" dominant-baseline="central">80 of them, one per layer</text></g><line class="axis" x1="40" y1="254" x2="640" y2="254"/><text class="sub2" x="40" y="282" text-anchor="start">total</text><g class="h"><rect x="180" y="266" width="280" height="30" rx="3"/><text class="sub" x="320.0" y="281.0" text-anchor="middle" dominant-baseline="central">320 attention weight matrices</text></g><text class="cap" x="40" y="344" text-anchor="start">Plus the feed-forward matrices, three more per layer, which is another 240.</text><text class="cap" x="40" y="380" text-anchor="start">None of them is shared between layers. That is why a model's parameter count grows in direct</text><text class="cap" x="40" y="400" text-anchor="start">proportion to its depth.</text><text class="cap" x="40" y="436" text-anchor="start">And it is why reading the weights once per token means reading all 560 of these, every token.</text></svg><figcaption>The number that makes depth expensive. Eighty layers is not eighty repetitions of the same work; it is eighty different sets of weights to fetch.</figcaption></figure>
