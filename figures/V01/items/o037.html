<figure><div class='ts'>Fig 37 &nbsp;&middot;&nbsp; 0:46</div><h3>The projection is fixed, so where does the dependence come from?</h3><svg viewBox='0 0 680 430' role='img'><title>The projection is fixed, so where does the dependence come from?</title><g class="m"><rect x="90" y="46" width="500" height="42" rx="6"/><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">key  =  that token's vector  x  W_K</text></g><text class="cap" x="40" y="122" text-anchor="start">W_K is fixed the moment training ends. It is the same matrix for every token, every position,</text><text class="cap" x="40" y="142" text-anchor="start">every conversation and every user, forever.</text><text class="cap" x="40" y="178" text-anchor="start">So the projection really is independent of context. Nothing about it changes because a</text><text class="cap" x="40" y="198" text-anchor="start">different word appeared earlier.</text><text class="hd" x="40" y="248">Which makes the obvious question a good one</text><g class="u"><rect x="90" y="268" width="500" height="40" rx="6"/><text class="sub" x="340.0" y="288.0" text-anchor="middle" dominant-baseline="central">if the matrix is fixed, how can the key depend on earlier tokens?</text></g><text class="cap" x="40" y="352" text-anchor="start">The answer is not in the matrix. It is in what gets multiplied by it.</text><text class="cap" x="40" y="388" text-anchor="start">A fixed function of a changing input is a changing output. The next figures are about what that</text><text class="cap" x="40" y="408" text-anchor="start">input actually is at each layer.</text></svg><figcaption>A reasonable objection, and the answer turns entirely on one thing: which vector is being fed into the fixed matrix.</figcaption></figure>
