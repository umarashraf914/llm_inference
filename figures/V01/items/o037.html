<figure><div class='ts'>Fig 37 &nbsp;&middot;&nbsp; 25:43</div><h3>The projection is fixed, so where does the dependence come from?</h3><svg viewBox='0 0 680 478' role='img'><title>The projection is fixed, so where does the dependence come from?</title><g class="m"><rect x="90" y="46" width="500" height="42" rx="6"/><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">key  =  that token's vector  ×  W_K</text></g><text class="cap" x="40" y="122" text-anchor="start">Each layer's W_K is fixed the moment training ends ({{fig:v01-o098}}). It is the same</text><text class="cap" x="40" y="142" text-anchor="start">matrix for every token, every position, every conversation and every user, forever.</text><text class="cap" x="40" y="182" text-anchor="start">So the projection itself is independent of context: nothing about it changes because a</text><text class="cap" x="40" y="202" text-anchor="start">different word appeared earlier.</text><text class="hd" x="40" y="252">The question that decides what a server can reuse</text><g class="u"><rect x="90" y="272" width="500" height="40" rx="6"/><text class="sub" x="340.0" y="292" text-anchor="middle" dominant-baseline="central">is a token's key at one layer the same in every sentence?</text></g><text class="cap" x="40" y="356" text-anchor="start">If it were, the keys worked out for France in one conversation could be reused for</text><text class="cap" x="40" y="376" text-anchor="start">France in any other, wherever it appeared.</text><text class="cap" x="40" y="416" text-anchor="start">The answer is not in the matrix but in what gets multiplied by it: a fixed function of a</text><text class="cap" x="40" y="436" text-anchor="start">changing input is a changing output. The next figures follow that input up through the</text><text class="cap" x="40" y="456" text-anchor="start">layers.</text></svg><figcaption>Part 11 showed that a token's key differs from layer to layer ({{ref:v01-o138}}). The question here is whether, at one layer, it differs from sentence to sentence, and the answer turns on which vector is fed into the fixed matrix.</figcaption></figure>
