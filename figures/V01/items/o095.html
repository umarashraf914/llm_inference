<figure><div class='ts'>Fig 95 &nbsp;&middot;&nbsp; 8:00</div><h3>What context means</h3><svg viewBox='0 0 680 302' role='img'><title>What context means</title><text class="hd" x="40" y="46">Context is everything the model can see right now</text><g class="s"><rect x="40" y="70" width="420" height="34" rx="4"/><text class="sub" x="250.0" y="87.0" text-anchor="middle" dominant-baseline="central">the conversation so far</text></g><g class="m"><rect x="468" y="70" width="172" height="34" rx="4"/><text class="sub" x="554.0" y="87.0" text-anchor="middle" dominant-baseline="central">the newest token</text></g><text class="cap" x="40" y="148" text-anchor="start">A token's meaning depends on what came before it. The word bank means one thing after river</text><text class="cap" x="40" y="168" text-anchor="start">and another after savings, and attention is how that dependence is computed.</text><text class="cap" x="40" y="204" text-anchor="start">Context length is how many tokens the model can attend over. Beyond that limit the earliest</text><text class="cap" x="40" y="224" text-anchor="start">tokens fall out and cannot influence anything.</text><text class="cap" x="40" y="260" text-anchor="start">Every token in the context has to be looked at for every new token produced. That is why a long</text><text class="cap" x="40" y="280" text-anchor="start">conversation is not just a longer input; it is more work per token.</text></svg><figcaption>The last line is the one that matters later. Context length is not a storage limit, it is a recurring cost.</figcaption></figure>
