<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:21</div><h3>What a request carries before the user types a word</h3><svg viewBox='0 0 680 532' role='img'><title>What a request carries before the user types a word</title><text class="hd" x="40" y="46">What sits in front of the user's first word, and who put it there</text><text class="cap" x="40" y="90" text-anchor="start">the provider's system prompt</text><g class="m"><rect x="260" y="70" width="160.0" height="30" rx="3"/></g><text class="sub2" x="430.0" y="90" text-anchor="start">2,000 tokens</text><text class="cap" x="40" y="136" text-anchor="start">the user's custom instructions</text><g class="s"><rect x="260" y="116" width="24.0" height="30" rx="3"/></g><text class="sub2" x="294.0" y="136" text-anchor="start">300 tokens</text><text class="cap" x="40" y="182" text-anchor="start">tool descriptions</text><g class="s"><rect x="260" y="162" width="36.0" height="30" rx="3"/></g><text class="sub2" x="306.0" y="182" text-anchor="start">450 tokens</text><text class="cap" x="40" y="228" text-anchor="start">one loaded skill</text><g class="s"><rect x="260" y="208" width="160.0" height="30" rx="3"/></g><text class="sub2" x="430.0" y="228" text-anchor="start">2,000 tokens</text><line class="axis" x1="40" y1="258" x2="640" y2="258"/><text class="cap" x="40" y="290" text-anchor="start">together</text><g class="h"><rect x="260" y="270" width="380.0" height="30" rx="3"/><text class="sub" x="450.0" y="285.0" text-anchor="middle" dominant-baseline="central">4,750 tokens</text></g><text class="cap" x="40" y="346" text-anchor="start">None of it was written by the user, and all of it counts against the context window and</text><text class="cap" x="40" y="366" text-anchor="start">the bill on every single turn.</text><text class="cap" x="40" y="406" text-anchor="start">Where it was stored changes who transmits it. It does not change that the model has to</text><text class="cap" x="40" y="426" text-anchor="start">read every one of these tokens before it writes the first word of an answer, on every</text><text class="cap" x="40" y="446" text-anchor="start">turn.</text><text class="cap" x="40" y="486" text-anchor="start">Figures are illustrative; the bars are drawn to one scale. The shape is not</text><text class="cap" x="40" y="506" text-anchor="start">illustrative: the preamble is usually far larger than anything the user types.</text></svg><figcaption>Where the text is stored is invisible to the user. Its token count is not, and the preamble is almost always the largest thing in the request.</figcaption></figure>
