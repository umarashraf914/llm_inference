<figure><div class='ts'>Fig 27 &nbsp;&middot;&nbsp; 0:21</div><h3>What you pay for before you type</h3><svg viewBox='0 0 680 506' role='img'><title>What you pay for before you type</title><text class="hd" x="40" y="46">What sits in front of your first word, and who put it there</text><text class="cap" x="40" y="96" text-anchor="start">provider's system prompt</text><g class="m"><rect x="260" y="78" width="180.0" height="30" rx="3"/></g><text class="sub2" x="452.0" y="96" text-anchor="start">2,000 tokens</text><text class="cap" x="40" y="142" text-anchor="start">your custom instructions</text><g class="s"><rect x="260" y="124" width="27.0" height="30" rx="3"/></g><text class="sub2" x="299.0" y="142" text-anchor="start">300 tokens</text><text class="cap" x="40" y="188" text-anchor="start">tool definitions</text><g class="s"><rect x="260" y="170" width="40.5" height="30" rx="3"/></g><text class="sub2" x="312.5" y="188" text-anchor="start">450 tokens</text><text class="cap" x="40" y="234" text-anchor="start">one loaded skill</text><g class="s"><rect x="260" y="216" width="180.0" height="30" rx="3"/></g><text class="sub2" x="452.0" y="234" text-anchor="start">2,000 tokens</text><line class="axis" x1="40" y1="266" x2="640" y2="266"/><text class="sub2" x="40" y="298" text-anchor="start">total</text><g class="h"><rect x="260" y="278" width="402.32" height="30" rx="3"/><text class="sub" x="461.15999999999997" y="293.0" text-anchor="middle" dominant-baseline="central">4,750 tokens</text></g><text class="cap" x="40" y="352" text-anchor="start">None of it was written by you, and all of it counts against your window and your bill on every</text><text class="cap" x="40" y="372" text-anchor="start">single turn.</text><text class="cap" x="40" y="408" text-anchor="start">Where it was stored changes who transmits it. It does not change that you are paying to have it</text><text class="cap" x="40" y="428" text-anchor="start">prefilled and attended over, every time.</text><text class="cap" x="40" y="464" text-anchor="start">Figures are illustrative. The shape is not: the preamble is usually far larger than anything</text><text class="cap" x="40" y="484" text-anchor="start">the user types.</text></svg><figcaption>Storage location is invisible to you. Token count is not, and the preamble is almost always the largest thing in the request.</figcaption></figure>
