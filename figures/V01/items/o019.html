rect x="388" y="104" width="32" height="28" rx="3"/></g><g class="s"><rect x="426" y="104" width="32" height="28" rx="3"/></g><g class="s"><rect x="464" y="104" width="32" height="28" rx="3"/></g><g class="s"><rect x="502" y="104" width="32" height="28" rx="3"/></g><g class="s"><rect x="540" y="104" width="32" height="28" rx="3"/></g><g class="s"><rect x="578" y="104" width="32" height="28" rx="3"/></g><g class="s"><rect x="616" y="104" width="32" height="28" rx="3"/></g><g class="s"><rect x="46" y="138" width="32" height="28" rx="3"/></g><g class="s"><rect x="84" y="138" width="32" height="28" rx="3"/></g><g class="s"><rect x="122" y="138" width="32" height="28" rx="3"/></g><g class="s"><rect x="160" y="138" width="32" height="28" rx="3"/></g><g class="s"><rect x="198" y="138" width="32" height="28" rx="3"/></g><g class="s"><rect x="236" y="138" width="32" height="28" rx="3"/></g><g class="s"><rect x="274" y="138" width="32" height="28" rx="3"/></g><g class="s"><rect x="312" y="138" width="32" height="28" rx="3"/></g><g class="s"><rect x="350" y="138" width="32" height="28" rx="3"/></g><g class="s"><rect x="388" y="138" width="32" height="28" rx="3"/></g><g class="s"><rect x="426" y="138" width="32" height="28" rx="3"/></g><g class="s"><rect x="464" y="138" width="32" height="28" rx="3"/></g><g class="s"><rect x="502" y="138" width="32" height="28" rx="3"/></g><g class="s"><rect x="540" y="138" width="32" height="28" rx="3"/></g><g class="s"><rect x="578" y="138" width="32" height="28" rx="3"/></g><g class="s"><rect x="616" y="138" width="32" height="28" rx="3"/></g><line class="conn" x1="340" y1="178" x2="340" y2="202" marker-end="url(#arw)"/><g class="h"><rect x="240" y="206" width="200" height="40" rx="4"/><text class="sub" x="340.0" y="226.0" text-anchor="middle" dominant-baseline="central">one set of machines</text></g><text class="cap" x="40" y="296" text-anchor="start">Not one user waiting politely. Thousands of separate conversations arriving at</text><text class="cap" x="40" y="316" text-anchor="start">unpredictable moments, all needing the same machines.</text><text class="cap" x="40" y="356" text-anchor="start">That crowd turns out to be the thing that makes the economics work, for reasons most of</text><text class="cap" x="40" y="376" text-anchor="start">this series is about.</text><text class="cap" x="40" y="416" text-anchor="start">It also means one slow request delays other people, which is why the last measurement in</text><text class="cap" x="40" y="436" text-anchor="start">this atlas counts only the tokens delivered within their time limit ({{fig:v01-o145}}).</text></svg><figcaption>The word production is doing real work in this series. It means shared, concurrent and paid for, which is a different problem from running a model once on your own machine.</figcaption></figure>
