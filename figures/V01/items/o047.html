<figure><div class='ts'>Fig 47 &nbsp;&middot;&nbsp; 25:43</div><h3>What warm and cold actually mean</h3><svg viewBox='0 0 680 452' role='img'><title>What warm and cold actually mean</title><text class="hd" x="40" y="46">The same question, two states of the cache</text><text class="cap" x="40" y="92" text-anchor="start">Warm, a minute later</text><text class="sub2" x="40" y="112" text-anchor="start">906 of 911 already held</text><g class="s"><rect x="300" y="76" width="4" height="30" rx="1"/></g><text class="sub2" x="316" y="96" text-anchor="start">prefill 5 tokens</text><text class="cap" x="40" y="172" text-anchor="start">Cold, a day later</text><text class="sub2" x="40" y="192" text-anchor="start">0 of 1,032 held</text><g class="h"><rect x="300" y="156" width="320" height="30" rx="3"/><text class="sub" x="460.0" y="171.0" text-anchor="middle" dominant-baseline="central">prefill 1,032 tokens</text></g><g class="u"><rect x="190" y="214" width="300" height="42" rx="6"/><text class="sub" x="340.0" y="235.0" text-anchor="middle" dominant-baseline="central">206 times the work</text></g><text class="cap" x="40" y="298" text-anchor="start">Identical question, identical model, identical hardware. The only difference is whether the</text><text class="cap" x="40" y="318" text-anchor="start">blocks from last time are still resident.</text><text class="cap" x="40" y="354" text-anchor="start">Warm means they are. Cold means they were evicted to make room for somebody else, and the keys</text><text class="cap" x="40" y="374" text-anchor="start">and values stopped existing.</text><text class="cap" x="40" y="410" text-anchor="start">The text survived in a database. Keys and values are not text; they are the model's processed</text><text class="cap" x="40" y="430" text-anchor="start">form of it, and rebuilding them is exactly what prefill does.</text></svg><figcaption>Not a vague sense of readiness. It is a precise question with a number attached: how many of the arriving tokens already have keys and values on this machine.</figcaption></figure>
