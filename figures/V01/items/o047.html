<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 25:43</div><h3>What warm and cold actually mean</h3><svg viewBox='0 0 680 520' role='img'><title>What warm and cold actually mean</title><text class="hd" x="40" y="46">The same follow-up question, two states of the cache</text><text class="cap" x="40" y="92" text-anchor="start">Warm, a minute later</text><text class="sub2" x="40" y="112" text-anchor="start">784 of 788 already held</text><g class="s"><rect x="300" y="76" width="1.62" height="30" rx="0.5"/></g><text class="sub2" x="312" y="96" text-anchor="start">prefill 4 tokens</text><text class="cap" x="40" y="172" text-anchor="start">Cold: none of it held</text><text class="sub2" x="40" y="192" text-anchor="start">0 of 788 on this machine</text><g class="h"><rect x="300" y="156" width="320" height="30" rx="3"/><text class="sub" x="460.0" y="171.0" text-anchor="middle" dominant-baseline="central">prefill 788 tokens</text></g><g class="u"><rect x="190" y="214" width="300" height="42" rx="6"/><text class="sub" x="340.0" y="235.0" text-anchor="middle" dominant-baseline="central">197 times the work</text></g><text class="cap" x="40" y="298" text-anchor="start">The conversation this part follows: a 770-token preamble of system prompt and tool</text><text class="cap" x="40" y="318" text-anchor="start">descriptions, a 7-token question and its 7-token answer, then a 4-token follow-up, 788</text><text class="cap" x="40" y="338" text-anchor="start">tokens in all.</text><text class="cap" x="40" y="378" text-anchor="start">Identical question, identical model, identical hardware. The only difference is whether</text><text class="cap" x="40" y="398" text-anchor="start">the keys and values from last time are still held on this machine.</text><text class="cap" x="40" y="438" text-anchor="start">Warm means they are. Cold means they were evicted to make room for somebody else's, or</text><text class="cap" x="40" y="458" text-anchor="start">the request landed on a machine that never had them. The text survives either way; the</text><text class="cap" x="40" y="478" text-anchor="start">keys and values are the model's processed form of it ({{fig:v01-o034}}), and rebuilding</text><text class="cap" x="40" y="498" text-anchor="start">them is exactly what prefill does.</text></svg><figcaption>Not a vague sense of readiness but a count: how many of the arriving tokens already have keys and values on this machine. Bars to scale. The companion animation, <a class='xref' href='V01_The_Memory_Wall_animation.html'>One conversation, end to end</a>, plays a longer conversation through these states step by step.</figcaption></figure>
