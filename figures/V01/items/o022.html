<figure><div class='ts'>Fig 22 &nbsp;&middot;&nbsp; 0:21</div><h3>Two questions that get confused</h3><svg viewBox='0 0 680 450' role='img'><title>Two questions that get confused</title><g class="s"><rect x="40" y="74" width="285" height="90" rx="8"/><text class="lbl" x="182.5" y="102.0" text-anchor="middle" dominant-baseline="central">Does it reach the context?</text><text class="sub" x="182.5" y="120.0" text-anchor="middle" dominant-baseline="central">Always yes, every turn,</text><text class="sub" x="182.5" y="137.0" text-anchor="middle" dominant-baseline="central">for every one of these</text></g><g class="m"><rect x="355" y="74" width="285" height="90" rx="8"/><text class="lbl" x="497.5" y="102.0" text-anchor="middle" dominant-baseline="central">Does it cross the network</text><text class="sub" x="497.5" y="120.0" text-anchor="middle" dominant-baseline="central">from the user's device?</text><text class="sub" x="497.5" y="137.0" text-anchor="middle" dominant-baseline="central">That varies</text></g><text class="cap" x="40" y="208" text-anchor="start">These get treated as one question and they are not. The first is forced by the</text><text class="cap" x="40" y="228" text-anchor="start">architecture. The second is a product decision about where the text is stored.</text><text class="cap" x="40" y="268" text-anchor="start">A system prompt held by the provider never travels from the user's machine. A system</text><text class="cap" x="40" y="288" text-anchor="start">prompt written by a developer using the provider's programming interface travels with</text><text class="cap" x="40" y="308" text-anchor="start">every call they make.</text><text class="cap" x="40" y="348" text-anchor="start">Either way it ends up in the same place, occupying the same tokens and costing the model</text><text class="cap" x="40" y="368" text-anchor="start">the same work before it can start an answer.</text><text class="cap" x="40" y="408" text-anchor="start">The rest of this part is about the second question only, because the first has no</text><text class="cap" x="40" y="428" text-anchor="start">exceptions.</text></svg><figcaption>Where something is stored and where it ends up are different. Only the storage varies; the destination never does.</figcaption></figure>
