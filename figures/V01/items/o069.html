<figure><div class='ts'>Fig 69 &nbsp;&middot;&nbsp; 3:25</div><h3>The same gap, as a percentage</h3><svg viewBox='0 0 680 358' role='img'><title>The same gap, as a percentage</title><text class="hd" x="40" y="46">The same gap, as a percentage</text><g class="m"><rect x="40" y="70" width="2" height="44" rx="1"/></g><g class="h"><rect x="44" y="70" width="596" height="44" rx="4"/><text class="sub" x="342.0" y="92.0" text-anchor="middle" dominant-baseline="central">everything that is not arithmetic</text></g><text class="sub2" x="40" y="138" text-anchor="start">0.33%</text><g class="u"><rect x="140" y="176" width="400" height="42" rx="6"/><text class="sub" x="340.0" y="197.0" text-anchor="middle" dominant-baseline="central">0.1 / 30  =  0.0033  =  0.33 percent</text></g><text class="cap" x="40" y="260" text-anchor="start">A percentage is just a fraction written out of a hundred. A third of one percent is the</text><text class="cap" x="40" y="280" text-anchor="start">sliver at the left edge, and it is the only part of the bar doing mathematics.</text><text class="cap" x="40" y="316" text-anchor="start">The video says under one percent. The exact figure depends on the model and the chip, but the</text><text class="cap" x="40" y="336" text-anchor="start">order of magnitude is not in doubt.</text></svg><figcaption>Two ways of saying one thing, because a ratio and a percentage land differently on different readers.</figcaption></figure>
