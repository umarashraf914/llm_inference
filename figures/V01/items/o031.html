<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:21</div><h3>How little actually crosses the network</h3><svg viewBox='0 0 680 438' role='img'><title>How little actually crosses the network</title><text class="hd" x="40" y="46">Bytes on the wire for one 500-token answer, drawn to scale</text><text class="cap" x="40" y="90" text-anchor="start">Up, once</text><g class="s"><rect x="200" y="70" width="65.5" height="30" rx="3"/></g><text class="sub2" x="275.5" y="90" text-anchor="start">about 4 KB: the whole prompt</text><text class="cap" x="40" y="136" text-anchor="start">Down, as it answers</text><g class="s"><rect x="200" y="116" width="360.0" height="30" rx="3"/><text class="sub" x="380.0" y="131.0" text-anchor="middle" dominant-baseline="central">about 22 KB: 500 small messages</text></g><text class="cap" x="40" y="182" text-anchor="start">Up, while it answers</text><g class="u"><rect x="200" y="162" width="2" height="30" rx="3"/></g><text class="sub2" x="212" y="182" text-anchor="start">nothing at all</text><text class="cap" x="40" y="232" text-anchor="start">A byte is the space one character of plain text takes in a computer ({{fig:v01-o073}} builds</text><text class="cap" x="40" y="252" text-anchor="start">it from bits), and a kilobyte, KB, is a thousand bytes ({{fig:v01-p05}} lists the prefixes).</text><text class="cap" x="40" y="272" text-anchor="start">A whole turn crosses the network in a few tens of kilobytes.</text><text class="cap" x="40" y="312" text-anchor="start">Inside the machine the same answer reads the model's weights once per token. The weights</text><text class="cap" x="40" y="332" text-anchor="start">take 140 billion bytes, so 500 tokens read 70 million million bytes, 70 terabytes: about</text><text class="cap" x="40" y="352" text-anchor="start">2.7 billion times the 26 KB that crossed the network.</text><text class="cap" x="40" y="392" text-anchor="start">Message sizes depend on the format, so treat the kilobytes as typical rather than</text><text class="cap" x="40" y="412" text-anchor="start">measured. At ten times these sizes the gap would still be hundreds of millions to one.</text></svg><figcaption>About 2.7 billion to one, more than nine powers of ten. The slowness a user feels has nothing to do with the connection, and blaming the network for a slow answer is almost always wrong.</figcaption></figure>
