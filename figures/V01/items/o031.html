<figure><div class='ts'>Fig 31 &nbsp;&middot;&nbsp; 0:46</div><h3>How little actually crosses the network</h3><svg viewBox='0 0 680 406' role='img'><title>How little actually crosses the network</title><text class="hd" x="40" y="46">Bytes on the wire, for one full turn</text><text class="cap" x="40" y="92" text-anchor="start">Up, once</text><g class="s"><rect x="280" y="76" width="60" height="30" rx="3"/></g><text class="sub2" x="352" y="96" text-anchor="start">about 4 KB of prompt</text><text class="cap" x="40" y="152" text-anchor="start">Down, 500 frames</text><g class="h"><rect x="280" y="136" width="330" height="30" rx="3"/><text class="sub" x="445.0" y="151.0" text-anchor="middle" dominant-baseline="central">about 22 KB in total</text></g><text class="cap" x="40" y="212" text-anchor="start">Up, during generation</text><g class="u"><rect x="280" y="196" width="3" height="30" rx="1"/></g><text class="sub2" x="294" y="216" text-anchor="start">nothing at all</text><text class="cap" x="40" y="272" text-anchor="start">Tiny amounts, both ways. The network was never the constraint; it carries a few kilobytes</text><text class="cap" x="40" y="292" text-anchor="start">while the server moves terabytes internally.</text><text class="cap" x="40" y="328" text-anchor="start">That contrast is worth holding. A 500-token answer costs about 22 kilobytes of network and</text><text class="cap" x="40" y="348" text-anchor="start">about 70 terabytes of memory traffic inside the machine.</text><text class="cap" x="40" y="384" text-anchor="start">The slowness you feel has nothing to do with your connection.</text></svg><figcaption>Two numbers seven orders of magnitude apart. Blaming the network for a slow answer is almost always wrong.</figcaption></figure>
