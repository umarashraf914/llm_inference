<figure><div class='ts'>Fig 88 &nbsp;&middot;&nbsp; 6:29</div><h3>Written as a multiply, never done as one</h3><svg viewBox="0 0 680 460" role="img"><title>Written as a multiply, never done as one</title><text class="hd" x="40" y="46">Textbooks write it as a matrix multiply</text><g class="u"><rect x="40" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="53.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="70" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="83.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="100" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="113.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="130" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="143.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="160" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="173.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="190" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="203.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="220" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="233.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="m"><rect x="250" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="263.0" y="85.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="280" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="293.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="310" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="323.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="340" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="353.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="370" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="383.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="400" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="413.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="430" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="443.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="460" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="473.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="490" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="503.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="520" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="533.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="550" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="563.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="580" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="593.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="610" y="70" width="26" height="30" rx="3"></rect><text class="sub" x="623.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="40" y="124" text-anchor="start">a one-hot vector: 128,000 entries, exactly one of them a 1</text><g class="u"><rect x="150" y="154" width="380" height="42" rx="6"></rect><text class="sub" x="340.0" y="175.0" text-anchor="middle" dominant-baseline="central">one-hot  x  embedding table  =  row 4271</text></g><text class="cap" x="40" y="232" text-anchor="start">Which is true, and also a description nobody implements. Every entry of that vector except one</text><text class="cap" x="40" y="252" text-anchor="start">is zero, and anything multiplied by zero contributes nothing to the sum.</text><g class="h"><rect x="90" y="282" width="500" height="34" rx="4"></rect><text class="sub" x="340.0" y="299.0" text-anchor="middle" dominant-baseline="central">128,000 multiplications, 127,999 of them by zero</text></g><text class="cap" x="40" y="362" text-anchor="start">So the arithmetic is skipped entirely and the implementation indexes straight into the table.</text><text class="cap" x="40" y="382" text-anchor="start">The mathematics says multiply; the hardware does a gather.</text><text class="cap" x="40" y="418" text-anchor="start">That distinction matters for the rest of this series, because the two have completely</text><text class="cap" x="40" y="438" text-anchor="start">different costs: one is measured in operations, the other in memory accesses.</text></svg><figcaption>Worth internalising as a habit. Several things in a transformer are written as dense linear algebra and executed as something much cheaper.</figcaption></figure>
