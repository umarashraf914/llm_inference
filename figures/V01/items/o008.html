<figure><div class='ts'>Fig 08 &nbsp;&middot;&nbsp; 0:00</div><h3>What the model actually produces</h3><svg viewBox='0 0 680 420' role='img'><title>What the model actually produces</title><text class="hd" x="40" y="46">The model does not choose a word. It scores every word it knows.</text><text class="cap" x="40" y="96" text-anchor="start">cat</text><g class="m"><rect x="180" y="78" width="320" height="30" rx="3"/></g><text class="sub2" x="512" y="96" text-anchor="start">8.2</text><text class="cap" x="40" y="140" text-anchor="start">dog</text><g class="m"><rect x="180" y="122" width="275" height="30" rx="3"/></g><text class="sub2" x="467" y="140" text-anchor="start">7.1</text><text class="cap" x="40" y="184" text-anchor="start">the</text><g class="u"><rect x="180" y="166" width="135" height="30" rx="3"/></g><text class="sub2" x="327" y="184" text-anchor="start">3.5</text><text class="cap" x="40" y="228" text-anchor="start">banana</text><g class="u"><rect x="180" y="210" width="20" height="30" rx="3"/></g><text class="sub2" x="212" y="228" text-anchor="start">0.4</text><g class="u"><rect x="180" y="250" width="20" height="30" rx="2"/></g><text class="sub2" x="212" y="272" text-anchor="start">and 127,996 more, all scored</text><text class="cap" x="40" y="322" text-anchor="start">Every token in the vocabulary gets a number saying how well it would fit next. Higher means</text><text class="cap" x="40" y="342" text-anchor="start">better. These raw numbers are called scores, or logits.</text><text class="cap" x="40" y="378" text-anchor="start">The scores are illustrative; the shape is not. One or two candidates stand out and the rest</text><text class="cap" x="40" y="398" text-anchor="start">trail off to nothing.</text></svg><figcaption>The single most common misconception about language models is that they pick a word. They produce a hundred and twenty-eight thousand numbers, and something else picks.</figcaption></figure>
