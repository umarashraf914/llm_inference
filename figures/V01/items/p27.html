<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 22:52</div><h3>Without the cache, token 10,000 would take 1.4 seconds instead of 43 milliseconds</h3><svg viewBox='0 0 680 608' role='img'><title>Without the cache, token 10,000 would take 1.4 seconds instead of 43 milliseconds</title><text class="hd" x="40" y="46">Time for one token, on one H100; log scale from 10 ms to 10 s</text><line class="axis" x1="240" y1="236" x2="600.0" y2="236"/><line class="tick" x1="240.0" y1="236" x2="240.0" y2="240"/><text class="sub2" x="240.0" y="254" text-anchor="middle">10 ms</text><line class="tick" x1="360.0" y1="236" x2="360.0" y2="240"/><text class="sub2" x="360.0" y="254" text-anchor="middle">100 ms</text><line class="tick" x1="480.0" y1="236" x2="480.0" y2="240"/><text class="sub2" x="480.0" y="254" text-anchor="middle">1 s</text><line class="tick" x1="600.0" y1="236" x2="600.0" y2="240"/><text class="sub2" x="600.0" y="254" text-anchor="middle">10 s</text><text class="cap" x="40" y="89" text-anchor="start">token 1,000, no cache</text><g class="h"><rect x="240" y="70" width="138.10000000000002" height="28" rx="3"/></g><text class="sub2" x="386.1" y="89" text-anchor="start">142 ms</text><text class="cap" x="40" y="129" text-anchor="start">token 1,000, cached</text><g class="s"><rect x="240" y="110" width="74.69999999999999" height="28" rx="3"/></g><text class="sub2" x="322.7" y="129" text-anchor="start">41.9 ms</text><text class="cap" x="40" y="169" text-anchor="start">token 10,000, no cache</text><g class="h"><rect x="240" y="150" width="258.1" height="28" rx="3"/></g><text class="sub2" x="506.1" y="169" text-anchor="start">1.42 s</text><text class="cap" x="40" y="209" text-anchor="start">token 10,000, cached</text><g class="s"><rect x="240" y="190" width="75.69999999999999" height="28" rx="3"/></g><text class="sub2" x="323.7" y="209" text-anchor="start">42.8 ms</text><text class="hd" x="40" y="296">A whole 10,000-token answer, minutes, to scale</text><text class="cap" x="40" y="331" text-anchor="start">no cache</text><g class="h"><rect x="240" y="312" width="300.0" height="28" rx="3"/></g><text class="sub2" x="548.0" y="331" text-anchor="start">118 minutes</text><text class="cap" x="40" y="371" text-anchor="start">cached</text><g class="s"><rect x="240" y="352" width="17.9" height="28" rx="3"/></g><text class="sub2" x="265.9" y="371" text-anchor="start">7.0 minutes</text><text class="cap" x="40" y="422" text-anchor="start">Without the cache, token t sends all t positions through the model, and once t passes</text><text class="cap" x="40" y="442" text-anchor="start">the ridge, 295, the arithmetic outlasts the read: token 1,000 takes 142 ms and token</text><text class="cap" x="40" y="462" text-anchor="start">10,000 1.42 s. With the cache every token reads the weights once plus the kept keys and</text><text class="cap" x="40" y="482" text-anchor="start">values: 41.9 and 42.8 ms.</text><text class="cap" x="40" y="522" text-anchor="start">Over a 10,000-token answer that is 118 minutes against 7.0, 17 times as long.</text><text class="cap" x="40" y="562" text-anchor="start">Both assumptions favour the version without a cache: the recomputation is taken to run</text><text class="cap" x="40" y="582" text-anchor="start">at the chip's full peak, and attention's own work is left out. The real gap is wider.</text></svg><figcaption>The quadratic of the previous figure, in seconds. Every serving system keeps the cache because the alternative is unusable, not merely slow.</figcaption></figure>
