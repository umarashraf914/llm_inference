"middle">2022</text><polyline class="pl-m" points="100.0,316.0 142.0,293.2 184.0,270.3 226.0,247.5 268.0,224.7 310.0,201.8 352.0,179.0 394.0,156.1 436.0,133.3 478.0,110.5 520.0,87.6"/><polyline class="pl-h" points="100.0,316.0 142.0,301.2 184.0,286.5 226.0,271.7 268.0,256.9 310.0,242.2 352.0,227.4 394.0,212.6 436.0,197.9 478.0,183.1 520.0,168.3"/><text class="sub2" x="530" y="91.6" text-anchor="start">compute, ×80</text><text class="sub2" x="530" y="172.3" text-anchor="start">bandwidth, ×17</text><line class="tick" x1="526" y1="97.6" x2="526" y2="158.3"/><text class="sub2" x="534" y="131.95" text-anchor="start">gap ×4.7</text><text class="cap" x="40" y="370" text-anchor="start">On a logarithmic axis a steady yearly multiplier is a straight line, and a steeper line</text><text class="cap" x="40" y="390" text-anchor="start">is a bigger multiplier. The vertical distance between the two lines is the ratio between</text><text class="cap" x="40" y="410" text-anchor="start">them, so the widening wedge is the gap compounding.</text><text class="cap" x="40" y="450" text-anchor="start">The endpoints are the round factors quoted for top-tier server GPUs from 2012 to 2022;</text><text class="cap" x="40" y="470" text-anchor="start">the straight lines assume steady growth between them, so the middle is schematic. One</text><text class="cap" x="40" y="490" text-anchor="start">generation can be checked in NVIDIA's own tables: from the A100 (2020) to the H100</text><text class="cap" x="40" y="510" text-anchor="start">(2022), 16-bit compute rose 3.2× and bandwidth 2.2×.</text></svg><figcaption>The curves are still spreading. Each generation buys more arithmetic than bandwidth, so each one makes the memory wall a little higher.</figcaption></figure>
