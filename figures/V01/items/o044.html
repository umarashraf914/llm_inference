<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 25:43</div><h3>A cache hit is a prefix match</h3><svg viewBox='0 0 680 444' role='img'><title>A cache hit is a prefix match</title><text class="hd" x="40" y="46">The prompt that arrives, and what the server already holds</text><text class="sub2" x="40" y="92" text-anchor="start">arriving</text><g class="s"><rect x="120" y="74" width="140" height="28" rx="3"/><text class="sub" x="190.0" y="88.0" text-anchor="middle" dominant-baseline="central">system</text></g><g class="s"><rect x="262" y="74" width="196" height="28" rx="3"/><text class="sub" x="360.0" y="88.0" text-anchor="middle" dominant-baseline="central">tools</text></g><g class="s"><rect x="460" y="74" width="120" height="28" rx="3"/><text class="sub" x="520.0" y="88.0" text-anchor="middle" dominant-baseline="central">history</text></g><g class="h"><rect x="582" y="74" width="58" height="28" rx="3"/><text class="sub" x="611.0" y="88.0" text-anchor="middle" dominant-baseline="central">new</text></g><text class="sub2" x="40" y="152" text-anchor="start">cached</text><g class="s"><rect x="120" y="134" width="140" height="28" rx="3"/></g><g class="s"><rect x="262" y="134" width="196" height="28" rx="3"/></g><g class="s"><rect x="460" y="134" width="120" height="28" rx="3"/></g><rect x="582" y="134" width="58" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><line class="mark xok" x1="581" y1="66" x2="581" y2="172"/><text class="sub2" x="581" y="192" text-anchor="middle">the first difference</text><text class="cap" x="40" y="242" text-anchor="start">A prefix is the opening stretch of a sequence: its first token, its first two, its first</text><text class="cap" x="40" y="262" text-anchor="start">hundred. A cache hit is the longest prefix of the arriving prompt whose keys and values</text><text class="cap" x="40" y="282" text-anchor="start">the server already holds.</text><text class="cap" x="40" y="322" text-anchor="start">The match runs from the front and stops at the first token that differs. Everything</text><text class="cap" x="40" y="342" text-anchor="start">before it is a hit; everything from there on has to be prefilled, however much of it is</text><text class="cap" x="40" y="362" text-anchor="start">identical ({{fig:v01-o036}}).</text><text class="cap" x="40" y="402" text-anchor="start">For the follow-up question of {{fig:v01-o049}}, 784 of 788 tokens match and only the 4</text><text class="cap" x="40" y="422" text-anchor="start">new ones are prefilled: a hit rate of 99.5%, almost all of it text the user never wrote.</text></svg><figcaption>Front to back, stopping at the first difference. That one rule explains every warm and cold case in the next part. Widths schematic.</figcaption></figure>
