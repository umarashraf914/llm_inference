<figure><div class='ts'>Fig 44 &nbsp;&middot;&nbsp; 25:43</div><h3>A cache hit is a prefix match</h3><svg viewBox='0 0 680 396' role='img'><title>A cache hit is a prefix match</title><text class="hd" x="40" y="46">The prompt that arrives, and what the server already holds</text><text class="sub2" x="40" y="88" text-anchor="start">arriving</text><g class="h"><rect x="120" y="74" width="140" height="28" rx="3"/><text class="sub" x="190.0" y="88.0" text-anchor="middle" dominant-baseline="central">system</text></g><g class="u"><rect x="262" y="74" width="196" height="28" rx="3"/><text class="sub" x="360.0" y="88.0" text-anchor="middle" dominant-baseline="central">tools</text></g><g class="s"><rect x="460" y="74" width="120" height="28" rx="3"/><text class="sub" x="520.0" y="88.0" text-anchor="middle" dominant-baseline="central">history</text></g><g class="m"><rect x="582" y="74" width="58" height="28" rx="3"/><text class="sub" x="611.0" y="88.0" text-anchor="middle" dominant-baseline="central">new</text></g><text class="sub2" x="40" y="148" text-anchor="start">cached</text><g class="h"><rect x="120" y="134" width="140" height="28" rx="3"/></g><g class="u"><rect x="262" y="134" width="196" height="28" rx="3"/></g><g class="s"><rect x="460" y="134" width="120" height="28" rx="3"/></g><rect x="582" y="134" width="58" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><line class="mark xok" x1="582" y1="66" x2="582" y2="172"/><text class="sub2" x="582" y="192" text-anchor="middle">the first difference</text><text class="cap" x="40" y="242" text-anchor="start">The match runs from the front and stops at the first token that differs. Everything to the left</text><text class="cap" x="40" y="262" text-anchor="start">is a hit; everything from that point on has to be prefilled.</text><text class="cap" x="40" y="298" text-anchor="start">It cannot resume after a mismatch. Above the first layer a token's keys and values depend on</text><text class="cap" x="40" y="318" text-anchor="start">every token before it, so once the sequences diverge nothing further can be reused.</text><text class="cap" x="40" y="354" text-anchor="start">For a follow-up question: 906 of 911 tokens match, so only your 5 new words are prefilled. A</text><text class="cap" x="40" y="374" text-anchor="start">hit rate of 99.5%, and almost all of it is text you never wrote.</text></svg><figcaption>Front to back, stopping at the first difference. That one rule explains every warm and cold case below.</figcaption></figure>
