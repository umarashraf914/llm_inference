62"/><text class="sub2" x="92" y="266" text-anchor="end">10 T</text><line class="tick" x1="96" y1="198" x2="100" y2="198"/><text class="sub2" x="92" y="202" text-anchor="end">100 T</text><line class="tick" x1="96" y1="134" x2="100" y2="134"/><text class="sub2" x="92" y="138" text-anchor="end">1 P</text><line class="tick" x1="96" y1="70" x2="100" y2="70"/><text class="sub2" x="92" y="74" text-anchor="end">10 P</text><text class="sub2" x="300.0" y="428" text-anchor="middle">arithmetic intensity: operations per byte (log scale)</text><text class="sub2" x="92" y="56" text-anchor="start">operations per second (log scale)</text><polyline class="pl-m" points="100.0,356.4 377.6,134.3 500.0,134.3"/><line class="mark" x1="377.6" y1="138.3" x2="377.6" y2="390"/><text class="sub2 halo" x="383.6" y="380" text-anchor="start">ridge, 295</text><circle data-pt="" cx="180.0" cy="292.4" r="6" fill="var(--s-fill)" stroke="var(--s)" stroke-width="2"/><text class="sub2" x="140" y="460" data-r="0">batch 1, weights in 16 bits: 1.00 operations per byte</text><text class="sub2" x="140" y="480" data-r="1">one step: 41.8 ms, memory bound</text><text class="sub2" x="140" y="500" data-r="2">each user: 23.9 tokens a second</text><text class="sub2" x="140" y="520" data-r="3">all users together: 23.9 tokens a second</text><text class="sub2" x="140" y="540" data-r="4">arithmetic units busy: 0.339% of the step</text><text class="hd" x="40" y="584">Sixteen-bit weights on one H100: the speed for each user holds until the ridge</text><text class="sub2" x="60" y="610" text-anchor="start">batch</text><text class="sub2" x="170" y="610" text-anchor="start">one step</text><text class="sub2" x="300" y="610" text-anchor="start">each user</text><text class="sub2" x="440" y="610" text-anchor="start">all users together</text><text class="sub2" x="60" y="634" text-anchor="start">1</text><text class="sub2" x="170" y="634" text-anchor="start">41.8 ms</text><text class="sub2" x="300" y="634" text-anchor="start">23.9 tokens/s</text><text class="sub2" x="440" y="634" text-anchor="start">24 tokens/s</text><text class="sub2" x="60" y="656" text-anchor="start">8</text><text class="sub2" x="170" y="656" text-anchor="start">41.8 ms</text><text class="sub2" x="300" y="656" text-anchor="start">23.9 tokens/s</text><text class="sub2" x="440" y="656" text-anchor="start">191 tokens/s</text><text class="sub2" x="60" y="678" text-anchor="start">32</text><text class="sub2" x="170" y="678" text-anchor="start">41.8 ms</text><text class="sub2" x="300" y="678" text-anchor="start">23.9 tokens/s</text><text class="sub2" x="440" y="678" text-anchor="start">766 tokens/s</text><text class="sub2" x="60" y="700" text-anchor="start">64</text><text class="sub2" x="170" y="700" text-anchor="start">41.8 ms</text><text class="sub2" x="300" y="700" text-anchor="start">23.9 tokens/s</text><text class="sub2" x="440" y="700" text-anchor="start">1,531 tokens/s</text><text class="sub2" x="60" y="722" text-anchor="start">128</text><text class="sub2" x="170" y="722" text-anchor="start">41.8 ms</text><text class="sub2" x="300" y="722" text-anchor="start">23.9 tokens/s</text><text class="sub2" x="440" y="722" text-anchor="start">3,063 tokens/s</text><text class="sub2" x="60" y="744" text-anchor="start">295</text><text class="sub2" x="170" y="744" text-anchor="start">41.8 ms</text><text class="sub2" x="300" y="744" text-anchor="start">23.9 tokens/s</text><text class="sub2" x="440" y="744" text-anchor="start">7,059 tokens/s</text><text class="sub2" x="60" y="766" text-anchor="start">512</text><text class="sub2" x="170" y="766" text-anchor="start">72.5 ms</text><text class="sub2" x="300" y="766" text-anchor="start">13.8 tokens/s</text><text class="sub2" x="440" y="766" text-anchor="start">7,064 tokens/s</text><text class="cap" x="40" y="808" text-anchor="start">A batch of B tokens does B times the arithmetic on the same bytes, so its intensity is B</text><text class="cap" x="40" y="828" text-anchor="start">operations per byte. Below the ridge the step still takes the 41.8 ms the read takes:</text><text class="cap" x="40" y="848" text-anchor="start">each user's speed holds and the total grows with every request added.</text><text class="cap" x="40" y="888" text-anchor="start">Past the ridge the arithmetic takes longer than the read, and each step grows with the</text><text class="cap" x="40" y="908" text-anchor="start">batch: at 512, 72.5 ms, and each user slows to 13.8 tokens a second while the total</text><text class="cap" x="40" y="928" text-anchor="start">barely moves. Storing weights in 8 bits, still multiplied in 16, doubles the intensity</text><text class="cap" x="40" y="948" text-anchor="start">and halves the batch that reaches the ridge, to 148; 4 bits, 74; 32 bits would need 590.</text><text class="cap" x="40" y="988" text-anchor="start">These are bounds that count only the weights; Part 11 adds the bytes each user's</text><text class="cap" x="40" y="1008" text-anchor="start">conversation brings. The readouts were checked against Python at every batch size and</text><text class="cap" x="40" y="1028" text-anchor="start">bit width.</text></svg></div><figcaption>Batching is the one route that needs no new hardware and costs no accuracy. Its limit is the ridge, and, as Part 11 shows, the memory each extra user brings.</figcaption><script>(() => {

  const MINUS = '−';
  const fx = (v, d = 2) => { const s = Math.abs(v).toFixed(d); return (v < 0 && +s !== 0 ? MINUS : '') + s; };
  const gx = (v, d = 0) => { const s = Math.abs(v).toFixed(d); const [a, b] = s.split('.');
    const t = a.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (v < 0 && +s !== 0 ? MINUS : '') + t + (b !== undefined ? '.' + b : ''); };

  const RL = 100, RR = 500, RT = 70, RB = 390, XD = 80, YD = 64;
  const xs = i => +(RL + (Math.log10(i) + 1) * XD).toFixed(1);
  const ys = p => +(RB - (Math.log10(p) - 11) * YD).toFixed(1);
  const roofPts = (peak, bw) => { const r = peak / bw;
    return `${xs(0.1)},${ys(bw * 0.1)} ${xs(r)},${ys(peak)} ${xs(1e4)},${ys(peak)}`; };
  const sig3 = v => { if (v === 0) return '0'; const d = Math.max(0, 2 - Math.floor(Math.log10(Math.abs(v))));
    return gx(v, d); };

  const fig = document.currentScript.closest('figure');
  const N = 70000000000.0, PEAK = 989000000000000.0, BW = 3350000000000.0, BS = [1, 2, 4, 8, 16, 32, 64, 74, 100, 128, 148, 200, 256, 295, 400, 512, 768, 1024], I0 = 0;
  const sl = fig.querySelector('input[type=range]'), val = fig.querySelector('.val');
  const rad = [...fig.querySelectorAll('input[type=radio]')], q = s => fig.querySelector(s);
  function draw() {
    const bsz = BS[+sl.value], bits = +rad.find(r => r.checked).value;
    const by = N * bits / 8, ops = 2 * N * bsz, t = Math.max(by / BW, ops / PEAK);
    const i = ops / by, a = Math.min(PEAK, BW * i), bound = by / BW >= ops / PEAK ? 'memory' : 'compute';
    val.textContent = gx(bsz);
    const pt = q('[data-pt]'); pt.setAttribute('cx', xs(i)); pt.setAttribute('cy', ys(a));
    const L = [`batch ${bsz}, weights in ${bits} bits: ${sig3(i)} operations per byte`,
      `one step: ${sig3(t * 1000)} ms, ${bound} bound`, `each user: ${sig3(1 / t)} tokens a second`,
      `all users together: ${sig3(bsz / t)} tokens a second`, `arithmetic units busy: ${sig3(ops / PEAK / t * 100)}% of the step`];
    L.forEach((s, k) => q(`[data-r="${k}"]`).textContent = s);
  }
  sl.addEventListener('input', draw);
  rad.forEach(r => r.addEventListener('change', draw));
  q('button').addEventListener('click', () => { sl.value = I0; rad[0].checked = true; draw(); });
  draw();
})();</script></figure>
