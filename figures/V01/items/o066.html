<figure><div class='ts'>Fig 66 &nbsp;&middot;&nbsp; 2:41</div><h3>Checking the units</h3><svg viewBox='0 0 680 380' role='img'><title>Checking the units</title><text class="hd" x="40" y="46">What the units tell you</text><g class="u"><rect x="60" y="70" width="180" height="40" rx="4"/><text class="sub" x="150.0" y="90.0" text-anchor="middle" dominant-baseline="central">operations</text></g><text class="sub2" x="252" y="96" text-anchor="start">divided by</text><g class="u"><rect x="330" y="70" width="250" height="40" rx="4"/><text class="sub" x="455.0" y="90.0" text-anchor="middle" dominant-baseline="central">operations per second</text></g><line class="conn" x1="320" y1="130" x2="320" y2="150" marker-end="url(#arw)"/><g class="s"><rect x="230" y="156" width="180" height="40" rx="4"/><text class="sub" x="320.0" y="176.0" text-anchor="middle" dominant-baseline="central">seconds</text></g><text class="cap" x="40" y="246" text-anchor="start">The word operations appears on the top and on the bottom, so it cancels, exactly as it would</text><text class="cap" x="40" y="266" text-anchor="start">in a fraction. What is left is one over per-second, which is seconds.</text><text class="cap" x="40" y="302" text-anchor="start">Try it the other way round and you get operations squared per second, which is not a duration</text><text class="cap" x="40" y="322" text-anchor="start">and not anything else either.</text><text class="cap" x="40" y="358" text-anchor="start">Any statement about performance that does not survive this test has something wrong with it.</text></svg><figcaption>A test that costs five seconds and catches the most common class of error. Use it on every claim in this series, including the ones made here.</figcaption></figure>
