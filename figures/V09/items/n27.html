<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 7:05</div><h3>After the brace, the format leaves one field name standing</h3><svg viewBox='0 0 680 736' role='img'><title>After the brace, the format leaves one field name standing</title><text class="hd" x="40" y="46">The state machine's table for the start of a call, and where this request stands</text><text class="sub2" x="70" y="74" text-anchor="start">state</text><text class="sub2" x="260" y="74" text-anchor="start">tokens allowed next</text><g class="u"><rect x="70" y="84" width="176" height="24" rx="3"/><text class="sub" x="158.0" y="96.0" text-anchor="middle" dominant-baseline="central">nothing yet</text></g><text class="sub2" x="260" y="101" text-anchor="start">an opening brace</text><g class="m"><rect x="70" y="114" width="176" height="24" rx="3"/><text class="sub" x="158.0" y="126.0" text-anchor="middle" dominant-baseline="central">after the brace</text></g><text class="sub2" x="260" y="131" text-anchor="start">"name, or a space</text><g class="u"><rect x="70" y="144" width="176" height="24" rx="3"/><text class="sub" x="158.0" y="156.0" text-anchor="middle" dominant-baseline="central">inside a field name</text></g><text class="sub2" x="260" y="161" text-anchor="start">its own letters, then the closing quote</text><g class="u"><rect x="70" y="174" width="176" height="24" rx="3"/><text class="sub" x="158.0" y="186.0" text-anchor="middle" dominant-baseline="central">after a colon</text></g><text class="sub2" x="260" y="191" text-anchor="start">a space, then the value's opening quote</text><g class="u"><rect x="70" y="204" width="176" height="24" rx="3"/><text class="sub" x="158.0" y="216.0" text-anchor="middle" dominant-baseline="central">inside the tool's name</text></g><text class="sub2" x="260" y="221" text-anchor="start">letters that can still become a listed tool</text><g class="u"><rect x="70" y="234" width="176" height="24" rx="3"/><text class="sub" x="158.0" y="246.0" text-anchor="middle" dominant-baseline="central">inside a free string</text></g><text class="sub2" x="260" y="251" text-anchor="start">anything but a quote, or the closing quote</text><line class="conn" x1="40" y1="126" x2="64" y2="126" marker-end="url(#arw)"/><text class="hd" x="40" y="290">At that state: the text so far is {, and four candidates</text><text class="sub2" x="170" y="312" text-anchor="start">before the mask</text><text class="sub2" x="430" y="312" text-anchor="start">after: divided by the allowed total</text><text class="cap" x="40" y="341" text-anchor="start">"name</text><g class="u"><rect x="170" y="324" width="132.0" height="24" rx="3"/></g><text class="sub2" x="310.0" y="341" text-anchor="start">0.60</text><g class="s"><rect x="430" y="324" width="147.69230769230768" height="24" rx="3"/></g><text class="sub2" x="585.6923076923076" y="341" text-anchor="start">0.923</text><text class="cap" x="40" y="373" text-anchor="start">"tool</text><g class="u"><rect x="170" y="356" width="55.0" height="24" rx="3"/></g><text class="sub2" x="233.0" y="373" text-anchor="start">0.25</text><text class="sub2" x="430" y="373" text-anchor="start">removed</text><text class="cap" x="40" y="405" text-anchor="start">"function</text><g class="u"><rect x="170" y="388" width="22.0" height="24" rx="3"/></g><text class="sub2" x="200.0" y="405" text-anchor="start">0.10</text><text class="sub2" x="430" y="405" text-anchor="start">removed</text><text class="cap" x="40" y="437" text-anchor="start">␣</text><g class="u"><rect x="170" y="420" width="11.0" height="24" rx="3"/></g><text class="sub2" x="189.0" y="437" text-anchor="start">0.05</text><g class="s"><rect x="430" y="420" width="12.307692307692308" height="24" rx="3"/></g><text class="sub2" x="450.3076923076923" y="437" text-anchor="start">0.077</text><text class="sub2" x="40" y="462" text-anchor="start">allowed total 0.65: 0.60 ÷ 0.65 = 0.923 and 0.05 ÷ 0.65 = 0.077</text><text class="cap" x="40" y="506" text-anchor="start">The engine tracks where the text stands in the format with a state machine: each token moves it to a</text><text class="cap" x="40" y="526" text-anchor="start">new state, and each state allows only some next tokens ({{fig:v07-o022}}). Because JSON nests, it also</text><text class="cap" x="40" y="546" text-anchor="start">keeps a stack of the braces still open.</text><text class="cap" x="40" y="586" text-anchor="start">After the opening brace, the format allows only the field it requires first, "name", or a space. Of the</text><text class="cap" x="40" y="606" text-anchor="start">163,840 tokens in the vocabulary, every other one gets a score of minus infinity, which softmax</text><text class="cap" x="40" y="626" text-anchor="start">turns into a probability of exactly zero ({{fig:v07-o023}}).</text><text class="cap" x="40" y="666" text-anchor="start">The survivors' probabilities are then divided by their total, 0.65, so they add up to one again. The</text><text class="cap" x="40" y="686" text-anchor="start">probabilities are illustrative; which candidates survive is computed by checking each against the</text><text class="cap" x="40" y="706" text-anchor="start">format.</text></svg><figcaption>After an opening brace, only the field names the format allows are still available. Among the survivors the model's own ranking stands; only the illegal options vanish.</figcaption></figure>
