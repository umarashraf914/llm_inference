<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:18</div><h3>Seventy kilobytes a token is nothing for one conversation and decisive for a crowd</h3><svg viewBox='0 0 680 434' role='img'><title>Seventy kilobytes a token is nothing for one conversation and decisive for a crowd</title><text class="hd" x="40" y="46">What one decode step reads, to scale: the weights once, every cache in full</text><text class="cap" x="40" y="86" text-anchor="start">the active weights</text><g class="u"><rect x="252" y="68" width="283.5" height="26" rx="3"/><text class="sub" x="393.75" y="81.0" text-anchor="middle" dominant-baseline="central">15 GB, read once for the whole batch</text></g><text class="cap" x="40" y="124" text-anchor="start">1 conversation, 4,000 tokens</text><g class="h"><rect x="252" y="106" width="5.3125632000000005" height="26" rx="3"/></g><text class="sub2" x="267.3125632" y="124" text-anchor="start">0.28 GB, 1.9% of the weight read</text><text class="cap" x="40" y="162" text-anchor="start">1 conversation, 100,000 tokens</text><g class="h"><rect x="252" y="144" width="132.81408" height="26" rx="3"/></g><text class="sub2" x="394.81408" y="162" text-anchor="start">7.0 GB, 46.8% of the weight read</text><text class="cap" x="40" y="200" text-anchor="start">64 conversations, 4,000 each</text><g class="h"><rect x="252" y="182" width="340.00404480000003" height="26" rx="3"/><text class="sub" x="422.0020224" y="195.0" text-anchor="middle" dominant-baseline="central">18.0 GB, 119.9% of the weight read</text></g><line class="axis" x1="252" y1="222" x2="630" y2="222"/><line class="tick" x1="252.0" y1="222" x2="252.0" y2="226"/><text class="sub2" x="252.0" y="240" text-anchor="middle">0 GB</text><line class="tick" x1="346.5" y1="222" x2="346.5" y2="226"/><text class="sub2" x="346.5" y="240" text-anchor="middle">5 GB</text><line class="tick" x1="441.0" y1="222" x2="441.0" y2="226"/><text class="sub2" x="441.0" y="240" text-anchor="middle">10 GB</text><line class="tick" x1="535.5" y1="222" x2="535.5" y2="226"/><text class="sub2" x="535.5" y="240" text-anchor="middle">15 GB</text><line class="tick" x1="630.0" y1="222" x2="630.0" y2="226"/><text class="sub2" x="630.0" y="240" text-anchor="middle">20 GB</text><text class="cap" x="40" y="284" text-anchor="start">Every decode step reads the weights once for the whole batch, but it reads each sequence's cache</text><text class="cap" x="40" y="304" text-anchor="start">separately, because no two requests share one ({{fig:v07-o005}}). At 70 KB a token, this conversation's</text><text class="cap" x="40" y="324" text-anchor="start">4,000 tokens are 281 MB: under 2% of the weight read, nothing.</text><text class="cap" x="40" y="364" text-anchor="start">The same arithmetic at a crowd's scale is decisive. One conversation at 100,000 tokens reads 7.0</text><text class="cap" x="40" y="384" text-anchor="start">GB a step; 64 conversations of 4,000 tokens read 18.0 GB, more than the weights ({{fig:v08-o015}}). And</text><text class="cap" x="40" y="404" text-anchor="start">each new token adds 70 KB, so every read is slightly larger than the one before it.</text></svg><figcaption>Bars to scale. Batching shares the weight read among requests; it can never share their caches, which grow with every token and every request.</figcaption></figure>
