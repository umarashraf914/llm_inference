<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:25</div><h3>A taller ridge and a richer byte leave the same gap: 295 tokens then, 313 now</h3><div class='wg'><div class='ctl'><label>tokens sharing each read <input type='range' min='0' max='13' step='1' value='0'><span class='val'>1</span></label><button type='button'>Reset</button></div><svg viewBox='0 0 680 664' role='img'><title>A taller ridge and a richer byte leave the same gap: 295 tokens then, 313 now</title><text class="sub2" x="110" y="30" text-anchor="start">operations a second (log scale)</text><line class="axis" x1="110" y1="296" x2="620" y2="296"/><line class="axis" x1="110" y1="56" x2="110" y2="296"/><line class="tick" x1="110.0" y1="296" x2="110.0" y2="300"/><text class="sub2" x="110.0" y="314" text-anchor="middle">1</text><line class="tick" x1="237.5" y1="296" x2="237.5" y2="300"/><text class="sub2" x="237.5" y="314" text-anchor="middle">10</text><line class="tick" x1="365.0" y1="296" x2="365.0" y2="300"/><text class="sub2" x="365.0" y="314" text-anchor="middle">100</text><line class="tick" x1="492.5" y1="296" x2="492.5" y2="300"/><text class="sub2" x="492.5" y="314" text-anchor="middle">1,000</text><line class="tick" x1="620.0" y1="296" x2="620.0" y2="300"/><text class="sub2" x="620.0" y="314" text-anchor="middle">10,000</text><line class="tick" x1="106" y1="296.0" x2="110" y2="296.0"/><text class="sub2" x="102" y="300.0" text-anchor="end">10¹²</text><line class="tick" x1="106" y1="248.0" x2="110" y2="248.0"/><text class="sub2" x="102" y="252.0" text-anchor="end">10¹³</text><line class="tick" x1="106" y1="200.0" x2="110" y2="200.0"/><text class="sub2" x="102" y="204.0" text-anchor="end">10¹⁴</text><line class="tick" x1="106" y1="152.0" x2="110" y2="152.0"/><text class="sub2" x="102" y="156.0" text-anchor="end">10¹⁵</text><line class="tick" x1="106" y1="104.0" x2="110" y2="104.0"/><text class="sub2" x="102" y="108.0" text-anchor="end">10¹⁶</text><line class="tick" x1="106" y1="56.0" x2="110" y2="56.0"/><text class="sub2" x="102" y="60.0" text-anchor="end">10¹⁷</text><text class="sub2" x="365.0" y="334" text-anchor="middle">operations per byte of weights read (log scale)</text><polyline points="110.0,270.8 424.9,152.2 620.0,152.2" style="fill:none;stroke:var(--u);stroke-width:2"/><line class="mark" x1="424.9" y1="62" x2="424.9" y2="146.2"/><text class="sub2" x="424.9443142814426" y="50" text-anchor="middle">ridge 295</text><g class="u"><text class="sub" x="618" y="143.2" text-anchor="end">H100 at 16 bits</text></g><polyline points="110.0,252.7 504.9,104.0 620.0,104.0" style="fill:none;stroke:var(--m);stroke-width:2"/><line class="mark" x1="504.9" y1="62" x2="504.9" y2="98.0"/><text class="sub2" x="504.8560266585272" y="50" text-anchor="middle">ridge 1,250</text><g class="m"><text class="sub" x="618" y="95.0" text-anchor="end">Blackwell at 4 bits</text></g><circle data-pt="0" cx="110.0" cy="270.8" r="5" fill="var(--paper)" stroke="var(--u)" stroke-width="2"/><circle data-pt="1" cx="186.8" cy="223.8" r="5" fill="var(--paper)" stroke="var(--m)" stroke-width="2"/><g class="u"><text class="sub" x="40" y="366" data-r="0">H100 at 16 bits: 1 × 1 = 1 operation per byte, 0.34% of peak, 295.2× short of its ridge</text></g><g class="m"><text class="sub" x="40" y="388" data-r="1">Blackwell at 4 bits: 1 × 4 = 4 operations per byte, 0.32% of peak, 312.5× short of its ridge</text></g><text class="cap" x="40" y="438" text-anchor="start">The first episode's chip, an H100 reading 16-bit weights, needs 295 operations per byte</text><text class="cap" x="40" y="458" text-anchor="start">({{fig:v01-o126}}), and each byte offers one to each token ({{fig:v01-o116}}). Breaking even takes about 295</text><text class="cap" x="40" y="478" text-anchor="start">tokens per read. This chip needs 1,250, each byte offers 4, and breaking even takes 313.</text><text class="cap" x="40" y="518" text-anchor="start">Peak arithmetic grew about tenfold and memory speed about 2.4 times, so the ridge rose 4.2 times;</text><text class="cap" x="40" y="538" text-anchor="start">4-bit weights made each byte worth 4 times as much. The two nearly cancel. Slide to 64 tokens and</text><text class="cap" x="40" y="558" text-anchor="start">both chips reach about a fifth of their peak; near 300 both reach their ridge.</text><text class="cap" x="40" y="598" text-anchor="start">Both rooflines come from the two rates alone, on logarithmic axes ({{fig:v01-o121}}): attainable =</text><text class="cap" x="40" y="618" text-anchor="start">min(peak, bandwidth × intensity) ({{fig:v01-o123}}). The widget's arithmetic was checked against Python</text><text class="cap" x="40" y="638" text-anchor="start">at every setting.</text></svg></div><figcaption>The headline rates grew about tenfold and the gap a lone token leaves did not move. Every gain on the arithmetic side was matched by a ridge that rose to meet it.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const BS = [1, 2, 4, 8, 16, 32, 64, 128, 256, 296, 313, 512, 1024, 2048], CH = [{"name": "H100 at 16 bits", "peak": 989000000000000.0, "bw": 3350000000000.0, "k": 1}, {"name": "Blackwell at 4 bits", "peak": 1e+16, "bw": 8000000000000.0, "k": 4}], G = {"x0": 110, "x1": 620, "dx": 4, "y0": 56, "y1": 296, "lo": 12, "dy": 5};
  const sl = fig.querySelector('input[type=range]'), val = fig.querySelector('.val');
  const q = s => fig.querySelector(s);
  const com = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const fx = (v, d) => { const [i, f] = Math.abs(v).toFixed(d).split('.');
    return (v < 0 && +Math.abs(v).toFixed(d) !== 0 ? '−' : '') + com(i) + (f ? '.' + f : ''); };
  const X = I => G.x0 + Math.log10(I) / G.dx * (G.x1 - G.x0);
  const Y = a => G.y1 - (Math.log10(a) - G.lo) / G.dy * (G.y1 - G.y0);
  function draw() {
    const B = BS[+sl.value];
    val.textContent = com(String(B));
    CH.forEach((c, j) => {
      const I = B * c.k, ridge = c.peak / c.bw, att = Math.min(c.peak, c.bw * I);
      const pt = q(`[data-pt="${j}"]`);
      pt.setAttribute('cx', X(I).toFixed(1)); pt.setAttribute('cy', Y(att).toFixed(1));
      const pct = I >= ridge ? '100%' : fx(100 * I / ridge, 2) + '%';
      const tail = I >= ridge ? 'past its ridge' : fx(ridge / I, 1) + '× short of its ridge';
      q(`[data-r="${j}"]`).textContent =
        `${c.name}: ${com(String(B))} × ${c.k} = ${com(String(I))} operation${I === 1 ? '' : 's'} per byte, ${pct} of peak, ${tail}`;
    });
  }
  sl.addEventListener('input', draw);
  q('button').addEventListener('click', () => { sl.value = 0; draw(); });
  draw();
})();</script></figure>
