 class="s"><rect x="440" y="128" width="18" height="18" rx="2"/></g><g class="s"><rect x="460" y="128" width="18" height="18" rx="2"/></g><g class="s"><rect x="480" y="128" width="18" height="18" rx="2"/></g><g class="s"><rect x="340" y="148" width="18" height="18" rx="2"/></g><g class="s"><rect x="360" y="148" width="18" height="18" rx="2"/></g><g class="s"><rect x="380" y="148" width="18" height="18" rx="2"/></g><g class="s"><rect x="400" y="148" width="18" height="18" rx="2"/></g><g class="s"><rect x="420" y="148" width="18" height="18" rx="2"/></g><g class="s"><rect x="440" y="148" width="18" height="18" rx="2"/></g><g class="s"><rect x="460" y="148" width="18" height="18" rx="2"/></g><g class="s"><rect x="480" y="148" width="18" height="18" rx="2"/></g><g class="s"><rect x="340" y="168" width="18" height="18" rx="2"/></g><g class="s"><rect x="360" y="168" width="18" height="18" rx="2"/></g><g class="s"><rect x="380" y="168" width="18" height="18" rx="2"/></g><g class="s"><rect x="400" y="168" width="18" height="18" rx="2"/></g><g class="s"><rect x="420" y="168" width="18" height="18" rx="2"/></g><g class="s"><rect x="440" y="168" width="18" height="18" rx="2"/></g><g class="s"><rect x="460" y="168" width="18" height="18" rx="2"/></g><g class="s"><rect x="480" y="168" width="18" height="18" rx="2"/></g><g class="s"><rect x="340" y="188" width="18" height="18" rx="2"/></g><g class="s"><rect x="360" y="188" width="18" height="18" rx="2"/></g><g class="s"><rect x="380" y="188" width="18" height="18" rx="2"/></g><g class="s"><rect x="400" y="188" width="18" height="18" rx="2"/></g><g class="s"><rect x="420" y="188" width="18" height="18" rx="2"/></g><g class="s"><rect x="440" y="188" width="18" height="18" rx="2"/></g><g class="s"><rect x="460" y="188" width="18" height="18" rx="2"/></g><g class="s"><rect x="480" y="188" width="18" height="18" rx="2"/></g><g class="s"><rect x="340" y="208" width="18" height="18" rx="2"/></g><g class="s"><rect x="360" y="208" width="18" height="18" rx="2"/></g><g class="s"><rect x="380" y="208" width="18" height="18" rx="2"/></g><g class="s"><rect x="400" y="208" width="18" height="18" rx="2"/></g><g class="s"><rect x="420" y="208" width="18" height="18" rx="2"/></g><g class="s"><rect x="440" y="208" width="18" height="18" rx="2"/></g><g class="s"><rect x="460" y="208" width="18" height="18" rx="2"/></g><g class="s"><rect x="480" y="208" width="18" height="18" rx="2"/></g><g class="s"><rect x="340" y="228" width="18" height="18" rx="2"/></g><g class="s"><rect x="360" y="228" width="18" height="18" rx="2"/></g><g class="s"><rect x="380" y="228" width="18" height="18" rx="2"/></g><g class="s"><rect x="400" y="228" width="18" height="18" rx="2"/></g><g class="s"><rect x="420" y="228" width="18" height="18" rx="2"/></g><g class="s"><rect x="440" y="228" width="18" height="18" rx="2"/></g><g class="s"><rect x="460" y="228" width="18" height="18" rx="2"/></g><g class="s"><rect x="480" y="228" width="18" height="18" rx="2"/></g><text class="cap" x="40" y="278" text-anchor="start">what the triangle made free</text><text class="sub2" x="40" y="302" text-anchor="start">keeping each token's keys and values once they are made ({{fig:v01-o136}})</text><text class="sub2" x="40" y="322" text-anchor="start">reusing a cached prefix for every request that shares it ({{fig:v01-o044}})</text><text class="sub2" x="40" y="342" text-anchor="start">checking several drafted tokens in one pass ({{fig:v08-o003}})</text><text class="cap" x="40" y="398" text-anchor="start">An ordinary model's attention is causal: each position sees only those before it, the triangle</text><text class="cap" x="40" y="418" text-anchor="start">({{fig:v03-o020}}). That one rule is why a token's keys and values never change once made, so they can</text><text class="cap" x="40" y="438" text-anchor="start">be kept; why a cached prefix stays valid for every request that shares it; and why drafted tokens</text><text class="cap" x="40" y="458" text-anchor="start">can be checked in one pass.</text><text class="cap" x="40" y="498" text-anchor="start">A masked diffusion model fills each blank from both sides, so every position sees every other: the</text><text class="cap" x="40" y="518" text-anchor="start">full square. LLaDA, a published 8-billion-parameter diffusion model, uses no causal mask, and its</text><text class="cap" x="40" y="538" text-anchor="start">authors note it is incompatible with key-value caching. Mercury's report says only that its models</text><text class="cap" x="40" y="558" text-anchor="start">are Transformers trained to predict many tokens in parallel.</text><text class="cap" x="40" y="598" text-anchor="start">So the stack built for one-token-at-a-time decode does not carry over unchanged. A model that fills</text><text class="cap" x="40" y="618" text-anchor="start">in many positions at once is a different problem, and the stack that serves it will look different too.</text></svg><figcaption>Each of the stack's cache tricks rests on the triangle. Take it away and they have to be rebuilt, which is the concrete content of a different stack.</figcaption></figure>
