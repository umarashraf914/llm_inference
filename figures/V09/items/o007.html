<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:21</div><h3>Four episodes' machinery runs inside one forward pass</h3><svg viewBox='0 0 680 558' role='img'><title>Four episodes' machinery runs inside one forward pass</title><text class="hd" x="40" y="46">One layer of the forward pass, in the order this request's tokens meet it</text><g class="m"><rect x="40" y="66" width="300" height="46" rx="6"/><text class="lbl" x="190.0" y="80.0" text-anchor="middle" dominant-baseline="central">weights arrive 4 bits wide</text><text class="sub" x="190.0" y="98.0" text-anchor="middle" dominant-baseline="central">scaled per 16, inside the multiply</text></g><text class="sub2" x="360" y="94" text-anchor="start">drawn in {{fig:v09-n11}} and {{fig:v09-n12}}</text><line class="conn" x1="190" y1="115" x2="190" y2="125" marker-end="url(#arw)"/><g class="m"><rect x="40" y="128" width="300" height="46" rx="6"/><text class="lbl" x="190.0" y="142.0" text-anchor="middle" dominant-baseline="central">attention: FlashAttention-4</text><text class="sub" x="190.0" y="160.0" text-anchor="middle" dominant-baseline="central">fused, on chip</text></g><text class="sub2" x="360" y="156" text-anchor="start">drawn in {{fig:v09-n13}}</text><line class="conn" x1="190" y1="177" x2="190" y2="187" marker-end="url(#arw)"/><g class="h"><rect x="40" y="190" width="300" height="46" rx="6"/><text class="lbl" x="190.0" y="204.0" text-anchor="middle" dominant-baseline="central">split across GPUs</text><text class="sub" x="190.0" y="222.0" text-anchor="middle" dominant-baseline="central">partial results added over NVLink</text></g><text class="sub2" x="360" y="218" text-anchor="start">drawn in {{fig:v09-n14}}</text><line class="conn" x1="190" y1="239" x2="190" y2="249" marker-end="url(#arw)"/><g class="m"><rect x="40" y="252" width="300" height="46" rx="6"/><text class="lbl" x="190.0" y="266.0" text-anchor="middle" dominant-baseline="central">router: 8 of 384 experts</text><text class="sub" x="190.0" y="284.0" text-anchor="middle" dominant-baseline="central">plus the shared expert</text></g><text class="sub2" x="360" y="280" text-anchor="start">drawn in {{fig:v09-n15}}</text><line class="conn" x1="190" y1="301" x2="190" y2="311" marker-end="url(#arw)"/><g class="h"><rect x="40" y="314" width="300" height="46" rx="6"/><text class="lbl" x="190.0" y="328.0" text-anchor="middle" dominant-baseline="central">all-to-all: dispatch, combine</text><text class="sub" x="190.0" y="346.0" text-anchor="middle" dominant-baseline="central">every GPU to every other</text></g><text class="sub2" x="360" y="342" text-anchor="start">drawn in {{fig:v09-n16}}</text><text class="sub2" x="40" y="384" text-anchor="start">then the same five steps in the next layer</text><text class="cap" x="40" y="428" text-anchor="start">Prefill sends the 100 new tokens through these five steps in each of the 61 layers. Four episodes'</text><text class="cap" x="40" y="448" text-anchor="start">machinery fires in every one: microscaled 4-bit numerics ({{fig:v04-o076}}), a fused attention kernel</text><text class="cap" x="40" y="468" text-anchor="start">({{fig:v03-o079}}), tensor parallelism ({{fig:v05-o009}}) and expert parallelism ({{fig:v05-o016}}).</text><text class="cap" x="40" y="508" text-anchor="start">At the end of the last layer the model's scores for the next token give the first token of the answer,</text><text class="cap" x="40" y="528" text-anchor="start">and every layer has written keys and values for the whole prompt into the cache.</text></svg><figcaption>Each box is a figure above and an episode before. Amber is arithmetic, red is the traffic the split creates.</figcaption></figure>
