<figure><div class='ts'>Fig 07 &nbsp;&middot;&nbsp; 3:31</div><h3>One pass through the model</h3><svg viewBox="0 0 680 488" role="img"><title>One pass through the model</title><text class="hd" x="40" y="46">Inside the prefill machine</text><g class="s"><rect x="40" y="70" width="178" height="44" rx="4"></rect><text class="sub" x="129.0" y="92.0" text-anchor="middle" dominant-baseline="central">weights arrive 4 bits wide</text></g><line class="conn" x1="224" y1="92" x2="244" y2="92" marker-end="url(#arw)"></line><g class="m"><rect x="250" y="70" width="200" height="44" rx="4"></rect><text class="sub" x="350.0" y="92.0" text-anchor="middle" dominant-baseline="central">each block of 16 carries a scale</text></g><line class="conn" x1="456" y1="92" x2="476" y2="92" marker-end="url(#arw)"></line><g class="m"><rect x="482" y="70" width="158" height="44" rx="4"></rect><text class="sub" x="561.0" y="92.0" text-anchor="middle" dominant-baseline="central">applied as it runs</text></g><text class="sub2" x="40" y="146" text-anchor="start">so the weights stay four bits wide until the instant they are multiplied</text><text class="cap" x="40" y="196" text-anchor="start">The attention kernel written for this hardware computes the attention, and each matrix multiply</text><text class="cap" x="40" y="216" text-anchor="start">is split across several GPUs which exchange partial results over NVLink.</text><text class="hd" x="40" y="266">And every layer holds hundreds of separate expert networks</text><g class="s"><rect x="40" y="286" width="90" height="40" rx="4"></rect><text class="sub" x="85.0" y="306.0" text-anchor="middle" dominant-baseline="central">router</text></g><g class="m"><rect x="150" y="286" width="70" height="40" rx="4"></rect><text class="sub" x="185.0" y="306.0" text-anchor="middle" dominant-baseline="central">E1</text></g><g class="m"><rect x="232" y="286" width="70" height="40" rx="4"></rect><text class="sub" x="267.0" y="306.0" text-anchor="middle" dominant-baseline="central">E2</text></g><g class="u"><rect x="314" y="286" width="70" height="40" rx="4"></rect><text class="sub" x="349.0" y="306.0" text-anchor="middle" dominant-baseline="central">E3</text></g><g class="u"><rect x="396" y="286" width="70" height="40" rx="4"></rect><text class="sub" x="431.0" y="306.0" text-anchor="middle" dominant-baseline="central">E4</text></g><g class="u"><rect x="478" y="286" width="70" height="40" rx="4"></rect><text class="sub" x="513.0" y="306.0" text-anchor="middle" dominant-baseline="central">E5</text></g><g class="u"><rect x="560" y="286" width="70" height="40" rx="4"></rect><text class="sub" x="595.0" y="306.0" text-anchor="middle" dominant-baseline="central">E6</text></g><text class="sub2" x="150" y="356" text-anchor="start">eight of them per token, sitting on different GPUs</text><text class="cap" x="40" y="406" text-anchor="start">So the tokens cross in an all-to-all exchange, every GPU sending to every other.</text><text class="cap" x="40" y="446" text-anchor="start">Microscaled four-bit numerics, a fused attention kernel, tensor parallelism and expert</text><text class="cap" x="40" y="466" text-anchor="start">parallelism, all inside a single forward pass.</text></svg><figcaption>Four separate episodes' worth of machinery, running simultaneously on the same tokens.</figcaption></figure>
