<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:39</div><h3>Four bits give fifteen values, and one scale per block stretches them to fit</h3><svg viewBox='0 0 680 734' role='img'><title>Four bits give fifteen values, and one scale per block stretches them to fit</title><text class="hd" x="40" y="46">The fifteen values a 4-bit float can hold, and where three weights land</text><line class="axis" x1="46" y1="128" x2="634" y2="128"/><line class="tick" x1="46.0" y1="128" x2="46.0" y2="134"/><text class="sub2" x="46.0" y="148" text-anchor="middle">−6</text><line class="tick" x1="144.0" y1="128" x2="144.0" y2="134"/><text class="sub2" x="144.0" y="148" text-anchor="middle">−4</text><line class="tick" x1="193.0" y1="128" x2="193.0" y2="134"/><text class="sub2" x="193.0" y="148" text-anchor="middle">−3</text><line class="tick" x1="242.0" y1="128" x2="242.0" y2="134"/><text class="sub2" x="242.0" y="148" text-anchor="middle">−2</text><line class="tick" x1="266.5" y1="128" x2="266.5" y2="134"/><line class="tick" x1="291.0" y1="128" x2="291.0" y2="134"/><line class="tick" x1="315.5" y1="128" x2="315.5" y2="134"/><line class="tick" x1="340.0" y1="128" x2="340.0" y2="134"/><text class="sub2" x="340.0" y="148" text-anchor="middle">0</text><line class="tick" x1="364.5" y1="128" x2="364.5" y2="134"/><text class="sub2" x="364.5" y="148" text-anchor="middle">0.5</text><line class="tick" x1="389.0" y1="128" x2="389.0" y2="134"/><text class="sub2" x="389.0" y="148" text-anchor="middle">1</text><line class="tick" x1="413.5" y1="128" x2="413.5" y2="134"/><text class="sub2" x="413.5" y="148" text-anchor="middle">1.5</text><line class="tick" x1="438.0" y1="128" x2="438.0" y2="134"/><text class="sub2" x="438.0" y="148" text-anchor="middle">2</text><line class="tick" x1="487.0" y1="128" x2="487.0" y2="134"/><text class="sub2" x="487.0" y="148" text-anchor="middle">3</text><line class="tick" x1="536.0" y1="128" x2="536.0" y2="134"/><text class="sub2" x="536.0" y="148" text-anchor="middle">4</text><line class="tick" x1="634.0" y1="128" x2="634.0" y2="134"/><text class="sub2" x="634.0" y="148" text-anchor="middle">6</text><line class="conn" x1="379.2" y1="104" x2="389.0" y2="124" marker-end="url(#arw)"/><circle cx="379.2" cy="100" r="3.5" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><text class="sub2" x="379.2" y="90" text-anchor="middle">a: 0.80</text><line class="conn" x1="238.7" y1="104" x2="242.0" y2="124" marker-end="url(#arw)"/><circle cx="238.7" cy="100" r="3.5" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><text class="sub2" x="238.73333333333332" y="90" text-anchor="middle">b: −2.07</text><line class="conn" x1="571.9" y1="104" x2="536.0" y2="124" marker-end="url(#arw)"/><circle cx="571.9" cy="100" r="3.5" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><text class="sub2" x="571.9333333333334" y="90" text-anchor="middle">c: 4.73</text><text class="sub2" x="40" y="172" text-anchor="start">the negatives mirror the positives; ±0 are one value, so 16 codes give 15 values</text><text class="cap" x="40" y="208" text-anchor="start">One block of 16 weights, as the model trained them</text><g class="m"><rect x="40" y="220" width="68" height="26" rx="3"/><text class="sub" x="74.0" y="233.0" text-anchor="middle" dominant-baseline="central">a  0.012</text></g><g class="m"><rect x="114" y="220" width="68" height="26" rx="3"/><text class="sub" x="148.0" y="233.0" text-anchor="middle" dominant-baseline="central">b  −0.031</text></g><g class="m"><rect x="188" y="220" width="68" height="26" rx="3"/><text class="sub" x="222.0" y="233.0" text-anchor="middle" dominant-baseline="central">c  0.071</text></g><g class="u"><rect x="262" y="220" width="68" height="26" rx="3"/><text class="sub" x="296.0" y="233.0" text-anchor="middle" dominant-baseline="central">−0.090</text></g><g class="u"><rect x="336" y="220" width="68" height="26" rx="3"/><text class="sub" x="370.0" y="233.0" text-anchor="middle" dominant-baseline="central">0.005</text></g><g class="u"><rect x="410" y="220" width="68" height="26" rx="3"/><text class="sub" x="444.0" y="233.0" text-anchor="middle" dominant-baseline="central">0.044</text></g><g class="u"><rect x="484" y="220" width="68" height="26" rx="3"/><text class="sub" x="518.0" y="233.0" text-anchor="middle" dominant-baseline="central">−0.017</text></g><g class="u"><rect x="558" y="220" width="68" height="26" rx="3"/><text class="sub" x="592.0" y="233.0" text-anchor="middle" dominant-baseline="central">0.026</text></g><g class="u"><rect x="40" y="254" width="68" height="26" rx="3"/><text class="sub" x="74.0" y="267.0" text-anchor="middle" dominant-baseline="central">−0.058</text></g><g class="u"><rect x="114" y="254" width="68" height="26" rx="3"/><text class="sub" x="148.0" y="267.0" text-anchor="middle" dominant-baseline="central">0.009</text></g><g class="u"><rect x="188" y="254" width="68" height="26" rx="3"/><text class="sub" x="222.0" y="267.0" text-anchor="middle" dominant-baseline="central">−0.002</text></g><g class="u"><rect x="262" y="254" width="68" height="26" rx="3"/><text class="sub" x="296.0" y="267.0" text-anchor="middle" dominant-baseline="central">0.038</text></g><g class="u"><rect x="336" y="254" width="68" height="26" rx="3"/><text class="sub" x="370.0" y="267.0" text-anchor="middle" dominant-baseline="central">−0.065</text></g><g class="u"><rect x="410" y="254" width="68" height="26" rx="3"/><text class="sub" x="444.0" y="267.0" text-anchor="middle" dominant-baseline="central">0.021</text></g><g class="u"><rect x="484" y="254" width="68" height="26" rx="3"/><text class="sub" x="518.0" y="267.0" text-anchor="middle" dominant-baseline="central">0.050</text></g><g class="u"><rect x="558" y="254" width="68" height="26" rx="3"/><text class="sub" x="592.0" y="267.0" text-anchor="middle" dominant-baseline="central">−0.040</text></g><text class="sub2" x="40" y="302" text-anchor="start">largest magnitude 0.090 ÷ 6 = 0.015: the block's scale</text><text class="sub2" x="40" y="340" text-anchor="start">weight</text><text class="sub2" x="110" y="340" text-anchor="start">÷ 0.015</text><text class="sub2" x="196" y="340" text-anchor="start">nearest value</text><text class="sub2" x="300" y="340" text-anchor="start">stored code</text><text class="sub2" x="396" y="340" text-anchor="start">rebuilt: value × 0.015</text><text class="sub2" x="560" y="340" text-anchor="start">error</text><text class="cap" x="40" y="362" text-anchor="start">a  0.012</text><text class="cap" x="110" y="362" text-anchor="start">0.80</text><text class="cap" x="196" y="362" text-anchor="start">1</text><text class="cap" x="300" y="362" text-anchor="start">0010</text><text class="cap" x="396" y="362" text-anchor="start">0.015</text><text class="cap" x="560" y="362" text-anchor="start">0.003</text><text class="cap" x="40" y="384" text-anchor="start">b  −0.031</text><text class="cap" x="110" y="384" text-anchor="start">−2.07</text><text class="cap" x="196" y="384" text-anchor="start">−2</text><text class="cap" x="300" y="384" text-anchor="start">1100</text><text class="cap" x="396" y="384" text-anchor="start">−0.030</text><text class="cap" x="560" y="384" text-anchor="start">0.001</text><text class="cap" x="40" y="406" text-anchor="start">c  0.071</text><text class="cap" x="110" y="406" text-anchor="start">4.73</text><text class="cap" x="196" y="406" text-anchor="start">4</text><text class="cap" x="300" y="406" text-anchor="start">0110</text><text class="cap" x="396" y="406" text-anchor="start">0.060</text><text class="cap" x="560" y="406" text-anchor="start">0.011</text><text class="sub2" x="40" y="438" text-anchor="start">stored: 16 codes × 4 bits + one 8-bit scale = 72 bits, 4.5 bits a weight</text><text class="cap" x="40" y="484" text-anchor="start">A 4-bit float has one sign bit, two exponent bits and one mantissa bit ({{fig:v04-o028}}). Its sixteen codes</text><text class="cap" x="40" y="504" text-anchor="start">decode to fifteen values, because +0 and −0 are the same number: 0, 0.5, 1, 1.5, 2, 3, 4 and 6, and</text><text class="cap" x="40" y="524" text-anchor="start">their negatives. The gaps widen as the values grow.</text><text class="cap" x="40" y="564" text-anchor="start">Trained weights are far smaller than 6, so each block of 16 shares one scale: the block's largest</text><text class="cap" x="40" y="584" text-anchor="start">magnitude divided by 6, here 0.090 ÷ 6 = 0.015 ({{fig:v04-o034}}). Each weight is divided by the scale,</text><text class="cap" x="40" y="604" text-anchor="start">rounded to the nearest of the fifteen values, and that value's 4-bit code is stored beside the scale</text><text class="cap" x="40" y="624" text-anchor="start">({{fig:v04-o075}}).</text><text class="cap" x="40" y="664" text-anchor="start">Weight c lands at 4.73, in the wide gap between 4 and 6, and rounds down to 4. Rebuilt, it is 0.060,</text><text class="cap" x="40" y="684" text-anchor="start">off by 0.011, the largest error in the block. Counting the scale, the block costs 4.5 bits a weight</text><text class="cap" x="40" y="704" text-anchor="start">({{fig:v04-o058}}).</text></svg><figcaption>Fifteen values are enough because the shared scale moves them to wherever the block's weights live. Weights illustrative; in practice the scale is itself stored as an 8-bit float, so it is rounded slightly too.</figcaption></figure>
