/><text class="sub" x="347.0" y="281.0" text-anchor="middle" dominant-baseline="central">44</text></g><g class="h"><rect x="376" y="268" width="50" height="26" rx="3"/><text class="sub" x="401.0" y="281.0" text-anchor="middle" dominant-baseline="central">38</text></g><g class="h"><rect x="430" y="268" width="50" height="26" rx="3"/><text class="sub" x="455.0" y="281.0" text-anchor="middle" dominant-baseline="central">41</text></g><g class="s"><rect x="484" y="268" width="50" height="26" rx="3"/><text class="sub" x="509.0" y="281.0" text-anchor="middle" dominant-baseline="central">39</text></g><g class="h"><rect x="538" y="268" width="50" height="26" rx="3"/><text class="sub" x="563.0" y="281.0" text-anchor="middle" dominant-baseline="central">39</text></g><text class="cap" x="40" y="316" text-anchor="start">from GPU 8</text><g class="h"><rect x="160" y="298" width="50" height="26" rx="3"/><text class="sub" x="185.0" y="311.0" text-anchor="middle" dominant-baseline="central">46</text></g><g class="h"><rect x="214" y="298" width="50" height="26" rx="3"/><text class="sub" x="239.0" y="311.0" text-anchor="middle" dominant-baseline="central">46</text></g><g class="h"><rect x="268" y="298" width="50" height="26" rx="3"/><text class="sub" x="293.0" y="311.0" text-anchor="middle" dominant-baseline="central">40</text></g><g class="h"><rect x="322" y="298" width="50" height="26" rx="3"/><text class="sub" x="347.0" y="311.0" text-anchor="middle" dominant-baseline="central">39</text></g><g class="h"><rect x="376" y="298" width="50" height="26" rx="3"/><text class="sub" x="401.0" y="311.0" text-anchor="middle" dominant-baseline="central">47</text></g><g class="h"><rect x="430" y="298" width="50" height="26" rx="3"/><text class="sub" x="455.0" y="311.0" text-anchor="middle" dominant-baseline="central">39</text></g><g class="h"><rect x="484" y="298" width="50" height="26" rx="3"/><text class="sub" x="509.0" y="311.0" text-anchor="middle" dominant-baseline="central">44</text></g><g class="s"><rect x="538" y="298" width="50" height="26" rx="3"/><text class="sub" x="563.0" y="311.0" text-anchor="middle" dominant-baseline="central">42</text></g><text class="sub2" x="160" y="340" text-anchor="start">teal: stays on its own GPU, 340 of 2,689 copies (12.6%); red: crosses the fabric</text><text class="cap" x="40" y="384" text-anchor="start">A token's eight experts sit on several GPUs, so its vector is copied to every GPU that holds one of</text><text class="cap" x="40" y="404" text-anchor="start">them: dispatch. The experts run, and their answers travel back to the token's own GPU to be</text><text class="cap" x="40" y="424" text-anchor="start">blended: combine ({{fig:v05-o016}}). Every GPU sends to every other, twice in every layer.</text><text class="cap" x="40" y="464" text-anchor="start">In this random draw a token's eight experts landed on 5.25 different GPUs on average, and only</text><text class="cap" x="40" y="484" text-anchor="start">about one copy in eight stayed home. The router redraws the pattern for every batch, so the traffic</text><text class="cap" x="40" y="504" text-anchor="start">cannot be planned ahead.</text><text class="cap" x="40" y="544" text-anchor="start">At 0.9 TB/s each way per GPU ({{fig:v09-n03}}) this exchange can stay inside the rack. Spread across</text><text class="cap" x="40" y="564" text-anchor="start">separate machines, it can take over 70% of a mixture-of-experts layer's time ({{fig:v05-o017}}).</text></svg><figcaption>No cell is empty: every pair of GPUs trades tokens in every mixture-of-experts layer, so the slowest link sets the pace. Counts from one random draw, illustrative.</figcaption></figure>
