<figure><div class='ts'>Fig 05 &nbsp;&middot;&nbsp; 1:38</div><h3>1,250 operations per byte</h3><svg viewBox="0 0 680 496" role="img"><title>1,250 operations per byte</title><text class="cap" x="40" y="78" text-anchor="start">Arithmetic</text><g class="m"><rect x="280" y="62" width="340" height="32" rx="3"></rect><text class="sub" x="450.0" y="78.0" text-anchor="middle" dominant-baseline="central">10 quadrillion 4-bit operations per second</text></g><text class="cap" x="40" y="138" text-anchor="start">Memory</text><g class="h"><rect x="280" y="122" width="272" height="32" rx="3"></rect><text class="sub" x="416.0" y="138.0" text-anchor="middle" dominant-baseline="central">about 8 terabytes per second</text></g><g class="s"><rect x="190" y="174" width="300" height="42" rx="6"></rect><text class="sub" x="340.0" y="195.0" text-anchor="middle" dominant-baseline="central">10e15 / 8e12  =  1,250</text></g><text class="cap" x="40" y="256" text-anchor="start">The arithmetic units need 1,250 operations from every byte fetched to stay busy.</text><text class="hd" x="40" y="306">Now count what a byte can offer</text><g class="u"><rect x="60" y="326" width="120" height="34" rx="4"></rect><text class="sub" x="120.0" y="343.0" text-anchor="middle" dominant-baseline="central">one byte</text></g><line class="conn" x1="186" y1="343" x2="206" y2="343" marker-end="url(#arw)"></line><g class="u"><rect x="212" y="326" width="190" height="34" rx="4"></rect><text class="sub" x="307.0" y="343.0" text-anchor="middle" dominant-baseline="central">two 4-bit weights</text></g><line class="conn" x1="408" y1="343" x2="428" y2="343" marker-end="url(#arw)"></line><g class="m"><rect x="434" y="326" width="206" height="34" rx="4"></rect><text class="sub" x="537.0" y="343.0" text-anchor="middle" dominant-baseline="central">four operations, multiply and add</text></g><text class="cap" x="40" y="414" text-anchor="start">Four against 1,250. Getting there means the same byte has to serve roughly 300 tokens before</text><text class="cap" x="40" y="434" text-anchor="start">the chip lets it go.</text><text class="cap" x="40" y="474" text-anchor="start">That gap is the memory wall. Newer hardware, smaller numbers, same ratio.</text></svg><figcaption>Note the advertised rate is twice this, counting a sparsity mode that skips zeroed weights, which this workload does not use.</figcaption></figure>
