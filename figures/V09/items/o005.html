ght="8" rx="1"/></g><g class="u"><rect x="420" y="542" width="8" height="8" rx="1"/></g><g class="u"><rect x="430" y="542" width="8" height="8" rx="1"/></g><g class="u"><rect x="440" y="542" width="8" height="8" rx="1"/></g><g class="u"><rect x="450" y="542" width="8" height="8" rx="1"/></g><g class="u"><rect x="460" y="542" width="8" height="8" rx="1"/></g><g class="u"><rect x="470" y="542" width="8" height="8" rx="1"/></g><g class="u"><rect x="480" y="542" width="8" height="8" rx="1"/></g><g class="u"><rect x="490" y="542" width="8" height="8" rx="1"/></g><g class="u"><rect x="500" y="542" width="8" height="8" rx="1"/></g><g class="u"><rect x="510" y="542" width="8" height="8" rx="1"/></g><g class="u"><rect x="520" y="542" width="8" height="8" rx="1"/></g><g class="u"><rect x="530" y="542" width="8" height="8" rx="1"/></g><g class="u"><rect x="540" y="542" width="8" height="8" rx="1"/></g><g class="u"><rect x="550" y="542" width="8" height="8" rx="1"/></g><g class="u"><rect x="560" y="542" width="8" height="8" rx="1"/></g><g class="u"><rect x="570" y="542" width="8" height="8" rx="1"/></g><g class="u"><rect x="580" y="542" width="8" height="8" rx="1"/></g><text class="sub2" x="90" y="568" text-anchor="start">4 of 1,250 is 0.32%: the share of the arithmetic one token keeps busy</text><text class="cap" x="40" y="612" text-anchor="start">A Blackwell GPU in this rack does 10 quadrillion 4-bit operations a second: 10 × 10¹⁵, a one followed</text><text class="cap" x="40" y="632" text-anchor="start">by sixteen zeros ({{fig:v01-o062}}). The rate is for 4-bit numbers. Narrower numbers run faster, so the</text><text class="cap" x="40" y="652" text-anchor="start">same chip does fewer operations a second at 16 bits ({{fig:v02-o084}}).</text><text class="cap" x="40" y="692" text-anchor="start">It pulls about 8 terabytes a second out of its own memory. Dividing one rate by the other cancels the</text><text class="cap" x="40" y="712" text-anchor="start">seconds and leaves operations per byte ({{fig:v01-o065}}): 1,250. That is this chip's ridge ({{fig:v01-o126}}). A</text><text class="cap" x="40" y="732" text-anchor="start">workload that does fewer operations per byte leaves the arithmetic waiting on memory.</text><text class="cap" x="40" y="772" text-anchor="start">A byte holds two 4-bit weights, and each is multiplied and added once per token, which counts as</text><text class="cap" x="40" y="792" text-anchor="start">two operations ({{fig:v01-o111}}). So a byte offers four operations to each token that uses it. To light all</text><text class="cap" x="40" y="812" text-anchor="start">1,250 cells, the same byte has to serve roughly 300 tokens before the chip lets it go.</text></svg><figcaption>That gap is the memory wall of the first episode, in new numbers. NVIDIA advertises twice this rate by counting a sparsity mode, which this workload does not use (next figure).</figcaption></figure>
