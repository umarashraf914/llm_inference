<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:58</div><h3>The tool call is a JSON object, and the model writes it in tokens, not characters</h3><svg viewBox='0 0 680 550' role='img'><title>The tool call is a JSON object, and the model writes it in tokens, not characters</title><text class="hd" x="40" y="46">The call as characters: what the parser reads</text><g class="u"><text class="sub" x="40" y="80" style="white-space:pre">{"name": "edit_file", "arguments": {"path": "parser.py", "find": "a - b", "replace": "a + b"}}</text></g><text class="sub2" x="40" y="100" text-anchor="start">94 characters: braces open and close objects, quoted field names, colons, values, commas</text><text class="hd" x="40" y="146">The same call as the model writes it: 33 tokens, cut as a tokenizer might</text><g class="u"><rect x="40" y="162" width="19" height="26" rx="3"/><text class="sub" x="49.5" y="175.0" text-anchor="middle" dominant-baseline="central">{</text></g><g class="u"><rect x="64" y="162" width="49" height="26" rx="3"/><text class="sub" x="88.5" y="175.0" text-anchor="middle" dominant-baseline="central">"name</text></g><g class="u"><rect x="118" y="162" width="23" height="26" rx="3"/><text class="sub" x="129.5" y="175.0" text-anchor="middle" dominant-baseline="central">":</text></g><g class="u"><rect x="146" y="162" width="26" height="26" rx="3"/><text class="sub" x="159.0" y="175.0" text-anchor="middle" dominant-baseline="central">␣"</text></g><g class="m"><rect x="177" y="162" width="34" height="26" rx="3"/><text class="sub" x="194.0" y="175.0" text-anchor="middle" dominant-baseline="central">edit</text></g><g class="m"><rect x="216" y="162" width="35" height="26" rx="3"/><text class="sub" x="233.5" y="175.0" text-anchor="middle" dominant-baseline="central">_file</text></g><g class="u"><rect x="256" y="162" width="23" height="26" rx="3"/><text class="sub" x="267.5" y="175.0" text-anchor="middle" dominant-baseline="central">",</text></g><g class="u"><rect x="284" y="162" width="26" height="26" rx="3"/><text class="sub" x="297.0" y="175.0" text-anchor="middle" dominant-baseline="central">␣"</text></g><g class="u"><rect x="315" y="162" width="72" height="26" rx="3"/><text class="sub" x="351.0" y="175.0" text-anchor="middle" dominant-baseline="central">arguments</text></g><g class="u"><rect x="392" y="162" width="23" height="26" rx="3"/><text class="sub" x="403.5" y="175.0" text-anchor="middle" dominant-baseline="central">":</text></g><g class="u"><rect x="420" y="162" width="31" height="26" rx="3"/><text class="sub" x="435.5" y="175.0" text-anchor="middle" dominant-baseline="central">␣{"</text></g><g class="u"><rect x="456" y="162" width="38" height="26" rx="3"/><text class="sub" x="475.0" y="175.0" text-anchor="middle" dominant-baseline="central">path</text></g><g class="u"><rect x="499" y="162" width="23" height="26" rx="3"/><text class="sub" x="510.5" y="175.0" text-anchor="middle" dominant-baseline="central">":</text></g><g class="u"><rect x="527" y="162" width="26" height="26" rx="3"/><text class="sub" x="540.0" y="175.0" text-anchor="middle" dominant-baseline="central">␣"</text></g><g class="m"><rect x="558" y="162" width="49" height="26" rx="3"/><text class="sub" x="582.5" y="175.0" text-anchor="middle" dominant-baseline="central">parser</text></g><g class="m"><rect x="40" y="196" width="31" height="26" rx="3"/><text class="sub" x="55.5" y="209.0" text-anchor="middle" dominant-baseline="central">.py</text></g><g class="u"><rect x="76" y="196" width="23" height="26" rx="3"/><text class="sub" x="87.5" y="209.0" text-anchor="middle" dominant-baseline="central">",</text></g><g class="u"><rect x="104" y="196" width="26" height="26" rx="3"/><text class="sub" x="117.0" y="209.0" text-anchor="middle" dominant-baseline="central">␣"</text></g><g class="u"><rect x="135" y="196" width="34" height="26" rx="3"/><text class="sub" x="152.0" y="209.0" text-anchor="middle" dominant-baseline="central">find</text></g><g class="u"><rect x="174" y="196" width="23" height="26" rx="3"/><text class="sub" x="185.5" y="209.0" text-anchor="middle" dominant-baseline="central">":</text></g><g class="u"><rect x="202" y="196" width="26" height="26" rx="3"/><text class="sub" x="215.0" y="209.0" text-anchor="middle" dominant-baseline="central">␣"</text></g><g class="m"><rect x="233" y="196" width="20" height="26" rx="3"/><text class="sub" x="243.0" y="209.0" text-anchor="middle" dominant-baseline="central">a</text></g><g class="m"><rect x="258" y="196" width="26" height="26" rx="3"/><text class="sub" x="271.0" y="209.0" text-anchor="middle" dominant-baseline="central">␣-</text></g><g class="m"><rect x="289" y="196" width="28" height="26" rx="3"/><text class="sub" x="303.0" y="209.0" text-anchor="middle" dominant-baseline="central">␣b</text></g><g class="u"><rect x="322" y="196" width="23" height="26" rx="3"/><text class="sub" x="333.5" y="209.0" text-anchor="middle" dominant-baseline="central">",</text></g><g class="u"><rect x="350" y="196" width="26" height="26" rx="3"/><text class="sub" x="363.0" y="209.0" text-anchor="middle" dominant-baseline="central">␣"</text></g><g class="u"><rect x="381" y="196" width="55" height="26" rx="3"/><text class="sub" x="408.5" y="209.0" text-anchor="middle" dominant-baseline="central">replace</text></g><g class="u"><rect x="441" y="196" width="23" height="26" rx="3"/><text class="sub" x="452.5" y="209.0" text-anchor="middle" dominant-baseline="central">":</text></g><g class="u"><rect x="469" y="196" width="26" height="26" rx="3"/><text class="sub" x="482.0" y="209.0" text-anchor="middle" dominant-baseline="central">␣"</text></g><g class="m"><rect x="500" y="196" width="20" height="26" rx="3"/><text class="sub" x="510.0" y="209.0" text-anchor="middle" dominant-baseline="central">a</text></g><g class="m"><rect x="525" y="196" width="28" height="26" rx="3"/><text class="sub" x="539.0" y="209.0" text-anchor="middle" dominant-baseline="central">␣+</text></g><g class="m"><rect x="558" y="196" width="28" height="26" rx="3"/><text class="sub" x="572.0" y="209.0" text-anchor="middle" dominant-baseline="central">␣b</text></g><g class="u"><rect x="591" y="196" width="29" height="26" rx="3"/><text class="sub" x="605.5" y="209.0" text-anchor="middle" dominant-baseline="central">"}}</text></g><g class="u"><rect x="40" y="244" width="14" height="12" rx="2"/></g><text class="sub2" x="62" y="254" text-anchor="start">fixed by the format: 23 tokens</text><g class="m"><rect x="280" y="244" width="14" height="12" rx="2"/></g><text class="sub2" x="302" y="254" text-anchor="start">chosen by the model: 10 tokens</text><text class="sub2" x="40" y="276" text-anchor="start">␣ marks a space that is part of a token</text><text class="cap" x="40" y="320" text-anchor="start">JSON writes structured data as text. Braces open and close an object; inside, each field is a name in</text><text class="cap" x="40" y="340" text-anchor="start">quotes, a colon and a value, with commas between fields. Software can parse the call only if every</text><text class="cap" x="40" y="360" text-anchor="start">brace and quote is where the format says.</text><text class="cap" x="40" y="400" text-anchor="start">The model does not write characters, though. It writes tokens ({{fig:v01-o006}}), and a token can hold a</text><text class="cap" x="40" y="420" text-anchor="start">space and a quote together, or half a word: edit_file arrives as edit and _file. So 'only valid text' has</text><text class="cap" x="40" y="440" text-anchor="start">to be turned into 'only tokens whose characters keep the text valid', checked token by token.</text><text class="cap" x="40" y="480" text-anchor="start">Twenty-three of the 33 tokens are forced by the format. The other ten carry the content, the tool's</text><text class="cap" x="40" y="500" text-anchor="start">name and the arguments' values, and they are where the model's judgement shows. The cut is</text><text class="cap" x="40" y="520" text-anchor="start">illustrative: the real one depends on the model's tokenizer.</text></svg><figcaption>The format is checked in characters, but the model chooses in tokens. Most of a call is scaffolding the format dictates; the content is a handful of tokens.</figcaption></figure>
