<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:12</div><h3>Seventy kilobytes a token: what one prompt makes, and what 12.9 terabytes holds</h3><svg viewBox='0 0 680 526' role='img'><title>Seventy kilobytes a token: what one prompt makes, and what 12.9 terabytes holds</title><text class="hd" x="40" y="46">Cache made by one prompt, at 70,272 bytes a token, to scale</text><text class="cap" x="40" y="86" text-anchor="start">2,000 tokens</text><g class="u"><rect x="170" y="68" width="158.112" height="26" rx="3"/><text class="sub" x="249.05599999999998" y="81.0" text-anchor="middle" dominant-baseline="central">141 MB</text></g><text class="cap" x="40" y="122" text-anchor="start">3,000 tokens</text><g class="u"><rect x="170" y="104" width="237.168" height="26" rx="3"/><text class="sub" x="288.584" y="117.0" text-anchor="middle" dominant-baseline="central">211 MB</text></g><text class="cap" x="40" y="158" text-anchor="start">4,000 tokens</text><g class="h"><rect x="170" y="140" width="316.224" height="26" rx="3"/><text class="sub" x="328.11199999999997" y="153.0" text-anchor="middle" dominant-baseline="central">281 MB</text></g><text class="cap" x="40" y="194" text-anchor="start">5,000 tokens</text><g class="u"><rect x="170" y="176" width="395.28000000000003" height="26" rx="3"/><text class="sub" x="367.64" y="189.0" text-anchor="middle" dominant-baseline="central">351 MB</text></g><line class="axis" x1="170" y1="214" x2="620" y2="214"/><line class="tick" x1="170.0" y1="214" x2="170.0" y2="218"/><text class="sub2" x="170.0" y="232" text-anchor="middle">0 MB</text><line class="tick" x1="282.5" y1="214" x2="282.5" y2="218"/><text class="sub2" x="282.5" y="232" text-anchor="middle">100 MB</text><line class="tick" x1="395.0" y1="214" x2="395.0" y2="218"/><text class="sub2" x="395.0" y="232" text-anchor="middle">200 MB</text><line class="tick" x1="507.5" y1="214" x2="507.5" y2="218"/><text class="sub2" x="507.5" y="232" text-anchor="middle">300 MB</text><line class="tick" x1="620.0" y1="214" x2="620.0" y2="218"/><text class="sub2" x="620.0" y="232" text-anchor="middle">400 MB</text><text class="hd" x="40" y="278">And what the rack's spare memory holds</text><g class="u"><rect x="40" y="294" width="150" height="36" rx="6"/><text class="sub" x="115.0" y="312.0" text-anchor="middle" dominant-baseline="central">12.9 TB of memory</text></g><text class="sub2" x="204" y="316" text-anchor="middle">÷</text><g class="u"><rect x="218" y="294" width="160" height="36" rx="6"/><text class="sub" x="298.0" y="312.0" text-anchor="middle" dominant-baseline="central">70,272 bytes a token</text></g><text class="sub2" x="392" y="316" text-anchor="middle">=</text><g class="s"><rect x="406" y="294" width="160" height="36" rx="6"/><text class="sub" x="486.0" y="312.0" text-anchor="middle" dominant-baseline="central">183.6 million tokens</text></g><text class="sub2" x="40" y="352" text-anchor="start">about 45,900 conversations of 4,000 tokens, held at once</text><text class="cap" x="40" y="396" text-anchor="start">A prompt of a few thousand tokens makes a cache of a few hundred megabytes: this one's 4,000</text><text class="cap" x="40" y="416" text-anchor="start">tokens make 281 MB, and that is what the handoff has to move.</text><text class="cap" x="40" y="456" text-anchor="start">Turned around, the 12.9 terabytes the weights leave free ({{fig:v09-o004}}) hold the caches of about</text><text class="cap" x="40" y="476" text-anchor="start">46,000 such conversations at once. That is an upper bound: the rack's memory is shared between</text><text class="cap" x="40" y="496" text-anchor="start">the prefill and decode pools, and the computation itself needs room too.</text></svg><figcaption>Bars to scale. Per conversation the cache is small; tens of thousands of conversations at once are what fill the rack.</figcaption></figure>
