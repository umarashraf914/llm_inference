<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:48</div><h3>The gateway looks the prompt up in a table of which machine holds which prefix</h3><svg viewBox='0 0 680 546' role='img'><title>The gateway looks the prompt up in a table of which machine holds which prefix</title><text class="hd" x="40" y="46">The gateway's table: what each machine holds, compared from token 0</text><text class="cap" x="40" y="87" text-anchor="start">this request</text><g class="s"><rect x="150" y="70" width="146.25" height="24" rx="3"/><text class="sub" x="223.125" y="82.0" text-anchor="middle" dominant-baseline="central">system prompt</text></g><g class="s"><rect x="296.25" y="70" width="234.0" height="24" rx="3"/><text class="sub" x="413.25" y="82.0" text-anchor="middle" dominant-baseline="central">this conversation</text></g><g class="h"><rect x="530.25" y="70" width="9.75" height="24" rx="3"/></g><text class="sub2" x="550" y="87" text-anchor="start">100 new</text><text class="sub2" x="564" y="110" text-anchor="start">matched</text><text class="cap" x="40" y="137" text-anchor="start">machine A</text><g class="s"><rect x="150.0" y="120" width="146.25" height="24" rx="3"/><text class="sub" x="223.125" y="132.0" text-anchor="middle" dominant-baseline="central">system prompt</text></g><text class="sub2" x="564" y="137" text-anchor="start">1,500</text><text class="cap" x="40" y="171" text-anchor="start">machine B</text><g class="s"><rect x="150.0" y="154" width="146.25" height="24" rx="3"/><text class="sub" x="223.125" y="166.0" text-anchor="middle" dominant-baseline="central">system prompt</text></g><g class="s"><rect x="296.25" y="154" width="234.0" height="24" rx="3"/><text class="sub" x="413.25" y="166.0" text-anchor="middle" dominant-baseline="central">this conversation</text></g><text class="sub2" x="564" y="171" text-anchor="start">3,900</text><text class="cap" x="40" y="205" text-anchor="start">machine C</text><g class="s"><rect x="150.0" y="188" width="146.25" height="24" rx="3"/><text class="sub" x="223.125" y="200.0" text-anchor="middle" dominant-baseline="central">system prompt</text></g><g class="u"><rect x="296.25" y="188" width="165.75" height="24" rx="3"/><text class="sub" x="379.125" y="200.0" text-anchor="middle" dominant-baseline="central">another conversation</text></g><text class="sub2" x="564" y="205" text-anchor="start">1,500</text><text class="cap" x="40" y="239" text-anchor="start">machine D</text><rect x="150" y="222" width="390" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="345.0" y="234.0" text-anchor="middle" dominant-baseline="central">nothing yet: it has just started</text><text class="sub2" x="564" y="239" text-anchor="start">0</text><line class="conn" x1="604" y1="166" x2="622" y2="166" marker-end="url(#arw)"/><text class="hd" x="628" y="170" text-anchor="start">B</text><text class="sub2" x="150" y="270" text-anchor="start">a match runs from token 0 and stops at the first token that differs</text><text class="cap" x="40" y="316" text-anchor="start">The gateway keeps a table of which machine holds which prefix, a run of tokens from the very start</text><text class="cap" x="40" y="336" text-anchor="start">of some earlier prompt, kept up to date as caches fill and empty. Keeping that table across a fleet is</text><text class="cap" x="40" y="356" text-anchor="start">the orchestration layer's job ({{fig:v07-o015}}).</text><text class="cap" x="40" y="396" text-anchor="start">To route, it compares this request with each machine's prefixes from token 0 and stops at the first</text><text class="cap" x="40" y="416" text-anchor="start">token that differs ({{fig:v01-o044}}). Every machine holds the shared system prompt, because every user</text><text class="cap" x="40" y="436" text-anchor="start">sends it ({{fig:v01-o026}}). Only machine B also holds this conversation: it prefilled the earlier turns a</text><text class="cap" x="40" y="456" text-anchor="start">minute ago, when the user asked the previous question.</text><text class="cap" x="40" y="496" text-anchor="start">B still has them because its engine keeps a finished request's cache in a tree of prefixes and evicts</text><text class="cap" x="40" y="516" text-anchor="start">the least recently used only when memory runs short ({{fig:v07-o013}}).</text></svg><figcaption>The longest match wins, and the conversation decides it, since the shared preamble is everywhere. Schematic table; the token counts are Fig 1's, drawn to scale.</figcaption></figure>
