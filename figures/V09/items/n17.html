<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:45</div><h3>Token two waits for the cache to land</h3><svg viewBox='0 0 680 408' role='img'><title>Token two waits for the cache to land</title><text class="hd" x="40" y="46">Four lanes, schematic times: the cache crosses between token 1 and token 2</text><text class="cap" x="40" y="88" text-anchor="start">prefill machine</text><text class="cap" x="40" y="128" text-anchor="start">network</text><text class="cap" x="40" y="168" text-anchor="start">decode machine</text><text class="cap" x="40" y="208" text-anchor="start">the user</text><g class="m"><rect x="170" y="70" width="160" height="26" rx="3"/><text class="sub" x="250.0" y="83.0" text-anchor="middle" dominant-baseline="central">prefill: 100 new tokens</text></g><g class="h"><rect x="334" y="110" width="102" height="26" rx="3"/><text class="sub" x="385.0" y="123.0" text-anchor="middle" dominant-baseline="central">cache crosses</text></g><rect x="170" y="150" width="266" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="303.0" y="163.0" text-anchor="middle" dominant-baseline="central">nothing to do yet</text><g class="m"><rect x="436" y="150" width="28" height="26" rx="3"/></g><g class="m"><rect x="470" y="150" width="28" height="26" rx="3"/></g><g class="m"><rect x="504" y="150" width="28" height="26" rx="3"/></g><g class="m"><rect x="538" y="150" width="28" height="26" rx="3"/></g><g class="m"><rect x="572" y="150" width="28" height="26" rx="3"/></g><g class="m"><rect x="606" y="150" width="28" height="26" rx="3"/></g><g class="s"><rect x="334" y="190" width="18" height="26" rx="3"/><text class="sub" x="343.0" y="203.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="468" y="190" width="18" height="26" rx="3"/><text class="sub" x="477.0" y="203.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="s"><rect x="502" y="190" width="18" height="26" rx="3"/><text class="sub" x="511.0" y="203.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="s"><rect x="536" y="190" width="18" height="26" rx="3"/><text class="sub" x="545.0" y="203.0" text-anchor="middle" dominant-baseline="central">4</text></g><g class="s"><rect x="570" y="190" width="18" height="26" rx="3"/><text class="sub" x="579.0" y="203.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="s"><rect x="604" y="190" width="18" height="26" rx="3"/><text class="sub" x="613.0" y="203.0" text-anchor="middle" dominant-baseline="central">6</text></g><text class="sub2" x="252.0" y="234" text-anchor="middle">the first token</text><text class="sub2" x="410.0" y="234" text-anchor="middle">token 2 waits</text><text class="sub2" x="563.0" y="234" text-anchor="middle">one step per token</text><text class="cap" x="40" y="278" text-anchor="start">Prefill's last layer gives the first token, and it streams straight to the user ({{fig:v01-o058}}). The second</text><text class="cap" x="40" y="298" text-anchor="start">token cannot start until the decode machine holds the cache, because writing it means attending to</text><text class="cap" x="40" y="318" text-anchor="start">the keys and values of every token before it ({{fig:v01-o136}}).</text><text class="cap" x="40" y="358" text-anchor="start">So the transfer sits between the first token and the second. It is paid once per request, in the first</text><text class="cap" x="40" y="378" text-anchor="start">gap the user sees; after it, tokens arrive at decode's own pace. Two figures on, it gets a price.</text></svg><figcaption>Schematic times. The handoff does not slow the stream; it delays its second token, once.</figcaption></figure>
