="3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="364.0" y="82" text-anchor="middle" dominant-baseline="central">?</text></g><g class="x" data-c="0-7"><rect x="390" y="68" width="48" height="28" rx="3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="414.0" y="82" text-anchor="middle" dominant-baseline="central">?</text></g><g class="x" data-c="0-8"><rect x="440" y="68" width="48" height="28" rx="3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="464.0" y="82" text-anchor="middle" dominant-baseline="central">?</text></g><g class="x" data-c="0-9"><rect x="490" y="68" width="48" height="28" rx="3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="514.0" y="82" text-anchor="middle" dominant-baseline="central">?</text></g><g class="x" data-c="0-10"><rect x="540" y="68" width="48" height="28" rx="3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="564.0" y="82" text-anchor="middle" dominant-baseline="central">?</text></g><g class="x" data-c="0-11"><rect x="590" y="68" width="48" height="28" rx="3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="614.0" y="82" text-anchor="middle" dominant-baseline="central">?</text></g><text class="sub2" x="40" y="118" data-r="0">0 of 12 positions filled, 0 weight reads</text><text class="cap" x="40" y="152" text-anchor="start">three positions per pass</text><g class="x" data-c="1-0"><rect x="40" y="164" width="48" height="28" rx="3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="64.0" y="178" text-anchor="middle" dominant-baseline="central">?</text></g><g class="x" data-c="1-1"><rect x="90" y="164" width="48" height="28" rx="3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="114.0" y="178" text-anchor="middle" dominant-baseline="central">?</text></g><g class="x" data-c="1-2"><rect x="140" y="164" width="48" height="28" rx="3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="164.0" y="178" text-anchor="middle" dominant-baseline="central">?</text></g><g class="x" data-c="1-3"><rect x="190" y="164" width="48" height="28" rx="3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="214.0" y="178" text-anchor="middle" dominant-baseline="central">?</text></g><g class="x" data-c="1-4"><rect x="240" y="164" width="48" height="28" rx="3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="264.0" y="178" text-anchor="middle" dominant-baseline="central">?</text></g><g class="x" data-c="1-5"><rect x="290" y="164" width="48" height="28" rx="3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="314.0" y="178" text-anchor="middle" dominant-baseline="central">?</text></g><g class="x" data-c="1-6"><rect x="340" y="164" width="48" height="28" rx="3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="364.0" y="178" text-anchor="middle" dominant-baseline="central">?</text></g><g class="x" data-c="1-7"><rect x="390" y="164" width="48" height="28" rx="3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="414.0" y="178" text-anchor="middle" dominant-baseline="central">?</text></g><g class="x" data-c="1-8"><rect x="440" y="164" width="48" height="28" rx="3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="464.0" y="178" text-anchor="middle" dominant-baseline="central">?</text></g><g class="x" data-c="1-9"><rect x="490" y="164" width="48" height="28" rx="3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="514.0" y="178" text-anchor="middle" dominant-baseline="central">?</text></g><g class="x" data-c="1-10"><rect x="540" y="164" width="48" height="28" rx="3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="564.0" y="178" text-anchor="middle" dominant-baseline="central">?</text></g><g class="x" data-c="1-11"><rect x="590" y="164" width="48" height="28" rx="3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="614.0" y="178" text-anchor="middle" dominant-baseline="central">?</text></g><text class="sub2" x="40" y="214" data-r="1">0 of 12 positions filled, 0 weight reads</text><text class="cap" x="40" y="278" text-anchor="start">Press Next to run one pass. The top row fills one position per pass, left to right, as every model in</text><text class="cap" x="40" y="298" text-anchor="start">this series does. The bottom row fills the three positions it is most sure of in each pass, wherever</text><text class="cap" x="40" y="318" text-anchor="start">they are, and is done after four passes, when the top row has filled four positions of twelve.</text><text class="cap" x="40" y="358" text-anchor="start">Each pass is one read of the weights, so the bottom row's answer costs four reads instead of</text><text class="cap" x="40" y="378" text-anchor="start">twelve. The order of filling is illustrative; the counting was checked against Python.</text></svg></div><figcaption>The diffusion row is done while the ordinary one is a third of the way through. The cost is hidden in each pass, which has to compute every position, filled or not.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const W = ["it", "should", "add", "a", "and", "b", "but", "it", "takes", "b", "from", "a"], P = [[1, 2, 8], [0, 3, 5], [9, 10, 11], [4, 6, 7]], N = 12;
  const q = s => fig.querySelector(s), qa = s => [...fig.querySelectorAll(s)];
  let k = 0;
  function cellState(row, i) {                       // 0 masked, 1 filled earlier, 2 filled this pass
    if (row === 0) return i < k ? (i === k - 1 ? 2 : 1) : 0;
    let before = new Set(), now = new Set();
    for (let j = 0; j < Math.min(k, P.length); j++) {
      const into = (j === k - 1) ? now : before; P[j].forEach(p => into.add(p)); }
    return now.has(i) ? 2 : (before.has(i) ? 1 : 0);
  }
  function draw() {
    for (let row = 0; row < 2; row++) for (let i = 0; i < N; i++) {
      const st = cellState(row, i), g = q(`[data-c="${row}-${i}"]`);
      g.setAttribute('class', ['x', 'u', 'm'][st]);
      g.querySelector('rect').setAttribute('style', st ? '' : 'fill:none;stroke:var(--rule);stroke-dasharray:3 3');
      g.querySelector('text').textContent = st ? W[i] : '?';
    }
    const reads = [Math.min(k, N), Math.min(k, P.length)], filled = [Math.min(k, N), 3 * Math.min(k, P.length)];
    q('[data-k]').textContent = k === 0 ? 'before the first pass' : `after pass ${k}`;
    for (let r = 0; r < 2; r++) q(`[data-r="${r}"]`).textContent =
      `${filled[r]} of 12 positions filled, ${reads[r]} weight read${reads[r] === 1 ? '' : 's'}` + (filled[r] === N ? ': done' : '');
    const bs = qa('button'); bs[0].disabled = k === 0; bs[1].disabled = k === N;
  }
  const bs = qa('button');
  bs[0].addEventListener('click', () => { if (k > 0) { k--; draw(); } });
  bs[1].addEventListener('click', () => { if (k < N) { k++; draw(); } });
  bs[2].addEventListener('click', () => { k = 0; draw(); });
  draw();
})();</script></figure>
