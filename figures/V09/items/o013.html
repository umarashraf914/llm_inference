<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 7:17</div><h3>What the user sees: one pause, then a cadence</h3><svg viewBox='0 0 680 398' role='img'><title>What the user sees: one pause, then a cadence</title><text class="hd" x="40" y="46">One request as the user sees it, schematic</text><line class="axis" x1="40" y1="112" x2="640" y2="112"/><g class="u"><rect x="40" y="96" width="26" height="32" rx="3"/></g><g class="m"><rect x="66" y="96" width="150" height="32" rx="3"/><text class="sub" x="141.0" y="112.0" text-anchor="middle" dominant-baseline="central">prefill</text></g><g class="s"><rect x="222" y="96" width="18" height="32" rx="3"/></g><g class="s"><rect x="312" y="96" width="18" height="32" rx="3"/></g><g class="s"><rect x="350" y="96" width="18" height="32" rx="3"/></g><g class="s"><rect x="388" y="96" width="18" height="32" rx="3"/></g><g class="s"><rect x="426" y="96" width="18" height="32" rx="3"/></g><g class="s"><rect x="464" y="96" width="18" height="32" rx="3"/></g><g class="s"><rect x="502" y="96" width="18" height="32" rx="3"/></g><g class="h"><rect x="244" y="100" width="64" height="24" rx="3"/><text class="sub" x="276.0" y="112.0" text-anchor="middle" dominant-baseline="central">cache</text></g><line class="conn" x1="526" y1="112" x2="550" y2="112" marker-end="url(#arw)"/><g class="u"><rect x="556" y="96" width="84" height="32" rx="3"/><text class="sub" x="598.0" y="112.0" text-anchor="middle" dominant-baseline="central">seat freed</text></g><text class="hd" x="40" y="158" text-anchor="start">time to first token</text><text class="sub2" x="40" y="178" text-anchor="start">the gateway, then prefill</text><text class="hd" x="330" y="158" text-anchor="start">time per output token</text><text class="sub2" x="330" y="178" text-anchor="start">each gap: everything decode does fits in one</text><text class="cap" x="40" y="228" text-anchor="start">The wait before the first token is time to first token, and it covers everything from the gateway</text><text class="cap" x="40" y="248" text-anchor="start">through prefill producing that token ({{fig:v01-o143}}). The gap between the tokens after that is time per</text><text class="cap" x="40" y="268" text-anchor="start">output token, and everything decode does happens inside it: the weight read, the cache read, the</text><text class="cap" x="40" y="288" text-anchor="start">batch, the drafts, the mask.</text><text class="cap" x="40" y="328" text-anchor="start">The first gap is longer than the rest by the cache's crossing ({{fig:v09-n17}}). When the last token of the</text><text class="cap" x="40" y="348" text-anchor="start">tool call is sent, the request releases its slot, and the decode machine gives the seat to a request</text><text class="cap" x="40" y="368" text-anchor="start">that was waiting ({{fig:v09-n02}}).</text></svg><figcaption>Schematic: no times are measured here. Everything else in this document is invisible to the person who asked the question.</figcaption></figure>
