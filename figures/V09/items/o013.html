<figure><div class='ts'>Fig 13 &nbsp;&middot;&nbsp; 7:22</div><h3>What the user experienced</h3><svg viewBox="0 0 680 342" role="img"><title>What the user experienced</title><line class="axis" x1="60" y1="110" x2="620" y2="110"></line><g class="h"><rect x="60" y="94" width="200" height="32" rx="4"></rect><text class="sub" x="160.0" y="110.0" text-anchor="middle" dominant-baseline="central">a pause</text></g><g class="s"><rect x="270" y="94" width="32" height="32" rx="3"></rect></g><g class="s"><rect x="310" y="94" width="32" height="32" rx="3"></rect></g><g class="s"><rect x="350" y="94" width="32" height="32" rx="3"></rect></g><g class="s"><rect x="390" y="94" width="32" height="32" rx="3"></rect></g><g class="s"><rect x="430" y="94" width="32" height="32" rx="3"></rect></g><g class="s"><rect x="470" y="94" width="32" height="32" rx="3"></rect></g><g class="s"><rect x="510" y="94" width="32" height="32" rx="3"></rect></g><g class="s"><rect x="550" y="94" width="32" height="32" rx="3"></rect></g><g class="s"><rect x="590" y="94" width="32" height="32" rx="3"></rect></g><text class="hd" x="60" y="160" text-anchor="start">time to first token</text><text class="sub2" x="60" y="182" text-anchor="start">gateway, then prefill producing that token</text><text class="hd" x="270" y="160" text-anchor="start">time per output token</text><text class="sub2" x="270" y="182" text-anchor="start">everything decode does fits in this gap</text><text class="cap" x="40" y="240" text-anchor="start">The two numbers from the first episode, now attached to specific machinery. Everything before</text><text class="cap" x="40" y="260" text-anchor="start">the first token is routing and prefill; everything between tokens is decode.</text><text class="cap" x="40" y="300" text-anchor="start">When the last token of the tool call is sent, the request releases its slot, and the decode</text><text class="cap" x="40" y="320" text-anchor="start">machine gives that slot to a request that was waiting.</text></svg><figcaption>The whole trace, seen from outside: one pause and one cadence. Everything else in this document is invisible to the person who asked the question.</figcaption></figure>
