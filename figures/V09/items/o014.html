<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 7:50</div><h3>The wall is three decades old, and the answers to it date from 2023 and 2024</h3><svg viewBox='0 0 680 580' role='img'><title>The wall is three decades old, and the answers to it date from 2023 and 2024</title><text class="hd" x="40" y="46">Thirty-one years on one axis, to scale</text><line class="axis" x1="60" y1="120" x2="620" y2="120"/><line class="tick" x1="60.0" y1="120" x2="60.0" y2="124"/><text class="sub2" x="60.0" y="138" text-anchor="middle">1995</text><line class="tick" x1="147.5" y1="120" x2="147.5" y2="124"/><text class="sub2" x="147.5" y="138" text-anchor="middle">2000</text><line class="tick" x1="235.0" y1="120" x2="235.0" y2="124"/><text class="sub2" x="235.0" y="138" text-anchor="middle">2005</text><line class="tick" x1="322.5" y1="120" x2="322.5" y2="124"/><text class="sub2" x="322.5" y="138" text-anchor="middle">2010</text><line class="tick" x1="410.0" y1="120" x2="410.0" y2="124"/><text class="sub2" x="410.0" y="138" text-anchor="middle">2015</text><line class="tick" x1="497.5" y1="120" x2="497.5" y2="124"/><text class="sub2" x="497.5" y="138" text-anchor="middle">2020</text><line class="tick" x1="585.0" y1="120" x2="585.0" y2="124"/><text class="sub2" x="585.0" y="138" text-anchor="middle">2025</text><circle cx="62.9" cy="120" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2" x="62.91666666666799" y="106" text-anchor="start">1995: the memory wall named</text><circle cx="452.3" cy="120" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2" x="452.291666666668" y="106" text-anchor="middle">2017: the transformer</text><g class="s"><rect x="560.666666666668" y="112" width="13.666666666664014" height="16" rx="2"/></g><text class="sub2" x="581.333333333332" y="106" text-anchor="start">2023-24</text><g class="h"><rect x="62.91666666666799" y="160" width="498.75" height="24" rx="3"/><text class="sub" x="312.291666666668" y="172.0" text-anchor="middle" dominant-baseline="central">28.5 years from naming the wall to the first answer</text></g><g class="s"><rect x="561.666666666668" y="192" width="11.666666666664014" height="24" rx="3"/></g><text class="sub2" x="551.666666666668" y="209" text-anchor="end">8 months from the first answer to the last</text><text class="cap" x="300" y="246" text-anchor="start">the four answers</text><text class="sub2" x="300" y="264" text-anchor="start">paged attention: September 2023</text><text class="sub2" x="300" y="284" text-anchor="start">4-bit microscaled formats: October 2023</text><text class="sub2" x="300" y="304" text-anchor="start">prefill and decode split: November 2023 and January 2024</text><text class="sub2" x="300" y="324" text-anchor="start">latent attention: May 2024</text><text class="cap" x="40" y="370" text-anchor="start">Most of the stack this series described did not exist five years ago. Paged caches, latent attention,</text><text class="cap" x="40" y="390" text-anchor="start">the split between prefill and decode, and 4-bit microscaled numbers were all published in 2023 and</text><text class="cap" x="40" y="410" text-anchor="start">2024, within eight months of one another.</text><text class="cap" x="40" y="450" text-anchor="start">The memory wall they answer was named in 1995 ({{fig:v01-o082}}), more than twenty years before the</text><text class="cap" x="40" y="470" text-anchor="start">transformer, the model design this whole series runs on, existed. The trend was there all along.</text><text class="cap" x="40" y="490" text-anchor="start">What changed was a workload hungry enough for bytes to make it the dominant concern.</text><text class="cap" x="40" y="530" text-anchor="start">Inference is forecast to reach about two thirds of all AI compute in 2026, up from a third in 2023 and</text><text class="cap" x="40" y="550" text-anchor="start">half in 2025. That is Deloitte's projection, and projections are uncertain ({{fig:v01-o018}}).</text></svg><figcaption>Drawn to scale in years. The constraint waited almost thirty years for a workload that made it decisive, and the answers arrived within eight months of each other.</figcaption></figure>
