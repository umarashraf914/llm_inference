<figure><div class='ts'>Fig 14 &nbsp;&middot;&nbsp; 7:47</div><h3>Old wall, new stack</h3><svg viewBox="0 0 680 284" role="img"><title>Old wall, new stack</title><text class="hd" x="40" y="46">Most of this stack did not exist five years ago</text><g class="s"><rect x="48" y="70" width="142" height="40" rx="4"></rect><text class="sub" x="126.0" y="90.0" text-anchor="middle" dominant-baseline="central">paged caches</text></g><g class="s"><rect x="198" y="70" width="142" height="40" rx="4"></rect><text class="sub" x="274.0" y="90.0" text-anchor="middle" dominant-baseline="central">latent attention</text></g><g class="s"><rect x="348" y="70" width="142" height="40" rx="4"></rect><text class="sub" x="422.0" y="90.0" text-anchor="middle" dominant-baseline="central">prefill / decode split</text></g><g class="s"><rect x="498" y="70" width="142" height="40" rx="4"></rect><text class="sub" x="570.0" y="90.0" text-anchor="middle" dominant-baseline="central">four-bit numerics</text></g><text class="sub2" x="60" y="132" text-anchor="start">all published after 2022</text><text class="cap" x="40" y="182" text-anchor="start">The memory wall they were built against was named in 1995, more than twenty years before the</text><text class="cap" x="40" y="202" text-anchor="start">transformer existed.</text><text class="cap" x="40" y="242" text-anchor="start">A thirty-year-old architectural trend, and a stack of responses to it that is barely three</text><text class="cap" x="40" y="262" text-anchor="start">years old. Inference has grown to about two thirds of all AI compute in that time.</text></svg><figcaption>A good closing perspective. The constraint is far older than the field currently responding to it.</figcaption></figure>
