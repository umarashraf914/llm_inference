<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:21</div><h3>Prefill runs only on the part of the prompt no machine has seen</h3><svg viewBox='0 0 680 592' role='img'><title>Prefill runs only on the part of the prompt no machine has seen</title><text class="hd" x="40" y="46">The 4,000-token prompt on machine B, and the part prefill still has to compute</text><text class="cap" x="40" y="87" text-anchor="start">the prompt</text><g class="s"><rect x="210" y="70" width="409.5" height="26" rx="3"/><text class="sub" x="414.75" y="83.0" text-anchor="middle" dominant-baseline="central">3,900 tokens already in B's cache</text></g><g class="h"><rect x="619.5" y="70" width="10.5" height="26" rx="3"/></g><text class="cap" x="40" y="141" text-anchor="start">prefilled now</text><rect x="210" y="124" width="420" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="619.5" y="124" width="10.5" height="26" rx="3"/></g><text class="sub2" x="609.5" y="141" text-anchor="end">100 new tokens, 2.5% of the prompt</text><line class="axis" x1="210" y1="168" x2="630" y2="168"/><line class="tick" x1="210.0" y1="168" x2="210.0" y2="172"/><text class="sub2" x="210.0" y="186" text-anchor="middle">0</text><line class="tick" x1="315.0" y1="168" x2="315.0" y2="172"/><text class="sub2" x="315.0" y="186" text-anchor="middle">1,000</text><line class="tick" x1="420.0" y1="168" x2="420.0" y2="172"/><text class="sub2" x="420.0" y="186" text-anchor="middle">2,000</text><line class="tick" x1="525.0" y1="168" x2="525.0" y2="172"/><text class="sub2" x="525.0" y="186" text-anchor="middle">3,000</text><line class="tick" x1="630.0" y1="168" x2="630.0" y2="172"/><text class="sub2" x="630.0" y="186" text-anchor="middle">4,000</text><text class="sub2" x="210" y="206" text-anchor="start">position in the prompt, in tokens</text><text class="hd" x="40" y="252">Arithmetic for the weights, at 2 operations per active parameter per token</text><text class="cap" x="40" y="287" text-anchor="start">whole prompt</text><g class="u"><rect x="210" y="270" width="420.0" height="26" rx="3"/><text class="sub" x="420.0" y="283.0" text-anchor="middle" dominant-baseline="central">2 × 30 billion × 4,000 = 240 trillion</text></g><text class="cap" x="40" y="321" text-anchor="start">new tokens only</text><g class="h"><rect x="210" y="304" width="10.5" height="26" rx="3"/></g><text class="sub2" x="230.5" y="322" text-anchor="start">2 × 30 billion × 100 = 6 trillion</text><text class="cap" x="40" y="382" text-anchor="start">Machine B holds the keys and values for the first 3,900 tokens, so prefill starts partway through the</text><text class="cap" x="40" y="402" text-anchor="start">prompt, at the first token B has not seen. Only the newest question goes through the model: 100</text><text class="cap" x="40" y="422" text-anchor="start">tokens, 2.5% of the prompt.</text><text class="cap" x="40" y="462" text-anchor="start">Each token costs about two operations per active parameter ({{fig:v01-o114}}), so skipping 3,900 tokens</text><text class="cap" x="40" y="482" text-anchor="start">skips about 234 trillion operations. The new tokens still attend to all 4,000 positions, reading the</text><text class="cap" x="40" y="502" text-anchor="start">cached keys and values for the first 3,900 ({{fig:v01-o136}}).</text><text class="cap" x="40" y="542" text-anchor="start">A cache hit shortens prefill and nothing else. Every token of the answer still costs a full decode step,</text><text class="cap" x="40" y="562" text-anchor="start">so the saving shows up only in the wait for the first token ({{fig:v01-o055}}).</text></svg><figcaption>Bars to scale, token counts illustrative. Forty to one is the order of saving a follow-up question gets, and it is paid for entirely with memory the cache already held.</figcaption></figure>
