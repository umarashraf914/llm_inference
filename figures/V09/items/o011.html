<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:28</div><h3>Batching and speculation both put more positions behind one weight read</h3><svg viewBox='0 0 680 386' role='img'><title>Batching and speculation both put more positions behind one weight read</title><text class="hd" x="40" y="46">Two directions for putting more behind one read of the weights</text><g class="s"><rect x="40" y="66" width="286" height="82" rx="8"/><text class="lbl" x="183.0" y="90.0" text-anchor="middle" dominant-baseline="central">Continuous batching</text><text class="sub" x="183.0" y="108.0" text-anchor="middle" dominant-baseline="central">more requests in the same pass:</text><text class="sub" x="183.0" y="125.0" text-anchor="middle" dominant-baseline="central">one read serves them all</text></g><g class="s"><rect x="354" y="66" width="286" height="82" rx="8"/><text class="lbl" x="497.0" y="90.0" text-anchor="middle" dominant-baseline="central">Speculative decoding</text><text class="sub" x="497.0" y="108.0" text-anchor="middle" dominant-baseline="central">more positions per request:</text><text class="sub" x="497.0" y="125.0" text-anchor="middle" dominant-baseline="central">drafted tokens, checked in one pass</text></g><text class="cap" x="40" y="196" text-anchor="start">Continuous batching puts this request through the same forward pass as every other request in</text><text class="cap" x="40" y="216" text-anchor="start">flight, so one read of the weights serves all of them ({{fig:v07-o006}}). Speculative decoding has a small</text><text class="cap" x="40" y="236" text-anchor="start">draft model propose several tokens ahead, which the large model checks in a single pass</text><text class="cap" x="40" y="256" text-anchor="start">({{fig:v08-o002}}).</text><text class="cap" x="40" y="296" text-anchor="start">So the forward pass carrying this request holds many sequences, each with several proposed</text><text class="cap" x="40" y="316" text-anchor="start">tokens attached. One puts more requests behind a read; the other gets more positions out of it for</text><text class="cap" x="40" y="336" text-anchor="start">the same request. They are the two directions within one-token-at-a-time generation, and a</text><text class="cap" x="40" y="356" text-anchor="start">production system runs both at once. Part 10 meets a model that leaves that frame.</text></svg><figcaption>They compete for the same idle arithmetic: at 64 sequences with 4 drafts each, the read is already past the ridge (next figure).</figcaption></figure>
