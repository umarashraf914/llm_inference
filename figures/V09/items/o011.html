<figure><div class='ts'>Fig 11 &nbsp;&middot;&nbsp; 6:20</div><h3>The two answers, together</h3><svg viewBox="0 0 680 320" role="img"><title>The two answers, together</title><text class="hd" x="40" y="46">Two things push back on that ratio</text><g class="s"><rect x="40" y="70" width="285" height="82" rx="8"></rect><text class="lbl" x="182.5" y="94.0" text-anchor="middle" dominant-baseline="central">Continuous batching</text><text class="sub" x="182.5" y="112.0" text-anchor="middle" dominant-baseline="central">one read of the weights serves</text><text class="sub" x="182.5" y="129.0" text-anchor="middle" dominant-baseline="central">every request in flight</text></g><g class="s"><rect x="368" y="70" width="272" height="82" rx="8"></rect><text class="lbl" x="504.0" y="94.0" text-anchor="middle" dominant-baseline="central">Speculative decoding</text><text class="sub" x="504.0" y="112.0" text-anchor="middle" dominant-baseline="central">a small draft model proposes ahead,</text><text class="sub" x="504.0" y="129.0" text-anchor="middle" dominant-baseline="central">the large model checks in one pass</text></g><text class="cap" x="40" y="198" text-anchor="start">The forward pass carrying this request therefore holds many sequences, each with several</text><text class="cap" x="40" y="218" text-anchor="start">proposed tokens attached.</text><text class="cap" x="40" y="258" text-anchor="start">One puts more requests behind a weight read. The other gets more tokens out of it for the same</text><text class="cap" x="40" y="278" text-anchor="start">request. Between them they are the only two ways to raise tokens per weight read, and a</text><text class="cap" x="40" y="298" text-anchor="start">production system runs both at once.</text></svg><figcaption>The pairing is exact: one scales with the crowd, the other works even when there is no crowd.</figcaption></figure>
