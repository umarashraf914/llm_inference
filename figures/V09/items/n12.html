<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:44</div><h3>The scale factors out of the block's sum, so the multiply runs on the 4-bit values</h3><svg viewBox='0 0 680 714' role='img'><title>The scale factors out of the block's sum, so the multiply runs on the 4-bit values</title><text class="hd" x="40" y="46">Four of a block's sixteen terms, worked both ways</text><text class="cap" x="40" y="82" text-anchor="start">weight values, q</text><g class="u"><rect x="250" y="64" width="70" height="26" rx="3"/><text class="sub" x="285.0" y="77.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="u"><rect x="328" y="64" width="70" height="26" rx="3"/><text class="sub" x="363.0" y="77.0" text-anchor="middle" dominant-baseline="central">−1.5</text></g><g class="u"><rect x="406" y="64" width="70" height="26" rx="3"/><text class="sub" x="441.0" y="77.0" text-anchor="middle" dominant-baseline="central">0.5</text></g><g class="u"><rect x="484" y="64" width="70" height="26" rx="3"/><text class="sub" x="519.0" y="77.0" text-anchor="middle" dominant-baseline="central">2</text></g><text class="cap" x="40" y="116" text-anchor="start">weights, s × q, s = 0.015</text><g class="u"><rect x="250" y="98" width="70" height="26" rx="3"/><text class="sub" x="285.0" y="111.0" text-anchor="middle" dominant-baseline="central">0.045</text></g><g class="u"><rect x="328" y="98" width="70" height="26" rx="3"/><text class="sub" x="363.0" y="111.0" text-anchor="middle" dominant-baseline="central">−0.0225</text></g><g class="u"><rect x="406" y="98" width="70" height="26" rx="3"/><text class="sub" x="441.0" y="111.0" text-anchor="middle" dominant-baseline="central">0.0075</text></g><g class="u"><rect x="484" y="98" width="70" height="26" rx="3"/><text class="sub" x="519.0" y="111.0" text-anchor="middle" dominant-baseline="central">0.03</text></g><text class="cap" x="40" y="164" text-anchor="start">activation values, r</text><g class="u"><rect x="250" y="146" width="70" height="26" rx="3"/><text class="sub" x="285.0" y="159.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="328" y="146" width="70" height="26" rx="3"/><text class="sub" x="363.0" y="159.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="u"><rect x="406" y="146" width="70" height="26" rx="3"/><text class="sub" x="441.0" y="159.0" text-anchor="middle" dominant-baseline="central">−4</text></g><g class="u"><rect x="484" y="146" width="70" height="26" rx="3"/><text class="sub" x="519.0" y="159.0" text-anchor="middle" dominant-baseline="central">0.5</text></g><text class="cap" x="40" y="198" text-anchor="start">activations, t × r, t = 0.25</text><g class="u"><rect x="250" y="180" width="70" height="26" rx="3"/><text class="sub" x="285.0" y="193.0" text-anchor="middle" dominant-baseline="central">0.25</text></g><g class="u"><rect x="328" y="180" width="70" height="26" rx="3"/><text class="sub" x="363.0" y="193.0" text-anchor="middle" dominant-baseline="central">0.5</text></g><g class="u"><rect x="406" y="180" width="70" height="26" rx="3"/><text class="sub" x="441.0" y="193.0" text-anchor="middle" dominant-baseline="central">−1</text></g><g class="u"><rect x="484" y="180" width="70" height="26" rx="3"/><text class="sub" x="519.0" y="193.0" text-anchor="middle" dominant-baseline="central">0.125</text></g><text class="cap" x="40" y="252" text-anchor="start">way 1: multiply the rebuilt numbers</text><text class="sub2" x="266" y="252" text-anchor="start">0.01125 − 0.01125 − 0.0075 + 0.00375 = −0.00375</text><text class="cap" x="40" y="286" text-anchor="start">way 2: multiply the 4-bit values</text><text class="sub2" x="266" y="286" text-anchor="start">3 − 3 − 2 + 1 = −1, then × 0.015 × 0.25 = −0.00375</text><text class="hd" x="40" y="332">The same thing for all sixteen terms, built up</text><g class="u"><rect x="40" y="348" width="168" height="36" rx="6"/><text class="sub" x="124.0" y="366.0" text-anchor="middle" dominant-baseline="central">Σ (s × q) × (t × r)</text></g><text class="sub2" x="222" y="370" text-anchor="middle">=</text><g class="u"><rect x="236" y="348" width="168" height="36" rx="6"/><text class="sub" x="320.0" y="366.0" text-anchor="middle" dominant-baseline="central">Σ s × t × q × r</text></g><text class="sub2" x="418" y="370" text-anchor="middle">=</text><g class="s"><rect x="432" y="348" width="168" height="36" rx="6"/><text class="sub" x="516.0" y="366.0" text-anchor="middle" dominant-baseline="central">s × t × Σ q × r</text></g><text class="sub2" x="124" y="404" text-anchor="middle">32 rebuilds, 16 products</text><text class="sub2" x="320" y="404" text-anchor="middle">reorder the factors</text><text class="sub2" x="516" y="404" text-anchor="middle">16 products on 4-bit values,</text><text class="sub2" x="516" y="420" text-anchor="middle">then 2 by the scales</text><text class="cap" x="40" y="464" text-anchor="start">One number of a matrix multiply's output is a row of weights times the activations, multiplied pair by</text><text class="cap" x="40" y="484" text-anchor="start">pair and added ({{fig:v01-o085}}). In a block of 16, every weight is its 4-bit value times the block's scale,</text><text class="cap" x="40" y="504" text-anchor="start">and so is every activation, because this chip's 4-bit rate needs both sides in 4 bits ({{fig:v04-o056}}).</text><text class="cap" x="40" y="544" text-anchor="start">Factors can be multiplied in any order, and a factor shared by every term comes out of a sum: s·a +</text><text class="cap" x="40" y="564" text-anchor="start">s·b = s·(a + b). So the 16 products can be taken on the 4-bit values themselves, and the two scales</text><text class="cap" x="40" y="584" text-anchor="start">applied once to the block's partial sum. The answer is identical: −0.00375 both ways.</text><text class="cap" x="40" y="624" text-anchor="start">That is what applying the scale as the multiply runs means. NVIDIA documents the instruction as D =</text><text class="cap" x="40" y="644" text-anchor="start">(A × scale A) × (B × scale B) + C, with one scale for every 16 values, and the running total C kept at</text><text class="cap" x="40" y="664" text-anchor="start">higher precision ({{fig:v02-o079}}). Weight-only 4-bit works the other way: it expands every weight back</text><text class="cap" x="40" y="684" text-anchor="start">to 16 bits before multiplying ({{fig:v04-o057}}).</text></svg><figcaption>The scale never touches an individual weight. It is applied once per block of sixteen, which is how the weights stay four bits wide until the instant they are multiplied.</figcaption></figure>
