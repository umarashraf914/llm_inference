162" y="148" width="32" height="10" rx="2"/></g><g class="h"><rect x="162" y="161" width="32" height="10" rx="2"/></g><g class="h"><rect x="162" y="174" width="32" height="10" rx="2"/></g><g class="h"><rect x="162" y="187" width="32" height="10" rx="2"/></g><g class="h"><rect x="162" y="200" width="32" height="10" rx="2"/></g><g class="h"><rect x="162" y="213" width="32" height="10" rx="2"/></g><g class="h"><rect x="162" y="226" width="32" height="10" rx="2"/></g><g class="u"><rect x="206" y="114" width="40" height="26" rx="3"/><text class="sub" x="226.0" y="127.0" text-anchor="middle" dominant-baseline="central">4</text></g><g class="h"><rect x="210" y="148" width="32" height="10" rx="2"/></g><g class="h"><rect x="210" y="161" width="32" height="10" rx="2"/></g><g class="h"><rect x="210" y="174" width="32" height="10" rx="2"/></g><g class="u"><rect x="254" y="114" width="40" height="26" rx="3"/><text class="sub" x="274.0" y="127.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="h"><rect x="258" y="148" width="32" height="10" rx="2"/></g><g class="h"><rect x="258" y="161" width="32" height="10" rx="2"/></g><g class="h"><rect x="258" y="174" width="32" height="10" rx="2"/></g><g class="h"><rect x="258" y="187" width="32" height="10" rx="2"/></g><g class="h"><rect x="258" y="200" width="32" height="10" rx="2"/></g><g class="h"><rect x="258" y="213" width="32" height="10" rx="2"/></g><g class="h"><rect x="258" y="226" width="32" height="10" rx="2"/></g><g class="h"><rect x="258" y="239" width="32" height="10" rx="2"/></g><g class="h"><rect x="258" y="252" width="32" height="10" rx="2"/></g><g class="h"><rect x="258" y="265" width="32" height="10" rx="2"/></g><g class="h"><rect x="258" y="278" width="32" height="10" rx="2"/></g><g class="u"><rect x="302" y="114" width="40" height="26" rx="3"/><text class="sub" x="322.0" y="127.0" text-anchor="middle" dominant-baseline="central">6</text></g><g class="h"><rect x="306" y="148" width="32" height="10" height="26" rx="3"/><text class="sub" x="568.0" y="195.0" text-anchor="middle" dominant-baseline="central">a waiting request</text></g><line class="conn" x1="490" y1="127" x2="448" y2="127" marker-end="url(#arw)"/><text class="sub2" x="496" y="230" text-anchor="start">the head of the queue takes</text><text class="sub2" x="496" y="246" text-anchor="start">the next seat that frees</text><text class="sub2" x="62" y="350" text-anchor="start">seat 3, outlined, is this request. Each red block holds the keys and values</text><text class="sub2" x="62" y="366" text-anchor="start">for a run of one request's tokens.</text><text class="cap" x="40" y="410" text-anchor="start">The decode machines run their requests as one batch, and every step advances each of them by</text><text class="cap" x="40" y="430" text-anchor="start">one token ({{fig:v07-o006}}). A slot is one seat in that batch. With the seat comes memory for the</text><text class="cap" x="40" y="450" text-anchor="start">request's cache, held in fixed-size blocks that need not sit side by side ({{fig:v03-o086}}).</text><text class="cap" x="40" y="490" text-anchor="start">Seats are limited by memory, not by arithmetic. Each seat's cache grows with its conversation, and</text><text class="cap" x="40" y="510" text-anchor="start">once the memory left over after the weights is full, newcomers wait ({{fig:v07-o005}}).</text><text class="cap" x="40" y="550" text-anchor="start">This request is prefilled on another machine first, then takes a seat and keeps it until its last token.</text><text class="cap" x="40" y="570" text-anchor="start">Then the seat goes to the head of the queue ({{fig:v09-o013}}).</text></svg><figcaption>Schematic: eight seats, where a real engine holds dozens. The number of seats is set by cache memory, which is why so much of this stack exists to shrink the cache.</figcaption></figure>
