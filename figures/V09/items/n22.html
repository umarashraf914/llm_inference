<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:12</div><h3>Each gigabyte takes 125 microseconds to read and 0.4 to compute</h3><svg viewBox='0 0 680 434' role='img'><title>Each gigabyte takes 125 microseconds to read and 0.4 to compute</title><text class="hd" x="40" y="46">One gigabyte of 4-bit weights on one GPU: reading it against using it, to scale</text><text class="cap" x="40" y="87" text-anchor="start">reading it</text><g class="h"><rect x="200" y="70" width="400.0" height="26" rx="3"/><text class="sub" x="400.0" y="83.0" text-anchor="middle" dominant-baseline="central">125 µs at 8 TB/s</text></g><text class="cap" x="40" y="127" text-anchor="start">the arithmetic</text><g class="m"><rect x="200" y="110" width="2" height="26" rx="3"/></g><text class="sub2" x="212" y="127" text-anchor="start">0.4 µs: 4 billion operations at 10 quadrillion a second</text><line class="axis" x1="200" y1="150" x2="600" y2="150"/><line class="tick" x1="200.0" y1="150" x2="200.0" y2="154"/><text class="sub2" x="200.0" y="168" text-anchor="middle">0 µs</text><line class="tick" x1="280.0" y1="150" x2="280.0" y2="154"/><text class="sub2" x="280.0" y="168" text-anchor="middle">25 µs</text><line class="tick" x1="360.0" y1="150" x2="360.0" y2="154"/><text class="sub2" x="360.0" y="168" text-anchor="middle">50 µs</text><line class="tick" x1="440.0" y1="150" x2="440.0" y2="154"/><text class="sub2" x="440.0" y="168" text-anchor="middle">75 µs</text><line class="tick" x1="520.0" y1="150" x2="520.0" y2="154"/><text class="sub2" x="520.0" y="168" text-anchor="middle">100 µs</text><line class="tick" x1="600.0" y1="150" x2="600.0" y2="154"/><text class="sub2" x="600.0" y="168" text-anchor="middle">125 µs</text><text class="sub2" x="40" y="202" text-anchor="start">this token's 15 GB on one GPU: 1.875 ms of reading against 6 µs of arithmetic,</text><text class="sub2" x="40" y="220" text-anchor="start">so the arithmetic units sit idle 99.68% of the step</text><text class="cap" x="40" y="264" text-anchor="start">Reading a gigabyte at 8 terabytes a second takes one eight-thousandth of a second: 125</text><text class="cap" x="40" y="284" text-anchor="start">microseconds, or millionths of a second, written µs. The gigabyte holds two billion 4-bit weights,</text><text class="cap" x="40" y="304" text-anchor="start">which offer 4 billion operations, and at 10 quadrillion a second those take 0.4 microseconds.</text><text class="cap" x="40" y="344" text-anchor="start">So the arithmetic for each gigabyte is done 312.5 times sooner than the gigabyte arrives, and the</text><text class="cap" x="40" y="364" text-anchor="start">units wait for the rest: the same picture as the first episode's 30-millisecond token ({{fig:v01-o067}}).</text><text class="cap" x="40" y="384" text-anchor="start">Spread over many GPUs, each reads and computes its own share sooner, but on each one the ratio</text><text class="cap" x="40" y="404" text-anchor="start">is the same.</text></svg><figcaption>Bars to scale: the arithmetic is the sliver at the left. The read, not the arithmetic, sets the price of a decode step.</figcaption></figure>
