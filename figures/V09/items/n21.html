<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:41</div><h3>Latent attention and an 8-bit cache turn a sixth of a second into three milliseconds</h3><svg viewBox='0 0 680 474' role='img'><title>Latent attention and an 8-bit cache turn a sixth of a second into three milliseconds</title><text class="hd" x="40" y="46">Time to send this request's 4,000-token cache over one 400 Gb/s card, log scale</text><text class="cap" x="40" y="86" text-anchor="start">standard, 16 bits</text><g class="h"><rect x="250" y="68" width="271.8106033586995" height="26" rx="3"/><text class="sub" x="385.90530167934975" y="81.0" text-anchor="middle" dominant-baseline="central">8.0 GB, 160 ms</text></g><text class="cap" x="40" y="124" text-anchor="start">latent, 16 bits</text><g class="u"><rect x="250" y="106" width="92.4842504677548" height="26" rx="3"/></g><text class="sub2" x="352.4842504677548" y="124" text-anchor="start">281 MB, 5.6 ms</text><text class="cap" x="40" y="162" text-anchor="start">latent, 8 bits</text><g class="s"><rect x="250" y="144" width="55.357217669197155" height="26" rx="3"/></g><text class="sub2" x="315.35721766919715" y="162" text-anchor="start">141 MB, 2.8 ms</text><text class="cap" x="40" y="200" text-anchor="start">latent, 4 bits</text><g class="s"><rect x="250" y="182" width="18.230184870639448" height="26" rx="3"/></g><text class="sub2" x="278.23018487063945" y="200" text-anchor="start">70 MB, 1.4 ms</text><line class="axis" x1="250" y1="222" x2="620" y2="222"/><line class="tick" x1="250.0" y1="222" x2="250.0" y2="226"/><text class="sub2" x="250.0" y="240" text-anchor="middle">1 ms</text><line class="tick" x1="373.3333333333333" y1="222" x2="373.3333333333333" y2="226"/><text class="sub2" x="373.3333333333333" y="240" text-anchor="middle">10 ms</text><line class="tick" x1="496.66666666666663" y1="222" x2="496.66666666666663" y2="226"/><text class="sub2" x="496.66666666666663" y="240" text-anchor="middle">100 ms</text><line class="tick" x1="620.0" y1="222" x2="620.0" y2="226"/><text class="sub2" x="620.0" y="240" text-anchor="middle">1 s</text><text class="cap" x="40" y="284" text-anchor="start">Time is bytes divided by rate ({{fig:v01-o063}}). One 400 Gb/s card moves 50 gigabytes a second each</text><text class="cap" x="40" y="304" text-anchor="start">way ({{fig:v09-n03}}), so a 4,000-token cache at 70 KB a token, 281 MB, takes 5.6 milliseconds.</text><text class="cap" x="40" y="344" text-anchor="start">Had the model used standard attention with its 64 heads, the same cache would be 8.0 GB and take</text><text class="cap" x="40" y="364" text-anchor="start">160 ms, about a sixth of a second, before the second token could start. Halving the bits halves the</text><text class="cap" x="40" y="384" text-anchor="start">time again: 2.8 ms at 8 bits, 1.4 ms at 4, plus a little for the scales 4-bit values need.</text><text class="cap" x="40" y="424" text-anchor="start">The cache tolerates less squeezing than the weights do, because it is made on the fly and its errors</text><text class="cap" x="40" y="444" text-anchor="start">feed every later token ({{fig:v04-o070}}), which is why 8 bits is the common choice.</text></svg><figcaption>Log scale. This is the gap in the lane chart, priced. Latent attention does most of the work, and a narrower cache halves what is left.</figcaption></figure>
