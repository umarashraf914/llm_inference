<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:40</div><h3>Filling many positions per pass spends idle arithmetic to save weight reads</h3><svg viewBox='0 0 680 626' role='img'><title>Filling many positions per pass spends idle arithmetic to save weight reads</title><text class="hd" x="40" y="46">A 256-token answer, illustrative: one position per pass against a block filled in 32</text><text class="hd" x="40" y="86" text-anchor="start">weight reads</text><text class="cap" x="40" y="115" text-anchor="start">one per pass</text><g class="h"><rect x="200" y="98" width="400.0" height="24" rx="3"/></g><text class="sub2" x="608.0" y="115" text-anchor="start">256</text><text class="cap" x="40" y="145" text-anchor="start">diffusion</text><g class="s"><rect x="200" y="128" width="50.0" height="24" rx="3"/></g><text class="sub2" x="258.0" y="145" text-anchor="start">32</text><text class="hd" x="40" y="186" text-anchor="start">positions computed</text><text class="cap" x="40" y="215" text-anchor="start">one per pass</text><g class="u"><rect x="200" y="198" width="12.5" height="24" rx="3"/></g><text class="sub2" x="220.5" y="215" text-anchor="start">256</text><text class="cap" x="40" y="245" text-anchor="start">diffusion</text><g class="m"><rect x="200" y="228" width="400.0" height="24" rx="3"/></g><text class="sub2" x="608.0" y="245" text-anchor="start">8,192</text><text class="hd" x="40" y="286" text-anchor="start">operations per byte</text><text class="cap" x="40" y="315" text-anchor="start">one per pass</text><g class="h"><rect x="200" y="298" width="2" height="24" rx="3"/></g><text class="sub2" x="210" y="315" text-anchor="start">4</text><text class="cap" x="40" y="345" text-anchor="start">diffusion</text><g class="s"><rect x="200" y="328" width="327.68" height="24" rx="3"/></g><text class="sub2" x="535.6800000000001" y="345" text-anchor="start">1,024</text><line class="mark xok" x1="600.0" y1="292" x2="600.0" y2="358"/><text class="sub2" x="594.0" y="286" text-anchor="end">ridge 1,250</text><text class="cap" x="40" y="396" text-anchor="start">Suppose an answer of 256 tokens is written as one block, filled over 32 passes. Each pass reads</text><text class="cap" x="40" y="416" text-anchor="start">the weights once and computes all 256 positions, filled or not, so the answer costs 32 weight reads</text><text class="cap" x="40" y="436" text-anchor="start">instead of 256, eight times fewer, and 8,192 positions of arithmetic instead of 256, thirty-two times</text><text class="cap" x="40" y="456" text-anchor="start">more.</text><text class="cap" x="40" y="496" text-anchor="start">That is a good trade on this hardware. A pass over 256 positions gets 4 × 256 = 1,024 operations</text><text class="cap" x="40" y="516" text-anchor="start">from each byte of weights, close to the ridge, against autoregressive decode's 4. It is the trade</text><text class="cap" x="40" y="536" text-anchor="start">speculation makes ({{fig:v08-o004}}), on a larger scale: spend arithmetic that sat 99.7% idle ({{fig:v09-n22}})</text><text class="cap" x="40" y="556" text-anchor="start">to save trips to memory.</text><text class="cap" x="40" y="596" text-anchor="start">The block size and pass count are illustrative. Mercury's are not public.</text></svg><figcaption>Bars to scale within each pair. Thirty-two times the arithmetic buys eight times fewer reads, and on a chip whose arithmetic waits on memory that is the right way round.</figcaption></figure>
