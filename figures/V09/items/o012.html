<figure><div class='ts'>Fig 12 &nbsp;&middot;&nbsp; 6:58</div><h3>Constraining the output</h3><svg viewBox="0 0 680 250" role="img"><title>Constraining the output</title><text class="hd" x="40" y="46">One more step before a token is chosen</text><g class="u"><rect x="40" y="70" width="180" height="40" rx="4"></rect><text class="sub" x="130.0" y="90.0" text-anchor="middle" dominant-baseline="central">the model's preference</text></g><line class="conn" x1="226" y1="90" x2="246" y2="90" marker-end="url(#arw)"></line><g class="h"><rect x="252" y="70" width="220" height="40" rx="4"></rect><text class="sub" x="362.0" y="90.0" text-anchor="middle" dominant-baseline="central">tokens that break the format removed</text></g><line class="conn" x1="478" y1="90" x2="498" y2="90" marker-end="url(#arw)"></line><g class="s"><rect x="504" y="70" width="136" height="40" rx="4"></rect><text class="sub" x="572.0" y="90.0" text-anchor="middle" dominant-baseline="central">pick from the rest</text></g><text class="cap" x="40" y="148" text-anchor="start">The answer to this request has to be a tool call, so after an opening brace only the field names</text><text class="cap" x="40" y="168" text-anchor="start">the format allows are still available.</text><text class="cap" x="40" y="208" text-anchor="start">Constrained decoding, and it is the last place anything can be enforced before tokens reach a</text><text class="cap" x="40" y="228" text-anchor="start">user or a tool.</text></svg><figcaption>The guarantee is narrow: the tool call will parse. Whether it is the right call is a different question entirely.</figcaption></figure>
