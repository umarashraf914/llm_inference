<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:53</div><h3>The engine deletes every token that would break the tool call</h3><svg viewBox='0 0 680 336' role='img'><title>The engine deletes every token that would break the tool call</title><text class="hd" x="40" y="46">One more step before a token is chosen</text><g class="u"><rect x="40" y="66" width="170" height="40" rx="4"/><text class="sub" x="125.0" y="86.0" text-anchor="middle" dominant-baseline="central">the model's scores</text></g><line class="conn" x1="214" y1="86" x2="230" y2="86" marker-end="url(#arw)"/><g class="h"><rect x="235" y="66" width="240" height="40" rx="4"/><text class="sub" x="355.0" y="86.0" text-anchor="middle" dominant-baseline="central">tokens that break the format removed</text></g><line class="conn" x1="479" y1="86" x2="495" y2="86" marker-end="url(#arw)"/><g class="s"><rect x="500" y="66" width="140" height="40" rx="4"/><text class="sub" x="570.0" y="86.0" text-anchor="middle" dominant-baseline="central">pick from the rest</text></g><text class="cap" x="40" y="146" text-anchor="start">Every token that decode produces passes one more step before it is chosen. The model's last layer</text><text class="cap" x="40" y="166" text-anchor="start">gives a score to every token in its vocabulary, 163,840 of them for a model shaped like Kimi K2, and</text><text class="cap" x="40" y="186" text-anchor="start">the sampler turns the scores into probabilities and draws one ({{fig:v07-o021}}).</text><text class="cap" x="40" y="226" text-anchor="start">The answer to this request has to be a tool call, so before the draw the engine removes every token</text><text class="cap" x="40" y="246" text-anchor="start">that does not fit the call's format. That is constrained decoding ({{fig:v07-o023}}).</text><text class="cap" x="40" y="286" text-anchor="start">It is the last point inside generation where the output can be steered. The software that runs the tool</text><text class="cap" x="40" y="306" text-anchor="start">still parses the call, and can still refuse it ({{fig:v01-o024}}).</text></svg><figcaption>The guarantee is narrow: the tool call will parse. Whether it is the right call is a different question entirely.</figcaption></figure>
