<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:34</div><h3>130 terabytes a second is 72 GPUs at 1.8 each, each slower than a GPU's own memory</h3><svg viewBox='0 0 680 622' role='img'><title>130 terabytes a second is 72 GPUs at 1.8 each, each slower than a GPU's own memory</title><text class="hd" x="40" y="46">Where the 130 comes from</text><g class="u"><rect x="40" y="64" width="110" height="36" rx="6"/><text class="sub" x="95.0" y="82.0" text-anchor="middle" dominant-baseline="central">72 GPUs</text></g><text class="sub2" x="164" y="87" text-anchor="middle">×</text><g class="u"><rect x="178" y="64" width="150" height="36" rx="6"/><text class="sub" x="253.0" y="82.0" text-anchor="middle" dominant-baseline="central">1.8 TB/s each</text></g><text class="sub2" x="342" y="87" text-anchor="middle">=</text><g class="u"><rect x="356" y="64" width="196" height="36" rx="6"/><text class="sub" x="454.0" y="82.0" text-anchor="middle" dominant-baseline="central">129.6 TB/s, about 130</text></g><text class="sub2" x="40" y="124" text-anchor="start">each GPU's 18 links at 100 GB/s, counting both directions, so 0.9 TB/s each way</text><text class="hd" x="40" y="174">Three routes out of one GPU, per direction, on a log scale</text><text class="cap" x="40" y="212" text-anchor="start">its own memory</text><g class="u"><rect x="262" y="194" width="356.11237173767836" height="26" rx="3"/><text class="sub" x="440.0561858688392" y="207.0" text-anchor="middle" dominant-baseline="central">8 TB/s</text></g><text class="cap" x="40" y="250" text-anchor="start">NVLink to any GPU in the rack</text><g class="s"><rect x="262" y="232" width="239.7204144912239" height="26" rx="3"/><text class="sub" x="381.86020724561195" y="245.0" text-anchor="middle" dominant-baseline="central">0.9 TB/s</text></g><text class="cap" x="40" y="288" text-anchor="start">network card, out of the rack</text><g class="h"><rect x="262" y="270" width="85.74032053188495" height="26" rx="3"/></g><text class="sub2" x="357.74032053188495" y="287" text-anchor="start">50 GB/s: a 400 Gb/s card</text><line class="axis" x1="262" y1="310" x2="630" y2="310"/><line class="tick" x1="262.0" y1="310" x2="262.0" y2="314"/><text class="sub2" x="262.0" y="328" text-anchor="middle">10 GB/s</text><line class="tick" x1="384.66666666666663" y1="310" x2="384.66666666666663" y2="314"/><text class="sub2" x="384.66666666666663" y="328" text-anchor="middle">100 GB/s</text><line class="tick" x1="507.3333333333333" y1="310" x2="507.3333333333333" y2="314"/><text class="sub2" x="507.3333333333333" y="328" text-anchor="middle">1 TB/s</text><line class="tick" x1="630.0" y1="310" x2="630.0" y2="314"/><text class="sub2" x="630.0" y="328" text-anchor="middle">10 TB/s</text><text class="cap" x="40" y="372" text-anchor="start">The fabric's 130 terabytes a second is a bandwidth, bytes moved per second ({{fig:v01-o074}}), and a</text><text class="cap" x="40" y="392" text-anchor="start">total. Each GPU's share is 1.8 TB/s, and NVIDIA counts both directions, so 0.9 TB/s each way.</text><text class="cap" x="40" y="412" text-anchor="start">Because the fabric moves data that fast, NVIDIA describes the whole rack as a single, massive GPU.</text><text class="cap" x="40" y="452" text-anchor="start">In one sense that is fair: any GPU can reach any other's memory directly. In another it is not.</text><text class="cap" x="40" y="472" text-anchor="start">Reaching a neighbour's memory is about 9 times slower than reaching your own, and leaving the</text><text class="cap" x="40" y="492" text-anchor="start">rack through the network card is 18 times slower again ({{fig:v05-o008}}). Network cards are rated in bits:</text><text class="cap" x="40" y="512" text-anchor="start">400 gigabits a second is 50 gigabytes, at eight bits to the byte ({{fig:v01-o073}}).</text><text class="cap" x="40" y="552" text-anchor="start">Those two drops decide where the heavy traffic in this trace is allowed to run: the experts'</text><text class="cap" x="40" y="572" text-anchor="start">exchange stays inside the rack (Part 5), and the one transfer that must leave it is made as small as</text><text class="cap" x="40" y="592" text-anchor="start">possible (Part 6).</text></svg><figcaption>Log scale: each step along the axis is ten times the last. One rack can behave like one GPU only for traffic that never needs its own memory's speed.</figcaption></figure>
