<figure><div class='ts'>Fig 15 &nbsp;&middot;&nbsp; 8:13</div><h3>The assumption underneath everything</h3><svg viewBox="0 0 680 356" role="img"><title>The assumption underneath everything</title><text class="hd" x="40" y="46">Every technique in this series assumes one thing</text><g class="h"><rect x="140" y="70" width="400" height="40" rx="4"></rect><text class="sub" x="340.0" y="90.0" text-anchor="middle" dominant-baseline="central">the model writes one token at a time</text></g><text class="cap" x="40" y="154" text-anchor="start">Diffusion language models do not. A diffusion model starts from a masked sequence and fills it</text><text class="cap" x="40" y="174" text-anchor="start">in over several passes, predicting many positions at once.</text><text class="cap" x="40" y="214" text-anchor="start">One commercial diffusion model was independently measured at 1,100 tokens a second on H100s.</text><text class="cap" x="40" y="254" text-anchor="start">A model that fills in many positions at once is a different problem. Sequential decode is what</text><text class="cap" x="40" y="274" text-anchor="start">made the memory wall bite, because a single token could never amortise a weight read. Remove</text><text class="cap" x="40" y="294" text-anchor="start">the sequentiality and the arithmetic changes.</text><text class="cap" x="40" y="334" text-anchor="start">The stack that serves it will look different too.</text></svg><figcaption>Worth ending on. The whole stack is a response to one property of autoregressive generation, and that property is not a law of nature.</figcaption></figure>
