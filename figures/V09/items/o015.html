<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:23</div><h3>Every technique that fights decode assumes one token at a time</h3><svg viewBox='0 0 680 426' role='img'><title>Every technique that fights decode assumes one token at a time</title><text class="hd" x="40" y="46">The assumption under every technique that fights decode</text><g class="h"><rect x="140" y="66" width="400" height="40" rx="4"/><text class="sub" x="340.0" y="86.0" text-anchor="middle" dominant-baseline="central">the model writes one token at a time</text></g><text class="sub2" x="140" y="130" text-anchor="start">batching, speculation, the cache and everything that shrinks it</text><text class="cap" x="40" y="176" text-anchor="start">At the same time, many quite different approaches are being tried. Every technique that fights</text><text class="cap" x="40" y="196" text-anchor="start">decode assumes the model writes one token at a time: each token needs its own pass over the</text><text class="cap" x="40" y="216" text-anchor="start">weights, and the stack exists to put more work behind each of those passes. Diffusion language</text><text class="cap" x="40" y="236" text-anchor="start">models do not write that way.</text><text class="cap" x="40" y="276" text-anchor="start">A diffusion model starts from a sequence of blanks, masked positions, and fills it in over several</text><text class="cap" x="40" y="296" text-anchor="start">passes, predicting many positions at once. Mercury, a commercial diffusion model from Inception</text><text class="cap" x="40" y="316" text-anchor="start">Labs, was independently measured by Artificial Analysis at 1,109 tokens a second on H100 GPUs for</text><text class="cap" x="40" y="336" text-anchor="start">Mercury Coder Mini, and 737 for the larger Mercury Coder Small.</text><text class="cap" x="40" y="376" text-anchor="start">A model that fills in many positions at once is a different problem, and the stack that serves it will</text><text class="cap" x="40" y="396" text-anchor="start">look different too. The next four figures show why.</text></svg><figcaption>A measurement by an independent benchmarker, on the previous generation of GPU, for one family of coding models: a speed, not a verdict on the approach.</figcaption></figure>
