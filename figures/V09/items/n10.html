<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:27</div><h3>Prefill and decode are split because they sit on opposite sides of the ridge</h3><svg viewBox='0 0 680 524' role='img'><title>Prefill and decode are split because they sit on opposite sides of the ridge</title><text class="hd" x="40" y="46">Operations per byte of weights read, on a log scale</text><line class="mark" x1="480.0" y1="62" x2="480.0" y2="182"/><text class="cap" x="40" y="88" text-anchor="start">prefill, 4,000 tokens</text><g class="m"><rect x="236" y="70" width="331.2846546332869" height="26" rx="3"/><text class="sub" x="401.64232731664345" y="83.0" text-anchor="middle" dominant-baseline="central">16,000: 12.8× above the ridge</text></g><text class="cap" x="40" y="128" text-anchor="start">prefill, 100 new tokens</text><g class="u"><rect x="236" y="110" width="205.04232731664342" height="26" rx="3"/><text class="sub" x="338.5211636583217" y="123.0" text-anchor="middle" dominant-baseline="central">400: 3.1× below the ridge</text></g><text class="cap" x="40" y="168" text-anchor="start">decode, one token</text><g class="h"><rect x="236" y="150" width="47.44232731664346" height="26" rx="3"/></g><text class="sub2" x="293.44232731664346" y="168" text-anchor="start">4: 312.5× below the ridge</text><line class="axis" x1="236" y1="192" x2="630" y2="192"/><line class="tick" x1="236.0" y1="192" x2="236.0" y2="196"/><text class="sub2" x="236.0" y="210" text-anchor="middle">1</text><line class="tick" x1="314.8" y1="192" x2="314.8" y2="196"/><text class="sub2" x="314.8" y="210" text-anchor="middle">10</text><line class="tick" x1="393.6" y1="192" x2="393.6" y2="196"/><text class="sub2" x="393.6" y="210" text-anchor="middle">100</text><line class="tick" x1="472.4" y1="192" x2="472.4" y2="196"/><text class="sub2" x="472.4" y="210" text-anchor="middle">1,000</text><line class="tick" x1="551.2" y1="192" x2="551.2" y2="196"/><text class="sub2" x="551.2" y="210" text-anchor="middle">10,000</text><line class="tick" x1="630.0" y1="192" x2="630.0" y2="196"/><text class="sub2" x="630.0" y="210" text-anchor="middle">100,000</text><text class="sub2" x="480.03650902503483" y="230" text-anchor="middle">the ridge, 1,250</text><text class="cap" x="40" y="274" text-anchor="start">Prefill multiplies every weight it reads against every new token at once, so each byte does 4</text><text class="cap" x="40" y="294" text-anchor="start">operations per token: 16,000 for a 4,000-token prompt, far above the ridge. Decode multiplies each</text><text class="cap" x="40" y="314" text-anchor="start">weight against a single token, 4 operations, far below it ({{fig:v01-o129}}).</text><text class="cap" x="40" y="354" text-anchor="start">One machine has to compromise between the two. Its hardware and its way of splitting the model</text><text class="cap" x="40" y="374" text-anchor="start">suit one phase, and a long prefill mixed into a decode batch holds up everyone's next token</text><text class="cap" x="40" y="394" text-anchor="start">({{fig:v07-o008}}). So the work is split into separate pools ({{fig:v07-o010}}), and the price is moving the cache</text><text class="cap" x="40" y="414" text-anchor="start">from one pool to the other (Part 6).</text><text class="cap" x="40" y="454" text-anchor="start">With its prefix cached, this request brings only 100 new tokens: 400 operations per byte, below the</text><text class="cap" x="40" y="474" text-anchor="start">ridge on its own. A prefill machine fills each pass with new tokens from several requests, so that</text><text class="cap" x="40" y="494" text-anchor="start">together they clear it.</text></svg><figcaption>Log scale. The two phases ask four thousand times as much of a byte in one case as in the other, and no single setting of one machine suits both.</figcaption></figure>
