<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:00</div><h3>The words this trace leans on, and where each was built</h3><svg viewBox='0 0 680 554' role='img'><title>The words this trace leans on, and where each was built</title><text class="hd" x="40" y="46">13 words, in one line each, and the figure that builds each one</text><g class="u"><rect x="40" y="64" width="136" height="24" rx="3"/><text class="sub" x="108.0" y="76.0" text-anchor="middle" dominant-baseline="central">model</text></g><text class="sub2" x="190" y="80" text-anchor="start">a file of learned numbers that predicts the next token</text><text class="sub2" x="590" y="80" text-anchor="start">{{ref:v01-o001}}</text><g class="u"><rect x="40" y="94" width="136" height="24" rx="3"/><text class="sub" x="108.0" y="106.0" text-anchor="middle" dominant-baseline="central">weight, parameter</text></g><text class="sub2" x="190" y="110" text-anchor="start">one of those numbers; this model has a trillion</text><text class="sub2" x="590" y="110" text-anchor="start">{{ref:v01-o004}}</text><g class="u"><rect x="40" y="124" width="136" height="24" rx="3"/><text class="sub" x="108.0" y="136.0" text-anchor="middle" dominant-baseline="central">token</text></g><text class="sub2" x="190" y="140" text-anchor="start">a piece of text, roughly a word: the unit of everything</text><text class="sub2" x="590" y="140" text-anchor="start">{{ref:v01-o006}}</text><g class="u"><rect x="40" y="154" width="136" height="24" rx="3"/><text class="sub" x="108.0" y="166.0" text-anchor="middle" dominant-baseline="central">layer</text></g><text class="sub2" x="190" y="170" text-anchor="start">one stage of the model: attention, then a feed-forward step</text><text class="sub2" x="590" y="170" text-anchor="start">{{ref:v01-o091}}</text><g class="u"><rect x="40" y="184" width="136" height="24" rx="3"/><text class="sub" x="108.0" y="196.0" text-anchor="middle" dominant-baseline="central">head</text></g><text class="sub2" x="190" y="200" text-anchor="start">one of several attention computations a layer runs side by side</text><text class="sub2" x="590" y="200" text-anchor="start">{{ref:v03-o013}}</text><g class="u"><rect x="40" y="214" width="136" height="24" rx="3"/><text class="sub" x="108.0" y="226.0" text-anchor="middle" dominant-baseline="central">forward pass</text></g><text class="sub2" x="190" y="230" text-anchor="start">one run through every layer, giving the next token</text><text class="sub2" x="590" y="230" text-anchor="start">{{ref:v01-o007}}</text><g class="u"><rect x="40" y="244" width="136" height="24" rx="3"/><text class="sub" x="108.0" y="256.0" text-anchor="middle" dominant-baseline="central">prefill, decode</text></g><text class="sub2" x="190" y="260" text-anchor="start">the prompt in one pass; then one new token per pass</text><text class="sub2" x="590" y="260" text-anchor="start">{{ref:v01-o109}}</text><g class="u"><rect x="40" y="274" width="136" height="24" rx="3"/><text class="sub" x="108.0" y="286.0" text-anchor="middle" dominant-baseline="central">key-value cache</text></g><text class="sub2" x="190" y="290" text-anchor="start">attention state kept for every token so far</text><text class="sub2" x="590" y="290" text-anchor="start">{{ref:v01-o136}}</text><g class="u"><rect x="40" y="304" width="136" height="24" rx="3"/><text class="sub" x="108.0" y="316.0" text-anchor="middle" dominant-baseline="central">batch</text></g><text class="sub2" x="190" y="320" text-anchor="start">requests that share one pass, and one read of the weights</text><text class="sub2" x="590" y="320" text-anchor="start">{{ref:v07-o002}}</text><g class="u"><rect x="40" y="334" width="136" height="24" rx="3"/><text class="sub" x="108.0" y="346.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><text class="sub2" x="190" y="350" text-anchor="start">the chip that does the arithmetic, in thousands of lanes</text><text class="sub2" x="590" y="350" text-anchor="start">{{ref:v01-o070}}</text><g class="u"><rect x="40" y="364" width="136" height="24" rx="3"/><text class="sub" x="108.0" y="376.0" text-anchor="middle" dominant-baseline="central">HBM</text></g><text class="sub2" x="190" y="380" text-anchor="start">the GPU's own fast memory, in the same package</text><text class="sub2" x="590" y="380" text-anchor="start">{{ref:v01-o107}}</text><g class="u"><rect x="40" y="394" width="136" height="24" rx="3"/><text class="sub" x="108.0" y="406.0" text-anchor="middle" dominant-baseline="central">bandwidth</text></g><text class="sub2" x="190" y="410" text-anchor="start">bytes moved per second</text><text class="sub2" x="590" y="410" text-anchor="start">{{ref:v01-o074}}</text><g class="u"><rect x="40" y="424" width="136" height="24" rx="3"/><text class="sub" x="108.0" y="436.0" text-anchor="middle" dominant-baseline="central">ops per byte</text></g><text class="sub2" x="190" y="440" text-anchor="start">work done for each byte fetched; the ridge is the most a chip can use</text><text class="sub2" x="590" y="440" text-anchor="start">{{ref:v01-o120}}</text><text class="cap" x="40" y="484" text-anchor="start">This is the last episode of the series, and it uses the vocabulary of the eight before it. Each word</text><text class="cap" x="40" y="504" text-anchor="start">above is defined in a line and linked to the figure that builds it properly. Words that are new to this</text><text class="cap" x="40" y="524" text-anchor="start">episode, such as remote direct memory access, are built where they first appear.</text></svg><figcaption>A map of prerequisites rather than a lesson: every row is one click from the figure that teaches it.</figcaption></figure>
