<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:17</div><h3>A server's parts, and who normally moves bytes from one machine to the next</h3><svg viewBox='0 0 680 588' role='img'><title>A server's parts, and who normally moves bytes from one machine to the next</title><text class="hd" x="40" y="46">One machine: a compute tray, its parts drawn as peers, schematic</text><g class="u"><rect x="40" y="66" width="600" height="228" rx="14"/><text class="lbl" x="62" y="92">one compute tray, running one operating system</text></g><rect x="56" y="104" width="568" height="44" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="u"><rect x="72" y="112" width="110" height="28" rx="3"/><text class="sub" x="127.0" y="126.0" text-anchor="middle" dominant-baseline="central">Grace CPU 1</text></g><g class="u"><rect x="190" y="112" width="142" height="28" rx="3"/><text class="sub" x="261.0" y="126.0" text-anchor="middle" dominant-baseline="central">main memory, 480 GB</text></g><g class="u"><rect x="348" y="112" width="110" height="28" rx="3"/><text class="sub" x="403.0" y="126.0" text-anchor="middle" dominant-baseline="central">Grace CPU 2</text></g><g class="u"><rect x="466" y="112" width="142" height="28" rx="3"/><text class="sub" x="537.0" y="126.0" text-anchor="middle" dominant-baseline="central">main memory, 480 GB</text></g><g class="m"><rect x="56" y="162" width="133" height="46" rx="3"/><text class="sub" x="122.5" y="185.0" text-anchor="middle" dominant-baseline="central">GPU 1: 186 GB HBM</text></g><g class="s"><rect x="56" y="220" width="133" height="28" rx="3"/><text class="sub" x="122.5" y="234.0" text-anchor="middle" dominant-baseline="central">network card</text></g><g class="m"><rect x="201" y="162" width="133" height="46" rx="3"/><text class="sub" x="267.5" y="185.0" text-anchor="middle" dominant-baseline="central">GPU 2: 186 GB HBM</text></g><g class="s"><rect x="201" y="220" width="133" height="28" rx="3"/><text class="sub" x="267.5" y="234.0" text-anchor="middle" dominant-baseline="central">network card</text></g><g class="m"><rect x="346" y="162" width="133" height="46" rx="3"/><text class="sub" x="412.5" y="185.0" text-anchor="middle" dominant-baseline="central">GPU 3: 186 GB HBM</text></g><g class="s"><rect x="346" y="220" width="133" height="28" rx="3"/><text class="sub" x="412.5" y="234.0" text-anchor="middle" dominant-baseline="central">network card</text></g><g class="m"><rect x="491" y="162" width="133" height="46" rx="3"/><text class="sub" x="557.5" y="185.0" text-anchor="middle" dominant-baseline="central">GPU 4: 186 GB HBM</text></g><g class="s"><rect x="491" y="220" width="133" height="28" rx="3"/><text class="sub" x="557.5" y="234.0" text-anchor="middle" dominant-baseline="central">network card</text></g><text class="sub2" x="56" y="274" text-anchor="start">the OS runs on the CPUs (dashed); every device is reached through it</text><text class="cap" x="40" y="338" text-anchor="start">Each machine in the rack is a compute tray: two Grace CPUs with their main memory, four GPUs</text><text class="cap" x="40" y="358" text-anchor="start">with their own fast memory, and a 400 Gb/s network card for each GPU. One operating system runs</text><text class="cap" x="40" y="378" text-anchor="start">it: the program, running on the CPUs, that owns every device and hands them out to the other</text><text class="cap" x="40" y="398" text-anchor="start">programs that ask.</text><text class="cap" x="40" y="438" text-anchor="start">Moving bytes between memories is a copy: every byte is read from one place and written to</text><text class="cap" x="40" y="458" text-anchor="start">another, so it costs time in proportion to the bytes, a count against a rate ({{fig:v01-o063}}). A processor</text><text class="cap" x="40" y="478" text-anchor="start">that copies is a processor that is doing nothing else.</text><text class="cap" x="40" y="518" text-anchor="start">Devices can copy without the processor. Direct memory access means a device, such as a network</text><text class="cap" x="40" y="538" text-anchor="start">card, reads or writes memory itself: the processor only says where and how much, and the device</text><text class="cap" x="40" y="558" text-anchor="start">moves the bytes.</text></svg><figcaption>A floor plan of peers, not nesting: none of these parts contains another. The counts are NVIDIA's for a GB200 compute tray; the layout is schematic.</figcaption></figure>
