<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:32</div><h3>A masked position is a blank the model was trained to fill</h3><svg viewBox='0 0 680 582' role='img'><title>A masked position is a blank the model was trained to fill</title><text class="hd" x="40" y="46">After two passes: six positions filled, six still blank</text><g class="u"><rect x="40" y="66" width="48" height="28" rx="3"/><text class="sub" x="64.0" y="80.0" text-anchor="middle" dominant-baseline="central">it</text></g><g class="u"><rect x="90" y="66" width="48" height="28" rx="3"/><text class="sub" x="114.0" y="80.0" text-anchor="middle" dominant-baseline="central">should</text></g><g class="u"><rect x="140" y="66" width="48" height="28" rx="3"/><text class="sub" x="164.0" y="80.0" text-anchor="middle" dominant-baseline="central">add</text></g><g class="u"><rect x="190" y="66" width="48" height="28" rx="3"/><text class="sub" x="214.0" y="80.0" text-anchor="middle" dominant-baseline="central">a</text></g><rect x="240" y="66" width="48" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="264.0" y="80.0" text-anchor="middle" dominant-baseline="central">?</text><g class="u"><rect x="290" y="66" width="48" height="28" rx="3"/><text class="sub" x="314.0" y="80.0" text-anchor="middle" dominant-baseline="central">b</text></g><rect x="340" y="66" width="48" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="364.0" y="80.0" text-anchor="middle" dominant-baseline="central">?</text><rect x="390" y="66" width="48" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="414.0" y="80.0" text-anchor="middle" dominant-baseline="central">?</text><g class="u"><rect x="440" y="66" width="48" height="28" rx="3"/><text class="sub" x="464.0" y="80.0" text-anchor="middle" dominant-baseline="central">takes</text></g><rect x="490" y="66" width="48" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="514.0" y="80.0" text-anchor="middle" dominant-baseline="central">?</text><rect x="540" y="66" width="48" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="564.0" y="80.0" text-anchor="middle" dominant-baseline="central">?</text><rect x="590" y="66" width="48" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="614.0" y="80.0" text-anchor="middle" dominant-baseline="central">?</text><text class="cap" x="40" y="130" text-anchor="start">the model's top guess for each blank, and how sure it is</text><text class="sub2" x="40" y="156" text-anchor="start">position</text><text class="sub2" x="130" y="156" text-anchor="start">top guess</text><text class="sub2" x="250" y="156" text-anchor="start">confidence</text><text class="sub2" x="380" y="156" text-anchor="start">this pass</text><text class="cap" x="40" y="178" text-anchor="start">10</text><text class="cap" x="130" y="178" text-anchor="start">b</text><g class="m"><rect x="250" y="165" width="90.0" height="16" rx="2"/></g><text class="sub2" x="348.0" y="178" text-anchor="start">0.90</text><text class="sub2" x="380" y="178" text-anchor="start">kept</text><text class="cap" x="40" y="202" text-anchor="start">11</text><text class="cap" x="130" y="202" text-anchor="start">from</text><g class="m"><rect x="250" y="189" width="88.0" height="16" rx="2"/></g><text class="sub2" x="346.0" y="202" text-anchor="start">0.88</text><text class="sub2" x="380" y="202" text-anchor="start">kept</text><text class="cap" x="40" y="226" text-anchor="start">12</text><text class="cap" x="130" y="226" text-anchor="start">a</text><g class="m"><rect x="250" y="213" width="84.0" height="16" rx="2"/></g><text class="sub2" x="342.0" y="226" text-anchor="start">0.84</text><text class="sub2" x="380" y="226" text-anchor="start">kept</text><text class="cap" x="40" y="250" text-anchor="start">5</text><text class="cap" x="130" y="250" text-anchor="start">and</text><g class="u"><rect x="250" y="237" width="61.0" height="16" rx="2"/></g><text class="sub2" x="319.0" y="250" text-anchor="start">0.61</text><text class="sub2" x="380" y="250" text-anchor="start">masked again</text><text class="cap" x="40" y="274" text-anchor="start">7</text><text class="cap" x="130" y="274" text-anchor="start">but</text><g class="u"><rect x="250" y="261" width="55.00000000000001" height="16" rx="2"/></g><text class="sub2" x="313.0" y="274" text-anchor="start">0.55</text><text class="sub2" x="380" y="274" text-anchor="start">masked again</text><text class="cap" x="40" y="298" text-anchor="start">8</text><text class="cap" x="130" y="298" text-anchor="start">it</text><g class="u"><rect x="250" y="285" width="49.0" height="16" rx="2"/></g><text class="sub2" x="307.0" y="298" text-anchor="start">0.49</text><text class="sub2" x="380" y="298" text-anchor="start">masked again</text><text class="cap" x="40" y="352" text-anchor="start">A masked position is a blank. In training, random positions of real text are hidden and the model</text><text class="cap" x="40" y="372" text-anchor="start">learns to restore them, scoring every token of its vocabulary for each blank, exactly as an ordinary</text><text class="cap" x="40" y="392" text-anchor="start">model scores the next token ({{fig:v01-o008}}).</text><text class="cap" x="40" y="432" text-anchor="start">When it writes, every blank gets a top guess and a confidence, the probability of that guess</text><text class="cap" x="40" y="452" text-anchor="start">({{fig:v08-o005}}). The most confident guesses are kept and the rest are masked again for the next pass.</text><text class="cap" x="40" y="472" text-anchor="start">LLaDA, a published diffusion model, uses this rule: it re-masks the predictions it is least sure of.</text><text class="cap" x="40" y="512" text-anchor="start">Nothing here waits for the position before it. Positions 10, 11 and 12 are kept in this pass while 5, 7</text><text class="cap" x="40" y="532" text-anchor="start">and 8, earlier in the sentence, stay blank. An ordinary model can guess ahead too, but its positions</text><text class="cap" x="40" y="552" text-anchor="start">still settle one at a time ({{fig:v08-o014}}).</text></svg><figcaption>Illustrative words and confidences. Which guesses to keep is the sampler's rule, and published models differ in it.</figcaption></figure>
