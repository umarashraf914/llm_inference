<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:00</div><h3>The prompt arrives as one block, shared text first and the new question last</h3><svg viewBox='0 0 680 534' role='img'><title>The prompt arrives as one block, shared text first and the new question last</title><text class="hd" x="40" y="46">What arrives at the server, in the order the model reads it</text><text class="cap" x="40" y="87" text-anchor="start">system prompt and tools, 1,500</text><g class="s"><rect x="262.0" y="70" width="138.0" height="24" rx="3"/></g><text class="cap" x="40" y="121" text-anchor="start">earlier turns, 900</text><g class="s"><rect x="400.0" y="104" width="82.8" height="24" rx="3"/></g><text class="cap" x="40" y="155" text-anchor="start">the file that failed, 1,200</text><g class="s"><rect x="482.79999999999995" y="138" width="110.39999999999999" height="24" rx="3"/></g><text class="cap" x="40" y="189" text-anchor="start">the test's error, 300</text><g class="s"><rect x="593.2" y="172" width="27.599999999999998" height="24" rx="3"/></g><text class="cap" x="40" y="223" text-anchor="start">the newest question, 100</text><g class="h"><rect x="620.8" y="206" width="9.2" height="24" rx="3"/></g><line class="axis" x1="262" y1="242" x2="630" y2="242"/><line class="tick" x1="262.0" y1="242" x2="262.0" y2="246"/><text class="sub2" x="262.0" y="260" text-anchor="middle">0</text><line class="tick" x1="354.0" y1="242" x2="354.0" y2="246"/><text class="sub2" x="354.0" y="260" text-anchor="middle">1,000</text><line class="tick" x1="446.0" y1="242" x2="446.0" y2="246"/><text class="sub2" x="446.0" y="260" text-anchor="middle">2,000</text><line class="tick" x1="538.0" y1="242" x2="538.0" y2="246"/><text class="sub2" x="538.0" y="260" text-anchor="middle">3,000</text><line class="tick" x1="630.0" y1="242" x2="630.0" y2="246"/><text class="sub2" x="630.0" y="260" text-anchor="middle">4,000</text><text class="sub2" x="262" y="280" text-anchor="start">position in the prompt, in tokens</text><text class="cap" x="40" y="324" text-anchor="start">The serving software joins everything into one block before the model sees it, always in the same</text><text class="cap" x="40" y="344" text-anchor="start">order: text shared by every user first, then this conversation, then the newest message ({{fig:v01-o023}}).</text><text class="cap" x="40" y="364" text-anchor="start">The model reads it as tokens ({{fig:v01-o006}}), a few thousand here.</text><text class="cap" x="40" y="404" text-anchor="start">The file and the error arrived in earlier turns. A minute ago the assistant ran the test and read the</text><text class="cap" x="40" y="424" text-anchor="start">file, and both outputs joined the conversation as text. So the first four blocks have all been through</text><text class="cap" x="40" y="444" text-anchor="start">the model before; only the last has not.</text><text class="cap" x="40" y="484" text-anchor="start">From arrival to the last token of the answer, the request holds a place somewhere in the rack. The</text><text class="cap" x="40" y="504" text-anchor="start">next three figures say what that place is, and what the rack is.</text></svg><figcaption>Nearly all of this prompt was here a minute ago. Only the last block is new, and that decides where it goes next. Token counts are illustrative; the bars are drawn to scale.</figcaption></figure>
