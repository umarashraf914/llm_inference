<figure><div class='ts'>Fig 01 &nbsp;&middot;&nbsp; 0:00</div><h3>A user asks for a failing test to be fixed</h3><svg viewBox="0 0 680 412" role="img"><title>A user asks for a failing test to be fixed</title><text class="hd" x="40" y="46">What arrives at the server</text><g class="s"><rect x="60" y="66" width="130" height="30" rx="3"></rect><text class="sub" x="125.0" y="81.0" text-anchor="middle" dominant-baseline="central">the user's question</text></g><g class="u"><rect x="60" y="106" width="430" height="30" rx="3"></rect><text class="sub" x="275.0" y="121.0" text-anchor="middle" dominant-baseline="central">a system prompt listing the tools the model may call</text></g><g class="u"><rect x="60" y="146" width="150" height="30" rx="3"></rect><text class="sub" x="135.0" y="161.0" text-anchor="middle" dominant-baseline="central">the file that failed</text></g><g class="u"><rect x="60" y="186" width="200" height="30" rx="3"></rect><text class="sub" x="160.0" y="201.0" text-anchor="middle" dominant-baseline="central">the error the test printed</text></g><g class="u"><rect x="60" y="226" width="320" height="30" rx="3"></rect><text class="sub" x="220.0" y="241.0" text-anchor="middle" dominant-baseline="central">the conversation so far</text></g><text class="cap" x="40" y="290" text-anchor="start">Joined into one block, the prompt runs to a few thousand tokens and arrives as a single</text><text class="cap" x="40" y="310" text-anchor="start">request. From arrival to the last token of the answer, it occupies a slot somewhere in the</text><text class="cap" x="40" y="330" text-anchor="start">rack.</text><text class="cap" x="40" y="370" text-anchor="start">A user asking a coding assistant to fix a failing test. Everything in this document happens</text><text class="cap" x="40" y="390" text-anchor="start">between that question and the answer.</text></svg><figcaption>Every technique in the series appears in this one request. Watching them arrive in order is the point of the episode.</figcaption></figure>
