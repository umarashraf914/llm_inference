"11" rx="2"/></g><g class="u"><rect x="206" y="439" width="22" height="11" rx="2"/></g><g class="m"><rect x="62" y="453" width="22" height="11" rx="2"/></g><g class="m"><rect x="88" y="453" width="22" height="11" rx="2"/></g><g class="m"><rect x="114" y="453" width="22" height="11" rx="2"/></g><g class="m"><rect x="140" y="453" width="22" height="11" rx="2"/></g><g class="u"><rect x="180" y="453" width="22" height="11" rx="2"/></g><g class="u"><rect x="206" y="453" width="22" height="11" rx="2"/></g><g class="m"><rect x="316" y="70" width="22" height="11" rx="2"/></g><text class="sub2" x="348" y="80" text-anchor="start">GPU: 4 in each compute tray</text><g class="u"><rect x="316" y="94" width="22" height="11" rx="2"/></g><text class="sub2" x="348" y="104" text-anchor="start">Grace CPU: 2 in each</text><g class="s"><rect x="316" y="118" width="22" height="11" rx="2"/></g><text class="sub2" x="348" y="128" text-anchor="start">NVLink switch tray: 9 in all</text><text class="cap" x="316" y="168" text-anchor="start">18 compute trays × 4 GPUs = 72 GPUs</text><g class="m"><rect x="316" y="317.0" width="92" height="30" rx="3"/><text class="sub" x="362.0" y="332.0" text-anchor="middle" dominant-baseline="central">one GPU</text></g><line class="conn" x1="412" y1="332.0" x2="516" y2="224.0"/><line class="conn" x1="412" y1="332.0" x2="516" y2="251.0"/><line class="conn" x1="412" y1="332.0" x2="516" y2="278.0"/><line class="conn" x1="412" y1="332.0" x2="516" y2="305.0"/><line class="conn" x1="412" y1="332.0" x2="516" y2="332.0"/><line class="conn" x1="412" y1="332.0" x2="516" y2="359.0"/><line class="conn" x1="412" y1="332.0" x2="516" y2="386.0"/><line class="conn" x1="412" y1="332.0" x2="516" y2="413.0"/><line class="conn" x1="412" y1="332.0" x2="516" y2="440.0"/><g class="s"><rect x="520" y="214" width="120" height="20" rx="3"/><text class="sub" x="580.0" y="224.0" text-anchor="middle" dominant-baseline="central">switch tray 1</text></g><g class="s"><rect x="520" y="241" width="120" height="20" rx="3"/><text class="sub" x="580.0" y="251.0" text-anchor="middle" dominant-baseline="central">switch tray 2</text></g><g class="s"><rect x="520" y="268" width="120" height="20" rx="3"/><text class="sub" x="580.0" y="278.0" text-anchor="middle" dominant-baseline="central">switch tray 3</text></g><g class="s"><rect x="520" y="295" width="120" height="20" rx="3"/><text class="sub" x="580.0" y="305.0" text-anchor="middle" dominant-baseline="central">switch tray 4</text></g><g class="s"><rect x="520" y="322" width="120" height="20" rx="3"/><text class="sub" x="580.0" y="332.0" text-anchor="middle" dominant-baseline="central">switch tray 5</text></g><g class="s"><rect x="520" y="349" width="120" height="20" rx="3"/><text class="sub" x="580.0" y="359.0" text-anchor="middle" dominant-baseline="central">switch tray 6</text></g><g class="s"><rect x="520" y="376" width="120" height="20" rx="3"/><text class="sub" x="580.0" y="386.0" text-anchor="middle" dominant-baseline="central">switch tray 7</text></g><g class="s"><rect x="520" y="403" width="120" height="20" rx="3"/><text class="sub" x="580.0" y="413.0" text-anchor="middle" dominant-baseline="central">switch tray 8</text></g><g class="s"><rect x="520" y="430" width="120" height="20" rx="3"/><text class="sub" x="580.0" y="440.0" text-anchor="middle" dominant-baseline="central">switch tray 9</text></g><text class="sub2" x="316" y="469" text-anchor="start">18 links per GPU, 2 to each switch tray</text><text class="cap" x="40" y="532" text-anchor="start">A rack is a metal cabinet about the height of a person, filled with trays of hardware and plumbed for</text><text class="cap" x="40" y="552" text-anchor="start">power and liquid cooling. In this one, 18 compute trays each hold 4 Blackwell GPUs and 2 Grace</text><text class="cap" x="40" y="572" text-anchor="start">CPUs: 72 GPUs in all.</text><text class="cap" x="40" y="612" text-anchor="start">Nine more trays hold nothing but NVLink switches, 2 switch chips in each. Every GPU has 18 links, 2</text><text class="cap" x="40" y="632" text-anchor="start">into each switch tray, so any GPU reaches any other through a single switch without going out to</text><text class="cap" x="40" y="652" text-anchor="start">the building's network. That mesh of links is the fabric ({{fig:v02-o093}}).</text><text class="cap" x="40" y="692" text-anchor="start">Before this rack, a fast domain was usually the 8 GPUs in one server. Stretching it to 72 is the point</text><text class="cap" x="40" y="712" text-anchor="start">of the design ({{fig:v02-o097}}).</text></svg><figcaption>The physical object the trace runs on. The counts are NVIDIA's; the order of the trays in the cabinet is schematic.</figcaption></figure>
