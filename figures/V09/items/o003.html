<figure><div class='ts'>Fig 03 &nbsp;&middot;&nbsp; 0:24</div><h3>What a rack and a fabric are</h3><svg viewBox='0 0 680 424' role='img'><title>What a rack and a fabric are</title><g class="u"><rect x="40" y="40" width="600" height="176" rx="14"/><text class="lbl" x="62" y="66">One rack</text></g><g class="m"><rect x="66" y="96" width="38" height="26" rx="2"/></g><g class="m"><rect x="112" y="96" width="38" height="26" rx="2"/></g><g class="m"><rect x="158" y="96" width="38" height="26" rx="2"/></g><g class="m"><rect x="204" y="96" width="38" height="26" rx="2"/></g><g class="m"><rect x="250" y="96" width="38" height="26" rx="2"/></g><g class="m"><rect x="296" y="96" width="38" height="26" rx="2"/></g><g class="m"><rect x="342" y="96" width="38" height="26" rx="2"/></g><g class="m"><rect x="388" y="96" width="38" height="26" rx="2"/></g><g class="m"><rect x="434" y="96" width="38" height="26" rx="2"/></g><g class="m"><rect x="480" y="96" width="38" height="26" rx="2"/></g><g class="m"><rect x="526" y="96" width="38" height="26" rx="2"/></g><g class="m"><rect x="572" y="96" width="38" height="26" rx="2"/></g><g class="m"><rect x="66" y="130" width="38" height="26" rx="2"/></g><g class="m"><rect x="112" y="130" width="38" height="26" rx="2"/></g><g class="m"><rect x="158" y="130" width="38" height="26" rx="2"/></g><g class="m"><rect x="204" y="130" width="38" height="26" rx="2"/></g><g class="m"><rect x="250" y="130" width="38" height="26" rx="2"/></g><g class="m"><rect x="296" y="130" width="38" height="26" rx="2"/></g><g class="m"><rect x="342" y="130" width="38" height="26" rx="2"/></g><g class="m"><rect x="388" y="130" width="38" height="26" rx="2"/></g><g class="m"><rect x="434" y="130" width="38" height="26" rx="2"/></g><g class="m"><rect x="480" y="130" width="38" height="26" rx="2"/></g><g class="m"><rect x="526" y="130" width="38" height="26" rx="2"/></g><g class="m"><rect x="572" y="130" width="38" height="26" rx="2"/></g><g class="m"><rect x="66" y="164" width="38" height="26" rx="2"/></g><g class="m"><rect x="112" y="164" width="38" height="26" rx="2"/></g><g class="m"><rect x="158" y="164" width="38" height="26" rx="2"/></g><g class="m"><rect x="204" y="164" width="38" height="26" rx="2"/></g><g class="m"><rect x="250" y="164" width="38" height="26" rx="2"/></g><g class="m"><rect x="296" y="164" width="38" height="26" rx="2"/></g><g class="m"><rect x="342" y="164" width="38" height="26" rx="2"/></g><g class="m"><rect x="388" y="164" width="38" height="26" rx="2"/></g><g class="m"><rect x="434" y="164" width="38" height="26" rx="2"/></g><g class="m"><rect x="480" y="164" width="38" height="26" rx="2"/></g><g class="m"><rect x="526" y="164" width="38" height="26" rx="2"/></g><g class="m"><rect x="572" y="164" width="38" height="26" rx="2"/></g><text class="sub2" x="66" y="240" text-anchor="start">trays of GPUs stacked in a single cabinet</text><text class="cap" x="40" y="290" text-anchor="start">A rack is a metal cabinet about the height of a person, filled with trays of hardware and</text><text class="cap" x="40" y="310" text-anchor="start">plumbed for power and cooling. It is the unit data centres are built out of.</text><text class="cap" x="40" y="346" text-anchor="start">A fabric is the mesh of links joining everything inside it, so that any GPU can talk to any</text><text class="cap" x="40" y="366" text-anchor="start">other without going out to the building's network.</text><text class="cap" x="40" y="402" text-anchor="start">When a rack's fabric is fast enough, the whole cabinet can be treated as one very large GPU.</text></svg><figcaption>The physical object the final trace runs on. Seventy-two chips in one cabinet, wired so tightly they behave as a single machine.</figcaption></figure>
