<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:31</div><h3>The gateway sends the request to whoever already holds its prefix</h3><svg viewBox='0 0 680 360' role='img'><title>The gateway sends the request to whoever already holds its prefix</title><text class="hd" x="40" y="46">An ordinary load balancer, with one difference</text><g class="u"><rect x="40" y="66" width="286" height="78" rx="8"/><text class="lbl" x="183.0" y="88.0" text-anchor="middle" dominant-baseline="central">Normally it picks by</text><text class="sub" x="183.0" y="106.0" text-anchor="middle" dominant-baseline="central">taking turns, or whichever</text><text class="sub" x="183.0" y="123.0" text-anchor="middle" dominant-baseline="central">machine is least busy</text></g><g class="s"><rect x="354" y="66" width="286" height="78" rx="8"/><text class="lbl" x="497.0" y="88.0" text-anchor="middle" dominant-baseline="central">This one picks by</text><text class="sub" x="497.0" y="106.0" text-anchor="middle" dominant-baseline="central">what each machine already</text><text class="sub" x="497.0" y="123.0" text-anchor="middle" dominant-baseline="central">holds in memory</text></g><text class="cap" x="40" y="190" text-anchor="start">A load balancer is a program that sits in front of many identical servers and hands each incoming</text><text class="cap" x="40" y="210" text-anchor="start">request to one of them. The usual rules are simple: take turns, or pick the machine with the fewest</text><text class="cap" x="40" y="230" text-anchor="start">requests in flight. Either spreads the work evenly.</text><text class="cap" x="40" y="270" text-anchor="start">Either would also waste this request. A machine picked by turns holds the shared system prompt, as</text><text class="cap" x="40" y="290" text-anchor="start">every machine does, but is unlikely to hold this conversation, so it would compute the other 2,500</text><text class="cap" x="40" y="310" text-anchor="start">tokens of the prompt again. This gateway instead picks by what each machine already holds, and</text><text class="cap" x="40" y="330" text-anchor="start">the next three figures show what that buys.</text></svg><figcaption>Prefix caching and cache-aware routing, arriving together. The saving happens before any arithmetic is done at all.</figcaption></figure>
