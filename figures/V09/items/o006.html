<figure><div class='ts'>Fig 06 &nbsp;&middot;&nbsp; 2:28</div><h3>Cache-aware routing</h3><svg viewBox="0 0 680 396" role="img"><title>Cache-aware routing</title><text class="hd" x="40" y="46">An ordinary load balancer, with one difference</text><g class="u"><rect x="40" y="70" width="285" height="78" rx="8"></rect><text class="lbl" x="182.5" y="92.0" text-anchor="middle" dominant-baseline="central">Normally picks by</text><text class="sub" x="182.5" y="110.0" text-anchor="middle" dominant-baseline="central">rotation, or whichever</text><text class="sub" x="182.5" y="127.0" text-anchor="middle" dominant-baseline="central">machine is least busy</text></g><g class="s"><rect x="368" y="70" width="272" height="78" rx="8"></rect><text class="lbl" x="504.0" y="92.0" text-anchor="middle" dominant-baseline="central">This one picks by</text><text class="sub" x="504.0" y="110.0" text-anchor="middle" dominant-baseline="central">what each machine already</text><text class="sub" x="504.0" y="127.0" text-anchor="middle" dominant-baseline="central">holds in memory</text></g><text class="cap" x="40" y="194" text-anchor="start">Most of this prompt is a prefix some machine already holds. The system prompt and the tool</text><text class="cap" x="40" y="214" text-anchor="start">definitions do not change between sessions. The earlier turns of this conversation were</text><text class="cap" x="40" y="234" text-anchor="start">prefilled a minute ago when the user asked the previous question.</text><text class="cap" x="40" y="274" text-anchor="start">Only the newest question has never been through the model.</text><text class="cap" x="40" y="314" text-anchor="start">So the gateway sends the request to the machine holding that prefix, and that machine still has</text><text class="cap" x="40" y="334" text-anchor="start">it because the engine keeps a finished request's cache instead of discarding it.</text><text class="cap" x="40" y="374" text-anchor="start">Prefill starts partway through the prompt, at the first token the machine has not seen.</text></svg><figcaption>Prefix caching and cache-aware routing, arriving together. The saving happens before any arithmetic is done at all.</figcaption></figure>
