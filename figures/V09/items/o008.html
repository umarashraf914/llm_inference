<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:24</div><h3>Prefill hands decode a copy of the cache, and keeps the prefix for the next request</h3><svg viewBox='0 0 680 426' role='img'><title>Prefill hands decode a copy of the cache, and keeps the prefix for the next request</title><text class="hd" x="40" y="46">What prefill hands over, and what it keeps</text><g class="m"><rect x="40" y="70" width="230" height="64" rx="6"/><text class="lbl" x="155.0" y="93.0" text-anchor="middle" dominant-baseline="central">prefill machine B</text><text class="sub" x="155.0" y="111.0" text-anchor="middle" dominant-baseline="central">ends with the whole cache, token 1</text></g><g class="h"><rect x="410" y="70" width="230" height="64" rx="6"/><text class="lbl" x="525.0" y="93.0" text-anchor="middle" dominant-baseline="central">the decode machines</text><text class="sub" x="525.0" y="111.0" text-anchor="middle" dominant-baseline="central">write the rest, a token a step</text></g><line class="conn" x1="276" y1="102" x2="404" y2="102" marker-end="url(#arw)"/><text class="sub2" x="340" y="92" text-anchor="middle">a copy of the cache</text><g class="s"><rect x="40" y="160" width="230" height="30" rx="3"/><text class="sub" x="155.0" y="175.0" text-anchor="middle" dominant-baseline="central">the original stays in B's cache</text></g><line class="conn" x1="155" y1="137" x2="155" y2="156" marker-end="url(#arw)"/><text class="sub2" x="290" y="180" text-anchor="start">ready for the next request that shares the prefix</text><text class="cap" x="40" y="236" text-anchor="start">Prefill ends with a key-value cache covering the whole prompt, all 4,000 tokens of it, and with the</text><text class="cap" x="40" y="256" text-anchor="start">first token of the answer: the last layer's scores pick it, exactly as every later step will pick its token.</text><text class="cap" x="40" y="296" text-anchor="start">The rest of the answer is written on the decode machines, so a copy of the cache has to cross to</text><text class="cap" x="40" y="316" text-anchor="start">them, and it has to arrive before generation can continue. The original stays behind on machine B,</text><text class="cap" x="40" y="336" text-anchor="start">ready for the next request that shares the prefix.</text><text class="cap" x="40" y="376" text-anchor="start">Splitting the phases is only worth it if what crosses is small and crosses fast. The model's attention</text><text class="cap" x="40" y="396" text-anchor="start">sets its size and the network sets its speed; the rest of this part takes them in turn.</text></svg><figcaption>The split from the serving episode, seen from this request. Its whole cost is the copy in the middle, which is what the rest of this part shrinks.</figcaption></figure>
