<figure><div class='ts'>Fig 08 &nbsp;&middot;&nbsp; 4:06</div><h3>Disaggregation, and what has to move</h3><svg viewBox="0 0 680 498" role="img"><title>Disaggregation, and what has to move</title><g class="m"><rect x="40" y="62" width="250" height="44" rx="4"></rect><text class="sub" x="165.0" y="84.0" text-anchor="middle" dominant-baseline="central">prefill pool</text></g><line class="conn" x1="296" y1="84" x2="340" y2="84" marker-end="url(#arw)"></line><g class="h"><rect x="346" y="62" width="294" height="44" rx="4"></rect><text class="sub" x="493.0" y="84.0" text-anchor="middle" dominant-baseline="central">decode pool</text></g><text class="sub2" x="296" y="130" text-anchor="start">a copy of the cache has to cross</text><text class="cap" x="40" y="180" text-anchor="start">Prefill ends with a key-value cache covering the whole prompt, and it also produces the first</text><text class="cap" x="40" y="200" text-anchor="start">token of the answer. The rest is generated on the decode machines.</text><text class="cap" x="40" y="240" text-anchor="start">The prefix stays behind, ready for the next request that shares it.</text><text class="hd" x="40" y="290">How large that cache is, is an architectural choice</text><text class="cap" x="40" y="336" text-anchor="start">Standard attention</text><g class="h"><rect x="280" y="320" width="340" height="30" rx="3"></rect><text class="sub" x="450.0" y="335.0" text-anchor="middle" dominant-baseline="central">a full key and value per head, per token, per layer</text></g><text class="cap" x="40" y="396" text-anchor="start">Latent attention</text><g class="s"><rect x="280" y="380" width="30" height="30" rx="3"></rect></g><text class="sub2" x="320" y="399" text-anchor="start">one short vector per layer, about 1,100 bytes</text><text class="cap" x="40" y="456" text-anchor="start">Across 61 layers that comes to about 70 kilobytes for each token in the prompt, so a prompt of</text><text class="cap" x="40" y="476" text-anchor="start">a few thousand tokens makes a cache of a few hundred megabytes.</text></svg><figcaption>The prefill and decode split from the serving episode, with multi-head latent attention deciding how expensive the handoff is.</figcaption></figure>
