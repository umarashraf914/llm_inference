<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:18</div><h3>A byte reaches 1,250 only if 313 tokens use it before it is dropped</h3><svg viewBox='0 0 680 480' role='img'><title>A byte reaches 1,250 only if 313 tokens use it before it is dropped</title><text class="hd" x="40" y="46">Operations one byte of weights performs, by how many tokens use it before it leaves</text><text class="cap" x="40" y="90" text-anchor="start">read once, 1 token</text><g class="u"><rect x="190" y="72" width="2" height="26" rx="3"/></g><text class="sub2" x="202" y="90" text-anchor="start">4 operations</text><text class="cap" x="40" y="130" text-anchor="start">read once, 64 tokens</text><g class="u"><rect x="190" y="112" width="82.70769230769231" height="26" rx="3"/></g><text class="sub2" x="282.7076923076923" y="130" text-anchor="start">256 operations</text><text class="cap" x="40" y="170" text-anchor="start">read once, 312 tokens</text><g class="u"><rect x="190" y="152" width="403.20000000000005" height="26" rx="3"/><text class="sub" x="391.6" y="165.0" text-anchor="middle" dominant-baseline="central">1,248 operations</text></g><text class="cap" x="40" y="210" text-anchor="start">read once, 313 tokens</text><g class="m"><rect x="190" y="192" width="404.4923076923077" height="26" rx="3"/><text class="sub" x="392.24615384615385" y="205.0" text-anchor="middle" dominant-baseline="central">1,252 operations</text></g><line class="mark xok" x1="593.8" y1="64" x2="593.8" y2="226"/><text class="sub2" x="593.8461538461538" y="244" text-anchor="middle">1,250, the ridge</text><text class="cap" x="40" y="290" text-anchor="start">Amortising means spreading one fixed cost over more work ({{fig:v01-o118}}). Reading a byte costs the</text><text class="cap" x="40" y="310" text-anchor="start">same however many tokens use it, and each extra token that uses it before it leaves the chip adds</text><text class="cap" x="40" y="330" text-anchor="start">four operations to what that one read bought.</text><text class="cap" x="40" y="370" text-anchor="start">1,250 ÷ 4 = 312.5, so the byte has to serve 313 tokens to pass the ridge: the roughly 300 tokens the</text><text class="cap" x="40" y="390" text-anchor="start">chip needs. At 312 it falls two operations short.</text><text class="cap" x="40" y="430" text-anchor="start">Those tokens can be other requests sharing the same step, which is batching ({{fig:v07-o003}}), or</text><text class="cap" x="40" y="450" text-anchor="start">several positions of one request: a whole prompt in prefill, or drafted tokens in decode (Part 7).</text></svg><figcaption>Bars to scale. Nothing about the byte changes from row to row; only the number of tokens sharing one read of it does.</figcaption></figure>
