<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:58</div><h3>Every layer split across GPUs stops twice for them to add up their partial results</h3><svg viewBox='0 0 680 484' role='img'><title>Every layer split across GPUs stops twice for them to add up their partial results</title><text class="hd" x="40" y="46">One layer split across 4 GPUs, schematic: compute, wait, exchange, twice</text><text class="cap" x="40" y="83" text-anchor="start">GPU 1</text><g class="m"><rect x="110" y="66" width="96" height="24" rx="3"/></g><rect x="206" y="66" width="8" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="214" y="66" width="40" height="24" rx="3"/></g><g class="m"><rect x="254" y="66" width="130" height="24" rx="3"/></g><rect x="384" y="66" width="6" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="390" y="66" width="40" height="24" rx="3"/></g><text class="cap" x="40" y="117" text-anchor="start">GPU 2</text><g class="m"><rect x="110" y="100" width="104" height="24" rx="3"/></g><g class="h"><rect x="214" y="100" width="40" height="24" rx="3"/></g><g class="m"><rect x="254" y="100" width="122" height="24" rx="3"/></g><rect x="376" y="100" width="14" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="390" y="100" width="40" height="24" rx="3"/></g><text class="cap" x="40" y="151" text-anchor="start">GPU 3</text><g class="m"><rect x="110" y="134" width="92" height="24" rx="3"/></g><rect x="202" y="134" width="12" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="214" y="134" width="40" height="24" rx="3"/></g><g class="m"><rect x="254" y="134" width="136" height="24" rx="3"/></g><g class="h"><rect x="390" y="134" width="40" height="24" rx="3"/></g><text class="cap" x="40" y="185" text-anchor="start">GPU 4</text><g class="m"><rect x="110" y="168" width="100" height="24" rx="3"/></g><rect x="210" y="168" width="4" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="214" y="168" width="40" height="24" rx="3"/></g><g class="m"><rect x="254" y="168" width="126" height="24" rx="3"/></g><rect x="380" y="168" width="10" height="24" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="390" y="168" width="40" height="24" rx="3"/></g><text class="sub2" x="162.0" y="212" text-anchor="middle">attention</text><text class="sub2" x="234.0" y="212" text-anchor="middle">all-reduce</text><text class="sub2" x="322.0" y="212" text-anchor="middle">feed-forward</text><text class="sub2" x="410.0" y="212" text-anchor="middle">all-reduce</text><line class="conn" x1="438" y1="129" x2="470" y2="129" marker-end="url(#arw)"/><text class="sub2" x="478" y="123" text-anchor="start">next layer:</text><text class="sub2" x="478" y="139" text-anchor="start">× 61 = 122 exchanges</text><text class="cap" x="40" y="254" text-anchor="start">Tensor parallelism cuts each weight matrix into slices, one per GPU ({{fig:v05-o009}}). Attention divides</text><text class="cap" x="40" y="274" text-anchor="start">by heads; the feed-forward block cuts its first matrix by columns and its second by rows. Each GPU</text><text class="cap" x="40" y="294" text-anchor="start">ends up holding part of the layer's answer, and an all-reduce adds the parts and hands every GPU</text><text class="cap" x="40" y="314" text-anchor="start">the total ({{fig:v05-o007}}).</text><text class="cap" x="40" y="354" text-anchor="start">Nothing can continue until the slowest GPU has finished and the sum has arrived, so a layer split</text><text class="cap" x="40" y="374" text-anchor="start">this way stops twice ({{fig:v05-o010}}). Through 61 layers that is 122 exchanges in every forward pass,</text><text class="cap" x="40" y="394" text-anchor="start">which is why the split stays on the rack's fast links.</text><text class="cap" x="40" y="434" text-anchor="start">In this model the feed-forward half of nearly every layer is a mixture of experts, which is usually</text><text class="cap" x="40" y="454" text-anchor="start">spread by expert rather than sliced, so its exchange is an all-to-all instead (next two figures).</text></svg><figcaption>Schematic timings. The dashed gaps are GPUs waiting for the slowest one, and an exchange at every layer is affordable only on the fastest links in the building.</figcaption></figure>
