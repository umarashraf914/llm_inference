<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:24</div><h3>Remote direct memory access sends the cache card to card, past both operating systems</h3><svg viewBox='0 0 680 580' role='img'><title>Remote direct memory access sends the cache card to card, past both operating systems</title><text class="hd" x="40" y="46">Two routes for the same cache, schematic</text><text class="cap" x="52" y="74" text-anchor="start">the ordinary route</text><text class="cap" x="362" y="74" text-anchor="start">remote direct memory access</text><g class="m"><rect x="52" y="92" width="116" height="34" rx="3"/><text class="sub" x="110.0" y="109.0" text-anchor="middle" dominant-baseline="central">GPU memory</text></g><g class="u"><rect x="52" y="152" width="116" height="34" rx="3"/><text class="sub" x="110.0" y="169.0" text-anchor="middle" dominant-baseline="central">main memory</text></g><g class="s"><rect x="52" y="212" width="116" height="34" rx="3"/><text class="sub" x="110.0" y="229.0" text-anchor="middle" dominant-baseline="central">network card</text></g><g class="m"><rect x="200" y="92" width="116" height="34" rx="3"/><text class="sub" x="258.0" y="109.0" text-anchor="middle" dominant-baseline="central">GPU memory</text></g><g class="u"><rect x="200" y="152" width="116" height="34" rx="3"/><text class="sub" x="258.0" y="169.0" text-anchor="middle" dominant-baseline="central">main memory</text></g><g class="s"><rect x="200" y="212" width="116" height="34" rx="3"/><text class="sub" x="258.0" y="229.0" text-anchor="middle" dominant-baseline="central">network card</text></g><line class="conn" x1="172" y1="229" x2="196" y2="229" marker-end="url(#arw)"/><line class="conn" x1="110" y1="128" x2="110" y2="148" marker-end="url(#arw)"/><line class="conn" x1="110" y1="188" x2="110" y2="208" marker-end="url(#arw)"/><text class="sub2" x="118" y="141" text-anchor="start">copy</text><text class="sub2" x="118" y="201" text-anchor="start">copy</text><line class="conn" x1="258" y1="206" x2="258" y2="186" marker-end="url(#arw)"/><line class="conn" x1="258" y1="146" x2="258" y2="126" marker-end="url(#arw)"/><text class="sub2" x="266" y="141" text-anchor="start">copy</text><text class="sub2" x="266" y="201" text-anchor="start">copy</text><g class="m"><rect x="362" y="92" width="116" height="34" rx="3"/><text class="sub" x="420.0" y="109.0" text-anchor="middle" dominant-baseline="central">GPU memory</text></g><rect x="362" y="152" width="116" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="420.0" y="169.0" text-anchor="middle" dominant-baseline="central">untouched</text><g class="s"><rect x="362" y="212" width="116" height="34" rx="3"/><text class="sub" x="420.0" y="229.0" text-anchor="middle" dominant-baseline="central">network card</text></g><g class="m"><rect x="510" y="92" width="116" height="34" rx="3"/><text class="sub" x="568.0" y="109.0" text-anchor="middle" dominant-baseline="central">GPU memory</text></g><rect x="510" y="152" width="116" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="568.0" y="169.0" text-anchor="middle" dominant-baseline="central">untouched</text><g class="s"><rect x="510" y="212" width="116" height="34" rx="3"/><text class="sub" x="568.0" y="229.0" text-anchor="middle" dominant-baseline="central">network card</text></g><line class="conn" x1="482" y1="229" x2="506" y2="229" marker-end="url(#arw)"/><polyline class="conn" points="362,109 354,109 354,229 360,229" marker-end="url(#arw)"/><polyline class="conn" points="628,229 634,229 634,109 628,109" marker-end="url(#arw)"/><text class="sub2" x="110" y="266" text-anchor="middle">sender</text><text class="sub2" x="258" y="266" text-anchor="middle">receiver</text><text class="sub2" x="420" y="266" text-anchor="middle">sender</text><text class="sub2" x="568" y="266" text-anchor="middle">receiver</text><text class="sub2" x="362" y="286" text-anchor="start">the OS only grants permission, once, ahead of time</text><text class="cap" x="40" y="330" text-anchor="start">Ordinarily a program hands its data to the operating system, which copies it into its own buffers in</text><text class="cap" x="40" y="350" text-anchor="start">main memory before the network card sends it, and the receiving machine's operating system</text><text class="cap" x="40" y="370" text-anchor="start">copies it out again. For a cache held in GPU memory there are further copies to and from main</text><text class="cap" x="40" y="390" text-anchor="start">memory at each end, and a processor spends time on every byte.</text><text class="cap" x="40" y="430" text-anchor="start">Remote direct memory access skips all of that. The network card on the prefill machine reads the</text><text class="cap" x="40" y="450" text-anchor="start">cache straight out of GPU memory and the card on the decode machine writes it straight into GPU</text><text class="cap" x="40" y="470" text-anchor="start">memory, so neither processor touches the data and neither operating system is involved. The</text><text class="cap" x="40" y="490" text-anchor="start">operating systems only register the memory in advance and grant the cards permission.</text><text class="cap" x="40" y="530" text-anchor="start">Storing the cache at eight or four bits instead of sixteen trims it further before it crosses:</text><text class="cap" x="40" y="550" text-anchor="start">quantization applied to the cache rather than the weights ({{fig:v04-o070}}).</text></svg><figcaption>Schematic: how many copies the ordinary route makes depends on the software. The transfer is the price disaggregation pays, and three techniques cut it: latent attention, a narrower cache, and this shorter route.</figcaption></figure>
