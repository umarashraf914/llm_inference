<figure><div class='ts'>Fig 09 &nbsp;&middot;&nbsp; 5:20</div><h3>Getting the cache across</h3><svg viewBox="0 0 680 296" role="img"><title>Getting the cache across</title><text class="hd" x="40" y="46">Moving a few hundred megabytes between machines</text><g class="h"><rect x="40" y="70" width="285" height="78" rx="8"></rect><text class="lbl" x="182.5" y="92.0" text-anchor="middle" dominant-baseline="central">Normally</text><text class="sub" x="182.5" y="110.0" text-anchor="middle" dominant-baseline="central">work for both operating</text><text class="sub" x="182.5" y="127.0" text-anchor="middle" dominant-baseline="central">systems, and both processors</text></g><g class="s"><rect x="368" y="70" width="272" height="78" rx="8"></rect><text class="lbl" x="504.0" y="92.0" text-anchor="middle" dominant-baseline="central">Remote direct memory access</text><text class="sub" x="504.0" y="110.0" text-anchor="middle" dominant-baseline="central">the network card reads it</text><text class="sub" x="504.0" y="127.0" text-anchor="middle" dominant-baseline="central">straight out of memory</text></g><text class="cap" x="40" y="194" text-anchor="start">The card on the prefill machine writes it directly into the memory of the decode machine.</text><text class="cap" x="40" y="214" text-anchor="start">Neither processor touches the data and neither operating system is involved.</text><text class="cap" x="40" y="254" text-anchor="start">Storing the cache at eight or four bits instead of sixteen trims it further before it crosses,</text><text class="cap" x="40" y="274" text-anchor="start">which is quantization applied to the cache rather than to the weights.</text></svg><figcaption>The transfer is the price disaggregation pays. Two independent techniques, one architectural and one networking, are spent making that price small.</figcaption></figure>
