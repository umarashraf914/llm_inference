<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:47</div><h3>Turn up the batch and the drafts, and watch them meet at the ridge</h3><div class='wg'><div class='ctl'><label>sequences in the batch <input type='range' min='0' max='9' step='1' value='0'><span class='val'>1</span></label><label>drafts per sequence <input type='range' min='0' max='7' step='1' value='4'><span class='val'>4</span></label></div><div class='ctl'><label>chance each draft is kept <input type='range' min='0' max='4' step='1' value='3'><span class='val'>0.8</span></label><button type='button'>Reset</button></div><svg viewBox='0 0 680 658' role='img'><title>Turn up the batch and the drafts, and watch them meet at the ridge</title><text class="sub2" x="110" y="26" text-anchor="start">operations a second (log scale), one Blackwell GPU at 4 bits</text><line class="axis" x1="110" y1="240" x2="620" y2="240"/><line class="axis" x1="110" y1="40" x2="110" y2="240"/><line class="tick" x1="110.0" y1="240" x2="110.0" y2="244"/><text class="sub2" x="110.0" y="258" text-anchor="middle">1</text><line class="tick" x1="237.5" y1="240" x2="237.5" y2="244"/><text class="sub2" x="237.5" y="258" text-anchor="middle">10</text><line class="tick" x1="365.0" y1="240" x2="365.0" y2="244"/><text class="sub2" x="365.0" y="258" text-anchor="middle">100</text><line class="tick" x1="492.5" y1="240" x2="492.5" y2="244"/><text class="sub2" x="492.5" y="258" text-anchor="middle">1,000</text><line class="tick" x1="620.0" y1="240" x2="620.0" y2="244"/><text class="sub2" x="620.0" y="258" text-anchor="middle">10,000</text><line class="tick" x1="106" y1="240.0" x2="110" y2="240.0"/><text class="sub2" x="102" y="244.0" text-anchor="end">10¹²</text><line class="tick" x1="106" y1="200.0" x2="110" y2="200.0"/><text class="sub2" x="102" y="204.0" text-anchor="end">10¹³</text><line class="tick" x1="106" y1="160.0" x2="110" y2="160.0"/><text class="sub2" x="102" y="164.0" text-anchor="end">10¹⁴</text><line class="tick" x1="106" y1="120.0" x2="110" y2="120.0"/><text class="sub2" x="102" y="124.0" text-anchor="end">10¹⁵</text><line class="tick" x1="106" y1="80.0" x2="110" y2="80.0"/><text class="sub2" x="102" y="84.0" text-anchor="end">10¹⁶</text><line class="tick" x1="106" y1="40.0" x2="110" y2="40.0"/><text class="sub2" x="102" y="44.0" text-anchor="end">10¹⁷</text><text class="sub2" x="365.0" y="278" text-anchor="middle">operations per byte of weights read (log scale)</text><polyline class="pl-m" points="110.0,203.9 504.9,80.0 620.0,80.0"/><line class="mark" x1="504.9" y1="88.0" x2="504.9" y2="236"/><text class="sub2" x="512.8560266585272" y="230" text-anchor="start">ridge 1,250</text><circle data-pt="" cx="275.9" cy="151.8" r="5" fill="var(--paper)" stroke="var(--m)" stroke-width="2"/><g class="u"><text class="sub" x="40" y="316" data-l="0">positions computed per read: 1 × (4 + 1) = 5</text></g><g class="u"><text class="sub" x="40" y="338" data-l="1">operations per byte: 4 × 5 = 20, 1.60% of peak</text></g><g class="u"><text class="sub" x="40" y="360" data-l="2">tokens kept per read, on average: 1 × 3.36 = 3.4</text></g><g class="u"><text class="sub" x="40" y="382" data-l="3">share of computed positions kept: 67.2%</text></g><text class="cap" x="40" y="432" text-anchor="start">Start with one sequence and four drafts: five positions per read, and the point sits far down the</text><text class="cap" x="40" y="452" text-anchor="start">slope, so the drafts cost nothing. On average 3.36 of the five positions turn into kept tokens when</text><text class="cap" x="40" y="472" text-anchor="start">each draft is kept with chance 0.8: 1 + 0.8 + 0.8² + 0.8³ + 0.8⁴, since a draft counts only if every</text><text class="cap" x="40" y="492" text-anchor="start">draft before it was kept, and the pass always yields one token of its own.</text><text class="cap" x="40" y="532" text-anchor="start">Now raise the batch to 64. The point crosses the ridge, and from there every extra position costs</text><text class="cap" x="40" y="552" text-anchor="start">time, while about a third of the positions computed are thrown away. Batching and speculation are</text><text class="cap" x="40" y="572" text-anchor="start">spending the same idle arithmetic.</text><text class="cap" x="40" y="612" text-anchor="start">Acceptance is treated as the same chance for every draft, which real drafters only approximate</text><text class="cap" x="40" y="632" text-anchor="start">({{fig:v08-o008}}). The widget's arithmetic was checked against Python at every setting.</text></svg></div><figcaption>Positions computed and tokens kept come apart as soon as drafts are added; both batching and speculation stop being free at the same line.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const BS = [1, 2, 4, 8, 16, 32, 64, 128, 256, 313], AS = [0.5, 0.6, 0.7, 0.8, 0.9], G = {"x0": 110, "x1": 620, "dx": 4, "y0": 40, "y1": 240, "lo": 12, "dy": 5}, PEAK = 1e16, BW = 8e12, RIDGE = 1250, INIT = [0, 4, 3];
  const sl = [...fig.querySelectorAll('input[type=range]')], val = [...fig.querySelectorAll('.val')];
  const q = s => fig.querySelector(s);
  const com = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const fx = (v, d) => { const [i, f] = Math.abs(v).toFixed(d).split('.');
    return (v < 0 && +Math.abs(v).toFixed(d) !== 0 ? '−' : '') + com(i) + (f ? '.' + f : ''); };
  const X = I => G.x0 + Math.log10(I) / G.dx * (G.x1 - G.x0);
  const Y = a => G.y1 - (Math.log10(a) - G.lo) / G.dy * (G.y1 - G.y0);
  function draw() {
    const B = BS[+sl[0].value], d = +sl[1].value, a = AS[+sl[2].value];
    val[0].textContent = com(String(B)); val[1].textContent = String(d); val[2].textContent = a.toFixed(1);
    const P = B * (d + 1), I = 4 * P;
    let e = 1, p = 1;
    for (let i = 0; i < d; i++) { p *= a; e += p; }
    const K = B * e;
    const pct = I >= RIDGE ? '100%' : fx(100 * I / RIDGE, 2) + '%';
    const tail = I >= RIDGE ? ', past the ridge: each extra position now costs time' : ' of peak';
    const L = [`positions computed per read: ${com(String(B))} × (${d} + 1) = ${com(String(P))}`,
               `operations per byte: 4 × ${com(String(P))} = ${com(String(I))}, ${pct}${tail}`,
               `tokens kept per read, on average: ${com(String(B))} × ${fx(e, 2)} = ${fx(K, 1)}`,
               `share of computed positions kept: ${fx(100 * K / P, 1)}%`];
    L.forEach((s, k) => q(`[data-l="${k}"]`).textContent = s);
    const pt = q('[data-pt]');
    pt.setAttribute('cx', X(I).toFixed(1)); pt.setAttribute('cy', Y(Math.min(PEAK, BW * I)).toFixed(1));
  }
  sl.forEach(s => s.addEventListener('input', draw));
  q('button').addEventListener('click', () => { sl.forEach((s, k) => s.value = INIT[k]); draw(); });
  draw();
})();</script></figure>
