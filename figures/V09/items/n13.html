<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:53</div><h3>FlashAttention-4 is the same fused kernel, rebuilt around Blackwell's slow exponential</h3><svg viewBox='0 0 680 650' role='img'><title>FlashAttention-4 is the same fused kernel, rebuilt around Blackwell's slow exponential</title><text class="hd" x="40" y="46">Four versions of one exact kernel, each fixing the constraint the last exposed</text><g class="h"><rect x="40" y="66" width="250" height="50" rx="6"/><text class="sub" x="165" y="84" text-anchor="middle" dominant-baseline="central">the score matrix goes out to memory</text><text class="sub" x="165" y="100" text-anchor="middle" dominant-baseline="central">and back, at every layer</text></g><line class="conn" x1="296" y1="91" x2="330" y2="91" marker-end="url(#arw)"/><g class="s"><rect x="336" y="66" width="200" height="50" rx="6"/><text class="sub" x="436" y="84" text-anchor="middle" dominant-baseline="central">v1: build it tile by tile</text><text class="sub" x="436" y="100" text-anchor="middle" dominant-baseline="central">on chip, never store it</text></g><text class="sub2" x="548" y="96" text-anchor="start">{{fig:v03-o037}}</text><line class="conn" x1="436" y1="120" x2="200" y2="138" marker-end="url(#arw)"/><g class="h"><rect x="40" y="142" width="250" height="50" rx="6"/><text class="sub" x="165" y="160" text-anchor="middle" dominant-baseline="central">scalar work sits between the</text><text class="sub" x="165" y="176" text-anchor="middle" dominant-baseline="central">matrix multiplies</text></g><line class="conn" x1="296" y1="167" x2="330" y2="167" marker-end="url(#arw)"/><g class="s"><rect x="336" y="142" width="200" height="50" rx="6"/><text class="sub" x="436" y="160" text-anchor="middle" dominant-baseline="central">v2: do less of it, and split</text><text class="sub" x="436" y="176" text-anchor="middle" dominant-baseline="central">the work across more blocks</text></g><text class="sub2" x="548" y="172" text-anchor="start">{{fig:v03-o066}}</text><line class="conn" x1="436" y1="196" x2="200" y2="214" marker-end="url(#arw)"/><g class="h"><rect x="40" y="218" width="250" height="50" rx="6"/><text class="sub" x="165" y="236" text-anchor="middle" dominant-baseline="central">copying and multiplying</text><text class="sub" x="165" y="252" text-anchor="middle" dominant-baseline="central">take turns</text></g><line class="conn" x1="296" y1="243" x2="330" y2="243" marker-end="url(#arw)"/><g class="s"><rect x="336" y="218" width="200" height="50" rx="6"/><text class="sub" x="436" y="236" text-anchor="middle" dominant-baseline="central">v3: asynchronous units</text><text class="sub" x="436" y="252" text-anchor="middle" dominant-baseline="central">run them at the same time</text></g><text class="sub2" x="548" y="248" text-anchor="start">{{fig:v03-o072}}</text><line class="conn" x1="436" y1="272" x2="200" y2="290" marker-end="url(#arw)"/><g class="h"><rect x="40" y="294" width="250" height="50" rx="6"/><text class="sub" x="165" y="312" text-anchor="middle" dominant-baseline="central">Blackwell's tensor cores: 2.25×</text><text class="sub" x="165" y="328" text-anchor="middle" dominant-baseline="central">faster; its exponential unit: not</text></g><line class="conn" x1="296" y1="319" x2="330" y2="319" marker-end="url(#arw)"/><g class="s"><rect x="336" y="294" width="200" height="50" rx="6"/><text class="sub" x="436" y="312" text-anchor="middle" dominant-baseline="central">v4: some exponentials by</text><text class="sub" x="436" y="328" text-anchor="middle" dominant-baseline="central">polynomial, on idle cores</text></g><text class="sub2" x="548" y="324" text-anchor="start">{{fig:v03-o079}}</text><text class="sub2" x="40" y="376" text-anchor="start">result: about 71% of the tensor cores' peak on a B200 ({{fig:v03-o081}})</text><text class="cap" x="40" y="420" text-anchor="start">Attention scores every earlier token against the current one, turns the scores into shares with</text><text class="cap" x="40" y="440" text-anchor="start">softmax, and blends the tokens' values by those shares ({{fig:v03-o021}}). A kernel is one function the</text><text class="cap" x="40" y="460" text-anchor="start">GPU runs over many blocks of threads at once ({{fig:v03-o004}}), and FlashAttention fuses all of attention</text><text class="cap" x="40" y="480" text-anchor="start">into one, so the scores never leave the chip ({{fig:v03-o033}}).</text><text class="cap" x="40" y="520" text-anchor="start">Each version solved the bottleneck the previous one exposed. On Blackwell the tensor cores do</text><text class="cap" x="40" y="540" text-anchor="start">8,192 operations a cycle against 16 exponentials, a gap of 512 times, so version 4 computes some</text><text class="cap" x="40" y="560" text-anchor="start">exponentials with a short polynomial on cores that were otherwise idle, and rescales less often</text><text class="cap" x="40" y="580" text-anchor="start">({{fig:v03-o080}}).</text><text class="cap" x="40" y="620" text-anchor="start">Version 4, the attention kernel written for Blackwell, is the one this request's prefill runs.</text></svg><figcaption>Every version computes exactly the same attention. What changed each time was which unit the work was waiting on.</figcaption></figure>
