ext></g><g class="s"><rect x="410" y="376.0" width="209" height="26" rx="3"/><text class="sub" x="514.5" y="389.0" text-anchor="middle" dominant-baseline="central">direct memory access · {{ref:v09-o009}}</text></g><g class="u"><rect x="40" y="342" width="150" height="60" rx="4"/><text class="lbl" x="115.0" y="363.0" text-anchor="middle" dominant-baseline="central">3 · cache transfer</text><text class="sub" x="115.0" y="381.0" text-anchor="middle" dominant-baseline="central">crosses the network</text></g><g class="s"><rect x="212" y="426.0" width="159" height="26" rx="3"/><text class="sub" x="291.5" y="439.0" text-anchor="middle" dominant-baseline="central">paged cache · {{ref:v03-o086}}</text></g><g class="s"><rect x="379" y="426.0" width="198" height="26" rx="3"/><text class="sub" x="478.0" y="439.0" text-anchor="middle" dominant-baseline="central">continuous batching · {{ref:v07-o006}}</text></g><g class="s"><rect x="212" y="460.0" width="204" height="26" rx="3"/><text class="sub" x="314.0" y="473.0" text-anchor="middle" dominant-baseline="central">speculative decoding · {{ref:v08-o002}}</text></g><g class="s"><rect x="424" y="460.0" width="194" height="26" rx="3"/><text class="sub" x="521.0" y="473.0" text-anchor="middle" dominant-baseline="central">long-context cache · {{ref:v08-o015}}</text></g><g class="s"><rect x="212" y="494.0" width="168" height="26" rx="3"/><text class="sub" x="296.0" y="507.0" text-anchor="middle" dominant-baseline="central">flash decoding · {{ref:v03-o094}}</text></g><g class="s"><rect x="388" y="494.0" width="179" height="26" rx="3"/><text class="sub" x="477.5" y="507.0" text-anchor="middle" dominant-baseline="central">launch overhead · {{ref:v03-o095}}</text></g><g class="u"><rect x="40" y="426" width="150" height="94" rx="4"/><text class="lbl" x="115.0" y="464.0" text-anchor="middle" dominant-baseline="central">4 · decode pool</text><text class="sub" x="115.0" y="482.0" text-anchor="middle" dominant-baseline="central">one token per step</text></g><g class="s"><rect x="212" y="553.0" width="152" height="26" rx="3"/><text class="sub" x="288.0" y="566.0" text-anchor="middle" dominant-baseline="central">the sampler · {{ref:v07-o021}}</text></g><g class="s"><rect x="372" y="553.0" width="186" height="26" rx="3"/><text class="sub" x="465.0" y="566.0" text-anchor="middle" dominant-baseline="central">masking the logits · {{ref:v07-o023}}</text></g><g class="u"><rect x="40" y="544" width="150" height="44" rx="4"/><text class="lbl" x="115.0" y="557.0" text-anchor="middle" dominant-baseline="central">5 · constrained pick</text><text class="sub" x="115.0" y="575.0" text-anchor="middle" dominant-baseline="central">only valid tokens</text></g><g class="s"><rect x="212" y="612.0" width="140" height="26" rx="3"/><text class="sub" x="282.0" y="625.0" text-anchor="middle" dominant-baseline="central">streaming · {{ref:v01-o058}}</text></g><g class="s"><rect x="360" y="612.0" width="172" height="26" rx="3"/><text class="sub" x="446.0" y="625.0" text-anchor="middle" dominant-baseline="central">TTFT and TPOT · {{ref:v01-o143}}</text></g><g class="s"><rect x="212" y="646.0" width="133" height="26" rx="3"/><text class="sub" x="278.5" y="659.0" text-anchor="middle" dominant-baseline="central">goodput · {{ref:v07-o016}}</text></g><g class="s"><rect x="353" y="646.0" width="149" height="26" rx="3"/><text class="sub" x="427.5" y="659.0" text-anchor="middle" dominant-baseline="central">percentiles · {{ref:v08-o025}}</text></g><g class="u"><rect x="40" y="612" width="150" height="60" rx="4"/><text class="lbl" x="115.0" y="633.0" text-anchor="middle" dominant-baseline="central">6 · the user</text><text class="sub" x="115.0" y="651.0" text-anchor="middle" dominant-baseline="central">sees the stream</text></g><line class="conn" x1="115.0" y1="169" x2="115.0" y2="187" marker-end="url(#arw)"/><line class="conn" x1="115.0" y1="321" x2="115.0" y2="339" marker-end="url(#arw)"/><line class="conn" x1="115.0" y1="405" x2="115.0" y2="423" marker-end="url(#arw)"/><line class="conn" x1="115.0" y1="523" x2="115.0" y2="541" marker-end="url(#arw)"/><line class="conn" x1="115.0" y1="591" x2="115.0" y2="609" marker-end="url(#arw)"/><g class="h"><rect x="40" y="700" width="600" height="32" rx="3"/><text class="sub" x="340.0" y="716.0" text-anchor="middle" dominant-baseline="central">under every stop: the memory wall, {{ref:v01-o082}}, and the ridge it sets, {{ref:v01-o126}}</text></g><text class="cap" x="40" y="772" text-anchor="start">These are the stops of the route {{fig:v01-o060}} drew in the first episode, named for this request. The</text><text class="cap" x="40" y="792" text-anchor="start">router is the gateway here, and the pick, which happens inside every decode step, gets a stop of its</text><text class="cap" x="40" y="812" text-anchor="start">own because this answer has to be a tool call.</text><text class="cap" x="40" y="852" text-anchor="start">Beside each stop are the techniques the request meets there, each linked to the figure that builds it.</text><text class="cap" x="40" y="872" text-anchor="start">All but one point back to an earlier episode. The exception, direct memory access between</text><text class="cap" x="40" y="892" text-anchor="start">machines, is built in this one ({{fig:v09-o009}}).</text><text class="cap" x="40" y="932" text-anchor="start">Under every stop sits the same constraint. A Blackwell GPU could use 1,250 operations for every</text><text class="cap" x="40" y="952" text-anchor="start">byte it fetches, and a lone decode step offers it 4. Part 3 derives both numbers.</text></svg><figcaption>Only one technique on this route is new to the series. The final episode is an assembly, and each stop is one click from the figure that built it.</figcaption></figure>
