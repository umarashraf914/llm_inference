<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:46</div><h3>A trillion 4-bit weights fill about 4% of the rack, and the cache gets the rest</h3><svg viewBox='0 0 680 454' role='img'><title>A trillion 4-bit weights fill about 4% of the rack, and the cache gets the rest</title><text class="cap" x="40" y="60" text-anchor="start">Memory in the rack</text><g class="u"><rect x="40" y="70" width="600" height="28" rx="3"/><text class="sub" x="340.0" y="84.0" text-anchor="middle" dominant-baseline="central">13.4 TB of HBM across 72 GPUs</text></g><text class="cap" x="40" y="140" text-anchor="start">What the model takes</text><g class="s"><rect x="40" y="150" width="25.186567164179102" height="28" rx="3"/></g><rect x="65.18656716417911" y="150" width="574.8134328358209" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="352.59328358208955" y="164.0" text-anchor="middle" dominant-baseline="central">about 12.9 TB left for key-value cache</text><text class="sub2" x="40" y="198" text-anchor="start">the weights: 500 GB as 4-bit codes, 562.5 GB with their block scales, 4.2% of the rack</text><text class="cap" x="40" y="244" text-anchor="start">A trillion parameters stored at 4 bits, half a byte each, come to 500 gigabytes ({{fig:v01-o073}}): 3.7% of</text><text class="cap" x="40" y="264" text-anchor="start">the rack's 13.4 terabytes, under 4%.</text><text class="cap" x="40" y="304" text-anchor="start">That counts the 4-bit codes alone. Every block of 16 weights also carries an 8-bit scale (Part 5), half</text><text class="cap" x="40" y="324" text-anchor="start">a bit more per weight: 0.5625 bytes each, or 562.5 GB, about 4.2% ({{fig:v04-o058}}). The bar above</text><text class="cap" x="40" y="344" text-anchor="start">includes them. The picture does not change.</text><text class="cap" x="40" y="384" text-anchor="start">What is left, about 12.9 terabytes (12.8 counting the scales), holds key-value cache: the attention</text><text class="cap" x="40" y="404" text-anchor="start">state every conversation keeps and reuses for each new token ({{fig:v01-o136}}). The weights no longer</text><text class="cap" x="40" y="424" text-anchor="start">fill the machine. The conversations do.</text></svg><figcaption>Bars to scale. Four-bit weights and 13 terabytes of memory turn the model into a sliver and make the cache the main tenant.</figcaption></figure>
