ribed as a single massive GPU.</text><text class="cap" x="40" y="314" text-anchor="start">Memory in the rack</text><g class="u"><rect x="300" y="298" width="320" height="30" rx="3"></rect><text class="sub" x="460.0" y="313" text-anchor="middle" dominant-baseline="central">13.4 terabytes</text></g><text class="cap" x="40" y="374" text-anchor="start">The model, at 4 bits</text><g class="s"><rect x="300" y="358" width="12" height="30" rx="1"></rect></g><text class="sub2" x="322" y="377" text-anchor="start">500 GB, under 4% of it</text><text class="cap" x="40" y="436" text-anchor="start">A trillion parameters stored four bits each come to 500 gigabytes. That leaves 12.9 terabytes</text><text class="cap" x="40" y="456" text-anchor="start">for key-value cache, the attention state every conversation reuses for each new token.</text><text class="cap" x="40" y="496" text-anchor="start">The weights are no longer the thing filling the machine. The conversations are.</text></svg><figcaption>A striking inversion. Four-bit weights and 13 terabytes of memory turn the model into a rounding error and make the cache the main tenant.</figcaption></figure>
