<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:06</div><h3>The tools are text in the prompt, and the call they produce is text that software runs</h3><svg viewBox='0 0 680 590' role='img'><title>The tools are text in the prompt, and the call they produce is text that software runs</title><text class="hd" x="40" y="46">One turn of the loop: text in, text out, and software in between</text><g class="u"><rect x="40" y="70" width="258" height="152" rx="14"/><text class="lbl" x="62" y="96">In the prompt: the tools</text></g><g class="u"><text class="sub" x="62" y="126">run_tests(path)</text></g><g class="u"><text class="sub" x="62" y="146">read_file(path)</text></g><g class="u"><text class="sub" x="62" y="166">edit_file(path, find, replace)</text></g><g class="u"><rect x="382" y="70" width="258" height="152" rx="14"/><text class="lbl" x="404" y="96">Out of the model: a call</text></g><g class="u"><text class="sub" x="404" y="126" style="white-space:pre">{"name": "edit_file",</text></g><g class="u"><text class="sub" x="404" y="146" style="white-space:pre"> "arguments": {</text></g><g class="u"><text class="sub" x="404" y="166" style="white-space:pre">   "path": "parser.py",</text></g><g class="u"><text class="sub" x="404" y="186" style="white-space:pre">   "find": "a - b",</text></g><g class="u"><text class="sub" x="404" y="206" style="white-space:pre">   "replace": "a + b"}}</text></g><line class="conn" x1="304" y1="146" x2="376" y2="146" marker-end="url(#arw)"/><text class="sub2" x="340.0" y="136" text-anchor="middle">the model</text><g class="u"><rect x="205" y="282" width="270" height="52" rx="6"/><text class="lbl" x="340.0" y="299.0" text-anchor="middle" dominant-baseline="central">the serving software</text><text class="sub" x="340.0" y="317.0" text-anchor="middle" dominant-baseline="central">parses the call and runs the code</text></g><line class="conn" x1="540" y1="226" x2="479" y2="308" marker-end="url(#arw)"/><text class="sub2" x="552" y="266" text-anchor="start">if it parses</text><line class="conn" x1="201" y1="308" x2="140" y2="226" marker-end="url(#arw)"/><text class="sub2" x="40" y="272" text-anchor="start">its output joins</text><text class="sub2" x="40" y="288" text-anchor="start">the next prompt</text><text class="cap" x="40" y="380" text-anchor="start">A tool is described to the model in plain words: a name, its arguments and a sentence on what it</text><text class="cap" x="40" y="400" text-anchor="start">does. The descriptions sit in the system prompt like any other text and cost tokens on every turn.</text><text class="cap" x="40" y="420" text-anchor="start">The code behind them never enters the model ({{fig:v01-o024}}). The three tools here are illustrative.</text><text class="cap" x="40" y="460" text-anchor="start">The model cannot run anything. It writes text in a shape the serving software recognises as a call: a</text><text class="cap" x="40" y="480" text-anchor="start">small object in JSON, a format for structured data, naming the tool and its arguments. The software</text><text class="cap" x="40" y="500" text-anchor="start">parses that text, runs the code, and adds the result to the conversation as text for the next turn.</text><text class="cap" x="40" y="540" text-anchor="start">This request ends in exactly such a call. Part 8 shows how the engine makes certain the text will</text><text class="cap" x="40" y="560" text-anchor="start">parse.</text></svg><figcaption>The model's whole part is text in and text out. The tools are a contract written in the prompt, and a call is worth something only if the software can parse it.</figcaption></figure>
