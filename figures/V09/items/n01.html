<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:06</div><h3>The tools are text in the prompt, and the call they produce is text that software runs</h3><svg viewBox='0 0 680 570' role='img'><title>The tools are text in the prompt, and the call they produce is text that software runs</title><g class="u"><rect x="40" y="70" width="270" height="132" rx="14"/><text class="lbl" x="62" y="96">In the prompt: the tools</text></g><g class="u"><text class="sub" x="62" y="126">run_tests(path): run a test file</text></g><g class="u"><text class="sub" x="62" y="146">read_file(path): return its text</text></g><g class="u"><text class="sub" x="62" y="166">edit_file(path, patch): change it</text></g><g class="u"><rect x="370" y="70" width="270" height="132" rx="14"/><text class="lbl" x="392" y="96">Out of the model: a call</text></g><g class="u"><text class="sub" x="392" y="126" style="white-space:pre">{"name": "edit_file",</text></g><g class="u"><text class="sub" x="392" y="146" style="white-space:pre"> "arguments": {</text></g><g class="u"><text class="sub" x="392" y="166" style="white-space:pre">   "path": "tests/test_parser.py",</text></g><g class="u"><text class="sub" x="392" y="186" style="white-space:pre">   "patch": "…" }}</text></g><line class="conn" x1="316" y1="136" x2="364" y2="136" marker-end="url(#arw)"/><text class="sub2" x="340.0" y="126" text-anchor="middle">the model</text><g class="u"><rect x="205" y="262" width="270" height="52" rx="6"/><text class="lbl" x="340.0" y="279.0" text-anchor="middle" dominant-baseline="central">the serving software</text><text class="sub" x="340.0" y="297.0" text-anchor="middle" dominant-baseline="central">parses the call and runs the code</text></g><line class="conn" x1="540" y1="206" x2="479" y2="288" marker-end="url(#arw)"/><text class="sub2" x="552" y="246" text-anchor="start">if it parses</text><line class="conn" x1="201" y1="288" x2="140" y2="206" marker-end="url(#arw)"/><text class="sub2" x="40" y="252" text-anchor="start">its output joins</text><text class="sub2" x="40" y="268" text-anchor="start">the next prompt</text><text class="cap" x="40" y="360" text-anchor="start">A tool is described to the model in plain words: a name, its arguments and what it does. The</text><text class="cap" x="40" y="380" text-anchor="start">descriptions sit in the system prompt like any other text and cost tokens on every turn. The code</text><text class="cap" x="40" y="400" text-anchor="start">behind them never enters the model ({{fig:v01-o024}}). The three names here are illustrative.</text><text class="cap" x="40" y="440" text-anchor="start">The model cannot run anything. It writes text in a shape the serving software recognises as a call: a</text><text class="cap" x="40" y="460" text-anchor="start">small object in JSON, a format for structured data, naming the tool and its arguments. The software</text><text class="cap" x="40" y="480" text-anchor="start">parses that text, runs the code, and adds the result to the conversation as text for the next turn.</text><text class="cap" x="40" y="520" text-anchor="start">This request ends in exactly such a call. Part 8 shows how the engine makes certain the text will</text><text class="cap" x="40" y="540" text-anchor="start">parse.</text></svg><figcaption>The model's whole part is text in and text out. The tools are a contract written in the prompt, and a call is worth something only if the software can parse it.</figcaption></figure>
