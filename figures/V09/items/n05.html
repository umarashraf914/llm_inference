><rect x="87" y="144" width="44" height="26" rx="3"/><text class="sub" x="109.0" y="157.0" text-anchor="middle" dominant-baseline="central">−1.0</text></g><g class="u"><rect x="143" y="144" width="44" height="26" rx="3"/><text class="sub" x="165.0" y="157.0" text-anchor="middle" dominant-baseline="central">0.5</text></g><g class="u"><rect x="190" y="144" width="44" height="26" rx="3"/><text class="sub" x="212.0" y="157.0" text-anchor="middle" dominant-baseline="central">0.6</text></g><rect x="246" y="144" width="44" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="268.0" y="157.0" text-anchor="middle" dominant-baseline="central">0</text><rect x="293" y="144" width="44" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="315.0" y="157.0" text-anchor="middle" dominant-baseline="central">0</text><rect x="349" y="144" width="44" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="371.0" y="157.0" text-anchor="middle" dominant-baseline="central">0</text><rect x="396" y="144" width="44" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="418.0" y="157.0" text-anchor="middle" dominant-baseline="central">0</text><text class="sub2" x="466" y="155" text-anchor="start">kept: 0.8, −1.0, 0.5, 0.6</text><text class="sub2" x="466" y="170" text-anchor="start">from pairs 1 and 2 of 4</text><rect x="40" y="182" width="44" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="62.0" y="195.0" text-anchor="middle" dominant-baseline="central">0</text><rect x="87" y="182" width="44" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="109.0" y="195.0" text-anchor="middle" dominant-baseline="central">0</text><g class="u"><rect x="143" y="182" width="44" height="26" rx="3"/><text class="sub" x="165.0" y="195.0" text-anchor="middle" dominant-baseline="central">−0.5</text></g><g class="u"><rect x="190" y="182" width="44" height="26" rx="3"/><text class="sub" x="212.0" y="195.0" text-anchor="middle" dominant-baseline="central">0.9</text></g><rect x="246" y="182" width="44" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="268.0" y="195.0" text-anchor="middle" dominant-baseline="central">0</text><rect x="293" y="182" width="44" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="315.0" y="195.0" text-anchor="middle" dominant-baseline="central">0</text><g class="u"><rect x="349" y="182" width="44" height="26" rx="3"/><text class="sub" x="371.0" y="195.0" text-anchor="middle" dominant-baseline="central">−0.8</text></g><g class="u"><rect x="396" y="182" width="44" height="26" rx="3"/><text class="sub" x="418.0" y="195.0" text-anchor="middle" dominant-baseline="central">1.1</text></g><text class="sub2" x="466" y="193" text-anchor="start">kept: −0.5, 0.9, −0.8, 1.1</text><text class="sub2" x="466" y="208" text-anchor="start">from pairs 2 and 4 of 4</text><text class="sub2" x="40" y="228" text-anchor="start">Stored: the 4 survivors of each run, and two 2-bit indices saying which pairs they came from.</text><text class="hd" x="40" y="276">What the advertised figure counts, to scale</text><text class="cap" x="40" y="312" text-anchor="start">done</text><g class="u"><rect x="120" y="294" width="260.0" height="26" rx="3"/><text class="sub" x="250.0" y="307.0" text-anchor="middle" dominant-baseline="central">10 quadrillion operations a second</text></g><text class="cap" x="40" y="350" text-anchor="start">counted</text><g class="h"><rect x="120" y="332" width="520.0" height="26" rx="3"/><text class="sub" x="380.0" y="345.0" text-anchor="middle" dominant-baseline="central">20 quadrillion: the skipped zeros counted too</text></g><text class="cap" x="40" y="404" text-anchor="start">The sparse mode works only on weights pruned to a fixed pattern. In every run of eight, four are</text><text class="cap" x="40" y="424" text-anchor="start">zero, and the zeros come in pairs. The hardware stores just the four survivors, with two small</text><text class="cap" x="40" y="444" text-anchor="start">indices that say which pairs they were, and skips the multiplications by zero.</text><text class="cap" x="40" y="484" text-anchor="start">Skipping half the multiplications halves the time a matrix takes, and the advertised figure counts the</text><text class="cap" x="40" y="504" text-anchor="start">skipped ones as if they had been done: 20 quadrillion operations a second instead of 10. Counted</text><text class="cap" x="40" y="524" text-anchor="start">that way the ridge would sit at 2,500 instead of 1,250.</text><text class="cap" x="40" y="564" text-anchor="start">This model's weights were not pruned to the pattern, so this workload gets the dense rate. It is the</text><text class="cap" x="40" y="584" text-anchor="start">rate used from here on.</text></svg><figcaption>Twice the rate, on condition that half of every eight weights are zero, in pairs the hardware can find. A model that was not pruned for it gets the dense number. Weight values are illustrative.</figcaption></figure>
