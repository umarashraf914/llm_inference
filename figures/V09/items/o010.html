<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:48</div><h3>Decode gets 4 operations from each byte, and the chip can use 1,250</h3><svg viewBox='0 0 680 512' role='img'><title>Decode gets 4 operations from each byte, and the chip can use 1,250</title><text class="hd" x="40" y="46">One decode step for this request, priced</text><g class="u"><rect x="40" y="64" width="200" height="34" rx="6"/><text class="sub" x="140.0" y="81.0" text-anchor="middle" dominant-baseline="central">30 billion active parameters</text></g><text class="sub2" x="254" y="85.0" text-anchor="middle">×</text><g class="u"><rect x="268" y="64" width="140" height="34" rx="6"/><text class="sub" x="338.0" y="81.0" text-anchor="middle" dominant-baseline="central">half a byte each</text></g><text class="sub2" x="422" y="85.0" text-anchor="middle">=</text><g class="h"><rect x="436" y="64" width="110" height="34" rx="6"/><text class="sub" x="491.0" y="81.0" text-anchor="middle" dominant-baseline="central">15 GB read</text></g><g class="u"><rect x="40" y="112" width="200" height="34" rx="6"/><text class="sub" x="140.0" y="129.0" text-anchor="middle" dominant-baseline="central">30 billion active parameters</text></g><text class="sub2" x="254" y="133.0" text-anchor="middle">×</text><g class="u"><rect x="268" y="112" width="140" height="34" rx="6"/><text class="sub" x="338.0" y="129.0" text-anchor="middle" dominant-baseline="central">2 operations each</text></g><text class="sub2" x="422" y="133.0" text-anchor="middle">=</text><g class="m"><rect x="436" y="112" width="160" height="34" rx="6"/><text class="sub" x="516.0" y="129.0" text-anchor="middle" dominant-baseline="central">60 billion operations</text></g><g class="m"><rect x="40" y="160" width="160" height="34" rx="6"/><text class="sub" x="120.0" y="177.0" text-anchor="middle" dominant-baseline="central">60 × 10⁹ operations</text></g><text class="sub2" x="214" y="181.0" text-anchor="middle">÷</text><g class="h"><rect x="228" y="160" width="130" height="34" rx="6"/><text class="sub" x="293.0" y="177.0" text-anchor="middle" dominant-baseline="central">15 × 10⁹ bytes</text></g><text class="sub2" x="372" y="181.0" text-anchor="middle">=</text><g class="s"><rect x="386" y="160" width="100" height="34" rx="6"/><text class="sub" x="436.0" y="177.0" text-anchor="middle" dominant-baseline="central">4 per byte</text></g><text class="sub2" x="40" y="218" text-anchor="start">against a ridge of 1,250: 312.5 times short</text><text class="sub2" x="40" y="236" text-anchor="start">counting the block scales, 0.5625 bytes a weight: 16.9 GB, 3.6 per byte, 352 times short</text><text class="cap" x="40" y="282" text-anchor="start">Decode writes the rest of the answer one token at a time, and every token begins with a read of the</text><text class="cap" x="40" y="302" text-anchor="start">active weights: attention, the shared expert and the eight chosen experts in every layer, about 30</text><text class="cap" x="40" y="322" text-anchor="start">billion parameters ({{fig:v09-n15}}). At 4 bits each that is 15 GB pulled out of memory, and the arithmetic</text><text class="cap" x="40" y="342" text-anchor="start">done on the way past is about 60 billion operations ({{fig:v01-o114}}).</text><text class="cap" x="40" y="382" text-anchor="start">Sixty billion over fifteen billion is four operations per byte, and the chip can sustain 1,250. That is</text><text class="cap" x="40" y="402" text-anchor="start">nearly the same gap as the first episode's: 295 to 1 on the H100 at 16 bits, 312.5 to 1 here</text><text class="cap" x="40" y="422" text-anchor="start">({{fig:v09-n07}}). Counting the block scales makes it slightly worse, not better.</text><text class="cap" x="40" y="462" text-anchor="start">And each token the model writes adds its own 70 KB to the cache, so the next read is slightly larger</text><text class="cap" x="40" y="482" text-anchor="start">than the one before it.</text></svg><figcaption>Four-bit weights, latent attention and a rack-scale fabric are all in place, and a lone token still gets 4 of the 1,250. Only putting more positions behind each read moves that, a few figures on.</figcaption></figure>
