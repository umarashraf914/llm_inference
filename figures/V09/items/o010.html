<figure><div class='ts'>Fig 10 &nbsp;&middot;&nbsp; 5:44</div><h3>Decode, priced out</h3><svg viewBox="0 0 680 398" role="img"><title>Decode, priced out</title><text class="cap" x="40" y="78" text-anchor="start">Active weights read per token</text><g class="h"><rect x="320" y="62" width="300" height="32" rx="3"></rect><text class="sub" x="470.0" y="78.0" text-anchor="middle" dominant-baseline="central">30 billion, at 4 bits = 15 GB</text></g><text class="cap" x="40" y="138" text-anchor="start">Arithmetic done on the way past</text><g class="m"><rect x="320" y="122" width="300" height="32" rx="3"></rect><text class="sub" x="470.0" y="138.0" text-anchor="middle" dominant-baseline="central">about 60 billion operations</text></g><g class="h"><rect x="190" y="174" width="300" height="42" rx="6"></rect><text class="sub" x="340.0" y="195.0" text-anchor="middle" dominant-baseline="central">60e9 / 15e9  =  4 operations per byte</text></g><text class="cap" x="40" y="256" text-anchor="start">The chip can sustain 1,250. Decode delivers four, which is 312 times short.</text><text class="cap" x="40" y="296" text-anchor="start">And each token the model writes adds its own 70 kilobytes to the cache, so the next read is</text><text class="cap" x="40" y="316" text-anchor="start">slightly larger than the read before it.</text><text class="cap" x="40" y="356" text-anchor="start">This is the same number the first episode arrived at, on different hardware with different</text><text class="cap" x="40" y="376" text-anchor="start">numerics. Four bits and a rack-scale fabric did not change the shape of the problem.</text></svg><figcaption>The clearest demonstration that the memory wall is structural. Every technique in the series has been applied and the ratio is still roughly 300 to 1.</figcaption></figure>
