<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:00</div><h3>The 1,100 bytes are 512 numbers of summary and 64 of position, two bytes each</h3><svg viewBox='0 0 680 673.5555555555555' role='img'><title>The 1,100 bytes are 512 numbers of summary and 64 of position, two bytes each</title><text class="hd" x="40" y="46">One token's cache for one layer, drawn to scale by area: 1 number = 1 × 8 px</text><text class="cap" x="40" y="82" text-anchor="start">latent attention</text><g class="s"><rect x="40" y="92" width="512" height="8" rx="1"/></g><g class="u"><rect x="552" y="92" width="64" height="8" rx="1"/></g><text class="sub2" x="40" y="118" text-anchor="start">512 numbers of summary + 64 of position = 576 numbers × 2 bytes = 1,152 bytes</text><text class="cap" x="40" y="160" text-anchor="start">standard attention, 64 heads</text><g class="h"><rect x="40" y="170" width="576" height="227.55555555555554" rx="2"/><text class="sub" x="328.0" y="283.77777777777777" text-anchor="middle" dominant-baseline="central">2 × 64 heads × 128 = 16,384 numbers × 2 bytes = 32,768 bytes</text></g><text class="sub2" x="40" y="419.55555555555554" text-anchor="start">28.4 times the latent's area. Across 61 layers: 70,272 bytes a token against 2.0 MB</text><text class="cap" x="40" y="463.55555555555554" text-anchor="start">Standard attention keeps, for every token in every layer, a key and a value for each attention head:</text><text class="cap" x="40" y="483.55555555555554" text-anchor="start">2 × heads × head size numbers ({{fig:v03-o088}}). With 64 heads of 128 numbers, Kimi K2's shape, that</text><text class="cap" x="40" y="503.55555555555554" text-anchor="start">is 16,384 numbers, or 32,768 bytes at 16 bits.</text><text class="cap" x="40" y="543.5555555555555" text-anchor="start">Latent attention keeps one learned summary of 512 numbers, plus 64 more that carry position and</text><text class="cap" x="40" y="563.5555555555555" text-anchor="start">cannot be folded into the summary ({{fig:v03-o092}}): 576 numbers, 1,152 bytes, the 'about 1,100'. Keys</text><text class="cap" x="40" y="583.5555555555555" text-anchor="start">and values are rebuilt from the summary when they are needed ({{fig:v03-o091}}).</text><text class="cap" x="40" y="623.5555555555555" text-anchor="start">That is 28.4 times smaller here; with 128 heads, the case V3 works through, it is 57 times. Across 61</text><text class="cap" x="40" y="643.5555555555555" text-anchor="start">layers it comes to 70,272 bytes, about 70 kilobytes, for each token of the prompt.</text></svg><figcaption>Drawn to scale by area. The cache that has to cross the network is the thin strip, and its size was fixed when the model was designed, not when it is served.</figcaption></figure>
