<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 7:11</div><h3>The mask can delete the model's favourite, and what is left is rescaled to sum to one</h3><svg viewBox='0 0 680 488' role='img'><title>The mask can delete the model's favourite, and what is left is rescaled to sum to one</title><text class="hd" x="40" y="46">At the tool's name: the text so far is {"name": ", and five candidates</text><text class="sub2" x="170" y="72" text-anchor="start">before the mask</text><text class="sub2" x="430" y="72" text-anchor="start">after: divided by the allowed total</text><text class="cap" x="40" y="101" text-anchor="start">pytest</text><g class="u"><rect x="170" y="84" width="88.0" height="24" rx="3"/></g><text class="sub2" x="266.0" y="101" text-anchor="start">0.40</text><text class="sub2" x="430" y="101" text-anchor="start">removed</text><text class="cap" x="40" y="133" text-anchor="start">edit</text><g class="u"><rect x="170" y="116" width="66.0" height="24" rx="3"/></g><text class="sub2" x="244.0" y="133" text-anchor="start">0.30</text><g class="s"><rect x="430" y="116" width="87.27272727272727" height="24" rx="3"/></g><text class="sub2" x="525.2727272727273" y="133" text-anchor="start">0.545</text><text class="cap" x="40" y="165" text-anchor="start">run</text><g class="u"><rect x="170" y="148" width="44.0" height="24" rx="3"/></g><text class="sub2" x="222.0" y="165" text-anchor="start">0.20</text><g class="s"><rect x="430" y="148" width="58.18181818181819" height="24" rx="3"/></g><text class="sub2" x="496.1818181818182" y="165" text-anchor="start">0.364</text><text class="cap" x="40" y="197" text-anchor="start">read</text><g class="u"><rect x="170" y="180" width="11.0" height="24" rx="3"/></g><text class="sub2" x="189.0" y="197" text-anchor="start">0.05</text><g class="s"><rect x="430" y="180" width="14.545454545454547" height="24" rx="3"/></g><text class="sub2" x="452.54545454545456" y="197" text-anchor="start">0.091</text><text class="cap" x="40" y="229" text-anchor="start">bash</text><g class="u"><rect x="170" y="212" width="11.0" height="24" rx="3"/></g><text class="sub2" x="189.0" y="229" text-anchor="start">0.05</text><text class="sub2" x="430" y="229" text-anchor="start">removed</text><text class="sub2" x="40" y="254" text-anchor="start">allowed total 0.55: edit 0.30 ÷ 0.55 = 0.545, run 0.20 ÷ 0.55 = 0.364, read 0.05 ÷ 0.55 = 0.091</text><text class="cap" x="40" y="298" text-anchor="start">The mask does not pick; it removes. Here the model's favourite, pytest, the usual command for</text><text class="cap" x="40" y="318" text-anchor="start">running Python tests, is not one of the three listed tools, so its 0.40 goes to zero, along with bash.</text><text class="cap" x="40" y="358" text-anchor="start">What is left adds up to 0.55. Dividing each survivor by 0.55 makes them add up to one again and</text><text class="cap" x="40" y="378" text-anchor="start">keeps their ratios: edit is still 1.5 times as likely as run and 6 times as likely as read. It is the same</text><text class="cap" x="40" y="398" text-anchor="start">dividing by a total that softmax does ({{fig:v01-o009}}), and the sampler then draws from the result.</text><text class="cap" x="40" y="438" text-anchor="start">So the mask can delete the token the model most wanted and push it down a path it would not have</text><text class="cap" x="40" y="458" text-anchor="start">taken ({{fig:v07-o024}}). What it guarantees is that the call parses.</text></svg><figcaption>Bars to scale on each side. The removed tokens' share is not handed to any one survivor; every survivor grows by the same factor, 1 ÷ 0.55.</figcaption></figure>
