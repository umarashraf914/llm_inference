<figure><div class='ts'>Fig 02 &nbsp;&middot;&nbsp; 0:24</div><h3>What came before, in one picture</h3><svg viewBox='0 0 680 398' role='img'><title>What came before, in one picture</title><text class="hd" x="40" y="46">Every technique in the series, and what each one shrank</text><g class="m"><rect x="40" y="70" width="320" height="34" rx="4"/><text class="sub" x="200" y="87.0" text-anchor="middle" dominant-baseline="central">fewer bits per weight</text></g><g class="m"><rect x="40" y="114" width="280" height="34" rx="4"/><text class="sub" x="180" y="131.0" text-anchor="middle" dominant-baseline="central">a shorter route for the bytes</text></g><g class="s"><rect x="40" y="158" width="250" height="34" rx="4"/><text class="sub" x="165" y="175.0" text-anchor="middle" dominant-baseline="central">more tokens per weight read</text></g><g class="s"><rect x="40" y="202" width="230" height="34" rx="4"/><text class="sub" x="155" y="219.0" text-anchor="middle" dominant-baseline="central">fewer numbers kept per token</text></g><g class="s"><rect x="40" y="246" width="220" height="34" rx="4"/><text class="sub" x="150" y="263.0" text-anchor="middle" dominant-baseline="central">only part of the model runs</text></g><text class="cap" x="40" y="320" text-anchor="start">Five videos, five different attacks, and every one of them is aimed at the same ratio: how</text><text class="cap" x="40" y="340" text-anchor="start">much useful work comes out of each byte that crosses the memory bus.</text><text class="cap" x="40" y="376" text-anchor="start">This last video watches all of them fire at once, on one request.</text></svg><figcaption>Useful orientation before the trace. If any of these five is unfamiliar, that video is the one to read first.</figcaption></figure>
