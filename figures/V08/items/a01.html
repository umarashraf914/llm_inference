<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:49</div><h3>At batch one, the arithmetic units are 99.7% idle</h3><svg viewBox='0 0 680 574' role='img'><title>At batch one, the arithmetic units are 99.7% idle</title><text class="hd" x="40" y="46">One token at batch one, timed two ways, on a log axis</text><text class="cap" x="40" y="89" text-anchor="start">arithmetic</text><g class="m"><rect x="150" y="70" width="138.11180928972703" height="28" rx="3"/></g><text class="sub2" x="296.11180928972703" y="89" text-anchor="start">0.142 ms</text><text class="cap" x="40" y="133" text-anchor="start">weight read</text><g class="h"><rect x="150" y="114" width="434.5299874369671" height="28" rx="3"/></g><text class="sub2" x="592.5299874369671" y="133" text-anchor="start">41.8 ms</text><line class="axis" x1="150" y1="162" x2="630" y2="162"/><line class="tick" x1="150" y1="162" x2="150" y2="167"/><text class="sub2" x="150" y="182" text-anchor="middle">0.01 ms</text><line class="tick" x1="270" y1="162" x2="270" y2="167"/><text class="sub2" x="270" y="182" text-anchor="middle">0.1</text><line class="tick" x1="390" y1="162" x2="390" y2="167"/><text class="sub2" x="390" y="182" text-anchor="middle">1</text><line class="tick" x1="510" y1="162" x2="510" y2="167"/><text class="sub2" x="510" y="182" text-anchor="middle">10</text><line class="tick" x1="630" y1="162" x2="630" y2="167"/><text class="sub2" x="630" y="182" text-anchor="middle">100 ms</text><text class="hd" x="40" y="232">The same two times as shares of the read, on an ordinary axis</text><text class="cap" x="40" y="269" text-anchor="start">busy or idle</text><g class="m"><rect x="150" y="250" width="1.6258847320525784" height="28" rx="0.5"/></g><g class="u"><rect x="151.62588473205258" y="250" width="478.3741152679474" height="28" rx="3"/><text class="sub" x="390.8129423660263" y="264.0" text-anchor="middle" dominant-baseline="central">idle 99.66%</text></g><text class="sub2" x="150" y="298" text-anchor="start">busy 0.34%: the sliver at the left edge</text><text class="cap" x="40" y="344" text-anchor="start">One token needs a multiply and an add for each of the 70 billion weights: 140 billion</text><text class="cap" x="40" y="364" text-anchor="start">operations, which an H100 GPU's 989 trillion a second get through in 0.142 ms. Reading</text><text class="cap" x="40" y="384" text-anchor="start">the 140 GB of weights at 3.35 TB/s takes 41.8 ms ({{fig:v01-o126}} has both</text><text class="cap" x="40" y="404" text-anchor="start">specifications).</text><text class="cap" x="40" y="444" text-anchor="start">So the arithmetic units work for 0.142 ms of every 41.8: 0.34% of the time, idle the</text><text class="cap" x="40" y="464" text-anchor="start">other 99.66%. The ratio of the two times, 295, is the chip's ridge: the operations it</text><text class="cap" x="40" y="484" text-anchor="start">can do for each byte it reads, against the one operation per byte that decode asks of it</text><text class="cap" x="40" y="504" text-anchor="start">({{fig:v01-o116}}).</text><text class="cap" x="40" y="544" text-anchor="start">That idle 99.7% is the room every technique in the next four parts spends.</text></svg><figcaption>Log axis for the two times, because on an ordinary one the arithmetic bar would be under two pixels long. Batching filled this idle time with other people's tokens; speculative decoding fills it with guesses for the same person.</figcaption></figure>
