<figure><div class='ts'>Fig 29 &nbsp;&middot;&nbsp; 24:19</div><h3>What it actually costs</h3><svg viewBox="0 0 680 516" role="img"><title>What it actually costs</title><text class="hd" x="40" y="46">Cost per million tokens, on the same chip at the same hourly rate</text><text class="cap" x="40" y="92" text-anchor="start">One request at a time</text><g class="h"><rect x="300" y="76" width="320" height="32" rx="3"></rect><text class="sub" x="460.0" y="92.0" text-anchor="middle" dominant-baseline="central">about $16 per million</text></g><text class="cap" x="40" y="152" text-anchor="start">128 requests at once</text><g class="s"><rect x="300" y="136" width="21" height="32" rx="3"></rect></g><text class="sub2" x="331" y="155" text-anchor="start">about $1 per million</text><text class="cap" x="40" y="214" text-anchor="start">Renting an H100 runs about three dollars an hour, though across providers that spans anywhere</text><text class="cap" x="40" y="234" text-anchor="start">from one and a half to eight.</text><text class="cap" x="40" y="274" text-anchor="start">At 51 output tokens a second, an hour produces 184,000 tokens. At 767 per GPU, it produces 2.76</text><text class="cap" x="40" y="294" text-anchor="start">million. Same three dollars, roughly fifteen times apart.</text><text class="cap" x="40" y="334" text-anchor="start">Nothing about the chip changed. All that changed is how many requests were sharing each read of</text><text class="cap" x="40" y="354" text-anchor="start">the weights.</text><text class="cap" x="40" y="394" text-anchor="start">So what you pay per GPU hour varies by two or three times between comparable providers, and what</text><text class="cap" x="40" y="414" text-anchor="start">you get out of that hour varies by more than ten. Choosing a cheaper chip is the small</text><text class="cap" x="40" y="434" text-anchor="start">optimisation.</text><text class="cap" x="40" y="474" text-anchor="start">One correction to the denominator: a token generated after its deadline has already used the</text><text class="cap" x="40" y="494" text-anchor="start">compute and cannot be sold. So goodput per dollar is what the whole stack is arranged around.</text></svg><figcaption>Both figures are vendor best cases from different machines, so the dollars are illustrative. The ratio is the part that holds.</figcaption></figure>
