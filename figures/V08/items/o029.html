<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 25:13</div><h3>One request at a time costs fifteen times more per token than 128 at once</h3><svg viewBox='0 0 680 452' role='img'><title>One request at a time costs fifteen times more per token than 128 at once</title><text class="hd" x="40" y="46">Cost per million tokens at the same hourly rate, $3, and the same model size</text><text class="cap" x="40" y="84" text-anchor="start">NVIDIA: one H200,</text><text class="cap" x="40" y="102" text-anchor="start">one request at a time</text><g class="h"><rect x="210" y="72" width="400.0" height="32" rx="3"/><text class="sub" x="410.0" y="88.0" text-anchor="middle" dominant-baseline="central">$16.34: 51 tokens a second</text></g><text class="cap" x="40" y="144" text-anchor="start">Perplexity: two H100s,</text><text class="cap" x="40" y="162" text-anchor="start">128 requests at once</text><g class="m"><rect x="210" y="132" width="26.597131681877443" height="32" rx="3"/></g><text class="sub2" x="246.59713168187744" y="153" text-anchor="start">$1.09: 767 tokens a second per GPU</text><text class="cap" x="40" y="222" text-anchor="start">Filling the machine changes that number completely. Perplexity measured Llama 2 70B on</text><text class="cap" x="40" y="242" text-anchor="start">two H100s running 128 requests at once: 767 output tokens a second per GPU, 2.76 million</text><text class="cap" x="40" y="262" text-anchor="start">an hour. The same $3 an hour now buys a million tokens for about $1.09: $16 against one,</text><text class="cap" x="40" y="282" text-anchor="start">roughly 15 times apart.</text><text class="cap" x="40" y="322" text-anchor="start">The chips differ, but in the wrong direction to explain it: the single-request run had</text><text class="cap" x="40" y="342" text-anchor="start">the H200, with 43% more memory bandwidth than an H100 ({{fig:v02-o071}}). What changed</text><text class="cap" x="40" y="362" text-anchor="start">is how many requests were sharing each read of the weights.</text><text class="cap" x="40" y="402" text-anchor="start">Those two measurements come from different machines and different prompt lengths, and</text><text class="cap" x="40" y="422" text-anchor="start">both are vendor best cases, so the dollar figures are illustrative.</text></svg><figcaption>The ratio is the part that holds. It is set by how full the machine is, not by which machine it is.</figcaption></figure>
