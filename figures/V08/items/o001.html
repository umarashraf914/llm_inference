<figure><div class='ts'>Fig 01 &nbsp;&middot;&nbsp; 0:24</div><h3>Two ways left: more tokens per read, or fewer bytes per token</h3><svg viewBox="0 0 680 470" role="img"><title>Two ways left: more tokens per read, or fewer bytes per token</title><text class="hd" x="40" y="46">The last episode: batching, continuous scheduling, paged caches</text><g class="s"><rect x="60" y="66" width="520" height="34" rx="4"></rect><text class="sub" x="320.0" y="83.0" text-anchor="middle" dominant-baseline="central">all put more requests behind each read of the weights</text></g><text class="cap" x="40" y="146" text-anchor="start">None of it helps a machine running one request on its own. To produce a single token the GPU</text><text class="cap" x="40" y="166" text-anchor="start">reads all 140 GB of a 70-billion-parameter model, then reads the same 140 GB again for the next</text><text class="cap" x="40" y="186" text-anchor="start">token, with the arithmetic units nearly idle throughout.</text><g class="m"><rect x="90" y="218" width="500" height="42" rx="6"></rect><text class="sub" x="340.0" y="239.0" text-anchor="middle" dominant-baseline="central">so each read of the weights has to produce more than one token</text></g><text class="hd" x="40" y="322">Two ways to do that, and every technique here is one of them</text><g class="m"><rect x="40" y="342" width="285" height="66" rx="8"></rect><text class="lbl" x="182.5" y="366.0" text-anchor="middle" dominant-baseline="central">Get more work out of</text><text class="sub" x="182.5" y="384.0" text-anchor="middle" dominant-baseline="central">the bytes that already moved</text></g><g class="s"><rect x="368" y="342" width="272" height="66" rx="8"></rect><text class="lbl" x="504.0" y="366.0" text-anchor="middle" dominant-baseline="central">Move fewer bytes</text><text class="sub" x="504.0" y="384.0" text-anchor="middle" dominant-baseline="central">per token</text></g><text class="cap" x="40" y="448" text-anchor="start">Speculative decoding is the first kind. The long-context ideas are mostly the second.</text></svg><figcaption>A clean split that organises the whole document. When a technique appears, ask which of the two boxes it belongs in. The left box starts where {{ref:v07-o026}} stopped: one request, nobody to share the read with.</figcaption></figure>
