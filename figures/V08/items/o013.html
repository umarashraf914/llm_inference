<figure><div class='ts'>Fig 13 &nbsp;&middot;&nbsp; 9:26</div><h3>The Eagle family</h3><svg viewBox="0 0 680 512" role="img"><title>The Eagle family</title><text class="hd" x="40" y="46">Eagle: change what the drafter predicts</text><g class="s"><rect x="40" y="70" width="190" height="82" rx="8"></rect><text class="lbl" x="135.0" y="94.0" text-anchor="middle" dominant-baseline="central">Eagle 1</text><text class="sub" x="135.0" y="112.0" text-anchor="middle" dominant-baseline="central">predicts the target's own</text><text class="sub" x="135.0" y="129.0" text-anchor="middle" dominant-baseline="central">internal vector, not a token</text></g><g class="s"><rect x="246" y="70" width="190" height="82" rx="8"></rect><text class="lbl" x="341.0" y="94.0" text-anchor="middle" dominant-baseline="central">Eagle 2</text><text class="sub" x="341.0" y="112.0" text-anchor="middle" dominant-baseline="central">same drafting, dynamic</text><text class="sub" x="341.0" y="129.0" text-anchor="middle" dominant-baseline="central">tree shape</text></g><g class="m"><rect x="452" y="70" width="188" height="82" rx="8"></rect><text class="lbl" x="546.0" y="94.0" text-anchor="middle" dominant-baseline="central">Eagle 3</text><text class="sub" x="546.0" y="112.0" text-anchor="middle" dominant-baseline="central">back to tokens, fed vectors</text><text class="sub" x="546.0" y="129.0" text-anchor="middle" dominant-baseline="central">from several layers</text></g><text class="cap" x="40" y="200" text-anchor="start">Internal vectors change smoothly from one position to the next, which makes them easier to</text><text class="cap" x="40" y="220" text-anchor="start">predict than a token choice that jumps between discrete options. It also leaves the distribution</text><text class="cap" x="40" y="240" text-anchor="start">of generated text unchanged, so the output stays exact.</text><text class="cap" x="40" y="280" text-anchor="start">Whether a guess is accepted depends heavily on context, so a fixed tree wastes branches in easy</text><text class="cap" x="40" y="300" text-anchor="start">contexts and runs short in hard ones. Growing the tree where the drafter is confident and</text><text class="cap" x="40" y="320" text-anchor="start">pruning it where it is not adds another 20 to 40%, still without changing the output.</text><text class="cap" x="40" y="360" text-anchor="start">Feeding the drafter a mixture of vectors from several of the target's layers removed a ceiling on</text><text class="cap" x="40" y="380" text-anchor="start">how much it improves as it trains on more data.</text><text class="cap" x="40" y="420" text-anchor="start">Batch of one</text><g class="s"><rect x="240" y="404" width="320" height="30" rx="3"></rect><text class="sub" x="400.0" y="419.0" text-anchor="middle" dominant-baseline="central">up to 6.5 times</text></g><text class="cap" x="40" y="480" text-anchor="start">Batch of 64</text><g class="h"><rect x="240" y="464" width="68" height="30" rx="3"></rect></g><text class="sub2" x="320" y="483" text-anchor="start">1.38 times</text></svg><figcaption>Those last two bars are the same method. The first is one request on an idle machine; the second is a machine with 64 requests already competing for its compute.</figcaption></figure>
