40" y="276.5" width="36" height="69.5" rx="2"/></g><text class="sub2" x="358.0" y="270.5" text-anchor="middle">1.39</text><text class="sub2" x="358.0" y="364" text-anchor="middle">24</text><g class="u"><rect x="390" y="280.0" width="36" height="66.0" rx="2"/></g><text class="sub2" x="408.0" y="274.0" text-anchor="middle">1.32</text><text class="sub2" x="408.0" y="364" text-anchor="middle">32</text><g class="u"><rect x="440" y="277.0" width="36" height="69.0" rx="2"/></g><text class="sub2" x="458.0" y="271.0" text-anchor="middle">1.38</text><text class="sub2" x="458.0" y="364" text-anchor="middle">48</text><g class="u"><rect x="490" y="279.0" width="36" height="67.0" rx="2"/></g><text class="sub2" x="508.0" y="273.0" text-anchor="middle">1.34</text><text class="sub2" x="508.0" y="364" text-anchor="middle">56</text><g class="h"><rect x="540" y="277.0" width="36" height="69.0" rx="2"/></g><text class="sub2" x="558.0" y="271.0" text-anchor="middle">1.38</text><text class="sub2" x="558.0" y="364" text-anchor="middle">64</text><line class="axis" x1="84" y1="346" x2="582" y2="346"/><text class="sub2" x="90" y="386" text-anchor="start">requests in the batch; 8B Llama in SGLang on one H100, MT-Bench prompts</text><text class="cap" x="40" y="432" text-anchor="start">Those two numbers both describe EAGLE-3. The 6.5 is one request on an idle machine; the</text><text class="cap" x="40" y="452" text-anchor="start">1.38 is a machine with 64 requests already competing for its compute.</text><text class="cap" x="40" y="492" text-anchor="start">They also come from different setups: the 6.5 is the paper's best case, Vicuna 13B</text><text class="cap" x="40" y="512" text-anchor="start">writing code, and the 1.38 was measured by the SGLang team serving an 8-billion-</text><text class="cap" x="40" y="532" text-anchor="start">parameter Llama. Holding that second setup fixed, the gain falls from 2.36× at one</text><text class="cap" x="40" y="552" text-anchor="start">request to 1.38× at 64: the ceiling of {{fig:v08-o009}}, measured.</text><text class="cap" x="40" y="592" text-anchor="start">Medusa's authors simulated the same effect for their method: past a batch of about 32</text><text class="cap" x="40" y="612" text-anchor="start">the speed-up shrinks, and can become a slowdown, as the layers stop being bound by</text><text class="cap" x="40" y="632" text-anchor="start">memory.</text></svg><figcaption>Same method, very different numbers, and the headline is a best case on an idle machine. Ask which batch size any speed-up was measured at.</figcaption></figure>
