<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:53</div><h3>Five guesses, checked left to right, stopping at the first rejection</h3><svg viewBox='0 0 680 730' role='img'><title>Five guesses, checked left to right, stopping at the first rejection</title><text class="hd" x="40" y="46">Each guess gets a dart in [0, 1); it is kept if the dart lands below p ÷ q</text><text class="cap" x="40" y="119" text-anchor="start">guess 1</text><text class="sub2" x="110" y="119" text-anchor="start">p ÷ q = 1.4</text><g class="m"><rect x="210" y="100" width="260.0" height="28" rx="3"/><text class="sub" x="340.0" y="114.0" text-anchor="middle" dominant-baseline="central">keep</text></g><text class="sub2" x="214" y="90" text-anchor="start">1 or above: kept, no draw needed</text><text class="sub2" x="486" y="119" text-anchor="start">kept</text><text class="cap" x="40" y="179" text-anchor="start">guess 2</text><text class="sub2" x="110" y="179" text-anchor="start">p ÷ q = 0.8</text><g class="m"><rect x="210" y="160" width="208.0" height="28" rx="3"/><text class="sub" x="314.0" y="174.0" text-anchor="middle" dominant-baseline="central">keep</text></g><g class="h"><rect x="418.0" y="160" width="51.999999999999986" height="28" rx="3"/><text class="sub" x="444.0" y="174.0" text-anchor="middle" dominant-baseline="central">reject</text></g><line class="tick" x1="301.0" y1="152" x2="301.0" y2="159"/><text class="sub2" x="301.0" y="145" text-anchor="middle">dart 0.35</text><text class="sub2" x="486" y="179" text-anchor="start">kept</text><text class="cap" x="40" y="239" text-anchor="start">guess 3</text><text class="sub2" x="110" y="239" text-anchor="start">p ÷ q = 0.5</text><g class="m"><rect x="210" y="220" width="130.0" height="28" rx="3"/><text class="sub" x="275.0" y="234.0" text-anchor="middle" dominant-baseline="central">keep</text></g><g class="h"><rect x="340.0" y="220" width="130.0" height="28" rx="3"/><text class="sub" x="405.0" y="234.0" text-anchor="middle" dominant-baseline="central">reject</text></g><line class="tick" x1="371.2" y1="212" x2="371.2" y2="219"/><text class="sub2" x="371.2" y="205" text-anchor="middle">dart 0.62</text><text class="sub2" x="486" y="239" text-anchor="start">rejected: replaced, stop</text><text class="cap" x="40" y="299" text-anchor="start">guess 4</text><rect x="210" y="280" width="260" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="340.0" y="294.0" text-anchor="middle" dominant-baseline="central">never checked</text><text class="sub2" x="486" y="299" text-anchor="start">written after guess 3</text><text class="cap" x="40" y="359" text-anchor="start">guess 5</text><rect x="210" y="340" width="260" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="340.0" y="354.0" text-anchor="middle" dominant-baseline="central">never checked</text><text class="sub2" x="486" y="359" text-anchor="start">written after guess 3</text><text class="cap" x="40" y="423" text-anchor="start">this pass yields</text><g class="m"><rect x="210" y="404" width="82" height="28" rx="3"/><text class="sub" x="251.0" y="418.0" text-anchor="middle" dominant-baseline="central">guess 1</text></g><g class="m"><rect x="298" y="404" width="82" height="28" rx="3"/><text class="sub" x="339.0" y="418.0" text-anchor="middle" dominant-baseline="central">guess 2</text></g><g class="u"><rect x="386" y="404" width="84" height="28" rx="3"/><text class="sub" x="428.0" y="418.0" text-anchor="middle" dominant-baseline="central">replacement</text></g><text class="sub2" x="486" y="423" text-anchor="start">3 tokens</text><text class="cap" x="40" y="480" text-anchor="start">For each guess the target computes p ÷ q. At 1 or above the guess is kept without a</text><text class="cap" x="40" y="500" text-anchor="start">draw. Below 1, a random number between 0 and 1 is drawn, like the dart of</text><text class="cap" x="40" y="520" text-anchor="start">{{fig:v08-o005}}, and the guess is kept if it lands below p ÷ q: a chance of exactly</text><text class="cap" x="40" y="540" text-anchor="start">p ÷ q.</text><text class="cap" x="40" y="580" text-anchor="start">Guess 2 survives, since 0.35 is below 0.8. Guess 3 does not: 0.62 is above 0.5. It is</text><text class="cap" x="40" y="600" text-anchor="start">replaced from the leftover, and guesses 4 and 5 are discarded unchecked, because they</text><text class="cap" x="40" y="620" text-anchor="start">were written after a token that is no longer there.</text><text class="cap" x="40" y="660" text-anchor="start">Had all five survived, the target's output at the fifth guess would already hold a full</text><text class="cap" x="40" y="680" text-anchor="start">distribution for the next slot, and a sixth token would be drawn from it at no extra</text><text class="cap" x="40" y="700" text-anchor="start">cost.</text></svg><figcaption>Kept guesses always form an unbroken run from the left, so their chances multiply: that is where Part 4 starts. The ratios and darts here are illustrative.</figcaption></figure>
