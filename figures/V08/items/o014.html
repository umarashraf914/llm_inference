<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:31</div><h3>Lookahead decoding drops the guesser altogether</h3><svg viewBox='0 0 680 480' role='img'><title>Lookahead decoding drops the guesser altogether</title><text class="hd" x="40" y="46">What makes the guesses, method by method, for a 70B target</text><text class="sub2" x="40" y="78" text-anchor="start">method</text><text class="sub2" x="142" y="78" text-anchor="start">the guesser</text><text class="sub2" x="388" y="78" text-anchor="start">extra weights</text><text class="sub2" x="506" y="78" text-anchor="start">output</text><g class="u"><rect x="40" y="90" width="96" height="30" rx="3"/><text class="sub" x="88.0" y="105.0" text-anchor="middle" dominant-baseline="central">2022 paper</text></g><g class="u"><rect x="142" y="90" width="240" height="30" rx="3"/><text class="sub" x="262.0" y="105.0" text-anchor="middle" dominant-baseline="central">a second model, 100 times smaller</text></g><g class="u"><rect x="388" y="90" width="112" height="30" rx="3"/><text class="sub" x="444.0" y="105.0" text-anchor="middle" dominant-baseline="central">0.7 billion</text></g><g class="u"><rect x="506" y="90" width="140" height="30" rx="3"/><text class="sub" x="576.0" y="105.0" text-anchor="middle" dominant-baseline="central">exact</text></g><g class="u"><rect x="40" y="130" width="96" height="30" rx="3"/><text class="sub" x="88.0" y="145.0" text-anchor="middle" dominant-baseline="central">Medusa</text></g><g class="u"><rect x="142" y="130" width="240" height="30" rx="3"/><text class="sub" x="262.0" y="145.0" text-anchor="middle" dominant-baseline="central">extra heads on the target</text></g><g class="u"><rect x="388" y="130" width="112" height="30" rx="3"/><text class="sub" x="444.0" y="145.0" text-anchor="middle" dominant-baseline="central">1.1 billion a head</text></g><g class="u"><rect x="506" y="130" width="140" height="30" rx="3"/><text class="sub" x="576.0" y="145.0" text-anchor="middle" dominant-baseline="central">exact only with p ÷ q</text></g><g class="u"><rect x="40" y="170" width="96" height="30" rx="3"/><text class="sub" x="88.0" y="185.0" text-anchor="middle" dominant-baseline="central">EAGLE</text></g><g class="u"><rect x="142" y="170" width="240" height="30" rx="3"/><text class="sub" x="262.0" y="185.0" text-anchor="middle" dominant-baseline="central">a small layer on the target's vectors</text></g><g class="u"><rect x="388" y="170" width="112" height="30" rx="3"/><text class="sub" x="444.0" y="185.0" text-anchor="middle" dominant-baseline="central">1 billion</text></g><g class="u"><rect x="506" y="170" width="140" height="30" rx="3"/><text class="sub" x="576.0" y="185.0" text-anchor="middle" dominant-baseline="central">exact</text></g><g class="m"><rect x="40" y="210" width="96" height="30" rx="3"/><text class="sub" x="88.0" y="225.0" text-anchor="middle" dominant-baseline="central">lookahead</text></g><g class="m"><rect x="142" y="210" width="240" height="30" rx="3"/><text class="sub" x="262.0" y="225.0" text-anchor="middle" dominant-baseline="central">the target, from its spare guesses</text></g><g class="m"><rect x="388" y="210" width="112" height="30" rx="3"/><text class="sub" x="444.0" y="225.0" text-anchor="middle" dominant-baseline="central">none</text></g><g class="m"><rect x="506" y="210" width="140" height="30" rx="3"/><text class="sub" x="576.0" y="225.0" text-anchor="middle" dominant-baseline="central">exact</text></g><text class="cap" x="40" y="290" text-anchor="start">Lookahead decoding gets several tokens out of a single pass with no drafter at all. It</text><text class="cap" x="40" y="310" text-anchor="start">runs the model on several future positions at once, taking a rough guess at all of them,</text><text class="cap" x="40" y="330" text-anchor="start">then runs again, improving the whole set of guesses together: an old method for solving</text><text class="cap" x="40" y="350" text-anchor="start">many equations at once, Jacobi iteration.</text><text class="cap" x="40" y="390" text-anchor="start">The extra weights in the table are for the 70B model followed through this series: a</text><text class="cap" x="40" y="410" text-anchor="start">drafter a hundred times smaller has 0.7 billion; a Medusa head of this shape about 1.1</text><text class="cap" x="40" y="430" text-anchor="start">billion ({{fig:v08-a20}}); EAGLE-1's drafter for a 70B target 0.99 billion. Lookahead</text><text class="cap" x="40" y="450" text-anchor="start">adds nothing to store, read or train.</text></svg><figcaption>Each row removes something the one above needed: the second model, then most of the second model, then any trained guesser at all. The next figures show where lookahead's guesses come from instead.</figcaption></figure>
