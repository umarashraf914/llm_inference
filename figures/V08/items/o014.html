<figure><div class='ts'>Fig 14 &nbsp;&middot;&nbsp; 11:27</div><h3>Lookahead decoding</h3><svg viewBox="0 0 680 446" role="img"><title>Lookahead decoding</title><text class="hd" x="40" y="46">Lookahead decoding: no drafter at all</text><g class="u"><rect x="40" y="70" width="190" height="40" rx="4"></rect><text class="sub" x="135.0" y="90.0" text-anchor="middle" dominant-baseline="central">guess several positions</text></g><line class="conn" x1="236" y1="90" x2="256" y2="90" marker-end="url(#arw)"></line><g class="u"><rect x="262" y="70" width="190" height="40" rx="4"></rect><text class="sub" x="357.0" y="90.0" text-anchor="middle" dominant-baseline="central">improve them together</text></g><line class="conn" x1="458" y1="90" x2="478" y2="90" marker-end="url(#arw)"></line><g class="m"><rect x="484" y="70" width="156" height="40" rx="4"></rect><text class="sub" x="562.0" y="90.0" text-anchor="middle" dominant-baseline="central">keep the fragments</text></g><text class="cap" x="40" y="148" text-anchor="start">On its own that barely helps. A position only settles once everything before it has settled, so</text><text class="cap" x="40" y="168" text-anchor="start">the sequence still fills in about one token at a time, and correct guesses get overwritten on</text><text class="cap" x="40" y="188" text-anchor="start">the next round.</text><g class="s"><rect x="90" y="220" width="500" height="42" rx="6"></rect><text class="sub" x="340.0" y="241.0" text-anchor="middle" dominant-baseline="central">but a guess in the wrong position is not the same as a wrong guess</text></g><text class="cap" x="40" y="304" text-anchor="start">A short run of tokens can sit in the wrong place and still be a real continuation the model would</text><text class="cap" x="40" y="324" text-anchor="start">produce somewhere. So lookahead keeps every one of them in a pool, and each time the model emits</text><text class="cap" x="40" y="344" text-anchor="start">a real token it pulls out the fragments beginning with that token and checks them in the same</text><text class="cap" x="40" y="364" text-anchor="start">pass.</text><text class="cap" x="40" y="404" text-anchor="start">The model ends up drafting for itself out of its own discarded work, with nothing extra to</text><text class="cap" x="40" y="424" text-anchor="start">train. Up to 1.8 times on a multi-turn dialogue benchmark, with the output still exact.</text></svg><figcaption>The reframing in the middle box is the whole idea, and it is the kind of observation that is obvious only afterwards.</figcaption></figure>
