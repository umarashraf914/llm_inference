<figure><div class='ts'>Fig 10 &nbsp;&middot;&nbsp; 7:24</div><h3>The drafter is a liability</h3><svg viewBox="0 0 680 350" role="img"><title>The drafter is a liability</title><text class="hd" x="40" y="46">What a separate drafter costs you</text><g class="h"><rect x="60" y="66" width="560" height="30" rx="3"></rect><text class="sub" x="340.0" y="81.0" text-anchor="middle" dominant-baseline="central">its weights sit in memory beside the target's</text></g><g class="h"><rect x="60" y="106" width="560" height="30" rx="3"></rect><text class="sub" x="340.0" y="121.0" text-anchor="middle" dominant-baseline="central">it needs retraining whenever the target changes</text></g><g class="h"><rect x="60" y="146" width="560" height="30" rx="3"></rect><text class="sub" x="340.0" y="161.0" text-anchor="middle" dominant-baseline="central">the two must share one vocabulary, because verification compares probabili</text></g><g class="h"><rect x="60" y="186" width="560" height="30" rx="3"></rect><text class="sub" x="340.0" y="201.0" text-anchor="middle" dominant-baseline="central">a drafter that has drifted from the target slows everything down</text></g><text class="cap" x="40" y="268" text-anchor="start">How closely the two agree decides how many guesses survive each pass, so the drafter is a</text><text class="cap" x="40" y="288" text-anchor="start">maintenance burden as well as a memory cost.</text><text class="cap" x="40" y="328" text-anchor="start">Every method below either removes the second model or changes what it predicts.</text></svg><figcaption>Three practical problems and one performance one. The next three techniques are each an answer to this list.</figcaption></figure>
