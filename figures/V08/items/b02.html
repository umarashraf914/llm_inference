<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:36</div><h3>Time per token rises in a straight line with the context</h3><svg viewBox='0 0 680 606' role='img'><title>Time per token rises in a straight line with the context</title><text class="hd" x="40" y="46">Milliseconds per decode step: 140 GB of weights plus every request's cache, at 3.35 TB/s</text><line class="axis" x1="100" y1="300" x2="560" y2="300"/><line class="axis" x1="100" y1="80" x2="100" y2="300"/><line class="tick" x1="100.0" y1="300" x2="100.0" y2="304"/><text class="sub2" x="100.0" y="318" text-anchor="middle">0</text><line class="tick" x1="215.0" y1="300" x2="215.0" y2="304"/><text class="sub2" x="215.0" y="318" text-anchor="middle">32k</text><line class="tick" x1="330.0" y1="300" x2="330.0" y2="304"/><text class="sub2" x="330.0" y="318" text-anchor="middle">64k</text><line class="tick" x1="445.0" y1="300" x2="445.0" y2="304"/><text class="sub2" x="445.0" y="318" text-anchor="middle">96k</text><line class="tick" x1="560.0" y1="300" x2="560.0" y2="304"/><text class="sub2" x="560.0" y="318" text-anchor="middle">128k</text><line class="tick" x1="96" y1="300.0" x2="100" y2="300.0"/><text class="sub2" x="92" y="304.0" text-anchor="end">0</text><line class="tick" x1="96" y1="256.0" x2="100" y2="256.0"/><text class="sub2" x="92" y="260.0" text-anchor="end">20</text><line class="tick" x1="96" y1="212.0" x2="100" y2="212.0"/><text class="sub2" x="92" y="216.0" text-anchor="end">40</text><line class="tick" x1="96" y1="168.0" x2="100" y2="168.0"/><text class="sub2" x="92" y="172.0" text-anchor="end">60</text><line class="tick" x1="96" y1="124.0" x2="100" y2="124.0"/><text class="sub2" x="92" y="128.0" text-anchor="end">80</text><line class="tick" x1="96" y1="80.0" x2="100" y2="80.0"/><text class="sub2" x="92" y="84.0" text-anchor="end">100</text><text class="sub2" x="330.0" y="338" text-anchor="middle">tokens of context per request</text><text class="sub2" x="40" y="68" text-anchor="start">ms per step</text><line class="conn" x1="100.0" y1="208.0597014925373" x2="560.0" y2="208.0597014925373"/><polyline class="pl-m" points="100.0,208.1 560.0,179.9"/><circle cx="560.0" cy="179.9" r="3.5" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><polyline class="pl-h" points="100.0,208.1 560.0,95.2"/><circle cx="560.0" cy="95.2" r="3.5" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2" x="570" y="99.23667998567163" text-anchor="start">4 requests: 93.1 ms</text><text class="sub2" x="570" y="183.85394611582086" text-anchor="start">1 request: 54.6 ms</text><text class="sub2" x="570" y="216.0597014925373" text-anchor="start">weights alone: 41.8</text><circle cx="474.9" cy="116.1" r="3.5" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2" x="464.8573362827301" y="106.1194029850746" text-anchor="end">4 requests at 107k: cache = weights</text><text class="cap" x="40" y="376" text-anchor="start">A step reads every weight and every stored key and value, so its time is bytes ÷</text><text class="cap" x="40" y="396" text-anchor="start">bandwidth: (140 GB + requests × tokens × 327,680 bytes) ÷ 3.35 TB/s. The weights fix the</text><text class="cap" x="40" y="416" text-anchor="start">starting height, 41.8 ms. The cache adds 0.0978 microseconds per token of context,</text><text class="cap" x="40" y="436" text-anchor="start">0.0978 ms per thousand, for every request in the batch ({{fig:v07-o002}}).</text><text class="cap" x="40" y="476" text-anchor="start">That is a straight line. One request at 128k takes 54.6 ms a step; four take 93.1 ms,</text><text class="cap" x="40" y="496" text-anchor="start">more than twice the weights alone, and still produce only one token each. For one</text><text class="cap" x="40" y="516" text-anchor="start">request the cache matches the weights at 427,246 tokens; for four, at 106,812.</text><text class="cap" x="40" y="556" text-anchor="start">Counted as if one chip held everything, as in {{fig:v01-o014}}. Split across several GPUs,</text><text class="cap" x="40" y="576" text-anchor="start">each reads its share in parallel, but the bytes per token are the same.</text></svg><figcaption>The cache competes with the weights byte for byte, because both cross the same bus on every step. Batching shares the weights; it shares none of the cache.</figcaption></figure>
