<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:12</div><h3>A bad drafter is slower, never wrong</h3><svg viewBox='0 0 680 434' role='img'><title>A bad drafter is slower, never wrong</title><text class="hd" x="40" y="46">Three drafters for Fig 05's target</text><text class="sub2" x="110" y="78" text-anchor="start">q: cat · dog · rest</text><text class="sub2" x="250" y="78" text-anchor="start">guesses kept</text><text class="sub2" x="460" y="78" text-anchor="start">what comes out</text><text class="cap" x="40" y="109" text-anchor="start">good</text><text class="sub2" x="110" y="109" text-anchor="start">0.45 · 0.35 · 0.20</text><g class="m"><rect x="250" y="90" width="171.0" height="28" rx="3"/><text class="sub" x="335.5" y="104.0" text-anchor="middle" dominant-baseline="central">α = 0.95</text></g><g class="h"><rect x="421.0" y="90" width="9.000000000000007" height="28" rx="3"/></g><g class="u"><rect x="460" y="90" width="83.0" height="28" rx="3"/></g><g class="u"><rect x="545.0" y="90" width="49.0" height="28" rx="3"/></g><g class="u"><rect x="596.0" y="90" width="32.0" height="28" rx="3"/></g><text class="cap" x="40" y="153" text-anchor="start">middling</text><text class="sub2" x="110" y="153" text-anchor="start">0.20 · 0.60 · 0.20</text><g class="m"><rect x="250" y="134" width="125.99999999999999" height="28" rx="3"/><text class="sub" x="313.0" y="148.0" text-anchor="middle" dominant-baseline="central">α = 0.70</text></g><g class="h"><rect x="376.0" y="134" width="54.00000000000001" height="28" rx="3"/></g><g class="u"><rect x="460" y="134" width="83.0" height="28" rx="3"/></g><g class="u"><rect x="545.0" y="134" width="49.0" height="28" rx="3"/></g><g class="u"><rect x="596.0" y="134" width="32.0" height="28" rx="3"/></g><text class="cap" x="40" y="197" text-anchor="start">bad</text><text class="sub2" x="110" y="197" text-anchor="start">0.05 · 0.90 · 0.05</text><g class="m"><rect x="250" y="178" width="72.0" height="28" rx="3"/><text class="sub" x="286.0" y="192.0" text-anchor="middle" dominant-baseline="central">α = 0.40</text></g><g class="h"><rect x="322.0" y="178" width="108.0" height="28" rx="3"/></g><g class="u"><rect x="460" y="178" width="83.0" height="28" rx="3"/></g><g class="u"><rect x="545.0" y="178" width="49.0" height="28" rx="3"/></g><g class="u"><rect x="596.0" y="178" width="32.0" height="28" rx="3"/></g><text class="sub2" x="460" y="238" text-anchor="start">cat 0.5 · dog 0.3 · rest 0.2 in every row</text><text class="cap" x="40" y="284" text-anchor="start">Three drafters for the same target, from close to far off. The share of guesses kept</text><text class="cap" x="40" y="304" text-anchor="start">falls from 0.95 to 0.70 to 0.40: the bad drafter is rejected 12 times as often as the</text><text class="cap" x="40" y="324" text-anchor="start">good one, so each pass yields fewer tokens.</text><text class="cap" x="40" y="364" text-anchor="start">The output column does not change. Every rejection is replaced from the leftover, and</text><text class="cap" x="40" y="384" text-anchor="start">kept plus replaced is p whatever q is, as {{fig:v08-a10}} showed. What a bad drafter</text><text class="cap" x="40" y="404" text-anchor="start">costs is time, never correctness.</text></svg><figcaption>Drafter quality buys speed and nothing else. That is what lets Part 5 swap the drafter for something cheaper without touching correctness.</figcaption></figure>
