<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:26</div><h3>One pass returns a next-token distribution at every position</h3><svg viewBox='0 0 680 526' role='img'><title>One pass returns a next-token distribution at every position</title><text class="hd" x="40" y="46">Six positions go in; at each, out comes a distribution over the next token</text><text class="cap" x="40" y="92" text-anchor="start">into the pass</text><g class="u"><rect x="168" y="74" width="70" height="28" rx="3"/><text class="sub" x="203.0" y="88.0" text-anchor="middle" dominant-baseline="central">sat</text></g><g class="m"><rect x="246" y="74" width="70" height="28" rx="3"/><text class="sub" x="281.0" y="88.0" text-anchor="middle" dominant-baseline="central">on</text></g><g class="m"><rect x="324" y="74" width="70" height="28" rx="3"/><text class="sub" x="359.0" y="88.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="m"><rect x="402" y="74" width="70" height="28" rx="3"/><text class="sub" x="437.0" y="88.0" text-anchor="middle" dominant-baseline="central">mat</text></g><g class="m"><rect x="480" y="74" width="70" height="28" rx="3"/><text class="sub" x="515.0" y="88.0" text-anchor="middle" dominant-baseline="central">and</text></g><g class="m"><rect x="558" y="74" width="70" height="28" rx="3"/><text class="sub" x="593.0" y="88.0" text-anchor="middle" dominant-baseline="central">then</text></g><text class="cap" x="40" y="192" text-anchor="start">out of the pass</text><g class="u"><rect x="168" y="174" width="70" height="28" rx="3"/><text class="sub" x="203.0" y="188.0" text-anchor="middle" dominant-baseline="central">on 0.6</text></g><g class="u"><rect x="246" y="174" width="70" height="28" rx="3"/><text class="sub" x="281.0" y="188.0" text-anchor="middle" dominant-baseline="central">the 0.7</text></g><g class="u"><rect x="324" y="174" width="70" height="28" rx="3"/><text class="sub" x="359.0" y="188.0" text-anchor="middle" dominant-baseline="central">mat 0.5</text></g><g class="u"><rect x="402" y="174" width="70" height="28" rx="3"/><text class="sub" x="437.0" y="188.0" text-anchor="middle" dominant-baseline="central">. 0.5</text></g><g class="u"><rect x="480" y="174" width="70" height="28" rx="3"/><text class="sub" x="515.0" y="188.0" text-anchor="middle" dominant-baseline="central">then 0.4</text></g><g class="u"><rect x="558" y="174" width="70" height="28" rx="3"/><text class="sub" x="593.0" y="188.0" text-anchor="middle" dominant-baseline="central">the 0.5</text></g><line class="conn" x1="232" y1="170" x2="256" y2="106" marker-end="url(#arw)"/><line class="conn" x1="310" y1="170" x2="334" y2="106" marker-end="url(#arw)"/><line class="conn" x1="388" y1="170" x2="412" y2="106" marker-end="url(#arw)"/><line class="conn" x1="466" y1="170" x2="490" y2="106" marker-end="url(#arw)"/><line class="conn" x1="544" y1="170" x2="568" y2="106" marker-end="url(#arw)"/><text class="sub2" x="203.0" y="222" text-anchor="middle">judges on</text><text class="sub2" x="281.0" y="222" text-anchor="middle">judges the</text><text class="sub2" x="359.0" y="222" text-anchor="middle">judges mat</text><text class="sub2" x="437.0" y="222" text-anchor="middle">judges and</text><text class="sub2" x="515.0" y="222" text-anchor="middle">judges then</text><text class="sub2" x="593.0" y="222" text-anchor="middle">a free sixth</text><text class="sub2" x="168" y="252" text-anchor="start">top choice and its probability shown; each is a full distribution</text><text class="cap" x="40" y="296" text-anchor="start">At every position the target produces what it always produces: a score for each of its</text><text class="cap" x="40" y="316" text-anchor="start">128,000 tokens, turned into probabilities by softmax ({{fig:v01-o009}}). That</text><text class="cap" x="40" y="336" text-anchor="start">distribution is its prediction for the next slot, so the output at ‘mat’ is its opinion</text><text class="cap" x="40" y="356" text-anchor="start">of whatever follows ‘mat’, and that is what the guess ‘and’ must answer to.</text><text class="cap" x="40" y="396" text-anchor="start">Five guesses means six positions. The last real token, ‘sat’, comes along, because its</text><text class="cap" x="40" y="416" text-anchor="start">output is the one that judges the first guess. The output at the last guess judges</text><text class="cap" x="40" y="436" text-anchor="start">nothing: it is a whole distribution over a sixth token, already paid for.</text><text class="cap" x="40" y="476" text-anchor="start">‘The cat’ needs no recomputing. Its keys and values are already stored in the cache</text><text class="cap" x="40" y="496" text-anchor="start">({{fig:v01-o136}}), so only these six positions go through the pass.</text></svg><figcaption>Each guess is judged by the output one place to its left. That shift by one is what lets a single pass check all five guesses; the probabilities shown are illustrative.</figcaption></figure>
