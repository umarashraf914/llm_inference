<figure><div class='ts'>Fig 03 &nbsp;&middot;&nbsp; 2:34</div><h3>Causality is what makes verification valid</h3><svg viewBox="0 0 680 478" role="img"><title>Causality is what makes verification valid</title><text class="hd" x="40" y="46">Why checking five positions at once is legitimate</text><g class="s"><rect x="180" y="66" width="54" height="28" rx="3"></rect></g><g class="u"><rect x="242" y="66" width="54" height="28" rx="3"></rect></g><g class="u"><rect x="304" y="66" width="54" height="28" rx="3"></rect></g><g class="u"><rect x="366" y="66" width="54" height="28" rx="3"></rect></g><g class="u"><rect x="428" y="66" width="54" height="28" rx="3"></rect></g><g class="s"><rect x="180" y="100" width="54" height="28" rx="3"></rect></g><g class="s"><rect x="242" y="100" width="54" height="28" rx="3"></rect></g><g class="u"><rect x="304" y="100" width="54" height="28" rx="3"></rect></g><g class="u"><rect x="366" y="100" width="54" height="28" rx="3"></rect></g><g class="u"><rect x="428" y="100" width="54" height="28" rx="3"></rect></g><g class="s"><rect x="180" y="134" width="54" height="28" rx="3"></rect></g><g class="s"><rect x="242" y="134" width="54" height="28" rx="3"></rect></g><g class="s"><rect x="304" y="134" width="54" height="28" rx="3"></rect></g><g class="u"><rect x="366" y="134" width="54" height="28" rx="3"></rect></g><g class="u"><rect x="428" y="134" width="54" height="28" rx="3"></rect></g><g class="s"><rect x="180" y="168" width="54" height="28" rx="3"></rect></g><g class="s"><rect x="242" y="168" width="54" height="28" rx="3"></rect></g><g class="s"><rect x="304" y="168" width="54" height="28" rx="3"></rect></g><g class="s"><rect x="366" y="168" width="54" height="28" rx="3"></rect></g><g class="u"><rect x="428" y="168" width="54" height="28" rx="3"></rect></g><g class="s"><rect x="180" y="202" width="54" height="28" rx="3"></rect></g><g class="s"><rect x="242" y="202" width="54" height="28" rx="3"></rect></g><g class="s"><rect x="304" y="202" width="54" height="28" rx="3"></rect></g><g class="s"><rect x="366" y="202" width="54" height="28" rx="3"></rect></g><g class="s"><rect x="428" y="202" width="54" height="28" rx="3"></rect></g><text class="sub2" x="40" y="84" text-anchor="start">position 1</text><text class="sub2" x="40" y="220" text-anchor="start">position 5</text><text class="sub2" x="180" y="268" text-anchor="start">each position sees only the tokens before it</text><text class="cap" x="40" y="316" text-anchor="start">Attention is causal, so the prediction at the third guess depends only on the first two, which</text><text class="cap" x="40" y="336" text-anchor="start">is exactly the information the large model would have when writing that position itself.</text><text class="cap" x="40" y="376" text-anchor="start">The target compares each guess against the prediction sitting at its position, keeps the ones it</text><text class="cap" x="40" y="396" text-anchor="start">agrees with, and throws away everything from the first disagreement onward.</text><text class="cap" x="40" y="436" text-anchor="start">If all five survive, the pass gives back a sixth token for free, because the model has already</text><text class="cap" x="40" y="456" text-anchor="start">made a prediction at the last position.</text></svg><figcaption>The same triangular mask that forced decode to be sequential ({{ref:v01-o132}}) is what lets five positions be checked in parallel without cheating.</figcaption></figure>
