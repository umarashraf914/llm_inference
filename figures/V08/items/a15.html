<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:31</div><h3>Tokens per pass: 1 + 0.7 + 0.49 + 0.34 + 0.24 + 0.17 = 2.94</h3><svg viewBox='0 0 680 522' role='img'><title>Tokens per pass: 1 + 0.7 + 0.49 + 0.34 + 0.24 + 0.17 = 2.94</title><text class="hd" x="40" y="46">Expected tokens from one pass, each term to scale</text><text class="cap" x="40" y="89" text-anchor="start">at α = 0.7</text><g class="u"><rect x="150" y="70" width="148.0" height="30" rx="3"/><text class="sub" x="224.0" y="85.0" text-anchor="middle" dominant-baseline="central">the target's own</text></g><text class="sub2" x="224.0" y="120" text-anchor="middle">1</text><g class="m"><rect x="300.0" y="70" width="103.0" height="30" rx="3"/></g><text class="sub2" x="351.5" y="120" text-anchor="middle">0.7</text><g class="m"><rect x="405.0" y="70" width="71.49999999999999" height="30" rx="3"/></g><text class="sub2" x="440.75" y="120" text-anchor="middle">0.49</text><g class="m"><rect x="478.5" y="70" width="49.44999999999999" height="30" rx="3"/></g><text class="sub2" x="503.225" y="120" text-anchor="middle">0.34</text><g class="m"><rect x="529.95" y="70" width="34.014999999999986" height="30" rx="3"/></g><text class="sub2" x="546.9575" y="120" text-anchor="middle">0.24</text><g class="m"><rect x="565.965" y="70" width="23.210499999999993" height="30" rx="3"/></g><text class="sub2" x="577.57025" y="120" text-anchor="middle">0.17</text><text class="sub2" x="601.1755" y="89" text-anchor="start">= 2.94</text><text class="sub2" x="304" y="140" text-anchor="start">guess 1 to guess 5: each one's chance of being kept</text><text class="cap" x="40" y="189" text-anchor="start">at α = 0.709</text><rect x="150" y="170" width="448" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="374.0" y="185.0" text-anchor="middle" dominant-baseline="central">3.00 tokens: the three of {{fig:v08-o008}}</text><text class="sub2" x="40" y="246" text-anchor="start">speed-up at α = 0.7: 2.94 tokens ÷ 1.05 passes' worth of bytes = 2.80×</text><text class="cap" x="40" y="292" text-anchor="start">A guess adds one token when it is kept and none when it is not, so on average it adds</text><text class="cap" x="40" y="312" text-anchor="start">its chance of being kept. The expected tokens per pass is therefore the sum of those</text><text class="cap" x="40" y="332" text-anchor="start">chances, plus the 1 the target always adds:</text><text class="cap" x="40" y="352" text-anchor="start">1 + 0.7 + 0.49 + 0.343 + 0.240 + 0.168 = 2.94.</text><text class="cap" x="40" y="392" text-anchor="start">That is essentially the three tokens of {{fig:v08-o008}}: an acceptance rate of 0.709</text><text class="cap" x="40" y="412" text-anchor="start">gives exactly 3. Each step costs 1.05 passes' worth of bytes, the target's 140 GB and</text><text class="cap" x="40" y="432" text-anchor="start">the drafter's 7, so α = 0.7 gives 2.94 ÷ 1.05 = 2.80 times the tokens per byte read.</text><text class="cap" x="40" y="472" text-anchor="start">Simulated a million passes, each guess kept at random with chance 0.7: 2.94 tokens a</text><text class="cap" x="40" y="492" text-anchor="start">pass.</text></svg><figcaption>The 1 is the target's own token, guaranteed; the other 1.94 is what the drafter earns. Raise α and only that part grows.</figcaption></figure>
