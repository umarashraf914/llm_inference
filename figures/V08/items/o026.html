<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 22:37</div><h3>The average hides the tail; p99 shows it</h3><svg viewBox='0 0 680 490' role='img'><title>The average hides the tail; p99 shows it</title><text class="hd" x="40" y="46">The same hundred requests read four ways, in multiples of the median, drawn to one scale</text><text class="cap" x="40" y="88" text-anchor="start">the median</text><text class="sub2" x="40" y="106" text-anchor="start">half were quicker</text><g class="u"><rect x="250" y="74" width="20.0" height="32" rx="3"/></g><text class="sub2" x="280.0" y="95" text-anchor="start">1.00 ×</text><text class="cap" x="40" y="142" text-anchor="start">the average</text><text class="sub2" x="40" y="160" text-anchor="start">dragged up by the tail</text><g class="u"><rect x="250" y="128" width="30.764448658487744" height="32" rx="3"/></g><text class="sub2" x="290.76444865848777" y="149" text-anchor="start">1.54 ×</text><text class="cap" x="40" y="196" text-anchor="start">p90</text><text class="sub2" x="40" y="214" text-anchor="start">one in ten was slower</text><g class="u"><rect x="250" y="182" width="22.857142857142854" height="32" rx="3"/></g><text class="sub2" x="282.85714285714283" y="203" text-anchor="start">1.14 ×</text><text class="cap" x="40" y="250" text-anchor="start">p99</text><text class="sub2" x="40" y="268" text-anchor="start">one in a hundred was slower</text><g class="h"><rect x="250" y="236" width="278.8422387404679" height="32" rx="3"/></g><text class="sub2" x="538.8422387404679" y="257" text-anchor="start">13.94 ×</text><text class="cap" x="40" y="320" text-anchor="start">All four describe one set of requests. Eight slow ones drag the average to 1.54 times</text><text class="cap" x="40" y="340" text-anchor="start">the median, above 92 of the hundred, so it describes no request anyone actually had; and</text><text class="cap" x="40" y="360" text-anchor="start">it is still 9 times below p99. Here even p90 sits on the flat body: only the 99th</text><text class="cap" x="40" y="380" text-anchor="start">percentile sees the tail.</text><text class="cap" x="40" y="420" text-anchor="start">So in production neither number is judged by its average. The service watches the tail,</text><text class="cap" x="40" y="440" text-anchor="start">the 99th percentile, the slowest one request in a hundred: that is the request a user</text><text class="cap" x="40" y="460" text-anchor="start">remembers, and the one that decides whether the service met the latency it promised.</text></svg><figcaption>Four summaries of one distribution on a single scale. The gap between the second bar and the fourth is the reason production systems are judged on percentiles.</figcaption></figure>
