<figure><div class='ts'>Fig 26 &nbsp;&middot;&nbsp; 22:14</div><h3>Why the tail is the number you watch</h3><svg viewBox="0 0 680 530" role="img"><title>Why the tail is the number you watch</title><text class="hd" x="40" y="46">The same distribution, read four ways</text><text class="cap" x="40" y="94" text-anchor="start">The median</text><text class="sub2" x="40" y="114" text-anchor="start">half the requests beat this</text><g class="s"><rect x="268" y="78" width="15" height="38" rx="3"></rect></g><text class="sub2" x="295" y="101" text-anchor="start">1x the median</text><text class="cap" x="40" y="156" text-anchor="start">The average</text><text class="sub2" x="40" y="176" text-anchor="start">dragged up a little by the tail</text><g class="s"><rect x="268" y="140" width="21" height="38" rx="3"></rect></g><text class="sub2" x="301" y="163" text-anchor="start">1.4x the median</text><text class="cap" x="40" y="218" text-anchor="start">p90</text><text class="sub2" x="40" y="238" text-anchor="start">one in ten is slower</text><g class="m"><rect x="268" y="202" width="90" height="38" rx="3"></rect></g><text class="sub2" x="370" y="225" text-anchor="start">6x the median</text><text class="cap" x="40" y="280" text-anchor="start">p99</text><text class="sub2" x="40" y="300" text-anchor="start">one in a hundred is slower</text><g class="h"><rect x="268" y="264" width="300" height="38" rx="3"></rect></g><text class="sub" x="418" y="283" text-anchor="middle" dominant-baseline="central">20x the median</text><text class="cap" x="40" y="356" text-anchor="start">All four describe one set of requests. The average sits a whisker above the median and says</text><text class="cap" x="40" y="376" text-anchor="start">nothing at all about the bar underneath it being twenty times longer.</text><text class="cap" x="40" y="412" text-anchor="start">A service sized for the average is sized for the second bar, and misses its promise for every</text><text class="cap" x="40" y="432" text-anchor="start">request in the fourth. Those are the ones a user notices.</text><text class="cap" x="40" y="468" text-anchor="start">Both user-facing numbers get this treatment: time to first token, which is prefill plus</text><text class="cap" x="40" y="488" text-anchor="start">whatever the request spent waiting in the queue, and time per output token, which comes from</text><text class="cap" x="40" y="508" text-anchor="start">memory-bound decode.</text></svg><figcaption>Four summaries of one distribution, drawn to a single scale. The gap between the second bar and the fourth is the entire reason production systems are judged on percentiles.</figcaption></figure>
