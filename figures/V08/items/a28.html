<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 9:57</div><h3>Vectors drift; tokens jump</h3><svg viewBox='0 0 680 484' role='img'><title>Vectors drift; tokens jump</title><text class="hd" x="40" y="46">A vector can be nearly right; a token cannot</text><text class="sub2" x="40" y="76" text-anchor="start">hidden states along ‘The cat sat on the mat’ (schematic)</text><polyline class="pl-m" points="70.0,200.0 112.0,156.5 154.0,124.7 196.0,112.6 238.0,122.1 280.0,148.4"/><circle cx="70.0" cy="200.0" r="4" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><text class="sub2" x="70" y="228.0" text-anchor="middle">The</text><circle cx="112.0" cy="156.5" r="4" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><text class="sub2" x="112" y="184.49212435147024" text-anchor="middle">cat</text><circle cx="154.0" cy="124.7" r="4" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><text class="sub2" x="154" y="152.66210632737864" text-anchor="middle">sat</text><circle cx="196.0" cy="112.6" r="4" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><text class="sub2" x="196" y="140.55197090798654" text-anchor="middle">on</text><circle cx="238.0" cy="122.1" r="4" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><text class="sub2" x="238" y="150.06407300569475" text-anchor="middle">the</text><circle cx="280.0" cy="148.4" r="4" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><text class="sub2" x="280" y="176.36881039375368" text-anchor="middle">mat</text><text class="sub2" x="40" y="252" text-anchor="start">each step moves a little: the next one is a short reach</text><text class="sub2" x="380" y="76" text-anchor="start">rows of GPT-4's token table</text><text class="sub2" x="380" y="104" text-anchor="start">8,414</text><g class="u"><rect x="440" y="88" width="130" height="22" rx="3"/><text class="sub" x="505.0" y="99.0" text-anchor="middle" dominant-baseline="central">‘ excell’</text></g><text class="sub2" x="380" y="130" text-anchor="start">8,415</text><g class="m"><rect x="440" y="114" width="130" height="22" rx="3"/><text class="sub" x="505.0" y="125.0" text-anchor="middle" dominant-baseline="central">‘ cat’</text></g><text class="sub2" x="380" y="156" text-anchor="start">8,416</text><g class="u"><rect x="440" y="140" width="130" height="22" rx="3"/><text class="sub" x="505.0" y="151.0" text-anchor="middle" dominant-baseline="central">‘normal’</text></g><text class="sub2" x="380" y="194" text-anchor="start">7,730</text><g class="u"><rect x="440" y="178" width="130" height="22" rx="3"/><text class="sub" x="505.0" y="189.0" text-anchor="middle" dominant-baseline="central">‘ Fre’</text></g><text class="sub2" x="380" y="220" text-anchor="start">7,731</text><g class="m"><rect x="440" y="204" width="130" height="22" rx="3"/><text class="sub" x="505.0" y="215.0" text-anchor="middle" dominant-baseline="central">‘ sat’</text></g><text class="sub2" x="380" y="246" text-anchor="start">7,732</text><g class="u"><rect x="440" y="230" width="130" height="22" rx="3"/><text class="sub" x="505.0" y="241.0" text-anchor="middle" dominant-baseline="central">‘ wood’</text></g><text class="sub2" x="380" y="270" text-anchor="start">the row next door is an unrelated word</text><text class="cap" x="40" y="314" text-anchor="start">A hidden state changes a little from one position to the next, so predicting the next</text><text class="cap" x="40" y="334" text-anchor="start">one is like extending a curve. That is the EAGLE paper's observation: these vectors are</text><text class="cap" x="40" y="354" text-anchor="start">more regular than the tokens, and predicting the vector, then reading a token off it</text><text class="cap" x="40" y="374" text-anchor="start">with the target's head, beat predicting the token directly.</text><text class="cap" x="40" y="414" text-anchor="start">A token is a row number in a table ({{fig:v01-o087}}), and nearby rows mean nothing. In</text><text class="cap" x="40" y="434" text-anchor="start">GPT-4's table the row after ‘ cat’ is ‘normal’ and the row after ‘ sat’ is ‘ wood’. A</text><text class="cap" x="40" y="454" text-anchor="start">guessed token is the right row or a wrong one; there is no nearly right.</text></svg><figcaption>The left panel is schematic: real hidden states have 8,192 numbers, not two. The contrast is the paper's: a vector can be nearly right and still read as the right token.</figcaption></figure>
