<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:19</div><h3>Proposed and kept: the smaller of p and q</h3><svg viewBox='0 0 680 502' role='img'><title>Proposed and kept: the smaller of p and q</title><text class="hd" x="40" y="46">How often each token is proposed, split into kept and rejected, to scale</text><text class="cap" x="40" y="85" text-anchor="start">cat</text><g class="m"><rect x="150" y="66" width="80.0" height="28" rx="3"/><text class="sub" x="190.0" y="80.0" text-anchor="middle" dominant-baseline="central">kept 0.2</text></g><text class="sub2" x="240.0" y="85" text-anchor="start">proposed 0.2</text><text class="cap" x="40" y="127" text-anchor="start">dog</text><g class="m"><rect x="150" y="108" width="120.0" height="28" rx="3"/><text class="sub" x="210.0" y="122.0" text-anchor="middle" dominant-baseline="central">kept 0.3</text></g><g class="h"><rect x="270.0" y="108" width="120.0" height="28" rx="3"/><text class="sub" x="330.0" y="122.0" text-anchor="middle" dominant-baseline="central">rejected 0.3</text></g><text class="sub2" x="400.0" y="127" text-anchor="start">proposed 0.6</text><text class="cap" x="40" y="169" text-anchor="start">rest</text><g class="m"><rect x="150" y="150" width="80.0" height="28" rx="3"/><text class="sub" x="190.0" y="164.0" text-anchor="middle" dominant-baseline="central">kept 0.2</text></g><text class="sub2" x="240.0" y="169" text-anchor="start">proposed 0.2</text><text class="cap" x="40" y="233" text-anchor="start">all guesses</text><g class="m"><rect x="150" y="214" width="280.0" height="28" rx="3"/><text class="sub" x="290.0" y="228.0" text-anchor="middle" dominant-baseline="central">kept: α = 0.7</text></g><g class="h"><rect x="430.0" y="214" width="120.00000000000001" height="28" rx="3"/><text class="sub" x="490.0" y="228.0" text-anchor="middle" dominant-baseline="central">0.3</text></g><text class="sub2" x="150" y="266" text-anchor="start">dog: 0.6 × min(1, 0.5) = 0.3, the smaller of p = 0.3 and q = 0.6</text><text class="cap" x="40" y="312" text-anchor="start">A token is kept if the drafter proposes it and the test keeps it, so multiply the two</text><text class="cap" x="40" y="332" text-anchor="start">chances: q × min(1, p ÷ q). When q is the larger, that is q × p ÷ q = p; when p is the</text><text class="cap" x="40" y="352" text-anchor="start">larger, it is q × 1 = q. Either way it is the smaller of the two, min(p, q).</text><text class="cap" x="40" y="392" text-anchor="start">Add the kept parts over every token and you have the acceptance rate, written α:</text><text class="cap" x="40" y="412" text-anchor="start">0.2 + 0.3 + 0.2 = 0.7, so seven guesses in ten survive. All of the rejected 0.3 comes</text><text class="cap" x="40" y="432" text-anchor="start">from dog, the only token the drafter proposes more often than the target would write it.</text><text class="cap" x="40" y="472" text-anchor="start">Simulated 1,000,000 times with these numbers, 70.0% of guesses were kept.</text></svg><figcaption>α is the overlap of the two distributions, the share they have in common. A drafter identical to the target would overlap completely, α = 1, and never be rejected.</figcaption></figure>
