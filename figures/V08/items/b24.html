<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 22:21</div><h3>TTFT is queue wait plus prefill; TPOT is one decode step</h3><svg viewBox='0 0 680 502' role='img'><title>TTFT is queue wait plus prefill; TPOT is one decode step</title><text class="hd" x="40" y="46">One request: the 70B model, a 2,000-token prompt, an illustrative queue wait</text><text class="cap" x="40" y="110" text-anchor="start">the request</text><g class="h"><rect x="140" y="92" width="176.0" height="28" rx="3"/><text class="sub" x="228.0" y="106.0" text-anchor="middle" dominant-baseline="central">queue wait 0.40 s</text></g><g class="m"><rect x="316.0" y="92" width="124.57027300303338" height="28" rx="3"/><text class="sub" x="378.2851365015167" y="106.0" text-anchor="middle" dominant-baseline="central">prefill 0.28 s</text></g><g class="u"><rect x="441.5702730030334" y="92" width="16.388059701492537" height="28" rx="2"/></g><g class="u"><rect x="459.9583327045259" y="92" width="16.388059701492537" height="28" rx="2"/></g><g class="u"><rect x="478.3463924060184" y="92" width="16.388059701492537" height="28" rx="2"/></g><g class="u"><rect x="496.73445210751095" y="92" width="16.388059701492537" height="28" rx="2"/></g><g class="u"><rect x="515.1225118090035" y="92" width="16.388059701492537" height="28" rx="2"/></g><g class="u"><rect x="533.5105715104961" y="92" width="16.388059701492537" height="28" rx="2"/></g><g class="u"><rect x="551.8986312119887" y="92" width="16.388059701492537" height="28" rx="2"/></g><g class="u"><rect x="570.2866909134813" y="92" width="16.388059701492537" height="28" rx="2"/></g><g class="u"><rect x="588.6747506149738" y="92" width="16.388059701492537" height="28" rx="2"/></g><text class="sub2" x="614.0628103164664" y="110" text-anchor="start">…</text><text class="sub2" x="140" y="80" text-anchor="start">arrives</text><text class="sub2" x="440.5702730030334" y="80" text-anchor="start">first token</text><line class="tick" x1="140" y1="138" x2="440.5702730030334" y2="138"/><line class="tick" x1="140" y1="133" x2="140" y2="138"/><line class="tick" x1="440.5702730030334" y1="133" x2="440.5702730030334" y2="138"/><text class="sub2" x="290.2851365015167" y="156" text-anchor="middle">time to first token, TTFT = 0.68 s</text><line class="tick" x1="441.5702730030334" y1="174" x2="457.9583327045259" y2="174"/><line class="tick" x1="441.5702730030334" y1="169" x2="441.5702730030334" y2="174"/><line class="tick" x1="457.9583327045259" y1="169" x2="457.9583327045259" y2="174"/><text class="sub2" x="449.76430285377967" y="192" text-anchor="middle">one step = TPOT, 41.8 ms</text><line class="tick" x1="140" y1="226" x2="140" y2="230"/><text class="sub2" x="140" y="246" text-anchor="middle">0 s</text><line class="tick" x1="250.0" y1="226" x2="250.0" y2="230"/><text class="sub2" x="250.0" y="246" text-anchor="middle">0.25 s</text><line class="tick" x1="360.0" y1="226" x2="360.0" y2="230"/><text class="sub2" x="360.0" y="246" text-anchor="middle">0.5 s</text><line class="tick" x1="470.0" y1="226" x2="470.0" y2="230"/><text class="sub2" x="470.0" y="246" text-anchor="middle">0.75 s</text><line class="tick" x1="580.0" y1="226" x2="580.0" y2="230"/><text class="sub2" x="580.0" y="246" text-anchor="middle">1 s</text><line class="axis" x1="140" y1="226" x2="624.0" y2="226"/><text class="cap" x="40" y="292" text-anchor="start">Two numbers decide whether a service is meeting its deadlines, and episode 1 built both</text><text class="cap" x="40" y="312" text-anchor="start">({{fig:v01-o143}}). Time to first token is prefill plus however long the request sat in the</text><text class="cap" x="40" y="332" text-anchor="start">queue. Time per output token comes from memory-bound decode: one step for every token.</text><text class="cap" x="40" y="372" text-anchor="start">Here the 2,000-token prompt needs 2 × 70 billion × 2,000 = 2.8 × 10¹⁴ operations, 0.28 s</text><text class="cap" x="40" y="392" text-anchor="start">at the H100's peak, after 0.40 s in the queue: TTFT 0.68 s. Every decode step reads the</text><text class="cap" x="40" y="412" text-anchor="start">140 GB of weights, 41.8 ms at 3.35 TB/s, so a 500-token answer takes another 20.9 s.</text><text class="cap" x="40" y="452" text-anchor="start">The queue term is zero on an idle machine and grows as the machine fills; it gets its</text><text class="cap" x="40" y="472" text-anchor="start">own figure further on.</text></svg><figcaption>TTFT is about load and prompt length, TPOT about bytes per token. Production watches both, and, as the next two figures show, not their averages.</figcaption></figure>
