<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 29:04</div><h3>286 times in 23 months is 19 times a year; bandwidth grew 1.4 times a year</h3><svg viewBox='0 0 680 536' role='img'><title>286 times in 23 months is 19 times a year; bandwidth grew 1.4 times a year</title><text class="hd" x="40" y="46">Improvement per year, log scale: a factor of 1 is no change at all</text><text class="cap" x="40" y="89" text-anchor="start">price of the capability</text><g class="s"><rect x="220" y="70" width="256.2711605895364" height="28" rx="3"/></g><text class="sub2" x="486.2711605895364" y="89" text-anchor="start">19.1 × a year</text><text class="cap" x="40" y="133" text-anchor="start">memory bandwidth</text><g class="u"><rect x="220" y="114" width="30.102999566398125" height="28" rx="3"/></g><text class="sub2" x="260.1029995663981" y="133" text-anchor="start">1.41 × a year: A100 to Blackwell</text><text class="cap" x="40" y="177" text-anchor="start">compute</text><g class="u"><rect x="220" y="158" width="42.901396204646005" height="28" rx="3"/></g><text class="sub2" x="272.901396204646" y="177" text-anchor="start">1.64 × a year</text><line class="axis" x1="220" y1="206" x2="620.0" y2="206"/><line class="tick" x1="220.0" y1="206" x2="220.0" y2="210"/><text class="sub2" x="220.0" y="224" text-anchor="middle">1 ×</text><line class="tick" x1="280.20599913279625" y1="206" x2="280.20599913279625" y2="210"/><text class="sub2" x="280.20599913279625" y="224" text-anchor="middle">2 ×</text><line class="tick" x1="359.79400086720375" y1="206" x2="359.79400086720375" y2="210"/><text class="sub2" x="359.79400086720375" y="224" text-anchor="middle">5 ×</text><line class="tick" x1="420.0" y1="206" x2="420.0" y2="210"/><text class="sub2" x="420.0" y="224" text-anchor="middle">10 ×</text><line class="tick" x1="480.20599913279625" y1="206" x2="480.20599913279625" y2="210"/><text class="sub2" x="480.20599913279625" y="224" text-anchor="middle">20 ×</text><line class="tick" x1="559.7940008672037" y1="206" x2="559.7940008672037" y2="210"/><text class="sub2" x="559.7940008672037" y="224" text-anchor="middle">50 ×</text><line class="tick" x1="620.0" y1="206" x2="620.0" y2="210"/><text class="sub2" x="620.0" y="224" text-anchor="middle">100 ×</text><text class="cap" x="40" y="266" text-anchor="start">To compare a change over 23 months with one over four years, turn each into a factor per</text><text class="cap" x="40" y="286" text-anchor="start">year with roots. A drop of 286 times in 23 months is 286 raised to the power 12/23, 19.1</text><text class="cap" x="40" y="306" text-anchor="start">times a year. Memory bandwidth roughly quadrupled over four years, from about 2 TB/s on</text><text class="cap" x="40" y="326" text-anchor="start">the A100 to around 8 on Blackwell: the fourth root of 4, 1.41 times a year.</text><text class="cap" x="40" y="366" text-anchor="start">Over the price series' 23 months, bandwidth grew 1.94 times. Had the price of a memory-</text><text class="cap" x="40" y="386" text-anchor="start">bound token tracked bandwidth alone, it would have fallen about two-fold, not 286-fold.</text><text class="cap" x="40" y="406" text-anchor="start">Measured as factors multiplied together, with logarithms, bandwidth supplied log 1.94 ÷</text><text class="cap" x="40" y="426" text-anchor="start">log 286 = 12% of the drop; the rest came from smaller models on a better stack.</text><text class="cap" x="40" y="466" text-anchor="start">Compute climbed faster still, about 7.2 times over the same four years</text><text class="cap" x="40" y="486" text-anchor="start">({{fig:v02-o069}}), so the gap that decode falls into is wider now than when this series</text><text class="cap" x="40" y="506" text-anchor="start">started.</text></svg><figcaption>The hardware did not stand still, but at 1.4 times a year it could not have produced 19. Most of the drop came from moving fewer bytes per token.</figcaption></figure>
