<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 19:31</div><h3>Attention received so far says nothing about attention needed later</h3><svg viewBox='0 0 680 452' role='img'><title>Attention received so far says nothing about attention needed later</title><text class="hd" x="40" y="46">One token's story, illustrative: ignored for 1,000 steps, needed at step 1,200</text><text class="cap" x="40" y="92" text-anchor="start">in the cache</text><g class="s"><rect x="170.0" y="76" width="321.42857142857144" height="26" rx="3"/></g><rect x="491.42857142857144" y="76" width="128.57142857142856" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="555.7142857142858" y="89.0" text-anchor="middle" dominant-baseline="central">evicted</text><text class="cap" x="40" y="142" text-anchor="start">attention it gets</text><g class="u"><rect x="170.0" y="128" width="321.42857142857144" height="6" rx="1"/></g><text class="sub2" x="170.0" y="154" text-anchor="start">a trickle: always near the bottom of the tally</text><text class="cap" x="40" y="196" text-anchor="start">the question</text><g class="h"><rect x="525.7142857142857" y="180" width="60" height="26" rx="3"/><text class="sub" x="555.7142857142857" y="193.0" text-anchor="middle" dominant-baseline="central">needs it</text></g><line class="tick" x1="170.0" y1="222" x2="170.0" y2="226"/><text class="sub2" x="170.0" y="242" text-anchor="middle">0</text><line class="tick" x1="234.28571428571428" y1="222" x2="234.28571428571428" y2="226"/><text class="sub2" x="234.28571428571428" y="242" text-anchor="middle">200</text><line class="tick" x1="298.57142857142856" y1="222" x2="298.57142857142856" y2="226"/><text class="sub2" x="298.57142857142856" y="242" text-anchor="middle">400</text><line class="tick" x1="362.85714285714283" y1="222" x2="362.85714285714283" y2="226"/><text class="sub2" x="362.85714285714283" y="242" text-anchor="middle">600</text><line class="tick" x1="427.1428571428571" y1="222" x2="427.1428571428571" y2="226"/><text class="sub2" x="427.1428571428571" y="242" text-anchor="middle">800</text><line class="tick" x1="491.42857142857144" y1="222" x2="491.42857142857144" y2="226"/><text class="sub2" x="491.42857142857144" y="242" text-anchor="middle">1,000</text><line class="tick" x1="555.7142857142857" y1="222" x2="555.7142857142857" y2="226"/><text class="sub2" x="555.7142857142857" y="242" text-anchor="middle">1,200</text><line class="tick" x1="620.0" y1="222" x2="620.0" y2="226"/><text class="sub2" x="620.0" y="242" text-anchor="middle">1,400</text><line class="axis" x1="170.0" y1="222" x2="620.0" y2="222"/><text class="sub2" x="395.0" y="262" text-anchor="middle">decode step</text><text class="cap" x="40" y="302" text-anchor="start">Both methods estimate importance from attention that has already happened. A token that</text><text class="cap" x="40" y="322" text-anchor="start">has drawn little attention so far, a name in a footnote, a figure in a table, ranks low</text><text class="cap" x="40" y="342" text-anchor="start">and is among the first evicted.</text><text class="cap" x="40" y="382" text-anchor="start">If a later question turns on it, it is already gone, and the cache cannot bring it back;</text><text class="cap" x="40" y="402" text-anchor="start">only processing the text again could. So both can discard a token that only becomes</text><text class="cap" x="40" y="422" text-anchor="start">relevant later.</text></svg><figcaption>Eviction bets that the past predicts the future. The bet fails exactly when a conversation turns to something it had not needed until now.</figcaption></figure>
