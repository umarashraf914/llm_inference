<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:28</div><h3>The replacement is drawn only from what the drafter left short</h3><svg viewBox='0 0 680 510' role='img'><title>The replacement is drawn only from what the drafter left short</title><text class="hd" x="40" y="46">Subtract, clip at zero, rescale to add to 1</text><text class="sub2" x="150" y="78" text-anchor="start">p − q</text><text class="sub2" x="370" y="78" text-anchor="start">clip at zero</text><text class="sub2" x="500" y="78" text-anchor="start">rescale</text><text class="cap" x="40" y="109" text-anchor="start">cat</text><g class="u"><rect x="230" y="90" width="75.0" height="28" rx="3"/><text class="sub" x="267.5" y="104.0" text-anchor="middle" dominant-baseline="central">+0.3</text></g><g class="u"><rect x="370" y="90" width="75.0" height="28" rx="3"/><text class="sub" x="407.5" y="104.0" text-anchor="middle" dominant-baseline="central">0.3</text></g><g class="u"><rect x="500" y="90" width="130.0" height="28" rx="3"/><text class="sub" x="565.0" y="104.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="cap" x="40" y="151" text-anchor="start">dog</text><g class="h"><rect x="155.0" y="132" width="75.0" height="28" rx="3"/><text class="sub" x="192.5" y="146.0" text-anchor="middle" dominant-baseline="central">−0.3</text></g><text class="sub2" x="374" y="151" text-anchor="start">0</text><text class="sub2" x="504" y="151" text-anchor="start">0</text><text class="cap" x="40" y="193" text-anchor="start">rest</text><text class="sub2" x="238" y="193" text-anchor="start">0</text><text class="sub2" x="374" y="193" text-anchor="start">0</text><text class="sub2" x="504" y="193" text-anchor="start">0</text><line class="tick" x1="230" y1="86" x2="230" y2="218"/><text class="sub2" x="230" y="234" text-anchor="middle">0</text><text class="sub2" x="370" y="234" text-anchor="start">total 0.3</text><text class="sub2" x="500" y="234" text-anchor="start">total 1</text><text class="cap" x="40" y="280" text-anchor="start">Subtract the drafter's probability from the target's, token by token: +0.3 for cat, −0.3</text><text class="cap" x="40" y="300" text-anchor="start">for dog, 0 for rest. Clip the negatives to zero, so weight survives only where the</text><text class="cap" x="40" y="320" text-anchor="start">target wanted a token more than the drafter did. Rescale so it adds to 1.</text><text class="cap" x="40" y="360" text-anchor="start">Here the leftover is all cat, so every rejection is replaced by ‘cat’. That is the</text><text class="cap" x="40" y="380" text-anchor="start">point: the drafter proposes cat 0.2 of the time where the target wants 0.5, and the</text><text class="cap" x="40" y="400" text-anchor="start">replacements are how the missing 0.3 gets made up.</text><text class="cap" x="40" y="440" text-anchor="start">Before rescaling, the leftover adds to 0.3, exactly the rejected share 1 − α. Both</text><text class="cap" x="40" y="460" text-anchor="start">distributions add to 1, so whatever the drafter overrates on some tokens it underrates</text><text class="cap" x="40" y="480" text-anchor="start">by the same total on others.</text></svg><figcaption>What the drafter took too much of on one token, it owes on another. The rejections take back the excess, and the replacements pay the debt.</figcaption></figure>
