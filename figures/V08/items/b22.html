<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 20:51</div><h3>The corpus can be any size; the prompt stays a few thousand tokens</h3><svg viewBox='0 0 680 470' role='img'><title>The corpus can be any size; the prompt stays a few thousand tokens</title><text class="hd" x="40" y="46">Cache needed for one question with the 70B model, log scale ({{fig:v01-o121}})</text><text class="cap" x="40" y="82" text-anchor="start">a billion-token corpus</text><text class="cap" x="40" y="98" text-anchor="start">held in context</text><g class="h"><rect x="230" y="70" width="338.80339661790526" height="26" rx="3"/></g><text class="sub2" x="578.8033966179053" y="88" text-anchor="start">327.7 TB</text><text class="cap" x="40" y="136" text-anchor="start">one 128k context</text><g class="h"><rect x="230" y="118" width="136.9139127848647" height="26" rx="3"/></g><text class="sub2" x="376.9139127848647" y="136" text-anchor="start">42.9 GB</text><text class="cap" x="40" y="178" text-anchor="start">retrieval: 5 chunks of 500</text><text class="cap" x="40" y="194" text-anchor="start">and a 50-token question</text><g class="s"><rect x="230" y="166" width="47.94348600047101" height="26" rx="3"/></g><text class="sub2" x="287.943486000471" y="184" text-anchor="start">0.84 GB</text><line class="axis" x1="230" y1="218" x2="594.0" y2="218"/><line class="tick" x1="230.0" y1="218" x2="230.0" y2="222"/><text class="sub2" x="230.0" y="236" text-anchor="middle">0.1 GB</text><line class="tick" x1="282.0" y1="218" x2="282.0" y2="222"/><text class="sub2" x="282.0" y="236" text-anchor="middle">1 GB</text><line class="tick" x1="334.0" y1="218" x2="334.0" y2="222"/><text class="sub2" x="334.0" y="236" text-anchor="middle">10 GB</text><line class="tick" x1="386.0" y1="218" x2="386.0" y2="222"/><text class="sub2" x="386.0" y="236" text-anchor="middle">100 GB</text><line class="tick" x1="438.0" y1="218" x2="438.0" y2="222"/><text class="sub2" x="438.0" y="236" text-anchor="middle">1 TB</text><line class="tick" x1="490.0" y1="218" x2="490.0" y2="222"/><text class="sub2" x="490.0" y="236" text-anchor="middle">10 TB</text><line class="tick" x1="542.0" y1="218" x2="542.0" y2="222"/><text class="sub2" x="542.0" y="236" text-anchor="middle">100 TB</text><line class="tick" x1="594.0" y1="218" x2="594.0" y2="222"/><text class="sub2" x="594.0" y="236" text-anchor="middle">1 PB</text><text class="cap" x="40" y="280" text-anchor="start">The context stays a few thousand tokens long no matter how large the corpus is, so the</text><text class="cap" x="40" y="300" text-anchor="start">cache never gets a chance to grow: five chunks of 500 tokens and a 50-token question are</text><text class="cap" x="40" y="320" text-anchor="start">2,550 tokens, 0.84 GB of cache, whatever the corpus holds. Holding a billion-token</text><text class="cap" x="40" y="340" text-anchor="start">corpus in context would take 327.7 TB.</text><text class="cap" x="40" y="380" text-anchor="start">A 2020 paper introduced this using a dense vector index of Wikipedia with a trained</text><text class="cap" x="40" y="400" text-anchor="start">retriever in front of it. Saving memory was not what its authors were after: they wanted</text><text class="cap" x="40" y="420" text-anchor="start">a model that could reach knowledge it had never memorised. Keeping the context short is</text><text class="cap" x="40" y="440" text-anchor="start">a side effect that turned out to matter later.</text></svg><figcaption>Log scale: the two ends differ about 390,000-fold. A technique that arrived for one reason and stayed for another.</figcaption></figure>
