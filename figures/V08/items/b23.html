<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 21:49</div><h3>With retrieval, the shared prefix ends where the chunks begin</h3><svg viewBox='0 0 680 492' role='img'><title>With retrieval, the shared prefix ends where the chunks begin</title><text class="hd" x="40" y="46">Two questions to one assistant, each prompt 3,050 tokens, drawn to scale</text><text class="cap" x="40" y="80" text-anchor="start">same document</text><g class="s"><rect x="150" y="66" width="73.77049180327869" height="24" rx="2"/><text class="sub" x="186.88524590163934" y="78.0" text-anchor="middle" dominant-baseline="central">system</text></g><g class="s"><rect x="223.77049180327867" y="66" width="368.8524590163934" height="24" rx="2"/><text class="sub" x="408.19672131147536" y="78.0" text-anchor="middle" dominant-baseline="central">the document</text></g><g class="h"><rect x="592.622950819672" y="66" width="7.3770491803278695" height="24" rx="2"/></g><text class="sub2" x="608" y="82" text-anchor="start">request 1</text><g class="s"><rect x="150" y="98" width="73.77049180327869" height="24" rx="2"/><text class="sub" x="186.88524590163934" y="110.0" text-anchor="middle" dominant-baseline="central">system</text></g><g class="s"><rect x="223.77049180327867" y="98" width="368.8524590163934" height="24" rx="2"/><text class="sub" x="408.19672131147536" y="110.0" text-anchor="middle" dominant-baseline="central">the same document</text></g><g class="h"><rect x="592.622950819672" y="98" width="7.3770491803278695" height="24" rx="2"/></g><text class="sub2" x="608" y="114" text-anchor="start">request 2</text><text class="sub2" x="150" y="144" text-anchor="start">shared prefix: 98.4%</text><text class="cap" x="40" y="188" text-anchor="start">retrieval</text><g class="s"><rect x="150" y="174" width="73.77049180327869" height="24" rx="2"/><text class="sub" x="186.88524590163934" y="186.0" text-anchor="middle" dominant-baseline="central">system</text></g><g class="h"><rect x="223.77049180327867" y="174" width="368.8524590163934" height="24" rx="2"/><text class="sub" x="408.19672131147536" y="186.0" text-anchor="middle" dominant-baseline="central">chunks for question 1</text></g><g class="h"><rect x="592.622950819672" y="174" width="7.3770491803278695" height="24" rx="2"/></g><text class="sub2" x="608" y="190" text-anchor="start">request 1</text><g class="s"><rect x="150" y="206" width="73.77049180327869" height="24" rx="2"/><text class="sub" x="186.88524590163934" y="218.0" text-anchor="middle" dominant-baseline="central">system</text></g><g class="h"><rect x="223.77049180327867" y="206" width="368.8524590163934" height="24" rx="2"/><text class="sub" x="408.19672131147536" y="218.0" text-anchor="middle" dominant-baseline="central">chunks for question 2</text></g><g class="h"><rect x="592.622950819672" y="206" width="7.3770491803278695" height="24" rx="2"/></g><text class="sub2" x="608" y="222" text-anchor="start">request 2</text><text class="sub2" x="150" y="252" text-anchor="start">shared prefix: 16.4%</text><text class="sub2" x="150" y="278" text-anchor="start">500 system + 2,500 document or chunks + 50 question; teal reused, red recomputed</text><text class="cap" x="40" y="322" text-anchor="start">Prefix caching, which episode 7 built ({{fig:v07-o012}}), works because an identical run</text><text class="cap" x="40" y="342" text-anchor="start">of tokens produces identical keys and values, so the shared front of a prompt can be</text><text class="cap" x="40" y="362" text-anchor="start">computed once and reused. The match runs from the first token and stops at the first</text><text class="cap" x="40" y="382" text-anchor="start">difference ({{fig:v01-o044}}).</text><text class="cap" x="40" y="422" text-anchor="start">Retrieved chunks change from query to query and they sit near the front of the prompt.</text><text class="cap" x="40" y="442" text-anchor="start">Two requests diverge almost immediately: only 500 of 3,050 tokens are shared, 16%,</text><text class="cap" x="40" y="462" text-anchor="start">against 98% when the same document sits in every prompt.</text></svg><figcaption>Two sensible techniques pulling against each other: retrieval puts the varying text near the front, exactly where prefix caching needs everything to stay the same.</figcaption></figure>
