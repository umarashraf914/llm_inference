<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 9:41</div><h3>EAGLE drafts the vector the decoding head reads, and borrows the head to turn it into a token</h3><svg viewBox='0 0 680 696' role='img'><title>EAGLE drafts the vector the decoding head reads, and borrows the head to turn it into a token</title><text class="hd" x="40" y="46">Left, the target; right, EAGLE-1's drafter, which borrows two of its parts</text><g class="u"><rect x="40" y="66" width="260" height="290" rx="14"/><text class="lbl" x="62" y="92">the target</text></g><g class="u"><rect x="70" y="108" width="200" height="30" rx="3"/><text class="sub" x="170.0" y="123.0" text-anchor="middle" dominant-baseline="central">embedding table</text></g><line class="conn" x1="170" y1="140" x2="170" y2="154" marker-end="url(#arw)"/><g class="u"><rect x="70" y="158" width="200" height="40" rx="3"/><text class="sub" x="170.0" y="178.0" text-anchor="middle" dominant-baseline="central">80 layers</text></g><line class="conn" x1="170" y1="200" x2="170" y2="214" marker-end="url(#arw)"/><g class="m"><rect x="70" y="218" width="200" height="30" rx="3"/><text class="sub" x="170.0" y="233.0" text-anchor="middle" dominant-baseline="central">top hidden state: 8,192 numbers</text></g><line class="conn" x1="170" y1="250" x2="170" y2="264" marker-end="url(#arw)"/><g class="u"><rect x="70" y="268" width="200" height="30" rx="3"/><text class="sub" x="170.0" y="283.0" text-anchor="middle" dominant-baseline="central">decoding head</text></g><line class="conn" x1="170" y1="300" x2="170" y2="312" marker-end="url(#arw)"/><g class="u"><rect x="110" y="316" width="120" height="24" rx="3"/><text class="sub" x="170.0" y="328.0" text-anchor="middle" dominant-baseline="central">next token</text></g><g class="m"><rect x="340" y="66" width="300" height="290" rx="14"/><text class="lbl" x="362" y="92">EAGLE-1's drafter</text></g><g class="u"><rect x="370" y="108" width="240" height="30" rx="3"/><text class="sub" x="490.0" y="123.0" text-anchor="middle" dominant-baseline="central">vector + next token's embedding</text></g><line class="conn" x1="490" y1="140" x2="490" y2="154" marker-end="url(#arw)"/><g class="u"><rect x="370" y="158" width="240" height="40" rx="3"/><text class="sub" x="490.0" y="178.0" text-anchor="middle" dominant-baseline="central">mixing layer, then one layer</text></g><line class="conn" x1="490" y1="200" x2="490" y2="214" marker-end="url(#arw)"/><g class="m"><rect x="370" y="218" width="240" height="30" rx="3"/><text class="sub" x="490.0" y="233.0" text-anchor="middle" dominant-baseline="central">predicted next hidden state</text></g><line class="conn" x1="490" y1="250" x2="490" y2="264" marker-end="url(#arw)"/><g class="u"><rect x="370" y="268" width="240" height="30" rx="3"/><text class="sub" x="490.0" y="283.0" text-anchor="middle" dominant-baseline="central">the target's head, borrowed</text></g><line class="conn" x1="490" y1="300" x2="490" y2="312" marker-end="url(#arw)"/><g class="u"><rect x="430" y="316" width="120" height="24" rx="3"/><text class="sub" x="490.0" y="328.0" text-anchor="middle" dominant-baseline="central">a guessed token</text></g><line class="conn" x1="302" y1="233" x2="336" y2="123" marker-end="url(#arw)"/><text class="sub2" x="40" y="384" text-anchor="start">the guessed token and the predicted vector go back in for the next guess</text><text class="cap" x="40" y="426" text-anchor="start">EAGLE, a family of drafting methods from 2024, changes what the drafter predicts.</text><text class="cap" x="40" y="446" text-anchor="start">Instead of the next token, EAGLE-1 predicts the target's own hidden state at the top of</text><text class="cap" x="40" y="466" text-anchor="start">its layer stack: the vector the decoding head reads, which the paper calls the second-</text><text class="cap" x="40" y="486" text-anchor="start">to-top layer, counting the head as the top. The target's head then turns it into a</text><text class="cap" x="40" y="506" text-anchor="start">token.</text><text class="cap" x="40" y="546" text-anchor="start">The drafter is small: one layer that mixes that vector with the next token's embedding,</text><text class="cap" x="40" y="566" text-anchor="start">then one transformer layer, under a billion trainable weights for a 70B target (0.99</text><text class="cap" x="40" y="586" text-anchor="start">billion). Its embedding table and head are the target's own, borrowed rather than</text><text class="cap" x="40" y="606" text-anchor="start">trained.</text><text class="cap" x="40" y="646" text-anchor="start">EAGLE-1 arranges its guesses into a tree the same way Medusa does, and checks them with</text><text class="cap" x="40" y="666" text-anchor="start">the rule of Part 3, so the output stays exact.</text></svg><figcaption>The drafter predicts in the target's own internal language, and the target's own head translates it into tokens. That division of labour is the whole idea.</figcaption></figure>
