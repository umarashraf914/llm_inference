<figure><div class='ts'>Fig 20 &nbsp;&middot;&nbsp; 18:04</div><h3>Attention sinks</h3><svg viewBox="0 0 680 488" role="img"><title>Attention sinks</title><text class="hd" x="40" y="46">Softmax weights have to add up to one</text><g class="u"><rect x="40" y="70" width="600" height="34" rx="4"></rect><text class="sub" x="340.0" y="87.0" text-anchor="middle" dominant-baseline="central">even when nothing in the context is a good match</text></g><text class="cap" x="40" y="148" text-anchor="start">So the leftover weight still has to land somewhere. Every token in the context ends up with a</text><text class="cap" x="40" y="168" text-anchor="start">sliver of it, even the ones that match nothing.</text><text class="cap" x="40" y="208" text-anchor="start">The model resolves this by dumping the leftover onto the first few tokens of the sequence. Those</text><text class="cap" x="40" y="228" text-anchor="start">work because every later position can see them.</text><text class="hd" x="40" y="278">So keep those, and a rolling window, and evict everything between</text><g class="s"><rect x="40" y="298" width="90" height="40" rx="4"></rect><text class="sub" x="85.0" y="318.0" text-anchor="middle" dominant-baseline="central">sinks</text></g><rect x="140" y="298" width="340" height="40" rx="4" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="310.0" y="318.0" text-anchor="middle" dominant-baseline="central">evicted</text><g class="s"><rect x="490" y="298" width="150" height="40" rx="4"></rect><text class="sub" x="565.0" y="318.0" text-anchor="middle" dominant-baseline="central">recent window</text></g><text class="cap" x="40" y="386" text-anchor="start">A model trained on a finite window can then keep generating over a stream of four million tokens</text><text class="cap" x="40" y="406" text-anchor="start">and more.</text><text class="cap" x="40" y="446" text-anchor="start">That is not a four-million-token memory. The window never grows, and whatever falls out of it is</text><text class="cap" x="40" y="466" text-anchor="start">gone permanently.</text></svg><figcaption>An artefact of softmax turned into a mechanism. The last two lines are the honest reading of the headline number.</figcaption></figure>
