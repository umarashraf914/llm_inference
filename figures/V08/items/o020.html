<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 18:36</div><h3>StreamingLLM keeps four sink tokens and a rolling window, and evicts the rest</h3><svg viewBox='0 0 680 308' role='img'><title>StreamingLLM keeps four sink tokens and a rolling window, and evicts the rest</title><text class="hd" x="40" y="46">The cache StreamingLLM keeps, in token order</text><g class="s"><rect x="40" y="70" width="110" height="44" rx="8"/><text class="lbl" x="95.0" y="92.0" text-anchor="middle" dominant-baseline="central">4 sink tokens</text></g><rect x="160" y="70" width="300" height="44" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="310.0" y="92.0" text-anchor="middle" dominant-baseline="central">evicted: gone for good</text><g class="s"><rect x="470" y="70" width="170" height="44" rx="8"/><text class="lbl" x="555.0" y="92.0" text-anchor="middle" dominant-baseline="central">recent window</text></g><text class="sub2" x="95" y="134" text-anchor="middle">the first four</text><text class="sub2" x="555" y="134" text-anchor="middle">rolls forward with the text</text><text class="cap" x="40" y="178" text-anchor="start">StreamingLLM keeps those sink tokens, and four are enough, alongside a rolling window of</text><text class="cap" x="40" y="198" text-anchor="start">recent ones, and evicts everything in between. A model trained on a finite window can</text><text class="cap" x="40" y="218" text-anchor="start">then keep generating over a stream of four million tokens and more.</text><text class="cap" x="40" y="258" text-anchor="start">That is not a four-million-token memory. The window never grows, and whatever falls out</text><text class="cap" x="40" y="278" text-anchor="start">of it is gone permanently.</text></svg><figcaption>An artefact of softmax turned into a mechanism. The second paragraph is the honest reading of the headline number.</figcaption></figure>
