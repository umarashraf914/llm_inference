<figure><div class='ts'>Fig 24 &nbsp;&middot;&nbsp; 21:23</div><h3>The costs</h3><svg viewBox="0 0 680 322" role="img"><title>The costs</title><text class="hd" x="40" y="46">What you give up</text><g class="h"><rect x="40" y="70" width="190" height="82" rx="8"></rect><text class="lbl" x="135.0" y="94.0" text-anchor="middle" dominant-baseline="central">The retriever decides</text><text class="sub" x="135.0" y="112.0" text-anchor="middle" dominant-baseline="central">what the model is allowed</text><text class="sub" x="135.0" y="129.0" text-anchor="middle" dominant-baseline="central">to know</text></g><g class="h"><rect x="246" y="70" width="190" height="82" rx="8"></rect><text class="lbl" x="341.0" y="94.0" text-anchor="middle" dominant-baseline="central">A second system</text><text class="sub" x="341.0" y="112.0" text-anchor="middle" dominant-baseline="central">with its own index to build,</text><text class="sub" x="341.0" y="129.0" text-anchor="middle" dominant-baseline="central">refresh and tune</text></g><g class="h"><rect x="452" y="70" width="188" height="82" rx="8"></rect><text class="lbl" x="546.0" y="102.0" text-anchor="middle" dominant-baseline="central">It fits badly with</text><text class="sub" x="546.0" y="120.0" text-anchor="middle" dominant-baseline="central">prefix caching</text></g><text class="cap" x="40" y="200" text-anchor="start">If the retriever misses the chunk holding the answer, the model never sees it. No amount of</text><text class="cap" x="40" y="220" text-anchor="start">capability recovers a document that was never put in front of it.</text><text class="cap" x="40" y="260" text-anchor="start">And prefix caching works because an identical run of tokens produces identical keys and values.</text><text class="cap" x="40" y="280" text-anchor="start">Retrieved chunks change from query to query and they sit near the front of the prompt, so two</text><text class="cap" x="40" y="300" text-anchor="start">requests diverge almost immediately and there is little left to share.</text></svg><figcaption>The last one is a genuine interaction between two techniques that are each sensible alone. Retrieval and prefix caching pull against each other.</figcaption></figure>
