<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 21:23</div><h3>In exchange, the retriever decides what the model is allowed to know</h3><svg viewBox='0 0 680 308' role='img'><title>In exchange, the retriever decides what the model is allowed to know</title><text class="hd" x="40" y="46">What retrieval gives up</text><g class="h"><rect x="40" y="70" width="190" height="82" rx="8"/><text class="lbl" x="135.0" y="94.0" text-anchor="middle" dominant-baseline="central">The retriever decides</text><text class="sub" x="135.0" y="112.0" text-anchor="middle" dominant-baseline="central">what the model is</text><text class="sub" x="135.0" y="129.0" text-anchor="middle" dominant-baseline="central">allowed to know</text></g><g class="h"><rect x="246" y="70" width="190" height="82" rx="8"/><text class="lbl" x="341.0" y="94.0" text-anchor="middle" dominant-baseline="central">A second system</text><text class="sub" x="341.0" y="112.0" text-anchor="middle" dominant-baseline="central">with its own index to</text><text class="sub" x="341.0" y="129.0" text-anchor="middle" dominant-baseline="central">build, refresh and tune</text></g><g class="h"><rect x="452" y="70" width="188" height="82" rx="8"/><text class="lbl" x="546.0" y="94.0" text-anchor="middle" dominant-baseline="central">Prefix caching</text><text class="sub" x="546.0" y="112.0" text-anchor="middle" dominant-baseline="central">fits badly: the next</text><text class="sub" x="546.0" y="129.0" text-anchor="middle" dominant-baseline="central">figure shows why</text></g><text class="cap" x="40" y="198" text-anchor="start">If the retriever misses the chunk holding the answer, the model never sees it. No amount</text><text class="cap" x="40" y="218" text-anchor="start">of capability recovers a document that was never put in front of it.</text><text class="cap" x="40" y="258" text-anchor="start">You are also running a second system now, with its own index to build, refresh and tune,</text><text class="cap" x="40" y="278" text-anchor="start">and it fits badly with prefix caching.</text></svg><figcaption>The first cost is the serious one. Retrieval moves the question of what the model knows out of the model and into a search.</figcaption></figure>
