<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:36</div><h3>Spent as a tree, fourteen positions reach further than a chain of fourteen</h3><svg viewBox='0 0 680 412' role='img'><title>Spent as a tree, fourteen positions reach further than a chain of fourteen</title><text class="hd" x="40" y="46">Expected guesses accepted per pass, drawn to scale (illustrative rates)</text><text class="cap" x="40" y="89" text-anchor="start">a chain of 3</text><g class="u"><rect x="230" y="70" width="211.67999999999998" height="28" rx="3"/><text class="sub" x="335.84" y="84.0" text-anchor="middle" dominant-baseline="central">1.18</text></g><text class="sub2" x="451.67999999999995" y="89" text-anchor="start">3 positions</text><text class="cap" x="40" y="133" text-anchor="start">a chain of 14</text><g class="u"><rect x="230" y="114" width="269.78841675694076" height="28" rx="3"/><text class="sub" x="364.89420837847035" y="128.0" text-anchor="middle" dominant-baseline="central">1.50</text></g><text class="sub2" x="509.78841675694076" y="133" text-anchor="start">14 positions</text><text class="cap" x="40" y="177" text-anchor="start">a tree of 14: 2 + 4 + 8</text><g class="m"><rect x="230" y="158" width="351.36000000000007" height="28" rx="3"/><text class="sub" x="405.68000000000006" y="172.0" text-anchor="middle" dominant-baseline="central">1.95</text></g><text class="sub2" x="591.3600000000001" y="177" text-anchor="start">14 positions</text><text class="cap" x="40" y="242" text-anchor="start">Assume each head's top pick is right 60% of the time and its second pick a further 20%.</text><text class="cap" x="40" y="262" text-anchor="start">A chain uses top picks only, so its k-th guess survives with chance 0.6 to the power k:</text><text class="cap" x="40" y="282" text-anchor="start">a chain of 14 expects 0.6 + 0.36 + … = 1.50 accepted guesses, and the last eleven add</text><text class="cap" x="40" y="302" text-anchor="start">almost nothing.</text><text class="cap" x="40" y="342" text-anchor="start">A tree with two picks at each of three levels also has 14 tokens. At every level one of</text><text class="cap" x="40" y="362" text-anchor="start">its two branches is right with chance 0.8, so it expects 0.8 + 0.64 + 0.512 = 1.95,</text><text class="cap" x="40" y="382" text-anchor="start">against 1.18 for a chain three deep. Simulated a million times, the tree reached 1.95.</text></svg><figcaption>Illustrative rates, general shape: positions spent on alternatives near the root are worth more than positions spent far down a single line.</figcaption></figure>
