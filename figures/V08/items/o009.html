<figure><div class='ts'>Fig 09 &nbsp;&middot;&nbsp; 6:35</div><h3>The ceiling</h3><svg viewBox="0 0 680 356" role="img"><title>The ceiling</title><text class="hd" x="40" y="46">Verification is close to free only while compute sits idle</text><text class="cap" x="40" y="92" text-anchor="start">One user</text><g class="s"><rect x="240" y="76" width="340" height="32" rx="3"></rect><text class="sub" x="410.0" y="92.0" text-anchor="middle" dominant-baseline="central">nearly all the compute is idle</text></g><text class="cap" x="40" y="152" text-anchor="start">A packed machine</text><g class="h"><rect x="240" y="136" width="60" height="32" rx="3"></rect></g><text class="sub2" x="316" y="155" text-anchor="start">little room left for five extra positions</text><text class="cap" x="40" y="214" text-anchor="start">The more requests you put behind a single weight read, the less room is left for speculation.</text><text class="cap" x="40" y="254" text-anchor="start">So speculative decoding helps most on a machine serving a single user, and least on a machine</text><text class="cap" x="40" y="274" text-anchor="start">already packed with other requests.</text><text class="cap" x="40" y="314" text-anchor="start">It is the exact complement of batching. One works when there is a crowd; the other works when</text><text class="cap" x="40" y="334" text-anchor="start">there is not.</text></svg><figcaption>This is why production systems run both. They cover opposite ends of the same axis, and neither is sufficient alone.</figcaption></figure>
