7.56818820794936" y="298.03629008394955" text-anchor="start">arithmetic: 0.142 ms a position</text><circle cx="110.0" cy="136.5" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><circle cx="110.0" cy="309.4" r="3" fill="var(--m)"/><text class="sub2" x="118.0" y="126.5241739951025" text-anchor="start">1</text><circle cx="226.7" cy="136.5" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><circle cx="226.7" cy="255.0" r="3" fill="var(--m)"/><text class="sub2" x="226.72268755754655" y="126.5241739951025" text-anchor="middle">6</text><circle cx="380.9" cy="136.5" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><circle cx="380.9" cy="183.0" r="3" fill="var(--m)"/><text class="sub2" x="380.92699609758307" y="126.5241739951025" text-anchor="middle">64</text><circle cx="497.6" cy="128.5" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><circle cx="497.6" cy="128.5" r="3" fill="var(--m)"/><text class="sub2" x="497.64968365512965" y="118.53159220859874" text-anchor="middle">384</text><text class="sub2" x="40" y="392" text-anchor="start">positions in the pass</text><text class="sub2" x="300" y="392" text-anchor="start">arithmetic</text><text class="sub2" x="400" y="392" text-anchor="start">weight read</text><text class="sub2" x="500" y="392" text-anchor="start">the pass takes</text><text class="cap" x="40" y="416" text-anchor="start">1: one request</text><text class="sub2" x="300" y="416" text-anchor="start">0.14 ms</text><text class="sub2" x="400" y="416" text-anchor="start">41.8 ms</text><text class="sub2" x="500" y="416" text-anchor="start">41.8 ms</text><text class="cap" x="40" y="440" text-anchor="start">6: one request, five guesses</text><text class="sub2" x="300" y="440" text-anchor="start">0.85 ms</text><text class="sub2" x="400" y="440" text-anchor="start">41.8 ms</text><text class="sub2" x="500" y="440" text-anchor="start">41.8 ms</text><text class="cap" x="40" y="464" text-anchor="start">64: 64 requests</text><text class="sub2" x="300" y="464" text-anchor="start">9.06 ms</text><text class="sub2" x="400" y="464" text-anchor="start">41.8 ms</text><text class="sub2" x="500" y="464" text-anchor="start">41.8 ms</text><text class="cap" x="40" y="488" text-anchor="start">384: 64 requests, five guesses each</text><text class="sub2" x="300" y="488" text-anchor="start">54.36 ms</text><text class="sub2" x="400" y="488" text-anchor="start">41.8 ms</text><text class="sub2" x="500" y="488" text-anchor="start">54.4 ms, past the ridge</text><text class="cap" x="40" y="552" text-anchor="start">A pass takes the longer of two times: reading the weights, 41.8 ms however many</text><text class="cap" x="40" y="572" text-anchor="start">positions it carries, and the arithmetic, 0.142 ms per position. They are equal at 295</text><text class="cap" x="40" y="592" text-anchor="start">positions, the ridge ({{fig:v01-o126}}). Below it the read decides and extra positions</text><text class="cap" x="40" y="612" text-anchor="start">are free; above it every position adds time.</text><text class="cap" x="40" y="652" text-anchor="start">At batch one, five guesses take a pass from 1 position to 6, far below the ridge. A</text><text class="cap" x="40" y="672" text-anchor="start">batch of 64 already carries 64, and five guesses for every request make it 384: past the</text><text class="cap" x="40" y="692" text-anchor="start">ridge, so the pass takes 54.4 ms instead of 41.8.</text><text class="cap" x="40" y="732" text-anchor="start">Counting weights alone, with α = 0.7 and the drafter's reads included, the speed-up is</text><text class="cap" x="40" y="752" text-anchor="start">2.80× at batch 1, 2.18× at 64, 1.11× at 128 and 0.56× at 256, a slowdown. Speculation</text><text class="cap" x="40" y="772" text-anchor="start">helps most on a machine serving one user, and least on one already packed with requests.</text></svg><figcaption>Weights only, so this explains the direction of EAGLE-3's fall from 6.5× to 1.38× in Part 5, not its size. Speculation and batching spend the same idle arithmetic, so a busy server has less of it to spend.</figcaption></figure>
