chor="start">1</text><text class="sub2" x="110" y="211" text-anchor="start">(0.20, 0.10)</text><text class="sub2" x="230" y="211" text-anchor="start">0.6 × 0.20 + 0.9 × 0.10</text><g class="u"><rect x="430" y="194" width="62" height="24" rx="3"/><text class="sub" x="461.0" y="206.0" text-anchor="middle" dominant-baseline="central">0.21</text></g><g class="u"><rect x="520" y="194" width="40" height="24" rx="3"/><text class="sub" x="540.0" y="206.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="cap" x="40" y="241" text-anchor="start">2</text><text class="sub2" x="110" y="241" text-anchor="start">(0.90, 0.30)</text><text class="sub2" x="230" y="241" text-anchor="start">0.6 × 0.90 + 0.9 × 0.30</text><g class="u"><rect x="430" y="224" width="62" height="24" rx="3"/><text class="sub" x="461.0" y="236.0" text-anchor="middle" dominant-baseline="central">0.81</text></g><g class="u"><rect x="520" y="224" width="40" height="24" rx="3"/><text class="sub" x="540.0" y="236.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="cap" x="40" y="271" text-anchor="start">3</text><text class="sub2" x="110" y="271" text-anchor="start">(0.75, 0.50)</text><text class="sub2" x="230" y="271" text-anchor="start">0.6 × 0.75 + 0.9 × 0.50</text><g class="s"><rect x="430" y="254" width="62" height="24" rx="3"/><text class="sub" x="461.0" y="266.0" text-anchor="middle" dominant-baseline="central">0.90</text></g><g class="s"><rect x="520" y="254" width="40" height="24" rx="3"/><text class="sub" x="540.0" y="266.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="cap" x="40" y="301" text-anchor="start">4</text><text class="sub2" x="110" y="301" text-anchor="start">(−0.40, 0.60)</text><text class="sub2" x="230" y="301" text-anchor="start">0.6 × −0.40 + 0.9 × 0.60</text><g class="u"><rect x="430" y="284" width="62" height="24" rx="3"/><text class="sub" x="461.0" y="296.0" text-anchor="middle" dominant-baseline="central">0.30</text></g><g class="u"><rect x="520" y="284" width="40" height="24" rx="3"/><text class="sub" x="540.0" y="296.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="cap" x="40" y="331" text-anchor="start">5</text><text class="sub2" x="110" y="331" text-anchor="start">(0.10, 0.90)</text><text class="sub2" x="230" y="331" text-anchor="start">0.6 × 0.10 + 0.9 × 0.90</text><g class="s"><rect x="430" y="314" width="62" height="24" rx="3"/><text class="sub" x="461.0" y="326.0" text-anchor="middle" dominant-baseline="central">0.87</text></g><g class="s"><rect x="520" y="314" width="40" height="24" rx="3"/><text class="sub" x="540.0" y="326.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="cap" x="40" y="361" text-anchor="start">6</text><text class="sub2" x="110" y="361" text-anchor="start">(0.50, −0.30)</text><text class="sub2" x="230" y="361" text-anchor="start">0.6 × 0.50 + 0.9 × −0.30</text><g class="u"><rect x="430" y="344" width="62" height="24" rx="3"/><text class="sub" x="461.0" y="356.0" text-anchor="middle" dominant-baseline="central">0.03</text></g><g class="u"><rect x="520" y="344" width="40" height="24" rx="3"/><text class="sub" x="540.0" y="356.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="cap" x="40" y="391" text-anchor="start">7</text><text class="sub2" x="110" y="391" text-anchor="start">(−0.20, −0.60)</text><text class="sub2" x="230" y="391" text-anchor="start">0.6 × −0.20 + 0.9 × −0.60</text><g class="u"><rect x="430" y="374" width="62" height="24" rx="3"/><text class="sub" x="461.0" y="386.0" text-anchor="middle" dominant-baseline="central">−0.66</text></g><g class="u"><rect x="520" y="374" width="40" height="24" rx="3"/><text class="sub" x="540.0" y="386.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="cap" x="40" y="421" text-anchor="start">8  (own)</text><text class="sub2" x="110" y="421" text-anchor="start">not scored: always kept, causal mask inside</text><g class="s"><rect x="520" y="404" width="40" height="24" rx="3"/><text class="sub" x="540.0" y="416.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="cap" x="40" y="464" text-anchor="start">Each block is summarised by the average of its keys: add them and divide by how many.</text><text class="cap" x="40" y="484" text-anchor="start">The query's dot product with that average is the block's score ({{fig:v03-o014}}), and</text><text class="cap" x="40" y="504" text-anchor="start">the gate keeps the k highest ({{fig:v06-o009}}).</text><text class="cap" x="40" y="544" text-anchor="start">The query's own block is always kept, with the usual causal mask inside it, and blocks</text><text class="cap" x="40" y="564" text-anchor="start">after the query are never scored. Here k = 3: the own block plus the two best earlier</text><text class="cap" x="40" y="584" text-anchor="start">ones, blocks 3 and 5. The query then attends, by ordinary softmax, to the tokens of</text><text class="cap" x="40" y="604" text-anchor="start">those three blocks only.</text><text class="cap" x="40" y="644" text-anchor="start">The gate is 1 for a kept block and 0 for the rest, and it has no weights of its own.</text><text class="cap" x="40" y="664" text-anchor="start">What training shapes is the queries and keys themselves, learned with the gate in place.</text></svg><figcaption>Unlike episode 6's router, which has a weight matrix of its own, this gate is arithmetic on vectors the model already computes. Learned belongs to the queries and keys, not to the gate.</figcaption></figure>
