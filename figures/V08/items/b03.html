<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:47</div><h3>FlashAttention stopped the scores reaching memory; the cache stayed the same size</h3><svg viewBox='0 0 680 500' role='img'><title>FlashAttention stopped the scores reaching memory; the cache stayed the same size</title><text class="hd" x="40" y="46">One 131,072-token prompt in the 70B model: what reaches memory</text><text class="cap" x="40" y="90" text-anchor="start">score grid, one head, one layer</text><text class="sub2" x="60" y="120" text-anchor="start">naive kernel</text><g class="h"><rect x="230" y="102" width="240.0" height="26" rx="3"/></g><text class="sub2" x="480.0" y="119" text-anchor="start">34.4 GB written, then read back</text><text class="sub2" x="60" y="154" text-anchor="start">FlashAttention</text><rect x="230" y="136" width="300" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="242" y="153" text-anchor="start">0 bytes: each tile stays on chip</text><text class="cap" x="40" y="196" text-anchor="start">cache, all 80 layers</text><text class="sub2" x="60" y="226" text-anchor="start">naive kernel</text><g class="h"><rect x="230" y="208" width="300.0" height="26" rx="3"/></g><text class="sub2" x="540.0" y="225" text-anchor="start">42.9 GB</text><text class="sub2" x="60" y="260" text-anchor="start">FlashAttention</text><g class="h"><rect x="230" y="242" width="300.0" height="26" rx="3"/></g><text class="sub2" x="540.0" y="259" text-anchor="start">42.9 GB, unchanged</text><text class="cap" x="40" y="310" text-anchor="start">Attention compares every query with every key. A naive kernel writes that grid of scores</text><text class="cap" x="40" y="330" text-anchor="start">to memory, reads it back for the softmax and writes it again ({{fig:v03-o030}}): at this</text><text class="cap" x="40" y="350" text-anchor="start">length the grid is 131,072² numbers, 34.4 GB for each head in each layer. FlashAttention</text><text class="cap" x="40" y="370" text-anchor="start">computes it tile by tile on the chip, folds each tile into the output and discards it,</text><text class="cap" x="40" y="390" text-anchor="start">so the grid never reaches memory ({{fig:v03-o037}}). The output is identical.</text><text class="cap" x="40" y="430" text-anchor="start">The cache is a different object: one key and one value per token per layer, kept between</text><text class="cap" x="40" y="450" text-anchor="start">steps and read at every step. FlashAttention changes how it is read, never how much of</text><text class="cap" x="40" y="470" text-anchor="start">it there is, and it still grows with every token that arrives.</text></svg><figcaption>Two memory problems with different shapes. FlashAttention solved the one that grows with the square of the context; the one that grows in a straight line is what every method from here on attacks.</figcaption></figure>
