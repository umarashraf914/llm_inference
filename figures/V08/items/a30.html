<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 10:48</div><h3>EAGLE-3 reads three depths of the target and drafts tokens again</h3><svg viewBox='0 0 680 744' role='img'><title>EAGLE-3 reads three depths of the target and drafts tokens again</title><text class="hd" x="40" y="46">Three taps on the target, joined, and a drafter that predicts tokens</text><g class="u"><rect x="40" y="66" width="250" height="230" rx="14"/><text class="lbl" x="62" y="92">the target's layers</text></g><g class="u"><rect x="70" y="112" width="190" height="34" rx="3"/><text class="sub" x="165.0" y="129.0" text-anchor="middle" dominant-baseline="central">a high layer</text></g><line class="conn" x1="264" y1="129" x2="336" y2="166.5" marker-end="url(#arw)"/><g class="u"><rect x="70" y="170" width="190" height="34" rx="3"/><text class="sub" x="165.0" y="187.0" text-anchor="middle" dominant-baseline="central">a middle layer</text></g><line class="conn" x1="264" y1="187" x2="336" y2="181.0" marker-end="url(#arw)"/><g class="u"><rect x="70" y="228" width="190" height="34" rx="3"/><text class="sub" x="165.0" y="245.0" text-anchor="middle" dominant-baseline="central">a low layer</text></g><line class="conn" x1="264" y1="245" x2="336" y2="195.5" marker-end="url(#arw)"/><g class="m"><rect x="340" y="152" width="140" height="60" rx="3"/><text class="sub" x="410.0" y="182.0" text-anchor="middle" dominant-baseline="central">join: 3 × 8,192</text></g><text class="sub2" x="410" y="228" text-anchor="middle">squeezed to 8,192</text><line class="conn" x1="484" y1="182" x2="516" y2="182" marker-end="url(#arw)"/><g class="m"><rect x="520" y="152" width="120" height="60" rx="3"/><text class="sub" x="580.0" y="182.0" text-anchor="middle" dominant-baseline="central">drafter</text></g><text class="sub2" x="580" y="228" text-anchor="middle">predicts tokens</text><text class="hd" x="40" y="340">Speed-up against training data (schematic, after the paper's Figure 1)</text><line class="axis" x1="120" y1="470" x2="540" y2="470"/><line class="tick" x1="120.0" y1="470" x2="120.0" y2="475"/><text class="sub2" x="120.0" y="489" text-anchor="middle">1×</text><line class="tick" x1="260.0" y1="470" x2="260.0" y2="475"/><text class="sub2" x="260.0" y="489" text-anchor="middle">2×</text><line class="tick" x1="400.0" y1="470" x2="400.0" y2="475"/><text class="sub2" x="400.0" y="489" text-anchor="middle">4×</text><line class="tick" x1="540.0" y1="470" x2="540.0" y2="475"/><text class="sub2" x="540.0" y="489" text-anchor="middle">8×</text><polyline class="pl-h" points="120.0,418.0 260.0,415.0 400.0,413.5 540.0,412.8"/><polyline class="pl-m" points="120.0,408.0 260.0,390.0 400.0,372.0 540.0,354.0"/><text class="sub2" x="548.0" y="416.75" text-anchor="start">EAGLE-2</text><text class="sub2" x="548.0" y="358" text-anchor="start">EAGLE-3</text><text class="sub2" x="540" y="510" text-anchor="end">training text, relative to the original set</text><text class="cap" x="40" y="554" text-anchor="start">EAGLE-3 reverses the original idea: it goes back to predicting tokens directly, but</text><text class="cap" x="40" y="574" text-anchor="start">feeds the drafter a mixture of the target's hidden states from a low, a middle and a</text><text class="cap" x="40" y="594" text-anchor="start">high layer, joined into one vector three times as long and squeezed back to the usual</text><text class="cap" x="40" y="614" text-anchor="start">width by one small layer.</text><text class="cap" x="40" y="654" text-anchor="start">Dropping the requirement to predict the next hidden state exactly removed a ceiling.</text><text class="cap" x="40" y="674" text-anchor="start">With the vector-predicting drafter of EAGLE and EAGLE-2, more training text gave little;</text><text class="cap" x="40" y="694" text-anchor="start">EAGLE-3's kept improving, up to eight times the original training set, the most the</text><text class="cap" x="40" y="714" text-anchor="start">paper tried.</text></svg><figcaption>Two changes with one motive: a drafter no longer forced to reproduce one layer's vector can use more of what the target computed, and keeps getting better with more data.</figcaption></figure>
