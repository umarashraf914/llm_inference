<figure><div class='ts'>Fig 23 &nbsp;&middot;&nbsp; 20:33</div><h3>Retrieval</h3><svg viewBox="0 0 680 390" role="img"><title>Retrieval</title><text class="hd" x="40" y="46">Ahead of time</text><g class="u"><rect x="40" y="70" width="140" height="40" rx="4"></rect><text class="sub" x="110.0" y="90.0" text-anchor="middle" dominant-baseline="central">the corpus</text></g><line class="conn" x1="186" y1="90" x2="206" y2="90" marker-end="url(#arw)"></line><g class="u"><rect x="212" y="70" width="130" height="40" rx="4"></rect><text class="sub" x="277.0" y="90.0" text-anchor="middle" dominant-baseline="central">split into chunks</text></g><line class="conn" x1="348" y1="90" x2="368" y2="90" marker-end="url(#arw)"></line><g class="s"><rect x="374" y="70" width="266" height="40" rx="4"></rect><text class="sub" x="507.0" y="90.0" text-anchor="middle" dominant-baseline="central">each stored as a vector of what it says</text></g><text class="hd" x="40" y="152">When a question arrives</text><g class="u"><rect x="40" y="176" width="140" height="40" rx="4"></rect><text class="sub" x="110.0" y="196.0" text-anchor="middle" dominant-baseline="central">the question</text></g><line class="conn" x1="186" y1="196" x2="206" y2="196" marker-end="url(#arw)"></line><g class="u"><rect x="212" y="176" width="150" height="40" rx="4"></rect><text class="sub" x="287.0" y="196.0" text-anchor="middle" dominant-baseline="central">turned into a vector</text></g><line class="conn" x1="368" y1="196" x2="388" y2="196" marker-end="url(#arw)"></line><g class="m"><rect x="394" y="176" width="246" height="40" rx="4"></rect><text class="sub" x="517.0" y="196.0" text-anchor="middle" dominant-baseline="central">nearest chunks go in the prompt</text></g><text class="cap" x="40" y="268" text-anchor="start">The context stays a few thousand tokens long no matter how large the corpus is, so the cache</text><text class="cap" x="40" y="288" text-anchor="start">never gets a chance to grow.</text><text class="cap" x="40" y="328" text-anchor="start">The 2020 paper that introduced this was not after saving memory. It wanted a model that could</text><text class="cap" x="40" y="348" text-anchor="start">reach knowledge it had never memorised. Keeping the context short is a side effect that turned</text><text class="cap" x="40" y="368" text-anchor="start">out to matter later.</text></svg><figcaption>A technique that arrived for one reason and stayed for another. That is worth knowing when reading claims about what it is for.</figcaption></figure>
