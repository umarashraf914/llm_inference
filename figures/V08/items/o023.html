<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 20:23</div><h3>Retrieval-augmented generation keeps the documents outside the prompt</h3><svg viewBox='0 0 680 422' role='img'><title>Retrieval-augmented generation keeps the documents outside the prompt</title><text class="hd" x="40" y="46">Ahead of time, once</text><g class="u"><rect x="40" y="64" width="140" height="40" rx="8"/><text class="lbl" x="110.0" y="84.0" text-anchor="middle" dominant-baseline="central">the corpus</text></g><line class="conn" x1="184" y1="84" x2="206" y2="84" marker-end="url(#arw)"/><g class="u"><rect x="210" y="64" width="150" height="40" rx="8"/><text class="lbl" x="285.0" y="84.0" text-anchor="middle" dominant-baseline="central">split into chunks</text></g><line class="conn" x1="364" y1="84" x2="386" y2="84" marker-end="url(#arw)"/><g class="u"><rect x="390" y="64" width="250" height="40" rx="8"/><text class="lbl" x="515.0" y="84.0" text-anchor="middle" dominant-baseline="central">each stored as a vector</text></g><text class="hd" x="40" y="150">When a question arrives</text><g class="u"><rect x="40" y="168" width="140" height="40" rx="8"/><text class="lbl" x="110.0" y="188.0" text-anchor="middle" dominant-baseline="central">the question</text></g><line class="conn" x1="184" y1="188" x2="206" y2="188" marker-end="url(#arw)"/><g class="u"><rect x="210" y="168" width="150" height="40" rx="8"/><text class="lbl" x="285.0" y="188.0" text-anchor="middle" dominant-baseline="central">turned into a vector</text></g><line class="conn" x1="364" y1="188" x2="386" y2="188" marker-end="url(#arw)"/><g class="s"><rect x="390" y="168" width="250" height="40" rx="8"/><text class="lbl" x="515.0" y="188.0" text-anchor="middle" dominant-baseline="central">nearest few into the prompt</text></g><text class="cap" x="40" y="252" text-anchor="start">Retrieval-augmented generation keeps the documents outside the prompt and pulls in only</text><text class="cap" x="40" y="272" text-anchor="start">the few pieces each question needs. The corpus is everything the model should be able to</text><text class="cap" x="40" y="292" text-anchor="start">draw on. It is split into chunks and indexed ahead of time, each chunk stored as a</text><text class="cap" x="40" y="312" text-anchor="start">vector that captures roughly what it says.</text><text class="cap" x="40" y="352" text-anchor="start">When a question arrives, it is turned into a vector the same way, the chunks nearest to</text><text class="cap" x="40" y="372" text-anchor="start">it are found, and only those few are put in the prompt. The next three figures open the</text><text class="cap" x="40" y="392" text-anchor="start">boxes: what a chunk's vector is, what nearest means, and what this saves.</text></svg><figcaption>Everything slow happens once, ahead of time. Per question there is one short encoding, one search, and a prompt of a few chunks.</figcaption></figure>
