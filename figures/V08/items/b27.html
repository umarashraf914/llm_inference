72.0" width="18" height="78.0" rx="1"/></g><g class="h"><rect x="318" y="164.28571428571428" width="18" height="7.714285714285714" rx="1"/></g><g class="s"><rect x="344" y="163.42857142857144" width="18" height="86.57142857142857" rx="1"/></g><g class="h"><rect x="344" y="155.71428571428572" width="18" height="7.714285714285714" rx="1"/></g><text class="sub2" x="353.0" y="266" text-anchor="middle">10</text><g class="s"><rect x="370" y="154.85714285714283" width="18" height="95.14285714285715" rx="1"/></g><g class="h"><rect x="370" y="147.1428571428571" width="18" height="7.714285714285714" rx="1"/></g><g class="s"><rect x="396" y="146.28571428571428" width="18" height="103.71428571428572" rx="1"/></g><g class="h"><rect x="396" y="138.57142857142856" width="18" height="7.714285714285714" rx="1"/></g><g class="s"><rect x="422" y="137.71428571428572" width="18" height="112.28571428571429" rx="1"/></g><g class="h"><rect x="422" y="130.0" width="18" height="7.714285714285714" rx="1"/></g><g class="s"><rect x="448" y="129.14285714285714" width="18" height="120.85714285714286" rx="1"/></g><g class="h"><rect x="448" y="121.42857142857143" width="18" height="7.714285714285714" rx="1"/></g><g class="s"><rect x="474" y="120.57142857142856" width="18" height="129.42857142857144" rx="1"/></g><g class="h"><rect x="474" y="112.85714285714285" width="18" height="7.714285714285714" rx="1"/></g><text class="sub2" x="483.0" y="266" text-anchor="middle">15</text><g class="s"><rect x="500" y="112.0" width="18" height="138.0" rx="1"/></g><g class="h"><rect x="500" y="104.28571428571429" width="18" height="7.714285714285714" rx="1"/></g><g class="s"><rect x="526" y="103.42857142857142" width="18" height="146.57142857142858" rx="1"/></g><g class="h"><rect x="526" y="95.71428571428571" width="18" height="7.714285714285714" rx="1"/></g><g class="s"><rect x="552" y="94.85714285714286" width="18" height="155.14285714285714" rx="1"/></g><g class="h"><rect x="552" y="87.14285714285715" width="18" height="7.714285714285714" rx="1"/></g><g class="s"><rect x="578" y="86.28571428571428" width="18" height="163.71428571428572" rx="1"/></g><g class="h"><rect x="578" y="78.57142857142857" width="18" height="7.714285714285714" rx="1"/></g><g class="s"><rect x="604" y="77.7142857142857" width="18" height="172.2857142857143" rx="1"/></g><g class="h"><rect x="604" y="69.99999999999999" width="18" height="7.714285714285714" rx="1"/></g><text class="sub2" x="613.0" y="266" text-anchor="middle">20</text><line class="axis" x1="106" y1="250" x2="630" y2="250"/><text class="cap" x="40" y="266" text-anchor="start">step</text><text class="sub2" x="40" y="70" text-anchor="start">21,000</text><text class="sub2" x="40" y="86" text-anchor="start">tokens in</text><g class="s"><rect x="110" y="284" width="12" height="12" rx="1"/></g><text class="sub2" x="128" y="294" text-anchor="start">already in the cache: earlier prompt and the model's last action</text><g class="h"><rect x="110" y="304" width="12" height="12" rx="1"/></g><text class="sub2" x="128" y="314" text-anchor="start">new: the tool's reply, 900 tokens (the whole 2,000-token start, at step 1)</text><text class="cap" x="40" y="360" text-anchor="start">Agents work differently: they run the model over and over, feeding the whole history</text><text class="cap" x="40" y="380" text-anchor="start">back in each time. Each step's prompt is the previous one plus what happened since, the</text><text class="cap" x="40" y="400" text-anchor="start">model's last action and the tool's reply, so its front is a prefix the server has</text><text class="cap" x="40" y="420" text-anchor="start">already seen and can serve from the cache ({{fig:v07-o013}}).</text><text class="cap" x="40" y="460" text-anchor="start">The hit rate is the share of input tokens served from the cache. Over these 20 steps,</text><text class="cap" x="40" y="480" text-anchor="start">210,900 of 230,000 input tokens were already cached: 92%. The agent also read 115 tokens</text><text class="cap" x="40" y="500" text-anchor="start">for every token it wrote.</text></svg><figcaption>The hit rate climbs as the history grows, because each step adds a little to a lot. Anything that edits the front, such as a timestamp at the top of the system prompt, sends it back to zero.</figcaption></figure>
