ext><line class="axis" x1="46" y1="234" x2="636" y2="234"></line><text class="cap" x="40" y="300" text-anchor="start">Each bar is one request and its height is how long that request took. Sort them, and the</text><text class="cap" x="40" y="320" text-anchor="start">percentile is simply a position in the sorted line.</text><text class="cap" x="40" y="356" text-anchor="start">p50, the median, is the fiftieth: half the requests were quicker. p99 is the ninety-ninth: only</text><text class="cap" x="40" y="376" text-anchor="start">one request in a hundred was slower than that.</text><text class="cap" x="40" y="412" text-anchor="start">Notice the shape. Ninety of the hundred sit almost flat, and the line only climbs in the last</text><text class="cap" x="40" y="432" text-anchor="start">few. That is what a latency distribution looks like, and it is why the average tells you so</text><text class="cap" x="40" y="452" text-anchor="start">little.</text></svg><figcaption>The definition is literally a sorting operation. Illustrative shape rather than measured data, but the flat body and the sudden climb are what real systems show.</figcaption></figure>
