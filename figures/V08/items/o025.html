h"><rect x="588.8000000000001" y="224.0" width="4.4" height="12.0" rx="1"/></g><g class="h"><rect x="594.7" y="218.78596520497888" width="4.4" height="17.214034795021117" rx="1"/></g><g class="h"><rect x="600.6" y="211.30641717298352" width="4.4" height="24.693582827016474" rx="1"/></g><g class="h"><rect x="606.5" y="200.5769838335002" width="4.4" height="35.42301616649979" rx="1"/></g><g class="h"><rect x="612.4000000000001" y="185.18558059710642" width="4.4" height="50.81441940289358" rx="1"/></g><g class="h"><rect x="618.3000000000001" y="163.10656802581616" width="4.4" height="72.89343197418386" rx="1"/></g><g class="h"><rect x="624.2" y="131.43416047232452" width="4.4" height="104.56583952767548" rx="1"/></g><g class="h"><rect x="630.1" y="86.0" width="4.4" height="150.0" rx="1"/></g><line class="axis" x1="46" y1="236" x2="636.0" y2="236"/><line class="tick" x1="337.3" y1="238" x2="337.3" y2="246"/><text class="sub2" x="337.3" y="262" text-anchor="middle">p50</text><line class="tick" x1="573.3000000000001" y1="238" x2="573.3000000000001" y2="246"/><text class="sub2" x="573.3000000000001" y="262" text-anchor="middle">p90</text><line class="tick" x1="626.4000000000001" y1="238" x2="626.4000000000001" y2="246"/><text class="sub2" x="626.4000000000001" y="262" text-anchor="middle">p99</text><text class="sub2" x="630.1" y="76" text-anchor="end">slowest: 20 × the median</text><text class="cap" x="40" y="302" text-anchor="start">Each bar is one request, and its height is how long that request waited for its first</text><text class="cap" x="40" y="322" text-anchor="start">token. Sort them, and a percentile is simply a position in the sorted line. p50, the</text><text class="cap" x="40" y="342" text-anchor="start">median, is the 50th: half the requests were quicker. p90 is the 90th. p99 is the 99th:</text><text class="cap" x="40" y="362" text-anchor="start">only one request in a hundred was slower than that.</text><text class="cap" x="40" y="402" text-anchor="start">Notice the shape. Ninety-two of the hundred sit almost flat, within 15% of the median,</text><text class="cap" x="40" y="422" text-anchor="start">and the line climbs only in the last eight, to 20 times the median. That is the shape</text><text class="cap" x="40" y="442" text-anchor="start">latency distributions have, and it is why the average tells you so little.</text></svg><figcaption>The definition is a sorting operation. The data are illustrative, but a flat body with a sudden climb is what real services show, and the next figure reads this one four ways.</figcaption></figure>
