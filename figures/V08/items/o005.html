<figure><div class='ts'>Fig 05 &nbsp;&middot;&nbsp; 3:19</div><h3>Probability and sampling</h3><svg viewBox="0 0 680 464" role="img"><title>Probability and sampling</title><text class="hd" x="40" y="46">A probability is a share of one whole</text><line class="axis" x1="60" y1="130" x2="620" y2="130"></line><g class="m"><rect x="60" y="96" width="280" height="30" rx="3"></rect><text class="sub" x="200.0" y="111.0" text-anchor="middle" dominant-baseline="central">cat, 0.50</text></g><g class="m"><rect x="344" y="96" width="168" height="30" rx="3"></rect><text class="sub" x="428.0" y="111.0" text-anchor="middle" dominant-baseline="central">dog, 0.30</text></g><g class="u"><rect x="516" y="96" width="104" height="30" rx="3"></rect><text class="sub" x="568.0" y="111.0" text-anchor="middle" dominant-baseline="central">rest, 0.20</text></g><text class="sub2" x="60" y="168" text-anchor="start">the whole bar is 1.00: something must happen</text><text class="hd" x="40" y="218">Sampling: throw a dart at the bar and take what it lands on</text><line class="axis" x1="60" y1="300" x2="620" y2="300"></line><g class="m"><rect x="60" y="266" width="280" height="30" rx="3"></rect></g><g class="m"><rect x="344" y="266" width="168" height="30" rx="3"></rect></g><g class="u"><rect x="516" y="266" width="104" height="30" rx="3"></rect></g><line class="mark xok" x1="392" y1="250" x2="392" y2="312"></line><text class="sub2" x="392" y="242" text-anchor="middle">dart</text><text class="cap" x="40" y="366" text-anchor="start">Half the time the dart lands in the cat region, three tenths of the time in dog. Repeat the</text><text class="cap" x="40" y="386" text-anchor="start">whole process a thousand times and the counts match the shares.</text><text class="cap" x="40" y="422" text-anchor="start">That is what it means to say two methods produce the same distribution: not that they give the</text><text class="cap" x="40" y="442" text-anchor="start">same answer, but that over many runs their answers land in the same proportions.</text></svg><figcaption>The last line is the one the correctness argument depends on. Identical distribution, not identical output.</figcaption></figure>
