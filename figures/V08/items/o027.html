<figure><div class='ts'>Fig 27 &nbsp;&middot;&nbsp; 23:04</div><h3>The utilisation trap</h3><svg viewBox="0 0 680 394" role="img"><title>The utilisation trap</title><text class="hd" x="40" y="46">The number most dashboards lead with, and why it lies</text><g class="h"><rect x="40" y="70" width="600" height="40" rx="4"></rect><text class="sub" x="340.0" y="90.0" text-anchor="middle" dominant-baseline="central">utilisation: the percentage of time at least one kernel was executing</text></g><text class="cap" x="40" y="150" text-anchor="start">That tells you whether the chip is busy, not whether it is getting anything done. A decode step</text><text class="cap" x="40" y="170" text-anchor="start">stalled on memory leaves the arithmetic units nearly idle, but it is still a kernel executing,</text><text class="cap" x="40" y="190" text-anchor="start">so utilisation reports 100%.</text><text class="hd" x="40" y="240">The numbers worth tracking</text><g class="s"><rect x="40" y="260" width="190" height="66" rx="8"></rect><text class="lbl" x="135.0" y="284.0" text-anchor="middle" dominant-baseline="central">Tokens per second</text><text class="sub" x="135.0" y="302.0" text-anchor="middle" dominant-baseline="central">the product itself</text></g><g class="s"><rect x="246" y="260" width="190" height="66" rx="8"></rect><text class="lbl" x="341.0" y="284.0" text-anchor="middle" dominant-baseline="central">Batchfulness</text><text class="sub" x="341.0" y="302.0" text-anchor="middle" dominant-baseline="central">requests per weight read</text></g><g class="s"><rect x="452" y="260" width="188" height="66" rx="8"></rect><text class="lbl" x="546.0" y="284.0" text-anchor="middle" dominant-baseline="central">Queue weight</text><text class="sub" x="546.0" y="302.0" text-anchor="middle" dominant-baseline="central">rises first when capacity runs out</text></g><text class="cap" x="40" y="372" text-anchor="start">Each of these moves when something real changes. Utilisation does not.</text></svg><figcaption>Worth knowing precisely, because it is the metric most likely to be quoted at you as evidence that a cluster is working hard.</figcaption></figure>
