<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 23:06</div><h3>Utilisation can read 100% while the arithmetic is 0.3% busy</h3><svg viewBox='0 0 680 454' role='img'><title>Utilisation can read 100% while the arithmetic is 0.3% busy</title><text class="hd" x="40" y="46">One decode step of the 70B model at batch one, 41.8 ms, drawn to scale</text><text class="cap" x="40" y="91" text-anchor="start">a kernel is running</text><g class="u"><rect x="170" y="72" width="470" height="28" rx="3"/><text class="sub" x="405.0" y="86.0" text-anchor="middle" dominant-baseline="central">utilisation counts this: 100%</text></g><text class="cap" x="40" y="135" text-anchor="start">weights on the bus</text><g class="h"><rect x="170" y="116" width="470" height="28" rx="3"/><text class="sub" x="405.0" y="130.0" text-anchor="middle" dominant-baseline="central">140 GB at 3.35 TB/s: 41.8 ms</text></g><text class="cap" x="40" y="179" text-anchor="start">arithmetic units</text><g class="m"><rect x="170" y="160" width="1.6" height="28" rx="3"/></g><text class="sub2" x="182" y="179" text-anchor="start">busy 0.14 ms: 0.34% of the step</text><text class="sub2" x="40" y="226" text-anchor="start">NVIDIA's definition: the percentage of time over a sample period during which one or more</text><text class="sub2" x="40" y="242" text-anchor="start">kernels was executing; the sample period is between a sixth of a second and one second</text><text class="cap" x="40" y="284" text-anchor="start">GPU utilisation is the figure most dashboards lead with, and a kernel is one program</text><text class="cap" x="40" y="304" text-anchor="start">launched on the GPU ({{fig:v03-o004}}). NVIDIA's definition tells you whether the chip is</text><text class="cap" x="40" y="324" text-anchor="start">busy, not whether it is getting anything done.</text><text class="cap" x="40" y="364" text-anchor="start">A decode step stalled on memory leaves the arithmetic units nearly idle, but it is still</text><text class="cap" x="40" y="384" text-anchor="start">a kernel executing, so utilisation reports 100%. The arithmetic for one token is 2 × 70</text><text class="cap" x="40" y="404" text-anchor="start">billion operations, 0.14 ms at the H100's peak, inside a step that takes 41.8 ms to read</text><text class="cap" x="40" y="424" text-anchor="start">the weights: one part in 295, the ridge of {{fig:v01-o126}}.</text></svg><figcaption>Worth knowing precisely, because it is the number most likely to be quoted as evidence that a cluster is working hard.</figcaption></figure>
