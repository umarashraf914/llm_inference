<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 26:44</div><h3>A reasoning model thinks in tokens before it answers</h3><svg viewBox='0 0 680 356' role='img'><title>A reasoning model thinks in tokens before it answers</title><text class="hd" x="40" y="46">One hard question, illustrative: 3,000 thinking tokens, then a 300-token answer</text><g class="h"><rect x="40" y="70" width="490.9090909090909" height="34" rx="3"/><text class="sub" x="285.45454545454544" y="87.0" text-anchor="middle" dominant-baseline="central">the chain of thought: never shown, still generated</text></g><g class="u"><rect x="530.9090909090909" y="70" width="49.09090909090909" height="34" rx="3"/></g><text class="sub2" x="590.0" y="92" text-anchor="start">answer</text><text class="sub2" x="40" y="124" text-anchor="start">3,000 decode steps, each a full read of the weights, before the first word of the answer</text><text class="sub2" x="40" y="142" text-anchor="start">drawn to scale in tokens</text><text class="cap" x="40" y="186" text-anchor="start">The workload itself is changing, and the change makes decode matter more. Reasoning</text><text class="cap" x="40" y="206" text-anchor="start">models think before they answer, producing a long internal chain of thought that is not</text><text class="cap" x="40" y="226" text-anchor="start">part of the answer: a few hundred tokens for an easy question and tens of thousands for</text><text class="cap" x="40" y="246" text-anchor="start">a hard one.</text><text class="cap" x="40" y="286" text-anchor="start">Every one of those thinking tokens is a decode step. Each is memory bound and takes a</text><text class="cap" x="40" y="306" text-anchor="start">full read of the weights, and all of it happens before the user has seen a single word</text><text class="cap" x="40" y="326" text-anchor="start">of the answer. The longer a model reasons, the more of the work in one answer is decode.</text></svg><figcaption>The hidden tokens are the expensive ones. Everything in this series that made decode cheaper now applies to most of what a reasoning model writes.</figcaption></figure>
