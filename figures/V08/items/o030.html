<figure><div class='ts'>Fig 30 &nbsp;&middot;&nbsp; 26:24</div><h3>Reasoning makes decode the whole job</h3><svg viewBox="0 0 680 528" role="img"><title>Reasoning makes decode the whole job</title><text class="hd" x="40" y="46">A reasoning model thinks before it answers</text><g class="h"><rect x="40" y="70" width="420" height="40" rx="4"></rect><text class="sub" x="250.0" y="90.0" text-anchor="middle" dominant-baseline="central">an internal chain of thought, not part of the answer</text></g><g class="s"><rect x="470" y="70" width="170" height="40" rx="4"></rect><text class="sub" x="555.0" y="90.0" text-anchor="middle" dominant-baseline="central">the answer</text></g><text class="cap" x="40" y="150" text-anchor="start">A few hundred tokens for an easy question, tens of thousands for a hard one. Every one of those</text><text class="cap" x="40" y="170" text-anchor="start">thinking tokens is a decode step: memory bound, a full read of the weights, and all of it before</text><text class="cap" x="40" y="190" text-anchor="start">the user has seen a single word.</text><text class="cap" x="40" y="230" text-anchor="start">The longer a model reasons, the more of the work in one answer is decode.</text><text class="hd" x="40" y="280">And the same shift shows up in training</text><text class="cap" x="40" y="326" text-anchor="start">Responses capped at 16,000</text><g class="h"><rect x="320" y="310" width="273" height="30" rx="3"></rect><text class="sub" x="456.5" y="325.0" text-anchor="middle" dominant-baseline="central">rollouts were 91% of a step</text></g><text class="cap" x="40" y="386" text-anchor="start">At 32,000</text><g class="h"><rect x="320" y="370" width="285" height="30" rx="3"></rect><text class="sub" x="462.5" y="385.0" text-anchor="middle" dominant-baseline="central">both pass 95%</text></g><text class="cap" x="40" y="446" text-anchor="start">The reinforcement learning that produces reasoning models is dominated by rollouts, where the</text><text class="cap" x="40" y="466" text-anchor="start">model generates its own attempts and they get scored. A rollout is just inference.</text><text class="cap" x="40" y="506" text-anchor="start">Training a reasoning model is now mostly an inference workload.</text></svg><figcaption>The last line is the one to sit with. The distinction between training infrastructure and serving infrastructure is collapsing.</figcaption></figure>
