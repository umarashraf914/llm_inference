a-c="0-6"><rect x="269.6" y="168" width="15" height="20" rx="2"/></g><g class="u" data-c="0-7"><rect x="289.2" y="168" width="15" height="20" rx="2"/></g><g class="u" data-c="0-8"><rect x="308.8" y="168" width="15" height="20" rx="2"/></g><g class="u" data-c="0-9"><rect x="328.4" y="168" width="15" height="20" rx="2"/></g><g class="u" data-c="0-10"><rect x="348.0" y="168" width="15" height="20" rx="2"/></g><g class="u" data-c="0-11"><rect x="367.6" y="168" width="15" height="20" rx="2"/></g><g class="s" data-c="0-12"><rect x="387.2" y="168" width="15" height="20" rx="2"/></g><g class="s" data-c="0-13"><rect x="406.8" y="168" width="15" height="20" rx="2"/></g><g class="s" data-c="0-14"><rect x="426.4" y="168" width="15" height="20" rx="2"/></g><g class="s" data-c="0-15"><rect x="446.0" y="168" width="15" height="20" rx="2"/></g><g class="s" data-c="0-16"><rect x="465.6" y="168" width="15" height="20" rx="2"/></g><g class="s" data-c="0-17"><rect x="485.2" y="168" width="15" height="20" rx="2"/></g><g class="s" data-c="0-18"><rect x="504.8" y="168" width="15" height="20" rx="2"/></g><g class="s" data-c="0-19"><rect x="524.4" y="168" width="15" height="20" rx="2"/></g><g class="s" data-c="0-20"><rect x="544.0" y="168" width="15" height="20" rx="2"/></g><g class="s" data-c="0-21"><rect x="563.6" y="168" width="15" height="20" rx="2"/></g><g class="s" data-c="0-22"><rect x="583.2" y="168" width="15" height="20" rx="2"/></g><g class="s" data-c="0-23"><rect x="602.8" y="168" width="15" height="20" rx="2"/></g><g class="s" data-c="0-24"><rect x="622.4" y="168" width="15" height="20" rx="2"/></g><text class="sub2" x="629.9000000000001" y="208" text-anchor="middle">newest</text><text class="sub2" x="394.70000000000005" y="226" text-anchor="middle" data-back="">12 back</text><text class="cap" x="40" y="260" text-anchor="start" data-sum="">From layer 3, the newest token has heard from inputs up to 12 positions back: 3 × a window of 4.</text><text class="cap" x="40" y="300" text-anchor="start">Each layer is computed from the layer below it ({{fig:v01-o096}}). With a window, the newest</text><text class="cap" x="40" y="320" text-anchor="start">token's vector at layer 1 mixes only the inputs within W positions. At layer 2 it mixes</text><text class="cap" x="40" y="340" text-anchor="start">layer-1 vectors that each mixed W inputs of their own, so its reach doubles; every layer</text><text class="cap" x="40" y="360" text-anchor="start">adds one more window.</text><text class="cap" x="40" y="400" text-anchor="start">Mistral 7B stacks 32 layers on a 4,096 window, so the newest token at the top can carry</text><text class="cap" x="40" y="420" text-anchor="start">information from 32 × 4,096 = 131,072 positions back, in theory. The widget's arithmetic</text><text class="cap" x="40" y="440" text-anchor="start">was checked against Python at every setting.</text></svg></div><figcaption>A local window is not a short memory: each layer passes along what the layers below have already gathered.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const NCOL = 25, NLAY = 4, W0 = 4, L0 = 3, X0 = 152, PITCH = 19.6, CW = 15;
  const [sw, sl] = [...fig.querySelectorAll('input[type=range]')];
  const val = [...fig.querySelectorAll('.val')], q = s => fig.querySelector(s);
  function draw() {
    const w = +sw.value, lay = +sl.value, newest = NCOL - 1;
    val[0].textContent = w; val[1].textContent = lay;
    for (let l = 0; l <= NLAY; l++) {
      for (let c = 0; c < NCOL; c++) {
        const on = l <= lay && c >= newest - (lay - l) * w;
        q(`[data-c="${l}-${c}"]`).setAttribute('class', on ? 's' : 'u');
      }
      q(`[data-row="${l}"]`).textContent = l === 0 ? 'input' : (l === lay ? `layer ${l}, traced` : `layer ${l}`);
    }
    const back = lay * w, left = newest - back;
    q('[data-back]').textContent = `${back} back`;
    q('[data-back]').setAttribute('x', (X0 + left * PITCH + CW / 2).toFixed(1));
    q('[data-sum]').textContent = `From layer ${lay}, the newest token has heard from inputs up to ${back} positions back: ${lay} × a window of ${w}.`;
  }
  [sw, sl].forEach(s => s.addEventListener('input', draw));
  q('button').addEventListener('click', () => { sw.value = W0; sl.value = L0; draw(); });
  draw();
})();</script></figure>
