<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 12:50</div><h3>Every decode step reads the cache as well as the weights</h3><svg viewBox='0 0 680 432' role='img'><title>Every decode step reads the cache as well as the weights</title><text class="hd" x="40" y="46">For every token so far, each layer keeps one key and one value</text><text class="cap" x="40" y="89" text-anchor="start">tokens</text><text class="cap" x="40" y="129" text-anchor="start">keys</text><text class="cap" x="40" y="165" text-anchor="start">values</text><g class="u"><rect x="150" y="70" width="84" height="28" rx="3"/><text class="sub" x="192.0" y="84.0" text-anchor="middle" dominant-baseline="central">The</text></g><g class="h"><rect x="150" y="110" width="84" height="26" rx="3"/><text class="sub" x="192.0" y="123.0" text-anchor="middle" dominant-baseline="central">k1</text></g><g class="h"><rect x="150" y="146" width="84" height="26" rx="3"/><text class="sub" x="192.0" y="159.0" text-anchor="middle" dominant-baseline="central">v1</text></g><g class="u"><rect x="246" y="70" width="84" height="28" rx="3"/><text class="sub" x="288.0" y="84.0" text-anchor="middle" dominant-baseline="central">cat</text></g><g class="h"><rect x="246" y="110" width="84" height="26" rx="3"/><text class="sub" x="288.0" y="123.0" text-anchor="middle" dominant-baseline="central">k2</text></g><g class="h"><rect x="246" y="146" width="84" height="26" rx="3"/><text class="sub" x="288.0" y="159.0" text-anchor="middle" dominant-baseline="central">v2</text></g><g class="u"><rect x="342" y="70" width="84" height="28" rx="3"/><text class="sub" x="384.0" y="84.0" text-anchor="middle" dominant-baseline="central">sat</text></g><g class="h"><rect x="342" y="110" width="84" height="26" rx="3"/><text class="sub" x="384.0" y="123.0" text-anchor="middle" dominant-baseline="central">k3</text></g><g class="h"><rect x="342" y="146" width="84" height="26" rx="3"/><text class="sub" x="384.0" y="159.0" text-anchor="middle" dominant-baseline="central">v3</text></g><g class="u"><rect x="438" y="70" width="84" height="28" rx="3"/><text class="sub" x="480.0" y="84.0" text-anchor="middle" dominant-baseline="central">on</text></g><g class="h"><rect x="438" y="110" width="84" height="26" rx="3"/><text class="sub" x="480.0" y="123.0" text-anchor="middle" dominant-baseline="central">k4</text></g><g class="h"><rect x="438" y="146" width="84" height="26" rx="3"/><text class="sub" x="480.0" y="159.0" text-anchor="middle" dominant-baseline="central">v4</text></g><g class="u"><rect x="534" y="70" width="84" height="28" rx="3"/><text class="sub" x="576.0" y="84.0" text-anchor="middle" dominant-baseline="central">the  (newest)</text></g><rect x="534" y="110" width="84" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="576.0" y="123.0" text-anchor="middle" dominant-baseline="central">k5, new</text><rect x="534" y="146" width="84" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="576.0" y="159.0" text-anchor="middle" dominant-baseline="central">v5, new</text><line class="tick" x1="150" y1="186" x2="618" y2="186"/><line class="tick" x1="150" y1="186" x2="150" y2="180"/><line class="tick" x1="618" y1="186" x2="618" y2="180"/><text class="sub2" x="384.0" y="204" text-anchor="middle">all read by the newest token's query, at this step and every later one</text><text class="sub2" x="384.0" y="222" text-anchor="middle">and the same again in each of the 80 layers</text><text class="cap" x="40" y="262" text-anchor="start">The model turns every token it reads into a key and a value, and every later token needs</text><text class="cap" x="40" y="282" text-anchor="start">those in order to attend to it ({{fig:v01-o092}}). Storing them saves the model from</text><text class="cap" x="40" y="302" text-anchor="start">processing the whole context again at every step: only the newest token goes through the</text><text class="cap" x="40" y="322" text-anchor="start">model, and it appends its own pair ({{fig:v01-o137}}).</text><text class="cap" x="40" y="362" text-anchor="start">So a decode step reads two things: every weight, and every key and value stored so far.</text><text class="cap" x="40" y="382" text-anchor="start">At short context the second is small. At long context it is the bigger problem, and the</text><text class="cap" x="40" y="402" text-anchor="start">next three figures put numbers on it.</text></svg><figcaption>A cache trades memory for time ({{ref:v01-o135}}). Memory is not the only price: everything it stores is read back on every step.</figcaption></figure>
