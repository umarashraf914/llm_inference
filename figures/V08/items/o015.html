<figure><div class='ts'>Fig 15 &nbsp;&middot;&nbsp; 12:42</div><h3>The cache overtakes the weights</h3><svg viewBox="0 0 680 536" role="img"><title>The cache overtakes the weights</title><text class="hd" x="40" y="46">Every decode step reads two things</text><text class="cap" x="40" y="92" text-anchor="start">The weights</text><g class="h"><rect x="240" y="76" width="340" height="32" rx="3"></rect><text class="sub" x="410.0" y="92.0" text-anchor="middle" dominant-baseline="central">140 GB, fixed</text></g><text class="cap" x="40" y="152" text-anchor="start">The KV cache</text><g class="s"><rect x="240" y="136" width="100" height="32" rx="3"></rect></g><text class="sub2" x="356" y="155" text-anchor="start">and growing</text><text class="cap" x="40" y="214" text-anchor="start">The model turns every token it reads into a key and a value, and every later token needs those</text><text class="cap" x="40" y="234" text-anchor="start">in order to attend to it. Storing them saves reprocessing the whole context at every step.</text><text class="cap" x="40" y="274" text-anchor="start">At long context that cache is a bigger problem than the weights.</text><text class="cap" x="40" y="314" text-anchor="start">70B model</text><g class="u"><rect x="240" y="298" width="60" height="30" rx="3"></rect><text class="sub" x="270.0" y="313.0" text-anchor="middle" dominant-baseline="central">320 KB</text></g><text class="sub2" x="316" y="317" text-anchor="start">per token of context</text><text class="cap" x="40" y="374" text-anchor="start">One request at 128k</text><g class="h"><rect x="240" y="358" width="100" height="30" rx="3"></rect><text class="sub" x="290.0" y="373.0" text-anchor="middle" dominant-baseline="central">42 GB</text></g><text class="cap" x="40" y="434" text-anchor="start">Four such requests</text><g class="h"><rect x="240" y="418" width="400" height="30" rx="3"></rect><text class="sub" x="440.0" y="433.0" text-anchor="middle" dominant-baseline="central">168 GB, more than the weights</text></g><text class="cap" x="40" y="494" text-anchor="start">And the cache does not just sit there. The GPU reads the whole of it back out of memory on every</text><text class="cap" x="40" y="514" text-anchor="start">decode step, so those bytes compete with the weights for the same bandwidth.</text></svg><figcaption>FlashAttention cut what attention has to move, and did it without changing a single output. It never touched the size of the cache, which still grows with every token that arrives.</figcaption></figure>
