<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 15:48</div><h3>A rolling buffer: token i goes to slot i mod W, and the cache stops growing</h3><svg viewBox='0 0 680 720' role='img'><title>A rolling buffer: token i goes to slot i mod W, and the cache stops growing</title><text class="hd" x="40" y="46">The cache as W slots, drawn with W = 4: token i is stored in slot i mod 4</text><text class="cap" x="40" y="89" text-anchor="start">token</text><text class="cap" x="40" y="125" text-anchor="start">slot</text><rect x="120" y="72" width="31" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="135.5" y="85.0" text-anchor="middle" dominant-baseline="central">0</text><text class="sub2" x="135.5" y="125" text-anchor="middle">0</text><rect x="156" y="72" width="31" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="171.5" y="85.0" text-anchor="middle" dominant-baseline="central">1</text><text class="sub2" x="171.5" y="125" text-anchor="middle">1</text><rect x="192" y="72" width="31" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="207.5" y="85.0" text-anchor="middle" dominant-baseline="central">2</text><text class="sub2" x="207.5" y="125" text-anchor="middle">2</text><rect x="228" y="72" width="31" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="243.5" y="85.0" text-anchor="middle" dominant-baseline="central">3</text><text class="sub2" x="243.5" y="125" text-anchor="middle">3</text><rect x="264" y="72" width="31" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="279.5" y="85.0" text-anchor="middle" dominant-baseline="central">4</text><text class="sub2" x="279.5" y="125" text-anchor="middle">0</text><rect x="300" y="72" width="31" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="315.5" y="85.0" text-anchor="middle" dominant-baseline="central">5</text><text class="sub2" x="315.5" y="125" text-anchor="middle">1</text><rect x="336" y="72" width="31" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="351.5" y="85.0" text-anchor="middle" dominant-baseline="central">6</text><text class="sub2" x="351.5" y="125" text-anchor="middle">2</text><rect x="372" y="72" width="31" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="387.5" y="85.0" text-anchor="middle" dominant-baseline="central">7</text><text class="sub2" x="387.5" y="125" text-anchor="middle">3</text><rect x="408" y="72" width="31" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="423.5" y="85.0" text-anchor="middle" dominant-baseline="central">8</text><text class="sub2" x="423.5" y="125" text-anchor="middle">0</text><g class="s"><rect x="444" y="72" width="31" height="26" rx="3"/><text class="sub" x="459.5" y="85.0" text-anchor="middle" dominant-baseline="central">9</text></g><text class="sub2" x="459.5" y="125" text-anchor="middle">1</text><g class="s"><rect x="480" y="72" width="31" height="26" rx="3"/><text class="sub" x="495.5" y="85.0" text-anchor="middle" dominant-baseline="central">10</text></g><text class="sub2" x="495.5" y="125" text-anchor="middle">2</text><g class="s"><rect x="516" y="72" width="31" height="26" rx="3"/><text class="sub" x="531.5" y="85.0" text-anchor="middle" dominant-baseline="central">11</text></g><text class="sub2" x="531.5" y="125" text-anchor="middle">3</text><g class="s"><rect x="552" y="72" width="31" height="26" rx="3"/><text class="sub" x="567.5" y="85.0" text-anchor="middle" dominant-baseline="central">12</text></g><text class="sub2" x="567.5" y="125" text-anchor="middle">0</text><g class="u"><rect x="588" y="72" width="31" height="26" rx="3"/><text class="sub" x="603.5" y="85.0" text-anchor="middle" dominant-baseline="central">13</text></g><text class="sub2" x="603.5" y="125" text-anchor="middle">1</text><text class="sub2" x="279.5" y="156" text-anchor="middle">tokens 0 to 8: overwritten, gone</text><text class="sub2" x="531.5" y="156" text-anchor="middle">9 to 12 held, 13 arriving</text><text class="hd" x="40" y="196">The buffer when token 13 arrives</text><g class="s"><rect x="120" y="212" width="118" height="30" rx="3"/><text class="sub" x="179.0" y="227.0" text-anchor="middle" dominant-baseline="central">slot 0: token 12</text></g><g class="h"><rect x="248" y="212" width="118" height="30" rx="3"/><text class="sub" x="307.0" y="227.0" text-anchor="middle" dominant-baseline="central">slot 1: token 9</text></g><g class="s"><rect x="376" y="212" width="118" height="30" rx="3"/><text class="sub" x="435.0" y="227.0" text-anchor="middle" dominant-baseline="central">slot 2: token 10</text></g><g class="s"><rect x="504" y="212" width="118" height="30" rx="3"/><text class="sub" x="563.0" y="227.0" text-anchor="middle" dominant-baseline="central">slot 3: token 11</text></g><text class="sub2" x="307.0" y="262" text-anchor="middle">13 mod 4 = 1: token 13 overwrites token 9 here</text><text class="hd" x="40" y="306">Mistral 7B, one sequence, drawn to scale</text><text class="cap" x="40" y="340" text-anchor="start">rolling buffer, any length</text><g class="s"><rect x="230" y="322" width="11.25" height="26" rx="3"/></g><text class="sub2" x="251.25" y="340" text-anchor="start">0.54 GB (512 MiB)</text><text class="cap" x="40" y="380" text-anchor="start">full cache at 32k tokens</text><g class="h"><rect x="230" y="362" width="90.0" height="26" rx="3"/></g><text class="sub2" x="330.0" y="380" text-anchor="start">4.29 GB</text><text class="cap" x="40" y="420" text-anchor="start">full cache at 128k tokens</text><g class="h"><rect x="230" y="402" width="360.0" height="26" rx="3"/></g><text class="sub2" x="600.0" y="420" text-anchor="start">17.2 GB</text><text class="cap" x="40" y="470" text-anchor="start">Once the window has moved past a token, nothing will ever attend to it again, so its key</text><text class="cap" x="40" y="490" text-anchor="start">and value can be thrown away. The cache becomes W slots, and token i is stored in slot i</text><text class="cap" x="40" y="510" text-anchor="start">mod W, the remainder when i is divided by W. Here 13 = 3 × 4 + 1, so token 13 goes to</text><text class="cap" x="40" y="530" text-anchor="start">slot 1.</text><text class="cap" x="40" y="570" text-anchor="start">At step 13 the slots hold tokens 9 to 12. Token 13 attends to them and to itself, then</text><text class="cap" x="40" y="590" text-anchor="start">overwrites slot 1, where token 9 was: the entry W positions behind it, which no later</text><text class="cap" x="40" y="610" text-anchor="start">token can see. Each new token does the same, and the cache stops growing.</text><text class="cap" x="40" y="650" text-anchor="start">In Mistral 7B one token's keys and values take 2 × 32 layers × 8 KV heads × 128 × 2</text><text class="cap" x="40" y="670" text-anchor="start">bytes = 131,072 bytes, so 4,096 slots hold 0.54 GB. A full cache would be 8 times that</text><text class="cap" x="40" y="690" text-anchor="start">at 32k tokens, the saving Mistral's paper reports, and 32 times at 128k.</text></svg><figcaption>The one method in this part that deletes anything. It can, because the window guarantees nothing will ask for those tokens again.</figcaption></figure>
