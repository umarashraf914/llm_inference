<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:02</div><h3>The chance of keeping a guess is p over q, capped at one</h3><svg viewBox='0 0 680 508' role='img'><title>The chance of keeping a guess is p over q, capped at one</title><text class="hd" x="40" y="46">Fig 05's target against a drafter that overrates ‘dog’</text><text class="sub2" x="40" y="78" text-anchor="start">token</text><text class="sub2" x="110" y="78" text-anchor="start">p</text><text class="sub2" x="160" y="78" text-anchor="start">q</text><text class="sub2" x="230" y="78" text-anchor="start">p ÷ q, to scale; amber is the chance of keeping</text><text class="cap" x="40" y="109" text-anchor="start">cat</text><text class="sub2" x="110" y="109" text-anchor="start">0.5</text><text class="sub2" x="160" y="109" text-anchor="start">0.2</text><g class="m"><rect x="230" y="90" width="150" height="28" rx="3"/><text class="sub" x="305.0" y="104.0" text-anchor="middle" dominant-baseline="central">kept 1</text></g><rect x="380" y="90" width="225.0" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="492.5" y="104.0" text-anchor="middle" dominant-baseline="central">2.5, capped at 1</text><text class="cap" x="40" y="151" text-anchor="start">dog</text><text class="sub2" x="110" y="151" text-anchor="start">0.3</text><text class="sub2" x="160" y="151" text-anchor="start">0.6</text><g class="m"><rect x="230" y="132" width="75.0" height="28" rx="3"/><text class="sub" x="267.5" y="146.0" text-anchor="middle" dominant-baseline="central">kept 0.5</text></g><text class="cap" x="40" y="193" text-anchor="start">rest</text><text class="sub2" x="110" y="193" text-anchor="start">0.2</text><text class="sub2" x="160" y="193" text-anchor="start">0.2</text><g class="m"><rect x="230" y="174" width="150" height="28" rx="3"/><text class="sub" x="305.0" y="188.0" text-anchor="middle" dominant-baseline="central">kept 1</text></g><line class="axis" x1="230" y1="220" x2="605.0" y2="220"/><line class="tick" x1="230" y1="220" x2="230" y2="225"/><text class="sub2" x="230" y="239" text-anchor="middle">0</text><line class="tick" x1="380" y1="220" x2="380" y2="225"/><text class="sub2" x="380" y="239" text-anchor="middle">1</text><line class="tick" x1="530" y1="220" x2="530" y2="225"/><text class="sub2" x="530" y="239" text-anchor="middle">2</text><text class="sub2" x="230" y="272" text-anchor="start">kept with probability  min(1, p ÷ q)</text><text class="cap" x="40" y="318" text-anchor="start">Divide the target's probability by the drafter's. For dog that is 0.3 ÷ 0.6 = 0.5: the</text><text class="cap" x="40" y="338" text-anchor="start">drafter said 60%, the target 30%, so a proposed ‘dog’ is kept half the time.</text><text class="cap" x="40" y="378" text-anchor="start">For cat the ratio is 2.5: the target likes cat more than the drafter did. A chance</text><text class="cap" x="40" y="398" text-anchor="start">cannot exceed 1, so the ratio is capped there and cat is always kept. Rest has the same</text><text class="cap" x="40" y="418" text-anchor="start">probability in both, a ratio of exactly 1, and is always kept too.</text><text class="cap" x="40" y="458" text-anchor="start">As one formula: kept with probability min(1, p ÷ q), where min means the smaller of the</text><text class="cap" x="40" y="478" text-anchor="start">two.</text></svg><figcaption>One division and one cap. Only dog, the token the drafter overrates, is ever rejected; the next figures show why always keeping the underrated ones is not a bias.</figcaption></figure>
