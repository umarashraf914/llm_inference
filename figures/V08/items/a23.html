<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:38</div><h3>Flattened into one sequence, the tree needs a mask that shows each token only its ancestors</h3><svg viewBox='0 0 680 508' role='img'><title>Flattened into one sequence, the tree needs a mask that shows each token only its ancestors</title><text class="hd" x="40" y="46">Row: the token doing the looking. Column: the token it may see.</text><text class="sub2" x="110" y="78" text-anchor="start">ordinary causal mask</text><text class="sub2" x="124.0" y="100" text-anchor="middle">the</text><text class="sub2" x="152.0" y="100" text-anchor="middle">cat</text><text class="sub2" x="180.0" y="100" text-anchor="middle">dog</text><text class="sub2" x="208.0" y="100" text-anchor="middle">sat</text><text class="sub2" x="236.0" y="100" text-anchor="middle">ran</text><text class="sub2" x="102" y="126.0" text-anchor="end">the</text><g class="s"><rect x="111" y="109" width="26" height="26" rx="2"/></g><g class="u"><rect x="139" y="109" width="26" height="26" rx="2"/></g><g class="u"><rect x="167" y="109" width="26" height="26" rx="2"/></g><g class="u"><rect x="195" y="109" width="26" height="26" rx="2"/></g><g class="u"><rect x="223" y="109" width="26" height="26" rx="2"/></g><text class="sub2" x="102" y="154.0" text-anchor="end">cat</text><g class="s"><rect x="111" y="137" width="26" height="26" rx="2"/></g><g class="s"><rect x="139" y="137" width="26" height="26" rx="2"/></g><g class="u"><rect x="167" y="137" width="26" height="26" rx="2"/></g><g class="u"><rect x="195" y="137" width="26" height="26" rx="2"/></g><g class="u"><rect x="223" y="137" width="26" height="26" rx="2"/></g><text class="sub2" x="102" y="182.0" text-anchor="end">dog</text><g class="s"><rect x="111" y="165" width="26" height="26" rx="2"/></g><g class="h"><rect x="139" y="165" width="26" height="26" rx="2"/></g><g class="s"><rect x="167" y="165" width="26" height="26" rx="2"/></g><g class="u"><rect x="195" y="165" width="26" height="26" rx="2"/></g><g class="u"><rect x="223" y="165" width="26" height="26" rx="2"/></g><text class="sub2" x="102" y="210.0" text-anchor="end">sat</text><g class="s"><rect x="111" y="193" width="26" height="26" rx="2"/></g><g class="s"><rect x="139" y="193" width="26" height="26" rx="2"/></g><g class="h"><rect x="167" y="193" width="26" height="26" rx="2"/></g><g class="s"><rect x="195" y="193" width="26" height="26" rx="2"/></g><g class="u"><rect x="223" y="193" width="26" height="26" rx="2"/></g><text class="sub2" x="102" y="238.0" text-anchor="end">ran</text><g class="s"><rect x="111" y="221" width="26" height="26" rx="2"/></g><g class="h"><rect x="139" y="221" width="26" height="26" rx="2"/></g><g class="s"><rect x="167" y="221" width="26" height="26" rx="2"/></g><g class="h"><rect x="195" y="221" width="26" height="26" rx="2"/></g><g class="s"><rect x="223" y="221" width="26" height="26" rx="2"/></g><text class="sub2" x="420" y="78" text-anchor="start">tree mask</text><text class="sub2" x="434.0" y="100" text-anchor="middle">the</text><text class="sub2" x="462.0" y="100" text-anchor="middle">cat</text><text class="sub2" x="490.0" y="100" text-anchor="middle">dog</text><text class="sub2" x="518.0" y="100" text-anchor="middle">sat</text><text class="sub2" x="546.0" y="100" text-anchor="middle">ran</text><text class="sub2" x="412" y="126.0" text-anchor="end">the</text><g class="s"><rect x="421" y="109" width="26" height="26" rx="2"/></g><g class="u"><rect x="449" y="109" width="26" height="26" rx="2"/></g><g class="u"><rect x="477" y="109" width="26" height="26" rx="2"/></g><g class="u"><rect x="505" y="109" width="26" height="26" rx="2"/></g><g class="u"><rect x="533" y="109" width="26" height="26" rx="2"/></g><text class="sub2" x="412" y="154.0" text-anchor="end">cat</text><g class="s"><rect x="421" y="137" width="26" height="26" rx="2"/></g><g class="s"><rect x="449" y="137" width="26" height="26" rx="2"/></g><g class="u"><rect x="477" y="137" width="26" height="26" rx="2"/></g><g class="u"><rect x="505" y="137" width="26" height="26" rx="2"/></g><g class="u"><rect x="533" y="137" width="26" height="26" rx="2"/></g><text class="sub2" x="412" y="182.0" text-anchor="end">dog</text><g class="s"><rect x="421" y="165" width="26" height="26" rx="2"/></g><g class="u"><rect x="449" y="165" width="26" height="26" rx="2"/></g><g class="s"><rect x="477" y="165" width="26" height="26" rx="2"/></g><g class="u"><rect x="505" y="165" width="26" height="26" rx="2"/></g><g class="u"><rect x="533" y="165" width="26" height="26" rx="2"/></g><text class="sub2" x="412" y="210.0" text-anchor="end">sat</text><g class="s"><rect x="421" y="193" width="26" height="26" rx="2"/></g><g class="s"><rect x="449" y="193" width="26" height="26" rx="2"/></g><g class="u"><rect x="477" y="193" width="26" height="26" rx="2"/></g><g class="s"><rect x="505" y="193" width="26" height="26" rx="2"/></g><g class="u"><rect x="533" y="193" width="26" height="26" rx="2"/></g><text class="sub2" x="412" y="238.0" text-anchor="end">ran</text><g class="s"><rect x="421" y="221" width="26" height="26" rx="2"/></g><g class="u"><rect x="449" y="221" width="26" height="26" rx="2"/></g><g class="s"><rect x="477" y="221" width="26" height="26" rx="2"/></g><g class="u"><rect x="505" y="221" width="26" height="26" rx="2"/></g><g class="s"><rect x="533" y="221" width="26" height="26" rx="2"/></g><text class="sub2" x="110" y="274" text-anchor="start">red: allowed by order, but on another branch</text><text class="sub2" x="420" y="274" text-anchor="start">each token sees only its own path</text><text class="cap" x="40" y="318" text-anchor="start">To check the tree in one pass, its five tokens are laid out in a row and fed in</text><text class="cap" x="40" y="338" text-anchor="start">together. With the ordinary causal mask ({{fig:v08-o003}}) each token would see every</text><text class="cap" x="40" y="358" text-anchor="start">token to its left: dog would see cat, and ran would see cat and sat, as if the text read</text><text class="cap" x="40" y="378" text-anchor="start">‘the cat dog’.</text><text class="cap" x="40" y="418" text-anchor="start">The tree mask lets each token see only the tokens on its own path: dog sees ‘the’ and</text><text class="cap" x="40" y="438" text-anchor="start">itself, ran sees ‘the’ and ‘dog’. Each token is also given the position it has in its</text><text class="cap" x="40" y="458" text-anchor="start">own path ({{fig:v01-o090}} shows why a model needs positions), so cat and dog both sit</text><text class="cap" x="40" y="478" text-anchor="start">at position 2, and every path gets exactly the predictions it would get alone.</text></svg><figcaption>Same pass, same weights read once; the mask makes five tokens behave like two separate sentences that share a first word.</figcaption></figure>
