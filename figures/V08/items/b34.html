<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 27:36</div><h3>Generating the attempts takes 84 to 91% of an RL step</h3><svg viewBox='0 0 680 392' role='img'><title>Generating the attempts takes 84 to 91% of an RL step</title><text class="hd" x="40" y="46">RhymeRL's profile: 32B models, responses capped at 16,000 tokens, drawn to scale</text><text class="cap" x="40" y="89" text-anchor="start">math model, 16k</text><g class="h"><rect x="190" y="70" width="327.6" height="28" rx="2"/><text class="sub" x="353.8" y="84.0" text-anchor="middle" dominant-baseline="central">rollout 91%</text></g><g class="u"><rect x="517.6" y="70" width="7.2" height="28" rx="2"/></g><g class="u"><rect x="524.8000000000001" y="70" width="25.200000000000003" height="28" rx="2"/></g><text class="sub2" x="558" y="89" text-anchor="start">reward 2, train 7</text><text class="cap" x="40" y="135" text-anchor="start">code model, 16k</text><g class="h"><rect x="190" y="116" width="302.4" height="28" rx="2"/><text class="sub" x="341.2" y="130.0" text-anchor="middle" dominant-baseline="central">rollout 84%</text></g><g class="u"><rect x="492.4" y="116" width="25.200000000000003" height="28" rx="2"/></g><g class="u"><rect x="517.6" y="116" width="32.4" height="28" rx="2"/></g><text class="sub2" x="558" y="135" text-anchor="start">reward 7, train 9</text><text class="cap" x="40" y="181" text-anchor="start">both, at 32k</text><g class="h"><rect x="190" y="162" width="342.0" height="28" rx="2"/><text class="sub" x="361.0" y="176.0" text-anchor="middle" dominant-baseline="central">rollout over 95%</text></g><rect x="532.0" y="162" width="18.0" height="28" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="558" y="181" text-anchor="start">the rest under 5</text><text class="cap" x="40" y="242" text-anchor="start">The RhymeRL team profiled this with responses capped at 16,000 tokens. Rollouts took 91%</text><text class="cap" x="40" y="262" text-anchor="start">of an entire reinforcement-learning step for a math model; for a code model, 84%. At</text><text class="cap" x="40" y="282" text-anchor="start">32,000 tokens, both passed 95%.</text><text class="cap" x="40" y="322" text-anchor="start">Their explanation is the one this series started with: generating each token requires a</text><text class="cap" x="40" y="342" text-anchor="start">forward pass, and that pass is constrained by memory bandwidth. Training a reasoning</text><text class="cap" x="40" y="362" text-anchor="start">model is now mostly an inference workload.</text></svg><figcaption>The line between training infrastructure and serving infrastructure is collapsing: what makes serving fast now makes this training fast too.</figcaption></figure>
