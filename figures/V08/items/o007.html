<figure><div class='ts'>Fig 07 &nbsp;&middot;&nbsp; 4:33</div><h3>The distribution is preserved exactly</h3><svg viewBox="0 0 680 504" role="img"><title>The distribution is preserved exactly</title><text class="hd" x="40" y="46">Why the two pieces add back up to the target</text><g class="s"><rect x="40" y="70" width="285" height="44" rx="4"></rect><text class="sub" x="182.5" y="92.0" text-anchor="middle" dominant-baseline="central">accepting</text></g><text class="sub2" x="40" y="138" text-anchor="start">covers the probability the two models already agreed on</text><g class="m"><rect x="368" y="70" width="272" height="44" rx="4"></rect><text class="sub" x="504.0" y="92.0" text-anchor="middle" dominant-baseline="central">the replacement</text></g><text class="sub2" x="368" y="138" text-anchor="start">covers exactly what the drafter was short</text><g class="s"><rect x="140" y="178" width="400" height="42" rx="6"></rect><text class="sub" x="340.0" y="199.0" text-anchor="middle" dominant-baseline="central">put them together and the target's distribution is back</text></g><text class="cap" x="40" y="262" text-anchor="start">Tokens produced this way have exactly the same distribution as tokens sampled from the target</text><text class="cap" x="40" y="282" text-anchor="start">alone. And nothing in that argument depends on the drafter being good.</text><text class="cap" x="40" y="322" text-anchor="start">A bad drafter simply gets rejected more often, which makes it slower and cannot make the output</text><text class="cap" x="40" y="342" text-anchor="start">wrong.</text><text class="cap" x="40" y="382" text-anchor="start">The 2022 paper measured two to three times on T5-XXL with identical outputs. A second paper</text><text class="cap" x="40" y="402" text-anchor="start">derived the same rule independently and reported two to two and a half times on a 70-billion</text><text class="cap" x="40" y="422" text-anchor="start">model, with the target's distribution holding to within hardware numerics.</text><text class="cap" x="40" y="462" text-anchor="start">Later methods loosen this rule to get more guesses accepted, and they give up the guarantee when</text><text class="cap" x="40" y="482" text-anchor="start">they do.</text></svg><figcaption>The strongest property in the whole series: a speed-up that is provably free of quality cost. Keep track of which later methods still have it.</figcaption></figure>
