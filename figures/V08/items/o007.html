<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:25</div><h3>Measured: two to three times faster, with the output unchanged</h3><svg viewBox='0 0 680 484' role='img'><title>Measured: two to three times faster, with the output unchanged</title><text class="hd" x="40" y="46">Speed-ups the two original papers measured, drawn to scale</text><text class="cap" x="40" y="89" text-anchor="start">2022 paper, T5-XXL (11B)</text><g class="u"><rect x="230" y="70" width="120" height="28" rx="3"/></g><g class="m"><rect x="350" y="70" width="120" height="28" rx="3"/><text class="sub" x="410.0" y="84.0" text-anchor="middle" dominant-baseline="central">2–3×</text></g><text class="sub2" x="480" y="89" text-anchor="start">identical outputs</text><text class="cap" x="40" y="135" text-anchor="start">DeepMind, Chinchilla (70B)</text><g class="u"><rect x="230" y="116" width="120" height="28" rx="3"/></g><g class="m"><rect x="350" y="116" width="60.0" height="28" rx="3"/><text class="sub" x="380.0" y="130.0" text-anchor="middle" dominant-baseline="central">2–2.5×</text></g><text class="sub2" x="420.0" y="135" text-anchor="start">same distribution</text><line class="axis" x1="230" y1="162" x2="590" y2="162"/><line class="tick" x1="230" y1="162" x2="230" y2="167"/><text class="sub2" x="230" y="181" text-anchor="middle">1×</text><line class="tick" x1="350" y1="162" x2="350" y2="167"/><text class="sub2" x="350" y="181" text-anchor="middle">2×</text><line class="tick" x1="470" y1="162" x2="470" y2="167"/><text class="sub2" x="470" y="181" text-anchor="middle">3×</text><line class="tick" x1="590" y1="162" x2="590" y2="167"/><text class="sub2" x="590" y="181" text-anchor="middle">4×</text><text class="sub2" x="230" y="206" text-anchor="start">each bar starts at 1×, no speed-up; amber spans the reported range</text><text class="cap" x="40" y="254" text-anchor="start">The 2022 paper measured two to three times faster decoding on T5-XXL, an 11-billion-</text><text class="cap" x="40" y="274" text-anchor="start">parameter model, with outputs identical to the target's own. A second paper, from</text><text class="cap" x="40" y="294" text-anchor="start">DeepMind, derived the same rule independently and reported two to two and a half times</text><text class="cap" x="40" y="314" text-anchor="start">on Chinchilla, a 70-billion-parameter model.</text><text class="cap" x="40" y="354" text-anchor="start">DeepMind checked the distribution, and it held to within hardware numerics: the only</text><text class="cap" x="40" y="374" text-anchor="start">differences were the tiny rounding differences that come from doing the same arithmetic</text><text class="cap" x="40" y="394" text-anchor="start">in a different order.</text><text class="cap" x="40" y="434" text-anchor="start">Later methods loosen this rule to get more guesses accepted, and they give up the</text><text class="cap" x="40" y="454" text-anchor="start">guarantee when they do.</text></svg><figcaption>The strongest property in the whole series: a speed-up that is provably free of quality cost. Keep track of which later methods still have it.</figcaption></figure>
