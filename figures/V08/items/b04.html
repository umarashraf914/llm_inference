<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 14:04</div><h3>Ring attention keeps every token by passing the cache around</h3><svg viewBox='0 0 680 486' role='img'><title>Ring attention keeps every token by passing the cache around</title><text class="hd" x="40" y="46">Four GPUs share one 131,072-token request: a quarter of the cache each</text><text class="sub2" x="255.0" y="82" text-anchor="middle">step 1</text><text class="sub2" x="367.0" y="82" text-anchor="middle">step 2</text><text class="sub2" x="479.0" y="82" text-anchor="middle">step 3</text><text class="sub2" x="591.0" y="82" text-anchor="middle">step 4</text><text class="cap" x="40" y="110" text-anchor="start">GPU 1, queries A</text><g class="u"><rect x="214" y="92" width="82" height="26" rx="3"/><text class="sub" x="255.0" y="105.0" text-anchor="middle" dominant-baseline="central">keys A</text></g><line class="conn" x1="300" y1="105" x2="322" y2="105" marker-end="url(#arw)"/><g class="u"><rect x="326" y="92" width="82" height="26" rx="3"/><text class="sub" x="367.0" y="105.0" text-anchor="middle" dominant-baseline="central">keys D</text></g><line class="conn" x1="412" y1="105" x2="434" y2="105" marker-end="url(#arw)"/><g class="u"><rect x="438" y="92" width="82" height="26" rx="3"/><text class="sub" x="479.0" y="105.0" text-anchor="middle" dominant-baseline="central">keys C</text></g><line class="conn" x1="524" y1="105" x2="546" y2="105" marker-end="url(#arw)"/><g class="u"><rect x="550" y="92" width="82" height="26" rx="3"/><text class="sub" x="591.0" y="105.0" text-anchor="middle" dominant-baseline="central">keys B</text></g><text class="cap" x="40" y="146" text-anchor="start">GPU 2, queries B</text><g class="u"><rect x="214" y="128" width="82" height="26" rx="3"/><text class="sub" x="255.0" y="141.0" text-anchor="middle" dominant-baseline="central">keys B</text></g><line class="conn" x1="300" y1="141" x2="322" y2="141" marker-end="url(#arw)"/><g class="u"><rect x="326" y="128" width="82" height="26" rx="3"/><text class="sub" x="367.0" y="141.0" text-anchor="middle" dominant-baseline="central">keys A</text></g><line class="conn" x1="412" y1="141" x2="434" y2="141" marker-end="url(#arw)"/><g class="u"><rect x="438" y="128" width="82" height="26" rx="3"/><text class="sub" x="479.0" y="141.0" text-anchor="middle" dominant-baseline="central">keys D</text></g><line class="conn" x1="524" y1="141" x2="546" y2="141" marker-end="url(#arw)"/><g class="u"><rect x="550" y="128" width="82" height="26" rx="3"/><text class="sub" x="591.0" y="141.0" text-anchor="middle" dominant-baseline="central">keys C</text></g><text class="cap" x="40" y="182" text-anchor="start">GPU 3, queries C</text><g class="u"><rect x="214" y="164" width="82" height="26" rx="3"/><text class="sub" x="255.0" y="177.0" text-anchor="middle" dominant-baseline="central">keys C</text></g><line class="conn" x1="300" y1="177" x2="322" y2="177" marker-end="url(#arw)"/><g class="u"><rect x="326" y="164" width="82" height="26" rx="3"/><text class="sub" x="367.0" y="177.0" text-anchor="middle" dominant-baseline="central">keys B</text></g><line class="conn" x1="412" y1="177" x2="434" y2="177" marker-end="url(#arw)"/><g class="u"><rect x="438" y="164" width="82" height="26" rx="3"/><text class="sub" x="479.0" y="177.0" text-anchor="middle" dominant-baseline="central">keys A</text></g><line class="conn" x1="524" y1="177" x2="546" y2="177" marker-end="url(#arw)"/><g class="u"><rect x="550" y="164" width="82" height="26" rx="3"/><text class="sub" x="591.0" y="177.0" text-anchor="middle" dominant-baseline="central">keys D</text></g><text class="cap" x="40" y="218" text-anchor="start">GPU 4, queries D</text><g class="u"><rect x="214" y="200" width="82" height="26" rx="3"/><text class="sub" x="255.0" y="213.0" text-anchor="middle" dominant-baseline="central">keys D</text></g><line class="conn" x1="300" y1="213" x2="322" y2="213" marker-end="url(#arw)"/><g class="u"><rect x="326" y="200" width="82" height="26" rx="3"/><text class="sub" x="367.0" y="213.0" text-anchor="middle" dominant-baseline="central">keys C</text></g><line class="conn" x1="412" y1="213" x2="434" y2="213" marker-end="url(#arw)"/><g class="u"><rect x="438" y="200" width="82" height="26" rx="3"/><text class="sub" x="479.0" y="213.0" text-anchor="middle" dominant-baseline="central">keys B</text></g><line class="conn" x1="524" y1="213" x2="546" y2="213" marker-end="url(#arw)"/><g class="u"><rect x="550" y="200" width="82" height="26" rx="3"/><text class="sub" x="591.0" y="213.0" text-anchor="middle" dominant-baseline="central">keys A</text></g><text class="sub2" x="214" y="256" text-anchor="start">each step: attend to the block held, pass it on, receive the next</text><text class="cap" x="40" y="296" text-anchor="start">Ring attention keeps every token and spreads the cache across devices, which episode 5</text><text class="cap" x="40" y="316" text-anchor="start">built ({{fig:v05-o020}}). Each GPU holds a slice of the sequence: its own queries, and</text><text class="cap" x="40" y="336" text-anchor="start">the keys and values for 32,768 tokens, 10.7 GB instead of 42.9 GB on one chip. After</text><text class="cap" x="40" y="356" text-anchor="start">three passes round the ring, every query has met every block, and the result is exact.</text><text class="cap" x="40" y="396" text-anchor="start">What it needs is an interconnect fast enough to hide the passing behind the arithmetic.</text><text class="cap" x="40" y="416" text-anchor="start">Per layer, one block is 134 MB, about 0.15 ms over NVLink at 900 GB/s</text><text class="cap" x="40" y="436" text-anchor="start">({{fig:v02-o095}}). Attending 32,768 queries to it is about 36 ms of arithmetic at the</text><text class="cap" x="40" y="456" text-anchor="start">H100's peak, so the next block arrives long before it is needed.</text></svg><figcaption>The one long-context method that gives nothing up: no token is dropped and no answer changes. Its price is hardware, several GPUs and a fast link between them.</figcaption></figure>
