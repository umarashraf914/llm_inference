<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:36</div><h3>Jacobi iteration: guess every position, then refine them all at once</h3><div class='wg'><div class='ctl'><label class='opt'><input type='radio' name='v08-a31-mode' value='alone' checked> Jacobi alone</label><label class='opt'><input type='radio' name='v08-a31-mode' value='pool'> with the pool</label><label>rounds shown <input type='range' min='0' max='6' step='1' value='6'><span class='val'>6</span></label></div><div class='ctl'><button type='button'>New starting guess</button><button type='button'>Reset</button></div><svg viewBox='0 0 680 600' role='img'><title>Jacobi iteration: guess every position, then refine them all at once</title><text class="hd" x="40" y="34">Six positions refined together: one row per round, one pass per row</text><text class="sub2" x="130.0" y="64" text-anchor="middle">position 1</text><text class="sub2" x="198.0" y="64" text-anchor="middle">position 2</text><text class="sub2" x="266.0" y="64" text-anchor="middle">position 3</text><text class="sub2" x="334.0" y="64" text-anchor="middle">position 4</text><text class="sub2" x="402.0" y="64" text-anchor="middle">position 5</text><text class="sub2" x="470.0" y="64" text-anchor="middle">position 6</text><text class="cap" x="40" y="91" text-anchor="start">start</text><g class="u" visibility="visible"><rect x="100" y="74" width="60" height="24" rx="3"/><text class="sub" x="130.0" y="86.0" text-anchor="middle" dominant-baseline="central" data-w="0-0">a</text></g><g class="u" visibility="visible"><rect x="168" y="74" width="60" height="24" rx="3"/><text class="sub" x="198.0" y="86.0" text-anchor="middle" dominant-baseline="central" data-w="0-1">cat ✓</text></g><g class="u" visibility="visible"><rect x="236" y="74" width="60" height="24" rx="3"/><text class="sub" x="266.0" y="86.0" text-anchor="middle" dominant-baseline="central" data-w="0-2">on</text></g><g class="u" visibility="visible"><rect x="304" y="74" width="6 und 2</text><g class="m" visibility="visible"><rect x="100" y="134" width="60" height="24" rx="3"/><text class="sub" x="130.0" y="146.0" text-anchor="middle" dominant-baseline="central" data-w="2-0">the</text></g><g class="m" visibility="visible"><rect x="168" y="134" width="60" height="24" rx="3"/><text class="sub" x="198.0" y="146.0" text-anchor="middle" dominant-baseline="central" data-w="2-1">cat</text></g><g class="u" visibility="visible"><rect x="236" y="134" width="60" height="24" rx="3"/><text class="sub" x="266.0" y="146.0" text-anchor="middle" dominant-baseline="central" data-w="2-2">ran</text></g><g class="u" visibility="visible"><rect x="304" y="134" width="60" height="24" rx="3"/><text class="sub" x="334.0" y="146.0" text-anchor="middle" dominant-baseline="central" data-w="2-3">on ✓</text></g><g class="u" visibility="visible"><rect x="372" y="134" width="60" height="24" rx="3"/><text class="sub" x="402.0" y="146.0" text-anchor="middle" dominant-baseline="central" data-w="2-4">mat</text></g><g class="u" visibility="visible"><rect x="440" y="134" width="60" height="24" rx="3"/><text class="sub" x="470.0" y="146.0" text-anchor="middle" dominant-baseline="central" data-w="2-5">ran</text></g><text class="sub2" x="512" y="151" data-note="2">2 settled</text><text class="cap" x="40" y="181" text-anchor="start">round 3</text><g class="m" visibility="visible"><rect x="100" y="164" width="60" height="24" rx="3"/><text class="sub" x="130.0" y="176.0" text-anchor="middle" dominant-baseline="central" data-w="3-0">the</text></g><g class="m" visibility="visible"><rect x="168" y="164" width="60" height="24" rx="3"/><text class="sub" x="198.0" y="176.0" text-anchor="middle" dominant-baseline="central" data-w="3-1">cat</text></g><g class="m" visibility="visible"><rect x="236" y="164" width="60" height="24" rx="3"/><text class="sub" x="266.0" y="176.0" text-anchor="middle" dominant-baseline="central" data-w="3-2">sat</text></g><g class="u" visibility="visible"><rect x="304" y="164" width="60" height="24" rx="3"/><text class="sub" x="334.0" y="176.0" text-anchor="middle" dominant-baseline="central" data-w="3-3">off</text></g><g class="u" visibility="visible"><rect x="372" y="164" width="60" height="24" rx="3"/><text class="sub" x="402.0" y="176.0" text-anchor="middle" dominant-baseline="central" data-w="3-4">the ✓</text></g><g class="u" visibility="visible"><rect x="440" y="164" width="60" height="24" rx="3"/><text class="sub" x="470.0" y="176.0" text-anchor="middle" dominant-baseline="central" data-w="3-5">.</text></g><text class="sub2" x="512" y="181" data-note="3">3 settled</text><text class="cap" x="40" y="211" text-anchor="start">round 4</text><g class="m" visibility="visible"><rect x="100" y="194" width="60" height="24" rx="3"/><text class="sub" x="130.0" y="206.0" text-anchor="middle" dominant-baseline="central" data-w="4-0">the</text></g><g class="m" visibility="visible"><rect x="168" y="194" width="60" height="24" rx="3"/><text class="sub" x="198.0" y="206.0" text-anchor="middle" dominant-baseline="central" data-w="4-1">cat</text></g><g class="m" visibility="visible"><rect x="236" y="194" width="60" height="24" rx="3"/><text class="sub" x="266.0" y="206.0" text-anchor="middle" dominant-baseline="central" data-w="4-2">sat</text></g><g class="m" visibility="visible"><rect x="304" y="194" width="60" height="24" rx="3"/><text class="sub" x="334.0" y="206.0" text-anchor="middle" dominant-baseline="central" data-w="4-3">on</text></g><g class="u" visibility="visible"><rect x="372" y="194" width="60" height="24" rx="3"/><text class="sub" x="402.0" y="206.0" text-anchor="middle" dominant-baseline="central" data-w="4-4">.</text></g><g class="u" visibility="visible"><rect x="440" y="194" width="60" height="24" rx="3"/><text class="sub" x="470.0" y="206.0" text-anchor="middle" dominant-baseline="central" data-w="4-5">mat ✓</text></g><text class="sub2" x="512" y="211" data-note="4">4 settled</text><text class="cap" x="40" y="241" text-anchor="start">round 5</text><g class="m" visibility="visible"><rect x="100" y="224" width="60" height="24" rx="3"/><text class="sub" x="130.0" y="236.0" text-anchor="middle" dominant-baseline="central" data-w="5-0">the</text></g><g class="m" visibility="visible"><rect x="168" y="224" width="60" height="24" rx="3"/><text class="sub" x="198.0" y="236.0" text-anchor="middle" dominant-baseline="central" data-w="5-1">cat</text></g><g class="m" visibility="visible"><rect x="236" y="224" width="60" height="24" rx="3"/><text class="sub" x="266.0" y="236.0" text-anchor="middle" dominant-baseline="central" data-w="5-2">sat</text></g><g class="m" visibility="visible"><rect x="304" y="224" width="60" height="24" rx="3"/><text class="sub" x="334.0" y="236.0" text-anchor="middle" dominant-baseline="central" data-w="5-3">on</text></g><g class="m" visibility="visible"><rect x="372" y="224" width="60" height="24" rx="3"/><text class="sub" x="402.0" y="236.0" text-anchor="middle" dominant-baseline="central" data-w="5-4">the</text></g><g class="u" visibility="visible"><rect x="440" y="224" width="60" height="24" rx="3"/><text class="sub" x="470.0" y="236.0" text-anchor="middle" dominant-baseline="central" data-w="5-5">the</text></g><text class="sub2" x="512" y="241" data-note="5">5 settled</text><text class="cap" x="40" y="271" text-anchor="start">round 6</text><g class="m" visibility="visible"><rect x="100" y="254" width="60" height="24" rx="3"/><text class="sub" x="130.0" y="266.0" text-anchor="middle" dominant-baseline="central" data-w="6-0">the</text></g><g class="m" visibility="visible"><rect x="168" y="254" width="60" height="24" rx="3"/><text class="sub" x="198.0" y="266.0" text-anchor="middle" dominant-baseline="central" data-w="6-1">cat</text></g><g class="m" visibility="visible"><rect x="236" y="254" width="60" height="24" rx="3"/><text class="sub" x="266.0" y="266.0" text-anchor="middle" dominant-baseline="central" data-w="6-2">sat</text></g><g class="m" visibility="visible"><rect x="304" y="254" width="60" height="24" rx="3"/><text class="sub" x="334.0" y="266.0" text-anchor="middle" dominant-baseline="central" data-w="6-3">on</text></g><g class="m" visibility="visible"><rect x="372" y="254" width="60" height="24" rx="3"/><text class="sub" x="402.0" y="266.0" text-anchor="middle" dominant-baseline="central" data-w="6-4">the</text></g><g class="m" visibility="visible"><rect x="440" y="254" width="60" height="24" rx="3"/><text class="sub" x="470.0" y="266.0" text-anchor="middle" dominant-baseline="central" data-w="6-5">mat</text></g><text class="sub2" x="512" y="271" data-note="6">6 settled</text><text class="sub2" x="40" y="304" text-anchor="start">amber: settled for good. ✓: the right word, not yet settled.</text><text class="sub2" x="40" y="328" data-sum="">Jacobi alone: all 6 words settled after 6 rounds, one a round</text><text class="cap" x="40" y="374" text-anchor="start">Start from a guess at all six positions, here random words. Each round is one pass of</text><text class="cap" x="40" y="394" text-anchor="start">the model: every position is recomputed from the previous round's words to its left.</text><text class="cap" x="40" y="414" text-anchor="start">Position 1 has nothing to its left but the prompt, so it is right after one round;</text><text class="cap" x="40" y="434" text-anchor="start">position 2 is right once position 1 was, and so on. A position only settles once</text><text class="cap" x="40" y="454" text-anchor="start">everything before it has.</text><text class="cap" x="40" y="494" text-anchor="start">So alone the method settles one word a round, no faster than ordinary decoding, and each</text><text class="cap" x="40" y="514" text-anchor="start">round a right word lands one place past the settled ones and is overwritten the next.</text><text class="cap" x="40" y="534" text-anchor="start">Switch on the pool and the same rounds finish sooner (two figures on explain why). New</text><text class="cap" x="40" y="554" text-anchor="start">starting guesses are drawn at random; the stepping was checked against the same rules in</text><text class="cap" x="40" y="574" text-anchor="start">Python.</text></svg></div><figcaption>Alone, Jacobi iteration settles a word a round and throws away right words it lands too early. The waste is the raw material: lookahead keeps it.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const C = ["the", "cat", "sat", "on", "the", "mat"], B = {"the": "mat", "cat": "sat", "sat": "on", "on": "the", "mat": ".", ".": "the", "a": "dog", "dog": "ran", "ran": "off", "off": ".", "big": "dog", "red": "hat", "hat": "."}, V = [".", "a", "big", "cat", "dog", "hat", "mat", "off", "on", "ran", "red", "sat", "the"], Y0 = ["a", "cat", "on", "big", "hat", "dog"], N = C.length;
  const mulberry32 = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const q$ = s => fig.querySelector(s), rad = [...fig.querySelectorAll('input[type=radio]')];
  const sl = fig.querySelector('input[type=range]'), val = fig.querySelector('.val');
  const btn = [...fig.querySelectorAll('button')];
  let y0 = Y0.slice(), seed = 0;
  const same = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
  const nxt = ctx => same(ctx, C.slice(0, ctx.length)) ? C[ctx.length] : B[ctx[ctx.length - 1]];
  const settled = row => { let s = 0; while (s < N && row[s] === C[s]) s++; return s; };
  function run(start, poolOn) {
    const rows = [start.slice()], sets = [0], used = [null], pool = {};
    let k = 0;
    while (sets[sets.length - 1] < N) {
      k++;
      const prev = rows[rows.length - 1], s = sets[sets.length - 1];
      const jac = []; for (let i = 0; i < N; i++) jac.push(i ? nxt(prev.slice(0, i)) : C[0]);
      let nw = Math.max(s + 1, settled(jac)), hit = null;
      if (poolOn && s >= 1) {
        let best = 0;
        for (const fr of (pool[C[s - 1]] || [])) {
          let m = 0; while (m < 2 && s + m < N && fr[1 + m] === C[s + m]) m++;
          if (m > best) { best = m; hit = fr; }
        }
        nw = Math.max(nw, Math.min(N, s + best + 1));
      }
      const row = []; for (let i = 0; i < N; i++) row.push(i < nw ? C[i] : jac[i]);
      rows.push(row); sets.push(nw); used.push(hit);
      if (poolOn && k >= 2) for (let i = 0; i < N - 2; i++) {
        const a = rows[k - 2][i], b = rows[k - 1][i + 1], c = rows[k][i + 2];
        if (b === nxt(rows[k - 2].slice(0, i + 1)) && c === nxt(rows[k - 1].slice(0, i + 2))) {
          if (!pool[a]) pool[a] = [];
          if (!pool[a].some(fr => fr[1] === b && fr[2] === c)) pool[a].push([a, b, c]);
        }
      }
    }
    return {rows, sets, used};
  }
  function draw() {
    const poolOn = rad[1].checked, shown = +sl.value, r = run(y0, poolOn), R = r.rows.length - 1;
    val.textContent = String(shown);
    for (let k = 0; k <= N; k++) {
      const vis = k <= Math.min(shown, R);
      q$(`[data-note="${k}"]`).textContent = !vis ? '' : k === 0 ? 'the starting guess' :
        r.sets[k] + ' settled' + (r.used[k] ? ', ' + (r.sets[k] - r.sets[k - 1]) + ' by the pool' : '');
      for (let i = 0; i < N; i++) {
        const t = q$(`[data-w="${k}-${i}"]`), g = t.parentNode;
        g.setAttribute('visibility', vis ? 'visible' : 'hidden');
        if (!vis) continue;
        const w = r.rows[k][i], set = i < r.sets[k];
        t.textContent = set ? w : (w === C[i] ? w + ' ✓' : w);
        g.setAttribute('class', set ? 'm' : 'u');
      }
    }
    q$('[data-sum]').textContent = (poolOn ? 'With the pool' : 'Jacobi alone') + ': all ' + N +
      ' words settled after ' + R + ' rounds' + (same(r.sets, [...Array(N + 1).keys()]) ? ', one a round' : '');
  }
  rad.forEach(x => x.addEventListener('change', draw));
  sl.addEventListener('input', draw);
  btn[0].addEventListener('click', () => { seed += 1; const r = mulberry32(seed);
    y0 = []; for (let i = 0; i < N; i++) y0.push(V[Math.floor(r() * V.length)]); draw(); });
  btn[1].addEventListener('click', () => { y0 = Y0.slice(); seed = 0; rad[0].checked = true; sl.value = N; draw(); });
  draw();
})();</script></figure>
