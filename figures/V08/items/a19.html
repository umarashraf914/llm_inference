<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 7:33</div><h3>Two tokenisers cut the same word differently, so there is no q to divide by</h3><svg viewBox='0 0 680 660' role='img'><title>Two tokenisers cut the same word differently, so there is no q to divide by</title><text class="hd" x="40" y="46">The word ‘misprediction’ through two real tokenisers</text><text class="cap" x="40" y="88" text-anchor="start">GPT-2's tokeniser</text><text class="sub2" x="40" y="108" text-anchor="start">50,257 rows</text><g class="m"><rect x="221" y="70" width="88" height="28" rx="3"/><text class="sub" x="265.0" y="84.0" text-anchor="middle" dominant-baseline="central">mis</text></g><text class="sub2" x="265.0" y="116" text-anchor="middle">row 2,984</text><g class="m"><rect x="311" y="70" width="118" height="28" rx="3"/><text class="sub" x="370.0" y="84.0" text-anchor="middle" dominant-baseline="central">pred</text></g><text class="sub2" x="370.0" y="116" text-anchor="middle">row 28,764</text><g class="m"><rect x="431" y="70" width="178" height="28" rx="3"/><text class="sub" x="520.0" y="84.0" text-anchor="middle" dominant-baseline="central">iction</text></g><text class="sub2" x="520.0" y="116" text-anchor="middle">row 2,867</text><text class="cap" x="40" y="162" text-anchor="start">GPT-4's tokeniser</text><text class="sub2" x="40" y="182" text-anchor="start">100,277 rows</text><g class="u"><rect x="221" y="144" width="88" height="28" rx="3"/><text class="sub" x="265.0" y="158.0" text-anchor="middle" dominant-baseline="central">mis</text></g><text class="sub2" x="265.0" y="190" text-anchor="middle">row 5,906</text><g class="u"><rect x="311" y="144" width="298" height="28" rx="3"/><text class="sub" x="460.0" y="158.0" text-anchor="middle" dominant-baseline="central">prediction</text></g><text class="sub2" x="460.0" y="190" text-anchor="middle">row 70,031</text><text class="sub2" x="40" y="224" text-anchor="start">‘prediction’ is no row of GPT-2's table; ‘pred’ is in both, at rows 28,764 and 24,361</text><text class="hd" x="40" y="268">Drift: tokens per pass with five guesses, to scale</text><text class="cap" x="40" y="305" text-anchor="start">agreeing, α = 0.8</text><g class="m"><rect x="220" y="286" width="405.8208" height="28" rx="3"/><text class="sub" x="422.9104" y="300.0" text-anchor="middle" dominant-baseline="central">3.69</text></g><text class="cap" x="40" y="345" text-anchor="start">drifted, α = 0.6</text><g class="h"><rect x="220" y="326" width="262.16959999999995" height="28" rx="3"/><text class="sub" x="351.0848" y="340.0" text-anchor="middle" dominant-baseline="central">2.38</text></g><text class="cap" x="40" y="410" text-anchor="start">The acceptance test divides the target's probability for the drafter's token by the</text><text class="cap" x="40" y="430" text-anchor="start">drafter's own, p(x) ÷ q(x). That needs both models to have the same token x. Two real</text><text class="cap" x="40" y="450" text-anchor="start">tokenisers cut ‘misprediction’ differently: GPT-2's into three pieces, GPT-4's into two</text><text class="cap" x="40" y="470" text-anchor="start">({{fig:v01-o006}} shows what a tokeniser does).</text><text class="cap" x="40" y="510" text-anchor="start">If the target's next token is ‘prediction’, a drafter with GPT-2's table has no</text><text class="cap" x="40" y="530" text-anchor="start">probability for it at all, and even a shared piece like ‘pred’ sits at a different row.</text><text class="cap" x="40" y="550" text-anchor="start">Without one shared vocabulary there is nothing to divide.</text><text class="cap" x="40" y="590" text-anchor="start">Drift is the slower failure. When the target is retrained and the drafter is not, they</text><text class="cap" x="40" y="610" text-anchor="start">agree less and α falls. From 0.8 to 0.6, five guesses yield 2.38 tokens a pass instead</text><text class="cap" x="40" y="630" text-anchor="start">of 3.69: 35% fewer.</text></svg><figcaption>A shared vocabulary is a hard requirement and agreement a soft one. Medusa and EAGLE meet both by drafting with the target's own vocabulary, and lookahead by drafting with the target itself.</figcaption></figure>
