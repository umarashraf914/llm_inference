<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 26:58</div><h3>Ten thousand thinking tokens is three minutes of decode before the first word</h3><svg viewBox='0 0 680 422' role='img'><title>Ten thousand thinking tokens is three minutes of decode before the first word</title><text class="hd" x="40" y="46">Thinking time before the answer starts, at 51 tokens a second, log scale ({{fig:v01-o121}})</text><text class="cap" x="40" y="82" text-anchor="start">300 tokens</text><text class="sub2" x="40" y="98" text-anchor="start">an easy question</text><g class="h"><rect x="220" y="70" width="92.34612943460712" height="28" rx="3"/></g><text class="sub2" x="322.3461294346071" y="89" text-anchor="start">5.9 s</text><text class="cap" x="40" y="128" text-anchor="start">10,000 tokens</text><text class="sub2" x="40" y="144" text-anchor="start">a hard one</text><g class="h"><rect x="220" y="116" width="275.09157886824767" height="28" rx="3"/></g><text class="sub2" x="505.09157886824767" y="135" text-anchor="start">196 s, 3.3 minutes</text><text class="cap" x="40" y="174" text-anchor="start">30,000 tokens</text><text class="sub2" x="40" y="190" text-anchor="start">a very hard one</text><g class="h"><rect x="220" y="162" width="332.34612943460706" height="28" rx="3"/></g><text class="sub2" x="562.3461294346071" y="181" text-anchor="start">588 s, 9.8 minutes</text><line class="axis" x1="220" y1="212" x2="580.0" y2="212"/><line class="tick" x1="220.0" y1="212" x2="220.0" y2="216"/><text class="sub2" x="220.0" y="230" text-anchor="middle">1 s</text><line class="tick" x1="340.0" y1="212" x2="340.0" y2="216"/><text class="sub2" x="340.0" y="230" text-anchor="middle">10 s</text><line class="tick" x1="460.0" y1="212" x2="460.0" y2="216"/><text class="sub2" x="460.0" y="230" text-anchor="middle">100 s</text><line class="tick" x1="580.0" y1="212" x2="580.0" y2="216"/><text class="sub2" x="580.0" y="230" text-anchor="middle">1,000 s</text><text class="cap" x="40" y="272" text-anchor="start">At NVIDIA's single-request rate of 51 tokens a second, a few hundred thinking tokens add</text><text class="cap" x="40" y="292" text-anchor="start">6 seconds before the answer starts; ten thousand add more than three minutes; thirty</text><text class="cap" x="40" y="312" text-anchor="start">thousand, nearly ten.</text><text class="cap" x="40" y="352" text-anchor="start">Batching does not shorten that wait for the one user waiting: it shares each weight read</text><text class="cap" x="40" y="372" text-anchor="start">across users, not across one user's tokens. Only cheaper decode steps do, which is where</text><text class="cap" x="40" y="392" text-anchor="start">the first half of this episode, speculative decoding, comes back in.</text></svg><figcaption>Log scale, a hundred to one between the ends. For a reasoning model, time per output token has become the time to the answer.</figcaption></figure>
