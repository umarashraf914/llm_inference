<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:52</div><h3>0.2 kept plus 0.3 replaced is cat's 0.5: the target, rebuilt</h3><svg viewBox='0 0 680 614' role='img'><title>0.2 kept plus 0.3 replaced is cat's 0.5: the target, rebuilt</title><text class="hd" x="40" y="46">What one guess produces, per token, inside the outline of the target's p</text><text class="cap" x="40" y="85" text-anchor="start">cat</text><rect x="150" y="66" width="200.0" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="150" y="66" width="80.0" height="28" rx="3"/><text class="sub" x="190.0" y="80.0" text-anchor="middle" dominant-baseline="central">kept 0.2</text></g><g class="u"><rect x="230.0" y="66" width="120.0" height="28" rx="3"/><text class="sub" x="290.0" y="80.0" text-anchor="middle" dominant-baseline="central">replaced 0.3</text></g><text class="sub2" x="360.0" y="85" text-anchor="start">= 0.5 = p</text><text class="cap" x="40" y="127" text-anchor="start">dog</text><rect x="150" y="108" width="120.0" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="150" y="108" width="120.0" height="28" rx="3"/><text class="sub" x="210.0" y="122.0" text-anchor="middle" dominant-baseline="central">kept 0.3</text></g><text class="sub2" x="280.0" y="127" text-anchor="start">= 0.3 = p</text><text class="cap" x="40" y="169" text-anchor="start">rest</text><rect x="150" y="150" width="80.0" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="150" y="150" width="80.0" height="28" rx="3"/><text class="sub" x="190.0" y="164.0" text-anchor="middle" dominant-baseline="central">kept 0.2</text></g><text class="sub2" x="240.0" y="169" text-anchor="start">= 0.2 = p</text><text class="hd" x="40" y="218">Drop either half and dog drifts</text><text class="sub2" x="335.0" y="246" text-anchor="middle">cat</text><text class="sub2" x="415.0" y="246" text-anchor="middle">dog</text><text class="sub2" x="495.0" y="246" text-anchor="middle">rest</text><text class="cap" x="40" y="273" text-anchor="start">both halves, the rule</text><g class="u"><rect x="300" y="256" width="70" height="26" rx="3"/><text class="sub" x="335.0" y="269.0" text-anchor="middle" dominant-baseline="central">0.50</text></g><g class="u"><rect x="380" y="256" width="70" height="26" rx="3"/><text class="sub" x="415.0" y="269.0" text-anchor="middle" dominant-baseline="central">0.30</text></g><g class="u"><rect x="460" y="256" width="70" height="26" rx="3"/><text class="sub" x="495.0" y="269.0" text-anchor="middle" dominant-baseline="central">0.20</text></g><text class="cap" x="40" y="309" text-anchor="start">replace a rejection from p</text><g class="h"><rect x="300" y="292" width="70" height="26" rx="3"/><text class="sub" x="335.0" y="305.0" text-anchor="middle" dominant-baseline="central">0.35</text></g><g class="h"><rect x="380" y="292" width="70" height="26" rx="3"/><text class="sub" x="415.0" y="305.0" text-anchor="middle" dominant-baseline="central">0.39</text></g><g class="h"><rect x="460" y="292" width="70" height="26" rx="3"/><text class="sub" x="495.0" y="305.0" text-anchor="middle" dominant-baseline="central">0.26</text></g><text class="cap" x="40" y="345" text-anchor="start">drop rejections instead</text><g class="h"><rect x="300" y="328" width="70" height="26" rx="3"/><text class="sub" x="335.0" y="341.0" text-anchor="middle" dominant-baseline="central">0.29</text></g><g class="h"><rect x="380" y="328" width="70" height="26" rx="3"/><text class="sub" x="415.0" y="341.0" text-anchor="middle" dominant-baseline="central">0.43</text></g><g class="h"><rect x="460" y="328" width="70" height="26" rx="3"/><text class="sub" x="495.0" y="341.0" text-anchor="middle" dominant-baseline="central">0.29</text></g><text class="sub2" x="544" y="273" text-anchor="start">= p</text><text class="cap" x="40" y="404" text-anchor="start">Cat is kept 0.2 of the time and arrives as a replacement the other 0.3: 0.5 in all. Dog</text><text class="cap" x="40" y="424" text-anchor="start">is kept 0.3 and never arrives as a replacement: 0.3. Rest is kept 0.2: 0.2. Token for</text><text class="cap" x="40" y="444" text-anchor="start">token, the target's distribution. Simulated 1,000,000 times: 0.500, 0.300, 0.199.</text><text class="cap" x="40" y="484" text-anchor="start">It holds for any p and q, in one line. Kept is min(p, q). The replacement adds back</text><text class="cap" x="40" y="504" text-anchor="start">max(0, p − q): how far p exceeds q, or nothing. If p is the smaller, that is p + 0; if q</text><text class="cap" x="40" y="524" text-anchor="start">is the smaller, q + (p − q). Both are p.</text><text class="cap" x="40" y="564" text-anchor="start">Replace a rejection from p itself and dog comes out 0.39; drop rejections and it comes</text><text class="cap" x="40" y="584" text-anchor="start">out 0.43. Only the two halves together give back p.</text></svg><figcaption>The proof fits in a line and needs both halves. Like the kernel changes of {{ref:v03-o099}}, the result can be switched on without retesting what the model says.</figcaption></figure>
