s that is 300. At 131,072 tokens it is 8.6 billion, for each of the</text><text class="cap" x="40" y="520" text-anchor="start">70B model's 64 heads in each of its 80 layers: 4.4 × 10¹³ scores for one 128k prompt. In</text><text class="cap" x="40" y="540" text-anchor="start">decode each step adds one row, the newest query against all 131,072 keys, which is the</text><text class="cap" x="40" y="560" text-anchor="start">cache read of {{fig:v08-b02}}.</text><text class="cap" x="40" y="600" text-anchor="start">If each row looks like the previous figure, a handful of cells take most of the weight</text><text class="cap" x="40" y="620" text-anchor="start">and almost all of the work goes to pairs that barely matter. The teal cells,</text><text class="cap" x="40" y="640" text-anchor="start">illustrative, follow the pattern trained models show: the first token (Part 8 explains</text><text class="cap" x="40" y="660" text-anchor="start">why), the nearest neighbours, and a few matches in between.</text></svg><figcaption>Computing every cell is what makes attention exact, and what makes it expensive. The rest of this part is about which cells can safely be skipped.</figcaption></figure>
