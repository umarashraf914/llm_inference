<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:16</div><h3>At 128k tokens one request's cache is 43 GB, and four outweigh the model</h3><svg viewBox='0 0 680 534' role='img'><title>At 128k tokens one request's cache is 43 GB, and four outweigh the model</title><text class="hd" x="40" y="46">One token's cache in the 70B model, term by term (built in {{fig:v01-o140}})</text><g class="u"><rect x="40" y="70" width="58" height="40" rx="6"/><text class="sub" x="69.0" y="90.0" text-anchor="middle" dominant-baseline="central">2</text></g><text class="sub2" x="69.0" y="128" text-anchor="middle">key + value</text><text class="sub2" x="113.0" y="95" text-anchor="middle">×</text><g class="u"><rect x="128" y="70" width="58" height="40" rx="6"/><text class="sub" x="157.0" y="90.0" text-anchor="middle" dominant-baseline="central">80</text></g><text class="sub2" x="157.0" y="128" text-anchor="middle">layers</text><text class="sub2" x="201.0" y="95" text-anchor="middle">×</text><g class="u"><rect x="216" y="70" width="58" height="40" rx="6"/><text class="sub" x="245.0" y="90.0" text-anchor="middle" dominant-baseline="central">8</text></g><text class="sub2" x="245.0" y="128" text-anchor="middle">KV heads</text><text class="sub2" x="289.0" y="95" text-anchor="middle">×</text><g class="u"><rect x="304" y="70" width="58" height="40" rx="6"/><text class="sub" x="333.0" y="90.0" text-anchor="middle" dominant-baseline="central">128</text></g><text class="sub2" x="333.0" y="128" text-anchor="middle">per head</text><text class="sub2" x="377.0" y="95" text-anchor="middle">×</text><g class="u"><rect x="392" y="70" width="58" height="40" rx="6"/><text class="sub" x="421.0" y="90.0" text-anchor="middle" dominant-baseline="central">2</text></g><text class="sub2" x="421.0" y="128" text-anchor="middle">bytes each</text><text class="sub2" x="465.0" y="95" text-anchor="middle">=</text><g class="h"><rect x="480" y="70" width="150" height="40" rx="6"/><text class="sub" x="555.0" y="90.0" text-anchor="middle" dominant-baseline="central">327,680 bytes</text></g><text class="sub2" x="555" y="128" text-anchor="middle">about 320 KB a token</text><text class="hd" x="40" y="176">Times 131,072 tokens, drawn to scale</text><text class="cap" x="40" y="213" text-anchor="start">the weights</text><g class="u"><rect x="230" y="194" width="325.9629011154175" height="28" rx="3"/><text class="sub" x="392.98145055770874" y="208.0" text-anchor="middle" dominant-baseline="central">140 GB, the same for every request</text></g><text class="cap" x="40" y="257" text-anchor="start">one request at 128k</text><g class="h"><rect x="230" y="238" width="100.0" height="28" rx="3"/><text class="sub" x="280.0" y="252.0" text-anchor="middle" dominant-baseline="central">42.9 GB</text></g><text class="cap" x="40" y="301" text-anchor="start">four such requests</text><g class="h"><rect x="230" y="282" width="400.0" height="28" rx="3"/><text class="sub" x="430.0" y="296.0" text-anchor="middle" dominant-baseline="central">171.8 GB, more than the weights</text></g><text class="cap" x="40" y="364" text-anchor="start">Here a GB is 10⁹ bytes, the unit of the 140 GB of weights. The 128k of context is 2¹⁷ =</text><text class="cap" x="40" y="384" text-anchor="start">131,072 tokens, and 131,072 × 327,680 bytes is 42.9 GB. In binary units that is exactly</text><text class="cap" x="40" y="404" text-anchor="start">40 GiB (40 × 2³⁰ bytes), which is where the round figure of 40 GB usually quoted comes</text><text class="cap" x="40" y="424" text-anchor="start">from; the 320 KB is likewise 320 × 1,024 bytes.</text><text class="cap" x="40" y="464" text-anchor="start">The weights are paid for once and shared by every request on the machine. The cache is</text><text class="cap" x="40" y="484" text-anchor="start">paid per request and per token, so four requests at this length hold more between them</text><text class="cap" x="40" y="504" text-anchor="start">than the model holds in weights.</text></svg><figcaption>Two units for one quantity is a common source of disagreement between sources. This atlas uses decimal GB throughout, so 42.9 here and the 140 of the weights compare directly.</figcaption></figure>
