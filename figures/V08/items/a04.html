<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:56</div><h3>Everything after the first disagreement was built on a wrong token</h3><svg viewBox='0 0 680 606' role='img'><title>Everything after the first disagreement was built on a wrong token</title><text class="hd" x="40" y="46">Greedy checking: keep a guess when it is the target's top choice</text><text class="sub2" x="208.0" y="74" text-anchor="middle">guess 1</text><text class="sub2" x="310.0" y="74" text-anchor="middle">guess 2</text><text class="sub2" x="412.0" y="74" text-anchor="middle">guess 3</text><text class="sub2" x="514.0" y="74" text-anchor="middle">guess 4</text><text class="sub2" x="616.0" y="74" text-anchor="middle">guess 5</text><text class="cap" x="40" y="103" text-anchor="start">drafter wrote</text><text class="cap" x="40" y="147" text-anchor="start">target's choice</text><text class="cap" x="40" y="191" text-anchor="start">verdict</text><g class="m"><rect x="160" y="84" width="96" height="28" rx="3"/><text class="sub" x="208.0" y="98.0" text-anchor="middle" dominant-baseline="central">on</text></g><g class="u"><rect x="160" y="128" width="96" height="28" rx="3"/><text class="sub" x="208.0" y="142.0" text-anchor="middle" dominant-baseline="central">on</text></g><g class="m"><rect x="160" y="172" width="96" height="28" rx="3"/><text class="sub" x="208.0" y="186.0" text-anchor="middle" dominant-baseline="central">kept</text></g><g class="m"><rect x="262" y="84" width="96" height="28" rx="3"/><text class="sub" x="310.0" y="98.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="u"><rect x="262" y="128" width="96" height="28" rx="3"/><text class="sub" x="310.0" y="142.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="m"><rect x="262" y="172" width="96" height="28" rx="3"/><text class="sub" x="310.0" y="186.0" text-anchor="middle" dominant-baseline="central">kept</text></g><g class="m"><rect x="364" y="84" width="96" height="28" rx="3"/><text class="sub" x="412.0" y="98.0" text-anchor="middle" dominant-baseline="central">mat</text></g><g class="u"><rect x="364" y="128" width="96" height="28" rx="3"/><text class="sub" x="412.0" y="142.0" text-anchor="middle" dominant-baseline="central">mat</text></g><g class="m"><rect x="364" y="172" width="96" height="28" rx="3"/><text class="sub" x="412.0" y="186.0" text-anchor="middle" dominant-baseline="central">kept</text></g><g class="m"><rect x="466" y="84" width="96" height="28" rx="3"/><text class="sub" x="514.0" y="98.0" text-anchor="middle" dominant-baseline="central">and</text></g><g class="u"><rect x="466" y="128" width="96" height="28" rx="3"/><text class="sub" x="514.0" y="142.0" text-anchor="middle" dominant-baseline="central">.</text></g><g class="h"><rect x="466" y="172" width="96" height="28" rx="3"/><text class="sub" x="514.0" y="186.0" text-anchor="middle" dominant-baseline="central">replaced by .</text></g><g class="m"><rect x="568" y="84" width="96" height="28" rx="3"/><text class="sub" x="616.0" y="98.0" text-anchor="middle" dominant-baseline="central">then</text></g><g class="u"><rect x="568" y="128" width="96" height="28" rx="3"/><text class="sub" x="616.0" y="142.0" text-anchor="middle" dominant-baseline="central">then</text></g><rect x="568" y="172" width="96" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="616.0" y="186.0" text-anchor="middle" dominant-baseline="central">discarded</text><text class="sub2" x="664" y="222" text-anchor="end">agrees, but both assumed ‘and’</text><text class="cap" x="40" y="279" text-anchor="start">this pass yields</text><g class="m"><rect x="160" y="260" width="96" height="28" rx="3"/><text class="sub" x="208.0" y="274.0" text-anchor="middle" dominant-baseline="central">on</text></g><g class="m"><rect x="262" y="260" width="96" height="28" rx="3"/><text class="sub" x="310.0" y="274.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="m"><rect x="364" y="260" width="96" height="28" rx="3"/><text class="sub" x="412.0" y="274.0" text-anchor="middle" dominant-baseline="central">mat</text></g><g class="u"><rect x="466" y="260" width="96" height="28" rx="3"/><text class="sub" x="514.0" y="274.0" text-anchor="middle" dominant-baseline="central">.</text></g><text class="sub2" x="572" y="279" text-anchor="start">4 tokens</text><text class="cap" x="40" y="336" text-anchor="start">The simplest check keeps a guess when it is the target's top choice; Part 3 gives the</text><text class="cap" x="40" y="356" text-anchor="start">rule that also works when the text is sampled. ‘on’, ‘the’ and ‘mat’ match and are kept.</text><text class="cap" x="40" y="376" text-anchor="start">At the fourth slot the target wanted a full stop, so ‘and’ is rejected and the full stop</text><text class="cap" x="40" y="396" text-anchor="start">takes its place: the target's own choice, already computed, so the replacement costs</text><text class="cap" x="40" y="416" text-anchor="start">nothing extra.</text><text class="cap" x="40" y="456" text-anchor="start">The fifth slot agrees, ‘then’ and ‘then’, and is thrown away anyway. The drafter wrote</text><text class="cap" x="40" y="476" text-anchor="start">‘then’ after ‘and’, and the target's choice there was computed with ‘and’ in its input.</text><text class="cap" x="40" y="496" text-anchor="start">Once ‘and’ is gone, both answer a question nobody is asking.</text><text class="cap" x="40" y="536" text-anchor="start">One pass, four tokens: three kept and the replacement. Even a pass that rejects its</text><text class="cap" x="40" y="556" text-anchor="start">first guess still yields one token, the replacement, so a pass never yields fewer than</text><text class="cap" x="40" y="576" text-anchor="start">ordinary decode does.</text></svg><figcaption>The first disagreement ends the pass, however many guesses after it happen to agree. That is why guesses are checked in order, and why Part 4 multiplies their chances of surviving.</figcaption></figure>
