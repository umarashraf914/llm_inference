<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 18:26</div><h3>A sink soaks up the leftover; evict it and the rest get five times their weight</h3><svg viewBox='0 0 680 450' role='img'><title>A sink soaks up the leftover; evict it and the rest get five times their weight</title><text class="hd" x="40" y="46">One sink scored 1 and five ordinary tokens scored −2: the whole budget, to scale</text><text class="cap" x="40" y="94" text-anchor="start">sink kept</text><g class="u"><rect x="150" y="74" width="384.3273417926497" height="30" rx="2"/><text class="sub" x="342.16367089632485" y="89.0" text-anchor="middle" dominant-baseline="central">sink 0.80</text></g><g class="s"><rect x="534.3273417926497" y="74" width="19.134531641470065" height="30" rx="2"/></g><g class="s"><rect x="553.4618734341198" y="74" width="19.134531641470065" height="30" rx="2"/></g><g class="s"><rect x="572.5964050755898" y="74" width="19.134531641470065" height="30" rx="2"/></g><g class="s"><rect x="591.7309367170599" y="74" width="19.134531641470065" height="30" rx="2"/></g><g class="s"><rect x="610.8654683585299" y="74" width="19.134531641470065" height="30" rx="2"/></g><text class="sub2" x="582.1636708963249" y="124" text-anchor="middle">five tokens, 0.04 each</text><text class="cap" x="40" y="170" text-anchor="start">sink evicted</text><g class="h"><rect x="150" y="150" width="96.0" height="30" rx="2"/><text class="sub" x="198.0" y="165.0" text-anchor="middle" dominant-baseline="central">0.20</text></g><g class="h"><rect x="246.0" y="150" width="96.0" height="30" rx="2"/><text class="sub" x="294.0" y="165.0" text-anchor="middle" dominant-baseline="central">0.20</text></g><g class="h"><rect x="342.0" y="150" width="96.0" height="30" rx="2"/><text class="sub" x="390.0" y="165.0" text-anchor="middle" dominant-baseline="central">0.20</text></g><g class="h"><rect x="438.0" y="150" width="96.0" height="30" rx="2"/><text class="sub" x="486.0" y="165.0" text-anchor="middle" dominant-baseline="central">0.20</text></g><g class="h"><rect x="534.0" y="150" width="96.0" height="30" rx="2"/><text class="sub" x="582.0" y="165.0" text-anchor="middle" dominant-baseline="central">0.20</text></g><text class="cap" x="40" y="240" text-anchor="start">The model resolves this by dumping the leftover onto the first few tokens of the</text><text class="cap" x="40" y="260" text-anchor="start">sequence. Those work because every later position can see them, so training can teach</text><text class="cap" x="40" y="280" text-anchor="start">every query to park its unneeded weight there.</text><text class="cap" x="40" y="320" text-anchor="start">With the sink scored 1 and five tokens scored −2: e¹ = 2.72, e⁻² = 0.135, five of them</text><text class="cap" x="40" y="340" text-anchor="start">0.68, total 3.39. The sink takes 0.80 and each ordinary token 0.04.</text><text class="cap" x="40" y="380" text-anchor="start">Evict the sink and the same five scores share the whole budget: 0.20 each, five times</text><text class="cap" x="40" y="400" text-anchor="start">what the model was trained to give them. StreamingLLM's authors saw exactly this: plain</text><text class="cap" x="40" y="420" text-anchor="start">window attention collapses as soon as the first tokens are evicted.</text></svg><figcaption>Why the sinks have to stay. They carry almost no meaning, yet removing them pushes 80% of the weight onto tokens that were never meant to have it.</figcaption></figure>
