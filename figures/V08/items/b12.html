height="28" rx="3"/><text class="sub" x="186.0" y="144.0" text-anchor="middle" dominant-baseline="central">0.90</text></g><g class="u"><rect x="218" y="130" width="52" height="28" rx="3"/><text class="sub" x="244.0" y="144.0" text-anchor="middle" dominant-baseline="central">0.30</text></g><g class="u"><rect x="276" y="130" width="52" height="28" rx="3"/><text class="sub" x="302.0" y="144.0" text-anchor="middle" dominant-baseline="central">−0.50</text></g><g class="s"><rect x="380" y="130" width="64" height="28" rx="3"/><text class="sub" x="412.0" y="144.0" text-anchor="middle" dominant-baseline="central">0.846</text></g><g class="u"><rect x="470" y="130" width="52" height="28" rx="3"/><text class="sub" x="496.0" y="144.0" text-anchor="middle" dominant-baseline="central">0.76</text></g><g class="u"><rect x="528" y="130" width="52" height="28" rx="3"/><text class="sub" x="554.0" y="144.0" text-anchor="middle" dominant-baseline="central">0.25</text></g><g class="u"><rect x="586" y="130" width="52" height="28" rx="3"/><text class="sub" x="612.0" y="144.0" text-anchor="middle" dominant-baseline="central">−0.42</text></g><text class="cap" x="40" y="189" text-anchor="start">sliding</text><g class="u"><rect x="160" y="170" width="52" height="28" rx="3"/><text class="sub" x="186.0" y="184.0" text-anchor="middle" dominant-baseline="central">−0.10</text></g><g class="u"><rect x="218" y="170" width="52" height="28" rx="3"/><text class="sub" x="244.0" y="184.0" text-anchor="middle" dominant-baseline="central">0.60</text></g><g class="u"><rect x="276" y="170" width="52" height="28" rx="3"/><text class="sub" x="302.0" y="184.0" text-anchor="middle" dominant-baseline="central">0.20</text></g><g class="s"><rect x="380" y="170" width="64" height="28" rx="3"/><text class="sub" x="412.0" y="184.0" text-anchor="middle" dominant-baseline="central">0.550</text></g><g class="u"><rect x="470" y="170" width="52" height="28" rx="3"/><text class="sub" x="496.0" y="184.0" text-anchor="middle" dominant-baseline="central">−0.05</text></g><g class="u"><rect x="528" y="170" width="52" height="28" rx="3"/><text class="sub" x="554.0" y="184.0" text-anchor="middle" dominant-baseline="central">0.33</text></g><g class="u"><rect x="586" y="170" width="52" height="28" rx="3"/><text class="sub" x="612.0" y="184.0" text-anchor="middle" dominant-baseline="central">0.11</text></g><line class="tick" x1="470" y1="214" x2="638" y2="214"/><text class="sub2" x="380" y="240" text-anchor="start">sum:</text><g class="s"><rect x="470" y="222" width="52" height="28" rx="3"/><text class="sub" x="496.0" y="236.0" text-anchor="middle" dominant-baseline="central">0.83</text></g><g class="s"><rect x="528" y="222" width="52" height="28" rx="3"/><text class="sub" x="554.0" y="236.0" text-anchor="middle" dominant-baseline="central">0.52</text></g><g class="s"><rect x="586" y="222" width="52" height="28" rx="3"/><text class="sub" x="612.0" y="236.0" text-anchor="middle" dominant-baseline="central">−0.28</text></g><text class="sub2" x="40" y="288" text-anchor="start">each gate is σ(z) = 1 ÷ (1 + e^−z) of a score z from a small learned layer:</text><text class="sub2" x="40" y="306" text-anchor="start">σ(−0.8) = 0.310, σ(1.7) = 0.846, σ(0.2) = 0.550</text><text class="cap" x="40" y="350" text-anchor="start">A small learned layer reads the query token's vector and gives one score per branch; a</text><text class="cap" x="40" y="370" text-anchor="start">sigmoid squashes each score to between 0 and 1 ({{fig:v06-p20}}). Each branch's output</text><text class="cap" x="40" y="390" text-anchor="start">is multiplied by its gate and the three are added. Here the selection branch counts</text><text class="cap" x="40" y="410" text-anchor="start">most.</text><text class="cap" x="40" y="450" text-anchor="start">The gates need not add to one, and here they add to 1.71: each branch is weighed on its</text><text class="cap" x="40" y="470" text-anchor="start">own, not as a share of a fixed budget.</text><text class="cap" x="40" y="510" text-anchor="start">Why a sliding branch at all: local patterns are the easiest thing to learn, so without a</text><text class="cap" x="40" y="530" text-anchor="start">branch of their own the other two would learn those and not much else. Trained this way</text><text class="cap" x="40" y="550" text-anchor="start">from the start, the paper's model matches or exceeds full attention on general</text><text class="cap" x="40" y="570" text-anchor="start">benchmarks (fixed sets of test questions), long-context tasks and reasoning.</text></svg><figcaption>Numbers illustrative, arithmetic exact. The blend itself is learned, so the model decides, query by query, how much each way of looking should count.</figcaption><!-- link: point 'benchmarks' at the benchmark figure in Part 5 (review G4) once it exists --></figure>
