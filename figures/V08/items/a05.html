<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:38</div><h3>Keeping the drafter's guesses writes ‘dog’ twice as often as the target would</h3><svg viewBox='0 0 680 586' role='img'><title>Keeping the drafter's guesses writes ‘dog’ twice as often as the target would</title><text class="hd" x="40" y="46">Write p for the target's probabilities and q for the drafter's</text><text class="cap" x="40" y="85" text-anchor="start">target, p</text><g class="u"><rect x="150" y="66" width="233.0" height="30" rx="3"/><text class="sub" x="266.5" y="81.0" text-anchor="middle" dominant-baseline="central">cat 0.5</text></g><g class="u"><rect x="385.0" y="66" width="139.0" height="30" rx="3"/><text class="sub" x="454.5" y="81.0" text-anchor="middle" dominant-baseline="central">dog 0.3</text></g><g class="u"><rect x="526.0" y="66" width="92.0" height="30" rx="3"/><text class="sub" x="572.0" y="81.0" text-anchor="middle" dominant-baseline="central">rest 0.2</text></g><text class="cap" x="40" y="129" text-anchor="start">drafter, q</text><g class="m"><rect x="150" y="110" width="92.0" height="30" rx="3"/><text class="sub" x="196.0" y="125.0" text-anchor="middle" dominant-baseline="central">cat 0.2</text></g><g class="m"><rect x="244.0" y="110" width="280.0" height="30" rx="3"/><text class="sub" x="384.0" y="125.0" text-anchor="middle" dominant-baseline="central">dog 0.6</text></g><g class="m"><rect x="526.0" y="110" width="92.0" height="30" rx="3"/><text class="sub" x="572.0" y="125.0" text-anchor="middle" dominant-baseline="central">rest 0.2</text></g><text class="hd" x="40" y="196">A thousand runs, counted</text><text class="sub2" x="260.0" y="226" text-anchor="middle">cat</text><text class="sub2" x="390.0" y="226" text-anchor="middle">dog</text><text class="sub2" x="520.0" y="226" text-anchor="middle">rest</text><text class="cap" x="40" y="255" text-anchor="start">the target alone</text><g class="u"><rect x="200" y="236" width="120" height="28" rx="3"/><text class="sub" x="260.0" y="250.0" text-anchor="middle" dominant-baseline="central">500</text></g><g class="u"><rect x="330" y="236" width="120" height="28" rx="3"/><text class="sub" x="390.0" y="250.0" text-anchor="middle" dominant-baseline="central">300</text></g><g class="u"><rect x="460" y="236" width="120" height="28" rx="3"/><text class="sub" x="520.0" y="250.0" text-anchor="middle" dominant-baseline="central">200</text></g><text class="cap" x="40" y="295" text-anchor="start">keeping every guess</text><g class="m"><rect x="200" y="276" width="120" height="28" rx="3"/><text class="sub" x="260.0" y="290.0" text-anchor="middle" dominant-baseline="central">200</text></g><g class="h"><rect x="330" y="276" width="120" height="28" rx="3"/><text class="sub" x="390.0" y="290.0" text-anchor="middle" dominant-baseline="central">600</text></g><g class="m"><rect x="460" y="276" width="120" height="28" rx="3"/><text class="sub" x="520.0" y="290.0" text-anchor="middle" dominant-baseline="central">200</text></g><text class="cap" x="40" y="356" text-anchor="start">Keep every guess the drafter makes and the text is whatever the drafter would have</text><text class="cap" x="40" y="376" text-anchor="start">sampled: its distribution q, not the target's p. Over a thousand runs that writes ‘dog’</text><text class="cap" x="40" y="396" text-anchor="start">about 600 times where the target would write it about 300, and ‘cat’ 200 times instead</text><text class="cap" x="40" y="416" text-anchor="start">of 500.</text><text class="cap" x="40" y="456" text-anchor="start">Keeping only the guesses the drafter is confident about makes it worse. Keep its guesses</text><text class="cap" x="40" y="476" text-anchor="start">above 0.5 and let the target redraw the rest: every ‘dog’ guess survives and the redraws</text><text class="cap" x="40" y="496" text-anchor="start">add more, so dog comes out 0.72. The drafter's opinion still decides.</text><text class="cap" x="40" y="536" text-anchor="start">No single answer looks wrong. The proportions are wrong, and the proportions are what</text><text class="cap" x="40" y="556" text-anchor="start">was asked for.</text></svg><figcaption>Each output looks fine; only the counts give it away. That is why correctness here means matching a distribution, as {{ref:v08-o005}} set out.</figcaption></figure>
