data-s="2"/></g><text class="sub2" x="169.0" y="254" text-anchor="middle">2</text><rect x="198" y="195.47" width="30" height="40.53" rx="2" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" data-e="3"/><g class="u"><rect x="198" y="196.65" width="30" height="39.35" rx="2" data-s="3"/></g><text class="sub2" x="213.0" y="254" text-anchor="middle">3</text><rect x="242" y="191.63" width="30" height="44.37" rx="2" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" data-e="4"/><g class="u"><rect x="242" y="193.34" width="30" height="42.66" rx="2" data-s="4"/></g><text class="sub2" x="257.0" y="254" text-anchor="middle">4</text><rect x="286" y="188.94" width="30" height="47.06" rx="2" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" data-e="5"/><g class="m"><rect x="286" y="191.18" width="30" height="44.82" rx="2" data-s="5"/></g><text class="sub2" x="301.0" y="254" text-anchor="middle">5</text><rect x="330" y="187.06" width="30" height="48.94" rx="2" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" data-e="6"/><g class="u"><rect x="330" y="189.83" width="30" height="46.17" rx="2" data-s="6"/></g><text class="sub2" x="345.0" y="254" text-anchor="middle">6</text><rect x="374" y="185.74" width="30" height="50.26" rx="2" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" data-e="7"/><g class="u"><rect x="374" y="189.03" width="30" height="46.97" rx="2" data-s="7"/></g><text class="sub2" x="389.0" y="254" text-anchor="middle">7</text><rect x="418" y="184.82" width="30" height="51.18" rx="2" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" data-e="8"/><g class="u"><rect x="418" y="188.61" width="30" height="47.39" rx="2" data-s="8"/></g><text class="sub2" x="433.0" y="254" text-anchor="middle">8</text><rect x="462" y="184.17" width="30" height="51.83" rx="2" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" data-e="9"/><g class="u"><rect x="462" y="188.45" width="30" height="47.55" rx="2" data-s="9"/></g><text class="sub2" x="477.0" y="254" text-anchor="middle">9</text><rect x="506" y="183.72" width="30" height="52.28" rx="2" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" data-e="10"/><g class="u"><rect x="506" y="188.47" width="30" height="47.53" rx="2" data-s="10"/></g><text class="sub2" x="521.0" y="254" text-anchor="middle">10</text><rect x="550" y="183.40" width="30" height="52.60" rx="2" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" data-e="11"/><g class="u"><rect x="550" y="188.62" width="30" height="47.38" rx="2" data-s="11"/></g><text class="sub2" x="565.0" y="254" text-anchor="middle">11</text><rect x="594" y="183.18" width="30" height="52.82" rx="2" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" data-e="12"/><g class="u"><rect x="594" y="188.84" width="30" height="47.16" rx="2" data-s="12"/></g><text class="sub2" x="609.0" y="254" text-anchor="middle">12</text><line class="axis" x1="102" y1="236" x2="632" y2="236"/><line class="mark" x1="102" y1="182.67" x2="632" y2="182.67" data-ceil=""/><text class="sub2" x="632" y="176.67" text-anchor="end" data-ceilt="">ceiling 3.33</text><text class="sub2" x="477.00" y="270" text-anchor="middle" data-best="">best</text><text class="sub2" x="110" y="292" text-anchor="start">draft length γ: guesses per pass</text><text class="sub2" x="40" y="324" data-l1="">γ = 5: 2.94 tokens a pass, for 1.05 passes' worth of time: 2.80× faster</text><text class="sub2" x="40" y="348" data-l2="">ceiling 1 ÷ (1 − α) = 3.33 tokens; best draft length 9, at 2.97×</text><text class="cap" x="40" y="394" text-anchor="start">The outline is tokens per pass, 1 + α + … up to the draft length. The filled bar divides</text><text class="cap" x="40" y="414" text-anchor="start">it by what the pass costs: one target pass plus γ drafter passes at c each, so 1 +</text><text class="cap" x="40" y="434" text-anchor="start">γ × c. The drafter's cost c is 0.01 by bytes for a drafter 100 times smaller; the 2022</text><text class="cap" x="40" y="454" text-anchor="start">paper measured its drafters at under 0.05 of a pass in time.</text><text class="cap" x="40" y="494" text-anchor="start">At α = 0.7 and c = 0.01 the best draft is 9 guesses, at 2.97×, barely ahead of 5</text><text class="cap" x="40" y="514" text-anchor="start">guesses' 2.80×. At c = 0.05 the best is 6, at 2.35×. The arithmetic here was checked</text><text class="cap" x="40" y="534" text-anchor="start">against Python over every setting of the sliders.</text></svg></div><figcaption>With a cheap drafter the best draft is long but the gain past five guesses is small; a costlier drafter pulls the best length shorter. Only α moves the ceiling.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const X = 110, PITCH = 44, BW = 30, YB = 236, YS = 16, G = 12, D0 = [0.7, 5, 0.01];
  const fmt = (v, d = 2) => (v < 0 && +Math.abs(v).toFixed(d) !== 0 ? '−' : '') + Math.abs(v).toFixed(d);
  const fmtc = v => Math.round(v).toLocaleString('en-US');
  const sl = [...fig.querySelectorAll('input[type=range]')], val = [...fig.querySelectorAll('.val')];
  const q$ = s => fig.querySelector(s);
  const powk = (a, k) => { let p = 1; for (let i = 0; i < k; i++) p *= a; return p; };
  const tokens = (a, g) => (1 - powk(a, g + 1)) / (1 - a);
  function draw() {
    const a = +sl[0].value, g = +sl[1].value, c = +sl[2].value;
    val[0].textContent = fmt(a); val[1].textContent = String(g); val[2].textContent = fmt(c, 3);
    const E = [], S = [];
    for (let k = 1; k <= G; k++) { E.push(tokens(a, k)); S.push(E[k - 1] / (1 + k * c)); }
    let best = 1; for (let k = 2; k <= G; k++) if (S[k - 1] > S[best - 1]) best = k;
    for (let k = 1; k <= G; k++) {
      const e = q$(`[data-e="${k}"]`), s = q$(`[data-s="${k}"]`);
      e.setAttribute('y', (YB - E[k - 1] * YS).toFixed(2)); e.setAttribute('height', (E[k - 1] * YS).toFixed(2));
      s.setAttribute('y', (YB - S[k - 1] * YS).toFixed(2)); s.setAttribute('height', (S[k - 1] * YS).toFixed(2));
      s.parentNode.setAttribute('class', k === g ? 'm' : 'u');
    }
    const ceil = 1 / (1 - a), yc = YB - ceil * YS, line = q$('[data-ceil]'), lab = q$('[data-ceilt]');
    line.setAttribute('y1', yc.toFixed(2)); line.setAttribute('y2', yc.toFixed(2));
    lab.setAttribute('y', (yc - 6).toFixed(2)); lab.textContent = 'ceiling ' + fmt(ceil);
    const bx = X + (best - 1) * PITCH + BW / 2, bl = q$('[data-best]');
    bl.setAttribute('x', bx.toFixed(2));
    q$('[data-l1]').textContent = 'γ = ' + g + ': ' + fmt(E[g - 1]) + ' tokens a pass, for ' + fmt(1 + g * c) +
      " passes' worth of time: " + fmt(S[g - 1]) + '× faster';
    q$('[data-l2]').textContent = 'ceiling 1 ÷ (1 − α) = ' + fmt(ceil) + ' tokens; best draft length ' + best +
      ', at ' + fmt(S[best - 1]) + '×';
  }
  sl.forEach(s => s.addEventListener('input', draw));
  q$('button').addEventListener('click', () => { sl.forEach((s, i) => s.value = D0[i]); draw(); });
  draw();
})();</script></figure>
