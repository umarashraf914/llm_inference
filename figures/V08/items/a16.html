<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:35</div><h3>Summing the series without adding it up: multiply by α and subtract</h3><svg viewBox='0 0 680 524' role='img'><title>Summing the series without adding it up: multiply by α and subtract</title><text class="hd" x="40" y="46">Shift the sum one place, line it up under itself, subtract</text><text class="cap" x="40" y="89" text-anchor="start">S =</text><g class="u"><rect x="150" y="70" width="46" height="28" rx="3"/><text class="sub" x="173.0" y="84.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="204.0" y="89" text-anchor="middle">+</text><g class="u"><rect x="212" y="70" width="46" height="28" rx="3"/><text class="sub" x="235.0" y="84.0" text-anchor="middle" dominant-baseline="central">α</text></g><text class="sub2" x="266.0" y="89" text-anchor="middle">+</text><g class="u"><rect x="274" y="70" width="46" height="28" rx="3"/><text class="sub" x="297.0" y="84.0" text-anchor="middle" dominant-baseline="central">α²</text></g><text class="sub2" x="328.0" y="89" text-anchor="middle">+</text><g class="u"><rect x="336" y="70" width="46" height="28" rx="3"/><text class="sub" x="359.0" y="84.0" text-anchor="middle" dominant-baseline="central">α³</text></g><text class="sub2" x="390.0" y="89" text-anchor="middle">+</text><g class="u"><rect x="398" y="70" width="46" height="28" rx="3"/><text class="sub" x="421.0" y="84.0" text-anchor="middle" dominant-baseline="central">α⁴</text></g><text class="sub2" x="452.0" y="89" text-anchor="middle">+</text><g class="u"><rect x="460" y="70" width="46" height="28" rx="3"/><text class="sub" x="483.0" y="84.0" text-anchor="middle" dominant-baseline="central">α⁵</text></g><text class="cap" x="40" y="133" text-anchor="start">αS =</text><g class="u"><rect x="212" y="114" width="46" height="28" rx="3"/><text class="sub" x="235.0" y="128.0" text-anchor="middle" dominant-baseline="central">α</text></g><text class="sub2" x="266.0" y="133" text-anchor="middle">+</text><g class="u"><rect x="274" y="114" width="46" height="28" rx="3"/><text class="sub" x="297.0" y="128.0" text-anchor="middle" dominant-baseline="central">α²</text></g><text class="sub2" x="328.0" y="133" text-anchor="middle">+</text><g class="u"><rect x="336" y="114" width="46" height="28" rx="3"/><text class="sub" x="359.0" y="128.0" text-anchor="middle" dominant-baseline="central">α³</text></g><text class="sub2" x="390.0" y="133" text-anchor="middle">+</text><g class="u"><rect x="398" y="114" width="46" height="28" rx="3"/><text class="sub" x="421.0" y="128.0" text-anchor="middle" dominant-baseline="central">α⁴</text></g><text class="sub2" x="452.0" y="133" text-anchor="middle">+</text><g class="u"><rect x="460" y="114" width="46" height="28" rx="3"/><text class="sub" x="483.0" y="128.0" text-anchor="middle" dominant-baseline="central">α⁵</text></g><text class="sub2" x="514.0" y="133" text-anchor="middle">+</text><g class="u"><rect x="522" y="114" width="46" height="28" rx="3"/><text class="sub" x="545.0" y="128.0" text-anchor="middle" dominant-baseline="central">α⁶</text></g><line class="tick" x1="150" y1="162" x2="568" y2="162"/><text class="cap" x="40" y="187" text-anchor="start">S − αS =</text><g class="m"><rect x="150" y="168" width="46" height="28" rx="3"/><text class="sub" x="173.0" y="182.0" text-anchor="middle" dominant-baseline="central">1</text></g><rect x="212" y="168" width="46" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="235.0" y="182.0" text-anchor="middle" dominant-baseline="central">0</text><rect x="274" y="168" width="46" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="297.0" y="182.0" text-anchor="middle" dominant-baseline="central">0</text><rect x="336" y="168" width="46" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="359.0" y="182.0" text-anchor="middle" dominant-baseline="central">0</text><rect x="398" y="168" width="46" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="421.0" y="182.0" text-anchor="middle" dominant-baseline="central">0</text><rect x="460" y="168" width="46" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="483.0" y="182.0" text-anchor="middle" dominant-baseline="central">0</text><g class="m"><rect x="522" y="168" width="46" height="28" rx="3"/><text class="sub" x="545.0" y="182.0" text-anchor="middle" dominant-baseline="central">−α⁶</text></g><text class="sub2" x="150" y="238" text-anchor="start">S × (1 − α) = 1 − α⁶,  so  S = (1 − α⁶) ÷ (1 − α)</text><text class="sub2" x="150" y="264" text-anchor="start">with α = 0.7:  S = (1 − 0.117649) ÷ 0.3 = 0.882351 ÷ 0.3 = 2.941</text><text class="cap" x="40" y="314" text-anchor="start">Write S for the sum. Multiply every term by α and each moves one place along: 1</text><text class="cap" x="40" y="334" text-anchor="start">becomes α, α becomes α², and so on, with α⁶ falling off the end. Subtract the second row from</text><text class="cap" x="40" y="354" text-anchor="start">the first: every term that appears in both cancels, leaving 1 − α⁶.</text><text class="cap" x="40" y="394" text-anchor="start">So S × (1 − α) = 1 − α⁶, and dividing gives S = (1 − α⁶) ÷ (1 − α). With α = 0.7 that is</text><text class="cap" x="40" y="414" text-anchor="start">0.882351 ÷ 0.3 = 2.941, the same as adding the six terms one by one.</text><text class="cap" x="40" y="454" text-anchor="start">With γ guesses instead of five, the term left at the end is α multiplied by itself γ + 1</text><text class="cap" x="40" y="474" text-anchor="start">times, and S is 1 minus that term, divided by 1 − α: the formula the 2022 paper gives</text><text class="cap" x="40" y="494" text-anchor="start">for the expected tokens per pass.</text></svg><figcaption>The subtraction works for any number of terms, and it shows the limit at once: the leftover power of α shrinks toward zero as drafts grow, so S can never pass 1 ÷ (1 − α).</figcaption></figure>
