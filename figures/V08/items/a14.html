<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:27</div><h3>The k-th guess counts only if it and every guess before it survive</h3><svg viewBox='0 0 680 528' role='img'><title>The k-th guess counts only if it and every guess before it survive</title><text class="hd" x="40" y="46">If each guess survives with chance 0.7, independently of the others</text><text class="cap" x="40" y="85" text-anchor="start">guess 1</text><g class="m"><rect x="150" y="66" width="294.0" height="28" rx="3"/></g><text class="sub2" x="454.0" y="85" text-anchor="start">0.7</text><text class="cap" x="40" y="125" text-anchor="start">guess 2</text><g class="m"><rect x="150" y="106" width="205.79999999999998" height="28" rx="3"/></g><text class="sub2" x="365.79999999999995" y="125" text-anchor="start">0.7 × 0.7 = 0.49</text><text class="cap" x="40" y="165" text-anchor="start">guess 3</text><g class="m"><rect x="150" y="146" width="144.05999999999997" height="28" rx="3"/></g><text class="sub2" x="304.05999999999995" y="165" text-anchor="start">0.7³ = 0.343</text><text class="cap" x="40" y="205" text-anchor="start">guess 4</text><g class="m"><rect x="150" y="186" width="100.84199999999997" height="28" rx="3"/></g><text class="sub2" x="260.842" y="205" text-anchor="start">0.7⁴ = 0.240</text><text class="cap" x="40" y="245" text-anchor="start">guess 5</text><g class="m"><rect x="150" y="226" width="70.58939999999997" height="28" rx="3"/></g><text class="sub2" x="230.58939999999996" y="245" text-anchor="start">0.7⁵ = 0.168</text><line class="axis" x1="150" y1="268" x2="570" y2="268"/><line class="tick" x1="150" y1="268" x2="150" y2="273"/><text class="sub2" x="150" y="287" text-anchor="middle">0</text><line class="tick" x1="360.0" y1="268" x2="360.0" y2="273"/><text class="sub2" x="360.0" y="287" text-anchor="middle">0.5</text><line class="tick" x1="570" y1="268" x2="570" y2="273"/><text class="sub2" x="570" y="287" text-anchor="middle">1</text><text class="sub2" x="150" y="312" text-anchor="start">chance the guess is kept</text><text class="cap" x="40" y="358" text-anchor="start">Guesses are checked left to right and the first rejection ends the pass, so guess k is</text><text class="cap" x="40" y="378" text-anchor="start">kept only if guesses 1 to k all pass. If each passes with chance α = 0.7, and one guess</text><text class="cap" x="40" y="398" text-anchor="start">passing says nothing about the next, the chances multiply: 0.7 for the first, 0.7 × 0.7</text><text class="cap" x="40" y="418" text-anchor="start">= 0.49 for the second, 0.7³ = 0.343 for the third.</text><text class="cap" x="40" y="458" text-anchor="start">Multiplying is the rule for independent events: two coins both land heads half of half</text><text class="cap" x="40" y="478" text-anchor="start">the time, a quarter. Every extra guess multiplies by another 0.7, so the fifth survives</text><text class="cap" x="40" y="498" text-anchor="start">only 0.168 of the time.</text></svg><figcaption>Every guess kept independently, at one fixed rate, is the 2022 paper's simplifying assumption. Real text is easier in some stretches than others, so read these as averages.</figcaption></figure>
