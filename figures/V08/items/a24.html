<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:43</div><h3>Frozen backbone or trained together: over 2.2× against 2.3–3.6×</h3><svg viewBox='0 0 680 478' role='img'><title>Frozen backbone or trained together: over 2.2× against 2.3–3.6×</title><text class="hd" x="40" y="46">Speed-ups the Medusa paper reports, drawn to scale</text><text class="cap" x="40" y="89" text-anchor="start">Medusa-1, frozen</text><g class="m"><rect x="250" y="70" width="156.0" height="28" rx="3"/><text class="sub" x="328.0" y="84.0" text-anchor="middle" dominant-baseline="central">over 2.2×</text></g><line class="conn" x1="410.0" y1="84" x2="432.0" y2="84" marker-end="url(#arw)"/><text class="cap" x="40" y="133" text-anchor="start">Medusa-2, together</text><g class="u"><rect x="250" y="114" width="169.0" height="28" rx="3"/></g><g class="m"><rect x="419.0" y="114" width="65.0" height="28" rx="3"/><text class="sub" x="451.5" y="128.0" text-anchor="middle" dominant-baseline="central">2.3–2.8×</text></g><rect x="484.0" y="114" width="104.0" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="536.0" y="128.0" text-anchor="middle" dominant-baseline="central">to 3.6×</text><line class="axis" x1="250" y1="158" x2="640" y2="158"/><line class="tick" x1="250" y1="158" x2="250" y2="163"/><text class="sub2" x="250" y="177" text-anchor="middle">1×</text><line class="tick" x1="380" y1="158" x2="380" y2="163"/><text class="sub2" x="380" y="177" text-anchor="middle">2×</text><line class="tick" x1="510" y1="158" x2="510" y2="163"/><text class="sub2" x="510" y="177" text-anchor="middle">3×</text><line class="tick" x1="640" y1="158" x2="640" y2="163"/><text class="sub2" x="640" y="177" text-anchor="middle">4×</text><text class="sub2" x="250" y="202" text-anchor="start">dashed: the first version's upper end, from a single category</text><text class="cap" x="40" y="248" text-anchor="start">Training nudges weights to make a loss smaller ({{fig:v06-o004}}). Medusa-1 trains only</text><text class="cap" x="40" y="268" text-anchor="start">the heads: the original model, the backbone, is frozen, so its own outputs cannot</text><text class="cap" x="40" y="288" text-anchor="start">change. The paper reports over 2.2 times without compromising generation quality.</text><text class="cap" x="40" y="328" text-anchor="start">Medusa-2 trains the backbone along with the heads. The heads get more accurate and the</text><text class="cap" x="40" y="348" text-anchor="start">speed-up larger, but the model itself has changed, so it needs a training recipe that</text><text class="cap" x="40" y="368" text-anchor="start">protects what the model already did well.</text><text class="cap" x="40" y="408" text-anchor="start">The paper's first version gave Medusa-2 as 2.3 to 3.6 times; its published version gives</text><text class="cap" x="40" y="428" text-anchor="start">2.3 to 2.8. The 3.6 is the best single category, extraction, at 3.62 times on a 7B</text><text class="cap" x="40" y="448" text-anchor="start">model.</text></svg><figcaption>Freezing buys safety: the model you deployed is the model you tested. Training them together buys speed, at the price of a new model to validate.</figcaption></figure>
