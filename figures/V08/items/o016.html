<figure><div class='ts'>Fig 16 &nbsp;&middot;&nbsp; 14:00</div><h3>Two kinds of answer</h3><svg viewBox="0 0 680 300" role="img"><title>Two kinds of answer</title><g class="s"><rect x="40" y="55" width="285" height="78" rx="8"></rect><text class="lbl" x="182.5" y="77.0" text-anchor="middle" dominant-baseline="central">Keep every token</text><text class="sub" x="182.5" y="95.0" text-anchor="middle" dominant-baseline="central">spread the cache across devices,</text><text class="sub" x="182.5" y="112.0" text-anchor="middle" dominant-baseline="central">and stay exact</text></g><g class="h"><rect x="368" y="55" width="272" height="78" rx="8"></rect><text class="lbl" x="504.0" y="77.0" text-anchor="middle" dominant-baseline="central">Everything else</text><text class="sub" x="504.0" y="95.0" text-anchor="middle" dominant-baseline="central">attend to fewer, store fewer,</text><text class="sub" x="504.0" y="112.0" text-anchor="middle" dominant-baseline="central">or keep them out entirely</text></g><text class="cap" x="40" y="178" text-anchor="start">Ring attention holds a slice of the sequence on each device and passes blocks around a ring</text><text class="cap" x="40" y="198" text-anchor="start">until every query has seen everyone. The result stays exact, and what it needs is an</text><text class="cap" x="40" y="218" text-anchor="start">interconnect fast enough to hide those transfers behind the arithmetic.</text><text class="cap" x="40" y="258" text-anchor="start">The three families that follow all give something up. Each of them can drop the very token the</text><text class="cap" x="40" y="278" text-anchor="start">answer needed. In ring attention that token is still there.</text></svg><figcaption>Worth holding the distinction. One of these is a distribution problem with an exact answer; the other three are approximations with a failure mode.</figcaption></figure>
