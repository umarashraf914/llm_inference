dth="84" height="26" rx="3"/><text class="sub" x="532.0" y="219.0" text-anchor="middle" dominant-baseline="central">no</text></g><text class="sub2" x="590" y="224" text-anchor="start">Part 7</text><text class="cap" x="40" y="258" text-anchor="start">sinks + window</text><g class="h"><rect x="214" y="240" width="84" height="26" rx="3"/><text class="sub" x="256.0" y="253.0" text-anchor="middle" dominant-baseline="central">no</text></g><g class="s"><rect x="306" y="240" width="84" height="26" rx="3"/><text class="sub" x="348.0" y="253.0" text-anchor="middle" dominant-baseline="central">yes</text></g><g class="s"><rect x="398" y="240" width="84" height="26" rx="3"/><text class="sub" x="440.0" y="253.0" text-anchor="middle" dominant-baseline="central">yes</text></g><g class="h"><rect x="490" y="240" width="84" height="26" rx="3"/><text class="sub" x="532.0" y="253.0" text-anchor="middle" dominant-baseline="central">no</text></g><text class="sub2" x="590" y="258" text-anchor="start">Part 8</text><text class="cap" x="40" y="292" text-anchor="start">H2O and SnapKV</text><g class="h"><rect x="214" y="274" width="84" height="26" rx="3"/><text class="sub" x="256.0" y="287.0" text-anchor="middle" dominant-baseline="central">no</text></g><g class="s"><rect x="306" y="274" width="84" height="26" rx="3"/><text class="sub" x="348.0" y="287.0" text-anchor="middle" dominant-baseline="central">yes</text></g><g class="s"><rect x="398" y="274" width="84" height="26" rx="3"/><text class="sub" x="440.0" y="287.0" text-anchor="middle" dominant-baseline="central">yes</text></g><g class="h"><rect x="490" y="274" width="84" height="26" rx="3"/><text class="sub" x="532.0" y="287.0" text-anchor="middle" dominant-baseline="central">no</text></g><text class="sub2" x="590" y="292" text-anchor="start">Part 8</text><text class="cap" x="40" y="326" text-anchor="start">quantized cache</text><g class="u"><rect x="214" y="308" width="84" height="26" rx="3"/><text class="sub" x="256.0" y="321.0" text-anchor="middle" dominant-baseline="central">yes</text></g><g class="s"><rect x="306" y="308" width="84" height="26" rx="3"/><text class="sub" x="348.0" y="321.0" text-anchor="middle" dominant-baseline="central">yes</text></g><g class="s"><rect x="398" y="308" width="84" height="26" rx="3"/><text class="sub" x="440.0" y="321.0" text-anchor="middle" dominant-baseline="central">yes</text></g><g class="h"><rect x="490" y="308" width="84" height="26" rx="3"/><text class="sub" x="532.0" y="321.0" text-anchor="middle" dominant-baseline="central">no</text></g><text class="sub2" x="590" y="326" text-anchor="start">Part 8</text><text class="cap" x="40" y="360" text-anchor="start">retrieval</text><g class="h"><rect x="214" y="342" width="84" height="26" rx="3"/><text class="sub" x="256.0" y="355.0" text-anchor="middle" dominant-baseline="central">no</text></g><g class="s"><rect x="306" y="342" width="84" height="26" rx="3"/><text class="sub" x="348.0" y="355.0" text-anchor="middle" dominant-baseline="central">yes</text></g><g class="s"><rect x="398" y="342" width="84" height="26" rx="3"/><text class="sub" x="440.0" y="355.0" text-anchor="middle" dominant-baseline="central">yes</text></g><g class="h"><rect x="490" y="342" width="84" height="26" rx="3"/><text class="sub" x="532.0" y="355.0" text-anchor="middle" dominant-baseline="central">no</text></g><text class="sub2" x="590" y="360" text-anchor="start">Part 9</text><text class="cap" x="40" y="406" text-anchor="start">Ring attention is the only row that gives nothing up: every token is still there and the</text><text class="cap" x="40" y="426" text-anchor="start">answer is exact. It saves no bytes either; it spreads them over more devices.</text><text class="cap" x="40" y="466" text-anchor="start">Every other row saves bytes, teal, and pays for it in red: it attends to fewer tokens</text><text class="cap" x="40" y="486" text-anchor="start">(Part 7), stores fewer of them (Part 8), or keeps them out of the context in the first</text><text class="cap" x="40" y="506" text-anchor="start">place (Part 9). Each of those can drop the very token the answer needed. In ring</text><text class="cap" x="40" y="526" text-anchor="start">attention, that token is still there.</text></svg><figcaption>The map for the next three parts. Read each row as a trade: the teal cells are what it saves, the red ones what it costs.</figcaption></figure>
