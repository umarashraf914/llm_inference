<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 20:38</div><h3>A chunk's vector places similar meanings close together</h3><svg viewBox='0 0 680 496' role='img'><title>A chunk's vector places similar meanings close together</title><text class="hd" x="40" y="46">A shop's help pages as points (schematic: real vectors have hundreds of numbers)</text><rect x="60" y="70" width="580" height="236" rx="8" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="u"><rect x="136" y="108" width="8" height="8" rx="4"/></g><text class="sub2" x="150" y="116" text-anchor="start">returns: 30 days</text><g class="u"><rect x="186" y="140" width="8" height="8" rx="4"/></g><text class="sub2" x="200" y="148" text-anchor="start">refunds to your card</text><g class="u"><rect x="124" y="164" width="8" height="8" rx="4"/></g><text class="sub2" x="138" y="172" text-anchor="start">exchanging a size</text><g class="u"><rect x="416" y="96" width="8" height="8" rx="4"/></g><text class="sub2" x="430" y="104" text-anchor="start">delivery: 3 to 5 days</text><g class="u"><rect x="448" y="128" width="8" height="8" rx="4"/></g><text class="sub2" x="462" y="136" text-anchor="start">express shipping</text><g class="u"><rect x="400" y="158" width="8" height="8" rx="4"/></g><text class="sub2" x="414" y="166" text-anchor="start">tracking a parcel</text><g class="u"><rect x="426" y="242" width="8" height="8" rx="4"/></g><text class="sub2" x="440" y="250" text-anchor="start">store opening hours</text><g class="u"><rect x="466" y="274" width="8" height="8" rx="4"/></g><text class="sub2" x="480" y="282" text-anchor="start">finding a store</text><g class="u"><rect x="116" y="246" width="8" height="8" rx="4"/></g><text class="sub2" x="130" y="254" text-anchor="start">jobs at the shop</text><g class="u"><rect x="156" y="278" width="8" height="8" rx="4"/></g><text class="sub2" x="170" y="286" text-anchor="start">internships</text><g class="h"><rect x="251" y="85" width="10" height="10" rx="5"/></g><text class="sub2" x="268" y="94" text-anchor="start">the question:</text><text class="sub2" x="268" y="110" text-anchor="start">can I send a jacket back?</text><text class="cap" x="40" y="346" text-anchor="start">An embedding model turns each chunk into a list of numbers, a vector ({{fig:v01-o084}}),</text><text class="cap" x="40" y="366" text-anchor="start">trained so that chunks saying similar things get similar numbers. Each number is a</text><text class="cap" x="40" y="386" text-anchor="start">coordinate, so each chunk is a point.</text><text class="cap" x="40" y="426" text-anchor="start">Drawn in two dimensions, the help pages fall into neighbourhoods: returns near refunds,</text><text class="cap" x="40" y="446" text-anchor="start">delivery near tracking. The question, encoded the same way, lands among the returns</text><text class="cap" x="40" y="466" text-anchor="start">pages without sharing a single word with them.</text></svg><figcaption>Schematic, since nobody can draw hundreds of dimensions. What carries over is the geometry: close means similar, and closeness is all the search will use.</figcaption></figure>
