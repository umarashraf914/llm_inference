<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 29:21</div><h3>Five ways to get more out of every byte that crosses the bus</h3><svg viewBox='0 0 680 440' role='img'><title>Five ways to get more out of every byte that crosses the bus</title><text class="hd" x="40" y="46">Eight episodes, one target</text><g class="m"><rect x="40" y="70" width="200" height="34" rx="4"/><text class="sub" x="140.0" y="87.0" text-anchor="middle" dominant-baseline="central">speculative decoding</text></g><line class="conn" x1="246" y1="87" x2="264" y2="87" marker-end="url(#arw)"/><g class="u"><rect x="270" y="70" width="370" height="34" rx="4"/><text class="sub" x="455.0" y="87.0" text-anchor="middle" dominant-baseline="central">several tokens from a single weight read</text></g><g class="s"><rect x="40" y="116" width="200" height="34" rx="4"/><text class="sub" x="140.0" y="133.0" text-anchor="middle" dominant-baseline="central">ring attention</text></g><line class="conn" x1="246" y1="133" x2="264" y2="133" marker-end="url(#arw)"/><g class="u"><rect x="270" y="116" width="370" height="34" rx="4"/><text class="sub" x="455.0" y="133.0" text-anchor="middle" dominant-baseline="central">spread the cache across devices</text></g><g class="s"><rect x="40" y="162" width="200" height="34" rx="4"/><text class="sub" x="140.0" y="179.0" text-anchor="middle" dominant-baseline="central">sparse attention</text></g><line class="conn" x1="246" y1="179" x2="264" y2="179" marker-end="url(#arw)"/><g class="u"><rect x="270" y="162" width="370" height="34" rx="4"/><text class="sub" x="455.0" y="179.0" text-anchor="middle" dominant-baseline="central">read less of it each step</text></g><g class="s"><rect x="40" y="208" width="200" height="34" rx="4"/><text class="sub" x="140.0" y="225.0" text-anchor="middle" dominant-baseline="central">cache eviction</text></g><line class="conn" x1="246" y1="225" x2="264" y2="225" marker-end="url(#arw)"/><g class="u"><rect x="270" y="208" width="370" height="34" rx="4"/><text class="sub" x="455.0" y="225.0" text-anchor="middle" dominant-baseline="central">delete parts of it outright</text></g><g class="s"><rect x="40" y="254" width="200" height="34" rx="4"/><text class="sub" x="140.0" y="271.0" text-anchor="middle" dominant-baseline="central">retrieval</text></g><line class="conn" x1="246" y1="271" x2="264" y2="271" marker-end="url(#arw)"/><g class="u"><rect x="270" y="254" width="370" height="34" rx="4"/><text class="sub" x="455.0" y="271.0" text-anchor="middle" dominant-baseline="central">keep the context short enough that it never grows</text></g><text class="cap" x="40" y="330" text-anchor="start">Every one is a way of getting more useful work out of every byte that crosses the memory</text><text class="cap" x="40" y="350" text-anchor="start">bus, and goodput decides whether any of it arrived inside its deadline.</text><text class="cap" x="40" y="390" text-anchor="start">Each arrived on its own, answering its own bottleneck, and we have met them one at a</text><text class="cap" x="40" y="410" text-anchor="start">time. A request arriving in production meets all of them at once, in a single pass.</text></svg><figcaption>The hand-off to the final episode, which follows one real request into a rack of 72 GPUs, from the routing decision that picks its machine to the last token it streams back.</figcaption></figure>
