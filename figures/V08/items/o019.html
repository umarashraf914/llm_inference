<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 17:11</div><h3>Moonshot's MoBA routes each query to the few blocks it needs</h3><svg viewBox='0 0 680 436' role='img'><title>Moonshot's MoBA routes each query to the few blocks it needs</title><text class="hd" x="40" y="46">Mixture of block attention: cut the context into blocks, send each query to a few</text><g class="u"><rect x="40" y="74" width="92" height="44" rx="8"/><text class="lbl" x="86.0" y="96.0" text-anchor="middle" dominant-baseline="central">query</text></g><g class="u"><rect x="160" y="74" width="54" height="44" rx="4"/><text class="sub" x="187.0" y="96.0" text-anchor="middle" dominant-baseline="central">block 1</text></g><g class="u"><rect x="220" y="74" width="54" height="44" rx="4"/><text class="sub" x="247.0" y="96.0" text-anchor="middle" dominant-baseline="central">block 2</text></g><g class="s"><rect x="280" y="74" width="54" height="44" rx="4"/><text class="sub" x="307.0" y="96.0" text-anchor="middle" dominant-baseline="central">block 3</text></g><text class="sub2" x="307.0" y="136" text-anchor="middle">kept</text><g class="u"><rect x="340" y="74" width="54" height="44" rx="4"/><text class="sub" x="367.0" y="96.0" text-anchor="middle" dominant-baseline="central">block 4</text></g><g class="s"><rect x="400" y="74" width="54" height="44" rx="4"/><text class="sub" x="427.0" y="96.0" text-anchor="middle" dominant-baseline="central">block 5</text></g><text class="sub2" x="427.0" y="136" text-anchor="middle">kept</text><g class="u"><rect x="460" y="74" width="54" height="44" rx="4"/><text class="sub" x="487.0" y="96.0" text-anchor="middle" dominant-baseline="central">block 6</text></g><g class="u"><rect x="520" y="74" width="54" height="44" rx="4"/><text class="sub" x="547.0" y="96.0" text-anchor="middle" dominant-baseline="central">block 7</text></g><g class="s"><rect x="580" y="74" width="54" height="44" rx="4"/><text class="sub" x="607.0" y="96.0" text-anchor="middle" dominant-baseline="central">block 8</text></g><text class="sub2" x="607.0" y="136" text-anchor="middle">own</text><text class="sub2" x="160" y="166" text-anchor="start">a top-k gate, with no weights of its own, picks which blocks the query reads</text><text class="cap" x="40" y="206" text-anchor="start">Moonshot's mixture of block attention, MoBA, routes queries instead of compressing</text><text class="cap" x="40" y="226" text-anchor="start">tokens. It cuts the context into blocks and puts a gate in front of them, so each query</text><text class="cap" x="40" y="246" text-anchor="start">goes only to the blocks it needs. That is the mixture-of-experts idea from episode 6</text><text class="cap" x="40" y="266" text-anchor="start">({{fig:v06-o010}}) applied to attention instead of to the feed-forward network: the</text><text class="cap" x="40" y="286" text-anchor="start">blocks play the experts.</text><text class="cap" x="40" y="326" text-anchor="start">The model decides where to attend instead of being handed a fixed pattern, which MoBA's</text><text class="cap" x="40" y="346" text-anchor="start">authors call a less-structure principle. The same mechanism can fall back to full</text><text class="cap" x="40" y="366" text-anchor="start">attention whenever it needs to: layers switch between the two, and the authors'</text><text class="cap" x="40" y="386" text-anchor="start">million-token model keeps its last three layers full. Moonshot deployed it to serve</text><text class="cap" x="40" y="406" text-anchor="start">Kimi's long-context requests.</text></svg><figcaption>A satisfying reuse: the routing that chose feed-forward experts works just as well choosing which part of the context to read.</figcaption></figure>
