<figure><div class='ts'>Fig 19 &nbsp;&middot;&nbsp; 17:14</div><h3>Routing queries to blocks</h3><svg viewBox="0 0 680 334" role="img"><title>Routing queries to blocks</title><text class="hd" x="40" y="46">Mixture of block attention: route the queries instead</text><g class="s"><rect x="40" y="70" width="90" height="44" rx="4"></rect><text class="sub" x="85.0" y="92.0" text-anchor="middle" dominant-baseline="central">query</text></g><g class="u"><rect x="180" y="70" width="80" height="44" rx="4"></rect><text class="sub" x="220.0" y="92.0" text-anchor="middle" dominant-baseline="central">block 1</text></g><g class="m"><rect x="272" y="70" width="80" height="44" rx="4"></rect><text class="sub" x="312.0" y="92.0" text-anchor="middle" dominant-baseline="central">block 2</text></g><g class="u"><rect x="364" y="70" width="80" height="44" rx="4"></rect><text class="sub" x="404.0" y="92.0" text-anchor="middle" dominant-baseline="central">block 3</text></g><g class="m"><rect x="456" y="70" width="80" height="44" rx="4"></rect><text class="sub" x="496.0" y="92.0" text-anchor="middle" dominant-baseline="central">block 4</text></g><g class="u"><rect x="548" y="70" width="80" height="44" rx="4"></rect><text class="sub" x="588.0" y="92.0" text-anchor="middle" dominant-baseline="central">block 5</text></g><text class="sub2" x="180" y="142" text-anchor="start">a learned gate sends each query only to the blocks it needs</text><text class="cap" x="40" y="192" text-anchor="start">That is the mixture-of-experts idea applied to attention instead of to the feed-forward network.</text><text class="cap" x="40" y="232" text-anchor="start">The model decides where to attend rather than being handed a fixed pattern, which its authors</text><text class="cap" x="40" y="252" text-anchor="start">call a less-structure principle, and the same mechanism can fall back to full attention whenever</text><text class="cap" x="40" y="272" text-anchor="start">it needs to.</text><text class="cap" x="40" y="312" text-anchor="start">Deployed to serve long-context requests in production.</text></svg><figcaption>A satisfying reuse. The router that chose feed-forward experts turns out to work just as well choosing which part of the context to read.</figcaption></figure>
