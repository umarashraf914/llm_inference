<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 18:11</div><h3>Softmax has no “none of the above”</h3><svg viewBox='0 0 680 496' role='img'><title>Softmax has no “none of the above”</title><text class="hd" x="40" y="46">Five poor matches: e to each score, then divide by the total</text><text class="sub2" x="40" y="76" text-anchor="start">token</text><text class="sub2" x="120" y="76" text-anchor="start">score</text><text class="sub2" x="200" y="76" text-anchor="start">e to the score</text><text class="sub2" x="330" y="76" text-anchor="start">share of the weight, to scale</text><text class="cap" x="40" y="106" text-anchor="start">token 1</text><text class="sub2" x="120" y="106" text-anchor="start">−3.0</text><text class="sub2" x="200" y="106" text-anchor="start">0.0498</text><g class="u"><rect x="330" y="90" width="57.34590430648628" height="24" rx="3"/></g><text class="sub2" x="397.34590430648626" y="106" text-anchor="start">0.191</text><text class="cap" x="40" y="140" text-anchor="start">token 2</text><text class="sub2" x="120" y="140" text-anchor="start">−2.8</text><text class="sub2" x="200" y="140" text-anchor="start">0.0608</text><g class="u"><rect x="330" y="124" width="70.04244568913151" height="24" rx="3"/></g><text class="sub2" x="410.0424456891315" y="140" text-anchor="start">0.233</text><text class="cap" x="40" y="174" text-anchor="start">token 3</text><text class="sub2" x="120" y="174" text-anchor="start">−3.1</text><text class="sub2" x="200" y="174" text-anchor="start">0.0450</text><g class="u"><rect x="330" y="158" width="51.88871998761825" height="24" rx="3"/></g><text class="sub2" x="391.88871998761823" y="174" text-anchor="start">0.173</text><text class="cap" x="40" y="208" text-anchor="start">token 4</text><text class="sub2" x="120" y="208" text-anchor="start">−2.9</text><text class="sub2" x="200" y="208" text-anchor="start">0.0550</text><g class="u"><rect x="330" y="192" width="63.37702571027768" height="24" rx="3"/></g><text class="sub2" x="403.3770257102777" y="208" text-anchor="start">0.211</text><text class="cap" x="40" y="242" text-anchor="start">token 5</text><text class="sub2" x="120" y="242" text-anchor="start">−3.0</text><text class="sub2" x="200" y="242" text-anchor="start">0.0498</text><g class="u"><rect x="330" y="226" width="57.34590430648628" height="24" rx="3"/></g><text class="sub2" x="397.34590430648626" y="242" text-anchor="start">0.191</text><line class="tick" x1="200" y1="264" x2="260" y2="264"/><text class="sub2" x="200" y="282" text-anchor="start">0.2605</text><text class="sub2" x="330" y="282" text-anchor="start">total 1.000</text><text class="cap" x="40" y="282" text-anchor="start">total</text><text class="cap" x="40" y="326" text-anchor="start">StreamingLLM starts with the softmax, the step that decides how a new token spreads its</text><text class="cap" x="40" y="346" text-anchor="start">attention across everything before it ({{fig:v01-o009}}). Raise e to each score and</text><text class="cap" x="40" y="366" text-anchor="start">divide by the total: the weights always add up to one.</text><text class="cap" x="40" y="406" text-anchor="start">So even when nothing in the context is a good match, the whole budget still has to land</text><text class="cap" x="40" y="426" text-anchor="start">somewhere. Five scores near −3 give each token about a fifth, exactly what five scores</text><text class="cap" x="40" y="446" text-anchor="start">near +7 would give: only the gaps between scores matter, because subtracting the same</text><text class="cap" x="40" y="466" text-anchor="start">number from every score changes nothing ({{fig:v03-o025}}).</text></svg><figcaption>There is no way to attend to nothing. Every token ends up with a sliver of weight, even the ones that match nothing, and the next figure shows where trained models learn to put it.</figcaption></figure>
