<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:09</div><h3>The arithmetic is free, by assumption</h3><svg viewBox='0 0 680 410' role='img'><title>The arithmetic is free, by assumption</title><text class="hd" x="40" y="46">Busy time at full speed, drawn to scale against the weight read</text><text class="cap" x="40" y="87" text-anchor="start">reading the weights</text><g class="h"><rect x="210" y="68" width="400.0" height="28" rx="3"/><text class="sub" x="410.0" y="82.0" text-anchor="middle" dominant-baseline="central">41.8 ms</text></g><text class="cap" x="40" y="131" text-anchor="start">arithmetic, one position</text><g class="m"><rect x="210" y="112" width="1.5" height="28" rx="0.5"/></g><text class="sub2" x="221.35490394337714" y="131" text-anchor="start">0.142 ms</text><text class="cap" x="40" y="175" text-anchor="start">arithmetic, six positions</text><g class="m"><rect x="210" y="156" width="8.129423660262892" height="28" rx="0.5"/></g><text class="sub2" x="228.1294236602629" y="175" text-anchor="start">0.85 ms, 2% of the read</text><text class="cap" x="40" y="240" text-anchor="start">Checking five guesses puts six positions through the pass, so six times the arithmetic</text><text class="cap" x="40" y="260" text-anchor="start">of a single token: 6 × 140 billion operations, 0.85 ms at full speed. The weight read</text><text class="cap" x="40" y="280" text-anchor="start">still takes 41.8 ms.</text><text class="cap" x="40" y="320" text-anchor="start">The 2022 paper assumes the extra positions run in parallel on compute that was idle</text><text class="cap" x="40" y="340" text-anchor="start">anyway, and add no wall-clock time. At batch one that is safe: six positions need 2% of</text><text class="cap" x="40" y="360" text-anchor="start">the time the read takes. It is an assumption all the same, and {{fig:v08-o009}} finds</text><text class="cap" x="40" y="380" text-anchor="start">the batch size at which it fails.</text></svg><figcaption>Six times the arithmetic and still a sliver of the read. Arithmetic was never what decode waited on, which is the only reason checking guesses can be free.</figcaption></figure>
