<figure><div class='ts'>Fig 04 &nbsp;&middot;&nbsp; 2:53</div><h3>The arithmetic is free, by assumption</h3><svg viewBox="0 0 680 302" role="img"><title>The arithmetic is free, by assumption</title><text class="cap" x="40" y="78" text-anchor="start">Arithmetic</text><g class="m"><rect x="280" y="62" width="340" height="32" rx="3"></rect><text class="sub" x="450.0" y="78.0" text-anchor="middle" dominant-baseline="central">five times as much</text></g><text class="cap" x="40" y="138" text-anchor="start">Wall-clock cost</text><g class="s"><rect x="280" y="122" width="20" height="32" rx="1"></rect></g><text class="sub2" x="310" y="141" text-anchor="start">assumed to be nothing</text><text class="cap" x="40" y="200" text-anchor="start">Five times the arithmetic compared with a single token. But arithmetic was never the bottleneck</text><text class="cap" x="40" y="220" text-anchor="start">for decode, and the extra positions run in parallel on compute that was already idle.</text><text class="cap" x="40" y="260" text-anchor="start">That assumption is doing real work in the argument, and it is the reason the technique has a</text><text class="cap" x="40" y="280" text-anchor="start">ceiling, which comes up shortly.</text></svg><figcaption>Worth noticing as an assumption rather than a fact. It holds precisely when the machine is underloaded, which is exactly when speculative decoding is used.</figcaption></figure>
