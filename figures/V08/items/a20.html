<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 7:56</div><h3>A decoding head is one matrix from the hidden state to a score per token</h3><svg viewBox='0 0 680 472.72' role='img'><title>A decoding head is one matrix from the hidden state to a score per token</title><text class="hd" x="40" y="46">Shapes to proportion: 8,192 numbers in, 128,000 scores out</text><text class="cap" x="40" y="96.36" text-anchor="start">hidden state</text><g class="u"><rect x="124" y="76" width="12" height="30.72" rx="1"/></g><text class="sub2" x="141" y="96.36" text-anchor="middle">×</text><g class="u"><rect x="150" y="76" width="480" height="30.72" rx="2"/><text class="sub" x="390.0" y="91.36" text-anchor="middle" dominant-baseline="central">the head: 8,192 × 128,000 = 1.05 billion weights</text></g><text class="cap" x="40" y="150.72" text-anchor="start">scores, 128,000</text><g class="u"><rect x="150" y="140.72" width="480" height="12" rx="1"/></g><text class="sub2" x="150" y="172.72" text-anchor="start">one score per token; softmax turns them into probabilities, and one token is chosen</text><text class="sub2" x="130" y="124.72" text-anchor="middle">8,192</text><text class="cap" x="40" y="222.72" text-anchor="start">A model's last step turns the hidden state, the 8,192 numbers its top layer hands up for</text><text class="cap" x="40" y="242.72" text-anchor="start">a position, into a score for each of its 128,000 tokens: one matrix multiply</text><text class="cap" x="40" y="262.72" text-anchor="start">({{fig:v01-o103}}), then softmax. That matrix is the decoding head,</text><text class="cap" x="40" y="282.72" text-anchor="start">8,192 × 128,000 = 1.05 billion weights, drawn here to its true proportions.</text><text class="cap" x="40" y="322.72" text-anchor="start">Medusa, from 2024, removes the second model by bolting more heads beside this one. Each</text><text class="cap" x="40" y="342.72" text-anchor="start">reads the same hidden state, and each is one extra layer plus its own matrix of this</text><text class="cap" x="40" y="362.72" text-anchor="start">same shape, started as a copy of the model's head and trained to guess a different</text><text class="cap" x="40" y="382.72" text-anchor="start">distance ahead.</text><text class="cap" x="40" y="422.72" text-anchor="start">For this 70B shape that is about 1.1 billion weights a head, 1.6% of the model each,</text><text class="cap" x="40" y="442.72" text-anchor="start">read on every step: no second model, but not free either.</text></svg><figcaption>Hidden state is the name for the vector that flows up between the layers, the residual stream of {{ref:v01-o099}}. One matrix turns it into a guess about a token; Medusa simply asks for more guesses.</figcaption></figure>
