charge before anyone has complained. Goodput per dollar is what</text><text class="cap" x="40" y="410" text-anchor="start">the whole stack is arranged around.</text></svg><figcaption>Throughput per dollar flatters a system that answers late. Goodput per dollar cannot be raised by working hard on requests nobody is still waiting for.</figcaption></figure>
