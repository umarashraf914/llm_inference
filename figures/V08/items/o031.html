<figure><div class='ts'>Fig 31 &nbsp;&middot;&nbsp; 28:26</div><h3>What the stack was worth</h3><svg viewBox="0 0 680 416" role="img"><title>What the stack was worth</title><text class="hd" x="40" y="46">The price of a fixed capability</text><text class="cap" x="40" y="92" text-anchor="start">November 2022</text><g class="h"><rect x="280" y="76" width="340" height="32" rx="3"></rect><text class="sub" x="450.0" y="92.0" text-anchor="middle" dominant-baseline="central">$20 per million tokens</text></g><text class="cap" x="40" y="152" text-anchor="start">October 2024</text><g class="s"><rect x="280" y="136" width="4" height="32" rx="1"></rect></g><text class="sub2" x="294" y="155" text-anchor="start">$0.07</text><g class="s"><rect x="190" y="190" width="300" height="42" rx="6"></rect><text class="sub" x="340.0" y="211.0" text-anchor="middle" dominant-baseline="central">more than 280x cheaper</text></g><text class="cap" x="40" y="274" text-anchor="start">The capability is held fixed and only the model changes: an 8-billion-parameter model reached</text><text class="cap" x="40" y="294" text-anchor="start">that score, running on a stack built over three years to move fewer bytes per token.</text><text class="cap" x="40" y="334" text-anchor="start">The hardware did not stand still either. Memory bandwidth roughly quadrupled over four years,</text><text class="cap" x="40" y="354" text-anchor="start">from about 2 TB/s to around 8. Compute climbed faster still.</text><text class="cap" x="40" y="394" text-anchor="start">So the gap that decode falls into is wider now than when the series started.</text></svg><figcaption>Under two years, one benchmark score held constant, and a factor of 280. Almost none of it came from the chips.</figcaption></figure>
