times</text><text class="cap" x="40" y="292" text-anchor="start">cheaper in under two years.</text><text class="cap" x="40" y="332" text-anchor="start">The capability is held fixed and only the model changes. An 8-billion-parameter model,</text><text class="cap" x="40" y="352" text-anchor="start">Gemini 1.5 Flash-8B, reached that score, running on a stack built over three years to</text><text class="cap" x="40" y="372" text-anchor="start">move fewer bytes per token. The Index's prices blend input and output prices three to</text><text class="cap" x="40" y="392" text-anchor="start">one.</text></svg><figcaption>One score held constant, and a factor of 286 in under two years. The next figure asks how much of it the chips could have supplied.</figcaption></figure>
