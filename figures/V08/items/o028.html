<figure><div class='ts'>Fig 28 &nbsp;&middot;&nbsp; 23:54</div><h3>The metric that matters for agents</h3><svg viewBox="0 0 680 432" role="img"><title>The metric that matters for agents</title><text class="hd" x="40" y="46">Agents are a different workload</text><g class="u"><rect x="40" y="70" width="600" height="34" rx="4"></rect><text class="sub" x="340.0" y="87.0" text-anchor="middle" dominant-baseline="central">about 100 tokens of history read for every token generated</text></g><text class="cap" x="40" y="150" text-anchor="start">An agent runs the model over and over, feeding the whole history back in each time. One team</text><text class="cap" x="40" y="170" text-anchor="start">called the cache hit rate the single most important metric for a production agent, because it</text><text class="cap" x="40" y="190" text-anchor="start">affects both latency and cost.</text><text class="cap" x="40" y="230" text-anchor="start">At a 0% hit rate</text><g class="h"><rect x="280" y="214" width="340" height="30" rx="3"></rect><text class="sub" x="450.0" y="229.0" text-anchor="middle" dominant-baseline="central">100 uncached reads</text></g><text class="cap" x="40" y="290" text-anchor="start">At a 90% hit rate</text><g class="s"><rect x="280" y="274" width="65" height="30" rx="3"></rect></g><text class="sub2" x="357" y="293" text-anchor="start">the equivalent of 19</text><text class="cap" x="40" y="350" text-anchor="start">A cached read costs a tenth of an uncached one, so ninety hits and ten misses come to nineteen.</text><text class="cap" x="40" y="390" text-anchor="start">For an agent, prefix caching is not an optimisation. It is the difference between viable and</text><text class="cap" x="40" y="410" text-anchor="start">not.</text></svg><figcaption>A five-fold cost difference from one cache statistic, on a workload that is almost all replayed history.</figcaption></figure>
