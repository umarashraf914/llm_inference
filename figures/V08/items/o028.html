<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 24:02</div><h3>At a 90% hit rate, 100 tokens of history cost what 19 would</h3><svg viewBox='0 0 680 404' role='img'><title>At a 90% hit rate, 100 tokens of history cost what 19 would</title><text class="hd" x="40" y="46">100 tokens of history, priced in uncached reads, drawn to scale</text><text class="cap" x="40" y="89" text-anchor="start">0% hit rate</text><g class="h"><rect x="200" y="70" width="400.0" height="28" rx="3"/><text class="sub" x="400.0" y="84.0" text-anchor="middle" dominant-baseline="central">100 uncached reads</text></g><text class="cap" x="40" y="133" text-anchor="start">90% hit rate</text><g class="s"><rect x="200" y="114" width="76.0" height="28" rx="3"/></g><text class="sub2" x="286.0" y="133" text-anchor="start">90 × 0.1 + 10 × 1 = 19</text><text class="cap" x="40" y="177" text-anchor="start">90%, misses written</text><g class="s"><rect x="200" y="158" width="86.0" height="28" rx="3"/></g><text class="sub2" x="296.0" y="177" text-anchor="start">90 × 0.1 + 10 × 1.25 = 21.5</text><text class="cap" x="40" y="234" text-anchor="start">The Manus team said the KV-cache hit rate is the single most important metric for a</text><text class="cap" x="40" y="254" text-anchor="start">production agent, because it affects both latency and cost. In Manus an agent reads</text><text class="cap" x="40" y="274" text-anchor="start">about 100 tokens of history for every token it generates.</text><text class="cap" x="40" y="314" text-anchor="start">Episode 7 priced a cached read at a tenth of an uncached one ({{fig:v07-o014}}). So at a</text><text class="cap" x="40" y="334" text-anchor="start">90% hit rate those 100 reads come out at 19. If each miss is also written to the cache</text><text class="cap" x="40" y="354" text-anchor="start">at 1.25 times the normal price, as on the same price list, it is 21.5: still under a</text><text class="cap" x="40" y="374" text-anchor="start">quarter.</text></svg><figcaption>A five-fold cost difference from one cache statistic, on a workload that is almost all replayed history.</figcaption></figure>
