<figure><div class='ts'>Fig 02 &nbsp;&middot;&nbsp; 1:14</div><h3>Drafter and target</h3><svg viewBox="0 0 680 438" role="img"><title>Drafter and target</title><text class="hd" x="40" y="46">The weights are read once per pass, however many positions are in it</text><text class="cap" x="40" y="92" text-anchor="start">Ordinary decode</text><g class="u"><rect x="240" y="76" width="60" height="32" rx="3"></rect><text class="sub" x="270.0" y="92.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="316" y="95" text-anchor="start">one position, so 140 GB produces one token</text><text class="cap" x="40" y="152" text-anchor="start">Verification</text><g class="m"><rect x="240" y="136" width="300" height="32" rx="3"></rect><text class="sub" x="390.0" y="152.0" text-anchor="middle" dominant-baseline="central">1   2   3   4   5</text></g><text class="sub2" x="556" y="155" text-anchor="start">one read covers five</text><text class="hd" x="40" y="212">The two models</text><g class="s"><rect x="40" y="232" width="285" height="78" rx="8"></rect><text class="lbl" x="182.5" y="254.0" text-anchor="middle" dominant-baseline="central">The drafter</text><text class="sub" x="182.5" y="272.0" text-anchor="middle" dominant-baseline="central">small, about 100x smaller,</text><text class="sub" x="182.5" y="289.0" text-anchor="middle" dominant-baseline="central">writes guesses one at a time</text></g><g class="h"><rect x="368" y="232" width="272" height="78" rx="8"></rect><text class="lbl" x="504.0" y="254.0" text-anchor="middle" dominant-baseline="central">The target</text><text class="sub" x="504.0" y="272.0" text-anchor="middle" dominant-baseline="central">the real model, checks the</text><text class="sub" x="504.0" y="289.0" text-anchor="middle" dominant-baseline="central">whole batch in one pass</text></g><text class="cap" x="40" y="356" text-anchor="start">Five drafter passes move roughly 7 GB in total, next to 140 for one pass of the large model.</text><text class="cap" x="40" y="396" text-anchor="start">The target takes the text so far with those five guesses appended, runs one pass over the whole</text><text class="cap" x="40" y="416" text-anchor="start">sequence, and at every position produces its own distribution over what should be there.</text></svg><figcaption>The asymmetry is the whole trick: writing guesses is sequential and cheap, checking them is parallel and expensive but happens only once.</figcaption></figure>
