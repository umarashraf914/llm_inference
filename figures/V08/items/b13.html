20" y="296" width="12" height="12" rx="2"/></g><g class="u"><rect x="534" y="296" width="12" height="12" rx="2"/></g><g class="u"><rect x="548" y="296" width="12" height="12" rx="2"/></g><g class="u"><rect x="562" y="296" width="12" height="12" rx="2"/></g><g class="u"><rect x="576" y="296" width="12" height="12" rx="2"/></g><g class="u"><rect x="590" y="296" width="12" height="12" rx="2"/></g><text class="sub2" x="380" y="330" text-anchor="start">catches 84% of the weight</text><text class="cap" x="40" y="372" text-anchor="start">DeepSeek shipped a relative of native sparse attention as DeepSeek Sparse Attention, in</text><text class="cap" x="40" y="392" text-anchor="start">DeepSeek-V3.2-Exp. It picks single tokens rather than whole blocks: for each query a</text><text class="cap" x="40" y="412" text-anchor="start">small, fast scorer, the lightning indexer, rates every earlier token, and only the 2,048</text><text class="cap" x="40" y="432" text-anchor="start">highest are read at full detail, 1.56% of a 131,072-token context.</text><text class="cap" x="40" y="472" text-anchor="start">The indexer still looks at every earlier token, so its work grows with the square of the</text><text class="cap" x="40" y="492" text-anchor="start">context, but it has few heads and works in 8-bit numbers, far cheaper per pair than the</text><text class="cap" x="40" y="512" text-anchor="start">attention it saves. Single tokens can follow the weight wherever it lands: with the same</text><text class="cap" x="40" y="532" text-anchor="start">budget here, they catch 84% of it and two whole blocks 23%.</text><text class="cap" x="40" y="572" text-anchor="start">DeepSeek cut the prices of its API, what developers pay per token, by more than half on</text><text class="cap" x="40" y="592" text-anchor="start">the same day.</text></svg><figcaption>The price cut shows the saving reached the bill on day one. The evidence that quality did not pay for it is different: on public benchmarks the new model matched the one it replaced.</figcaption></figure>
