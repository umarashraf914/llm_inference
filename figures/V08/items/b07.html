" stroke-dasharray="3 3"/><rect x="100" y="370" width="17" height="17" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="120" y="370" width="17" height="17" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="140" y="370" width="17" height="17" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="160" y="370" width="17" height="17" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="180" y="370" width="17" height="17" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="200" y="370" width="17" height="17" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="220" y="370" width="17" height="17" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="240" y="370" width="17" height="17" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="260" y="370" width="17" height="17" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="280" y="370" width="17" height="17" rx="2"/></g><g class="s"><rect x="300" y="370" width="17" height="17" rx="2"/></g><g class="s"><rect x="320" y="370" width="17" height="17" rx="2"/></g><g class="s"><rect x="340" y="370" width="17" height="17" rx="2"/></g><g class="s"><rect x="360" y="370" width="17" height="17" rx="2"/></g><text class="sub2" x="420" y="96" text-anchor="start">a window of 4:</text><text class="sub2" x="420" y="114" text-anchor="start">70 of the 136 cells</text><text class="sub2" x="420" y="150" text-anchor="start">Mistral 7B, W = 4,096, at 131,072:</text><text class="sub2" x="420" y="168" text-anchor="start">0.53 billion of 8.59 billion pairs,</text><text class="sub2" x="420" y="186" text-anchor="start">16.3 times fewer</text><text class="sub2" x="420" y="222" text-anchor="start">the newest token reads</text><text class="sub2" x="420" y="240" text-anchor="start">4,097 keys, not 131,072</text><rect x="420" y="266" width="17" height="17" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="446" y="279" text-anchor="start">outside the window: never computed</text><text class="cap" x="40" y="424" text-anchor="start">The simplest version restricts each token to a fixed window of recent ones. Mistral 7B</text><text class="cap" x="40" y="444" text-anchor="start">sets that window at 4,096 tokens: each token attends to itself and the 4,096 before it.</text><text class="cap" x="40" y="464" text-anchor="start">Every row of the triangle is cut to a band of at most W + 1 cells, however long the text</text><text class="cap" x="40" y="484" text-anchor="start">grows.</text><text class="cap" x="40" y="524" text-anchor="start">So the work grows in a straight line with the context instead of with its square. At</text><text class="cap" x="40" y="544" text-anchor="start">131,072 tokens a 4,096 window computes 16.3 times fewer pairs than the full triangle,</text><text class="cap" x="40" y="564" text-anchor="start">and at each decode step the newest token reads 4,097 keys and values instead of 131,072.</text></svg><figcaption>That looks like everything older is simply gone. It is not, and the next figure shows why.</figcaption></figure>
