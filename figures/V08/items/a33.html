<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 12:10</div><h3>The pool: fragments filed under their first token</h3><svg viewBox='0 0 680 500' role='img'><title>The pool: fragments filed under their first token</title><text class="hd" x="40" y="46">The pool after round 2, filed under each fragment's first word</text><g class="u"><rect x="60" y="66" width="70" height="26" rx="3"/><text class="sub" x="95.0" y="79.0" text-anchor="middle" dominant-baseline="central">a</text></g><g class="u"><rect x="160" y="66" width="150" height="26" rx="3"/><text class="sub" x="235.0" y="79.0" text-anchor="middle" dominant-baseline="central">a dog ran</text></g><g class="u"><rect x="60" y="102" width="70" height="26" rx="3"/><text class="sub" x="95.0" y="115.0" text-anchor="middle" dominant-baseline="central">big</text></g><g class="u"><rect x="160" y="102" width="150" height="26" rx="3"/><text class="sub" x="235.0" y="115.0" text-anchor="middle" dominant-baseline="central">big dog ran</text></g><g class="m"><rect x="60" y="138" width="70" height="26" rx="3"/><text class="sub" x="95.0" y="151.0" text-anchor="middle" dominant-baseline="central">cat</text></g><g class="m"><rect x="160" y="138" width="150" height="26" rx="3"/><text class="sub" x="235.0" y="151.0" text-anchor="middle" dominant-baseline="central">cat sat on</text></g><g class="u"><rect x="60" y="174" width="70" height="26" rx="3"/><text class="sub" x="95.0" y="187.0" text-anchor="middle" dominant-baseline="central">on</text></g><g class="u"><rect x="160" y="174" width="150" height="26" rx="3"/><text class="sub" x="235.0" y="187.0" text-anchor="middle" dominant-baseline="central">on the mat</text></g><text class="sub2" x="60" y="220" text-anchor="start">key</text><text class="sub2" x="160" y="220" text-anchor="start">fragment</text><text class="sub2" x="360" y="76" text-anchor="start">round 3: the settled text ends in ‘cat’</text><g class="m"><rect x="360" y="86" width="64" height="26" rx="3"/><text class="sub" x="392.0" y="99.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="m"><rect x="430" y="86" width="64" height="26" rx="3"/><text class="sub" x="462.0" y="99.0" text-anchor="middle" dominant-baseline="central">cat</text></g><line class="conn" x1="460" y1="116" x2="460" y2="138" marker-end="url(#arw)"/><text class="sub2" x="360" y="160" text-anchor="start">look up ‘cat’: check ‘sat on’ in the same pass</text><g class="m"><rect x="360" y="172" width="46" height="26" rx="3"/><text class="sub" x="383.0" y="185.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="m"><rect x="412" y="172" width="46" height="26" rx="3"/><text class="sub" x="435.0" y="185.0" text-anchor="middle" dominant-baseline="central">cat</text></g><g class="m"><rect x="464" y="172" width="46" height="26" rx="3"/><text class="sub" x="487.0" y="185.0" text-anchor="middle" dominant-baseline="central">sat</text></g><g class="m"><rect x="516" y="172" width="46" height="26" rx="3"/><text class="sub" x="539.0" y="185.0" text-anchor="middle" dominant-baseline="central">on</text></g><g class="m"><rect x="568" y="172" width="46" height="26" rx="3"/><text class="sub" x="591.0" y="185.0" text-anchor="middle" dominant-baseline="central">the</text></g><text class="sub2" x="360" y="222" text-anchor="start">‘sat’ and ‘on’ check out, plus the next</text><text class="sub2" x="360" y="240" text-anchor="start">word: three settled in one round</text><text class="cap" x="40" y="270" text-anchor="start">Lookahead keeps every fragment the rounds produce in a pool, filed under its first word.</text><text class="cap" x="40" y="290" text-anchor="start">Each time the model emits a real token, the pass also pulls out the fragments that begin</text><text class="cap" x="40" y="310" text-anchor="start">with that token and checks them, exactly as a drafter's guesses are checked.</text><text class="cap" x="40" y="350" text-anchor="start">When round 3 begins, the settled text ends in ‘cat’, and the pool holds ‘cat sat on’.</text><text class="cap" x="40" y="370" text-anchor="start">Both ‘sat’ and ‘on’ check out, and the check also yields the word after them, as it</text><text class="cap" x="40" y="390" text-anchor="start">would for any drafter, so positions 3, 4 and 5 settle at once. In round 4 the fragment</text><text class="cap" x="40" y="410" text-anchor="start">‘the mat .’ finishes the sentence: four rounds instead of six.</text><text class="cap" x="40" y="450" text-anchor="start">The model ends up drafting for itself out of its own discarded work, with nothing extra</text><text class="cap" x="40" y="470" text-anchor="start">to train, and the check keeps the output exact.</text></svg><figcaption>The pool turns Jacobi iteration's waste into a free drafter. Its guesses are only as good as the fragments the rounds happen to produce, which is why its speed-ups are modest.</figcaption></figure>
