<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:26</div><h3>A tree holds several continuations at once, sharing their beginnings</h3><svg viewBox='0 0 680 428' role='img'><title>A tree holds several continuations at once, sharing their beginnings</title><text class="hd" x="40" y="46">A tree: one start, branching into alternatives</text><line class="conn" x1="340.0" y1="106" x2="210.0" y2="130"/><line class="conn" x1="340.0" y1="106" x2="470.0" y2="130"/><line class="conn" x1="210.0" y1="168" x2="210.0" y2="192"/><line class="conn" x1="470.0" y1="168" x2="470.0" y2="192"/><g class="u"><rect x="280" y="70" width="120" height="34" rx="3"/><text class="sub" x="340.0" y="87.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="m"><rect x="150" y="132" width="120" height="34" rx="3"/><text class="sub" x="210.0" y="149.0" text-anchor="middle" dominant-baseline="central">cat</text></g><g class="m"><rect x="410" y="132" width="120" height="34" rx="3"/><text class="sub" x="470.0" y="149.0" text-anchor="middle" dominant-baseline="central">dog</text></g><g class="m"><rect x="150" y="194" width="120" height="34" rx="3"/><text class="sub" x="210.0" y="211.0" text-anchor="middle" dominant-baseline="central">sat</text></g><g class="m"><rect x="410" y="194" width="120" height="34" rx="3"/><text class="sub" x="470.0" y="211.0" text-anchor="middle" dominant-baseline="central">ran</text></g><text class="sub2" x="210.0" y="254" text-anchor="middle">path: the cat sat</text><text class="sub2" x="470.0" y="254" text-anchor="middle">path: the dog ran</text><text class="cap" x="40" y="298" text-anchor="start">Each path from the top is one possible continuation: ‘the cat sat’ and ‘the dog ran’. A</text><text class="cap" x="40" y="318" text-anchor="start">shared beginning is stored once, so five tokens hold two three-token guesses.</text><text class="cap" x="40" y="358" text-anchor="start">Check the whole tree in one pass, then keep the longest path that survives. A single</text><text class="cap" x="40" y="378" text-anchor="start">chain would have to be abandoned at its first mistake; a tree still has the other</text><text class="cap" x="40" y="398" text-anchor="start">branch.</text></svg><figcaption>At most one path survives. What branching buys is a better chance that the surviving path is long; {{ref:v08-a22}} counts how much better.</figcaption></figure>
