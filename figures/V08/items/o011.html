<figure><div class='ts'>Fig 11 &nbsp;&middot;&nbsp; 7:48</div><h3>What a tree of guesses is</h3><svg viewBox="0 0 680 366" role="img"><title>What a tree of guesses is</title><text class="hd" x="40" y="46">A tree: one start, branching into alternatives</text><g class="s"><rect x="280" y="70" width="120" height="34" rx="4"></rect><text class="sub" x="340.0" y="87.0" text-anchor="middle" dominant-baseline="central">the</text></g><line class="conn" x1="340" y1="106" x2="200" y2="128"></line><line class="conn" x1="340" y1="106" x2="480" y2="128"></line><g class="m"><rect x="140" y="130" width="120" height="34" rx="4"></rect><text class="sub" x="200.0" y="147.0" text-anchor="middle" dominant-baseline="central">cat</text></g><g class="m"><rect x="420" y="130" width="120" height="34" rx="4"></rect><text class="sub" x="480.0" y="147.0" text-anchor="middle" dominant-baseline="central">dog</text></g><line class="conn" x1="200" y1="166" x2="130" y2="188"></line><line class="conn" x1="200" y1="166" x2="270" y2="188"></line><g class="u"><rect x="70" y="190" width="120" height="34" rx="4"></rect><text class="sub" x="130.0" y="207.0" text-anchor="middle" dominant-baseline="central">sat</text></g><g class="u"><rect x="210" y="190" width="120" height="34" rx="4"></rect><text class="sub" x="270.0" y="207.0" text-anchor="middle" dominant-baseline="central">ran</text></g><text class="cap" x="40" y="268" text-anchor="start">Each path from the top is one possible continuation. A tree holds several guesses at once</text><text class="cap" x="40" y="288" text-anchor="start">instead of committing to a single chain.</text><text class="cap" x="40" y="324" text-anchor="start">That matters when the guesses might be wrong: check the whole tree in one pass, then keep</text><text class="cap" x="40" y="344" text-anchor="start">whichever path survives. A single chain would have to be abandoned at the first mistake.</text></svg><figcaption>Cheap insurance. Verifying eight positions in a tree costs no more passes than verifying five in a line, and far more of them survive.</figcaption></figure>
