onn" x1="486.25" y1="189" x2="471.875" y2="207"/><g class="m"><rect x="462.875" y="208" width="18" height="14" rx="2"/></g><line class="conn" x1="486.25" y1="189" x2="500.625" y2="207"/><g class="m"><rect x="491.625" y="208" width="18" height="14" rx="2"/></g><line class="conn" x1="543.75" y1="189" x2="529.375" y2="207"/><g class="m"><rect x="520.375" y="208" width="18" height="14" rx="2"/></g><line class="conn" x1="543.75" y1="189" x2="558.125" y2="207"/><g class="m"><rect x="549.125" y="208" width="18" height="14" rx="2"/></g><line class="conn" x1="601.25" y1="189" x2="586.875" y2="207"/><g class="m"><rect x="577.875" y="208" width="18" height="14" rx="2"/></g><line class="conn" x1="601.25" y1="189" x2="615.625" y2="207"/><g class="m"><rect x="606.625" y="208" width="18" height="14" rx="2"/></g><text class="sub2" x="40" y="260" text-anchor="start">picks per head</text><text class="sub2" x="230" y="260" text-anchor="start">tokens to check</text><text class="sub2" x="400" y="260" text-anchor="start">complete paths</text><text class="cap" x="40" y="284" text-anchor="start">top 2</text><text class="sub2" x="230" y="284" text-anchor="start">2 + 4 + 8 + 16 = 30</text><text class="sub2" x="400" y="284" text-anchor="start">2⁴ = 16</text><text class="cap" x="40" y="308" text-anchor="start">top 3</text><text class="sub2" x="230" y="308" text-anchor="start">3 + 9 + 27 + 81 = 120</text><text class="sub2" x="400" y="308" text-anchor="start">3⁴ = 81</text><text class="cap" x="40" y="372" text-anchor="start">Take each head's top two picks and allow every combination: 2 choices for the next</text><text class="cap" x="40" y="392" text-anchor="start">position, each followed by 2 for the one after, and so on. Four heads give</text><text class="cap" x="40" y="412" text-anchor="start">2 + 4 + 8 + 16 = 30 tokens to check and 16 complete paths. Top three gives 120 tokens</text><text class="cap" x="40" y="432" text-anchor="start">and 81 paths.</text><text class="cap" x="40" y="472" text-anchor="start">Every node is a position in the verification pass, so a tree spends exactly the</text><text class="cap" x="40" y="492" text-anchor="start">arithmetic {{fig:v08-o009}} counted. Medusa therefore prunes it: its published tree</text><text class="cap" x="40" y="512" text-anchor="start">keeps 64 nodes, added one at a time, each the node most likely to be accepted, as</text><text class="cap" x="40" y="532" text-anchor="start">measured on sample text.</text></svg><figcaption>Combinations multiply, so trees are pruned to their likeliest branches. Positions are cheap at batch one, but they are not free.</figcaption></figure>
