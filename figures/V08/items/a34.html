><rect x="210" y="218" width="16" height="16" rx="2"/></g><g class="u"><rect x="230" y="218" width="16" height="16" rx="2"/></g><g class="u"><rect x="250" y="218" width="16" height="16" rx="2"/></g><g class="u"><rect x="270" y="218" width="16" height="16" rx="2"/></g><g class="u"><rect x="290" y="218" width="16" height="16" rx="2"/></g><g class="u"><rect x="310" y="218" width="16" height="16" rx="2"/></g><g class="u"><rect x="330" y="218" width="16" height="16" rx="2"/></g><text class="sub2" x="150" y="256" text-anchor="start">each question has a follow-up turn</text><text class="sub2" x="400" y="76" text-anchor="start">EAGLE-3, one 13B model, five benchmarks</text><text class="sub2" x="400" y="103" text-anchor="start">MT-Bench, chat</text><g class="u"><rect x="524" y="88" width="111.6" height="22" rx="3"/><text class="sub" x="579.8" y="99.0" text-anchor="middle" dominant-baseline="central">5.58×</text></g><text class="sub2" x="400" y="133" text-anchor="start">HumanEval, code</text><g class="m"><rect x="524" y="118" width="129.4" height="22" rx="3"/><text class="sub" x="588.7" y="129.0" text-anchor="middle" dominant-baseline="central">6.47×</text></g><text class="sub2" x="400" y="163" text-anchor="start">GSM8K, maths</text><g class="u"><rect x="524" y="148" width="106.4" height="22" rx="3"/><text class="sub" x="577.2" y="159.0" text-anchor="middle" dominant-baseline="central">5.32×</text></g><text class="sub2" x="400" y="193" text-anchor="start">Alpaca, instructions</text><g class="u"><rect x="524" y="178" width="103.2" height="22" rx="3"/><text class="sub" x="575.6" y="189.0" text-anchor="middle" dominant-baseline="central">5.16×</text></g><text class="sub2" x="400" y="223" text-anchor="start">CNN/DM, summaries</text><g class="u"><rect x="524" y="208" width="100.19999999999999" height="22" rx="3"/><text class="sub" x="574.1" y="219.0" text-anchor="middle" dominant-baseline="central">5.01×</text></g><text class="cap" x="40" y="302" text-anchor="start">A benchmark is a fixed set of questions with a fixed way of scoring the answers, so that</text><text class="cap" x="40" y="322" text-anchor="start">different models, or different methods, can be compared on the same exam. MT-Bench has</text><text class="cap" x="40" y="342" text-anchor="start">80 questions in eight categories, ten each, and every question has a follow-up turn; a</text><text class="cap" x="40" y="362" text-anchor="start">strong model, GPT-4, scores each answer from 1 to 10.</text><text class="cap" x="40" y="402" text-anchor="start">A speed-up is measured on a benchmark's prompts, and it depends on them, because</text><text class="cap" x="40" y="422" text-anchor="start">predictable text accepts more guesses. EAGLE-3 on one 13B model ranges from 5.0×</text><text class="cap" x="40" y="442" text-anchor="start">summarising news to 6.5× writing code; Medusa's best category, extraction, ran 3.6×</text><text class="cap" x="40" y="462" text-anchor="start">against 2.8× overall.</text><text class="cap" x="40" y="502" text-anchor="start">Lookahead decoding reports up to 1.8× on MT-Bench, a benchmark of multi-turn dialogues,</text><text class="cap" x="40" y="522" text-anchor="start">with the output still exact.</text></svg><figcaption>A speed-up belongs to the method, the model, the hardware and the prompts together. Two numbers measured on different benchmarks compare the benchmarks as much as the methods.</figcaption></figure>
