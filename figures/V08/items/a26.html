<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 9:32</div><h3>Medusa's heads all guess from one snapshot</h3><svg viewBox='0 0 680 548' role='img'><title>Medusa's heads all guess from one snapshot</title><text class="hd" x="40" y="46">Guesses for the next four positions, made two ways</text><text class="hd" x="40" y="82" text-anchor="start">Medusa's heads</text><g class="u"><rect x="40" y="96" width="130" height="120" rx="8"/><text class="lbl" x="105.0" y="139.0" text-anchor="middle" dominant-baseline="central">hidden state</text><text class="sub" x="105.0" y="157.0" text-anchor="middle" dominant-baseline="central">at the last</text><text class="sub" x="105.0" y="174.0" text-anchor="middle" dominant-baseline="central">real token</text></g><line class="conn" x1="176" y1="104" x2="196" y2="104" marker-end="url(#arw)"/><g class="m"><rect x="200" y="92" width="92" height="24" rx="3"/><text class="sub" x="246.0" y="104.0" text-anchor="middle" dominant-baseline="central">the</text></g><line class="conn" x1="176" y1="136" x2="306" y2="136" marker-end="url(#arw)"/><g class="m"><rect x="310" y="124" width="92" height="24" rx="3"/><text class="sub" x="356.0" y="136.0" text-anchor="middle" dominant-baseline="central">dog</text></g><line class="conn" x1="176" y1="168" x2="416" y2="168" marker-end="url(#arw)"/><g class="h"><rect x="420" y="156" width="92" height="24" rx="3"/><text class="sub" x="466.0" y="168.0" text-anchor="middle" dominant-baseline="central">purred</text></g><line class="conn" x1="176" y1="200" x2="526" y2="200" marker-end="url(#arw)"/><g class="m"><rect x="530" y="188" width="92" height="24" rx="3"/><text class="sub" x="576.0" y="200.0" text-anchor="middle" dominant-baseline="central">loudly</text></g><text class="sub2" x="522" y="172" text-anchor="start">assumed ‘cat’</text><text class="hd" x="40" y="262" text-anchor="start">a drafter that feeds each guess back in</text><g class="u"><rect x="40" y="276" width="130" height="40" rx="8"/><text class="lbl" x="105.0" y="296.0" text-anchor="middle" dominant-baseline="central">hidden state</text></g><line class="conn" x1="176" y1="296" x2="196" y2="296" marker-end="url(#arw)"/><g class="m"><rect x="200" y="284" width="92" height="24" rx="3"/><text class="sub" x="246.0" y="296.0" text-anchor="middle" dominant-baseline="central">the</text></g><line class="conn" x1="295" y1="296" x2="306" y2="296" marker-end="url(#arw)"/><g class="m"><rect x="310" y="284" width="92" height="24" rx="3"/><text class="sub" x="356.0" y="296.0" text-anchor="middle" dominant-baseline="central">dog</text></g><line class="conn" x1="405" y1="296" x2="416" y2="296" marker-end="url(#arw)"/><g class="m"><rect x="420" y="284" width="92" height="24" rx="3"/><text class="sub" x="466.0" y="296.0" text-anchor="middle" dominant-baseline="central">barked</text></g><line class="conn" x1="515" y1="296" x2="526" y2="296" marker-end="url(#arw)"/><g class="m"><rect x="530" y="284" width="92" height="24" rx="3"/><text class="sub" x="576.0" y="296.0" text-anchor="middle" dominant-baseline="central">loudly</text></g><text class="sub2" x="200" y="334" text-anchor="start">each arrow carries the guess into the next pass</text><text class="cap" x="40" y="378" text-anchor="start">The heads still guess several positions ahead from a single snapshot of the model's</text><text class="cap" x="40" y="398" text-anchor="start">state, taken before any of these guesses were made. The head for three ahead cannot know</text><text class="cap" x="40" y="418" text-anchor="start">that the head for two ahead picked ‘dog’, so it can guess ‘purred’, a word that only</text><text class="cap" x="40" y="438" text-anchor="start">follows ‘cat’.</text><text class="cap" x="40" y="478" text-anchor="start">A drafter that writes the normal way feeds each guess back in, so its third guess</text><text class="cap" x="40" y="498" text-anchor="start">already knows the second: ‘barked’, after ‘dog’. That costs one small pass per guess,</text><text class="cap" x="40" y="518" text-anchor="start">but the guesses hang together.</text></svg><figcaption>Speed from guessing all at once, paid for in coherence. EAGLE keeps the feeding back, and makes the drafter tiny.</figcaption></figure>
