<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 27:20</div><h3>Reinforcement learning: write attempts, score them, nudge the weights</h3><svg viewBox='0 0 680 386' role='img'><title>Reinforcement learning: write attempts, score them, nudge the weights</title><text class="hd" x="40" y="46">One step of the loop that trains a reasoning model</text><g class="h"><rect x="40" y="70" width="200" height="70" rx="8"/><text class="lbl" x="140.0" y="88.0" text-anchor="middle" dominant-baseline="central">rollout</text><text class="sub" x="140.0" y="106.0" text-anchor="middle" dominant-baseline="central">the model writes attempts:</text><text class="sub" x="140.0" y="123.0" text-anchor="middle" dominant-baseline="central">decode, token by token</text></g><g class="u"><rect x="270" y="70" width="160" height="70" rx="8"/><text class="lbl" x="350.0" y="88.0" text-anchor="middle" dominant-baseline="central">reward</text><text class="sub" x="350.0" y="106.0" text-anchor="middle" dominant-baseline="central">each attempt</text><text class="sub" x="350.0" y="123.0" text-anchor="middle" dominant-baseline="central">is scored</text></g><g class="u"><rect x="460" y="70" width="180" height="70" rx="8"/><text class="lbl" x="550.0" y="88.0" text-anchor="middle" dominant-baseline="central">update</text><text class="sub" x="550.0" y="106.0" text-anchor="middle" dominant-baseline="central">gradients nudge</text><text class="sub" x="550.0" y="123.0" text-anchor="middle" dominant-baseline="central">every weight</text></g><line class="conn" x1="244" y1="105" x2="266" y2="105" marker-end="url(#arw)"/><line class="conn" x1="434" y1="105" x2="456" y2="105" marker-end="url(#arw)"/><line class="conn" x1="550" y1="144" x2="550" y2="172"/><line class="conn" x1="550" y1="172" x2="140" y2="172"/><line class="conn" x1="140" y1="172" x2="140" y2="146" marker-end="url(#arw)"/><text class="sub2" x="345" y="192" text-anchor="middle">the next step generates with the new weights</text><text class="cap" x="40" y="236" text-anchor="start">The same shift shows up in training too. The reinforcement learning that produces</text><text class="cap" x="40" y="256" text-anchor="start">reasoning models is dominated by rollouts, where the model generates its own attempts</text><text class="cap" x="40" y="276" text-anchor="start">and they get scored.</text><text class="cap" x="40" y="316" text-anchor="start">A rollout is just inference: decode, token by token, every weight read for every token.</text><text class="cap" x="40" y="336" text-anchor="start">The update is ordinary training ({{fig:v06-o004}}): nudge every weight in the direction</text><text class="cap" x="40" y="356" text-anchor="start">that makes high-scoring attempts more likely, then generate again with the new weights.</text></svg><figcaption>A loop with inference inside it. Whatever makes decode slow makes this kind of training slow too.</figcaption></figure>
