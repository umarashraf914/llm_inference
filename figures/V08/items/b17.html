idth="20" height="5.811105964735505" rx="1"/></g><text class="sub2" x="274.0" y="308" text-anchor="middle">5</text><g class="u"><rect x="292" y="286.8740849947495" width="20" height="5.125915005250457" rx="1"/></g><text class="sub2" x="302.0" y="308" text-anchor="middle">6</text><g class="s"><rect x="320" y="251.02918040043534" width="20" height="40.97081959956466" rx="1"/></g><text class="sub2" x="330.0" y="308" text-anchor="middle">7</text><g class="s"><rect x="348" y="265.5128156464204" width="20" height="26.487184353579618" rx="1"/></g><text class="sub2" x="358.0" y="308" text-anchor="middle">8</text><g class="u"><rect x="376" y="284.97733488618155" width="20" height="7.022665113818459" rx="1"/></g><text class="sub2" x="386.0" y="308" text-anchor="middle">9</text><g class="u"><rect x="404" y="286.92922911102806" width="20" height="5.070770888971921" rx="1"/></g><text class="sub2" x="414.0" y="308" text-anchor="middle">10</text><g class="u"><rect x="432" y="287.4441099160592" width="20" height="4.555890083940818" rx="1"/></g><text class="sub2" x="442.0" y="308" text-anchor="middle">11</text><g class="s"><rect x="460" y="231.15383554844178" width="20" height="60.84616445155822" rx="1"/></g><text class="sub2" x="470.0" y="308" text-anchor="middle">12</text><g class="u"><rect x="488" y="287.6748864792104" width="20" height="4.325113520789642" rx="1"/></g><text class="sub2" x="498.0" y="308" text-anchor="middle">13</text><g class="u"><rect x="516" y="286.8082078944475" width="20" height="5.191792105552534" rx="1"/></g><text class="sub2" x="526.0" y="308" text-anchor="middle">14</text><g class="u"><rect x="544" y="283.48594081656387" width="20" height="8.514059183436151" rx="1"/></g><text class="sub2" x="554.0" y="308" text-anchor="middle">15</text><g class="u"><rect x="572" y="285.1826979054104" width="20" height="6.817302094589601" rx="1"/></g><text class="sub2" x="582.0" y="308" text-anchor="middle">16</text><line class="axis" x1="150" y1="292" x2="594" y2="292"/><text class="cap" x="40" y="308" text-anchor="start">position</text><text class="sub2" x="150" y="332" text-anchor="start">kept: positions 3, 7, 8, 12, plus the 4 window tokens themselves</text><text class="cap" x="40" y="372" text-anchor="start">SnapKV applies the same idea earlier, compressing the prompt's cache before generation</text><text class="cap" x="40" y="392" text-anchor="start">even starts. The last few prompt tokens, the observation window, attend to everything</text><text class="cap" x="40" y="412" text-anchor="start">before them; adding up the weight each earlier position receives from the window gives</text><text class="cap" x="40" y="432" text-anchor="start">that position's vote.</text><text class="cap" x="40" y="472" text-anchor="start">The top-voted positions and the window itself keep their keys and values; the rest of</text><text class="cap" x="40" y="492" text-anchor="start">the prompt's cache is dropped before the first output token. SnapKV also keeps each</text><text class="cap" x="40" y="512" text-anchor="start">chosen position's neighbours, so a fact is not cut off mid-phrase. The bet is that what</text><text class="cap" x="40" y="532" text-anchor="start">the end of the prompt, usually the question, attends to is what generation will need.</text></svg><figcaption>Cheaper than a running tally, because the vote happens once. The same blind spot: it can only judge from attention that has already happened.</figcaption></figure>
