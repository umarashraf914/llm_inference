<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:56</div><h3>Three tokens for one read of the weights: a factor of 2.86</h3><svg viewBox='0 0 680 556' role='img'><title>Three tokens for one read of the weights: a factor of 2.86</title><text class="hd" x="40" y="46">Three tokens, two ways, by bytes read</text><text class="cap" x="40" y="92" text-anchor="start">ordinary decode</text><g class="h"><rect x="240" y="76" width="380.0" height="32" rx="3"/><text class="sub" x="430.0" y="92.0" text-anchor="middle" dominant-baseline="central">3 passes × 140 GB = 420 GB</text></g><text class="cap" x="40" y="152" text-anchor="start">one speculative step</text><g class="m"><rect x="240" y="136" width="133.0" height="32" rx="3"/><text class="sub" x="306.5" y="152.0" text-anchor="middle" dominant-baseline="central">147 GB</text></g><text class="sub2" x="387.0" y="157" text-anchor="start">140 for the target, 7 for the drafter</text><g class="u"><rect x="190" y="196" width="300" height="42" rx="8"/><text class="lbl" x="340.0" y="217.0" text-anchor="middle" dominant-baseline="central">420 ÷ 147 = 2.86</text></g><text class="cap" x="40" y="286" text-anchor="start">Ordinary decode makes three tokens with three trips through the target, each reading all</text><text class="cap" x="40" y="306" text-anchor="start">140 GB: 420 GB. One speculative step makes the same three with a single read of 140 GB,</text><text class="cap" x="40" y="326" text-anchor="start">plus the 7 GB the drafter moved for its five guesses: 147 GB. That is a factor of just</text><text class="cap" x="40" y="346" text-anchor="start">under three.</text><text class="cap" x="40" y="386" text-anchor="start">So the speed-up follows the tokens each pass yields. Three tokens a pass means two</text><text class="cap" x="40" y="406" text-anchor="start">guesses survived on average, plus the one token the target always adds: the replacement</text><text class="cap" x="40" y="426" text-anchor="start">after a rejection, or the free sixth token when all five survive. Papers on later</text><text class="cap" x="40" y="446" text-anchor="start">methods report this tokens-per-pass figure as the average acceptance length; counted as</text><text class="cap" x="40" y="466" text-anchor="start">surviving guesses alone, it would be one less.</text><text class="cap" x="40" y="506" text-anchor="start">The real speed-up always lands a little under the tokens per pass, because the drafter</text><text class="cap" x="40" y="526" text-anchor="start">adds its 7 GB to every weight read.</text></svg><figcaption>Tokens per pass is the number to raise, and every method after this one is an attempt to raise it.</figcaption></figure>
