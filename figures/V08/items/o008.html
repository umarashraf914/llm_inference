<figure><div class='ts'>Fig 08 &nbsp;&middot;&nbsp; 5:47</div><h3>The arithmetic of the win</h3><svg viewBox="0 0 680 336" role="img"><title>The arithmetic of the win</title><text class="hd" x="40" y="46">Three tokens, two ways</text><text class="cap" x="40" y="92" text-anchor="start">Ordinary decode</text><g class="h"><rect x="240" y="76" width="380" height="32" rx="3"></rect><text class="sub" x="430.0" y="92.0" text-anchor="middle" dominant-baseline="central">3 passes x 140 GB = 420 GB</text></g><text class="cap" x="40" y="152" text-anchor="start">One speculative step</text><g class="s"><rect x="240" y="136" width="133" height="32" rx="3"></rect><text class="sub" x="306.5" y="152.0" text-anchor="middle" dominant-baseline="central">147 GB</text></g><text class="sub2" x="389" y="155" text-anchor="start">140 for the target, 7 for the drafter</text><g class="m"><rect x="190" y="190" width="300" height="42" rx="6"></rect><text class="sub" x="340.0" y="211.0" text-anchor="middle" dominant-baseline="central">a factor of 2.86</text></g><text class="cap" x="40" y="274" text-anchor="start">So the speed-up follows the acceptance length: the average number of drafted tokens that survive</text><text class="cap" x="40" y="294" text-anchor="start">each verification step. The real figure always lands a little under it, because the drafter adds</text><text class="cap" x="40" y="314" text-anchor="start">its 7 GB to every weight read.</text></svg><figcaption>Acceptance length is the number to optimise, and every method after this one is an attempt to raise it.</figcaption></figure>
