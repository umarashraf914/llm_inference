<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 20:46</div><h3>Nearest means the highest cosine</h3><svg viewBox='0 0 680 462' role='img'><title>Nearest means the highest cosine</title><text class="hd" x="40" y="46">The question q against three chunks A, B and C, in two dimensions</text><line class="axis" x1="53.5" y1="236" x2="339.5" y2="236"/><line class="axis" x1="190" y1="242" x2="190" y2="90.39999999999998"/><line class="tick" x1="60" y1="236" x2="60" y2="240"/><text class="sub2" x="60" y="254" text-anchor="middle">−1</text><line class="tick" x1="320" y1="236" x2="320" y2="240"/><text class="sub2" x="320" y="254" text-anchor="middle">1</text><text class="sub2" x="184" y="110" text-anchor="end">1</text><line class="tick" x1="186" y1="106" x2="190" y2="106"/><line class="mark" x1="190" y1="236" x2="294.0" y2="158.0" marker-end="url(#arw)"/><text class="sub2" x="302.0" y="168.0" text-anchor="start">q (0.8, 0.6)</text><line class="conn" x1="190" y1="236" x2="307.0" y2="184.0" marker-end="url(#arw)"/><text class="sub2" x="315.0" y="190.0" text-anchor="start">A (0.9, 0.4)</text><line class="conn" x1="190" y1="236" x2="203.0" y2="106.0" marker-end="url(#arw)"/><text class="sub2" x="211.0" y="104.0" text-anchor="start">B (0.1, 1.0)</text><line class="conn" x1="190" y1="236" x2="99.0" y2="145.0" marker-end="url(#arw)"/><text class="sub2" x="89.0" y="141.0" text-anchor="end">C (−0.7, 0.7)</text><text class="sub2" x="420" y="82" text-anchor="start"></text><text class="sub2" x="452" y="82" text-anchor="start">q · chunk</text><text class="sub2" x="524" y="82" text-anchor="start">length</text><text class="sub2" x="590" y="82" text-anchor="start">cosine</text><text class="cap" x="420" y="114" text-anchor="start">A</text><text class="sub2" x="452" y="114" text-anchor="start">0.96</text><text class="sub2" x="524" y="114" text-anchor="start">0.985</text><g class="s"><rect x="590" y="96" width="60" height="26" rx="3"/><text class="sub" x="620.0" y="109.0" text-anchor="middle" dominant-baseline="central">0.975</text></g><text class="cap" x="420" y="154" text-anchor="start">B</text><text class="sub2" x="452" y="154" text-anchor="start">0.68</text><text class="sub2" x="524" y="154" text-anchor="start">1.005</text><g class="s"><rect x="590" y="136" width="60" height="26" rx="3"/><text class="sub" x="620.0" y="149.0" text-anchor="middle" dominant-baseline="central">0.677</text></g><text class="cap" x="420" y="194" text-anchor="start">C</text><text class="sub2" x="452" y="194" text-anchor="start">−0.14</text><text class="sub2" x="524" y="194" text-anchor="start">0.990</text><g class="u"><rect x="590" y="176" width="60" height="26" rx="3"/><text class="sub" x="620.0" y="189.0" text-anchor="middle" dominant-baseline="central">−0.141</text></g><text class="sub2" x="420" y="240" text-anchor="start">A and B go in the prompt</text><text class="cap" x="40" y="292" text-anchor="start">The dot product multiplies the pairs and adds ({{fig:v03-o014}}): q · A =</text><text class="cap" x="40" y="312" text-anchor="start">0.8 × 0.9 + 0.6 × 0.4 = 0.96. Dividing by both lengths, each found by Pythagoras (|A| =</text><text class="cap" x="40" y="332" text-anchor="start">√(0.9² + 0.4²) = 0.985), gives the cosine of the angle between the two arrows: 1 for the</text><text class="cap" x="40" y="352" text-anchor="start">same direction, 0 at right angles, −1 for opposite.</text><text class="cap" x="40" y="392" text-anchor="start">A scores 0.975 and B 0.677, so with room for two they go in the prompt; C points away</text><text class="cap" x="40" y="412" text-anchor="start">and scores −0.141. The 2020 system ranked its 21 million chunks of Wikipedia by the</text><text class="cap" x="40" y="432" text-anchor="start">plain dot product, with an index that finds the top scorers without checking every one.</text></svg><figcaption>Two multiplications, an addition and a division per chunk: retrieval is a ranking by one number, which is why it can search millions of chunks for every question.</figcaption></figure>
