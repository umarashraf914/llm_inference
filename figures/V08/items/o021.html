<figure><div class='ts'>Fig 21 &nbsp;&middot;&nbsp; 18:53</div><h3>Two ways to choose what to evict</h3><svg viewBox="0 0 680 340" role="img"><title>Two ways to choose what to evict</title><g class="s"><rect x="40" y="55" width="285" height="78" rx="8"></rect><text class="lbl" x="182.5" y="85.0" text-anchor="middle" dominant-baseline="central">Keep by position</text><text class="sub" x="182.5" y="103.0" text-anchor="middle" dominant-baseline="central">the sinks and a recent window</text></g><g class="m"><rect x="368" y="55" width="272" height="78" rx="8"></rect><text class="lbl" x="504.0" y="77.0" text-anchor="middle" dominant-baseline="central">Keep by attention received</text><text class="sub" x="504.0" y="95.0" text-anchor="middle" dominant-baseline="central">a small fraction of tokens account</text><text class="sub" x="504.0" y="112.0" text-anchor="middle" dominant-baseline="central">for most of the weight</text></g><text class="cap" x="40" y="178" text-anchor="start">Keeping the heavy hitters alongside recent ones runs on about 20% of the cache. Applying the</text><text class="cap" x="40" y="198" text-anchor="start">same idea earlier compresses the prompt's cache before generation even starts.</text><text class="cap" x="40" y="238" text-anchor="start">Both estimate importance from attention that has already happened, so both can discard a token</text><text class="cap" x="40" y="258" text-anchor="start">that only becomes relevant later.</text><text class="cap" x="40" y="298" text-anchor="start">Quantizing the cache instead of evicting it keeps every token and shrinks each one, which is a</text><text class="cap" x="40" y="318" text-anchor="start">different trade with a different failure mode.</text></svg><figcaption>Position is cheap and blind; attention-received is informed but backward-looking. Neither can see what will matter next.</figcaption></figure>
