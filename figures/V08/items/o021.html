"/></g><rect x="172" y="258" width="17" height="24" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="194" y="258" width="17" height="24" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="216" y="258" width="17" height="24" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="238" y="258" width="17" height="24" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="260" y="258" width="17" height="24" rx="2"/></g><rect x="282" y="258" width="17" height="24" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="304" y="258" width="17" height="24" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="326" y="258" width="17" height="24" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="348" y="258" width="17" height="24" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="370" y="258" width="17" height="24" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="392" y="258" width="17" height="24" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="414" y="258" width="17" height="24" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="436" y="258" width="17" height="24" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="458" y="258" width="17" height="24" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="480" y="258" width="17" height="24" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="502" y="258" width="17" height="24" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="524" y="258" width="17" height="24" rx="2" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="546" y="258" width="17" height="24" rx="2"/></g><g class="s"><rect x="568" y="258" width="17" height="24" rx="2"/></g><text class="sub2" x="598" y="275" text-anchor="start">keeps 44%</text><text class="cap" x="40" y="332" text-anchor="start">H2O, the heavy-hitter oracle, is a 2023 paper with a second way to choose what to evict.</text><text class="cap" x="40" y="352" text-anchor="start">It keeps tokens by attention received rather than by position: each token's tally is the</text><text class="cap" x="40" y="372" text-anchor="start">total weight every later query has given it so far, updated at every step.</text><text class="cap" x="40" y="412" text-anchor="start">A small fraction of tokens account for most of that weight. H2O keeps those heavy</text><text class="cap" x="40" y="432" text-anchor="start">hitters alongside the most recent tokens, half the budget each, and runs on about 20% of</text><text class="cap" x="40" y="452" text-anchor="start">the cache with quality close to the full cache. Here its four slots hold 44% of the</text><text class="cap" x="40" y="472" text-anchor="start">attention received, against 29% for keeping the first two and the last two. Its top</text><text class="cap" x="40" y="492" text-anchor="start">tally is the first token: the tally finds the sink without being told.</text></svg><figcaption>Position is cheap and blind; attention received is informed but looks only backwards, which is the weakness the next two figures examine.</figcaption></figure>
