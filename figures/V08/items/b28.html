<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 24:30</div><h3>Cost per million tokens is an hourly price over an hourly output</h3><svg viewBox='0 0 680 452' role='img'><title>Cost per million tokens is an hourly price over an hourly output</title><text class="hd" x="40" y="46">$ per million tokens = ($ per hour) ÷ (tokens per hour) × 1,000,000</text><text class="cap" x="40" y="91" text-anchor="start">tokens per hour</text><g class="u"><rect x="170" y="70" width="230" height="32" rx="6"/><text class="sub" x="285.0" y="86.0" text-anchor="middle" dominant-baseline="central">51 tokens/s × 3,600 s/h</text></g><g class="u"><rect x="414" y="70" width="226" height="32" rx="6"/><text class="sub" x="527.0" y="86.0" text-anchor="middle" dominant-baseline="central">= 183,600 tokens/h</text></g><text class="cap" x="40" y="143" text-anchor="start">$ per token</text><g class="u"><rect x="170" y="122" width="230" height="32" rx="6"/><text class="sub" x="285.0" y="138.0" text-anchor="middle" dominant-baseline="central">$3 /h ÷ 183,600 tokens/h</text></g><g class="u"><rect x="414" y="122" width="226" height="32" rx="6"/><text class="sub" x="527.0" y="138.0" text-anchor="middle" dominant-baseline="central">= $0.0000163 per token</text></g><text class="cap" x="40" y="195" text-anchor="start">$ per million</text><g class="u"><rect x="170" y="174" width="230" height="32" rx="6"/><text class="sub" x="285.0" y="190.0" text-anchor="middle" dominant-baseline="central">$0.0000163 × 1,000,000</text></g><g class="h"><rect x="414" y="174" width="226" height="32" rx="6"/><text class="sub" x="527.0" y="190.0" text-anchor="middle" dominant-baseline="central">= $16.34 per million tokens</text></g><text class="sub2" x="170" y="238" text-anchor="start">the hours cancel: ($/h) ÷ (tokens/h) = $ per token</text><text class="cap" x="40" y="282" text-anchor="start">None of the latency numbers says anything about money. That comes from dividing what the</text><text class="cap" x="40" y="302" text-anchor="start">machine costs by what it actually produced: the cost of a million tokens is what you</text><text class="cap" x="40" y="322" text-anchor="start">rent the GPU for in an hour, divided by the tokens it produced in that hour.</text><text class="cap" x="40" y="362" text-anchor="start">Renting an H100 runs about $3 an hour, though across providers that spans anywhere from</text><text class="cap" x="40" y="382" text-anchor="start">$1.50 to $8. At the low end of utilisation, NVIDIA measured Llama 3.3 70B on a single</text><text class="cap" x="40" y="402" text-anchor="start">H200 serving one request at a time at 51 output tokens a second over an hour: 183,600</text><text class="cap" x="40" y="422" text-anchor="start">tokens, about 184,000. At $3 an hour that is $16.34 per million tokens.</text></svg><figcaption>Every technique in this series works on the denominator. The rent is a fixed number; the tokens per hour are what engineering changes.</figcaption></figure>
