<figure><div class='ts'>Fig 06 &nbsp;&middot;&nbsp; 3:19</div><h3>How a guess is accepted</h3><svg viewBox="0 0 680 494" role="img"><title>How a guess is accepted</title><text class="hd" x="40" y="46">The tokens that survived were written by the weaker model</text><g class="h"><rect x="40" y="70" width="285" height="78" rx="8"></rect><text class="lbl" x="182.5" y="92.0" text-anchor="middle" dominant-baseline="central">The naive rule</text><text class="sub" x="182.5" y="110.0" text-anchor="middle" dominant-baseline="central">keep a guess when the drafter</text><text class="sub" x="182.5" y="127.0" text-anchor="middle" dominant-baseline="central">was confident</text></g><g class="s"><rect x="368" y="70" width="272" height="78" rx="8"></rect><text class="lbl" x="504.0" y="100.0" text-anchor="middle" dominant-baseline="central">The rule that works</text><text class="sub" x="504.0" y="118.0" text-anchor="middle" dominant-baseline="central">compare the two probabilities</text></g><text class="cap" x="40" y="194" text-anchor="start">Keeping guesses the drafter liked means sampling from the small model, and the small model's</text><text class="cap" x="40" y="214" text-anchor="start">distribution is not the one the customer asked for.</text><text class="hd" x="40" y="264">The rule from the original paper</text><g class="s"><rect x="40" y="284" width="285" height="40" rx="4"></rect><text class="sub" x="182.5" y="304.0" text-anchor="middle" dominant-baseline="central">target probability at least as high: accept</text></g><g class="m"><rect x="368" y="284" width="272" height="40" rx="4"></rect><text class="sub" x="504.0" y="304.0" text-anchor="middle" dominant-baseline="central">lower: accept with probability pt / pd</text></g><text class="cap" x="40" y="372" text-anchor="start">A token the drafter rated at 60% and the target rated at 30% has a 50% chance of being</text><text class="cap" x="40" y="392" text-anchor="start">accepted.</text><text class="cap" x="40" y="432" text-anchor="start">A rejected token is replaced rather than dropped. The target samples the replacement from the</text><text class="cap" x="40" y="452" text-anchor="start">difference between the two distributions: its own probability for every token, minus the</text><text class="cap" x="40" y="472" text-anchor="start">drafter's, clipped at zero and renormalised.</text></svg><figcaption>Two cases and one formula. Everything about correctness rests on the second line.</figcaption></figure>
