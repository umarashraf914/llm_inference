<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:47</div><h3>Keep with probability p ÷ q, capped at one; replace what is rejected</h3><svg viewBox='0 0 680 564' role='img'><title>Keep with probability p ÷ q, capped at one; replace what is rejected</title><text class="hd" x="40" y="46">One guess x, proposed by the drafter with probability q(x)</text><g class="u"><rect x="190" y="66" width="300" height="40" rx="8"/><text class="lbl" x="340.0" y="86.0" text-anchor="middle" dominant-baseline="central">the target scores the same token: p(x)</text></g><line class="conn" x1="270" y1="108" x2="190" y2="140" marker-end="url(#arw)"/><line class="conn" x1="410" y1="108" x2="490" y2="140" marker-end="url(#arw)"/><g class="m"><rect x="40" y="144" width="285" height="54" rx="8"/><text class="lbl" x="182.5" y="162.0" text-anchor="middle" dominant-baseline="central">p(x) ≥ q(x)</text><text class="sub" x="182.5" y="180.0" text-anchor="middle" dominant-baseline="central">keep x</text></g><g class="m"><rect x="355" y="144" width="285" height="54" rx="8"/><text class="lbl" x="497.5" y="162.0" text-anchor="middle" dominant-baseline="central">p(x) &lt; q(x)</text><text class="sub" x="497.5" y="180.0" text-anchor="middle" dominant-baseline="central">keep x with probability p(x) ÷ q(x)</text></g><line class="conn" x1="497" y1="200" x2="497" y2="228" marker-end="url(#arw)"/><g class="h"><rect x="355" y="232" width="285" height="54" rx="8"/><text class="lbl" x="497.5" y="250.0" text-anchor="middle" dominant-baseline="central">otherwise reject x</text><text class="sub" x="497.5" y="268.0" text-anchor="middle" dominant-baseline="central">replace it from the leftover; stop</text></g><text class="sub2" x="40" y="226" text-anchor="start">kept guesses go on to the next one</text><text class="cap" x="40" y="334" text-anchor="start">The rule from the original 2022 paper works through the guesses one at a time. For each,</text><text class="cap" x="40" y="354" text-anchor="start">the target has its own probability for the token the drafter proposed, p(x), and the</text><text class="cap" x="40" y="374" text-anchor="start">drafter had one too, q(x).</text><text class="cap" x="40" y="414" text-anchor="start">When the target likes the token at least as much, the guess is kept outright. When it</text><text class="cap" x="40" y="434" text-anchor="start">likes it less, the guess is kept with probability p(x) ÷ q(x): a token the drafter rated</text><text class="cap" x="40" y="454" text-anchor="start">at 60% and the target at 30% is kept half the time.</text><text class="cap" x="40" y="494" text-anchor="start">A rejected guess is replaced rather than dropped. The replacement is drawn from the</text><text class="cap" x="40" y="514" text-anchor="start">leftover: the target's probability for every token minus the drafter's, negatives</text><text class="cap" x="40" y="534" text-anchor="start">clipped to zero, and what remains rescaled to add to 1. Then the pass stops.</text></svg><figcaption>Two halves, and exactness needs both: the p-over-q test, and a replacement drawn only from what the drafter left short. The next five figures work both with three tokens.</figcaption></figure>
