<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 16:08</div><h3>At 64k tokens the three branches read 5,632 keys: 8.6% of the context</h3><svg viewBox='0 0 680 762' role='img'><title>At 64k tokens the three branches read 5,632 keys: 8.6% of the context</title><text class="hd" x="40" y="46">Keys read for one query at 65,536 tokens, drawn to scale (the paper's settings)</text><text class="cap" x="40" y="83" text-anchor="start">full attention</text><g class="u"><rect x="170" y="66" width="440.0" height="24" rx="3"/><text class="sub" x="390.0" y="78.0" text-anchor="middle" dominant-baseline="central">65,536 keys</text></g><text class="cap" x="40" y="119" text-anchor="start">compression</text><g class="s"><rect x="170" y="102" width="27.5" height="24" rx="3"/></g><text class="sub2" x="207.5" y="119" text-anchor="start">4,096: one summary per 16 tokens</text><text class="cap" x="40" y="155" text-anchor="start">selection</text><g class="s"><rect x="170" y="138" width="6.875" height="24" rx="3"/></g><text class="sub2" x="186.875" y="155" text-anchor="start">1,024: 16 blocks of 64</text><text class="cap" x="40" y="191" text-anchor="start">sliding window</text><g class="s"><rect x="170" y="174" width="3.4375" height="24" rx="3"/></g><text class="sub2" x="183.4375" y="191" text-anchor="start">512: the most recent</text><text class="cap" x="40" y="235" text-anchor="start">all three</text><g class="s"><rect x="170" y="218" width="37.8125" height="24" rx="3"/></g><text class="sub2" x="217.8125" y="235" text-anchor="start">5,632, 8.6% of the context</text><text class="hd" x="40" y="284">Compression up close: blocks of 32 tokens, a new one every 16</text><g class="u"><rect x="170" y="302" width="432.0" height="14" rx="2"/></g><line class="tick" x1="170.0" y1="317" x2="170.0" y2="320"/><text class="sub2" x="170.0" y="336" text-anchor="middle">0</text><line class="tick" x1="242.0" y1="317" x2="242.0" y2="320"/><text class="sub2" x="242.0" y="336" text-anchor="middle">16</text><line class="tick" x1="314.0" y1="317" x2="314.0" y2="320"/><text class="sub2" x="314.0" y="336" text-anchor="middle">32</text><line class="tick" x1="386.0" y1="317" x2="386.0" y2="320"/><text class="sub2" x="386.0" y="336" text-anchor="middle">48</text><line class="tick" x1="458.0" y1="317" x2="458.0" y2="320"/><text class="sub2" x="458.0" y="336" text-anchor="middle">64</text><line class="tick" x1="530.0" y1="317" x2="530.0" y2="320"/><text class="sub2" x="530.0" y="336" text-anchor="middle">80</text><line class="tick" x1="602.0" y1="317" x2="602.0" y2="320"/><text class="sub2" x="602.0" y="336" text-anchor="middle">96</text><text class="cap" x="40" y="313" text-anchor="start">tokens</text><g class="s"><rect x="170.0" y="346" width="144.0" height="16" rx="2"/><text class="sub" x="242.0" y="354.0" text-anchor="middle" dominant-baseline="central">summary 1</text></g><g class="s"><rect x="242.0" y="368" width="144.0" height="16" rx="2"/><text class="sub" x="314.0" y="376.0" text-anchor="middle" dominant-baseline="central">summary 2</text></g><g class="s"><rect x="314.0" y="346" width="144.0" height="16" rx="2"/><text class="sub" x="386.0" y="354.0" text-anchor="middle" dominant-baseline="central">summary 3</text></g><g class="s"><rect x="386.0" y="368" width="144.0" height="16" rx="2"/><text class="sub" x="458.0" y="376.0" text-anchor="middle" dominant-baseline="central">summary 4</text></g><g class="s"><rect x="458.0" y="346" width="144.0" height="16" rx="2"/><text class="sub" x="530.0" y="354.0" text-anchor="middle" dominant-baseline="central">summary 5</text></g><text class="cap" x="40" y="369" text-anchor="start">blocks</text><text class="hd" x="40" y="420">Keys read per query as the context grows (the paper's Table 4)</text><text class="sub2" x="40" y="444" text-anchor="start">context</text><text class="sub2" x="170" y="444" text-anchor="start">keys read</text><text class="sub2" x="300" y="444" text-anchor="start">share</text><text class="sub2" x="420" y="444" text-anchor="start">fewer than full</text><text class="cap" x="40" y="466" text-anchor="start">8,192</text><text class="cap" x="170" y="466" text-anchor="start">2,048</text><text class="cap" x="300" y="466" text-anchor="start">25.0%</text><text class="cap" x="420" y="466" text-anchor="start">4.0 times</text><text class="cap" x="40" y="486" text-anchor="start">16,384</text><text class="cap" x="170" y="486" text-anchor="start">2,560</text><text class="cap" x="300" y="486" text-anchor="start">15.6%</text><text class="cap" x="420" y="486" text-anchor="start">6.4 times</text><text class="cap" x="40" y="506" text-anchor="start">32,768</text><text class="cap" x="170" y="506" text-anchor="start">3,584</text><text class="cap" x="300" y="506" text-anchor="start">10.9%</text><text class="cap" x="420" y="506" text-anchor="start">9.1 times</text><text class="cap" x="40" y="526" text-anchor="start">65,536</text><text class="cap" x="170" y="526" text-anchor="start">5,632</text><text class="cap" x="300" y="526" text-anchor="start">8.6%</text><text class="cap" x="420" y="526" text-anchor="start">11.6 times</text><text class="cap" x="40" y="572" text-anchor="start">The compression branch keeps one summary for every 16 tokens, each squashing a block of</text><text class="cap" x="40" y="592" text-anchor="start">32, so neighbouring blocks overlap by half: 65,536 ÷ 16 = 4,096 summaries. The selection</text><text class="cap" x="40" y="612" text-anchor="start">branch reads 16 blocks of 64 tokens at full detail, 1,024 keys. The sliding branch reads</text><text class="cap" x="40" y="632" text-anchor="start">the last 512. Together 5,632 keys, 8.6% of the context.</text><text class="cap" x="40" y="672" text-anchor="start">Decoding is limited by the bytes it reads, so reading 8.6% of the keys should make</text><text class="cap" x="40" y="692" text-anchor="start">attention about 11.6 times faster at this length, and that is the speed-up the paper</text><text class="cap" x="40" y="712" text-anchor="start">reports. Only the compression branch grows with the context, so the share keeps falling</text><text class="cap" x="40" y="732" text-anchor="start">as the context grows.</text></svg><figcaption>Two of the three branches read a fixed amount, which is why the saving grows with length: a quarter of the keys at 8k, under a tenth at 64k.</figcaption></figure>
