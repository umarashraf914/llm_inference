27.4,232.7 529.6,231.9 531.8,231.1 534.0,230.2 536.2,229.2 538.4,228.1 540.6,227.0 542.8,225.8 545.0,224.5 547.2,223.1 549.4,221.5 551.6,219.9 553.8,218.0 556.0,216.0 558.2,213.8 560.4,211.3 562.6,208.5 564.8,205.4 567.0,201.8 569.2,197.8 571.4,193.1 573.6,187.7 575.8,181.2 578.0,173.5 580.2,164.1 582.4,152.2 584.6,137.1 586.8,116.8 589.0,88.5"/><circle cx="490.0" cy="241.5" r="3.5" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2" x="484.0" y="233.5" text-anchor="end">1</text><circle cx="556.0" cy="216.0" r="3.5" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2" x="550.0" y="208.0" text-anchor="end">4</text><circle cx="578.0" cy="173.5" r="3.5" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2" x="572.0" y="165.5" text-anchor="end">9</text><circle cx="589.0" cy="88.5" r="3.5" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2" x="583.0" y="80.50000000000017" text-anchor="end">19</text><line class="tick" x1="380" y1="250" x2="380" y2="254"/><text class="sub2" x="380" y="268" text-anchor="middle">0%</text><line class="tick" x1="490.0" y1="250" x2="490.0" y2="254"/><text class="sub2" x="490.0" y="268" text-anchor="middle">50%</text><line class="tick" x1="600" y1="250" x2="600" y2="254"/><text class="sub2" x="600" y="268" text-anchor="middle">100%</text><text class="sub2" x="372" y="254.0" text-anchor="end">0</text><text class="sub2" x="372" y="169.0" text-anchor="end">10</text><text class="sub2" x="372" y="84.0" text-anchor="end">20</text><text class="sub2" x="380" y="68" text-anchor="start">average queue wait, in service times</text><text class="sub2" x="490.0" y="288" text-anchor="middle">load</text><text class="cap" x="40" y="328" text-anchor="start">So the numbers worth tracking are the ones that actually move. Tokens per second is the</text><text class="cap" x="40" y="348" text-anchor="start">product itself. Batch fullness counts how many requests share each weight read</text><text class="cap" x="40" y="368" text-anchor="start">({{fig:v07-o003}}). Queue wait, how long a request sits before it is first scheduled, which is</text><text class="cap" x="40" y="388" text-anchor="start">the queue term of TTFT, climbs before anything else when capacity runs short.</text><text class="cap" x="40" y="428" text-anchor="start">For the simplest queue, counting in service times, the time one request takes to serve,</text><text class="cap" x="40" y="448" text-anchor="start">the average wait is ρ ÷ (1 − ρ) at load ρ: 1 at 50%, 4 at 80%, 9 at 90%, 19 at 95%. A</text><text class="cap" x="40" y="468" text-anchor="start">simulation of two million requests at each load gives 1.0, 4.0, 8.8, 18.5, within 3%.</text><text class="cap" x="40" y="488" text-anchor="start">Throughput is still climbing in a straight line at 95%; the wait has already grown</text><text class="cap" x="40" y="508" text-anchor="start">nineteen-fold.</text></svg><figcaption>Throughput looks healthiest just before the queue explodes, which is why the wait, not the throughput, is the early warning. The exact numbers belong to this simple queue; the shape belongs to every queue.</figcaption></figure>
