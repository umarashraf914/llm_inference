<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 19:39</div><h3>Quantizing keeps every token, each one smaller</h3><svg viewBox='0 0 680 432' role='img'><title>Quantizing keeps every token, each one smaller</title><text class="hd" x="40" y="46">Cache per token of context in the 70B model, drawn to scale</text><text class="cap" x="40" y="88" text-anchor="start">16-bit, every token</text><g class="u"><rect x="190" y="70" width="360.0" height="26" rx="3"/></g><text class="sub2" x="560.0" y="88" text-anchor="start">327,680 bytes</text><text class="cap" x="40" y="128" text-anchor="start">8-bit, every token</text><g class="s"><rect x="190" y="110" width="180.0" height="26" rx="3"/></g><text class="sub2" x="380.0" y="128" text-anchor="start">163,840</text><text class="cap" x="40" y="168" text-anchor="start">4-bit, every token</text><g class="s"><rect x="190" y="150" width="90.0" height="26" rx="3"/></g><text class="sub2" x="290.0" y="168" text-anchor="start">81,920, before scales</text><text class="cap" x="40" y="208" text-anchor="start">evict to 20%</text><g class="h"><rect x="190" y="190" width="72.0" height="26" rx="3"/></g><text class="sub2" x="272.0" y="208" text-anchor="start">65,536 on average: 4 tokens in 5 gone</text><text class="cap" x="40" y="262" text-anchor="start">Quantizing the cache instead of evicting it keeps every token and stores each of its</text><text class="cap" x="40" y="282" text-anchor="start">numbers in fewer bits, with a shared scale restoring the range ({{fig:v04-o034}}). Episode 4</text><text class="cap" x="40" y="302" text-anchor="start">covered it in detail, including why keys and values want different treatment</text><text class="cap" x="40" y="322" text-anchor="start">({{fig:v04-o071}}).</text><text class="cap" x="40" y="362" text-anchor="start">Four-bit storage saves about as much memory as keeping a fifth of the tokens, before the</text><text class="cap" x="40" y="382" text-anchor="start">small cost of storing the scales. The difference is what is lost: eviction loses whole</text><text class="cap" x="40" y="402" text-anchor="start">tokens, quantization a little precision on all of them.</text></svg><figcaption>A different trade with a different failure mode. A slightly blurred token can still be found; an evicted one cannot.</figcaption></figure>
