<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:59</div><h3>A right fragment in the wrong place is still a right fragment</h3><svg viewBox='0 0 680 512' role='img'><title>A right fragment in the wrong place is still a right fragment</title><text class="hd" x="40" y="46">The same rounds: three words on a diagonal are a real continuation</text><text class="sub2" x="130.0" y="76" text-anchor="middle">1</text><text class="sub2" x="198.0" y="76" text-anchor="middle">2</text><text class="sub2" x="266.0" y="76" text-anchor="middle">3</text><text class="sub2" x="334.0" y="76" text-anchor="middle">4</text><text class="sub2" x="402.0" y="76" text-anchor="middle">5</text><text class="sub2" x="470.0" y="76" text-anchor="middle">6</text><text class="cap" x="40" y="103" text-anchor="start">start</text><g class="u"><rect x="100" y="86" width="60" height="24" rx="3"/><text class="sub" x="130.0" y="98.0" text-anchor="middle" dominant-baseline="central">a</text></g><g class="u"><rect x="168" y="86" width="60" height="24" rx="3"/><text class="sub" x="198.0" y="98.0" text-anchor="middle" dominant-baseline="central">cat ✓</text></g><g class="h"><rect x="236" y="86" width="60" height="24" rx="3"/><text class="sub" x="266.0" y="98.0" text-anchor="middle" dominant-baseline="central">on</text></g><g class="u"><rect x="304" y="86" width="60" height="24" rx="3"/><text class="sub" x="334.0" y="98.0" text-anchor="middle" dominant-baseline="central">big</text></g><g class="u"><rect x="372" y="86" width="60" height="24" rx="3"/><text class="sub" x="402.0" y="98.0" text-anchor="middle" dominant-baseline="central">hat</text></g><g class="u"><rect x="440" y="86" width="60" height="24" rx="3"/><text class="sub" x="470.0" y="98.0" text-anchor="middle" dominant-baseline="central">dog</text></g><text class="cap" x="40" y="137" text-anchor="start">round 1</text><g class="m"><rect x="100" y="120" width="60" height="24" rx="3"/><text class="sub" x="130.0" y="132.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="u"><rect x="168" y="120" width="60" height="24" rx="3"/><text class="sub" x="198.0" y="132.0" text-anchor="middle" dominant-baseline="central">dog</text></g><g class="u"><rect x="236" y="120" width="60" height="24" rx="3"/><text class="sub" x="266.0" y="132.0" text-anchor="middle" dominant-baseline="central">sat ✓</text></g><g class="h"><rect x="304" y="120" width="60" height="24" rx="3"/><text class="sub" x="334.0" y="132.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="u"><rect x="372" y="120" width="60" height="24" rx="3"/><text class="sub" x="402.0" y="132.0" text-anchor="middle" dominant-baseline="central">dog</text></g><g class="u"><rect x="440" y="120" width="60" height="24" rx="3"/><text class="sub" x="470.0" y="132.0" text-anchor="middle" dominant-baseline="central">.</text></g><text class="cap" x="40" y="171" text-anchor="start">round 2</text><g class="m"><rect x="100" y="154" width="60" height="24" rx="3"/><text class="sub" x="130.0" y="166.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="m"><rect x="168" y="154" width="60" height="24" rx="3"/><text class="sub" x="198.0" y="166.0" text-anchor="middle" dominant-baseline="central">cat</text></g><g class="u"><rect x="236" y="154" width="60" height="24" rx="3"/><text class="sub" x="266.0" y="166.0" text-anchor="middle" dominant-baseline="central">ran</text></g><g class="u"><rect x="304" y="154" width="60" height="24" rx="3"/><text class="sub" x="334.0" y="166.0" text-anchor="middle" dominant-baseline="central">on ✓</text></g><g class="h"><rect x="372" y="154" width="60" height="24" rx="3"/><text class="sub" x="402.0" y="166.0" text-anchor="middle" dominant-baseline="central">mat</text></g><g class="u"><rect x="440" y="154" width="60" height="24" rx="3"/><text class="sub" x="470.0" y="166.0" text-anchor="middle" dominant-baseline="central">ran</text></g><text class="cap" x="40" y="205" text-anchor="start">round 3</text><g class="m"><rect x="100" y="188" width="60" height="24" rx="3"/><text class="sub" x="130.0" y="200.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="m"><rect x="168" y="188" width="60" height="24" rx="3"/><text class="sub" x="198.0" y="200.0" text-anchor="middle" dominant-baseline="central">cat</text></g><g class="m"><rect x="236" y="188" width="60" height="24" rx="3"/><text class="sub" x="266.0" y="200.0" text-anchor="middle" dominant-baseline="central">sat</text></g><g class="u"><rect x="304" y="188" width="60" height="24" rx="3"/><text class="sub" x="334.0" y="200.0" text-anchor="middle" dominant-baseline="central">off</text></g><g class="u"><rect x="372" y="188" width="60" height="24" rx="3"/><text class="sub" x="402.0" y="200.0" text-anchor="middle" dominant-baseline="central">the ✓</text></g><g class="u"><rect x="440" y="188" width="60" height="24" rx="3"/><text class="sub" x="470.0" y="200.0" text-anchor="middle" dominant-baseline="central">.</text></g><line class="conn" x1="297" y1="111" x2="303" y2="119" marker-end="url(#arw)"/><line class="conn" x1="365" y1="145" x2="371" y2="153" marker-end="url(#arw)"/><text class="sub2" x="100" y="238" text-anchor="start">red: ‘on’, then ‘the’, then ‘mat’, each written after the one before it</text><text class="sub2" x="100" y="258" text-anchor="start">they belong at positions 4, 5 and 6; here they sit at 3, 4 and 5</text><text class="cap" x="40" y="302" text-anchor="start">Each word in a round was written by reading the word to its left in the round before. So</text><text class="cap" x="40" y="322" text-anchor="start">a word and its upper-left neighbour are a pair the model actually wrote, and a run of</text><text class="cap" x="40" y="342" text-anchor="start">such pairs down a diagonal is a real fragment: ‘on’, then ‘the’, then ‘mat’.</text><text class="cap" x="40" y="382" text-anchor="start">That fragment is right; it is just in the wrong place, one position early, and the next</text><text class="cap" x="40" y="402" text-anchor="start">round writes over it. A guess in the wrong position is not the same as a wrong guess:</text><text class="cap" x="40" y="422" text-anchor="start">the words still form a real continuation the model would produce somewhere.</text><text class="cap" x="40" y="462" text-anchor="start">The ✓ marks show the other waste: in every round a right word lands just beyond the next</text><text class="cap" x="40" y="482" text-anchor="start">position to settle, and the next round overwrites it.</text></svg><figcaption>Jacobi iteration keeps producing real continuations and then discarding them because they turned up at the wrong offset. Lookahead's whole idea is to stop discarding them.</figcaption></figure>
