<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:06</div><h3>At temperature zero, the rule becomes ‘keep the guesses the target agrees with’</h3><svg viewBox='0 0 680 470' role='img'><title>At temperature zero, the rule becomes ‘keep the guesses the target agrees with’</title><text class="hd" x="40" y="46">At temperature zero all of p sits on the target's top choice</text><text class="sub2" x="40" y="78" text-anchor="start">token</text><text class="sub2" x="120" y="78" text-anchor="start">p</text><text class="sub2" x="170" y="78" text-anchor="start">q</text><text class="sub2" x="230" y="78" text-anchor="start">min(1, p ÷ q)</text><text class="sub2" x="400" y="78" text-anchor="start">leftover, rescaled</text><text class="cap" x="40" y="108" text-anchor="start">cat</text><text class="sub2" x="120" y="108" text-anchor="start">1</text><text class="sub2" x="170" y="108" text-anchor="start">0.2</text><g class="m"><rect x="230" y="90" width="140" height="26" rx="3"/><text class="sub" x="300.0" y="103.0" text-anchor="middle" dominant-baseline="central">1: always kept</text></g><g class="u"><rect x="400" y="90" width="120" height="26" rx="3"/><text class="sub" x="460.0" y="103.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="cap" x="40" y="148" text-anchor="start">dog</text><text class="sub2" x="120" y="148" text-anchor="start">0</text><text class="sub2" x="170" y="148" text-anchor="start">0.6</text><g class="h"><rect x="230" y="130" width="140" height="26" rx="3"/><text class="sub" x="300.0" y="143.0" text-anchor="middle" dominant-baseline="central">0: always rejected</text></g><text class="sub2" x="404" y="148" text-anchor="start">0</text><text class="cap" x="40" y="188" text-anchor="start">rest</text><text class="sub2" x="120" y="188" text-anchor="start">0</text><text class="sub2" x="170" y="188" text-anchor="start">0.2</text><g class="h"><rect x="230" y="170" width="140" height="26" rx="3"/><text class="sub" x="300.0" y="183.0" text-anchor="middle" dominant-baseline="central">0: always rejected</text></g><text class="sub2" x="404" y="188" text-anchor="start">0</text><text class="cap" x="40" y="240" text-anchor="start">At temperature zero the target always writes its single most likely token, so all of p</text><text class="cap" x="40" y="260" text-anchor="start">sits on that token: 1 for cat, 0 for everything else. ({{fig:v07-o021}} shows how</text><text class="cap" x="40" y="280" text-anchor="start">temperature reshapes a distribution.)</text><text class="cap" x="40" y="320" text-anchor="start">Then p ÷ q is 1 ÷ 0.2, capped to 1, for cat, and 0 for any other token: a guess survives</text><text class="cap" x="40" y="340" text-anchor="start">exactly when it is the target's choice. The leftover is all cat, so a rejected guess is</text><text class="cap" x="40" y="360" text-anchor="start">replaced by the target's choice. That is the greedy check of {{fig:v08-a04}}, and the</text><text class="cap" x="40" y="380" text-anchor="start">text is word for word what the target would write alone.</text><text class="cap" x="40" y="420" text-anchor="start">At any other setting, p and q are the two models' distributions after the sampler has</text><text class="cap" x="40" y="440" text-anchor="start">reshaped them; the 2022 paper states the rule for those.</text></svg><figcaption>Greedy checking is not a separate method, only this rule with all of p on one token. Exact means the same distribution when sampling, and the same text when greedy.</figcaption></figure>
