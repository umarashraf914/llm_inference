<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:13</div><h3>Drag the drafter; the output does not move</h3><div class='wg'><div class='ctl'><label>cat <input type='range' min='0' max='1' step='0.05' value='0.2'><span class='val'>q 0.20</span></label><label>dog <input type='range' min='0' max='1' step='0.05' value='0.6'><span class='val'>q 0.60</span></label><label>rest <input type='range' min='0' max='1' step='0.05' value='0.2'><span class='val'>q 0.20</span></label></div><div class='ctl'><button type='button'>Sample again</button><button type='button'>Reset</button></div><svg viewBox='0 0 680 620' role='img'><title>Drag the drafter; the output does not move</title><text class="hd" x="40" y="34">Fig 05's target is fixed; the drafter is yours to move</text><text class="sub2" x="110" y="60" text-anchor="start">drafter's q: kept and rejected</text><text class="sub2" x="400" y="60" text-anchor="start">what comes out, inside p's outline</text><text class="cap" x="40" y="88" text-anchor="start">cat</text><g class="m"><rect x="110" y="70" width="40.00" height="26" rx="2" data-k="0"/></g><g class="h"><rect x="150.00" y="70" width="0.00" height="26" rx="2" data-r="0"/></g><text class="sub2" x="158.00" y="87" data-qt="0">q 0.20</text><rect x="400" y="70" width="100.0" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="400" y="70" width="40.00" height="26" rx="2" data-ok="0"/></g><g class="u"><rect x="440.00" y="70" width="60.00" height="26" rx="2" data-o="0"/></g><text class="sub2" x="400" y="111" data-ot="0">0.20 kept + 0.30 replaced</text><text class="cap" x="40" y="140" text-anchor="start">dog</text><g class="m"><rect x="110" y="122" width="60.00" height="26" rx="2" data-k="1"/></g><g class="h"><rect x="170.00" y="122" width="60.00" height="26" rx="2" data-r="1"/></g><text class="sub2" x="238.00" y="139" data-qt="1">q 0.60</text><rect x="400" y="122" width="60.0" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="400" y="122" width="60.00" height="26" rx="2" data-ok="1"/></g><g class="u"><rect x="460.00" y="122" width="0.00" height="26" rx="2" data-o="1"/></g><text class="sub2" x="400" y="163" data-ot="1">0.30 kept + 0.00 replaced</text><text class="cap" x="40" y="192" text-anchor="start">rest</text><g class="m"><rect x="110" y="174" width="40.00" height="26" rx="2" data-k="2"/></g><g class="h"><rect x="150.00" y="174" width="0.00" height="26" rx="2" data-r="2"/></g><text class="sub2" x="158.00" y="191" data-qt="2">q 0.20</text><rect x="400" y="174" width="40.0" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="400" y="174" width="40.00" height="26" rx="2" data-ok="2"/></g><g class="u"><rect x="440.00" y="174" width="0.00" height="26" rx="2" data-o="2"/></g><text class="sub2" x="400" y="215" data-ot="2">0.20 kept + 0.00 replaced</text><text class="sub2" x="40" y="240" data-sum="">kept: α = 0.70 of guesses; a rejection becomes cat 1.00 · dog 0.00 · rest 0.00</text><text class="hd" x="40" y="280">10,000 guesses, actually run through the rule</text><text class="cap" x="40" y="312" text-anchor="start">cat</text><rect x="400" y="296" width="100.0" height="22" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="u"><rect x="400" y="296" width="97.94" height="22" rx="2" data-h="0"/></g><text class="sub2" x="510.00" y="312" data-ht="0">4,897</text><text class="cap" x="40" y="346" text-anchor="start">dog</text><rect x="400" y="330" width="60.0" height="22" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="u"><rect x="400" y="330" width="61.54" height="22" rx="2" data-h="1"/></g><text class="sub2" x="471.54" y="346" data-ht="1">3,077</text><text class="cap" x="40" y="380" text-anchor="start">rest</text><rect x="400" y="364" width="40.0" height="22" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="u"><rect x="400" y="364" width="40.52" height="22" rx="2" data-h="2"/></g><text class="sub2" x="450.52" y="380" data-ht="2">2,026</text><text class="sub2" x="400" y="410" data-acc="">7,099 of 10,000 guesses kept (71.0%)</text><text class="cap" x="40" y="454" text-anchor="start">Each slider sets the drafter's weight on one token, and the three are scaled to add to</text><text class="cap" x="40" y="474" text-anchor="start">1. Move them and the left column changes: the overlap α shrinks as the drafter drifts</text><text class="cap" x="40" y="494" text-anchor="start">from the target, and the leftover moves to whichever tokens the drafter now underrates.</text><text class="cap" x="40" y="534" text-anchor="start">The right column does not move: kept plus replaced always fills p's outline. The counts</text><text class="cap" x="40" y="554" text-anchor="start">are a real sample, 10,000 guesses proposed, tested and replaced by the rule, and they</text><text class="cap" x="40" y="574" text-anchor="start">land on 0.5, 0.3 and 0.2 within sampling noise. The arithmetic was checked against the</text><text class="cap" x="40" y="594" text-anchor="start">same rule in Python.</text></svg></div><figcaption>Any drafter, any distance from the target: the output stays on p. Only the share of guesses kept moves, and with it the speed.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const P = [0.5, 0.3, 0.2], W0 = [0.2, 0.6, 0.2], SEED0 = 8, N = 10000;
  const XQ = 110, SQ = 200, XO = 400, SO = 200;
  const mulberry32 = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const fmt = (v, d = 2) => (v < 0 && +Math.abs(v).toFixed(d) !== 0 ? '−' : '') + Math.abs(v).toFixed(d);
  const fmtc = v => Math.round(v).toLocaleString('en-US');
  const sl = [...fig.querySelectorAll('input[type=range]')], val = [...fig.querySelectorAll('.val')];
  const q$ = s => fig.querySelector(s), btn = [...fig.querySelectorAll('button')];
  let seed = SEED0;
  const pick = (d, u) => { let c = 0; for (let i = 0; i < d.length; i++) { c += d[i]; if (u < c) return i; }
    for (let i = d.length - 1; i >= 0; i--) if (d[i] > 0) return i; };
  function draw() {
    const w = sl.map(s => +s.value), t = w.reduce((a, b) => a + b, 0);
    const q = t > 0 ? w.map(v => v / t) : [1 / 3, 1 / 3, 1 / 3];
    const kept = P.map((p, i) => Math.min(p, q[i])), alpha = kept.reduce((a, b) => a + b, 0);
    const left = P.map((p, i) => Math.max(0, p - q[i])), L = left.reduce((a, b) => a + b, 0);
    const share = L > 1e-12 ? left.map(v => v / L) : [0, 0, 0];
    q.forEach((v, i) => val[i].textContent = 'q ' + fmt(v));
    for (let i = 0; i < 3; i++) {
      const k = q$(`[data-k="${i}"]`), r = q$(`[data-r="${i}"]`), rep = q$(`[data-o="${i}"]`);
      k.setAttribute('width', Math.max(kept[i] * SQ, 0).toFixed(2));
      r.setAttribute('x', (XQ + kept[i] * SQ).toFixed(2));
      r.setAttribute('width', Math.max((q[i] - kept[i]) * SQ, 0).toFixed(2));
      q$(`[data-qt="${i}"]`).setAttribute('x', (XQ + q[i] * SQ + 8).toFixed(2));
      q$(`[data-qt="${i}"]`).textContent = 'q ' + fmt(q[i]);
      q$(`[data-ok="${i}"]`).setAttribute('width', Math.max(kept[i] * SO, 0).toFixed(2));
      rep.setAttribute('x', (XO + kept[i] * SO).toFixed(2));
      rep.setAttribute('width', Math.max(L * share[i] * SO, 0).toFixed(2));
      q$(`[data-ot="${i}"]`).textContent = fmt(kept[i]) + ' kept + ' + fmt(L * share[i]) + ' replaced';
    }
    q$('[data-sum]').textContent = 'kept: α = ' + fmt(alpha) + ' of guesses; a rejection becomes cat ' +
      fmt(share[0]) + ' · dog ' + fmt(share[1]) + ' · rest ' + fmt(share[2]);
    const rnd = mulberry32(seed), cnt = [0, 0, 0]; let acc = 0;
    for (let n = 0; n < N; n++) {
      const x = pick(q, rnd());
      if (rnd() < Math.min(1, P[x] / q[x])) { acc++; cnt[x]++; }
      else cnt[pick(L > 1e-12 ? share : P, rnd())]++;
    }
    for (let i = 0; i < 3; i++) {
      q$(`[data-h="${i}"]`).setAttribute('width', (cnt[i] / N * SO).toFixed(2));
      q$(`[data-ht="${i}"]`).textContent = fmtc(cnt[i]);
      q$(`[data-ht="${i}"]`).setAttribute('x', (XO + Math.max(P[i], cnt[i] / N) * SO + 10).toFixed(2));
    }
    q$('[data-acc]').textContent = fmtc(acc) + ' of ' + fmtc(N) + ' guesses kept (' + fmt(acc / N * 100, 1) + '%)';
  }
  sl.forEach(s => s.addEventListener('input', draw));
  btn[0].addEventListener('click', () => { seed += 1; draw(); });
  btn[1].addEventListener('click', () => { sl.forEach((s, i) => s.value = W0[i]); seed = SEED0; draw(); });
  draw();
})();</script></figure>
