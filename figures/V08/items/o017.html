<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 15:33</div><h3>Mistral 7B: a 4,096-token window, a 131,072-token reach in theory</h3><svg viewBox='0 0 680 432' role='img'><title>Mistral 7B: a 4,096-token window, a 131,072-token reach in theory</title><text class="hd" x="40" y="46">Mistral 7B: how far back the newest token can carry information, drawn to scale</text><text class="cap" x="40" y="93" text-anchor="start">after 1 layer</text><g class="s"><rect x="220" y="74" width="9.375" height="30" rx="3"/></g><text class="sub2" x="239.375" y="94" text-anchor="start">4,096 tokens</text><text class="cap" x="40" y="145" text-anchor="start">after 2 layers</text><g class="s"><rect x="220" y="126" width="18.75" height="30" rx="3"/></g><text class="sub2" x="248.75" y="146" text-anchor="start">8,192 tokens</text><text class="cap" x="40" y="197" text-anchor="start">after 32 layers</text><g class="s"><rect x="220" y="178" width="300.0" height="30" rx="3"/></g><text class="sub2" x="530.0" y="198" text-anchor="start">131,072 tokens, in theory</text><text class="cap" x="40" y="262" text-anchor="start">Mistral 7B sets the window at 4,096 tokens, and no single layer ever looks further back</text><text class="cap" x="40" y="282" text-anchor="start">than that. Yet after two layers the newest token carries information from 8,192 back,</text><text class="cap" x="40" y="302" text-anchor="start">and after all 32 from 131,072: about 130,000 tokens, in theory.</text><text class="cap" x="40" y="342" text-anchor="start">In theory, because that is how far information can travel, not how much of it arrives.</text><text class="cap" x="40" y="362" text-anchor="start">To cross the distance it is handed on 32 times through intermediate tokens, mixed at</text><text class="cap" x="40" y="382" text-anchor="start">each layer with everything else they attend to. Mistral's paper itself calls it a</text><text class="cap" x="40" y="402" text-anchor="start">theoretical attention span.</text></svg><figcaption>The reach is real but thin. A window makes distant information possible, not dependable.</figcaption></figure>
