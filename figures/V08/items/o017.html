<figure><div class='ts'>Fig 17 &nbsp;&middot;&nbsp; 14:46</div><h3>The sliding window</h3><svg viewBox="0 0 680 472" role="img"><title>The sliding window</title><text class="hd" x="40" y="46">A sliding window, and why it reaches further than it looks</text><text class="cap" x="40" y="92" text-anchor="start">after 1 layer</text><g class="s"><rect x="220" y="74" width="10.625" height="30" rx="3"></rect></g><text class="sub2" x="240.625" y="92" text-anchor="start">4,096 tokens</text><text class="cap" x="40" y="144" text-anchor="start">after 2 layers</text><g class="s"><rect x="220" y="126" width="21.25" height="30" rx="3"></rect></g><text class="sub2" x="251.25" y="144" text-anchor="start">8,192 tokens</text><text class="cap" x="40" y="196" text-anchor="start">after 32 layers</text><g class="s"><rect x="220" y="178" width="340.0" height="30" rx="3"></rect></g><text class="sub2" x="570.0" y="196" text-anchor="start">131,072 tokens</text><text class="cap" x="40" y="250" text-anchor="start">Each token is restricted to a window of recent ones, set at 4,096 in one well-known model.</text><text class="cap" x="40" y="270" text-anchor="start">That looks like everything older is gone. It is not, because the tokens inside that window have</text><text class="cap" x="40" y="290" text-anchor="start">windows of their own: a token sees the 4,000 behind it, and each of those has already seen the</text><text class="cap" x="40" y="310" text-anchor="start">4,000 behind itself.</text><text class="cap" x="40" y="350" text-anchor="start">So after 32 layers the newest token carries information from about 130,000 back, even though no</text><text class="cap" x="40" y="370" text-anchor="start">single layer ever looks further than 4,000.</text><text class="cap" x="40" y="410" text-anchor="start">Once the window has moved past a token, nothing will ever attend to it again, so its key and</text><text class="cap" x="40" y="430" text-anchor="start">value can be thrown away. Each new token overwrites the entry 4,096 positions behind it, and the</text><text class="cap" x="40" y="450" text-anchor="start">cache stops growing.</text></svg><figcaption>The layered reach is the part people miss. A local window is not the same as a short memory.</figcaption></figure>
