<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 25:43</div><h3>Cheaper per token, slower per user</h3><svg viewBox='0 0 680 346' role='img'><title>Cheaper per token, slower per user</title><text class="hd" x="40" y="46">Output speed one user sees in each run, drawn to scale</text><text class="cap" x="40" y="91" text-anchor="start">alone on an H200</text><g class="u"><rect x="200" y="72" width="400.0" height="28" rx="3"/><text class="sub" x="400.0" y="86.0" text-anchor="middle" dominant-baseline="central">51 tokens a second: one every 19.6 ms</text></g><text class="cap" x="40" y="137" text-anchor="start">one of 128 sharing</text><g class="h"><rect x="200" y="118" width="93.99509803921568" height="28" rx="3"/></g><text class="sub2" x="303.9950980392157" y="137" text-anchor="start">12.0 a second: one every 83.4 ms</text><text class="cap" x="40" y="196" text-anchor="start">Perplexity's two GPUs produced 1,534 tokens a second between them, shared by 128</text><text class="cap" x="40" y="216" text-anchor="start">requests: 12.0 tokens a second for each, one every 83.44 ms. NVIDIA's single request got</text><text class="cap" x="40" y="236" text-anchor="start">all 51, one every 19.6 ms.</text><text class="cap" x="40" y="276" text-anchor="start">That is the latency and throughput trade of episode 1 ({{fig:v01-o142}}): filling the machine</text><text class="cap" x="40" y="296" text-anchor="start">buys throughput with each user's time per output token. Different machines and prompt</text><text class="cap" x="40" y="316" text-anchor="start">lengths again, so read the direction, not the exact ratio.</text></svg><figcaption>The fifteen-fold saving is paid for in TPOT. Whether that is acceptable depends on the latency the service has promised.</figcaption></figure>
