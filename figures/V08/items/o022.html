<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 19:45</div><h3>One fact survives a twentieth of the attention; several facts fail at a fifth</h3><svg viewBox='0 0 680 424' role='img'><title>One fact survives a twentieth of the attention; several facts fail at a fifth</title><text class="hd" x="40" y="46">The Sparse Frontier (2025): share of the attention kept, drawn to scale</text><text class="cap" x="40" y="84" text-anchor="start">one fact buried</text><text class="cap" x="40" y="100" text-anchor="start">in the context</text><g class="s"><rect x="230" y="72" width="19.0" height="30" rx="3"/></g><text class="sub2" x="259.0" y="92" text-anchor="start">5% kept: still answers with 95% thrown away</text><text class="cap" x="40" y="142" text-anchor="start">several facts</text><text class="cap" x="40" y="158" text-anchor="start">to assemble</text><g class="h"><rect x="230" y="130" width="76.0" height="30" rx="3"/></g><text class="sub2" x="316.0" y="150" text-anchor="start">20% kept: starts failing with 80% thrown away</text><line class="axis" x1="230" y1="194" x2="610" y2="194"/><line class="tick" x1="230.0" y1="194" x2="230.0" y2="198"/><text class="sub2" x="230.0" y="212" text-anchor="middle">0%</text><line class="tick" x1="306.0" y1="194" x2="306.0" y2="198"/><text class="sub2" x="306.0" y="212" text-anchor="middle">20%</text><line class="tick" x1="382.0" y1="194" x2="382.0" y2="198"/><text class="sub2" x="382.0" y="212" text-anchor="middle">40%</text><line class="tick" x1="458.0" y1="194" x2="458.0" y2="198"/><text class="sub2" x="458.0" y="212" text-anchor="middle">60%</text><line class="tick" x1="534.0" y1="194" x2="534.0" y2="198"/><text class="sub2" x="534.0" y="212" text-anchor="middle">80%</text><line class="tick" x1="610.0" y1="194" x2="610.0" y2="198"/><text class="sub2" x="610.0" y="212" text-anchor="middle">100%</text><text class="cap" x="40" y="254" text-anchor="start">A 2025 study called The Sparse Frontier measured what all of this does to accuracy, and</text><text class="cap" x="40" y="274" text-anchor="start">found that how much you can throw away varies dramatically from task to task. A question</text><text class="cap" x="40" y="294" text-anchor="start">that needs one fact buried in the context survives even when 95% of the attention is</text><text class="cap" x="40" y="314" text-anchor="start">thrown away, a twentieth kept. A question that needs several facts assembled starts</text><text class="cap" x="40" y="334" text-anchor="start">failing at 80%, with a fifth kept.</text><text class="cap" x="40" y="374" text-anchor="start">No method wins everywhere, and the right choice depends on the task. When it does go</text><text class="cap" x="40" y="394" text-anchor="start">wrong, the answer still comes back fluent, with the missing fact quietly replaced.</text></svg><figcaption>The last line is the operational problem. A degraded long-context system does not announce itself; it becomes confidently wrong.</figcaption></figure>
