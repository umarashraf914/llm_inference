<figure><div class='ts'>Fig 22 &nbsp;&middot;&nbsp; 19:45</div><h3>What it costs in accuracy</h3><svg viewBox="0 0 680 296" role="img"><title>What it costs in accuracy</title><text class="hd" x="40" y="46">How much you can throw away depends entirely on the task</text><text class="cap" x="40" y="92" text-anchor="start">One fact buried in the context</text><g class="s"><rect x="340" y="76" width="280" height="32" rx="3"></rect><text class="sub" x="480.0" y="92.0" text-anchor="middle" dominant-baseline="central">survives 95% thrown away</text></g><text class="cap" x="40" y="152" text-anchor="start">Several facts to assemble</text><g class="h"><rect x="340" y="136" width="90" height="32" rx="3"></rect></g><text class="sub2" x="446" y="155" text-anchor="start">starts failing at 80%</text><text class="cap" x="40" y="214" text-anchor="start">No method wins everywhere, and the right choice depends on what the context is being used for.</text><text class="cap" x="40" y="254" text-anchor="start">And when it does go wrong, the answer still comes back fluent, with the missing fact quietly</text><text class="cap" x="40" y="274" text-anchor="start">replaced.</text></svg><figcaption>The last line is the operational problem. A degraded long-context system does not announce itself; it just becomes confidently wrong.</figcaption></figure>
