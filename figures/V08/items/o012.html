<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:07</div><h3>Medusa: extra heads guess 2, 3, 4 and 5 positions ahead from one hidden state</h3><svg viewBox='0 0 680 474' role='img'><title>Medusa: extra heads guess 2, 3, 4 and 5 positions ahead from one hidden state</title><text class="hd" x="40" y="46">Every head reads the same hidden state, at the same moment</text><g class="u"><rect x="40" y="96" width="120" height="120" rx="8"/><text class="lbl" x="100.0" y="139.0" text-anchor="middle" dominant-baseline="central">hidden state</text><text class="sub" x="100.0" y="157.0" text-anchor="middle" dominant-baseline="central">at the last</text><text class="sub" x="100.0" y="174.0" text-anchor="middle" dominant-baseline="central">position</text></g><line class="conn" x1="166" y1="156" x2="196" y2="83" marker-end="url(#arw)"/><g class="u"><rect x="200" y="70" width="190" height="26" rx="3"/><text class="sub" x="295.0" y="83.0" text-anchor="middle" dominant-baseline="central">the model's own head: 1 ahead</text></g><g class="u"><rect x="410" y="70" width="58" height="26" rx="3"/><text class="sub" x="439.0" y="83.0" text-anchor="middle" dominant-baseline="central">the</text></g><line class="conn" x1="166" y1="156" x2="196" y2="119" marker-end="url(#arw)"/><g class="m"><rect x="200" y="106" width="190" height="26" rx="3"/><text class="sub" x="295.0" y="119.0" text-anchor="middle" dominant-baseline="central">Medusa head 1: 2 ahead</text></g><g class="u"><rect x="410" y="106" width="58" height="26" rx="3"/><text class="sub" x="439.0" y="119.0" text-anchor="middle" dominant-baseline="central">cat</text></g><g class="u"><rect x="476" y="106" width="58" height="26" rx="3"/><text class="sub" x="505.0" y="119.0" text-anchor="middle" dominant-baseline="central">dog</text></g><line class="conn" x1="166" y1="156" x2="196" y2="155" marker-end="url(#arw)"/><g class="m"><rect x="200" y="142" width="190" height="26" rx="3"/><text class="sub" x="295.0" y="155.0" text-anchor="middle" dominant-baseline="central">Medusa head 2: 3 ahead</text></g><g class="u"><rect x="410" y="142" width="58" height="26" rx="3"/><text class="sub" x="439.0" y="155.0" text-anchor="middle" dominant-baseline="central">sat</text></g><g class="u"><rect x="476" y="142" width="58" height="26" rx="3"/><text class="sub" x="505.0" y="155.0" text-anchor="middle" dominant-baseline="central">ran</text></g><line class="conn" x1="166" y1="156" x2="196" y2="191" marker-end="url(#arw)"/><g class="m"><rect x="200" y="178" width="190" height="26" rx="3"/><text class="sub" x="295.0" y="191.0" text-anchor="middle" dominant-baseline="central">Medusa head 3: 4 ahead</text></g><g class="u"><rect x="410" y="178" width="58" height="26" rx="3"/><text class="sub" x="439.0" y="191.0" text-anchor="middle" dominant-baseline="central">on</text></g><g class="u"><rect x="476" y="178" width="58" height="26" rx="3"/><text class="sub" x="505.0" y="191.0" text-anchor="middle" dominant-baseline="central">away</text></g><line class="conn" x1="166" y1="156" x2="196" y2="227" marker-end="url(#arw)"/><g class="m"><rect x="200" y="214" width="190" height="26" rx="3"/><text class="sub" x="295.0" y="227.0" text-anchor="middle" dominant-baseline="central">Medusa head 4: 5 ahead</text></g><g class="u"><rect x="410" y="214" width="58" height="26" rx="3"/><text class="sub" x="439.0" y="227.0" text-anchor="middle" dominant-baseline="central">the</text></g><g class="u"><rect x="476" y="214" width="58" height="26" rx="3"/><text class="sub" x="505.0" y="227.0" text-anchor="middle" dominant-baseline="central">a</text></g><text class="sub2" x="410" y="262" text-anchor="start">each head's top picks</text><text class="cap" x="40" y="304" text-anchor="start">Medusa's extra heads all read the hidden state at the last position. The model's own</text><text class="cap" x="40" y="324" text-anchor="start">head gives the next token; the first extra head guesses the token two positions ahead,</text><text class="cap" x="40" y="344" text-anchor="start">the second three, and so on, all at once, in the same pass. The paper recommends</text><text class="cap" x="40" y="364" text-anchor="start">training five heads, and finds three or four often enough.</text><text class="cap" x="40" y="404" text-anchor="start">But nothing links one head to the next. The head guessing three ahead offers ‘sat’ or</text><text class="cap" x="40" y="424" text-anchor="start">‘ran’ without knowing whether ‘cat’ or ‘dog’ was chosen before it, so a single chain of</text><text class="cap" x="40" y="444" text-anchor="start">guesses would usually break early.</text></svg><figcaption>Several guesses for the price of a few small matrix multiplies, made blind to one another. The tree that follows is how Medusa makes blind guesses pay.</figcaption></figure>
