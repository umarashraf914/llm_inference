<figure><div class='ts'>Fig 12 &nbsp;&middot;&nbsp; 7:48</div><h3>Medusa</h3><svg viewBox="0 0 680 489" role="img"><title>Medusa</title><text class="hd" x="40" y="46">Medusa: extra heads on the model already running</text><g class="u"><rect x="40" y="70" width="130" height="100" rx="4"></rect><text class="sub" x="105.0" y="120.0" text-anchor="middle" dominant-baseline="central">hidden state</text></g><line class="conn" x1="176" y1="120" x2="200" y2="84" marker-end="url(#arw)"></line><g class="m"><rect x="206" y="70" width="170" height="26" rx="3"></rect><text class="sub" x="291.0" y="83.0" text-anchor="middle" dominant-baseline="central">head: 2 ahead</text></g><line class="conn" x1="176" y1="120" x2="200" y2="114" marker-end="url(#arw)"></line><g class="m"><rect x="206" y="100" width="170" height="26" rx="3"></rect><text class="sub" x="291.0" y="113.0" text-anchor="middle" dominant-baseline="central">head: 3 ahead</text></g><line class="conn" x1="176" y1="120" x2="200" y2="144" marker-end="url(#arw)"></line><g class="m"><rect x="206" y="130" width="170" height="26" rx="3"></rect><text class="sub" x="291.0" y="143.0" text-anchor="middle" dominant-baseline="central">head: 4 ahead</text></g><line class="conn" x1="176" y1="120" x2="200" y2="174" marker-end="url(#arw)"></line><g class="m"><rect x="206" y="160" width="170" height="26" rx="3"></rect><text class="sub" x="291.0" y="173.0" text-anchor="middle" dominant-baseline="central">head: 5 ahead</text></g><text class="sub2" x="400" y="106" text-anchor="start">each head is a small output layer</text><text class="sub2" x="400" y="126" text-anchor="start">reading the same hidden state</text><text class="cap" x="40" y="227" text-anchor="start">But nothing links one head to the next. The head guessing three positions ahead has no idea what</text><text class="cap" x="40" y="247" text-anchor="start">the head before it settled on, so a single chain of guesses would usually break early.</text><text class="cap" x="40" y="287" text-anchor="start">So Medusa takes the top few candidates from each head and combines them into a tree of possible</text><text class="cap" x="40" y="307" text-anchor="start">continuations, verifying the whole tree in one forward pass. An attention mask lets each token</text><text class="cap" x="40" y="327" text-anchor="start">see only its own ancestors, never its siblings.</text><text class="cap" x="40" y="367" text-anchor="start">With the backbone frozen, over 2.2 times without compromising quality. Fine-tuning the whole</text><text class="cap" x="40" y="387" text-anchor="start">model along with the heads reaches 2.3 to 3.6 times.</text><text class="cap" x="40" y="427" text-anchor="start">Medusa also changed the acceptance test: a token survives whenever the target's own probability</text><text class="cap" x="40" y="447" text-anchor="start">clears a threshold, which drops when the target is uncertain. More guesses survive, and in</text><text class="cap" x="40" y="467" text-anchor="start">exchange the output is no longer guaranteed to match the target alone.</text></svg><figcaption>Note what was traded. The second model is gone and the speed-up is larger, but the exactness guarantee from the previous part has been given up.</figcaption></figure>
