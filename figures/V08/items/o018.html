<figure><div class='ts'>Fig 18 &nbsp;&middot;&nbsp; 16:00</div><h3>Sparsity the model learns</h3><svg viewBox="0 0 680 456" role="img"><title>Sparsity the model learns</title><text class="hd" x="40" y="46">Native sparse attention: three branches, learned during pretraining</text><g class="m"><rect x="40" y="70" width="190" height="82" rx="8"></rect><text class="lbl" x="135.0" y="94.0" text-anchor="middle" dominant-baseline="central">Compression</text><text class="sub" x="135.0" y="112.0" text-anchor="middle" dominant-baseline="central">older tokens cut into blocks,</text><text class="sub" x="135.0" y="129.0" text-anchor="middle" dominant-baseline="central">each squashed to a summary</text></g><g class="m"><rect x="246" y="70" width="190" height="82" rx="8"></rect><text class="lbl" x="341.0" y="94.0" text-anchor="middle" dominant-baseline="central">Selection</text><text class="sub" x="341.0" y="112.0" text-anchor="middle" dominant-baseline="central">a few important blocks kept</text><text class="sub" x="341.0" y="129.0" text-anchor="middle" dominant-baseline="central">at full detail</text></g><g class="m"><rect x="452" y="70" width="188" height="82" rx="8"></rect><text class="lbl" x="546.0" y="102.0" text-anchor="middle" dominant-baseline="central">Sliding</text><text class="sub" x="546.0" y="120.0" text-anchor="middle" dominant-baseline="central">whatever is nearby</text></g><line class="conn" x1="182" y1="162" x2="300" y2="186" marker-end="url(#arw)"></line><line class="conn" x1="340" y1="162" x2="340" y2="186" marker-end="url(#arw)"></line><line class="conn" x1="500" y1="162" x2="380" y2="186" marker-end="url(#arw)"></line><g class="s"><rect x="240" y="190" width="200" height="36" rx="4"></rect><text class="sub" x="340.0" y="208.0" text-anchor="middle" dominant-baseline="central">a learned gate blends them</text></g><text class="cap" x="40" y="274" text-anchor="start">The sliding branch is there because local patterns are the easiest thing to learn. Without it,</text><text class="cap" x="40" y="294" text-anchor="start">the other two would learn those and not much else.</text><text class="cap" x="40" y="334" text-anchor="start">Because the model works out where to look during pretraining rather than after it, this matches</text><text class="cap" x="40" y="354" text-anchor="start">or exceeds full attention across general benchmarks, long-context tasks and reasoning, and runs</text><text class="cap" x="40" y="374" text-anchor="start">substantially faster on 64,000-token sequences.</text><text class="cap" x="40" y="414" text-anchor="start">A relative of it shipped in a production model that picks single tokens rather than whole blocks.</text><text class="cap" x="40" y="434" text-anchor="start">Its makers cut their API prices by more than half on the same day.</text></svg><figcaption>The distinction from every other method here: this one is trained in, not bolted on. The price cut is the clearest evidence it works.</figcaption></figure>
