<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 15:58</div><h3>DeepSeek's native sparse attention runs three branches, each with its own keys and values</h3><svg viewBox='0 0 680 560' role='img'><title>DeepSeek's native sparse attention runs three branches, each with its own keys and values</title><text class="hd" x="40" y="46">Native sparse attention: every query runs all three, and a learned gate blends them</text><g class="s"><rect x="40" y="70" width="188" height="78" rx="8"/><text class="lbl" x="134.0" y="92.0" text-anchor="middle" dominant-baseline="central">Compression</text><text class="sub" x="134.0" y="110.0" text-anchor="middle" dominant-baseline="central">older tokens in blocks,</text><text class="sub" x="134.0" y="127.0" text-anchor="middle" dominant-baseline="central">each squashed to a summary</text></g><text class="sub2" x="134" y="166" text-anchor="middle">its own keys and values</text><g class="s"><rect x="246" y="70" width="188" height="78" rx="8"/><text class="lbl" x="340.0" y="92.0" text-anchor="middle" dominant-baseline="central">Selection</text><text class="sub" x="340.0" y="110.0" text-anchor="middle" dominant-baseline="central">the few blocks that matter,</text><text class="sub" x="340.0" y="127.0" text-anchor="middle" dominant-baseline="central">read at full detail</text></g><text class="sub2" x="340" y="166" text-anchor="middle">its own keys and values</text><g class="s"><rect x="452" y="70" width="188" height="78" rx="8"/><text class="lbl" x="546.0" y="92.0" text-anchor="middle" dominant-baseline="central">Sliding</text><text class="sub" x="546.0" y="110.0" text-anchor="middle" dominant-baseline="central">the most recent tokens,</text><text class="sub" x="546.0" y="127.0" text-anchor="middle" dominant-baseline="central">read in full</text></g><text class="sub2" x="546" y="166" text-anchor="middle">its own keys and values</text><line class="conn" x1="134" y1="176" x2="288.5" y2="206" marker-end="url(#arw)"/><line class="conn" x1="340" y1="176" x2="340.0" y2="206" marker-end="url(#arw)"/><line class="conn" x1="546" y1="176" x2="391.5" y2="206" marker-end="url(#arw)"/><g class="u"><rect x="250" y="210" width="180" height="36" rx="8"/><text class="lbl" x="340.0" y="228.0" text-anchor="middle" dominant-baseline="central">learned gate</text></g><line class="conn" x1="340" y1="250" x2="340" y2="270" marker-end="url(#arw)"/><text class="sub2" x="340" y="288" text-anchor="middle">one output for the query</text><text class="cap" x="40" y="330" text-anchor="start">DeepSeek's native sparse attention makes the sparsity something the model learns in</text><text class="cap" x="40" y="350" text-anchor="start">pretraining, the long first training run on a huge body of text ({{fig:v01-o002}}), rather</text><text class="cap" x="40" y="370" text-anchor="start">than something bolted on afterwards. Every query runs three branches at once, and each</text><text class="cap" x="40" y="390" text-anchor="start">branch has its own keys and values, computed from the same tokens, so each can</text><text class="cap" x="40" y="410" text-anchor="start">specialise.</text><text class="cap" x="40" y="450" text-anchor="start">A compression branch cuts the older tokens into blocks and squashes each block into one</text><text class="cap" x="40" y="470" text-anchor="start">coarse summary. A selection branch picks out a few important blocks and keeps them at</text><text class="cap" x="40" y="490" text-anchor="start">full detail. A sliding branch handles whatever is nearby. The next four figures take</text><text class="cap" x="40" y="510" text-anchor="start">them in turn: what each reads, how the selection chooses, how the gate blends, and the</text><text class="cap" x="40" y="530" text-anchor="start">version DeepSeek shipped.</text></svg><figcaption>What sets it apart from every other method in this part: the model learns where to look during pretraining, so nothing has to be approximated after the fact.</figcaption></figure>
