t-anchor="middle" dominant-baseline="central">0.04</text></g><text class="sub2" x="580.0" y="250" text-anchor="middle">11</text><text class="sub2" x="580.0" y="268" text-anchor="middle">always</text><g class="s"><rect x="605" y="202" width="40" height="30" rx="3"/><text class="sub" x="625.0" y="217.0" text-anchor="middle" dominant-baseline="central">0.03</text></g><text class="sub2" x="625.0" y="250" text-anchor="middle">12</text><text class="sub2" x="625.0" y="268" text-anchor="middle">always</text><text class="cap" x="40" y="250" text-anchor="start">block</text><text class="cap" x="40" y="310" text-anchor="start">No extra scoring pass is needed. The compression branch has already compared the query</text><text class="cap" x="40" y="330" text-anchor="start">with every summary, and its attention weights say which stretches of the context matter.</text><text class="cap" x="40" y="350" text-anchor="start">Adding up the weights of the summaries inside each block gives the block's importance.</text><text class="cap" x="40" y="390" text-anchor="start">The first block and the two most recent are always read; the remaining places go to the</text><text class="cap" x="40" y="410" text-anchor="start">highest-scoring blocks, here blocks 4 and 7. The paper reads 16 blocks of 64 this way:</text><text class="cap" x="40" y="430" text-anchor="start">the initial one, the 2 local ones and 13 chosen by score. The weights here are</text><text class="cap" x="40" y="450" text-anchor="start">illustrative; the rule is the paper's.</text></svg><figcaption>Choosing costs almost nothing because it reuses work already done: the coarse branch is both one of the three answers and the map for another.</figcaption></figure>
