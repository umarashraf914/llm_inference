<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 9:01</div><h3>Typical acceptance lowers the bar where the target is unsure</h3><svg viewBox='0 0 680 582' role='img'><title>Typical acceptance lowers the bar where the target is unsure</title><text class="hd" x="40" y="46">A guess survives if the target's probability for it beats the bar</text><text class="sub2" x="60" y="76" text-anchor="start">peaked: one clear favourite</text><g class="m"><rect x="61" y="98.0" width="24" height="108.0" rx="1"/></g><g class="u"><rect x="87" y="200.0" width="24" height="6.0" rx="1"/></g><g class="u"><rect x="113" y="200.0" width="24" height="6.0" rx="1"/></g><line class="axis" x1="60" y1="206" x2="138" y2="206"/><text class="sub2" x="88" y="192.0" text-anchor="start">0.05 each: under 0.09</text><text class="sub2" x="60" y="226" text-anchor="start">entropy H = 0.39</text><text class="sub2" x="60" y="246" text-anchor="start">bar: min(0.09, 0.3 × e^(−H)) = 0.090</text><text class="sub2" x="60" y="266" text-anchor="start">1 of 3 candidates clear it</text><text class="sub2" x="350" y="76" text-anchor="start">open: twenty equal choices</text><g class="m"><rect x="351" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="364" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="377" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="390" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="403" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="416" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="429" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="442" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="455" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="468" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="481" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="494" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="507" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="520" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="533" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="546" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="559" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="572" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="585" y="200.0" width="11" height="6.0" rx="1"/></g><g class="m"><rect x="598" y="200.0" width="11" height="6.0" rx="1"/></g><line class="axis" x1="350" y1="206" x2="610" y2="206"/><text class="sub2" x="352" y="192.0" text-anchor="start">0.05 each: over 0.015</text><text class="sub2" x="350" y="226" text-anchor="start">entropy H = 3.00</text><text class="sub2" x="350" y="246" text-anchor="start">bar: min(0.09, 0.3 × e^(−H)) = 0.015</text><text class="sub2" x="350" y="266" text-anchor="start">20 of 20 candidates clear it</text><text class="cap" x="40" y="312" text-anchor="start">Medusa also changed the test. Instead of p ÷ q, a guess survives when the target's own</text><text class="cap" x="40" y="332" text-anchor="start">probability for it clears a bar, because the paper argues that matching the original</text><text class="cap" x="40" y="352" text-anchor="start">model's distribution is typically unnecessary.</text><text class="cap" x="40" y="392" text-anchor="start">The bar falls when the target is unsure, measured by entropy: H = −Σ p × ln p, each</text><text class="cap" x="40" y="412" text-anchor="start">token's probability times its surprise, ln(1 ÷ p), added up. One clear favourite gives</text><text class="cap" x="40" y="432" text-anchor="start">0.39; twenty equal choices give ln 20 = 3.00. The bar is the smaller of 0.09 and</text><text class="cap" x="40" y="452" text-anchor="start">0.3 × e^(−H), the defaults in Medusa's code: 0.09 here, 0.015 there, and it only starts</text><text class="cap" x="40" y="472" text-anchor="start">to fall once H passes 1.20.</text><text class="cap" x="40" y="512" text-anchor="start">There is no replacement step and no p-over-q test, so the output is no longer the</text><text class="cap" x="40" y="532" text-anchor="start">target's distribution. The paper reports that quality held on benchmarks</text><text class="cap" x="40" y="552" text-anchor="start">({{fig:v08-a34}}), a weaker claim than an identical distribution.</text></svg><figcaption>The trade made explicit: a looser test keeps more guesses and gives up the guarantee of Part 3. Quality becomes something measured, not something proved.</figcaption></figure>
