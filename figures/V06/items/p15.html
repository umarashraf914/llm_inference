<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 7:57</div><h3>The router's scores are four dot products</h3><svg viewBox='0 0 680 584' role='img'><title>The router's scores are four dot products</title><text class="hd" x="40" y="46">Each expert owns one row; its score is that row times the token's vector</text><text class="cap" x="40" y="92" text-anchor="start">token's vector</text><g class="u"><rect x="170" y="72" width="48" height="30" rx="3"/><text class="sub" x="194.0" y="87.0" text-anchor="middle" dominant-baseline="central">1.0</text></g><g class="u"><rect x="226" y="72" width="48" height="30" rx="3"/><text class="sub" x="250.0" y="87.0" text-anchor="middle" dominant-baseline="central">−0.5</text></g><g class="u"><rect x="282" y="72" width="48" height="30" rx="3"/><text class="sub" x="306.0" y="87.0" text-anchor="middle" dominant-baseline="central">2.0</text></g><g class="u"><rect x="338" y="72" width="48" height="30" rx="3"/><text class="sub" x="362.0" y="87.0" text-anchor="middle" dominant-baseline="central">0.5</text></g><text class="sub2" x="402" y="92" text-anchor="start">multiply each pair, then add</text><text class="sub2" x="603" y="92" text-anchor="middle">score</text><text class="cap" x="40" y="144" text-anchor="start">expert 1's row</text><g class="u"><rect x="170" y="124" width="48" height="30" rx="3"/><text class="sub" x="194.0" y="139.0" text-anchor="middle" dominant-baseline="central">0.5</text></g><g class="u"><rect x="226" y="124" width="48" height="30" rx="3"/><text class="sub" x="250.0" y="139.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="282" y="124" width="48" height="30" rx="3"/><text class="sub" x="306.0" y="139.0" text-anchor="middle" dominant-baseline="central">1.0</text></g><g class="u"><rect x="338" y="124" width="48" height="30" rx="3"/><text class="sub" x="362.0" y="139.0" text-anchor="middle" dominant-baseline="central">−0.5</text></g><text class="sub2" x="402" y="144" text-anchor="start">0.5 + 0 + 2.0 − 0.25</text><text class="sub2" x="560" y="144" text-anchor="start">=</text><g class="m"><rect x="576" y="124" width="54" height="30" rx="3"/><text class="sub" x="603.0" y="139.0" text-anchor="middle" dominant-baseline="central">2.25</text></g><text class="cap" x="40" y="192" text-anchor="start">expert 2's row</text><g class="u"><rect x="170" y="172" width="48" height="30" rx="3"/><text class="sub" x="194.0" y="187.0" text-anchor="middle" dominant-baseline="central">−1.0</text></g><g class="u"><rect x="226" y="172" width="48" height="30" rx="3"/><text class="sub" x="250.0" y="187.0" text-anchor="middle" dominant-baseline="central">0.5</text></g><g class="u"><rect x="282" y="172" width="48" height="30" rx="3"/><text class="sub" x="306.0" y="187.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="338" y="172" width="48" height="30" rx="3"/><text class="sub" x="362.0" y="187.0" text-anchor="middle" dominant-baseline="central">1.0</text></g><text class="sub2" x="402" y="192" text-anchor="start">−1.0 − 0.25 + 0 + 0.5</text><text class="sub2" x="560" y="192" text-anchor="start">=</text><g class="u"><rect x="576" y="172" width="54" height="30" rx="3"/><text class="sub" x="603.0" y="187.0" text-anchor="middle" dominant-baseline="central">−0.75</text></g><text class="cap" x="40" y="240" text-anchor="start">expert 3's row</text><g class="u"><rect x="170" y="220" width="48" height="30" rx="3"/><text class="sub" x="194.0" y="235.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="226" y="220" width="48" height="30" rx="3"/><text class="sub" x="250.0" y="235.0" text-anchor="middle" dominant-baseline="central">−1.0</text></g><g class="u"><rect x="282" y="220" width="48" height="30" rx="3"/><text class="sub" x="306.0" y="235.0" text-anchor="middle" dominant-baseline="central">0.5</text></g><g class="u"><rect x="338" y="220" width="48" height="30" rx="3"/><text class="sub" x="362.0" y="235.0" text-anchor="middle" dominant-baseline="central">0.5</text></g><text class="sub2" x="402" y="240" text-anchor="start">0 + 0.5 + 1.0 + 0.25</text><text class="sub2" x="560" y="240" text-anchor="start">=</text><g class="m"><rect x="576" y="220" width="54" height="30" rx="3"/><text class="sub" x="603.0" y="235.0" text-anchor="middle" dominant-baseline="central">1.75</text></g><text class="cap" x="40" y="288" text-anchor="start">expert 4's row</text><g class="u"><rect x="170" y="268" width="48" height="30" rx="3"/><text class="sub" x="194.0" y="283.0" text-anchor="middle" dominant-baseline="central">1.0</text></g><g class="u"><rect x="226" y="268" width="48" height="30" rx="3"/><text class="sub" x="250.0" y="283.0" text-anchor="middle" dominant-baseline="central">1.0</text></g><g class="u"><rect x="282" y="268" width="48" height="30" rx="3"/><text class="sub" x="306.0" y="283.0" text-anchor="middle" dominant-baseline="central">−0.5</text></g><g class="u"><rect x="338" y="268" width="48" height="30" rx="3"/><text class="sub" x="362.0" y="283.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="402" y="288" text-anchor="start">1.0 − 0.5 − 1.0 + 0</text><text class="sub2" x="560" y="288" text-anchor="start">=</text><g class="u"><rect x="576" y="268" width="54" height="30" rx="3"/><text class="sub" x="603.0" y="283.0" text-anchor="middle" dominant-baseline="central">−0.50</text></g><text class="cap" x="40" y="352" text-anchor="start">Each expert owns one row of the router's matrix, four numbers here, as long as the</text><text class="cap" x="40" y="372" text-anchor="start">token's vector. Line the row up under the vector, multiply each pair of entries and add</text><text class="cap" x="40" y="392" text-anchor="start">the four products. That sum is the expert's score, and the operation is a dot product</text><text class="cap" x="40" y="412" text-anchor="start">({{fig:v03-o014}}).</text><text class="cap" x="40" y="452" text-anchor="start">Stacked, the four rows are a 4 × 4 matrix, and the four dot products are one</text><text class="cap" x="40" y="472" text-anchor="start">matrix–vector multiply ({{fig:v01-o085}}). A real router is the same shape, only bigger:</text><text class="cap" x="40" y="492" text-anchor="start">DeepSeek V3 scores 256 experts against a vector of 7,168 numbers.</text><text class="cap" x="40" y="532" text-anchor="start">A high score means the token's vector points the way that expert's row points. Expert 1</text><text class="cap" x="40" y="552" text-anchor="start">scores 2.25 because both it and the token put their largest number in third place.</text></svg><figcaption>Nothing in the router knows any words. It measures how well one vector lines up with four directions, and everything after this follows from those four numbers.</figcaption></figure>
