dth="44" height="26" rx="3"/><text class="sub" x="474.0" y="137.0" text-anchor="middle" dominant-baseline="central">B2</text></g><text class="sub2" x="506" y="142" text-anchor="start">8 units</text><text class="sub2" x="40" y="186" text-anchor="start">staggered</text><text class="cap" x="40" y="214" text-anchor="start">compute</text><rect x="130.0" y="196.0" width="368.0" height="26.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="cap" x="40" y="246" text-anchor="start">network</text><rect x="130.0" y="228.0" width="368.0" height="26.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="130" y="196" width="44" height="26" rx="3"/><text class="sub" x="152.0" y="209.0" text-anchor="middle" dominant-baseline="central">A1</text></g><g class="h"><rect x="176" y="228" width="44" height="26" rx="3"/><text class="sub" x="198.0" y="241.0" text-anchor="middle" dominant-baseline="central">A1</text></g><g class="m"><rect x="176" y="196" width="44" height="26" rx="3"/><text class="sub" x="198.0" y="209.0" text-anchor="middle" dominant-baseline="central">B1</text></g><g class="h"><rect x="222" y="228" width="44" height="26" rx="3"/><text class="sub" x="244.0" y="241.0" text-anchor="middle" dominant-baseline="central">B1</text></g><g class="m"><rect x="222" y="196" width="44" height="26" rx="3"/><text class="sub" x="244.0" y="209.0" text-anchor="middle" dominant-baseline="central">A2</text></g><g class="h"><rect x="268" y="228" width="44" height="26" rx="3"/><text class="sub" x="290.0" y="241.0" text-anchor="middle" dominant-baseline="central">A2</text></g><g class="m"><rect x="268" y="196" width="44" height="26" rx="3"/><text class="sub" x="290.0" y="209.0" text-anchor="middle" dominant-baseline="central">B2</text></g><g class="h"><rect x="314" y="228" width="44" height="26" rx="3"/><text class="sub" x="336.0" y="241.0" text-anchor="middle" dominant-baseline="central">B2</text></g><text class="sub2" x="368" y="246" text-anchor="start">5 units</text><text class="cap" x="40" y="302" text-anchor="start">Split the step's tokens into two microbatches. While A's tokens are on the network, B</text><text class="cap" x="40" y="322" text-anchor="start">computes; then they swap. Both lanes stay busy, so two layers' work for both halves</text><text class="cap" x="40" y="342" text-anchor="start">takes 5 units instead of 8, and in the steady state 2 units per layer instead of 4:</text><text class="cap" x="40" y="362" text-anchor="start">twice the throughput at a one-to-one ratio. Microbatches fill a pipeline the same way</text><text class="cap" x="40" y="382" text-anchor="start">({{fig:v05-o012}}), and the hardware lets a transfer run while arithmetic goes on</text><text class="cap" x="40" y="402" text-anchor="start">({{fig:v03-o072}}).</text><text class="cap" x="40" y="442" text-anchor="start">Every byte is still sent. DeepSeek runs this in prefill, the pass over the prompt</text><text class="cap" x="40" y="462" text-anchor="start">({{fig:v01-o109}}), overlapping one microbatch's attention and experts with the other's</text><text class="cap" x="40" y="482" text-anchor="start">dispatch and combine, and at the time of its report was exploring the same for decode.</text></svg><figcaption>Schematic, at the one-to-one ratio. Overlap can hide communication only behind compute that exists; where the network takes longer than the work, it is still the critical path.</figcaption></figure>
