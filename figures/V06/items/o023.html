<figure><div class='ts'>Fig 23 &nbsp;&middot;&nbsp; 21:36</div><h3>How to read a headline number</h3><svg viewBox='0 0 680 302' role='img'><title>How to read a headline number</title><g class="m"><rect x="40" y="55" width="285" height="78" rx="8"/><text class="lbl" x="182.5" y="85.0" text-anchor="middle" dominant-baseline="central">What a headline total means</text><text class="sub" x="182.5" y="103.0" text-anchor="middle" dominant-baseline="central">how much knowledge is stored</text></g><g class="h"><rect x="368" y="55" width="272" height="78" rx="8"/><text class="lbl" x="504.0" y="85.0" text-anchor="middle" dominant-baseline="central">What it does not mean</text><text class="sub" x="504.0" y="103.0" text-anchor="middle" dominant-baseline="central">how capable, or how cheap</text></g><text class="cap" x="40" y="178" text-anchor="start">The memory footprint still tracks every parameter, even as each token runs through only a</text><text class="cap" x="40" y="198" text-anchor="start">handful of experts. A trillion-parameter MoE needs a trillion parameters' worth of memory.</text><text class="cap" x="40" y="238" text-anchor="start">Neither number measures how capable a model is. A total says how much is stored and must</text><text class="cap" x="40" y="258" text-anchor="start">be held; an active count says how much work each token costs. The next figure reads five</text><text class="cap" x="40" y="278" text-anchor="start">of them side by side.</text></svg><figcaption>The honest reading: totals describe storage, active counts describe speed, and neither describes capability on its own.</figcaption></figure>
