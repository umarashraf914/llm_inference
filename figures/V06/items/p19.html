<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:36</div><h3>The router costs under half a percent of the expert work</h3><svg viewBox='0 0 680 364' role='img'><title>The router costs under half a percent of the expert work</title><text class="hd" x="40" y="46">Operations per token in one DeepSeek V3 MoE layer, drawn to scale</text><text class="cap" x="40" y="92" text-anchor="start">9 experts run</text><g class="m"><rect x="150" y="74" width="520.0" height="28" rx="3"/></g><text class="sub2" x="670.0" y="120" text-anchor="end">793 million</text><text class="cap" x="40" y="160" text-anchor="start">the router</text><g class="s"><rect x="150" y="142" width="2.4074074074074074" height="28" rx="3"/></g><text class="sub2" x="162" y="160" text-anchor="start">3.67 million, 0.46% of the expert work</text><text class="cap" x="40" y="232" text-anchor="start">The router is 256 rows of 7,168 numbers, 1.84 million weights. Each is used once per</text><text class="cap" x="40" y="252" text-anchor="start">token, a multiply and an add, so 3.67 million operations ({{fig:v01-o111}}).</text><text class="cap" x="40" y="292" text-anchor="start">Each expert is three matrices of 7,168 × 2,048, 44.0 million weights. Nine run per</text><text class="cap" x="40" y="312" text-anchor="start">token, eight chosen and one shared, so 793 million operations. The router is 0.46% of</text><text class="cap" x="40" y="332" text-anchor="start">that, and 0.016% of the weights the layer stores.</text></svg><figcaption>Deciding costs a rounding error next to doing, which is why the model can afford to run the router on every token at every layer.</figcaption></figure>
