<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 17:57</div><h3>The critical path: steps a token can neither skip nor reorder</h3><svg viewBox='0 0 680 412' role='img'><title>The critical path: steps a token can neither skip nor reorder</title><text class="hd" x="40" y="46">One MoE layer at decode, step after step (schematic, 1:1)</text><text class="cap" x="40" y="94" text-anchor="start">GPU computes</text><rect x="140.0" y="76.0" width="470.0" height="26.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="cap" x="40" y="134" text-anchor="start">network sends</text><rect x="140.0" y="116.0" width="470.0" height="26.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="140" y="76" width="113.93939393939394" height="26" rx="3"/><text class="sub" x="196.96969696969697" y="89.0" text-anchor="middle" dominant-baseline="central">attention</text></g><g class="s"><rect x="253.9" y="76.0" width="14.2" height="26.0" rx="3"/></g><g class="h"><rect x="268.1818181818182" y="116" width="113.93939393939394" height="26" rx="3"/><text class="sub" x="325.1515151515151" y="129.0" text-anchor="middle" dominant-baseline="central">dispatch</text></g><g class="m"><rect x="382.1212121212121" y="76" width="113.93939393939394" height="26" rx="3"/><text class="sub" x="439.0909090909091" y="89.0" text-anchor="middle" dominant-baseline="central">experts</text></g><g class="h"><rect x="496.06060606060606" y="116" width="113.93939393939394" height="26" rx="3"/><text class="sub" x="553.030303030303" y="129.0" text-anchor="middle" dominant-baseline="central">combine</text></g><text class="sub2" x="255.93939393939394" y="70" text-anchor="start">router</text><line class="conn" x1="614.0" y1="89.0" x2="640.0" y2="89.0" marker-end="url(#arw)"/><text class="sub2" x="614.0" y="160" text-anchor="end">next layer</text><text class="sub2" x="140" y="176" text-anchor="start">each step starts only when the one before has finished: the times add</text><text class="cap" x="40" y="220" text-anchor="start">A step is on the critical path when something after it has to wait for it. Inside one</text><text class="cap" x="40" y="240" text-anchor="start">MoE layer every step needs the previous step's output: the experts cannot start before</text><text class="cap" x="40" y="260" text-anchor="start">the token arrives, and the next layer cannot start before the results come back. So</text><text class="cap" x="40" y="280" text-anchor="start">their times add, and the time per output token is the sum along that chain, layer after</text><text class="cap" x="40" y="300" text-anchor="start">layer.</text><text class="cap" x="40" y="340" text-anchor="start">Drawn at the one-to-one ratio DeepSeek measured in training before optimisation, the GPU</text><text class="cap" x="40" y="360" text-anchor="start">spends half of every MoE layer waiting for the network, and the network half of it</text><text class="cap" x="40" y="380" text-anchor="start">waiting for the GPU.</text></svg><figcaption>Schematic. Anything on the critical path costs latency at full price; the tricks later in this part work by moving the network's half off it.</figcaption></figure>
