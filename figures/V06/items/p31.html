07.6 299.7,198.8 306.9,201.1 314.1,204.0 321.3,209.9 328.5,192.3 335.6,191.1 342.8,207.6 350.0,203.5" data-line=""/><text class="sub2" x="500" y="52" text-anchor="start">loads in batch 40</text><text class="sub2" x="452" y="52" text-anchor="start">bias</text><text class="cap" x="442" y="75" text-anchor="end">E1</text><g class="m"><rect x="500" y="62" width="49.7" height="16" rx="2" data-bar="0"/></g><text class="sub2 halo" x="555.7" y="75" data-v="0">138</text><text class="sub2" x="452" y="75" data-b="0">+0.01</text><text class="cap" x="442" y="96" text-anchor="end">E2</text><g class="m"><rect x="500" y="83" width="46.4" height="16" rx="2" data-bar="1"/></g><text class="sub2 halo" x="552.4" y="96" data-v="1">129</text><text class="sub2" x="452" y="96" data-b="1">−0.24</text><text class="cap" x="442" y="117" text-anchor="end">E3</text><g class="m"><rect x="500" y="104" width="48.2" height="16" rx="2" data-bar="2"/></g><text class="sub2 halo" x="554.2" y="117" data-v="2">134</text><text class="sub2" x="452" y="117" data-b="2">+0.15</text><text class="cap" x="442" y="138" text-anchor="end">E4</text><g class="m"><rect x="500" y="125" width="41.0" height="16" rx="2" data-bar="3"/></g><text class="sub2 halo" x="547.0" y="138" data-v="3">114</text><text class="sub2" x="452" y="138" data-b="3">+0.06</text><text class="cap" x="442" y="159" text-anchor="end">E5</text><g class="m"><rect x="500" y="146" width="52.6" height="16" rx="2" data-bar="4"/></g><text class="sub2 halo" x="558.6" y="159" data-v="4">146</text><text class="sub2" x="452" y="159" data-b="4">−0.14</text><text class="cap" x="442" y="180" text-anchor="end">E6</text><g class="m"><rect x="500" y="167" width="43.2" height="16" rx="2" data-bar="5"/></g><text class="sub2 halo" x="549.2" y="180" data-v="5">120</text><text class="sub2" x="452" y="180" data-b="5">+0.25</text><text class="cap" x="442" y="201" text-anchor="end">E7</text><g class="m"><rect x="500" y="188" width="43.6" height="16" rx="2" data-bar="6"/></g><text class="sub2 halo" x="549.6" y="201" data-v="6">121</text><text class="sub2" x="452" y="201" data-b="6">−0.04</text><text class="cap" x="442" y="222" text-anchor="end">E8</text><g class="m"><rect x="500" y="209" width="43.9" height="16" rx="2" data-bar="7"/></g><text class="sub2 halo" x="549.9" y="222" data-v="7">122</text><text class="sub2" x="452" y="222" data-b="7">+0.11</text><line class="mark xok" x1="546.1" y1="58" x2="546.1" y2="230.0"/><text class="sub2" x="546.08" y="246" text-anchor="middle">average 128</text><text class="sub2" x="40" y="280">busiest over average: batch 1 <tspan data-r="1">2.56</tspan>; batch 10 <tspan data-r="10">2.01</tspan>; batch 25 <tspan data-r="25">1.17</tspan>; batch 40 <tspan data-r="40">1.14</tspan></text><text class="cap" x="40" y="324" text-anchor="start">A toy with made-up numbers: 8 experts, 512 tokens a batch, each token sent to its top</text><text class="cap" x="40" y="344" text-anchor="start">two. A token's score for an expert is that expert's popularity plus noise, and some</text><text class="cap" x="40" y="364" text-anchor="start">experts are far more popular than others.</text><text class="cap" x="40" y="404" text-anchor="start">After each batch the controller counts what every expert received and moves each bias</text><text class="cap" x="40" y="424" text-anchor="start">one step: up for an expert below the average, down for one above. The biases used in</text><text class="cap" x="40" y="444" text-anchor="start">batch 10 come from batches 1 to 9 only. With the step at zero the busiest expert carries</text><text class="cap" x="40" y="464" text-anchor="start">about 2.6 times the average for ever; at 0.01 it is within 20% of it by batch 25. Every</text><text class="cap" x="40" y="484" text-anchor="start">batch is a fresh draw of tokens, so the loads keep jittering.</text><text class="cap" x="40" y="524" text-anchor="start">DeepSeek V3 used a step of 0.001 on its own scores, over hundreds of thousands of</text><text class="cap" x="40" y="544" text-anchor="start">batches. The numbers on the page were checked against the same arithmetic in Python.</text></svg></div><figcaption>A thermostat, not a gradient: count, compare with the average, nudge, repeat. The language objective never feels it, and the biases settle where the traffic spreads evenly.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const SKEW = [0.05, 0.3, -0.1, 0, 0.2, -0.2, 0.1, -0.05], NOISE = 0.5, TOKENS = 512, BATCHES = 40, SEED = 6, MARK = [1, 10, 25, 40];
  const CL = 70, CR = 350, CT = 64, CB = 214, LX = 500, LS = 0.36, U0 = 0.01;
  const sl = fig.querySelector('input[type=range]'), val = fig.querySelector('.val'), q = s => fig.querySelector(s);
  const fmt = (v, d = 2) => (v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
  const sfmt = v => v === 0 ? '0' : (v > 0 ? '+' : '−') + Math.abs(v).toFixed(2);
  const cx = k => CL + (k - 1) / (BATCHES - 1) * (CR - CL), cy = v => CB - (v - 1) / 2 * (CB - CT);
  function mulberry32(a) { return function() { a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function run(u) {
    const r = mulberry32(SEED); let b = new Array(8).fill(0); const out = [];
    for (let k = 0; k < BATCHES; k++) {
      const c = new Array(8).fill(0);
      for (let t = 0; t < TOKENS; t++) {
        const v = []; for (let i = 0; i < 8; i++) v.push(SKEW[i] + NOISE * (r() + r() - 1) + b[i]);
        let i1 = 0; for (let i = 1; i < 8; i++) if (v[i] > v[i1]) i1 = i;
        let i2 = i1 === 0 ? 1 : 0; for (let i = 0; i < 8; i++) if (i !== i1 && v[i] > v[i2]) i2 = i;
        c[i1]++; c[i2]++;
      }
      const mean = 2 * TOKENS / 8;
      out.push({ratio: Math.max(...c) / mean, loads: c, bias: b.slice()});
      b = b.map((bi, i) => bi + (c[i] < mean ? u : (c[i] > mean ? -u : 0)));
    }
    return out;
  }
  function draw() {
    const u = +sl.value; val.textContent = fmt(u, 3);
    const h = run(u), last = h[BATCHES - 1];
    q('[data-line]').setAttribute('points', h.map((x, k) => `${cx(k + 1).toFixed(1)},${cy(Math.min(x.ratio, 3)).toFixed(1)}`).join(' '));
    MARK.forEach(k => q(`[data-r="${k}"]`).textContent = fmt(h[k - 1].ratio));
    for (let i = 0; i < 8; i++) {
      const w = Math.max(last.loads[i] * LS, 2), bar = q(`[data-bar="${i}"]`), tx = q(`[data-v="${i}"]`);
      bar.setAttribute('width', w.toFixed(1)); tx.setAttribute('x', (LX + w + 6).toFixed(1));
      tx.textContent = String(last.loads[i]);
      q(`[data-b="${i}"]`).textContent = sfmt(last.bias[i]);
    }
  }
  sl.addEventListener('input', draw);
  q('button').addEventListener('click', () => { sl.value = U0; draw(); });
  draw();
})();</script></figure>
