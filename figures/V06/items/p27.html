<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 14:28</div><h3>A layer waits for its busiest GPU</h3><svg viewBox='0 0 680 522' role='img'><title>A layer waits for its busiest GPU</title><text class="hd" x="40" y="46">Tokens of work on each GPU in one MoE layer, to scale</text><text class="cap" x="40" y="82" text-anchor="start">GPU 1</text><g class="h"><rect x="130.0" y="66.0" width="440.0" height="22.0" rx="3"/></g><text class="sub2 halo" x="578" y="82" text-anchor="start">40</text><text class="cap" x="40" y="112" text-anchor="start">GPU 2</text><g class="m"><rect x="130.0" y="96.0" width="220.0" height="22.0" rx="3"/></g><text class="sub2 halo" x="358" y="112" text-anchor="start">20</text><text class="cap" x="40" y="142" text-anchor="start">GPU 3</text><g class="m"><rect x="130.0" y="126.0" width="198.0" height="22.0" rx="3"/></g><text class="sub2 halo" x="336" y="142" text-anchor="start">18</text><text class="cap" x="40" y="172" text-anchor="start">GPU 4</text><g class="m"><rect x="130.0" y="156.0" width="176.0" height="22.0" rx="3"/></g><text class="sub2 halo" x="314" y="172" text-anchor="start">16</text><text class="cap" x="40" y="202" text-anchor="start">GPU 5</text><g class="m"><rect x="130.0" y="186.0" width="154.0" height="22.0" rx="3"/></g><text class="sub2 halo" x="292" y="202" text-anchor="start">14</text><text class="cap" x="40" y="232" text-anchor="start">GPU 6</text><g class="m"><rect x="130.0" y="216.0" width="132.0" height="22.0" rx="3"/></g><text class="sub2 halo" x="270" y="232" text-anchor="start">12</text><text class="cap" x="40" y="262" text-anchor="start">GPU 7</text><g class="m"><rect x="130.0" y="246.0" width="110.0" height="22.0" rx="3"/></g><text class="sub2 halo" x="248" y="262" text-anchor="start">10</text><text class="cap" x="40" y="292" text-anchor="start">GPU 8</text><g class="m"><rect x="130.0" y="276.0" width="66.0" height="22.0" rx="3"/></g><text class="sub2 halo" x="204" y="292" text-anchor="start">6</text><line class="mark xok" x1="317.0" y1="60" x2="317.0" y2="308"/><text class="sub2" x="317.0" y="324" text-anchor="middle">average 17</text><text class="sub2" x="570" y="324" text-anchor="end">the layer's time: 40</text><text class="cap" x="40" y="370" text-anchor="start">Expert parallelism gives each GPU its own experts ({{fig:v05-o015}}). In one MoE layer</text><text class="cap" x="40" y="390" text-anchor="start">every GPU runs its experts on the tokens sent to it, and the next layer cannot start</text><text class="cap" x="40" y="410" text-anchor="start">until the last GPU has finished.</text><text class="cap" x="40" y="450" text-anchor="start">So the layer takes as long as its busiest GPU: 40 units of work here, though the average</text><text class="cap" x="40" y="470" text-anchor="start">is 136 / 8 = 17. The other seven finish early and wait. The cluster runs at 17 / 40 =</text><text class="cap" x="40" y="490" text-anchor="start">42.5% of what an even spread would give.</text></svg><figcaption>Maximum, not average. One hot expert sets the pace for every GPU in the layer, which is why imbalance is a cost problem as well as a quality one.</figcaption></figure>
