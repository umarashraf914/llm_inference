<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 1:43</div><h3>Chinchilla: a quarter of the parameters, 4.7 times the data, the same budget</h3><svg viewBox='0 0 680 662' role='img'><title>Chinchilla: a quarter of the parameters, 4.7 times the data, the same budget</title><text class="hd" x="40" y="46">Gopher and Chinchilla, given about the same compute, drawn to scale</text><text class="hd" x="40" y="84" text-anchor="start">parameters</text><text class="cap" x="40" y="111" text-anchor="start">Gopher</text><g class="u"><rect x="230.0" y="94.0" width="360.0" height="24.0" rx="3"/></g><text class="sub2" x="600.0" y="111" text-anchor="start">280 billion</text><text class="cap" x="40" y="145" text-anchor="start">Chinchilla</text><g class="s"><rect x="230.0" y="128.0" width="90.0" height="24.0" rx="3"/></g><text class="sub2" x="330.0" y="145" text-anchor="start">70 billion</text><text class="hd" x="40" y="180" text-anchor="start">training tokens</text><text class="cap" x="40" y="207" text-anchor="start">Gopher</text><g class="u"><rect x="230.0" y="190.0" width="77.1" height="24.0" rx="3"/></g><text class="sub2" x="317.1428571428571" y="207" text-anchor="start">300 billion</text><text class="cap" x="40" y="241" text-anchor="start">Chinchilla</text><g class="s"><rect x="230.0" y="224.0" width="360.0" height="24.0" rx="3"/></g><text class="sub2" x="600.0" y="241" text-anchor="start">1,400 billion</text><text class="hd" x="40" y="276" text-anchor="start">6 × N × D, operations to train</text><text class="cap" x="40" y="303" text-anchor="start">Gopher</text><g class="u"><rect x="230.0" y="286.0" width="308.6" height="24.0" rx="3"/></g><text class="sub2" x="548.5714285714287" y="303" text-anchor="start">5.0 × 10²³</text><text class="cap" x="40" y="337" text-anchor="start">Chinchilla</text><g class="s"><rect x="230.0" y="320.0" width="360.0" height="24.0" rx="3"/></g><text class="sub2" x="600.0" y="337" text-anchor="start">5.9 × 10²³</text><text class="cap" x="40" y="390" text-anchor="start">Training costs about 6 operations per parameter per token: 2 to run each weight forward</text><text class="cap" x="40" y="410" text-anchor="start">({{fig:v01-o114}}) and about twice that again for the backward pass that finds the</text><text class="cap" x="40" y="430" text-anchor="start">gradient ({{fig:v03-o060}}). So a run's compute is about 6 × N × D, for N parameters and</text><text class="cap" x="40" y="450" text-anchor="start">D tokens.</text><text class="cap" x="40" y="490" text-anchor="start">In 2022 DeepMind's Chinchilla paper held that budget fixed and asked how to split it.</text><text class="cap" x="40" y="510" text-anchor="start">Its answer was to grow the model and its data together. Chinchilla has a quarter of the</text><text class="cap" x="40" y="530" text-anchor="start">parameters of Gopher, DeepMind's earlier model, trained on 4.7 times the tokens, and</text><text class="cap" x="40" y="550" text-anchor="start">beat it: 20 tokens per parameter, against Gopher's 1.1.</text><text class="cap" x="40" y="590" text-anchor="start">6 × N × D puts the two runs within a sixth of each other; the paper's fuller count gives</text><text class="cap" x="40" y="610" text-anchor="start">Gopher 5.76 × 10²³, the budget Chinchilla was matched to. Many models of that era turned</text><text class="cap" x="40" y="630" text-anchor="start">out to be oversized for the data they were fed.</text></svg><figcaption>A correction to the recipe, not to its direction: fed enough data, a bigger model's loss still falls on the line, and that predictability keeps pushing parameter counts up.</figcaption></figure>
