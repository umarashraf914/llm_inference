<figure><div class='ts'>Fig 07 &nbsp;&middot;&nbsp; 3:20</div><h3>The two halves do different jobs</h3><svg viewBox='0 0 680 420' role='img'><title>The two halves do different jobs</title><g class="u"><rect x="40" y="40" width="600" height="130" rx="14"/><text class="lbl" x="62" y="66">One transformer layer</text></g><g class="s"><rect x="66" y="96" width="250" height="56" rx="8"/><text class="lbl" x="191.0" y="115.0" text-anchor="middle" dominant-baseline="central">Attention</text><text class="sub" x="191.0" y="133.0" text-anchor="middle" dominant-baseline="central">mixes information across the sequence</text></g><g class="m"><rect x="360" y="96" width="254" height="56" rx="8"/><text class="lbl" x="487.0" y="115.0" text-anchor="middle" dominant-baseline="central">Feed-forward network</text><text class="sub" x="487.0" y="133.0" text-anchor="middle" dominant-baseline="central">processes each token on its own</text></g><text class="cap" x="40" y="218" text-anchor="start">You would expect attention, the clever-looking half, to be where the knowledge is stored. It</text><text class="cap" x="40" y="238" text-anchor="start">turns out to be the feed-forward network.</text><text class="cap" x="40" y="278" text-anchor="start">In 2021 Geva and colleagues showed what a feed-forward layer is actually doing: it behaves like</text><text class="cap" x="40" y="298" text-anchor="start">an enormous soft lookup table. Each key recognises a pattern in the input, something like</text><text class="cap" x="40" y="318" text-anchor="start">the capital of France is, and the matching value pushes the output toward particular tokens,</text><text class="cap" x="40" y="338" text-anchor="start">like Paris.</text><text class="cap" x="40" y="378" text-anchor="start">When the model completes that sentence correctly, it is the feed-forward network doing the</text><text class="cap" x="40" y="398" text-anchor="start">remembering.</text></svg><figcaption>A result worth knowing on its own. The part that looks like reasoning moves information around; the part that looks like plumbing holds the facts.</figcaption></figure>
