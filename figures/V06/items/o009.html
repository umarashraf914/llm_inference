<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:13</div><h3>What top-k selection is</h3><svg viewBox='0 0 680 622' role='img'><title>What top-k selection is</title><text class="hd" x="40" y="46">Score every expert, keep the highest two, rescale them to one</text><text class="cap" x="40" y="92" text-anchor="start">expert 1</text><g class="u"><rect x="160.0" y="74.0" width="35.0" height="28.0" rx="3"/></g><text class="sub2" x="205.0" y="92" text-anchor="start">0.05  dropped</text><text class="cap" x="40" y="132" text-anchor="start">expert 2</text><g class="m"><rect x="160" y="114" width="287.0" height="28" rx="3"/><text class="sub" x="303.5" y="128.0" text-anchor="middle" dominant-baseline="central">0.41</text></g><text class="cap" x="40" y="172" text-anchor="start">expert 3</text><g class="u"><rect x="160.0" y="154.0" width="14.0" height="28.0" rx="3"/></g><text class="sub2" x="184.0" y="172" text-anchor="start">0.02  dropped</text><text class="cap" x="40" y="212" text-anchor="start">expert 4</text><g class="m"><rect x="160" y="194" width="231.0" height="28" rx="3"/><text class="sub" x="275.5" y="208.0" text-anchor="middle" dominant-baseline="central">0.33</text></g><text class="cap" x="40" y="252" text-anchor="start">expert 5</text><g class="u"><rect x="160.0" y="234.0" width="77.0" height="28.0" rx="3"/></g><text class="sub2" x="247.0" y="252" text-anchor="start">0.11  dropped</text><text class="cap" x="40" y="292" text-anchor="start">expert 6</text><g class="u"><rect x="160.0" y="274.0" width="56.0" height="28.0" rx="3"/></g><text class="sub2" x="226.0" y="292" text-anchor="start">0.08  dropped</text><text class="sub2" x="40" y="334" text-anchor="start">kept: 0.41 + 0.33 = 0.74; divide each by it</text><text class="cap" x="40" y="368" text-anchor="start">gate 2</text><g class="m"><rect x="160" y="350" width="387.83783783783787" height="28" rx="3"/><text class="sub" x="353.91891891891896" y="364.0" text-anchor="middle" dominant-baseline="central">0.554</text></g><text class="cap" x="40" y="408" text-anchor="start">gate 4</text><g class="m"><rect x="160" y="390" width="312.1621621621622" height="28" rx="3"/><text class="sub" x="316.0810810810811" y="404.0" text-anchor="middle" dominant-baseline="central">0.446</text></g><text class="cap" x="40" y="470" text-anchor="start">The router's six scores add up to one, so each is a share. Keeping the top two keeps</text><text class="cap" x="40" y="490" text-anchor="start">0.41 and 0.33, three quarters of the total between them; experts 1, 3, 5 and 6 are never</text><text class="cap" x="40" y="510" text-anchor="start">run for this token.</text><text class="cap" x="40" y="550" text-anchor="start">The two survivors are rescaled to add back up to one, each divided by 0.74:</text><text class="cap" x="40" y="570" text-anchor="start">0.41 / 0.74 = 0.554 and 0.33 / 0.74 = 0.446. Those are the weights of the blend: the</text><text class="cap" x="40" y="590" text-anchor="start">layer's answer is 0.554 of expert 2's output plus 0.446 of expert 4's.</text></svg><figcaption>Bars drawn to scale. Two operations in one word: rank everything, then discard all but the best few. The scores that did the choosing also do the blending.</figcaption></figure>
