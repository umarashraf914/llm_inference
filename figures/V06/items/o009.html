<figure><div class='ts'>Fig 09 &nbsp;&middot;&nbsp; 4:32</div><h3>What top-k selection is</h3><svg viewBox='0 0 680 438' role='img'><title>What top-k selection is</title><text class="hd" x="40" y="46">Top-k: score everything, keep the highest few</text><text class="cap" x="40" y="92" text-anchor="start">expert 1</text><g class="u"><rect x="160" y="74" width="35.0" height="30" rx="3"/></g><text class="sub2" x="205" y="89" text-anchor="start" dominant-baseline="central">0.05</text><text class="cap" x="40" y="132" text-anchor="start">expert 2</text><g class="m"><rect x="160" y="114" width="287.0" height="30" rx="3"/><text class="sub" x="303.5" y="129.0" text-anchor="middle" dominant-baseline="central">0.41</text></g><text class="cap" x="40" y="172" text-anchor="start">expert 3</text><g class="u"><rect x="160" y="154" width="14.0" height="30" rx="3"/></g><text class="sub2" x="184" y="169" text-anchor="start" dominant-baseline="central">0.02</text><text class="cap" x="40" y="212" text-anchor="start">expert 4</text><g class="m"><rect x="160" y="194" width="231.0" height="30" rx="3"/><text class="sub" x="275.5" y="209.0" text-anchor="middle" dominant-baseline="central">0.33</text></g><text class="cap" x="40" y="252" text-anchor="start">expert 5</text><g class="u"><rect x="160" y="234" width="77.0" height="30" rx="3"/><text class="sub" x="198.5" y="249.0" text-anchor="middle" dominant-baseline="central">0.11</text></g><text class="cap" x="40" y="292" text-anchor="start">expert 6</text><g class="u"><rect x="160" y="274" width="56.0" height="30" rx="3"/></g><text class="sub2" x="226" y="289" text-anchor="start" dominant-baseline="central">0.08</text><text class="cap" x="40" y="340" text-anchor="start">The six scores add up to one, so each is a share. Keeping the top two means keeping 0.41 and</text><text class="cap" x="40" y="360" text-anchor="start">0.33, which is three quarters of the total share between them.</text><text class="cap" x="40" y="396" text-anchor="start">Those two survivors are then rescaled so their shares add back up to one, and used as the</text><text class="cap" x="40" y="416" text-anchor="start">weights when their outputs are blended.</text></svg><figcaption>Two operations in one word: rank everything, then discard all but the best few. The scores that did the choosing also do the blending.</figcaption></figure>
