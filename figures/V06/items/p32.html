t-baseline="central">16</text></g><g class="m"><rect x="430" y="142" width="52" height="26" rx="3"/><text class="sub" x="456.0" y="155.0" text-anchor="middle" dominant-baseline="central">16</text></g><rect x="486.0" y="142.0" width="52.0" height="26.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="542.0" y="142.0" width="52.0" height="26.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="cap" x="40" y="190" text-anchor="start">sequence D</text><rect x="150.0" y="172.0" width="52.0" height="26.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="206.0" y="172.0" width="52.0" height="26.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="262.0" y="172.0" width="52.0" height="26.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="318.0" y="172.0" width="52.0" height="26.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="374.0" y="172.0" width="52.0" height="26.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="430.0" y="172.0" width="52.0" height="26.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="486" y="172" width="52" height="26" rx="3"/><text class="sub" x="512.0" y="185.0" text-anchor="middle" dominant-baseline="central">16</text></g><g class="m"><rect x="542" y="172" width="52" height="26" rx="3"/><text class="sub" x="568.0" y="185.0" text-anchor="middle" dominant-baseline="central">16</text></g><text class="cap" x="40" y="228" text-anchor="start">the batch</text><g class="s"><rect x="150" y="210" width="52" height="26" rx="3"/><text class="sub" x="176.0" y="223.0" text-anchor="middle" dominant-baseline="central">16</text></g><g class="s"><rect x="206" y="210" width="52" height="26" rx="3"/><text class="sub" x="232.0" y="223.0" text-anchor="middle" dominant-baseline="central">16</text></g><g class="s"><rect x="262" y="210" width="52" height="26" rx="3"/><text class="sub" x="288.0" y="223.0" text-anchor="middle" dominant-baseline="central">16</text></g><g class="s"><rect x="318" y="210" width="52" height="26" rx="3"/><text class="sub" x="344.0" y="223.0" text-anchor="middle" dominant-baseline="central">16</text></g><g class="s"><rect x="374" y="210" width="52" height="26" rx="3"/><text class="sub" x="400.0" y="223.0" text-anchor="middle" dominant-baseline="central">16</text></g><g class="s"><rect x="430" y="210" width="52" height="26" rx="3"/><text class="sub" x="456.0" y="223.0" text-anchor="middle" dominant-baseline="central">16</text></g><g class="s"><rect x="486" y="210" width="52" height="26" rx="3"/><text class="sub" x="512.0" y="223.0" text-anchor="middle" dominant-baseline="central">16</text></g><g class="s"><rect x="542" y="210" width="52" height="26" rx="3"/><text class="sub" x="568.0" y="223.0" text-anchor="middle" dominant-baseline="central">16</text></g><text class="cap" x="40" y="286" text-anchor="start">The controller counts what each expert received over a whole batch. Here every expert</text><text class="cap" x="40" y="306" text-anchor="start">received 16 assignments: a perfect batch, and the controller would leave every bias</text><text class="cap" x="40" y="326" text-anchor="start">alone.</text><text class="cap" x="40" y="366" text-anchor="start">Yet each sequence used only 2 of the 8 experts. A sequence about code, or about one</text><text class="cap" x="40" y="386" text-anchor="start">language, can send its tokens to the same few experts all the way through, and inside</text><text class="cap" x="40" y="406" text-anchor="start">that sequence two experts do all the work while the batch average looks fine.</text><text class="cap" x="40" y="446" text-anchor="start">DeepSeek V3 adds a small sequence-level balance term to its training loss, weighted</text><text class="cap" x="40" y="466" text-anchor="start">0.0001, just to avoid extreme imbalance within any single sequence. And serving traffic</text><text class="cap" x="40" y="486" text-anchor="start">never quite matches what training balanced for.</text></svg><figcaption>Balance is a property of whatever you average over. A batch can be perfect while every sequence in it is lopsided, which is why balancing stays an operational job.</figcaption></figure>
