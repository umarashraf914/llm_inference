<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:08</div><h3>The value tips the next-token scores from London to Paris</h3><svg viewBox='0 0 680 552' role='img'><title>The value tips the next-token scores from London to Paris</title><text class="hd" x="40" y="46">Next-token scores before and after the block's output is added</text><text class="sub2" x="40" y="80" text-anchor="start">before: x = [1.0, 2.0]</text><text class="sub2" x="116" y="104" text-anchor="end">score</text><text class="sub2" x="130" y="104" text-anchor="start">probability</text><text class="cap" x="40" y="135" text-anchor="start">Paris</text><text class="sub2" x="116" y="135" text-anchor="end">1.60</text><g class="u"><rect x="130.0" y="116.0" width="50.5" height="28.0" rx="3"/></g><text class="sub2" x="188.47637211437504" y="135" text-anchor="start">0.34</text><text class="cap" x="40" y="173" text-anchor="start">London</text><text class="sub2" x="116" y="173" text-anchor="end">2.20</text><g class="m"><rect x="130.0" y="154.0" width="92.0" height="28.0" rx="3"/></g><text class="sub2" x="229.97394660510997" y="173" text-anchor="start">0.61</text><text class="cap" x="40" y="211" text-anchor="start">the</text><text class="sub2" x="116" y="211" text-anchor="end">−0.30</text><g class="u"><rect x="130.0" y="192.0" width="7.5" height="28.0" rx="3"/></g><text class="sub2" x="145.549681280515" y="211" text-anchor="start">0.05</text><text class="sub2" x="360" y="80" text-anchor="start">after: x + y = [2.8, 2.6]</text><text class="sub2" x="436" y="104" text-anchor="end">score</text><text class="sub2" x="450" y="104" text-anchor="start">probability</text><text class="cap" x="360" y="135" text-anchor="start">Paris</text><text class="sub2" x="436" y="135" text-anchor="end">3.58</text><g class="m"><rect x="450.0" y="116.0" width="89.3" height="28.0" rx="3"/></g><text class="sub2" x="547.340242639659" y="135" text-anchor="start">0.60</text><text class="cap" x="360" y="173" text-anchor="start">London</text><text class="sub2" x="436" y="173" text-anchor="end">3.16</text><g class="u"><rect x="450.0" y="154.0" width="58.7" height="28.0" rx="3"/></g><text class="sub2" x="516.7007223078936" y="173" text-anchor="start">0.39</text><text class="cap" x="360" y="211" text-anchor="start">the</text><text class="sub2" x="436" y="211" text-anchor="end">−0.24</text><g class="u"><rect x="450.0" y="192.0" width="2.0" height="28.0" rx="3"/></g><text class="sub2" x="460" y="211" text-anchor="start">0.01</text><text class="cap" x="40" y="280" text-anchor="start">Say [1, 2] is the vector for the last word of 'The capital of France is', and key 1 is</text><text class="cap" x="40" y="300" text-anchor="start">the key that fires on that pattern. The block's output y is added onto the vector, the</text><text class="cap" x="40" y="320" text-anchor="start">residual stream ({{fig:v01-o099}}): [1, 2] + [1.8, 0.6] = [2.8, 2.6].</text><text class="cap" x="40" y="360" text-anchor="start">At the top of the model each vocabulary token's score is a dot product of the final</text><text class="cap" x="40" y="380" text-anchor="start">vector with that token's own row of the output matrix ({{fig:v01-o103}}), here Paris [1, 0.3],</text><text class="cap" x="40" y="400" text-anchor="start">London [0.2, 1] and 'the' [0.1, −0.2]; softmax turns scores into probabilities</text><text class="cap" x="40" y="420" text-anchor="start">({{fig:v01-o009}}).</text><text class="cap" x="40" y="460" text-anchor="start">The value raised Paris's score by 1.98 and London's by only 0.96, and the favourite</text><text class="cap" x="40" y="480" text-anchor="start">changed. Every number here is illustrative, two dimensions instead of thousands; the</text><text class="cap" x="40" y="500" text-anchor="start">mechanism, a value pushing up the tokens that follow its key's pattern, is the one Geva</text><text class="cap" x="40" y="520" text-anchor="start">and colleagues measured.</text></svg><figcaption>Bars drawn to scale. Remembering, in this picture, is adding: a key that fires adds its value to the stream, and the value pushes particular tokens up. That is why the facts sit in these weights.</figcaption></figure>
