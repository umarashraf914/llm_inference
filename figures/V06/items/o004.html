<figure><div class='ts'>Fig 04 &nbsp;&middot;&nbsp; 0:51</div><h3>What loss and gradients are</h3><svg viewBox='0 0 680 358' role='img'><title>What loss and gradients are</title><text class="hd" x="40" y="46">Loss: a single number saying how wrong the model was</text><text class="cap" x="40" y="94" text-anchor="start">predicted the right token confidently</text><g class="s"><rect x="400" y="76" width="40" height="30" rx="3"/></g><text class="cap" x="40" y="144" text-anchor="start">predicted it, but hesitantly</text><g class="m"><rect x="400" y="126" width="150" height="30" rx="3"/></g><text class="cap" x="40" y="194" text-anchor="start">predicted something else entirely</text><g class="h"><rect x="400" y="176" width="230" height="30" rx="3"/></g><text class="cap" x="40" y="240" text-anchor="start">Lower is better. Training is the process of nudging every weight in whatever direction makes</text><text class="cap" x="40" y="260" text-anchor="start">this number smaller, over and over, across an enormous amount of text.</text><text class="cap" x="40" y="296" text-anchor="start">A gradient is the answer to which direction, for one weight. Nothing in this video computes</text><text class="cap" x="40" y="316" text-anchor="start">one, but the word appears because balancing the experts has to be arranged so it does not</text><text class="cap" x="40" y="336" text-anchor="start">fight the gradient that is making the model better at language.</text></svg><figcaption>Enough to follow the argument about load balancing later, which is entirely about two forces pulling on the same weights.</figcaption></figure>
