<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 1:17</div><h3>Loss is −ln of the probability the right token got</h3><svg viewBox='0 0 680 492' role='img'><title>Loss is −ln of the probability the right token got</title><text class="hd" x="40" y="46">The loss for one prediction is −ln p, where p is what the right token got</text><text class="cap" x="40" y="91" text-anchor="start">confident and right, p = 0.9</text><g class="s"><rect x="270.0" y="72.0" width="7.0" height="28.0" rx="3"/></g><text class="sub2" x="287.0024470799442" y="91" text-anchor="start">−ln 0.9 = 0.11</text><text class="cap" x="40" y="137" text-anchor="start">right, but hesitant, p = 0.3</text><g class="m"><rect x="270.0" y="118.0" width="80.0" height="28.0" rx="3"/></g><text class="sub2" x="360.01817184878337" y="137" text-anchor="start">−ln 0.3 = 1.20</text><text class="cap" x="40" y="183" text-anchor="start">expected something else, p = 0.02</text><g class="h"><rect x="270.0" y="164.0" width="260.0" height="28.0" rx="3"/></g><text class="sub2" x="540.0" y="183" text-anchor="start">−ln 0.02 = 3.91</text><text class="cap" x="40" y="240" text-anchor="start">A model's output is a probability for every token it knows ({{fig:v01-o009}}). Once the real</text><text class="cap" x="40" y="260" text-anchor="start">next token is known, the loss looks only at the probability p the model gave that token,</text><text class="cap" x="40" y="280" text-anchor="start">and charges −ln p for it.</text><text class="cap" x="40" y="320" text-anchor="start">ln is the natural logarithm: the power e must be raised to. A certain, correct guess,</text><text class="cap" x="40" y="340" text-anchor="start">p = 1, costs ln 1 = 0. Below one the logarithm is negative, so the minus sign makes the</text><text class="cap" x="40" y="360" text-anchor="start">charge positive, and every halving of p adds ln 2 = 0.69: the penalty climbs steeply as</text><text class="cap" x="40" y="380" text-anchor="start">p falls toward zero.</text><text class="cap" x="40" y="420" text-anchor="start">Averaged over every token of a text, this is the loss a training run reports, and the</text><text class="cap" x="40" y="440" text-anchor="start">number the scaling laws below predict. Training means nudging every weight in whichever</text><text class="cap" x="40" y="460" text-anchor="start">direction makes it smaller.</text></svg><figcaption>Bars drawn to scale. The loss says how wrong the model was, not which weights to change; that is what the gradient in the next figure is for.</figcaption></figure>
