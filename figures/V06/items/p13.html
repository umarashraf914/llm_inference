<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:09</div><h3>Reading time tracks what a token touches</h3><svg viewBox='0 0 680 462' role='img'><title>Reading time tracks what a token touches</title><text class="hd" x="40" y="46">Milliseconds to read one token's weights at 3.35 TB/s, one byte a weight</text><text class="cap" x="40" y="89" text-anchor="start">a dense 671 B model</text><g class="h"><rect x="250.0" y="70.0" width="350.0" height="28.0" rx="3"/></g><text class="sub2" x="610.0" y="89" text-anchor="start">200 ms</text><text class="cap" x="40" y="129" text-anchor="start">DeepSeek V3, 37 B run</text><g class="m"><rect x="250.0" y="110.0" width="19.3" height="28.0" rx="3"/></g><text class="sub2" x="279.2995529061103" y="129" text-anchor="start">11.0 ms</text><text class="cap" x="40" y="185" text-anchor="start">a dense 46.7 B model</text><g class="h"><rect x="250.0" y="166.0" width="24.4" height="28.0" rx="3"/></g><text class="sub2" x="284.3606221257824" y="185" text-anchor="start">13.9 ms</text><text class="cap" x="40" y="225" text-anchor="start">Mixtral, 12.9 B run</text><g class="m"><rect x="250.0" y="206.0" width="6.7" height="28.0" rx="3"/></g><text class="sub2" x="266.7182918581222" y="225" text-anchor="start">3.8 ms</text><text class="cap" x="40" y="290" text-anchor="start">At decode, a token's time is set by the bytes it must read divided by the bandwidth</text><text class="cap" x="40" y="310" text-anchor="start">({{fig:v01-o130}}). A dense model reads everything it holds; a mixture of experts reads</text><text class="cap" x="40" y="330" text-anchor="start">only the experts it runs, plus attention. DeepSeek V3's 200 ms becomes 11 ms, Mixtral's</text><text class="cap" x="40" y="350" text-anchor="start">13.9 ms becomes 3.8 ms.</text><text class="cap" x="40" y="390" text-anchor="start">These are one chip's rates for one token on its own. Real deployments split the weights</text><text class="cap" x="40" y="410" text-anchor="start">across many chips, which shortens every bar alike, and a crowd of tokens wakes more</text><text class="cap" x="40" y="430" text-anchor="start">experts at once, which Part 11 counts.</text></svg><figcaption>Bars drawn to scale. Time per token follows K, the experts run, while memory follows N, the experts held: the two dials of {{ref:v06-o011}}, turned into milliseconds.</figcaption></figure>
