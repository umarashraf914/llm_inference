<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:32</div><h3>Modern layers lean further: 82% in a 70B model, 98% in an MoE layer</h3><svg viewBox='0 0 680 434' role='img'><title>Modern layers lean further: 82% in a 70B model, 98% in an MoE layer</title><text class="hd" x="40" y="46">Share of one layer's weights in the feed-forward block, to scale</text><text class="cap" x="40" y="91" text-anchor="start">the classic layer</text><g class="m"><rect x="220" y="72" width="266.66666666666663" height="28" rx="3"/><text class="sub" x="353.3333333333333" y="86.0" text-anchor="middle" dominant-baseline="central">feed-forward 66.7%</text></g><g class="u"><rect x="486.7" y="72.0" width="133.3" height="28.0" rx="3"/></g><text class="cap" x="40" y="137" text-anchor="start">the 70B layer of V1</text><g class="m"><rect x="220" y="118" width="329.4117647058823" height="28" rx="3"/><text class="sub" x="384.70588235294116" y="132.0" text-anchor="middle" dominant-baseline="central">feed-forward 82.4%</text></g><g class="u"><rect x="549.4" y="118.0" width="70.6" height="28.0" rx="3"/></g><text class="cap" x="40" y="183" text-anchor="start">a DeepSeek V3 MoE layer</text><g class="m"><rect x="220" y="164" width="393.49603161537595" height="28" rx="3"/><text class="sub" x="416.748015807688" y="178.0" text-anchor="middle" dominant-baseline="central">feed-forward 98.4%</text></g><g class="u"><rect x="613.5" y="164.0" width="6.5" height="28.0" rx="3"/></g><text class="sub2" x="620" y="214" text-anchor="end">the grey end is attention</text><text class="cap" x="40" y="262" text-anchor="start">The 70-billion-parameter model of {{fig:v01-o101}} has 64 query heads sharing 8 key-</text><text class="cap" x="40" y="282" text-anchor="start">value heads, grouped-query attention ({{fig:v03-o089}}), so its K and V matrices are</text><text class="cap" x="40" y="302" text-anchor="start">8,192 × 1,024 rather than 8,192 × 8,192. Attention falls to 151.0 million weights a</text><text class="cap" x="40" y="322" text-anchor="start">layer, while the gated feed-forward block, 3.5 times wide, holds 704.6 million: 82.4%.</text><text class="cap" x="40" y="362" text-anchor="start">An MoE layer multiplies the feed-forward side. DeepSeek V3 keeps 256 routed experts and</text><text class="cap" x="40" y="382" text-anchor="start">one shared expert in each MoE layer, 11.32 billion weights with the router, against</text><text class="cap" x="40" y="402" text-anchor="start">187.1 million for its attention: 98.4%.</text></svg><figcaption>Bars drawn to scale. Wherever most of the weight sits is where sparsity pays, and in a modern layer that is almost all of it.</figcaption></figure>
