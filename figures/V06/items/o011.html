<figure><div class='ts'>Fig 11 &nbsp;&middot;&nbsp; 5:36</div><h3>Two independent dials</h3><svg viewBox='0 0 680 396' role='img'><title>Two independent dials</title><g class="u"><rect x="60" y="46" width="250" height="42" rx="6"/><text class="sub" x="185.0" y="67.0" text-anchor="middle" dominant-baseline="central">total parameters grow with N</text></g><g class="m"><rect x="360" y="46" width="260" height="42" rx="6"/><text class="sub" x="490.0" y="67.0" text-anchor="middle" dominant-baseline="central">compute per token grows with K</text></g><text class="cap" x="40" y="122" text-anchor="start">Every expert has to stay resident in memory whether or not this token used it, but only K</text><text class="cap" x="40" y="142" text-anchor="start">experts ever run. N and K become two independent dials.</text><text class="hd" x="40" y="192">Mixtral makes the split concrete</text><text class="cap" x="40" y="232" text-anchor="start">Eight experts, top two</text><g class="u"><rect x="280" y="216" width="340" height="32" rx="3"/><text class="sub" x="450.0" y="232.0" text-anchor="middle" dominant-baseline="central">46.7 billion total</text></g><text class="cap" x="40" y="292" text-anchor="start">Used for any one token</text><g class="m"><rect x="280" y="276" width="94" height="32" rx="3"/><text class="sub" x="327.0" y="292.0" text-anchor="middle" dominant-baseline="central">12.9 billion</text></g><text class="cap" x="40" y="354" text-anchor="start">One dial sets what the model can know. The other sets what a token pays. They no longer have to</text><text class="cap" x="40" y="374" text-anchor="start">move together.</text></svg><figcaption>This is the accounting the whole architecture exists to produce. Memory tracks N; time per token tracks K.</figcaption></figure>
