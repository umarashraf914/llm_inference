/g><g class="u" data-c="237"><rect x="235" y="276" width="13" height="13" rx="2"/></g><g class="u" data-c="238"><rect x="250" y="276" width="13" height="13" rx="2"/></g><g class="u" data-c="239"><rect x="265" y="276" width="13" height="13" rx="2"/></g><g class="u" data-c="240"><rect x="40" y="291" width="13" height="13" rx="2"/></g><g class="u" data-c="241"><rect x="55" y="291" width="13" height="13" rx="2"/></g><g class="u" data-c="242"><rect x="70" y="291" width="13" height="13" rx="2"/></g><g class="u" data-c="243"><rect x="85" y="291" width="13" height="13" rx="2"/></g><g class="u" data-c="244"><rect x="100" y="291" width="13" height="13" rx="2"/></g><g class="u" data-c="245"><rect x="115" y="291" width="13" height="13" rx="2"/></g><g class="u" data-c="246"><rect x="130" y="291" width="13" height="13" rx="2"/></g><g class="u" data-c="247"><rect x="145" y="291" width="13" height="13" rx="2"/></g><g class="u" data-c="248"><rect x="160" y="291" width="13" height="13" rx="2"/></g><g class="u" data-c="249"><rect x="175" y="291" width="13" height="13" rx="2"/></g><g class="u" data-c="250"><rect x="190" y="291" width="13" height="13" rx="2"/></g><g class="u" data-c="251"><rect x="205" y="291" width="13" height="13" rx="2"/></g><g class="u" data-c="252"><rect x="220" y="291" width="13" height="13" rx="2"/></g><g class="u" data-c="253"><rect x="235" y="291" width="13" height="13" rx="2"/></g><g class="u" data-c="254"><rect x="250" y="291" width="13" height="13" rx="2"/></g><g class="u" data-c="255"><rect x="265" y="291" width="13" height="13" rx="2"/></g><g class="u"><rect x="40.0" y="320.0" width="12.0" height="12.0" rx="2"/></g><text class="sub2" x="60" y="330" text-anchor="start">no tokens</text><g class="m"><rect x="40.0" y="340.0" width="12.0" height="12.0" rx="2"/></g><text class="sub2" x="60" y="350" text-anchor="start">under 295 tokens: waiting on memory</text><g class="s"><rect x="40.0" y="360.0" width="12.0" height="12.0" rx="2"/></g><text class="sub2" x="60" y="370" text-anchor="start">295 or more: busy</text><text class="sub2" x="330" y="82">tokens in this step: <tspan data-r="B">1</tspan></text><text class="sub2" x="330" y="108">experts with work, this layer: <tspan data-r="busy">8</tspan> of 256</text><text class="sub2" x="330" y="134">expected, over all 58 layers: <tspan data-r="woken">8.0</tspan></text><text class="sub2" x="330" y="160">tokens per busy expert: <tspan data-r="per">1.0</tspan></text><text class="sub2" x="330" y="186">its operations per byte: <tspan data-r="ops">2.0</tspan> (591 to be busy)</text><text class="sub2" x="330" y="230" text-anchor="start">weights read this step, against 671 GB held, to scale</text><g class="u"><rect x="330.0" y="240.0" width="300.0" height="22.0" rx="3"/></g><g class="m"><rect x="330" y="240" width="16.4" height="22" rx="3" data-bar="read"/></g><text class="sub2" x="330" y="282">read: <tspan data-r="read">36.6 GB</tspan>; per token: <tspan data-r="pertok">36.6 GB</tspan></text><text class="cap" x="40" y="420" text-anchor="start">Each token in the step picks 8 of the 256 experts at random, every expert equally</text><text class="cap" x="40" y="440" text-anchor="start">likely; the squares show one such draw for one layer. The expected count and the bytes</text><text class="cap" x="40" y="460" text-anchor="start">are averages over all 58 MoE layers, plus attention, the dense layers, the shared</text><text class="cap" x="40" y="480" text-anchor="start">experts and the output head, which every step reads in full.</text><text class="cap" x="40" y="520" text-anchor="start">At B = 1 the step reads 36.6 GB of the 671 GB held, to make one token, and eight experts</text><text class="cap" x="40" y="540" text-anchor="start">each work on that single token. A few hundred tokens wake every expert, but each still</text><text class="cap" x="40" y="560" text-anchor="start">waits on memory until about 9,450 tokens give it 295. The numbers on the page were</text><text class="cap" x="40" y="580" text-anchor="start">checked against Python.</text></svg></div><figcaption>The worst of both sides at batch one: the whole model held, a sliver of it read, and eight experts working on one token, with a KV cache as large as a dense model would carry. Sparsity pays only in a crowd.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const BS = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384], NR = 256, K = 8, MOE = 58, EXPERT = 44040192, NONEXP = 16190954496,
        HELD = 671026404352, SEED = 39, TSTAR = 295.3731343283582, RX = 330, RW = 300, I0 = 0;
  const sl = fig.querySelector('input[type=range]'), val = fig.querySelector('.val'), q = s => fig.querySelector(s);
  const fmt = (v, d = 2) => (v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
  const group = v => String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const gb = v => v >= 1e9 ? (v / 1e9).toFixed(1) + ' GB' : (v / 1e9).toFixed(3) + ' GB';
  function mulberry32(a) { return function() { a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function draw() {
    const B = BS[+sl.value]; val.textContent = group(B);
    const r = mulberry32(SEED), pool = [...Array(NR).keys()], load = new Array(NR).fill(0);
    for (let t = 0; t < B; t++) for (let j = 0; j < K; j++) {
      const k = j + Math.floor(r() * (NR - j)); const tmp = pool[j]; pool[j] = pool[k]; pool[k] = tmp; load[pool[j]]++;
    }
    const busy = load.filter(x => x > 0).length, per = K * B / busy;
    const woken = NR * (1 - Math.pow((NR - K) / NR, B)), read = NONEXP + MOE * woken * EXPERT;
    load.forEach((x, i) => q(`[data-c="${i}"]`).setAttribute('class', x === 0 ? 'u' : (x >= TSTAR ? 's' : 'm')));
    const set = (k, v) => q(`[data-r="${k}"]`).textContent = v;
    set('B', group(B)); set('busy', String(busy)); set('woken', fmt(woken, 1)); set('per', fmt(per, 1));
    set('ops', fmt(2 * per, 1)); set('read', gb(read)); set('pertok', gb(read / B));
    q('[data-bar="read"]').setAttribute('width', Math.max(read / HELD * RW, 2).toFixed(1));
  }
  sl.addEventListener('input', draw);
  q('button').addEventListener('click', () => { sl.value = I0; draw(); });
  draw();
})();</script></figure>
