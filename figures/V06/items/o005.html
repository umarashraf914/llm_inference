486.7" cy="149.9" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2 halo" x="494.66666666666663" y="140.94703241775" text-anchor="start">1.99</text><circle cx="563.3" cy="188.2" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2 halo" x="571.3333333333333" y="179.17841171654183" text-anchor="start">1.67</text><circle cx="640.0" cy="226.4" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2 halo" x="648.0" y="217.4097910153336" text-anchor="start">1.41</text><text class="sub2" x="196.0" y="290" text-anchor="middle">parameters</text><text class="sub2" x="525.0" y="290" text-anchor="middle">parameters</text><text class="cap" x="40" y="332" text-anchor="start">In 2020 Kaplan and colleagues measured how a language model's loss falls as the model,</text><text class="cap" x="40" y="352" text-anchor="start">the data and the training compute grow. Against model size it follows</text><text class="cap" x="40" y="372" text-anchor="start">L = (8.8 × 10¹³ / N)^0.076, for N parameters outside the embedding table and the loss of</text><text class="cap" x="40" y="392" text-anchor="start">{{fig:v06-o004}}.</text><text class="cap" x="40" y="432" text-anchor="start">That is a power law: every tenfold step in N multiplies the loss by the same factor,</text><text class="cap" x="40" y="452" text-anchor="start">10^−0.076 = 0.84, a 16% cut, and every doubling by 2^−0.076 = 0.95. On ordinary axes the</text><text class="cap" x="40" y="472" text-anchor="start">curve plunges and flattens, and the small models crowd against the left edge.</text><text class="cap" x="40" y="512" text-anchor="start">Take logarithms of both sides and log L = 0.076 × log(8.8 × 10¹³) − 0.076 × log N: a</text><text class="cap" x="40" y="532" text-anchor="start">straight line in log N, falling with slope −0.076 ({{fig:v01-o121}}). A straight line</text><text class="cap" x="40" y="552" text-anchor="start">can be extended, so the loss of a model ten times larger can be forecast before anything</text><text class="cap" x="40" y="572" text-anchor="start">is spent building it. Data and compute follow power laws of the same shape, with</text><text class="cap" x="40" y="592" text-anchor="start">exponents of their own.</text></svg><figcaption>Predictability is what makes the spend rational. If ten times the parameters reliably buys a 16% lower loss, the parameter count keeps climbing.</figcaption></figure>
