<figure><div class='ts'>Fig 05 &nbsp;&middot;&nbsp; 0:51</div><h3>Scaling laws are the pressure pushing sizes up</h3><svg viewBox='0 0 680 504' role='img'><title>Scaling laws are the pressure pushing sizes up</title><line class="axis" x1="90" y1="240" x2="620" y2="240"/><line class="axis" x1="90" y1="50" x2="90" y2="240"/><polyline class="pl-h" points="120,80 250,132 400,180 590,214"/><text class="sub2" x="96" y="68" text-anchor="start">loss</text><text class="sub2" x="560" y="264" text-anchor="middle">model, data, compute</text><text class="cap" x="40" y="302" text-anchor="start">In 2020 Kaplan and colleagues measured how a language model's loss, the error it makes</text><text class="cap" x="40" y="322" text-anchor="start">predicting the next token, falls as you grow the model, the data and the training compute.</text><text class="cap" x="40" y="362" text-anchor="start">It falls as a power law in all three. On logarithmic axes the messy curve becomes a straight</text><text class="cap" x="40" y="382" text-anchor="start">line sloping down, which means you can forecast how much better a bigger model will be before</text><text class="cap" x="40" y="402" text-anchor="start">spending anything building it.</text><text class="cap" x="40" y="442" text-anchor="start">Two years later the Chinchilla paper corrected the recipe without changing its direction: for a</text><text class="cap" x="40" y="462" text-anchor="start">fixed compute budget, model and data should grow together, and many models of that era turned</text><text class="cap" x="40" y="482" text-anchor="start">out oversized for the data they were fed.</text></svg><figcaption>Predictability is what makes the spend rational. If bigger reliably means better, the parameter count keeps climbing.</figcaption></figure>
