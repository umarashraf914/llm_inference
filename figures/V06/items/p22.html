<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 9:57</div><h3>Slicing changes the number of teams, not the bill</h3><svg viewBox='0 0 680 622' role='img'><title>Slicing changes the number of teams, not the bill</title><text class="hd" x="40" y="46">The same weights cut into two pieces or eight, drawn to scale</text><text class="cap" x="40" y="89" text-anchor="start">two full experts</text><g class="m"><rect x="230.0" y="70" width="200.0" height="28" rx="3"/><text class="sub" x="330.0" y="84.0" text-anchor="middle" dominant-baseline="central">176.2 M</text></g><g class="m"><rect x="430.0" y="70" width="200.0" height="28" rx="3"/><text class="sub" x="530.0" y="84.0" text-anchor="middle" dominant-baseline="central">176.2 M</text></g><text class="cap" x="40" y="131" text-anchor="start">eight quarter experts</text><g class="m"><rect x="230.0" y="112.0" width="50.0" height="28.0" rx="3"/></g><g class="m"><rect x="280.0" y="112.0" width="50.0" height="28.0" rx="3"/></g><g class="m"><rect x="330.0" y="112.0" width="50.0" height="28.0" rx="3"/></g><g class="m"><rect x="380.0" y="112.0" width="50.0" height="28.0" rx="3"/></g><g class="m"><rect x="430.0" y="112.0" width="50.0" height="28.0" rx="3"/></g><g class="m"><rect x="480.0" y="112.0" width="50.0" height="28.0" rx="3"/></g><g class="m"><rect x="530.0" y="112.0" width="50.0" height="28.0" rx="3"/></g><g class="m"><rect x="580.0" y="112.0" width="50.0" height="28.0" rx="3"/></g><text class="sub2" x="230" y="162" text-anchor="start">44.0 million each; 352.3 million either way</text><text class="hd" x="40" y="212">DeepSeek V3: a token runs one dense block's worth</text><text class="cap" x="40" y="250" text-anchor="start">a dense layer's block</text><g class="m"><rect x="230" y="232" width="400" height="28" rx="3"/><text class="sub" x="430.0" y="246.0" text-anchor="middle" dominant-baseline="central">18,432 wide: 396.4 M</text></g><text class="cap" x="40" y="292" text-anchor="start">8 routed + 1 shared</text><g class="m"><rect x="230.0" y="274.0" width="44.4" height="28.0" rx="3"/></g><g class="m"><rect x="274.4" y="274.0" width="44.4" height="28.0" rx="3"/></g><g class="m"><rect x="318.9" y="274.0" width="44.4" height="28.0" rx="3"/></g><g class="m"><rect x="363.3" y="274.0" width="44.4" height="28.0" rx="3"/></g><g class="m"><rect x="407.8" y="274.0" width="44.4" height="28.0" rx="3"/></g><g class="m"><rect x="452.2" y="274.0" width="44.4" height="28.0" rx="3"/></g><g class="m"><rect x="496.7" y="274.0" width="44.4" height="28.0" rx="3"/></g><g class="m"><rect x="541.1" y="274.0" width="44.4" height="28.0" rx="3"/></g><g class="s"><rect x="585.6" y="274.0" width="44.4" height="28.0" rx="3"/></g><text class="sub2" x="230" y="322" text-anchor="start">2,048 wide each: 9 × 44.04 M = 396.4 M; the last is the shared expert</text><text class="cap" x="40" y="370" text-anchor="start">An expert's weights are its three matrices, each the token's width by the expert's own</text><text class="cap" x="40" y="390" text-anchor="start">width ({{fig:v06-p06}}). Cut the expert's width to a quarter and every matrix shrinks to</text><text class="cap" x="40" y="410" text-anchor="start">a quarter: for an expert of Mixtral's size, 3 × 4,096 × 14,336 = 176.2 million weights</text><text class="cap" x="40" y="430" text-anchor="start">become 3 × 4,096 × 3,584 = 44.0 million. Each weight is one multiply-add, so the work</text><text class="cap" x="40" y="450" text-anchor="start">shrinks with it.</text><text class="cap" x="40" y="490" text-anchor="start">So eight quarter-experts cost what two full experts cost, 352.3 million weights either</text><text class="cap" x="40" y="510" text-anchor="start">way, while the teams go from 120 to 4,426,165,368.</text><text class="cap" x="40" y="550" text-anchor="start">DeepSeek V3 is built exactly so. Its first three layers keep a dense block 18,432 wide,</text><text class="cap" x="40" y="570" text-anchor="start">and 18,432 = 9 × 2,048: a token's 8 routed experts plus the shared one are one dense</text><text class="cap" x="40" y="590" text-anchor="start">block of work, chosen from 257 held.</text></svg><figcaption>Bars drawn to scale. Fine-grained experts spend nothing extra per token; what they buy is choice, and what they cost is the memory to hold all of them.</figcaption></figure>
