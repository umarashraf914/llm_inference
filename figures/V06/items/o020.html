<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 17:34</div><h3>The communication bill</h3><svg viewBox='0 0 680 512' role='img'><title>The communication bill</title><text class="hd" x="40" y="46">One token through one MoE layer</text><g class="u"><rect x="40" y="70" width="110" height="40" rx="8"/><text class="lbl" x="95.0" y="90.0" text-anchor="middle" dominant-baseline="central">sits on a GPU</text></g><g class="s"><rect x="176" y="70" width="130" height="40" rx="8"/><text class="lbl" x="241.0" y="90.0" text-anchor="middle" dominant-baseline="central">router picks 8</text></g><line class="conn" x1="156.0" y1="90.0" x2="170.0" y2="90.0" marker-end="url(#arw)"/><g class="h"><rect x="332" y="70" width="148" height="40" rx="8"/><text class="lbl" x="406.0" y="90.0" text-anchor="middle" dominant-baseline="central">dispatch, all-to-all</text></g><line class="conn" x1="312.0" y1="90.0" x2="326.0" y2="90.0" marker-end="url(#arw)"/><g class="h"><rect x="506" y="70" width="134" height="40" rx="8"/><text class="lbl" x="573.0" y="90.0" text-anchor="middle" dominant-baseline="central">combine, back</text></g><line class="conn" x1="486.0" y1="90.0" x2="500.0" y2="90.0" marker-end="url(#arw)"/><text class="hd" x="40" y="152" text-anchor="start">Measured in DeepSeek's training runs, before optimisation</text><text class="cap" x="40" y="186" text-anchor="start">computing</text><g class="m"><rect x="220.0" y="170.0" width="200.0" height="26.0" rx="3"/></g><text class="cap" x="40" y="224" text-anchor="start">waiting on the network</text><g class="h"><rect x="220.0" y="208.0" width="200.0" height="26.0" rx="3"/></g><text class="sub2" x="432" y="204" text-anchor="start">roughly one to one</text><text class="cap" x="40" y="280" text-anchor="start">The router picks eight experts, and those experts live mostly on other machines. So</text><text class="cap" x="40" y="300" text-anchor="start">every MoE layer runs two all-to-all exchanges ({{fig:v05-o016}}): a dispatch that ships each</text><text class="cap" x="40" y="320" text-anchor="start">token out to the GPUs holding its chosen experts, and a combine that carries the results</text><text class="cap" x="40" y="340" text-anchor="start">back home.</text><text class="cap" x="40" y="380" text-anchor="start">Both sit on the decode critical path, the time per output token ({{fig:v01-o143}}). Before</text><text class="cap" x="40" y="400" text-anchor="start">optimisation, DeepSeek's training runs showed computation and communication at roughly</text><text class="cap" x="40" y="420" text-anchor="start">one to one: for every moment computing, a moment waiting on the network.</text><text class="cap" x="40" y="460" text-anchor="start">Meanwhile every expert stays resident in memory, busy or not, which is why the economics</text><text class="cap" x="40" y="480" text-anchor="start">hinge on how many tokens arrive together ({{fig:v06-p37}}).</text></svg><figcaption>Schematic bars. The one-to-one ratio is a training measurement taken before DeepSeek's optimisations, not a serving figure; what it shows is that the shuffling can cost as much as the work it feeds.</figcaption></figure>
