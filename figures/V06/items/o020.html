<figure><div class='ts'>Fig 20 &nbsp;&middot;&nbsp; 17:44</div><h3>The communication bill</h3><svg viewBox='0 0 680 476' role='img'><title>The communication bill</title><text class="hd" x="40" y="46">One token through one layer</text><g class="u"><rect x="40" y="70" width="110" height="40" rx="4"/><text class="sub" x="95.0" y="90.0" text-anchor="middle" dominant-baseline="central">sits on a GPU</text></g><line class="conn" x1="156" y1="90" x2="176" y2="90" marker-end="url(#arw)"/><g class="s"><rect x="182" y="70" width="130" height="40" rx="4"/><text class="sub" x="247.0" y="90.0" text-anchor="middle" dominant-baseline="central">router picks 8</text></g><line class="conn" x1="318" y1="90" x2="338" y2="90" marker-end="url(#arw)"/><g class="h"><rect x="344" y="70" width="140" height="40" rx="4"/><text class="sub" x="414.0" y="90.0" text-anchor="middle" dominant-baseline="central">dispatch, all-to-all</text></g><line class="conn" x1="490" y1="90" x2="510" y2="90" marker-end="url(#arw)"/><g class="h"><rect x="516" y="70" width="124" height="40" rx="4"/><text class="sub" x="578.0" y="90.0" text-anchor="middle" dominant-baseline="central">combine, back</text></g><text class="cap" x="40" y="148" text-anchor="start">Both sit on the decode critical path, the time per output token.</text><text class="cap" x="40" y="198" text-anchor="start">Compute</text><g class="m"><rect x="200" y="182" width="200" height="30" rx="3"/></g><text class="cap" x="40" y="248" text-anchor="start">Waiting on the network</text><g class="h"><rect x="200" y="232" width="200" height="30" rx="3"/></g><text class="sub2" x="420" y="232" text-anchor="start">roughly one to one, before optimisation</text><text class="cap" x="40" y="314" text-anchor="start">For every moment computing, a moment waiting on the network.</text><text class="cap" x="40" y="354" text-anchor="start">Which is why the economics hinge on concurrency. It takes thousands of simultaneous requests</text><text class="cap" x="40" y="374" text-anchor="start">before all 256 experts have real work, and even then each expert's batch usually stays within</text><text class="cap" x="40" y="394" text-anchor="start">256 tokens, still limited by memory access.</text><text class="cap" x="40" y="434" text-anchor="start">At batch one you get the worst of both sides: the full 671 GB resident, eight experts working,</text><text class="cap" x="40" y="454" text-anchor="start">and a KV cache exactly as large as a dense model would carry.</text></svg><figcaption>The last paragraph is the one to remember. Sparsity is an architecture that only pays off in a crowd.</figcaption></figure>
