<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 21:49</div><h3>Six episodes, one stack</h3><svg viewBox='0 0 680 658' role='img'><title>Six episodes, one stack</title><text class="hd" x="40" y="46">Six episodes, each answering what the one before left</text><text class="cap" x="40" y="87" text-anchor="start">V1</text><g class="u"><rect x="80" y="66" width="320" height="32" rx="8"/><text class="lbl" x="240.0" y="82.0" text-anchor="middle" dominant-baseline="central">decode waits on reading every weight</text></g><text class="sub2" x="414" y="87" text-anchor="start">the memory wall</text><line class="conn" x1="240" y1="100" x2="240" y2="110" marker-end="url(#arw)"/><text class="cap" x="40" y="133" text-anchor="start">V2</text><g class="u"><rect x="80" y="112" width="320" height="32" rx="8"/><text class="lbl" x="240.0" y="128.0" text-anchor="middle" dominant-baseline="central">the chip's tiers and what they cost</text></g><text class="sub2" x="414" y="133" text-anchor="start">inside the GPU</text><line class="conn" x1="240" y1="146" x2="240" y2="156" marker-end="url(#arw)"/><text class="cap" x="40" y="179" text-anchor="start">V3</text><g class="u"><rect x="80" y="158" width="320" height="32" rx="8"/><text class="lbl" x="240.0" y="174.0" text-anchor="middle" dominant-baseline="central">kernels that move fewer bytes</text></g><text class="sub2" x="414" y="179" text-anchor="start">kernels and memory</text><line class="conn" x1="240" y1="192" x2="240" y2="202" marker-end="url(#arw)"/><text class="cap" x="40" y="225" text-anchor="start">V4</text><g class="u"><rect x="80" y="204" width="320" height="32" rx="8"/><text class="lbl" x="240.0" y="220.0" text-anchor="middle" dominant-baseline="central">fewer bits for every weight</text></g><text class="sub2" x="414" y="225" text-anchor="start">quantization</text><line class="conn" x1="240" y1="238" x2="240" y2="248" marker-end="url(#arw)"/><text class="cap" x="40" y="271" text-anchor="start">V5</text><g class="u"><rect x="80" y="250" width="320" height="32" rx="8"/><text class="lbl" x="240.0" y="266.0" text-anchor="middle" dominant-baseline="central">a model too big for one chip, split</text></g><text class="sub2" x="414" y="271" text-anchor="start">parallelism</text><line class="conn" x1="240" y1="284" x2="240" y2="294" marker-end="url(#arw)"/><text class="cap" x="40" y="317" text-anchor="start">V6</text><g class="m"><rect x="80" y="296" width="320" height="32" rx="8"/><text class="lbl" x="240.0" y="312.0" text-anchor="middle" dominant-baseline="central">only part of the model run per token</text></g><text class="sub2" x="414" y="317" text-anchor="start">mixture of experts</text><line class="conn" x1="240" y1="330" x2="240" y2="340" marker-end="url(#arw)"/><g class="h"><rect x="80" y="346" width="320" height="32" rx="8"/><text class="lbl" x="240.0" y="362.0" text-anchor="middle" dominant-baseline="central">it assumes a crowd: enough users at once</text></g><text class="sub2" x="414" y="367" text-anchor="start">V7, serving in production</text><text class="cap" x="40" y="426" text-anchor="start">Over six episodes the series has assembled an inference stack piece by piece: the memory</text><text class="cap" x="40" y="446" text-anchor="start">wall, the hardware and the kernels beneath it, weights shrunk to fewer bits, the model</text><text class="cap" x="40" y="466" text-anchor="start">split across GPUs, and now its compute made sparse.</text><text class="cap" x="40" y="506" text-anchor="start">But sparsity makes a quiet assumption. When one request arrives, eight experts do a</text><text class="cap" x="40" y="526" text-anchor="start">little work and the other 248 do nothing at all ({{fig:v06-p39}}). For any of this to</text><text class="cap" x="40" y="546" text-anchor="start">make sense there have to be enough users on the system at the same moment to keep every</text><text class="cap" x="40" y="566" text-anchor="start">expert busy, while every one of those users still waits on an answer.</text><text class="cap" x="40" y="606" text-anchor="start">How a serving system gathers that crowd and gets everyone their answer on time is the</text><text class="cap" x="40" y="626" text-anchor="start">next episode.</text></svg><figcaption>Each episode answered the bottleneck the one before it left. This one leaves a demand rather than a bottleneck: a crowd, served fast.</figcaption></figure>
