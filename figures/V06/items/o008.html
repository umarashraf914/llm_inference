<figure><div class='ts'>Fig 08 &nbsp;&middot;&nbsp; 4:20</div><h3>And most of the model is in that half</h3><svg viewBox='0 0 680 282' role='img'><title>And most of the model is in that half</title><text class="cap" x="40" y="78" text-anchor="start">Feed-forward layers</text><g class="m"><rect x="280" y="62" width="227" height="32" rx="3"/><text class="sub" x="393.5" y="78.0" text-anchor="middle" dominant-baseline="central">about two thirds of the parameters</text></g><text class="cap" x="40" y="138" text-anchor="start">Everything else</text><g class="u"><rect x="280" y="122" width="113" height="32" rx="3"/><text class="sub" x="336.5" y="138.0" text-anchor="middle" dominant-baseline="central">one third</text></g><text class="cap" x="40" y="200" text-anchor="start">So the feed-forward network is simultaneously where the recall happens and where most of the</text><text class="cap" x="40" y="220" text-anchor="start">model lives. That makes it the obvious thing to sparsify.</text><text class="cap" x="40" y="260" text-anchor="start">Attention is left exactly as it was. The change is surprisingly local.</text></svg><figcaption>Two facts landing on the same block: it holds the knowledge and it holds the weight. Sparsifying anything else would help far less.</figcaption></figure>
