<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:24</div><h3>Where two thirds comes from: 4d² against 8d²</h3><svg viewBox='0 0 680 608' role='img'><title>Where two thirds comes from: 4d² against 8d²</title><text class="hd" x="40" y="46">Each matrix drawn with area in proportion to its count of weights</text><text class="cap" x="40" y="96" text-anchor="start">attention</text><g class="u"><rect x="170" y="72" width="40" height="40" rx="3"/><text class="sub" x="190.0" y="92.0" text-anchor="middle" dominant-baseline="central">Q</text></g><g class="u"><rect x="218" y="72" width="40" height="40" rx="3"/><text class="sub" x="238.0" y="92.0" text-anchor="middle" dominant-baseline="central">K</text></g><g class="u"><rect x="266" y="72" width="40" height="40" rx="3"/><text class="sub" x="286.0" y="92.0" text-anchor="middle" dominant-baseline="central">V</text></g><g class="u"><rect x="314" y="72" width="40" height="40" rx="3"/><text class="sub" x="334.0" y="92.0" text-anchor="middle" dominant-baseline="central">O</text></g><text class="sub2" x="370" y="96" text-anchor="start">four matrices of d × d:  4d²</text><text class="cap" x="40" y="164" text-anchor="start">feed-forward</text><g class="m"><rect x="170" y="140" width="160" height="40" rx="3"/><text class="sub" x="250.0" y="160.0" text-anchor="middle" dominant-baseline="central">first, d × 4d</text></g><g class="m"><rect x="338" y="140" width="160" height="40" rx="3"/><text class="sub" x="418.0" y="160.0" text-anchor="middle" dominant-baseline="central">second, 4d × d</text></g><text class="sub2" x="170" y="202" text-anchor="start">each the area of four of the squares above:  4d² + 4d² = 8d²</text><g class="u"><rect x="40" y="236" width="150" height="40" rx="6"/><text class="sub" x="115.0" y="256.0" text-anchor="middle" dominant-baseline="central">attention  4d²</text></g><text class="sub2" x="204" y="261" text-anchor="middle">+</text><g class="m"><rect x="218" y="236" width="160" height="40" rx="6"/><text class="sub" x="298.0" y="256.0" text-anchor="middle" dominant-baseline="central">feed-forward  8d²</text></g><text class="sub2" x="392" y="261" text-anchor="middle">=</text><g class="u"><rect x="406" y="236" width="110" height="40" rx="6"/><text class="sub" x="461.0" y="256.0" text-anchor="middle" dominant-baseline="central">12d²</text></g><g class="m"><rect x="40" y="292" width="290" height="40" rx="6"/><text class="sub" x="185.0" y="312.0" text-anchor="middle" dominant-baseline="central">feed-forward share  8d² / 12d² = 2/3</text></g><text class="cap" x="40" y="376" text-anchor="start">A matrix that turns a vector of d numbers into another of d numbers is d × d, so d²</text><text class="cap" x="40" y="396" text-anchor="start">weights ({{fig:v01-o084}}). Attention makes queries, keys and values and combines the</text><text class="cap" x="40" y="416" text-anchor="start">result: four of them, 4d². The feed-forward block widens to 4d and narrows back: d × 4d</text><text class="cap" x="40" y="436" text-anchor="start">and 4d × d, 8d².</text><text class="cap" x="40" y="476" text-anchor="start">So the block holds 8 parts in 12, two thirds, whatever d is. At d = 4,096, d² is</text><text class="cap" x="40" y="496" text-anchor="start">16,777,216: 67.1 million weights of attention against 134.2 million of feed-forward in</text><text class="cap" x="40" y="516" text-anchor="start">every layer.</text><text class="cap" x="40" y="556" text-anchor="start">The gated form with three matrices keeps the count: its widening is cut to 8d/3, and 3 ×</text><text class="cap" x="40" y="576" text-anchor="start">d × 8d/3 = 8d² again.</text></svg><figcaption>A consequence of the shapes, not a measurement. Two thirds is the textbook layer; the next figure shows real layers leaning further still.</figcaption></figure>
