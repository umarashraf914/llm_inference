 r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2 halo" x="244.0" y="225.62597835359702" text-anchor="start">57</text><circle cx="340.0" cy="135.2" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2 halo" x="348.0" y="151.169952066137" text-anchor="start">163</text><circle cx="392.0" cy="93.6" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2 halo" x="400.0" y="109.59512584612551" text-anchor="start">222</text><circle cx="444.0" cy="73.1" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2 halo" x="452.0" y="89.09294424274722" text-anchor="start">252</text><circle cx="496.0" cy="70.1" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2 halo" x="504.0" y="86.05314613382635" text-anchor="start">256</text><text class="cap" x="40" y="330" text-anchor="start">One token wakes 8 of the 256 routed experts, so a given expert is left out by it with</text><text class="cap" x="40" y="350" text-anchor="start">probability 248/256. If the tokens of a step choose independently, an expert is left out</text><text class="cap" x="40" y="370" text-anchor="start">by all B of them with probability (248/256)^B: the same chance, multiplied B times.</text><text class="cap" x="40" y="410" text-anchor="start">So B tokens wake on average 256 × (1 − (248/256)^B) experts: 57 for 8 tokens, 163 for</text><text class="cap" x="40" y="430" text-anchor="start">32, 222 for 64, and nearly all for 256.</text><text class="cap" x="40" y="470" text-anchor="start">That assumes every expert is equally likely, which real routing is not; skewed traffic</text><text class="cap" x="40" y="490" text-anchor="start">wakes fewer for the same crowd. And woken is not busy: at 64 tokens the 222 woken</text><text class="cap" x="40" y="510" text-anchor="start">experts get 2.3 tokens each.</text></svg><figcaption>All 256 experts have something to do from a few hundred tokens up. Having enough to do takes a far bigger crowd, counted next.</figcaption></figure>
