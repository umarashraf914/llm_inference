<figure><div class='ts'>Fig 21 &nbsp;&middot;&nbsp; 18:35</div><h3>Taming the all-to-alls</h3><svg viewBox='0 0 680 438' role='img'><title>Taming the all-to-alls</title><text class="hd" x="40" y="46">Three tricks to keep the shuffling off the critical path</text><g class="s"><rect x="40" y="70" width="190" height="60" rx="8"/><text class="lbl" x="135.0" y="100.0" text-anchor="middle" dominant-baseline="central">Node-limited routing</text></g><line class="conn" x1="236" y1="100" x2="256" y2="100" marker-end="url(#arw)"/><g class="u"><rect x="262" y="82" width="378" height="36" rx="4"/><text class="sub" x="451.0" y="100.0" text-anchor="middle" dominant-baseline="central">arrange 256 experts into 8 groups, one per node, and</text></g><text class="sub2" x="268" y="138" text-anchor="start"> cap each token at 4 nodes</text><g class="s"><rect x="40" y="148" width="190" height="60" rx="8"/><text class="lbl" x="135.0" y="178.0" text-anchor="middle" dominant-baseline="central">Overlap</text></g><line class="conn" x1="236" y1="178" x2="256" y2="178" marker-end="url(#arw)"/><g class="u"><rect x="262" y="160" width="378" height="36" rx="4"/><text class="sub" x="451.0" y="178.0" text-anchor="middle" dominant-baseline="central">run two microbatches staggered, so one computes whil</text></g><text class="sub2" x="268" y="216" text-anchor="start">e the other is in flight</text><g class="s"><rect x="40" y="226" width="190" height="60" rx="8"/><text class="lbl" x="135.0" y="256.0" text-anchor="middle" dominant-baseline="central">Redundant experts</text></g><line class="conn" x1="236" y1="256" x2="256" y2="256" marker-end="url(#arw)"/><g class="u"><rect x="262" y="238" width="378" height="36" rx="4"/><text class="sub" x="451.0" y="256.0" text-anchor="middle" dominant-baseline="central">duplicate the hottest experts on spare GPUs and spli</text></g><text class="sub2" x="268" y="294" text-anchor="start">t their queues</text><text class="cap" x="40" y="336" text-anchor="start">DeepSeek V3's prefill deployment carries 32 redundant experts.</text><text class="cap" x="40" y="376" text-anchor="start">Notice what none of this removes. The bytes still cross the network, every MoE layer, every</text><text class="cap" x="40" y="396" text-anchor="start">token, exactly as many as before. The three tricks only take that movement off the critical</text><text class="cap" x="40" y="416" text-anchor="start">path, so time per output token stops depending on it.</text></svg><figcaption>A distinction worth being precise about: the traffic is hidden, not reduced. Bandwidth is still consumed; it is just no longer in the way.</figcaption></figure>
