<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 18:51</div><h3>Taming the all-to-alls</h3><svg viewBox='0 0 680 450' role='img'><title>Taming the all-to-alls</title><text class="hd" x="40" y="46">Three tricks to keep the shuffling off the critical path</text><g class="s"><rect x="40" y="66" width="190" height="52" rx="8"/><text class="lbl" x="135.0" y="92.0" text-anchor="middle" dominant-baseline="central">Node-limited routing</text></g><line class="conn" x1="236.0" y1="92.0" x2="256.0" y2="92.0" marker-end="url(#arw)"/><g class="u"><rect x="262" y="66" width="378" height="52" rx="6"/><text class="sub" x="451.0" y="83.0" text-anchor="middle" dominant-baseline="central">256 experts in 8 groups, one per node;</text><text class="sub" x="451.0" y="101.0" text-anchor="middle" dominant-baseline="central">each token reaches at most 4 nodes</text></g><g class="s"><rect x="40" y="130" width="190" height="52" rx="8"/><text class="lbl" x="135.0" y="156.0" text-anchor="middle" dominant-baseline="central">Overlap</text></g><line class="conn" x1="236.0" y1="156.0" x2="256.0" y2="156.0" marker-end="url(#arw)"/><g class="u"><rect x="262" y="130" width="378" height="52" rx="6"/><text class="sub" x="451.0" y="147.0" text-anchor="middle" dominant-baseline="central">two staggered microbatches: one computes</text><text class="sub" x="451.0" y="165.0" text-anchor="middle" dominant-baseline="central">while the other is on the network</text></g><g class="s"><rect x="40" y="194" width="190" height="52" rx="8"/><text class="lbl" x="135.0" y="220.0" text-anchor="middle" dominant-baseline="central">Redundant experts</text></g><line class="conn" x1="236.0" y1="220.0" x2="256.0" y2="220.0" marker-end="url(#arw)"/><g class="u"><rect x="262" y="194" width="378" height="52" rx="6"/><text class="sub" x="451.0" y="211.0" text-anchor="middle" dominant-baseline="central">the hottest experts copied to spare GPUs,</text><text class="sub" x="451.0" y="229.0" text-anchor="middle" dominant-baseline="central">their queues split between the copies</text></g><text class="cap" x="40" y="298" text-anchor="start">Left unchecked, the two all-to-alls in every layer would sink decode latency, so MoE</text><text class="cap" x="40" y="318" text-anchor="start">serving leans on three tricks, each worked in the figures that follow.</text><text class="cap" x="40" y="358" text-anchor="start">Notice what none of them removes. The bytes still cross the network, every MoE layer,</text><text class="cap" x="40" y="378" text-anchor="start">every token. Node-limited routing moves some of them onto faster wires; overlap and</text><text class="cap" x="40" y="398" text-anchor="start">redundancy only take the movement off the critical path, so the time per output token</text><text class="cap" x="40" y="418" text-anchor="start">stops depending on it.</text></svg><figcaption>A distinction worth being precise about: the traffic is moved and hidden, never removed. Bandwidth is still consumed; it is just no longer in the way.</figcaption></figure>
