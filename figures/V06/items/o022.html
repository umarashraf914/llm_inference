<figure><div class='ts'>Fig 22 &nbsp;&middot;&nbsp; 20:14</div><h3>Deriving the split</h3><svg viewBox='0 0 680 512' role='img'><title>Deriving the split</title><text class="hd" x="40" y="46">Count what actually fires</text><g class="u"><rect x="40" y="70" width="320" height="40" rx="4"/><text class="sub" x="200.0" y="90.0" text-anchor="middle" dominant-baseline="central">The knowledge lives in the FFN</text></g><text class="sub2" x="376" y="94" text-anchor="start">so that is what MoE splits</text><g class="u"><rect x="40" y="128" width="320" height="40" rx="4"/><text class="sub" x="200.0" y="148.0" text-anchor="middle" dominant-baseline="central">256 routed experts per MoE layer</text></g><text class="sub2" x="376" y="152" text-anchor="start">plus one shared</text><g class="m"><rect x="40" y="186" width="320" height="40" rx="4"/><text class="sub" x="200.0" y="206.0" text-anchor="middle" dominant-baseline="central">The router runs just the top eight</text></g><text class="sub2" x="376" y="210" text-anchor="start">the shared expert runs alongside</text><g class="h"><rect x="40" y="244" width="320" height="40" rx="4"/><text class="sub" x="200.0" y="264.0" text-anchor="middle" dominant-baseline="central">Attention runs in full</text></g><text class="sub2" x="376" y="268" text-anchor="start">exactly as in a dense model</text><g class="s"><rect x="140" y="306" width="400" height="42" rx="6"/><text class="sub" x="340.0" y="327.0" text-anchor="middle" dominant-baseline="central">37 billion parameters, out of 671</text></g><text class="cap" x="40" y="390" text-anchor="start">A cluster holds the full set, every expert resident on some GPU, and ships each token to the</text><text class="cap" x="40" y="410" text-anchor="start">experts it picked. Per-token compute stays near the active 37 billion while stored knowledge</text><text class="cap" x="40" y="430" text-anchor="start">tracks the full 671.</text><text class="cap" x="40" y="470" text-anchor="start">That decoupling is what lets totals keep climbing: 1.6 trillion total with the active count</text><text class="cap" x="40" y="490" text-anchor="start">still in the tens of billions.</text></svg><figcaption>Every term in the derivation has been established. Nothing here is a rule of thumb.</figcaption></figure>
