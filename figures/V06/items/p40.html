t="26.0" rx="3"/></g><g class="h"><rect x="350.0" y="322.0" width="32.5" height="26.0" rx="3"/></g><g class="h"><rect x="382.5" y="322.0" width="32.5" height="26.0" rx="3"/></g><g class="h"><rect x="415.0" y="322.0" width="32.5" height="26.0" rx="3"/></g><g class="h"><rect x="447.5" y="322.0" width="32.5" height="26.0" rx="3"/></g><text class="sub2" x="490.0" y="340" text-anchor="start">8 × 7,168 = 57,344 bytes</text><text class="cap" x="40" y="376" text-anchor="start">with it, at most</text><g class="h"><rect x="220.0" y="358.0" width="32.5" height="26.0" rx="3"/></g><g class="h"><rect x="252.5" y="358.0" width="32.5" height="26.0" rx="3"/></g><g class="h"><rect x="285.0" y="358.0" width="32.5" height="26.0" rx="3"/></g><g class="h"><rect x="317.5" y="358.0" width="32.5" height="26.0" rx="3"/></g><text class="sub2" x="360.0" y="376" text-anchor="start">4 × 7,168 = 28,672 bytes</text><text class="cap" x="40" y="438" text-anchor="start">DeepSeek V3's 256 experts sit in 8 groups of 32, one group per node of its 8-node</text><text class="cap" x="40" y="458" text-anchor="start">layout. For each token a node scores the sum of its 2 best affinities (8 experts ÷ 4</text><text class="cap" x="40" y="478" text-anchor="start">nodes), the 4 best nodes are kept, and the token's 8 experts are chosen inside them.</text><text class="cap" x="40" y="518" text-anchor="start">Unconstrained, this token's best 8 would span 6 nodes. The limit keeps nodes 1, 2, 4, 6</text><text class="cap" x="40" y="538" text-anchor="start">and swaps the experts on nodes 3 and 5 for the next best inside the kept nodes: a small</text><text class="cap" x="40" y="558" text-anchor="start">cost in quality.</text><text class="cap" x="40" y="598" text-anchor="start">Machines talk over a network and the GPUs inside one machine over far faster links</text><text class="cap" x="40" y="618" text-anchor="start">({{fig:v05-o008}}). A token crosses to each target node once, over InfiniBand at</text><text class="cap" x="40" y="638" text-anchor="start">50 GB/s, then is forwarded inside the node over NVLink at 160 GB/s, 3.2 times faster. So</text><text class="cap" x="40" y="658" text-anchor="start">at most 4 copies, at one byte a number, cross between machines per token per layer,</text><text class="cap" x="40" y="678" text-anchor="start">instead of up to 8.</text></svg><figcaption>The affinities are illustrative; the rule is DeepSeek V3's. Every copy still reaches its expert; the cap only limits how many cross between machines, and the rest of the delivery rides NVLink.</figcaption></figure>
