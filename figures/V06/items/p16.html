<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:06</div><h3>Softmax turns the four scores into shares</h3><svg viewBox='0 0 680 594' role='img'><title>Softmax turns the four scores into shares</title><text class="hd" x="40" y="46">Subtract the largest score, raise e to each, divide by the total</text><text class="sub2" x="150" y="86" text-anchor="start">score</text><text class="sub2" x="232" y="86" text-anchor="start">minus 2.25</text><text class="sub2" x="318" y="86" text-anchor="start">e to that</text><text class="sub2" x="400" y="86" text-anchor="start">share of 1.720</text><text class="cap" x="40" y="122" text-anchor="start">expert 1</text><text class="sub2" x="150" y="122" text-anchor="start">2.25</text><text class="sub2" x="232" y="122" text-anchor="start">0.00</text><text class="sub2" x="318" y="122" text-anchor="start">1.000</text><g class="m"><rect x="400" y="104" width="133.7018396863334" height="28" rx="3"/></g><text class="sub2" x="543.7018396863334" y="122" text-anchor="start">0.581</text><text class="cap" x="40" y="168" text-anchor="start">expert 2</text><text class="sub2" x="150" y="168" text-anchor="start">−0.75</text><text class="sub2" x="232" y="168" text-anchor="start">−3.00</text><text class="sub2" x="318" y="168" text-anchor="start">0.050</text><g class="u"><rect x="400" y="150" width="6.656622633372666" height="28" rx="3"/></g><text class="sub2" x="416.65662263337265" y="168" text-anchor="start">0.029</text><text class="cap" x="40" y="214" text-anchor="start">expert 3</text><text class="sub2" x="150" y="214" text-anchor="start">1.75</text><text class="sub2" x="232" y="214" text-anchor="start">−0.50</text><text class="sub2" x="318" y="214" text-anchor="start">0.607</text><g class="m"><rect x="400" y="196" width="81.09426502974456" height="28" rx="3"/></g><text class="sub2" x="491.0942650297446" y="214" text-anchor="start">0.353</text><text class="cap" x="40" y="260" text-anchor="start">expert 4</text><text class="sub2" x="150" y="260" text-anchor="start">−0.50</text><text class="sub2" x="232" y="260" text-anchor="start">−2.75</text><text class="sub2" x="318" y="260" text-anchor="start">0.064</text><g class="u"><rect x="400" y="242" width="8.547272650549388" height="28" rx="3"/></g><text class="sub2" x="418.5472726505494" y="260" text-anchor="start">0.037</text><line class="tick" x1="318" y1="292" x2="370" y2="292"/><text class="sub2" x="318" y="312" text-anchor="start">1.720</text><text class="sub2" x="400" y="312" text-anchor="start">1.000</text><text class="sub2" x="232" y="312" text-anchor="start">total</text><text class="cap" x="40" y="362" text-anchor="start">Raising e to each number makes every value positive, and dividing by their total turns</text><text class="cap" x="40" y="382" text-anchor="start">them into shares that add to exactly one. That is softmax, the same step that turns a</text><text class="cap" x="40" y="402" text-anchor="start">model's word scores into probabilities ({{fig:v01-o009}}).</text><text class="cap" x="40" y="442" text-anchor="start">Subtracting the largest score first changes nothing in the answer. It divides every</text><text class="cap" x="40" y="462" text-anchor="start">e-value by the same e^2.25, and that factor cancels when each is divided by the total.</text><text class="cap" x="40" y="482" text-anchor="start">It only keeps the numbers small enough that a computer cannot overflow</text><text class="cap" x="40" y="502" text-anchor="start">({{fig:v03-o025}}).</text><text class="cap" x="40" y="542" text-anchor="start">Expert 1 leads expert 3 by only 0.5 in score, yet takes 0.58 of the budget to 0.35. The</text><text class="cap" x="40" y="562" text-anchor="start">ratio of their shares is e^0.5 = 1.65: a half-point lead becomes a 65% larger share.</text></svg><figcaption>Bars drawn to scale. The exponential rewards a lead: small gaps in score become large gaps in share, which is what makes the router's choice decisive.</figcaption></figure>
