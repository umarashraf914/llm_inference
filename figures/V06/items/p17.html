<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:17</div><h3>Keep two, renormalise, blend</h3><svg viewBox='0 0 680 748' role='img'><title>Keep two, renormalise, blend</title><text class="hd" x="40" y="46">Keep the two largest shares, drop the rest, rescale to one</text><text class="cap" x="40" y="88" text-anchor="start">expert 1</text><g class="m"><rect x="150" y="72" width="232.52493858492764" height="26" rx="3"/></g><text class="sub2" x="392.52493858492767" y="88" text-anchor="start">0.581  kept</text><text class="cap" x="40" y="128" text-anchor="start">expert 2</text><rect x="150" y="112" width="11.576735014561159" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="171.57673501456117" y="128" text-anchor="start">0.029  dropped: never runs</text><text class="cap" x="40" y="168" text-anchor="start">expert 3</text><g class="m"><rect x="150" y="152" width="141.03350439955577" height="26" rx="3"/></g><text class="sub2" x="301.0335043995558" y="168" text-anchor="start">0.353  kept</text><text class="cap" x="40" y="208" text-anchor="start">expert 4</text><rect x="150" y="192" width="14.864822000955458" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="174.86482200095546" y="208" text-anchor="start">0.037  dropped: never runs</text><text class="sub2" x="40" y="254" text-anchor="start">kept total 0.581 + 0.353 = 0.934; divide each by it</text><text class="cap" x="40" y="288" text-anchor="start">gate 1</text><g class="m"><rect x="150" y="272" width="248.98373248074185" height="26" rx="3"/></g><text class="sub2" x="408.9837324807419" y="288" text-anchor="start">0.622</text><text class="cap" x="40" y="328" text-anchor="start">gate 3</text><g class="m"><rect x="150" y="312" width="151.0162675192582" height="26" rx="3"/></g><text class="sub2" x="311.01626751925824" y="328" text-anchor="start">0.378</text><text class="hd" x="40" y="384">The gates weight the two experts' answers</text><text class="cap" x="40" y="424" text-anchor="start">expert 1's output</text><g class="u"><rect x="250" y="406" width="56" height="28" rx="3"/><text class="sub" x="278.0" y="420.0" text-anchor="middle" dominant-baseline="central">0.80</text></g><g class="u"><rect x="312" y="406" width="56" height="28" rx="3"/><text class="sub" x="340.0" y="420.0" text-anchor="middle" dominant-baseline="central">−0.20</text></g><g class="u"><rect x="374" y="406" width="56" height="28" rx="3"/><text class="sub" x="402.0" y="420.0" text-anchor="middle" dominant-baseline="central">0.40</text></g><g class="u"><rect x="436" y="406" width="56" height="28" rx="3"/><text class="sub" x="464.0" y="420.0" text-anchor="middle" dominant-baseline="central">0.00</text></g><text class="sub2" x="508" y="424" text-anchor="start">× 0.622</text><text class="cap" x="40" y="468" text-anchor="start">expert 3's output</text><g class="u"><rect x="250" y="450" width="56" height="28" rx="3"/><text class="sub" x="278.0" y="464.0" text-anchor="middle" dominant-baseline="central">0.10</text></g><g class="u"><rect x="312" y="450" width="56" height="28" rx="3"/><text class="sub" x="340.0" y="464.0" text-anchor="middle" dominant-baseline="central">0.60</text></g><g class="u"><rect x="374" y="450" width="56" height="28" rx="3"/><text class="sub" x="402.0" y="464.0" text-anchor="middle" dominant-baseline="central">−0.30</text></g><g class="u"><rect x="436" y="450" width="56" height="28" rx="3"/><text class="sub" x="464.0" y="464.0" text-anchor="middle" dominant-baseline="central">0.50</text></g><text class="sub2" x="508" y="468" text-anchor="start">× 0.378</text><line class="tick" x1="250" y1="485" x2="492" y2="485"/><text class="cap" x="40" y="512" text-anchor="start">layer output</text><g class="m"><rect x="250" y="494" width="56" height="28" rx="3"/><text class="sub" x="278.0" y="508.0" text-anchor="middle" dominant-baseline="central">0.54</text></g><g class="m"><rect x="312" y="494" width="56" height="28" rx="3"/><text class="sub" x="340.0" y="508.0" text-anchor="middle" dominant-baseline="central">0.10</text></g><g class="m"><rect x="374" y="494" width="56" height="28" rx="3"/><text class="sub" x="402.0" y="508.0" text-anchor="middle" dominant-baseline="central">0.14</text></g><g class="m"><rect x="436" y="494" width="56" height="28" rx="3"/><text class="sub" x="464.0" y="508.0" text-anchor="middle" dominant-baseline="central">0.19</text></g><text class="sub2" x="508" y="512" text-anchor="start">the gated sum</text><text class="cap" x="40" y="576" text-anchor="start">Experts 2 and 4 are switched off for this token: they are never run, which is the whole</text><text class="cap" x="40" y="596" text-anchor="start">saving. The two survivors' shares add to 0.934, so each is divided by 0.934 to make the</text><text class="cap" x="40" y="616" text-anchor="start">gates add back up to one.</text><text class="cap" x="40" y="656" text-anchor="start">Each chosen expert is a full feed-forward network that returns a vector the same length</text><text class="cap" x="40" y="676" text-anchor="start">as the token's. The layer's output is the gated sum: 0.622 of expert 1's answer plus</text><text class="cap" x="40" y="696" text-anchor="start">0.378 of expert 3's. The expert outputs here are illustrative; the arithmetic on them is</text><text class="cap" x="40" y="716" text-anchor="start">exact.</text></svg><figcaption>The same two numbers do both jobs: they chose which experts run, and they set how much each one's answer counts.</figcaption></figure>
