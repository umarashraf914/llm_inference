<figure><div class='ts'>Fig 01 &nbsp;&middot;&nbsp; 0:00</div><h3>Dense against sparse</h3><svg viewBox='0 0 680 424' role='img'><title>Dense against sparse</title><text class="hd" x="40" y="46">Dense: every token goes through every weight</text><g class="s"><rect x="60" y="70" width="90" height="40" rx="4"/><text class="sub" x="105.0" y="90.0" text-anchor="middle" dominant-baseline="central">token</text></g><g class="m"><rect x="180" y="70" width="66" height="40" rx="3"/></g><g class="m"><rect x="254" y="70" width="66" height="40" rx="3"/></g><g class="m"><rect x="328" y="70" width="66" height="40" rx="3"/></g><g class="m"><rect x="402" y="70" width="66" height="40" rx="3"/></g><g class="m"><rect x="476" y="70" width="66" height="40" rx="3"/></g><g class="m"><rect x="550" y="70" width="66" height="40" rx="3"/></g><text class="sub2" x="180" y="136" text-anchor="start">all six run</text><text class="hd" x="40" y="186">Sparse: every token goes through a chosen few</text><g class="s"><rect x="60" y="210" width="90" height="40" rx="4"/><text class="sub" x="105.0" y="230.0" text-anchor="middle" dominant-baseline="central">token</text></g><g class="u"><rect x="180" y="210" width="66" height="40" rx="3"/></g><g class="m"><rect x="254" y="210" width="66" height="40" rx="3"/></g><g class="u"><rect x="328" y="210" width="66" height="40" rx="3"/></g><g class="u"><rect x="402" y="210" width="66" height="40" rx="3"/></g><g class="m"><rect x="476" y="210" width="66" height="40" rx="3"/></g><g class="u"><rect x="550" y="210" width="66" height="40" rx="3"/></g><text class="sub2" x="180" y="276" text-anchor="start">two run, four sit idle</text><text class="cap" x="40" y="326" text-anchor="start">Same amount of stored knowledge either way. The difference is how much of it any single token</text><text class="cap" x="40" y="346" text-anchor="start">has to be multiplied against.</text><text class="cap" x="40" y="382" text-anchor="start">Sparse does not mean smaller. Every one of those blocks still occupies memory whether or not</text><text class="cap" x="40" y="402" text-anchor="start">this particular token woke it up.</text></svg><figcaption>The distinction the whole video turns on, and the one most often misread: sparsity cuts the work per token, not the size of the model.</figcaption></figure>
