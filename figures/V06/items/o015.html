<figure><div class='ts'>Fig 15 &nbsp;&middot;&nbsp; 10:56</div><h3>The shared expert</h3><svg viewBox='0 0 680 558' role='img'><title>The shared expert</title><text class="hd" x="40" y="46">The waste hiding inside the design</text><g class="u"><rect x="60" y="66" width="84" height="44" rx="4"/><text class="sub" x="102.0" y="88.0" text-anchor="middle" dominant-baseline="central">E1</text></g><g class="h"><rect x="60" y="116" width="84" height="20" rx="3"/><text class="sub" x="102.0" y="126.0" text-anchor="middle" dominant-baseline="central">basics</text></g><g class="u"><rect x="156" y="66" width="84" height="44" rx="4"/><text class="sub" x="198.0" y="88.0" text-anchor="middle" dominant-baseline="central">E2</text></g><g class="h"><rect x="156" y="116" width="84" height="20" rx="3"/><text class="sub" x="198.0" y="126.0" text-anchor="middle" dominant-baseline="central">basics</text></g><g class="u"><rect x="252" y="66" width="84" height="44" rx="4"/><text class="sub" x="294.0" y="88.0" text-anchor="middle" dominant-baseline="central">E3</text></g><g class="h"><rect x="252" y="116" width="84" height="20" rx="3"/><text class="sub" x="294.0" y="126.0" text-anchor="middle" dominant-baseline="central">basics</text></g><g class="u"><rect x="348" y="66" width="84" height="44" rx="4"/><text class="sub" x="390.0" y="88.0" text-anchor="middle" dominant-baseline="central">E4</text></g><g class="h"><rect x="348" y="116" width="84" height="20" rx="3"/><text class="sub" x="390.0" y="126.0" text-anchor="middle" dominant-baseline="central">basics</text></g><g class="u"><rect x="444" y="66" width="84" height="44" rx="4"/><text class="sub" x="486.0" y="88.0" text-anchor="middle" dominant-baseline="central">E5</text></g><g class="h"><rect x="444" y="116" width="84" height="20" rx="3"/><text class="sub" x="486.0" y="126.0" text-anchor="middle" dominant-baseline="central">basics</text></g><g class="u"><rect x="540" y="66" width="84" height="44" rx="4"/><text class="sub" x="582.0" y="88.0" text-anchor="middle" dominant-baseline="central">E6</text></g><g class="h"><rect x="540" y="116" width="84" height="20" rx="3"/><text class="sub" x="582.0" y="126.0" text-anchor="middle" dominant-baseline="central">basics</text></g><text class="sub2" x="60" y="168" text-anchor="start">every routed expert keeps meeting the common material and learns its own copy</text><text class="cap" x="40" y="218" text-anchor="start">Some knowledge is useful for almost every token: basic syntax, frequent patterns. But the</text><text class="cap" x="40" y="238" text-anchor="start">router scatters tokens across the pool, so the same basics end up duplicated everywhere, eating</text><text class="cap" x="40" y="258" text-anchor="start">capacity meant for specialised knowledge.</text><text class="hd" x="40" y="308">The fix: give the common work a permanent home</text><g class="s"><rect x="60" y="328" width="110" height="44" rx="4"/><text class="sub" x="115.0" y="350.0" text-anchor="middle" dominant-baseline="central">shared</text></g><text class="sub2" x="184" y="354" text-anchor="start">runs for every token, never goes through the router</text><text class="cap" x="40" y="414" text-anchor="start">Because it sees everything, the common patterns settle there, and the routed experts, freed</text><text class="cap" x="40" y="434" text-anchor="start">from relearning the basics, can actually specialise.</text><text class="cap" x="40" y="474" text-anchor="start">The DeepSeekMoE paper brought this in alongside fine-grained experts. DeepSeek V3 pairs</text><text class="cap" x="40" y="494" text-anchor="start">one shared expert with its 256 routed ones; Llama 4 Maverick does the same, and so does</text><text class="cap" x="40" y="514" text-anchor="start">Kimi K2, the trillion-parameter model. Qwen 3, at 235 billion parameters, deliberately</text><text class="cap" x="40" y="534" text-anchor="start">leaves it out, so it is popular but not required.</text></svg><figcaption>A refinement that costs one always-on expert and buys specialisation in all the others.</figcaption></figure>
