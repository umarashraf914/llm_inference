m"><rect x="392" y="174" width="32" height="22" rx="3"/><text class="sub" x="408.0" y="185.0" text-anchor="middle" dominant-baseline="central">t7</text></g><g class="m"><rect x="428" y="174" width="32" height="22" rx="3"/><text class="sub" x="444.0" y="185.0" text-anchor="middle" dominant-baseline="central">t8</text></g><text class="sub2" x="284" y="214" text-anchor="start">5 tokens: weights read once, used 5 times, 10 operations per byte</text><text class="cap" x="250" y="242" text-anchor="start">E4</text><g class="m"><rect x="284" y="226" width="32" height="22" rx="3"/><text class="sub" x="300.0" y="237.0" text-anchor="middle" dominant-baseline="central">t3</text></g><g class="m"><rect x="320" y="226" width="32" height="22" rx="3"/><text class="sub" x="336.0" y="237.0" text-anchor="middle" dominant-baseline="central">t8</text></g><text class="sub2" x="284" y="266" text-anchor="start">2 tokens: weights read once, used 2 times, 4 operations per byte</text><text class="cap" x="40" y="346" text-anchor="start">A serving system decodes many requests together. Each step makes the next token for</text><text class="cap" x="40" y="366" text-anchor="start">every one of them, so a step carries B tokens, one per request. After routing, those</text><text class="cap" x="40" y="386" text-anchor="start">tokens are regrouped by destination, and each expert receives a small batch of its own:</text><text class="cap" x="40" y="406" text-anchor="start">the eight tokens of {{fig:v06-p24}} become batches of 6, 3, 5 and 2.</text><text class="cap" x="40" y="446" text-anchor="start">An expert reads its weights once per step and applies them to every token in its batch.</text><text class="cap" x="40" y="466" text-anchor="start">At one byte a weight and two operations per weight per token, it does 2 × its token</text><text class="cap" x="40" y="486" text-anchor="start">count operations per byte read: the batching rule of {{fig:v04-o055}}, applied to each expert</text><text class="cap" x="40" y="506" text-anchor="start">separately.</text><text class="cap" x="40" y="546" text-anchor="start">However large the step, an expert sees only its slice. With 8 of 256 experts per token,</text><text class="cap" x="40" y="566" text-anchor="start">a step of B tokens gives each expert, on average, B × 8 / 256 = B / 32 of them.</text></svg><figcaption>A step of B tokens is not one batch but N small ones. Whether they are big enough to keep the chip busy is the question of the next two figures.</figcaption></figure>
