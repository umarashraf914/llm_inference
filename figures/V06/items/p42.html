 text-anchor="start">6</text><text class="sub2" x="40" y="312" text-anchor="start">the layer takes 40</text><text class="sub2" x="360" y="72" text-anchor="start">with a copy on a spare GPU</text><text class="cap" x="360" y="98" text-anchor="start">GPU 1</text><g class="s"><rect x="420.0" y="84.0" width="110.0" height="18.0" rx="3"/></g><text class="sub2" x="536.0" y="98" text-anchor="start">20</text><text class="cap" x="360" y="122" text-anchor="start">GPU 2</text><g class="m"><rect x="420.0" y="108.0" width="110.0" height="18.0" rx="3"/></g><text class="sub2" x="536.0" y="122" text-anchor="start">20</text><text class="cap" x="360" y="146" text-anchor="start">GPU 3</text><g class="m"><rect x="420.0" y="132.0" width="99.0" height="18.0" rx="3"/></g><text class="sub2" x="525.0" y="146" text-anchor="start">18</text><text class="cap" x="360" y="170" text-anchor="start">GPU 4</text><g class="m"><rect x="420.0" y="156.0" width="88.0" height="18.0" rx="3"/></g><text class="sub2" x="514.0" y="170" text-anchor="start">16</text><text class="cap" x="360" y="194" text-anchor="start">GPU 5</text><g class="m"><rect x="420.0" y="180.0" width="77.0" height="18.0" rx="3"/></g><text class="sub2" x="503.0" y="194" text-anchor="start">14</text><text class="cap" x="360" y="218" text-anchor="start">GPU 6</text><g class="m"><rect x="420.0" y="204.0" width="66.0" height="18.0" rx="3"/></g><text class="sub2" x="492.0" y="218" text-anchor="start">12</text><text class="cap" x="360" y="242" text-anchor="start">GPU 7</text><g class="m"><rect x="420.0" y="228.0" width="55.0" height="18.0" rx="3"/></g><text class="sub2" x="481.0" y="242" text-anchor="start">10</text><text class="cap" x="360" y="266" text-anchor="start">GPU 8</text><g class="m"><rect x="420.0" y="252.0" width="33.0" height="18.0" rx="3"/></g><text class="sub2" x="459.0" y="266" text-anchor="start">6</text><text class="cap" x="360" y="290" text-anchor="start">GPU 9</text><g class="s"><rect x="420.0" y="276.0" width="110.0" height="18.0" rx="3"/></g><text class="sub2" x="536.0" y="290" text-anchor="start">20</text><text class="sub2" x="360" y="312" text-anchor="start">the layer takes 20</text><text class="cap" x="40" y="356" text-anchor="start">The layer waits for its busiest GPU ({{fig:v06-p27}}). Copy GPU 1's hot expert to a spare GPU</text><text class="cap" x="40" y="376" text-anchor="start">and send half its tokens to each copy: 40 becomes 20 + 20, the busiest GPU now carries</text><text class="cap" x="40" y="396" text-anchor="start">20, and the layer finishes in half the time.</text><text class="cap" x="40" y="436" text-anchor="start">The copy costs one more expert's memory and nothing else; no token is dropped and no</text><text class="cap" x="40" y="456" text-anchor="start">traffic removed, only re-pointed. DeepSeek V3's prefill deployment carries 32 such</text><text class="cap" x="40" y="476" text-anchor="start">redundant experts, chosen from load statistics gathered while serving and re-chosen</text><text class="cap" x="40" y="496" text-anchor="start">periodically.</text></svg><figcaption>Bars drawn to scale. One expert's worth of memory buys back half the layer: the hottest queue is where the time goes, so that is where the copy goes.</figcaption></figure>
