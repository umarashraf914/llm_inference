<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:57</div><h3>Mixtral's 46.7 billion, counted from its shapes</h3><svg viewBox='0 0 680 564' role='img'><title>Mixtral's 46.7 billion, counted from its shapes</title><text class="hd" x="40" y="46">Mixtral's weights, counted from its published shapes</text><text class="sub2" x="236" y="78" text-anchor="start">shape</text><text class="sub2" x="530" y="78" text-anchor="end">held</text><text class="sub2" x="640" y="78" text-anchor="end">run per token</text><text class="cap" x="40" y="104" text-anchor="start">attention: Q and O</text><text class="sub2" x="236" y="104" text-anchor="start">2 × 4,096 × 4,096</text><text class="sub2" x="530" y="104" text-anchor="end">33,554,432</text><text class="sub2" x="640" y="104" text-anchor="end">33,554,432</text><text class="cap" x="40" y="132" text-anchor="start">attention: K and V</text><text class="sub2" x="236" y="132" text-anchor="start">2 × 4,096 × 1,024</text><text class="sub2" x="530" y="132" text-anchor="end">8,388,608</text><text class="sub2" x="640" y="132" text-anchor="end">8,388,608</text><text class="cap" x="40" y="160" text-anchor="start">experts: 8 held, 2 run</text><text class="sub2" x="236" y="160" text-anchor="start">3 × 4,096 × 14,336 each</text><text class="sub2" x="530" y="160" text-anchor="end">1,409,286,144</text><text class="sub2" x="640" y="160" text-anchor="end">352,321,536</text><text class="cap" x="40" y="188" text-anchor="start">router and norms</text><text class="sub2" x="236" y="188" text-anchor="start">8 × 4,096 + 2 × 4,096</text><text class="sub2" x="530" y="188" text-anchor="end">40,960</text><text class="sub2" x="640" y="188" text-anchor="end">40,960</text><line class="tick" x1="236" y1="201" x2="640" y2="201"/><text class="cap" x="40" y="222" text-anchor="start">one layer</text><text class="sub2" x="236" y="222" text-anchor="start"></text><text class="sub2" x="530" y="222" text-anchor="end">1,451,270,144</text><text class="sub2" x="640" y="222" text-anchor="end">394,305,536</text><text class="cap" x="40" y="250" text-anchor="start">32 layers</text><text class="sub2" x="236" y="250" text-anchor="start">× 32</text><text class="sub2" x="530" y="250" text-anchor="end">46,440,644,608</text><text class="sub2" x="640" y="250" text-anchor="end">12,617,777,152</text><line class="tick" x1="236" y1="263" x2="640" y2="263"/><text class="cap" x="40" y="284" text-anchor="start">embedding and output head</text><text class="sub2" x="236" y="284" text-anchor="start">2 × 32,000 × 4,096, and a norm</text><text class="sub2" x="530" y="284" text-anchor="end">262,148,096</text><text class="sub2" x="640" y="284" text-anchor="end">262,148,096</text><line class="tick" x1="236" y1="297" x2="640" y2="297"/><text class="cap" x="40" y="322" text-anchor="start">total</text><g class="u"><rect x="418" y="304" width="112" height="26" rx="3"/><text class="sub" x="474.0" y="317.0" text-anchor="middle" dominant-baseline="central">46.70 billion</text></g><g class="m"><rect x="540" y="304" width="100" height="26" rx="3"/><text class="sub" x="590.0" y="317.0" text-anchor="middle" dominant-baseline="central">12.88 billion</text></g><text class="cap" x="40" y="372" text-anchor="start">Every count is rows × columns of a matrix ({{fig:v01-o101}} does the same sum for a</text><text class="cap" x="40" y="392" text-anchor="start">dense model). Mixtral's 32 query heads share 8 key-value heads, so K and V are a quarter</text><text class="cap" x="40" y="412" text-anchor="start">the size of Q and O. Each expert is the gated three-matrix block of {{fig:v06-p06}},</text><text class="cap" x="40" y="432" text-anchor="start">14,336 wide.</text><text class="cap" x="40" y="472" text-anchor="start">The held column keeps all eight experts in every layer; the run column keeps the two a</text><text class="cap" x="40" y="492" text-anchor="start">token is sent to. They land on Mistral's published 46.7 billion and 12.9 billion. Both</text><text class="cap" x="40" y="512" text-anchor="start">columns count the whole embedding table, as the published figures do; a token reads only</text><text class="cap" x="40" y="532" text-anchor="start">one row of it ({{fig:v01-o087}}), which would make the run column 12.75 billion.</text></svg><figcaption>Nothing about the headline numbers is mysterious: they are the shapes multiplied out. Experts are 97% of what Mixtral holds, which is why holding eight and running two divides the work by almost four.</figcaption></figure>
