<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 15:09</div><h3>The balancing push lands hardest on the popular expert, deserved or not</h3><svg viewBox='0 0 680 616' role='img'><title>The balancing push lands hardest on the popular expert, deserved or not</title><text class="hd" x="40" y="46">α × N × f: the slope of the balancing term for each expert's share, to scale</text><text class="cap" x="40" y="84" text-anchor="start">expert 1</text><g class="h"><rect x="150.0" y="66.0" width="252.0" height="26.0" rx="3"/></g><text class="sub2" x="412.0" y="84" text-anchor="start">0.01 × 4 × 0.7 = 0.028</text><text class="cap" x="40" y="120" text-anchor="start">expert 2</text><g class="u"><rect x="150.0" y="102.0" width="36.0" height="26.0" rx="3"/></g><text class="sub2" x="196.0" y="120" text-anchor="start">0.01 × 4 × 0.1 = 0.004</text><text class="cap" x="40" y="156" text-anchor="start">expert 3</text><g class="u"><rect x="150.0" y="138.0" width="36.0" height="26.0" rx="3"/></g><text class="sub2" x="196.0" y="156" text-anchor="start">0.01 × 4 × 0.1 = 0.004</text><text class="cap" x="40" y="192" text-anchor="start">expert 4</text><g class="u"><rect x="150.0" y="174.0" width="36.0" height="26.0" rx="3"/></g><text class="sub2" x="196.0" y="192" text-anchor="start">0.01 × 4 × 0.1 = 0.004</text><text class="hd" x="40" y="246">Two slopes pulling on token 1's share for expert 1</text><line class="axis" x1="120" y1="298" x2="600" y2="298"/><line class="tick" x1="120" y1="294" x2="120" y2="302"/><text class="sub2" x="120" y="318" text-anchor="middle">0</text><line class="tick" x1="360.0" y1="294" x2="360.0" y2="302"/><text class="sub2" x="360.0" y="318" text-anchor="middle">0.5</text><line class="tick" x1="600" y1="294" x2="600" y2="302"/><text class="sub2" x="600" y="318" text-anchor="middle">1</text><circle cx="504.0" cy="298" r="5" fill="var(--paper)" stroke="var(--m)" stroke-width="2"/><text class="sub2" x="504.0" y="318" text-anchor="middle">0.80</text><line class="conn" x1="512.0" y1="282" x2="574.0" y2="282" marker-end="url(#arw)"/><text class="sub2" x="512.0" y="270" text-anchor="start">language loss: up</text><line class="conn" x1="496.0" y1="282" x2="434.0" y2="282" marker-end="url(#arw)"/><text class="sub2" x="496.0" y="270" text-anchor="end">balancing term: down</text><text class="cap" x="40" y="364" text-anchor="start">Training steps each weight against the slope of the loss ({{fig:v06-p03}}). For the</text><text class="cap" x="40" y="384" text-anchor="start">balancing term the slope with respect to an expert's average share P is α × N × f: in</text><text class="cap" x="40" y="404" text-anchor="start">the Switch Transformer f counts tokens and is held fixed, so only P is pushed.</text><text class="cap" x="40" y="444" text-anchor="start">So the push is set by traffic. Expert 1 took 70% of the tokens and is pushed 7 times</text><text class="cap" x="40" y="464" text-anchor="start">harder than each of the others, and the push lowers its share for every token, including</text><text class="cap" x="40" y="484" text-anchor="start">the ones it was genuinely best for.</text><text class="cap" x="40" y="524" text-anchor="start">Token 1 gave expert 1 a share of 0.80. If expert 1 really is the right expert for it,</text><text class="cap" x="40" y="544" text-anchor="start">the language loss pulls that share up while the balancing term pulls it down. The step</text><text class="cap" x="40" y="564" text-anchor="start">taken is the sum of the two, so balance is paid for with a little quality on every</text><text class="cap" x="40" y="584" text-anchor="start">update.</text></svg><figcaption>Bars drawn to scale; the number line is schematic. The balancing gradient knows only how busy an expert is, never whether it was right, and that is its cost.</figcaption></figure>
