chor="start">layers.</text><text class="cap" x="40" y="438" text-anchor="start">That is 58 × 44.04 million = 2.55 billion weights, 2.55 GB at one byte each: 3.2% of an</text><text class="cap" x="40" y="458" text-anchor="start">80 GB card. The other 64 GPUs hold the shared expert and redundant copies of the busiest</text><text class="cap" x="40" y="478" text-anchor="start">experts.</text></svg><figcaption>Bar drawn to scale. Spread this thin, the experts take almost none of a card's memory; what fills it is the cache of the requests it serves.</figcaption></figure>
