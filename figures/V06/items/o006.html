<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:11</div><h3>The punishment for growing</h3><svg viewBox='0 0 680 620' role='img'><title>The punishment for growing</title><text class="hd" x="40" y="46">Growth runs straight into the memory wall</text><g class="h"><rect x="40" y="70" width="600" height="26" rx="3"/><text class="sub" x="340.0" y="83.0" text-anchor="middle" dominant-baseline="central">HBM, the high-bandwidth memory beside the chip</text></g><line class="conn" x1="200" y1="100" x2="200" y2="130" marker-end="url(#arw)"/><g class="u"><rect x="150" y="134" width="380" height="40" rx="3"/><text class="sub" x="340.0" y="154.0" text-anchor="middle" dominant-baseline="central">the arithmetic units</text></g><text class="sub2" x="150" y="198" text-anchor="start">every weight read out and streamed across the bus, once per token</text><text class="hd" x="40" y="248">One token of a dense 671-billion-parameter model, to scale</text><text class="cap" x="40" y="286" text-anchor="start">reading 671 GB</text><g class="h"><rect x="230.0" y="268.0" width="380.0" height="28.0" rx="3"/></g><text class="sub2" x="600" y="316" text-anchor="end">200 ms at 3.35 TB/s</text><text class="cap" x="40" y="352" text-anchor="start">1,342 billion operations</text><g class="m"><rect x="230.0" y="334.0" width="1.3" height="28.0" rx="3"/></g><text class="sub2" x="242" y="352" text-anchor="start">0.68 ms, 0.34% of the time</text><text class="cap" x="40" y="408" text-anchor="start">At decode, the phase that writes the answer one token at a time ({{fig:v01-o109}}),</text><text class="cap" x="40" y="428" text-anchor="start">producing each new token means reading every weight out of HBM and across the memory bus</text><text class="cap" x="40" y="448" text-anchor="start">({{fig:v01-o105}}). For 671 billion weights at one byte each, an H100 GPU's 3.35 TB/s</text><text class="cap" x="40" y="468" text-anchor="start">needs 200 ms. The arithmetic is two operations per weight, which the same chip does at</text><text class="cap" x="40" y="488" text-anchor="start">1,979 trillion a second in FP8: 0.68 ms. Arithmetic is under 1% of each token's time, as</text><text class="cap" x="40" y="508" text-anchor="start">{{fig:v01-o129}} found; the pace is set by the reading.</text><text class="cap" x="40" y="548" text-anchor="start">Splitting the model over many chips shrinks both bars together and leaves their ratio</text><text class="cap" x="40" y="568" text-anchor="start">alone. And in a dense model the amount to read is the whole model, so time per token</text><text class="cap" x="40" y="588" text-anchor="start">grows in lockstep with the parameter count.</text></svg><figcaption>The arithmetic bar is under two pixels long. The growth that scaling laws reward is exactly what the memory wall punishes: every parameter added makes every token slower to produce.</figcaption></figure>
