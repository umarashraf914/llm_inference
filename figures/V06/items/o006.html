<figure><div class='ts'>Fig 06 &nbsp;&middot;&nbsp; 2:08</div><h3>The punishment for growing</h3><svg viewBox='0 0 680 498' role='img'><title>The punishment for growing</title><text class="hd" x="40" y="46">But growth runs straight into the memory wall</text><g class="h"><rect x="40" y="70" width="600" height="26" rx="4"/><text class="sub" x="340.0" y="83.0" text-anchor="middle" dominant-baseline="central">HBM</text></g><line class="conn" x1="200" y1="100" x2="200" y2="130" marker-end="url(#arw)"/><line class="conn" x1="480" y1="130" x2="480" y2="100" marker-end="url(#arw)"/><g class="u"><rect x="150" y="134" width="380" height="44" rx="4"/><text class="sub" x="340.0" y="156.0" text-anchor="middle" dominant-baseline="central">the arithmetic units</text></g><text class="sub2" x="150" y="210" text-anchor="start">every weight read out and streamed across the bus, once per token</text><text class="cap" x="40" y="260" text-anchor="start">The multiplications themselves are almost free; arithmetic came out to under 1% of each token's</text><text class="cap" x="40" y="280" text-anchor="start">time. The pace is set by the reading.</text><text class="cap" x="40" y="320" text-anchor="start">And in a dense model the amount you have to read is the whole model. A 671-billion-parameter</text><text class="cap" x="40" y="340" text-anchor="start">model streams all 671 billion weights for every token it produces.</text><g class="h"><rect x="140" y="372" width="400" height="42" rx="6"/><text class="sub" x="340.0" y="393.0" text-anchor="middle" dominant-baseline="central">time per token grows in lockstep with parameter count</text></g><text class="cap" x="40" y="456" text-anchor="start">So the same growth that scaling laws reward is exactly what the memory wall punishes. Every</text><text class="cap" x="40" y="476" text-anchor="start">parameter you add makes every token slower to produce.</text></svg><figcaption>Two curves pointing opposite ways. Mixture of experts is the architectural response to being caught between them.</figcaption></figure>
