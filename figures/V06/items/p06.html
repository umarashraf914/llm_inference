g><g class="m"><rect x="228" y="138" width="42" height="24" rx="3"/><text class="sub" x="249.0" y="150.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="340" y="138" width="42" height="24" rx="3"/><text class="sub" x="361.0" y="150.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="60" y="166" width="36" height="24" rx="3"/><text class="sub" x="78.0" y="178.0" text-anchor="middle" dominant-baseline="central">0.5</text></g><g class="u"><rect x="100" y="166" width="36" height="24" rx="3"/><text class="sub" x="118.0" y="178.0" text-anchor="middle" dominant-baseline="central">−1</text></g><g class="m"><rect x="228" y="166" width="42" height="24" rx="3"/><text class="sub" x="249.0" y="178.0" text-anchor="middle" dominant-baseline="central">−1.5</text></g><g class="u"><rect x="340" y="166" width="42" height="24" rx="3"/><text class="sub" x="361.0" y="178.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="150" y="140.0" text-anchor="middle">×</text><g class="u"><rect x="164" y="110.0" width="36" height="24" rx="3"/><text class="sub" x="182.0" y="122.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="164" y="138.0" width="36" height="24" rx="3"/><text class="sub" x="182.0" y="150.0" text-anchor="middle" dominant-baseline="central">2</text></g><text class="sub2" x="214" y="140.0" text-anchor="middle">=</text><line class="conn" x1="276" y1="136.0" x2="332" y2="136.0" marker-end="url(#arw)"/><text class="sub2" x="304" y="128.0" text-anchor="middle">max(0, ·)</text><text class="sub2" x="60" y="208" text-anchor="start">first matrix</text><text class="sub2" x="164" y="208" text-anchor="start">x</text><text class="sub2" x="228" y="208" text-anchor="start">h</text><text class="sub2" x="340" y="208" text-anchor="start">kept</text><text class="sub2" x="410" y="99" text-anchor="start">1  widen: multiply by the first matrix</text><text class="sub2" x="410" y="127" text-anchor="start">2  keep the positives: max(0, h)</text><g class="u"><rect x="60" y="270" width="40" height="24" rx="3"/><text class="sub" x="80.0" y="282.0" text-anchor="middle" dominant-baseline="central">0.6</text></g><g class="u"><rect x="104" y="270" width="40" height="24" rx="3"/><text class="sub" x="124.0" y="282.0" text-anchor="middle" dominant-baseline="central">−0.5</text></g><g class="u"><rect x="148" y="270" width="40" height="24" rx="3"/><text class="sub" x="168.0" y="282.0" text-anchor="middle" dominant-baseline="central">0.3</text></g><g class="u"><rect x="192" y="270" width="40" height="24" rx="3"/><text class="sub" x="212.0" y="282.0" text-anchor="middle" dominant-baseline="central">−0.2</text></g><g class="m"><rect x="340" y="270" width="42" height="24" rx="3"/><text class="sub" x="361.0" y="282.0" text-anchor="middle" dominant-baseline="central">1.8</text></g><g class="u"><rect x="60" y="298" width="40" height="24" rx="3"/><text class="sub" x="80.0" y="310.0" text-anchor="middle" dominant-baseline="central">0.2</text></g><g class="u"><rect x="104" y="298" width="40" height="24" rx="3"/><text class="sub" x="124.0" y="310.0" text-anchor="middle" dominant-baseline="central">0.4</text></g><g class="u"><rect x="148" y="298" width="40" height="24" rx="3"/><text class="sub" x="168.0" y="310.0" text-anchor="middle" dominant-baseline="central">−0.7</text></g><g class="u"><rect x="192" y="298" width="40" height="24" rx="3"/><text class="sub" x="212.0" y="310.0" text-anchor="middle" dominant-baseline="central">0.9</text></g><g class="m"><rect x="340" y="298" width="42" height="24" rx="3"/><text class="sub" x="361.0" y="310.0" text-anchor="middle" dominant-baseline="central">0.6</text></g><g class="m"><rect x="260" y="242" width="42" height="24" rx="3"/><text class="sub" x="281.0" y="254.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="u"><rect x="260" y="270" width="42" height="24" rx="3"/><text class="sub" x="281.0" y="282.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="260" y="298" width="42" height="24" rx="3"/><text class="sub" x="281.0" y="310.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="260" y="326" width="42" height="24" rx="3"/><text class="sub" x="281.0" y="338.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="246" y="300.0" text-anchor="middle">×</text><text class="sub2" x="321" y="300.0" text-anchor="middle">=</text><text class="sub2" x="60" y="368" text-anchor="start">second matrix</text><text class="sub2" x="260" y="368" text-anchor="start">kept</text><text class="sub2" x="340" y="368" text-anchor="start">y</text><text class="sub2" x="410" y="287" text-anchor="start">3  narrow: multiply by the second matrix</text><text class="cap" x="40" y="414" text-anchor="start">The feed-forward block, or feed-forward network (FFN), does three things to one token's</text><text class="cap" x="40" y="434" text-anchor="start">vector. It multiplies by a first matrix that makes the vector wider, four times wider in</text><text class="cap" x="40" y="454" text-anchor="start">the classic design; here 2 numbers become 4. Then it replaces every negative number with</text><text class="cap" x="40" y="474" text-anchor="start">zero: ReLU, max(0, x). Then a second matrix narrows the result back to the token's</text><text class="cap" x="40" y="494" text-anchor="start">width.</text><text class="cap" x="40" y="534" text-anchor="start">The middle step is what makes the block more than one matrix. Without it the two</text><text class="cap" x="40" y="554" text-anchor="start">multiplies in a row would collapse into a single 2 × 2 matrix and give [2.60, −1.15]</text><text class="cap" x="40" y="574" text-anchor="start">here; with it, three of the four hidden numbers are switched off and the answer is</text><text class="cap" x="40" y="594" text-anchor="start">[1.8, 0.6].</text><text class="cap" x="40" y="634" text-anchor="start">Most modern blocks add a third matrix, a gate that multiplies the widened vector entry</text><text class="cap" x="40" y="654" text-anchor="start">by entry before it is narrowed (SwiGLU). That is why {{fig:v01-o100}} counts three</text><text class="cap" x="40" y="674" text-anchor="start">feed-forward matrices per layer. The drawing is the original two-matrix form; the logic</text><text class="cap" x="40" y="694" text-anchor="start">is the same.</text></svg><figcaption>Two matrix multiplies with one cheap step between them. That step lets each hidden number switch on or off, which is what the next figure reads as a lookup.</figcaption></figure>
