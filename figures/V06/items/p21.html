"><rect x="40" y="430" width="600" height="32" rx="6"/><text class="sub" x="340.0" y="446.0" text-anchor="middle" dominant-baseline="central">64 × 63 × 62 × 61 × 60 × 59 × 58 × 57 = 178,462,987,637,760 ordered picks</text></g><g class="u"><rect x="40" y="470" width="600" height="32" rx="6"/><text class="sub" x="340.0" y="486.0" text-anchor="middle" dominant-baseline="central">each team turns up in 8 × 7 × 6 × 5 × 4 × 3 × 2 × 1 = 40,320 orders</text></g><g class="m"><rect x="40" y="510" width="600" height="32" rx="6"/><text class="sub" x="340.0" y="526.0" text-anchor="middle" dominant-baseline="central">178,462,987,637,760 / 40,320 = 4,426,165,368 teams</text></g><text class="cap" x="40" y="582" text-anchor="start">Counting teams is counting choices. The first member of a team can be any expert, the</text><text class="cap" x="40" y="602" text-anchor="start">second any of those left, and so on; multiplying the shrinking choices counts every</text><text class="cap" x="40" y="622" text-anchor="start">ordered pick. The same team then turns up once for every order its members could be</text><text class="cap" x="40" y="642" text-anchor="start">picked in, so divide by that.</text><text class="cap" x="40" y="682" text-anchor="start">Two of 16 gives 16 × 15 / 2 = 120. Eight of 64 gives the product above, 4,426,165,368,</text><text class="cap" x="40" y="702" text-anchor="start">about 37 million times as many. DeepSeek V3 picks 8 of 256: 4.1 × 10¹⁴ possible teams</text><text class="cap" x="40" y="722" text-anchor="start">for every token.</text></svg><figcaption>One rule does all three counts: choices multiplied, then divided by the orders the same team can be picked in. Splitting experts grows the top of that fraction far faster than the bottom.</figcaption></figure>
