<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:04</div><h3>Each row of the first matrix is a key; each column of the second is a value</h3><svg viewBox='0 0 680 588' role='img'><title>Each row of the first matrix is a key; each column of the second is a value</title><text class="hd" x="40" y="46">The same arithmetic for x = [1, 2], read one hidden unit at a time</text><text class="sub2" x="96" y="70" text-anchor="start">key</text><text class="sub2" x="96" y="84" text-anchor="start">row of the first</text><text class="sub2" x="208" y="70" text-anchor="start">key · x</text><text class="sub2" x="272" y="70" text-anchor="start">kept</text><text class="sub2" x="330" y="70" text-anchor="start">value</text><text class="sub2" x="330" y="84" text-anchor="start">column of the second</text><text class="sub2" x="470" y="70" text-anchor="start">kept × value</text><text class="cap" x="40" y="114" text-anchor="start">unit 1</text><g class="m"><rect x="96" y="94" width="36" height="28" rx="3"/><text class="sub" x="114.0" y="108.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="330" y="94" width="42" height="28" rx="3"/><text class="sub" x="351.0" y="108.0" text-anchor="middle" dominant-baseline="central">0.6</text></g><g class="m"><rect x="470" y="94" width="42" height="28" rx="3"/><text class="sub" x="491.0" y="108.0" text-anchor="middle" dominant-baseline="central">1.8</text></g><g class="m"><rect x="136" y="94" width="36" height="28" rx="3"/><text class="sub" x="154.0" y="108.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="376" y="94" width="42" height="28" rx="3"/><text class="sub" x="397.0" y="108.0" text-anchor="middle" dominant-baseline="central">0.2</text></g><g class="m"><rect x="516" y="94" width="42" height="28" rx="3"/><text class="sub" x="537.0" y="108.0" text-anchor="middle" dominant-baseline="central">0.6</text></g><text class="sub2" x="226" y="113" text-anchor="middle">3</text><text class="sub2" x="286" y="113" text-anchor="middle">3</text><text class="cap" x="40" y="152" text-anchor="start">unit 2</text><g class="u"><rect x="96" y="132" width="36" height="28" rx="3"/><text class="sub" x="114.0" y="146.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="330" y="132" width="42" height="28" rx="3"/><text class="sub" x="351.0" y="146.0" text-anchor="middle" dominant-baseline="central">−0.5</text></g><g class="u"><rect x="470" y="132" width="42" height="28" rx="3"/><text class="sub" x="491.0" y="146.0" text-anchor="middle" dominant-baseline="central">0.0</text></g><g class="u"><rect x="136" y="132" width="36" height="28" rx="3"/><text class="sub" x="154.0" y="146.0" text-anchor="middle" dominant-baseline="central">−1</text></g><g class="u"><rect x="376" y="132" width="42" height="28" rx="3"/><text class="sub" x="397.0" y="146.0" text-anchor="middle" dominant-baseline="central">0.4</text></g><g class="u"><rect x="516" y="132" width="42" height="28" rx="3"/><text class="sub" x="537.0" y="146.0" text-anchor="middle" dominant-baseline="central">0.0</text></g><text class="sub2" x="226" y="151" text-anchor="middle">−1</text><text class="sub2" x="286" y="151" text-anchor="middle">0</text><text class="cap" x="40" y="190" text-anchor="start">unit 3</text><g class="u"><rect x="96" y="170" width="36" height="28" rx="3"/><text class="sub" x="114.0" y="184.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="u"><rect x="330" y="170" width="42" height="28" rx="3"/><text class="sub" x="351.0" y="184.0" text-anchor="middle" dominant-baseline="central">0.3</text></g><g class="u"><rect x="470" y="170" width="42" height="28" rx="3"/><text class="sub" x="491.0" y="184.0" text-anchor="middle" dominant-baseline="central">0.0</text></g><g class="u"><rect x="136" y="170" width="36" height="28" rx="3"/><text class="sub" x="154.0" y="184.0" text-anchor="middle" dominant-baseline="central">−1</text></g><g class="u"><rect x="376" y="170" width="42" height="28" rx="3"/><text class="sub" x="397.0" y="184.0" text-anchor="middle" dominant-baseline="central">−0.7</text></g><g class="u"><rect x="516" y="170" width="42" height="28" rx="3"/><text class="sub" x="537.0" y="184.0" text-anchor="middle" dominant-baseline="central">0.0</text></g><text class="sub2" x="226" y="189" text-anchor="middle">0</text><text class="sub2" x="286" y="189" text-anchor="middle">0</text><text class="cap" x="40" y="228" text-anchor="start">unit 4</text><g class="u"><rect x="96" y="208" width="36" height="28" rx="3"/><text class="sub" x="114.0" y="222.0" text-anchor="middle" dominant-baseline="central">0.5</text></g><g class="u"><rect x="330" y="208" width="42" height="28" rx="3"/><text class="sub" x="351.0" y="222.0" text-anchor="middle" dominant-baseline="central">−0.2</text></g><g class="u"><rect x="470" y="208" width="42" height="28" rx="3"/><text class="sub" x="491.0" y="222.0" text-anchor="middle" dominant-baseline="central">0.0</text></g><g class="u"><rect x="136" y="208" width="36" height="28" rx="3"/><text class="sub" x="154.0" y="222.0" text-anchor="middle" dominant-baseline="central">−1</text></g><g class="u"><rect x="376" y="208" width="42" height="28" rx="3"/><text class="sub" x="397.0" y="222.0" text-anchor="middle" dominant-baseline="central">0.9</text></g><g class="u"><rect x="516" y="208" width="42" height="28" rx="3"/><text class="sub" x="537.0" y="222.0" text-anchor="middle" dominant-baseline="central">0.0</text></g><text class="sub2" x="226" y="227" text-anchor="middle">−1.5</text><text class="sub2" x="286" y="227" text-anchor="middle">0</text><line class="tick" x1="470" y1="250" x2="558" y2="250"/><g class="m"><rect x="470" y="260" width="42" height="28" rx="3"/><text class="sub" x="491.0" y="274.0" text-anchor="middle" dominant-baseline="central">1.8</text></g><g class="m"><rect x="516" y="260" width="42" height="28" rx="3"/><text class="sub" x="537.0" y="274.0" text-anchor="middle" dominant-baseline="central">0.6</text></g><text class="sub2" x="570" y="279" text-anchor="start">sum: y</text><text class="cap" x="40" y="336" text-anchor="start">Read the first matrix row by row and each row is a key: a direction the input can point.</text><text class="cap" x="40" y="356" text-anchor="start">The key's match with the token is a dot product ({{fig:v03-o014}}), and ReLU keeps only</text><text class="cap" x="40" y="376" text-anchor="start">the positive matches. Here only key 1 matches, with strength 3.</text><text class="cap" x="40" y="416" text-anchor="start">Each hidden unit also owns one column of the second matrix, its value. The output is</text><text class="cap" x="40" y="436" text-anchor="start">every value times its unit's kept match, added up: 3 × [0.6, 0.2] = [1.8, 0.6], and the</text><text class="cap" x="40" y="456" text-anchor="start">other three values are multiplied by zero.</text><text class="cap" x="40" y="496" text-anchor="start">A hard lookup, like an embedding table ({{fig:v01-o087}}), returns exactly one row</text><text class="cap" x="40" y="516" text-anchor="start">chosen by its number. This one is soft: every key is scored against the input, and every</text><text class="cap" x="40" y="536" text-anchor="start">key that matches adds its value in proportion. Geva and colleagues found trained keys</text><text class="cap" x="40" y="556" text-anchor="start">that fire on recognisable patterns, such as text ending in a particular phrase.</text></svg><figcaption>These keys and values are fixed weights, learned in training and read like a table. They have nothing to do with attention's keys and values or the KV cache of {{ref:v06-o012}}: same words, different objects.</figcaption></figure>
