92.0,224.8 195.2,227.2 198.4,229.6 201.6,231.8 204.8,233.9 208.0,236.0 211.2,237.9 214.4,239.8 217.6,241.6 220.8,243.2 224.0,244.8 227.2,246.2 230.4,247.6 233.6,248.8 236.8,249.9 240.0,251.0 243.2,251.9 246.4,252.8 249.6,253.6 252.8,254.2 256.0,254.8 259.2,255.2 262.4,255.6 265.6,255.8 268.8,255.9 272.0,256.0 275.2,255.9 278.4,255.8 281.6,255.6 284.8,255.2 288.0,254.8 291.2,254.2 294.4,253.6 297.6,252.8 300.8,251.9 304.0,251.0 307.2,249.9 310.4,248.8 313.6,247.6 316.8,246.2 320.0,244.8 323.2,243.2 326.4,241.6 329.6,239.8 332.8,237.9 336.0,236.0 339.2,234.0 342.4,231.8 345.6,229.5 348.8,227.2 352.0,224.8 355.2,222.2 358.4,219.6 361.6,216.8 364.8,213.9 368.0,211.0 371.2,208.0 374.4,204.8 377.6,201.5 380.8,198.2 384.0,194.8 387.2,191.2 390.4,187.6 393.6,183.8 396.8,179.9 400.0,176.0"/><line class="mark" x1="92.8" y1="112.0" x2="195.2" y2="240.0"/><circle cx="144.0" cy="176.0" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><line class="mark" x1="156.8" y1="204.0" x2="259.2" y2="268.0"/><circle cx="208.0" cy="236.0" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><line class="mark" x1="220.8" y1="256.0" x2="323.2" y2="256.0"/><circle cx="272.0" cy="256.0" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2 halo" x="154.0" y="180.0" text-anchor="start">slope −4</text><text class="sub2 halo" x="198.0" y="256.0" text-anchor="end">slope −2</text><text class="sub2 halo" x="272.0" y="242.0" text-anchor="middle">slope 0</text><text class="sub2" x="450" y="92" text-anchor="middle">w</text><text class="sub2" x="490" y="92" text-anchor="middle">loss</text><text class="sub2" x="535" y="92" text-anchor="middle">slope</text><text class="sub2" x="585" y="92" text-anchor="middle">step</text><text class="sub2" x="630" y="92" text-anchor="middle">new w</text><text class="sub2" x="450" y="122" text-anchor="middle">1</text><text class="sub2" x="490" y="122" text-anchor="middle">5</text><text class="sub2" x="535" y="122" text-anchor="middle">−4</text><text class="sub2" x="585" y="122" text-anchor="middle">+0.4</text><text class="sub2" x="630" y="122" text-anchor="middle">1.4</text><text class="sub2" x="450" y="156" text-anchor="middle">2</text><text class="sub2" x="490" y="156" text-anchor="middle">2</text><text class="sub2" x="535" y="156" text-anchor="middle">−2</text><text class="sub2" x="585" y="156" text-anchor="middle">+0.2</text><text class="sub2" x="630" y="156" text-anchor="middle">2.2</text><text class="sub2" x="450" y="190" text-anchor="middle">3</text><text class="sub2" x="490" y="190" text-anchor="middle">1</text><text class="sub2" x="535" y="190" text-anchor="middle">0</text><text class="sub2" x="585" y="190" text-anchor="middle">0</text><text class="sub2" x="630" y="190" text-anchor="middle">3.0</text><text class="sub2" x="450" y="232" text-anchor="start">step = −0.1 × slope</text><text class="cap" x="40" y="356" text-anchor="start">The slope of a straight line is rise over run. The slope of a curve at a point is the</text><text class="cap" x="40" y="376" text-anchor="start">slope of the straight line that just touches it there. Nudge w from 1 to 1.01 and the</text><text class="cap" x="40" y="396" text-anchor="start">loss goes from 5 to 4.9601: a rise of −0.0399 over a run of 0.01, slope −3.99. Smaller</text><text class="cap" x="40" y="416" text-anchor="start">nudges close in on −4.</text><text class="cap" x="40" y="456" text-anchor="start">A gradient is that slope taken for each weight in turn, with all the others held still.</text><text class="cap" x="40" y="476" text-anchor="start">A model has billions of weights, so its gradient is billions of slopes, all computed</text><text class="cap" x="40" y="496" text-anchor="start">together by the backward pass ({{fig:v03-o060}}).</text><text class="cap" x="40" y="536" text-anchor="start">Training then steps every weight against its slope: new w = w − rate × slope. A negative</text><text class="cap" x="40" y="556" text-anchor="start">slope means the loss falls to the right, so w moves right; a steeper slope moves it</text><text class="cap" x="40" y="576" text-anchor="start">further; at the bottom the slope is 0 and w stays put. From w = 1, one step of rate 0.1</text><text class="cap" x="40" y="596" text-anchor="start">lands at 1.4 and the loss drops from 5 to 3.56.</text></svg><figcaption>Everything later figures need: a gradient points each weight downhill on the loss. Load balancing adds a second term to the loss, and with it a second slope pulling on the same weights.</figcaption></figure>
