<figure><div class='ts'>Fig 02 &nbsp;&middot;&nbsp; 0:14</div><h3>671 billion held, 37 billion run</h3><svg viewBox='0 0 680 322' role='img'><title>671 billion held, 37 billion run</title><text class="cap" x="40" y="78" text-anchor="start">Parameters held</text><g class="u"><rect x="280" y="62" width="340" height="32" rx="3"/><text class="sub" x="450.0" y="78.0" text-anchor="middle" dominant-baseline="central">671 billion</text></g><text class="cap" x="40" y="138" text-anchor="start">Multiplied against one token</text><g class="m"><rect x="280" y="122" width="19" height="32" rx="1"/></g><text class="sub2" x="309" y="141" text-anchor="start">37 billion, about one eighteenth</text><text class="cap" x="40" y="200" text-anchor="start">The other 634 billion sit in memory untouched by this token, waiting for the other tokens that</text><text class="cap" x="40" y="220" text-anchor="start">will need them.</text><text class="cap" x="40" y="260" text-anchor="start">That gap is the whole of mixture of experts. By the end of this document we can derive the</text><text class="cap" x="40" y="280" text-anchor="start">split, say which parts of the model a token gets to skip, and account for what the skipping</text><text class="cap" x="40" y="300" text-anchor="start">costs everywhere else in the system.</text></svg><figcaption>A dense model multiplies every token against every weight, so the gap is zero. Everything below is about how to open it and what opening it costs.</figcaption></figure>
