t class="sub2" x="470" y="234" text-anchor="start">sum 2.455: no shared budget</text><text class="hd" x="40" y="290">The gates after choosing the same two experts, drawn to scale</text><text class="cap" x="40" y="326" text-anchor="start">softmax</text><g class="m"><rect x="150" y="308" width="261.43291910477893" height="26" rx="3"/><text class="sub" x="280.71645955238944" y="321.0" text-anchor="middle" dominant-baseline="central">expert 1  0.622</text></g><g class="m"><rect x="411.43291910477893" y="308" width="158.56708089522112" height="26" rx="3"/><text class="sub" x="490.7164595523895" y="321.0" text-anchor="middle" dominant-baseline="central">expert 3  0.378</text></g><text class="cap" x="40" y="366" text-anchor="start">sigmoid</text><g class="m"><rect x="150" y="348" width="216.29995612800423" height="26" rx="3"/><text class="sub" x="258.1499780640021" y="361.0" text-anchor="middle" dominant-baseline="central">expert 1  0.515</text></g><g class="m"><rect x="366.2999561280042" y="348" width="203.70004387199577" height="26" rx="3"/><text class="sub" x="468.1499780640021" y="361.0" text-anchor="middle" dominant-baseline="central">expert 3  0.485</text></g><text class="cap" x="40" y="428" text-anchor="start">Unlike softmax, nothing is divided by a shared total, so the four values need not add to</text><text class="cap" x="40" y="448" text-anchor="start">one; here they add to 2.455. Raising one expert's score leaves the others where they</text><text class="cap" x="40" y="468" text-anchor="start">were.</text><text class="cap" x="40" y="508" text-anchor="start">Selection is unchanged: the two largest are still experts 1 and 3. Only after choosing</text><text class="cap" x="40" y="528" text-anchor="start">are the survivors divided by their sum, 0.905 + 0.852, giving gates of 0.515 and 0.485.</text><text class="cap" x="40" y="548" text-anchor="start">DeepSeek V3 scores its experts this way: score, select, renormalise, as before.</text></svg><figcaption>Without a shared budget, two strong experts can both be confident, so the gates come out flatter: 0.51 and 0.49 here, against softmax's 0.62 and 0.38.</figcaption></figure>
