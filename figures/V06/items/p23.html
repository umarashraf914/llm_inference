<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:53</div><h3>The shared expert costs a ninth of the expert work and 0.4% of the memory</h3><svg viewBox='0 0 680 484' role='img'><title>The shared expert costs a ninth of the expert work and 0.4% of the memory</title><text class="hd" x="40" y="46">The nine experts a token runs in one MoE layer</text><g class="m"><rect x="40" y="64" width="58" height="30" rx="3"/><text class="sub" x="69.0" y="79.0" text-anchor="middle" dominant-baseline="central">R1</text></g><g class="m"><rect x="106" y="64" width="58" height="30" rx="3"/><text class="sub" x="135.0" y="79.0" text-anchor="middle" dominant-baseline="central">R2</text></g><g class="m"><rect x="172" y="64" width="58" height="30" rx="3"/><text class="sub" x="201.0" y="79.0" text-anchor="middle" dominant-baseline="central">R3</text></g><g class="m"><rect x="238" y="64" width="58" height="30" rx="3"/><text class="sub" x="267.0" y="79.0" text-anchor="middle" dominant-baseline="central">R4</text></g><g class="m"><rect x="304" y="64" width="58" height="30" rx="3"/><text class="sub" x="333.0" y="79.0" text-anchor="middle" dominant-baseline="central">R5</text></g><g class="m"><rect x="370" y="64" width="58" height="30" rx="3"/><text class="sub" x="399.0" y="79.0" text-anchor="middle" dominant-baseline="central">R6</text></g><g class="m"><rect x="436" y="64" width="58" height="30" rx="3"/><text class="sub" x="465.0" y="79.0" text-anchor="middle" dominant-baseline="central">R7</text></g><g class="m"><rect x="502" y="64" width="58" height="30" rx="3"/><text class="sub" x="531.0" y="79.0" text-anchor="middle" dominant-baseline="central">R8</text></g><g class="s"><rect x="568" y="64" width="58" height="30" rx="3"/><text class="sub" x="597.0" y="79.0" text-anchor="middle" dominant-baseline="central">shared</text></g><text class="sub2" x="40" y="116" text-anchor="start">eight routed, chosen by the router, and the shared one, which every token gets</text><text class="hd" x="40" y="162">The shared experts' weight, each bar to its own scale</text><text class="cap" x="40" y="201" text-anchor="start">held: 671.0 B</text><g class="u"><rect x="230.0" y="182.0" width="398.5" height="28.0" rx="3"/></g><g class="s"><rect x="628.5" y="182.0" width="2.0" height="28.0" rx="3"/></g><text class="sub2" x="620.4773587927785" y="226" text-anchor="end">shared: 0.38%</text><text class="cap" x="40" y="251" text-anchor="start">run per token: 37.6 B</text><g class="m"><rect x="230.0" y="232.0" width="372.8" height="28.0" rx="3"/></g><g class="s"><rect x="602.8" y="232.0" width="27.2" height="28.0" rx="3"/></g><text class="sub2" x="594.7917350689355" y="276" text-anchor="end">shared: 6.8%</text><text class="cap" x="40" y="332" text-anchor="start">A shared expert is an ordinary expert, three matrices of 7,168 × 2,048, that skips the</text><text class="cap" x="40" y="352" text-anchor="start">router and runs for every token. DeepSeek V3 has one in each of its 58 MoE layers:</text><text class="cap" x="40" y="372" text-anchor="start">58 × 44.04 million = 2.55 billion weights.</text><text class="cap" x="40" y="412" text-anchor="start">Against everything held, that is 0.38%, the price of one expert in 257. Against what a</text><text class="cap" x="40" y="432" text-anchor="start">token runs it is 6.8%, and one expert in nine in every MoE layer: the always-on part of</text><text class="cap" x="40" y="452" text-anchor="start">each token's bill.</text></svg><figcaption>Cheap to hold and paid by every token, which is the right shape for knowledge every token needs. The routed experts carry the rest.</figcaption></figure>
