<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:37</div><h3>A request's cache is set by attention alone</h3><svg viewBox='0 0 680 622' role='img'><title>A request's cache is set by attention alone</title><text class="hd" x="40" y="46">Cache per token = layers × numbers kept per layer × bytes per number</text><g class="u"><rect x="40" y="66" width="110" height="40" rx="6"/><text class="sub" x="95.0" y="86.0" text-anchor="middle" dominant-baseline="central">61 layers</text></g><text class="sub2" x="164" y="91" text-anchor="middle">×</text><g class="u"><rect x="178" y="66" width="196" height="40" rx="6"/><text class="sub" x="276.0" y="86.0" text-anchor="middle" dominant-baseline="central">576 numbers: 512 + 64</text></g><text class="sub2" x="388" y="91" text-anchor="middle">×</text><g class="u"><rect x="402" y="66" width="90" height="40" rx="6"/><text class="sub" x="447.0" y="86.0" text-anchor="middle" dominant-baseline="central">2 bytes</text></g><text class="sub2" x="506" y="91" text-anchor="middle">=</text><g class="h"><rect x="520" y="66" width="120" height="40" rx="6"/><text class="sub" x="580.0" y="86.0" text-anchor="middle" dominant-baseline="central">70,272 bytes</text></g><text class="sub2" x="40" y="130" text-anchor="start">no term in it counts experts: 8 of them or 256, the cache per token is the same</text><text class="hd" x="40" y="176">One request 128,000 tokens long, in gigabytes, to scale</text><text class="cap" x="40" y="215" text-anchor="start">the weights, every expert</text><g class="u"><rect x="250.0" y="196.0" width="350.0" height="28.0" rx="3"/></g><text class="sub2" x="610.0" y="215" text-anchor="start">671 GB</text><text class="cap" x="40" y="257" text-anchor="start">its cache, if attention were plain</text><rect x="250.0" y="238.0" width="266.9" height="28.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="526.899751840542" y="257" text-anchor="start">512 GB</text><text class="cap" x="40" y="299" text-anchor="start">its cache with latent attention</text><g class="h"><rect x="250.0" y="280.0" width="4.7" height="28.0" rx="3"/></g><text class="sub2" x="264.691597200322" y="299" text-anchor="start">9.0 GB</text><text class="cap" x="40" y="370" text-anchor="start">The KV cache keeps, for every earlier token, what attention needs in order to look back</text><text class="cap" x="40" y="390" text-anchor="start">at it ({{fig:v01-o136}}). Its size is a product of attention's own shapes. DeepSeek V3's</text><text class="cap" x="40" y="410" text-anchor="start">latent attention keeps 576 numbers per token per layer, a 512-number latent plus a</text><text class="cap" x="40" y="430" text-anchor="start">64-number position part ({{fig:v03-o091}}): at 16 bits each, 70,272 bytes per token.</text><text class="cap" x="40" y="470" text-anchor="start">Nothing in that product counts experts. A request 128,000 tokens long holds 9.0 GB of</text><text class="cap" x="40" y="490" text-anchor="start">cache whether the layers hold 8 experts or 256, and every new token reads all of it.</text><text class="cap" x="40" y="530" text-anchor="start">Plain multi-head attention with the same 128 heads would keep a key and a value of 128</text><text class="cap" x="40" y="550" text-anchor="start">numbers for each head, 32,768 numbers per layer, 57 times more: 4.0 MB a token, 512 GB</text><text class="cap" x="40" y="570" text-anchor="start">for this one request. That is the cost latent attention attacks, and the one mixture of</text><text class="cap" x="40" y="590" text-anchor="start">experts leaves exactly where it was.</text></svg><figcaption>Bars drawn to scale. Sparsity shrank the work per token and not one byte of the cache: a long-context problem needs an attention fix, which is why DeepSeek built one.</figcaption></figure>
