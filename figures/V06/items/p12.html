<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:02</div><h3>Why “8×7B” comes to 46.7 billion, not 56</h3><svg viewBox='0 0 680 454' role='img'><title>Why “8×7B” comes to 46.7 billion, not 56</title><text class="hd" x="40" y="46">Billions of parameters, drawn to scale and split by what they are</text><text class="cap" x="40" y="93" text-anchor="start">eight Mistral 7Bs</text><g class="m"><rect x="200" y="74" width="326.93845761399456" height="28" rx="3"/><text class="sub" x="363.4692288069973" y="88.0" text-anchor="middle" dominant-baseline="central">feed-forward 45.1</text></g><g class="u"><rect x="526.9" y="74.0" width="11.6" height="28.0" rx="3"/></g><g class="h"><rect x="538.6" y="74.0" width="81.4" height="28.0" rx="3"/></g><text class="sub2" x="630.0" y="93" text-anchor="start">57.9</text><text class="cap" x="40" y="157" text-anchor="start">Mixtral 8×7B</text><g class="m"><rect x="200" y="138" width="326.93845761399456" height="28" rx="3"/><text class="sub" x="363.4692288069973" y="152.0" text-anchor="middle" dominant-baseline="central">feed-forward 45.1</text></g><g class="u"><rect x="526.9" y="138.0" width="11.6" height="28.0" rx="3"/></g><text class="sub2" x="548.5787522179004" y="157" text-anchor="start">46.7</text><g class="u"><rect x="200.0" y="198.0" width="14.0" height="14.0" rx="3"/></g><text class="sub2" x="222" y="209" text-anchor="start">attention, norms and embeddings, 1.60 each</text><g class="h"><rect x="200.0" y="222.0" width="14.0" height="14.0" rx="3"/></g><text class="sub2" x="222" y="233" text-anchor="start">seven more copies of them, 11.23</text><text class="cap" x="40" y="282" text-anchor="start">Mistral 7B, the dense model Mixtral grew from, has 7.24 billion parameters: one</text><text class="cap" x="40" y="302" text-anchor="start">feed-forward block per layer plus 1.60 billion of attention, norms and embeddings. Eight</text><text class="cap" x="40" y="322" text-anchor="start">of them would be 57.9 billion.</text><text class="cap" x="40" y="362" text-anchor="start">Mixtral copies only the feed-forward block. Its eight experts per layer are exactly</text><text class="cap" x="40" y="382" text-anchor="start">eight Mistral feed-forward blocks, but attention and the embeddings exist once. The gap,</text><text class="cap" x="40" y="402" text-anchor="start">11.23 billion, is the seven copies of those that were never made, less 1.0 million of</text><text class="cap" x="40" y="422" text-anchor="start">routers that the dense models do not need.</text></svg><figcaption>The name counts the experts, not the model. Only the feed-forward block is multiplied, which is the same locality {{ref:v06-o010}} showed in a single layer.</figcaption></figure>
