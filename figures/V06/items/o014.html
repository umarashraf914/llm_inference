th="19" height="19" rx="2"/></g><g class="m"><rect x="152" y="214" width="19" height="19" rx="2"/></g><g class="m"><rect x="175" y="214" width="19" height="19" rx="2"/></g><g class="m"><rect x="198" y="214" width="19" height="19" rx="2"/></g><g class="m"><rect x="221" y="214" width="19" height="19" rx="2"/></g><g class="u"><rect x="244" y="214" width="19" height="19" rx="2"/></g><g class="u"><rect x="267" y="214" width="19" height="19" rx="2"/></g><g class="u"><rect x="290" y="214" width="19" height="19" rx="2"/></g><g class="u"><rect x="313" y="214" width="19" height="19" rx="2"/></g><g class="u"><rect x="336" y="214" width="19" height="19" rx="2"/></g><g class="u"><rect x="359" y="214" width="19" height="19" rx="2"/></g><g class="u"><rect x="382" y="214" width="19" height="19" rx="2"/></g><g class="u"><rect x="405" y="214" width="19" height="19" rx="2"/></g><g class="u"><rect x="60" y="237" width="19" height="19" rx="2"/></g><g class="u"><rect x="83" y="237" width="19" height="19" rx="2"/></g><g class="u"><rect x="106" y="237" width="19" height="19" rx="2"/></g><g class="u"><rect x="129" y="237" width="19" height="19" rx="2"/></g><g class="u"><rect x="152" y="237" width="19" height="19" rx="2"/></g><g class="u"><rect x="175" y="237" width="19" height="19" rx="2"/></g><g class="u"><rect x="198" y="237" width="19" height="19" rx="2"/></g><g class="u"><rect x="221" y="237" width="19" height="19" rx="2"/></g><g class="u"><rect x="244" y="237" width="19" height="19" rx="2"/></g><g class="u"><rect x="267" y="237" width="19" height="19" rx="2"/></g><g class="u"><rect x="290" y="237" width="19" height="19" rx="2"/></g><g class="u"><rect x="313" y="237" width="19" height="19" rx="2"/></g><g class="u"><rect x="336" y="237" width="19" height="19" rx="2"/></g><g class="u"><rect x="359" y="237" width="19" height="19" rx="2"/></g><g class="u"><rect x="382" y="237" width="19" height="19" rx="2"/></g><g class="u"><rect x="405" y="237" width="19" height="19" rx="2"/></g><g class="u"><rect x="60" y="260" width="19" height="19" rx="2"/></g><g class="u"><rect x="83" y="260" width="19" height="19" rx="2"/></g><g class="u"><rect x="106" y="260" width="19" height="19" rx="2"/></g><g class="u"><rect x="129" y="260" width="19" height="19" rx="2"/></g><g class="u"><rect x="152" y="260" width="19" height="19" rx="2"/></g><g class="u"><rect x="175" y="260" width="19" height="19" rx="2"/></g><g class="u"><rect x="198" y="260" width="19" height="19" rx="2"/></g><g class="u"><rect x="221" y="260" width="19" height="19" rx="2"/></g><g class="u"><rect x="244" y="260" width="19" height="19" rx="2"/></g><g class="u"><rect x="267" y="260" width="19" height="19" rx="2"/></g><g class="u"><rect x="290" y="260" width="19" height="19" rx="2"/></g><g class="u"><rect x="313" y="260" width="19" height="19" rx="2"/></g><g class="u"><rect x="336" y="260" width="19" height="19" rx="2"/></g><g class="u"><rect x="359" y="260" width="19" height="19" rx="2"/></g><g class="u"><rect x="382" y="260" width="19" height="19" rx="2"/></g><g class="u"><rect x="405" y="260" width="19" height="19" rx="2"/></g><g class="u"><rect x="60" y="283" width="19" height="19" rx="2"/></g><g class="u"><rect x="83" y="283" width="19" height="19" rx="2"/></g><g class="u"><rect x="106" y="283" width="19" height="19" rx="2"/></g><g class="u"><rect x="129" y="283" width="19" height="19" rx="2"/></g><g class="u"><rect x="152" y="283" width="19" height="19" rx="2"/></g><g class="u"><rect x="175" y="283" width="19" height="19" rx="2"/></g><g class="u"><rect x="198" y="283" width="19" height="19" rx="2"/></g><g class="u"><rect x="221" y="283" width="19" height="19" rx="2"/></g><g class="u"><rect x="244" y="283" width="19" height="19" rx="2"/></g><g class="u"><rect x="267" y="283" width="19" height="19" rx="2"/></g><g class="u"><rect x="290" y="283" width="19" height="19" rx="2"/></g><g class="u"><rect x="313" y="283" width="19" height="19" rx="2"/></g><g class="u"><rect x="336" y="283" width="19" height="19" rx="2"/></g><g class="u"><rect x="359" y="283" width="19" height="19" rx="2"/></g><g class="u"><rect x="382" y="283" width="19" height="19" rx="2"/></g><g class="u"><rect x="405" y="283" width="19" height="19" rx="2"/></g><text class="hd" x="440" y="246" text-anchor="start">4.4 billion combinations</text><text class="sub2" x="440" y="272" text-anchor="start">roughly 37 million times as many</text><text class="sub2" x="440" y="292" text-anchor="start">ways to assemble knowledge</text><text class="cap" x="40" y="356" text-anchor="start">Eight quarter-width experts cost exactly what two full-width experts cost, so the</text><text class="cap" x="40" y="376" text-anchor="start">compute did not move at all. Only the number of possible teams did.</text><text class="cap" x="40" y="416" text-anchor="start">This is the fine-grained idea of the DeepSeekMoE paper: many small experts rather than a</text><text class="cap" x="40" y="436" text-anchor="start">few large ones. DeepSeek V3 runs 256 routed experts with eight firing per token, and</text><text class="cap" x="40" y="456" text-anchor="start">DeepSeek V4 Pro, the 1.6-trillion-parameter model of {{fig:v05-o001}}, pushes the pool to 384.</text><text class="cap" x="40" y="476" text-anchor="start">Compute per token barely moves while what a token can compose becomes far more specific.</text></svg><figcaption>The argument is pure combinatorics, and the numbers are exact: 120 teams becomes 4,426,165,368 at the same price.</figcaption></figure>
