<figure><div class='ts'>Fig 03 &nbsp;&middot;&nbsp; 0:38</div><h3>Two things a dense model welds together</h3><svg viewBox='0 0 680 232' role='img'><title>Two things a dense model welds together</title><g class="u"><rect x="50" y="55" width="265" height="76" rx="8"/><text class="lbl" x="182.5" y="76.0" text-anchor="middle" dominant-baseline="central">How much a model</text><text class="sub" x="182.5" y="94.0" text-anchor="middle" dominant-baseline="central">can know</text><text class="sub" x="182.5" y="111.0" text-anchor="middle" dominant-baseline="central">scales with parameters</text></g><g class="h"><rect x="365" y="55" width="265" height="76" rx="8"/><text class="lbl" x="497.5" y="76.0" text-anchor="middle" dominant-baseline="central">How much of it runs</text><text class="sub" x="497.5" y="94.0" text-anchor="middle" dominant-baseline="central">for each token</text><text class="sub" x="497.5" y="111.0" text-anchor="middle" dominant-baseline="central">also scales with parameters</text></g><text class="cap" x="40" y="178" text-anchor="start">In a dense model these are the same number. Making the model know more means making every</text><text class="cap" x="40" y="198" text-anchor="start">single token do more work, whether it needs that knowledge or not.</text><text class="cap" x="40" y="226" text-anchor="start">Mixture of experts is the architecture that separates them.</text></svg><figcaption>Keep the pair in view. The entire technique is the act of decoupling two quantities that had no reason to be identical.</figcaption></figure>
