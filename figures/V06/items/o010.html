<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:47</div><h3>One network becomes many</h3><svg viewBox='0 0 680 482' role='img'><title>One network becomes many</title><text class="hd" x="40" y="46">A dense layer runs one feed-forward network</text><g class="m"><rect x="200" y="66" width="280" height="44" rx="8"/><text class="lbl" x="340.0" y="88.0" text-anchor="middle" dominant-baseline="central">one feed-forward network</text></g><text class="hd" x="40" y="152">An MoE layer holds N of them side by side, with a router in front</text><g class="s"><rect x="40" y="172" width="98" height="92" rx="8"/><text class="lbl" x="89.0" y="201.0" text-anchor="middle" dominant-baseline="central">router</text><text class="sub" x="89.0" y="219.0" text-anchor="middle" dominant-baseline="central">also called</text><text class="sub" x="89.0" y="236.0" text-anchor="middle" dominant-baseline="central">the gate</text></g><g class="m"><rect x="152" y="172" width="74" height="92" rx="8"/><text class="lbl" x="189.0" y="201.0" text-anchor="middle" dominant-baseline="central">E1</text><text class="sub" x="189.0" y="219.0" text-anchor="middle" dominant-baseline="central">a full</text><text class="sub" x="189.0" y="236.0" text-anchor="middle" dominant-baseline="central">network</text></g><g class="m"><rect x="234" y="172" width="74" height="92" rx="8"/><text class="lbl" x="271.0" y="201.0" text-anchor="middle" dominant-baseline="central">E2</text><text class="sub" x="271.0" y="219.0" text-anchor="middle" dominant-baseline="central">a full</text><text class="sub" x="271.0" y="236.0" text-anchor="middle" dominant-baseline="central">network</text></g><g class="u"><rect x="316" y="172" width="74" height="92" rx="8"/><text class="lbl" x="353.0" y="201.0" text-anchor="middle" dominant-baseline="central">E3</text><text class="sub" x="353.0" y="219.0" text-anchor="middle" dominant-baseline="central">a full</text><text class="sub" x="353.0" y="236.0" text-anchor="middle" dominant-baseline="central">network</text></g><g class="u"><rect x="398" y="172" width="74" height="92" rx="8"/><text class="lbl" x="435.0" y="201.0" text-anchor="middle" dominant-baseline="central">E4</text><text class="sub" x="435.0" y="219.0" text-anchor="middle" dominant-baseline="central">a full</text><text class="sub" x="435.0" y="236.0" text-anchor="middle" dominant-baseline="central">network</text></g><g class="u"><rect x="480" y="172" width="74" height="92" rx="8"/><text class="lbl" x="517.0" y="201.0" text-anchor="middle" dominant-baseline="central">E5</text><text class="sub" x="517.0" y="219.0" text-anchor="middle" dominant-baseline="central">a full</text><text class="sub" x="517.0" y="236.0" text-anchor="middle" dominant-baseline="central">network</text></g><g class="u"><rect x="562" y="172" width="74" height="92" rx="8"/><text class="lbl" x="599.0" y="201.0" text-anchor="middle" dominant-baseline="central">E6</text><text class="sub" x="599.0" y="219.0" text-anchor="middle" dominant-baseline="central">a full</text><text class="sub" x="599.0" y="236.0" text-anchor="middle" dominant-baseline="central">network</text></g><text class="sub2" x="152" y="286" text-anchor="start">each expert is a complete feed-forward network, the same size as the one it replaces</text><text class="cap" x="40" y="330" text-anchor="start">Where a dense layer runs one feed-forward network, an MoE layer holds N of them, called</text><text class="cap" x="40" y="350" text-anchor="start">experts. Nothing else in the layer changes; the experts simply stand where the single</text><text class="cap" x="40" y="370" text-anchor="start">network stood.</text><text class="cap" x="40" y="410" text-anchor="start">In front of them sits a small router, also called the gate. Its whole job is to decide</text><text class="cap" x="40" y="430" text-anchor="start">which experts see which token: it scores all N for every token that arrives and sends</text><text class="cap" x="40" y="450" text-anchor="start">the token through only the K highest. The classic choice is K = 2, the two lit here.</text></svg><figcaption>Note how local the change is. Attention and the residual stream are untouched; only the feed-forward block is replaced, by N copies and a router.</figcaption></figure>
