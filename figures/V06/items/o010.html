<figure><div class='ts'>Fig 10 &nbsp;&middot;&nbsp; 4:32</div><h3>One network becomes many</h3><svg viewBox='0 0 680 490' role='img'><title>One network becomes many</title><text class="hd" x="40" y="46">A dense layer runs one feed-forward network</text><g class="m"><rect x="200" y="66" width="280" height="44" rx="4"/><text class="sub" x="340.0" y="88.0" text-anchor="middle" dominant-baseline="central">one FFN</text></g><text class="hd" x="40" y="152">An MoE layer holds N of them side by side, with a router in front</text><g class="s"><rect x="40" y="172" width="90" height="118" rx="4"/><text class="sub" x="85.0" y="231.0" text-anchor="middle" dominant-baseline="central">router</text></g><g class="m"><rect x="150" y="172" width="74" height="40" rx="4"/><text class="sub" x="187.0" y="192.0" text-anchor="middle" dominant-baseline="central">E1</text></g><g class="u"><rect x="150" y="222" width="74" height="40" rx="4"/><text class="sub" x="187.0" y="242.0" text-anchor="middle" dominant-baseline="central"></text></g><g class="u"><rect x="150" y="250" width="74" height="40" rx="4"/><text class="sub" x="187.0" y="270.0" text-anchor="middle" dominant-baseline="central"></text></g><g class="m"><rect x="234" y="172" width="74" height="40" rx="4"/><text class="sub" x="271.0" y="192.0" text-anchor="middle" dominant-baseline="central">E2</text></g><g class="u"><rect x="234" y="222" width="74" height="40" rx="4"/><text class="sub" x="271.0" y="242.0" text-anchor="middle" dominant-baseline="central"></text></g><g class="u"><rect x="234" y="250" width="74" height="40" rx="4"/><text class="sub" x="271.0" y="270.0" text-anchor="middle" dominant-baseline="central"></text></g><g class="u"><rect x="318" y="172" width="74" height="40" rx="4"/><text class="sub" x="355.0" y="192.0" text-anchor="middle" dominant-baseline="central">E3</text></g><g class="u"><rect x="318" y="222" width="74" height="40" rx="4"/><text class="sub" x="355.0" y="242.0" text-anchor="middle" dominant-baseline="central"></text></g><g class="u"><rect x="318" y="250" width="74" height="40" rx="4"/><text class="sub" x="355.0" y="270.0" text-anchor="middle" dominant-baseline="central"></text></g><g class="u"><rect x="402" y="172" width="74" height="40" rx="4"/><text class="sub" x="439.0" y="192.0" text-anchor="middle" dominant-baseline="central">E4</text></g><g class="u"><rect x="402" y="222" width="74" height="40" rx="4"/><text class="sub" x="439.0" y="242.0" text-anchor="middle" dominant-baseline="central"></text></g><g class="u"><rect x="402" y="250" width="74" height="40" rx="4"/><text class="sub" x="439.0" y="270.0" text-anchor="middle" dominant-baseline="central"></text></g><g class="u"><rect x="486" y="172" width="74" height="40" rx="4"/><text class="sub" x="523.0" y="192.0" text-anchor="middle" dominant-baseline="central">E5</text></g><g class="u"><rect x="486" y="222" width="74" height="40" rx="4"/><text class="sub" x="523.0" y="242.0" text-anchor="middle" dominant-baseline="central"></text></g><g class="u"><rect x="486" y="250" width="74" height="40" rx="4"/><text class="sub" x="523.0" y="270.0" text-anchor="middle" dominant-baseline="central"></text></g><g class="u"><rect x="570" y="172" width="74" height="40" rx="4"/><text class="sub" x="607.0" y="192.0" text-anchor="middle" dominant-baseline="central">E6</text></g><g class="u"><rect x="570" y="222" width="74" height="40" rx="4"/><text class="sub" x="607.0" y="242.0" text-anchor="middle" dominant-baseline="central"></text></g><g class="u"><rect x="570" y="250" width="74" height="40" rx="4"/><text class="sub" x="607.0" y="270.0" text-anchor="middle" dominant-baseline="central"></text></g><text class="sub2" x="150" y="318" text-anchor="start">each expert is a complete, full-size feed-forward network of its own</text><text class="cap" x="40" y="368" text-anchor="start">For every token the router produces a score for each of the N experts, keeps the K highest</text><text class="cap" x="40" y="388" text-anchor="start">scorers, and sends the token through only those. The classic choice is K equal to two.</text><text class="cap" x="40" y="428" text-anchor="start">The outputs of those experts are blended into a single result, a weighted sum whose weights are</text><text class="cap" x="40" y="448" text-anchor="start">the router's own scores, renormalised. The same numbers that chose the experts also decide how</text><text class="cap" x="40" y="468" text-anchor="start">much each one contributes.</text></svg><figcaption>Note how local the change is. Attention, the residual stream, the layer norms, all untouched. Only the feed-forward block is replaced.</figcaption></figure>
