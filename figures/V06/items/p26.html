ext-anchor="end">E5</text><g class="m"><rect x="476" y="146" width="2.0" height="16" rx="2" data-bar="4"/></g><text class="sub2" x="486.0" y="159" data-v="4">0.000</text><text class="cap" x="466" y="180" text-anchor="end">E6</text><g class="m"><rect x="476" y="167" width="2.0" height="16" rx="2" data-bar="5"/></g><text class="sub2" x="486.0" y="180" data-v="5">0.000</text><text class="cap" x="466" y="201" text-anchor="end">E7</text><g class="m"><rect x="476" y="188" width="2.0" height="16" rx="2" data-bar="6"/></g><text class="sub2" x="486.0" y="201" data-v="6">0.000</text><text class="cap" x="466" y="222" text-anchor="end">E8</text><g class="m"><rect x="476" y="209" width="2.0" height="16" rx="2" data-bar="7"/></g><text class="sub2" x="486.0" y="222" data-v="7">0.000</text><text class="sub2" x="40" y="300">expert 3, the luckiest, at step 100: <tspan data-r="at100">0.218</tspan>; at step 200: <tspan data-r="top">0.999</tspan></text><text class="sub2" x="40" y="320">experts left with under 1% of the traffic: <tspan data-r="dead">7</tspan> of 8</text><text class="sub2" x="40" y="340">one expert passes 90% of all traffic: <tspan data-r="takeover">at step 164</tspan></text><text class="cap" x="40" y="384" text-anchor="start">A toy, with made-up rates. Eight experts start almost level; by luck expert 3 is a</text><text class="cap" x="40" y="404" text-anchor="start">little ahead, with 0.135 of the traffic instead of 0.125. Each step, every expert</text><text class="cap" x="40" y="424" text-anchor="start">improves in proportion to the traffic it got, and the router, a softmax over how good</text><text class="cap" x="40" y="444" text-anchor="start">each expert is, shifts toward the better ones.</text><text class="cap" x="40" y="484" text-anchor="start">With the balancing push at zero, nothing seems to happen for a hundred steps, then the</text><text class="cap" x="40" y="504" text-anchor="start">luckiest expert takes everything and seven go dead. The push lowers each expert's score</text><text class="cap" x="40" y="524" text-anchor="start">in proportion to how far its share is above one eighth. Below 0.15 it only slows the</text><text class="cap" x="40" y="544" text-anchor="start">loop: at 0.12 the takeover comes at step 810 instead of at step 164. At 0.15, the</text><text class="cap" x="40" y="564" text-anchor="start">strength of the feedback, the shares freeze; above it they settle at one eighth.</text><text class="cap" x="40" y="604" text-anchor="start">The simulation in the page was checked against the same arithmetic in Python.</text></svg></div><figcaption>Positive feedback is invisible until it is not. A loop in which a small lead earns a bigger one ends with a few celebrity experts and a long tail of dead ones, unless something pushes back at least as hard.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const LUCK = [0.01, -0.04, 0.08, -0.01, 0.02, -0.08, 0.04, -0.02], ETA = 0.15, STEPS = 200, LEAD = 2, LIMIT = 5000;
  const PL = 70, PR = 360, PT = 60, PB = 230, BX = 476, BS = 140;
  const sl = fig.querySelector('input[type=range]'), val = fig.querySelector('.val'), q = s => fig.querySelector(s);
  const fmt = (v, d = 2) => (v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
  const px = t => PL + t / STEPS * (PR - PL), py = s => PB - s * (PB - PT);
  function sim(push) {
    let z = LUCK.slice(); const hist = [];
    for (let t = 0; t <= STEPS; t++) {
