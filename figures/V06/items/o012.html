<figure><div class='ts'>Fig 12 &nbsp;&middot;&nbsp; 6:13</div><h3>Attention is untouched</h3><svg viewBox='0 0 680 476' role='img'><title>Attention is untouched</title><g class="m"><rect x="40" y="55" width="285" height="78" rx="8"/><text class="lbl" x="182.5" y="77.0" text-anchor="middle" dominant-baseline="central">Sparsified</text><text class="sub" x="182.5" y="95.0" text-anchor="middle" dominant-baseline="central">the feed-forward block,</text><text class="sub" x="182.5" y="112.0" text-anchor="middle" dominant-baseline="central">and only that</text></g><g class="h"><rect x="368" y="55" width="272" height="78" rx="8"/><text class="lbl" x="504.0" y="85.0" text-anchor="middle" dominant-baseline="central">Still fully dense</text><text class="sub" x="504.0" y="103.0" text-anchor="middle" dominant-baseline="central">attention, and the KV cache</text></g><text class="cap" x="40" y="178" text-anchor="start">Every token still attends over every token before it. That work still grows with the length of</text><text class="cap" x="40" y="198" text-anchor="start">the context, and none of it consults the router.</text><text class="cap" x="40" y="238" text-anchor="start">Which means the KV cache, the stored keys and values for every prior token, is exactly what it</text><text class="cap" x="40" y="258" text-anchor="start">was in the dense model, growing with context at exactly the same rate.</text><g class="h"><rect x="90" y="290" width="500" height="42" rx="6"/><text class="sub" x="340.0" y="311.0" text-anchor="middle" dominant-baseline="central">MoE makes the FFN compute cheaper per token, and that is all it does</text></g><text class="cap" x="40" y="374" text-anchor="start">If your problem is long context, if the KV cache is what is overflowing your memory, MoE does</text><text class="cap" x="40" y="394" text-anchor="start">not help you at all. That memory wall stands as tall as it did before.</text><text class="cap" x="40" y="434" text-anchor="start">The proof is in DeepSeek V3 itself: alongside its MoE layers it runs multi-head latent</text><text class="cap" x="40" y="454" text-anchor="start">attention, a separate technique attacking exactly the cost MoE leaves untouched.</text></svg><figcaption>When you read 671 billion total against 37 billion active, the ratio comes from the feed-forward network alone. Attention runs in full on every single token.</figcaption></figure>
