<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 15:28</div><h3>A bias that changes who is chosen, never how much they count</h3><svg viewBox='0 0 680 506' role='img'><title>A bias that changes who is chosen, never how much they count</title><text class="hd" x="40" y="46">Choose with score + bias; weigh with the score alone</text><text class="sub2" x="40" y="80" text-anchor="start"></text><text class="sub2" x="150" y="80" text-anchor="start">score s</text><text class="sub2" x="240" y="80" text-anchor="start">bias b</text><text class="sub2" x="330" y="80" text-anchor="start">s + b</text><text class="sub2" x="450" y="80" text-anchor="start">chosen</text><text class="sub2" x="560" y="80" text-anchor="start">gate, from s</text><text class="cap" x="40" y="113" text-anchor="start">expert 1</text><g class="u"><rect x="150" y="94" width="64" height="28" rx="3"/><text class="sub" x="182.0" y="108.0" text-anchor="middle" dominant-baseline="central">0.80</text></g><g class="h"><rect x="240" y="94" width="64" height="28" rx="3"/><text class="sub" x="272.0" y="108.0" text-anchor="middle" dominant-baseline="central">−0.10</text></g><g class="u"><rect x="330" y="94" width="64" height="28" rx="3"/><text class="sub" x="362.0" y="108.0" text-anchor="middle" dominant-baseline="central">0.70</text></g><text class="sub2" x="450" y="113" text-anchor="start">would be, without bias</text><text class="cap" x="40" y="151" text-anchor="start">expert 2</text><g class="u"><rect x="150" y="132" width="64" height="28" rx="3"/><text class="sub" x="182.0" y="146.0" text-anchor="middle" dominant-baseline="central">0.75</text></g><g class="u"><rect x="240" y="132" width="64" height="28" rx="3"/><text class="sub" x="272.0" y="146.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="m"><rect x="330" y="132" width="64" height="28" rx="3"/><text class="sub" x="362.0" y="146.0" text-anchor="middle" dominant-baseline="central">0.75</text></g><text class="sub2" x="450" y="151" text-anchor="start">yes</text><g class="m"><rect x="560" y="132" width="64" height="28" rx="3"/><text class="sub" x="592.0" y="146.0" text-anchor="middle" dominant-baseline="central">0.517</text></g><text class="cap" x="40" y="189" text-anchor="start">expert 3</text><g class="u"><rect x="150" y="170" width="64" height="28" rx="3"/><text class="sub" x="182.0" y="184.0" text-anchor="middle" dominant-baseline="central">0.70</text></g><g class="s"><rect x="240" y="170" width="64" height="28" rx="3"/><text class="sub" x="272.0" y="184.0" text-anchor="middle" dominant-baseline="central">+0.20</text></g><g class="m"><rect x="330" y="170" width="64" height="28" rx="3"/><text class="sub" x="362.0" y="184.0" text-anchor="middle" dominant-baseline="central">0.90</text></g><text class="sub2" x="450" y="189" text-anchor="start">yes</text><g class="m"><rect x="560" y="170" width="64" height="28" rx="3"/><text class="sub" x="592.0" y="184.0" text-anchor="middle" dominant-baseline="central">0.483</text></g><text class="cap" x="40" y="227" text-anchor="start">expert 4</text><g class="u"><rect x="150" y="208" width="64" height="28" rx="3"/><text class="sub" x="182.0" y="222.0" text-anchor="middle" dominant-baseline="central">0.30</text></g><g class="u"><rect x="240" y="208" width="64" height="28" rx="3"/><text class="sub" x="272.0" y="222.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="330" y="208" width="64" height="28" rx="3"/><text class="sub" x="362.0" y="222.0" text-anchor="middle" dominant-baseline="central">0.30</text></g><text class="sub2" x="450" y="227" text-anchor="start">no</text><text class="cap" x="40" y="294" text-anchor="start">DeepSeek V3 adds a bias b to each expert's score, but only when choosing. Selection</text><text class="cap" x="40" y="314" text-anchor="start">takes the top two of s + b; the weight each chosen expert gets in the blend is worked</text><text class="cap" x="40" y="334" text-anchor="start">out from s alone, renormalised over the chosen experts as in {{fig:v06-p20}}.</text><text class="cap" x="40" y="374" text-anchor="start">Expert 1 has been overloaded, so its bias is −0.10; expert 3 has been starved, so +0.20.</text><text class="cap" x="40" y="394" text-anchor="start">On the raw scores this token would go to experts 1 and 2; with the biases it goes to 3</text><text class="cap" x="40" y="414" text-anchor="start">and 2. Expert 3's gate still comes from its own score: 0.70 / (0.75 + 0.70) = 0.483.</text><text class="cap" x="40" y="454" text-anchor="start">No gradient flows into b. A controller sets it, the next figure shows how, and the</text><text class="cap" x="40" y="474" text-anchor="start">language objective trains the router's weights exactly as it would without it.</text></svg><figcaption>The bias moves traffic, not answers. That is the whole difference from the auxiliary loss, which moves the router's own weights to get its balance.</figcaption></figure>
