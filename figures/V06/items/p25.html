<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:19</div><h3>To rank its column, an expert needs tokens that do not exist yet</h3><svg viewBox='0 0 680 514' role='img'><title>To rank its column, an expert needs tokens that do not exist yet</title><text class="hd" x="40" y="46">The same grid during decoding, when only three tokens exist</text><text class="sub2" x="50" y="72" text-anchor="start">t1 to t3 written; t4 to t8 not yet generated</text><text class="sub2" x="102.0" y="90" text-anchor="middle">E1</text><text class="sub2" x="150.0" y="90" text-anchor="middle">E2</text><text class="sub2" x="198.0" y="90" text-anchor="middle">E3</text><text class="sub2" x="246.0" y="90" text-anchor="middle">E4</text><text class="cap" x="50" y="114" text-anchor="start">t1</text><g class="m"><rect x="80" y="98" width="44" height="22" rx="3"/><text class="sub" x="102.0" y="109.0" text-anchor="middle" dominant-baseline="central">.45</text></g><g class="u"><rect x="128" y="98" width="44" height="22" rx="3"/><text class="sub" x="150.0" y="109.0" text-anchor="middle" dominant-baseline="central">.30</text></g><g class="u"><rect x="176" y="98" width="44" height="22" rx="3"/><text class="sub" x="198.0" y="109.0" text-anchor="middle" dominant-baseline="central">.05</text></g><g class="u"><rect x="224" y="98" width="44" height="22" rx="3"/><text class="sub" x="246.0" y="109.0" text-anchor="middle" dominant-baseline="central">.20</text></g><text class="cap" x="50" y="140" text-anchor="start">t2</text><g class="m"><rect x="80" y="124" width="44" height="22" rx="3"/><text class="sub" x="102.0" y="135.0" text-anchor="middle" dominant-baseline="central">.42</text></g><g class="u"><rect x="128" y="124" width="44" height="22" rx="3"/><text class="sub" x="150.0" y="135.0" text-anchor="middle" dominant-baseline="central">.05</text></g><g class="u"><rect x="176" y="124" width="44" height="22" rx="3"/><text class="sub" x="198.0" y="135.0" text-anchor="middle" dominant-baseline="central">.30</text></g><g class="u"><rect x="224" y="124" width="44" height="22" rx="3"/><text class="sub" x="246.0" y="135.0" text-anchor="middle" dominant-baseline="central">.23</text></g><text class="cap" x="50" y="166" text-anchor="start">t3</text><g class="m"><rect x="80" y="150" width="44" height="22" rx="3"/><text class="sub" x="102.0" y="161.0" text-anchor="middle" dominant-baseline="central">.38</text></g><g class="u"><rect x="128" y="150" width="44" height="22" rx="3"/><text class="sub" x="150.0" y="161.0" text-anchor="middle" dominant-baseline="central">.17</text></g><g class="u"><rect x="176" y="150" width="44" height="22" rx="3"/><text class="sub" x="198.0" y="161.0" text-anchor="middle" dominant-baseline="central">.05</text></g><g class="u"><rect x="224" y="150" width="44" height="22" rx="3"/><text class="sub" x="246.0" y="161.0" text-anchor="middle" dominant-baseline="central">.40</text></g><text class="cap" x="50" y="192" text-anchor="start">t4</text><rect x="80.0" y="176.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="128.0" y="176.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="176.0" y="176.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="224.0" y="176.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="cap" x="50" y="218" text-anchor="start">t5</text><rect x="80.0" y="202.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="128.0" y="202.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="176.0" y="202.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="224.0" y="202.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="cap" x="50" y="244" text-anchor="start">t6</text><rect x="80.0" y="228.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="128.0" y="228.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="176.0" y="228.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="224.0" y="228.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="cap" x="50" y="270" text-anchor="start">t7</text><rect x="80.0" y="254.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="128.0" y="254.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="176.0" y="254.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="224.0" y="254.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="cap" x="50" y="296" text-anchor="start">t8</text><rect x="80.0" y="280.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="128.0" y="280.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="176.0" y="280.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="224.0" y="280.0" width="44.0" height="22.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="330" y="114" text-anchor="start">t1 reaches this layer now, and must be routed now.</text><text class="sub2" x="330" y="136" text-anchor="start">Expert choice asks expert 1 to rank its whole column,</text><text class="sub2" x="330" y="158" text-anchor="start">and that column is five scores short.</text><text class="sub2" x="330" y="202" text-anchor="start">With all eight written, t1 ranks second in it: only</text><text class="sub2" x="330" y="224" text-anchor="start">t4's .50 beats it. Any 4 later tokens above .45</text><text class="sub2" x="330" y="246" text-anchor="start">would have pushed it out of the top 4. At decode</text><text class="sub2" x="330" y="268" text-anchor="start">there is no knowing which way it will go.</text><text class="cap" x="40" y="362" text-anchor="start">A decoder writes one token at a time, and each token passes through every layer before</text><text class="cap" x="40" y="382" text-anchor="start">the next one exists ({{fig:v01-o110}}). When t1 is routed, t2 to t8 are not yet text.</text><text class="cap" x="40" y="422" text-anchor="start">Attention already obeys the rule that follows: a token may look back, never forward</text><text class="cap" x="40" y="442" text-anchor="start">({{fig:v03-o020}}). Token choice obeys it too, since each row decides alone. Expert</text><text class="cap" x="40" y="462" text-anchor="start">choice breaks it, because a rank depends on every score in the column, including the</text><text class="cap" x="40" y="482" text-anchor="start">scores of tokens that do not exist yet.</text></svg><figcaption>This is why production decoding sticks with token choice and lives with uneven traffic: a router that needs to see the future is no use to a model that writes one token at a time.</figcaption></figure>
