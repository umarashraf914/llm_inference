<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 12:16</div><h3>Two ways to route, and why decoding can use only one</h3><svg viewBox='0 0 680 432' role='img'><title>Two ways to route, and why decoding can use only one</title><g class="s"><rect x="40" y="55" width="285" height="78" rx="8"/><text class="lbl" x="182.5" y="77.0" text-anchor="middle" dominant-baseline="central">Token choice</text><text class="sub" x="182.5" y="95.0" text-anchor="middle" dominant-baseline="central">each token picks its top K,</text><text class="sub" x="182.5" y="112.0" text-anchor="middle" dominant-baseline="central">experts take what arrives</text></g><g class="u"><rect x="368" y="55" width="272" height="78" rx="8"/><text class="lbl" x="504.0" y="77.0" text-anchor="middle" dominant-baseline="central">Expert choice</text><text class="sub" x="504.0" y="95.0" text-anchor="middle" dominant-baseline="central">each expert picks its top C tokens,</text><text class="sub" x="504.0" y="112.0" text-anchor="middle" dominant-baseline="central">up to a fixed capacity</text></g><g class="u"><rect x="40" y="168" width="285" height="66" rx="8"/><text class="lbl" x="182.5" y="192.0" text-anchor="middle" dominant-baseline="central">Gentle</text><text class="sub" x="182.5" y="210.0" text-anchor="middle" dominant-baseline="central">a token nobody picks is skipped</text></g><g class="h"><rect x="368" y="168" width="272" height="66" rx="8"/><text class="lbl" x="504.0" y="192.0" text-anchor="middle" dominant-baseline="central">Fatal</text><text class="sub" x="504.0" y="210.0" text-anchor="middle" dominant-baseline="central">ranking needs the whole sequence</text></g><text class="cap" x="40" y="280" text-anchor="start">Nearly every deployed model routes by token choice, and nothing in it promises balance:</text><text class="cap" x="40" y="300" text-anchor="start">one expert can be flooded while another sits idle. In 2022 Zhou and colleagues turned it</text><text class="cap" x="40" y="320" text-anchor="start">around. With expert choice each expert takes a fixed number of tokens, so the load is</text><text class="cap" x="40" y="340" text-anchor="start">balanced by construction and overload is impossible.</text><text class="cap" x="40" y="380" text-anchor="start">So why doesn't everyone route that way? There are two problems, one gentle and one</text><text class="cap" x="40" y="400" text-anchor="start">fatal, and the next two figures work both on real numbers.</text></svg><figcaption>Causality rules out the balanced option for decoding. The same constraint reappears in how balance is enforced instead.</figcaption></figure>
