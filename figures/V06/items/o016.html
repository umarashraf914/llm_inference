<figure><div class='ts'>Fig 16 &nbsp;&middot;&nbsp; 12:23</div><h3>Two ways to route, one of them impossible</h3><svg viewBox='0 0 680 464' role='img'><title>Two ways to route, one of them impossible</title><g class="s"><rect x="40" y="55" width="285" height="78" rx="8"/><text class="lbl" x="182.5" y="77.0" text-anchor="middle" dominant-baseline="central">Token choice</text><text class="sub" x="182.5" y="95.0" text-anchor="middle" dominant-baseline="central">each token picks its top K,</text><text class="sub" x="182.5" y="112.0" text-anchor="middle" dominant-baseline="central">experts take what arrives</text></g><g class="u"><rect x="368" y="55" width="272" height="78" rx="8"/><text class="lbl" x="504.0" y="77.0" text-anchor="middle" dominant-baseline="central">Expert choice</text><text class="sub" x="504.0" y="95.0" text-anchor="middle" dominant-baseline="central">each expert picks its top C tokens,</text><text class="sub" x="504.0" y="112.0" text-anchor="middle" dominant-baseline="central">up to a fixed capacity</text></g><text class="cap" x="40" y="178" text-anchor="start">Fill every expert to its cap and load is balanced by construction. Overload becomes impossible.</text><text class="cap" x="40" y="218" text-anchor="start">So why does nobody route that way? Two problems, one gentle and one fatal.</text><g class="u"><rect x="40" y="250" width="285" height="66" rx="8"/><text class="lbl" x="182.5" y="274.0" text-anchor="middle" dominant-baseline="central">Gentle</text><text class="sub" x="182.5" y="292.0" text-anchor="middle" dominant-baseline="central">a token nobody picks is skipped for that layer</text></g><g class="h"><rect x="368" y="250" width="272" height="66" rx="8"/><text class="lbl" x="504.0" y="274.0" text-anchor="middle" dominant-baseline="central">Fatal</text><text class="sub" x="504.0" y="292.0" text-anchor="middle" dominant-baseline="central">ranking needs the whole sequence</text></g><text class="cap" x="40" y="362" text-anchor="start">For an expert to rank its tokens it must compare them across the whole sequence, including</text><text class="cap" x="40" y="382" text-anchor="start">positions the decoder has not generated yet. A router that needs to see the future is no use in</text><text class="cap" x="40" y="402" text-anchor="start">a decoder that produces one token at a time.</text><text class="cap" x="40" y="442" text-anchor="start">So production decoding sticks with token choice and lives with uneven traffic.</text></svg><figcaption>Causality rules out the balanced option. This same constraint reappears immediately in how balance is enforced instead.</figcaption></figure>
