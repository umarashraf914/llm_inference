<figure><div class='ts'>Fig 18 &nbsp;&middot;&nbsp; 14:24</div><h3>Two ways to enforce balance</h3><svg viewBox='0 0 680 520' role='img'><title>Two ways to enforce balance</title><g class="u"><rect x="40" y="55" width="285" height="78" rx="8"/><text class="lbl" x="182.5" y="77.0" text-anchor="middle" dominant-baseline="central">The classic fix</text><text class="sub" x="182.5" y="95.0" text-anchor="middle" dominant-baseline="central">an auxiliary loss, smallest</text><text class="sub" x="182.5" y="112.0" text-anchor="middle" dominant-baseline="central">when traffic spreads evenly</text></g><g class="s"><rect x="368" y="55" width="272" height="78" rx="8"/><text class="lbl" x="504.0" y="77.0" text-anchor="middle" dominant-baseline="central">The newer fix</text><text class="sub" x="504.0" y="95.0" text-anchor="middle" dominant-baseline="central">a feedback controller</text><text class="sub" x="504.0" y="112.0" text-anchor="middle" dominant-baseline="central">adjusting a per-expert bias</text></g><text class="cap" x="40" y="178" text-anchor="start">The Switch Transformer, routing each token to a single expert, weighted its balancing term at</text><text class="cap" x="40" y="198" text-anchor="start">0.01: large enough to keep experts balanced, small enough not to overwhelm the real objective.</text><text class="cap" x="40" y="238" text-anchor="start">But the balancing gradient has nothing to do with next-token prediction. When the genuinely</text><text class="cap" x="40" y="258" text-anchor="start">best expert for a token happens to be a popular one, it pushes the router away anyway. Balance</text><text class="cap" x="40" y="278" text-anchor="start">comes at the cost of a little model quality on every update.</text><text class="cap" x="40" y="318" text-anchor="start">The controller approach adds a small bias to each expert's router score, used only for top-K</text><text class="cap" x="40" y="338" text-anchor="start">selection and never in the weighted sum. After each batch it counts what every expert received</text><text class="cap" x="40" y="358" text-anchor="start">and nudges the bias up for the starved and down for the overloaded by a fixed step. The</text><text class="cap" x="40" y="378" text-anchor="start">language gradient is never touched.</text><text class="cap" x="40" y="418" text-anchor="start">Note the careful detail: the controller only ever reads past batches, because reading the</text><text class="cap" x="40" y="438" text-anchor="start">current one would leak future tokens. The same causality constraint as before.</text><text class="cap" x="40" y="478" text-anchor="start">Neither closes the problem. A single sequence can still hammer a few experts even when the batch</text><text class="cap" x="40" y="498" text-anchor="start">average looks fine, so load balancing stays an operational concern watched at runtime.</text></svg><figcaption>The distinction is whether balance is bought with gradient, and therefore with a little quality, or with a separate control loop that leaves the objective alone.</figcaption></figure>
