<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 14:35</div><h3>Two ways to enforce balance</h3><svg viewBox='0 0 680 470' role='img'><title>Two ways to enforce balance</title><g class="u"><rect x="40" y="55" width="285" height="78" rx="8"/><text class="lbl" x="182.5" y="77.0" text-anchor="middle" dominant-baseline="central">The classic fix</text><text class="sub" x="182.5" y="95.0" text-anchor="middle" dominant-baseline="central">an auxiliary loss, smallest</text><text class="sub" x="182.5" y="112.0" text-anchor="middle" dominant-baseline="central">when traffic spreads evenly</text></g><g class="s"><rect x="368" y="55" width="272" height="78" rx="8"/><text class="lbl" x="504.0" y="77.0" text-anchor="middle" dominant-baseline="central">The newer fix</text><text class="sub" x="504.0" y="95.0" text-anchor="middle" dominant-baseline="central">a feedback controller</text><text class="sub" x="504.0" y="112.0" text-anchor="middle" dominant-baseline="central">adjusting a per-expert bias</text></g><text class="cap" x="40" y="178" text-anchor="start">The classic fix, introduced by Shazeer and colleagues and refined in the Switch</text><text class="cap" x="40" y="198" text-anchor="start">Transformer, adds a second term to the training loss that is smallest when traffic</text><text class="cap" x="40" y="218" text-anchor="start">spreads evenly ({{fig:v06-p28}}). It works through the gradient, so it pulls on the same</text><text class="cap" x="40" y="238" text-anchor="start">weights as the language objective, and costs a little quality on every update</text><text class="cap" x="40" y="258" text-anchor="start">({{fig:v06-p29}}).</text><text class="cap" x="40" y="298" text-anchor="start">DeepSeek's answer, from Wang and colleagues in 2024, stops using a gradient for balance.</text><text class="cap" x="40" y="318" text-anchor="start">A feedback controller nudges a per-expert bias that changes which experts are chosen and</text><text class="cap" x="40" y="338" text-anchor="start">nothing else ({{fig:v06-p30}}), reading only past batches ({{fig:v06-p31}}).</text><text class="cap" x="40" y="378" text-anchor="start">Neither closes the problem. A single sequence can still hammer a few experts while the</text><text class="cap" x="40" y="398" text-anchor="start">batch looks fine ({{fig:v06-p32}}), and serving traffic never quite matches what training</text><text class="cap" x="40" y="418" text-anchor="start">balanced for. Load balancing stays an operational concern, watched and patched at</text><text class="cap" x="40" y="438" text-anchor="start">runtime.</text></svg><figcaption>The distinction is whether balance is bought with gradient, and therefore with a little quality, or with a separate control loop that leaves the objective alone.</figcaption></figure>
