d experts 54%</text><text class="cap" x="40" y="542" text-anchor="start">The same table with 8 routed experts per layer instead of 256: only that line changes.</text><text class="cap" x="40" y="562" text-anchor="start">Everything else in the model runs for every token, as in a dense model.</text><text class="cap" x="40" y="602" text-anchor="start">Counted this way the total is 37.6 billion. The embedding table is only looked up, one</text><text class="cap" x="40" y="622" text-anchor="start">row per token ({{fig:v01-o087}}); leave it out and the count is 36.6 billion. DeepSeek's</text><text class="cap" x="40" y="642" text-anchor="start">report gives 37 billion.</text><text class="cap" x="40" y="682" text-anchor="start">Attention is 30% of what a token runs, untouched by sparsity. Of the routed experts,</text><text class="cap" x="40" y="702" text-anchor="start">97.4% of everything held, a token runs 8 of 256: 3.1%.</text></svg><figcaption>Bars drawn to scale. Same model, same shapes, one line of the table changed: that line is the whole of mixture of experts.</figcaption></figure>
