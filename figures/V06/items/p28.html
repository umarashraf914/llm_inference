lass="s"><rect x="285" y="382" width="52" height="22" rx="3"/><text class="sub" x="311.0" y="393.0" text-anchor="middle" dominant-baseline="central">0.0130</text></g><text class="sub2" x="348" y="398" text-anchor="start">f × P</text><g class="m"><rect x="40" y="422" width="600" height="30" rx="6"/><text class="sub" x="340.0" y="437.0" text-anchor="middle" dominant-baseline="central">N × Σ f × P = 4 × 0.436 = 1.744;   × α = 0.01 gives 0.0174</text></g><text class="hd" x="40" y="486">N × Σ f × P for three batches, to scale</text><text class="cap" x="40" y="520" text-anchor="start">even traffic</text><g class="s"><rect x="220.0" y="502.0" width="90.0" height="26.0" rx="3"/></g><text class="sub2" x="320.0" y="520" text-anchor="start">1.00</text><text class="cap" x="40" y="556" text-anchor="start">this batch</text><g class="m"><rect x="220.0" y="538.0" width="157.0" height="26.0" rx="3"/></g><text class="sub2" x="386.96" y="556" text-anchor="start">1.74</text><text class="cap" x="40" y="592" text-anchor="start">one expert takes all</text><g class="h"><rect x="220.0" y="574.0" width="360.0" height="26.0" rx="3"/></g><text class="sub2" x="590" y="592" text-anchor="start">4.00</text><text class="cap" x="40" y="654" text-anchor="start">The Switch Transformer sends each token to one expert, its largest share. For a batch, f</text><text class="cap" x="40" y="674" text-anchor="start">for an expert is the fraction of tokens it received: a count divided by the number of</text><text class="cap" x="40" y="694" text-anchor="start">tokens. P is the average share the router gave it over the same tokens: its column's</text><text class="cap" x="40" y="714" text-anchor="start">mean.</text><text class="cap" x="40" y="754" text-anchor="start">The term multiplies the two expert by expert and adds. With even traffic every f and P</text><text class="cap" x="40" y="774" text-anchor="start">is 1/N, the sum is N × 1/N² = 1/N, and multiplying by N makes it 1 whatever N is. If one</text><text class="cap" x="40" y="794" text-anchor="start">expert takes everything, it is N.</text><text class="cap" x="40" y="834" text-anchor="start">It is added to the language loss with a weight α. Switch used α = 0.01: large enough to</text><text class="cap" x="40" y="854" text-anchor="start">keep the experts balanced, small enough not to overwhelm the real objective.</text></svg><figcaption>Bars drawn to scale. One number that grows as traffic piles onto a few experts. Its value matters less than its slope, which the next figure follows.</figcaption></figure>
