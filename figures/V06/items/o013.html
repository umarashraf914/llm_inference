<figure><div class='ts'>Fig 13 &nbsp;&middot;&nbsp; 7:26</div><h3>How the router chooses</h3><svg viewBox='0 0 680 476' role='img'><title>How the router chooses</title><text class="hd" x="40" y="46">Three small steps on the token's hidden vector</text><g class="u"><rect x="40" y="70" width="130" height="44" rx="4"/><text class="sub" x="105.0" y="92.0" text-anchor="middle" dominant-baseline="central">hidden vector</text></g><line class="conn" x1="176" y1="92" x2="196" y2="92" marker-end="url(#arw)"/><g class="s"><rect x="202" y="70" width="140" height="44" rx="4"/><text class="sub" x="272.0" y="92.0" text-anchor="middle" dominant-baseline="central">one linear layer</text></g><line class="conn" x1="348" y1="92" x2="368" y2="92" marker-end="url(#arw)"/><g class="s"><rect x="374" y="70" width="120" height="44" rx="4"/><text class="sub" x="434.0" y="92.0" text-anchor="middle" dominant-baseline="central">softmax</text></g><line class="conn" x1="500" y1="92" x2="520" y2="92" marker-end="url(#arw)"/><g class="m"><rect x="526" y="70" width="114" height="44" rx="4"/><text class="sub" x="583.0" y="92.0" text-anchor="middle" dominant-baseline="central">top K</text></g><text class="sub2" x="202" y="142" text-anchor="start">N raw scores</text><text class="sub2" x="374" y="142" text-anchor="start">shares summing to 1</text><text class="sub2" x="526" y="142" text-anchor="start">keep K, renormalise</text><text class="cap" x="40" y="194" text-anchor="start">The router never sees the word. It reads the representation the layer has built for that token</text><text class="cap" x="40" y="214" text-anchor="start">so far.</text><text class="cap" x="40" y="254" text-anchor="start">The softmax turns raw scores into weights between zero and one that sum to exactly one, so they</text><text class="cap" x="40" y="274" text-anchor="start">behave like shares of a fixed budget. Top-K keeps the largest shares, zeros the rest, and</text><text class="cap" x="40" y="294" text-anchor="start">renormalises so the budget adds back up. Those K surviving weights are the same coefficients</text><text class="cap" x="40" y="314" text-anchor="start">that blend the expert outputs.</text><text class="cap" x="40" y="354" text-anchor="start">One small matrix multiply plus a softmax, sitting in front of the enormous networks it</text><text class="cap" x="40" y="374" text-anchor="start">controls. The router's cost rounds to zero, which is exactly what lets the model afford to run</text><text class="cap" x="40" y="394" text-anchor="start">it on every token at every layer.</text><text class="cap" x="40" y="434" text-anchor="start">Some models compute affinity with a sigmoid plus a normalisation instead of a softmax. The</text><text class="cap" x="40" y="454" text-anchor="start">skeleton stays the same: score, select, renormalise.</text></svg><figcaption>Demystifying the one component that decides everything. It is a single matrix and a normalisation.</figcaption></figure>
