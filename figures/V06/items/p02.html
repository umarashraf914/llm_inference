<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:23</div><h3>Held parameters cost memory; run parameters cost arithmetic</h3><svg viewBox='0 0 680 510' role='img'><title>Held parameters cost memory; run parameters cost arithmetic</title><text class="hd" x="40" y="46">Memory, in gigabytes at one byte a weight</text><text class="cap" x="40" y="82" text-anchor="start">held, all 671 billion</text><g class="h"><rect x="230" y="64" width="400" height="28" rx="3"/><text class="sub" x="430.0" y="78.0" text-anchor="middle" dominant-baseline="central">671 GB</text></g><text class="cap" x="40" y="124" text-anchor="start">read for one token</text><g class="m"><rect x="230.0" y="106.0" width="22.1" height="28.0" rx="3"/></g><text class="sub2" x="262.05663189269745" y="124" text-anchor="start">37 GB</text><text class="hd" x="40" y="184">Arithmetic, in billions of operations per token</text><text class="cap" x="40" y="220" text-anchor="start">if all 671 billion ran</text><rect x="230.0" y="202.0" width="400.0" height="28.0" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="430.0" y="220" text-anchor="middle">1,342 billion, as a dense model would</text><text class="cap" x="40" y="262" text-anchor="start">with 37 billion running</text><g class="m"><rect x="230.0" y="244.0" width="22.1" height="28.0" rx="3"/></g><text class="sub2" x="262.05663189269745" y="262" text-anchor="start">74 billion</text><text class="cap" x="40" y="318" text-anchor="start">Memory is set by what is held: parameters × bytes per parameter ({{fig:v01-o105}}). At FP8, an</text><text class="cap" x="40" y="338" text-anchor="start">8-bit format ({{fig:v04-o032}}), one byte each, 671 billion parameters fill 671 GB, whichever</text><text class="cap" x="40" y="358" text-anchor="start">experts a token happens to pick.</text><text class="cap" x="40" y="398" text-anchor="start">Arithmetic is set by what runs: two operations per parameter used ({{fig:v01-o114}}). A token</text><text class="cap" x="40" y="418" text-anchor="start">runs 37 billion, so 2 × 37 billion = 74 billion operations. Were all 671 billion to run,</text><text class="cap" x="40" y="438" text-anchor="start">as in a dense model, it would be 1,342 billion.</text><text class="cap" x="40" y="478" text-anchor="start">Both pairs differ by the same factor, 671 / 37 = 18.1: the one-eighteenth of {{fig:v06-o002}}.</text></svg><figcaption>Each pair is drawn to its own scale. Sparsity shrinks what a token reads and computes; the 671 GB held does not shrink at all, and that bill comes due when the model is served.</figcaption></figure>
