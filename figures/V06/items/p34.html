<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 17:47</div><h3>What one token sends in one layer: 172 kilobytes</h3><svg viewBox='0 0 680 460' role='img'><title>What one token sends in one layer: 172 kilobytes</title><text class="hd" x="40" y="46">Bytes one token sends through one MoE layer, to scale</text><text class="cap" x="40" y="89" text-anchor="start">out: dispatch</text><g class="h"><rect x="210.0" y="70.0" width="25.0" height="28.0" rx="3"/></g><g class="h"><rect x="235.0" y="70.0" width="25.0" height="28.0" rx="3"/></g><g class="h"><rect x="260.0" y="70.0" width="25.0" height="28.0" rx="3"/></g><g class="h"><rect x="285.0" y="70.0" width="25.0" height="28.0" rx="3"/></g><g class="h"><rect x="310.0" y="70.0" width="25.0" height="28.0" rx="3"/></g><g class="h"><rect x="335.0" y="70.0" width="25.0" height="28.0" rx="3"/></g><g class="h"><rect x="360.0" y="70.0" width="25.0" height="28.0" rx="3"/></g><g class="h"><rect x="385.0" y="70.0" width="25.0" height="28.0" rx="3"/></g><text class="sub2" x="210" y="116" text-anchor="start">8 copies of its vector, FP8: 8 × 7,168 = 57,344 bytes</text><text class="cap" x="40" y="153" text-anchor="start">back: combine</text><g class="h"><rect x="210.0" y="134.0" width="50.0" height="28.0" rx="3"/></g><g class="h"><rect x="260.0" y="134.0" width="50.0" height="28.0" rx="3"/></g><g class="h"><rect x="310.0" y="134.0" width="50.0" height="28.0" rx="3"/></g><g class="h"><rect x="360.0" y="134.0" width="50.0" height="28.0" rx="3"/></g><g class="h"><rect x="410.0" y="134.0" width="50.0" height="28.0" rx="3"/></g><g class="h"><rect x="460.0" y="134.0" width="50.0" height="28.0" rx="3"/></g><g class="h"><rect x="510.0" y="134.0" width="50.0" height="28.0" rx="3"/></g><g class="h"><rect x="560.0" y="134.0" width="50.0" height="28.0" rx="3"/></g><text class="sub2" x="210" y="180" text-anchor="start">8 results, BF16: 8 × 14,336 = 114,688 bytes</text><text class="cap" x="40" y="248" text-anchor="start">To reach its experts, a token's vector, 7,168 numbers, is copied to each of the 8 GPUs</text><text class="cap" x="40" y="268" text-anchor="start">that hold them. DeepSeek V3 sends those copies in FP8, one byte a number: 57,344 bytes</text><text class="cap" x="40" y="288" text-anchor="start">out.</text><text class="cap" x="40" y="328" text-anchor="start">Each expert sends back its output, another 7,168 numbers, kept in BF16, a 16-bit format</text><text class="cap" x="40" y="348" text-anchor="start">({{fig:v04-o030}}), at two bytes: 114,688 bytes back. Together 172,032 bytes, 172 KB, for one</text><text class="cap" x="40" y="368" text-anchor="start">token in one layer, and the 58 MoE layers make 10.0 MB for every token generated.</text><text class="cap" x="40" y="408" text-anchor="start">The precisions are the ones DeepSeek's report gives for its training traffic. The count</text><text class="cap" x="40" y="428" text-anchor="start">assumes every chosen expert sits on a different GPU, as it does when each GPU holds one.</text></svg><figcaption>Bars drawn to scale. Small for one token, but paid twice in every MoE layer for every token in flight, across the network between machines.</figcaption></figure>
