<figure><div class='ts'>Fig 17 &nbsp;&middot;&nbsp; 13:36</div><h3>The failure mode</h3><svg viewBox='0 0 680 442' role='img'><title>The failure mode</title><text class="hd" x="40" y="46">Routing collapse: a rich-get-richer loop</text><g class="h"><rect x="90" y="70" width="480" height="34" rx="4"/><text class="sub" x="330.0" y="87.0" text-anchor="middle" dominant-baseline="central">a few experts get slightly better, by luck</text></g><line class="conn" x1="330" y1="106" x2="330" y2="116" marker-end="url(#arw)"/><g class="h"><rect x="90" y="122" width="480" height="34" rx="4"/><text class="sub" x="330.0" y="139.0" text-anchor="middle" dominant-baseline="central">the router sends them more traffic</text></g><line class="conn" x1="330" y1="158" x2="330" y2="168" marker-end="url(#arw)"/><g class="h"><rect x="90" y="174" width="480" height="34" rx="4"/><text class="sub" x="330.0" y="191.0" text-anchor="middle" dominant-baseline="central">more traffic means more gradient updates</text></g><line class="conn" x1="330" y1="210" x2="330" y2="220" marker-end="url(#arw)"/><g class="h"><rect x="90" y="226" width="480" height="34" rx="4"/><text class="sub" x="330.0" y="243.0" text-anchor="middle" dominant-baseline="central">they improve faster, so the router prefers them more</text></g><line class="conn" x1="578" y1="100" x2="596" y2="100" marker-end="url(#arw)"/><line class="conn" x1="596" y1="100" x2="596" y2="224"/><line class="conn" x1="596" y1="224" x2="578" y2="224" marker-end="url(#arw)"/><text class="cap" x="40" y="320" text-anchor="start">Left alone, that loop ends with a few overloaded celebrity experts handling most of the traffic</text><text class="cap" x="40" y="340" text-anchor="start">while a long tail of dead experts almost never fires. Capacity you are paying to store and</text><text class="cap" x="40" y="360" text-anchor="start">never using.</text><text class="cap" x="40" y="400" text-anchor="start">In a cluster it is worse: the GPU holding a hot expert becomes a straggler that every other GPU</text><text class="cap" x="40" y="420" text-anchor="start">waits for.</text></svg><figcaption>Almost inevitable without intervention, because the feedback is positive at every step.</figcaption></figure>
