<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 20:32</div><h3>One DeepSeek V3 expert is three 7,168 × 2,048 matrices</h3><svg viewBox='0 0 680 596.2857142857142' role='img'><title>One DeepSeek V3 expert is three 7,168 × 2,048 matrices</title><text class="hd" x="40" y="46">One expert: two matrices widen the token, one narrows it, drawn to scale</text><g class="m"><rect x="40" y="70" width="250.0" height="71.42857142857143" rx="3"/><text class="sub" x="165.0" y="105.71428571428572" text-anchor="middle" dominant-baseline="central">gate: 7,168 × 2,048</text></g><g class="m"><rect x="40" y="151.42857142857144" width="250.0" height="71.42857142857143" rx="3"/><text class="sub" x="165.0" y="187.14285714285717" text-anchor="middle" dominant-baseline="central">up: 7,168 × 2,048</text></g><g class="m"><rect x="40" y="232.85714285714286" width="250.0" height="71.42857142857143" rx="3"/><text class="sub" x="165.0" y="268.57142857142856" text-anchor="middle" dominant-baseline="central">down: 2,048 × 7,168</text></g><text class="sub2" x="306.0" y="109.71428571428572" text-anchor="start">7,168 numbers in, 2,048 out</text><text class="sub2" x="306.0" y="191.14285714285717" text-anchor="start">7,168 numbers in, 2,048 out</text><text class="sub2" x="306.0" y="272.57142857142856" text-anchor="start">2,048 numbers in, 7,168 back out</text><g class="u"><rect x="40" y="328.2857142857143" width="230" height="40" rx="6"/><text class="sub" x="155.0" y="348.2857142857143" text-anchor="middle" dominant-baseline="central">7,168 × 2,048 = 14,680,064</text></g><text class="sub2" x="284" y="353.2857142857143" text-anchor="start">×  3  =</text><g class="m"><rect x="338" y="328.2857142857143" width="160" height="40" rx="6"/><text class="sub" x="418.0" y="348.2857142857143" text-anchor="middle" dominant-baseline="central">44,040,192 weights</text></g><text class="cap" x="40" y="404.2857142857143" text-anchor="start">Each expert is a gated feed-forward block, the three-matrix form noted in</text><text class="cap" x="40" y="424.2857142857143" text-anchor="start">{{fig:v06-p06}}. The token's 7,168 numbers are multiplied by the gate and the up matrix,</text><text class="cap" x="40" y="444.2857142857143" text-anchor="start">giving two lists of 2,048. The gate's list goes through SiLU, x times the sigmoid of x</text><text class="cap" x="40" y="464.2857142857143" text-anchor="start">({{fig:v06-p20}}), and the two lists are multiplied entry by entry. The down matrix</text><text class="cap" x="40" y="484.2857142857143" text-anchor="start">takes the result back to 7,168.</text><text class="cap" x="40" y="524.2857142857142" text-anchor="start">Each matrix is 7,168 × 2,048 = 14,680,064 weights, so an expert holds 44,040,192: the 44</text><text class="cap" x="40" y="544.2857142857142" text-anchor="start">million used throughout this atlas. Used once per token, that is 88 million operations</text><text class="cap" x="40" y="564.2857142857142" text-anchor="start">each time the expert runs.</text></svg><figcaption>Every count of DeepSeek V3's experts rests on this one product. Change the 2,048 and every number in the next two figures moves with it.</figcaption></figure>
