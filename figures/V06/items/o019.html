<figure><div class='ts'>Fig 19 &nbsp;&middot;&nbsp; 16:27</div><h3>The memory bill</h3><svg viewBox='0 0 680 452' role='img'><title>The memory bill</title><text class="cap" x="40" y="78" text-anchor="start">671B parameters at FP8</text><g class="h"><rect x="300" y="62" width="320" height="32" rx="3"/><text class="sub" x="460.0" y="78.0" text-anchor="middle" dominant-baseline="central">671 GB</text></g><text class="cap" x="40" y="138" text-anchor="start">An eight-GPU node of 80 GB cards</text><g class="s"><rect x="300" y="122" width="305" height="32" rx="3"/><text class="sub" x="452.5" y="138.0" text-anchor="middle" dominant-baseline="central">640 GB</text></g><text class="cap" x="40" y="200" text-anchor="start">Too big even for a full node. The experts have to spread across a cluster, and that arrangement</text><text class="cap" x="40" y="220" text-anchor="start">is expert parallelism.</text><text class="cap" x="40" y="260" text-anchor="start">Where tensor parallelism slices every weight matrix into pieces, expert parallelism keeps each</text><text class="cap" x="40" y="280" text-anchor="start">expert whole and gives it a home on some GPU.</text><text class="hd" x="40" y="330">DeepSeek V3's decode deployment</text><g class="m"><rect x="40" y="350" width="400" height="36" rx="4"/><text class="sub" x="240.0" y="368.0" text-anchor="middle" dominant-baseline="central">256 routed experts, one per GPU</text></g><g class="s"><rect x="448" y="350" width="192" height="36" rx="4"/><text class="sub" x="544.0" y="368.0" text-anchor="middle" dominant-baseline="central">64 more GPUs</text></g><text class="sub2" x="448" y="406" text-anchor="start">shared expert plus redundant</text><text class="sub2" x="448" y="426" text-anchor="start">copies of the hottest ones</text><text class="sub2" x="40" y="406" text-anchor="start">320 GPUs in total</text></svg><figcaption>Every expert stays resident whether it is busy or not. The full 671 GB is held even when a token only touches 37.</figcaption></figure>
