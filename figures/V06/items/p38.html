<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 18:30</div><h3>An expert waits on memory until it holds about 295 tokens</h3><svg viewBox='0 0 680 488' role='img'><title>An expert waits on memory until it holds about 295 tokens</title><text class="hd" x="40" y="46">Tokens per expert in one step, on a logarithmic axis</text><g class="h"><rect x="60.0" y="120.0" width="461.1" height="26.0" rx="3"/></g><g class="s"><rect x="521.1" y="120.0" width="98.9" height="26.0" rx="3"/></g><text class="sub2" x="70" y="137" text-anchor="start">waiting on memory</text><text class="sub2" x="610" y="137" text-anchor="end">busy</text><line class="tick" x1="60.0" y1="146" x2="60.0" y2="152"/><text class="sub2" x="60.0" y="166" text-anchor="middle">1</text><line class="tick" x1="246.66666666666666" y1="146" x2="246.66666666666666" y2="152"/><text class="sub2" x="246.66666666666666" y="166" text-anchor="middle">10</text><line class="tick" x1="433.3333333333333" y1="146" x2="433.3333333333333" y2="152"/><text class="sub2" x="433.3333333333333" y="166" text-anchor="middle">100</text><line class="tick" x1="620.0" y1="146" x2="620.0" y2="152"/><text class="sub2" x="620.0" y="166" text-anchor="middle">1,000</text><line class="tick" x1="60.0" y1="116" x2="60.0" y2="108"/><text class="sub2" x="60.0" y="102" text-anchor="start">1: one token on its own</text><line class="tick" x1="127.58308062082632" y1="172" x2="127.58308062082632" y2="180"/><text class="sub2" x="127.58308062082632" y="194" text-anchor="start">2.3: a 64-token step</text><line class="tick" x1="509.5381268582119" y1="172" x2="509.5381268582119" y2="180"/><text class="sub2" x="509.5381268582119" y="194" text-anchor="end">256: DeepSeek's usual most</text><line class="tick" x1="521.1359184143731" y1="116" x2="521.1359184143731" y2="108"/><text class="sub2" x="521.1359184143731" y="102" text-anchor="middle">295: the ridge</text><text class="cap" x="40" y="236" text-anchor="start">An expert reads its weights once per step and uses each for every token in its batch: 2</text><text class="cap" x="40" y="256" text-anchor="start">operations per weight per token, against 1 byte read per weight at FP8. So T tokens give</text><text class="cap" x="40" y="276" text-anchor="start">2T operations per byte ({{fig:v04-o055}}).</text><text class="cap" x="40" y="316" text-anchor="start">An H100 does 1,979 trillion FP8 operations a second and reads 3.35 trillion bytes, so it</text><text class="cap" x="40" y="336" text-anchor="start">waits on memory below 1,979 / 3.35 = 591 operations per byte ({{fig:v01-o126}} derives</text><text class="cap" x="40" y="356" text-anchor="start">the same kind of ridge in 16 bits). 2T reaches 591 at T = 295 tokens per expert.</text><text class="cap" x="40" y="396" text-anchor="start">With 8 of 256 experts per token, an expert gets on average B / 32 of a step's B tokens;</text><text class="cap" x="40" y="416" text-anchor="start">295 each needs a step of about 9,450 tokens. DeepSeek reports its decode experts'</text><text class="cap" x="40" y="436" text-anchor="start">batches usually within 256 tokens: 512 operations per byte, still waiting on memory, as</text><text class="cap" x="40" y="456" text-anchor="start">its report says.</text></svg><figcaption>Even DeepSeek's own crowd keeps its experts on the memory side of the ridge, on an H100's numbers. A single user's token leaves them almost entirely idle.</figcaption></figure>
