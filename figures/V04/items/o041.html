<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:44</div><h3>What rounding error is</h3><svg viewBox='0 0 680 426' role='img'><title>What rounding error is</title><text class="hd" x="40" y="46">Rounding to the nearest available value</text><line class="axis" x1="70.0" y1="110" x2="610.0" y2="110"/><line class="tick" x1="70.0" y1="101" x2="70.0" y2="119"/><line class="tick" x1="137.5" y1="101" x2="137.5" y2="119"/><line class="tick" x1="205.0" y1="101" x2="205.0" y2="119"/><line class="tick" x1="272.5" y1="101" x2="272.5" y2="119"/><line class="tick" x1="340.0" y1="101" x2="340.0" y2="119"/><line class="tick" x1="407.5" y1="101" x2="407.5" y2="119"/><line class="tick" x1="475.0" y1="101" x2="475.0" y2="119"/><line class="tick" x1="542.5" y1="101" x2="542.5" y2="119"/><line class="tick" x1="610.0" y1="101" x2="610.0" y2="119"/><g class="h"><rect x="295.15" y="96" width="6.0" height="28" rx="1"/></g><text class="sub2" x="304.15" y="88" text-anchor="start">the true value</text><line class="conn" x1="292.15" y1="140" x2="276.5" y2="140" marker-end="url(#arw)"/><text class="sub2" x="266.5" y="160" text-anchor="start">lands on the nearest tick</text><text class="sub2" x="373.75" y="144" text-anchor="middle">one step</text><line class="tick" x1="340.0" y1="126" x2="407.5" y2="126"/><text class="cap" x="40" y="200" text-anchor="start">The ticks are the only values the format can hold. Anything between them moves to the</text><text class="cap" x="40" y="220" text-anchor="start">nearest one, and the distance it moves is the rounding error.</text><text class="cap" x="40" y="260" text-anchor="start">Four properties follow. The error is at most half a step. It is as likely to go up as</text><text class="cap" x="40" y="280" text-anchor="start">down, so it averages to zero, ties included ({{fig:v04-p05}}). Across many weights it is</text><text class="cap" x="40" y="300" text-anchor="start">spread evenly between minus and plus half a step. And each weight's error has nothing to</text><text class="cap" x="40" y="320" text-anchor="start">do with its neighbours', because where a weight falls between two ticks has nothing to</text><text class="cap" x="40" y="340" text-anchor="start">do with where they do.</text><text class="cap" x="40" y="380" text-anchor="start">The whole argument for why squeezing a model into fewer bits survives at all rests on</text><text class="cap" x="40" y="400" text-anchor="start">these four.</text></svg><figcaption>Small, bounded, zero-mean and independent. The next three figures spend all four.</figcaption></figure>
