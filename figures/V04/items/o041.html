<figure><div class='ts'>Fig 41 &nbsp;&middot;&nbsp; 5:32</div><h3>What rounding error is</h3><svg viewBox="0 0 680 354" role="img"><title>What rounding error is</title><text class="hd" x="40" y="46">Rounding to the nearest available value</text><line class="axis" x1="70" y1="110" x2="610" y2="110"></line><line class="tick" x1="70" y1="102" x2="70" y2="118"></line><line class="tick" x1="130" y1="102" x2="130" y2="118"></line><line class="tick" x1="190" y1="102" x2="190" y2="118"></line><line class="tick" x1="250" y1="102" x2="250" y2="118"></line><line class="tick" x1="310" y1="102" x2="310" y2="118"></line><line class="tick" x1="370" y1="102" x2="370" y2="118"></line><line class="tick" x1="430" y1="102" x2="430" y2="118"></line><line class="tick" x1="490" y1="102" x2="490" y2="118"></line><line class="tick" x1="550" y1="102" x2="550" y2="118"></line><line class="tick" x1="610" y1="102" x2="610" y2="118"></line><g class="h"><rect x="285" y="96" width="6" height="28" rx="1"></rect></g><text class="sub2" x="292" y="88" text-anchor="start">the true value</text><line class="conn" x1="288" y1="140" x2="310" y2="140" marker-end="url(#arw)"></line><text class="sub2" x="318" y="145" text-anchor="start">lands here</text><text class="cap" x="40" y="200" text-anchor="start">The ticks are the only values the format can hold. Anything between them has to move to one</text><text class="cap" x="40" y="220" text-anchor="start">of them, and the distance it moves is the rounding error.</text><text class="cap" x="40" y="256" text-anchor="start">That error is at most half the gap between ticks, it is as likely to go up as down, and it is</text><text class="cap" x="40" y="276" text-anchor="start">different for every value.</text><text class="cap" x="40" y="312" text-anchor="start">Three properties, and the whole argument for why squeezing a model into fewer bits survives at</text><text class="cap" x="40" y="332" text-anchor="start">all rests on them.</text></svg><figcaption>Small, bounded and unbiased. Keep those three words: the next figure spends all of them.</figcaption></figure>
