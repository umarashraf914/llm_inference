<figure><div class='ts'>Fig 05 &nbsp;&middot;&nbsp; 0:36</div><h3>The catch</h3><svg viewBox="0 0 680 210" role="img"><title>The catch</title><g class="s"><rect x="50" y="55" width="265" height="62" rx="8"></rect><text class="lbl" x="182.5" y="77.0" text-anchor="middle" dominant-baseline="central">Rerouting bytes</text><text class="sub" x="182.5" y="95.0" text-anchor="middle" dominant-baseline="central">exact, bit for bit</text></g><g class="h"><rect x="365" y="55" width="265" height="62" rx="8"></rect><text class="lbl" x="497.5" y="77.0" text-anchor="middle" dominant-baseline="central">Shrinking bytes</text><text class="sub" x="497.5" y="95.0" text-anchor="middle" dominant-baseline="central">an approximation, always</text></g><text class="cap" x="40" y="158" text-anchor="start">FlashAttention returns the identical answer to naive attention. Quantization never does.</text><text class="cap" x="40" y="186" text-anchor="start">Everything that follows is about spending a tight bit budget without breaking the model.</text></svg><figcaption>The first technique in this series that trades accuracy for speed. Judging that trade requires knowing exactly what a bit buys, which is where we start.</figcaption></figure>
