<figure><div class='ts'>Fig 08 &nbsp;&middot;&nbsp; 1:12</div><h3>Significand and mantissa are not the same thing</h3><svg viewBox="0 0 680 338" role="img"><title>Significand and mantissa are not the same thing</title><g class="u"><rect x="200" y="80" width="44" height="50" rx="5"></rect><text class="digit" x="222.0" y="105.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="248" y="80" width="22" height="50" rx="5"></rect><text class="digit" x="259.0" y="105.0" text-anchor="middle" dominant-baseline="central">.</text></g><g class="s"><rect x="278" y="80" width="44" height="50" rx="5"></rect><text class="digit" x="300.0" y="105.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="326" y="80" width="44" height="50" rx="5"></rect><text class="digit" x="348.0" y="105.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="s"><rect x="374" y="80" width="44" height="50" rx="5"></rect><text class="digit" x="396.0" y="105.0" text-anchor="middle" dominant-baseline="central">1</text></g><line class="tick" x1="200" y1="64" x2="418" y2="64"></line><line class="tick" x1="200" y1="58" x2="200" y2="64"></line><line class="tick" x1="418" y1="58" x2="418" y2="64"></line><text class="hd" x="309" y="48" text-anchor="middle">the significand: the whole value, 1.101</text><line class="tick" x1="200" y1="144" x2="270" y2="144"></line><line class="tick" x1="200" y1="144" x2="200" y2="150"></line><line class="tick" x1="270" y1="144" x2="270" y2="150"></line><text class="sub2" x="235.0" y="166" text-anchor="middle">implied</text><line class="tick" x1="278" y1="144" x2="418" y2="144"></line><line class="tick" x1="278" y1="144" x2="278" y2="150"></line><line class="tick" x1="418" y1="144" x2="418" y2="150"></line><text class="sub2" x="348.0" y="166" text-anchor="middle">the mantissa field</text><text class="sub2" x="235" y="186" text-anchor="middle">never stored</text><text class="sub2" x="348" y="186" text-anchor="middle">the stored bits</text><text class="cap" x="40" y="236" text-anchor="start">The significand is the value. The mantissa field is the part of it written into memory.</text><text class="cap" x="40" y="256" text-anchor="start">They differ by exactly one bit: the leading 1.</text><text class="cap" x="40" y="296" text-anchor="start">Mantissa bits do not hold the significand. They hold everything in the significand except</text><text class="cap" x="40" y="316" text-anchor="start">its first digit.</text></svg><figcaption>In everyday use the two words are treated as synonyms, and mostly that does no harm. It does harm the moment you try to count how much precision a format really has.</figcaption></figure>
