ntization multiplies decode's intensity by four and leaves the ceiling</text><text class="cap" x="40" y="434" text-anchor="start">where it was: the maths still runs in 16 bits. It pays at small batch, and stops paying</text><text class="cap" x="40" y="454" text-anchor="start">once the batch is large enough to make decode compute bound.</text><text class="cap" x="40" y="494" text-anchor="start">W8 A8 stores one byte per weight, so intensity only doubles, but it also doubles the</text><text class="cap" x="40" y="514" text-anchor="start">ceiling, because the tensor cores' eight-bit path runs twice as fast. The ridge moves to</text><text class="cap" x="40" y="534" text-anchor="start">591, and once the batch is large every point sits twice as high. That is what lets it</text><text class="cap" x="40" y="554" text-anchor="start">speed up prefill, and decode at large batch.</text><text class="cap" x="40" y="594" text-anchor="start">Weights only: these intensities leave out the cache of {{fig:v04-o055}}. The peaks are</text><text class="cap" x="40" y="614" text-anchor="start">NVIDIA's dense figures for the H100 SXM, half the numbers it quotes with sparsity.</text></svg><figcaption>Two levers on one diagram: W4 A16 slides decode to the right, W8 A8 raises the roof. Which one helps depends on the batch, which is to say on the phase.</figcaption></figure>
