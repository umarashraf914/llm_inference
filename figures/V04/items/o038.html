<figure><div class='ts'>Fig 38 &nbsp;&middot;&nbsp; 4:40</div><h3>For training, range beats precision</h3><svg viewBox="0 0 680 236" role="img"><title>For training, range beats precision</title><g class="h"><rect x="50" y="58" width="265" height="66" rx="8"></rect><text class="lbl" x="182.5" y="82.0" text-anchor="middle" dominant-baseline="central">What kills training</text><text class="sub" x="182.5" y="100.0" text-anchor="middle" dominant-baseline="central">overflow and underflow</text></g><g class="s"><rect x="365" y="58" width="265" height="66" rx="8"></rect><text class="lbl" x="497.5" y="82.0" text-anchor="middle" dominant-baseline="central">What barely matters</text><text class="sub" x="497.5" y="100.0" text-anchor="middle" dominant-baseline="central">small rounding errors</text></g><text class="cap" x="40" y="172" text-anchor="start">So BF16 keeps FP32's full eight-bit exponent and spends only seven bits on the mantissa. It</text><text class="cap" x="40" y="192" text-anchor="start">rarely needs loss scaling, and it became the default training format.</text><text class="cap" x="40" y="220" text-anchor="start">You might have expected the sharper format to win. It does not.</text></svg><figcaption>Genuinely counterintuitive, and a good illustration that the right format depends on which failure mode actually bites.</figcaption></figure>
