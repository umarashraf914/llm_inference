="20" rx="2"></rect></g><g class="u"><rect x="594" y="144" width="38" height="20" rx="2"></rect></g><text class="sub2" x="40" y="158" text-anchor="start">token 4</text><g class="u"><rect x="110" y="170" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="154" y="170" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="198" y="170" width="38" height="20" rx="2"></rect></g><g class="h"><rect x="242" y="170" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="286" y="170" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="330" y="170" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="374" y="170" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="418" y="170" width="38" height="20" rx="2"></rect></g><g class="h"><rect x="462" y="170" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="506" y="170" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="550" y="170" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="594" y="170" width="38" height="20" rx="2"></rect></g><text class="sub2" x="40" y="184" text-anchor="start">token 5</text><g class="u"><rect x="110" y="196" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="154" y="196" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="198" y="196" width="38" height="20" rx="2"></rect></g><g class="h"><rect x="242" y="196" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="286" y="196" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="330" y="196" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="374" y="196" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="418" y="196" width="38" height="20" rx="2"></rect></g><g class="h"><rect x="462" y="196" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="506" y="196" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="550" y="196" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="594" y="196" width="38" height="20" rx="2"></rect></g><text class="sub2" x="40" y="210" text-anchor="start">token 6</text><text class="cap" x="40" y="250" text-anchor="start">Tim Dettmers and colleagues mapped these outlier features in the LLM.int8() paper. A few</text><text class="cap" x="40" y="270" text-anchor="start">positions in the activation vector carry values far larger than the rest, and they are</text><text class="cap" x="40" y="290" text-anchor="start">the same positions for every token.</text><text class="cap" x="40" y="330" text-anchor="start">They appear abruptly, in what the paper calls a phase shift, at about 6.7 billion</text><text class="cap" x="40" y="350" text-anchor="start">parameters, and from there they show up in every layer.</text></svg><figcaption>This structure is what makes outliers tractable. Scattered at random they would offer nothing to plan for; sitting in fixed channels, they can be handled by the same correction every time, decided in advance.</figcaption></figure>
