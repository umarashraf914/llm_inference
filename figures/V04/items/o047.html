="20" rx="2"></rect></g><g class="u"><rect x="594" y="144" width="38" height="20" rx="2"></rect></g><text class="sub2" x="40" y="158" text-anchor="start">token 4</text><g class="u"><rect x="110" y="170" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="154" y="170" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="198" y="170" width="38" height="20" rx="2"></rect></g><g class="h"><rect x="242" y="170" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="286" y="170" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="330" y="170" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="374" y="170" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="418" y="170" width="38" height="20" rx="2"></rect></g><g class="h"><rect x="462" y="170" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="506" y="170" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="550" y="170" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="594" y="170" width="38" height="20" rx="2"></rect></g><text class="sub2" x="40" y="184" text-anchor="start">token 5</text><g class="u"><rect x="110" y="196" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="154" y="196" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="198" y="196" width="38" height="20" rx="2"></rect></g><g class="h"><rect x="242" y="196" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="286" y="196" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="330" y="196" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="374" y="196" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="418" y="196" width="38" height="20" rx="2"></rect></g><g class="h"><rect x="462" y="196" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="506" y="196" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="550" y="196" width="38" height="20" rx="2"></rect></g><g class="u"><rect x="594" y="196" width="38" height="20" rx="2"></rect></g><text class="sub2" x="40" y="210" text-anchor="start">token 6</text><text class="cap" x="40" y="250" text-anchor="start">A channel is one position in the activation vector, the same position for every token. A few</text><text class="cap" x="40" y="270" text-anchor="start">of these positions carry values far larger than the rest, consistently.</text><text class="cap" x="40" y="300" text-anchor="start">They appear abruptly, in what is described as a phase shift, at about 6.7 billion parameters,</text><text class="cap" x="40" y="320" text-anchor="start">and from there they show up in every layer.</text></svg><figcaption>This structure is what makes outliers tractable. Scattered randomly they would offer nothing to exploit; sitting in fixed channels, a per-channel scale can catch them.</figcaption></figure>
