<figure><div class='ts'>Fig 82 &nbsp;&middot;&nbsp; 19:53</div><h3>Two limits remain</h3><svg viewBox="0 0 680 365" role="img"><title>Two limits remain</title><g class="h"><rect x="40" y="58" width="285" height="84" rx="8"></rect><text class="lbl" x="182.5" y="83.0" text-anchor="middle" dominant-baseline="central">Even at four bits</text><text class="sub" x="182.5" y="101.0" text-anchor="middle" dominant-baseline="central">a multi-trillion parameter model</text><text class="sub" x="182.5" y="118.0" text-anchor="middle" dominant-baseline="central">is still measured in terabytes</text></g><g class="h"><rect x="368" y="58" width="272" height="84" rx="8"></rect><text class="lbl" x="504.0" y="83.0" text-anchor="middle" dominant-baseline="central">For any given token</text><text class="sub" x="504.0" y="101.0" text-anchor="middle" dominant-baseline="central">most of the weights contribute</text><text class="sub" x="504.0" y="118.0" text-anchor="middle" dominant-baseline="central">almost nothing</text></g><line class="conn" x1="182" y1="148" x2="182" y2="174" marker-end="url(#arw)"></line><line class="conn" x1="504" y1="148" x2="504" y2="174" marker-end="url(#arw)"></line><g class="s"><rect x="40" y="178" width="285" height="44" rx="8"></rect><text class="lbl" x="182.5" y="200.0" text-anchor="middle" dominant-baseline="central">Parallelism</text></g><g class="s"><rect x="368" y="178" width="272" height="44" rx="8"></rect><text class="lbl" x="504.0" y="200.0" text-anchor="middle" dominant-baseline="central">Mixture of experts</text></g><text class="cap" x="40" y="263" text-anchor="start">One limit is about capacity, the other about waste. Even at four bits the largest models</text><text class="cap" x="40" y="283" text-anchor="start">do not fit on one chip: a model of a few trillion parameters is still terabytes</text><text class="cap" x="40" y="303" text-anchor="start">({{fig:v05-o001}} counts one). So it must be split across many chips, and you pay for the</text><text class="cap" x="40" y="323" text-anchor="start">communication between them. And for any given token most of the weights contribute</text><text class="cap" x="40" y="343" text-anchor="start">almost nothing, which is where mixture of experts begins.</text></svg><figcaption>Quantization shrinks every number. It cannot make a model fit on one chip forever, and it cannot skip the weights a given token does not need.</figcaption></figure>
