<figure><div class='ts'>Fig 54 &nbsp;&middot;&nbsp; 9:00</div><h3>Decode: memory bound</h3><svg viewBox="0 0 680 256" role="img"><title>Decode: memory bound</title><g class="u"><rect x="40" y="55" width="285" height="88" rx="8"></rect><text class="lbl" x="182.5" y="82.0" text-anchor="middle" dominant-baseline="central">One token at a time</text><text class="sub" x="182.5" y="100.0" text-anchor="middle" dominant-baseline="central">a skinny matrix-vector multiply</text><text class="sub" x="182.5" y="117.0" text-anchor="middle" dominant-baseline="central">rereads all the weights and the whole KV cache</text></g><line class="conn" x1="331" y1="99" x2="362" y2="99" marker-end="url(#arw)"></line><g class="h"><rect x="368" y="55" width="272" height="88" rx="8"></rect><text class="lbl" x="504.0" y="82.0" text-anchor="middle" dominant-baseline="central">Low intensity</text><text class="sub" x="504.0" y="100.0" text-anchor="middle" dominant-baseline="central">utilisation on the same GPU</text><text class="sub" x="504.0" y="117.0" text-anchor="middle" dominant-baseline="central">can crater to 20 to 40%</text></g><text class="cap" x="40" y="186" text-anchor="start">Same model, same GPU, same weights. The only thing that changed is how many tokens share each</text><text class="cap" x="40" y="206" text-anchor="start">load of the weights, and the bottleneck flipped with it.</text></svg><figcaption>The phase is not a property of the model. It is a property of how the work is batched.</figcaption></figure>
