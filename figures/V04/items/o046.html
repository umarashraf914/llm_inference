8" height="22" rx="2"></rect></g><g class="u"><rect x="604" y="98" width="38" height="22" rx="2"></rect></g><text class="sub2" x="40" y="114" text-anchor="start">token 2</text><g class="u"><rect x="120" y="126" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="164" y="126" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="208" y="126" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="252" y="126" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="296" y="126" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="340" y="126" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="384" y="126" width="38" height="22" rx="2"></rect></g><g class="h"><rect x="428" y="126" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="472" y="126" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="516" y="126" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="560" y="126" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="604" y="126" width="38" height="22" rx="2"></rect></g><text class="sub2" x="40" y="142" text-anchor="start">token 3</text><g class="u"><rect x="120" y="154" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="164" y="154" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="208" y="154" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="252" y="154" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="296" y="154" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="340" y="154" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="384" y="154" width="38" height="22" rx="2"></rect></g><g class="h"><rect x="428" y="154" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="472" y="154" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="516" y="154" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="560" y="154" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="604" y="154" width="38" height="22" rx="2"></rect></g><text class="sub2" x="40" y="170" text-anchor="start">token 4</text><g class="u"><rect x="120" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="164" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="208" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="252" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="296" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="340" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="384" y="182" width="38" height="22" rx="2"></rect></g><g class="h"><rect x="428" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="472" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="516" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="560" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="604" y="182" width="38" height="22" rx="2"></rect></g><text class="sub2" x="40" y="198" text-anchor="start">token 5</text><rect x="116" y="66" width="46" height="146" rx="4" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="120" y="240" text-anchor="start">one channel: the same slot in every token's vector</text><text class="cap" x="40" y="290" text-anchor="start">A token's activation is a long list of numbers. Channel 8 means the eighth entry, and</text><text class="cap" x="40" y="310" text-anchor="start">there is one of those for every token that passes through.</text><text class="cap" x="40" y="350" text-anchor="start">So a channel is a column, not a row. When a later figure says the outliers sit in a few</text><text class="cap" x="40" y="370" text-anchor="start">fixed channels, it means the same handful of columns run large no matter what the text</text><text class="cap" x="40" y="390" text-anchor="start">is.</text></svg><figcaption>The word appears constantly and means something quite specific: a column, not a row. For weights a scale per channel is easy. For activations the channel is the direction a matrix multiply adds along, which is why giving them one takes a detour ({{ref:v04-p22}}).</figcaption></figure>
