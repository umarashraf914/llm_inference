="u"><rect x="604" y="154" width="38" height="22" rx="2"></rect></g><text class="sub2" x="40" y="170" text-anchor="start">token 4</text><g class="u"><rect x="120" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="164" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="208" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="252" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="296" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="340" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="384" y="182" width="38" height="22" rx="2"></rect></g><g class="h"><rect x="428" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="472" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="516" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="560" y="182" width="38" height="22" rx="2"></rect></g><g class="u"><rect x="604" y="182" width="38" height="22" rx="2"></rect></g><text class="sub2" x="40" y="198" text-anchor="start">token 5</text><rect x="116" y="66" width="46" height="146" rx="4" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="120" y="240" text-anchor="start">one channel: the same slot in every token's vector</text><text class="cap" x="40" y="290" text-anchor="start">A token's activation is a long list of numbers. Channel 8 means the eighth entry, and there is</text><text class="cap" x="40" y="310" text-anchor="start">one of those for every token that has ever passed through.</text><text class="cap" x="40" y="346" text-anchor="start">So a channel is a column, not a row. When a later figure says the outliers sit in a few fixed</text><text class="cap" x="40" y="366" text-anchor="start">channels, it means the same handful of columns run large no matter what the text is.</text></svg><figcaption>The word appears constantly and means something quite specific. Column, not row: that is why a per-channel scale is possible at all.</figcaption></figure>
