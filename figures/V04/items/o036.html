text-anchor="middle">10⁻¹⁰</text><line class="tick" x1="97.3" y1="203" x2="97.3" y2="213"/><line class="tick" x1="134.7" y1="203" x2="134.7" y2="213"/><text class="sub2" x="134.667" y="228" text-anchor="middle">10⁻⁸</text><line class="tick" x1="172.0" y1="203" x2="172.0" y2="213"/><line class="tick" x1="209.3" y1="203" x2="209.3" y2="213"/><text class="sub2" x="209.333" y="228" text-anchor="middle">10⁻⁶</text><line class="tick" x1="246.7" y1="203" x2="246.7" y2="213"/><line class="tick" x1="284.0" y1="203" x2="284.0" y2="213"/><text class="sub2" x="284" y="228" text-anchor="middle">10⁻⁴</text><line class="tick" x1="321.3" y1="203" x2="321.3" y2="213"/><line class="tick" x1="358.7" y1="203" x2="358.7" y2="213"/><text class="sub2" x="358.667" y="228" text-anchor="middle">10⁻²</text><line class="tick" x1="396.0" y1="203" x2="396.0" y2="213"/><line class="tick" x1="433.3" y1="203" x2="433.3" y2="213"/><text class="sub2" x="433.333" y="228" text-anchor="middle">1</text><line class="tick" x1="470.7" y1="203" x2="470.7" y2="213"/><line class="tick" x1="508.0" y1="203" x2="508.0" y2="213"/><text class="sub2" x="508" y="228" text-anchor="middle">10²</text><line class="tick" x1="545.3" y1="203" x2="545.3" y2="213"/><line class="tick" x1="582.7" y1="203" x2="582.7" y2="213"/><text class="sub2" x="582.667" y="228" text-anchor="middle">10⁴</text><line class="tick" x1="620.0" y1="203" x2="620.0" y2="213"/><text class="sub2" x="152.372" y="248" text-anchor="middle">3 × 10⁻⁸</text><text class="sub2" x="275.995" y="248" text-anchor="middle">6 × 10⁻⁵</text><text class="sub2" x="613.141" y="248" text-anchor="middle">65,504</text><text class="cap" x="40" y="290" text-anchor="start">The bars are how many gradients have each size, and the strip beneath is what FP16 does</text><text class="cap" x="40" y="310" text-anchor="start">with them. In a deep network many gradients are tiny. Those below about 3 × 10⁻⁸ round</text><text class="cap" x="40" y="330" text-anchor="start">to exactly zero, and a zero gradient teaches the model nothing ({{fig:v04-p11}}). Those</text><text class="cap" x="40" y="350" text-anchor="start">up to 6 × 10⁻⁵ survive only as subnormals, with a few bits each ({{fig:v04-p04}}).</text><text class="cap" x="40" y="390" text-anchor="start">Measured: training an SSD object detector in FP16, Micikevicius and colleagues found</text><text class="cap" x="40" y="410" text-anchor="start">many activation gradients below FP16's range. They became zeros and training diverged,</text><text class="cap" x="40" y="430" text-anchor="start">while most of FP16's range above them went unused.</text><text class="cap" x="40" y="470" text-anchor="start">This is a range failure, not a precision failure. FP16 has the finer mantissa and still</text><text class="cap" x="40" y="490" text-anchor="start">loses.</text></svg><figcaption>A concrete demonstration that more mantissa bits cannot compensate for too few exponent bits.</figcaption></figure>
