<figure><div class='ts'>Fig 36 &nbsp;&middot;&nbsp; 4:16</div><h3>FP16's floor, and what falls through it</h3><svg viewBox="0 0 680 280" role="img"><title>FP16's floor, and what falls through it</title><line class="axis" x1="60" y1="130" x2="620" y2="130"></line><g class="s"><rect x="230" y="96" width="300" height="34" rx="3"></rect><text class="sub" x="380.0" y="113.0" text-anchor="middle" dominant-baseline="central">what FP16 can represent</text></g><rect x="60" y="96" width="165" height="34" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="142.5" y="113.0" text-anchor="middle" dominant-baseline="central">underflows to exactly zero</text><text class="sub2" x="232" y="160" text-anchor="start">6e-5</text><text class="sub2" x="516" y="160" text-anchor="start">65,000</text><g class="h"><rect x="120" y="76" width="8" height="14" rx="1"></rect></g><g class="h"><rect x="170" y="78" width="8" height="12" rx="1"></rect></g><text class="sub2" x="90" y="62" text-anchor="start">gradients down here</text><text class="cap" x="40" y="208" text-anchor="start">In a deep network, gradients slip below FP16's floor and underflow to exactly zero, and a</text><text class="cap" x="40" y="228" text-anchor="start">zero gradient teaches the model nothing.</text><text class="cap" x="40" y="258" text-anchor="start">This is a range failure, not a precision failure. FP16 has the finer mantissa and still loses.</text></svg><figcaption>A concrete demonstration that more mantissa bits cannot compensate for too few exponent bits.</figcaption></figure>
