<figure><div class='ts'>Fig 56 &nbsp;&middot;&nbsp; 9:44</div><h3>Two bottlenecks, two strategies</h3><svg viewBox="0 0 680 286" role="img"><title>Two bottlenecks, two strategies</title><g class="s"><rect x="40" y="55" width="285" height="90" rx="8"></rect><text class="lbl" x="182.5" y="83.0" text-anchor="middle" dominant-baseline="central">W4 A16</text><text class="sub" x="182.5" y="101.0" text-anchor="middle" dominant-baseline="central">4-bit weights, 16-bit activations</text><text class="sub" x="182.5" y="118.0" text-anchor="middle" dominant-baseline="central">aimed at memory-bound decode</text></g><g class="m"><rect x="368" y="55" width="272" height="90" rx="8"></rect><text class="lbl" x="504.0" y="83.0" text-anchor="middle" dominant-baseline="central">W8 A8 or W4 A4</text><text class="sub" x="504.0" y="101.0" text-anchor="middle" dominant-baseline="central">both sides low precision</text><text class="sub" x="504.0" y="118.0" text-anchor="middle" dominant-baseline="central">prefill, and decode at large batch</text></g><text class="cap" x="40" y="184" text-anchor="start">The notation reads as bits-for-weights, bits-for-activations.</text><text class="cap" x="40" y="214" text-anchor="start">Weight-only shrinks what crosses the bus while the maths still runs in 16 bits, so the win is</text><text class="cap" x="40" y="234" text-anchor="start">bandwidth. Putting both sides low unlocks the tensor cores' low-precision paths, where halving</text><text class="cap" x="40" y="254" text-anchor="start">the bits roughly doubles throughput.</text></svg><figcaption>Shrink the weights for decode. Shrink both for prefill, and for decode once a large batch has made it compute bound too.</figcaption></figure>
