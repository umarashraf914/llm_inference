<figure><div class='ts'>Fig 03 &nbsp;&middot;&nbsp; 0:22</div><h3>Two ways to attack the same wall</h3><svg viewBox="0 0 680 238" role="img"><title>Two ways to attack the same wall</title><g class="u"><rect x="50" y="55" width="265" height="78" rx="8"></rect><text class="lbl" x="182.5" y="77.0" text-anchor="middle" dominant-baseline="central">Change the route</text><text class="sub" x="182.5" y="95.0" text-anchor="middle" dominant-baseline="central">same numbers,</text><text class="sub" x="182.5" y="112.0" text-anchor="middle" dominant-baseline="central">a shorter path through memory</text></g><g class="m"><rect x="365" y="55" width="265" height="78" rx="8"></rect><text class="lbl" x="497.5" y="77.0" text-anchor="middle" dominant-baseline="central">Shrink the numbers</text><text class="sub" x="497.5" y="95.0" text-anchor="middle" dominant-baseline="central">same path,</text><text class="sub" x="497.5" y="112.0" text-anchor="middle" dominant-baseline="central">fewer bits in each one</text></g><text class="cap" x="40" y="184" text-anchor="start">Tiling, fusion and FlashAttention take the first road: they never alter a value, only where</text><text class="cap" x="40" y="204" text-anchor="start">it travels. Quantization takes the second.</text><text class="cap" x="40" y="232" text-anchor="start">They compose. A quantized FlashAttention kernel gets both.</text></svg><figcaption>Independent levers. Neither one subsumes the other, and understanding which one a given technique pulls saves a lot of confusion.</figcaption></figure>
