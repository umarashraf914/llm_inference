ly different blast radius. With one scale for the tensor,</text><text class="cap" x="40" y="420" text-anchor="start">the outlier sets the step for every value, and the ordinary ones round to 0 ({{fig:v04-p29}}</text><text class="cap" x="40" y="440" text-anchor="start">measured it). With a scale per block of 16, the outlier sets the step for its own 15</text><text class="cap" x="40" y="460" text-anchor="start">neighbours only.</text><text class="cap" x="40" y="500" text-anchor="start">This is an old idea called block floating point, and its payoff is containment.</text></svg><figcaption>A local outlier blows up its own little block and leaves the rest of the tensor at the precision its own scale allows.</figcaption></figure>
