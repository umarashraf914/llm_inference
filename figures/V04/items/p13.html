<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:46</div><h3>Rounding one weight moves the output by its error times its input</h3><svg viewBox='0 0 680 610' role='img'><title>Rounding one weight moves the output by its error times its input</title><text class="hd" x="40" y="46">One output, four weights, each rounded to the nearest 0.25</text><text class="sub2" x="40" y="84" text-anchor="start">input x</text><text class="sub2" x="140" y="84" text-anchor="start">weight w</text><text class="sub2" x="240" y="84" text-anchor="start">rounded</text><text class="sub2" x="350" y="84" text-anchor="start">error e</text><text class="sub2" x="460" y="84" text-anchor="start">e × x</text><text class="cap" x="40" y="115" text-anchor="start">1.0</text><text class="sub2" x="140" y="115" text-anchor="start">0.31</text><text class="sub2" x="240" y="115" text-anchor="start">0.25</text><text class="sub2" x="350" y="115" text-anchor="start">−0.06</text><g class="m"><rect x="460" y="96" width="76" height="26" rx="3"/><text class="sub" x="498.0" y="109.0" text-anchor="middle" dominant-baseline="central">−0.060</text></g><text class="cap" x="40" y="151" text-anchor="start">0.5</text><text class="sub2" x="140" y="151" text-anchor="start">−0.72</text><text class="sub2" x="240" y="151" text-anchor="start">−0.75</text><text class="sub2" x="350" y="151" text-anchor="start">−0.03</text><g class="m"><rect x="460" y="132" width="76" height="26" rx="3"/><text class="sub" x="498.0" y="145.0" text-anchor="middle" dominant-baseline="central">−0.015</text></g><text class="cap" x="40" y="187" text-anchor="start">2.0</text><text class="sub2" x="140" y="187" text-anchor="start">0.18</text><text class="sub2" x="240" y="187" text-anchor="start">0.25</text><text class="sub2" x="350" y="187" text-anchor="start">+0.07</text><g class="h"><rect x="460" y="168" width="76" height="26" rx="3"/><text class="sub" x="498.0" y="181.0" text-anchor="middle" dominant-baseline="central">+0.140</text></g><text class="cap" x="40" y="223" text-anchor="start">−1.5</text><text class="sub2" x="140" y="223" text-anchor="start">0.55</text><text class="sub2" x="240" y="223" text-anchor="start">0.50</text><text class="sub2" x="350" y="223" text-anchor="start">−0.05</text><g class="m"><rect x="460" y="204" width="76" height="26" rx="3"/><text class="sub" x="498.0" y="217.0" text-anchor="middle" dominant-baseline="central">+0.075</text></g><line class="tick" x1="460" y1="246" x2="536" y2="246"/><text class="sub2" x="460" y="266" text-anchor="start">sum  +0.14</text><text class="sub2" x="40" y="266" text-anchor="start">output  −0.515  becomes  −0.375</text><g class="u"><rect x="150" y="288" width="380" height="42" rx="6"/><text class="sub" x="340.0" y="309.0" text-anchor="middle" dominant-baseline="central">(w + e) × x   =   w × x   +   e × x</text></g><text class="cap" x="40" y="364" text-anchor="start">A layer's output is a weighted sum, each input times its weight, added up</text><text class="cap" x="40" y="384" text-anchor="start">({{fig:v01-o005}}). Round a weight and it becomes w + e, and multiplying out shows</text><text class="cap" x="40" y="404" text-anchor="start">exactly what changes: the output gains e × x, the weight's error times the input it</text><text class="cap" x="40" y="424" text-anchor="start">multiplies, and nothing else.</text><text class="cap" x="40" y="464" text-anchor="start">So an error matters in proportion to its input. The third weight's error, 0.07, is the</text><text class="cap" x="40" y="484" text-anchor="start">biggest push because its input is 2.0; the second's, 0.03, is halved by an input of 0.5.</text><text class="cap" x="40" y="504" text-anchor="start">The four pushes add up to 0.29 in size, but they point both ways and the output moves by</text><text class="cap" x="40" y="524" text-anchor="start">only 0.14.</text><text class="cap" x="40" y="564" text-anchor="start">Two later methods are built on this one line. GPTQ uses it to decide how to compensate</text><text class="cap" x="40" y="584" text-anchor="start">for each rounding, and AWQ to decide which weights to protect.</text></svg><figcaption>The distributive law is the whole mechanism. Every method later in this atlas is a different way of making these error-times-input pushes small, or making them cancel.</figcaption></figure>
