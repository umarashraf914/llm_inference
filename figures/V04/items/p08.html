<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:44</div><h3>Quantizing five numbers by hand</h3><svg viewBox='0 0 680 508' role='img'><title>Quantizing five numbers by hand</title><text class="hd" x="40" y="46">Five values, one INT8 scale: s = 0.9 ÷ 127 = 0.00709</text><text class="sub2" x="40" y="84" text-anchor="start">value x</text><text class="sub2" x="150" y="84" text-anchor="start">x ÷ s</text><text class="sub2" x="280" y="84" text-anchor="start">round: q</text><text class="sub2" x="400" y="84" text-anchor="start">back: s × q</text><text class="sub2" x="540" y="84" text-anchor="start">error</text><text class="cap" x="40" y="115" text-anchor="start">0.12</text><text class="sub2" x="150" y="115" text-anchor="start">16.93</text><g class="m"><rect x="280" y="96" width="60" height="26" rx="3"/><text class="sub" x="310.0" y="109.0" text-anchor="middle" dominant-baseline="central">17</text></g><text class="sub2" x="400" y="115" text-anchor="start">0.1205</text><text class="sub2" x="540" y="115" text-anchor="start">+0.0005</text><text class="cap" x="40" y="149" text-anchor="start">−0.50</text><text class="sub2" x="150" y="149" text-anchor="start">−70.56</text><g class="m"><rect x="280" y="130" width="60" height="26" rx="3"/><text class="sub" x="310.0" y="143.0" text-anchor="middle" dominant-baseline="central">−71</text></g><text class="sub2" x="400" y="149" text-anchor="start">−0.5031</text><text class="sub2" x="540" y="149" text-anchor="start">−0.0031</text><text class="cap" x="40" y="183" text-anchor="start">0.33</text><text class="sub2" x="150" y="183" text-anchor="start">46.57</text><g class="m"><rect x="280" y="164" width="60" height="26" rx="3"/><text class="sub" x="310.0" y="177.0" text-anchor="middle" dominant-baseline="central">47</text></g><text class="sub2" x="400" y="183" text-anchor="start">0.3331</text><text class="sub2" x="540" y="183" text-anchor="start">+0.0031</text><text class="cap" x="40" y="217" text-anchor="start">0.90</text><text class="sub2" x="150" y="217" text-anchor="start">127.00</text><g class="m"><rect x="280" y="198" width="60" height="26" rx="3"/><text class="sub" x="310.0" y="211.0" text-anchor="middle" dominant-baseline="central">127</text></g><text class="sub2" x="400" y="217" text-anchor="start">0.9000</text><text class="sub2" x="540" y="217" text-anchor="start">0</text><text class="cap" x="40" y="251" text-anchor="start">−0.07</text><text class="sub2" x="150" y="251" text-anchor="start">−9.88</text><g class="m"><rect x="280" y="232" width="60" height="26" rx="3"/><text class="sub" x="310.0" y="245.0" text-anchor="middle" dominant-baseline="central">−10</text></g><text class="sub2" x="400" y="251" text-anchor="start">−0.0709</text><text class="sub2" x="540" y="251" text-anchor="start">−0.0009</text><text class="sub2" x="40" y="282" text-anchor="start">every error is at most half a step: s ÷ 2 = 0.00354</text><text class="cap" x="40" y="322" text-anchor="start">The largest magnitude, 0.9, sets the scale: it must land on the top code, 127. Every</text><text class="cap" x="40" y="342" text-anchor="start">value is divided by the scale, rounded to the nearest whole number, and stored as that</text><text class="cap" x="40" y="362" text-anchor="start">integer. Reading it back multiplies by the scale again, and the difference is the</text><text class="cap" x="40" y="382" text-anchor="start">rounding error, never more than half a step.</text><text class="cap" x="40" y="422" text-anchor="start">Two's complement gives INT8 the codes −128 to 127 ({{fig:v04-p03}}); −71 is stored as</text><text class="cap" x="40" y="442" text-anchor="start">10111001, that is −128 + 32 + 16 + 8 + 1. Symmetric quantization leaves −128 unused so</text><text class="cap" x="40" y="462" text-anchor="start">that the grid is the same on both sides of zero. The scale itself is one FP16 or FP32</text><text class="cap" x="40" y="482" text-anchor="start">number stored beside the group.</text></svg><figcaption>Divide, round, store; multiply to read back. The error is bounded by the step, and the step is set by one number: the group's largest value.</figcaption></figure>
