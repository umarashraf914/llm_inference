<figure><div class='ts'>Fig 75 &nbsp;&middot;&nbsp; 15:40</div><h3>Where the scales live</h3><svg viewBox="0 0 680 348" role="img"><title>Where the scales live</title><text class="hd" x="40" y="46">What a microscaled block actually stores</text><g class="s"><rect x="60" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="90" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="120" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="150" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="180" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="210" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="240" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="270" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="300" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="330" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="360" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="390" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="420" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="450" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="480" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="510" y="70" width="26" height="34" rx="2"></rect></g><g class="m"><rect x="560" y="70" width="70" height="34" rx="2"></rect><text class="sub" x="595.0" y="87.0" text-anchor="middle" dominant-baseline="central">scale</text></g><text class="sub2" x="60" y="128" text-anchor="start">sixteen 4-bit values</text><text class="sub2" x="560" y="128" text-anchor="start">one shared</text><text class="cap" x="40" y="186" text-anchor="start">Each block's scale travels with its block: the format pairs every 16 or 32 codes with</text><text class="cap" x="40" y="206" text-anchor="start">one scale, the matrix-multiply kernel loads a tile of codes together with the tile of</text><text class="cap" x="40" y="226" text-anchor="start">scales that belongs to it, and Blackwell's tensor cores apply the scales as they</text><text class="cap" x="40" y="246" text-anchor="start">multiply. In memory, cuBLAS keeps the scales in an array of their own, laid out tile by</text><text class="cap" x="40" y="266" text-anchor="start">tile to match the codes.</text><text class="cap" x="40" y="306" text-anchor="start">What containment costs is storage: one 8-bit scale per block, half a bit per value for</text><text class="cap" x="40" y="326" text-anchor="start">blocks of 16 and a quarter of a bit for 32 ({{fig:v04-p34}}).</text></svg><figcaption>The scale is part of the block: every 16 or 32 codes mean nothing without the one number that sizes them.</figcaption></figure>
