<figure><div class='ts'>Fig 75 &nbsp;&middot;&nbsp; 15:40</div><h3>Where the scales live</h3><svg viewBox="0 0 680 278" role="img"><title>Where the scales live</title><text class="hd" x="40" y="46">What a microscaled block actually stores</text><g class="s"><rect x="60" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="90" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="120" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="150" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="180" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="210" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="240" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="270" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="300" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="330" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="360" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="390" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="420" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="450" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="480" y="70" width="26" height="34" rx="2"></rect></g><g class="s"><rect x="510" y="70" width="26" height="34" rx="2"></rect></g><g class="m"><rect x="560" y="70" width="70" height="34" rx="2"></rect><text class="sub" x="595.0" y="87.0" text-anchor="middle" dominant-baseline="central">scale</text></g><text class="sub2" x="60" y="128" text-anchor="start">sixteen 4-bit values</text><text class="sub2" x="560" y="128" text-anchor="start">one shared</text><text class="cap" x="40" y="186" text-anchor="start">The values and their scale sit adjacent in memory, so a kernel reading a block gets everything</text><text class="cap" x="40" y="206" text-anchor="start">it needs in one fetch. No lookup elsewhere, no extra round trip.</text><text class="cap" x="40" y="236" text-anchor="start">That locality is what makes the finest granularity practical at all. Per-tensor scales are</text><text class="cap" x="40" y="256" text-anchor="start">cheaper to store but no cheaper to fetch.</text></svg><figcaption>A detail with real performance consequences: containment would be worthless if collecting the scale cost a separate memory access.</figcaption></figure>
