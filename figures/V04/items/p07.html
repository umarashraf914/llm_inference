<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:34</div><h3>How far each eight-bit float reaches</h3><svg viewBox='0 0 680 592' role='img'><title>How far each eight-bit float reaches</title><text class="hd" x="40" y="46">From the smallest step to the largest value, on a log scale</text><text class="cap" x="40" y="89" text-anchor="start">FP16</text><g class="m"><rect x="141.011" y="72" width="120.4" height="24" rx="2"/></g><g class="s"><rect x="261.4232024281705" y="72" width="361.2275104111259" height="24" rx="2"/><text class="sub" x="442.03695763373344" y="84.0" text-anchor="middle" dominant-baseline="central">40.0 powers of two in all</text></g><text class="sub2" x="141.011" y="112" text-anchor="start">5.96 × 10⁻⁸</text><text class="sub2" x="622.651" y="112" text-anchor="end">65,504</text><text class="cap" x="40" y="153" text-anchor="start">E5M2</text><g class="m"><rect x="237.341" y="136" width="24.1" height="24" rx="2"/></g><g class="s"><rect x="261.4232024281705" y="136" width="358.91631691767" height="24" rx="2"/><text class="sub" x="440.8813608870055" y="148.0" text-anchor="middle" dominant-baseline="central">31.8 powers of two in all</text></g><text class="sub2" x="237.341" y="176" text-anchor="start">1.53 × 10⁻⁵</text><text class="sub2" x="620.34" y="176" text-anchor="end">57,344</text><text class="cap" x="40" y="217" text-anchor="start">E4M3</text><g class="m"><rect x="321.629" y="200" width="36.1" height="24" rx="2"/></g><g class="s"><rect x="357.7528010406445" y="200" width="178.29831951928122" height="24" rx="2"/><text class="sub" x="446.9019608002851" y="212.0" text-anchor="middle" dominant-baseline="central">17.8 powers of two in all</text></g><text class="sub2" x="321.629" y="240" text-anchor="start">0.00195</text><text class="sub2" x="536.051" y="240" text-anchor="end">448</text><line class="axis" x1="110.0" y1="270" x2="630.0" y2="270"/><line class="tick" x1="110.0" y1="265" x2="110.0" y2="275"/><text class="sub2" x="110" y="290" text-anchor="middle">10⁻⁸</text><line class="tick" x1="150.0" y1="265" x2="150.0" y2="275"/><line class="tick" x1="190.0" y1="265" x2="190.0" y2="275"/><text class="sub2" x="190" y="290" text-anchor="middle">10⁻⁶</text><line class="tick" x1="230.0" y1="265" x2="230.0" y2="275"/><line class="tick" x1="270.0" y1="265" x2="270.0" y2="275"/><text class="sub2" x="270" y="290" text-anchor="middle">10⁻⁴</text><line class="tick" x1="310.0" y1="265" x2="310.0" y2="275"/><line class="tick" x1="350.0" y1="265" x2="350.0" y2="275"/><text class="sub2" x="350" y="290" text-anchor="middle">10⁻²</text><line class="tick" x1="390.0" y1="265" x2="390.0" y2="275"/><line class="tick" x1="430.0" y1="265" x2="430.0" y2="275"/><text class="sub2" x="430" y="290" text-anchor="middle">1</text><line class="tick" x1="470.0" y1="265" x2="470.0" y2="275"/><line class="tick" x1="510.0" y1="265" x2="510.0" y2="275"/><text class="sub2" x="510" y="290" text-anchor="middle">10²</text><line class="tick" x1="550.0" y1="265" x2="550.0" y2="275"/><line class="tick" x1="590.0" y1="265" x2="590.0" y2="275"/><text class="sub2" x="590" y="290" text-anchor="middle">10⁴</text><line class="tick" x1="630.0" y1="265" x2="630.0" y2="275"/><text class="cap" x="40" y="326" text-anchor="start">The amber stretch at the left of each bar is the subnormal tail of {{fig:v04-p04}}; the</text><text class="cap" x="40" y="346" text-anchor="start">teal is the normal range. E5M2 keeps FP16's five exponent bits, so it reaches almost as</text><text class="cap" x="40" y="366" text-anchor="start">far, to 57,344, with two mantissa bits instead of ten. E4M3 trades an exponent bit for a</text><text class="cap" x="40" y="386" text-anchor="start">mantissa bit and covers 17.8 powers of two instead of 31.8.</text><text class="cap" x="40" y="426" text-anchor="start">E4M3 also bends the rules of {{fig:v04-o014}}. Under them its top exponent code would be</text><text class="cap" x="40" y="446" text-anchor="start">reserved and the largest value would be 240. E4M3 keeps that code for numbers, reserves</text><text class="cap" x="40" y="466" text-anchor="start">only the one pattern S.1111.111 for not-a-number and has no infinity, which lifts its</text><text class="cap" x="40" y="486" text-anchor="start">top to 1.75 × 2⁸ = 448.</text><text class="cap" x="40" y="526" text-anchor="start">That is the bending {{fig:v04-o015}} mentions. Forward-pass weights and activations fit</text><text class="cap" x="40" y="546" text-anchor="start">E4M3's window once a scale slides them into it; gradients spread over far more powers of</text><text class="cap" x="40" y="566" text-anchor="start">two and need E5M2.</text></svg><figcaption>Same eight bits, two answers. E5M2 buys fourteen more powers of two of reach with one mantissa bit: wherever both formats hold normal numbers, its steps are twice as wide.</figcaption></figure>
