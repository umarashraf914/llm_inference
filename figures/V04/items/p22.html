<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 12:02</div><h3>A scale on the summed dimension cannot come out of the sum</h3><svg viewBox='0 0 680 742' role='img'><title>A scale on the summed dimension cannot come out of the sum</title><text class="hd" x="40" y="46">One output, x₁w₁ + x₂w₂ + x₃w₃ + x₄w₄, with integers q for x and r for w</text><text class="sub2" x="40" y="86" text-anchor="start">a scale per token, a</text><g class="s"><rect x="40" y="96" width="330" height="36" rx="8"/><text class="lbl" x="205.0" y="114.0" text-anchor="middle" dominant-baseline="central">Σ (a q) × (b r)   =   a × b × Σ q r</text></g><text class="sub2" x="386" y="119" text-anchor="start">one integer sum, then one float multiply</text><text class="sub2" x="40" y="164" text-anchor="start">a scale per input channel, cⱼ</text><g class="h"><rect x="40" y="174" width="330" height="36" rx="8"/><text class="lbl" x="205.0" y="192.0" text-anchor="middle" dominant-baseline="central">Σ (cⱼ q) × (b r)   =   b × Σ cⱼ × q r</text></g><text class="sub2" x="386" y="197" text-anchor="start">cⱼ changes from term to term: stuck inside</text><text class="sub2" x="40" y="236" text-anchor="start">Written out, the second needs a float multiply in every term before anything is added:</text><g class="h"><rect x="60" y="250" width="110" height="30" rx="3"/><text class="sub" x="115.0" y="265.0" text-anchor="middle" dominant-baseline="central">c₁ q₁ r₁</text></g><text class="sub2" x="185" y="270" text-anchor="middle">+</text><g class="h"><rect x="200" y="250" width="110" height="30" rx="3"/><text class="sub" x="255.0" y="265.0" text-anchor="middle" dominant-baseline="central">c₂ q₂ r₂</text></g><text class="sub2" x="325" y="270" text-anchor="middle">+</text><g class="h"><rect x="340" y="250" width="110" height="30" rx="3"/><text class="sub" x="395.0" y="265.0" text-anchor="middle" dominant-baseline="central">c₃ q₃ r₃</text></g><text class="sub2" x="465" y="270" text-anchor="middle">+</text><g class="h"><rect x="480" y="250" width="110" height="30" rx="3"/><text class="sub" x="535.0" y="265.0" text-anchor="middle" dominant-baseline="central">c₄ q₄ r₄</text></g><text class="hd" x="40" y="316" text-anchor="start">Three ways round it</text><g class="u"><rect x="40" y="334" width="116" height="24" rx="3"/><text class="sub" x="98.0" y="346.0" text-anchor="middle" dominant-baseline="central">LLM.int8()</text></g><text class="sub2" x="170" y="350" text-anchor="start">split the few outlier channels off into a 16-bit multiply; the rest stays INT8</text><g class="m"><rect x="40" y="364" width="116" height="24" rx="3"/><text class="sub" x="98.0" y="376.0" text-anchor="middle" dominant-baseline="central">SmoothQuant</text></g><text class="sub2" x="170" y="380" text-anchor="start">move cⱼ into the weights before quantizing: x w = (x ÷ cⱼ) × (cⱼ w)</text><g class="u"><rect x="40" y="394" width="116" height="24" rx="3"/><text class="sub" x="98.0" y="406.0" text-anchor="middle" dominant-baseline="central">block formats</text></g><text class="sub2" x="170" y="410" text-anchor="start">a scale per 16 or 32 terms of the sum; each block's sum stays integer work</text><text class="cap" x="40" y="456" text-anchor="start">{{fig:v04-p17}} could pull its two scales out of the sum because each is the same for every</text><text class="cap" x="40" y="476" text-anchor="start">term: a belongs to the token, b to the output channel. A scale for each input channel,</text><text class="cap" x="40" y="496" text-anchor="start">cⱼ, belongs to the very index the sum runs over, so it changes from term to term and</text><text class="cap" x="40" y="516" text-anchor="start">cannot be factored out. The tensor core's single integer sum is lost.</text><text class="cap" x="40" y="556" text-anchor="start">That is why the per-channel structure of {{fig:v04-o046}} cannot simply be given per-channel</text><text class="cap" x="40" y="576" text-anchor="start">activation scales. Xiao and colleagues put it plainly: integer matrix-multiply kernels</text><text class="cap" x="40" y="596" text-anchor="start">can apply scales only along the outer dimensions, tokens and output channels, never</text><text class="cap" x="40" y="616" text-anchor="start">along the inner one being summed.</text><text class="cap" x="40" y="656" text-anchor="start">Dettmers and colleagues answered by splitting the outlier channels off; SmoothQuant</text><text class="cap" x="40" y="676" text-anchor="start">moves the scale across the multiply; block formats keep a scale per short stretch of the</text><text class="cap" x="40" y="696" text-anchor="start">sum, and one scale per channel is their limit, blocks of one, with no integer work left</text><text class="cap" x="40" y="716" text-anchor="start">at all.</text></svg><figcaption>The obstacle is arithmetic, not engineering: a factor that changes inside a sum cannot be pulled out of it. Every activation method that follows is a way round this one line.</figcaption></figure>
