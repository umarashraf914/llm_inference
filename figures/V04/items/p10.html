f it)</text><text class="cap" x="40" y="304" text-anchor="start">In the first group the step is 0.0079, so 0.37 is stored as code 47 and read back as</text><text class="cap" x="40" y="324" text-anchor="start">0.3701; the worst error any member can suffer is half a step, 0.39% of a value near 1.</text><text class="cap" x="40" y="344" text-anchor="start">Put one value of 100 in the group and the step becomes 0.787: 0.37 is stored as code 0,</text><text class="cap" x="40" y="364" text-anchor="start">and the worst error on a value near 1 is 39%.</text><text class="cap" x="40" y="404" text-anchor="start">A float's error is a fixed fraction of the value, because its gaps grow with the number.</text><text class="cap" x="40" y="424" text-anchor="start">An integer's is a fixed half-step for every member of the group, set by the largest one.</text><text class="cap" x="40" y="444" text-anchor="start">That is why a shared scale punishes the small values, and why the outlier never pays its</text><text class="cap" x="40" y="464" text-anchor="start">own price.</text></svg><figcaption>Same value, same eight bits, a hundredfold difference in error, decided entirely by a neighbour. Every outlier method later in this atlas is an attempt to stop this.</figcaption></figure>
