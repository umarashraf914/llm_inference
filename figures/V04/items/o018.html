<figure><div class='ts'>Fig 18 &nbsp;&middot;&nbsp; 1:12</div><h3>A complete decode, start to finish</h3><svg viewBox="0 0 680 462" role="img"><title>A complete decode, start to finish</title><text class="hd" x="40" y="46">The 32 bits that FP32 uses for 6.5</text><g class="u"><rect x="40" y="66" width="60" height="38" rx="4"></rect><text class="sub" x="70.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="h"><rect x="106" y="66" width="190" height="38" rx="4"></rect><text class="sub" x="201.0" y="85.0" text-anchor="middle" dominant-baseline="central">10000001</text></g><g class="s"><rect x="302" y="66" width="318" height="38" rx="4"></rect><text class="sub" x="461.0" y="85.0" text-anchor="middle" dominant-baseline="central">10100000000000000000000</text></g><text class="sub2" x="40" y="124" text-anchor="start">sign</text><text class="sub2" x="106" y="124" text-anchor="start">exponent field</text><text class="sub2" x="302" y="124" text-anchor="start">mantissa field</text><text class="sub2" x="480" y="124" text-anchor="start">as hex: 0x40D00000</text><text class="hd" x="40" y="178">Decode it</text><text class="sub2" x="40" y="220" text-anchor="start">exponent field as an integer</text><g class="u"><rect x="340" y="198" width="280" height="40" rx="5"></rect><text class="sub" x="480.0" y="218.0" text-anchor="middle" dominant-baseline="central">10000001 = 129</text></g><line class="conn" x1="480" y1="240" x2="480" y2="246" marker-end="url(#arw)"></line><text class="sub2" x="40" y="272" text-anchor="start">subtract the bias</text><g class="m"><rect x="340" y="250" width="280" height="40" rx="5"></rect><text class="sub" x="480.0" y="270.0" text-anchor="middle" dominant-baseline="central">129 - 127 = 2</text></g><line class="conn" x1="480" y1="292" x2="480" y2="298" marker-end="url(#arw)"></line><text class="sub2" x="40" y="324" text-anchor="start">put the implied 1 back</text><g class="m"><rect x="340" y="302" width="280" height="40" rx="5"></rect><text class="sub" x="480.0" y="322.0" text-anchor="middle" dominant-baseline="central">1.101 = 1.625</text></g><line class="conn" x1="480" y1="344" x2="480" y2="350" marker-end="url(#arw)"></line><text class="sub2" x="40" y="376" text-anchor="start">assemble</text><g class="s"><rect x="340" y="354" width="280" height="40" rx="5"></rect><text class="sub" x="480.0" y="374.0" text-anchor="middle" dominant-baseline="central">+1 x 2^2 x 1.625 = 6.5</text></g><text class="cap" x="40" y="440" text-anchor="start">Every floating-point number in every model you run is decoded by exactly these four steps.</text></svg><figcaption>The bias appears exactly once, as a single subtraction. That is the whole of its role at runtime.</figcaption></figure>
