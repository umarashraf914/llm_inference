<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 1:12</div><h3>A complete decode, start to finish</h3><svg viewBox='0 0 680 500' role='img'><title>A complete decode, start to finish</title><text class="hd" x="40" y="46">The 32 bits that FP32 uses for 6.5</text><g class="u"><rect x="40" y="66" width="60" height="38" rx="4"/><text class="sub" x="70.0" y="85.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="h"><rect x="106" y="66" width="190" height="38" rx="4"/><text class="sub" x="201.0" y="85.0" text-anchor="middle" dominant-baseline="central">10000001</text></g><g class="s"><rect x="302" y="66" width="318" height="38" rx="4"/><text class="sub" x="461.0" y="85.0" text-anchor="middle" dominant-baseline="central">10100000000000000000000</text></g><text class="sub2" x="40" y="124" text-anchor="start">sign</text><text class="sub2" x="106" y="124" text-anchor="start">exponent field</text><text class="sub2" x="302" y="124" text-anchor="start">mantissa field</text><text class="sub2" x="40" y="158" text-anchor="start">In hexadecimal each group of four bits is one digit, 0 to 9 then A to F for 10 to 15:</text><text class="sub2" x="40" y="178" text-anchor="start">0100  0000  1101  0000  …  reads  4  0  D  0  …, so the word is written 0x40D00000.</text><text class="hd" x="40" y="224">Decode it</text><text class="sub2" x="40" y="270" text-anchor="start">exponent field as an integer</text><g class="u"><rect x="340" y="244" width="280" height="40" rx="8"/><text class="lbl" x="480.0" y="264.0" text-anchor="middle" dominant-baseline="central">10000001 = 128 + 1 = 129</text></g><line class="conn" x1="480" y1="286" x2="480" y2="292" marker-end="url(#arw)"/><text class="sub2" x="40" y="322" text-anchor="start">subtract the bias</text><g class="m"><rect x="340" y="296" width="280" height="40" rx="8"/><text class="lbl" x="480.0" y="316.0" text-anchor="middle" dominant-baseline="central">129 − 127 = 2</text></g><line class="conn" x1="480" y1="338" x2="480" y2="344" marker-end="url(#arw)"/><text class="sub2" x="40" y="374" text-anchor="start">put the implied 1 back</text><g class="m"><rect x="340" y="348" width="280" height="40" rx="8"/><text class="lbl" x="480.0" y="368.0" text-anchor="middle" dominant-baseline="central">1.101 = 1 + ½ + ⅛ = 1.625</text></g><line class="conn" x1="480" y1="390" x2="480" y2="396" marker-end="url(#arw)"/><text class="sub2" x="40" y="426" text-anchor="start">assemble</text><g class="s"><rect x="340" y="400" width="280" height="40" rx="8"/><text class="lbl" x="480.0" y="420.0" text-anchor="middle" dominant-baseline="central">+1 × 2² × 1.625 = 6.5</text></g><text class="cap" x="40" y="478" text-anchor="start">Every floating-point number in every model you run is decoded by these four steps.</text></svg><figcaption>The bias appears exactly once, as a single subtraction. That is the whole of its role at runtime.</figcaption></figure>
