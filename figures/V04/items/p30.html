" height="26" rx="3"/><text class="sub" x="131.0" y="279.0" text-anchor="middle" dominant-baseline="central">0.37</text></g><g class="s"><rect x="164" y="266" width="58" height="26" rx="3"/><text class="sub" x="193.0" y="279.0" text-anchor="middle" dominant-baseline="central">11.20</text></g><g class="s"><rect x="226" y="266" width="58" height="26" rx="3"/><text class="sub" x="255.0" y="279.0" text-anchor="middle" dominant-baseline="central">−0.40</text></g><g class="h"><rect x="40" y="296" width="58" height="26" rx="3"/><text class="sub" x="69.0" y="309.0" text-anchor="middle" dominant-baseline="central">0.15</text></g><g class="s"><rect x="102" y="296" width="58" height="26" rx="3"/><text class="sub" x="131.0" y="309.0" text-anchor="middle" dominant-baseline="central">0.15</text></g><g class="s"><rect x="164" y="296" width="58" height="26" rx="3"/><text class="sub" x="193.0" y="309.0" text-anchor="middle" dominant-baseline="central">13.10</text></g><g class="h"><rect x="226" y="296" width="58" height="26" rx="3"/><text class="sub" x="255.0" y="309.0" text-anchor="middle" dominant-baseline="central">0.15</text></g><text class="sub2" x="290" y="253" text-anchor="start">step 0.84</text><text class="sub2" x="290" y="283" text-anchor="start">step 0.77</text><text class="sub2" x="290" y="313" text-anchor="start">step 0.86</text><text class="cap" x="360" y="208" text-anchor="start">One scale per channel, down the columns</text><g class="s"><rect x="360" y="236" width="58" height="26" rx="3"/><text class="sub" x="389.0" y="249.0" text-anchor="middle" dominant-baseline="central">0.40</text></g><g class="s"><rect x="422" y="236" width="58" height="26" rx="3"/><text class="sub" x="451.0" y="249.0" text-anchor="middle" dominant-baseline="central">−0.30</text></g><g class="s"><rect x="484" y="236" width="58" height="26" rx="3"/><text class="sub" x="513.0" y="249.0" text-anchor="middle" dominant-baseline="central">12.34</text></g><g class="s"><rect x="546" y="236" width="58" height="26" rx="3"/><text class="sub" x="575.0" y="249.0" text-anchor="middle" dominant-baseline="central">0.21</text></g><g class="s"><rect x="360" y="266" width="58" height="26" rx="3"/><text class="sub" x="389.0" y="279.0" text-anchor="middle" dominant-baseline="central">−0.20</text></g><g class="s"><rect x="422" y="266" width="58" height="26" rx="3"/><text class="sub" x="451.0" y="279.0" text-anchor="middle" dominant-baseline="central">0.50</text></g><g class="s"><rect x="484" y="266" width="58" height="26" rx="3"/><text class="sub" x="513.0" y="279.0" text-anchor="middle" dominant-baseline="central">11.20</text></g><g class="s"><rect x="546" y="266" width="58" height="26" rx="3"/><text class="sub" x="575.0" y="279.0" text-anchor="middle" dominant-baseline="central">−0.40</text></g><g class="s"><rect x="360" y="296" width="58" height="26" rx="3"/><text class="sub" x="389.0" y="309.0" text-anchor="middle" dominant-baseline="central">0.28</text></g><g class="s"><rect x="422" y="296" width="58" height="26" rx="3"/><text class="sub" x="451.0" y="309.0" text-anchor="middle" dominant-baseline="central">0.13</text></g><g class="s"><rect x="484" y="296" width="58" height="26" rx="3"/><text class="sub" x="513.0" y="309.0" text-anchor="middle" dominant-baseline="central">13.10</text></g><g class="s"><rect x="546" y="296" width="58" height="26" rx="3"/><text class="sub" x="575.0" y="309.0" text-anchor="middle" dominant-baseline="central">0.30</text></g><text class="sub2" x="389" y="340" text-anchor="middle">0.040</text><text class="sub2" x="451" y="340" text-anchor="middle">0.053</text><text class="sub2" x="513" y="340" text-anchor="middle">0.127</text><text class="sub2" x="575" y="340" text-anchor="middle">0.047</text><text class="sub2" x="360" y="358" text-anchor="start">steps, one per channel</text><text class="sub2" x="40" y="388" text-anchor="start">read back; red where off by more than 0.1</text><text class="cap" x="40" y="410" text-anchor="start">rms error, all 12 entries: 0.139</text><text class="cap" x="360" y="410" text-anchor="start">rms error: 0.014, 10 times smaller</text><text class="cap" x="40" y="452" text-anchor="start">Each group gets a 4-bit grid from its own minimum to its maximum, a zero-point as in</text><text class="cap" x="40" y="472" text-anchor="start">{{fig:v04-p09}}, which is how KIVI stores its groups. One scale per token: each row's span</text><text class="cap" x="40" y="492" text-anchor="start">reaches its channel-3 value, so its step is about 0.77 to 0.86, wider than any ordinary</text><text class="cap" x="40" y="512" text-anchor="start">value. The ordinary values collapse onto the bottom two of the 16 codes, and the rms</text><text class="cap" x="40" y="532" text-anchor="start">error over all twelve entries is 0.139.</text><text class="cap" x="40" y="572" text-anchor="start">One scale per channel: channel 3's span is 11.2 to 13.1, a step of 0.13, and each</text><text class="cap" x="40" y="592" text-anchor="start">ordinary channel gets a step of about 0.05. Every entry survives, channel 3 included:</text><text class="cap" x="40" y="612" text-anchor="start">rms error 0.014, 10 times smaller.</text><text class="cap" x="40" y="652" text-anchor="start">KIVI, from Zirui Liu and colleagues, and KVQuant, from Coleman Hooper and colleagues at</text><text class="cap" x="40" y="672" text-anchor="start">Berkeley, both in 2024, landed on this recipe independently: keys per channel; values,</text><text class="cap" x="40" y="692" text-anchor="start">which have no fixed outlier channels, per token. A channel's scale needs that channel's</text><text class="cap" x="40" y="712" text-anchor="start">tokens, so KIVI keeps the newest keys in full precision until a group of them is</text><text class="cap" x="40" y="732" text-anchor="start">complete, then quantizes the group channel by channel.</text></svg><figcaption>The same twelve numbers in the same four bits. Only the direction in which they share a scale changes, and it decides whether the ordinary channels survive.</figcaption></figure>
