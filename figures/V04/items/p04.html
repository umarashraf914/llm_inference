<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 1:12</div><h3>Below the smallest normal number, precision drains away before zero</h3><svg viewBox='0 0 680 526' role='img'><title>Below the smallest normal number, precision drains away before zero</title><text class="hd" x="40" y="46">FP16 near zero, on a log scale: three bands</text><g class="h"><rect x="60" y="96" width="137.6" height="22" rx="3"/></g><g class="m"><rect x="197.597" y="96" width="309.1" height="22" rx="3"/></g><g class="s"><rect x="506.654" y="96" width="113.3" height="22" rx="3"/></g><text class="sub2" x="128.798" y="86" text-anchor="middle">becomes 0</text><text class="sub2" x="352.125" y="86" text-anchor="middle">subnormal: fixed steps</text><text class="sub2" x="563.327" y="86" text-anchor="middle">normal</text><line class="axis" x1="60.0" y1="136" x2="620.0" y2="136"/><line class="tick" x1="60.0" y1="131" x2="60.0" y2="141"/><text class="sub2" x="60" y="156" text-anchor="middle">10⁻⁹</text><line class="tick" x1="153.3" y1="131" x2="153.3" y2="141"/><text class="sub2" x="153.333" y="156" text-anchor="middle">10⁻⁸</text><line class="tick" x1="246.7" y1="131" x2="246.7" y2="141"/><text class="sub2" x="246.667" y="156" text-anchor="middle">10⁻⁷</text><line class="tick" x1="340.0" y1="131" x2="340.0" y2="141"/><text class="sub2" x="340" y="156" text-anchor="middle">10⁻⁶</text><line class="tick" x1="433.3" y1="131" x2="433.3" y2="141"/><text class="sub2" x="433.333" y="156" text-anchor="middle">10⁻⁵</text><line class="tick" x1="526.7" y1="131" x2="526.7" y2="141"/><text class="sub2" x="526.667" y="156" text-anchor="middle">10⁻⁴</text><line class="tick" x1="620.0" y1="131" x2="620.0" y2="141"/><text class="sub2" x="620" y="156" text-anchor="middle">10⁻³</text><text class="sub2" x="197.597" y="174" text-anchor="middle">3.0 × 10⁻⁸</text><text class="sub2" x="506.654" y="174" text-anchor="middle">6.1 × 10⁻⁵</text><circle cx="477.9" cy="136.0" r="3.5" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><circle cx="340.0" cy="136.0" r="3.5" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><circle cx="246.7" cy="136.0" r="3.5" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><circle cx="196.5" cy="136.0" r="3.5" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2" x="40" y="218" text-anchor="start">value</text><text class="sub2" x="200" y="218" text-anchor="start">FP16 stores</text><text class="sub2" x="360" y="218" text-anchor="start">error</text><text class="sub2" x="520" y="218" text-anchor="start">steps of 6 × 10⁻⁸</text><text class="cap" x="40" y="242" text-anchor="start">3.0 × 10⁻⁵</text><text class="sub2" x="200" y="242" text-anchor="start">2.998 × 10⁻⁵</text><text class="sub2" x="360" y="242" text-anchor="start">0.06%</text><text class="sub2" x="520" y="242" text-anchor="start">503.32 → 503</text><text class="cap" x="40" y="264" text-anchor="start">1.0 × 10⁻⁶</text><text class="sub2" x="200" y="264" text-anchor="start">1.013 × 10⁻⁶</text><text class="sub2" x="360" y="264" text-anchor="start">1.3%</text><text class="sub2" x="520" y="264" text-anchor="start">16.78 → 17</text><text class="cap" x="40" y="286" text-anchor="start">1.0 × 10⁻⁷</text><text class="sub2" x="200" y="286" text-anchor="start">1.192 × 10⁻⁷</text><text class="sub2" x="360" y="286" text-anchor="start">19.2%</text><text class="sub2" x="520" y="286" text-anchor="start">1.68 → 2</text><text class="cap" x="40" y="308" text-anchor="start">2.9 × 10⁻⁸</text><text class="sub2" x="200" y="308" text-anchor="start">0</text><text class="sub2" x="360" y="308" text-anchor="start">all of it</text><text class="sub2" x="520" y="308" text-anchor="start">0.49 → 0</text><text class="cap" x="40" y="360" text-anchor="start">Exponent code 0 is the special one ({{fig:v04-o014}}). It turns the implied 1 into a 0 and</text><text class="cap" x="40" y="380" text-anchor="start">holds the exponent at −14, so the values are 0.mantissa × 2⁻¹⁴: every whole multiple of</text><text class="cap" x="40" y="400" text-anchor="start">2⁻²⁴, about 5.96 × 10⁻⁸, up to the smallest normal number, 6.10 × 10⁻⁵.</text><text class="cap" x="40" y="440" text-anchor="start">Those steps stop shrinking. A value near 6 × 10⁻⁵ still has about a thousand steps</text><text class="cap" x="40" y="460" text-anchor="start">beneath it; one near 10⁻⁷ has fewer than two, so its error is a fifth of its size. Below</text><text class="cap" x="40" y="480" text-anchor="start">half a step, 2⁻²⁵ ≈ 3.0 × 10⁻⁸, a value rounds to exactly zero. These are the subnormal</text><text class="cap" x="40" y="500" text-anchor="start">numbers, and they make underflow gradual rather than sudden.</text></svg><figcaption>The window usually quoted for FP16 starts at 6 × 10⁻⁵, but exact zero arrives 2,048 times lower. In between, a value survives with fewer and fewer of its bits.</figcaption></figure>
