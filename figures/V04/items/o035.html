<figure><div class='ts'>Fig 35 &nbsp;&middot;&nbsp; 3:48</div><h3>Why one outlier ruins a shared scale</h3><svg viewBox="0 0 680 388" role="img"><title>Why one outlier ruins a shared scale</title><text class="hd" x="40" y="46">One outlier in the group</text><g class="s"><rect x="50" y="96" width="16" height="22" rx="2"></rect></g><g class="s"><rect x="72" y="96" width="16" height="22" rx="2"></rect></g><g class="s"><rect x="94" y="96" width="16" height="22" rx="2"></rect></g><g class="s"><rect x="116" y="96" width="16" height="22" rx="2"></rect></g><g class="s"><rect x="138" y="96" width="16" height="22" rx="2"></rect></g><g class="s"><rect x="160" y="96" width="16" height="22" rx="2"></rect></g><g class="s"><rect x="182" y="96" width="16" height="22" rx="2"></rect></g><g class="h"><rect x="560" y="84" width="16" height="34" rx="2"></rect></g><text class="sub2" x="496" y="138" text-anchor="start">100x hotter</text><text class="hd" x="40" y="178">and the scale must stretch to reach it</text><line class="axis" x1="50" y1="220" x2="630" y2="220"></line><line class="tick" x1="50.0" y1="212" x2="50.0" y2="228"></line><line class="tick" x1="122.5" y1="212" x2="122.5" y2="228"></line><line class="tick" x1="195.0" y1="212" x2="195.0" y2="228"></line><line class="tick" x1="267.5" y1="212" x2="267.5" y2="228"></line><line class="tick" x1="340.0" y1="212" x2="340.0" y2="228"></line><line class="tick" x1="412.5" y1="212" x2="412.5" y2="228"></line><line class="tick" x1="485.0" y1="212" x2="485.0" y2="228"></line><line class="tick" x1="557.5" y1="212" x2="557.5" y2="228"></line><line class="tick" x1="630.0" y1="212" x2="630.0" y2="228"></line><g class="h"><rect x="50" y="238" width="72" height="16" rx="2"></rect></g><text class="sub2" x="130" y="250" text-anchor="start">every ordinary value now lands in here</text><text class="cap" x="40" y="296" text-anchor="start">The scale is set by the largest value, so a channel running a hundred times hotter stretches</text><text class="cap" x="40" y="316" text-anchor="start">it wide and everything normal collapses into the bottom few steps.</text><text class="cap" x="40" y="346" text-anchor="start">In numbers: with an INT8 scale sized to a 100x outlier, ordinary values only ever reach tick</text><text class="cap" x="40" y="366" text-anchor="start">1 or 2 out of 127. Of the eight bits you paid for, roughly 1.3 are describing your data.</text></svg><figcaption>Not a subtle statistical effect. The damage is arithmetic and it is severe: six of eight bits spent representing a range almost nothing occupies.</figcaption></figure>
