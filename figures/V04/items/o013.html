<figure><div class='ts'>Fig 13 &nbsp;&middot;&nbsp; 1:12</div><h3>Why bias and not two's complement</h3><svg viewBox="0 0 680 512" role="img"><title>Why bias and not two's complement</title><text class="hd" x="40" y="46">With bias: comparing the words as plain integers works</text><text class="sub2" x="40" y="84" text-anchor="start">0.5</text><g class="u"><rect x="110" y="66" width="40" height="30" rx="3"></rect><text class="sub" x="130.0" y="81.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="h"><rect x="154" y="66" width="130" height="30" rx="3"></rect><text class="sub" x="219.0" y="81.0" text-anchor="middle" dominant-baseline="central">01110</text></g><g class="s"><rect x="288" y="66" width="200" height="30" rx="3"></rect><text class="sub" x="388.0" y="81.0" text-anchor="middle" dominant-baseline="central">0000000000</text></g><text class="sub2" x="506" y="86" text-anchor="start">word = 14,336</text><text class="sub2" x="40" y="128" text-anchor="start">2.0</text><g class="u"><rect x="110" y="110" width="40" height="30" rx="3"></rect><text class="sub" x="130.0" y="125.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="h"><rect x="154" y="110" width="130" height="30" rx="3"></rect><text class="sub" x="219.0" y="125.0" text-anchor="middle" dominant-baseline="central">10000</text></g><g class="s"><rect x="288" y="110" width="200" height="30" rx="3"></rect><text class="sub" x="388.0" y="125.0" text-anchor="middle" dominant-baseline="central">0000000000</text></g><text class="sub2" x="506" y="130" text-anchor="start">word = 16,384</text><text class="sub2" x="110" y="168" text-anchor="start">14,336 is less than 16,384, and 0.5 is less than 2.0. Correct.</text><text class="hd" x="40" y="226">With two's complement: it breaks</text><text class="sub2" x="40" y="264" text-anchor="start">0.5</text><g class="u"><rect x="110" y="246" width="40" height="30" rx="3"></rect><text class="sub" x="130.0" y="261.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="h"><rect x="154" y="246" width="130" height="30" rx="3"></rect><text class="sub" x="219.0" y="261.0" text-anchor="middle" dominant-baseline="central">11111</text></g><g class="s"><rect x="288" y="246" width="200" height="30" rx="3"></rect><text class="sub" x="388.0" y="261.0" text-anchor="middle" dominant-baseline="central">0000000000</text></g><text class="sub2" x="506" y="266" text-anchor="start">word = 31,744</text><text class="sub2" x="40" y="308" text-anchor="start">2.0</text><g class="u"><rect x="110" y="290" width="40" height="30" rx="3"></rect><text class="sub" x="130.0" y="305.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="h"><rect x="154" y="290" width="130" height="30" rx="3"></rect><text class="sub" x="219.0" y="305.0" text-anchor="middle" dominant-baseline="central">00001</text></g><g class="s"><rect x="288" y="290" width="200" height="30" rx="3"></rect><text class="sub" x="388.0" y="305.0" text-anchor="middle" dominant-baseline="central">0000000000</text></g><text class="sub2" x="506" y="310" text-anchor="start">word = 1,024</text><text class="sub2" x="110" y="348" text-anchor="start">31,744 is greater than 1,024, but 0.5 is not greater than 2.0. Wrong.</text><text class="cap" x="40" y="400" text-anchor="start">Two's complement puts a 1 in the top bit for negative numbers, so a small float ends up</text><text class="cap" x="40" y="420" text-anchor="start">looking like an enormous integer.</text><text class="cap" x="40" y="450" text-anchor="start">Bias keeps small exponents as small numbers, so the bit pattern of a positive float sorts in</text><text class="cap" x="40" y="470" text-anchor="start">exactly the same order as its value. Comparison, sorting, min and max all become integer</text><text class="cap" x="40" y="490" text-anchor="start">operations, and that is free in hardware.</text></svg><figcaption>This is the real reason the scheme exists. Both encodings can represent negative exponents; only one of them keeps floats sortable as integers.</figcaption></figure>
