<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:10</div><h3>The number that decides everything</h3><svg viewBox='0 0 680 400' role='img'><title>The number that decides everything</title><g class="m"><rect x="120" y="52" width="440" height="42" rx="6"/><text class="sub" x="340.0" y="73.0" text-anchor="middle" dominant-baseline="central">arithmetic intensity  =  operations performed ÷ bytes moved</text></g><text class="cap" x="40" y="128" text-anchor="start">One number decides whether a workload waits on maths or on memory. Decode at 16 bits</text><text class="cap" x="40" y="148" text-anchor="start">does two operations per weight and moves two bytes per weight, so about one operation</text><text class="cap" x="40" y="168" text-anchor="start">for every byte it moves ({{fig:v01-o116}}). An H100 needs about 295 before its arithmetic</text><text class="cap" x="40" y="188" text-anchor="start">units become the limit ({{fig:v01-o126}}).</text><line class="axis" x1="80" y1="274" x2="600" y2="274"/><line class="tick" x1="80.0" y1="269" x2="80.0" y2="279"/><text class="sub2" x="80" y="296" text-anchor="middle">0.1</text><line class="tick" x1="210.0" y1="269" x2="210.0" y2="279"/><text class="sub2" x="210" y="296" text-anchor="middle">1</text><line class="tick" x1="340.0" y1="269" x2="340.0" y2="279"/><text class="sub2" x="340" y="296" text-anchor="middle">10</text><line class="tick" x1="470.0" y1="269" x2="470.0" y2="279"/><text class="sub2" x="470" y="296" text-anchor="middle">100</text><line class="tick" x1="600.0" y1="269" x2="600.0" y2="279"/><text class="sub2" x="600" y="296" text-anchor="middle">1,000</text><text class="sub2" x="340" y="316" text-anchor="middle">operations per byte, on a log scale: each step is ten times the last</text><circle cx="210.0" cy="274.0" r="5" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><circle cx="531.1" cy="274.0" r="5" fill="var(--paper)" stroke="var(--s)" stroke-width="1.5"/><text class="sub2" x="210" y="258" text-anchor="middle">decode, about 1</text><text class="sub2" x="531.148" y="258" text-anchor="middle">H100 ridge, 295</text><line class="tick" x1="210.0" y1="230" x2="531.1482288957241" y2="230"/><line class="tick" x1="210.0" y1="230" x2="210.0" y2="236"/><line class="tick" x1="531.1482288957241" y1="230" x2="531.1482288957241" y2="236"/><text class="sub2" x="370.574" y="222" text-anchor="middle">a factor of about 295</text><text class="cap" x="40" y="358" text-anchor="start">A gap of about 295 times. Closing it is what the whole series is about, and there are</text><text class="cap" x="40" y="378" text-anchor="start">only two ways: do more operations per byte, or move fewer bytes per operation.</text></svg><figcaption>Arithmetic intensity is the ratio to keep in your head for the rest of this document. Quantization is an attack on its denominator.</figcaption></figure>
