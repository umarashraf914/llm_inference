<figure><div class='ts'>Fig 02 &nbsp;&middot;&nbsp; 0:10</div><h3>The number that decides everything</h3><svg viewBox="0 0 680 352" role="img"><title>The number that decides everything</title><g class="m"><rect x="120" y="52" width="440" height="42" rx="6"></rect><text class="sub" x="340.0" y="73.0" text-anchor="middle" dominant-baseline="central">arithmetic intensity  =  operations performed / bytes moved</text></g><text class="cap" x="40" y="128" text-anchor="start">One number decides whether a workload waits on maths or on memory. Decode does about two</text><text class="cap" x="40" y="148" text-anchor="start">operations for every byte it moves. An H100 needs roughly 300 before its arithmetic units</text><text class="cap" x="40" y="168" text-anchor="start">become the limit.</text><text class="cap" x="40" y="208" text-anchor="start">Two operations per byte</text><g class="h"><rect x="300" y="192" width="4" height="26" rx="1"></rect></g><text class="sub2" x="316" y="211" text-anchor="start">where decode sits</text><text class="cap" x="40" y="258" text-anchor="start">Three hundred per byte</text><g class="s"><rect x="300" y="242" width="300" height="26" rx="3"></rect></g><text class="cap" x="40" y="310" text-anchor="start">A gap of about 150x. Closing it is what the whole series is about, and there are only two ways:</text><text class="cap" x="40" y="330" text-anchor="start">do more operations per byte, or move fewer bytes per operation.</text></svg><figcaption>Arithmetic intensity is the ratio to keep in your head for the rest of this document. Quantization is an attack on its denominator.</figcaption></figure>
