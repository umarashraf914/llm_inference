<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 1:24</div><h3>A tie goes to the even neighbour, so rounding has no lean</h3><svg viewBox='0 0 680 414' role='img'><title>A tie goes to the even neighbour, so rounding has no lean</title><text class="hd" x="40" y="46">E5M2 between 4 and 8: four values, and four exact ties between them</text><line class="axis" x1="110.0" y1="128" x2="590.0" y2="128"/><line class="tick" x1="110.0" y1="119" x2="110.0" y2="137"/><text class="sub2" x="110" y="110" text-anchor="middle">4</text><text class="sub2" x="110" y="154" text-anchor="middle">mantissa 00</text><line class="tick" x1="230.0" y1="119" x2="230.0" y2="137"/><text class="sub2" x="230" y="110" text-anchor="middle">5</text><text class="sub2" x="230" y="154" text-anchor="middle">mantissa 01</text><line class="tick" x1="350.0" y1="119" x2="350.0" y2="137"/><text class="sub2" x="350" y="110" text-anchor="middle">6</text><text class="sub2" x="350" y="154" text-anchor="middle">mantissa 10</text><line class="tick" x1="470.0" y1="119" x2="470.0" y2="137"/><text class="sub2" x="470" y="110" text-anchor="middle">7</text><text class="sub2" x="470" y="154" text-anchor="middle">mantissa 11</text><line class="tick" x1="590.0" y1="119" x2="590.0" y2="137"/><text class="sub2" x="590" y="110" text-anchor="middle">8</text><text class="sub2" x="590" y="154" text-anchor="middle">mantissa 00</text><text class="cap" x="40" y="132" text-anchor="start">values</text><circle cx="170.0" cy="128.0" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><line class="conn" x1="170.0" y1="180" x2="116.0" y2="180" marker-end="url(#arw)"/><text class="sub2" x="170" y="202" text-anchor="middle">4.5 → 4</text><circle cx="290.0" cy="128.0" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><line class="conn" x1="290.0" y1="180" x2="344.0" y2="180" marker-end="url(#arw)"/><text class="sub2" x="290" y="202" text-anchor="middle">5.5 → 6</text><circle cx="410.0" cy="128.0" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><line class="conn" x1="410.0" y1="180" x2="356.0" y2="180" marker-end="url(#arw)"/><text class="sub2" x="410" y="202" text-anchor="middle">6.5 → 6</text><circle cx="530.0" cy="128.0" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><line class="conn" x1="530.0" y1="180" x2="584.0" y2="180" marker-end="url(#arw)"/><text class="sub2" x="530" y="202" text-anchor="middle">7.5 → 8</text><text class="cap" x="40" y="184" text-anchor="start">ties</text><text class="cap" x="40" y="248" text-anchor="start">Round to nearest leaves one case open: a value exactly halfway between two neighbours.</text><text class="cap" x="40" y="268" text-anchor="start">The rule every IEEE format uses is to pick the neighbour whose last mantissa bit is 0,</text><text class="cap" x="40" y="288" text-anchor="start">the even one. So 6.5 goes down to 6 (mantissa 10) rather than up to 7 (mantissa 11),</text><text class="cap" x="40" y="308" text-anchor="start">while 5.5 goes up to 6.</text><text class="cap" x="40" y="348" text-anchor="start">Across the four ties the errors are −½, +½, −½ and +½, which average to zero. Always</text><text class="cap" x="40" y="368" text-anchor="start">rounding halves up would add +½ every time, and over millions of roundings that lean</text><text class="cap" x="40" y="388" text-anchor="start">would build into a steady drift.</text></svg><figcaption>Rounding errors average to zero by design, not by luck. The argument for why a rounded network survives, a few figures on, leans on exactly this.</figcaption></figure>
