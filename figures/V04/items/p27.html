<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:22</div><h3>A Hadamard matrix is a rotation built from plus and minus ones</h3><svg viewBox='0 0 680 844' role='img'><title>A Hadamard matrix is a rotation built from plus and minus ones</title><text class="hd" x="40" y="30">Built by doubling: H₂ₙ is Hₙ four times over, with the bottom-right copy's signs flipped</text><text class="sub2" x="57" y="72" text-anchor="middle">H₁</text><g class="s"><rect x="40" y="84" width="34" height="26" rx="3"/><text class="sub" x="57.0" y="97.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="146" y="72" text-anchor="middle">H₂</text><g class="s"><rect x="110" y="84" width="34" height="26" rx="3"/><text class="sub" x="127.0" y="97.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="148" y="84" width="34" height="26" rx="3"/><text class="sub" x="165.0" y="97.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="110" y="114" width="34" height="26" rx="3"/><text class="sub" x="127.0" y="127.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="148" y="114" width="34" height="26" rx="3"/><text class="sub" x="165.0" y="127.0" text-anchor="middle" dominant-baseline="central">−1</text></g><g class="s"><rect x="230" y="84" width="34" height="26" rx="3"/><text class="sub" x="247.0" y="97.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="268" y="84" width="34" height="26" rx="3"/><text class="sub" x="285.0" y="97.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="306" y="84" width="34" height="26" rx="3"/><text class="sub" x="323.0" y="97.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="344" y="84" width="34" height="26" rx="3"/><text class="sub" x="361.0" y="97.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="230" y="114" width="34" height="26" rx="3"/><text class="sub" x="247.0" y="127.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="268" y="114" width="34" height="26" rx="3"/><text class="sub" x="285.0" y="127.0" text-anchor="middle" dominant-baseline="central">−1</text></g><g class="s"><rect x="306" y="114" width="34" height="26" rx="3"/><text class="sub" x="323.0" y="127.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="344" y="114" width="34" height="26" rx="3"/><text class="sub" x="361.0" y="127.0" text-anchor="middle" dominant-baseline="central">−1</text></g><g class="s"><rect x="230" y="144" width="34" height="26" rx="3"/><text class="sub" x="247.0" y="157.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="268" y="144" width="34" height="26" rx="3"/><text class="sub" x="285.0" y="157.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="306" y="144" width="34" height="26" rx="3"/><text class="sub" x="323.0" y="157.0" text-anchor="middle" dominant-baseline="central">−1</text></g><g class="u"><rect x="344" y="144" width="34" height="26" rx="3"/><text class="sub" x="361.0" y="157.0" text-anchor="middle" dominant-baseline="central">−1</text></g><g class="s"><rect x="230" y="174" width="34" height="26" rx="3"/><text class="sub" x="247.0" y="187.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="268" y="174" width="34" height="26" rx="3"/><text class="sub" x="285.0" y="187.0" text-anchor="middle" dominant-baseline="central">−1</text></g><g class="u"><rect x="306" y="174" width="34" height="26" rx="3"/><text class="sub" x="323.0" y="187.0" text-anchor="middle" dominant-baseline="central">−1</text></g><g class="s"><rect x="344" y="174" width="34" height="26" rx="3"/><text class="sub" x="361.0" y="187.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="266" y="72" text-anchor="middle">H₂</text><text class="sub2" x="342" y="72" text-anchor="middle">H₂</text><text class="sub2" x="266" y="216" text-anchor="middle">H₂</text><text class="sub2" x="342" y="216" text-anchor="middle">−H₂</text><rect x="301" y="139" width="82" height="66" rx="6" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="400" y="72" text-anchor="start">½ H₄ × (1, −1, 1, 20), row by row</text><text class="cap" x="400" y="101" text-anchor="start">(1 − 1 + 1 + 20) ÷ 2  =  10.5</text><text class="cap" x="400" y="131" text-anchor="start">(1 + 1 + 1 − 20) ÷ 2  =  −8.5</text><text class="cap" x="400" y="161" text-anchor="start">(1 − 1 − 1 − 20) ÷ 2  =  −10.5</text><text class="cap" x="400" y="191" text-anchor="start">(1 + 1 − 1 + 20) ÷ 2  =  10.5</text><text class="sub2" x="40" y="252" text-anchor="start">Before and after, both to the same scale</text><line class="axis" x1="52.0" y1="326" x2="192.0" y2="326"/><g class="s"><rect x="60" y="323" width="22.0" height="3" rx="1"/></g><g class="s"><rect x="94" y="326" width="22.0" height="3" rx="1"/></g><g class="s"><rect x="128" y="323" width="22.0" height="3" rx="1"/></g><g class="h"><rect x="162" y="266" width="22.0" height="60" rx="1"/></g><text class="sub2" x="230" y="320" text-anchor="start">before: (1, −1, 1, 20)</text><text class="sub2" x="230" y="336" text-anchor="start">largest 20; length √403 = 20.07</text><line class="axis" x1="52.0" y1="386.5" x2="192.0" y2="386.5"/><g class="m"><rect x="60" y="355" width="22.0" height="31.5" rx="1"/></g><g class="m"><rect x="94" y="386.5" width="22.0" height="25.5" rx="1"/></g><g class="m"><rect x="128" y="386.5" width="22.0" height="31.5" rx="1"/></g><g class="m"><rect x="162" y="355" width="22.0" height="31.5" rx="1"/></g><text class="sub2" x="230" y="380.5" text-anchor="start">after: (10.5, −8.5, −10.5, 10.5)</text><text class="sub2" x="230" y="396.5" text-anchor="start">largest 10.5; length √403 = 20.07</text><text class="cap" x="40" y="458.0" text-anchor="start">H₂ is a 2 × 2 pattern of signs, and the doubling rule builds the next size from the</text><text class="cap" x="40" y="478.0" text-anchor="start">last: copy it four times and flip the signs of the bottom-right copy. Twelve doublings</text><text class="cap" x="40" y="498.0" text-anchor="start">reach 4,096 = 2¹², a typical model width.</text><text class="cap" x="40" y="538.0" text-anchor="start">Any two different rows agree in exactly half their places and disagree in the other</text><text class="cap" x="40" y="558.0" text-anchor="start">half, so their dot product is 0, while each row dotted with itself gives n, its number</text><text class="cap" x="40" y="578.0" text-anchor="start">of entries. Divide by √n and every row has length 1, at right angles to every other: by</text><text class="cap" x="40" y="598.0" text-anchor="start">{{fig:v04-p26}} the matrix is orthogonal. The doubling keeps this true. Two top rows (r, r)</text><text class="cap" x="40" y="618.0" text-anchor="start">and (r′, r′) give 2 r · r′, which is 0 when r and r′ differ, and a top row against a</text><text class="cap" x="40" y="638.0" text-anchor="start">bottom row gives r · r′ − r · r′ = 0.</text><text class="cap" x="40" y="678.0" text-anchor="start">Each entry of the result adds or subtracts every value once, then divides by √n. An</text><text class="cap" x="40" y="698.0" text-anchor="start">outlier A alone therefore lands as plus or minus A ÷ √n in every channel: 20 ÷ 2 = 10</text><text class="cap" x="40" y="718.0" text-anchor="start">here, give or take the small values, and at 4,096 channels an outlier of 100 becomes</text><text class="cap" x="40" y="738.0" text-anchor="start">±100 ÷ 64 = ±1.56 in each. The length stays √403 = 20.07, and the largest value falls</text><text class="cap" x="40" y="758.0" text-anchor="start">from 20 to 10.5.</text><text class="cap" x="40" y="798.0" text-anchor="start">Strictly, H₂ ÷ √2 is {{fig:v04-p26}}'s 45° turn applied after flipping the sign of the second</text><text class="cap" x="40" y="818.0" text-anchor="start">value. A sign flip keeps lengths and dot products too, so the papers call it a rotation.</text></svg><figcaption>Plus and minus ones, arranged so that every row is at right angles to every other: a rotation that needs no multiplications.</figcaption></figure>
