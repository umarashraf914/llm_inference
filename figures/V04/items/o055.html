4}}), 320</text><text class="cap" x="40" y="430" text-anchor="start">KB per token of context for this 70-billion-parameter model ({{fig:v04-o069}}), and that</text><text class="cap" x="40" y="450" text-anchor="start">traffic is not shared.</text><text class="cap" x="40" y="490" text-anchor="start">At 4,096 tokens that is 1.3 GB per sequence, and each cached byte feeds only about 8</text><text class="cap" x="40" y="510" text-anchor="start">operations, because the model's 64 query heads share 8 key-value heads. As the batch</text><text class="cap" x="40" y="530" text-anchor="start">grows the cache comes to dominate the bytes, and intensity levels off near 112: below</text><text class="cap" x="40" y="550" text-anchor="start">the ridge however large the batch, and whatever format the weights are in. Storing the</text><text class="cap" x="40" y="570" text-anchor="start">cache in 4 bits lifts the ceiling to 449.</text><text class="cap" x="40" y="610" text-anchor="start">W8 A8 moves the ridge itself, by raising the ceiling ({{fig:v04-p16}}).</text></svg><figcaption>Quantizing the weights brings the ridge within reach only while the weights dominate the bytes. At long context the cache sets the limit, which is why the cache gets quantized too.</figcaption></figure>
