<figure><div class='ts'>Fig 55 &nbsp;&middot;&nbsp; 9:35</div><h3>How far quantization moves decode</h3><svg viewBox="0 0 680 398" role="img"><title>How far quantization moves decode</title><g class="m"><rect x="60" y="46" width="560" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">decode intensity  =  2 x parameters x batch / (parameters x bytes per weight)  =  2B / bytes</text></g><text class="cap" x="40" y="140" text-anchor="start">FP16, 2 bytes</text><g class="s"><rect x="220" y="122" width="60.0" height="34" rx="3"></rect><text class="sub" x="250.0" y="139.0" text-anchor="middle" dominant-baseline="central">I = 1B</text></g><text class="sub2" x="500" y="140" text-anchor="start">reaches the ridge at batch 295</text><text class="cap" x="40" y="192" text-anchor="start">INT8, 1 byte</text><g class="s"><rect x="220" y="174" width="120.0" height="34" rx="3"></rect><text class="sub" x="280.0" y="191.0" text-anchor="middle" dominant-baseline="central">I = 2B</text></g><text class="sub2" x="500" y="192" text-anchor="start">reaches the ridge at batch 148</text><text class="cap" x="40" y="244" text-anchor="start">INT4, 0.5 bytes</text><g class="s"><rect x="220" y="226" width="240.0" height="34" rx="3"></rect><text class="sub" x="340.0" y="243.0" text-anchor="middle" dominant-baseline="central">I = 4B</text></g><text class="sub2" x="500" y="244" text-anchor="start">reaches the ridge at batch 74</text><text class="cap" x="40" y="306" text-anchor="start">Weights are read once per step and shared across the whole batch, so intensity scales with</text><text class="cap" x="40" y="326" text-anchor="start">batch size. Quantizing multiplies it again.</text><text class="cap" x="40" y="356" text-anchor="start">At FP16 you need a batch of about 295 to become compute bound. At INT4, about 74. Quantization</text><text class="cap" x="40" y="376" text-anchor="start">does not just move you toward the ridge; it moves the ridge within reach.</text></svg><figcaption>Two operations per parameter per sequence, against one read of each parameter shared by everyone. The whole batching story in one ratio.</figcaption></figure>
