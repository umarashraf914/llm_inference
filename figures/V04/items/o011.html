<figure><div class='ts'>Fig 11 &nbsp;&middot;&nbsp; 1:12</div><h3>The bias is a shift, nothing more</h3><svg viewBox="0 0 680 402" role="img"><title>The bias is a shift, nothing more</title><g class="m"><rect x="60" y="46" width="250" height="42" rx="6"></rect><text class="sub" x="185.0" y="67.0" text-anchor="middle" dominant-baseline="central">stored  =  actual  +  bias</text></g><g class="s"><rect x="360" y="46" width="260" height="42" rx="6"></rect><text class="sub" x="490.0" y="67.0" text-anchor="middle" dominant-baseline="central">actual  =  stored  -  bias</text></g><text class="hd" x="40" y="132">Actual exponent</text><line class="axis" x1="200" y1="152" x2="620" y2="152"></line><line class="tick" x1="200" y1="144" x2="200" y2="160"></line><text class="sub2" x="200" y="178" text-anchor="middle">-126</text><line class="tick" x1="410.0" y1="144" x2="410.0" y2="160"></line><text class="sub2 halo" x="410.0" y="178" text-anchor="middle">0</text><line class="tick" x1="620" y1="144" x2="620" y2="160"></line><text class="sub2" x="620" y="178" text-anchor="middle">+127</text><text class="hd" x="40" y="232">Stored field</text><line class="axis" x1="200" y1="252" x2="620" y2="252"></line><line class="tick" x1="200" y1="244" x2="200" y2="260"></line><text class="sub2" x="200" y="278" text-anchor="middle">1</text><line class="tick" x1="410.0" y1="244" x2="410.0" y2="260"></line><text class="sub2" x="410.0" y="278" text-anchor="middle">127</text><line class="tick" x1="620" y1="244" x2="620" y2="260"></line><text class="sub2" x="620" y="278" text-anchor="middle">254</text><line class="mark" x1="200" y1="188" x2="200" y2="234"></line><line class="mark" x1="410.0" y1="162" x2="410.0" y2="242"></line><line class="mark" x1="620" y1="188" x2="620" y2="234"></line><text class="cap" x="40" y="330" text-anchor="start">The same line, slid to the right by 127. Nothing about the spacing or the ordering changes;</text><text class="cap" x="40" y="350" text-anchor="start">the origin simply moves so that the whole range sits above zero.</text><text class="cap" x="40" y="380" text-anchor="start">Zero exponent, meaning values between 1 and 2, is stored as 127: dead centre.</text></svg><figcaption>One addition on the way in, one subtraction on the way out. The hardware pays essentially nothing for it, which is the first reason this scheme won.</figcaption></figure>
