<figure><div class='ts'>Fig 24 &nbsp;&middot;&nbsp; 1:42</div><h3>Weights crowd near zero, and so do the ticks</h3><svg viewBox="0 0 680 288" role="img"><title>Weights crowd near zero, and so do the ticks</title><line class="axis" x1="50" y1="150" x2="630" y2="150"></line><g class="s"><rect x="300" y="130" width="12" height="20" rx="1"></rect></g><g class="s"><rect x="320" y="105" width="12" height="45" rx="1"></rect></g><g class="s"><rect x="338" y="72" width="12" height="78" rx="1"></rect></g><g class="s"><rect x="352" y="55" width="12" height="95" rx="1"></rect></g><g class="s"><rect x="366" y="72" width="12" height="78" rx="1"></rect></g><g class="s"><rect x="384" y="105" width="12" height="45" rx="1"></rect></g><g class="s"><rect x="404" y="130" width="12" height="20" rx="1"></rect></g><text class="sub2" x="346" y="178" text-anchor="middle">0</text><text class="cap" x="40" y="218" text-anchor="start">A trained network's weights crowd around zero, exactly where a float's ticks are densest.</text><text class="cap" x="40" y="246" text-anchor="start">The format and the data agree about where precision is worth spending, which is why weights</text><text class="cap" x="40" y="266" text-anchor="start">survive being squeezed into very small formats.</text></svg><figcaption>A genuinely fortunate coincidence, and the foundation of everything that works in this field.</figcaption></figure>
