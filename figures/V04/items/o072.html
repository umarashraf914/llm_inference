<figure><div class='ts'>Fig 72 &nbsp;&middot;&nbsp; 14:39</div><h3>The architectural alternative</h3><svg viewBox="0 0 680 396" role="img"><title>The architectural alternative</title><g class="u"><rect x="40" y="58" width="285" height="74" rx="8"></rect><text class="lbl" x="182.5" y="86.0" text-anchor="middle" dominant-baseline="central">Quantize the cache</text><text class="sub" x="182.5" y="104.0" text-anchor="middle" dominant-baseline="central">shrink every number in it</text></g><g class="s"><rect x="368" y="58" width="272" height="74" rx="8"></rect><text class="lbl" x="504.0" y="86.0" text-anchor="middle" dominant-baseline="central">MLA</text><text class="sub" x="504.0" y="104.0" text-anchor="middle" dominant-baseline="central">cache fewer numbers</text></g><text class="cap" x="40" y="174" text-anchor="start">Rather than compressing each stored value, MLA caches a small learned summary, the</text><text class="cap" x="40" y="194" text-anchor="start">latent, and rebuilds keys and values from it on the fly; {{fig:v03-o091}} unpacked how.</text><text class="cap" x="40" y="214" text-anchor="start">DeepSeek report the cache shrinking 93.3% and maximum generation throughput rising 5.76</text><text class="cap" x="40" y="234" text-anchor="start">times over their previous model, DeepSeek 67B.</text><text class="cap" x="40" y="274" text-anchor="start">That 93.3% holds both approaches at once. DeepSeek 67B cached 2 × 8 × 128 = 2,048</text><text class="cap" x="40" y="294" text-anchor="start">numbers a token in each of its 95 layers, 194,560 in all; DeepSeek-V2 caches 512 + 64 =</text><text class="cap" x="40" y="314" text-anchor="start">576 in each of 60, 34,560 in all. At 16 bits apiece that alone is 82.2% smaller. The</text><text class="cap" x="40" y="334" text-anchor="start">deployed V2 also stores its cache at about 6 bits a number, citing KVQuant, and</text><text class="cap" x="40" y="354" text-anchor="start">1 − (34,560 × 6) ÷ (194,560 × 16) = 93.3%. {{fig:v03-p39}} draws the three sources to</text><text class="cap" x="40" y="374" text-anchor="start">scale.</text></svg><figcaption>An architecture change, not a serving-time one. You cannot apply it to a model that was not trained for it, which is the essential difference from every other method here.</figcaption></figure>
