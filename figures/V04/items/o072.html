<figure><div class='ts'>Fig 72 &nbsp;&middot;&nbsp; 14:35</div><h3>The architectural alternative</h3><svg viewBox="0 0 680 246" role="img"><title>The architectural alternative</title><g class="u"><rect x="40" y="58" width="285" height="74" rx="8"></rect><text class="lbl" x="182.5" y="86.0" text-anchor="middle" dominant-baseline="central">Quantize the cache</text><text class="sub" x="182.5" y="104.0" text-anchor="middle" dominant-baseline="central">shrink every number in it</text></g><g class="s"><rect x="368" y="58" width="272" height="74" rx="8"></rect><text class="lbl" x="504.0" y="86.0" text-anchor="middle" dominant-baseline="central">MLA</text><text class="sub" x="504.0" y="104.0" text-anchor="middle" dominant-baseline="central">cache fewer numbers</text></g><text class="cap" x="40" y="174" text-anchor="start">Rather than compressing each stored value, MLA caches a small learned summary, the latent, and</text><text class="cap" x="40" y="194" text-anchor="start">rebuilds keys and values from it on the fly. DeepSeek report the cache shrinking 93.3% and</text><text class="cap" x="40" y="214" text-anchor="start">maximum generation throughput rising 5.76 times over their previous model.</text></svg><figcaption>An architecture change, not a serving-time one. You cannot apply it to a model that was not trained for it, which is the essential difference from every other method here.</figcaption></figure>
