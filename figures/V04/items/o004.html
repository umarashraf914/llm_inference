<figure><div class='ts'>Fig 04 &nbsp;&middot;&nbsp; 0:30</div><h3>What one bit is worth</h3><svg viewBox="0 0 680 304" role="img"><title>What one bit is worth</title><text class="cap" x="40" y="74" text-anchor="start">FP32</text><g class="h"><rect x="150" y="54" width="272" height="32" rx="3"></rect></g><text class="sub2" x="432" y="74" text-anchor="start">4 bytes each, 280 GB per token</text><text class="cap" x="40" y="120" text-anchor="start">FP16</text><g class="h"><rect x="150" y="100" width="136" height="32" rx="3"></rect></g><text class="sub2" x="296" y="120" text-anchor="start">2 bytes each, 140 GB per token</text><text class="cap" x="40" y="166" text-anchor="start">FP8</text><g class="s"><rect x="150" y="146" width="68" height="32" rx="3"></rect></g><text class="sub2" x="228" y="166" text-anchor="start">1 bytes each, 70 GB per token</text><text class="cap" x="40" y="212" text-anchor="start">FP4</text><g class="s"><rect x="150" y="192" width="34.0" height="32" rx="3"></rect></g><text class="sub2" x="194.0" y="212" text-anchor="start">0.5 bytes each, 35 GB per token</text><text class="cap" x="40" y="262" text-anchor="start">A 70-billion-parameter model. Halving the bits halves the gigabytes that cross the bus for</text><text class="cap" x="40" y="282" text-anchor="start">every token, and roughly halves the time decode spends waiting.</text></svg><figcaption>This is the entire commercial case for quantization. Nothing else in inference gives a proportional saving this directly.</figcaption></figure>
