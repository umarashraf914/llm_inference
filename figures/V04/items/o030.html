<figure><div class='ts'>Fig 30 &nbsp;&middot;&nbsp; 3:00</div><h3>FP16 against BF16</h3><svg viewBox="0 0 680 306" role="img"><title>FP16 against BF16</title><text class="cap" x="40" y="82" text-anchor="start">FP16</text><g class="u"><rect x="140" y="62" width="15.5" height="34" rx="2"></rect></g><g class="h"><rect x="155.5" y="62" width="77.5" height="34" rx="2"></rect><text class="sub" x="194.25" y="79.0" text-anchor="middle" dominant-baseline="central">exponent 5</text></g><g class="s"><rect x="233.0" y="62" width="155.0" height="34" rx="2"></rect><text class="sub" x="310.5" y="79.0" text-anchor="middle" dominant-baseline="central">mantissa 10</text></g><text class="cap" x="40" y="152" text-anchor="start">BF16</text><g class="u"><rect x="140" y="132" width="15.5" height="34" rx="2"></rect></g><g class="h"><rect x="155.5" y="132" width="124.0" height="34" rx="2"></rect><text class="sub" x="217.5" y="149.0" text-anchor="middle" dominant-baseline="central">exponent 8</text></g><g class="s"><rect x="279.5" y="132" width="108.5" height="34" rx="2"></rect><text class="sub" x="333.75" y="149.0" text-anchor="middle" dominant-baseline="central">mantissa 7</text></g><text class="sub2" x="400.0" y="82" text-anchor="start">6e-5 to 65,000</text><text class="sub2" x="400.0" y="152" text-anchor="start">FP32's full range</text><text class="cap" x="40" y="214" text-anchor="start">Sixteen bits each, split in opposite ways. FP16 separates nearby values finely but reaches only</text><text class="cap" x="40" y="234" text-anchor="start">a narrow window. BF16 keeps all eight of FP32's exponent bits and pays for it in the mantissa,</text><text class="cap" x="40" y="254" text-anchor="start">dropping to about 2.4 decimal digits against FP16's 3.3.</text><text class="cap" x="40" y="284" text-anchor="start">Same budget, opposite answers to the range-versus-precision question.</text></svg><figcaption>The cleanest demonstration that range and precision are genuinely separate purchases.</figcaption></figure>
