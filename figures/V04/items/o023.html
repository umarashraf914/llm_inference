<figure><div class='ts'>Fig 23 &nbsp;&middot;&nbsp; 1:42</div><h3>How to read a histogram</h3><svg viewBox="0 0 680 374" role="img"><title>How to read a histogram</title><text class="hd" x="40" y="46">A histogram counts how many values land in each bucket</text><line class="axis" x1="60" y1="200" x2="620" y2="200"></line><g class="s"><rect x="70" y="192" width="44" height="8" rx="2"></rect></g><g class="s"><rect x="126" y="178" width="44" height="22" rx="2"></rect></g><g class="s"><rect x="182" y="152" width="44" height="48" rx="2"></rect></g><g class="s"><rect x="238" y="114" width="44" height="86" rx="2"></rect></g><g class="s"><rect x="294" y="96" width="44" height="104" rx="2"></rect></g><g class="s"><rect x="350" y="122" width="44" height="78" rx="2"></rect></g><g class="s"><rect x="406" y="160" width="44" height="40" rx="2"></rect></g><g class="s"><rect x="462" y="182" width="44" height="18" rx="2"></rect></g><g class="s"><rect x="518" y="192" width="44" height="8" rx="2"></rect></g><g class="s"><rect x="574" y="196" width="44" height="4" rx="2"></rect></g><text class="sub2" x="70" y="226" text-anchor="start">small values</text><text class="sub2" x="500" y="226" text-anchor="start">large values</text><text class="cap" x="40" y="276" text-anchor="start">Taller bar, more values of that size. The shape tells you at a glance where the data actually</text><text class="cap" x="40" y="296" text-anchor="start">lives, which is the only thing that matters when choosing how to store it.</text><text class="cap" x="40" y="332" text-anchor="start">An outlier is a value far out to one side, in a bucket almost nobody else is in. One of them</text><text class="cap" x="40" y="352" text-anchor="start">can be a thousand times the typical value and still be a single bar one pixel high.</text></svg><figcaption>Every argument about which numbers a format can represent is made on one of these. Read the horizontal axis as value and the vertical as how common.</figcaption></figure>
