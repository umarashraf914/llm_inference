<figure><div class='ts'>Fig 32 &nbsp;&middot;&nbsp; 3:06</div><h3>FP8 is two formats</h3><svg viewBox="0 0 680 280" role="img"><title>FP8 is two formats</title><text class="cap" x="40" y="82" text-anchor="start">E4M3</text><g class="u"><rect x="150" y="62" width="15.5" height="34" rx="2"></rect></g><g class="h"><rect x="165.5" y="62" width="62.0" height="34" rx="2"></rect><text class="sub" x="196.5" y="79.0" text-anchor="middle" dominant-baseline="central">4</text></g><g class="s"><rect x="227.5" y="62" width="46.5" height="34" rx="2"></rect><text class="sub" x="250.75" y="79.0" text-anchor="middle" dominant-baseline="central">3</text></g><text class="cap" x="40" y="152" text-anchor="start">E5M2</text><g class="u"><rect x="150" y="132" width="15.5" height="34" rx="2"></rect></g><g class="h"><rect x="165.5" y="132" width="77.5" height="34" rx="2"></rect><text class="sub" x="204.25" y="149.0" text-anchor="middle" dominant-baseline="central">exponent 5</text></g><g class="s"><rect x="243.0" y="132" width="31.0" height="34" rx="2"></rect><text class="sub" x="258.5" y="149.0" text-anchor="middle" dominant-baseline="central">2</text></g><text class="sub2" x="286.0" y="82" text-anchor="start">less range, more precision</text><text class="sub2" x="286.0" y="152" text-anchor="start">wider range, less precision</text><text class="cap" x="40" y="210" text-anchor="start">FP8 splits into two variants, and the hardware can mix them inside a single matrix multiply.</text><text class="cap" x="40" y="238" text-anchor="start">E4M3 for forward-pass weights and activations. E5M2 for backward-pass gradients, which span</text><text class="cap" x="40" y="258" text-anchor="start">a far wider range.</text></svg><figcaption>The naming is literal: E for exponent bits, M for mantissa bits. One matmul can take its two operands in different variants.</figcaption></figure>
