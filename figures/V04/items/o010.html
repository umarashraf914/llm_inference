<figure><div class='ts'>Fig 10 &nbsp;&middot;&nbsp; 1:12</div><h3>The mismatch</h3><svg viewBox="0 0 680 376" role="img"><title>The mismatch</title><text class="hd" x="40" y="46">What eight bits can hold, read as a plain integer</text><g class="s"><rect x="70" y="62" width="500" height="34" rx="4"></rect><text class="sub" x="320.0" y="79.0" text-anchor="middle" dominant-baseline="central">0 to 255, never negative</text></g><text class="hd" x="40" y="148">What exponents actually need to reach</text><g class="h"><rect x="70" y="164" width="248" height="34" rx="4"></rect><text class="sub" x="194.0" y="181.0" text-anchor="middle" dominant-baseline="central">negative: 2^-126 up to 2^-1</text></g><g class="s"><rect x="322" y="164" width="248" height="34" rx="4"></rect><text class="sub" x="446.0" y="181.0" text-anchor="middle" dominant-baseline="central">positive: 2^0 up to 2^127</text></g><line class="mark" x1="320" y1="156" x2="320" y2="206"></line><text class="sub2" x="320" y="148" text-anchor="middle">zero</text><text class="cap" x="40" y="254" text-anchor="start">Half the exponents a float needs are negative, and the field holding them cannot represent a</text><text class="cap" x="40" y="274" text-anchor="start">negative number at all. Something has to bridge that.</text><text class="cap" x="40" y="314" text-anchor="start">The obvious fix would be to spend one of the eight bits on a sign. That works, but it</text><text class="cap" x="40" y="334" text-anchor="start">creates two encodings of zero, +0 and −0, wasting one of the 256 codes. Floats do</text><text class="cap" x="40" y="354" text-anchor="start">something cheaper.</text></svg><figcaption>The exponent field is just an unsigned integer. Every design decision that follows is about getting signed information into an unsigned container.</figcaption></figure>
