<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 1:12</div><h3>Flip the bits of an FP16 number and watch it decode</h3><div class='wg'><div class='ctl'><button type='button' data-word='15360'>1</button><button type='button' data-word='11878'>0.1</button><button type='button' data-word='31743'>largest</button><button type='button' data-word='1024'>smallest normal</button><button type='button' data-word='1'>smallest subnormal</button><button type='button' data-word='31744'>infinity</button><button type='button' data-reset=''>Reset to 6.5</button></div><svg viewBox='0 0 680 674' role='img'><title>Flip the bits of an FP16 number and watch it decode</title><text class="hd" x="40" y="30">Click any bit to flip it. FP16: one sign bit, five exponent bits, ten mantissa bits</text><text class="sub2" x="75" y="50" text-anchor="middle">±</text><g class="u" data-bit="0" style="cursor:pointer"><rect x="60" y="58" width="30" height="34" rx="3"/><text class="sub" x="75.0" y="75.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="119" y="50" text-anchor="middle">16</text><g class="h" data-bit="1" style="cursor:pointer"><rect x="104" y="58" width="30" height="34" rx="3"/><text class="sub" x="119.0" y="75.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="153" y="50" text-anchor="middle">8</text><g class="u" data-bit="2" style="cursor:pointer"><rect x="138" y="58" width="30" height="34" rx="3"/><text class="sub" x="153.0" y="75.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="187" y="50" text-anchor="middle">4</text><g class="u" data-bit="3" style="cursor:pointer"><rect x="172" y="58" width="30" height="34" rx="3"/><text class="sub" x="187.0" y="75.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="221" y="50" text-anchor="middle">2</text><g class="u" data-bit="4" style="cursor:pointer"><rect x="206" y="58" width="30" height="34" rx="3"/><text class="sub" x="221.0" y="75.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="255" y="50" text-anchor="middle">1</text><g class="h" data-bit="5" style="cursor:pointer"><rect x="240" y="58" width="30" height="34" rx="3"/><text class="sub" x="255.0" y="75.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="299" y="50" text-anchor="middle">512</text><g class="s" data-bit="6" style="cursor:pointer"><rect x="284" y="58" width="30" height="34" rx="3"/><text class="sub" x="299.0" y="75.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="333" y="50" text-anchor="middle">256</text><g class="u" data-bit="7" style="cursor:pointer"><rect x="318" y="58" width="30" height="34" rx="3"/><text class="sub" x="333.0" y="75.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="367" y="50" text-anchor="middle">128</text><g class="s" data-bit="8" style="cursor:pointer"><rect x="352" y="58" width="30" height="34" rx="3"/><text class="sub" x="367.0" y="75.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="401" y="50" text-anchor="middle">64</text><g class="u" data-bit="9" style="cursor:pointer"><rect x="386" y="58" width="30" height="34" rx="3"/><text class="sub" x="401.0" y="75.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="435" y="50" text-anchor="middle">32</text><g class="u" data-bit="10" style="cursor:pointer"><rect x="420" y="58" width="30" height="34" rx="3"/><text class="sub" x="435.0" y="75.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="469" y="50" text-anchor="middle">16</text><g class="u" data-bit="11" style="cursor:pointer"><rect x="454" y="58" width="30" height="34" rx="3"/><text class="sub" x="469.0" y="75.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="503" y="50" text-anchor="middle">8</text><g class="u" data-bit="12" style="cursor:pointer"><rect x="488" y="58" width="30" height="34" rx="3"/><text class="sub" x="503.0" y="75.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="537" y="50" text-anchor="middle">4</text><g class="u" data-bit="13" style="cursor:pointer"><rect x="522" y="58" width="30" height="34" rx="3"/><text class="sub" x="537.0" y="75.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="571" y="50" text-anchor="middle">2</text><g class="u" data-bit="14" style="cursor:pointer"><rect x="556" y="58" width="30" height="34" rx="3"/><text class="sub" x="571.0" y="75.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="605" y="50" text-anchor="middle">1</text><g class="u" data-bit="15" style="cursor:pointer"><rect x="590" y="58" width="30" height="34" rx="3"/><text class="sub" x="605.0" y="75.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="60" y="110" text-anchor="start">sign</text><text class="sub2" x="104" y="110" text-anchor="start">exponent field</text><text class="sub2" x="284" y="110" text-anchor="start">mantissa field</text><text class="sub2" x="40" y="155" text-anchor="start">exponent field as a whole number</text><g class="u"><rect x="290" y="134" width="350" height="32" rx="5"/><text class="sub" x="465.0" y="150" text-anchor="middle" dominant-baseline="central" data-row="0">10001 = 17</text></g><text class="sub2" x="40" y="195" text-anchor="start">subtract the bias</text><g class="m"><rect x="290" y="174" width="350" height="32" rx="5"/><text class="sub" x="465.0" y="190" text-anchor="middle" dominant-baseline="central" data-row="1">17 − 15 = 2</text></g><text class="sub2" x="40" y="235" text-anchor="start">mantissa field as a whole number m</text><g class="u"><rect x="290" y="214" width="350" height="32" rx="5"/><text class="sub" x="465.0" y="230" text-anchor="middle" dominant-baseline="central" data-row="2">1010000000 = 640</text></g><text class="sub2" x="40" y="275" text-anchor="start">the significand</text><g class="m"><rect x="290" y="254" width="350" height="32" rx="5"/><text class="sub" x="465.0" y="270" text-anchor="middle" dominant-baseline="central" data-row="3">1 + 640/1024 = 1.625</text></g><text class="sub2" x="40" y="315" text-anchor="start">assemble</text><g class="s"><rect x="290" y="294" width="350" height="32" rx="5"/><text class="sub" x="465.0" y="310" text-anchor="middle" dominant-baseline="central" data-row="4">+1 × 2² × 1.625 = 6.5</text></g><text class="sub2" x="40" y="355" text-anchor="start">all sixteen bits as one whole number</text><g class="u"><rect x="290" y="334" width="350" height="32" rx="5"/><text class="sub" x="465.0" y="350" text-anchor="middle" dominant-baseline="central" data-row="5">18,048</text></g><text class="cap" x="40" y="408" text-anchor="start">These are the four steps of {{fig:v04-o018}}, run on any pattern you make. The exponent field</text><text class="cap" x="40" y="428" text-anchor="start">is read as a whole number ({{fig:v04-p01}}) and the bias of 15 subtracted. The mantissa</text><text class="cap" x="40" y="448" text-anchor="start">field, read as a whole number m, is the fraction m/1024 after the point ({{fig:v04-p02}}),</text><text class="cap" x="40" y="468" text-anchor="start">with the implied 1 in front.</text><text class="cap" x="40" y="508" text-anchor="start">Flip the last bit of 6.5 and it becomes 6.50390625: one step of the grid near 6.5 is</text><text class="cap" x="40" y="528" text-anchor="start">2² × 2⁻¹⁰ = 1/256 ({{fig:v04-o020}}). Flip the exponent bit worth 8 and the field goes from 17</text><text class="cap" x="40" y="548" text-anchor="start">to 25, so 6.5 becomes 1,664. Clear all five exponent bits to reach the subnormals of</text><text class="cap" x="40" y="568" text-anchor="start">{{fig:v04-p04}}; set all five for infinity and not-a-number.</text><text class="cap" x="40" y="608" text-anchor="start">The last row reads the whole word as one number. Larger positive floats always have</text><text class="cap" x="40" y="628" text-anchor="start">larger words, which is the point of {{fig:v04-o013}}. The widget's arithmetic was checked</text><text class="cap" x="40" y="648" text-anchor="start">against Python on all 65,536 patterns.</text></svg></div><figcaption>Every FP16 number is one of these 65,536 patterns, and every one decodes by the same four steps. Range, precision, subnormals and the reserved codes are all just patterns of bits.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const START = 18048, SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹', M = '−';
  let w = START;
  const sup = n => (n < 0 ? '⁻' : '') + String(Math.abs(n)).split('').map(d => SUP[+d]).join('');
  const comma = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  function num(x) {
    if (x === 0) return ['=', '0'];
    const a = Math.abs(x), sg = x < 0 ? M : '';
    let s = a.toPrecision(12), exact = Number(s) === a, out;
    if (s.includes('e')) {
      let [mm, ee] = s.split('e');
      if (mm.includes('.')) mm = mm.replace(/0+$/, '').replace(/\.$/, '');
      out = mm + ' × 10' + sup(+ee);
    } else {
      if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
      out = s.includes('.') ? s : comma(s);
    }
    return [exact ? '=' : '≈', sg + out];
  }
  function strings(word) {
    const bits = word.toString(2).padStart(16, '0');
    const s = +bits[0], e = parseInt(bits.slice(1, 6), 2), m = parseInt(bits.slice(6), 2);
    const sg = s ? M : '+', out = [bits.slice(1, 6) + ' = ' + e];
    if (e === 31) {
      out.push('code 31 is reserved', bits.slice(6) + ' = ' + m,
               m === 0 ? 'zero means infinity' : 'not zero: not a number',
               m === 0 ? sg + 'infinity' : 'NaN, not a number');
    } else if (e === 0) {
      const sig = m / 1024;
      let [rel, vs] = num((s ? -1 : 1) * sig * Math.pow(2, -14));
      if (m === 0 && s) vs = M + '0';
      out.push('code 0: subnormal, held at −14', bits.slice(6) + ' = ' + m,
               'no implied 1: 0 + ' + m + '/1024 = ' + String(sig),
               sg + '1 × 2⁻¹⁴ × ' + String(sig) + ' ' + rel + ' ' + vs);
    } else {
      const sig = 1 + m / 1024, p = e - 15, [rel, vs] = num((s ? -1 : 1) * sig * Math.pow(2, p));
      out.push(e + ' − 15 = ' + String(p).replace('-', M), bits.slice(6) + ' = ' + m,
               '1 + ' + m + '/1024 = ' + String(sig), sg + '1 × 2' + sup(p) + ' × ' + String(sig) + ' ' + rel + ' ' + vs);
    }
    out.push(comma(word));
    return out;
  }
  const cls = (k, b) => b === '0' ? 'u' : (k === 0 ? 'm' : k < 6 ? 'h' : 's');
  function draw() {
    const bits = w.toString(2).padStart(16, '0');
    fig.querySelectorAll('[data-bit]').forEach(g => {
      const k = +g.dataset.bit;
      g.setAttribute('class', cls(k, bits[k]));
      g.querySelector('text').textContent = bits[k];
    });
    strings(w).forEach((s, i) => fig.querySelector(`[data-row="${i}"]`).textContent = s);
  }
  fig.querySelectorAll('[data-bit]').forEach(g => g.addEventListener('click', () => {
    w ^= 1 << (15 - +g.dataset.bit); draw();
  }));
  fig.querySelectorAll('button[data-word]').forEach(b => b.addEventListener('click', () => {
    w = +b.dataset.word; draw();
  }));
  fig.querySelector('button[data-reset]').addEventListener('click', () => { w = START; draw(); });
  draw();
})();</script></figure>
