<figure><div class='ts'>Fig 15 &nbsp;&middot;&nbsp; 1:12</div><h3>Why the bias is that particular number</h3><svg viewBox="0 0 680 464" role="img"><title>Why the bias is that particular number</title><g class="m"><rect x="150" y="46" width="380" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">bias  =  2^(E-1)  -  1</text></g><text class="cap" x="40" y="122" text-anchor="start">Choosing the bias to be roughly half the field's span puts zero near the middle, so the format</text><text class="cap" x="40" y="142" text-anchor="start">reaches about as far below 1 as it does above.</text><g class="s"><rect x="60" y="176" width="260" height="42" rx="6"></rect><text class="sub" x="190.0" y="197.0" text-anchor="middle" dominant-baseline="central">smallest exponent = 1 - bias</text></g><g class="s"><rect x="360" y="176" width="260" height="42" rx="6"></rect><text class="sub" x="490.0" y="197.0" text-anchor="middle" dominant-baseline="central">largest = (2^E - 2) - bias</text></g><text class="hd" x="40" y="262">Worked for three formats</text><text class="cap" x="40" y="288" text-anchor="start">FP32</text><text class="sub2" x="120" y="288" text-anchor="start">8 exponent bits</text><text class="sub2" x="250" y="288" text-anchor="start">bias 127</text><text class="sub2" x="340" y="288" text-anchor="start">codes 1 to 254</text><text class="sub2" x="470" y="288" text-anchor="start">exponents -126 to +127</text><text class="cap" x="40" y="328" text-anchor="start">BF16</text><text class="sub2" x="120" y="328" text-anchor="start">8 exponent bits</text><text class="sub2" x="250" y="328" text-anchor="start">bias 127</text><text class="sub2" x="340" y="328" text-anchor="start">codes 1 to 254</text><text class="sub2" x="470" y="328" text-anchor="start">exponents -126 to +127</text><text class="cap" x="40" y="368" text-anchor="start">FP16</text><text class="sub2" x="120" y="368" text-anchor="start">5 exponent bits</text><text class="sub2" x="250" y="368" text-anchor="start">bias 15</text><text class="sub2" x="340" y="368" text-anchor="start">codes 1 to 30</text><text class="sub2" x="470" y="368" text-anchor="start">exponents -14 to +15</text><text class="cap" x="40" y="442" text-anchor="start">FP8 variants bend these rules slightly, reserving fewer patterns to buy a little more range.</text></svg><figcaption>The formula is not magic. It is the value that centres the representable exponents on zero, given that two codes are already spent.</figcaption></figure>
