<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 10:16</div><h3>Inside a W8 A8 matmul the integers multiply and the scales wait outside the sum</h3><svg viewBox='0 0 680 676' role='img'><title>Inside a W8 A8 matmul the integers multiply and the scales wait outside the sum</title><text class="hd" x="40" y="46">One output of a W8 A8 matmul: four inputs, four weights</text><text class="cap" x="40" y="98" text-anchor="start">activations x</text><text class="sub2" x="170" y="98" text-anchor="middle">0.50</text><g class="m"><rect x="146" y="106" width="48" height="24" rx="3"/><text class="sub" x="170.0" y="118.0" text-anchor="middle" dominant-baseline="central">32</text></g><text class="sub2" x="230" y="98" text-anchor="middle">−1.20</text><g class="m"><rect x="206" y="106" width="48" height="24" rx="3"/><text class="sub" x="230.0" y="118.0" text-anchor="middle" dominant-baseline="central">−76</text></g><text class="sub2" x="290" y="98" text-anchor="middle">2.00</text><g class="m"><rect x="266" y="106" width="48" height="24" rx="3"/><text class="sub" x="290.0" y="118.0" text-anchor="middle" dominant-baseline="central">127</text></g><text class="sub2" x="350" y="98" text-anchor="middle">0.30</text><g class="m"><rect x="326" y="106" width="48" height="24" rx="3"/><text class="sub" x="350.0" y="118.0" text-anchor="middle" dominant-baseline="central">19</text></g><text class="sub2" x="410" y="98" text-anchor="start">a = 2.0 ÷ 127</text><text class="sub2" x="410" y="123" text-anchor="start">integers: round(value ÷ a)</text><text class="cap" x="40" y="168" text-anchor="start">weights w</text><text class="sub2" x="170" y="168" text-anchor="middle">0.80</text><g class="m"><rect x="146" y="176" width="48" height="24" rx="3"/><text class="sub" x="170.0" y="188.0" text-anchor="middle" dominant-baseline="central">127</text></g><text class="sub2" x="230" y="168" text-anchor="middle">0.10</text><g class="m"><rect x="206" y="176" width="48" height="24" rx="3"/><text class="sub" x="230.0" y="188.0" text-anchor="middle" dominant-baseline="central">16</text></g><text class="sub2" x="290" y="168" text-anchor="middle">−0.45</text><g class="m"><rect x="266" y="176" width="48" height="24" rx="3"/><text class="sub" x="290.0" y="188.0" text-anchor="middle" dominant-baseline="central">−71</text></g><text class="sub2" x="350" y="168" text-anchor="middle">0.60</text><g class="m"><rect x="326" y="176" width="48" height="24" rx="3"/><text class="sub" x="350.0" y="188.0" text-anchor="middle" dominant-baseline="central">95</text></g><text class="sub2" x="410" y="168" text-anchor="start">b = 0.8 ÷ 127</text><text class="sub2" x="410" y="193" text-anchor="start">integers: round(value ÷ b)</text><text class="sub2" x="40" y="256" text-anchor="start">the exact output</text><g class="u"><rect x="190" y="232" width="450" height="36" rx="8"/><text class="lbl" x="415.0" y="250.0" text-anchor="middle" dominant-baseline="central">Σ x w  =  0.40 − 0.12 − 0.90 + 0.18  =  −0.44</text></g><text class="sub2" x="40" y="302" text-anchor="start">substitute</text><g class="m"><rect x="190" y="278" width="450" height="36" rx="8"/><text class="lbl" x="415.0" y="296.0" text-anchor="middle" dominant-baseline="central">Σ (a q) × (b r)  =  a × b × Σ q r</text></g><text class="sub2" x="40" y="348" text-anchor="start">the integer sum</text><g class="m"><rect x="190" y="324" width="450" height="36" rx="8"/><text class="lbl" x="415.0" y="342.0" text-anchor="middle" dominant-baseline="central">32×127 − 76×16 − 127×71 + 19×95  =  −4,364</text></g><text class="sub2" x="40" y="394" text-anchor="start">one float multiply</text><g class="s"><rect x="190" y="370" width="450" height="36" rx="8"/><text class="lbl" x="415.0" y="388.0" text-anchor="middle" dominant-baseline="central">a × b × (−4,364)  =  −0.4329</text></g><text class="cap" x="40" y="450" text-anchor="start">Both sides are stored as INT8, each with its own scale: one number a for the token's</text><text class="cap" x="40" y="470" text-anchor="start">activations, one number b for the column of weights that makes this output. Because a</text><text class="cap" x="40" y="490" text-anchor="start">and b are the same for every term, they come out of the sum, and what is left is pure</text><text class="cap" x="40" y="510" text-anchor="start">integer multiply-and-add, the work the tensor cores' eight-bit path does twice as fast</text><text class="cap" x="40" y="530" text-anchor="start">({{fig:v02-o084}}). One float multiply per output then restores the scale, here to within</text><text class="cap" x="40" y="550" text-anchor="start">0.007 of the exact answer.</text><text class="cap" x="40" y="590" text-anchor="start">The running sum needs room. Each product is at most 127 × 127 = 16,129, so 4,096 of them</text><text class="cap" x="40" y="610" text-anchor="start">can reach 66,064,384: far beyond a 16-bit integer's 32,767 but well inside a 32-bit</text><text class="cap" x="40" y="630" text-anchor="start">integer's 2,147,483,647. Integer matmuls therefore add up in INT32, as float ones add up</text><text class="cap" x="40" y="650" text-anchor="start">in FP32 ({{fig:v02-o089}}).</text></svg><figcaption>The scales can wait outside only because each is constant along the sum. That condition is about to matter: an activation scale that changed from term to term would break it.</figcaption></figure>
