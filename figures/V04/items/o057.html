<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 9:58</div><h3>What happens inside a W4 A16 matmul</h3><svg viewBox='0 0 680 572' role='img'><title>What happens inside a W4 A16 matmul</title><g class="s"><rect x="40" y="52" width="150" height="44" rx="8"/><text class="lbl" x="115.0" y="65.0" text-anchor="middle" dominant-baseline="central">INT4 in HBM</text><text class="sub" x="115.0" y="83.0" text-anchor="middle" dominant-baseline="central">two per byte</text></g><line class="conn" x1="196" y1="74" x2="214" y2="74" marker-end="url(#arw)"/><g class="m"><rect x="220" y="52" width="180" height="44" rx="8"/><text class="lbl" x="310.0" y="65.0" text-anchor="middle" dominant-baseline="central">dequantize to FP16</text><text class="sub" x="310.0" y="83.0" text-anchor="middle" dominant-baseline="central">on chip, per tile</text></g><line class="conn" x1="406" y1="74" x2="424" y2="74" marker-end="url(#arw)"/><g class="u"><rect x="430" y="52" width="210" height="44" rx="8"/><text class="lbl" x="535.0" y="74.0" text-anchor="middle" dominant-baseline="central">FP16 × FP16 matmul</text></g><text class="hd" x="40" y="140" text-anchor="start">Bytes read per weight, to scale</text><text class="cap" x="40" y="172" text-anchor="start">FP16</text><g class="u"><rect x="160" y="156" width="240.0" height="24" rx="2"/></g><text class="sub2" x="410" y="173" text-anchor="start">2 bytes</text><text class="cap" x="40" y="206" text-anchor="start">W4 A16</text><g class="s"><rect x="160" y="190" width="61.9" height="24" rx="2"/></g><text class="sub2" x="231.875" y="207" text-anchor="start">0.5 bytes, or 0.52 with an FP16 scale per 128</text><text class="hd" x="40" y="252" text-anchor="start">Operations per weight, to scale</text><text class="cap" x="40" y="284" text-anchor="start">FP16</text><g class="u"><rect x="160" y="268" width="120.0" height="24" rx="2"/></g><text class="cap" x="40" y="318" text-anchor="start">W4 A16</text><g class="u"><rect x="160" y="302" width="120.0" height="24" rx="2"/></g><text class="sub2" x="290" y="319" text-anchor="start">2 each: one multiply, one add, unchanged</text><text class="cap" x="40" y="366" text-anchor="start">This is what W4 A16 actually does. The weights travel as four-bit integers, two packed</text><text class="cap" x="40" y="386" text-anchor="start">into each byte, then expand back to sixteen bits on chip, just before the multiply.</text><text class="cap" x="40" y="426" text-anchor="start">So the bus carries about a quarter as many bytes, 26% of FP16's once the scales are</text><text class="cap" x="40" y="446" text-anchor="start">counted ({{fig:v04-o058}}), and the tensor cores do exactly the same work. That is why</text><text class="cap" x="40" y="466" text-anchor="start">weight-only quantization speeds up memory-bound decode and does almost nothing for</text><text class="cap" x="40" y="486" text-anchor="start">compute-bound prefill.</text><text class="cap" x="40" y="526" text-anchor="start">To speed up the arithmetic you have to quantize the activations too, so the multiply</text><text class="cap" x="40" y="546" text-anchor="start">itself can run in a narrower format.</text></svg><figcaption>The dequantization step is the part that is easy to miss, and it is exactly why the two strategies have different effects.</figcaption></figure>
