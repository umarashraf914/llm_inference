<figure><div class='ts'>Fig 57 &nbsp;&middot;&nbsp; 9:58</div><h3>What happens inside a W4 A16 matmul</h3><svg viewBox="0 0 680 384" role="img"><title>What happens inside a W4 A16 matmul</title><g class="s"><rect x="40" y="52" width="130" height="40" rx="4"></rect><text class="sub" x="105.0" y="72.0" text-anchor="middle" dominant-baseline="central">INT4 in HBM</text></g><line class="conn" x1="176" y1="72" x2="204" y2="72" marker-end="url(#arw)"></line><g class="m"><rect x="210" y="52" width="160" height="40" rx="4"></rect><text class="sub" x="290.0" y="72.0" text-anchor="middle" dominant-baseline="central">dequantize to FP16</text></g><line class="conn" x1="376" y1="72" x2="404" y2="72" marker-end="url(#arw)"></line><g class="u"><rect x="410" y="52" width="230" height="40" rx="4"></rect><text class="sub" x="525.0" y="72.0" text-anchor="middle" dominant-baseline="central">FP16 x FP16 matmul</text></g><text class="cap" x="40" y="130" text-anchor="start">This is what W4 A16 actually does. The weights travel as four-bit integers, then expand back to</text><text class="cap" x="40" y="150" text-anchor="start">sixteen bits on chip, just before the multiply.</text><text class="cap" x="40" y="190" text-anchor="start">So the bus carries a quarter as many bytes</text><g class="s"><rect x="420" y="174" width="4" height="26" rx="1"></rect></g><text class="sub2" x="434" y="193" text-anchor="start">big win</text><text class="cap" x="40" y="240" text-anchor="start">and the tensor cores do exactly the same work</text><g class="h"><rect x="420" y="224" width="200" height="26" rx="3"></rect><text class="sub" x="520.0" y="237.0" text-anchor="middle" dominant-baseline="central">unchanged</text></g><text class="cap" x="40" y="292" text-anchor="start">The arithmetic is unchanged, which is why weight-only quantization speeds up memory-bound</text><text class="cap" x="40" y="312" text-anchor="start">decode and does almost nothing for compute-bound prefill.</text><text class="cap" x="40" y="342" text-anchor="start">To speed up the arithmetic you have to quantize the activations too, so the multiply itself can</text><text class="cap" x="40" y="362" text-anchor="start">run in a narrower format.</text></svg><figcaption>The dequantization step is the part that is easy to miss, and it is exactly why the two strategies have different effects.</figcaption></figure>
