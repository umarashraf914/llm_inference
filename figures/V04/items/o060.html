<figure><div class='ts'>Fig 60 &nbsp;&middot;&nbsp; 10:55</div><h3>GPTQ: pay the error forward</h3><svg viewBox="0 0 680 362" role="img"><title>GPTQ: pay the error forward</title><text class="hd" x="40" y="46">GPTQ quantizes one weight at a time</text><g class="s"><rect x="60" y="66" width="48" height="38" rx="3"></rect><text class="sub" x="84.0" y="85.0" text-anchor="middle" dominant-baseline="central">done</text></g><g class="s"><rect x="116" y="66" width="48" height="38" rx="3"></rect><text class="sub" x="140.0" y="85.0" text-anchor="middle" dominant-baseline="central">done</text></g><g class="s"><rect x="172" y="66" width="48" height="38" rx="3"></rect><text class="sub" x="196.0" y="85.0" text-anchor="middle" dominant-baseline="central">done</text></g><g class="s"><rect x="228" y="66" width="48" height="38" rx="3"></rect><text class="sub" x="252.0" y="85.0" text-anchor="middle" dominant-baseline="central">done</text></g><g class="u"><rect x="284" y="66" width="48" height="38" rx="3"></rect></g><g class="u"><rect x="340" y="66" width="48" height="38" rx="3"></rect></g><g class="u"><rect x="396" y="66" width="48" height="38" rx="3"></rect></g><g class="u"><rect x="452" y="66" width="48" height="38" rx="3"></rect></g><g class="u"><rect x="508" y="66" width="48" height="38" rx="3"></rect></g><g class="u"><rect x="564" y="66" width="48" height="38" rx="3"></rect></g><g class="m"><rect x="284" y="66" width="48" height="38" rx="3"></rect><text class="sub" x="308.0" y="85.0" text-anchor="middle" dominant-baseline="central">now</text></g><line class="conn" x1="308" y1="108" x2="364" y2="122" marker-end="url(#arw)"></line><line class="conn" x1="308" y1="108" x2="420" y2="122" marker-end="url(#arw)"></line><line class="conn" x1="308" y1="108" x2="476" y2="122" marker-end="url(#arw)"></line><line class="conn" x1="308" y1="108" x2="532" y2="122" marker-end="url(#arw)"></line><line class="conn" x1="308" y1="108" x2="588" y2="122" marker-end="url(#arw)"></line><g class="u"><rect x="340" y="126" width="268" height="30" rx="3"></rect><text class="sub" x="474.0" y="141.0" text-anchor="middle" dominant-baseline="central">not yet quantized: nudged to absorb the error</text></g><text class="cap" x="40" y="200" text-anchor="start">GPTQ, from Elias Frantar and colleagues in 2022, rounds a layer's weights one at a time.</text><text class="cap" x="40" y="220" text-anchor="start">After rounding each one, it nudges everything not yet quantized to cancel the error just</text><text class="cap" x="40" y="240" text-anchor="start">introduced. The error is never eliminated, only relocated to where the output cares</text><text class="cap" x="40" y="260" text-anchor="start">least.</text><text class="cap" x="40" y="300" text-anchor="start">How much to nudge comes from the Hessian, second-order information measuring how much</text><text class="cap" x="40" y="320" text-anchor="start">each weight's error moves the layer's output. The next three figures build it from one</text><text class="cap" x="40" y="340" text-anchor="start">rounded weight.</text></svg><figcaption>The sequential structure is the point. Each rounding decision is made knowing the damage all previous ones did.</figcaption></figure>
