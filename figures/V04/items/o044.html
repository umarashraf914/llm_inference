n levels from −7 to 7, the sixteenth code left unused as in {{fig:v04-p08}}, and</text><text class="cap" x="40" y="300" text-anchor="start">the scale set by the group's largest weight, about 2.8 typical weights from zero for a</text><text class="cap" x="40" y="320" text-anchor="start">group of 128. Nearly all of them land where the weights actually live, because the</text><text class="cap" x="40" y="340" text-anchor="start">weights crowd into the middle of the range.</text><text class="cap" x="40" y="380" text-anchor="start">Measured on 20,000 such groups, the rounding error is about 12% of a typical weight (its</text><text class="cap" x="40" y="400" text-anchor="start">rms, {{fig:v04-p14}}), and 16% of the weights, those within half a step of zero, round</text><text class="cap" x="40" y="420" text-anchor="start">to exactly 0. Errors that size, independent and cancelling, are what the previous</text><text class="cap" x="40" y="440" text-anchor="start">figures showed a network can absorb.</text></svg><figcaption>This is the good case, and it is why four-bit weights work: the errors are about an eighth of a typical weight, and they cancel. The next figure takes the same sixteen values to the activations.</figcaption></figure>
