<figure><div class='ts'>Fig 25 &nbsp;&middot;&nbsp; 1:54</div><h3>Activations do not</h3><svg viewBox="0 0 680 290" role="img"><title>Activations do not</title><line class="axis" x1="50" y1="150" x2="630" y2="150"></line><g class="s"><rect x="90" y="128" width="11" height="22" rx="1"></rect></g><g class="s"><rect x="105" y="95" width="11" height="55" rx="1"></rect></g><g class="s"><rect x="118" y="62" width="11" height="88" rx="1"></rect></g><g class="s"><rect x="131" y="50" width="11" height="100" rx="1"></rect></g><g class="s"><rect x="144" y="74" width="11" height="76" rx="1"></rect></g><g class="s"><rect x="158" y="110" width="11" height="40" rx="1"></rect></g><g class="s"><rect x="172" y="132" width="11" height="18" rx="1"></rect></g><g class="h"><rect x="520" y="138" width="9" height="12" rx="1"></rect></g><g class="h"><rect x="575" y="142" width="9" height="8" rx="1"></rect></g><text class="sub2" x="130" y="178" text-anchor="middle">most values, near 0 to 2</text><text class="sub2" x="548" y="178" text-anchor="middle">a few, around 100x larger</text><text class="cap" x="40" y="218" text-anchor="start">Activations, the values flowing through the network as it runs, do not behave like the weights.</text><text class="cap" x="40" y="238" text-anchor="start">Most cluster low, a handful run enormously hot.</text><text class="cap" x="40" y="268" text-anchor="start">That mismatch is most of what makes quantization hard.</text></svg><figcaption>Hold this picture. Roughly half the techniques later exist only because of it.</figcaption></figure>
