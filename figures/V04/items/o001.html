<figure><div class='ts'>Fig 01 &nbsp;&middot;&nbsp; 0:00</div><h3>Every token reads every weight</h3><svg viewBox="0 0 680 224" role="img"><title>Every token reads every weight</title><g class="h"><rect x="50" y="55" width="235" height="64" rx="8"></rect><text class="lbl" x="167.5" y="78.0" text-anchor="middle" dominant-baseline="central">All the weights</text><text class="sub" x="167.5" y="96.0" text-anchor="middle" dominant-baseline="central">hundreds of GB, once per token</text></g><line class="conn" x1="291" y1="87" x2="341" y2="87" marker-end="url(#arw)"></line><g class="u"><rect x="348" y="55" width="235" height="64" rx="8"></rect><text class="lbl" x="465.5" y="78.0" text-anchor="middle" dominant-baseline="central">One token out</text><text class="sub" x="465.5" y="96.0" text-anchor="middle" dominant-baseline="central">then do it again</text></g><line class="conn" x1="465" y1="125" x2="465" y2="150" marker-end="url(#arw)"></line><line class="conn" x1="465" y1="150" x2="167" y2="150"></line><line class="conn" x1="167" y1="150" x2="167" y2="125" marker-end="url(#arw)"></line><text class="cap" x="40" y="190" text-anchor="start">The arithmetic finishes almost immediately. The rest of the step is the chip waiting for</text><text class="cap" x="40" y="210" text-anchor="start">weights to arrive. That is the memory wall.</text></svg><figcaption>A 70-billion-parameter model in FP16 is 140 GB of weights. Every one of them crosses the bus for every single token generated.</figcaption></figure>
