<figure><div class='ts'>Fig 16 &nbsp;&middot;&nbsp; 1:12</div><h3>Why 127 and not 128</h3><svg viewBox="0 0 680 486" role="img"><title>Why 127 and not 128</title><text class="hd" x="40" y="46">The range is deliberately lopsided by one</text><text class="cap" x="40" y="92" text-anchor="start">bias 127</text><text class="sub2" x="40" y="112" text-anchor="start">what FP32 uses</text><g class="h"><rect x="220" y="74" width="200" height="30" rx="3"></rect><text class="sub" x="320.0" y="89.0" text-anchor="middle" dominant-baseline="central">down to 2^-126</text></g><g class="s"><rect x="424" y="74" width="196" height="30" rx="3"></rect><text class="sub" x="522.0" y="89.0" text-anchor="middle" dominant-baseline="central">up to 2^+127</text></g><text class="cap" x="40" y="172" text-anchor="start">bias 128</text><text class="sub2" x="40" y="192" text-anchor="start">hypothetical</text><g class="h"><rect x="220" y="154" width="202" height="30" rx="3"></rect><text class="sub" x="321.0" y="169.0" text-anchor="middle" dominant-baseline="central">down to 2^-127</text></g><g class="s"><rect x="426" y="154" width="194" height="30" rx="3"></rect><text class="sub" x="523.0" y="169.0" text-anchor="middle" dominant-baseline="central">up to 2^+126</text></g><text class="cap" x="40" y="252" text-anchor="start">One extra positive exponent, one fewer negative. The reason is reciprocals.</text><g class="s"><rect x="90" y="282" width="200" height="42" rx="6"></rect><text class="sub" x="190.0" y="303.0" text-anchor="middle" dominant-baseline="central">1 / 2^-126  =  2^126</text></g><text class="sub2" x="300" y="307" text-anchor="start">fits, since the maximum is 127</text><g class="h"><rect x="90" y="340" width="200" height="42" rx="6"></rect><text class="sub" x="190.0" y="361.0" text-anchor="middle" dominant-baseline="central">1 / 2^-127  =  2^127</text></g><text class="sub2" x="300" y="365" text-anchor="start">overflows, since the maximum would be 126</text><text class="cap" x="40" y="424" text-anchor="start">With the real bias, one over the smallest normal number is still representable. Shift the bias</text><text class="cap" x="40" y="444" text-anchor="start">by one and that stops being true, and a division that ought to be perfectly safe would produce</text><text class="cap" x="40" y="464" text-anchor="start">infinity.</text></svg><figcaption>A one-off asymmetry that looks like an error until you try to invert the smallest normal value.</figcaption></figure>
