<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 19:15</div><h3>Distillation copies the full model's probabilities, not just its answers</h3><svg viewBox='0 0 680 658' role='img'><title>Distillation copies the full model's probabilities, not just its answers</title><text class="hd" x="40" y="30">Two targets for the same next token, on a log scale</text><text class="cap" x="40" y="60" text-anchor="start">Ordinary training: the right answer only</text><text class="sub2" x="148" y="88" text-anchor="end">cat</text><g class="u"><rect x="160" y="74" width="420.0" height="18" rx="2"/></g><text class="sub2" x="588" y="88" text-anchor="start">100%</text><text class="sub2" x="148" y="114" text-anchor="end">dog</text><text class="sub2" x="164" y="114" text-anchor="start">0: no credit at all</text><text class="sub2" x="148" y="140" text-anchor="end">the</text><text class="sub2" x="164" y="140" text-anchor="start">0: no credit at all</text><text class="sub2" x="148" y="166" text-anchor="end">banana</text><text class="sub2" x="164" y="166" text-anchor="start">0: no credit at all</text><text class="cap" x="40" y="208" text-anchor="start">Distillation: the full-precision model's shares</text><text class="sub2" x="148" y="236" text-anchor="end">cat</text><g class="s"><rect x="160" y="222" width="406.6" height="18" rx="2"/></g><text class="sub2" x="574.573" y="236" text-anchor="start">74.49%</text><text class="sub2" x="148" y="262" text-anchor="end">dog</text><g class="s"><rect x="160" y="248" width="356.4" height="18" rx="2"/></g><text class="sub2" x="524.412" y="262" text-anchor="start">24.80%</text><text class="sub2" x="148" y="288" text-anchor="end">the</text><g class="s"><rect x="160" y="274" width="192.2" height="18" rx="2"/></g><text class="sub2" x="360.249" y="288" text-anchor="start">0.68%</text><text class="sub2" x="148" y="314" text-anchor="end">banana</text><g class="s"><rect x="160" y="300" width="50.9" height="18" rx="2"/></g><text class="sub2" x="218.886" y="314" text-anchor="start">0.03%</text><line class="axis" x1="160.0" y1="334" x2="580.0" y2="334"/><line class="tick" x1="160.0" y1="334" x2="160.0" y2="339"/><text class="sub2" x="160" y="353" text-anchor="middle">0.01%</text><line class="tick" x1="265.0" y1="334" x2="265.0" y2="339"/><text class="sub2" x="265" y="353" text-anchor="middle">0.1%</text><line class="tick" x1="370.0" y1="334" x2="370.0" y2="339"/><text class="sub2" x="370" y="353" text-anchor="middle">1%</text><line class="tick" x1="475.0" y1="334" x2="475.0" y2="339"/><text class="sub2" x="475" y="353" text-anchor="middle">10%</text><line class="tick" x1="580.0" y1="334" x2="580.0" y2="339"/><text class="sub2" x="580" y="353" text-anchor="middle">100%</text><text class="cap" x="40" y="392" text-anchor="start">The full-precision model's output for the next token is a share for every word</text><text class="cap" x="40" y="412" text-anchor="start">({{fig:v01-o009}} worked these four): cat 74.49%, dog 24.80%, the 0.68%, banana 0.03%.</text><text class="cap" x="40" y="432" text-anchor="start">Ordinary training rewards only the right answer, as if every other share should be 0.</text><text class="cap" x="40" y="472" text-anchor="start">Distillation trains the quantized model, the student, to match the whole set of shares</text><text class="cap" x="40" y="492" text-anchor="start">of the full-precision model, the teacher. The shares say more than the answer does: that</text><text class="cap" x="40" y="512" text-anchor="start">dog was a near miss, and that banana was absurd. Hinton, Vinyals and Dean called this</text><text class="cap" x="40" y="532" text-anchor="start">distilling the knowledge in a neural network, in 2015.</text><text class="cap" x="40" y="572" text-anchor="start">Here the teacher is the same model before rounding, so the student learns to make its</text><text class="cap" x="40" y="592" text-anchor="start">rounded weights give the original's shares, for every token of the training text.</text><text class="cap" x="40" y="612" text-anchor="start">Combined with quantization-aware training ({{fig:v04-p35}}), that is the budget the advice</text><text class="cap" x="40" y="632" text-anchor="start">above sets for models under about 70 billion parameters.</text></svg><figcaption>The answer is one word. The shares are the model's whole opinion, and the student copies the opinion.</figcaption></figure>
