<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 12:53</div><h3>Scaling a weight up before rounding divides its error</h3><svg viewBox='0 0 680 636' role='img'><title>Scaling a weight up before rounding divides its error</title><text class="hd" x="40" y="46">A weight of 0.37 with input 10, on a grid of step 0.1, scaled by s before rounding</text><text class="cap" x="40" y="108" text-anchor="start">s = 1</text><line class="axis" x1="180.0" y1="104" x2="620.0" y2="104"/><line class="tick" x1="180.0" y1="98" x2="180.0" y2="110"/><line class="tick" x1="207.5" y1="101" x2="207.5" y2="107"/><line class="tick" x1="235.0" y1="101" x2="235.0" y2="107"/><line class="tick" x1="262.5" y1="101" x2="262.5" y2="107"/><line class="tick" x1="290.0" y1="101" x2="290.0" y2="107"/><line class="tick" x1="317.5" y1="98" x2="317.5" y2="110"/><line class="tick" x1="345.0" y1="101" x2="345.0" y2="107"/><line class="tick" x1="372.5" y1="101" x2="372.5" y2="107"/><line class="tick" x1="400.0" y1="101" x2="400.0" y2="107"/><line class="tick" x1="427.5" y1="101" x2="427.5" y2="107"/><line class="tick" x1="455.0" y1="98" x2="455.0" y2="110"/><line class="tick" x1="482.5" y1="101" x2="482.5" y2="107"/><line class="tick" x1="510.0" y1="101" x2="510.0" y2="107"/><line class="tick" x1="537.5" y1="101" x2="537.5" y2="107"/><line class="tick" x1="565.0" y1="101" x2="565.0" y2="107"/><line class="tick" x1="592.5" y1="98" x2="592.5" y2="110"/><line class="tick" x1="620.0" y1="101" x2="620.0" y2="107"/><circle cx="281.8" cy="104.0" r="4.5" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><circle cx="290.0" cy="104.0" r="4.5" fill="var(--paper)" stroke="var(--s)" stroke-width="1.5"/><text class="sub2" x="180" y="130" text-anchor="start">0.37, stored as 0.4;  × 10  =  4.00,  error +0.30</text><text class="cap" x="40" y="178" text-anchor="start">s = 2</text><line class="axis" x1="180.0" y1="174" x2="620.0" y2="174"/><line class="tick" x1="180.0" y1="168" x2="180.0" y2="180"/><line class="tick" x1="207.5" y1="171" x2="207.5" y2="177"/><line class="tick" x1="235.0" y1="171" x2="235.0" y2="177"/><line class="tick" x1="262.5" y1="171" x2="262.5" y2="177"/><line class="tick" x1="290.0" y1="171" x2="290.0" y2="177"/><line class="tick" x1="317.5" y1="168" x2="317.5" y2="180"/><line class="tick" x1="345.0" y1="171" x2="345.0" y2="177"/><line class="tick" x1="372.5" y1="171" x2="372.5" y2="177"/><line class="tick" x1="400.0" y1="171" x2="400.0" y2="177"/><line class="tick" x1="427.5" y1="171" x2="427.5" y2="177"/><line class="tick" x1="455.0" y1="168" x2="455.0" y2="180"/><line class="tick" x1="482.5" y1="171" x2="482.5" y2="177"/><line class="tick" x1="510.0" y1="171" x2="510.0" y2="177"/><line class="tick" x1="537.5" y1="171" x2="537.5" y2="177"/><line class="tick" x1="565.0" y1="171" x2="565.0" y2="177"/><line class="tick" x1="592.5" y1="168" x2="592.5" y2="180"/><line class="tick" x1="620.0" y1="171" x2="620.0" y2="177"/><circle cx="383.5" cy="174.0" r="4.5" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><circle cx="372.5" cy="174.0" r="4.5" fill="var(--paper)" stroke="var(--s)" stroke-width="1.5"/><text class="sub2" x="180" y="200" text-anchor="start">0.74, stored as 0.7;  × (10 ÷ 2)  =  3.50,  error −0.20</text><text class="cap" x="40" y="248" text-anchor="start">s = 4</text><line class="axis" x1="180.0" y1="244" x2="620.0" y2="244"/><line class="tick" x1="180.0" y1="238" x2="180.0" y2="250"/><line class="tick" x1="207.5" y1="241" x2="207.5" y2="247"/><line class="tick" x1="235.0" y1="241" x2="235.0" y2="247"/><line class="tick" x1="262.5" y1="241" x2="262.5" y2="247"/><line class="tick" x1="290.0" y1="241" x2="290.0" y2="247"/><line class="tick" x1="317.5" y1="238" x2="317.5" y2="250"/><line class="tick" x1="345.0" y1="241" x2="345.0" y2="247"/><line class="tick" x1="372.5" y1="241" x2="372.5" y2="247"/><line class="tick" x1="400.0" y1="241" x2="400.0" y2="247"/><line class="tick" x1="427.5" y1="241" x2="427.5" y2="247"/><line class="tick" x1="455.0" y1="238" x2="455.0" y2="250"/><line class="tick" x1="482.5" y1="241" x2="482.5" y2="247"/><line class="tick" x1="510.0" y1="241" x2="510.0" y2="247"/><line class="tick" x1="537.5" y1="241" x2="537.5" y2="247"/><line class="tick" x1="565.0" y1="241" x2="565.0" y2="247"/><line class="tick" x1="592.5" y1="238" x2="592.5" y2="250"/><line class="tick" x1="620.0" y1="241" x2="620.0" y2="247"/><circle cx="587.0" cy="244.0" r="4.5" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><circle cx="592.5" cy="244.0" r="4.5" fill="var(--paper)" stroke="var(--s)" stroke-width="1.5"/><text class="sub2" x="180" y="270" text-anchor="start">1.48, stored as 1.5;  × (10 ÷ 4)  =  3.75,  error +0.05</text><text class="sub2" x="180" y="90" text-anchor="middle">0</text><text class="sub2" x="317.5" y="90" text-anchor="middle">0.5</text><text class="sub2" x="455" y="90" text-anchor="middle">1</text><text class="sub2" x="592.5" y="90" text-anchor="middle">1.5</text><text class="cap" x="40" y="330" text-anchor="start">Amber is the scaled weight, teal the grid point it is stored as. The rounding grid is</text><text class="cap" x="40" y="350" text-anchor="start">fixed by the largest weight in the group, which is elsewhere, so its step stays 0.1.</text><text class="cap" x="40" y="370" text-anchor="start">Multiply this weight by s before rounding and divide its input by s, a division folded</text><text class="cap" x="40" y="390" text-anchor="start">into the layer before, and the product is unchanged; but the rounding error, still at</text><text class="cap" x="40" y="410" text-anchor="start">most half a step, is now divided by s on the way out.</text><text class="cap" x="40" y="450" text-anchor="start">One weight's error wanders, 0.3, 0.2, 0.05 here; across many weights the typical error</text><text class="cap" x="40" y="470" text-anchor="start">falls as step ÷ (s × √12): 0.0289, 0.0144, 0.0072. AWQ, from Ji Lin and colleagues in</text><text class="cap" x="40" y="490" text-anchor="start">the same MIT group, scales the weights whose inputs run largest, because their errors</text><text class="cap" x="40" y="510" text-anchor="start">are multiplied by the most ({{fig:v04-p13}}).</text><text class="cap" x="40" y="550" text-anchor="start">The limit: scale too far and the weight becomes the group's largest, widening the step</text><text class="cap" x="40" y="570" text-anchor="start">for every other weight. On OPT-6.7B the authors found s = 2 best; at s = 4 the step grew</text><text class="cap" x="40" y="590" text-anchor="start">in 21% of groups and accuracy fell back. So AWQ searches for each channel's s, as the</text><text class="cap" x="40" y="610" text-anchor="start">size of its activations to a power between 0 and 1.</text></svg><figcaption>The same trick as SmoothQuant, aimed the other way: spend the grid's precision on the few weights whose inputs make their errors expensive.</figcaption></figure>
