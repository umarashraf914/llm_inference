<figure><div class='ts'>Fig 62 &nbsp;&middot;&nbsp; 11:12</div><h3>What the Hessian is here</h3><svg viewBox="0 0 680 268" role="img"><title>What the Hessian is here</title><g class="u"><rect x="40" y="58" width="250" height="66" rx="8"></rect><text class="lbl" x="165.0" y="82.0" text-anchor="middle" dominant-baseline="central">Calibration data</text><text class="sub" x="165.0" y="100.0" text-anchor="middle" dominant-baseline="central">a few hundred real inputs</text></g><line class="conn" x1="296" y1="91" x2="326" y2="91" marker-end="url(#arw)"></line><g class="s"><rect x="332" y="58" width="308" height="66" rx="8"></rect><text class="lbl" x="486.0" y="82.0" text-anchor="middle" dominant-baseline="central">A statistic of the inputs</text><text class="sub" x="486.0" y="100.0" text-anchor="middle" dominant-baseline="central">for a linear layer, that is all it is</text></g><text class="cap" x="40" y="168" text-anchor="start">An error on a weight matters exactly as much as the input it multiplies. So the second-order</text><text class="cap" x="40" y="188" text-anchor="start">term reduces to something measurable by running a little real data through the model.</text><text class="cap" x="40" y="218" text-anchor="start">No retraining, no gradients, no labels. This is post-training quantization: the model is</text><text class="cap" x="40" y="238" text-anchor="start">finished, and you are only choosing how to write it down.</text></svg><figcaption>The word Hessian suggests training machinery. For a linear layer it is an input covariance, and collecting it takes minutes.</figcaption></figure>
