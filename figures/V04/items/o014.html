<figure><div class='ts'>Fig 14 &nbsp;&middot;&nbsp; 1:12</div><h3>Two codes are spoken for</h3><svg viewBox="0 0 680 310" role="img"><title>Two codes are spoken for</title><text class="hd" x="40" y="46">All 256 codes an eight-bit field can take</text><g class="h"><rect x="60" y="66" width="40" height="36" rx="4"></rect><text class="sub" x="80.0" y="84.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="s"><rect x="104" y="66" width="452" height="36" rx="4"></rect><text class="sub" x="330.0" y="84.0" text-anchor="middle" dominant-baseline="central">1 to 254, the usable exponents</text></g><g class="h"><rect x="560" y="66" width="60" height="36" rx="4"></rect><text class="sub" x="590.0" y="84.0" text-anchor="middle" dominant-baseline="central">255</text></g><text class="sub2" x="60" y="128" text-anchor="start">zero and</text><text class="sub2" x="60" y="148" text-anchor="start">subnormals</text><text class="sub2" x="538" y="128" text-anchor="start">infinity</text><text class="sub2" x="538" y="148" text-anchor="start">and NaN</text><text class="cap" x="40" y="208" text-anchor="start">Two codes are reserved. All-zeros means the value is zero or a subnormal, where the implied</text><text class="cap" x="40" y="228" text-anchor="start">leading bit is 0 instead of 1. All-ones means infinity or not-a-number.</text><text class="cap" x="40" y="268" text-anchor="start">So the usable codes run from 1 to 254, not 0 to 255. That detail matters for the range</text><text class="cap" x="40" y="288" text-anchor="start">arithmetic of {{fig:v04-o015}}.</text></svg><figcaption>The reservations are why the exponent range is not simply the bias in both directions.</figcaption></figure>
