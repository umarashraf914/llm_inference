<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:44</div><h3>A zero-point slides the grid to where the data is</h3><svg viewBox='0 0 680 536' role='img'><title>A zero-point slides the grid to where the data is</title><text class="hd" x="40" y="46">Data from −1 to 6.5, stored in INT4 two ways</text><text class="sub2" x="40" y="94" text-anchor="start">Symmetric, codes −7 to 7, step 6.5 ÷ 7 = 0.929: codes −7 to −2 never used</text><g class="m"><rect x="312.258" y="106" width="256.5" height="8" rx="2"/></g><line class="axis" x1="90.0" y1="120" x2="620.0" y2="120"/><line class="tick" x1="124.2" y1="117" x2="124.2" y2="123"/><line class="tick" x1="155.9" y1="117" x2="155.9" y2="123"/><line class="tick" x1="187.7" y1="117" x2="187.7" y2="123"/><line class="tick" x1="219.4" y1="117" x2="219.4" y2="123"/><line class="tick" x1="251.2" y1="117" x2="251.2" y2="123"/><line class="tick" x1="282.9" y1="117" x2="282.9" y2="123"/><line class="tick" x1="314.7" y1="114" x2="314.7" y2="126"/><line class="tick" x1="346.5" y1="114" x2="346.5" y2="126"/><line class="tick" x1="378.2" y1="114" x2="378.2" y2="126"/><line class="tick" x1="410.0" y1="114" x2="410.0" y2="126"/><line class="tick" x1="441.7" y1="114" x2="441.7" y2="126"/><line class="tick" x1="473.5" y1="114" x2="473.5" y2="126"/><line class="tick" x1="505.2" y1="114" x2="505.2" y2="126"/><line class="tick" x1="537.0" y1="114" x2="537.0" y2="126"/><line class="tick" x1="568.7" y1="114" x2="568.7" y2="126"/><text class="cap" x="40" y="124" text-anchor="start"></text><text class="sub2" x="40" y="194" text-anchor="start">Zero-point, codes 0 to 15, step 7.5 ÷ 15 = 0.5, zero-point z = 2</text><g class="m"><rect x="312.258" y="206" width="256.5" height="8" rx="2"/></g><line class="axis" x1="90.0" y1="220" x2="620.0" y2="220"/><line class="tick" x1="312.3" y1="214" x2="312.3" y2="226"/><line class="tick" x1="329.4" y1="214" x2="329.4" y2="226"/><line class="tick" x1="346.5" y1="214" x2="346.5" y2="226"/><line class="tick" x1="363.5" y1="214" x2="363.5" y2="226"/><line class="tick" x1="380.6" y1="214" x2="380.6" y2="226"/><line class="tick" x1="397.7" y1="214" x2="397.7" y2="226"/><line class="tick" x1="414.8" y1="214" x2="414.8" y2="226"/><line class="tick" x1="431.9" y1="214" x2="431.9" y2="226"/><line class="tick" x1="449.0" y1="214" x2="449.0" y2="226"/><line class="tick" x1="466.1" y1="214" x2="466.1" y2="226"/><line class="tick" x1="483.2" y1="214" x2="483.2" y2="226"/><line class="tick" x1="500.3" y1="214" x2="500.3" y2="226"/><line class="tick" x1="517.4" y1="214" x2="517.4" y2="226"/><line class="tick" x1="534.5" y1="214" x2="534.5" y2="226"/><line class="tick" x1="551.6" y1="214" x2="551.6" y2="226"/><line class="tick" x1="568.7" y1="214" x2="568.7" y2="226"/><text class="cap" x="40" y="224" text-anchor="start"></text><text class="sub2" x="346.452" y="142" text-anchor="middle">0</text><text class="sub2" x="568.71" y="142" text-anchor="middle">6.5</text><text class="sub2" x="312.258" y="242" text-anchor="middle">code 0</text><text class="sub2" x="346.452" y="258" text-anchor="middle">code 2 = 0</text><text class="sub2" x="568.71" y="242" text-anchor="middle">code 15</text><text class="sub2" x="312.258" y="142" text-anchor="middle">−1</text><g class="m"><rect x="60" y="278" width="270" height="42" rx="6"/><text class="sub" x="195.0" y="299.0" text-anchor="middle" dominant-baseline="central">q  =  round(x ÷ s)  +  z</text></g><g class="u"><rect x="350" y="278" width="270" height="42" rx="6"/><text class="sub" x="485.0" y="299.0" text-anchor="middle" dominant-baseline="central">read back  =  s  ×  (q  −  z)</text></g><text class="cap" x="40" y="370" text-anchor="start">A symmetric grid is centred on zero, so data that leans to one side leaves part of it</text><text class="cap" x="40" y="390" text-anchor="start">empty: here only 9 of the 15 codes are ever used. A zero-point, an integer z stored with</text><text class="cap" x="40" y="410" text-anchor="start">the scale, slides the grid so its 16 codes span exactly the data: real 0 lands on code</text><text class="cap" x="40" y="430" text-anchor="start">2, −1 on code 0, 6.5 on code 15, and the step is 1.86 times finer.</text><text class="cap" x="40" y="470" text-anchor="start">Values outside the span are clamped: 7.2 gives round(14.4) + 2 = 16, past the last code,</text><text class="cap" x="40" y="490" text-anchor="start">so it is stored as 15 and read back as 6.5. That is what clamped means in {{fig:v04-o034}}.</text><text class="cap" x="40" y="510" text-anchor="start">The price is a second number per group and one subtraction on every read.</text></svg><figcaption>Symmetric scales suit data centred on zero, such as weights. When the data leans to one side, the zero-point buys back the codes a symmetric grid would leave empty.</figcaption></figure>
