<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:06</div><h3>Where the familiar FP16 numbers come from</h3><svg viewBox='0 0 680 380' role='img'><title>Where the familiar FP16 numbers come from</title><text class="hd" x="40" y="46">FP16 has five exponent bits, so its bias is 15</text><g class="s"><rect x="60" y="70" width="260" height="42" rx="8"/><text class="lbl" x="190.0" y="91.0" text-anchor="middle" dominant-baseline="central">smallest normal = 2¹⁻¹⁵ = 2⁻¹⁴</text></g><g class="s"><rect x="360" y="70" width="260" height="42" rx="8"/><text class="lbl" x="490.0" y="91.0" text-anchor="middle" dominant-baseline="central">largest = (2 − 2⁻¹⁰) × 2¹⁵</text></g><g class="m"><rect x="60" y="128" width="260" height="42" rx="8"/><text class="lbl" x="190.0" y="149.0" text-anchor="middle" dominant-baseline="central">= 0.000061…, or 6.1 × 10⁻⁵</text></g><g class="m"><rect x="360" y="128" width="260" height="42" rx="8"/><text class="lbl" x="490.0" y="149.0" text-anchor="middle" dominant-baseline="central">= 65,504</text></g><text class="cap" x="40" y="214" text-anchor="start">Those two numbers are exactly the window usually quoted for FP16: about six times ten to</text><text class="cap" x="40" y="234" text-anchor="start">the minus five, up to about sixty-five thousand.</text><text class="cap" x="40" y="274" text-anchor="start">They are not measured or looked up. They fall straight out of the bias arithmetic: five</text><text class="cap" x="40" y="294" text-anchor="start">exponent bits, two reserved codes, bias 15. Below the bottom of the window the</text><text class="cap" x="40" y="314" text-anchor="start">subnormals carry on down to 6 × 10⁻⁸, losing bits as they go ({{fig:v04-p04}}).</text><text class="cap" x="40" y="354" text-anchor="start">Change the bias and you move the window. That is all an exponent field ever does.</text></svg><figcaption>A satisfying close: the range figures everyone quotes for a format are a direct consequence of how many exponent bits it has and where the bias puts them.</figcaption></figure>
