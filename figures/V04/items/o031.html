<figure><div class='ts'>Fig 31 &nbsp;&middot;&nbsp; 3:00</div><h3>Where the familiar FP16 numbers come from</h3><svg viewBox="0 0 680 424" role="img"><title>Where the familiar FP16 numbers come from</title><text class="hd" x="40" y="46">FP16 has five exponent bits, so its bias is 15</text><g class="s"><rect x="60" y="70" width="250" height="42" rx="6"></rect><text class="sub" x="185.0" y="91.0" text-anchor="middle" dominant-baseline="central">smallest = 2^(1-15) = 2^-14</text></g><g class="s"><rect x="360" y="70" width="260" height="42" rx="6"></rect><text class="sub" x="490.0" y="91.0" text-anchor="middle" dominant-baseline="central">largest = (2 - 2^-10) x 2^15</text></g><text class="cap" x="40" y="158" text-anchor="start">Smallest normal</text><g class="s"><rect x="280" y="142" width="6" height="30" rx="1"></rect></g><text class="sub2" x="296" y="161" text-anchor="start">0.000061, or 6.1 x 10^-5</text><text class="cap" x="40" y="218" text-anchor="start">Largest</text><g class="s"><rect x="280" y="202" width="300" height="30" rx="3"></rect><text class="sub" x="430.0" y="217.0" text-anchor="middle" dominant-baseline="central">65,504</text></g><text class="cap" x="40" y="282" text-anchor="start">Those two numbers are exactly the window quoted for FP16 in the video: about six times ten to</text><text class="cap" x="40" y="302" text-anchor="start">the minus five, up to about sixty-five thousand.</text><text class="cap" x="40" y="342" text-anchor="start">They are not measured or looked up. They fall straight out of the bias arithmetic: five</text><text class="cap" x="40" y="362" text-anchor="start">exponent bits, two reserved codes, bias 15.</text><text class="cap" x="40" y="402" text-anchor="start">Change the bias and you move the window. That is all an exponent field ever does.</text></svg><figcaption>A satisfying close: the range figures everyone quotes for a format are a direct consequence of how many exponent bits it has and where the bias puts them.</figcaption></figure>
