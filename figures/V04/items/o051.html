<figure><div class='ts'>Fig 51 &nbsp;&middot;&nbsp; 7:48</div><h3>The roofline</h3><svg viewBox="0 0 680 354" role="img"><title>The roofline</title><line class="axis" x1="90" y1="250" x2="620" y2="250"></line><line class="axis" x1="90" y1="50" x2="90" y2="250"></line><polyline class="pl-h" points="90,250 330,110 620,110"></polyline><line class="tick" x1="330" y1="110" x2="330" y2="250"></line><text class="sub2" x="330" y="272" text-anchor="middle">the ridge, just under 300 operations per byte</text><text class="sub2 halo" x="150" y="200" text-anchor="start">memory bound</text><text class="sub2" x="430" y="200" text-anchor="start">compute bound</text><text class="sub2" x="96" y="96" text-anchor="start">compute ceiling</text><text class="cap" x="40" y="312" text-anchor="start">Attainable performance against arithmetic intensity. The curve climbs along the bandwidth</text><text class="cap" x="40" y="332" text-anchor="start">limit, then flattens at the compute ceiling. Where they meet is the ridge.</text></svg><figcaption>Left of the ridge the maths units idle while data trickles in. Right of it they saturate and more bandwidth changes nothing.</figcaption></figure>
