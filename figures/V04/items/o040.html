<figure><div class='ts'>Fig 40 &nbsp;&middot;&nbsp; 5:26</div><h3>No single weight carries much</h3><svg viewBox="0 0 680 210" role="img"><title>No single weight carries much</title><g class="u"><rect x="50" y="55" width="265" height="66" rx="8"></rect><text class="lbl" x="182.5" y="79.0" text-anchor="middle" dominant-baseline="central">Overparameterized</text><text class="sub" x="182.5" y="97.0" text-anchor="middle" dominant-baseline="central">far more weights than the task needs</text></g><g class="s"><rect x="365" y="55" width="265" height="66" rx="8"></rect><text class="lbl" x="497.5" y="79.0" text-anchor="middle" dominant-baseline="central">So rounding one</text><text class="sub" x="497.5" y="97.0" text-anchor="middle" dominant-baseline="central">moves the output barely at all</text></g><text class="cap" x="40" y="162" text-anchor="start">Redundancy is usually described as waste. Here it is the property that makes the entire</text><text class="cap" x="40" y="182" text-anchor="start">technique possible.</text></svg><figcaption>This claim returns near the end as the explanation for why very large models quantize better than small ones.</figcaption></figure>
