<figure><div class='ts'>Fig 43 &nbsp;&middot;&nbsp; 5:35</div><h3>Why the errors do not accumulate</h3><svg viewBox="0 0 680 378" role="img"><title>Why the errors do not accumulate</title><text class="hd" x="40" y="46">Independent errors</text><line class="axis" x1="70" y1="106" x2="340" y2="106"></line><line class="conn" x1="80" y1="106" x2="80" y2="86" marker-end="url(#arw)"></line><line class="conn" x1="105" y1="106" x2="105" y2="86" marker-end="url(#arw)"></line><line class="conn" x1="130" y1="106" x2="130" y2="126" marker-end="url(#arw)"></line><line class="conn" x1="155" y1="106" x2="155" y2="86" marker-end="url(#arw)"></line><line class="conn" x1="180" y1="106" x2="180" y2="126" marker-end="url(#arw)"></line><line class="conn" x1="205" y1="106" x2="205" y2="86" marker-end="url(#arw)"></line><line class="conn" x1="230" y1="106" x2="230" y2="86" marker-end="url(#arw)"></line><line class="conn" x1="255" y1="106" x2="255" y2="126" marker-end="url(#arw)"></line><line class="conn" x1="280" y1="106" x2="280" y2="126" marker-end="url(#arw)"></line><line class="conn" x1="305" y1="106" x2="305" y2="86" marker-end="url(#arw)"></line><line class="conn" x1="330" y1="106" x2="330" y2="126" marker-end="url(#arw)"></line><text class="hd" x="370" y="46">Correlated errors</text><line class="axis" x1="400" y1="106" x2="640" y2="106"></line><line class="conn" x1="410" y1="106" x2="410" y2="84" marker-end="url(#arw)"></line><line class="conn" x1="435" y1="106" x2="435" y2="84" marker-end="url(#arw)"></line><line class="conn" x1="460" y1="106" x2="460" y2="84" marker-end="url(#arw)"></line><line class="conn" x1="485" y1="106" x2="485" y2="84" marker-end="url(#arw)"></line><line class="conn" x1="510" y1="106" x2="510" y2="84" marker-end="url(#arw)"></line><line class="conn" x1="535" y1="106" x2="535" y2="84" marker-end="url(#arw)"></line><line class="conn" x1="560" y1="106" x2="560" y2="84" marker-end="url(#arw)"></line><line class="conn" x1="585" y1="106" x2="585" y2="84" marker-end="url(#arw)"></line><line class="conn" x1="610" y1="106" x2="610" y2="84" marker-end="url(#arw)"></line><line class="conn" x1="635" y1="106" x2="635" y2="84" marker-end="url(#arw)"></line><text class="cap" x="40" y="176" text-anchor="start">Inside a weighted sum of n terms, independent errors partly cancel and the total grows like</text><text class="cap" x="40" y="196" text-anchor="start">the square root of n. Correlated errors all push the same way and the total grows like n.</text><text class="cap" x="40" y="236" text-anchor="start">For a layer with 4,096 inputs</text><g class="s"><rect x="300" y="220" width="40" height="26" rx="3"></rect></g><text class="sub2" x="348" y="239" text-anchor="start">independent: about 64 units of error</text><g class="h"><rect x="300" y="256" width="300" height="26" rx="3"></rect></g><text class="sub2" x="348" y="275" text-anchor="start">correlated: about 4,096</text><text class="cap" x="40" y="328" text-anchor="start">A factor of sixty-four, from nothing but whether the errors happen to agree with each other.</text><text class="cap" x="40" y="356" text-anchor="start">Rounding produces independent errors. That is the whole reason quantization is survivable.</text></svg><figcaption>The square root is doing all the work. Had every nudge pushed the same way they would pile up and break the model.</figcaption></figure>
