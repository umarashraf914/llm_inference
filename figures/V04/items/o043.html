<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:49</div><h3>Why the errors do not accumulate</h3><svg viewBox='0 0 680 472' role='img'><title>Why the errors do not accumulate</title><text class="hd" x="40" y="46">Independent errors</text><text class="hd" x="370" y="46">Correlated errors</text><line class="axis" x1="70.0" y1="106" x2="340.0" y2="106"/><line class="conn" x1="80" y1="106" x2="80" y2="86" marker-end="url(#arw)"/><line class="conn" x1="105" y1="106" x2="105" y2="86" marker-end="url(#arw)"/><line class="conn" x1="130" y1="106" x2="130" y2="126" marker-end="url(#arw)"/><line class="conn" x1="155" y1="106" x2="155" y2="86" marker-end="url(#arw)"/><line class="conn" x1="180" y1="106" x2="180" y2="126" marker-end="url(#arw)"/><line class="conn" x1="205" y1="106" x2="205" y2="86" marker-end="url(#arw)"/><line class="conn" x1="230" y1="106" x2="230" y2="86" marker-end="url(#arw)"/><line class="conn" x1="255" y1="106" x2="255" y2="126" marker-end="url(#arw)"/><line class="conn" x1="280" y1="106" x2="280" y2="126" marker-end="url(#arw)"/><line class="conn" x1="305" y1="106" x2="305" y2="86" marker-end="url(#arw)"/><line class="conn" x1="330" y1="106" x2="330" y2="126" marker-end="url(#arw)"/><line class="axis" x1="400.0" y1="106" x2="640.0" y2="106"/><line class="conn" x1="410" y1="106" x2="410" y2="84" marker-end="url(#arw)"/><line class="conn" x1="435" y1="106" x2="435" y2="84" marker-end="url(#arw)"/><line class="conn" x1="460" y1="106" x2="460" y2="84" marker-end="url(#arw)"/><line class="conn" x1="485" y1="106" x2="485" y2="84" marker-end="url(#arw)"/><line class="conn" x1="510" y1="106" x2="510" y2="84" marker-end="url(#arw)"/><line class="conn" x1="535" y1="106" x2="535" y2="84" marker-end="url(#arw)"/><line class="conn" x1="560" y1="106" x2="560" y2="84" marker-end="url(#arw)"/><line class="conn" x1="585" y1="106" x2="585" y2="84" marker-end="url(#arw)"/><line class="conn" x1="610" y1="106" x2="610" y2="84" marker-end="url(#arw)"/><line class="conn" x1="635" y1="106" x2="635" y2="84" marker-end="url(#arw)"/><text class="hd" x="40" y="186" text-anchor="start">Total error in a layer with 4,096 inputs, to scale</text><text class="cap" x="40" y="220" text-anchor="start">independent</text><g class="s"><rect x="170" y="204" width="4.7" height="24" rx="1"/></g><text class="sub2" x="184.688" y="221" text-anchor="start">about 64 units, √4,096</text><text class="cap" x="40" y="258" text-anchor="start">correlated</text><g class="h"><rect x="170" y="242" width="300.0" height="24" rx="2"/></g><text class="sub2" x="480" y="259" text-anchor="start">4,096 units</text><text class="cap" x="40" y="306" text-anchor="start">The unit is one term's typical error: a weight's rounding error times its input</text><text class="cap" x="40" y="326" text-anchor="start">({{fig:v04-p13}}). Inside a weighted sum of n terms, independent errors partly cancel</text><text class="cap" x="40" y="346" text-anchor="start">and the total grows like the square root of n ({{fig:v04-p14}}). Correlated errors all</text><text class="cap" x="40" y="366" text-anchor="start">push the same way and the total grows like n.</text><text class="cap" x="40" y="406" text-anchor="start">For 4,096 inputs that is 64 units against 4,096, a factor of 64, from nothing but</text><text class="cap" x="40" y="426" text-anchor="start">whether the errors happen to agree. Rounding produces independent errors, and that is</text><text class="cap" x="40" y="446" text-anchor="start">why quantization is survivable. The bars are to scale: the short one is 4.7 pixels long.</text></svg><figcaption>The square root is doing all the work. Had every nudge pushed the same way they would pile up and break the model.</figcaption></figure>
