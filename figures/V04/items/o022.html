<figure><div class='ts'>Fig 22 &nbsp;&middot;&nbsp; 1:30</div><h3>Why the gaps grow with magnitude</h3><svg viewBox="0 0 680 436" role="img"><title>Why the gaps grow with magnitude</title><text class="hd" x="40" y="44">The same format, at three magnitudes</text><text class="sub2" x="40" y="94" text-anchor="start">near 0.5</text><line class="axis" x1="150" y1="90" x2="470" y2="90"></line><line class="tick" x1="150" y1="83" x2="150" y2="97"></line><line class="tick" x1="190" y1="83" x2="190" y2="97"></line><line class="tick" x1="230" y1="83" x2="230" y2="97"></line><line class="tick" x1="270" y1="83" x2="270" y2="97"></line><line class="tick" x1="310" y1="83" x2="310" y2="97"></line><line class="tick" x1="350" y1="83" x2="350" y2="97"></line><line class="tick" x1="390" y1="83" x2="390" y2="97"></line><line class="tick" x1="430" y1="83" x2="430" y2="97"></line><line class="tick" x1="470" y1="83" x2="470" y2="97"></line><text class="sub2" x="486" y="94" text-anchor="start">gap = 2^-1 x 2^-7</text><text class="sub2" x="40" y="156" text-anchor="start">near 4</text><line class="axis" x1="150" y1="152" x2="470" y2="152"></line><line class="tick" x1="150" y1="145" x2="150" y2="159"></line><line class="tick" x1="190" y1="145" x2="190" y2="159"></line><line class="tick" x1="230" y1="145" x2="230" y2="159"></line><line class="tick" x1="270" y1="145" x2="270" y2="159"></line><line class="tick" x1="310" y1="145" x2="310" y2="159"></line><line class="tick" x1="350" y1="145" x2="350" y2="159"></line><line class="tick" x1="390" y1="145" x2="390" y2="159"></line><line class="tick" x1="430" y1="145" x2="430" y2="159"></line><line class="tick" x1="470" y1="145" x2="470" y2="159"></line><text class="sub2" x="486" y="156" text-anchor="start">gap = 2^2 x 2^-7</text><text class="sub2" x="40" y="218" text-anchor="start">near 32</text><line class="axis" x1="150" y1="214" x2="470" y2="214"></line><line class="tick" x1="150" y1="207" x2="150" y2="221"></line><line class="tick" x1="190" y1="207" x2="190" y2="221"></line><line class="tick" x1="230" y1="207" x2="230" y2="221"></line><line class="tick" x1="270" y1="207" x2="270" y2="221"></line><line class="tick" x1="310" y1="207" x2="310" y2="221"></line><line class="tick" x1="350" y1="207" x2="350" y2="221"></line><line class="tick" x1="390" y1="207" x2="390" y2="221"></line><line class="tick" x1="430" y1="207" x2="430" y2="221"></line><line class="tick" x1="470" y1="207" x2="470" y2="221"></line><text class="sub2" x="486" y="218" text-anchor="start">gap = 2^5 x 2^-7</text><text class="cap" x="40" y="294" text-anchor="start">Each panel is a window of eight neighbouring BF16 values, out of the 128 that its seven</text><text class="cap" x="40" y="314" text-anchor="start">mantissa bits give every power of two. The steps are equal inside a window, but each window</text><text class="cap" x="40" y="334" text-anchor="start">is eight times wider than the one above: the relative precision is constant, while the</text><text class="cap" x="40" y="354" text-anchor="start">absolute gap scales with the exponent.</text><text class="cap" x="40" y="394" text-anchor="start">Floats are therefore not evenly spaced. They crowd near zero and spread apart as magnitudes</text><text class="cap" x="40" y="414" text-anchor="start">grow, like the ticks on a logarithmic ruler.</text></svg><figcaption>This non-uniform spacing is the property that makes floats a good match for some data and a poor one for others.</figcaption></figure>
