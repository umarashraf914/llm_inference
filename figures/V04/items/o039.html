<figure><div class='ts'>Fig 39 &nbsp;&middot;&nbsp; 5:10</div><h3>That was a training story</h3><svg viewBox="0 0 680 232" role="img"><title>That was a training story</title><g class="u"><rect x="50" y="58" width="265" height="70" rx="8"></rect><text class="lbl" x="182.5" y="76.0" text-anchor="middle" dominant-baseline="central">Training</text><text class="sub" x="182.5" y="94.0" text-anchor="middle" dominant-baseline="central">gradients exist,</text><text class="sub" x="182.5" y="111.0" text-anchor="middle" dominant-baseline="central">so underflow does</text></g><g class="s"><rect x="365" y="58" width="265" height="70" rx="8"></rect><text class="lbl" x="497.5" y="76.0" text-anchor="middle" dominant-baseline="central">Inference</text><text class="sub" x="497.5" y="94.0" text-anchor="middle" dominant-baseline="central">no gradients,</text><text class="sub" x="497.5" y="111.0" text-anchor="middle" dominant-baseline="central">so no underflow</text></g><text class="cap" x="40" y="176" text-anchor="start">At inference there are no gradients, so the failure that forces loss scaling never happens, and</text><text class="cap" x="40" y="196" text-anchor="start">FP16 is a common serving format.</text><text class="cap" x="40" y="224" text-anchor="start">Worth checking, whenever you have absorbed a rule about numerics, whether its premise holds.</text></svg><figcaption>Easy to carry the BF16-is-better conclusion into inference, where the argument for it does not apply.</figcaption></figure>
