<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:08</div><h3>Two weights fed the same input: round one, and the other can pay it back</h3><svg viewBox='0 0 680 632' role='img'><title>Two weights fed the same input: round one, and the other can pay it back</title><text class="hd" x="40" y="46">Two weights of 0.4, rounded to whole numbers; the two inputs are always equal</text><text class="sub2" x="40" y="82" text-anchor="start">Round both to the nearest</text><text class="cap" x="40" y="122" text-anchor="start">w₁</text><line class="axis" x1="80.0" y1="118" x2="310.0" y2="118"/><line class="tick" x1="112.9" y1="110" x2="112.9" y2="126"/><text class="sub2" x="112.857" y="142" text-anchor="middle">0</text><line class="tick" x1="277.1" y1="110" x2="277.1" y2="126"/><text class="sub2" x="277.143" y="142" text-anchor="middle">1</text><circle cx="178.6" cy="118.0" r="4.5" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><line class="conn" x1="171.5714285714286" y1="104" x2="118.85714285714286" y2="104" marker-end="url(#arw)"/><text class="cap" x="40" y="178" text-anchor="start">w₂</text><line class="axis" x1="80.0" y1="174" x2="310.0" y2="174"/><line class="tick" x1="112.9" y1="166" x2="112.9" y2="182"/><text class="sub2" x="112.857" y="198" text-anchor="middle">0</text><line class="tick" x1="277.1" y1="166" x2="277.1" y2="182"/><text class="sub2" x="277.143" y="198" text-anchor="middle">1</text><circle cx="178.6" cy="174.0" r="4.5" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><line class="conn" x1="171.5714285714286" y1="160" x2="118.85714285714286" y2="160" marker-end="url(#arw)"/><text class="sub2" x="40" y="230" text-anchor="start">both errors −0.4</text><text class="sub2" x="360" y="82" text-anchor="start">GPTQ: round one, nudge the other</text><text class="cap" x="360" y="122" text-anchor="start">w₁</text><line class="axis" x1="400.0" y1="118" x2="630.0" y2="118"/><line class="tick" x1="432.9" y1="110" x2="432.9" y2="126"/><text class="sub2" x="432.857" y="142" text-anchor="middle">0</text><line class="tick" x1="597.1" y1="110" x2="597.1" y2="126"/><text class="sub2" x="597.143" y="142" text-anchor="middle">1</text><circle cx="498.6" cy="118.0" r="4.5" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><line class="conn" x1="491.5714285714286" y1="104" x2="438.8571428571429" y2="104" marker-end="url(#arw)"/><text class="cap" x="360" y="178" text-anchor="start">w₂</text><line class="axis" x1="400.0" y1="174" x2="630.0" y2="174"/><line class="tick" x1="432.9" y1="166" x2="432.9" y2="182"/><text class="sub2" x="432.857" y="198" text-anchor="middle">0</text><line class="tick" x1="597.1" y1="166" x2="597.1" y2="182"/><text class="sub2" x="597.143" y="198" text-anchor="middle">1</text><circle cx="498.6" cy="174.0" r="4.5" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5"/><line class="conn" x1="505.5714285714286" y1="160" x2="559.2857142857142" y2="160" marker-end="url(#arw)"/><circle cx="564.3" cy="174.0" r="4" fill="var(--paper)" stroke="var(--s)" stroke-width="1.5"/><line class="conn" x1="570.2857142857142" y1="160" x2="591.1428571428571" y2="160" marker-end="url(#arw)"/><text class="sub2" x="360" y="230" text-anchor="start">w₂ nudged to 0.8, then rounded</text><text class="cap" x="40" y="270" text-anchor="start">calibration input x</text><text class="sub2" x="200" y="270" text-anchor="middle">1</text><text class="sub2" x="270" y="270" text-anchor="middle">2</text><text class="sub2" x="340" y="270" text-anchor="middle">−1</text><text class="sub2" x="410" y="270" text-anchor="middle">0.5</text><text class="sub2" x="520" y="270" text-anchor="start">mean square</text><text class="cap" x="40" y="296" text-anchor="start">output error, nearest</text><text class="sub2" x="200" y="296" text-anchor="middle">−0.8</text><text class="sub2" x="270" y="296" text-anchor="middle">−1.6</text><text class="sub2" x="340" y="296" text-anchor="middle">+0.8</text><text class="sub2" x="410" y="296" text-anchor="middle">−0.4</text><text class="sub2" x="520" y="296" text-anchor="start">1</text><text class="cap" x="40" y="320" text-anchor="start">output error, GPTQ</text><text class="sub2" x="200" y="320" text-anchor="middle">+0.2</text><text class="sub2" x="270" y="320" text-anchor="middle">+0.4</text><text class="sub2" x="340" y="320" text-anchor="middle">−0.2</text><text class="sub2" x="410" y="320" text-anchor="middle">+0.1</text><text class="sub2" x="520" y="320" text-anchor="start">0.0625</text><text class="cap" x="40" y="383" text-anchor="start">nearest</text><g class="h"><rect x="150" y="366" width="300.0" height="24" rx="2"/></g><text class="sub2" x="460" y="383" text-anchor="start">1</text><text class="cap" x="40" y="417" text-anchor="start">GPTQ</text><g class="s"><rect x="150" y="400" width="18.7" height="24" rx="2"/></g><text class="sub2" x="178.75" y="417" text-anchor="start">0.0625, 16 times smaller</text><text class="cap" x="40" y="466" text-anchor="start">The output is w₁ × x₁ + w₂ × x₂, and here x₂ always equals x₁. So a change to w₂ moves</text><text class="cap" x="40" y="486" text-anchor="start">the output exactly as a change to w₁ would ({{fig:v04-p13}}). Once w₁ has been rounded down</text><text class="cap" x="40" y="506" text-anchor="start">by 0.4, raising w₂ by 0.4 cancels that damage completely; w₂ is then rounded itself, to</text><text class="cap" x="40" y="526" text-anchor="start">1, which leaves an error of +0.2 per unit of input instead of −0.8.</text><text class="cap" x="40" y="566" text-anchor="start">GPTQ judges the damage over real inputs: run the calibration inputs through, square each</text><text class="cap" x="40" y="586" text-anchor="start">output error and average. Rounding both weights to the nearest whole number scores 1;</text><text class="cap" x="40" y="606" text-anchor="start">rounding the first and paying its error forward scores 0.0625. The bars are to scale.</text></svg><figcaption>Compensation works because the two inputs move together. When they do not, nudging the second weight cannot help, and the next figure measures how much it helps in between.</figcaption></figure>
