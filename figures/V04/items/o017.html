<figure><div class='ts'>Fig 17 &nbsp;&middot;&nbsp; 1:12</div><h3>Encoding 6.5, every step</h3><svg viewBox="0 0 680 464" role="img"><title>Encoding 6.5, every step</title><text class="sub2" x="40" y="66" text-anchor="start">Start</text><g class="u"><rect x="370" y="46" width="268" height="40" rx="5"></rect><text class="sub" x="504.0" y="66.0" text-anchor="middle" dominant-baseline="central">6.5</text></g><line class="conn" x1="504" y1="88" x2="504" y2="98" marker-end="url(#arw)"></line><text class="sub2" x="40" y="122" text-anchor="start">In binary</text><g class="u"><rect x="370" y="102" width="268" height="40" rx="5"></rect><text class="sub" x="504.0" y="122.0" text-anchor="middle" dominant-baseline="central">110.1</text></g><line class="conn" x1="504" y1="144" x2="504" y2="154" marker-end="url(#arw)"></line><text class="sub2" x="40" y="178" text-anchor="start">Normalise</text><g class="m"><rect x="370" y="158" width="268" height="40" rx="5"></rect><text class="sub" x="504.0" y="178.0" text-anchor="middle" dominant-baseline="central">1.101 x 2^2</text></g><line class="conn" x1="504" y1="200" x2="504" y2="210" marker-end="url(#arw)"></line><text class="sub2" x="40" y="234" text-anchor="start">Read off the fields</text><g class="s"><rect x="370" y="214" width="268" height="40" rx="5"></rect><text class="sub" x="504.0" y="234.0" text-anchor="middle" dominant-baseline="central">sign 0   exponent 2   significand 1.101</text></g><text class="hd" x="40" y="298">Stored as FP16</text><g class="u"><rect x="40" y="314" width="40" height="40" rx="4"></rect><text class="sub" x="60.0" y="334.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="h"><rect x="86" y="314" width="130" height="40" rx="4"></rect><text class="sub" x="151.0" y="334.0" text-anchor="middle" dominant-baseline="central">10001</text></g><g class="s"><rect x="222" y="314" width="300" height="40" rx="4"></rect><text class="sub" x="372.0" y="334.0" text-anchor="middle" dominant-baseline="central">1010000000</text></g><text class="sub2" x="40" y="376" text-anchor="start">sign</text><text class="sub2" x="86" y="376" text-anchor="start">exponent: 2 plus the bias of 15</text><text class="sub2" x="300" y="376" text-anchor="start">mantissa: the 101, padded</text><text class="cap" x="40" y="414" text-anchor="start">Check it: 1.101 in binary is 1 + 0.5 + 0 + 0.125 = 1.625, and 1.625 x 4 = 6.5.</text><text class="cap" x="40" y="442" text-anchor="start">The leading 1 of 1.101 appears nowhere in the stored bits. Only the 101 survives.</text></svg><figcaption>Ten mantissa bits, so 101 is padded with seven zeros. Work through this once and floats stop being mysterious.</figcaption></figure>
