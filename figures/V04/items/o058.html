<figure><div class='ts'>Fig 58 &nbsp;&middot;&nbsp; 10:20</div><h3>Why four-bit is not four times smaller</h3><svg viewBox="0 0 680 415" role="img"><title>Why four-bit is not four times smaller</title><g class="m"><rect x="90" y="46" width="500" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">bytes per weight  =  0.5  +  (scale bytes / group size)</text></g><text class="cap" x="40" y="138" text-anchor="start">group of 16</text><g class="h"><rect x="190" y="120" width="262.5" height="30" rx="3"></rect><text class="sub" x="321.25" y="135.0" text-anchor="middle" dominant-baseline="central">0.625 bytes</text></g><text class="sub2" x="462.5" y="138" text-anchor="start">3.20x smaller than FP16</text><text class="cap" x="40" y="182" text-anchor="start">group of 32</text><g class="h"><rect x="190" y="164" width="236.25" height="30" rx="3"></rect><text class="sub" x="308.125" y="179.0" text-anchor="middle" dominant-baseline="central">0.5625 bytes</text></g><text class="sub2" x="436.25" y="182" text-anchor="start">3.56x smaller than FP16</text><text class="cap" x="40" y="226" text-anchor="start">group of 64</text><g class="s"><rect x="190" y="208" width="223.104" height="30" rx="3"></rect><text class="sub" x="301.552" y="223.0" text-anchor="middle" dominant-baseline="central">0.5312 bytes</text></g><text class="sub2" x="423.10400000000004" y="226" text-anchor="start">3.76x smaller than FP16</text><text class="cap" x="40" y="270" text-anchor="start">group of 128</text><g class="s"><rect x="190" y="252" width="216.55199999999996" height="30" rx="3"></rect><text class="sub" x="298.27599999999995" y="267.0" text-anchor="middle" dominant-baseline="central">0.5156 bytes</text></g><text class="sub2" x="416.55199999999996" y="270" text-anchor="start">3.88x smaller than FP16</text><text class="cap" x="40" y="323" text-anchor="start">Four-bit weights are half a byte each, but every group also stores its own scale, typically an</text><text class="cap" x="40" y="343" text-anchor="start">FP16 number. Smaller groups contain outliers better and cost more overhead.</text><text class="cap" x="40" y="373" text-anchor="start">So four-bit quantization is never quite four times smaller. At a group size of 128 it is 3.88x;</text><text class="cap" x="40" y="393" text-anchor="start">at 16 it drops to 3.2x. Asymmetric schemes storing a zero-point too pay again.</text></svg><figcaption>The scales have to live somewhere. This is the arithmetic behind the group-size choice, and the reason published compression ratios rarely hit the round number.</figcaption></figure>
