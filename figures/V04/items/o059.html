<figure><div class='ts'>Fig 59 &nbsp;&middot;&nbsp; 10:50</div><h3>The baseline everything is measured against</h3><svg viewBox="0 0 680 286" role="img"><title>The baseline everything is measured against</title><g class="u"><rect x="50" y="55" width="265" height="66" rx="8"></rect><text class="lbl" x="182.5" y="79.0" text-anchor="middle" dominant-baseline="central">Round to nearest</text><text class="sub" x="182.5" y="97.0" text-anchor="middle" dominant-baseline="central">no data, no analysis, no cost</text></g><g class="h"><rect x="365" y="55" width="265" height="66" rx="8"></rect><text class="lbl" x="497.5" y="79.0" text-anchor="middle" dominant-baseline="central">Holds at 8 bits</text><text class="sub" x="497.5" y="97.0" text-anchor="middle" dominant-baseline="central">degrades at 4, collapses at 3</text></g><text class="cap" x="40" y="164" text-anchor="start">Simply rounding each weight to the closest representable value is the null method. It</text><text class="cap" x="40" y="184" text-anchor="start">holds at eight bits, degrades at four and collapses at three. Measured by Frantar and</text><text class="cap" x="40" y="204" text-anchor="start">colleagues on OPT-175B: perplexity 8.34 in FP16, 10.54 rounded to 4 bits, about</text><text class="cap" x="40" y="224" text-anchor="start">7,300 at 3 bits.</text><text class="cap" x="40" y="264" text-anchor="start">Everything below exists because of that last step.</text></svg><figcaption>Useful as a mental anchor. Each method that follows buys accuracy with either calibration data, extra arithmetic, or stored side information.</figcaption></figure>
