<figure><div class='ts'>Fig 59 &nbsp;&middot;&nbsp; 10:50</div><h3>The baseline everything is measured against</h3><svg viewBox="0 0 680 218" role="img"><title>The baseline everything is measured against</title><g class="u"><rect x="50" y="55" width="265" height="66" rx="8"></rect><text class="lbl" x="182.5" y="79.0" text-anchor="middle" dominant-baseline="central">Round to nearest</text><text class="sub" x="182.5" y="97.0" text-anchor="middle" dominant-baseline="central">no data, no analysis, no cost</text></g><g class="h"><rect x="365" y="55" width="265" height="66" rx="8"></rect><text class="lbl" x="497.5" y="79.0" text-anchor="middle" dominant-baseline="central">Works to 8 bits</text><text class="sub" x="497.5" y="97.0" text-anchor="middle" dominant-baseline="central">falls apart below</text></g><text class="cap" x="40" y="164" text-anchor="start">Simply rounding each weight to the closest representable value is the null method. Everything</text><text class="cap" x="40" y="184" text-anchor="start">below exists because it stops working somewhere around four bits.</text></svg><figcaption>Useful as a mental anchor. Each method that follows buys accuracy with either calibration data, extra arithmetic, or stored side information.</figcaption></figure>
