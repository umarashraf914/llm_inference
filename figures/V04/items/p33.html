<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 16:38</div><h3>NVFP4's second scale exists because FP8 cannot reach every block</h3><svg viewBox='0 0 680 542' role='img'><title>NVFP4's second scale exists because FP8 cannot reach every block</title><text class="hd" x="40" y="30">Block scales on a log axis: E4M3 can hold only the shaded window</text><g class="u"><rect x="210.769" y="62" width="64.6" height="28" rx="2"/></g><g class="s"><rect x="275.385" y="62" width="318.9" height="28" rx="2"/></g><text class="sub2" x="243.077" y="54" text-anchor="middle">fewer digits</text><text class="sub2" x="434.848" y="81" text-anchor="middle">E4M3 at full precision: 2⁻⁶ to 448</text><line class="axis" x1="60.0" y1="96" x2="620.0" y2="96"/><line class="tick" x1="60.0" y1="96" x2="60.0" y2="101"/><text class="sub2" x="60" y="115" text-anchor="middle">2⁻¹⁶</text><line class="tick" x1="103.1" y1="96" x2="103.1" y2="101"/><text class="sub2" x="103.077" y="115" text-anchor="middle">2⁻¹⁴</text><line class="tick" x1="146.2" y1="96" x2="146.2" y2="101"/><text class="sub2" x="146.154" y="115" text-anchor="middle">2⁻¹²</text><line class="tick" x1="189.2" y1="96" x2="189.2" y2="101"/><text class="sub2" x="189.231" y="115" text-anchor="middle">2⁻¹⁰</text><line class="tick" x1="232.3" y1="96" x2="232.3" y2="101"/><text class="sub2" x="232.308" y="115" text-anchor="middle">2⁻⁸</text><line class="tick" x1="275.4" y1="96" x2="275.4" y2="101"/><text class="sub2" x="275.385" y="115" text-anchor="middle">2⁻⁶</text><line class="tick" x1="318.5" y1="96" x2="318.5" y2="101"/><text class="sub2" x="318.462" y="115" text-anchor="middle">2⁻⁴</text><line class="tick" x1="361.5" y1="96" x2="361.5" y2="101"/><text class="sub2" x="361.538" y="115" text-anchor="middle">2⁻²</text><line class="tick" x1="404.6" y1="96" x2="404.6" y2="101"/><text class="sub2" x="404.615" y="115" text-anchor="middle">2⁰</text><line class="tick" x1="447.7" y1="96" x2="447.7" y2="101"/><text class="sub2" x="447.692" y="115" text-anchor="middle">2²</text><line class="tick" x1="490.8" y1="96" x2="490.8" y2="101"/><text class="sub2" x="490.769" y="115" text-anchor="middle">2⁴</text><line class="tick" x1="533.8" y1="96" x2="533.8" y2="101"/><text class="sub2" x="533.846" y="115" text-anchor="middle">2⁶</text><line class="tick" x1="576.9" y1="96" x2="576.9" y2="101"/><text class="sub2" x="576.923" y="115" text-anchor="middle">2⁸</text><line class="tick" x1="620.0" y1="96" x2="620.0" y2="101"/><text class="sub2" x="620" y="115" text-anchor="middle">2¹⁰</text><text class="sub2" x="40" y="150" text-anchor="start">a tensor's block scales: its blocks' largest values, 0.0005 to 0.5, each ÷ 6</text><g class="h"><rect x="112.753" y="160" width="98.0" height="18" rx="2"/></g><g class="m"><rect x="210.769" y="160" width="116.6" height="18" rx="2"/></g><text class="sub2" x="116.753" y="194" text-anchor="start">below 2⁻⁹: stored as 0</text><text class="sub2" x="40" y="224" text-anchor="start">the same scales × the tensor's FP32 factor, 6 × 448 ÷ 0.5 = 5,376</text><g class="s"><rect x="379.665" y="234" width="214.6" height="18" rx="2"/></g><text class="sub2" x="373.665" y="248" text-anchor="end">0.448</text><text class="sub2" x="600.312" y="248" text-anchor="start">448</text><text class="cap" x="40" y="296" text-anchor="start">An E4M3 number reaches from 2⁻⁹, its smallest, to 448, its largest: 448 ÷ 2⁻⁹ = 229,376,</text><text class="cap" x="40" y="316" text-anchor="start">about 2¹⁷·⁸. Below 2⁻⁶ it runs out of exponent and keeps fewer digits ({{fig:v04-p04}}),</text><text class="cap" x="40" y="336" text-anchor="start">so full precision spans 2⁻⁶ to 448, about 2¹⁴·⁸.</text><text class="cap" x="40" y="376" text-anchor="start">A tensor's block scales need not sit in that window. In this example the blocks' largest</text><text class="cap" x="40" y="396" text-anchor="start">values run from 0.0005 to 0.5, so their scales run from 0.000083 to 0.083. The smallest</text><text class="cap" x="40" y="416" text-anchor="start">fall below 2⁻⁹ and would be stored as 0, and every value in those blocks read back as 0.</text><text class="cap" x="40" y="456" text-anchor="start">So NVFP4 first multiplies the whole tensor by one FP32 number. cuBLAS uses 6 × 448 ÷ the</text><text class="cap" x="40" y="476" text-anchor="start">tensor's largest value, 5,376 here, which puts the largest block's scale exactly at 448</text><text class="cap" x="40" y="496" text-anchor="start">and slides every other scale up by the same factor, here to between 0.448 and 448. MXFP4</text><text class="cap" x="40" y="516" text-anchor="start">needs no such help: an E8M0 scale's 8 exponent bits reach from 2⁻¹²⁷ to 2¹²⁷.</text></svg><figcaption>Precision in the block scale costs range, and one number per tensor buys the range back.</figcaption></figure>
