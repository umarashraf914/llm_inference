<figure><div class='ts'>Fig 79 &nbsp;&middot;&nbsp; 17:42</div><h3>Two cautions</h3><svg viewBox="0 0 680 248" role="img"><title>Two cautions</title><g class="h"><rect x="40" y="58" width="285" height="84" rx="8"></rect><text class="lbl" x="182.5" y="83.0" text-anchor="middle" dominant-baseline="central">The redundancy explanation</text><text class="sub" x="182.5" y="101.0" text-anchor="middle" dominant-baseline="central">is plausible, but nobody</text><text class="sub" x="182.5" y="118.0" text-anchor="middle" dominant-baseline="central">has measured it directly</text></g><g class="h"><rect x="368" y="58" width="272" height="84" rx="8"></rect><text class="lbl" x="504.0" y="83.0" text-anchor="middle" dominant-baseline="central">Many four-bit numbers</text><text class="sub" x="504.0" y="101.0" text-anchor="middle" dominant-baseline="central">come from vendor benchmarks,</text><text class="sub" x="504.0" y="118.0" text-anchor="middle" dominant-baseline="central">reproductions are scarce</text></g><text class="cap" x="40" y="186" text-anchor="start">Both of these sit underneath the headline result of {{fig:v04-o077}}, and neither is settled.</text><text class="cap" x="40" y="226" text-anchor="start">Treat published near-lossless figures as upper bounds, not guarantees.</text></svg><figcaption>Worth taking seriously. The four-bit story is genuinely good and genuinely less established than the round numbers suggest.</figcaption></figure>
