<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 18:29</div><h3>Match the format to the silicon</h3><svg viewBox='0 0 680 404' role='img'><title>Match the format to the silicon</title><g class="s"><rect x="40" y="58" width="190" height="74" rx="8"/><text class="lbl" x="135.0" y="86.0" text-anchor="middle" dominant-baseline="central">FP8</text><text class="sub" x="135.0" y="104.0" text-anchor="middle" dominant-baseline="central">Hopper, Ada and newer</text></g><g class="s"><rect x="246" y="58" width="190" height="74" rx="8"/><text class="lbl" x="341.0" y="86.0" text-anchor="middle" dominant-baseline="central">NVFP4</text><text class="sub" x="341.0" y="104.0" text-anchor="middle" dominant-baseline="central">Blackwell only</text></g><g class="h"><rect x="452" y="58" width="188" height="74" rx="8"/><text class="lbl" x="546.0" y="78.0" text-anchor="middle" dominant-baseline="central">Older chips</text><text class="sub" x="546.0" y="96.0" text-anchor="middle" dominant-baseline="central">FP8 and FP4 maths</text><text class="sub" x="546.0" y="113.0" text-anchor="middle" dominant-baseline="central">buys nothing</text></g><text class="cap" x="40" y="178" text-anchor="start">SmoothQuant-style FP8, 8-bit weights and activations with the outliers moved into the</text><text class="cap" x="40" y="198" text-anchor="start">weights ({{fig:v04-o064}}), is the proven recipe for compute-bound work, but it pays only</text><text class="cap" x="40" y="218" text-anchor="start">where the tensor cores have an FP8 path: Hopper, and Ada chips such as the L4, L40S and</text><text class="cap" x="40" y="238" text-anchor="start">RTX 40 series, and newer. NVFP4 pays only on Blackwell.</text><text class="cap" x="40" y="278" text-anchor="start">On older chips FP8 and FP4 maths buys nothing, so stay weight-only there. The exception</text><text class="cap" x="40" y="298" text-anchor="start">is INT8: an A100's INT8 tensor cores run 624 trillion operations a second against 312</text><text class="cap" x="40" y="318" text-anchor="start">trillion for FP16, and SmoothQuant's own W8A8 speed-ups, up to 1.56 times, were measured</text><text class="cap" x="40" y="338" text-anchor="start">on A100s.</text><text class="cap" x="40" y="378" text-anchor="start">The memory saving still arrives on any hardware. The maths speed-up does not.</text></svg><figcaption>The single most practical sentence in the subject, and the reason storage format and compute format had to be separated right at the start.</figcaption></figure>
