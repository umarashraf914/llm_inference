<figure><div class='ts'>Fig 81 &nbsp;&middot;&nbsp; 18:26</div><h3>Match the format to the silicon</h3><svg viewBox="0 0 680 258" role="img"><title>Match the format to the silicon</title><g class="s"><rect x="40" y="58" width="190" height="74" rx="8"></rect><text class="lbl" x="135.0" y="86.0" text-anchor="middle" dominant-baseline="central">FP8</text><text class="sub" x="135.0" y="104.0" text-anchor="middle" dominant-baseline="central">Hopper or newer</text></g><g class="s"><rect x="246" y="58" width="190" height="74" rx="8"></rect><text class="lbl" x="341.0" y="86.0" text-anchor="middle" dominant-baseline="central">NVFP4</text><text class="sub" x="341.0" y="104.0" text-anchor="middle" dominant-baseline="central">Blackwell only</text></g><g class="h"><rect x="452" y="58" width="188" height="74" rx="8"></rect><text class="lbl" x="546.0" y="78.0" text-anchor="middle" dominant-baseline="central">Older chips</text><text class="sub" x="546.0" y="96.0" text-anchor="middle" dominant-baseline="central">low-precision maths</text><text class="sub" x="546.0" y="113.0" text-anchor="middle" dominant-baseline="central">buys nothing</text></g><text class="cap" x="40" y="178" text-anchor="start">On silicon without the low-precision paths, quantizing the activations gains no arithmetic at</text><text class="cap" x="40" y="198" text-anchor="start">all. Stay weight-only there.</text><text class="cap" x="40" y="226" text-anchor="start">The memory saving still arrives on any hardware. The maths speed-up does not.</text></svg><figcaption>The single most practical sentence in the subject, and the reason storage format and compute format had to be separated right at the start.</figcaption></figure>
