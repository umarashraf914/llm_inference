<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:22</div><h3>A gradient is a slope, and a zero slope teaches nothing</h3><svg viewBox='0 0 680 516' role='img'><title>A gradient is a slope, and a zero slope teaches nothing</title><text class="hd" x="40" y="46">One weight's loss curve, schematic</text><line class="axis" x1="80" y1="250" x2="380" y2="250"/><line class="axis" x1="80" y1="70" x2="80" y2="250"/><polyline class="pl-m" fill="none" stroke="var(--m)" stroke-width="2" points="80.0,137.5 83.3,141.9 86.7,146.3 90.0,150.5 93.3,154.6 96.7,158.6 100.0,162.5 103.3,166.2 106.7,169.9 110.0,173.4 113.3,176.9 116.7,180.2 120.0,183.4 123.3,186.5 126.7,189.5 130.0,192.3 133.3,195.1 136.7,197.7 140.0,200.3 143.3,202.7 146.7,205.0 150.0,207.2 153.3,209.3 156.7,211.2 160.0,213.1 163.3,214.8 166.7,216.5 170.0,218.0 173.3,219.4 176.7,220.7 180.0,221.9 183.3,222.9 186.7,223.9 190.0,224.7 193.3,225.5 196.7,226.1 200.0,226.6 203.3,227.0 206.7,227.3 210.0,227.4 213.3,227.5 216.7,227.4 220.0,227.3 223.3,227.0 226.7,226.6 230.0,226.1 233.3,225.5 236.7,224.7 240.0,223.9 243.3,222.9 246.7,221.9 250.0,220.7 253.3,219.4 256.7,218.0 260.0,216.5 263.3,214.8 266.7,213.1 270.0,211.2 273.3,209.3 276.7,207.2 280.0,205.0 283.3,202.7 286.7,200.3 290.0,197.7 293.3,195.1 296.7,192.3 300.0,189.5 303.3,186.5 306.7,183.4 310.0,180.2 313.3,176.9 316.7,173.4 320.0,169.9 323.3,166.2 326.7,162.5 330.0,158.6 333.3,154.6 336.7,150.5 340.0,146.3 343.3,141.9 346.7,137.5 350.0,132.9 353.3,128.3 356.7,123.5 360.0,118.6 363.3,113.6 366.7,108.5 370.0,103.2 373.3,97.9 376.7,92.4 380.0,86.9"/><line class="pl-h" x1="246.7" y1="244.4" x2="360.0" y2="129.6" stroke-dasharray="5 4"/><circle cx="313.3" cy="176.9" r="4.5" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2 halo" x="323.333" y="194.875" text-anchor="start">slope 1.5</text><circle cx="213.3" cy="227.5" r="4" fill="var(--paper)" stroke="var(--s)" stroke-width="1.5"/><text class="sub2 halo" x="213.333" y="215.5" text-anchor="middle">slope 0</text><text class="sub2" x="230" y="272" text-anchor="middle">the weight's value</text><text class="sub2" x="72" y="74" text-anchor="end">loss</text><text class="hd" x="420" y="92" text-anchor="start">the training step</text><text class="sub2" x="420" y="120" text-anchor="start">slope here = 1.5</text><text class="sub2" x="420" y="140" text-anchor="start">(loss rises 1.5 times as fast as w)</text><text class="sub2" x="420" y="160" text-anchor="start">w  ←  w − learning rate × slope</text><text class="sub2" x="420" y="180" text-anchor="start">3.5  ←  3.5 − 0.1 × 1.5 = 3.35</text><text class="sub2" x="420" y="220" text-anchor="start">if the slope is stored as 0:</text><text class="sub2" x="420" y="240" text-anchor="start">3.5  ←  3.5 − 0.1 × 0 = 3.5</text><text class="sub2" x="420" y="260" text-anchor="start">the weight never moves</text><text class="cap" x="40" y="310" text-anchor="start">Training measures how wrong the model is with one number, the loss, and asks of every</text><text class="cap" x="40" y="330" text-anchor="start">weight: if this weight grew a little, would the loss rise or fall, and how fast? That</text><text class="cap" x="40" y="350" text-anchor="start">rate is the slope of the loss curve at the weight's current value, the steepness of the</text><text class="cap" x="40" y="370" text-anchor="start">line that just touches it. A slope of 1.5 means the loss rises about 1.5 times as fast</text><text class="cap" x="40" y="390" text-anchor="start">as the weight grows.</text><text class="cap" x="40" y="430" text-anchor="start">The gradient is that slope, one per weight. Each training step moves every weight a</text><text class="cap" x="40" y="450" text-anchor="start">little downhill, by the learning rate times its slope, and at the bottom of the curve</text><text class="cap" x="40" y="470" text-anchor="start">the slope is 0 and the weight stays put. That is why a gradient rounded to zero is a</text><text class="cap" x="40" y="490" text-anchor="start">disaster: the weight stops learning while it is still far from the bottom.</text></svg><figcaption>The curve is schematic; the arithmetic of the step is exact. Everything training does is this step, for billions of weights at once, which is why the slopes have to survive being stored.</figcaption></figure>
