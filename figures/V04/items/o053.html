<figure><div class='ts'>Fig 53 &nbsp;&middot;&nbsp; 8:40</div><h3>Prefill: compute bound</h3><svg viewBox="0 0 680 246" role="img"><title>Prefill: compute bound</title><g class="u"><rect x="40" y="55" width="285" height="78" rx="8"></rect><text class="lbl" x="182.5" y="77.0" text-anchor="middle" dominant-baseline="central">The whole prompt at once</text><text class="sub" x="182.5" y="95.0" text-anchor="middle" dominant-baseline="central">big matrix multiplies</text><text class="sub" x="182.5" y="112.0" text-anchor="middle" dominant-baseline="central">every weight reused across hundreds of tokens</text></g><line class="conn" x1="331" y1="94" x2="362" y2="94" marker-end="url(#arw)"></line><g class="s"><rect x="368" y="55" width="272" height="78" rx="8"></rect><text class="lbl" x="504.0" y="77.0" text-anchor="middle" dominant-baseline="central">High intensity</text><text class="sub" x="504.0" y="95.0" text-anchor="middle" dominant-baseline="central">tensor core utilisation</text><text class="sub" x="504.0" y="112.0" text-anchor="middle" dominant-baseline="central">can push past 90%</text></g><text class="cap" x="40" y="176" text-anchor="start">Loading a weight once and using it for hundreds of tokens in parallel is what puts prefill on</text><text class="cap" x="40" y="196" text-anchor="start">the right of the ridge.</text></svg><figcaption>Quantizing the weights here saves memory but buys little speed. Quantizing the arithmetic does buy speed.</figcaption></figure>
