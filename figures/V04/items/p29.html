><g class="m"><rect x="142.167" y="301.156" width="10.7" height="2.8" rx="0"/></g><g class="m"><rect x="153.833" y="298.597" width="10.7" height="5.4" rx="0"/></g><g class="m"><rect x="165.5" y="298.597" width="10.7" height="5.4" rx="0"/></g><g class="m"><rect x="177.167" y="291.773" width="10.7" height="12.2" rx="0"/></g><g class="m"><rect x="188.833" y="288.36" width="10.7" height="15.6" rx="0"/></g><g class="m"><rect x="200.5" y="282.673" width="10.7" height="21.3" rx="0"/></g><g class="m"><rect x="212.167" y="274.711" width="10.7" height="29.3" rx="0"/></g><g class="m"><rect x="223.833" y="255.374" width="10.7" height="48.6" rx="0"/></g><g class="m"><rect x="235.5" y="251.962" width="10.7" height="52" rx="0"/></g><g class="m"><rect x="247.167" y="249.403" width="10.7" height="54.6" rx="0"/></g><g class="m"><rect x="258.833" y="245.991" width="10.7" height="58" rx="0"/></g><g class="m"><rect x="270.5" y="251.962" width="10.7" height="52" rx="0"/></g><g class="m"><rect x="282.167" y="245.422" width="10.7" height="58.6" rx="0"/></g><g class="m"><rect x="293.833" y="255.943" width="10.7" height="48.1" rx="0"/></g><g class="m"><rect x="305.5" y="263.336" width="10.7" height="40.7" rx="0"/></g><g class="m"><rect x="317.167" y="266.18" width="10.7" height="37.8" rx="0"/></g><g class="m"><rect x="328.833" y="265.896" width="10.7" height="38.1" rx="0"/></g><g class="m"><rect x="340.5" y="269.592" width="10.7" height="34.4" rx="0"/></g><g class="m"><rect x="352.167" y="268.739" width="10.7" height="35.3" rx="0"/></g><g class="m"><rect x="363.833" y="263.621" width="10.7" height="40.4" rx="0"/></g><g class="m"><rect x="375.5" y="252.531" width="10.7" height="51.5" rx="0"/></g><g class="m"><rect x="387.167" y="244" width="10.7" height="60" rx="0"/></g><g class="m"><rect x="398.833" y="247.128" width="10.7" height="56.9" rx="0"/></g><g class="m"><rect x="410.5" y="249.972" width="10.7" height="54" rx="0"/></g><g class="m"><rect x="422.167" y="245.706" width="10.7" height="58.3" rx="0"/></g><g class="m"><rect x="433.833" y="251.109" width="10.7" height="52.9" rx="0"/></g><g class="m"><rect x="445.5" y="268.455" width="10.7" height="35.5" rx="0"/></g><g class="m"><rect x="457.167" y="271.583" width="10.7" height="32.4" rx="0"/></g><g class="m"><rect x="468.833" y="278.976" width="10.7" height="25" rx="0"/></g><g class="m"><rect x="480.5" y="284.095" width="10.7" height="19.9" rx="0"/></g><g class="m"><rect x="492.167" y="293.479" width="10.7" height="10.5" rx="0"/></g><g class="m"><rect x="503.833" y="297.46" width="10.7" height="6.5" rx="0"/></g><g class="m"><rect x="515.5" y="300.588" width="10.7" height="3.4" rx="0"/></g><g class="m"><rect x="527.167" y="300.872" width="10.7" height="3.1" rx="0"/></g><g class="m"><rect x="538.833" y="303.147" width="10.7" height="0.9" rx="0"/></g><g class="m"><rect x="550.5" y="303.431" width="10.7" height="0.6" rx="0"/></g><g class="m"><rect x="562.167" y="303.716" width="10.7" height="0.3" rx="0"/></g><text class="sub2" x="104.352" y="326" text-anchor="middle">−5.05</text><text class="sub2" x="340" y="326" text-anchor="middle">0</text><text class="sub2" x="575.648" y="326" text-anchor="middle">5.05</text><text class="sub2" x="620" y="344" text-anchor="end">this axis magnified 17.5 times; ticks mark the 15 INT4 levels in both rows</text><text class="sub2" x="620" y="360" text-anchor="end">each histogram is scaled to its own tallest bar</text><text class="sub2" x="40" y="396" text-anchor="start">rms error per value, measured after turning back, to scale</text><text class="cap" x="40" y="425" text-anchor="start">no rotation</text><g class="h"><rect x="150" y="410" width="420.0" height="20" rx="2"/></g><text class="sub2" x="578" y="425" text-anchor="start">1.00</text><text class="cap" x="40" y="455" text-anchor="start">Hadamard first</text><g class="s"><rect x="150" y="440" width="87.3" height="20" rx="2"/></g><text class="sub2" x="245.321" y="455" text-anchor="start">0.21, 4.8 times smaller</text><text class="cap" x="40" y="514" text-anchor="start">A simulation, not a measurement on a model: 4,095 values drawn from a bell curve of</text><text class="cap" x="40" y="534" text-anchor="start">typical size 1, and one of 100, like one token's activations with an outlier channel,</text><text class="cap" x="40" y="554" text-anchor="start">quantized to INT4 with one scale for all ({{fig:v04-o045}}). Without rotation every</text><text class="cap" x="40" y="574" text-anchor="start">ordinary value rounds to 0 and is lost: the rms error is 1.00, as large as the values</text><text class="cap" x="40" y="594" text-anchor="start">themselves.</text><text class="cap" x="40" y="634" text-anchor="start">Turned first by a 4,096-channel Hadamard, the outlier becomes ±100 ÷ 64 = ±1.56 in every</text><text class="cap" x="40" y="654" text-anchor="start">channel ({{fig:v04-p27}}), on top of a mix of the ordinary values; hence the two humps.</text><text class="cap" x="40" y="674" text-anchor="start">The largest value is 5.05, the step 0.72, and the rms error 0.21, the 0.72 ÷ √12</text><text class="cap" x="40" y="694" text-anchor="start">expected of rounding errors spread evenly across a step ({{fig:v04-p24}}). Turning back</text><text class="cap" x="40" y="714" text-anchor="start">leaves every error's size alone, since a rotation stretches nothing; 372 of the 4,096</text><text class="cap" x="40" y="734" text-anchor="start">turned values still round to 0, against all 4,095 ordinary ones before.</text><text class="cap" x="40" y="774" text-anchor="start">4.8 times less error, for a transform that costs about 0.3% of the layer's arithmetic</text><text class="cap" x="40" y="794" text-anchor="start">({{fig:v04-p28}}): that is why rotation is what finally makes four-bit activations</text><text class="cap" x="40" y="814" text-anchor="start">workable.</text></svg><figcaption>The outlier problem solved by sharing rather than by special handling: the same 4,096 numbers and one scale, with a fifth of the error.</figcaption></figure>
