<figure><div class='ts'>Fig 76 &nbsp;&middot;&nbsp; 16:00</div><h3>MXFP4 against NVFP4</h3><svg viewBox="0 0 680 468" role="img"><title>MXFP4 against NVFP4</title><text class="cap" x="40" y="78" text-anchor="start">MXFP4</text><text class="sub2" x="40" y="98" text-anchor="start">Open Compute standard</text><g class="u"><rect x="230" y="62" width="200" height="34" rx="3"></rect><text class="sub" x="330.0" y="79.0" text-anchor="middle" dominant-baseline="central">blocks of 32</text></g><g class="h"><rect x="438" y="62" width="182" height="34" rx="3"></rect><text class="sub" x="529.0" y="79.0" text-anchor="middle" dominant-baseline="central">E8M0 scale, power of two</text></g><text class="sub2" x="40" y="156" text-anchor="start">the cost</text><text class="sub2" x="230" y="162" text-anchor="start">cheap to apply as a bit shift, but coarse: off by up to a full factor of two</text><text class="cap" x="40" y="226" text-anchor="start">NVFP4</text><text class="sub2" x="40" y="246" text-anchor="start">Nvidia, Blackwell</text><g class="s"><rect x="230" y="210" width="100" height="34" rx="3"></rect><text class="sub" x="280.0" y="227.0" text-anchor="middle" dominant-baseline="central">blocks of 16</text></g><g class="s"><rect x="338" y="210" width="190" height="34" rx="3"></rect><text class="sub" x="433.0" y="227.0" text-anchor="middle" dominant-baseline="central">FP8 scale, lands between</text></g><g class="m"><rect x="536" y="210" width="84" height="34" rx="3"></rect><text class="sub" x="578.0" y="227.0" text-anchor="middle" dominant-baseline="central">+ FP32</text></g><text class="cap" x="40" y="306" text-anchor="start">An E8M0 scale is all exponent and no mantissa, so it can only ever be an exact power of</text><text class="cap" x="40" y="326" text-anchor="start">two ({{fig:v04-p32}} shows what that costs). An FP8 scale, E4M3 ({{fig:v04-p07}}), has</text><text class="cap" x="40" y="346" text-anchor="start">mantissa bits, so it can sit between powers and fit the block more tightly; its narrower</text><text class="cap" x="40" y="366" text-anchor="start">range is what the FP32 factor is for ({{fig:v04-p33}}). Both formats store FP4 values,</text><text class="cap" x="40" y="386" text-anchor="start">the fifteen of {{fig:v04-p06}}.</text><text class="cap" x="40" y="426" text-anchor="start">Nvidia report the tighter blocks and finer scales cutting quantization error by 88%</text><text class="cap" x="40" y="446" text-anchor="start">against MXFP4. That figure comes from the vendor whose format wins.</text></svg><figcaption>Two designs at the finest practical grain, differing in block size and in how precisely the shared scale can be written.</figcaption></figure>
