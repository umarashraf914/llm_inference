<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 7:17</div><h3>Perplexity, worked on four tokens</h3><svg viewBox='0 0 680 594' role='img'><title>Perplexity, worked on four tokens</title><text class="hd" x="40" y="46">Four next tokens, and the probability the model gave each true one</text><text class="sub2" x="40" y="84" text-anchor="start">token</text><text class="sub2" x="160" y="84" text-anchor="start">probability p</text><text class="sub2" x="290" y="84" text-anchor="start">−ln p</text><text class="sub2" x="420" y="84" text-anchor="start">1 ÷ p</text><text class="cap" x="40" y="114" text-anchor="start">token 1</text><text class="sub2" x="160" y="114" text-anchor="start">0.5</text><g class="m"><rect x="290" y="96" width="76" height="26" rx="3"/><text class="sub" x="328.0" y="109.0" text-anchor="middle" dominant-baseline="central">0.693</text></g><text class="sub2" x="420" y="114" text-anchor="start">2</text><text class="cap" x="40" y="146" text-anchor="start">token 2</text><text class="sub2" x="160" y="146" text-anchor="start">0.25</text><g class="m"><rect x="290" y="128" width="76" height="26" rx="3"/><text class="sub" x="328.0" y="141.0" text-anchor="middle" dominant-baseline="central">1.386</text></g><text class="sub2" x="420" y="146" text-anchor="start">4</text><text class="cap" x="40" y="178" text-anchor="start">token 3</text><text class="sub2" x="160" y="178" text-anchor="start">0.1</text><g class="m"><rect x="290" y="160" width="76" height="26" rx="3"/><text class="sub" x="328.0" y="173.0" text-anchor="middle" dominant-baseline="central">2.303</text></g><text class="sub2" x="420" y="178" text-anchor="start">10</text><text class="cap" x="40" y="210" text-anchor="start">token 4</text><text class="sub2" x="160" y="210" text-anchor="start">0.8</text><g class="m"><rect x="290" y="192" width="76" height="26" rx="3"/><text class="sub" x="328.0" y="205.0" text-anchor="middle" dominant-baseline="central">0.223</text></g><text class="sub2" x="420" y="210" text-anchor="start">1.25</text><text class="sub2" x="40" y="260" text-anchor="start">average of −ln p</text><g class="u"><rect x="200" y="234" width="440" height="40" rx="8"/><text class="lbl" x="420.0" y="254.0" text-anchor="middle" dominant-baseline="central">(0.693 + 1.386 + 2.303 + 0.223) ÷ 4  =  4.605 ÷ 4  =  1.151</text></g><text class="sub2" x="40" y="310" text-anchor="start">perplexity</text><g class="s"><rect x="200" y="284" width="440" height="40" rx="8"/><text class="lbl" x="420.0" y="304.0" text-anchor="middle" dominant-baseline="central">e to the 1.151  =  3.16</text></g><text class="cap" x="40" y="368" text-anchor="start">A model's output is a probability for every possible next token ({{fig:v01-o009}}).</text><text class="cap" x="40" y="388" text-anchor="start">Perplexity asks how much it gave the token that actually came next. Take −ln of each</text><text class="cap" x="40" y="408" text-anchor="start">such probability, average them, and raise e to the result.</text><text class="cap" x="40" y="448" text-anchor="start">Here that is 3.16, the same as the four values of 1 ÷ p multiplied together,</text><text class="cap" x="40" y="468" text-anchor="start">2 × 4 × 10 × 1.25 = 100, and fourth-rooted. Read it as the number of equally likely</text><text class="cap" x="40" y="488" text-anchor="start">options the model was choosing between: a model that always gave the true token 0.5</text><text class="cap" x="40" y="508" text-anchor="start">would score exactly 2, one that gave it 0.1 would score 10.</text><text class="cap" x="40" y="548" text-anchor="start">So a perplexity of 10 worsened by 600% is 70: as unsure as picking among seventy</text><text class="cap" x="40" y="568" text-anchor="start">options.</text></svg><figcaption>One number for how surprised the model is by real text, on a multiplying scale. That is why its changes are quoted as percentages, and why 600% means collapse, not drift.</figcaption></figure>
