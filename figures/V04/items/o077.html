<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 16:51</div><h3>Bigger models squeeze better</h3><svg viewBox='0 0 680 458' role='img'><title>Bigger models squeeze better</title><text class="hd" x="40" y="40">Accuracy points lost on hard reasoning benchmarks, to scale</text><text class="cap" x="40" y="80" text-anchor="start">Hundreds of billions</text><text class="sub2" x="40" y="98" text-anchor="start">of parameters, NVFP4</text><g class="s"><rect x="280" y="66" width="18.0" height="28" rx="3"/></g><text class="sub2" x="308" y="85" text-anchor="start">within about one point of BF16 or FP8</text><text class="cap" x="40" y="140" text-anchor="start">Under about 50 billion,</text><text class="sub2" x="40" y="158" text-anchor="start">plain post-training</text><text class="sub2" x="40" y="174" text-anchor="start">quantization</text><g class="h"><rect x="352" y="126" width="180.0" height="28" rx="3"/></g><text class="sub2" x="542" y="145" text-anchor="start">4 to 14 points</text><line class="axis" x1="280.0" y1="196" x2="532.0" y2="196"/><line class="tick" x1="280.0" y1="196" x2="280.0" y2="201"/><text class="sub2" x="280" y="215" text-anchor="middle">0</text><line class="tick" x1="316.0" y1="196" x2="316.0" y2="201"/><text class="sub2" x="316" y="215" text-anchor="middle">2</text><line class="tick" x1="352.0" y1="196" x2="352.0" y2="201"/><text class="sub2" x="352" y="215" text-anchor="middle">4</text><line class="tick" x1="388.0" y1="196" x2="388.0" y2="201"/><text class="sub2" x="388" y="215" text-anchor="middle">6</text><line class="tick" x1="424.0" y1="196" x2="424.0" y2="201"/><text class="sub2" x="424" y="215" text-anchor="middle">8</text><line class="tick" x1="460.0" y1="196" x2="460.0" y2="201"/><text class="sub2" x="460" y="215" text-anchor="middle">10</text><line class="tick" x1="496.0" y1="196" x2="496.0" y2="201"/><text class="sub2" x="496" y="215" text-anchor="middle">12</text><line class="tick" x1="532.0" y1="196" x2="532.0" y2="201"/><text class="sub2" x="532" y="215" text-anchor="middle">14</text><text class="sub2" x="532" y="233" text-anchor="end">points lost</text><text class="cap" x="40" y="272" text-anchor="start">You would guess the biggest models are the hardest to squeeze into four bits. It is the</text><text class="cap" x="40" y="292" text-anchor="start">other way round.</text><text class="cap" x="40" y="332" text-anchor="start">An accuracy point is one percentage point of a benchmark score: a model that answered</text><text class="cap" x="40" y="352" text-anchor="start">78% of the questions and now answers 77% has lost one point, 1.3% of its score. The</text><text class="cap" x="40" y="372" text-anchor="start">small models' loss is a range across models and benchmarks, so it is drawn as one.</text><text class="cap" x="40" y="412" text-anchor="start">The usual explanation is redundancy: a very large model has enough spare capacity to</text><text class="cap" x="40" y="432" text-anchor="start">absorb the rounding, and a small one does not.</text></svg><figcaption>Near-lossless four bits is a large-model story, not a universal one.</figcaption></figure>
