<figure><div class='ts'>Fig 77 &nbsp;&middot;&nbsp; 16:49</div><h3>Bigger models squeeze better</h3><svg viewBox="0 0 680 302" role="img"><title>Bigger models squeeze better</title><text class="cap" x="40" y="78" text-anchor="start">Hundreds of billions</text><g class="s"><rect x="280" y="62" width="34" height="32" rx="3"></rect></g><text class="sub2" x="322" y="81" text-anchor="start">NVFP4 within about one accuracy point of BF16</text><text class="cap" x="40" y="148" text-anchor="start">Under about 50 billion</text><g class="h"><rect x="280" y="132" width="250" height="32" rx="3"></rect></g><text class="sub2" x="538" y="151" text-anchor="start">4 to 14 points lost</text><text class="cap" x="40" y="210" text-anchor="start">You would guess the biggest models are the hardest to squeeze into four bits. It is the other</text><text class="cap" x="40" y="230" text-anchor="start">way round.</text><text class="cap" x="40" y="260" text-anchor="start">The usual explanation is redundancy: a very large model has enough spare capacity to absorb the</text><text class="cap" x="40" y="280" text-anchor="start">rounding, and a small one does not.</text></svg><figcaption>Bar length is accuracy lost on hard reasoning benchmarks. Near-lossless four bits is a large-model story, not a universal one.</figcaption></figure>
