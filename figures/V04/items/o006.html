<figure><div class='ts'>Fig 06 &nbsp;&middot;&nbsp; 0:52</div><h3>Scientific notation carries three things</h3><svg viewBox="0 0 680 232" role="img"><title>Scientific notation carries three things</title><text class="big" x="160" y="100" text-anchor="start">6.022</text><text class="big" x="278" y="100" text-anchor="start">x 10</text><text class="sup" x="356" y="78" text-anchor="start">23</text><line class="tick" x1="160" y1="116" x2="252" y2="116"></line><line class="tick" x1="278" y1="116" x2="380" y2="116"></line><text class="sub2" x="206" y="138" text-anchor="middle">the significand</text><text class="sub2" x="329" y="138" text-anchor="middle">the exponent</text><text class="sub2" x="430" y="100" text-anchor="start">and a sign, here positive</text><text class="cap" x="40" y="192" text-anchor="start">The exponent says roughly how big the number is. The significand says precisely which number</text><text class="cap" x="40" y="212" text-anchor="start">it is within that scale. The sign says which side of zero.</text></svg><figcaption>Three independent pieces of information. A binary float stores exactly these three, in base two.</figcaption></figure>
