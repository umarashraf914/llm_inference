<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 19:36</div><h3>Every method here was a plan for the outlier</h3><svg viewBox='0 0 680 434' role='img'><title>Every method here was a plan for the outlier</title><text class="hd" x="40" y="30">What each technique does with the few values far larger than the rest</text><text class="sub2" x="40" y="58" text-anchor="start">technique</text><text class="sub2" x="250" y="58" text-anchor="start">what it does with the outlier</text><text class="sub2" x="640" y="58" text-anchor="end">built in</text><text class="cap" x="40" y="84" text-anchor="start">Floating point, BF16, E5M2</text><text class="cap" x="250" y="84" text-anchor="start">spend exponent bits so that a large value fits at all</text><text class="sub2" x="640" y="84" text-anchor="end">{{fig:v04-o030}}</text><text class="cap" x="40" y="110" text-anchor="start">Group and block scales</text><text class="cap" x="250" y="110" text-anchor="start">keep it inside its own small group</text><text class="sub2" x="640" y="110" text-anchor="end">{{fig:v04-o074}}</text><text class="cap" x="40" y="136" text-anchor="start">LLM.int8()</text><text class="cap" x="250" y="136" text-anchor="start">lift its channels out into a 16-bit multiply</text><text class="sub2" x="640" y="136" text-anchor="end">{{fig:v04-p22}}</text><text class="cap" x="40" y="162" text-anchor="start">SmoothQuant</text><text class="cap" x="250" y="162" text-anchor="start">move it from the activations into the weights</text><text class="sub2" x="640" y="162" text-anchor="end">{{fig:v04-o064}}</text><text class="cap" x="40" y="188" text-anchor="start">AWQ</text><text class="cap" x="250" y="188" text-anchor="start">protect the weights that its large inputs multiply</text><text class="sub2" x="640" y="188" text-anchor="end">{{fig:v04-p24}}</text><text class="cap" x="40" y="214" text-anchor="start">GPTQ</text><text class="cap" x="250" y="214" text-anchor="start">weigh every rounding error by the inputs it meets</text><text class="sub2" x="640" y="214" text-anchor="end">{{fig:v04-p20}}</text><text class="cap" x="40" y="240" text-anchor="start">QuaRot, SpinQuant</text><text class="cap" x="250" y="240" text-anchor="start">smear it thinly across every channel</text><text class="sub2" x="640" y="240" text-anchor="end">{{fig:v04-o067}}</text><text class="cap" x="40" y="266" text-anchor="start">KIVI, KVQuant</text><text class="cap" x="250" y="266" text-anchor="start">give its key channel a scale of its own</text><text class="sub2" x="640" y="266" text-anchor="end">{{fig:v04-p30}}</text><text class="cap" x="40" y="292" text-anchor="start">NVFP4</text><text class="cap" x="250" y="292" text-anchor="start">a finer scale for a smaller block</text><text class="sub2" x="640" y="292" text-anchor="end">{{fig:v04-p32}}</text><text class="cap" x="40" y="348" text-anchor="start">Back to the bit budget ({{fig:v04-o005}}). Quantization spends it well: fewer bits per number</text><text class="cap" x="40" y="368" text-anchor="start">means fewer bytes across the memory wall. And every format and method met along the way</text><text class="cap" x="40" y="388" text-anchor="start">was, one way or another, a plan for handling the outliers: the few values far larger</text><text class="cap" x="40" y="408" text-anchor="start">than the rest, which a shared scale must reach.</text></svg><figcaption>One problem, nine answers. Read down the middle column and the atlas retells itself.</figcaption></figure>
