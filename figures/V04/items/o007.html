<figure><div class='ts'>Fig 07 &nbsp;&middot;&nbsp; 1:00</div><h3>Normalising, and the bit you get for free</h3><svg viewBox="0 0 680 372" role="img"><title>Normalising, and the bit you get for free</title><text class="hd" x="40" y="60" text-anchor="start">Base ten</text><g class="h"><rect x="210" y="76" width="44" height="46" rx="5"></rect><text class="digit" x="232.0" y="99.0" text-anchor="middle" dominant-baseline="central">6</text></g><g class="u"><rect x="258" y="76" width="20" height="46" rx="5"></rect><text class="digit" x="268.0" y="99.0" text-anchor="middle" dominant-baseline="central">.</text></g><g class="s"><rect x="282" y="76" width="44" height="46" rx="5"></rect><text class="digit" x="304.0" y="99.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="s"><rect x="330" y="76" width="44" height="46" rx="5"></rect><text class="digit" x="352.0" y="99.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="s"><rect x="378" y="76" width="44" height="46" rx="5"></rect><text class="digit" x="400.0" y="99.0" text-anchor="middle" dominant-baseline="central">2</text></g><text class="sub2" x="470" y="92" text-anchor="start">leading digit can be 1 to 9</text><text class="sub2" x="470" y="112" text-anchor="start">so it must be stored</text><text class="hd" x="40" y="186" text-anchor="start">Base two</text><g class="m"><rect x="210" y="202" width="44" height="46" rx="5"></rect><text class="digit" x="232.0" y="225.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="258" y="202" width="20" height="46" rx="5"></rect><text class="digit" x="268.0" y="225.0" text-anchor="middle" dominant-baseline="central">.</text></g><g class="s"><rect x="282" y="202" width="44" height="46" rx="5"></rect><text class="digit" x="304.0" y="225.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="330" y="202" width="44" height="46" rx="5"></rect><text class="digit" x="352.0" y="225.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="s"><rect x="378" y="202" width="44" height="46" rx="5"></rect><text class="digit" x="400.0" y="225.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="470" y="218" text-anchor="start">the only non-zero binary digit</text><text class="sub2" x="470" y="238" text-anchor="start">is 1, so it is always 1</text><text class="cap" x="40" y="300" text-anchor="start">Normalising means shifting the exponent until exactly one digit sits left of the point. In binary</text><text class="cap" x="40" y="320" text-anchor="start">that digit can only ever be 1, and a bit that never varies carries no information.</text><text class="cap" x="40" y="350" text-anchor="start">So the format does not store it, and puts it back when reading. Binary gets a free bit.</text></svg><figcaption>This is called the implied leading bit, or the hidden bit. It is the single reason the words significand and mantissa are not interchangeable.</figcaption></figure>
