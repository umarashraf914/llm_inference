<figure><div class='ts'>Fig 63 &nbsp;&middot;&nbsp; 11:34</div><h3>GPTQ never treats outliers as special</h3><svg viewBox="0 0 680 226" role="img"><title>GPTQ never treats outliers as special</title><g class="h"><rect x="50" y="55" width="265" height="70" rx="8"></rect><text class="lbl" x="182.5" y="73.0" text-anchor="middle" dominant-baseline="central">Other methods</text><text class="sub" x="182.5" y="91.0" text-anchor="middle" dominant-baseline="central">identify the outliers</text><text class="sub" x="182.5" y="108.0" text-anchor="middle" dominant-baseline="central">and handle them</text></g><g class="s"><rect x="365" y="55" width="265" height="70" rx="8"></rect><text class="lbl" x="497.5" y="73.0" text-anchor="middle" dominant-baseline="central">GPTQ</text><text class="sub" x="497.5" y="91.0" text-anchor="middle" dominant-baseline="central">spreads the damage</text><text class="sub" x="497.5" y="108.0" text-anchor="middle" dominant-baseline="central">wherever the output cares least</text></g><text class="cap" x="40" y="170" text-anchor="start">That was enough for three and four bits in one shot, with no retraining, at near baseline</text><text class="cap" x="40" y="190" text-anchor="start">accuracy, and it fit a 175-billion-parameter model onto a single GPU for the first time.</text></svg><figcaption>Notable because every other method here is explicitly outlier-aware. GPTQ solves the same problem sideways, by making the errors land somewhere harmless.</figcaption></figure>
