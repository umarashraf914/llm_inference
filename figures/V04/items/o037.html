.1 260.0,172.7 261.7,171.2 263.3,169.6 265.0,168.0 266.7,166.3 268.3,164.6 270.0,162.8 271.7,161.0 273.3,159.1 275.0,157.1 276.7,155.1 278.3,153.1 280.0,151.0 281.7,148.8 283.3,146.6 285.0,144.4 286.7,142.1 288.3,139.7 290.0,137.3 291.7,134.8 293.3,132.3 295.0,129.7 296.7,127.1 298.3,124.4 300.0,121.7 301.7,118.9 303.3,116.0 305.0,113.1 306.7,110.2 308.3,107.2 310.0,104.1 311.7,101.0 313.3,97.9 315.0,94.7 316.7,91.4 318.3,88.1 320.0,84.7 321.7,81.3 323.3,77.8 325.0,74.3 326.7,70.7 328.3,67.0"/><line class="tick" x1="250.0" y1="189.2" x2="310.0" y2="112.7" stroke-dasharray="4 3"/><circle cx="280.0" cy="151.0" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2 halo" x="290" y="223.667" text-anchor="start">loss: slope 1</text><text class="sub2 halo" x="270" y="143" text-anchor="end">3 × loss: slope 3</text><text class="sub2" x="230" y="258" text-anchor="middle">the weight's value</text><text class="hd" x="420" y="92" text-anchor="start">the three steps</text><text class="sub2" x="420" y="120" text-anchor="start">1  multiply the loss by S</text><text class="sub2" x="420" y="142" text-anchor="start">2  every gradient comes out S times</text><text class="sub2" x="420" y="164" text-anchor="start">    larger, above FP16's floor</text><text class="sub2" x="420" y="186" text-anchor="start">3  divide by S, in FP32, before</text><text class="sub2" x="420" y="208" text-anchor="start">    the update: the step is unchanged</text><text class="cap" x="40" y="296" text-anchor="start">Stretching a curve upwards by a factor S stretches its slope at every point by the same</text><text class="cap" x="40" y="316" text-anchor="start">factor: if the loss rose 0.003 for a 0.001 step in a weight, S times the loss rises</text><text class="cap" x="40" y="336" text-anchor="start">S × 0.003. So scaling the loss scales every gradient in the network at once, lifting the</text><text class="cap" x="40" y="356" text-anchor="start">tiny ones above the floor of {{fig:v04-o036}}. Dividing by S again before the update</text><text class="cap" x="40" y="376" text-anchor="start">leaves each step exactly as it would have been.</text><text class="cap" x="40" y="416" text-anchor="start">The catch is choosing S. Too small and gradients still underflow; too large and the</text><text class="cap" x="40" y="436" text-anchor="start">biggest overflow FP16's 65,504. The paper that introduced loss scaling suggested setting</text><text class="cap" x="40" y="456" text-anchor="start">it automatically: raise it while nothing overflows, cut it and skip the step when</text><text class="cap" x="40" y="476" text-anchor="start">something does.</text></svg><figcaption>Reads as a hack because it is one. BF16 exists so this step can be deleted.</figcaption></figure>
