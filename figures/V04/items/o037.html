<figure><div class='ts'>Fig 37 &nbsp;&middot;&nbsp; 4:22</div><h3>Loss scaling</h3><svg viewBox="0 0 680 226" role="img"><title>Loss scaling</title><g class="u"><rect x="40" y="58" width="180" height="62" rx="8"></rect><text class="lbl" x="130.0" y="80.0" text-anchor="middle" dominant-baseline="central">Multiply the loss</text><text class="sub" x="130.0" y="98.0" text-anchor="middle" dominant-baseline="central">by a large constant</text></g><line class="conn" x1="226" y1="89" x2="250" y2="89" marker-end="url(#arw)"></line><g class="s"><rect x="256" y="58" width="165" height="62" rx="8"></rect><text class="lbl" x="338.5" y="80.0" text-anchor="middle" dominant-baseline="central">Gradients lift</text><text class="sub" x="338.5" y="98.0" text-anchor="middle" dominant-baseline="central">above the floor</text></g><line class="conn" x1="427" y1="89" x2="451" y2="89" marker-end="url(#arw)"></line><g class="u"><rect x="457" y="58" width="183" height="62" rx="8"></rect><text class="lbl" x="548.5" y="80.0" text-anchor="middle" dominant-baseline="central">Divide it back out</text><text class="sub" x="548.5" y="98.0" text-anchor="middle" dominant-baseline="central">before the weight update</text></g><text class="cap" x="40" y="166" text-anchor="start">The gradients are only temporarily inflated, so the update is unchanged. It is a workaround for</text><text class="cap" x="40" y="186" text-anchor="start">a range problem, and it costs a hyperparameter nobody wants to tune.</text></svg><figcaption>Reads as a hack because it is one. BF16 exists so this step can be deleted.</figcaption></figure>
