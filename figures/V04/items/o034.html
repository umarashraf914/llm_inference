<figure><div class='ts'>Fig 34 &nbsp;&middot;&nbsp; 3:44</div><h3>What a scale actually is</h3><svg viewBox="0 0 680 344" role="img"><title>What a scale actually is</title><g class="m"><rect x="60" y="46" width="240" height="42" rx="6"></rect><text class="sub" x="180.0" y="67.0" text-anchor="middle" dominant-baseline="central">s  =  max|x| / (2^(b-1) - 1)</text></g><g class="s"><rect x="330" y="46" width="300" height="42" rx="6"></rect><text class="sub" x="480.0" y="67.0" text-anchor="middle" dominant-baseline="central">x_q  =  round(x / s),  clamped</text></g><text class="sub2" x="60" y="116" text-anchor="start">the scale, from the largest value</text><text class="sub2" x="330" y="116" text-anchor="start">the stored integer</text><g class="u"><rect x="60" y="152" width="300" height="42" rx="6"></rect><text class="sub" x="210.0" y="173.0" text-anchor="middle" dominant-baseline="central">reconstructed:  x  =  s  x  x_q</text></g><text class="cap" x="40" y="232" text-anchor="start">For INT8, b is 8, so the integers run from -127 to +127. The scale is a single FP16 or FP32</text><text class="cap" x="40" y="252" text-anchor="start">number stored alongside the group.</text><text class="cap" x="40" y="282" text-anchor="start">This is symmetric quantization, which assumes the values straddle zero evenly. Asymmetric</text><text class="cap" x="40" y="302" text-anchor="start">quantization adds a zero-point, an integer offset that lets the representable range slide, at</text><text class="cap" x="40" y="322" text-anchor="start">the cost of storing a second number per group.</text></svg><figcaption>Three lines of arithmetic that underpin every integer format. Notice the scale is set by the single largest value in the group.</figcaption></figure>
