<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 18:02</div><h3>Reading the 80% rule</h3><svg viewBox='0 0 680 522' role='img'><title>Reading the 80% rule</title><text class="hd" x="40" y="30">Achieved bandwidth = bytes moved in a step ÷ the time the step took</text><text class="sub2" x="40" y="56" text-anchor="start">a 70-billion-parameter model in 16 bits reads 140 GB of weights per decode step</text><text class="cap" x="40" y="122" text-anchor="start">step takes 50 ms</text><g class="s"><rect x="220" y="104" width="308.0" height="26" rx="2"/></g><text class="sub2" x="220" y="148" text-anchor="start">140 GB ÷ 0.050 s = 2.8 TB/s, 84% of peak</text><text class="cap" x="40" y="180" text-anchor="start">step takes 100 ms</text><g class="h"><rect x="220" y="162" width="154.0" height="26" rx="2"/></g><text class="sub2" x="220" y="206" text-anchor="start">140 GB ÷ 0.100 s = 1.4 TB/s, 42% of peak</text><line class="mark" x1="588.5" y1="94" x2="588.5" y2="194"/><line x1="514.8" y1="94" x2="514.8" y2="102" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/><line x1="514.8" y1="132" x2="514.8" y2="194" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="510.8" y="100" text-anchor="end">80% of peak: 2.68 TB/s</text><text class="sub2" x="592.5" y="100" text-anchor="start">peak 3.35</text><text class="cap" x="40" y="256" text-anchor="start">A profiler reports how many bytes a step moved and how long it took, and their ratio is</text><text class="cap" x="40" y="276" text-anchor="start">the bandwidth it achieved: a count divided by a time ({{fig:v01-o075}}). Decoding one token of</text><text class="cap" x="40" y="296" text-anchor="start">a 70-billion-parameter model in 16 bits reads all 140 GB of its weights, so on an H100,</text><text class="cap" x="40" y="316" text-anchor="start">at 3.35 TB/s, a step cannot take less than 41.8 ms.</text><text class="cap" x="40" y="356" text-anchor="start">If the step takes 50 ms, it moved 2.8 TB/s, 84% of the peak: memory is the wall, and</text><text class="cap" x="40" y="376" text-anchor="start">fewer bytes per weight, W4 A16, is the fix. If it takes 100 ms, it moved 1.4 TB/s, 42%:</text><text class="cap" x="40" y="396" text-anchor="start">the memory sat idle for more than half the step, so the bottleneck is elsewhere, in</text><text class="cap" x="40" y="416" text-anchor="start">arithmetic, in launching many small kernels or in waiting on other chips, and smaller</text><text class="cap" x="40" y="436" text-anchor="start">weights will help less than the bytes suggest.</text><text class="cap" x="40" y="476" text-anchor="start">Real decode reads the KV cache as well ({{fig:v04-o055}}), so count those bytes too. The 80%</text><text class="cap" x="40" y="496" text-anchor="start">line is a rule of thumb: real kernels rarely reach the full peak.</text></svg><figcaption>The 80% rule is a ratio you can compute from two numbers a profiler gives you.</figcaption></figure>
