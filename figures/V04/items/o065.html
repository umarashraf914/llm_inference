<figure><div class='ts'>Fig 65 &nbsp;&middot;&nbsp; 12:40</div><h3>AWQ: protect the one percent</h3><svg viewBox="0 0 680 246" role="img"><title>AWQ: protect the one percent</title><g class="h"><rect x="40" y="58" width="250" height="70" rx="8"></rect><text class="lbl" x="165.0" y="76.0" text-anchor="middle" dominant-baseline="central">The 1% that matters most</text><text class="sub" x="165.0" y="94.0" text-anchor="middle" dominant-baseline="central">found by the size of the</text><text class="sub" x="165.0" y="111.0" text-anchor="middle" dominant-baseline="central">activations flowing through them</text></g><line class="conn" x1="296" y1="93" x2="326" y2="93" marker-end="url(#arw)"></line><g class="s"><rect x="332" y="58" width="308" height="70" rx="8"></rect><text class="lbl" x="486.0" y="84.0" text-anchor="middle" dominant-baseline="central">Scaled up before rounding</text><text class="sub" x="486.0" y="102.0" text-anchor="middle" dominant-baseline="central">so rounding barely touches them</text></g><text class="cap" x="40" y="174" text-anchor="start">The weight side rather than the activation side. Identifying which weights matter by watching</text><text class="cap" x="40" y="194" text-anchor="start">the activations that flow through them is the clever part.</text><text class="cap" x="40" y="222" text-anchor="start">Enough to keep plain four-bit weight-only accurate.</text></svg><figcaption>Note the pairing with SmoothQuant: one moves difficulty from activations to weights, the other protects the weights that matter. Opposite sides of the same multiply.</figcaption></figure>
