<figure><div class='ts'>Fig 12 &nbsp;&middot;&nbsp; 1:12</div><h3>The analogy: Kelvin is biased Celsius</h3><svg viewBox="0 0 680 470" role="img"><title>The analogy: Kelvin is biased Celsius</title><text class="hd" x="40" y="46">Celsius: the natural scale, goes negative</text><line class="axis" x1="150" y1="88" x2="620" y2="88"></line><line class="tick" x1="150" y1="80" x2="150" y2="96"></line><text class="sub2" x="150" y="114" text-anchor="middle">-273</text><line class="tick" x1="493.09999999999997" y1="80" x2="493.09999999999997" y2="96"></line><text class="sub2" x="493.09999999999997" y="114" text-anchor="middle">0</text><line class="tick" x1="620" y1="80" x2="620" y2="96"></line><text class="sub2" x="620" y="114" text-anchor="middle">+100</text><g class="h"><rect x="150" y="68" width="343" height="8" rx="2"></rect></g><g class="s"><rect x="493" y="68" width="127" height="8" rx="2"></rect></g><text class="hd" x="40" y="168">Kelvin: the same quantity, shifted by 273</text><line class="axis" x1="150" y1="210" x2="620" y2="210"></line><line class="tick" x1="150" y1="202" x2="150" y2="218"></line><text class="sub2" x="150" y="236" text-anchor="middle">0</text><line class="tick" x1="493.09999999999997" y1="202" x2="493.09999999999997" y2="218"></line><text class="sub2" x="493.09999999999997" y="236" text-anchor="middle">273</text><line class="tick" x1="620" y1="202" x2="620" y2="218"></line><text class="sub2" x="620" y="236" text-anchor="middle">373</text><g class="s"><rect x="150" y="190" width="470" height="8" rx="2"></rect></g><g class="m"><rect x="190" y="268" width="300" height="42" rx="6"></rect><text class="sub" x="340.0" y="289.0" text-anchor="middle" dominant-baseline="central">K  =  C  +  273</text></g><text class="cap" x="40" y="348" text-anchor="start">Kelvin is biased Celsius. Same physical quantity, same intervals, same ordering, but the scale</text><text class="cap" x="40" y="368" text-anchor="start">is shifted so it never goes below zero.</text><text class="cap" x="40" y="398" text-anchor="start">If you store temperatures in Kelvin you can put them in an unsigned field, and comparing two</text><text class="cap" x="40" y="418" text-anchor="start">Kelvin readings tells you the same thing as comparing the Celsius ones.</text><text class="cap" x="40" y="448" text-anchor="start">The exponent field is Kelvin. The bias is 273.</text></svg><figcaption>Not a loose analogy. It is the identical operation, chosen for the identical reason, and it carries the identical benefit.</figcaption></figure>
