<figure><div class='ts'>Fig 68 &nbsp;&middot;&nbsp; 13:18</div><h3>Two ways to choose the rotation</h3><svg viewBox="0 0 680 268" role="img"><title>Two ways to choose the rotation</title><g class="s"><rect x="40" y="58" width="285" height="78" rx="8"></rect><text class="lbl" x="182.5" y="80.0" text-anchor="middle" dominant-baseline="central">QuaRot</text><text class="sub" x="182.5" y="98.0" text-anchor="middle" dominant-baseline="central">a fixed Hadamard pattern,</text><text class="sub" x="182.5" y="115.0" text-anchor="middle" dominant-baseline="central">cheap enough to apply on the fly</text></g><g class="m"><rect x="368" y="58" width="272" height="78" rx="8"></rect><text class="lbl" x="504.0" y="80.0" text-anchor="middle" dominant-baseline="central">SpinQuant</text><text class="sub" x="504.0" y="98.0" text-anchor="middle" dominant-baseline="central">learns its rotation from data,</text><text class="sub" x="504.0" y="115.0" text-anchor="middle" dominant-baseline="central">better fit, more setup</text></g><text class="cap" x="40" y="178" text-anchor="start">A Hadamard matrix has entries of only plus and minus one, so applying it needs no multiplies at</text><text class="cap" x="40" y="198" text-anchor="start">all, just additions and subtractions, and it can be done in n log n time.</text><text class="cap" x="40" y="228" text-anchor="start">That is why a fixed rotation can sit inside a serving kernel without costing anything measurable.</text></svg><figcaption>The trade is the familiar one: a structured transform you can compute for free, against a learned one that fits your model better.</figcaption></figure>
