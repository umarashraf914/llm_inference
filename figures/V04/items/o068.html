<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:19</div><h3>Two ways to choose the rotation</h3><svg viewBox='0 0 680 462' role='img'><title>Two ways to choose the rotation</title><g class="s"><rect x="40" y="40" width="290" height="78" rx="8"/><text class="lbl" x="185" y="62" text-anchor="middle" dominant-baseline="central">QuaRot</text><text class="sub" x="185" y="80" text-anchor="middle" dominant-baseline="central">random sign flips, then a fixed Hadamard</text><text class="sub" x="185" y="97" text-anchor="middle" dominant-baseline="central">pattern, cheap to apply on the fly</text></g><g class="m"><rect x="350" y="40" width="290" height="78" rx="8"/><text class="lbl" x="495" y="62" text-anchor="middle" dominant-baseline="central">SpinQuant, from Meta</text><text class="sub" x="495" y="80" text-anchor="middle" dominant-baseline="central">learns its rotation from data:</text><text class="sub" x="495" y="97" text-anchor="middle" dominant-baseline="central">a better fit, more setup</text></g><text class="cap" x="40" y="156" text-anchor="start">QuaRot, from Saleh Ashkboos and colleagues (2024), uses a Hadamard matrix ({{fig:v04-p27}}):</text><text class="cap" x="40" y="176" text-anchor="start">only plus and minus ones, so applying it takes additions and subtractions, n log₂ n of</text><text class="cap" x="40" y="196" text-anchor="start">them ({{fig:v04-p28}}). It first flips the signs of the channels at random. Without that, a</text><text class="cap" x="40" y="216" text-anchor="start">vector shaped like one of the matrix's own rows, such as (1, −1, 1, −1), would be</text><text class="cap" x="40" y="236" text-anchor="start">gathered into a spike, (0, 2, 0, 0), the opposite of what the rotation is for; random</text><text class="cap" x="40" y="256" text-anchor="start">signs make that bad luck vanishingly rare.</text><text class="cap" x="40" y="296" text-anchor="start">Most of the rotations are folded into the weights before serving ({{fig:v04-o066}}). The few</text><text class="cap" x="40" y="316" text-anchor="start">that must act on activations as they are made, such as the input to each MLP's last</text><text class="cap" x="40" y="336" text-anchor="start">matrix, are applied on the fly by a small kernel.</text><text class="cap" x="40" y="376" text-anchor="start">SpinQuant, from Zechun Liu and colleagues at Meta (2024), learns its rotations instead,</text><text class="cap" x="40" y="396" text-anchor="start">adjusting them on calibration data to reduce the quantized model's loss while keeping</text><text class="cap" x="40" y="416" text-anchor="start">them rotations. That fits the model better, at the cost of an optimisation run before</text><text class="cap" x="40" y="436" text-anchor="start">deployment.</text></svg><figcaption>The familiar trade: a structured transform that costs almost nothing to apply, against a learned one that fits the model better.</figcaption></figure>
