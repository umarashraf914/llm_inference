<figure><div class='ts'>Fig 49 &nbsp;&middot;&nbsp; 6:47</div><h3>What perplexity measures</h3><svg viewBox="0 0 680 244" role="img"><title>What perplexity measures</title><g class="m"><rect x="120" y="50" width="440" height="42" rx="6"></rect><text class="sub" x="340.0" y="71.0" text-anchor="middle" dominant-baseline="central">perplexity  =  exp( average negative log-likelihood per token )</text></g><text class="cap" x="40" y="126" text-anchor="start">Read it as the effective number of equally likely options the model is choosing between at each</text><text class="cap" x="40" y="146" text-anchor="start">step. A perplexity of 10 means it is about as uncertain as someone picking from ten choices.</text><text class="cap" x="40" y="176" text-anchor="start">Lower is better, and the scale is multiplicative rather than additive.</text><text class="cap" x="40" y="206" text-anchor="start">A worsening of 600 to 1,000% means perplexity multiplied by seven to eleven times. That is not</text><text class="cap" x="40" y="226" text-anchor="start">degradation, it is collapse.</text></svg><figcaption>The standard measure of how well a model predicts text, and worth knowing precisely because percentage changes in it are easy to misread.</figcaption></figure>
