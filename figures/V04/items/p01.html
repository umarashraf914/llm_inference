<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:55</div><h3>Base two counts in powers of two</h3><svg viewBox='0 0 680 534' role='img'><title>Base two counts in powers of two</title><text class="hd" x="40" y="46">Each place is worth twice the one to its right</text><text class="cap" x="40" y="84" text-anchor="start">place value</text><text class="sub2" x="140" y="84" text-anchor="middle">128</text><text class="sub2" x="185" y="84" text-anchor="middle">64</text><text class="sub2" x="230" y="84" text-anchor="middle">32</text><text class="sub2" x="275" y="84" text-anchor="middle">16</text><text class="sub2" x="320" y="84" text-anchor="middle">8</text><text class="sub2" x="365" y="84" text-anchor="middle">4</text><text class="sub2" x="410" y="84" text-anchor="middle">2</text><text class="sub2" x="455" y="84" text-anchor="middle">1</text><g class="u"><rect x="120" y="100" width="40" height="30" rx="3"/><text class="sub" x="140.0" y="115.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="165" y="100" width="40" height="30" rx="3"/><text class="sub" x="185.0" y="115.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="210" y="100" width="40" height="30" rx="3"/><text class="sub" x="230.0" y="115.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="255" y="100" width="40" height="30" rx="3"/><text class="sub" x="275.0" y="115.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="300" y="100" width="40" height="30" rx="3"/><text class="sub" x="320.0" y="115.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="m"><rect x="345" y="100" width="40" height="30" rx="3"/><text class="sub" x="365.0" y="115.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="390" y="100" width="40" height="30" rx="3"/><text class="sub" x="410.0" y="115.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="435" y="100" width="40" height="30" rx="3"/><text class="sub" x="455.0" y="115.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="493" y="120" text-anchor="start">4 + 2  =  6</text><g class="m"><rect x="120" y="144" width="40" height="30" rx="3"/><text class="sub" x="140.0" y="159.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="165" y="144" width="40" height="30" rx="3"/><text class="sub" x="185.0" y="159.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="210" y="144" width="40" height="30" rx="3"/><text class="sub" x="230.0" y="159.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="255" y="144" width="40" height="30" rx="3"/><text class="sub" x="275.0" y="159.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="300" y="144" width="40" height="30" rx="3"/><text class="sub" x="320.0" y="159.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="345" y="144" width="40" height="30" rx="3"/><text class="sub" x="365.0" y="159.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="390" y="144" width="40" height="30" rx="3"/><text class="sub" x="410.0" y="159.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="m"><rect x="435" y="144" width="40" height="30" rx="3"/><text class="sub" x="455.0" y="159.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="493" y="164" text-anchor="start">128 + 1  =  129</text><g class="m"><rect x="120" y="188" width="40" height="30" rx="3"/><text class="sub" x="140.0" y="203.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="165" y="188" width="40" height="30" rx="3"/><text class="sub" x="185.0" y="203.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="210" y="188" width="40" height="30" rx="3"/><text class="sub" x="230.0" y="203.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="255" y="188" width="40" height="30" rx="3"/><text class="sub" x="275.0" y="203.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="300" y="188" width="40" height="30" rx="3"/><text class="sub" x="320.0" y="203.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="345" y="188" width="40" height="30" rx="3"/><text class="sub" x="365.0" y="203.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="390" y="188" width="40" height="30" rx="3"/><text class="sub" x="410.0" y="203.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="435" y="188" width="40" height="30" rx="3"/><text class="sub" x="455.0" y="203.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="493" y="208" text-anchor="start">all of them  =  255</text><text class="cap" x="40" y="268" text-anchor="start">Base ten gives each digit a place worth ten times the one to its right: 6,022 is 6</text><text class="cap" x="40" y="288" text-anchor="start">thousands, no hundreds, 2 tens and 2 ones. Base two works the same way with only two</text><text class="cap" x="40" y="308" text-anchor="start">digits, 0 and 1, and places worth 1, 2, 4, 8 and so on ({{fig:v01-p06}} counts eight of</text><text class="cap" x="40" y="328" text-anchor="start">them). To read a binary number, add up the places that hold a 1.</text><text class="cap" x="40" y="368" text-anchor="start">Each extra bit doubles the number of patterns, so n bits give 2ⁿ of them: eight bits</text><text class="cap" x="40" y="388" text-anchor="start">count from 0 to 255, and five, the size of FP16's exponent field, from 0 to 31. All ones</text><text class="cap" x="40" y="408" text-anchor="start">is always one less than the next place up: 11111111 is 256 − 1. The middle row is the</text><text class="cap" x="40" y="428" text-anchor="start">exponent field that {{fig:v04-o018}} decodes.</text><text class="cap" x="40" y="468" text-anchor="start">A whole 16-bit word reads the same way, with places up to 32,768: 0011100000000000 is</text><text class="cap" x="40" y="488" text-anchor="start">8,192 + 4,096 + 2,048 = 14,336. That is how {{fig:v04-o013}} turns a float's bits into</text><text class="cap" x="40" y="508" text-anchor="start">one ordinary integer.</text></svg><figcaption>Nothing about binary is stranger than this. Every exponent field, integer code and stored word later in this atlas is read by adding up the places that hold a 1.</figcaption></figure>
