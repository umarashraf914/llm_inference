<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:06</div><h3>A rotation turns a vector without stretching it</h3><div class='wg'><div class='ctl'><label>turn by <input type='range' min='0' max='360' step='1' value='45'><span class='val'>45°</span></label><button type='button'>Reset</button></div><svg viewBox='0 0 680 706' role='img'><title>A rotation turns a vector without stretching it</title><text class="hd" x="40" y="30">Turning v = (8, 0) about the origin (dashed: v before turning)</text><line class="axis" x1="44" y1="204" x2="296" y2="204"/><line class="axis" x1="170" y1="78" x2="170" y2="330"/><line class="tick" x1="58.0" y1="204" x2="58.0" y2="209"/><text class="sub2" x="58" y="224" text-anchor="middle">−8</text><line class="tick" x1="165" y1="316" x2="170" y2="316"/><text class="sub2" x="162" y="320" text-anchor="end">−8</text><line class="tick" x1="114.0" y1="204" x2="114.0" y2="209"/><text class="sub2" x="114" y="224" text-anchor="middle">−4</text><line class="tick" x1="165" y1="260" x2="170" y2="260"/><text class="sub2" x="162" y="264" text-anchor="end">−4</text><line class="tick" x1="226.0" y1="204" x2="226.0" y2="209"/><text class="sub2" x="226" y="224" text-anchor="middle">4</text><line class="tick" x1="165" y1="148" x2="170" y2="148"/><text class="sub2" x="162" y="152" text-anchor="end">4</text><line class="tick" x1="282.0" y1="204" x2="282.0" y2="209"/><text class="sub2" x="282" y="224" text-anchor="middle">8</text><line class="tick" x1="165" y1="92" x2="170" y2="92"/><text class="sub2" x="162" y="96" text-anchor="end">8</text><text class="sub2" x="300" y="208" text-anchor="start">x</text><text class="sub2" x="176" y="80" text-anchor="start">y</text><circle cx="170" cy="204" r="112" fill="none" stroke="var(--u)" stroke-width="1" stroke-dasharray="3 3"/><line x1="170" y1="204" x2="282" y2="204" stroke="var(--m)" stroke-width="2" stroke-dasharray="5 4" opacity="0.6"/><line data-g="fx" x1="249.2" y1="124.8" x2="249.2" y2="204" stroke="var(--m)" stroke-width="1" stroke-dasharray="2 3"/><line data-g="fy" x1="249.2" y1="124.8" x2="170" y2="124.8" stroke="var(--m)" stroke-width="1" stroke-dasharray="2 3"/><line data-g="v" x1="170" y1="204" x2="249.2" y2="124.8" stroke="var(--m)" stroke-width="2.5"/><circle data-g="tip" cx="249.2" cy="124.8" r="4" fill="var(--m)"/><text class="lbl" data-g="lab" x="264.8" y="109.2" text-anchor="middle" dominant-baseline="central">v</text><text class="cap" x="340" y="92">turned by <tspan data-k="deg">45°</tspan>, v becomes (<tspan data-k="x">5.66</tspan>, <tspan data-k="y">5.66</tspan>)</text><text class="cap" x="340" y="118">its length, √(x² + y²): <tspan data-k="len">8.00</tspan></text><text class="sub2" x="340" y="150" text-anchor="start">the size of each coordinate, to scale</text><text class="sub2" x="340" y="175" text-anchor="start">x</text><g class="m"><rect data-g="bx" x="364" y="164" width="162.6" height="14" rx="1"/></g><text class="sub2" x="604" y="175" text-anchor="start"><tspan data-k="ax">5.66</tspan></text><text class="sub2" x="340" y="201" text-anchor="start">y</text><g class="m"><rect data-g="by" x="364" y="190" width="162.6" height="14" rx="1"/></g><text class="sub2" x="604" y="201" text-anchor="start"><tspan data-k="ay">5.66</tspan></text><line class="mark" x1="594" y1="158" x2="594" y2="210"/><text class="sub2" x="594" y="224" text-anchor="end">8, the size before turning</text><text class="cap" x="340" y="256">largest coordinate: <tspan data-k="max">5.66</tspan></text><text class="cap" x="40" y="356">a = (3, 1) and b = (2, −1), turned the same way: a′ = <tspan data-k="a">(1.41, 2.83)</tspan>, b′ = <tspan data-k="b">(2.12, 0.71)</tspan></text><text class="cap" x="40" y="378">a′ · b′ = <tspan data-k="dot">5.00</tspan>, the same as before turning: a · b = 3 × 2 + 1 × (−1) = 5</text><text class="cap" x="40" y="420" text-anchor="start">A rotation turns every vector by the same angle about the origin; {{fig:v03-p24}} built</text><text class="cap" x="40" y="440" text-anchor="start">one from cosine and sine. Drag the angle. The tip of v stays on the circle, because a</text><text class="cap" x="40" y="460" text-anchor="start">turn changes no length, and a′ · b′ stays 5, because it changes no angle between vectors</text><text class="cap" x="40" y="480" text-anchor="start">either. A layer's outputs are dot products like that one, so they cannot tell that</text><text class="cap" x="40" y="500" text-anchor="start">anything was turned ({{fig:v04-o066}}).</text><text class="cap" x="40" y="540" text-anchor="start">What a turn does change is how the length is shared between the coordinates. At 0° all</text><text class="cap" x="40" y="560" text-anchor="start">of v's 8 sits in x. At 45° it is split evenly: each coordinate is 8 ÷ √2 = 5.66, and 32</text><text class="cap" x="40" y="580" text-anchor="start">+ 32 = 64 = 8². The largest coordinate has fallen from 8 to 5.66, as low as it can go</text><text class="cap" x="40" y="600" text-anchor="start">for this vector, and the largest value is what sets a quantization scale</text><text class="cap" x="40" y="620" text-anchor="start">({{fig:v04-o034}}): the same levels now sit 1.41 times closer together. At 90° v is (0,</text><text class="cap" x="40" y="640" text-anchor="start">8), as bad as at the start, so a turn helps only if it spreads the vector it is given.</text><text class="cap" x="40" y="680" text-anchor="start">The widget's numbers were checked against Python at every whole-degree angle.</text></svg></div><figcaption>Length kept, dot products kept, and the largest coordinate free to change: the three facts the rotation methods are built on.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const sl = fig.querySelector('input[type=range]'), val = fig.querySelector('.val');
  const [CX, CY, U, RL, BX, BW] = [170, 204, 14, 134, 364, 230], T0 = 45;
  const fx = (v, d) => (v < 0 && Math.abs(v).toFixed(d) !== (0).toFixed(d) ? '−' : '') + Math.abs(v).toFixed(d);
  const turn = (p, deg) => { const t = deg * Math.PI / 180;
    return [p[0] * Math.cos(t) - p[1] * Math.sin(t), p[0] * Math.sin(t) + p[1] * Math.cos(t)]; };
  const pair = p => '(' + fx(p[0], 2) + ', ' + fx(p[1], 2) + ')';
  const set = (k, s) => fig.querySelectorAll(`[data-k="${k}"]`).forEach(e => e.textContent = s);
  const at = (k, o) => { const e = fig.querySelector(`[data-g="${k}"]`); for (const n in o) e.setAttribute(n, o[n]); };
  function draw() {
    const deg = parseInt(sl.value, 10), t = deg * Math.PI / 180;
    const [x, y] = turn([8, 0], deg), a = turn([3, 1], deg), b = turn([2, -1], deg);
    const px = fx(CX + x * U, 1), py = fx(CY - y * U, 1);
    const L = Math.sqrt(x * x + y * y), M = Math.max(Math.abs(x), Math.abs(y));
    const wx = Math.abs(x) / 8 * BW, wy = Math.abs(y) / 8 * BW;
    val.textContent = deg + '°';
    at('v', {x2: px, y2: py}); at('tip', {cx: px, cy: py});
    at('fx', {x1: px, y1: py, x2: px}); at('fy', {x1: px, y1: py, y2: py});
    at('lab', {x: fx(CX + RL * Math.cos(t), 1), y: fx(CY - RL * Math.sin(t), 1)});
    at('bx', {width: fx(wx, 1)}); at('by', {width: fx(wy, 1)});
    set('deg', deg + '°'); set('x', fx(x, 2)); set('y', fx(y, 2)); set('len', fx(L, 2)); set('max', fx(M, 2));
    set('ax', fx(Math.abs(x), 2)); set('ay', fx(Math.abs(y), 2));
    set('a', pair(a)); set('b', pair(b)); set('dot', fx(a[0] * b[0] + a[1] * b[1], 2));
  }
  sl.addEventListener('input', draw);
  fig.querySelector('button').addEventListener('click', () => { sl.value = T0; draw(); });
  draw();
})();</script></figure>
