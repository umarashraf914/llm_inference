<figure><div class='ts'>Fig 80 &nbsp;&middot;&nbsp; 17:57</div><h3>The decision procedure</h3><svg viewBox="0 0 680 594" role="img"><title>The decision procedure</title><g class="u"><rect x="40" y="50" width="600" height="62" rx="8"></rect><text class="lbl" x="340.0" y="72.0" text-anchor="middle" dominant-baseline="central">Profile your own bottleneck first</text><text class="sub" x="340.0" y="90.0" text-anchor="middle" dominant-baseline="central">above 80% HBM bandwidth on the hot path means memory bound: optimise bytes</text></g><g class="s"><rect x="40" y="132" width="190" height="36" rx="4"></rect><text class="sub" x="135.0" y="150.0" text-anchor="middle" dominant-baseline="central">Memory bound</text></g><line class="conn" x1="236" y1="150" x2="256" y2="150" marker-end="url(#arw)"></line><g class="u"><rect x="262" y="132" width="378" height="36" rx="4"></rect><text class="sub" x="451.0" y="150.0" text-anchor="middle" dominant-baseline="central">4-bit weight only, AWQ or GPTQ at W4 A16</text></g><g class="m"><rect x="40" y="178" width="190" height="36" rx="4"></rect><text class="sub" x="135.0" y="196.0" text-anchor="middle" dominant-baseline="central">Compute bound</text></g><line class="conn" x1="236" y1="196" x2="256" y2="196" marker-end="url(#arw)"></line><g class="u"><rect x="262" y="178" width="378" height="36" rx="4"></rect><text class="sub" x="451.0" y="196.0" text-anchor="middle" dominant-baseline="central">match the format to the silicon you own</text></g><g class="m"><rect x="40" y="224" width="190" height="36" rx="4"></rect><text class="sub" x="135.0" y="242.0" text-anchor="middle" dominant-baseline="central">4-bit activations</text></g><line class="conn" x1="236" y1="242" x2="256" y2="242" marker-end="url(#arw)"></line><g class="u"><rect x="262" y="224" width="378" height="36" rx="4"></rect><text class="sub" x="451.0" y="242.0" text-anchor="middle" dominant-baseline="central">rotation territory: QuaRot or SpinQuant</text></g><g class="s"><rect x="40" y="270" width="190" height="36" rx="4"></rect><text class="sub" x="135.0" y="288.0" text-anchor="middle" dominant-baseline="central">Long context</text></g><line class="conn" x1="236" y1="288" x2="256" y2="288" marker-end="url(#arw)"></line><g class="u"><rect x="262" y="270" width="378" height="36" rx="4"></rect><text class="sub" x="451.0" y="288.0" text-anchor="middle" dominant-baseline="central">quantize the cache, or move to MLA</text></g><g class="h"><rect x="40" y="316" width="190" height="36" rx="4"></rect><text class="sub" x="135.0" y="334.0" text-anchor="middle" dominant-baseline="central">Under 70 billion</text></g><line class="conn" x1="236" y1="334" x2="256" y2="334" marker-end="url(#arw)"></line><g class="u"><rect x="262" y="316" width="378" height="36" rx="4"></rect><text class="sub" x="451.0" y="334.0" text-anchor="middle" dominant-baseline="central">quantization-aware training or distillation, not raw PTQ</text></g><text class="cap" x="40" y="392" text-anchor="start">W4 A16 is the safest and most widely deployed win: roughly four times smaller than FP16</text><text class="cap" x="40" y="412" text-anchor="start">and faster decode on almost any GPU. {{fig:v04-p36}} reads the 80% test with numbers.</text><text class="cap" x="40" y="452" text-anchor="start">Below about 70 billion parameters, do not ship four bits straight from post-training</text><text class="cap" x="40" y="472" text-anchor="start">quantization: budget for quantization-aware training ({{fig:v04-p35}}) or distillation</text><text class="cap" x="40" y="492" text-anchor="start">from the full-precision model ({{fig:v04-p37}}), and keep the sensitive layers at higher</text><text class="cap" x="40" y="512" text-anchor="start">precision.</text><text class="cap" x="40" y="552" text-anchor="start">Above all, measure on your own benchmarks. Published numbers are model-specific and</text><text class="cap" x="40" y="572" text-anchor="start">benchmark-specific.</text></svg><figcaption>Start with a measurement, not a format. Which technique helps is determined by which side of the ridge you are on, and that is something you can profile in minutes.</figcaption></figure>
