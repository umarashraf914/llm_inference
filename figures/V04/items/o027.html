<figure><div class='ts'>Fig 27 &nbsp;&middot;&nbsp; 2:00</div><h3>The free bit is why 'seven digits' is correct</h3><svg viewBox="0 0 680 334" role="img"><title>The free bit is why 'seven digits' is correct</title><text class="cap" x="40" y="78" text-anchor="start">FP32 mantissa field</text><g class="s"><rect x="230" y="62" width="368" height="34" rx="4"></rect><text class="sub" x="414.0" y="79.0" text-anchor="middle" dominant-baseline="central">23 bits stored</text></g><g class="m"><rect x="602" y="62" width="16" height="34" rx="4"></rect></g><text class="sub2" x="230" y="118" text-anchor="start">the implied bit, free</text><line class="conn" x1="560" y1="122" x2="606" y2="100" marker-end="url(#arw)"></line><text class="cap" x="40" y="168" text-anchor="start">Effective precision</text><g class="m"><rect x="230" y="152" width="388" height="34" rx="4"></rect><text class="sub" x="424.0" y="169.0" text-anchor="middle" dominant-baseline="central">24 bits</text></g><text class="cap" x="40" y="234" text-anchor="start">23 bits would give 6.92 decimal digits. 24 bits gives 7.22.</text><text class="cap" x="40" y="262" text-anchor="start">The video says FP32 buys about seven decimal digits. That number only comes out right if you</text><text class="cap" x="40" y="282" text-anchor="start">count the implied bit. It is not a rounding of 23; it is 24.</text><text class="cap" x="40" y="312" text-anchor="start">Same everywhere: FP16 stores 10 and behaves like 11. BF16 stores 7 and behaves like 8.</text></svg><figcaption>A small check that confirms the mechanism. Decimal digits are the bit count times log-base-ten of two.</figcaption></figure>
