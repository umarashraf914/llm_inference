<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:36</div><h3>Integers give up the per-value exponent</h3><svg viewBox='0 0 680 312' role='img'><title>Integers give up the per-value exponent</title><text class="hd" x="40" y="46">FP4: eight values crowd toward zero</text><text class="hd" x="370" y="46">INT4 scaled to 6: evenly spaced</text><line class="axis" x1="50.0" y1="92" x2="330.0" y2="92"/><line class="tick" x1="50.0" y1="84" x2="50.0" y2="100"/><line class="tick" x1="73.3" y1="84" x2="73.3" y2="100"/><line class="tick" x1="96.7" y1="84" x2="96.7" y2="100"/><line class="tick" x1="120.0" y1="84" x2="120.0" y2="100"/><line class="tick" x1="143.3" y1="84" x2="143.3" y2="100"/><line class="tick" x1="190.0" y1="84" x2="190.0" y2="100"/><line class="tick" x1="236.7" y1="84" x2="236.7" y2="100"/><line class="tick" x1="330.0" y1="84" x2="330.0" y2="100"/><text class="sub2" x="50" y="120" text-anchor="middle">0</text><text class="sub2" x="96.6667" y="120" text-anchor="middle">1</text><text class="sub2" x="143.333" y="120" text-anchor="middle">2</text><text class="sub2" x="190" y="120" text-anchor="middle">3</text><text class="sub2" x="236.667" y="120" text-anchor="middle">4</text><text class="sub2" x="330" y="120" text-anchor="middle">6</text><line class="axis" x1="370.0" y1="92" x2="640.0" y2="92"/><line class="tick" x1="370.0" y1="84" x2="370.0" y2="100"/><line class="tick" x1="408.6" y1="84" x2="408.6" y2="100"/><line class="tick" x1="447.1" y1="84" x2="447.1" y2="100"/><line class="tick" x1="485.7" y1="84" x2="485.7" y2="100"/><line class="tick" x1="524.3" y1="84" x2="524.3" y2="100"/><line class="tick" x1="562.9" y1="84" x2="562.9" y2="100"/><line class="tick" x1="601.4" y1="84" x2="601.4" y2="100"/><line class="tick" x1="640.0" y1="84" x2="640.0" y2="100"/><text class="sub2" x="370" y="120" text-anchor="middle">0</text><text class="sub2" x="640" y="120" text-anchor="middle">6</text><text class="sub2" x="505" y="120" text-anchor="middle">steps of 6/7</text><text class="cap" x="40" y="166" text-anchor="start">Both rulers have eight values from 0 to 6. The float spends them near zero, in steps of</text><text class="cap" x="40" y="186" text-anchor="start">0.5 that grow to 2; the integer spaces them evenly, 6/7 ≈ 0.86 apart.</text><text class="cap" x="40" y="226" text-anchor="start">Integers carry no per-value exponent. Every step is the same size, and the position on</text><text class="cap" x="40" y="246" text-anchor="start">the real number line comes from one scale factor shared across a whole group of values.</text><text class="cap" x="40" y="286" text-anchor="start">That is simple and fast in silicon, and it is exactly what breaks on wide-ranging data.</text></svg><figcaption>The exponent moves out of the number and becomes a property of the group. Everything that follows about outliers is a consequence of that move.</figcaption></figure>
