<figure><div class='ts'>Fig 33 &nbsp;&middot;&nbsp; 3:36</div><h3>Integers give up the per-value exponent</h3><svg viewBox="0 0 680 220" role="img"><title>Integers give up the per-value exponent</title><text class="hd" x="40" y="46">A float: ticks crowd near zero</text><line class="axis" x1="50" y1="92" x2="330" y2="92"></line><line class="tick" x1="56" y1="84" x2="56" y2="100"></line><line class="tick" x1="62" y1="84" x2="62" y2="100"></line><line class="tick" x1="72" y1="84" x2="72" y2="100"></line><line class="tick" x1="88" y1="84" x2="88" y2="100"></line><line class="tick" x1="112" y1="84" x2="112" y2="100"></line><line class="tick" x1="150" y1="84" x2="150" y2="100"></line><line class="tick" x1="210" y1="84" x2="210" y2="100"></line><line class="tick" x1="300" y1="84" x2="300" y2="100"></line><text class="hd" x="370" y="46">An integer: evenly spaced steps</text><line class="axis" x1="370" y1="92" x2="640" y2="92"></line><line class="tick" x1="370" y1="84" x2="370" y2="100"></line><line class="tick" x1="403" y1="84" x2="403" y2="100"></line><line class="tick" x1="436" y1="84" x2="436" y2="100"></line><line class="tick" x1="469" y1="84" x2="469" y2="100"></line><line class="tick" x1="502" y1="84" x2="502" y2="100"></line><line class="tick" x1="535" y1="84" x2="535" y2="100"></line><line class="tick" x1="568" y1="84" x2="568" y2="100"></line><line class="tick" x1="601" y1="84" x2="601" y2="100"></line><line class="tick" x1="634" y1="84" x2="634" y2="100"></line><text class="cap" x="40" y="148" text-anchor="start">Integers carry no per-value exponent. Every step is the same size, and the position on the</text><text class="cap" x="40" y="168" text-anchor="start">real number line comes from one scale factor shared across a whole group of values.</text><text class="cap" x="40" y="198" text-anchor="start">That is simple and fast in silicon, and it is exactly what breaks on wide-ranging data.</text></svg><figcaption>The exponent moves out of the number and becomes a property of the group. Everything that follows about outliers is a consequence of that move.</figcaption></figure>
