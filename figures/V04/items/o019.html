<figure><div class='ts'>Fig 19 &nbsp;&middot;&nbsp; 1:20</div><h3>The two fields buy different things</h3><svg viewBox="0 0 680 232" role="img"><title>The two fields buy different things</title><g class="h"><rect x="50" y="55" width="265" height="78" rx="8"></rect><text class="lbl" x="182.5" y="77.0" text-anchor="middle" dominant-baseline="central">Exponent bits</text><text class="sub" x="182.5" y="95.0" text-anchor="middle" dominant-baseline="central">set the dynamic range</text><text class="sub" x="182.5" y="112.0" text-anchor="middle" dominant-baseline="central">how large or small you can reach</text></g><g class="s"><rect x="365" y="55" width="265" height="78" rx="8"></rect><text class="lbl" x="497.5" y="77.0" text-anchor="middle" dominant-baseline="central">Mantissa bits</text><text class="sub" x="497.5" y="95.0" text-anchor="middle" dominant-baseline="central">set the precision</text><text class="sub" x="497.5" y="112.0" text-anchor="middle" dominant-baseline="central">how finely you tell neighbours apart</text></g><text class="cap" x="40" y="182" text-anchor="start">Range and precision are separate resources bought with separate bits. Almost every design</text><text class="cap" x="40" y="202" text-anchor="start">decision in this document is a trade between exactly these two.</text></svg><figcaption>Keep the distinction sharp. FP16 and BF16 have identical total budgets and differ only in how they split them, with dramatic consequences.</figcaption></figure>
