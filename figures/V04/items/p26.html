<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:06</div><h3>QᵀQ = I, checked on a two-by-two</h3><svg viewBox='0 0 680 688' role='img'><title>QᵀQ = I, checked on a two-by-two</title><text class="hd" x="40" y="30">Q turns by 45°. Qᵀ, its transpose, turns back, and Qᵀ × Q is the identity, I</text><text class="sub2" x="126" y="64" text-anchor="middle">Qᵀ, the turn back</text><text class="sub2" x="336" y="64" text-anchor="middle">Q, the 45° turn</text><text class="sub2" x="546" y="64" text-anchor="middle">I, the identity</text><g class="s"><rect x="60" y="76" width="64" height="30" rx="3"/><text class="sub" x="92.0" y="91.0" text-anchor="middle" dominant-baseline="central">0.707</text></g><g class="s"><rect x="128" y="76" width="64" height="30" rx="3"/><text class="sub" x="160.0" y="91.0" text-anchor="middle" dominant-baseline="central">0.707</text></g><g class="u"><rect x="60" y="110" width="64" height="30" rx="3"/><text class="sub" x="92.0" y="125.0" text-anchor="middle" dominant-baseline="central">−0.707</text></g><g class="u"><rect x="128" y="110" width="64" height="30" rx="3"/><text class="sub" x="160.0" y="125.0" text-anchor="middle" dominant-baseline="central">0.707</text></g><g class="u"><rect x="270" y="76" width="64" height="30" rx="3"/><text class="sub" x="302.0" y="91.0" text-anchor="middle" dominant-baseline="central">0.707</text></g><g class="s"><rect x="338" y="76" width="64" height="30" rx="3"/><text class="sub" x="370.0" y="91.0" text-anchor="middle" dominant-baseline="central">−0.707</text></g><g class="u"><rect x="270" y="110" width="64" height="30" rx="3"/><text class="sub" x="302.0" y="125.0" text-anchor="middle" dominant-baseline="central">0.707</text></g><g class="s"><rect x="338" y="110" width="64" height="30" rx="3"/><text class="sub" x="370.0" y="125.0" text-anchor="middle" dominant-baseline="central">0.707</text></g><g class="u"><rect x="480" y="76" width="64" height="30" rx="3"/><text class="sub" x="512.0" y="91.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="548" y="76" width="64" height="30" rx="3"/><text class="sub" x="580.0" y="91.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="480" y="110" width="64" height="30" rx="3"/><text class="sub" x="512.0" y="125.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="548" y="110" width="64" height="30" rx="3"/><text class="sub" x="580.0" y="125.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="lbl" x="234" y="115" text-anchor="middle">×</text><text class="lbl" x="444" y="115" text-anchor="middle">=</text><text class="sub2" x="40" y="178" text-anchor="start">each entry: a row of Qᵀ dotted with a column of Q (teal: the entry in row 1, column 2)</text><text class="sub2" x="40" y="202" text-anchor="start">row 1 with column 1</text><text class="cap" x="180" y="202" text-anchor="start">0.707 × 0.707 + 0.707 × 0.707  =  ½ + ½  =  1</text><text class="sub2" x="40" y="224" text-anchor="start">row 1 with column 2</text><text class="cap" x="180" y="224" text-anchor="start" style="fill:var(--s-text)">0.707 × (−0.707) + 0.707 × 0.707  =  −½ + ½  =  0</text><text class="sub2" x="40" y="246" text-anchor="start">row 2 with column 1</text><text class="cap" x="180" y="246" text-anchor="start">(−0.707) × 0.707 + 0.707 × 0.707  =  −½ + ½  =  0</text><text class="sub2" x="40" y="268" text-anchor="start">row 2 with column 2</text><text class="cap" x="180" y="268" text-anchor="start">(−0.707) × (−0.707) + 0.707 × 0.707  =  ½ + ½  =  1</text><text class="sub2" x="40" y="304" text-anchor="start">0.707 stands for 1/√2, which is cos 45° and sin 45°; 1/√2 × 1/√2 = ½ exactly.</text><text class="sub2" x="40" y="338" text-anchor="start">turn and turn back</text><text class="cap" x="180" y="338" text-anchor="start">Q × (8, 0)  =  (0.707 × 8 + 0, 0.707 × 8 + 0)  =  (5.66, 5.66)</text><text class="cap" x="180" y="360" text-anchor="start">Qᵀ × (5.66, 5.66)  =  (4 + 4, −4 + 4)  =  (8, 0)</text><text class="cap" x="40" y="402" text-anchor="start">A matrix times a matrix is a grid of dot products ({{fig:v03-o014}}): the entry in row i</text><text class="cap" x="40" y="422" text-anchor="start">and column j of the result is row i of the first dotted with column j of the second. Qᵀ</text><text class="cap" x="40" y="442" text-anchor="start">is Q with rows and columns swapped ({{fig:v03-o019}}), so each entry of Qᵀ × Q is one</text><text class="cap" x="40" y="462" text-anchor="start">column of Q dotted with another.</text><text class="cap" x="40" y="502" text-anchor="start">Q's columns are where (1, 0) and (0, 1) land after the turn. Each has length 1, so</text><text class="cap" x="40" y="522" text-anchor="start">dotted with itself it gives 1; the two stay at right angles, so dotted with each other</text><text class="cap" x="40" y="542" text-anchor="start">they give 0. That holds at every angle and in any number of dimensions. A matrix whose</text><text class="cap" x="40" y="562" text-anchor="start">columns have length 1 and stand at right angles to each other is called orthogonal, and</text><text class="cap" x="40" y="582" text-anchor="start">for it QᵀQ = I.</text><text class="cap" x="40" y="622" text-anchor="start">I is the identity, the matrix that changes nothing:</text><text class="cap" x="40" y="642" text-anchor="start">I × (x, y) = (1x + 0y, 0x + 1y) = (x, y). So QᵀQ = I says that Qᵀ undoes Q; it is Q's</text><text class="cap" x="40" y="662" text-anchor="start">inverse. Q turns (8, 0) to (5.66, 5.66), and Qᵀ turns it back.</text></svg><figcaption>The identity the whole rotation trick rests on, worked entry by entry for one turn.</figcaption></figure>
