<figure><div class='ts'>Fig 64 &nbsp;&middot;&nbsp; 11:56</div><h3>SmoothQuant: move the difficulty</h3><svg viewBox="0 0 680 356" role="img"><title>SmoothQuant: move the difficulty</title><text class="hd" x="40" y="46">Divide the activation by S, multiply the weight by S</text><g class="h"><rect x="40" y="66" width="175" height="64" rx="8"></rect><text class="lbl" x="127.5" y="89.0" text-anchor="middle" dominant-baseline="central">Activation channel</text><text class="sub" x="127.5" y="107.0" text-anchor="middle" dominant-baseline="central">hard to quantize</text></g><g class="u"><rect x="255" y="66" width="130" height="64" rx="8"></rect><text class="lbl" x="320.0" y="98.0" text-anchor="middle" dominant-baseline="central">divide by S</text></g><g class="s"><rect x="425" y="66" width="215" height="64" rx="8"></rect><text class="lbl" x="532.5" y="89.0" text-anchor="middle" dominant-baseline="central">Weight channel</text><text class="sub" x="532.5" y="107.0" text-anchor="middle" dominant-baseline="central">easy to quantize</text></g><line class="conn" x1="221" y1="98" x2="249" y2="98" marker-end="url(#arw)"></line><line class="conn" x1="391" y1="98" x2="419" y2="98" marker-end="url(#arw)"></line><g class="m"><rect x="170" y="150" width="340" height="42" rx="6"></rect><text class="sub" x="340.0" y="171.0" text-anchor="middle" dominant-baseline="central">(X / S) x (S W)  =  X W</text></g><text class="cap" x="40" y="244" text-anchor="start">The product is mathematically unchanged, which is what makes the move safe. Choose S well and</text><text class="cap" x="40" y="264" text-anchor="start">the outliers shrink while the weights absorb a little of the difficulty, until both sides</text><text class="cap" x="40" y="284" text-anchor="start">quantize comfortably.</text><text class="cap" x="40" y="314" text-anchor="start">One knob, alpha, usually a half, sets how much to shift. Enough for W8 A8 with little</text><text class="cap" x="40" y="334" text-anchor="start">accuracy loss.</text></svg><figcaption>Weights are easy and activations are hard, so trade a little hardness from one to the other. The art is entirely in picking S.</figcaption></figure>
