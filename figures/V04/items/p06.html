<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:09</div><h3>Four bits make a float small enough to list in full</h3><svg viewBox='0 0 680 672' role='img'><title>Four bits make a float small enough to list in full</title><text class="hd" x="40" y="46">FP4 (E2M1): one sign bit, two exponent bits, one mantissa bit; bias 1</text><text class="cap" x="40" y="84" text-anchor="start">code</text><text class="cap" x="40" y="120" text-anchor="start">value</text><text class="cap" x="40" y="154" text-anchor="start">in base two</text><g class="u"><rect x="120" y="66" width="60" height="28" rx="3"/><text class="sub" x="150.0" y="80.0" text-anchor="middle" dominant-baseline="central">00 0</text></g><g class="m"><rect x="120" y="102" width="60" height="28" rx="3"/><text class="sub" x="150.0" y="116.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="150" y="154" text-anchor="middle">0.0×2⁰</text><g class="u"><rect x="184" y="66" width="60" height="28" rx="3"/><text class="sub" x="214.0" y="80.0" text-anchor="middle" dominant-baseline="central">00 1</text></g><g class="m"><rect x="184" y="102" width="60" height="28" rx="3"/><text class="sub" x="214.0" y="116.0" text-anchor="middle" dominant-baseline="central">0.5</text></g><text class="sub2" x="214" y="154" text-anchor="middle">0.1×2⁰</text><g class="u"><rect x="248" y="66" width="60" height="28" rx="3"/><text class="sub" x="278.0" y="80.0" text-anchor="middle" dominant-baseline="central">01 0</text></g><g class="m"><rect x="248" y="102" width="60" height="28" rx="3"/><text class="sub" x="278.0" y="116.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="278" y="154" text-anchor="middle">1.0×2⁰</text><g class="u"><rect x="312" y="66" width="60" height="28" rx="3"/><text class="sub" x="342.0" y="80.0" text-anchor="middle" dominant-baseline="central">01 1</text></g><g class="m"><rect x="312" y="102" width="60" height="28" rx="3"/><text class="sub" x="342.0" y="116.0" text-anchor="middle" dominant-baseline="central">1.5</text></g><text class="sub2" x="342" y="154" text-anchor="middle">1.1×2⁰</text><g class="u"><rect x="376" y="66" width="60" height="28" rx="3"/><text class="sub" x="406.0" y="80.0" text-anchor="middle" dominant-baseline="central">10 0</text></g><g class="m"><rect x="376" y="102" width="60" height="28" rx="3"/><text class="sub" x="406.0" y="116.0" text-anchor="middle" dominant-baseline="central">2</text></g><text class="sub2" x="406" y="154" text-anchor="middle">1.0×2¹</text><g class="u"><rect x="440" y="66" width="60" height="28" rx="3"/><text class="sub" x="470.0" y="80.0" text-anchor="middle" dominant-baseline="central">10 1</text></g><g class="m"><rect x="440" y="102" width="60" height="28" rx="3"/><text class="sub" x="470.0" y="116.0" text-anchor="middle" dominant-baseline="central">3</text></g><text class="sub2" x="470" y="154" text-anchor="middle">1.1×2¹</text><g class="u"><rect x="504" y="66" width="60" height="28" rx="3"/><text class="sub" x="534.0" y="80.0" text-anchor="middle" dominant-baseline="central">11 0</text></g><g class="m"><rect x="504" y="102" width="60" height="28" rx="3"/><text class="sub" x="534.0" y="116.0" text-anchor="middle" dominant-baseline="central">4</text></g><text class="sub2" x="534" y="154" text-anchor="middle">1.0×2²</text><g class="u"><rect x="568" y="66" width="60" height="28" rx="3"/><text class="sub" x="598.0" y="80.0" text-anchor="middle" dominant-baseline="central">11 1</text></g><g class="m"><rect x="568" y="102" width="60" height="28" rx="3"/><text class="sub" x="598.0" y="116.0" text-anchor="middle" dominant-baseline="central">6</text></g><text class="sub2" x="598" y="154" text-anchor="middle">1.1×2²</text><line class="axis" x1="70.0" y1="226" x2="610.0" y2="226"/><line class="tick" x1="70.0" y1="219" x2="70.0" y2="233"/><line class="tick" x1="160.0" y1="219" x2="160.0" y2="233"/><line class="tick" x1="205.0" y1="219" x2="205.0" y2="233"/><line class="tick" x1="250.0" y1="219" x2="250.0" y2="233"/><line class="tick" x1="272.5" y1="219" x2="272.5" y2="233"/><line class="tick" x1="295.0" y1="219" x2="295.0" y2="233"/><line class="tick" x1="317.5" y1="219" x2="317.5" y2="233"/><line class="tick" x1="340.0" y1="219" x2="340.0" y2="233"/><line class="tick" x1="362.5" y1="219" x2="362.5" y2="233"/><line class="tick" x1="385.0" y1="219" x2="385.0" y2="233"/><line class="tick" x1="407.5" y1="219" x2="407.5" y2="233"/><line class="tick" x1="430.0" y1="219" x2="430.0" y2="233"/><line class="tick" x1="475.0" y1="219" x2="475.0" y2="233"/><line class="tick" x1="520.0" y1="219" x2="520.0" y2="233"/><line class="tick" x1="610.0" y1="219" x2="610.0" y2="233"/><text class="sub2" x="70" y="248" text-anchor="middle">−6</text><text class="sub2" x="160" y="248" text-anchor="middle">−4</text><text class="sub2" x="205" y="248" text-anchor="middle">−3</text><text class="sub2" x="250" y="248" text-anchor="middle">−2</text><text class="sub2" x="295" y="248" text-anchor="middle">−1</text><text class="sub2" x="340" y="248" text-anchor="middle">0</text><text class="sub2" x="385" y="248" text-anchor="middle">1</text><text class="sub2" x="430" y="248" text-anchor="middle">2</text><text class="sub2" x="475" y="248" text-anchor="middle">3</text><text class="sub2" x="520" y="248" text-anchor="middle">4</text><text class="sub2" x="610" y="248" text-anchor="middle">6</text><text class="sub2" x="475" y="212" text-anchor="middle">steps 0.5, 0.5, 0.5, 0.5, 1, 1, 2</text><text class="sub2" x="205" y="212" text-anchor="middle">the same, mirrored</text><text class="sub2" x="40" y="288" text-anchor="start">format</text><text class="sub2" x="170" y="288" text-anchor="start">sign, exp, mant</text><text class="sub2" x="300" y="288" text-anchor="start">largest</text><text class="sub2" x="410" y="288" text-anchor="start">finest step</text><text class="sub2" x="530" y="288" text-anchor="start">values ≥ 0</text><text class="cap" x="40" y="312" text-anchor="start">FP4  E2M1</text><text class="sub2" x="170" y="312" text-anchor="start">1 + 2 + 1</text><text class="sub2" x="300" y="312" text-anchor="start">6</text><text class="sub2" x="410" y="312" text-anchor="start">0.5</text><text class="sub2" x="530" y="312" text-anchor="start">8</text><text class="cap" x="40" y="334" text-anchor="start">FP6  E2M3</text><text class="sub2" x="170" y="334" text-anchor="start">1 + 2 + 3</text><text class="sub2" x="300" y="334" text-anchor="start">7.5</text><text class="sub2" x="410" y="334" text-anchor="start">0.125</text><text class="sub2" x="530" y="334" text-anchor="start">32</text><text class="cap" x="40" y="356" text-anchor="start">FP6  E3M2</text><text class="sub2" x="170" y="356" text-anchor="start">1 + 3 + 2</text><text class="sub2" x="300" y="356" text-anchor="start">28</text><text class="sub2" x="410" y="356" text-anchor="start">0.0625</text><text class="sub2" x="530" y="356" text-anchor="start">32</text><text class="cap" x="40" y="406" text-anchor="start">Below the eight-bit floats sit six and four bits. Four bits make only sixteen patterns,</text><text class="cap" x="40" y="426" text-anchor="start">so FP4 can be listed in full. The two exponent bits pick a power of two after</text><text class="cap" x="40" y="446" text-anchor="start">subtracting the bias of 1, and the mantissa bit adds a half; code 00 is the subnormal,</text><text class="cap" x="40" y="466" text-anchor="start">with no implied 1, exactly as in {{fig:v04-p04}}. Code 11 1 is 1.1₂ × 2² = 6, the</text><text class="cap" x="40" y="486" text-anchor="start">largest.</text><text class="cap" x="40" y="526" text-anchor="start">The steps grow 0.5, 0.5, 0.5, 0.5, 1, 1, 2: the float staircase of {{fig:v04-o022}} in</text><text class="cap" x="40" y="546" text-anchor="start">miniature. Nothing is reserved: these small formats have no infinity and no not-a-</text><text class="cap" x="40" y="566" text-anchor="start">number, so every code is a number. FP6 splits its six bits two ways, as FP8 does: more</text><text class="cap" x="40" y="586" text-anchor="start">exponent reaches 28, more mantissa steps eight times finer.</text><text class="cap" x="40" y="626" text-anchor="start">Alone, FP4 covers only 0.5 to 6. It becomes useful with a scale shared by a small block</text><text class="cap" x="40" y="646" text-anchor="start">of values, which is how MXFP4 and NVFP4 use it ({{fig:v04-o076}}).</text></svg><figcaption>Sixteen patterns, fifteen numbers, since plus and minus zero coincide. Every four-bit method later in this atlas is a way of deciding where to lay this tiny ruler.</figcaption></figure>
