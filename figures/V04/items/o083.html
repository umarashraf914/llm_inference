<figure><div class='ts'>Fig 83 &nbsp;&middot;&nbsp; 20:25</div><h3>The distinction to carry forward</h3><svg viewBox="0 0 680 222" role="img"><title>The distinction to carry forward</title><g class="s"><rect x="40" y="58" width="285" height="74" rx="8"></rect><text class="lbl" x="182.5" y="86.0" text-anchor="middle" dominant-baseline="central">Memory savings</text><text class="sub" x="182.5" y="104.0" text-anchor="middle" dominant-baseline="central">reliable on any hardware</text></g><g class="h"><rect x="368" y="58" width="272" height="74" rx="8"></rect><text class="lbl" x="504.0" y="86.0" text-anchor="middle" dominant-baseline="central">Maths speed-ups</text><text class="sub" x="504.0" y="104.0" text-anchor="middle" dominant-baseline="central">only on silicon built for the format</text></g><text class="cap" x="40" y="174" text-anchor="start">Fewer bits always means fewer bytes across the wall. Fewer bits only sometimes means faster</text><text class="cap" x="40" y="194" text-anchor="start">arithmetic. Keeping those two apart will save you a great deal of confusion.</text></svg><figcaption>Quantization and reduced-precision compute are different things that usually travel together. When they come apart, this is the sentence that tells you what you actually bought.</figcaption></figure>
