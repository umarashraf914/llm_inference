<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 15:11</div><h3>The choice underneath everything</h3><svg viewBox='0 0 680 422' role='img'><title>The choice underneath everything</title><text class="hd" x="40" y="40">How many numbers share a single scale?</text><text class="cap" x="40" y="88" text-anchor="start">Per tensor</text><text class="sub2" x="40" y="108" text-anchor="start">one scale for a whole</text><text class="sub2" x="40" y="124" text-anchor="start">4,096 × 4,096 matrix</text><g class="h"><rect x="260" y="70" width="264.0" height="34" rx="3"/></g><text class="sub2" x="534" y="85" text-anchor="start">16,777,216 = 2²⁴</text><text class="sub2" x="534" y="101" text-anchor="start">most fragile</text><text class="cap" x="40" y="160" text-anchor="start">Per channel or per token</text><text class="sub2" x="40" y="180" text-anchor="start">the grain SmoothQuant and the</text><text class="sub2" x="40" y="196" text-anchor="start">KV cache methods work at</text><g class="m"><rect x="260" y="142" width="132.0" height="34" rx="3"/></g><text class="sub2" x="402" y="157" text-anchor="start">4,096 = 2¹²</text><text class="sub2" x="402" y="173" text-anchor="start">spoils one row or one column</text><text class="cap" x="40" y="232" text-anchor="start">Microscaling</text><text class="sub2" x="40" y="252" text-anchor="start">blocks of 16 or 32 values</text><g class="s"><rect x="260" y="214" width="55.0" height="34" rx="3"/></g><g class="s"><rect x="260" y="214" width="44.0" height="34" rx="3"/></g><text class="sub2" x="325" y="229" text-anchor="start">16 or 32 = 2⁴ or 2⁵</text><text class="sub2" x="325" y="245" text-anchor="start">spoils its own block only</text><line class="axis" x1="260.0" y1="280" x2="524.0" y2="280"/><line class="tick" x1="260.0" y1="280" x2="260.0" y2="285"/><text class="sub2" x="260" y="299" text-anchor="middle">2⁰</text><line class="tick" x1="304.0" y1="280" x2="304.0" y2="285"/><text class="sub2" x="304" y="299" text-anchor="middle">2⁴</text><line class="tick" x1="348.0" y1="280" x2="348.0" y2="285"/><text class="sub2" x="348" y="299" text-anchor="middle">2⁸</text><line class="tick" x1="392.0" y1="280" x2="392.0" y2="285"/><text class="sub2" x="392" y="299" text-anchor="middle">2¹²</text><line class="tick" x1="436.0" y1="280" x2="436.0" y2="285"/><text class="sub2" x="436" y="299" text-anchor="middle">2¹⁶</text><line class="tick" x1="480.0" y1="280" x2="480.0" y2="285"/><text class="sub2" x="480" y="299" text-anchor="middle">2²⁰</text><line class="tick" x1="524.0" y1="280" x2="524.0" y2="285"/><text class="sub2" x="524" y="299" text-anchor="middle">2²⁴</text><text class="cap" x="40" y="336" text-anchor="start">Bar length is how many times the count doubles, log₂ of the number of values one scale</text><text class="cap" x="40" y="356" text-anchor="start">covers, so this is a log scale: the top bar covers 4,096 times as many values as the</text><text class="cap" x="40" y="376" text-anchor="start">middle one. Finer grain costs more scale storage and buys more containment. That is the</text><text class="cap" x="40" y="396" text-anchor="start">entire trade.</text></svg><figcaption>Once you see this axis the methods stop looking like a list of tricks and start looking like points on a single dial.</figcaption></figure>
