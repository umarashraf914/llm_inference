<figure><div class='ts'>Fig 73 &nbsp;&middot;&nbsp; 15:08</div><h3>The choice underneath everything</h3><svg viewBox="0 0 680 360" role="img"><title>The choice underneath everything</title><text class="hd" x="40" y="46">How many numbers share a single scale?</text><text class="cap" x="40" y="90" text-anchor="start">Per tensor</text><text class="sub2" x="40" y="110" text-anchor="start">one scale for the whole matrix</text><g class="h"><rect x="300" y="72" width="250" height="34" rx="3"></rect></g><text class="sub2" x="560" y="92" text-anchor="start">most fragile</text><text class="cap" x="40" y="166" text-anchor="start">Per channel or per token</text><text class="sub2" x="40" y="186" text-anchor="start">the grain SmoothQuant works at</text><g class="m"><rect x="300" y="148" width="125" height="34" rx="3"></rect></g><text class="sub2" x="435" y="168" text-anchor="start">spoils one row</text><text class="cap" x="40" y="242" text-anchor="start">Microscaling</text><text class="sub2" x="40" y="262" text-anchor="start">blocks of 16 or 32 values</text><g class="s"><rect x="300" y="224" width="31" height="34" rx="3"></rect></g><text class="sub2" x="341" y="244" text-anchor="start">spoils its own block only</text><text class="cap" x="40" y="318" text-anchor="start">Bar length is how many numbers one scale must cover. Finer grain costs more scale storage and</text><text class="cap" x="40" y="338" text-anchor="start">buys more containment. That is the entire trade.</text></svg><figcaption>Once you see this axis the methods stop looking like a list of tricks and start looking like points on a single dial.</figcaption></figure>
