<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 17:35</div><h3>Quantization-aware training rounds going forward and pretends it did not going back</h3><svg viewBox='0 0 680 622' role='img'><title>Quantization-aware training rounds going forward and pretends it did not going back</title><text class="hd" x="40" y="30">Forward, the weight is rounded; backward, the rounding is treated as y = x</text><line class="axis" x1="70" y1="262" x2="262.0" y2="262"/><line class="axis" x1="70" y1="262" x2="70" y2="70.0"/><line class="tick" x1="70.0" y1="262" x2="70.0" y2="267"/><text class="sub2" x="70" y="281" text-anchor="middle">0</text><line class="tick" x1="65" y1="262" x2="70" y2="262"/><text class="sub2" x="61" y="266" text-anchor="end">0</text><line class="tick" x1="130.0" y1="262" x2="130.0" y2="267"/><text class="sub2" x="130" y="281" text-anchor="middle">0.5</text><line class="tick" x1="65" y1="202.0" x2="70" y2="202.0"/><text class="sub2" x="61" y="206" text-anchor="end">0.5</text><line class="tick" x1="190.0" y1="262" x2="190.0" y2="267"/><text class="sub2" x="190" y="281" text-anchor="middle">1</text><line class="tick" x1="65" y1="142" x2="70" y2="142"/><text class="sub2" x="61" y="146" text-anchor="end">1</text><line class="tick" x1="250.0" y1="262" x2="250.0" y2="267"/><text class="sub2" x="250" y="281" text-anchor="middle">1.5</text><line class="tick" x1="65" y1="82.0" x2="70" y2="82.0"/><text class="sub2" x="61" y="86" text-anchor="end">1.5</text><polyline class="pl-m" fill="none" stroke="var(--m)" stroke-width="2.5" points="70.0,262.0 100.0,262.0"/><polyline class="pl-m" fill="none" stroke="var(--m)" stroke-width="2.5" points="100.0,202.0 160.0,202.0"/><polyline class="pl-m" fill="none" stroke="var(--m)" stroke-width="2.5" points="160.0,142.0 220.0,142.0"/><polyline class="pl-m" fill="none" stroke="var(--m)" stroke-width="2.5" points="220.0,82.0 262.0,82.0"/><polyline class="pl-s" fill="none" stroke="var(--s)" stroke-width="1.5" stroke-dasharray="5 4" points="70.0,262.0 262.0,70.0"/><text class="sub2" x="268" y="74" text-anchor="start">y = x</text><text class="sub2" x="166" y="300" text-anchor="middle">the master weight, full precision</text><text class="sub2" x="40" y="56" text-anchor="start">the weight the forward pass uses</text><circle cx="144.4" cy="202.0" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><circle cx="154.0" cy="202.0" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><circle cx="163.6" cy="142.0" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2" x="134.4" y="186" text-anchor="end">0.62, 0.70</text><text class="sub2" x="169.6" y="130" text-anchor="start">0.78</text><text class="sub2" x="360" y="62" text-anchor="start">step</text><text class="sub2" x="410" y="62" text-anchor="start">master weight</text><text class="sub2" x="510" y="62" text-anchor="start">forward uses</text><text class="sub2" x="598" y="62" text-anchor="start">update</text><text class="cap" x="368" y="88" text-anchor="start">1</text><text class="cap" x="410" y="88" text-anchor="start">0.62</text><text class="cap" x="510" y="88" text-anchor="start">0.5</text><text class="cap" x="598" y="88" text-anchor="start">+0.08</text><text class="cap" x="368" y="112" text-anchor="start">2</text><text class="cap" x="410" y="112" text-anchor="start">0.70</text><text class="cap" x="510" y="112" text-anchor="start">0.5</text><text class="cap" x="598" y="112" text-anchor="start">+0.08</text><text class="cap" x="368" y="136" text-anchor="start">3</text><text class="cap" x="410" y="136" text-anchor="start">0.78</text><text class="cap" x="510" y="136" text-anchor="start" style="fill:var(--h-text)">1.0</text><text class="cap" x="598" y="136" text-anchor="start">+0.08</text><text class="cap" x="368" y="160" text-anchor="start">4</text><text class="cap" x="410" y="160" text-anchor="start">0.86</text><text class="cap" x="510" y="160" text-anchor="start" style="fill:var(--h-text)">1.0</text><text class="sub2" x="360" y="188" text-anchor="start">gradient −0.8 each step, learning rate 0.1</text><text class="cap" x="40" y="336" text-anchor="start">Training moves each weight by its slope: how much the loss changes when the weight moves</text><text class="cap" x="40" y="356" text-anchor="start">a little ({{fig:v04-p11}}). Rounding breaks this. Its graph is a staircase, flat between the</text><text class="cap" x="40" y="376" text-anchor="start">jumps, so its slope is 0 almost everywhere; a weight that saw only its rounded value</text><text class="cap" x="40" y="396" text-anchor="start">would never be told to move.</text><text class="cap" x="40" y="436" text-anchor="start">Quantization-aware training keeps a full-precision master copy of every weight. The</text><text class="cap" x="40" y="456" text-anchor="start">forward pass uses the rounded copy, so the loss is the quantized model's own. The</text><text class="cap" x="40" y="476" text-anchor="start">backward pass pretends the rounding was the straight line y = x and hands the gradient</text><text class="cap" x="40" y="496" text-anchor="start">straight through to the master copy. Bengio, Léonard and Courville named this the</text><text class="cap" x="40" y="516" text-anchor="start">straight-through estimator in 2013, crediting a 2012 lecture by Geoffrey Hinton.</text><text class="cap" x="40" y="556" text-anchor="start">In the table the master weight creeps from 0.62 to 0.70 while the forward pass still</text><text class="cap" x="40" y="576" text-anchor="start">sees 0.5. At 0.78 it passes the halfway mark, 0.75, and the weight in use jumps to 1.</text><text class="cap" x="40" y="596" text-anchor="start">Small updates add up in the master copy until they move the rounding.</text></svg><figcaption>The trick that lets a network learn around its own rounding: round on the way forward, look straight through it on the way back.</figcaption></figure>
