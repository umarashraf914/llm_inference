<figure><div class='ts'>Fig 70 &nbsp;&middot;&nbsp; 13:52</div><h3>Why the cache is harder than the weights</h3><svg viewBox="0 0 680 248" role="img"><title>Why the cache is harder than the weights</title><g class="s"><rect x="40" y="58" width="285" height="78" rx="8"></rect><text class="lbl" x="182.5" y="80.0" text-anchor="middle" dominant-baseline="central">Weights sit still</text><text class="sub" x="182.5" y="98.0" text-anchor="middle" dominant-baseline="central">study them once,</text><text class="sub" x="182.5" y="115.0" text-anchor="middle" dominant-baseline="central">quantize them offline</text></g><g class="h"><rect x="368" y="58" width="272" height="78" rx="8"></rect><text class="lbl" x="504.0" y="80.0" text-anchor="middle" dominant-baseline="central">The cache does not exist</text><text class="sub" x="504.0" y="98.0" text-anchor="middle" dominant-baseline="central">until a request arrives,</text><text class="sub" x="504.0" y="115.0" text-anchor="middle" dominant-baseline="central">and changes with every input</text></g><text class="cap" x="40" y="178" text-anchor="start">You cannot calibrate against data you have not seen, so whatever scheme you use must be decided</text><text class="cap" x="40" y="198" text-anchor="start">in advance and applied on the fly, at speed.</text><text class="cap" x="40" y="226" text-anchor="start">Worse, errors compound: a badly quantized early token leaks into every later token's attention.</text></svg><figcaption>Two separate difficulties, and the second is why the cache tolerates less aggressive quantization than the weights do.</figcaption></figure>
