<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:14</div><h3>Rotation as an outlier treatment</h3><svg viewBox='0 0 680 527' role='img'><title>Rotation as an outlier treatment</title><text class="hd" x="40" y="34">Before: one token's 16 activations, one of them an outlier of 24</text><line class="axis" x1="52.0" y1="144" x2="414.0" y2="144"/><g class="s"><rect x="82" y="142.95" width="16.0" height="1.1" rx="1"/></g><g class="s"><rect x="104" y="144" width="16.0" height="1.1" rx="1"/></g><g class="s"><rect x="126" y="144" width="16.0" height="3.1" rx="1"/></g><g class="s"><rect x="148" y="144" width="16.0" height="1.8" rx="1"/></g><g class="h"><rect x="170" y="60" width="16.0" height="84" rx="1"/></g><g class="s"><rect x="192" y="143.65" width="16.0" height="0.4" rx="1"/></g><g class="s"><rect x="214" y="139.45" width="16.0" height="4.5" rx="1"/></g><g class="s"><rect x="236" y="144" width="16.0" height="1.8" rx="1"/></g><g class="s"><rect x="258" y="144" width="16.0" height="2.1" rx="1"/></g><g class="s"><rect x="280" y="142.25" width="16.0" height="1.8" rx="1"/></g><g class="s"><rect x="302" y="142.6" width="16.0" height="1.4" rx="1"/></g><g class="s"><rect x="324" y="143.65" width="16.0" height="0.4" rx="1"/></g><g class="s"><rect x="346" y="144" width="16.0" height="3.1" rx="1"/></g><g class="s"><rect x="390" y="141.55" width="16.0" height="2.4" rx="1"/></g><text class="sub2" x="440" y="84" text-anchor="start">largest 24: the scale</text><text class="sub2" x="440" y="100" text-anchor="start">must reach it</text><text class="hd" x="40" y="184.0">After a 16-channel Hadamard rotation: the same length, shared out</text><line class="axis" x1="52.0" y1="234.5" x2="414.0" y2="234.5"/><g class="m"><rect x="60" y="213.762" width="16.0" height="20.7" rx="1"/></g><g class="m"><rect x="82" y="234.5" width="16.0" height="21.8" rx="1"/></g><g class="m"><rect x="104" y="216.912" width="16.0" height="17.6" rx="1"/></g><g class="m"><rect x="126" y="234.5" width="16.0" height="19.7" rx="1"/></g><g class="m"><rect x="148" y="234.5" width="16.0" height="22.7" rx="1"/></g><g class="m"><rect x="170" y="211.838" width="16.0" height="22.7" rx="1"/></g><g class="m"><rect x="192" y="234.5" width="16.0" height="18.5" rx="1"/></g><g class="m"><rect x="214" y="216.387" width="16.0" height="18.1" rx="1"/></g><g class="m"><rect x="236" y="213.238" width="16.0" height="21.3" rx="1"/></g><g class="m"><rect x="258" y="234.5" width="16.0" height="22.7" rx="1"/></g><g class="m"><rect x="280" y="210.787" width="16.0" height="23.7" rx="1"/></g><g class="m"><rect x="302" y="234.5" width="16.0" height="22.7" rx="1"/></g><g class="m"><rect x="324" y="234.5" width="16.0" height="22.5" rx="1"/></g><g class="m"><rect x="346" y="211.662" width="16.0" height="22.8" rx="1"/></g><g class="m"><rect x="368" y="234.5" width="16.0" height="17.6" rx="1"/></g><g class="m"><rect x="390" y="213.412" width="16.0" height="21.1" rx="1"/></g><text class="sub2" x="440" y="228.5" text-anchor="start">largest 6.8, signs mixed:</text><text class="sub2" x="440" y="244.5" text-anchor="start">each about 24 ÷ √16 = 6</text><text class="sub2" x="40" y="285" text-anchor="start">Both rows to the same scale.</text><text class="cap" x="40" y="321.0" text-anchor="start">The ordinary values here are made up for the drawing, none larger than 1.3. A 16-channel</text><text class="cap" x="40" y="341.0" text-anchor="start">Hadamard rotation ({{fig:v04-p27}}) gives every channel a share of the outlier, plus or</text><text class="cap" x="40" y="361.0" text-anchor="start">minus 24 ÷ √16 = 6, and a little of each ordinary value, so the turned values run from</text><text class="cap" x="40" y="381.0" text-anchor="start">5.0 to 6.8 in size, with signs mixed.</text><text class="cap" x="40" y="421.0" text-anchor="start">The length, the square root of the sum of squares, is 24.1 both times, because a</text><text class="cap" x="40" y="441.0" text-anchor="start">rotation stretches nothing ({{fig:v04-p25}}). Only the sharing changes. The largest</text><text class="cap" x="40" y="461.0" text-anchor="start">value, which sets the scale, falls from 24 to 6.8, so the steps become 3.5 times finer</text><text class="cap" x="40" y="481.0" text-anchor="start">for every channel. In INT4 the rms error, measured after turning back, falls from 0.57</text><text class="cap" x="40" y="501.0" text-anchor="start">to 0.28 here; at a real model's width the gain is larger ({{fig:v04-p29}}).</text></svg><figcaption>Same information, redistributed. It is the trick FlashAttention 3 used to make FP8 attention safe ({{ref:v03-p25}}).</figcaption></figure>
