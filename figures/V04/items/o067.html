<figure><div class='ts'>Fig 67 &nbsp;&middot;&nbsp; 13:08</div><h3>Rotation as an outlier treatment</h3><svg viewBox="0 0 680 354" role="img"><title>Rotation as an outlier treatment</title><text class="hd" x="40" y="46">Before: one channel carries the whole outlier</text><line class="axis" x1="50" y1="106" x2="400" y2="106"></line><g class="s"><rect x="52" y="96" width="22" height="10" rx="1"></rect></g><g class="s"><rect x="81" y="96" width="22" height="10" rx="1"></rect></g><g class="s"><rect x="110" y="96" width="22" height="10" rx="1"></rect></g><g class="s"><rect x="139" y="96" width="22" height="10" rx="1"></rect></g><g class="s"><rect x="168" y="96" width="22" height="10" rx="1"></rect></g><g class="s"><rect x="197" y="96" width="22" height="10" rx="1"></rect></g><g class="s"><rect x="226" y="96" width="22" height="10" rx="1"></rect></g><g class="s"><rect x="255" y="96" width="22" height="10" rx="1"></rect></g><g class="s"><rect x="284" y="96" width="22" height="10" rx="1"></rect></g><g class="s"><rect x="313" y="96" width="22" height="10" rx="1"></rect></g><g class="s"><rect x="342" y="96" width="22" height="10" rx="1"></rect></g><g class="s"><rect x="371" y="96" width="22" height="10" rx="1"></rect></g><g class="h"><rect x="342" y="62" width="22" height="44" rx="1"></rect></g><text class="hd" x="40" y="158">After the rotation: smeared across all of them</text><line class="axis" x1="50" y1="218" x2="400" y2="218"></line><g class="m"><rect x="52" y="200" width="22" height="18" rx="1"></rect></g><g class="m"><rect x="81" y="200" width="22" height="18" rx="1"></rect></g><g class="m"><rect x="110" y="200" width="22" height="18" rx="1"></rect></g><g class="m"><rect x="139" y="200" width="22" height="18" rx="1"></rect></g><g class="m"><rect x="168" y="200" width="22" height="18" rx="1"></rect></g><g class="m"><rect x="197" y="200" width="22" height="18" rx="1"></rect></g><g class="m"><rect x="226" y="200" width="22" height="18" rx="1"></rect></g><g class="m"><rect x="255" y="200" width="22" height="18" rx="1"></rect></g><g class="m"><rect x="284" y="200" width="22" height="18" rx="1"></rect></g><g class="m"><rect x="313" y="200" width="22" height="18" rx="1"></rect></g><g class="m"><rect x="342" y="200" width="22" height="18" rx="1"></rect></g><g class="m"><rect x="371" y="200" width="22" height="18" rx="1"></rect></g><text class="sub2" x="430" y="106" text-anchor="start">every output unchanged</text><text class="sub2" x="430" y="218" text-anchor="start">no single channel stretches</text><text class="sub2" x="430" y="238" text-anchor="start">the scale any more</text><text class="cap" x="40" y="282" text-anchor="start">The outlier's energy has to go somewhere, and a rotation distributes it evenly rather than</text><text class="cap" x="40" y="302" text-anchor="start">concentrating it. The shared scale can then be sized to a much smaller maximum.</text><text class="cap" x="40" y="332" text-anchor="start">Rotation is what finally makes four-bit activations workable.</text></svg><figcaption>Same information, redistributed. This is the same trick FlashAttention 3 used to make FP8 attention numerically safe.</figcaption></figure>
