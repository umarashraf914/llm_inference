<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 16:41</div><h3>What the scales cost: 4.25 and 4.5 bits per value</h3><svg viewBox='0 0 680 514' role='img'><title>What the scales cost: 4.25 and 4.5 bits per value</title><text class="hd" x="40" y="30">Bits stored per value, scales included, to scale</text><text class="cap" x="40" y="69" text-anchor="start">FP16</text><g class="u"><rect x="230" y="52" width="384.0" height="24" rx="2"/></g><text class="sub2" x="622" y="69" text-anchor="start">16</text><text class="cap" x="40" y="109" text-anchor="start">FP8</text><g class="u"><rect x="230" y="92" width="192.0" height="24" rx="2"/></g><text class="sub2" x="430" y="109" text-anchor="start">8</text><text class="cap" x="40" y="149" text-anchor="start">INT4, FP16 scale per 128</text><g class="m"><rect x="230" y="132" width="99.0" height="24" rx="2"/></g><text class="sub2" x="337" y="149" text-anchor="start">4.125, 3.88× smaller than FP16</text><text class="cap" x="40" y="189" text-anchor="start">MXFP4</text><g class="s"><rect x="230" y="172" width="102.0" height="24" rx="2"/></g><text class="sub2" x="340" y="189" text-anchor="start">4.25, 3.76× smaller than FP16</text><text class="cap" x="40" y="229" text-anchor="start">NVFP4</text><g class="s"><rect x="230" y="212" width="108.0" height="24" rx="2"/></g><text class="sub2" x="346" y="229" text-anchor="start">4.5, 3.56× smaller than FP16</text><line class="axis" x1="230.0" y1="248" x2="614.0" y2="248"/><line class="tick" x1="230.0" y1="248" x2="230.0" y2="253"/><text class="sub2" x="230" y="267" text-anchor="middle">0</text><line class="tick" x1="326.0" y1="248" x2="326.0" y2="253"/><text class="sub2" x="326" y="267" text-anchor="middle">4</text><line class="tick" x1="422.0" y1="248" x2="422.0" y2="253"/><text class="sub2" x="422" y="267" text-anchor="middle">8</text><line class="tick" x1="518.0" y1="248" x2="518.0" y2="253"/><text class="sub2" x="518" y="267" text-anchor="middle">12</text><line class="tick" x1="614.0" y1="248" x2="614.0" y2="253"/><text class="sub2" x="614" y="267" text-anchor="middle">16</text><text class="sub2" x="614" y="285" text-anchor="end">bits per value</text><text class="cap" x="40" y="328" text-anchor="start">Each block pays for its own scale. An 8-bit scale shared by 32 values costs a quarter of</text><text class="cap" x="40" y="348" text-anchor="start">a bit per value, shared by 16 half a bit. NVFP4's FP32 number per tensor adds 32 bits to</text><text class="cap" x="40" y="368" text-anchor="start">a 4,096 × 4,096 matrix, 32 ÷ 16,777,216, about two millionths of a bit per value:</text><text class="cap" x="40" y="388" text-anchor="start">nothing. INT4 with an FP16 scale per group of 128 costs an eighth of a bit ({{fig:v04-o058}}).</text><text class="cap" x="40" y="428" text-anchor="start">So MXFP4 is 3.76 times smaller than FP16 and NVFP4 3.56 times, against the 4 times of</text><text class="cap" x="40" y="448" text-anchor="start">bare 4-bit numbers; NVIDIA's own figures, about 3.5 times smaller than FP16 and 1.8</text><text class="cap" x="40" y="468" text-anchor="start">times smaller than FP8, are this arithmetic. Containment and finer scales cost a quarter</text><text class="cap" x="40" y="488" text-anchor="start">or half a bit per value.</text></svg><figcaption>The price of a scale is its bits divided by the values that share it.</figcaption></figure>
