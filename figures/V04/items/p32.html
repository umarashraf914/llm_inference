th="1.2"/><circle data-s="mx" cx="152.4" cy="146" r="3.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="1.2"/><text class="sub2" x="40" y="192">scale <tspan data-k="mx-scale">2</tspan>: the levels are <tspan data-k="mx-levels">0, 1, 2, 3, 4, 6, 8, 12</tspan></text><text class="sub2" x="40" y="210">the largest value, <tspan data-k="mx-big">11.0</tspan>, is stored as <tspan data-k="mx-stored">12</tspan>, off by <tspan data-k="mx-off">1.00</tspan>; rms error over the 16: <tspan data-k="mx-rms">0.512</tspan></text><text class="cap" x="40" y="252" text-anchor="start">NVFP4: the block's largest value ÷ 6, rounded to the nearest FP8 (E4M3) number</text><line class="axis" x1="50.0" y1="298" x2="630.0" y2="298"/><line class="axis" x1="50.0" y1="298" x2="50.0" y2="302"/><text class="sub2" x="50" y="332" text-anchor="middle">0</text><line class="axis" x1="118.2" y1="298" x2="118.2" y2="302"/><text class="sub2" x="118.235" y="332" text-anchor="middle">2</text><line class="axis" x1="186.5" y1="298" x2="186.5" y2="302"/><text class="sub2" x="186.471" y="332" text-anchor="middle">4</text><line class="axis" x1="254.7" y1="298" x2="254.7" y2="302"/><text class="sub2" x="254.706" y="332" text-anchor="middle">6</text><line class="axis" x1="322.9" y1="298" x2="322.9" y2="302"/><text class="sub2" x="322.941" y="332" text-anchor="middle">8</text><line class="axis" x1="391.2" y1="298" x2="391.2" y2="302"/><text class="sub2" x="391.176" y="332" text-anchor="middle">10</text><line class="axis" x1="459.4" y1="298" x2="459.4" y2="302"/><text class="sub2" x="459.412" y="332" text-anchor="middle">12</text><line class="axis" x1="527.6" y1="298" x2="527.6" y2="302"/><text class="sub2" x="527.647" y="332" text-anchor="middle">14</text><line class="axis" x1="595.9" y1="298" x2="595.9" y2="302"/><text class="sub2" x="595.882" y="332" text-anchor="middle">16</text><line class="tick" data-g="nv" x1="50.0" y1="289" x2="50.0" y2="307"/><line class="tick" data-g="nv" x1="82.0" y1="289" x2="82.0" y2="307"/><line class="tick" data-g="nv" x1="114.0" y1="289" x2="114.0" y2="307"/><line class="tick" data-g="nv" x1="146.0" y1="289" x2="146.0" y2="307"/><line class="tick" data-g="nv" x1="177.9" y1="289" x2="177.9" y2="307"/><line class="tick" data-g="nv" x1="241.9" y1="289" x2="241.9" y2="307"/><line class="tick" data-g="nv" x1="305.9" y1="289" x2="305.9" y2="307"/><line class="tick" data-g="nv" x1="433.8" y1="289" x2="433.8" y2="307"/><circle data-v="0" cx="56.8" cy="282" r="3.5" fill="var(--m-fill)" stroke="var(--m)" stroke-width="1.2"/><circle data-v="1" cx="326.2" cy="282" r="3.5" fill="var(--m-fill)" stroke="var(--m)" stroke-width="1.2"/><circle data-v="2" cx="298.8" cy="282" r="3.5" fill="var(--m-fill)" stroke="var(--m)" stroke-width="1.2"/><circle data-v="3" cx="153.6" cy="282" r="3.5" fill="var(--m-fill)" stroke="var(--m)" stroke-width="1.2"/><circle data-v="4" cx="110.4" cy="282" r="3.5" fill="var(--m-fill)" stroke="var(--m)" stroke-width="1.2"/><circle data-v="5" cx="157.0" cy="282" r="3.5" fill="var(--m-fill)" stroke="var(--m)" stroke-width="1.2"/><circle data-v="6" cx="166.0" cy="282" r="3.5" fill="var(--m-fill)" stroke="var(--m)" stroke-width="1.2"/><circle data-v="7" cx="61.3" cy="282" r="3.5" fill="var(--m-fill)" stroke="var(--m)" stroke-width="1.2"/><circle data-v="8" cx="201.6" cy="282" r="3.5" fill="var(--m-fill)" stroke="var(--m)" stroke-width="1.2"/><circle data-v="9" cx="425.3" cy="282" r="3.5" fill="var(--m-fill)" stroke="var(--m)" stroke-width="1.2"/><circle data-v="10" cx="368.2" cy="282" r="3.5" fill="var(--m-fill)" stroke="var(--m)" stroke-width="1.2"/><circle data-v="11" cx="69.5" cy="282" r="3.5" fill="var(--m-fill)" stroke="var(--m)" stroke-width="1.2"/><circle data-v="12" cx="188.1" cy="282" r="3.5" fill="var(--m-fill)" stroke="var(--m)" stroke-width="1.2"/><circle data-v="13" cx="77.8" cy="282" r="3.5" fill="var(--m-fill)" stroke="var(--m)" stroke-width="1.2"/><circle data-v="14" cx="126.9" cy="282" r="3.5" fill="var(--m-fill)" stroke="var(--m)" stroke-width="1.2"/><circle data-v="15" cx="144.2" cy="282" r="3.5" fill="var(--m-fill)" stroke="var(--m)" stroke-width="1.2"/><circle data-s="nv" cx="50.0" cy="314" r="3.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="1.2"/><circle data-s="nv" cx="305.9" cy="314" r="3.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="1.2"/><circle data-s="nv" cx="305.9" cy="314" r="3.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="1.2"/><circle data-s="nv" cx="146.0" cy="314" r="3.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="1.2"/><circle data-s="nv" cx="114.0" cy="314" r="3.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="1.2"/><circle data-s="nv" cx="146.0" cy="314" r="3.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="1.2"/><circle data-s="nv" cx="177.9" cy="314" r="3.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="1.2"/><circle data-s="nv" cx="50.0" cy="314" r="3.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="1.2"/><circle data-s="nv" cx="177.9" cy="314" r="3.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="1.2"/><circle data-s="nv" cx="433.8" cy="314" r="3.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="1.2"/><circle data-s="nv" cx="305.9" cy="314" r="3.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="1.2"/><circle data-s="nv" cx="82.0" cy="314" r="3.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="1.2"/><circle data-s="nv" cx="177.9" cy="314" r="3.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="1.2"/><circle data-s="nv" cx="82.0" cy="314" r="3.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="1.2"/><circle data-s="nv" cx="114.0" cy="314" r="3.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="1.2"/><circle data-s="nv" cx="146.0" cy="314" r="3.5" fill="var(--s-fill)" stroke="var(--s)" stroke-width="1.2"/><text class="sub2" x="40" y="360">scale <tspan data-k="nv-scale">1.875</tspan>: the levels are <tspan data-k="nv-levels">0, 0.9375, 1.875, 2.8125, 3.75, 5.625, 7.5, 11.25</tspan></text><text class="sub2" x="40" y="378">the largest value, <tspan data-k="nv-big">11.0</tspan>, is stored as <tspan data-k="nv-stored">11.25</tspan>, off by <tspan data-k="nv-off">0.25</tspan>; rms error over the 16: <tspan data-k="nv-rms">0.565</tspan></text><text class="sub2" x="40" y="406">the ideal scale, the largest value ÷ 6: <tspan data-k="ideal">1.833</tspan></text><text class="cap" x="40" y="450" text-anchor="start">Both formats store each value as one of FP4's levels, 0, 0.5, 1, 1.5, 2, 3, 4 and 6,</text><text class="cap" x="40" y="470" text-anchor="start">times the block's scale ({{fig:v04-p06}}), and both aim to put the block's largest value</text><text class="cap" x="40" y="490" text-anchor="start">at the top level, 6. The ideal scale is therefore the largest value ÷ 6.</text><text class="cap" x="40" y="530" text-anchor="start">MXFP4's scale must be a power of two. For a largest value of 11 the OCP rule gives 8 ÷ 4</text><text class="cap" x="40" y="550" text-anchor="start">= 2, so the top level is 12 and 11 is stored as 12. For 7 it gives 4 ÷ 4 = 1, the top</text><text class="cap" x="40" y="570" text-anchor="start">level is 6, and 7 is clipped to 6. The rule lands between 0.75 and 1.5 times the ideal</text><text class="cap" x="40" y="590" text-anchor="start">scale and clips whenever it lands low. cuBLAS rounds the power of two up instead, which</text><text class="cap" x="40" y="610" text-anchor="start">never clips but can make the steps up to twice too coarse: a full factor of two.</text><text class="cap" x="40" y="650" text-anchor="start">NVFP4's scale is an FP8 number, with 8 steps between one power of two and the next, so</text><text class="cap" x="40" y="670" text-anchor="start">it lands within 6.25% of the ideal: 11 ÷ 6 = 1.833 becomes 1.875, and 11 is stored as</text><text class="cap" x="40" y="690" text-anchor="start">11.25. Drag the largest value. MXFP4's levels jump only when it crosses a power of two;</text><text class="cap" x="40" y="710" text-anchor="start">NVFP4's follow it in small steps. The widget's numbers were checked against Python at</text><text class="cap" x="40" y="730" text-anchor="start">every setting.</text></svg></div><figcaption>The scale decides where FP4's few levels sit. A power of two can only put them in a handful of places; an FP8 scale can put them almost where the block needs.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const P = [0.018, 0.736, 0.663, 0.276, 0.161, 0.285, 0.309, 0.03, 0.404, 1.0, 0.848, 0.052, 0.368, 0.074, 0.205, 0.251], FP4 = [0, 0.5, 1, 1.5, 2, 3, 4, 6], [X0, X1, VMAX] = [50, 630, 17], A0 = 11.0;
  const sl = fig.querySelector('input[type=range]'), val = fig.querySelector('.val');
  const fx = (v, d) => (v < 0 && Math.abs(v).toFixed(d) !== (0).toFixed(d) ? '−' : '') + Math.abs(v).toFixed(d);
  const px = v => X0 + v / VMAX * (X1 - X0);
  const exp2floor = y => { let e = Math.floor(Math.log2(y));
    while (Math.pow(2, e) > y) e--; while (Math.pow(2, e + 1) <= y) e++; return e; };
  const rne = q => { const r = Math.floor(q), d = q - r; return d > 0.5 ? r + 1 : d < 0.5 ? r : (r % 2 === 0 ? r : r + 1); };
  const fp4 = u => { for (let k = 0; k < 7; k++) { const mid = (FP4[k] + FP4[k + 1]) / 2;
    if (u < mid) return FP4[k]; if (u === mid) return k % 2 === 0 ? FP4[k] : FP4[k + 1]; } return 6; };
  const e4m3 = y => { const e = exp2floor(y), step = Math.pow(2, e - 3); return rne(y / step) * step; };
  const set = (k, s) => fig.querySelectorAll(`[data-k="${k}"]`).forEach(e => e.textContent = s);
  function draw() {
    const a = parseFloat(sl.value), vals = P.map(p => a * p);
    val.textContent = fx(a, 1);
    fig.querySelectorAll('[data-v]').forEach((e, i) => e.setAttribute('cx', fx(px(vals[i % 16]), 1)));
    let top = 0; for (let i = 1; i < 16; i++) if (vals[i] > vals[top]) top = i;
    for (const [key, sc] of [['mx', Math.pow(2, exp2floor(a) - 2)], ['nv', e4m3(a / 6)]]) {
      const st = vals.map(v => sc * fp4(v / sc)); let acc = 0;
      for (let i = 0; i < 16; i++) { const e = st[i] - vals[i]; acc += e * e; }
      fig.querySelectorAll(`[data-s="${key}"]`).forEach((e, i) => e.setAttribute('cx', fx(px(st[i]), 1)));
      fig.querySelectorAll(`[data-g="${key}"]`).forEach((e, i) => { const x = fx(px(sc * FP4[i]), 1);
        e.setAttribute('x1', x); e.setAttribute('x2', x); });
      set(key + '-scale', String(sc)); set(key + '-levels', FP4.map(g => String(sc * g)).join(', '));
      set(key + '-big', fx(a, 1)); set(key + '-stored', String(st[top]));
      set(key + '-off', fx(Math.abs(st[top] - vals[top]), 2)); set(key + '-rms', fx(Math.sqrt(acc / 16), 3));
    }
    set('ideal', fx(a / 6, 3));
  }
  sl.addEventListener('input', draw);
  fig.querySelectorAll('button[data-a]').forEach(bt => bt.addEventListener('click', () => { sl.value = bt.dataset.a; draw(); }));
  fig.querySelector('button[data-reset]').addEventListener('click', () => { sl.value = A0; draw(); });
  draw();
})();</script></figure>
