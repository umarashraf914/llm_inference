<figure><div class='ts'>Fig 29 &nbsp;&middot;&nbsp; 2:38</div><h3>Storage format against compute format</h3><svg viewBox="0 0 680 260" role="img"><title>Storage format against compute format</title><g class="s"><rect x="45" y="58" width="175" height="60" rx="8"></rect><text class="lbl" x="132.5" y="79.0" text-anchor="middle" dominant-baseline="central">FP32 in</text><text class="sub" x="132.5" y="97.0" text-anchor="middle" dominant-baseline="central">read from memory</text></g><line class="conn" x1="226" y1="88" x2="252" y2="88" marker-end="url(#arw)"></line><g class="m"><rect x="258" y="58" width="175" height="60" rx="8"></rect><text class="lbl" x="345.5" y="79.0" text-anchor="middle" dominant-baseline="central">round to TF32</text><text class="sub" x="345.5" y="97.0" text-anchor="middle" dominant-baseline="central">for the multiply only</text></g><line class="conn" x1="439" y1="88" x2="465" y2="88" marker-end="url(#arw)"></line><g class="s"><rect x="471" y="58" width="169" height="60" rx="8"></rect><text class="lbl" x="555.5" y="79.0" text-anchor="middle" dominant-baseline="central">FP32 out</text><text class="sub" x="555.5" y="97.0" text-anchor="middle" dominant-baseline="central">accumulate back</text></g><text class="cap" x="40" y="160" text-anchor="start">TF32 is never written to memory. Values arrive as FP32, are rounded for the multiply, and</text><text class="cap" x="40" y="180" text-anchor="start">accumulate back into FP32. On the A100 that bought roughly eight times the single-precision</text><text class="cap" x="40" y="200" text-anchor="start">throughput, and zero bandwidth saving.</text><text class="cap" x="40" y="230" text-anchor="start">Reduced-precision compute and quantization are different things. This is the clean example.</text></svg><figcaption>A distinction worth internalising now, because it returns at the very end as the most practical caveat in the subject.</figcaption></figure>
