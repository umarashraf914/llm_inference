<figure><div class='ts'>Fig 69 &nbsp;&middot;&nbsp; 13:35</div><h3>How big the cache gets</h3><svg viewBox="0 0 680 386" role="img"><title>How big the cache gets</title><g class="m"><rect x="60" y="46" width="560" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">cache bytes  =  2  x  layers  x  batch  x  sequence  x  KV heads  x  head dim  x  bytes</text></g><text class="cap" x="40" y="118" text-anchor="start">The 2 is one key and one value. Everything else multiplies, which is why the cache grows so</text><text class="cap" x="40" y="138" text-anchor="start">fast: it scales with batch size and sequence length together.</text><text class="cap" x="40" y="178" text-anchor="start">For a 70-billion-parameter model with 80 layers, 8 KV heads and head dimension 128, in FP16,</text><text class="cap" x="40" y="198" text-anchor="start">that is 320 KB for every single token held in context.</text><text class="cap" x="40" y="238" text-anchor="start">Weights</text><g class="h"><rect x="230" y="222" width="390" height="30" rx="3"></rect><text class="sub" x="425.0" y="237.0" text-anchor="middle" dominant-baseline="central">140 GB, fixed</text></g><text class="cap" x="40" y="288" text-anchor="start">Cache at 64 x 6,700</text><g class="s"><rect x="230" y="272" width="390" height="30" rx="3"></rect><text class="sub" x="425.0" y="287.0" text-anchor="middle" dominant-baseline="central">140 GB, and still growing</text></g><text class="cap" x="40" y="344" text-anchor="start">Around a batch of 64 at 6,700 tokens of context, the cache equals the weights. Past that it</text><text class="cap" x="40" y="364" text-anchor="start">dominates, both to fit in memory and to reread on every token.</text></svg><figcaption>The weights are a fixed cost. The cache is a running one, and at long context it is the larger of the two.</figcaption></figure>
