<figure><div class='ts'>Fig 21 &nbsp;&middot;&nbsp; 1:24</div><h3>Where 6.5 can actually land</h3><svg viewBox="0 0 680 452" role="img"><title>Where 6.5 can actually land</title><text class="hd" x="40" y="44">The neighbourhood of 6.5, in four formats</text><text class="sub2" x="40" y="92" text-anchor="start">FP16</text><line class="axis" x1="100" y1="88" x2="560" y2="88"></line><g class="s"><rect x="100" y="81" width="460" height="14" rx="2"></rect></g><text class="sub2" x="574" y="92" text-anchor="start">1024 steps</text><text class="sub2" x="40" y="154" text-anchor="start">BF16</text><line class="axis" x1="100" y1="150" x2="560" y2="150"></line><g class="s"><rect x="100" y="143" width="460" height="14" rx="2"></rect></g><text class="sub2" x="574" y="154" text-anchor="start">128 steps</text><text class="sub2" x="40" y="216" text-anchor="start">E4M3</text><line class="axis" x1="100" y1="212" x2="560" y2="212"></line><line class="tick" x1="100.0" y1="205" x2="100.0" y2="219"></line><line class="tick" x1="157.5" y1="205" x2="157.5" y2="219"></line><line class="tick" x1="215.0" y1="205" x2="215.0" y2="219"></line><line class="tick" x1="272.5" y1="205" x2="272.5" y2="219"></line><line class="tick" x1="330.0" y1="205" x2="330.0" y2="219"></line><line class="tick" x1="387.5" y1="205" x2="387.5" y2="219"></line><line class="tick" x1="445.0" y1="205" x2="445.0" y2="219"></line><line class="tick" x1="502.5" y1="205" x2="502.5" y2="219"></line><line class="tick" x1="560.0" y1="205" x2="560.0" y2="219"></line><text class="sub2" x="574" y="216" text-anchor="start">8 steps</text><text class="sub2" x="40" y="278" text-anchor="start">E5M2</text><line class="axis" x1="100" y1="274" x2="560" y2="274"></line><line class="tick" x1="100.0" y1="267" x2="100.0" y2="281"></line><line class="tick" x1="215.0" y1="267" x2="215.0" y2="281"></line><line class="tick" x1="330.0" y1="267" x2="330.0" y2="281"></line><line class="tick" x1="445.0" y1="267" x2="445.0" y2="281"></line><line class="tick" x1="560.0" y1="267" x2="560.0" y2="281"></line><text class="sub2" x="574" y="278" text-anchor="start">4 steps</text><line class="mark xok" x1="387.5" y1="74" x2="387.5" y2="340"></line><text class="hd" x="387.5" y="66" text-anchor="middle">6.5</text><text class="sub2" x="100" y="372" text-anchor="middle">4</text><text class="sub2" x="330" y="372" text-anchor="middle">6</text><text class="sub2" x="560" y="372" text-anchor="middle">8</text><text class="cap" x="40" y="410" text-anchor="start">In E5M2 the only values available here are 4, 5, 6 and 7. There is no 6.5 to land on, so it</text><text class="cap" x="40" y="430" text-anchor="start">rounds to a neighbour, and that difference is the quantization error.</text></svg><figcaption>Read down the column. The same value sits comfortably inside FP16's grid and falls between ticks by the time you reach E5M2.</figcaption></figure>
