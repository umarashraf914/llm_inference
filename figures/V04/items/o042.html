<figure><div class='ts'>Fig 42 &nbsp;&middot;&nbsp; 5:32</div><h3>What rounding does to one weight</h3><svg viewBox="0 0 680 268" role="img"><title>What rounding does to one weight</title><text class="hd" x="40" y="46">Round-to-nearest: the error is bounded by half a step</text><line class="axis" x1="70" y1="110" x2="610" y2="110"></line><line class="tick" x1="70" y1="102" x2="70" y2="118"></line><line class="tick" x1="130" y1="102" x2="130" y2="118"></line><line class="tick" x1="190" y1="102" x2="190" y2="118"></line><line class="tick" x1="250" y1="102" x2="250" y2="118"></line><line class="tick" x1="310" y1="102" x2="310" y2="118"></line><line class="tick" x1="370" y1="102" x2="370" y2="118"></line><line class="tick" x1="430" y1="102" x2="430" y2="118"></line><line class="tick" x1="490" y1="102" x2="490" y2="118"></line><line class="tick" x1="550" y1="102" x2="550" y2="118"></line><line class="tick" x1="610" y1="102" x2="610" y2="118"></line><g class="h"><rect x="285" y="96" width="6" height="28" rx="1"></rect></g><text class="sub2" x="292" y="88" text-anchor="start">the true value</text><line class="conn" x1="288" y1="140" x2="310" y2="140" marker-end="url(#arw)"></line><text class="sub2" x="316" y="144" text-anchor="start">rounds here</text><text class="cap" x="40" y="196" text-anchor="start">Every weight lands on the nearest available tick. The error is at most half the gap, and across</text><text class="cap" x="40" y="216" text-anchor="start">many weights it is roughly uniform between minus half a step and plus half a step.</text><text class="cap" x="40" y="246" text-anchor="start">Crucially it averages to zero, and each weight's error is independent of its neighbours'.</text></svg><figcaption>Small, bounded, zero-mean and independent. Those four properties are what the next figure cashes in.</figcaption></figure>
