322.08" width="15.68" height="77.92" rx="1" data-h2="16" data-count="17"/></g><g class="s"><rect x="367.48" y="331.25" width="15.68" height="68.75" rx="1" data-h2="17" data-count="15"/></g><g class="s"><rect x="384.35" y="326.67" width="15.68" height="73.33" rx="1" data-h2="18" data-count="16"/></g><g class="s"><rect x="401.23" y="326.67" width="15.68" height="73.33" rx="1" data-h2="19" data-count="16"/></g><g class="s"><rect x="418.10" y="354.17" width="15.68" height="45.83" rx="1" data-h2="20" data-count="10"/></g><g class="s"><rect x="434.98" y="367.92" width="15.68" height="32.08" rx="1" data-h2="21" data-count="7"/></g><g class="s"><rect x="451.85" y="372.50" width="15.68" height="27.50" rx="1" data-h2="22" data-count="6"/></g><g class="s"><rect x="468.73" y="381.67" width="15.68" height="18.33" rx="1" data-h2="23" data-count="4"/></g><g class="s"><rect x="485.60" y="377.08" width="15.68" height="22.92" rx="1" data-h2="24" data-count="5"/></g><g class="s"><rect x="502.48" y="395.42" width="15.68" height="4.58" rx="1" data-h2="25" data-count="1"/></g><g class="s"><rect x="519.35" y="400.00" width="15.68" height="0.00" rx="1" data-h2="26" data-count="0"/></g><g class="s"><rect x="536.23" y="400.00" width="15.68" height="0.00" rx="1" data-h2="27" data-count="0"/></g><g class="s"><rect x="553.10" y="395.42" width="15.68" height="4.58" rx="1" data-h2="28" data-count="1"/></g><g class="s"><rect x="569.98" y="400.00" width="15.68" height="0.00" rx="1" data-h2="29" data-count="0"/></g><g class="s"><rect x="586.85" y="400.00" width="15.68" height="0.00" rx="1" data-h2="30" data-count="0"/></g><g class="s"><rect x="603.73" y="400.00" width="15.68" height="0.00" rx="1" data-h2="31" data-count="0"/></g><line class="axis" x1="80.0" y1="400" x2="620.0" y2="400"/><line class="tick" x1="80.0" y1="396" x2="80.0" y2="404"/><text class="sub2" x="80" y="422" text-anchor="middle">−4√n</text><line class="tick" x1="215.0" y1="396" x2="215.0" y2="404"/><text class="sub2" x="215" y="422" text-anchor="middle">−2√n</text><line class="tick" x1="350.0" y1="396" x2="350.0" y2="404"/><text class="sub2" x="350" y="422" text-anchor="middle">0</text><line class="tick" x1="485.0" y1="396" x2="485.0" y2="404"/><text class="sub2" x="485" y="422" text-anchor="middle">2√n</text><line class="tick" x1="620.0" y1="396" x2="620.0" y2="404"/><text class="sub2" x="620" y="422" text-anchor="middle">4√n</text><text class="sub2" x="40" y="456" text-anchor="start">typical size of the 200 sums (their rms)</text><text class="sub2" x="330" y="456" text-anchor="start" data-k="rms">15.83</text><text class="sub2" x="40" y="478" text-anchor="start">√n</text><text class="sub2" x="330" y="478" text-anchor="start" data-k="root">16</text><text class="sub2" x="40" y="500" text-anchor="start">worst case, every toss the same</text><text class="sub2" x="330" y="500" text-anchor="start" data-k="worst">256</text><text class="cap" x="40" y="548" text-anchor="start">Each term of a rounded weighted sum carries a small error, equally likely to push up or</text><text class="cap" x="40" y="568" text-anchor="start">down, like a coin toss scoring +1 or −1. In the worst case all n agree and the total is</text><text class="cap" x="40" y="588" text-anchor="start">n. Move the slider: the sums cluster ever more tightly on the scale of n, while the</text><text class="cap" x="40" y="608" text-anchor="start">zoomed bell keeps its shape, because their spread grows like √n. Each panel's bars are</text><text class="cap" x="40" y="628" text-anchor="start">scaled to its tallest.</text><text class="cap" x="40" y="668" text-anchor="start">Why √n: square a sum of two tosses, (a + b)² = a² + 2ab + b². Each square is 1, and ab</text><text class="cap" x="40" y="688" text-anchor="start">is +1 or −1 equally often, so it averages to zero: the average square is 2. With n</text><text class="cap" x="40" y="708" text-anchor="start">tosses there are n squares worth 1 each and pairs that average to zero, so the average</text><text class="cap" x="40" y="728" text-anchor="start">square of the total is n, and its typical size is √n.</text><text class="cap" x="40" y="768" text-anchor="start">That typical size, the square root of the average square, is called the root mean</text><text class="cap" x="40" y="788" text-anchor="start">square, or rms; this atlas measures the size of an error with it from here on. The</text><text class="cap" x="40" y="808" text-anchor="start">tosses are a fixed pseudo-random sequence, so the page draws the same sums each time,</text><text class="cap" x="40" y="828" text-anchor="start">and its arithmetic was checked against Python at every setting.</text></svg></div><figcaption>Quadruple the number of independent errors and their typical total only doubles. A sum of 4,096 such errors is typically about 64 of them wide, not 4,096.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const REPS = 200, NMAX = 4096, B1 = 64, B2 = 32, L = 80, R = 620;
  const Y1 = 190, Y2 = 400, HMAX = 110, SEED0 = 1, K0 = 8;
  const slider = fig.querySelector('input[type=range]'), val = fig.querySelector('.val');
  let seed = SEED0, cum = null;
  const h32 = x => { x ^= x >>> 16; x = Math.imul(x, 0x7feb352d); x ^= x >>> 15;
                     x = Math.imul(x, 0x846ca68b); x ^= x >>> 16; return x >>> 0; };
  function build() {
    const base = Math.imul(seed, 0x9E3779B9) >>> 0;
    cum = [];
    for (let r = 0; r < REPS; r++) {
      const row = new Int32Array(NMAX); let s = 0;
      for (let i = 0; i < NMAX; i++) { s += (h32((base + r * NMAX + i) >>> 0) >>> 31) ? 1 : -1; row[i] = s; }
      cum.push(row);
    }
  }
  const fx = (v, d) => (v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
  const comma = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  function draw() {
    const K = +slider.value, n = 2 ** K, rt = Math.sqrt(n);
    val.textContent = comma(n);
    const T = cum.map(row => row[n - 1]);
    const rms = Math.sqrt(T.reduce((a, t) => a + t * t, 0) / REPS);
    const h1 = new Array(B1).fill(0), h2 = new Array(B2).fill(0);
    T.forEach(t => {
      h1[Math.min(B1 - 1, Math.floor((t + n) / (2 * n) * B1))]++;
      const z = t / Math.sqrt(n);
      h2[Math.min(B2 - 1, Math.max(0, Math.floor((z + 4) / 8 * B2)))]++;
    });
    const m1 = Math.max(...h1), m2 = Math.max(...h2);
    const bar = (sel, c, Y, m) => { const e = fig.querySelector(sel), h = c / m * HMAX;
      e.setAttribute('height', h.toFixed(2)); e.setAttribute('y', (Y - h).toFixed(2)); e.dataset.count = c; };
    h1.forEach((c, i) => bar(`[data-h1="${i}"]`, c, Y1, m1));
    h2.forEach((c, i) => bar(`[data-h2="${i}"]`, c, Y2, m2));
    const W = (R - L) / 2;
    fig.querySelector('[data-k="lo"]').textContent = '−' + comma(n);
    fig.querySelector('[data-k="hi"]').textContent = comma(n);
    fig.querySelector('[data-k="rms"]').textContent = fx(rms, 2);
    fig.querySelector('[data-k="root"]').textContent = Number.isInteger(rt) ? String(rt) : fx(rt, 2);
    fig.querySelector('[data-k="worst"]').textContent = comma(n);
    const m = fig.querySelectorAll('[data-root]');
    m.forEach(e => { const x = (L + R) / 2 + (+e.dataset.root) * rt / n * W;
      e.setAttribute('x1', x.toFixed(2)); e.setAttribute('x2', x.toFixed(2)); });
  }
  slider.addEventListener('input', draw);
  fig.querySelector('button[data-again]').addEventListener('click', () => { seed += 1; build(); draw(); });
  fig.querySelector('button[data-reset]').addEventListener('click', () => {
    seed = SEED0; slider.value = K0; build(); draw(); });
  build(); draw();
})();</script></figure>
