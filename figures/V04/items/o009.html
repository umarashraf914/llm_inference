<figure><div class='ts'>Fig 09 &nbsp;&middot;&nbsp; 1:12</div><h3>How a float is decoded</h3><svg viewBox="0 0 680 268" role="img"><title>How a float is decoded</title><g class="m"><rect x="90" y="52" width="500" height="42" rx="6"></rect><text class="sub" x="340.0" y="73.0" text-anchor="middle" dominant-baseline="central">value  =  (-1)^sign  x  2^(exponent field - bias)  x  1.mantissa</text></g><text class="cap" x="40" y="128" text-anchor="start">Three stored fields, one formula. The 1 in front of the mantissa is the implied bit being</text><text class="cap" x="40" y="148" text-anchor="start">put back.</text><text class="cap" x="40" y="188" text-anchor="start">The bias exists because the exponent field is an unsigned integer but exponents need to go</text><text class="cap" x="40" y="208" text-anchor="start">negative. Subtracting a fixed bias shifts the range down. For an exponent field of E bits the</text><text class="cap" x="40" y="228" text-anchor="start">bias is 2^(E-1) - 1: 127 for FP32's eight bits, 15 for FP16's five.</text></svg><figcaption>Everything a float does is contained in this line. Every format on the ladder later is the same formula with different field widths.</figcaption></figure>
