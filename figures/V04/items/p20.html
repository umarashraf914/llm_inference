eight="9" rx="1"/></g><g class="m"><rect x="130" y="436" width="9.0" height="9" rx="1"/></g><g class="u"><rect x="140" y="436" width="9.0" height="9" rx="1"/></g><g class="u"><rect x="150" y="436" width="9.0" height="9" rx="1"/></g><g class="u"><rect x="160" y="436" width="9.0" height="9" rx="1"/></g><g class="u"><rect x="170" y="436" width="9.0" height="9" rx="1"/></g><g class="u"><rect x="180" y="436" width="9.0" height="9" rx="1"/></g><g class="m"><rect x="190" y="436" width="9.0" height="9" rx="1"/></g><g class="s"><rect x="200" y="436" width="9.0" height="9" rx="1"/></g><g class="m"><rect x="210" y="436" width="9.0" height="9" rx="1"/></g><g class="u"><rect x="60" y="446" width="9.0" height="9" rx="1"/></g><g class="u"><rect x="70" y="446" width="9.0" height="9" rx="1"/></g><g class="u"><rect x="80" y="446" width="9.0" height="9" rx="1"/></g><g class="u"><rect x="90" y="446" width="9.0" height="9" rx="1"/></g><g class="u"><rect x="100" y="446" width="9.0" height="9" rx="1"/></g><g class="u"><rect x="110" y="446" width="9.0" height="9" rx="1"/></g><g class="m"><rect x="120" y="446" width="9.0" height="9" rx="1"/></g><g class="u"><rect x="130" y="446" width="9.0" height="9" rx="1"/></g><g class="u"><rect x="140" y="446" width="9.0" height="9" rx="1"/></g><g class="u"><rect x="150" y="446" width="9.0" height="9" rx="1"/></g><g class="u"><rect x="160" y="446" width="9.0" height="9" rx="1"/></g><g class="u"><rect x="170" y="446" width="9.0" height="9" rx="1"/></g><g class="u"><rect x="180" y="446" width="9.0" height="9" rx="1"/></g><g class="m"><rect x="190" y="446" width="9.0" height="9" rx="1"/></g><g class="m"><rect x="200" y="446" width="9.0" height="9" rx="1"/></g><g class="s"><rect x="210" y="446" width="9.0" height="9" rx="1"/></g><text class="sub2" x="244" y="326" text-anchor="start">16,777,216 averages</text><text class="sub2" x="244" y="346" text-anchor="start">67 MB in FP32, built once per layer from the calibration data</text><text class="sub2" x="244" y="366" text-anchor="start">teal: each input with itself; amber: pairs that move together</text><text class="cap" x="40" y="496" text-anchor="start">The parabola's bottom needed three averages, and they are all this table holds. GPTQ</text><text class="cap" x="40" y="516" text-anchor="start">calls it the Hessian: the measure of how sharply the error's bowl curves, which for a</text><text class="cap" x="40" y="536" text-anchor="start">squared output error is twice the average of each pair of inputs multiplied together.</text><text class="cap" x="40" y="556" text-anchor="start">The 2 cancels in every ratio GPTQ uses. It depends only on the inputs, never on the</text><text class="cap" x="40" y="576" text-anchor="start">weights: for a linear layer, just a statistic of the inputs.</text><text class="cap" x="40" y="616" text-anchor="start">With many weights GPTQ applies the same rule to every weight still unquantized, all at</text><text class="cap" x="40" y="636" text-anchor="start">once, through the inverse of the table, H⁻¹, the matrix that undoes H as dividing by 2</text><text class="cap" x="40" y="656" text-anchor="start">undoes multiplying by 2. For these two inputs its update for w₂ is 0.3146: exactly the</text><text class="cap" x="40" y="676" text-anchor="start">parabola's bottom.</text><text class="cap" x="40" y="716" text-anchor="start">It is sometimes called an input covariance. That is exact only when the inputs average</text><text class="cap" x="40" y="736" text-anchor="start">to zero; the table itself is plain averages of products.</text></svg><figcaption>Despite the name, nothing here needs gradients or training. The second-order information GPTQ uses is averages of input products, measured once.</figcaption></figure>
