<figure><div class='ts'>Fig 78 &nbsp;&middot;&nbsp; 17:20</div><h3>Two ways to rescue a small model</h3><svg viewBox="0 0 680 252" role="img"><title>Two ways to rescue a small model</title><g class="s"><rect x="40" y="58" width="285" height="78" rx="8"></rect><text class="lbl" x="182.5" y="80.0" text-anchor="middle" dominant-baseline="central">Quantization-aware training</text><text class="sub" x="182.5" y="98.0" text-anchor="middle" dominant-baseline="central">the model trains with the</text><text class="sub" x="182.5" y="115.0" text-anchor="middle" dominant-baseline="central">rounding already baked in</text></g><g class="s"><rect x="368" y="58" width="272" height="78" rx="8"></rect><text class="lbl" x="504.0" y="80.0" text-anchor="middle" dominant-baseline="central">Mixed precision</text><text class="sub" x="504.0" y="98.0" text-anchor="middle" dominant-baseline="central">leave the sensitive layers</text><text class="sub" x="504.0" y="115.0" text-anchor="middle" dominant-baseline="central">at higher precision</text></g><text class="cap" x="40" y="178" text-anchor="start">Post-training quantization treats the model as finished. Quantization-aware training lets it</text><text class="cap" x="40" y="198" text-anchor="start">adapt to the rounding, at the cost of a training run.</text><text class="cap" x="40" y="226" text-anchor="start">Below about 70 billion parameters, budget for one of these rather than shipping four bits raw.</text></svg><figcaption>The dividing line between post-training and quantization-aware methods is simply whether the weights are allowed to move in response to the rounding.</figcaption></figure>
