<figure><div class='ts'>Fig 78 &nbsp;&middot;&nbsp; 17:32</div><h3>Two ways to rescue a small model</h3><svg viewBox="0 0 680 260" role="img"><title>Two ways to rescue a small model</title><g class="s"><rect x="40" y="58" width="285" height="78" rx="8"></rect><text class="lbl" x="182.5" y="80.0" text-anchor="middle" dominant-baseline="central">Quantization-aware training</text><text class="sub" x="182.5" y="98.0" text-anchor="middle" dominant-baseline="central">the model trains with the</text><text class="sub" x="182.5" y="115.0" text-anchor="middle" dominant-baseline="central">rounding already baked in</text></g><g class="s"><rect x="368" y="58" width="272" height="78" rx="8"></rect><text class="lbl" x="504.0" y="80.0" text-anchor="middle" dominant-baseline="central">Mixed precision</text><text class="sub" x="504.0" y="98.0" text-anchor="middle" dominant-baseline="central">leave the sensitive layers</text><text class="sub" x="504.0" y="115.0" text-anchor="middle" dominant-baseline="central">at higher precision</text></g><text class="cap" x="40" y="178" text-anchor="start">Post-training quantization treats the model as finished. Quantization-aware training</text><text class="cap" x="40" y="198" text-anchor="start">lets it adapt to the rounding, at the cost of a training run; {{fig:v04-p35}} shows how a</text><text class="cap" x="40" y="218" text-anchor="start">network can train through a rounding at all. Mixed precision measures which layers</text><text class="cap" x="40" y="238" text-anchor="start">suffer most from rounding and leaves those at higher precision.</text></svg><figcaption>Two ways to spend effort on a small model: change the weights to suit the rounding, or exempt the layers that suit it least.</figcaption></figure>
