<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:11</div><h3>Rotating both sides of a layer leaves its outputs unchanged</h3><svg viewBox='0 0 680 554' role='img'><title>Rotating both sides of a layer leaves its outputs unchanged</title><text class="cap" x="40" y="30" text-anchor="start">From {{fig:v04-p26}}: an orthogonal matrix Q satisfies</text><g class="u"><rect x="190" y="44" width="300" height="42" rx="6"/><text class="sub" x="340.0" y="65.0" text-anchor="middle" dominant-baseline="central">QᵀQ  =  I</text></g><text class="cap" x="40" y="122" text-anchor="start">Write a dot product as a row times a column, x · y = xᵀy. Turning both vectors by Q gives</text><g class="u"><rect x="150" y="136" width="380" height="42" rx="6"/><text class="sub" x="340.0" y="157.0" text-anchor="middle" dominant-baseline="central">(Qx) · (Qy)  =  xᵀQᵀQy  =  xᵀIy  =  x · y</text></g><text class="cap" x="40" y="214" text-anchor="start">since the transpose of Qx is xᵀQᵀ (transposing a product reverses its order). Every dot</text><text class="cap" x="40" y="234" text-anchor="start">product survives the turn.</text><text class="cap" x="40" y="274" text-anchor="start">A layer's outputs are dot products of each token's activations, a row of X, with each</text><text class="cap" x="40" y="294" text-anchor="start">column of the weights W. Turn every activation row and every weight column by the same</text><text class="cap" x="40" y="314" text-anchor="start">Q, and every output is mathematically identical:</text><g class="s"><rect x="150" y="330" width="380" height="42" rx="6"/><text class="sub" x="340.0" y="351.0" text-anchor="middle" dominant-baseline="central">(XQᵀ)(QW)  =  X(QᵀQ)W  =  XW</text></g><text class="cap" x="40" y="408" text-anchor="start">QW is computed once, offline, and stored as the model's new weights. XQᵀ is folded into</text><text class="cap" x="40" y="428" text-anchor="start">the layer that makes X where the model allows it, and applied on the fly where it does</text><text class="cap" x="40" y="448" text-anchor="start">not ({{fig:v04-o068}}).</text><text class="cap" x="40" y="488" text-anchor="start">Mathematically identical, not bit-identical: in floating point the sums round a little</text><text class="cap" x="40" y="508" text-anchor="start">differently. And once the turned values are quantized the outputs differ on purpose,</text><text class="cap" x="40" y="528" text-anchor="start">because the rounding now falls on values that suit it ({{fig:v04-p29}}).</text></svg><figcaption>Two lines of algebra that license the whole technique. Everything hinges on QᵀQ being the identity.</figcaption></figure>
