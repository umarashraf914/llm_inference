<figure><div class='ts'>Fig 66 &nbsp;&middot;&nbsp; 13:00</div><h3>What an orthogonal rotation is</h3><svg viewBox="0 0 680 400" role="img"><title>What an orthogonal rotation is</title><g class="m"><rect x="150" y="46" width="380" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">Q transpose x Q  =  I</text></g><text class="cap" x="40" y="118" text-anchor="start">An orthogonal matrix is one whose transpose is its inverse. Rotating two vectors by the same</text><text class="cap" x="40" y="138" text-anchor="start">Q leaves their dot product untouched:</text><g class="s"><rect x="150" y="166" width="380" height="42" rx="6"></rect><text class="sub" x="340.0" y="187.0" text-anchor="middle" dominant-baseline="central">(Qx) . (Qy)  =  x Q transpose Q y  =  x . y</text></g><text class="cap" x="40" y="238" text-anchor="start">Since a neural network layer is dot products, rotating the activations one way and the weights</text><text class="cap" x="40" y="258" text-anchor="start">the other leaves every output bit-identical:</text><g class="s"><rect x="150" y="286" width="380" height="42" rx="6"></rect><text class="sub" x="340.0" y="307.0" text-anchor="middle" dominant-baseline="central">(X Q transpose) (Q W)  =  X W</text></g><text class="cap" x="40" y="358" text-anchor="start">So a rotation is free, in the sense that it changes nothing you can observe. What it does change</text><text class="cap" x="40" y="378" text-anchor="start">is how the values are distributed across channels.</text></svg><figcaption>Two lines of algebra that license the whole technique. Everything hinges on Q transpose Q being the identity.</figcaption></figure>
