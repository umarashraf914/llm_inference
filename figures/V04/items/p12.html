stroke-width="1.5"/><line class="conn" x1="148.0" y1="116" x2="517.3085459023941" y2="116" marker-end="url(#arw)"/><text class="sub2" x="332.654" y="106" text-anchor="middle">× 65,536 = 2¹⁶, before the backward pass</text><text class="sub2" x="140" y="136" text-anchor="middle">10⁻⁸</text><text class="sub2" x="525.309" y="136" text-anchor="middle">6.55 × 10⁻⁴</text><text class="cap" x="40" y="250" text-anchor="start">the gradient</text><text class="sub2" x="220" y="250" text-anchor="start">1.0 × 10⁻⁸</text><text class="sub2" x="400" y="250" text-anchor="start">FP16 stores 0</text><text class="cap" x="40" y="274" text-anchor="start">× 65,536</text><text class="sub2" x="220" y="274" text-anchor="start">6.5536 × 10⁻⁴</text><text class="sub2" x="400" y="274" text-anchor="start">FP16 stores 6.5517 × 10⁻⁴</text><text class="cap" x="40" y="298" text-anchor="start">÷ 65,536, in FP32</text><text class="sub2" x="220" y="298" text-anchor="start">9.997 × 10⁻⁹</text><text class="sub2" x="400" y="298" text-anchor="start">0.03% off the true value</text><text class="cap" x="40" y="344" text-anchor="start">Unscaled, this gradient is below half of FP16's smallest step and is stored as zero.</text><text class="cap" x="40" y="364" text-anchor="start">Scaled by 65,536 it lands among FP16's normal numbers and keeps all eleven of its</text><text class="cap" x="40" y="384" text-anchor="start">significant bits. Multiplying by a power of two only shifts the exponent, so the one</text><text class="cap" x="40" y="404" text-anchor="start">rounding is FP16's own, at the new size; dividing back out in FP32 recovers the gradient</text><text class="cap" x="40" y="424" text-anchor="start">to within 0.03%.</text><text class="cap" x="40" y="464" text-anchor="start">The scale must not push the largest gradient past 65,504, which is why it is chosen</text><text class="cap" x="40" y="484" text-anchor="start">against the biggest values as well as the smallest.</text></svg><figcaption>From zero to within three hundredths of a percent, by multiplying by a constant and dividing it back out. The information was never lost to precision, only to range.</figcaption></figure>
