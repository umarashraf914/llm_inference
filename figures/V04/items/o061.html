<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:25</div><h3>What calibration means</h3><svg viewBox='0 0 680 374' role='img'><title>What calibration means</title><g class="u"><rect x="40" y="52" width="180" height="56" rx="8"/><text class="lbl" x="130.0" y="71.0" text-anchor="middle" dominant-baseline="central">calibration text</text><text class="sub" x="130.0" y="89.0" text-anchor="middle" dominant-baseline="central">128 pieces of 2,048 tokens</text></g><line class="conn" x1="226" y1="80" x2="250" y2="80" marker-end="url(#arw)"/><g class="s"><rect x="256" y="52" width="180" height="56" rx="8"/><text class="lbl" x="346.0" y="71.0" text-anchor="middle" dominant-baseline="central">run once</text><text class="sub" x="346.0" y="89.0" text-anchor="middle" dominant-baseline="central">recording each layer's inputs</text></g><line class="conn" x1="442" y1="80" x2="466" y2="80" marker-end="url(#arw)"/><g class="m"><rect x="472" y="52" width="168" height="56" rx="8"/><text class="lbl" x="556.0" y="71.0" text-anchor="middle" dominant-baseline="central">per layer</text><text class="sub" x="556.0" y="89.0" text-anchor="middle" dominant-baseline="central">the table of products</text></g><text class="cap" x="40" y="148" text-anchor="start">Calibration data is a small, ordinary sample of the kind of text the model will see, run</text><text class="cap" x="40" y="168" text-anchor="start">through the model once so the tool can see what flows into each layer. Frantar and</text><text class="cap" x="40" y="188" text-anchor="start">colleagues used 128 random segments of 2,048 tokens from C4, a crawl of web pages:</text><text class="cap" x="40" y="208" text-anchor="start">262,144 tokens, nothing task-specific.</text><text class="cap" x="40" y="248" text-anchor="start">No labels, no gradients, no training: just a look at what flows through. For GPTQ that</text><text class="cap" x="40" y="268" text-anchor="start">costs minutes for a small model and about four GPU-hours for one of 175 billion</text><text class="cap" x="40" y="288" text-anchor="start">parameters.</text><text class="cap" x="40" y="328" text-anchor="start">This is post-training quantization: the model is finished, and you are only choosing how</text><text class="cap" x="40" y="348" text-anchor="start">to write it down.</text></svg><figcaption>The weights learn nothing new here. Calibration only measures the inputs, so that the rounding can be steered by them.</figcaption></figure>
