<figure><div class='ts'>Fig 61 &nbsp;&middot;&nbsp; 11:12</div><h3>Two ways to quantize, and what calibration means</h3><svg viewBox="0 0 680 314" role="img"><title>Two ways to quantize, and what calibration means</title><g class="s"><rect x="50" y="55" width="265" height="78" rx="8"></rect><text class="lbl" x="182.5" y="77.0" text-anchor="middle" dominant-baseline="central">Post-training</text><text class="sub" x="182.5" y="95.0" text-anchor="middle" dominant-baseline="central">the model is finished;</text><text class="sub" x="182.5" y="112.0" text-anchor="middle" dominant-baseline="central">you only choose how to write it down</text></g><g class="m"><rect x="365" y="55" width="265" height="78" rx="8"></rect><text class="lbl" x="497.5" y="77.0" text-anchor="middle" dominant-baseline="central">Quantization-aware</text><text class="sub" x="497.5" y="95.0" text-anchor="middle" dominant-baseline="central">the model trains again,</text><text class="sub" x="497.5" y="112.0" text-anchor="middle" dominant-baseline="central">with the rounding switched on</text></g><text class="cap" x="40" y="180" text-anchor="start">The first costs minutes and needs a few hundred sample inputs. The second costs a training</text><text class="cap" x="40" y="200" text-anchor="start">run, and lets the weights move in response to the damage the rounding does.</text><text class="cap" x="40" y="236" text-anchor="start">Calibration data is what the first one needs: a small, ordinary sample of the kind of text the</text><text class="cap" x="40" y="256" text-anchor="start">model will see, run through once so the tool can measure how big the values typically get.</text><text class="cap" x="40" y="292" text-anchor="start">No labels, no gradients, no training. Just a look at what flows through.</text></svg><figcaption>The dividing line is simply whether the weights are allowed to move in response to the rounding.</figcaption></figure>
