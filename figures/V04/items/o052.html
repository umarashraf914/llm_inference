<figure><div class='ts'>Fig 52 &nbsp;&middot;&nbsp; 8:18</div><h3>Quantization pushes one way only</h3><svg viewBox="0 0 680 366" role="img"><title>Quantization pushes one way only</title><g class="m"><rect x="80" y="46" width="520" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">intensity  =  operations / bytes    -&gt;    halve the bytes, double the intensity</text></g><line class="axis" x1="90" y1="250" x2="620" y2="250"></line><line class="axis" x1="90" y1="118" x2="90" y2="250"></line><polyline class="pl-h" points="90,250 330,150 620,150"></polyline><line class="tick" x1="330" y1="150" x2="330" y2="250"></line><g class="s"><rect x="150" y="205" width="10" height="10" rx="5"></rect></g><line class="conn" x1="166" y1="210" x2="245" y2="188" marker-end="url(#arw)"></line><g class="s"><rect x="250" y="183" width="10" height="10" rx="5"></rect></g><g class="h"><rect x="430" y="195" width="10" height="10" rx="5"></rect></g><line class="conn" x1="446" y1="200" x2="520" y2="200" marker-end="url(#arw)"></line><g class="h"><rect x="525" y="195" width="10" height="10" rx="5"></rect></g><text class="cap" x="40" y="296" text-anchor="start">Quantization changes only the denominator, so it can only ever push a workload to the right.</text><text class="cap" x="40" y="324" text-anchor="start">Left of the ridge that slide is pure speed-up. Cross the ridge and fewer bytes buys almost</text><text class="cap" x="40" y="344" text-anchor="start">nothing, because you were never waiting on memory.</text></svg><figcaption>The teal point gains. The red point has already crossed and gains nothing. Which one you are depends entirely on the phase.</figcaption></figure>
