="sub" x="260.0" y="157.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="285" y="142" width="40" height="30" rx="3"/><text class="sub" x="305.0" y="157.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="330" y="142" width="40" height="30" rx="3"/><text class="sub" x="350.0" y="157.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="388" y="162" text-anchor="start">−16 + 8 + 4 + 2 + 1  =  −1</text><g class="m"><rect x="150" y="184" width="40" height="30" rx="3"/><text class="sub" x="170.0" y="199.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="195" y="184" width="40" height="30" rx="3"/><text class="sub" x="215.0" y="199.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="m"><rect x="240" y="184" width="40" height="30" rx="3"/><text class="sub" x="260.0" y="199.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="285" y="184" width="40" height="30" rx="3"/><text class="sub" x="305.0" y="199.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="330" y="184" width="40" height="30" rx="3"/><text class="sub" x="350.0" y="199.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="388" y="204" text-anchor="start">−16 + 4 + 2  =  −10</text><g class="m"><rect x="150" y="226" width="40" height="30" rx="3"/><text class="sub" x="170.0" y="241.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="195" y="226" width="40" height="30" rx="3"/><text class="sub" x="215.0" y="241.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="240" y="226" width="40" height="30" rx="3"/><text class="sub" x="260.0" y="241.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="285" y="226" width="40" height="30" rx="3"/><text class="sub" x="305.0" y="241.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="330" y="226" width="40" height="30" rx="3"/><text class="sub" x="350.0" y="241.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="388" y="246" text-anchor="start">−16</text><line class="axis" x1="60.0" y1="314" x2="620.0" y2="314"/><line class="tick" x1="60.0" y1="307" x2="60.0" y2="321"/><line class="tick" x1="78.1" y1="310" x2="78.1" y2="318"/><line class="tick" x1="96.1" y1="310" x2="96.1" y2="318"/><line class="tick" x1="114.2" y1="310" x2="114.2" y2="318"/><line class="tick" x1="132.3" y1="310" x2="132.3" y2="318"/><line class="tick" x1="150.3" y1="310" x2="150.3" y2="318"/><line class="tick" x1="168.4" y1="310" x2="168.4" y2="318"/><line class="tick" x1="186.5" y1="310" x2="186.5" y2="318"/><line class="tick" x1="204.5" y1="310" x2="204.5" y2="318"/><line class="tick" x1="222.6" y1="310" x2="222.6" y2="318"/><line class="tick" x1="240.6" y1="310" x2="240.6" y2="318"/><line class="tick" x1="258.7" y1="310" x2="258.7" y2="318"/><line class="tick" x1="276.8" y1="310" x2="276.8" y2="318"/><line class="tick" x1="294.8" y1="310" x2="294.8" y2="318"/><line class="tick" x1="312.9" y1="310" x2="312.9" y2="318"/><line class="tick" x1="331.0" y1="307" x2="331.0" y2="321"/><line class="tick" x1="349.0" y1="307" x2="349.0" y2="321"/><line class="tick" x1="367.1" y1="310" x2="367.1" y2="318"/><line class="tick" x1="385.2" y1="310" x2="385.2" y2="318"/><line class="tick" x1="403.2" y1="310" x2="403.2" y2="318"/><line class="tick" x1="421.3" y1="310" x2="421.3" y2="318"/><line class="tick" x1="439.4" y1="310" x2="439.4" y2="318"/><line class="tick" x1="457.4" y1="310" x2="457.4" y2="318"/><line class="tick" x1="475.5" y1="310" x2="475.5" y2="318"/><line class="tick" x1="493.5" y1="310" x2="493.5" y2="318"/><line class="tick" x1="511.6" y1="310" x2="511.6" y2="318"/><line class="tick" x1="529.7" y1="310" x2="529.7" y2="318"/><line class="tick" x1="547.7" y1="310" x2="547.7" y2="318"/><line class="tick" x1="565.8" y1="310" x2="565.8" y2="318"/><line class="tick" x1="583.9" y1="310" x2="583.9" y2="318"/><line class="tick" x1="601.9" y1="310" x2="601.9" y2="318"/><line class="tick" x1="620.0" y1="307" x2="620.0" y2="321"/><text class="sub2" x="56" y="298" text-anchor="start">10000 = −16</text><text class="sub2" x="334.968" y="298" text-anchor="end">11111 = −1</text><text class="sub2" x="345.032" y="298" text-anchor="start">00000 = 0</text><text class="sub2" x="624" y="298" text-anchor="end">01111 = 15</text><text class="sub2" x="195.484" y="338" text-anchor="middle">top bit 1: negative</text><text class="sub2" x="484.516" y="338" text-anchor="middle">top bit 0: zero and positive</text><text class="cap" x="40" y="384" text-anchor="start">Give the top place a negative value and the same five bits count from −16 to 15. This is</text><text class="cap" x="40" y="404" text-anchor="start">two's complement, the way chips store signed integers. With n bits the range is −2ⁿ⁻¹ to</text><text class="cap" x="40" y="424" text-anchor="start">2ⁿ⁻¹ − 1: INT8 runs from −128 to 127, and INT4 from −8 to 7.</text><text class="cap" x="40" y="464" text-anchor="start">It won because ordinary binary addition still works. 11111 + 00001 is 100000; drop the</text><text class="cap" x="40" y="484" text-anchor="start">carry out of the fifth place and 00000 is left, so −1 + 1 = 0 with no special rules.</text><text class="cap" x="40" y="524" text-anchor="start">The cost shows when the bits are read as a plain count: every negative number starts</text><text class="cap" x="40" y="544" text-anchor="start">with a 1, so −1 looks like 31, the largest pattern of all. {{fig:v04-o013}} shows what that</text><text class="cap" x="40" y="564" text-anchor="start">does to a float.</text></svg><figcaption>Two's complement gets signed arithmetic for free, at the price of negative numbers that look enormous when read as unsigned. Integers pay that price happily; exponent fields do not.</figcaption></figure>
