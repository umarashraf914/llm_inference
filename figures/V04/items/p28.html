ne="central">8</text></g><g class="h"><rect x="430" y="188" width="56" height="22" rx="3"/><text class="sub" x="458.0" y="199.0" text-anchor="middle" dominant-baseline="central">8</text></g><g class="h"><rect x="430" y="216" width="56" height="22" rx="3"/><text class="sub" x="458.0" y="227.0" text-anchor="middle" dominant-baseline="central">−8</text></g><g class="h"><rect x="430" y="244" width="56" height="22" rx="3"/><text class="sub" x="458.0" y="255.0" text-anchor="middle" dominant-baseline="central">−8</text></g><g class="h"><rect x="430" y="272" width="56" height="22" rx="3"/><text class="sub" x="458.0" y="283.0" text-anchor="middle" dominant-baseline="central">8</text></g><g class="h"><rect x="560" y="76" width="56" height="22" rx="3"/><text class="sub" x="588.0" y="87.0" text-anchor="middle" dominant-baseline="central">2.83</text></g><g class="h"><rect x="560" y="104" width="56" height="22" rx="3"/><text class="sub" x="588.0" y="115.0" text-anchor="middle" dominant-baseline="central">−2.83</text></g><g class="h"><rect x="560" y="132" width="56" height="22" rx="3"/><text class="sub" x="588.0" y="143.0" text-anchor="middle" dominant-baseline="central">−2.83</text></g><g class="h"><rect x="560" y="160" width="56" height="22" rx="3"/><text class="sub" x="588.0" y="171.0" text-anchor="middle" dominant-baseline="central">2.83</text></g><g class="h"><rect x="560" y="188" width="56" height="22" rx="3"/><text class="sub" x="588.0" y="199.0" text-anchor="middle" dominant-baseline="central">2.83</text></g><g class="h"><rect x="560" y="216" width="56" height="22" rx="3"/><text class="sub" x="588.0" y="227.0" text-anchor="middle" dominant-baseline="central">−2.83</text></g><g class="h"><rect x="560" y="244" width="56" height="22" rx="3"/><text class="sub" x="588.0" y="255.0" text-anchor="middle" dominant-baseline="central">−2.83</text></g><g class="h"><rect x="560" y="272" width="56" height="22" rx="3"/><text class="sub" x="588.0" y="283.0" text-anchor="middle" dominant-baseline="central">2.83</text></g><text class="cap" x="40" y="330" text-anchor="start">Each stage has 4 pairs, and each pair costs one addition and one subtraction: 8</text><text class="cap" x="40" y="350" text-anchor="start">operations. There are three stages because 8 = 2³, so 24 operations in all, against</text><text class="cap" x="40" y="370" text-anchor="start">8 × 8 = 64 multiply-adds for a general 8 × 8 rotation.</text><text class="cap" x="40" y="410" text-anchor="start">log₂ n counts how many times n can be halved before it reaches 1: 3 for 8, and 12 for</text><text class="cap" x="40" y="430" text-anchor="start">4,096. The butterfly has that many stages, and stage k pairs values 2ᵏ⁻¹ apart. The</text><text class="cap" x="40" y="450" text-anchor="start">channels holding the spike double at every stage, 1, 2, 4, 8, and after the last the</text><text class="cap" x="40" y="470" text-anchor="start">result is H₈ times the input: the 8 that sat in one channel sits in all eight, with</text><text class="cap" x="40" y="490" text-anchor="start">signs. Dividing by √8 makes it a rotation, so each share is 8 ÷ √8 = 2.83.</text><text class="cap" x="40" y="530" text-anchor="start">At 4,096 channels that is 12 stages × 4,096 = 49,152 additions and subtractions, against</text><text class="cap" x="40" y="550" text-anchor="start">4,096 × 4,096 = 16,777,216 multiply-adds for a general rotation, 341 times fewer and</text><text class="cap" x="40" y="570" text-anchor="start">none of them a multiplication. A layer 4,096 wide spends those 16.8 million</text><text class="cap" x="40" y="590" text-anchor="start">multiply-adds on each token anyway, so the Hadamard adds about 0.3% to its arithmetic.</text><text class="cap" x="40" y="610" text-anchor="start">The final ÷ √n can be folded into the quantization scale. That is why QuaRot can apply</text><text class="cap" x="40" y="630" text-anchor="start">it on the fly.</text></svg><figcaption>Fast because the matrix is all signs: three stages of add-and-subtract pairs for eight values, twelve for 4,096.</figcaption></figure>
