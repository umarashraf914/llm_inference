<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:00</div><h3>FP32, the baseline</h3><svg viewBox='0 0 680 458' role='img'><title>FP32, the baseline</title><g class="u"><rect x="60" y="52" width="15.5" height="34" rx="2"/></g><g class="h"><rect x="75.5" y="52" width="124.0" height="34" rx="2"/><text class="sub" x="137.5" y="69.0" text-anchor="middle" dominant-baseline="central">exponent 8</text></g><g class="s"><rect x="199.5" y="52" width="356.5" height="34" rx="2"/><text class="sub" x="377.75" y="69.0" text-anchor="middle" dominant-baseline="central">mantissa 23</text></g><text class="sub2" x="40" y="110" text-anchor="start">FP32: one sign bit, eight exponent, twenty-three mantissa; four bytes per number</text><text class="cap" x="40" y="156" text-anchor="start">effective precision</text><g class="s"><rect x="199.5" y="136" width="356.5" height="34" rx="2"/><text class="sub" x="377.75" y="153.0" text-anchor="middle" dominant-baseline="central">23 mantissa bits, stored</text></g><g class="m"><rect x="177.5" y="136" width="16" height="34" rx="2"/></g><text class="sub2" x="177.5" y="192" text-anchor="start">the implied 1, free</text><text class="sub2" x="568" y="158" text-anchor="start">= 24 bits</text><text class="cap" x="40" y="232" text-anchor="start">Range near ten to the plus or minus thirty-eight: the largest FP32 number is 3.40 × 10³⁸</text><text class="cap" x="40" y="252" text-anchor="start">and the smallest normal one 1.18 × 10⁻³⁸. Precision of about seven decimal digits.</text><text class="cap" x="40" y="292" text-anchor="start">Seven digits is worth checking. Each bit doubles the number of values a format can tell</text><text class="cap" x="40" y="312" text-anchor="start">apart, and doubling is multiplying by 10⁰·³⁰¹, so a bit is worth 0.301 of a decimal</text><text class="cap" x="40" y="332" text-anchor="start">digit: 23 bits would give 6.92 digits and 24 give 7.22. FP32 is usually quoted at about</text><text class="cap" x="40" y="352" text-anchor="start">seven digits, and that only comes out right because the implied 1 makes the precision 24</text><text class="cap" x="40" y="372" text-anchor="start">bits, not 23.</text><text class="cap" x="40" y="412" text-anchor="start">Same everywhere: FP16 stores 10 and behaves like 11, about 3.3 digits; BF16 stores 7 and</text><text class="cap" x="40" y="432" text-anchor="start">behaves like 8, about 2.4.</text></svg><figcaption>Every format below FP32 answers one question: which of these thirty-two bits can we afford to throw away?</figcaption></figure>
