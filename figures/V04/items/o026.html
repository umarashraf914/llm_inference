<figure><div class='ts'>Fig 26 &nbsp;&middot;&nbsp; 2:00</div><h3>FP32, the baseline</h3><svg viewBox="0 0 680 298" role="img"><title>FP32, the baseline</title><g class="u"><rect x="60" y="62" width="15.5" height="34" rx="2"></rect></g><g class="h"><rect x="75.5" y="62" width="124.0" height="34" rx="2"></rect><text class="sub" x="137.5" y="79.0" text-anchor="middle" dominant-baseline="central">exponent 8</text></g><g class="s"><rect x="199.5" y="62" width="356.5" height="34" rx="2"></rect><text class="sub" x="377.75" y="79.0" text-anchor="middle" dominant-baseline="central">mantissa 23</text></g><text class="sub2" x="40" y="128" text-anchor="start">FP32: one sign bit, eight exponent, twenty-three mantissa</text><text class="cap" x="40" y="176" text-anchor="start">Range near ten to the plus or minus thirty-eight, and about seven decimal digits of</text><text class="cap" x="40" y="196" text-anchor="start">precision. Four bytes per number.</text><text class="cap" x="40" y="236" text-anchor="start">Seven digits is worth checking. Twenty-three bits gives 6.92 decimal digits; twenty-four gives</text><text class="cap" x="40" y="256" text-anchor="start">7.22. The figure only comes out right because the implied bit makes the effective precision</text><text class="cap" x="40" y="276" text-anchor="start">twenty-four, not twenty-three.</text></svg><figcaption>Every format below FP32 answers one question: which of these thirty-two bits can we afford to throw away?</figcaption></figure>
