<figure><div class='ts'>Fig 20 &nbsp;&middot;&nbsp; 1:24</div><h3>What one mantissa bit is worth</h3><svg viewBox="0 0 680 442" role="img"><title>What one mantissa bit is worth</title><g class="m"><rect x="140" y="50" width="400" height="42" rx="6"></rect><text class="sub" x="340.0" y="71.0" text-anchor="middle" dominant-baseline="central">gap between neighbours  =  2^exponent  x  2^-(mantissa bits)</text></g><text class="cap" x="40" y="128" text-anchor="start">The exponent says where on the number line you are. The mantissa says how finely that</text><text class="cap" x="40" y="148" text-anchor="start">neighbourhood is subdivided.</text><text class="cap" x="40" y="206" text-anchor="start">FP32</text><text class="sub2" x="130" y="206" text-anchor="start">23 mantissa bits</text><g class="s"><rect x="290" y="190" width="4.00014" height="26" rx="3"></rect></g><text class="sub2" x="600" y="206" text-anchor="end">0.0000005</text><text class="cap" x="40" y="244" text-anchor="start">FP16</text><text class="sub2" x="130" y="244" text-anchor="start">10 mantissa bits</text><g class="s"><rect x="290" y="228" width="5.092" height="26" rx="3"></rect></g><text class="sub2" x="600" y="244" text-anchor="end">0.0039</text><text class="cap" x="40" y="282" text-anchor="start">BF16</text><text class="sub2" x="130" y="282" text-anchor="start">7 mantissa bits</text><g class="h"><rect x="290" y="266" width="12.68" height="26" rx="3"></rect></g><text class="sub2" x="600" y="282" text-anchor="end">0.031</text><text class="cap" x="40" y="320" text-anchor="start">E4M3</text><text class="sub2" x="130" y="320" text-anchor="start">3 mantissa bits</text><g class="h"><rect x="290" y="304" width="144.0" height="26" rx="3"></rect></g><text class="sub2" x="600" y="320" text-anchor="end">0.5</text><text class="cap" x="40" y="358" text-anchor="start">E5M2</text><text class="sub2" x="130" y="358" text-anchor="start">2 mantissa bits</text><g class="h"><rect x="290" y="342" width="280" height="26" rx="3"></rect></g><text class="sub2" x="600" y="358" text-anchor="end">1.0</text><text class="cap" x="40" y="400" text-anchor="start">Gaps in the neighbourhood of 6.5, where the exponent is 2. BF16 has three fewer mantissa bits</text><text class="cap" x="40" y="420" text-anchor="start">than FP16, so its gaps are 2 cubed, eight times, wider.</text></svg><figcaption>Each bit removed doubles the distance between the values a format can tell apart. This is the precise content of the phrase the mantissa sets the precision.</figcaption></figure>
