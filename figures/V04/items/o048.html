<figure><div class='ts'>Fig 48 &nbsp;&middot;&nbsp; 6:47</div><h3>A tenth of a percent that cannot be dropped</h3><svg viewBox="0 0 680 292" role="img"><title>A tenth of a percent that cannot be dropped</title><text class="cap" x="40" y="78" text-anchor="start">All features</text><g class="u"><rect x="230" y="62" width="390" height="32" rx="3"></rect><text class="sub" x="425.0" y="78.0" text-anchor="middle" dominant-baseline="central">about 100%</text></g><text class="cap" x="40" y="138" text-anchor="start">The outlier channels</text><g class="h"><rect x="230" y="122" width="4" height="32" rx="1"></rect></g><text class="sub2" x="244" y="141" text-anchor="start">six channels, about a tenth of a percent</text><text class="cap" x="40" y="200" text-anchor="start">At 6.7 billion parameters with a sequence length of 2,048, roughly 150,000 outliers appear per</text><text class="cap" x="40" y="220" text-anchor="start">sequence, concentrated in just six channels.</text><text class="cap" x="40" y="250" text-anchor="start">Yet zero those six out and the model falls apart: the top token's share of attention drops by</text><text class="cap" x="40" y="270" text-anchor="start">more than 20%, and perplexity worsens by 600 to 1,000%.</text></svg><figcaption>Simultaneously negligible in count and indispensable in function, which is why you cannot simply clip them away.</figcaption></figure>
