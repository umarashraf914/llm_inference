<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:55</div><h3>A tenth of a percent that cannot be dropped</h3><svg viewBox='0 0 680 346' role='img'><title>A tenth of a percent that cannot be dropped</title><text class="cap" x="40" y="78" text-anchor="start">All channels</text><g class="u"><rect x="230" y="62" width="390" height="32" rx="3"/><text class="sub" x="425.0" y="78.0" text-anchor="middle" dominant-baseline="central">4,096 in the 6.7B model</text></g><text class="cap" x="40" y="138" text-anchor="start">The outlier channels</text><g class="h"><rect x="230" y="122" width="2.0" height="32" rx="1"/></g><text class="sub2" x="244" y="141" text-anchor="start">six of them, 0.15%</text><text class="cap" x="40" y="200" text-anchor="start">At 6.7 billion parameters with a sequence length of 2,048, roughly 150,000 outliers</text><text class="cap" x="40" y="220" text-anchor="start">appear per sequence, concentrated in just six of the model's 4,096 channels: 0.15%,</text><text class="cap" x="40" y="240" text-anchor="start">which the paper calls about a tenth of a percent of all features.</text><text class="cap" x="40" y="280" text-anchor="start">Yet zero those six out and the model falls apart: the top token's share of attention</text><text class="cap" x="40" y="300" text-anchor="start">drops by more than 20%, and perplexity worsens by 600 to 1,000% ({{fig:v04-o049}}). Zero</text><text class="cap" x="40" y="320" text-anchor="start">six channels chosen at random instead and perplexity worsens by about 0.1%.</text></svg><figcaption>Simultaneously negligible in count and indispensable in function, which is why you cannot simply clip them away. The short bar is drawn at the narrowest visible width; to scale it would be 0.6 of a pixel.</figcaption></figure>
