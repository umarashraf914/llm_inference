<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:52</div><h3>Three bits is what put 175 billion parameters on one GPU</h3><svg viewBox='0 0 680 452' role='img'><title>Three bits is what put 175 billion parameters on one GPU</title><text class="hd" x="40" y="46">OPT-175B's weights at four precisions, to scale, against one 80 GB GPU</text><text class="cap" x="40" y="92" text-anchor="start">FP16</text><g class="h"><rect x="150" y="74" width="391.2" height="26" rx="2"/></g><text class="sub2" x="551.155" y="92" text-anchor="start">326 GB: 5 GPUs</text><text class="cap" x="40" y="136" text-anchor="start">8-bit</text><g class="h"><rect x="150" y="118" width="195.6" height="26" rx="2"/></g><text class="sub2" x="355.578" y="136" text-anchor="start">163 GB: 3 GPUs</text><text class="cap" x="40" y="180" text-anchor="start">4-bit</text><g class="h"><rect x="150" y="162" width="97.8" height="26" rx="2"/></g><text class="sub2" x="257.789" y="180" text-anchor="start">81.5 GB: does not fit</text><text class="cap" x="40" y="224" text-anchor="start">3-bit</text><g class="s"><rect x="150" y="206" width="73.3" height="26" rx="2"/></g><text class="sub2" x="256" y="224" text-anchor="start">61.1 GB: fits, with room for the cache</text><line class="mark xok" x1="246.0" y1="64" x2="246.0" y2="250"/><text class="sub2" x="246" y="266" text-anchor="middle">one 80 GB A100</text><text class="cap" x="40" y="306" text-anchor="start">Weights alone, counted as the GPTQ paper counts, in gigabytes of 1,024³ bytes: 175</text><text class="cap" x="40" y="326" text-anchor="start">billion parameters at 16 bits are 326 GB, five 80 GB cards. At 4 bits they are 81.5 GB,</text><text class="cap" x="40" y="346" text-anchor="start">already more than one card holds; at 3 bits, 61.</text><text class="cap" x="40" y="386" text-anchor="start">The paper's own count for its 3-bit OPT-175B is about 63 GB, because the embeddings stay</text><text class="cap" x="40" y="406" text-anchor="start">in 16 bits, plus about 9 GB of cached keys and values for 2,048 tokens: inside one 80 GB</text><text class="cap" x="40" y="426" text-anchor="start">A100, where the 8-bit LLM.int8() needed three. That is the single-GPU result.</text></svg><figcaption>The headline is a three-bit result. Four bits cuts the hardware from five cards to two; only three bits gets it down to one.</figcaption></figure>
