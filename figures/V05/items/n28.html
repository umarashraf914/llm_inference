 stroke-width="1" stroke-dasharray="3 3"/><text class="sub" x="458.0" y="110.0" text-anchor="middle" dominant-baseline="central" data-c="1-0-0">8</text><rect x="484" y="96" width="44" height="28" rx="3" style="fill:var(--h);fill-opacity:0.27;stroke:var(--h)" data-r="1-0-1"/><text class="sub" x="506.0" y="110.0" text-anchor="middle" dominant-baseline="central" data-c="1-0-1">10</text><rect x="532" y="96" width="44" height="28" rx="3" style="fill:var(--h);fill-opacity:0.20;stroke:var(--h)" data-r="1-0-2"/><text class="sub" x="554.0" y="110.0" text-anchor="middle" dominant-baseline="central" data-c="1-0-2">6</text><rect x="580" y="96" width="44" height="28" rx="3" style="fill:var(--h);fill-opacity:0.24;stroke:var(--h)" data-r="1-0-3"/><text class="sub" x="602.0" y="110.0" text-anchor="middle" dominant-baseline="central" data-c="1-0-3">8</text><text class="sub2" x="400" y="147" text-anchor="start">G2</text><rect x="436" y="128" width="44" height="28" rx="3" style="fill:var(--h);fill-opacity:0.25;stroke:var(--h)" data-r="1-1-0"/><text class="sub" x="458.0" y="142.0" text-anchor="middle" dominant-baseline="central" data-c="1-1-0">9</text><rect x="484" y="128" width="44" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub" x="506.0" y="142.0" text-anchor="middle" dominant-baseline="central" data-c="1-1-1">2</text><rect x="532" y="128" width="44" height="28" rx="3" style="fill:var(--h);fill-opacity:0.25;stroke:var(--h)" data-r="1-1-2"/><text class="sub" x="554.0" y="142.0" text-anchor="middle" dominant-baseline="central" data-c="1-1-2">9</text><rect x="580" y="128" width="44" height="28" rx="3" style="fill:var(--h);fill-opacity:0.31;stroke:var(--h)" data-r="1-1-3"/><text class="sub" x="602.0" y="142.0" text-anchor="middle" dominant-baseline="central" data-c="1-1-3">12</text><text class="sub2" x="400" y="179" text-anchor="start">G3</text><rect x="436" y="160" width="44" height="28" rx="3" style="fill:var(--h);fill-opacity:0.20;stroke:var(--h)" data-r="1-2-0"/><text class="sub" x="458.0" y="174.0" text-anchor="middle" dominant-baseline="central" data-c="1-2-0">6</text><rect x="484" y="160" width="44" height="28" rx="3" style="fill:var(--h);fill-opacity:0.31;stroke:var(--h)" data-r="1-2-1"/><text class="sub" x="506.0" y="174.0" text-anchor="middle" dominant-baseline="central" data-c="1-2-1">12</text><rect x="532" y="160" width="44" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub" x="554.0" y="174.0" text-anchor="middle" dominant-baseline="central" data-c="1-2-2">5</text><rect x="580" y="160" width="44" height="28" rx="3" style="fill:var(--h);fill-opacity:0.25;stroke:var(--h)" data-r="1-2-3"/><text class="sub" x="602.0" y="174.0" text-anchor="middle" dominant-baseline="central" data-c="1-2-3">9</text><text class="sub2" x="400" y="211" text-anchor="start">G4</text><rect x="436" y="192" width="44" height="28" rx="3" style="fill:var(--h);fill-opacity:0.20;stroke:var(--h)" data-r="1-3-0"/><text class="sub" x="458.0" y="206.0" text-anchor="middle" dominant-baseline="central" data-c="1-3-0">6</text><rect x="484" y="192" width="44" height="28" rx="3" style="fill:var(--h);fill-opacity:0.22;stroke:var(--h)" data-r="1-3-1"/><text class="sub" x="506.0" y="206.0" text-anchor="middle" dominant-baseline="central" data-c="1-3-1">7</text><rect x="532" y="192" width="44" height="28" rx="3" style="fill:var(--h);fill-opacity:0.32;stroke:var(--h)" data-r="1-3-2"/><text class="sub" x="554.0" y="206.0" text-anchor="middle" dominant-baseline="central" data-c="1-3-2">13</text><rect x="580" y="192" width="44" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub" x="602.0" y="206.0" text-anchor="middle" dominant-baseline="central" data-c="1-3-3">6</text><text class="sub2" x="400" y="242" text-anchor="start">jobs</text><g class="u0" data-lg="1-0"><text class="sub2" x="458.0" y="242" text-anchor="middle" data-l="1-0">29</text></g><g class="u0" data-lg="1-1"><text class="sub2" x="506.0" y="242" text-anchor="middle" data-l="1-1">31</text></g><g class="u0" data-lg="1-2"><text class="sub2" x="554.0" y="242" text-anchor="middle" data-l="1-2">33</text></g><g class="h" data-lg="1-3"><text class="sub2" x="602.0" y="242" text-anchor="middle" data-l="1-3">35</text></g><rect x="582.0" y="249" width="40" height="3" rx="1.5" style="fill:var(--h)" data-hot="1"/><text class="sub2" x="400" y="272" data-s="1">busiest: G4, 35 jobs; 84% leave home</text><text class="cap" x="40" y="330" text-anchor="start">Four GPUs, two experts on each, sixteen tokens per GPU, and every token sent to two</text><text class="cap" x="40" y="350" text-anchor="start">experts picked at random. Each cell counts jobs, one token for one expert, from the</text><text class="cap" x="40" y="370" text-anchor="start">row's GPU to the column's. The dashed diagonal stays home; everything else crosses a</text><text class="cap" x="40" y="390" text-anchor="start">link. This table is the dispatch all-to-all, and the combine is the same table</text><text class="cap" x="40" y="410" text-anchor="start">transposed, as every answer goes back where it came from.</text><text class="cap" x="40" y="450" text-anchor="start">Press next batch: the router redraws the map, so the table changes every time, and so</text><text class="cap" x="40" y="470" text-anchor="start">does which GPU is busiest. The traffic cannot be planned in advance. Random routing</text><text class="cap" x="40" y="490" text-anchor="start">stands in for the router here; the generator is the same one in the script and in</text><text class="cap" x="40" y="510" text-anchor="start">Python, and every table was checked against both.</text></svg></div><figcaption>Uniform random routing, simulated. A real router is less even, which makes the heaviest column heavier, and the GPU that holds it the one everybody waits for.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const C = {"G": 4, "EXP": 8, "TOKS": 16, "b0": 1, "cmax": 32, "cx": [[158, 206, 254, 302], [458, 506, 554, 602]]};
  const q = s => fig.querySelector(s), btn = [...fig.querySelectorAll('button')];
  const fmt = (v, d) => { const s = Math.abs(v).toFixed(d), [i, p] = s.split('.');
    return (v < 0 && +s !== 0 ? '−' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (p ? '.' + p : ''); };
  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function table(batch) {
    const rnd = mulberry32(batch), T = Array.from({length: C.G}, () => Array(C.G).fill(0));
    for (let s = 0; s < C.G; s++) for (let k = 0; k < C.TOKS; k++) {
      const e1 = Math.floor(rnd() * C.EXP); let e2 = Math.floor(rnd() * (C.EXP - 1)); if (e2 >= e1) e2++;
      T[s][Math.floor(e1 / 2)]++; T[s][Math.floor(e2 / 2)]++;
    }
    return T;
  }
  let batch = C.b0;
  function draw() {
    const tabs = [table(batch), table(batch + 1)];
    tabs.forEach((T, j) => {
      q(`[data-head="${j}"]`).textContent = `batch ${batch + j}`;
      const load = [0, 1, 2, 3].map(r => T.reduce((a, row) => a + row[r], 0));
      let hot = 0; load.forEach((v, r) => { if (v > load[hot]) hot = r; });
      let away = 0;
      for (let s = 0; s < C.G; s++) for (let r = 0; r < C.G; r++) {
        q(`[data-c="${j}-${s}-${r}"]`).textContent = T[s][r];
        if (s !== r) { away += T[s][r];
          q(`[data-r="${j}-${s}-${r}"]`).style.fillOpacity = (0.1 + 0.55 * T[s][r] / C.cmax).toFixed(2); }
      }
      load.forEach((v, r) => { q(`[data-l="${j}-${r}"]`).textContent = v;
        q(`[data-lg="${j}-${r}"]`).setAttribute('class', r === hot ? 'h' : 'u0'); });
      q(`[data-hot="${j}"]`).setAttribute('x', C.cx[j][hot] - 20);
      q(`[data-s="${j}"]`).textContent = `busiest: G${hot + 1}, ${load[hot]} jobs; ${fmt(100 * away / (C.G * 2 * C.TOKS), 0)}% leave home`;
    });
  }
  btn[0].addEventListener('click', () => { batch += 2; draw(); });
  btn[1].addEventListener('click', () => { batch = C.b0; draw(); });
  draw();
})();</script></figure>
