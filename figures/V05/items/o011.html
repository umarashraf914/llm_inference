/></g><g class="h"><rect x="532" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="535" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="538" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="541" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="544" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="547" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="550" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="553" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="556" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="559" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="562" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="565" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="568" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="571" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="574" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="577" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="580" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="583" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="586" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="589" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="592" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="595" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="598" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="601" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="604" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="607" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="610" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="613" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="616" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="619" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="622" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="625" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="628" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="631" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="634" y="216" width="2" height="18" rx="0"/></g><g class="h"><rect x="637" y="216" width="2" height="18" rx="0"/></g><text class="sub2" x="160" y="252" text-anchor="start">160 all-reduces, every GPU in the group each time</text><text class="cap" x="40" y="290" text-anchor="start">pipeline</text><g class="h"><rect x="160" y="276" width="2" height="18" rx="0"/></g><g class="h"><rect x="163" y="276" width="2" height="18" rx="0"/></g><g class="h"><rect x="166" y="276" width="2" height="18" rx="0"/></g><text class="sub2" x="180" y="290" text-anchor="start">3 handoffs, each to one neighbour</text><text class="cap" x="40" y="338" text-anchor="start">Pipeline parallelism splits the model the obvious way, by layers: each GPU group takes</text><text class="cap" x="40" y="358" text-anchor="start">one contiguous block, like stations on an assembly line. A batch flows through stage</text><text class="cap" x="40" y="378" text-anchor="start">one, which hands its output activations to stage two, and on down the line.</text><text class="cap" x="40" y="418" text-anchor="start">Compare the traffic with what came before. Tensor parallelism synchronised every GPU</text><text class="cap" x="40" y="438" text-anchor="start">twice inside every layer, 160 times per token. A pipeline stage speaks once, at its own</text><text class="cap" x="40" y="458" text-anchor="start">boundary, to one neighbour: a single point-to-point message, three per token across four</text><text class="cap" x="40" y="478" text-anchor="start">stages.</text></svg><figcaption>One mark per exchange, so the rows are to scale. How often is half the difference between the two strategies; how much, next, is the other half.</figcaption></figure>
