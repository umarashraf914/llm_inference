<figure><div class='ts'>Fig 11 &nbsp;&middot;&nbsp; 6:13</div><h3>Traffic thin enough to cross the slow boundary</h3><svg viewBox="0 0 680 462" role="img"><title>Traffic thin enough to cross the slow boundary</title><g class="u"><rect x="40" y="40" width="600" height="120" rx="14"></rect><text class="lbl" x="62" y="66">Stages, like stations on an assembly line</text></g><g class="s"><rect x="66" y="92" width="120" height="44" rx="4"></rect><text class="sub" x="126.0" y="114.0" text-anchor="middle" dominant-baseline="central">layers 1-20</text></g><line class="conn" x1="188" y1="114" x2="208" y2="114" marker-end="url(#arw)"></line><g class="s"><rect x="211" y="92" width="120" height="44" rx="4"></rect><text class="sub" x="271.0" y="114.0" text-anchor="middle" dominant-baseline="central">layers 21-40</text></g><line class="conn" x1="333" y1="114" x2="353" y2="114" marker-end="url(#arw)"></line><g class="s"><rect x="356" y="92" width="120" height="44" rx="4"></rect><text class="sub" x="416.0" y="114.0" text-anchor="middle" dominant-baseline="central">layers 41-60</text></g><line class="conn" x1="478" y1="114" x2="498" y2="114" marker-end="url(#arw)"></line><g class="s"><rect x="501" y="92" width="120" height="44" rx="4"></rect><text class="sub" x="561.0" y="114.0" text-anchor="middle" dominant-baseline="central">layers 61-80</text></g><text class="cap" x="40" y="200" text-anchor="start">A batch flows through stage one, which hands its output activations to stage two, and on down</text><text class="cap" x="40" y="220" text-anchor="start">the line.</text><text class="cap" x="40" y="260" text-anchor="start">Tensor parallelism</text><g class="h"><rect x="240" y="244" width="300" height="30" rx="3"></rect><text class="sub" x="390.0" y="259.0" text-anchor="middle" dominant-baseline="central">synchronises twice inside every layer</text></g><text class="cap" x="40" y="320" text-anchor="start">Pipeline parallelism</text><g class="s"><rect x="240" y="304" width="220" height="30" rx="3"></rect><text class="sub" x="350.0" y="319.0" text-anchor="middle" dominant-baseline="central">one message per stage boundary</text></g><text class="cap" x="40" y="380" text-anchor="start">A single point-to-point message, and thin enough to hide: the stage sends one batch's</text><text class="cap" x="40" y="400" text-anchor="start">activations onward while it computes the next, so the transfer adds almost no wall-clock time.</text><text class="cap" x="40" y="440" text-anchor="start">That is what makes it the natural way to span nodes.</text></svg><figcaption>Compare the two bars. The difference in communication volume is the entire reason these two strategies get placed on different parts of the hardware.</figcaption></figure>
