<figure><div class='ts'>Fig 13 &nbsp;&middot;&nbsp; 7:34</div><h3>What microbatching buys</h3><svg viewBox="0 0 680 382" role="img"><title>What microbatching buys</title><text class="cap" x="40" y="77" text-anchor="start">4 microbatches</text><rect x="220" y="59" width="300" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="h"><rect x="220" y="59" width="258" height="30" rx="3"></rect></g><text class="sub2" x="532" y="77" text-anchor="start">43% idle</text><text class="cap" x="40" y="123" text-anchor="start">8 microbatches</text><rect x="220" y="105" width="300" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="h"><rect x="220" y="105" width="162" height="30" rx="3"></rect></g><text class="sub2" x="532" y="123" text-anchor="start">27% idle</text><text class="cap" x="40" y="169" text-anchor="start">16 microbatches</text><rect x="220" y="151" width="300" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="h"><rect x="220" y="151" width="96" height="30" rx="3"></rect></g><text class="sub2" x="532" y="169" text-anchor="start">16% idle</text><text class="cap" x="40" y="215" text-anchor="start">32 microbatches</text><rect x="220" y="197" width="300" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="h"><rect x="220" y="197" width="54" height="30" rx="3"></rect></g><text class="sub2" x="532" y="215" text-anchor="start">9% idle</text><text class="cap" x="40" y="260" text-anchor="start">Four stages throughout. More slices in flight means proportionally less of the run spent</text><text class="cap" x="40" y="280" text-anchor="start">filling and draining.</text><text class="cap" x="40" y="320" text-anchor="start">A further trick from training: give each GPU several short non-contiguous chunks of layers</text><text class="cap" x="40" y="340" text-anchor="start">instead of one block, so the pipeline fills and drains in smaller steps, at the price of more</text><text class="cap" x="40" y="360" text-anchor="start">messages between stages.</text></svg><figcaption>Computed from the formula above. Note the returns diminish: going from 4 to 8 halves the bubble, going from 16 to 32 barely moves it.</figcaption></figure>
