<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 7:57</div><h3>More microbatches shrink the bubble, never to zero</h3><svg viewBox='0 0 680 392' role='img'><title>More microbatches shrink the bubble, never to zero</title><text class="hd" x="40" y="40">Share of the run spent idle, four stages; the dashed track is 100%</text><text class="cap" x="40" y="79" text-anchor="start">4 microbatches</text><rect x="220" y="60" width="300" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="220" y="60" width="128.57142857142856" height="28" rx="3"/></g><text class="sub2" x="532" y="79" text-anchor="start">43% idle  (3 ÷ 7)</text><text class="cap" x="40" y="123" text-anchor="start">8 microbatches</text><rect x="220" y="104" width="300" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="220" y="104" width="81.81818181818181" height="28" rx="3"/></g><text class="sub2" x="532" y="123" text-anchor="start">27% idle  (3 ÷ 11)</text><text class="cap" x="40" y="167" text-anchor="start">16 microbatches</text><rect x="220" y="148" width="300" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="220" y="148" width="47.368421052631575" height="28" rx="3"/></g><text class="sub2" x="532" y="167" text-anchor="start">16% idle  (3 ÷ 19)</text><text class="cap" x="40" y="211" text-anchor="start">32 microbatches</text><rect x="220" y="192" width="300" height="28" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="220" y="192" width="25.714285714285715" height="28" rx="3"/></g><text class="sub2" x="532" y="211" text-anchor="start">9% idle  (3 ÷ 35)</text><text class="cap" x="40" y="266" text-anchor="start">Four stages throughout. Fed four microbatches the stages idle 3 ÷ 7 = 43% of the time;</text><text class="cap" x="40" y="286" text-anchor="start">eight, 3 ÷ 11 = 27%; sixteen, 3 ÷ 19 = 16%; thirty-two, 3 ÷ 35 = 9%.</text><text class="cap" x="40" y="326" text-anchor="start">Each doubling removes fewer points, 16, then 11, then 7, yet a larger share of what is</text><text class="cap" x="40" y="346" text-anchor="start">left: 36%, 42%, 46%. Once microbatches far outnumber stages the bubble is about</text><text class="cap" x="40" y="366" text-anchor="start">(p − 1) ÷ m, so each doubling nearly halves it.</text></svg><figcaption>Bars to scale against a 100% track. Going from 4 to 8 takes the bubble from 43% to 27%; going from 16 to 32 nearly halves it. It never reaches zero.</figcaption></figure>
