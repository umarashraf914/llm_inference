<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:52</div><h3>The handoff hides behind the next microbatch</h3><svg viewBox='0 0 680 378' role='img'><title>The handoff hides behind the next microbatch</title><text class="hd" x="40" y="40">Three microbatches; lengths schematic</text><text class="cap" x="40" y="80" text-anchor="start">stage 1</text><text class="cap" x="40" y="116" text-anchor="start">the wire</text><text class="cap" x="40" y="152" text-anchor="start">stage 2</text><g class="m"><rect x="130" y="62" width="120" height="26" rx="3"/><text class="sub" x="190.0" y="75.0" text-anchor="middle" dominant-baseline="central">microbatch 1</text></g><g class="m"><rect x="254" y="62" width="120" height="26" rx="3"/><text class="sub" x="314.0" y="75.0" text-anchor="middle" dominant-baseline="central">microbatch 2</text></g><g class="m"><rect x="378" y="62" width="120" height="26" rx="3"/><text class="sub" x="438.0" y="75.0" text-anchor="middle" dominant-baseline="central">microbatch 3</text></g><g class="m"><rect x="502" y="62" width="120" height="26" rx="3"/><text class="sub" x="562.0" y="75.0" text-anchor="middle" dominant-baseline="central">microbatch 4</text></g><g class="h"><rect x="254" y="98" width="26" height="26" rx="3"/><text class="sub" x="267.0" y="111.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="284" y="134" width="120" height="26" rx="3"/><text class="sub" x="344.0" y="147.0" text-anchor="middle" dominant-baseline="central">microbatch 1</text></g><g class="h"><rect x="378" y="98" width="26" height="26" rx="3"/><text class="sub" x="391.0" y="111.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="m"><rect x="408" y="134" width="120" height="26" rx="3"/><text class="sub" x="468.0" y="147.0" text-anchor="middle" dominant-baseline="central">microbatch 2</text></g><g class="h"><rect x="502" y="98" width="26" height="26" rx="3"/><text class="sub" x="515.0" y="111.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="m"><rect x="532" y="134" width="120" height="26" rx="3"/><text class="sub" x="592.0" y="147.0" text-anchor="middle" dominant-baseline="central">microbatch 3</text></g><rect x="130" y="134" width="150" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="205.0" y="147.0" text-anchor="middle" dominant-baseline="central">waiting</text><text class="sub2" x="254" y="186" text-anchor="start">microbatch 1 crosses while stage 1 starts microbatch 2</text><text class="cap" x="40" y="232" text-anchor="start">The stage sends one batch's activations onward while it computes the next, so the</text><text class="cap" x="40" y="252" text-anchor="start">transfer adds almost no wall-clock time. Nothing got faster; the wait was covered with</text><text class="cap" x="40" y="272" text-anchor="start">other work ({{fig:v02-o055}}), the same overlap as an asynchronous copy ({{fig:v03-o072}}).</text><text class="cap" x="40" y="312" text-anchor="start">The sizes, for a batch of 32 decode tokens: stage 1 reads its 35 GB of weights in</text><text class="cap" x="40" y="332" text-anchor="start">35 ÷ 3,350 GB/s = 10.4 ms, while the handoff of 32 × 16 KB = 0.5 MB takes 10.5 µs over</text><text class="cap" x="40" y="352" text-anchor="start">the network. The transfer is a thousand times shorter than the work it hides behind.</text></svg><figcaption>Lengths schematic: to scale, each transfer would be a thousandth of a compute block. That is what makes pipeline parallelism the natural way to span nodes.</figcaption></figure>
