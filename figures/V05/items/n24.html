harray="3 3"/><rect x="190" y="288" width="56" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="250" y="288" width="56" height="26" rx="3"/><text class="sub" x="278.0" y="301.0" text-anchor="middle" dominant-baseline="central">A1</text></g><g class="m"><rect x="310" y="288" width="56" height="26" rx="3"/><text class="sub" x="338.0" y="301.0" text-anchor="middle" dominant-baseline="central">B1</text></g><g class="m"><rect x="370" y="288" width="56" height="26" rx="3"/><text class="sub" x="398.0" y="301.0" text-anchor="middle" dominant-baseline="central">C1</text></g><g class="m"><rect x="430" y="288" width="56" height="26" rx="3"/><text class="sub" x="458.0" y="301.0" text-anchor="middle" dominant-baseline="central">D1</text></g><g class="m"><rect x="490" y="288" width="56" height="26" rx="3"/><text class="sub" x="518.0" y="301.0" text-anchor="middle" dominant-baseline="central">A2</text></g><g class="m"><rect x="550" y="288" width="56" height="26" rx="3"/><text class="sub" x="578.0" y="301.0" text-anchor="middle" dominant-baseline="central">B2</text></g><rect x="130" y="318" width="56" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="190" y="318" width="56" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="250" y="318" width="56" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="310" y="318" width="56" height="26" rx="3"/><text class="sub" x="338.0" y="331.0" text-anchor="middle" dominant-baseline="central">A1</text></g><g class="m"><rect x="370" y="318" width="56" height="26" rx="3"/><text class="sub" x="398.0" y="331.0" text-anchor="middle" dominant-baseline="central">B1</text></g><g class="m"><rect x="430" y="318" width="56" height="26" rx="3"/><text class="sub" x="458.0" y="331.0" text-anchor="middle" dominant-baseline="central">C1</text></g><g class="m"><rect x="490" y="318" width="56" height="26" rx="3"/><text class="sub" x="518.0" y="331.0" text-anchor="middle" dominant-baseline="central">D1</text></g><g class="m"><rect x="550" y="318" width="56" height="26" rx="3"/><text class="sub" x="578.0" y="331.0" text-anchor="middle" dominant-baseline="central">A2</text></g><text class="cap" x="40" y="380" text-anchor="start">With one request, token 2 cannot enter stage 1 until token 1 has left stage 4</text><text class="cap" x="40" y="400" text-anchor="start">({{fig:v01-o110}}). Each stage works one slot in four, 25%, however the work is sliced.</text><text class="cap" x="40" y="440" text-anchor="start">The fix is to fill the pipe with other people's tokens. With four requests in flight,</text><text class="cap" x="40" y="460" text-anchor="start">while stage 4 finishes A's token, stage 1 is already on B's; once filled, every stage is</text><text class="cap" x="40" y="480" text-anchor="start">busy in every slot. Continuous batching folds new requests in as old ones finish,</text><text class="cap" x="40" y="500" text-anchor="start">keeping every stage fed ({{fig:v07-o006}}).</text><text class="cap" x="40" y="540" text-anchor="start">Modern stacks go further and run prefill and decode on separate GPU pools, each with its</text><text class="cap" x="40" y="560" text-anchor="start">own parallelism, so the heavy prompt work never stalls the token-by-token stream</text><text class="cap" x="40" y="580" text-anchor="start">({{fig:v07-o010}}).</text></svg><figcaption>Letters are requests, numbers their tokens. A pipeline serves decode well only when at least as many requests are in flight as there are stages.</figcaption></figure>
