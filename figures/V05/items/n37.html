8" text-anchor="start">the ones that have just been added to.</text><text class="cap" x="40" y="428" text-anchor="start">After N − 1 = 3 steps every slice has made one lap and collected all four contributions:</text><text class="cap" x="40" y="448" text-anchor="start">G1 holds 1111 in slice 1, G2 2222 in slice 2, G3 3333, G4 4444. Each GPU has sent three</text><text class="cap" x="40" y="468" text-anchor="start">slices of S/4.</text></svg><figcaption>Read the digits: 3033 is 3 from G1, 30 from G2 and 3000 from G4, with G3's 300 still to come. Every step, every link carries one slice, all at the same time.</figcaption></figure>
