<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:05</div><h3>An eighth of the weights is an eighth of the reading</h3><svg viewBox='0 0 680 338' role='img'><title>An eighth of the weights is an eighth of the reading</title><text class="hd" x="40" y="40">Milliseconds to read the weights for one decode token</text><text class="cap" x="40" y="76" text-anchor="start">one GPU, if 140 GB fit</text><g class="m"><rect x="230" y="58" width="376.11940298507466" height="28" rx="3"/><text class="sub" x="418.05970149253733" y="72.0" text-anchor="middle" dominant-baseline="central">41.8 ms</text></g><text class="cap" x="40" y="120" text-anchor="start">each of eight GPUs</text><g class="s"><rect x="230" y="102" width="47.01492537313433" height="28" rx="3"/></g><g class="h"><rect x="279.01492537313436" y="102" width="22" height="28" rx="3"/></g><text class="sub2" x="311.01492537313436" y="120" text-anchor="start">5.2 ms, plus 160 exchanges (schematic)</text><text class="cap" x="40" y="172" text-anchor="start">Decode is limited by reading: each token's time is the bytes read divided by the read</text><text class="cap" x="40" y="192" text-anchor="start">speed ({{fig:v01-o014}}). Split the weights eight ways and every GPU reads an eighth, all eight</text><text class="cap" x="40" y="212" text-anchor="start">at once: 140 GB ÷ 8 = 17.5 GB, 5.2 ms instead of 41.8 ms on an H100's 3.35 TB/s.</text><text class="cap" x="40" y="252" text-anchor="start">That is the reward: each GPU holds roughly an eighth of the weights and does an eighth</text><text class="cap" x="40" y="272" text-anchor="start">of the math. This is the strategy that makes a single token faster. The price is the 160</text><text class="cap" x="40" y="292" text-anchor="start">exchanges per token, whose bandwidth part is tiny at 16 KB each; what they add is mostly</text><text class="cap" x="40" y="312" text-anchor="start">their tolls.</text></svg><figcaption>Bars to scale, except the exchanges, whose tolls are schematic. Of the five strategies, this is the one that divides the time of a single decode token.</figcaption></figure>
