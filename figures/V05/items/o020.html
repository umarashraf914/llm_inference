<figure><div class='ts'>Fig 20 &nbsp;&middot;&nbsp; 12:38</div><h3>Ring attention</h3><svg viewBox="0 0 680 505" role="img"><title>Ring attention</title><text class="hd" x="40" y="46">Ring attention</text><g class="s"><rect x="306.0" y="58.0" width="68" height="40" rx="4"></rect><text class="sub" x="340.0" y="78.0" text-anchor="middle" dominant-baseline="central">G1</text></g><g class="s"><rect x="418.583302491977" y="104.0" width="68" height="40" rx="4"></rect><text class="sub" x="452.583302491977" y="124.0" text-anchor="middle" dominant-baseline="central">G2</text></g><g class="s"><rect x="418.58330249197707" y="196.0" width="68" height="40" rx="4"></rect><text class="sub" x="452.58330249197707" y="216.0" text-anchor="middle" dominant-baseline="central">G3</text></g><g class="s"><rect x="306.0" y="242.0" width="68" height="40" rx="4"></rect><text class="sub" x="340.0" y="262.0" text-anchor="middle" dominant-baseline="central">G4</text></g><g class="s"><rect x="193.416697508023" y="196.00000000000003" width="68" height="40" rx="4"></rect><text class="sub" x="227.416697508023" y="216.00000000000003" text-anchor="middle" dominant-baseline="central">G5</text></g><g class="s"><rect x="193.416697508023" y="104.0" width="68" height="40" rx="4"></rect><text class="sub" x="227.416697508023" y="124.0" text-anchor="middle" dominant-baseline="central">G6</text></g><line class="conn" x1="383.35332197830587" y1="83.26657077139215" x2="424.46177269574747" y2="100.06292237190654" marker-end="url(#arw)"></line><line class="conn" x1="467.8150946740534" y1="153.2036483994856" x2="467.8150946740534" y2="186.79635160051438" marker-end="url(#arw)"></line><line class="conn" x1="424.4617726957475" y1="239.93707762809345" x2="383.35332197830587" y2="256.73342922860786" marker-end="url(#arw)"></line><line class="conn" x1="296.64667802169413" y1="256.73342922860786" x2="255.53822730425253" y2="239.93707762809348" marker-end="url(#arw)"></line><line class="conn" x1="212.18490532594666" y1="186.79635160051444" x2="212.18490532594666" y2="153.2036483994856" marker-end="url(#arw)"></line><line class="conn" x1="255.5382273042525" y1="100.06292237190654" x2="296.64667802169413" y2="83.26657077139215" marker-end="url(#arw)"></line><text class="sub2" x="340" y="174" text-anchor="middle">blocks travel</text><text class="sub2" x="340" y="194" text-anchor="middle">around the ring</text><text class="cap" x="40" y="323" text-anchor="start">Each GPU computes attention against the key-value block it holds, then passes that block to its</text><text class="cap" x="40" y="343" text-anchor="start">neighbour while receiving the next one. After a full trip around, every query has seen every</text><text class="cap" x="40" y="363" text-anchor="start">block.</text><text class="cap" x="40" y="403" text-anchor="start">What makes it work is timing. The blocks travel while the GPUs compute, so as long as the maths</text><text class="cap" x="40" y="423" text-anchor="start">on one block outlasts the transfer of the next, the communication is completely hidden.</text><text class="cap" x="40" y="463" text-anchor="start">Context length is then bounded not by one GPU's memory but by the ring's combined memory. That</text><text class="cap" x="40" y="483" text-anchor="start">is part of the machinery behind million-token windows, and behind ten-million-token ones.</text></svg><figcaption>A 2023 technique. Overlapping communication with computation is the same idea that hides pipeline transfers, applied to a harder pattern.</figcaption></figure>
