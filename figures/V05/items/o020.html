<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 12:46</div><h3>Ring attention: the keys and values travel, the queries stay</h3><svg viewBox='0 0 680 486' role='img'><title>Ring attention: the keys and values travel, the queries stay</title><text class="hd" x="40" y="40">Four GPUs: queries stay put, key-value blocks go round</text><g class="s"><rect x="270" y="58" width="140" height="44" rx="4"/><text class="sub" x="340.0" y="72.0" text-anchor="middle" dominant-baseline="central">GPU 1</text><text class="sub" x="340.0" y="88.0" text-anchor="middle" dominant-baseline="central">queries Q1, holds KV1</text></g><g class="s"><rect x="470" y="140" width="140" height="44" rx="4"/><text class="sub" x="540.0" y="154.0" text-anchor="middle" dominant-baseline="central">GPU 2</text><text class="sub" x="540.0" y="170.0" text-anchor="middle" dominant-baseline="central">queries Q2, holds KV2</text></g><g class="s"><rect x="270" y="222" width="140" height="44" rx="4"/><text class="sub" x="340.0" y="236.0" text-anchor="middle" dominant-baseline="central">GPU 3</text><text class="sub" x="340.0" y="252.0" text-anchor="middle" dominant-baseline="central">queries Q3, holds KV3</text></g><g class="s"><rect x="70" y="140" width="140" height="44" rx="4"/><text class="sub" x="140.0" y="154.0" text-anchor="middle" dominant-baseline="central">GPU 4</text><text class="sub" x="140.0" y="170.0" text-anchor="middle" dominant-baseline="central">queries Q4, holds KV4</text></g><line class="conn" x1="410" y1="84" x2="498" y2="134" marker-end="url(#arw)"/><line class="conn" x1="540" y1="188" x2="410" y2="240" marker-end="url(#arw)"/><line class="conn" x1="270" y1="248" x2="182" y2="188" marker-end="url(#arw)"/><line class="conn" x1="140" y1="134" x2="270" y2="84" marker-end="url(#arw)"/><text class="sub2" x="340" y="168" text-anchor="middle">blocks move one GPU on,</text><text class="sub2" x="340" y="186" text-anchor="middle">every step</text><text class="cap" x="40" y="320" text-anchor="start">The fix is a 2023 technique called Ring Attention (Liu, Zaharia and Abbeel), which</text><text class="cap" x="40" y="340" text-anchor="start">arranges the GPUs in a ring. Each computes attention for its own queries against the</text><text class="cap" x="40" y="360" text-anchor="start">key-value block it holds, then passes that block to its neighbour while receiving the</text><text class="cap" x="40" y="380" text-anchor="start">next one. After a full trip around the ring, every query has seen every block.</text><text class="cap" x="40" y="420" text-anchor="start">Context length is then bounded not by one GPU's memory but by the ring's combined</text><text class="cap" x="40" y="440" text-anchor="start">memory. That is part of the machinery behind the million-token windows of models like</text><text class="cap" x="40" y="460" text-anchor="start">DeepSeek V4, and the 10-million-token window of Meta's Llama 4 Scout.</text></svg><figcaption>Only key-value blocks ever move. Overlapping that movement with computation is the idea that hid the pipeline's transfers ({{ref:v05-n20}}), applied to a harder pattern.</figcaption></figure>
