4">node 3: pipeline stage 3</text></g><g class="m"><rect x="80" y="296" width="38" height="20" rx="2"/></g><g class="m"><rect x="125" y="296" width="38" height="20" rx="2"/></g><g class="m"><rect x="170" y="296" width="38" height="20" rx="2"/></g><g class="m"><rect x="215" y="296" width="38" height="20" rx="2"/></g><g class="m"><rect x="260" y="296" width="38" height="20" rx="2"/></g><g class="m"><rect x="305" y="296" width="38" height="20" rx="2"/></g><g class="m"><rect x="350" y="296" width="38" height="20" rx="2"/></g><g class="m"><rect x="395" y="296" width="38" height="20" rx="2"/></g><line class="conn" x1="256" y1="334" x2="256" y2="344" marker-end="url(#arw)"/><g class="s"><rect x="60" y="346" width="392" height="74" rx="14"/><text class="lbl" x="82" y="372">node 4: pipeline stage 4</text></g><g class="m"><rect x="80" y="384" width="38" height="20" rx="2"/></g><g class="m"><rect x="125" y="384" width="38" height="20" rx="2"/></g><g class="m"><rect x="170" y="384" width="38" height="20" rx="2"/></g><g class="m"><rect x="215" y="384" width="38" height="20" rx="2"/></g><g class="m"><rect x="260" y="384" width="38" height="20" rx="2"/></g><g class="m"><rect x="305" y="384" width="38" height="20" rx="2"/></g><g class="m"><rect x="350" y="384" width="38" height="20" rx="2"/></g><g class="m"><rect x="395" y="384" width="38" height="20" rx="2"/></g><text class="sub2" x="482" y="68" text-anchor="start">the handoffs between</text><text class="sub2" x="482" y="84" text-anchor="start">nodes are the only</text><text class="sub2" x="482" y="100" text-anchor="start">traffic on the network</text><g class="u"><rect x="490" y="128" width="150" height="90" rx="14"/><text class="lbl" x="512" y="154">copy 2</text><text class="sub" x="512" y="172">the same 32 GPUs</text></g><g class="u"><rect x="490" y="232" width="150" height="90" rx="14"/><text class="lbl" x="512" y="258">copy 3</text><text class="sub" x="512" y="276">the same 32 GPUs</text></g><g class="u"><rect x="490" y="336" width="150" height="90" rx="14"/><text class="lbl" x="512" y="362">copy 4</text><text class="sub" x="512" y="380">the same 32 GPUs</text></g><g class="u"><rect x="40" y="460" width="70" height="30" rx="3"/><text class="sub" x="75.0" y="475.0" text-anchor="middle" dominant-baseline="central">8 GPUs</text></g><text class="sub2" x="122.0" y="478" text-anchor="middle">×</text><g class="u"><rect x="134" y="460" width="80" height="30" rx="3"/><text class="sub" x="174.0" y="475.0" text-anchor="middle" dominant-baseline="central">4 stages</text></g><text class="sub2" x="226.0" y="478" text-anchor="middle">=</text><g class="m"><rect x="238" y="460" width="104" height="30" rx="3"/><text class="sub" x="290.0" y="475.0" text-anchor="middle" dominant-baseline="central">32 per copy</text></g><text class="sub2" x="354.0" y="478" text-anchor="middle">×</text><g class="u"><rect x="366" y="460" width="80" height="30" rx="3"/><text class="sub" x="406.0" y="475.0" text-anchor="middle" dominant-baseline="central">4 copies</text></g><text class="sub2" x="458.0" y="478" text-anchor="middle">=</text><g class="m"><rect x="470" y="460" width="170" height="30" rx="3"/><text class="sub" x="555.0" y="475.0" text-anchor="middle" dominant-baseline="central">128 GPUs</text></g><text class="cap" x="40" y="536" text-anchor="start">Read it inside out. Eight GPUs on NVLink form a tensor-parallel group, the only split</text><text class="cap" x="40" y="556" text-anchor="start">chatty enough to need the fast domain. Four such nodes form a pipeline, one stage per</text><text class="cap" x="40" y="576" text-anchor="start">node, so only thin handoffs cross the network. That is one copy of the model:</text><text class="cap" x="40" y="596" text-anchor="start">8 × 4 = 32 GPUs.</text><text class="cap" x="40" y="636" text-anchor="start">Each holds 1,600 GB ÷ 32 = 50 GB of DeepSeek V4 Pro's FP8 weights, leaving 142 GB of a</text><text class="cap" x="40" y="656" text-anchor="start">192 GB B200 for the cache. Data parallelism then stamps out copies: four here, 128 GPUs</text><text class="cap" x="40" y="676" text-anchor="start">in all. In mixture-of-experts layers, expert parallelism takes the place of one of these</text><text class="cap" x="40" y="696" text-anchor="start">cuts inside the fast domain.</text></svg><figcaption>Illustrative: the numbers are chosen to show the nesting, not taken from any real deployment. The order is the point: the chattiest split innermost, the silent one outside.</figcaption></figure>
