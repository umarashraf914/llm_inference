<figure><div class='ts'>Fig 15 &nbsp;&middot;&nbsp; 9:03</div><h3>Experts are separable by construction</h3><svg viewBox="0 0 680 352" role="img"><title>Experts are separable by construction</title><g class="u"><rect x="40" y="40" width="600" height="130" rx="14"></rect><text class="lbl" x="62" y="66">One MoE layer</text></g><g class="s"><rect x="66" y="96" width="90" height="44" rx="4"></rect><text class="sub" x="111.0" y="118.0" text-anchor="middle" dominant-baseline="central">router</text></g><g class="m"><rect x="180" y="96" width="62" height="44" rx="4"></rect><text class="sub" x="211.0" y="118.0" text-anchor="middle" dominant-baseline="central">E1</text></g><g class="m"><rect x="252" y="96" width="62" height="44" rx="4"></rect><text class="sub" x="283.0" y="118.0" text-anchor="middle" dominant-baseline="central">E2</text></g><g class="u"><rect x="324" y="96" width="62" height="44" rx="4"></rect><text class="sub" x="355.0" y="118.0" text-anchor="middle" dominant-baseline="central">E3</text></g><g class="u"><rect x="396" y="96" width="62" height="44" rx="4"></rect><text class="sub" x="427.0" y="118.0" text-anchor="middle" dominant-baseline="central">E4</text></g><g class="u"><rect x="468" y="96" width="62" height="44" rx="4"></rect><text class="sub" x="499.0" y="118.0" text-anchor="middle" dominant-baseline="central">E5</text></g><g class="u"><rect x="540" y="96" width="62" height="44" rx="4"></rect><text class="sub" x="571.0" y="118.0" text-anchor="middle" dominant-baseline="central">E6</text></g><text class="sub2" x="180" y="200" text-anchor="start">384 routed experts in a layer, and every token runs through just six</text><text class="cap" x="40" y="250" text-anchor="start">Because the experts are separate networks, they can live on separate GPUs. That split is expert</text><text class="cap" x="40" y="270" text-anchor="start">parallelism.</text><text class="cap" x="40" y="310" text-anchor="start">Where tensor parallelism slices every weight matrix into pieces, expert parallelism keeps each</text><text class="cap" x="40" y="330" text-anchor="start">expert whole and gives it a home.</text></svg><figcaption>Why models are built this way at all is the next episode. What matters here is only that the pieces are independent, which is what makes them distributable.</figcaption></figure>
