h="12" height="9.4" rx="1.5"/></g><g class="m"><rect x="571" y="313.0" width="12" height="9.4" rx="1.5"/></g><g class="m"><rect x="586" y="313.0" width="12" height="9.4" rx="1.5"/></g><g class="m"><rect x="601" y="313.0" width="12" height="9.4" rx="1.5"/></g><g class="m"><rect x="616" y="313.0" width="12" height="9.4" rx="1.5"/></g><text class="cap" x="40" y="384" text-anchor="start">In DeepSeek V4 Pro, a layer holds 384 routed experts, and every token runs through just</text><text class="cap" x="40" y="404" text-anchor="start">six of them. Why models built this way work so well is the next video's topic.</text><text class="cap" x="40" y="444" text-anchor="start">What matters here is that the experts are separate networks, so they can live on</text><text class="cap" x="40" y="464" text-anchor="start">separate GPUs: that split is expert parallelism. Spread over eight GPUs, each holds</text><text class="cap" x="40" y="484" text-anchor="start">384 ÷ 8 = 48 experts whole. Where tensor parallelism slices every matrix into pieces,</text><text class="cap" x="40" y="504" text-anchor="start">expert parallelism keeps each expert whole and gives it a home.</text></svg><figcaption>Illustrative placement, eight GPUs of 48 experts. The layout is fixed; which experts a token needs is not, and that is where the traffic comes from.</figcaption></figure>
