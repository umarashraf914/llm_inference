<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:10</div><h3>A million tokens of cache is bigger than the chip</h3><svg viewBox='0 0 680 470' role='img'><title>A million tokens of cache is bigger than the chip</title><text class="hd" x="40" y="40">Bytes per token of context, for the 70B model</text><g class="u"><rect x="40" y="56" width="64" height="34" rx="3"/><text class="sub" x="72.0" y="73.0" text-anchor="middle" dominant-baseline="central">2</text></g><text class="sub2" x="72.0" y="108" text-anchor="middle">key and value</text><text class="sub2" x="115" y="78" text-anchor="middle">×</text><g class="u"><rect x="126" y="56" width="64" height="34" rx="3"/><text class="sub" x="158.0" y="73.0" text-anchor="middle" dominant-baseline="central">80</text></g><text class="sub2" x="158.0" y="108" text-anchor="middle">layers</text><text class="sub2" x="201" y="78" text-anchor="middle">×</text><g class="u"><rect x="212" y="56" width="64" height="34" rx="3"/><text class="sub" x="244.0" y="73.0" text-anchor="middle" dominant-baseline="central">8</text></g><text class="sub2" x="244.0" y="108" text-anchor="middle">KV heads</text><text class="sub2" x="287" y="78" text-anchor="middle">×</text><g class="u"><rect x="298" y="56" width="64" height="34" rx="3"/><text class="sub" x="330.0" y="73.0" text-anchor="middle" dominant-baseline="central">128</text></g><text class="sub2" x="330.0" y="108" text-anchor="middle">numbers each</text><text class="sub2" x="373" y="78" text-anchor="middle">×</text><g class="u"><rect x="384" y="56" width="64" height="34" rx="3"/><text class="sub" x="416.0" y="73.0" text-anchor="middle" dominant-baseline="central">2</text></g><text class="sub2" x="416.0" y="108" text-anchor="middle">bytes each</text><text class="sub2" x="459" y="78" text-anchor="middle">=</text><g class="m"><rect x="470" y="56" width="170" height="34" rx="3"/><text class="sub" x="555.0" y="73.0" text-anchor="middle" dominant-baseline="central">327,680 bytes per token</text></g><text class="cap" x="40" y="152" text-anchor="start">128,000 tokens</text><g class="m"><rect x="210" y="134" width="50.84004848484849" height="26" rx="3"/></g><text class="sub2" x="270.84004848484847" y="152" text-anchor="start">41.9 GB, the 'around 40' of one request</text><text class="cap" x="40" y="190" text-anchor="start">427,000 tokens</text><g class="m"><rect x="210" y="172" width="169.6969696969697" height="26" rx="3"/></g><text class="sub2" x="389.6969696969697" y="190" text-anchor="start">140 GB, as big as the 16-bit weights</text><text class="cap" x="40" y="228" text-anchor="start">586,000 tokens</text><g class="m"><rect x="210" y="210" width="232.72727272727275" height="26" rx="3"/></g><text class="sub2" x="452.72727272727275" y="228" text-anchor="start">192 GB, a whole B200</text><text class="cap" x="40" y="266" text-anchor="start">1,000,000 tokens</text><g class="h"><rect x="210" y="248" width="397.1878787878788" height="26" rx="3"/><text class="sub" x="408.5939393939394" y="261.0" text-anchor="middle" dominant-baseline="central">327.7 GB, more than any one GPU here</text></g><text class="cap" x="40" y="324" text-anchor="start">Per token the cache holds a key and a value for every layer and every KV head:</text><text class="cap" x="40" y="344" text-anchor="start">2 × 80 × 8 × 128 × 2 = 327,680 bytes, about a third of a megabyte ({{fig:v01-o140}}). Multiply</text><text class="cap" x="40" y="364" text-anchor="start">by the context: 128,000 tokens is 41.9 GB, the 'around 40 GB' for a single request.</text><text class="cap" x="40" y="404" text-anchor="start">At about 427,000 tokens the cache equals the model's own 140 GB of weights. At 586,000</text><text class="cap" x="40" y="424" text-anchor="start">it would fill a 192 GB B200 with nothing else on it, and a million tokens needs 328 GB:</text><text class="cap" x="40" y="444" text-anchor="start">one sequence overflows a GPU on its own.</text></svg><figcaption>Bars to scale. The weights are a fixed bill; the cache is charged per token and per request, and at long context it, not the weights, decides how many GPUs one request needs.</figcaption></figure>
