="165" text-anchor="start">G3</text><text class="cap" x="40" y="197" text-anchor="start">G4</text><line class="conn" x1="326" y1="140" x2="396" y2="140" marker-end="url(#arw)"/><text class="sub2" x="361.0" y="130" text-anchor="middle">all-reduce</text><text class="cap" x="40" y="246" text-anchor="start">'Reduce' means combine position by position, here by adding. Position 1 collects</text><text class="cap" x="40" y="266" text-anchor="start">1 + 10 + 100 + 1,000 = 1,111; position 4, 4 + 40 + 400 + 4,000 = 4,444. Every GPU</text><text class="cap" x="40" y="286" text-anchor="start">contributes, and every GPU gets the whole result back.</text><text class="cap" x="40" y="326" text-anchor="start">Each GPU's numbers sit in their own decimal place: G1's in the ones, G2's in the tens,</text><text class="cap" x="40" y="346" text-anchor="start">G3's in the hundreds, G4's in the thousands. So every digit of a sum says whose</text><text class="cap" x="40" y="366" text-anchor="start">contribution has arrived, a bookkeeping trick used again in Part 8.</text><text class="cap" x="40" y="406" text-anchor="start">Every GPU needs the total because the step that follows starts from the whole vector, on</text><text class="cap" x="40" y="426" text-anchor="start">every GPU.</text></svg><figcaption>The digits are a ledger: a 1 in the hundreds place means G3's number has been added in. Watch for them when the ring takes this apart step by step.</figcaption></figure>
