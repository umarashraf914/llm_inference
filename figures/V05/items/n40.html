<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 14:43</div><h3>No algorithm can send less</h3><svg viewBox='0 0 680 412' role='img'><title>No algorithm can send less</title><text class="hd" x="40" y="40">Why no algorithm can send less: one number on each of N GPUs</text><g class="h"><rect x="40" y="58" width="280" height="54" rx="4"/><text class="sub" x="180.0" y="77.0" text-anchor="middle" dominant-baseline="central">before any GPU holds the sum, each of</text><text class="sub" x="180.0" y="93.0" text-anchor="middle" dominant-baseline="central">the other N − 1 must send: N − 1 messages</text></g><g class="h"><rect x="360" y="58" width="280" height="54" rx="4"/><text class="sub" x="500.0" y="77.0" text-anchor="middle" dominant-baseline="central">then the other N − 1 still lack it,</text><text class="sub" x="500.0" y="93.0" text-anchor="middle" dominant-baseline="central">and each must receive: N − 1 more</text></g><text class="sub2" x="40" y="134" text-anchor="start">push your own data out</text><text class="sub2" x="360" y="134" text-anchor="start">pull the result back</text><g class="m"><rect x="40" y="150" width="230" height="32" rx="3"/><text class="sub" x="155.0" y="166.0" text-anchor="middle" dominant-baseline="central">2(N − 1) messages per number</text></g><text class="sub2" x="310.0" y="170" text-anchor="middle">÷ N GPUs</text><text class="sub2" x="410.0" y="170" text-anchor="middle">× S bytes of numbers</text><g class="s"><rect x="480" y="150" width="160" height="32" rx="3"/><text class="sub" x="560.0" y="166.0" text-anchor="middle" dominant-baseline="central">2(N − 1)/N × S each</text></g><text class="cap" x="40" y="226" text-anchor="start">Take a single number on each of N GPUs. Before any GPU can hold the finished sum, each</text><text class="cap" x="40" y="246" text-anchor="start">of the other N − 1 must have sent at least one message, or its number could not be in</text><text class="cap" x="40" y="266" text-anchor="start">it: each GPU has to push its own data out. At that moment the other N − 1 GPUs still</text><text class="cap" x="40" y="286" text-anchor="start">lack the sum, and each must receive at least one more message: each has to pull the</text><text class="cap" x="40" y="306" text-anchor="start">result back.</text><text class="cap" x="40" y="346" text-anchor="start">That is 2(N − 1) messages per number, shared among N GPUs: 2(N − 1)/N each on average,</text><text class="cap" x="40" y="366" text-anchor="start">and for S bytes of numbers, 2(N − 1)/N × S. The ring sends exactly that from every GPU,</text><text class="cap" x="40" y="386" text-anchor="start">so no algorithm can move less. Engineers call the ring bandwidth-optimal.</text></svg><figcaption>Proved by Patarasuk and Yuan (2009). The bound counts bytes, not steps: the ring meets it exactly, and still pays the step tolls of the figure before.</figcaption></figure>
