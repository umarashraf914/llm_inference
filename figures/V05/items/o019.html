<figure><div class='ts'>Fig 19 &nbsp;&middot;&nbsp; 12:01</div><h3>Splitting the input instead</h3><svg viewBox="0 0 680 274" role="img"><title>Splitting the input instead</title><g class="u"><rect x="40" y="55" width="285" height="74" rx="8"></rect><text class="lbl" x="182.5" y="83.0" text-anchor="middle" dominant-baseline="central">Every strategy so far</text><text class="sub" x="182.5" y="101.0" text-anchor="middle" dominant-baseline="central">splits the model</text></g><g class="s"><rect x="368" y="55" width="272" height="74" rx="8"></rect><text class="lbl" x="504.0" y="83.0" text-anchor="middle" dominant-baseline="central">Sequence parallelism</text><text class="sub" x="504.0" y="101.0" text-anchor="middle" dominant-baseline="central">splits the sequence</text></g><text class="cap" x="40" y="172" text-anchor="start">Each GPU holds one chunk of the tokens. That directly answers the KV cache overflow from the</text><text class="cap" x="40" y="192" text-anchor="start">beginning, because a context too long for one GPU can now spread its cache across many.</text><text class="cap" x="40" y="232" text-anchor="start">Attention is what makes this hard. Every query must compare against every key and value, and</text><text class="cap" x="40" y="252" text-anchor="start">they now live on different chips.</text></svg><figcaption>Also called context parallelism. It is the only strategy here aimed at the cache rather than at the weights.</figcaption></figure>
