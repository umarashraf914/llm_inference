<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:56</div><h3>Cut every message into one slice per GPU</h3><svg viewBox='0 0 680 470' role='img'><title>Cut every message into one slice per GPU</title><text class="hd" x="40" y="40">Each GPU's message cut into four slices of S/4</text><text class="sub2" x="165" y="70" text-anchor="middle">slice 1</text><text class="sub2" x="219" y="70" text-anchor="middle">slice 2</text><text class="sub2" x="273" y="70" text-anchor="middle">slice 3</text><text class="sub2" x="327" y="70" text-anchor="middle">slice 4</text><g class="s"><rect x="140" y="80" width="50" height="28" rx="3"/><text class="sub" x="165.0" y="94.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="194" y="80" width="50" height="28" rx="3"/><text class="sub" x="219.0" y="94.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="u"><rect x="248" y="80" width="50" height="28" rx="3"/><text class="sub" x="273.0" y="94.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="u"><rect x="302" y="80" width="50" height="28" rx="3"/><text class="sub" x="327.0" y="94.0" text-anchor="middle" dominant-baseline="central">4</text></g><g class="u"><rect x="140" y="112" width="50" height="28" rx="3"/><text class="sub" x="165.0" y="126.0" text-anchor="middle" dominant-baseline="central">10</text></g><g class="s"><rect x="194" y="112" width="50" height="28" rx="3"/><text class="sub" x="219.0" y="126.0" text-anchor="middle" dominant-baseline="central">20</text></g><g class="u"><rect x="248" y="112" width="50" height="28" rx="3"/><text class="sub" x="273.0" y="126.0" text-anchor="middle" dominant-baseline="central">30</text></g><g class="u"><rect x="302" y="112" width="50" height="28" rx="3"/><text class="sub" x="327.0" y="126.0" text-anchor="middle" dominant-baseline="central">40</text></g><g class="u"><rect x="140" y="144" width="50" height="28" rx="3"/><text class="sub" x="165.0" y="158.0" text-anchor="middle" dominant-baseline="central">100</text></g><g class="u"><rect x="194" y="144" width="50" height="28" rx="3"/><text class="sub" x="219.0" y="158.0" text-anchor="middle" dominant-baseline="central">200</text></g><g class="s"><rect x="248" y="144" width="50" height="28" rx="3"/><text class="sub" x="273.0" y="158.0" text-anchor="middle" dominant-baseline="central">300</text></g><g class="u"><rect x="302" y="144" width="50" height="28" rx="3"/><text class="sub" x="327.0" y="158.0" text-anchor="middle" dominant-baseline="central">400</text></g><g class="u"><rect x="140" y="176" width="50" height="28" rx="3"/><text class="sub" x="165.0" y="190.0" text-anchor="middle" dominant-baseline="central">1000</text></g><g class="u"><rect x="194" y="176" width="50" height="28" rx="3"/><text class="sub" x="219.0" y="190.0" text-anchor="middle" dominant-baseline="central">2000</text></g><g class="u"><rect x="248" y="176" width="50" height="28" rx="3"/><text class="sub" x="273.0" y="190.0" text-anchor="middle" dominant-baseline="central">3000</text></g><g class="s"><rect x="302" y="176" width="50" height="28" rx="3"/><text class="sub" x="327.0" y="190.0" text-anchor="middle" dominant-baseline="central">4000</text></g><text class="cap" x="40" y="99" text-anchor="start">G1</text><text class="cap" x="40" y="131" text-anchor="start">G2</text><text class="cap" x="40" y="163" text-anchor="start">G3</text><text class="cap" x="40" y="195" text-anchor="start">G4</text><text class="sub2" x="368" y="100" text-anchor="start">teal: the slice each GPU</text><text class="sub2" x="368" y="116" text-anchor="start">will finish, G1 the first,</text><text class="sub2" x="368" y="132" text-anchor="start">G2 the second, and so on</text><g class="m"><rect x="40" y="228" width="280" height="34" rx="3"/><text class="sub" x="180.0" y="245.0" text-anchor="middle" dominant-baseline="central">reduce-scatter: 3 steps, adding</text></g><line class="conn" x1="324" y1="245" x2="352" y2="245" marker-end="url(#arw)"/><g class="s"><rect x="356" y="228" width="284" height="34" rx="3"/><text class="sub" x="498.0" y="245.0" text-anchor="middle" dominant-baseline="central">all-gather: 3 steps, copying</text></g><text class="cap" x="40" y="304" text-anchor="start">The ring cuts each GPU's message into one slice per GPU: four GPUs, four slices, each a</text><text class="cap" x="40" y="324" text-anchor="start">quarter of the message. Every GPU will finish one slice: G1 the first, G2 the second,</text><text class="cap" x="40" y="344" text-anchor="start">and so on.</text><text class="cap" x="40" y="384" text-anchor="start">Then the two halves met earlier run in sequence ({{fig:v05-n4}}). First a reduce-scatter, in</text><text class="cap" x="40" y="404" text-anchor="start">which every slice travels once round the ring collecting each GPU's contribution; then</text><text class="cap" x="40" y="424" text-anchor="start">an all-gather, in which the finished slices make one more lap and everyone collects</text><text class="cap" x="40" y="444" text-anchor="start">them.</text></svg><figcaption>The same numbers as {{ref:v05-n3}}: every digit records whose contribution has arrived, so the next two figures can be checked by eye.</figcaption></figure>
