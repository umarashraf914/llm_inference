ominant-baseline="central">1</text></g><g class="u"><rect x="454" y="122" width="56" height="30" rx="3"/><text class="sub" x="482.0" y="137.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="516" y="122" width="56" height="30" rx="3"/><text class="sub" x="544.0" y="137.0" text-anchor="middle" dominant-baseline="central">3</text></g><text class="sub2" x="228" y="80" text-anchor="middle">x</text><text class="cap" x="40" y="124" text-anchor="start">x and A</text><text class="sub2" x="328.0" y="176" text-anchor="middle">1×1 + 2×0</text><g class="s"><rect x="300" y="186" width="56" height="30" rx="3"/><text class="sub" x="328.0" y="201.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="390.0" y="176" text-anchor="middle">1×0 + 2×1</text><g class="s"><rect x="362" y="186" width="56" height="30" rx="3"/><text class="sub" x="390.0" y="201.0" text-anchor="middle" dominant-baseline="central">2</text></g><text class="sub2" x="482.0" y="176" text-anchor="middle">1×2 + 2×1</text><g class="s"><rect x="454" y="186" width="56" height="30" rx="3"/><text class="sub" x="482.0" y="201.0" text-anchor="middle" dominant-baseline="central">4</text></g><text class="sub2" x="544.0" y="176" text-anchor="middle">1×1 + 2×3</text><g class="s"><rect x="516" y="186" width="56" height="30" rx="3"/><text class="sub" x="544.0" y="201.0" text-anchor="middle" dominant-baseline="central">7</text></g><text class="cap" x="40" y="206" text-anchor="start">the output</text><text class="cap" x="40" y="258" text-anchor="start">Write the token's vector on the left, as Megatron-LM does: Y = GELU(XA). Each output</text><text class="cap" x="40" y="278" text-anchor="start">number is the dot product of the whole of x with one column of A ({{fig:v03-o014}}): output 3</text><text class="cap" x="40" y="298" text-anchor="start">is 1×2 + 2×1 = 4.</text><text class="cap" x="40" y="338" text-anchor="start">Give GPU 1 columns 1 and 2 and GPU 2 columns 3 and 4, and give both a copy of x. GPU 1</text><text class="cap" x="40" y="358" text-anchor="start">computes [1 2], GPU 2 computes [4 7], and neither needs anything from the other.</text><text class="cap" x="40" y="398" text-anchor="start">{{fig:v01-o112}} put the vector on the right, where the same split is by rows. The rule</text><text class="cap" x="40" y="418" text-anchor="start">underneath is the same: split by outputs, and each GPU finishes its own numbers.</text></svg><figcaption>No exchange at all: every output a GPU needs is made from columns it holds and an input it already has.</figcaption></figure>
