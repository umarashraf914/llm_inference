<figure><div class='ts'>Fig 12 &nbsp;&middot;&nbsp; 7:01</div><h3>Fill, drain, and the bubble</h3><svg viewBox="0 0 680 524" role="img"><title>Fill, drain, and the bubble</title><text class="hd" x="40" y="46">The pipeline bubble</text><text class="sub2" x="40" y="84" text-anchor="start">stage 1</text><g class="m"><rect x="120" y="66" width="66" height="26" rx="3"></rect></g><g class="m"><rect x="192" y="66" width="66" height="26" rx="3"></rect></g><g class="m"><rect x="264" y="66" width="66" height="26" rx="3"></rect></g><g class="m"><rect x="336" y="66" width="66" height="26" rx="3"></rect></g><rect x="408" y="66" width="66" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><rect x="480" y="66" width="66" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><rect x="552" y="66" width="66" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="40" y="118" text-anchor="start">stage 2</text><rect x="120" y="100" width="66" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="m"><rect x="192" y="100" width="66" height="26" rx="3"></rect></g><g class="m"><rect x="264" y="100" width="66" height="26" rx="3"></rect></g><g class="m"><rect x="336" y="100" width="66" height="26" rx="3"></rect></g><g class="m"><rect x="408" y="100" width="66" height="26" rx="3"></rect></g><rect x="480" y="100" width="66" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><rect x="552" y="100" width="66" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="40" y="152" text-anchor="start">stage 3</text><rect x="120" y="134" width="66" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><rect x="192" y="134" width="66" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="m"><rect x="264" y="134" width="66" height="26" rx="3"></rect></g><g class="m"><rect x="336" y="134" width="66" height="26" rx="3"></rect></g><g class="m"><rect x="408" y="134" width="66" height="26" rx="3"></rect></g><g class="m"><rect x="480" y="134" width="66" height="26" rx="3"></rect></g><rect x="552" y="134" width="66" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="40" y="186" text-anchor="start">stage 4</text><rect x="120" y="168" width="66" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><rect x="192" y="168" width="66" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><rect x="264" y="168" width="66" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="m"><rect x="336" y="168" width="66" height="26" rx="3"></rect></g><g class="m"><rect x="408" y="168" width="66" height="26" rx="3"></rect></g><g class="m"><rect x="480" y="168" width="66" height="26" rx="3"></rect></g><g class="m"><rect x="552" y="168" width="66" height="26" rx="3"></rect></g><text class="sub2" x="120" y="236" text-anchor="start">fill</text><text class="sub2" x="480" y="236" text-anchor="start">drain</text><text class="cap" x="40" y="286" text-anchor="start">While stage one works on the first batch, every stage after it waits for work to arrive. By the</text><text class="cap" x="40" y="306" text-anchor="start">time the batch reaches the last stage, the early stages have run dry.</text><text class="cap" x="40" y="346" text-anchor="start">The fix is microbatches: break the batch into slices and feed them in one after another so</text><text class="cap" x="40" y="366" text-anchor="start">several are in flight at once.</text><g class="s"><rect x="140" y="398" width="400" height="42" rx="6"></rect><text class="sub" x="340.0" y="419.0" text-anchor="middle" dominant-baseline="central">bubble  =  (stages - 1) / (microbatches + stages - 1)</text></g><text class="cap" x="40" y="482" text-anchor="start">Filling and draining is a fixed cost, roughly one trip through the stages, while the useful work</text><text class="cap" x="40" y="502" text-anchor="start">grows with every extra slice.</text></svg><figcaption>The formula makes the trade explicit: the bubble shrinks as microbatches grow, but never to zero.</figcaption></figure>
