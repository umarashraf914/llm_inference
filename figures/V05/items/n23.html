0" height="26" rx="3"/><text class="sub" x="383.0" y="301.0" text-anchor="middle" dominant-baseline="central">3′</text></g><g class="m"><rect x="400.0" y="288" width="26.0" height="26" rx="3"/><text class="sub" x="413.0" y="301.0" text-anchor="middle" dominant-baseline="central">4′</text></g><rect x="430.0" y="288" width="26.0" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="130.0" y="318" width="26.0" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="160.0" y="318" width="26.0" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="190.0" y="318" width="26.0" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="220.0" y="318" width="26.0" height="26" rx="3"/><text class="sub" x="233.0" y="331.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="250.0" y="318" width="26.0" height="26" rx="3"/><text class="sub" x="263.0" y="331.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="m"><rect x="280.0" y="318" width="26.0" height="26" rx="3"/><text class="sub" x="293.0" y="331.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="m"><rect x="310.0" y="318" width="26.0" height="26" rx="3"/><text class="sub" x="323.0" y="331.0" text-anchor="middle" dominant-baseline="central">4</text></g><g class="m"><rect x="340.0" y="318" width="26.0" height="26" rx="3"/><text class="sub" x="353.0" y="331.0" text-anchor="middle" dominant-baseline="central">1′</text></g><g class="m"><rect x="370.0" y="318" width="26.0" height="26" rx="3"/><text class="sub" x="383.0" y="331.0" text-anchor="middle" dominant-baseline="central">2′</text></g><g class="m"><rect x="400.0" y="318" width="26.0" height="26" rx="3"/><text class="sub" x="413.0" y="331.0" text-anchor="middle" dominant-baseline="central">3′</text></g><g class="m"><rect x="430.0" y="318" width="26.0" height="26" rx="3"/><text class="sub" x="443.0" y="331.0" text-anchor="middle" dominant-baseline="central">4′</text></g><text class="sub2" x="466.0" y="288" text-anchor="start">11 half-slots, 27% idle</text><text class="cap" x="40" y="380" text-anchor="start">One more trick comes from the training world. Give each GPU several short,</text><text class="cap" x="40" y="400" text-anchor="start">non-contiguous chunks of layers instead of one block: with two chunks, GPU 1 holds</text><text class="cap" x="40" y="420" text-anchor="start">layers 1–10 and 41–50. A microbatch now goes round the GPUs twice, in steps half as</text><text class="cap" x="40" y="440" text-anchor="start">long, so the pipeline fills and drains in smaller steps.</text><text class="cap" x="40" y="480" text-anchor="start">Four GPUs and four microbatches: the run is 11 half-slots instead of 7 whole ones, and</text><text class="cap" x="40" y="500" text-anchor="start">idle falls from 3 ÷ 7 = 43% to 3 ÷ 11 = 27%, the same as doubling the microbatches. The</text><text class="cap" x="40" y="520" text-anchor="start">price is more messages between stages: each microbatch crosses seven boundaries instead</text><text class="cap" x="40" y="540" text-anchor="start">of three.</text></svg><figcaption>Both charts on one time scale; a prime marks a microbatch's second lap. The same trade as everywhere in parallelism: a smaller bubble, paid for in messages.</figcaption></figure>
