<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 14:29</div><h3>The bytes stay flat; the number of steps does not</h3><svg viewBox='0 0 680 510' role='img'><title>The bytes stay flat; the number of steps does not</title><text class="hd" x="40" y="40">Bytes per GPU: the same scale for both</text><text class="cap" x="40" y="76" text-anchor="start">eight GPUs</text><g class="h"><rect x="200" y="58" width="262.5" height="26" rx="3"/><text class="sub" x="331.25" y="71.0" text-anchor="middle" dominant-baseline="central">1.75 S</text></g><text class="cap" x="40" y="112" text-anchor="start">16,000 GPUs</text><g class="h"><rect x="200" y="94" width="299.98125" height="26" rx="3"/><text class="sub" x="349.990625" y="107.0" text-anchor="middle" dominant-baseline="central">2.00 S</text></g><text class="hd" x="40" y="156">Steps, each paying the toll: logarithmic scale</text><line class="axis" x1="200.0" y1="170" x2="200.0" y2="246"/><text class="sub2" x="200.0" y="262" text-anchor="middle">1</text><line class="axis" x1="280.0" y1="170" x2="280.0" y2="246"/><text class="sub2" x="280.0" y="262" text-anchor="middle">10</text><line class="axis" x1="360.0" y1="170" x2="360.0" y2="246"/><text class="sub2" x="360.0" y="262" text-anchor="middle">100</text><line class="axis" x1="440.0" y1="170" x2="440.0" y2="246"/><text class="sub2" x="440.0" y="262" text-anchor="middle">1,000</text><line class="axis" x1="520.0" y1="170" x2="520.0" y2="246"/><text class="sub2" x="520.0" y="262" text-anchor="middle">10,000</text><line class="axis" x1="600.0" y1="170" x2="600.0" y2="246"/><text class="sub2" x="600.0" y="262" text-anchor="middle">100,000</text><text class="cap" x="40" y="194" text-anchor="start">eight GPUs</text><g class="m"><rect x="200" y="176" width="91.69024285425905" height="26" rx="3"/><text class="sub" x="245.84512142712953" y="189.0" text-anchor="middle" dominant-baseline="central">14 steps</text></g><text class="cap" x="40" y="230" text-anchor="start">16,000 GPUs</text><g class="m"><rect x="200" y="212" width="360.40982672532164" height="26" rx="3"/><text class="sub" x="380.2049133626608" y="225.0" text-anchor="middle" dominant-baseline="central">31,998 steps</text></g><text class="cap" x="40" y="304" text-anchor="start">The bytes stay flat, but every step is a separate exchange, and each pays the fixed toll</text><text class="cap" x="40" y="324" text-anchor="start">of {{fig:v05-n8}}. The steps grow with the group: 2 × 7 = 14 for eight GPUs,</text><text class="cap" x="40" y="344" text-anchor="start">2 × 15,999 = 31,998 for 16,000. A ring's latency grows in proportion to its size.</text><text class="cap" x="40" y="384" text-anchor="start">That is why very large groups do not use one flat ring. NCCL, Nvidia's communication</text><text class="cap" x="40" y="404" text-anchor="start">library, added double binary trees in 2019. A tree adds partial sums on the way up to</text><text class="cap" x="40" y="424" text-anchor="start">its root and copies the total back down, and a binary tree over 16,000 GPUs has only 14</text><text class="cap" x="40" y="444" text-anchor="start">levels: a small message climbs 13 hops and comes back 13, 26 steps against the ring's</text><text class="cap" x="40" y="464" text-anchor="start">31,998. Two complementary trees, each carrying half the data, keep the ring's full</text><text class="cap" x="40" y="484" text-anchor="start">bandwidth; measured, the latency was up to 180 times lower than a ring's at 24,576 GPUs.</text></svg><figcaption>Bandwidth-optimal is not latency-optimal. The ring wins on bytes and loses on tolls, so at scale the libraries change shape.</figcaption></figure>
