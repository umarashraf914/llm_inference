ss="sub" x="378.0" y="135.0" text-anchor="middle" dominant-baseline="central">the batch</text></g><rect x="430" y="122" width="96" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="130" y="152" width="96" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="230" y="152" width="96" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="330" y="152" width="96" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="430" y="152" width="96" height="26" rx="3"/><text class="sub" x="478.0" y="165.0" text-anchor="middle" dominant-baseline="central">the batch</text></g><text class="sub2" x="130" y="202" text-anchor="start">fill</text><text class="sub2" x="526" y="202" text-anchor="end">drain</text><text class="cap" x="40" y="246" text-anchor="start">While stage one works on the batch, every stage after it sits idle waiting for work to</text><text class="cap" x="40" y="266" text-anchor="start">arrive. By the time the batch reaches the last stage, the early stages have already run</text><text class="cap" x="40" y="286" text-anchor="start">dry. Fill at the start, drain at the end: that idle time is the pipeline bubble.</text><text class="cap" x="40" y="326" text-anchor="start">With one batch and four stages each stage works one slot in four: 12 of 16 cells are</text><text class="cap" x="40" y="346" text-anchor="start">empty, 75%.</text></svg><figcaption>Four GPUs bought, one working at a time. Spanning nodes cheaply has a cost, and the fix is to cut the batch up.</figcaption></figure>
