<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:34</div><h3>A node is one box of GPUs; a cluster is many boxes</h3><svg viewBox='0 0 680 390' role='img'><title>A node is one box of GPUs; a cluster is many boxes</title><g class="u"><rect x="40" y="40" width="285" height="160" rx="14"/><text class="lbl" x="62" y="66">One server, or node</text></g><g class="m"><rect x="62" y="96" width="52" height="38" rx="3"/></g><g class="m"><rect x="122" y="96" width="52" height="38" rx="3"/></g><g class="m"><rect x="182" y="96" width="52" height="38" rx="3"/></g><g class="m"><rect x="242" y="96" width="52" height="38" rx="3"/></g><g class="m"><rect x="62" y="142" width="52" height="38" rx="3"/></g><g class="m"><rect x="122" y="142" width="52" height="38" rx="3"/></g><g class="m"><rect x="182" y="142" width="52" height="38" rx="3"/></g><g class="m"><rect x="242" y="142" width="52" height="38" rx="3"/></g><text class="sub2" x="62" y="218" text-anchor="start">eight GPUs in one metal box</text><g class="u"><rect x="368" y="40" width="272" height="160" rx="14"/><text class="lbl" x="390" y="66">A cluster</text></g><g class="u"><rect x="390" y="96" width="110" height="78" rx="4"/><text class="sub" x="445.0" y="135.0" text-anchor="middle" dominant-baseline="central">node A</text></g><g class="u"><rect x="510" y="96" width="110" height="78" rx="4"/><text class="sub" x="565.0" y="135.0" text-anchor="middle" dominant-baseline="central">node B</text></g><text class="sub2" x="390" y="218" text-anchor="start">many boxes, joined by network cable</text><text class="cap" x="40" y="268" text-anchor="start">Inside one server, a node, the GPUs, typically eight, talk to each other through switch</text><text class="cap" x="40" y="288" text-anchor="start">chips on the same board ({{fig:v02-o093}}). Between servers they talk over ordinary data-centre</text><text class="cap" x="40" y="308" text-anchor="start">networking.</text><text class="cap" x="40" y="348" text-anchor="start">A cluster is many such boxes on one network. How many boxes one model needs, and which</text><text class="cap" x="40" y="368" text-anchor="start">conversations then have to leave a box, is what the rest of this part works out.</text></svg><figcaption>The node, not the GPU, is the unit the network sees. Every strategy in this video is placed on one side of that boundary or the other.</figcaption></figure>
