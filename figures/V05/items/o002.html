<figure><div class='ts'>Fig 02 &nbsp;&middot;&nbsp; 0:24</div><h3>What a node is, and what a cluster is</h3><svg viewBox="0 0 680 366" role="img"><title>What a node is, and what a cluster is</title><g class="u"><rect x="40" y="40" width="285" height="160" rx="14"></rect><text class="lbl" x="62" y="66">One server, or node</text></g><g class="m"><rect x="62" y="96" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="122" y="96" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="182" y="96" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="242" y="96" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="62" y="142" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="122" y="142" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="182" y="142" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="242" y="142" width="52" height="38" rx="3"></rect></g><text class="sub2" x="62" y="218" text-anchor="start">eight GPUs in one metal box</text><g class="u"><rect x="368" y="40" width="272" height="160" rx="14"></rect><text class="lbl" x="390" y="66">A cluster</text></g><g class="u"><rect x="390" y="96" width="110" height="78" rx="4"></rect><text class="sub" x="445.0" y="135.0" text-anchor="middle" dominant-baseline="central">node A</text></g><g class="u"><rect x="510" y="96" width="110" height="78" rx="4"></rect><text class="sub" x="565.0" y="135.0" text-anchor="middle" dominant-baseline="central">node B</text></g><text class="sub2" x="390" y="218" text-anchor="start">many boxes, joined by network cable</text><text class="cap" x="40" y="268" text-anchor="start">Inside a box the GPUs are wired together directly on the board. Between boxes they talk over</text><text class="cap" x="40" y="288" text-anchor="start">ordinary data-centre networking.</text><text class="cap" x="40" y="324" text-anchor="start">That boundary, the edge of the metal box, is where the speed of communication falls off a</text><text class="cap" x="40" y="344" text-anchor="start">cliff. Every placement decision in this video is about which side of it a conversation happens.</text></svg><figcaption>Two words used constantly. A node is one physical machine; a cluster is many of them on a network.</figcaption></figure>
