<figure><div class='ts'>Fig 08 &nbsp;&middot;&nbsp; 3:19</div><h3>The hardware is not uniform</h3><svg viewBox="0 0 680 484" role="img"><title>The hardware is not uniform</title><g class="s"><rect x="40" y="46" width="285" height="160" rx="14"></rect><text class="lbl" x="62" y="72">Inside one node</text></g><g class="m"><rect x="62" y="100" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="122" y="100" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="182" y="100" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="242" y="100" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="62" y="146" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="122" y="146" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="182" y="146" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="242" y="146" width="52" height="38" rx="3"></rect></g><text class="sub2" x="62" y="198" text-anchor="start">eight GPUs on NVLink</text><g class="h"><rect x="368" y="46" width="272" height="160" rx="14"></rect><text class="lbl" x="390" y="72">Between nodes</text></g><g class="u"><rect x="390" y="100" width="110" height="78" rx="4"></rect><text class="sub" x="445.0" y="139.0" text-anchor="middle" dominant-baseline="central">node A</text></g><g class="u"><rect x="510" y="100" width="110" height="78" rx="4"></rect><text class="sub" x="565.0" y="139.0" text-anchor="middle" dominant-baseline="central">node B</text></g><text class="sub2" x="390" y="198" text-anchor="start">InfiniBand or Ethernet</text><text class="cap" x="40" y="244" text-anchor="start">NVLink</text><g class="s"><rect x="200" y="228" width="360" height="30" rx="3"></rect><text class="sub" x="380.0" y="243.0" text-anchor="middle" dominant-baseline="central">900 GB/s on H100, 1.8 TB/s on B200</text></g><text class="cap" x="40" y="304" text-anchor="start">Network</text><g class="h"><rect x="200" y="288" width="20" height="30" rx="3"></rect></g><text class="sub2" x="230" y="307" text-anchor="start">about 50 GB/s</text><text class="cap" x="40" y="362" text-anchor="start">A drop of eighteen to thirty-six times, right at the edge of the box. Newer rack-scale systems</text><text class="cap" x="40" y="382" text-anchor="start">stretch one NVLink domain across 72 GPUs, but the shape is unchanged: wherever the domain ends,</text><text class="cap" x="40" y="402" text-anchor="start">the cliff is waiting.</text><text class="cap" x="40" y="442" text-anchor="start">Heavy constant traffic must stay inside the fast domain. Only thin occasional traffic can afford</text><text class="cap" x="40" y="462" text-anchor="start">to cross.</text></svg><figcaption>This one gap governs the entire layout. Every placement decision later in the video is an application of the last two lines.</figcaption></figure>
