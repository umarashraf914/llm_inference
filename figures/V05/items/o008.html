<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:30</div><h3>Fast inside a box, a cliff at its edge</h3><svg viewBox='0 0 680 600' role='img'><title>Fast inside a box, a cliff at its edge</title><g class="s"><rect x="40" y="40" width="285" height="160" rx="14"/><text class="lbl" x="62" y="66">Inside one node</text></g><g class="m"><rect x="62" y="94" width="52" height="38" rx="3"/></g><g class="m"><rect x="122" y="94" width="52" height="38" rx="3"/></g><g class="m"><rect x="182" y="94" width="52" height="38" rx="3"/></g><g class="m"><rect x="242" y="94" width="52" height="38" rx="3"/></g><g class="m"><rect x="62" y="140" width="52" height="38" rx="3"/></g><g class="m"><rect x="122" y="140" width="52" height="38" rx="3"/></g><g class="m"><rect x="182" y="140" width="52" height="38" rx="3"/></g><g class="m"><rect x="242" y="140" width="52" height="38" rx="3"/></g><g class="h"><rect x="368" y="40" width="272" height="160" rx="14"/><text class="lbl" x="390" y="66">Between nodes</text></g><g class="u"><rect x="390" y="94" width="110" height="78" rx="4"/><text class="sub" x="445.0" y="133.0" text-anchor="middle" dominant-baseline="central">node A</text></g><g class="u"><rect x="510" y="94" width="110" height="78" rx="4"/><text class="sub" x="565.0" y="133.0" text-anchor="middle" dominant-baseline="central">node B</text></g><text class="sub2" x="62" y="218" text-anchor="start">eight GPUs on NVLink</text><text class="sub2" x="390" y="218" text-anchor="start">InfiniBand or Ethernet</text><text class="cap" x="40" y="262" text-anchor="start">NVLink, B200</text><g class="s"><rect x="200" y="244" width="360.0" height="26" rx="3"/><text class="sub" x="380.0" y="257.0" text-anchor="middle" dominant-baseline="central">1.8 TB/s</text></g><text class="cap" x="40" y="300" text-anchor="start">NVLink, H100</text><g class="s"><rect x="200" y="282" width="180.0" height="26" rx="3"/><text class="sub" x="290.0" y="295.0" text-anchor="middle" dominant-baseline="central">900 GB/s</text></g><text class="cap" x="40" y="338" text-anchor="start">network</text><g class="h"><rect x="200" y="320" width="10.0" height="26" rx="3"/></g><text class="sub2" x="220.0" y="338" text-anchor="start">about 50 GB/s</text><text class="cap" x="40" y="394" text-anchor="start">Inside one server, a node, GPUs, typically eight of them, are wired to each other over</text><text class="cap" x="40" y="414" text-anchor="start">NVLink, Nvidia's dedicated GPU-to-GPU interconnect: 900 GB/s on an H100, 1.8 TB/s on a</text><text class="cap" x="40" y="434" text-anchor="start">B200. Step outside the box and traffic leaves through the data-centre network instead,</text><text class="cap" x="40" y="454" text-anchor="start">InfiniBand or Ethernet, at about 50 GB/s: 18 to 36 times slower, as the specifications</text><text class="cap" x="40" y="474" text-anchor="start">are usually quoted.</text><text class="cap" x="40" y="514" text-anchor="start">Nvidia's newest rack-scale systems stretch one NVLink domain across 72 GPUs ({{fig:v02-o097}}),</text><text class="cap" x="40" y="534" text-anchor="start">but the shape is the same: wherever the domain ends, the drop is waiting. Heavy,</text><text class="cap" x="40" y="554" text-anchor="start">constant traffic must stay inside the fast domain; only thin, occasional traffic can</text><text class="cap" x="40" y="574" text-anchor="start">afford to cross.</text></svg><figcaption>Bars to scale. This one gap governs the whole layout; the next figure checks how big it really is.</figcaption></figure>
