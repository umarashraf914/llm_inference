<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:42</div><h3>While a message is in flight, the GPU waiting for it sits idle</h3><svg viewBox='0 0 680 506' role='img'><title>While a message is in flight, the GPU waiting for it sits idle</title><text class="hd" x="40" y="40">One forward pass of 80 layers, on one GPU and split across two</text><text class="cap" x="40" y="80" text-anchor="start">one GPU</text><text class="cap" x="40" y="130" text-anchor="start">GPU A</text><text class="cap" x="40" y="164" text-anchor="start">the wire</text><text class="cap" x="40" y="198" text-anchor="start">GPU B</text><g class="m"><rect x="130" y="62" width="428" height="26" rx="3"/><text class="sub" x="344.0" y="75.0" text-anchor="middle" dominant-baseline="central">layers 1–80</text></g><g class="m"><rect x="130" y="112" width="212" height="26" rx="3"/><text class="sub" x="236.0" y="125.0" text-anchor="middle" dominant-baseline="central">layers 1–40</text></g><rect x="346" y="112" width="266" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="479.0" y="125.0" text-anchor="middle" dominant-baseline="central">done, and idle</text><rect x="130" y="146" width="212" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="346" y="146" width="50" height="26" rx="3"/><text class="sub" x="371.0" y="159.0" text-anchor="middle" dominant-baseline="central">send</text></g><rect x="400" y="146" width="212" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="130" y="180" width="266" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="263.0" y="193.0" text-anchor="middle" dominant-baseline="central">waiting for A's output</text><g class="m"><rect x="400" y="180" width="212" height="26" rx="3"/><text class="sub" x="506.0" y="193.0" text-anchor="middle" dominant-baseline="central">layers 41–80</text></g><line class="axis" x1="130" y1="222" x2="616" y2="222"/><text class="sub2" x="612" y="240" text-anchor="end">time</text><text class="sub2" x="558" y="100" text-anchor="end">one GPU done</text><text class="cap" x="40" y="280" text-anchor="start">On a single GPU there is nothing to coordinate. Weights, activations and the KV cache,</text><text class="cap" x="40" y="300" text-anchor="start">the keys and values kept for every earlier token, all live in one memory, and each</text><text class="cap" x="40" y="320" text-anchor="start">layer's output feeds the next layer directly.</text><text class="cap" x="40" y="360" text-anchor="start">Put the first half of the layers on GPU A and the second half on B. B cannot start until</text><text class="cap" x="40" y="380" text-anchor="start">A's output crosses a wire, and while that transfer is in flight, B sits idle. Time spent</text><text class="cap" x="40" y="400" text-anchor="start">communicating is time not spent computing. A, its half done, waits too: the bubble of</text><text class="cap" x="40" y="420" text-anchor="start">Part 4.</text><text class="cap" x="40" y="460" text-anchor="start">Splitting turns a compute problem into a compute-plus-communication problem. Every</text><text class="cap" x="40" y="480" text-anchor="start">strategy below gets the same two questions: what does it have to send, and how often?</text></svg><figcaption>Lengths schematic. Every dashed stretch is time bought and not used; what is sent, and how often, decide how long those stretches get.</figcaption></figure>
