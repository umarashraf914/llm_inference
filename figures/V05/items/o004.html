<figure><div class='ts'>Fig 04 &nbsp;&middot;&nbsp; 0:24</div><h3>What splitting costs</h3><svg viewBox="0 0 680 390" role="img"><title>What splitting costs</title><g class="s"><rect x="40" y="40" width="285" height="170" rx="14"></rect><text class="lbl" x="62" y="66">One GPU</text></g><g class="s"><rect x="62" y="96" width="240" height="26" rx="3"></rect><text class="sub" x="182.0" y="109.0" text-anchor="middle" dominant-baseline="central">weights</text></g><g class="s"><rect x="62" y="130" width="240" height="26" rx="3"></rect><text class="sub" x="182.0" y="143.0" text-anchor="middle" dominant-baseline="central">activations</text></g><g class="s"><rect x="62" y="164" width="240" height="26" rx="3"></rect><text class="sub" x="182.0" y="177.0" text-anchor="middle" dominant-baseline="central">KV cache</text></g><text class="sub2" x="62" y="234" text-anchor="start">one memory, nothing to coordinate</text><g class="h"><rect x="368" y="40" width="272" height="150" rx="14"></rect><text class="lbl" x="390" y="66">Two GPUs</text></g><g class="u"><rect x="390" y="96" width="110" height="60" rx="4"></rect><text class="sub" x="445.0" y="126.0" text-anchor="middle" dominant-baseline="central">layers 1-40</text></g><line class="conn" x1="506" y1="126" x2="526" y2="126" marker-end="url(#arw)"></line><g class="u"><rect x="532" y="96" width="90" height="60" rx="4"></rect><text class="sub" x="577.0" y="126.0" text-anchor="middle" dominant-baseline="central">41-80</text></g><text class="sub2" x="390" y="234" text-anchor="start">B cannot start until A's output crosses a wire</text><text class="cap" x="40" y="288" text-anchor="start">While that transfer is in flight, B sits idle. Time spent communicating is time not spent</text><text class="cap" x="40" y="308" text-anchor="start">computing.</text><text class="cap" x="40" y="348" text-anchor="start">Splitting turns a compute problem into a compute-plus-communication problem, and every</text><text class="cap" x="40" y="368" text-anchor="start">strategy below is judged by two questions: what does it have to send, and how often.</text></svg><figcaption>Those two questions are the whole framework. Keep them in mind and the five strategies sort themselves without any memorisation.</figcaption></figure>
