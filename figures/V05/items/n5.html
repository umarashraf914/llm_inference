ext-anchor="start">G4</text><line class="conn" x1="255" y1="140" x2="290" y2="140" marker-end="url(#arw)"/><text class="sub2" x="76" y="228" text-anchor="start">teal stays home; red crosses a link</text><text class="hd" x="500" y="76">Point-to-point</text><g class="u"><rect x="500" y="96" width="52" height="30" rx="3"/><text class="sub" x="526.0" y="111.0" text-anchor="middle" dominant-baseline="central">G2</text></g><g class="u"><rect x="588" y="96" width="52" height="30" rx="3"/><text class="sub" x="614.0" y="111.0" text-anchor="middle" dominant-baseline="central">G3</text></g><line class="conn" x1="556" y1="111" x2="584" y2="111" marker-end="url(#arw)"/><text class="sub2" x="500" y="150" text-anchor="start">one sender, one receiver,</text><text class="sub2" x="500" y="166" text-anchor="start">one message</text><text class="cap" x="40" y="270" text-anchor="start">In an all-to-all every GPU holds a different chunk for every GPU: G1's chunk a3 is meant</text><text class="cap" x="40" y="290" text-anchor="start">for G3. Each GPU keeps the chunk addressed to itself and sends the other three, one to</text><text class="cap" x="40" y="310" text-anchor="start">each partner, all at once: 12 transfers among four GPUs, 8 × 7 = 56 among eight.</text><text class="cap" x="40" y="350" text-anchor="start">Afterwards row k holds everything addressed to GPU k, so the grid has been transposed.</text><text class="cap" x="40" y="370" text-anchor="start">Nothing is added; it is pure rearrangement. A point-to-point send is the degenerate</text><text class="cap" x="40" y="390" text-anchor="start">case: one chunk, one sender, one receiver.</text></svg><figcaption>No arithmetic, only movement, so an all-to-all's cost is all transfer, and every pair of GPUs has something to say.</figcaption></figure>
