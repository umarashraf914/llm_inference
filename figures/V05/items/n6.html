<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:17</div><h3>What each pattern asks of one GPU</h3><svg viewBox='0 0 680 506' role='img'><title>What each pattern asks of one GPU</title><text class="hd" x="40" y="40">Eight GPUs, S bytes on each: what one GPU sends</text><text class="sub2" x="176" y="66" text-anchor="start">bytes sent per GPU</text><text class="sub2" x="540" y="66" text-anchor="start">partners</text><text class="cap" x="40" y="96" text-anchor="start">all-reduce</text><g class="h"><rect x="176" y="78" width="280.0" height="26" rx="3"/></g><text class="sub2" x="466.0" y="96" text-anchor="start">1.75 S</text><text class="sub2" x="540" y="96" text-anchor="start">2 neighbours</text><text class="cap" x="40" y="134" text-anchor="start">reduce-scatter</text><g class="h"><rect x="176" y="116" width="140.0" height="26" rx="3"/></g><text class="sub2" x="326.0" y="134" text-anchor="start">0.875 S</text><text class="sub2" x="540" y="134" text-anchor="start">2 neighbours</text><text class="cap" x="40" y="172" text-anchor="start">all-gather</text><g class="h"><rect x="176" y="154" width="140.0" height="26" rx="3"/></g><text class="sub2" x="326.0" y="172" text-anchor="start">0.875 S</text><text class="sub2" x="540" y="172" text-anchor="start">2 neighbours</text><text class="cap" x="40" y="210" text-anchor="start">all-to-all</text><g class="h"><rect x="176" y="192" width="140.0" height="26" rx="3"/></g><text class="sub2" x="326.0" y="210" text-anchor="start">0.875 S, if chunks are equal</text><text class="sub2" x="540" y="210" text-anchor="start">7, all at once</text><text class="cap" x="40" y="248" text-anchor="start">point-to-point</text><g class="h"><rect x="176" y="230" width="160.0" height="26" rx="3"/></g><text class="sub2" x="346.0" y="248" text-anchor="start">S, from one GPU only</text><text class="sub2" x="540" y="248" text-anchor="start">1</text><line class="tick" x1="176" y1="272" x2="336" y2="272"/><line class="tick" x1="176" y1="267" x2="176" y2="277"/><line class="tick" x1="336" y1="267" x2="336" y2="277"/><text class="sub2" x="346" y="276" text-anchor="start">S, one whole message</text><text class="cap" x="40" y="320" text-anchor="start">An all-reduce done the best known way costs each GPU 2 × 7/8 = 1.75 times the message;</text><text class="cap" x="40" y="340" text-anchor="start">each half alone, 7/8 = 0.875. Part 8 derives these ({{fig:v05-o022}}). An all-to-all also sends</text><text class="cap" x="40" y="360" text-anchor="start">7/8 of its buffer, the seven chunks addressed to others. By bytes it is not the</text><text class="cap" x="40" y="380" text-anchor="start">heaviest.</text><text class="cap" x="40" y="420" text-anchor="start">It is the heaviest by what it demands. Every GPU talks to every other at once,</text><text class="cap" x="40" y="440" text-anchor="start">8 × 7 = 56 conversations among eight GPUs and 64 × 63 = 4,032 among sixty-four. The</text><text class="cap" x="40" y="460" text-anchor="start">chunks are uneven, and in a mixture-of-experts model they are redrawn for every batch.</text><text class="cap" x="40" y="480" text-anchor="start">The reductions can be arranged so that each GPU only ever talks to two neighbours.</text></svg><figcaption>Bars to scale. Bytes alone do not rank the patterns: the all-to-all moves less per GPU than an all-reduce, yet it needs every link at once, in amounts nobody knows in advance.</figcaption></figure>
