<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 12:26</div><h3>Eight GPUs turn a 328 GB cache into 41 GB each</h3><svg viewBox='0 0 680 452' role='img'><title>Eight GPUs turn a 328 GB cache into 41 GB each</title><text class="hd" x="40" y="40">The cache of one million-token sequence, every bar on one scale</text><text class="cap" x="40" y="76" text-anchor="start">on one GPU</text><g class="h"><rect x="160" y="58" width="480" height="28" rx="3"/><text class="sub" x="400.0" y="72.0" text-anchor="middle" dominant-baseline="central">1,000,000 tokens: 327.7 GB</text></g><text class="cap" x="40" y="128" text-anchor="start">on eight GPUs</text><g class="s"><rect x="160.0" y="110" width="57.0" height="28" rx="3"/><text class="sub" x="188.5" y="124.0" text-anchor="middle" dominant-baseline="central">41 GB</text></g><g class="s"><rect x="220.0" y="110" width="57.0" height="28" rx="3"/><text class="sub" x="248.5" y="124.0" text-anchor="middle" dominant-baseline="central">41 GB</text></g><g class="s"><rect x="280.0" y="110" width="57.0" height="28" rx="3"/><text class="sub" x="308.5" y="124.0" text-anchor="middle" dominant-baseline="central">41 GB</text></g><g class="s"><rect x="340.0" y="110" width="57.0" height="28" rx="3"/><text class="sub" x="368.5" y="124.0" text-anchor="middle" dominant-baseline="central">41 GB</text></g><g class="s"><rect x="400.0" y="110" width="57.0" height="28" rx="3"/><text class="sub" x="428.5" y="124.0" text-anchor="middle" dominant-baseline="central">41 GB</text></g><g class="s"><rect x="460.0" y="110" width="57.0" height="28" rx="3"/><text class="sub" x="488.5" y="124.0" text-anchor="middle" dominant-baseline="central">41 GB</text></g><g class="s"><rect x="520.0" y="110" width="57.0" height="28" rx="3"/><text class="sub" x="548.5" y="124.0" text-anchor="middle" dominant-baseline="central">41 GB</text></g><g class="s"><rect x="580.0" y="110" width="57.0" height="28" rx="3"/><text class="sub" x="608.5" y="124.0" text-anchor="middle" dominant-baseline="central">41 GB</text></g><line class="mark xok" x1="441.25" y1="50" x2="441.25" y2="94"/><text class="sub2" x="447.25" y="48" text-anchor="start">one B200: 192 GB</text><text class="hd" x="40" y="186">What each split divides the cache by</text><text class="cap" x="40" y="214" text-anchor="start">tensor</text><text class="sub2" x="160" y="214" text-anchor="start">up to 8: one KV head per GPU ({{fig:v05-n15}})</text><text class="cap" x="40" y="236" text-anchor="start">pipeline</text><text class="sub2" x="160" y="236" text-anchor="start">the number of stages: each keeps its own layers</text><text class="cap" x="40" y="258" text-anchor="start">sequence</text><text class="sub2" x="160" y="258" text-anchor="start">the number of GPUs, as many as the context needs</text><text class="cap" x="40" y="306" text-anchor="start">A million tokens at 327,680 bytes each is 327.7 GB, more than a B200 holds. Cut the</text><text class="cap" x="40" y="326" text-anchor="start">sequence into eight chunks of 125,000 tokens and each GPU keeps</text><text class="cap" x="40" y="346" text-anchor="start">125,000 × 327,680 = 40.96 GB.</text><text class="cap" x="40" y="386" text-anchor="start">The other splits divide the cache too, but by factors fixed by the model's shape. Only</text><text class="cap" x="40" y="406" text-anchor="start">splitting the sequence keeps dividing as the context grows: twice the tokens, twice the</text><text class="cap" x="40" y="426" text-anchor="start">GPUs, and the same 41 GB on each.</text></svg><figcaption>Bars to scale. This directly answers the cache overflow of Part 1 ({{ref:v05-n2}}): a context too long for one GPU can now spread its cache across many.</figcaption></figure>
