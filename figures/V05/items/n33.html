or="middle" dominant-baseline="central" data-gt="0-0">step 1</text></g><g class="u0" data-g="0-1"><rect x="456" y="84" width="52" height="28" rx="3" data-gr="0-1" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="482.0" y="98.0" text-anchor="middle" dominant-baseline="central" data-gt="0-1"></text></g><g class="u0" data-g="0-2"><rect x="512" y="84" width="52" height="28" rx="3" data-gr="0-2" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="538.0" y="98.0" text-anchor="middle" dominant-baseline="central" data-gt="0-2"></text></g><g class="u0" data-g="0-3"><rect x="568" y="84" width="52" height="28" rx="3" data-gr="0-3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="594.0" y="98.0" text-anchor="middle" dominant-baseline="central" data-gt="0-3"></text></g><text class="sub2" x="392" y="135" text-anchor="end">Q2</text><g class="u0" data-g="1-0"><rect x="400" y="116" width="52" height="28" rx="3" data-gr="1-0" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="426.0" y="130.0" text-anchor="middle" dominant-baseline="central" data-gt="1-0"></text></g><g class="s" data-g="1-1"><rect x="456" y="116" width="52" height="28" rx="3" data-gr="1-1"/><text class="sub" x="482.0" y="130.0" text-anchor="middle" dominant-baseline="central" data-gt="1-1">step 1</text></g><g class="u0" data-g="1-2"><rect x="512" y="116" width="52" height="28" rx="3" data-gr="1-2" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="538.0" y="130.0" text-anchor="middle" dominant-baseline="central" data-gt="1-2"></text></g><g class="u0" data-g="1-3"><rect x="568" y="116" width="52" height="28" rx="3" data-gr="1-3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="594.0" y="130.0" text-anchor="middle" dominant-baseline="central" data-gt="1-3"></text></g><text class="sub2" x="392" y="167" text-anchor="end">Q3</text><g class="u0" data-g="2-0"><rect x="400" y="148" width="52" height="28" rx="3" data-gr="2-0" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="426.0" y="162.0" text-anchor="middle" dominant-baseline="central" data-gt="2-0"></text></g><g class="u0" data-g="2-1"><rect x="456" y="148" width="52" height="28" rx="3" data-gr="2-1" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="482.0" y="162.0" text-anchor="middle" dominant-baseline="central" data-gt="2-1"></text></g><g class="s" data-g="2-2"><rect x="512" y="148" width="52" height="28" rx="3" data-gr="2-2"/><text class="sub" x="538.0" y="162.0" text-anchor="middle" dominant-baseline="central" data-gt="2-2">step 1</text></g><g class="u0" data-g="2-3"><rect x="568" y="148" width="52" height="28" rx="3" data-gr="2-3" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="594.0" y="162.0" text-anchor="middle" dominant-baseline="central" data-gt="2-3"></text></g><text class="sub2" x="392" y="199" text-anchor="end">Q4</text><g class="u0" data-g="3-0"><rect x="400" y="180" width="52" height="28" rx="3" data-gr="3-0" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="426.0" y="194.0" text-anchor="middle" dominant-baseline="central" data-gt="3-0"></text></g><g class="u0" data-g="3-1"><rect x="456" y="180" width="52" height="28" rx="3" data-gr="3-1" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="482.0" y="194.0" text-anchor="middle" dominant-baseline="central" data-gt="3-1"></text></g><g class="u0" data-g="3-2"><rect x="512" y="180" width="52" height="28" rx="3" data-gr="3-2" style="fill:none;stroke:var(--rule);stroke-dasharray:3 3"/><text class="sub" x="538.0" y="194.0" text-anchor="middle" dominant-baseline="central" data-gt="3-2"></text></g><g class="s" data-g="3-3"><rect x="568" y="180" width="52" height="28" rx="3" data-gr="3-3"/><text class="sub" x="594.0" y="194.0" text-anchor="middle" dominant-baseline="central" data-gt="3-3">step 1</text></g><text class="sub2" x="40" y="238" data-step="">step 1 of 4: each GPU uses the block it already holds</text><text class="sub2" x="40" y="258" data-moves="">transfers so far: 0 of 3; blocks met: 4 of 16</text><text class="cap" x="40" y="302" text-anchor="start">Step 1: each GPU computes its own queries against the block it already holds, the</text><text class="cap" x="40" y="322" text-anchor="start">diagonal of the grid. Then every GPU passes its key-value block to the next GPU round</text><text class="cap" x="40" y="342" text-anchor="start">the ring while receiving one from the GPU before it, and step 2 uses the block that</text><text class="cap" x="40" y="362" text-anchor="start">arrived.</text><text class="cap" x="40" y="402" text-anchor="start">After four steps, four rounds of compute and three of transfer, every GPU's queries have</text><text class="cap" x="40" y="422" text-anchor="start">met every block. No GPU holds more than two blocks at once: the one in use and the one</text><text class="cap" x="40" y="442" text-anchor="start">arriving. Step through it; the schedule was checked against the same rotation in Python.</text></svg></div><figcaption>The schedule is a rotation fixed in advance: nothing in it depends on the data, so every transfer can start before it is needed.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const C = {"N": 4}, q = s => fig.querySelector(s), btn = [...fig.querySelectorAll('button')];
  let t = 0;
  function draw() {
    for (let s = 0; s < C.N; s++) q(`[data-row="${s}"]`).setAttribute('class', s === t ? 'm' : 'u');
    for (let g = 0; g < C.N; g++) for (let s = 0; s < C.N; s++) {
      const b = ((g - s) % C.N + C.N) % C.N, on = s <= t;
      q(`[data-g="${g}-${b}"]`).setAttribute('class', on ? 's' : 'u0');
      q(`[data-gr="${g}-${b}"]`).setAttribute('style', on ? '' : 'fill:none;stroke:var(--rule);stroke-dasharray:3 3');
      q(`[data-gt="${g}-${b}"]`).textContent = on ? `step ${s + 1}` : '';
    }
    q('[data-step]').textContent = `step ${t + 1} of ${C.N}: ` + (t === 0 ? 'each GPU uses the block it already holds'
      : `each GPU uses the block that arrived from the GPU before it`);
    q('[data-moves]').textContent = `transfers so far: ${t} of ${C.N - 1}; blocks met: ${(t + 1) * C.N} of ${C.N * C.N}`;
    btn[0].disabled = t === 0; btn[1].disabled = t === C.N - 1;
  }
  btn[0].addEventListener('click', () => { t = Math.max(t - 1, 0); draw(); });
  btn[1].addEventListener('click', () => { t = Math.min(t + 1, C.N - 1); draw(); });
  btn[2].addEventListener('click', () => { t = 0; draw(); });
  draw();
})();</script></figure>
