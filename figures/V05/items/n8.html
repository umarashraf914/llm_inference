<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:21</div><h3>Every exchange pays a fixed toll before the first byte moves</h3><svg viewBox='0 0 680 544' role='img'><title>Every exchange pays a fixed toll before the first byte moves</title><text class="hd" x="40" y="40">time  =  a fixed toll  +  size ÷ bandwidth</text><text class="sub2" x="290" y="70" text-anchor="start">size ÷ 450 GB/s, NVLink</text><text class="sub2" x="470" y="70" text-anchor="start">size ÷ 50 GB/s, network</text><text class="cap" x="40" y="100" text-anchor="start">16 KB: one token's vector</text><g class="u"><rect x="290" y="82" width="150" height="26" rx="3"/><text class="sub" x="365.0" y="95.0" text-anchor="middle" dominant-baseline="central">0.036 µs</text></g><g class="u"><rect x="470" y="82" width="150" height="26" rx="3"/><text class="sub" x="545.0" y="95.0" text-anchor="middle" dominant-baseline="central">0.33 µs</text></g><text class="cap" x="40" y="134" text-anchor="start">1 MB: 64 tokens</text><g class="u"><rect x="290" y="116" width="150" height="26" rx="3"/><text class="sub" x="365.0" y="129.0" text-anchor="middle" dominant-baseline="central">2.3 µs</text></g><g class="u"><rect x="470" y="116" width="150" height="26" rx="3"/><text class="sub" x="545.0" y="129.0" text-anchor="middle" dominant-baseline="central">21 µs</text></g><text class="cap" x="40" y="168" text-anchor="start">67 MB: 4,096 tokens</text><g class="u"><rect x="290" y="150" width="150" height="26" rx="3"/><text class="sub" x="365.0" y="163.0" text-anchor="middle" dominant-baseline="central">149 µs</text></g><g class="u"><rect x="470" y="150" width="150" height="26" rx="3"/><text class="sub" x="545.0" y="163.0" text-anchor="middle" dominant-baseline="central">1,342 µs</text></g><text class="hd" x="40" y="214">The same two parts, for a small and a big message (schematic)</text><text class="cap" x="40" y="250" text-anchor="start">a 16 KB message</text><g class="h"><rect x="200" y="232" width="230" height="26" rx="3"/><text class="sub" x="315.0" y="245.0" text-anchor="middle" dominant-baseline="central">the toll</text></g><g class="u"><rect x="432" y="232" width="3" height="26" rx="3"/></g><text class="sub2" x="444" y="250" text-anchor="start">the bytes</text><text class="cap" x="40" y="290" text-anchor="start">a 67 MB message</text><g class="h"><rect x="200" y="272" width="10" height="26" rx="3"/></g><g class="u"><rect x="212" y="272" width="410" height="26" rx="3"/><text class="sub" x="417.0" y="285.0" text-anchor="middle" dominant-baseline="central">the bytes, at the link's bandwidth</text></g><text class="cap" x="40" y="338" text-anchor="start">Sending anything has a fixed cost before the first byte moves. The exchange runs as a</text><text class="cap" x="40" y="358" text-anchor="start">GPU program that has to be launched, a few microseconds each ({{fig:v03-o096}}), and the GPUs</text><text class="cap" x="40" y="378" text-anchor="start">must agree that the data is ready. After that, bytes flow at the link's bandwidth.</text><text class="cap" x="40" y="418" text-anchor="start">For a 16 KB message on NVLink the bandwidth part is 36 nanoseconds, shorter than a</text><text class="cap" x="40" y="438" text-anchor="start">single read from the chip's own memory ({{fig:v02-o010}}). Whatever the toll comes to, a</text><text class="cap" x="40" y="458" text-anchor="start">message that small is almost all toll; a 67 MB one is almost all bandwidth.</text><text class="cap" x="40" y="498" text-anchor="start">So 'how often' matters as much as 'how much'. A strategy that sends little but often</text><text class="cap" x="40" y="518" text-anchor="start">pays mostly in tolls, however fast the link.</text></svg><figcaption>Bandwidth times exact; the toll is drawn schematic, because it depends on the library and the system. Count exchanges, not just bytes.</figcaption></figure>
