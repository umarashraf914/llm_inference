<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:44</div><h3>Five patterns, from the workhorse to the lightest</h3><svg viewBox='0 0 680 484' role='img'><title>Five patterns, from the workhorse to the lightest</title><text class="sub2" x="214" y="44" text-anchor="start">each GPU starts with</text><text class="sub2" x="430" y="44" text-anchor="start">each GPU ends with</text><g class="u"><rect x="40" y="56" width="150" height="34" rx="6"/><text class="lbl" x="115.0" y="73.0" text-anchor="middle" dominant-baseline="central">All-reduce</text></g><text class="sub2" x="214" y="77" text-anchor="start">a partial result</text><text class="sub2" x="430" y="77" text-anchor="start">the total, the same everywhere</text><g class="u"><rect x="40" y="102" width="150" height="34" rx="6"/><text class="lbl" x="115.0" y="119.0" text-anchor="middle" dominant-baseline="central">All-gather</text></g><text class="sub2" x="214" y="123" text-anchor="start">one piece</text><text class="sub2" x="430" y="123" text-anchor="start">every piece, nothing added</text><g class="u"><rect x="40" y="148" width="150" height="34" rx="6"/><text class="lbl" x="115.0" y="165.0" text-anchor="middle" dominant-baseline="central">Reduce-scatter</text></g><text class="sub2" x="214" y="169" text-anchor="start">a partial result</text><text class="sub2" x="430" y="169" text-anchor="start">one slice of the total</text><g class="h"><rect x="40" y="194" width="150" height="34" rx="6"/><text class="lbl" x="115.0" y="211.0" text-anchor="middle" dominant-baseline="central">All-to-all</text></g><text class="sub2" x="214" y="215" text-anchor="start">a chunk for each other GPU</text><text class="sub2" x="430" y="215" text-anchor="start">the chunks addressed to it</text><g class="s"><rect x="40" y="240" width="150" height="34" rx="6"/><text class="lbl" x="115.0" y="257.0" text-anchor="middle" dominant-baseline="central">Point-to-point</text></g><text class="sub2" x="214" y="261" text-anchor="start">one GPU sends</text><text class="sub2" x="430" y="261" text-anchor="start">one other GPU receives</text><text class="cap" x="40" y="318" text-anchor="start">The workhorse is the all-reduce: every GPU contributes a partial result and every GPU</text><text class="cap" x="40" y="338" text-anchor="start">gets back the total. Its two halves also show up on their own. An all-gather collects</text><text class="cap" x="40" y="358" text-anchor="start">every GPU's piece onto every GPU without summing; a reduce-scatter does the sum but</text><text class="cap" x="40" y="378" text-anchor="start">leaves each GPU holding just one slice of it.</text><text class="cap" x="40" y="418" text-anchor="start">The heaviest pattern is the all-to-all, where every GPU sends a different chunk to every</text><text class="cap" x="40" y="438" text-anchor="start">other GPU at once. The lightest is barely a collective at all: a point-to-point send,</text><text class="cap" x="40" y="458" text-anchor="start">one GPU to one other. The next four figures run each of them on numbers.</text></svg><figcaption>Each strategy in this video has one of these as its signature. Which pattern it fires, and how often, decides where on the hardware it can afford to live.</figcaption></figure>
