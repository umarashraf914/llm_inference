300" y1="166" x2="263" y2="190" marker-end="url(#arw)"></line><g class="s"><rect x="228" y="194" width="70" height="30" rx="3"></rect><text class="sub" x="263.0" y="209.0" text-anchor="middle" dominant-baseline="central">total</text></g><line class="conn" x1="300" y1="166" x2="347" y2="190" marker-end="url(#arw)"></line><g class="s"><rect x="312" y="194" width="70" height="30" rx="3"></rect><text class="sub" x="347.0" y="209.0" text-anchor="middle" dominant-baseline="central">total</text></g><text class="hd" x="40" y="268">Its two halves also appear on their own</text><g class="u"><rect x="40" y="288" width="285" height="62" rx="8"></rect><text class="lbl" x="182.5" y="310.0" text-anchor="middle" dominant-baseline="central">All-gather</text><text class="sub" x="182.5" y="328.0" text-anchor="middle" dominant-baseline="central">collect every piece everywhere, no sum</text></g><g class="u"><rect x="368" y="288" width="272" height="62" rx="8"></rect><text class="lbl" x="504.0" y="310.0" text-anchor="middle" dominant-baseline="central">Reduce-scatter</text><text class="sub" x="504.0" y="328.0" text-anchor="middle" dominant-baseline="central">sum, but each keeps one slice</text></g><text class="hd" x="40" y="400">And the two extremes</text><g class="h"><rect x="40" y="420" width="285" height="62" rx="8"></rect><text class="lbl" x="182.5" y="442.0" text-anchor="middle" dominant-baseline="central">All-to-all</text><text class="sub" x="182.5" y="460.0" text-anchor="middle" dominant-baseline="central">every GPU sends a different chunk to every other</text></g><g class="s"><rect x="368" y="420" width="272" height="62" rx="8"></rect><text class="lbl" x="504.0" y="442.0" text-anchor="middle" dominant-baseline="central">Point-to-point</text><text class="sub" x="504.0" y="460.0" text-anchor="middle" dominant-baseline="central">one GPU to one other</text></g></svg><figcaption>Each strategy in this video has one of these as its signature. Which pattern it fires, and how often, decides where on the hardware it can afford to live.</figcaption></figure>
