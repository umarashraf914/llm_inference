 x2="404" y2="110" marker-end="url(#arw)"/><text class="sub2" x="416" y="104" text-anchor="start">× the router: one row per expert</text><g class="m"><rect x="384" y="112" width="256" height="30" rx="3"/><text class="sub" x="512.0" y="127.0" text-anchor="middle" dominant-baseline="central">384 scores, one per expert</text></g><line class="conn" x1="404" y1="144" x2="404" y2="164" marker-end="url(#arw)"/><text class="sub2" x="416" y="158" text-anchor="start">rank them</text><g class="m"><rect x="384" y="166" width="256" height="30" rx="3"/><text class="sub" x="512.0" y="181.0" text-anchor="middle" dominant-baseline="central">the six largest kept</text></g><line class="conn" x1="404" y1="198" x2="404" y2="218" marker-end="url(#arw)"/><text class="sub2" x="416" y="212" text-anchor="start">only these six do any work</text><g class="s"><rect x="384" y="220" width="256" height="30" rx="3"/><text class="sub" x="512.0" y="235.0" text-anchor="middle" dominant-baseline="central">six experts run; scores weight them</text></g><text class="cap" x="40" y="310" text-anchor="start">A small router reads the token's vector and scores every expert: one small matrix</text><text class="cap" x="40" y="330" text-anchor="start">multiply, one row per expert, gives 384 scores ({{fig:v06-p15}}). It keeps the six largest,</text><text class="cap" x="40" y="350" text-anchor="start">and their scores later weight the six experts' outputs when they are combined</text><text class="cap" x="40" y="370" text-anchor="start">({{fig:v06-p17}}).</text><text class="cap" x="40" y="410" text-anchor="start">Six of 384 routed experts is 1.6% of them. Add the one shared expert, which every token</text><text class="cap" x="40" y="430" text-anchor="start">passes through as well, plus attention and the rest, and DeepSeek counts 49 billion of</text><text class="cap" x="40" y="450" text-anchor="start">the model's 1.6 trillion parameters as active for each token: 3.1%.</text></svg><figcaption>Grid to scale: six lit of 384. Which six changes from token to token, and that is the root of everything that follows in this part.</figcaption></figure>
