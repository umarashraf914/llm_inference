<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:34</div><h3>At FP8, not even a full eight-GPU node holds the weights</h3><svg viewBox='0 0 680 618' role='img'><title>At FP8, not even a full eight-GPU node holds the weights</title><text class="hd" x="40" y="40">Gigabytes, every bar on one scale</text><text class="cap" x="40" y="76" text-anchor="start">the weights, FP8</text><g class="h"><rect x="230" y="58" width="400.0" height="26" rx="3"/><text class="sub" x="430.0" y="71.0" text-anchor="middle" dominant-baseline="central">1,600 GB</text></g><text class="cap" x="40" y="114" text-anchor="start">eight B200s, one node</text><g class="s"><rect x="230" y="96" width="384.0" height="26" rx="3"/><text class="sub" x="422.0" y="109.0" text-anchor="middle" dominant-baseline="central">8 × 192 = 1,536 GB</text></g><text class="cap" x="40" y="152" text-anchor="start">DGX B200, as sold</text><g class="s"><rect x="230" y="134" width="360.0" height="26" rx="3"/><text class="sub" x="410.0" y="147.0" text-anchor="middle" dominant-baseline="central">1,440 GB</text></g><text class="cap" x="40" y="190" text-anchor="start">eight H100s, one node</text><g class="s"><rect x="230" y="172" width="160.0" height="26" rx="3"/><text class="sub" x="310.0" y="185.0" text-anchor="middle" dominant-baseline="central">8 × 80 = 640 GB</text></g><text class="cap" x="40" y="228" text-anchor="start">one B200</text><g class="s"><rect x="230" y="210" width="48.0" height="26" rx="3"/></g><text class="sub2" x="288.0" y="228" text-anchor="start">192 GB</text><text class="hd" x="40" y="278">At least 9 B200s, and a node holds 8</text><rect x="32" y="292" width="474" height="58" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="40" y="300" width="52" height="42" rx="3"/><text class="sub" x="66.0" y="321.0" text-anchor="middle" dominant-baseline="central">B200 1</text></g><g class="s"><rect x="98" y="300" width="52" height="42" rx="3"/><text class="sub" x="124.0" y="321.0" text-anchor="middle" dominant-baseline="central">B200 2</text></g><g class="s"><rect x="156" y="300" width="52" height="42" rx="3"/><text class="sub" x="182.0" y="321.0" text-anchor="middle" dominant-baseline="central">B200 3</text></g><g class="s"><rect x="214" y="300" width="52" height="42" rx="3"/><text class="sub" x="240.0" y="321.0" text-anchor="middle" dominant-baseline="central">B200 4</text></g><g class="s"><rect x="272" y="300" width="52" height="42" rx="3"/><text class="sub" x="298.0" y="321.0" text-anchor="middle" dominant-baseline="central">B200 5</text></g><g class="s"><rect x="330" y="300" width="52" height="42" rx="3"/><text class="sub" x="356.0" y="321.0" text-anchor="middle" dominant-baseline="central">B200 6</text></g><g class="s"><rect x="388" y="300" width="52" height="42" rx="3"/><text class="sub" x="414.0" y="321.0" text-anchor="middle" dominant-baseline="central">B200 7</text></g><g class="s"><rect x="446" y="300" width="52" height="42" rx="3"/><text class="sub" x="472.0" y="321.0" text-anchor="middle" dominant-baseline="central">B200 8</text></g><g class="s"><rect x="528" y="300" width="52" height="42" rx="3"/><text class="sub" x="554.0" y="321.0" text-anchor="middle" dominant-baseline="central">B200 9</text></g><text class="sub2" x="32" y="368" text-anchor="start">one node: eight GPUs on fast links</text><text class="sub2" x="528" y="368" text-anchor="start">a second box</text><text class="cap" x="40" y="412" text-anchor="start">1,600 ÷ 192 = 8.33, and a GPU cannot be fractional, so at least 9 B200s: one more than a</text><text class="cap" x="40" y="432" text-anchor="start">node holds. With H100s, 1,600 ÷ 80 = 20, which is three nodes. Nvidia's eight-GPU DGX</text><text class="cap" x="40" y="452" text-anchor="start">B200 lists 1,440 GB, 180 GB a GPU, which falls further short.</text><text class="cap" x="40" y="492" text-anchor="start">Nine is a floor, not a plan: it leaves nothing for the cache or the working numbers. And</text><text class="cap" x="40" y="512" text-anchor="start">it means that at FP8 some traffic must cross the slow network between boxes before a</text><text class="cap" x="40" y="532" text-anchor="start">single token of cache is counted.</text><text class="cap" x="40" y="572" text-anchor="start">DeepSeek also publishes the model with its experts in four bits, 0.86 TB. That fits one</text><text class="cap" x="40" y="592" text-anchor="start">eight-B200 node, but still needs at least 5 GPUs.</text></svg><figcaption>Bars to scale. For communication the unit that matters is the node, not the chip, because the fast wiring stops at the edge of the box.</figcaption></figure>
