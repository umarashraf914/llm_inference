<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 14:56</div><h3>Each strategy lives where its traffic can afford to</h3><svg viewBox='0 0 680 550' role='img'><title>Each strategy lives where its traffic can afford to</title><text class="hd" x="40" y="46">Five strategies, each placed where its traffic can afford to live</text><text class="sub2" x="140" y="70" text-anchor="start">what it sends</text><text class="sub2" x="390" y="70" text-anchor="start">where it lives</text><text class="cap" x="40" y="101" text-anchor="start">Tensor</text><g class="h"><rect x="140" y="80" width="220" height="32" rx="4"/><text class="sub" x="250.0" y="96.0" text-anchor="middle" dominant-baseline="central">two all-reduces per layer</text></g><line class="conn" x1="366" y1="96" x2="384" y2="96" marker-end="url(#arw)"/><g class="u"><rect x="390" y="80" width="250" height="32" rx="4"/><text class="sub" x="515.0" y="96.0" text-anchor="middle" dominant-baseline="central">inside a node, on NVLink</text></g><text class="cap" x="40" y="151" text-anchor="start">Pipeline</text><g class="h"><rect x="140" y="130" width="220" height="32" rx="4"/><text class="sub" x="250.0" y="146.0" text-anchor="middle" dominant-baseline="central">one thin handoff per stage</text></g><line class="conn" x1="366" y1="146" x2="384" y2="146" marker-end="url(#arw)"/><g class="u"><rect x="390" y="130" width="250" height="32" rx="4"/><text class="sub" x="515.0" y="146.0" text-anchor="middle" dominant-baseline="central">across nodes, on the network</text></g><text class="cap" x="40" y="201" text-anchor="start">Expert</text><g class="h"><rect x="140" y="180" width="220" height="32" rx="4"/><text class="sub" x="250.0" y="196.0" text-anchor="middle" dominant-baseline="central">two all-to-alls per layer</text></g><line class="conn" x1="366" y1="196" x2="384" y2="196" marker-end="url(#arw)"/><g class="u"><rect x="390" y="180" width="250" height="32" rx="4"/><text class="sub" x="515.0" y="196.0" text-anchor="middle" dominant-baseline="central">the fast domain, or it suffers</text></g><text class="cap" x="40" y="251" text-anchor="start">Sequence</text><g class="h"><rect x="140" y="230" width="220" height="32" rx="4"/><text class="sub" x="250.0" y="246.0" text-anchor="middle" dominant-baseline="central">a ring, hidden behind compute</text></g><line class="conn" x1="366" y1="246" x2="384" y2="246" marker-end="url(#arw)"/><g class="u"><rect x="390" y="230" width="250" height="32" rx="4"/><text class="sub" x="515.0" y="246.0" text-anchor="middle" dominant-baseline="central">wherever compute hides the ring</text></g><text class="cap" x="40" y="301" text-anchor="start">Data</text><g class="s"><rect x="140" y="280" width="220" height="32" rx="4"/><text class="sub" x="250.0" y="296.0" text-anchor="middle" dominant-baseline="central">nothing at all</text></g><line class="conn" x1="366" y1="296" x2="384" y2="296" marker-end="url(#arw)"/><g class="u"><rect x="390" y="280" width="250" height="32" rx="4"/><text class="sub" x="515.0" y="296.0" text-anchor="middle" dominant-baseline="central">around the rest, as copies</text></g><text class="cap" x="40" y="364" text-anchor="start">No real system picks just one strategy. A production deployment can run all five at</text><text class="cap" x="40" y="384" text-anchor="start">once, each placed where its traffic can afford to live. Tensor parallelism talks</text><text class="cap" x="40" y="404" text-anchor="start">constantly, twice every layer, so it stays inside a node on NVLink; pipeline parallelism</text><text class="cap" x="40" y="424" text-anchor="start">sends one thin handoff per stage, so it is the strategy that crosses between boxes.</text><text class="cap" x="40" y="464" text-anchor="start">Expert parallelism's all-to-alls stay on the same fast domain and suffer wherever they</text><text class="cap" x="40" y="484" text-anchor="start">spill past it. Sequence parallelism hides its ring of key-value blocks behind the</text><text class="cap" x="40" y="504" text-anchor="start">compute to serve long context, and data parallelism says nothing at all: it wraps the</text><text class="cap" x="40" y="524" text-anchor="start">finished unit in copies, the outermost layer of virtually every real deployment.</text></svg><figcaption>Read the two columns together. Placement is decided by how much a strategy has to say and how often.</figcaption></figure>
