<figure><div class='ts'>Fig 23 &nbsp;&middot;&nbsp; 14:56</div><h3>The full map</h3><svg viewBox="0 0 680 434" role="img"><title>The full map</title><text class="hd" x="40" y="46">Five strategies, each placed where its traffic can afford to live</text><text class="cap" x="40" y="92" text-anchor="start">Tensor</text><g class="s"><rect x="140" y="74" width="220" height="34" rx="4"></rect><text class="sub" x="250.0" y="91.0" text-anchor="middle" dominant-baseline="central">two all-reduces per layer</text></g><line class="conn" x1="366" y1="91" x2="384" y2="91" marker-end="url(#arw)"></line><g class="u"><rect x="390" y="74" width="250" height="34" rx="4"></rect><text class="sub" x="515.0" y="91.0" text-anchor="middle" dominant-baseline="central">inside a node, on NVLink</text></g><text class="cap" x="40" y="146" text-anchor="start">Pipeline</text><g class="s"><rect x="140" y="128" width="220" height="34" rx="4"></rect><text class="sub" x="250.0" y="145.0" text-anchor="middle" dominant-baseline="central">one thin handoff per stage</text></g><line class="conn" x1="366" y1="145" x2="384" y2="145" marker-end="url(#arw)"></line><g class="u"><rect x="390" y="128" width="250" height="34" rx="4"></rect><text class="sub" x="515.0" y="145.0" text-anchor="middle" dominant-baseline="central">crosses between boxes</text></g><text class="cap" x="40" y="200" text-anchor="start">Expert</text><g class="h"><rect x="140" y="182" width="220" height="34" rx="4"></rect><text class="sub" x="250.0" y="199.0" text-anchor="middle" dominant-baseline="central">two all-to-alls per layer</text></g><line class="conn" x1="366" y1="199" x2="384" y2="199" marker-end="url(#arw)"></line><g class="u"><rect x="390" y="182" width="250" height="34" rx="4"></rect><text class="sub" x="515.0" y="199.0" text-anchor="middle" dominant-baseline="central">same fast domain, or it suffers</text></g><text class="cap" x="40" y="254" text-anchor="start">Sequence</text><g class="s"><rect x="140" y="236" width="220" height="34" rx="4"></rect><text class="sub" x="250.0" y="253.0" text-anchor="middle" dominant-baseline="central">a ring, hidden behind compute</text></g><line class="conn" x1="366" y1="253" x2="384" y2="253" marker-end="url(#arw)"></line><g class="u"><rect x="390" y="236" width="250" height="34" rx="4"></rect><text class="sub" x="515.0" y="253.0" text-anchor="middle" dominant-baseline="central">long context</text></g><text class="cap" x="40" y="308" text-anchor="start">Data</text><g class="u"><rect x="140" y="290" width="220" height="34" rx="4"></rect><text class="sub" x="250.0" y="307.0" text-anchor="middle" dominant-baseline="central">nothing at all</text></g><line class="conn" x1="366" y1="307" x2="384" y2="307" marker-end="url(#arw)"></line><g class="u"><rect x="390" y="290" width="250" height="34" rx="4"></rect><text class="sub" x="515.0" y="307.0" text-anchor="middle" dominant-baseline="central">wraps the finished unit in copies</text></g><text class="cap" x="40" y="372" text-anchor="start">A production deployment can run all five at once. The strategies nest: tensor parallelism makes</text><text class="cap" x="40" y="392" text-anchor="start">the token faster, and data parallelism takes the whole sharded unit the others built and stamps</text><text class="cap" x="40" y="412" text-anchor="start">out copies of it, which is the outermost layer of virtually every real deployment.</text></svg><figcaption>Read the middle column and the right column together. Placement is entirely determined by how much a strategy has to say and how often.</figcaption></figure>
