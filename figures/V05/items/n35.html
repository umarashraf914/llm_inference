"106" y1="164.0" x2="110" y2="164.0"/><text class="sub2" x="102" y="108.0" text-anchor="end">1 s</text><line class="tick" x1="106" y1="104.0" x2="110" y2="104.0"/><text class="sub2" x="102" y="68.0" text-anchor="end">100 s</text><line class="tick" x1="106" y1="64.0" x2="110" y2="64.0"/><polyline class="pl-m" points="110.0,273.6 120.2,269.6 130.4,265.6 140.6,261.6 150.8,257.6 161.0,253.6 171.2,249.6 181.4,245.6 191.6,241.6 201.8,237.6 212.0,233.6 222.2,229.6 232.4,225.6 242.6,221.6 252.8,217.6 263.0,213.6 273.2,209.6 283.4,205.6 293.6,201.6 303.8,197.6 314.0,193.6 324.2,189.6 334.4,185.6 344.6,181.6 354.8,177.6 365.0,173.6 375.2,169.6 385.4,165.6 395.6,161.6 405.8,157.6 416.0,153.6 426.2,149.6 436.4,145.6 446.6,141.6 456.8,137.6 467.0,133.6 477.2,129.6 487.4,125.6 497.6,121.6 507.8,117.6 518.0,113.6 528.2,109.6 538.4,105.6 548.6,101.6 558.8,97.6 569.0,93.6 579.2,89.6 589.4,85.6 599.6,81.6 609.8,77.6 620.0,73.6"/><polyline class="pl-h" points="110.0,225.7 120.2,223.7 130.4,221.7 140.6,219.7 150.8,217.7 161.0,215.7 171.2,213.7 181.4,211.7 191.6,209.7 201.8,207.7 212.0,205.7 222.2,203.7 232.4,201.7 242.6,199.7 252.8,197.7 263.0,195.7 273.2,193.7 283.4,191.7 293.6,189.7 303.8,187.7 314.0,185.7 324.2,183.7 334.4,181.7 344.6,179.7 354.8,177.7 365.0,175.7 375.2,173.7 385.4,171.7 395.6,169.7 405.8,167.7 416.0,165.7 426.2,163.7 436.4,161.7 446.6,159.7 456.8,157.7 467.0,155.7 477.2,153.7 487.4,151.7 497.6,149.7 507.8,147.7 518.0,145.7 528.2,143.7 538.4,141.7 548.6,139.7 558.8,137.7 569.0,135.7 579.2,133.7 589.4,131.7 599.6,129.7 609.8,127.7 620.0,125.7" data-tr=""/><text class="sub2 halo" x="456.6663679814056" y="130.51007694396273" text-anchor="end">compute: c × c × 32,768 ops</text><text class="sub2 halo" x="548.7050595577261" y="165.7" text-anchor="middle" data-tl="">transfer: c × 4,096 bytes</text><line class="axis" x1="527.9" y1="64" x2="527.9" y2="284" stroke-dasharray="3 3" data-vline=""/><circle cx="527.9" cy="109.7" r="4" fill="var(--paper)" stroke="var(--m)" stroke-width="1.5" data-dw=""/><circle cx="527.9" cy="143.8" r="4" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5" data-dx=""/><text class="sub2" x="110" y="348" data-w="">compute, one step of one layer: 517.7 ms</text><text class="sub2" x="110" y="366" data-x="">transfer of the next block: 10.2 ms</text><text class="sub2" x="110" y="384" data-v="">compute is 50.6× the transfer: hidden</text><text class="sub2" x="110" y="402" data-cs="">blocks above 2,473 tokens hide their transfer at 50 GB/s</text><text class="cap" x="40" y="448" text-anchor="start">Per step, per layer, a GPU holding a block of c tokens computes c queries against c</text><text class="cap" x="40" y="468" text-anchor="start">keys: c × c × 32,768 operations for the 70B, since each of 64 query heads does 2 × 128</text><text class="cap" x="40" y="488" text-anchor="start">for a score and 2 × 128 to weight a value. Meanwhile it passes on c tokens' keys and</text><text class="cap" x="40" y="508" text-anchor="start">values: c × 4,096 bytes, for 8 KV heads × 128 numbers × 2 bytes, key and value.</text><text class="cap" x="40" y="548" text-anchor="start">Work grows with c², transfer with c, so a big enough block always hides its transfer.</text><text class="cap" x="40" y="568" text-anchor="start">They are equal where c = F ÷ (8 × B): 2,473 tokens over a 50 GB/s network, 275 over</text><text class="cap" x="40" y="588" text-anchor="start">NVLink's 450. Ring Attention's paper derives the same condition, block ≥ FLOPS ÷</text><text class="cap" x="40" y="608" text-anchor="start">bandwidth, for attention without grouped keys and values.</text><text class="cap" x="40" y="648" text-anchor="start">At a million tokens over eight GPUs, c = 125,000: 518 ms of compute per step against</text><text class="cap" x="40" y="668" text-anchor="start">10 ms of transfer, 51 times over. The widget's arithmetic was checked against Python at</text><text class="cap" x="40" y="688" text-anchor="start">every setting.</text></svg></div><figcaption>Ideal rates at 989 TFLOPS. In decode there is one query, the work collapses to a line, and the transfer would take about 2,500 times the compute, so ring attention is a prefill tool; for decode, Meta's context-parallel serving (2024) passes the query round the ring instead of the keys and values.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const C = {"CS": [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 125000, 200000, 500000, 1000000], "BS": [12.5, 25, 50, 100, 200, 450, 900], "BL": ["12.5", "25", "50", "100", "200", "450", "900"], "PAIR": 32768, "TOKB": 4096, "F": 989000000000000.0, "PL": 110, "PR": 620, "PT": 64, "PB": 284, "YLO": 1e-09, "YHI": 100.0, "c0": 12, "b0": 2}, q = s => fig.querySelector(s);
  const sl = [...fig.querySelectorAll('input[type=range]')], val = [...fig.querySelectorAll('.val')];
  const fmt = (v, d) => { const s = Math.abs(v).toFixed(d), [i, p] = s.split('.');
    return (v < 0 && +s !== 0 ? '−' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (p ? '.' + p : ''); };
  const lg = Math.log10, lx = c => C.PL + (lg(c) - 1) / 5 * (C.PR - C.PL);
  const ly = s => C.PB - (lg(s) - lg(C.YLO)) / (lg(C.YHI) - lg(C.YLO)) * (C.PB - C.PT);
  function tfmt(sec) {
    if (sec >= 1) return fmt(sec, 2) + ' s';
    for (const [k, u] of [[1e3, 'ms'], [1e6, 'µs']]) { const v = sec * k; if (v >= 1) return (v < 10 ? fmt(v, 2) : fmt(v, 1)) + ' ' + u; }
    const v = sec * 1e9; return (v < 10 ? fmt(v, 2) : fmt(v, 1)) + ' ns';
  }
  function draw() {
    const c = C.CS[+sl[0].value], b = C.BS[+sl[1].value];
    val[0].textContent = fmt(c, 0); val[1].textContent = C.BL[+sl[1].value];
    const w = c * c * C.PAIR / C.F, x = c * C.TOKB / (b * 1e9), r = w / x, cs = C.F * C.TOKB / (C.PAIR * b * 1e9);
    const pts = []; for (let k = 0; k <= 50; k++) { const cc = 10 ** (1 + k / 10);
      pts.push(`${lx(cc).toFixed(1)},${ly(cc * C.TOKB / (b * 1e9)).toFixed(1)}`); }
    q('[data-tr]').setAttribute('points', pts.join(' '));
    q('[data-tl]').setAttribute('y', (ly(2e5 * C.TOKB / (b * 1e9)) + 26).toFixed(1));
    q('[data-vline]').setAttribute('x1', lx(c).toFixed(1)); q('[data-vline]').setAttribute('x2', lx(c).toFixed(1));
    q('[data-dw]').setAttribute('cx', lx(c).toFixed(1)); q('[data-dw]').setAttribute('cy', ly(w).toFixed(1));
    q('[data-dx]').setAttribute('cx', lx(c).toFixed(1)); q('[data-dx]').setAttribute('cy', ly(x).toFixed(1));
    q('[data-w]').textContent = `compute, one step of one layer: ${tfmt(w)}`;
    q('[data-x]').textContent = `transfer of the next block: ${tfmt(x)}`;
    q('[data-v]').textContent = r >= 1 ? `compute is ${fmt(r, 1)}× the transfer: hidden`
                                       : `transfer is ${fmt(1 / r, 1)}× the compute: exposed`;
    q('[data-cs]').textContent = `blocks above ${fmt(cs, 0)} tokens hide their transfer at ${C.BL[+sl[1].value]} GB/s`;
  }
  sl.forEach(s => s.addEventListener('input', draw));
  q('button').addEventListener('click', () => { sl[0].value = C.c0; sl[1].value = C.b0; draw(); });
  draw();
})();</script></figure>
