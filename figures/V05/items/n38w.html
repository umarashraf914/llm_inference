7.0" y="170.5" width="7" height="7" rx="1" style="fill:none;stroke:var(--muted)"/><rect x="376.0" y="170.5" width="7" height="7" rx="1" style="fill:none;stroke:var(--muted)"/><rect x="385.0" y="170.5" width="7" height="7" rx="1" style="fill:var(--ink);stroke:none"/><rect x="394.0" y="170.5" width="7" height="7" rx="1" style="fill:none;stroke:var(--muted)"/></g><text class="sub2" x="40" y="215" text-anchor="start">G4</text><g class="u"><rect x="120" y="196" width="72" height="36" rx="3"/><rect x="139.0" y="210.5" width="7" height="7" rx="1" style="fill:none;stroke:var(--muted)"/><rect x="148.0" y="210.5" width="7" height="7" rx="1" style="fill:none;stroke:var(--muted)"/><rect x="157.0" y="210.5" width="7" height="7" rx="1" style="fill:none;stroke:var(--muted)"/><rect x="166.0" y="210.5" width="7" height="7" rx="1" style="fill:var(--ink);stroke:none"/></g><g class="u"><rect x="196" y="196" width="72" height="36" rx="3"/><rect x="215.0" y="210.5" width="7" height="7" rx="1" style="fill:none;stroke:var(--muted)"/><rect x="224.0" y="210.5" width="7" height="7" rx="1" style="fill:none;stroke:var(--muted)"/><rect x="233.0" y="210.5" width="7" height="7" rx="1" style="fill:none;stroke:var(--muted)"/><rect x="242.0" y="210.5" width="7" height="7" rx="1" style="fill:var(--ink);stroke:none"/></g><g class="u"><rect x="272" y="196" width="72" height="36" rx="3"/><rect x="291.0" y="210.5" width="7" height="7" rx="1" style="fill:none;stroke:var(--muted)"/><rect x="300.0" y="210.5" width="7" height="7" rx="1" style="fill:none;stroke:var(--muted)"/><rect x="309.0" y="210.5" width="7" height="7" rx="1" style="fill:none;stroke:var(--muted)"/><rect x="318.0" y="210.5" width="7" height="7" rx="1" style="fill:var(--ink);stroke:none"/></g><g class="u"><rect x="348" y="196" width="72" height="36" rx="3"/><rect x="367.0" y="210.5" width="7" height="7" rx="1" style="fill:none;stroke:var(--muted)"/><rect x="376.0" y="210.5" width="7" height="7" rx="1" style="fill:none;stroke:var(--muted)"/><rect x="385.0" y="210.5" width="7" height="7" rx="1" style="fill:none;stroke:var(--muted)"/><rect x="394.0" y="210.5" width="7" height="7" rx="1" style="fill:var(--ink);stroke:none"/></g></g><g data-below=""><text class="sub2" x="40" y="252" data-ph="">start: each GPU holds only its own numbers</text><text class="sub2" x="40" y="272" data-tally="">each GPU has sent 0 of 6 slices of S/4: 0/4 of the message</text><text class="cap" x="40" y="316" text-anchor="start">Step through the whole all-reduce, then change the number of GPUs. Highlighted cells</text><text class="cap" x="40" y="336" text-anchor="start">have just changed; teal cells hold a finished slice. During the all-gather, a cell still</text><text class="cap" x="40" y="356" text-anchor="start">missing dots is a partial sum left from the first lap, about to be overwritten. Whatever</text><text class="cap" x="40" y="376" text-anchor="start">the group, the reduce-scatter takes N − 1 steps, the all-gather N − 1 more, and each</text><text class="cap" x="40" y="396" text-anchor="start">step costs every GPU one slice of S/N.</text><text class="cap" x="40" y="436" text-anchor="start">So the tally always ends at 2(N − 1) slices of S/N: 1.5 S for four GPUs, 1.75 S for</text><text class="cap" x="40" y="456" text-anchor="start">eight. The steps were checked against the same ring in Python for every group from two</text><text class="cap" x="40" y="476" text-anchor="start">to eight.</text></g></svg></div><figcaption>The dots are the digits of the last two figures, for any group size: a reduce-scatter fills each row's own slice, an all-gather copies it to everyone.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const C = {"GX": 120, "GY": 76, "CH": 36, "n0": 4, "H0": 500}, q = s => fig.querySelector(s), NS = 'http://www.w3.org/2000/svg';
  const sl = fig.querySelector('input[type=range]'), val = fig.querySelector('.val');
  const btn = [...fig.querySelectorAll('button')];
  const fmt = (v, d) => { const s = Math.abs(v).toFixed(d), [i, p] = s.split('.');
    return (v < 0 && +s !== 0 ? '−' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (p ? '.' + p : ''); };
  let t = 0;
  function el(tag, at, txt) { const e = document.createElementNS(NS, tag);
    for (const a in at) e.setAttribute(a, at[a]); if (txt !== undefined) e.textContent = txt; return e; }
  function run(n, upto) {
    let have = Array.from({length: n}, (_, g) => Array(n).fill(1 << g)), changed = [];
    for (let s = 1; s <= upto; s++) {
      const rs = s <= n - 1, k = rs ? s : s - n + 1;
      const sends = [];
      for (let g = 0; g < n; g++) { const j = rs ? ((g - k) % n + n) % n : ((g - k + 1) % n + n) % n;
        sends.push([g, (g + 1) % n, j, have[g][j]]); }
      for (const [a, z, j, v] of sends) have[z][j] = rs ? have[z][j] + v : v;
      changed = sends.map(([a, z, j]) => `${z}-${j}`);
    }
    return [have, changed];
  }
  function draw() {
    const n = +sl.value, total = 2 * (n - 1); val.textContent = n;
    if (t > total) t = total;
    const [have, changed] = run(n, t), cw = Math.min(72, Math.floor((520 - (n - 1) * 4) / n));
    const pw = Math.min(7, Math.floor((cw - 6 - 2 * (n - 1)) / n)), dy = (n - C.n0) * (C.CH + 4);
    q('[data-below]').setAttribute('transform', `translate(0,${dy})`);
    fig.querySelector('svg').setAttribute('viewBox', `0 0 680 ${C.H0 + dy}`);
    const layer = q('[data-grid]'); layer.replaceChildren();
    for (let j = 0; j < n; j++) layer.appendChild(el('text', {class: 'sub2', x: C.GX + j * (cw + 4) + cw / 2,
      y: C.GY - 8, 'text-anchor': 'middle'}, `s${j + 1}`));
    for (let g = 0; g < n; g++) {
      const y = C.GY + g * (C.CH + 4);
      layer.appendChild(el('text', {class: 'sub2', x: 40, y: y + 19}, `G${g + 1}`));
      for (let j = 0; j < n; j++) {
        const x = C.GX + j * (cw + 4), m = have[g][j], full = m === (1 << n) - 1;
        const cls = changed.includes(`${g}-${j}`) ? 'm' : full ? 's' : 'u';
        const gr = el('g', {class: cls}); gr.appendChild(el('rect', {x, y, width: cw, height: C.CH, rx: 3}));
        const pg = 2, w0 = n * pw + (n - 1) * pg, x0 = x + (cw - w0) / 2;
        for (let p = 0; p < n; p++) gr.appendChild(el('rect', {x: (x0 + p * (pw + pg)).toFixed(1), y: y + (C.CH - pw) / 2,
          width: pw, height: pw, rx: 1, style: (m >> p) & 1 ? 'fill:var(--ink);stroke:none' : 'fill:none;stroke:var(--muted)'}));
        layer.appendChild(gr);
      }
    }
    const ph = t === 0 ? 'start: each GPU holds only its own numbers' : t <= n - 1
      ? `reduce-scatter, step ${t} of ${n - 1}: every GPU adds one slice and passes it on`
      : `all-gather, step ${t - n + 1} of ${n - 1}: every GPU passes a finished slice on; the receiver keeps it`;
    let tally = `each GPU has sent ${t} of ${total} slices of S/${n}: ${t}/${n} of the message`;
    if (t === total) tally += ` = ${fmt(total / n, 3).replace(/0+$/, '').replace(/\.$/, '')} S, the whole all-reduce`;
    q('[data-ph]').textContent = ph; q('[data-tally]').textContent = tally;
    btn[0].disabled = t === 0; btn[1].disabled = t === total;
  }
  sl.addEventListener('input', () => { t = 0; draw(); });
  btn[0].addEventListener('click', () => { t = Math.max(t - 1, 0); draw(); });
  btn[1].addEventListener('click', () => { t += 1; draw(); });
  btn[2].addEventListener('click', () => { t = 0; sl.value = C.n0; draw(); });
  draw();
})();</script></figure>
