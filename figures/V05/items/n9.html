<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:36</div><h3>A feed-forward block widens, bends, then narrows</h3><svg viewBox='0 0 680 552' role='img'><title>A feed-forward block widens, bends, then narrows</title><text class="hd" x="40" y="40">One token through a feed-forward block, widths to scale</text><text class="cap" x="40" y="76" text-anchor="start">the token's vector</text><g class="u"><rect x="160" y="58" width="100.0" height="26" rx="3"/><text class="sub" x="210.0" y="71.0" text-anchor="middle" dominant-baseline="central">8,192 numbers</text></g><text class="cap" x="40" y="136" text-anchor="start">four times wider</text><g class="m"><rect x="160" y="118" width="400.0" height="26" rx="3"/><text class="sub" x="360.0" y="131.0" text-anchor="middle" dominant-baseline="central">32,768 numbers</text></g><text class="cap" x="40" y="196" text-anchor="start">each one bent</text><g class="m"><rect x="160" y="178" width="400.0" height="26" rx="3"/><text class="sub" x="360.0" y="191.0" text-anchor="middle" dominant-baseline="central">32,768 numbers, each bent on its own</text></g><text class="cap" x="40" y="256" text-anchor="start">back to its width</text><g class="u"><rect x="160" y="238" width="100.0" height="26" rx="3"/><text class="sub" x="210.0" y="251.0" text-anchor="middle" dominant-baseline="central">8,192 numbers</text></g><line class="conn" x1="210" y1="90" x2="210" y2="114" marker-end="url(#arw)"/><text class="sub2" x="224" y="106" text-anchor="start">× A: 8,192 rows × 32,768 columns</text><line class="conn" x1="210" y1="150" x2="210" y2="174" marker-end="url(#arw)"/><text class="sub2" x="224" y="166" text-anchor="start">GELU, number by number</text><line class="conn" x1="210" y1="210" x2="210" y2="234" marker-end="url(#arw)"/><text class="sub2" x="224" y="226" text-anchor="start">× B: 32,768 rows × 8,192 columns</text><text class="cap" x="40" y="306" text-anchor="start">Megatron-LM, Nvidia's model-parallel training framework, defined the standard recipe:</text><text class="cap" x="40" y="326" text-anchor="start">tensor parallelism. Split each weight matrix across GPUs, so one matrix multiply becomes</text><text class="cap" x="40" y="346" text-anchor="start">several partial ones running at once.</text><text class="cap" x="40" y="386" text-anchor="start">The first block it splits is the feed-forward network, the half of each layer that</text><text class="cap" x="40" y="406" text-anchor="start">treats every token alone ({{fig:v01-o091}}). It is two matrices with a bend between them: A</text><text class="cap" x="40" y="426" text-anchor="start">widens the token's vector, GELU bends each of the wider vector's numbers, and B narrows</text><text class="cap" x="40" y="446" text-anchor="start">the result back to its original width.</text><text class="cap" x="40" y="486" text-anchor="start">Drawn here at the 70B's width of 8,192 with a four-times widening, as in the original</text><text class="cap" x="40" y="506" text-anchor="start">Transformer, which went from 512 to 2,048. The 70B's own block uses three matrices and</text><text class="cap" x="40" y="526" text-anchor="start">splits the same way ({{fig:v05-n14}}).</text></svg><figcaption>Widths to scale. How A and B can be split is decided by the bend in the middle, so the bend comes first.</figcaption></figure>
