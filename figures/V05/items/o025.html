<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 16:15</div><h3>The assumption left standing</h3><svg viewBox='0 0 680 294' role='img'><title>The assumption left standing</title><g class="u"><rect x="40" y="55" width="600" height="66" rx="8"/><text class="lbl" x="340.0" y="88.0" text-anchor="middle" dominant-baseline="central">384 experts per layer, six per token</text></g><text class="cap" x="40" y="168" text-anchor="start">Expert parallelism exists because the model is built out of separate experts, and this</text><text class="cap" x="40" y="188" text-anchor="start">video treated that as a given: 384 experts per layer, six per token, as if that were an</text><text class="cap" x="40" y="208" text-anchor="start">obvious way to build a machine. It is not obvious at all.</text><text class="cap" x="40" y="248" text-anchor="start">Why a model that touches barely 3% of its weights on every token still works, 49 billion</text><text class="cap" x="40" y="268" text-anchor="start">of 1.6 trillion, is the next episode.</text></svg><figcaption>A clean hand-off. The distribution strategy has been justified; the architecture it distributes has not.</figcaption></figure>
