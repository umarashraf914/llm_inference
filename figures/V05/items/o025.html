<figure><div class='ts'>Fig 25 &nbsp;&middot;&nbsp; 16:08</div><h3>The assumption left standing</h3><svg viewBox="0 0 680 270" role="img"><title>The assumption left standing</title><g class="u"><rect x="40" y="55" width="600" height="66" rx="8"></rect><text class="lbl" x="340.0" y="88.0" text-anchor="middle" dominant-baseline="central">384 experts per layer, six per token</text></g><text class="cap" x="40" y="168" text-anchor="start">This video treated that as a given, and it is not obvious at all. Why a model that touches</text><text class="cap" x="40" y="188" text-anchor="start">barely 3% of its weights on any token still works is the next episode.</text><text class="cap" x="40" y="228" text-anchor="start">Expert parallelism exists only because the model is built out of separable pieces. Whether</text><text class="cap" x="40" y="248" text-anchor="start">building it that way is a good idea is a completely separate question.</text></svg><figcaption>A clean hand-off. The distribution strategy has been justified; the architecture it distributes has not.</figcaption></figure>
