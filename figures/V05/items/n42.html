<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 15:37</div><h3>What each split divides, and what it leaves alone</h3><svg viewBox='0 0 680 506' role='img'><title>What each split divides, and what it leaves alone</title><text class="hd" x="40" y="40">Approximately, for the models used here</text><text class="sub2" x="192" y="68" text-anchor="start">weights per GPU</text><text class="sub2" x="318" y="68" text-anchor="start">cache per GPU</text><text class="sub2" x="446" y="68" text-anchor="start">what it sends, how often</text><text class="cap" x="40" y="92" text-anchor="start">Tensor</text><text class="sub2" x="40" y="108" text-anchor="start">buys a faster token</text><g class="s"><rect x="192" y="78" width="122" height="34" rx="3"/><text class="sub" x="253.0" y="95.0" text-anchor="middle" dominant-baseline="central">÷ 8</text></g><g class="s"><rect x="318" y="78" width="124" height="34" rx="3"/><text class="sub" x="380.0" y="95.0" text-anchor="middle" dominant-baseline="central">÷ 8 at most</text></g><g class="h"><rect x="446" y="78" width="194" height="34" rx="3"/><text class="sub" x="543.0" y="95.0" text-anchor="middle" dominant-baseline="central">2 all-reduces per layer</text></g><text class="cap" x="40" y="140" text-anchor="start">Pipeline</text><text class="sub2" x="40" y="156" text-anchor="start">buys room across boxes</text><g class="s"><rect x="192" y="126" width="122" height="34" rx="3"/><text class="sub" x="253.0" y="143.0" text-anchor="middle" dominant-baseline="central">÷ stages</text></g><g class="s"><rect x="318" y="126" width="124" height="34" rx="3"/><text class="sub" x="380.0" y="143.0" text-anchor="middle" dominant-baseline="central">÷ stages</text></g><g class="h"><rect x="446" y="126" width="194" height="34" rx="3"/><text class="sub" x="543.0" y="143.0" text-anchor="middle" dominant-baseline="central">1 handoff per stage boundary</text></g><text class="cap" x="40" y="188" text-anchor="start">Expert</text><text class="sub2" x="40" y="204" text-anchor="start">buys room for experts</text><g class="s"><rect x="192" y="174" width="122" height="34" rx="3"/><text class="sub" x="253.0" y="191.0" text-anchor="middle" dominant-baseline="central">experts ÷ GPUs</text></g><g class="u"><rect x="318" y="174" width="124" height="34" rx="3"/><text class="sub" x="380.0" y="191.0" text-anchor="middle" dominant-baseline="central">unchanged</text></g><g class="h"><rect x="446" y="174" width="194" height="34" rx="3"/><text class="sub" x="543.0" y="191.0" text-anchor="middle" dominant-baseline="central">2 all-to-alls per MoE layer</text></g><text class="cap" x="40" y="236" text-anchor="start">Data</text><text class="sub2" x="40" y="252" text-anchor="start">buys throughput only</text><g class="u"><rect x="192" y="222" width="122" height="34" rx="3"/><text class="sub" x="253.0" y="239.0" text-anchor="middle" dominant-baseline="central">unchanged</text></g><g class="u"><rect x="318" y="222" width="124" height="34" rx="3"/><text class="sub" x="380.0" y="239.0" text-anchor="middle" dominant-baseline="central">unchanged</text></g><g class="s"><rect x="446" y="222" width="194" height="34" rx="3"/><text class="sub" x="543.0" y="239.0" text-anchor="middle" dominant-baseline="central">nothing at all</text></g><text class="cap" x="40" y="284" text-anchor="start">Sequence</text><text class="sub2" x="40" y="300" text-anchor="start">buys long context</text><g class="u"><rect x="192" y="270" width="122" height="34" rx="3"/><text class="sub" x="253.0" y="287.0" text-anchor="middle" dominant-baseline="central">unchanged</text></g><g class="s"><rect x="318" y="270" width="124" height="34" rx="3"/><text class="sub" x="380.0" y="287.0" text-anchor="middle" dominant-baseline="central">÷ GPUs, no limit</text></g><g class="h"><rect x="446" y="270" width="194" height="34" rx="3"/><text class="sub" x="543.0" y="287.0" text-anchor="middle" dominant-baseline="central">a ring of key-value blocks</text></g><text class="cap" x="40" y="340" text-anchor="start">Tensor parallelism is the strategy that makes a single token faster: it divides the</text><text class="cap" x="40" y="360" text-anchor="start">weights every decode step must read ({{fig:v05-n18}}). Sequence parallelism also shortens one</text><text class="cap" x="40" y="380" text-anchor="start">long prompt's prefill, since each GPU runs only its own chunk of the tokens. Pipeline</text><text class="cap" x="40" y="400" text-anchor="start">and expert parallelism buy room; data parallelism buys throughput and nothing else.</text><text class="cap" x="40" y="440" text-anchor="start">Only two splits divide the cache, and only one keeps dividing it as the context grows</text><text class="cap" x="40" y="460" text-anchor="start">({{fig:v05-n31}}). Every split but data parallelism adds traffic, which is what decided where</text><text class="cap" x="40" y="480" text-anchor="start">each one lives.</text></svg><figcaption>Read down a column to choose: weights that do not fit, a cache that does not fit and a token that is too slow each have a different answer.</figcaption></figure>
