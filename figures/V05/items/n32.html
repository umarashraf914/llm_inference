<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 12:34</div><h3>Three quarters of the score grid needs someone else's keys</h3><svg viewBox='0 0 680 444' role='img'><title>Three quarters of the score grid needs someone else's keys</title><text class="hd" x="40" y="34">Every query against every key: 16 blocks over four GPUs</text><text class="sub2" x="270.0" y="58" text-anchor="middle">K, V of</text><text class="sub2" x="270.0" y="72" text-anchor="middle">chunk 1</text><text class="sub2" x="354.0" y="58" text-anchor="middle">K, V of</text><text class="sub2" x="354.0" y="72" text-anchor="middle">chunk 2</text><text class="sub2" x="438.0" y="58" text-anchor="middle">K, V of</text><text class="sub2" x="438.0" y="72" text-anchor="middle">chunk 3</text><text class="sub2" x="522.0" y="58" text-anchor="middle">K, V of</text><text class="sub2" x="522.0" y="72" text-anchor="middle">chunk 4</text><text class="cap" x="40" y="107" text-anchor="start">GPU 1's queries</text><g class="s"><rect x="230" y="82" width="80" height="40" rx="3"/><text class="sub" x="270.0" y="102.0" text-anchor="middle" dominant-baseline="central">its own</text></g><g class="h"><rect x="314" y="82" width="80" height="40" rx="3"/><text class="sub" x="354.0" y="102.0" text-anchor="middle" dominant-baseline="central">elsewhere</text></g><g class="h"><rect x="398" y="82" width="80" height="40" rx="3"/><text class="sub" x="438.0" y="102.0" text-anchor="middle" dominant-baseline="central">elsewhere</text></g><g class="h"><rect x="482" y="82" width="80" height="40" rx="3"/><text class="sub" x="522.0" y="102.0" text-anchor="middle" dominant-baseline="central">elsewhere</text></g><text class="cap" x="40" y="151" text-anchor="start">GPU 2's queries</text><g class="h"><rect x="230" y="126" width="80" height="40" rx="3"/><text class="sub" x="270.0" y="146.0" text-anchor="middle" dominant-baseline="central">elsewhere</text></g><g class="s"><rect x="314" y="126" width="80" height="40" rx="3"/><text class="sub" x="354.0" y="146.0" text-anchor="middle" dominant-baseline="central">its own</text></g><g class="h"><rect x="398" y="126" width="80" height="40" rx="3"/><text class="sub" x="438.0" y="146.0" text-anchor="middle" dominant-baseline="central">elsewhere</text></g><g class="h"><rect x="482" y="126" width="80" height="40" rx="3"/><text class="sub" x="522.0" y="146.0" text-anchor="middle" dominant-baseline="central">elsewhere</text></g><text class="cap" x="40" y="195" text-anchor="start">GPU 3's queries</text><g class="h"><rect x="230" y="170" width="80" height="40" rx="3"/><text class="sub" x="270.0" y="190.0" text-anchor="middle" dominant-baseline="central">elsewhere</text></g><g class="h"><rect x="314" y="170" width="80" height="40" rx="3"/><text class="sub" x="354.0" y="190.0" text-anchor="middle" dominant-baseline="central">elsewhere</text></g><g class="s"><rect x="398" y="170" width="80" height="40" rx="3"/><text class="sub" x="438.0" y="190.0" text-anchor="middle" dominant-baseline="central">its own</text></g><g class="h"><rect x="482" y="170" width="80" height="40" rx="3"/><text class="sub" x="522.0" y="190.0" text-anchor="middle" dominant-baseline="central">elsewhere</text></g><text class="cap" x="40" y="239" text-anchor="start">GPU 4's queries</text><g class="h"><rect x="230" y="214" width="80" height="40" rx="3"/><text class="sub" x="270.0" y="234.0" text-anchor="middle" dominant-baseline="central">elsewhere</text></g><g class="h"><rect x="314" y="214" width="80" height="40" rx="3"/><text class="sub" x="354.0" y="234.0" text-anchor="middle" dominant-baseline="central">elsewhere</text></g><g class="h"><rect x="398" y="214" width="80" height="40" rx="3"/><text class="sub" x="438.0" y="234.0" text-anchor="middle" dominant-baseline="central">elsewhere</text></g><g class="s"><rect x="482" y="214" width="80" height="40" rx="3"/><text class="sub" x="522.0" y="234.0" text-anchor="middle" dominant-baseline="central">its own</text></g><text class="cap" x="40" y="298" text-anchor="start">Attention is what makes this hard. Every query must compare against every key and value</text><text class="cap" x="40" y="318" text-anchor="start">({{fig:v03-o021}}), and each query's output is a weighted average over all of them ({{fig:v01-o094}}).</text><text class="cap" x="40" y="358" text-anchor="start">Cut the sequence in four: GPU k holds the queries of chunk k and the keys and values of</text><text class="cap" x="40" y="378" text-anchor="start">chunk k. Of the 16 blocks of the score grid only the 4 on the diagonal pair a GPU's</text><text class="cap" x="40" y="398" text-anchor="start">queries with its own keys. The other 12, three quarters, need keys and values that live</text><text class="cap" x="40" y="418" text-anchor="start">on another chip.</text></svg><figcaption>With N GPUs only N of the N × N blocks are local. Under the causal mask, where a token may look only at earlier tokens ({{ref:v03-o020}}), the six blocks above the diagonal are empty, so the GPUs are also loaded unevenly.</figcaption></figure>
