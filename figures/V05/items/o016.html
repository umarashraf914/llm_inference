<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 9:54</div><h3>One token's trip: out to its experts and back</h3><svg viewBox='0 0 680 326' role='img'><title>One token's trip: out to its experts and back</title><text class="hd" x="40" y="46">One token, one layer</text><g class="s"><rect x="40" y="70" width="100" height="40" rx="4"/><text class="sub" x="90.0" y="90.0" text-anchor="middle" dominant-baseline="central">arrives</text></g><line class="conn" x1="146" y1="90" x2="166" y2="90" marker-end="url(#arw)"/><g class="s"><rect x="172" y="70" width="110" height="40" rx="4"/><text class="sub" x="227.0" y="90.0" text-anchor="middle" dominant-baseline="central">router picks 6</text></g><line class="conn" x1="288" y1="90" x2="308" y2="90" marker-end="url(#arw)"/><g class="h"><rect x="314" y="70" width="150" height="40" rx="4"/><text class="sub" x="389.0" y="90.0" text-anchor="middle" dominant-baseline="central">ships to its experts</text></g><line class="conn" x1="470" y1="90" x2="490" y2="90" marker-end="url(#arw)"/><g class="h"><rect x="496" y="70" width="144" height="40" rx="4"/><text class="sub" x="568.0" y="90.0" text-anchor="middle" dominant-baseline="central">results come back</text></g><text class="sub2" x="314" y="134" text-anchor="start">dispatch</text><text class="sub2" x="496" y="134" text-anchor="start">combine</text><text class="cap" x="40" y="180" text-anchor="start">Watch one token move through a layer. It arrives on some GPU, and a small router reads</text><text class="cap" x="40" y="200" text-anchor="start">it and picks its six experts. A couple might live on this chip, but the rest sit</text><text class="cap" x="40" y="220" text-anchor="start">elsewhere. So the token ships out to the GPUs that hold its experts, gets processed</text><text class="cap" x="40" y="240" text-anchor="start">there, and the results come back to be combined.</text><text class="cap" x="40" y="280" text-anchor="start">The trip out is called the dispatch and the trip back the combine. Both are</text><text class="cap" x="40" y="300" text-anchor="start">communication, and both sit inside every MoE layer, for every token.</text></svg><figcaption>Two exchanges per MoE layer, out and back. Once every token in the batch takes this trip at the same time, each one becomes an all-to-all.</figcaption></figure>
