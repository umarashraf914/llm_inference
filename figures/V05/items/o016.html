<figure><div class='ts'>Fig 16 &nbsp;&middot;&nbsp; 9:54</div><h3>The all-to-all</h3><svg viewBox="0 0 680 326" role="img"><title>The all-to-all</title><text class="hd" x="40" y="46">One token, one layer</text><g class="s"><rect x="40" y="70" width="100" height="40" rx="4"></rect><text class="sub" x="90.0" y="90.0" text-anchor="middle" dominant-baseline="central">arrives</text></g><line class="conn" x1="146" y1="90" x2="166" y2="90" marker-end="url(#arw)"></line><g class="s"><rect x="172" y="70" width="110" height="40" rx="4"></rect><text class="sub" x="227.0" y="90.0" text-anchor="middle" dominant-baseline="central">router picks 6</text></g><line class="conn" x1="288" y1="90" x2="308" y2="90" marker-end="url(#arw)"></line><g class="h"><rect x="314" y="70" width="150" height="40" rx="4"></rect><text class="sub" x="389.0" y="90.0" text-anchor="middle" dominant-baseline="central">ships to other GPUs</text></g><line class="conn" x1="470" y1="90" x2="490" y2="90" marker-end="url(#arw)"></line><g class="s"><rect x="496" y="70" width="144" height="40" rx="4"></rect><text class="sub" x="568.0" y="90.0" text-anchor="middle" dominant-baseline="central">results come back</text></g><text class="cap" x="40" y="148" text-anchor="start">Multiply that by every token in the batch, each with its own list of experts, and the picture</text><text class="cap" x="40" y="168" text-anchor="start">becomes every GPU sending to every other GPU at once.</text><g class="h"><rect x="140" y="200" width="400" height="42" rx="6"></rect><text class="sub" x="340.0" y="221.0" text-anchor="middle" dominant-baseline="central">two all-to-alls per MoE layer: dispatch, then combine</text></g><text class="cap" x="40" y="284" text-anchor="start">And because the router redraws the map for every batch, the traffic cannot be planned in</text><text class="cap" x="40" y="304" text-anchor="start">advance the way a fixed sharding can.</text></svg><figcaption>The most demanding collective pattern, fired twice per layer, with a destination map that changes every batch.</figcaption></figure>
