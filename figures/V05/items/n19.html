<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:43</div><h3>A pipeline handoff is sixteen kilobytes per token</h3><svg viewBox='0 0 680 406' role='img'><title>A pipeline handoff is sixteen kilobytes per token</title><text class="hd" x="40" y="40">Bytes one GPU sends per token in decode, on a log scale</text><line class="axis" x1="200.0" y1="58" x2="200.0" y2="140"/><text class="sub2" x="200.0" y="156" text-anchor="start">1 KB</text><line class="axis" x1="310.0" y1="58" x2="310.0" y2="140"/><text class="sub2" x="310.0" y="156" text-anchor="middle">10 KB</text><line class="axis" x1="420.0" y1="58" x2="420.0" y2="140"/><text class="sub2" x="420.0" y="156" text-anchor="middle">100 KB</text><line class="axis" x1="530.0" y1="58" x2="530.0" y2="140"/><text class="sub2" x="530.0" y="156" text-anchor="middle">1 MB</text><line class="axis" x1="640.0" y1="58" x2="640.0" y2="140"/><text class="sub2" x="640.0" y="156" text-anchor="end">10 MB</text><text class="cap" x="40" y="78" text-anchor="start">tensor, 8 GPUs</text><g class="h"><rect x="200" y="60" width="402.77357677017517" height="28" rx="3"/><text class="sub" x="401.3867883850876" y="74.0" text-anchor="middle" dominant-baseline="central">4,587,520 bytes</text></g><text class="cap" x="40" y="120" text-anchor="start">pipeline, 4 stages</text><g class="s"><rect x="200" y="102" width="133.58619332253102" height="28" rx="3"/><text class="sub" x="266.7930966612655" y="116.0" text-anchor="middle" dominant-baseline="central">16,384 bytes</text></g><text class="sub2 halo" x="343.586193322531" y="120" text-anchor="start">280 times less, sent once</text><text class="cap" x="40" y="200" text-anchor="start">What crosses a stage boundary is the residual stream: one vector of 8,192 numbers per</text><text class="cap" x="40" y="220" text-anchor="start">token ({{fig:v01-o099}}), 16 KB at 2 bytes each. That is the whole of a pipeline stage's</text><text class="cap" x="40" y="240" text-anchor="start">conversation.</text><text class="cap" x="40" y="280" text-anchor="start">A tensor-parallel GPU sends 4,587,520 bytes per token ({{fig:v05-n16}}); a pipeline stage</text><text class="cap" x="40" y="300" text-anchor="start">sends 16,384, 280 times less, in one message instead of 160. Each stage holds a quarter</text><text class="cap" x="40" y="320" text-anchor="start">of the layers, 140 ÷ 4 = 35 GB of weights.</text><text class="cap" x="40" y="360" text-anchor="start">Over the 50 GB/s network, 16 KB takes 0.33 µs to transmit. Traffic that thin can afford</text><text class="cap" x="40" y="380" text-anchor="start">the slow boundary between boxes.</text></svg><figcaption>Log scale; on a linear one the pipeline's bar would be 1/280 of the tensor bar, a sliver. This ratio, more than anything, is why the two strategies live on different hardware.</figcaption></figure>
