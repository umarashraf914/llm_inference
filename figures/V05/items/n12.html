"u"><rect x="220" y="116" width="40" height="26" rx="3"/><text class="sub" x="240.0" y="129.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="266" y="116" width="40" height="26" rx="3"/><text class="sub" x="286.0" y="129.0" text-anchor="middle" dominant-baseline="central">2</text></g><line class="tick" x1="220" y1="148" x2="306" y2="148"/><g class="m"><rect x="220" y="154" width="40" height="26" rx="3"/><text class="sub" x="240.0" y="167.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="266" y="154" width="40" height="26" rx="3"/><text class="sub" x="286.0" y="167.0" text-anchor="middle" dominant-baseline="central">2</text></g><text class="sub2" x="210" y="172" text-anchor="end">partial</text><text class="sub2" x="360" y="70" text-anchor="start">GPU 2 holds h₃, h₄ and B's rows 3–4</text><g class="u"><rect x="360" y="82" width="40" height="26" rx="3"/><text class="sub" x="380.0" y="95.0" text-anchor="middle" dominant-baseline="central">4</text></g><text class="sub2" x="412" y="100" text-anchor="middle">×</text><g class="u"><rect x="424" y="82" width="40" height="26" rx="3"/><text class="sub" x="444.0" y="95.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="470" y="82" width="40" height="26" rx="3"/><text class="sub" x="490.0" y="95.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="528" y="100" text-anchor="middle">=</text><g class="u"><rect x="540" y="82" width="40" height="26" rx="3"/><text class="sub" x="560.0" y="95.0" text-anchor="middle" dominant-baseline="central">4</text></g><g class="u"><rect x="586" y="82" width="40" height="26" rx="3"/><text class="sub" x="606.0" y="95.0" text-anchor="middle" dominant-baseline="central">4</text></g><g class="u"><rect x="360" y="116" width="40" height="26" rx="3"/><text class="sub" x="380.0" y="129.0" text-anchor="middle" dominant-baseline="central">7</text></g><text class="sub2" x="412" y="134" text-anchor="middle">×</text><g class="u"><rect x="424" y="116" width="40" height="26" rx="3"/><text class="sub" x="444.0" y="129.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="u"><rect x="470" y="116" width="40" height="26" rx="3"/><text class="sub" x="490.0" y="129.0" text-anchor="middle" dominant-baseline="central">−1</text></g><text class="sub2" x="528" y="134" text-anchor="middle">=</text><g class="u"><rect x="540" y="116" width="40" height="26" rx="3"/><text class="sub" x="560.0" y="129.0" text-anchor="middle" dominant-baseline="central">14</text></g><g class="u"><rect x="586" y="116" width="40" height="26" rx="3"/><text class="sub" x="606.0" y="129.0" text-anchor="middle" dominant-baseline="central">−7</text></g><line class="tick" x1="540" y1="148" x2="626" y2="148"/><g class="m"><rect x="540" y="154" width="40" height="26" rx="3"/><text class="sub" x="560.0" y="167.0" text-anchor="middle" dominant-baseline="central">18</text></g><g class="m"><rect x="586" y="154" width="40" height="26" rx="3"/><text class="sub" x="606.0" y="167.0" text-anchor="middle" dominant-baseline="central">−3</text></g><text class="sub2" x="530" y="172" text-anchor="end">partial</text><line class="conn" x1="260" y1="184" x2="260" y2="204" marker-end="url(#arw)"/><line class="conn" x1="580" y1="184" x2="580" y2="204" marker-end="url(#arw)"/><g class="h"><rect x="40" y="208" width="600" height="30" rx="3"/><text class="sub" x="340.0" y="223.0" text-anchor="middle" dominant-baseline="central">all-reduce: [1 2] + [18 −3] = [19 −1]</text></g><line class="conn" x1="260" y1="242" x2="260" y2="262" marker-end="url(#arw)"/><line class="conn" x1="580" y1="242" x2="580" y2="262" marker-end="url(#arw)"/><g class="s"><rect x="220" y="266" width="40" height="26" rx="3"/><text class="sub" x="240.0" y="279.0" text-anchor="middle" dominant-baseline="central">19</text></g><g class="s"><rect x="266" y="266" width="40" height="26" rx="3"/><text class="sub" x="286.0" y="279.0" text-anchor="middle" dominant-baseline="central">−1</text></g><text class="sub2" x="210" y="284" text-anchor="end">the true hB</text><g class="s"><rect x="540" y="266" width="40" height="26" rx="3"/><text class="sub" x="560.0" y="279.0" text-anchor="middle" dominant-baseline="central">19</text></g><g class="s"><rect x="586" y="266" width="40" height="26" rx="3"/><text class="sub" x="606.0" y="279.0" text-anchor="middle" dominant-baseline="central">−1</text></g><text class="sub2" x="530" y="284" text-anchor="end">the true hB</text><text class="cap" x="40" y="334" text-anchor="start">Now B, the matrix after the bend. GPU 1 holds h's first two numbers and GPU 2 the last</text><text class="cap" x="40" y="354" text-anchor="start">two, exactly what the column split left on each. So B is split by rows to match: GPU 1</text><text class="cap" x="40" y="374" text-anchor="start">takes rows 1 and 2, the rows its own numbers multiply.</text><text class="cap" x="40" y="414" text-anchor="start">Each GPU's result has the right shape, two numbers, but only part of the value: GPU 1</text><text class="cap" x="40" y="434" text-anchor="start">has [1 2], GPU 2 has [18 −3]. The true h × B is their sum, [19 −1], and one all-reduce</text><text class="cap" x="40" y="454" text-anchor="start">adds them on every GPU. A product split into blocks is a sum of block products</text><text class="cap" x="40" y="474" text-anchor="start">({{fig:v03-o035}}); the all-reduce is that sum.</text><text class="cap" x="40" y="514" text-anchor="start">The bend between A and B changes the numbers but not who holds them, so it is left out</text><text class="cap" x="40" y="534" text-anchor="start">of this arithmetic.</text></svg><figcaption>One exchange, and it comes at the end: every partial is complete in shape and incomplete in value until the others are added.</figcaption></figure>
