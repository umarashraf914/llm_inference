<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 9:18</div><h3>The feed-forward block is over four fifths of a layer</h3><svg viewBox='0 0 680 340' role='img'><title>The feed-forward block is over four fifths of a layer</title><text class="hd" x="40" y="40">Weights in one layer of the 70B</text><text class="cap" x="40" y="78" text-anchor="start">attention</text><g class="u"><rect x="170" y="60" width="94.28571428571429" height="28" rx="3"/></g><text class="sub2" x="274.2857142857143" y="78" text-anchor="start">151.0 million</text><text class="cap" x="40" y="122" text-anchor="start">feed-forward</text><g class="m"><rect x="170" y="104" width="440.0" height="28" rx="3"/><text class="sub" x="390.0" y="118.0" text-anchor="middle" dominant-baseline="central">704.6 million, 82% of the layer</text></g><text class="cap" x="40" y="174" text-anchor="start">Count one layer of the 70B. Attention's four matrices hold 151.0 million weights: W_Q</text><text class="cap" x="40" y="194" text-anchor="start">and W_O are 8,192 × 8,192 each, W_K and W_V only 8,192 × 1,024, since just 8 heads keep</text><text class="cap" x="40" y="214" text-anchor="start">keys and values. The feed-forward block's three hold 704.6 million, 82% of the layer</text><text class="cap" x="40" y="234" text-anchor="start">({{fig:v01-o101}}).</text><text class="cap" x="40" y="274" text-anchor="start">A mixture-of-experts layer takes exactly this block, the biggest block of weights in the</text><text class="cap" x="40" y="294" text-anchor="start">model, and breaks it into many smaller independent ones called experts. Each token uses</text><text class="cap" x="40" y="314" text-anchor="start">only a few of them.</text></svg><figcaption>Bars to scale. Sparsity goes where the weights are; attention is left exactly as it was ({{ref:v06-o012}}).</figcaption></figure>
