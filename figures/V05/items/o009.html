<figure><div class='ts'>Fig 09 &nbsp;&middot;&nbsp; 4:33</div><h3>How the split works</h3><svg viewBox="0 0 680 366" role="img"><title>How the split works</title><text class="hd" x="40" y="46">A feed-forward block, split across GPUs</text><g class="u"><rect x="40" y="70" width="120" height="44" rx="4"></rect><text class="sub" x="100.0" y="92.0" text-anchor="middle" dominant-baseline="central">input</text></g><line class="conn" x1="166" y1="92" x2="190" y2="92" marker-end="url(#arw)"></line><g class="m"><rect x="196" y="70" width="150" height="44" rx="4"></rect><text class="sub" x="271.0" y="92.0" text-anchor="middle" dominant-baseline="central">matrix A, by columns</text></g><line class="conn" x1="352" y1="92" x2="376" y2="92" marker-end="url(#arw)"></line><g class="u"><rect x="382" y="70" width="100" height="44" rx="4"></rect><text class="sub" x="432.0" y="92.0" text-anchor="middle" dominant-baseline="central">GELU</text></g><line class="conn" x1="488" y1="92" x2="512" y2="92" marker-end="url(#arw)"></line><g class="m"><rect x="518" y="70" width="122" height="44" rx="4"></rect><text class="sub" x="579.0" y="92.0" text-anchor="middle" dominant-baseline="central">matrix B, by rows</text></g><text class="sub2" x="196" y="142" text-anchor="start">GELU touches each number independently, so no communication is needed here</text><text class="cap" x="40" y="192" text-anchor="start">Splitting A by columns lets every GPU compute its slice alone. Splitting B by rows to match</text><text class="cap" x="40" y="212" text-anchor="start">leaves each GPU holding an output of the right shape but only part of the value.</text><g class="s"><rect x="190" y="244" width="300" height="42" rx="6"></rect><text class="sub" x="340.0" y="265.0" text-anchor="middle" dominant-baseline="central">one all-reduce sums the partials</text></g><text class="cap" x="40" y="324" text-anchor="start">Attention divides even more naturally, because its heads are already independent. Each GPU runs</text><text class="cap" x="40" y="344" text-anchor="start">a share of the heads, and one more all-reduce recombines them.</text></svg><figcaption>The column-then-row pairing is the trick. It is arranged so that exactly one synchronisation is needed per block rather than one per matrix.</figcaption></figure>
