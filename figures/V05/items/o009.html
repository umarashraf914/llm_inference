<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:20</div><h3>Columns, bend, rows: one all-reduce per block</h3><svg viewBox='0 0 680 412' role='img'><title>Columns, bend, rows: one all-reduce per block</title><text class="hd" x="40" y="40">One feed-forward block on two GPUs</text><text class="cap" x="40" y="85" text-anchor="start">GPU 1</text><g class="u"><rect x="100" y="62" width="64" height="36" rx="3"/><text class="sub" x="132.0" y="80.0" text-anchor="middle" dominant-baseline="central">x, whole</text></g><line class="conn" x1="166" y1="80" x2="176" y2="80" marker-end="url(#arw)"/><g class="m"><rect x="178" y="62" width="84" height="36" rx="3"/><text class="sub" x="220.0" y="80.0" text-anchor="middle" dominant-baseline="central">× A columns</text></g><line class="conn" x1="264" y1="80" x2="274" y2="80" marker-end="url(#arw)"/><g class="m"><rect x="276" y="62" width="52" height="36" rx="3"/><text class="sub" x="302.0" y="80.0" text-anchor="middle" dominant-baseline="central">GELU</text></g><line class="conn" x1="330" y1="80" x2="340" y2="80" marker-end="url(#arw)"/><g class="m"><rect x="342" y="62" width="70" height="36" rx="3"/><text class="sub" x="377.0" y="80.0" text-anchor="middle" dominant-baseline="central">× B rows</text></g><line class="conn" x1="414" y1="80" x2="424" y2="80" marker-end="url(#arw)"/><g class="m"><rect x="426" y="62" width="60" height="36" rx="3"/><text class="sub" x="456.0" y="80.0" text-anchor="middle" dominant-baseline="central">partial</text></g><g class="s"><rect x="540" y="62" width="100" height="36" rx="3"/><text class="sub" x="590.0" y="80.0" text-anchor="middle" dominant-baseline="central">true output</text></g><text class="cap" x="40" y="189" text-anchor="start">GPU 2</text><g class="u"><rect x="100" y="166" width="64" height="36" rx="3"/><text class="sub" x="132.0" y="184.0" text-anchor="middle" dominant-baseline="central">x, whole</text></g><line class="conn" x1="166" y1="184" x2="176" y2="184" marker-end="url(#arw)"/><g class="m"><rect x="178" y="166" width="84" height="36" rx="3"/><text class="sub" x="220.0" y="184.0" text-anchor="middle" dominant-baseline="central">× A columns</text></g><line class="conn" x1="264" y1="184" x2="274" y2="184" marker-end="url(#arw)"/><g class="m"><rect x="276" y="166" width="52" height="36" rx="3"/><text class="sub" x="302.0" y="184.0" text-anchor="middle" dominant-baseline="central">GELU</text></g><line class="conn" x1="330" y1="184" x2="340" y2="184" marker-end="url(#arw)"/><g class="m"><rect x="342" y="166" width="70" height="36" rx="3"/><text class="sub" x="377.0" y="184.0" text-anchor="middle" dominant-baseline="central">× B rows</text></g><line class="conn" x1="414" y1="184" x2="424" y2="184" marker-end="url(#arw)"/><g class="m"><rect x="426" y="166" width="60" height="36" rx="3"/><text class="sub" x="456.0" y="184.0" text-anchor="middle" dominant-baseline="central">partial</text></g><g class="s"><rect x="540" y="166" width="100" height="36" rx="3"/><text class="sub" x="590.0" y="184.0" text-anchor="middle" dominant-baseline="central">true output</text></g><g class="h"><rect x="426" y="114" width="214" height="36" rx="3"/><text class="sub" x="533.0" y="132.0" text-anchor="middle" dominant-baseline="central">all-reduce: partials added</text></g><line class="conn" x1="456" y1="100" x2="456" y2="112" marker-end="url(#arw)"/><line class="conn" x1="456" y1="164" x2="456" y2="152" marker-end="url(#arw)"/><line class="conn" x1="590" y1="114" x2="590" y2="100" marker-end="url(#arw)"/><line class="conn" x1="590" y1="150" x2="590" y2="164" marker-end="url(#arw)"/><text class="cap" x="40" y="246" text-anchor="start">Put the pieces together and one feed-forward block costs one exchange. Each GPU starts</text><text class="cap" x="40" y="266" text-anchor="start">with the whole input, multiplies it by its own columns of A, bends its own numbers,</text><text class="cap" x="40" y="286" text-anchor="start">multiplies them by its own rows of B, and holds a partial output: the right shape, but</text><text class="cap" x="40" y="306" text-anchor="start">only part of the value.</text><text class="cap" x="40" y="346" text-anchor="start">One all-reduce sums the partials into the true result on every GPU, ready for the next</text><text class="cap" x="40" y="366" text-anchor="start">layer. Each GPU stores half of A and half of B here; across eight GPUs, an eighth of</text><text class="cap" x="40" y="386" text-anchor="start">each.</text></svg><figcaption>The column-then-row pairing is the trick. It is arranged so that exactly one synchronisation is needed per block rather than one per matrix.</figcaption></figure>
