<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:49</div><h3>The obvious ways to sum across GPUs grow with the group</h3><svg viewBox='0 0 680 626' role='img'><title>The obvious ways to sum across GPUs grow with the group</title><text class="hd" x="40" y="40">Three obvious plans, drawn for four GPUs</text><text class="sub2" x="40" y="66" text-anchor="start">a. everyone to everyone</text><text class="sub2" x="253" y="66" text-anchor="start">b. one collector</text><text class="sub2" x="466" y="66" text-anchor="start">c. whole vectors round a ring</text><g class="u"><rect x="60" y="80" width="34" height="22" rx="3"/><text class="sub" x="77.0" y="91.0" text-anchor="middle" dominant-baseline="central">G1</text></g><g class="u"><rect x="170" y="80" width="34" height="22" rx="3"/><text class="sub" x="187.0" y="91.0" text-anchor="middle" dominant-baseline="central">G2</text></g><g class="u"><rect x="170" y="150" width="34" height="22" rx="3"/><text class="sub" x="187.0" y="161.0" text-anchor="middle" dominant-baseline="central">G3</text></g><g class="u"><rect x="60" y="150" width="34" height="22" rx="3"/><text class="sub" x="77.0" y="161.0" text-anchor="middle" dominant-baseline="central">G4</text></g><line class="conn" x1="98.0" y1="91.0" x2="166.0" y2="91.0" marker-start="url(#arw)" marker-end="url(#arw)"/><line class="conn" x1="187.0" y1="106.0" x2="187.0" y2="146.0" marker-start="url(#arw)" marker-end="url(#arw)"/><line class="conn" x1="166.0" y1="161.0" x2="98.0" y2="161.0" marker-start="url(#arw)" marker-end="url(#arw)"/><line class="conn" x1="77.0" y1="146.0" x2="77.0" y2="106.0" marker-start="url(#arw)" marker-end="url(#arw)"/><line class="conn" x1="98.0" y1="104.4" x2="166.0" y2="147.6" marker-start="url(#arw)" marker-end="url(#arw)"/><line class="conn" x1="166.0" y1="104.4" x2="98.0" y2="147.6" marker-start="url(#arw)" marker-end="url(#arw)"/><g class="u"><rect x="325" y="115" width="34" height="22" rx="3"/><text class="sub" x="342.0" y="126.0" text-anchor="middle" dominant-baseline="central">G1</text></g><g class="u"><rect x="255" y="80" width="34" height="22" rx="3"/><text class="sub" x="272.0" y="91.0" text-anchor="middle" dominant-baseline="central">G2</text></g><g class="u"><rect x="395" y="80" width="34" height="22" rx="3"/><text class="sub" x="412.0" y="91.0" text-anchor="middle" dominant-baseline="central">G3</text></g><g class="u"><rect x="325" y="160" width="34" height="22" rx="3"/><text class="sub" x="342.0" y="171.0" text-anchor="middle" dominant-baseline="central">G4</text></g><line class="conn" x1="291" y1="102" x2="323" y2="119" marker-start="url(#arw)" marker-end="url(#arw)"/><line class="conn" x1="393" y1="102" x2="361" y2="119" marker-start="url(#arw)" marker-end="url(#arw)"/><line class="conn" x1="342.0" y1="141" x2="342.0" y2="156" marker-start="url(#arw)" marker-end="url(#arw)"/><g class="u"><rect x="486" y="80" width="34" height="22" rx="3"/><text class="sub" x="503.0" y="91.0" text-anchor="middle" dominant-baseline="central">G1</text></g><g class="u"><rect x="596" y="80" width="34" height="22" rx="3"/><text class="sub" x="613.0" y="91.0" text-anchor="middle" dominant-baseline="central">G2</text></g><g class="u"><rect x="596" y="150" width="34" height="22" rx="3"/><text class="sub" x="613.0" y="161.0" text-anchor="middle" dominant-baseline="central">G3</text></g><g class="u"><rect x="486" y="150" width="34" height="22" rx="3"/><text class="sub" x="503.0" y="161.0" text-anchor="middle" dominant-baseline="central">G4</text></g><line class="conn" x1="524" y1="91" x2="592" y2="91" marker-end="url(#arw)"/><line class="conn" x1="613" y1="106" x2="613" y2="146" marker-end="url(#arw)"/><line class="conn" x1="592" y1="161" x2="524" y2="161" marker-end="url(#arw)"/><line class="conn" x1="503" y1="146" x2="503" y2="106" marker-end="url(#arw)"/><text class="hd" x="40" y="222">What the busiest GPU sends, for eight GPUs and a message of S bytes</text><text class="cap" x="40" y="256" text-anchor="start">a. everyone to everyone</text><g class="h"><rect x="230" y="238" width="182" height="26" rx="3"/></g><text class="sub2" x="422" y="256" text-anchor="start">7 S</text><text class="cap" x="40" y="296" text-anchor="start">b. one collector</text><g class="h"><rect x="230" y="278" width="364" height="26" rx="3"/></g><text class="sub2" x="604" y="296" text-anchor="start">14 S</text><text class="cap" x="40" y="336" text-anchor="start">c. whole vectors round a ring</text><g class="h"><rect x="230" y="318" width="182" height="26" rx="3"/></g><text class="sub2" x="422" y="336" text-anchor="start">7 S</text><text class="cap" x="40" y="376" text-anchor="start">the ring all-reduce</text><g class="s"><rect x="230" y="358" width="45.5" height="26" rx="3"/></g><text class="sub2" x="285.5" y="376" text-anchor="start">1.75 S</text><text class="cap" x="40" y="420" text-anchor="start">Tensor parallelism fires an all-reduce twice in every layer, and training-time data</text><text class="cap" x="40" y="440" text-anchor="start">parallelism syncs its gradients with one. Both are affordable for the same reason. Every</text><text class="cap" x="40" y="460" text-anchor="start">GPU holds a vector of S bytes and every GPU needs the sum, and the obvious plans all get</text><text class="cap" x="40" y="480" text-anchor="start">worse as the group grows.</text><text class="cap" x="40" y="520" text-anchor="start">Everyone sending its whole vector to everyone costs each GPU 7 S among eight; one</text><text class="cap" x="40" y="540" text-anchor="start">collector that adds and sends back carries 14 S on its own link while the other links</text><text class="cap" x="40" y="560" text-anchor="start">idle; passing whole vectors round a ring costs 7 S per GPU. At 16,000 GPUs the first</text><text class="cap" x="40" y="580" text-anchor="start">would send 15,999 S from each. You would expect each GPU's cost to grow as the ring gets</text><text class="cap" x="40" y="600" text-anchor="start">bigger. The ring all-reduce's does not.</text></svg><figcaption>Bars to scale, for eight GPUs. A central collector also leaves every other wire idle while its own carries fourteen messages' worth.</figcaption></figure>
