<figure><div class='ts'>Fig 21 &nbsp;&middot;&nbsp; 13:40</div><h3>What a ring exchange does</h3><svg viewBox="0 0 680 458" role="img"><title>What a ring exchange does</title><text class="hd" x="40" y="46">Each GPU starts with a partial answer</text><g class="m"><rect x="70" y="66" width="120" height="34" rx="3"></rect><text class="sub" x="130.0" y="83.0" text-anchor="middle" dominant-baseline="central">part 1</text></g><g class="m"><rect x="220" y="66" width="120" height="34" rx="3"></rect><text class="sub" x="280.0" y="83.0" text-anchor="middle" dominant-baseline="central">part 2</text></g><g class="m"><rect x="370" y="66" width="120" height="34" rx="3"></rect><text class="sub" x="430.0" y="83.0" text-anchor="middle" dominant-baseline="central">part 3</text></g><g class="m"><rect x="520" y="66" width="120" height="34" rx="3"></rect><text class="sub" x="580.0" y="83.0" text-anchor="middle" dominant-baseline="central">part 4</text></g><text class="hd" x="40" y="140">A ring: each passes to its neighbour, round and round</text><g class="s"><rect x="288.0" y="161.0" width="104" height="38" rx="4"></rect><text class="sub" x="340.0" y="180.0" text-anchor="middle" dominant-baseline="central">GPU 1</text></g><g class="s"><rect x="438.0" y="231.0" width="104" height="38" rx="4"></rect><text class="sub" x="490.0" y="250.0" text-anchor="middle" dominant-baseline="central">GPU 2</text></g><g class="s"><rect x="288.0" y="301.0" width="104" height="38" rx="4"></rect><text class="sub" x="340.0" y="320.0" text-anchor="middle" dominant-baseline="central">GPU 3</text></g><g class="s"><rect x="138.0" y="231.0" width="104" height="38" rx="4"></rect><text class="sub" x="190.0" y="250.0" text-anchor="middle" dominant-baseline="central">GPU 4</text></g><line class="conn" x1="401.16406795893556" y1="186.0837741781384" x2="476.96334104684627" y2="221.4567682858301" marker-end="url(#arw)"></line><line class="conn" x1="476.96334104684627" y1="278.5432317141699" x2="401.16406795893556" y2="313.9162258218616" marker-end="url(#arw)"></line><line class="conn" x1="278.8359320410645" y1="313.9162258218616" x2="203.03665895315376" y2="278.5432317141699" marker-end="url(#arw)"></line><line class="conn" x1="203.03665895315373" y1="221.4567682858301" x2="278.83593204106444" y2="186.0837741781384" marker-end="url(#arw)"></line><text class="cap" x="40" y="380" text-anchor="start">After one full lap every GPU has seen every other GPU's contribution, and each has added them</text><text class="cap" x="40" y="400" text-anchor="start">up. Nobody ever holds more than one extra piece at a time.</text><text class="cap" x="40" y="436" text-anchor="start">This pattern is called an all-reduce: everybody contributes, everybody ends up with the total.</text></svg><figcaption>A ring is chosen because every link carries traffic at once. A central collector would leave every other wire idle.</figcaption></figure>
