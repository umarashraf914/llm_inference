<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:23</div><h3>The 70B's three-matrix block splits the same way</h3><svg viewBox='0 0 680 534' role='img'><title>The 70B's three-matrix block splits the same way</title><g class="u"><rect x="40" y="40" width="600" height="172" rx="14"/><text class="lbl" x="62" y="66">GPU 1 of 8: its eighth of one layer's feed-forward block</text></g><g class="m"><rect x="62" y="82" width="170" height="34" rx="3"/><text class="sub" x="147.0" y="99.0" text-anchor="middle" dominant-baseline="central">gate: 8,192 × 3,584</text></g><g class="m"><rect x="62" y="138" width="170" height="34" rx="3"/><text class="sub" x="147.0" y="155.0" text-anchor="middle" dominant-baseline="central">up: 8,192 × 3,584</text></g><line class="conn" x1="236" y1="99" x2="262" y2="119" marker-end="url(#arw)"/><line class="conn" x1="236" y1="155" x2="262" y2="135" marker-end="url(#arw)"/><g class="m"><rect x="266" y="104" width="178" height="46" rx="4"/><text class="sub" x="355.0" y="119.0" text-anchor="middle" dominant-baseline="central">SiLU(gate) × up,</text><text class="sub" x="355.0" y="135.0" text-anchor="middle" dominant-baseline="central">3,584 numbers, local</text></g><line class="conn" x1="448" y1="127" x2="464" y2="127" marker-end="url(#arw)"/><g class="m"><rect x="468" y="110" width="150" height="34" rx="3"/><text class="sub" x="543.0" y="127.0" text-anchor="middle" dominant-baseline="central">down: 3,584 × 8,192</text></g><g class="m"><rect x="40" y="236" width="190" height="30" rx="3"/><text class="sub" x="135.0" y="251.0" text-anchor="middle" dominant-baseline="central">partial: 8,192 numbers</text></g><line class="conn" x1="234" y1="251" x2="252" y2="251" marker-end="url(#arw)"/><g class="h"><rect x="256" y="236" width="150" height="30" rx="3"/><text class="sub" x="331.0" y="251.0" text-anchor="middle" dominant-baseline="central">one all-reduce</text></g><line class="conn" x1="410" y1="251" x2="428" y2="251" marker-end="url(#arw)"/><g class="s"><rect x="432" y="236" width="208" height="30" rx="3"/><text class="sub" x="536.0" y="251.0" text-anchor="middle" dominant-baseline="central">the layer's output, on all 8</text></g><text class="cap" x="40" y="308" text-anchor="start">The 70B counts three feed-forward matrices per layer ({{fig:v01-o100}}): gate and up, each</text><text class="cap" x="40" y="328" text-anchor="start">8,192 × 28,672, and down, 28,672 × 8,192. Gate and up play A's part and are split by</text><text class="cap" x="40" y="348" text-anchor="start">columns: 28,672 ÷ 8 = 3,584 columns of each per GPU.</text><text class="cap" x="40" y="388" text-anchor="start">The bend is SiLU, x ÷ (1 + e^−x), applied to the gate's output and then multiplied,</text><text class="cap" x="40" y="408" text-anchor="start">number by number, by the up matrix's output. Both act on the same positions, which the</text><text class="cap" x="40" y="428" text-anchor="start">column split keeps on the same GPU, so this step is local.</text><text class="cap" x="40" y="468" text-anchor="start">Down plays B's part, split by rows, leaving partial outputs and one all-reduce. Each GPU</text><text class="cap" x="40" y="488" text-anchor="start">stores 3 × 8,192 × 3,584 = 88.1 million weights per layer, 176 MB at two bytes: an</text><text class="cap" x="40" y="508" text-anchor="start">eighth of 704.6 million.</text></svg><figcaption>V1's three feed-forward matrices and the A and B used here are the same block. The gate adds a matrix, not an exchange.</figcaption></figure>
