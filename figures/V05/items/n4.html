" text-anchor="middle" dominant-baseline="central">4444</text></g><text class="sub2" x="40" y="101" text-anchor="start">G1</text><text class="sub2" x="40" y="132" text-anchor="start">G2</text><text class="sub2" x="40" y="163" text-anchor="start">G3</text><text class="sub2" x="40" y="194" text-anchor="start">G4</text><line class="conn" x1="235" y1="140" x2="250" y2="140" marker-end="url(#arw)"/><line class="conn" x1="429" y1="140" x2="444" y2="140" marker-end="url(#arw)"/><text class="sub2" x="256" y="228" text-anchor="start">G1 finishes slice 1, G2 slice 2</text><text class="sub2" x="450" y="228" text-anchor="start">every slice copied everywhere</text><text class="cap" x="40" y="270" text-anchor="start">A reduce-scatter does the adding but leaves each GPU only one slice of the total: G1</text><text class="cap" x="40" y="290" text-anchor="start">ends with 1,111 in slice 1 and nothing else, G2 with 2,222 in slice 2, and so on. Each</text><text class="cap" x="40" y="310" text-anchor="start">grid shows the result a GPU holds.</text><text class="cap" x="40" y="350" text-anchor="start">An all-gather does no arithmetic. It takes one slice from each GPU and copies every</text><text class="cap" x="40" y="370" text-anchor="start">slice to every GPU. Run one after the other, the two produce exactly an all-reduce, and</text><text class="cap" x="40" y="390" text-anchor="start">that is how the fastest all-reduce is built ({{fig:v05-n37}}).</text></svg><figcaption>Each half is useful on its own, and the pair is an all-reduce. Part 8's ring runs them in exactly this order.</figcaption></figure>
