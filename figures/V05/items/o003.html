<figure><div class='ts'>Fig 03 &nbsp;&middot;&nbsp; 0:24</div><h3>What splitting a model means</h3><svg viewBox="0 0 680 358" role="img"><title>What splitting a model means</title><text class="hd" x="40" y="46">Splitting a model means giving each GPU part of the numbers</text><g class="h"><rect x="40" y="70" width="600" height="34" rx="4"></rect><text class="sub" x="340.0" y="87.0" text-anchor="middle" dominant-baseline="central">the whole model: 1.6 terabytes of weights</text></g><line class="conn" x1="340" y1="112" x2="340" y2="138" marker-end="url(#arw)"></line><g class="s"><rect x="60" y="142" width="132" height="40" rx="4"></rect><text class="sub" x="126.0" y="162.0" text-anchor="middle" dominant-baseline="central">GPU 1</text></g><g class="s"><rect x="208" y="142" width="132" height="40" rx="4"></rect><text class="sub" x="274.0" y="162.0" text-anchor="middle" dominant-baseline="central">GPU 2</text></g><g class="s"><rect x="356" y="142" width="132" height="40" rx="4"></rect><text class="sub" x="422.0" y="162.0" text-anchor="middle" dominant-baseline="central">GPU 3</text></g><g class="s"><rect x="504" y="142" width="132" height="40" rx="4"></rect><text class="sub" x="570.0" y="162.0" text-anchor="middle" dominant-baseline="central">GPU 4</text></g><text class="sub2" x="60" y="210" text-anchor="start">each holds a quarter, and none of them can finish alone</text><text class="cap" x="40" y="260" text-anchor="start">Nobody has the whole model any more. To produce one token they have to hand results to each</text><text class="cap" x="40" y="280" text-anchor="start">other partway through, which means waiting for a message to arrive.</text><text class="cap" x="40" y="316" text-anchor="start">That waiting is the cost of splitting, and the five strategies in this video differ almost</text><text class="cap" x="40" y="336" text-anchor="start">entirely in how much of it they incur.</text></svg><figcaption>The moment a model stops fitting on one chip, computation becomes
