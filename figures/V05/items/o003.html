<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:34</div><h3>Four ways to cut a model, and one way to copy it</h3><svg viewBox='0 0 680 558' role='img'><title>Four ways to cut a model, and one way to copy it</title><text class="hd" x="40" y="40">Each dashed line is a cut, and every cut is a place GPUs must talk</text><text class="cap" x="40" y="74" text-anchor="start">by layers: pipeline</text><text class="cap" x="253" y="74" text-anchor="start">inside every matrix: tensor</text><text class="cap" x="466" y="74" text-anchor="start">between experts: expert</text><text class="cap" x="40" y="234" text-anchor="start">along the tokens: sequence</text><text class="cap" x="253" y="234" text-anchor="start">whole copies: data</text><g class="u"><rect x="52" y="88" width="150" height="18" rx="3"/><text class="sub" x="127.0" y="97.0" text-anchor="middle" dominant-baseline="central">G1 · layers 1–20</text></g><g class="u"><rect x="52" y="112" width="150" height="18" rx="3"/><text class="sub" x="127.0" y="121.0" text-anchor="middle" dominant-baseline="central">G1 · layers 21–40</text></g><g class="u"><rect x="52" y="136" width="150" height="18" rx="3"/><text class="sub" x="127.0" y="145.0" text-anchor="middle" dominant-baseline="central">G2 · layers 41–60</text></g><g class="u"><rect x="52" y="160" width="150" height="18" rx="3"/><text class="sub" x="127.0" y="169.0" text-anchor="middle" dominant-baseline="central">G2 · layers 61–80</text></g><line class="mark" x1="40" y1="133" x2="214" y2="133"/><g class="u"><rect x="265" y="88" width="71.0" height="18" rx="3"/><text class="sub" x="300.5" y="97.0" text-anchor="middle" dominant-baseline="central">G1</text></g><g class="u"><rect x="344.0" y="88" width="71.0" height="18" rx="3"/><text class="sub" x="379.5" y="97.0" text-anchor="middle" dominant-baseline="central">G2</text></g><g class="u"><rect x="265" y="112" width="71.0" height="18" rx="3"/><text class="sub" x="300.5" y="121.0" text-anchor="middle" dominant-baseline="central">G1</text></g><g class="u"><rect x="344.0" y="112" width="71.0" height="18" rx="3"/><text class="sub" x="379.5" y="121.0" text-anchor="middle" dominant-baseline="central">G2</text></g><g class="u"><rect x="265" y="136" width="71.0" height="18" rx="3"/><text class="sub" x="300.5" y="145.0" text-anchor="middle" dominant-baseline="central">G1</text></g><g class="u"><rect x="344.0" y="136" width="71.0" height="18" rx="3"/><text class="sub" x="379.5" y="145.0" text-anchor="middle" dominant-baseline="central">G2</text></g><g class="u"><rect x="265" y="160" width="71.0" height="18" rx="3"/><text class="sub" x="300.5" y="169.0" text-anchor="middle" dominant-baseline="central">G1</text></g><g class="u"><rect x="344.0" y="160" width="71.0" height="18" rx="3"/><text class="sub" x="379.5" y="169.0" text-anchor="middle" dominant-baseline="central">G2</text></g><line class="mark" x1="340.0" y1="82" x2="340.0" y2="184"/><g class="u"><rect x="478" y="88" width="150" height="18" rx="3"/><text class="sub" x="553.0" y="97.0" text-anchor="middle" dominant-baseline="central">attention, on both</text></g><g class="m"><rect x="478" y="118" width="15" height="28" rx="3"/></g><g class="m"><rect x="496" y="118" width="15" height="28" rx="3"/></g><g class="m"><rect x="514" y="118" width="15" height="28" rx="3"/></g><g class="m"><rect x="532" y="118" width="15" height="28" rx="3"/></g><g class="m"><rect x="559" y="118" width="15" height="28" rx="3"/></g><g class="m"><rect x="577" y="118" width="15" height="28" rx="3"/></g><g class="m"><rect x="595" y="118" width="15" height="28" rx="3"/></g><g class="m"><rect x="613" y="118" width="15" height="28" rx="3"/></g><line class="mark" x1="553.0" y1="112" x2="553.0" y2="152"/><text class="sub2" x="478" y="168" text-anchor="start">experts 1–4 on G1, 5–8 on G2</text><g class="u"><rect x="52" y="248" width="150" height="18" rx="3"/><text class="sub" x="127.0" y="257.0" text-anchor="middle" dominant-baseline="central">the model, on both</text></g><g class="s"><rect x="52" y="278" width="15" height="28" rx="3"/></g><g class="s"><rect x="70" y="278" width="15" height="28" rx="3"/></g><g class="s"><rect x="88" y="278" width="15" height="28" rx="3"/></g><g class="s"><rect x="106" y="278" width="15" height="28" rx="3"/></g><g class="s"><rect x="133" y="278" width="15" height="28" rx="3"/></g><g class="s"><rect x="151" y="278" width="15" height="28" rx="3"/></g><g class="s"><rect x="169" y="278" width="15" height="28" rx="3"/></g><g class="s"><rect x="187" y="278" width="15" height="28" rx="3"/></g><line class="mark" x1="127.0" y1="272" x2="127.0" y2="312"/><text class="sub2" x="52" y="328" text-anchor="start">tokens 1–4 on G1, 5–8 on G2</text><g class="u"><rect x="265" y="248" width="70.0" height="12" rx="3"/></g><g class="u"><rect x="345.0" y="248" width="70.0" height="12" rx="3"/></g><g class="u"><rect x="265" y="264" width="70.0" height="12" rx="3"/></g><g class="u"><rect x="345.0" y="264" width="70.0" height="12" rx="3"/></g><g class="u"><rect x="265" y="280" width="70.0" height="12" rx="3"/></g><g class="u"><rect x="345.0" y="280" width="70.0" height="12" rx="3"/></g><g class="u"><rect x="265" y="296" width="70.0" height="12" rx="3"/></g><g class="u"><rect x="345.0" y="296" width="70.0" height="12" rx="3"/></g><text class="sub2" x="265" y="328" text-anchor="start">a copy on G1, a copy on G2</text><line class="mark" x1="466" y1="252" x2="500" y2="252"/><text class="sub2" x="510" y="256" text-anchor="start">a cut: data must cross it</text><text class="sub2" x="466" y="284" text-anchor="start">G1, G2: two GPUs</text><text class="sub2" x="466" y="304" text-anchor="start">a shard: the piece one GPU holds</text><text class="cap" x="40" y="372" text-anchor="start">Splitting a model means giving each GPU a shard: its own piece of the weights, or of the</text><text class="cap" x="40" y="392" text-anchor="start">input. There are four places to cut. By layers, inside every weight matrix, between</text><text class="cap" x="40" y="412" text-anchor="start">experts, or along the sequence of tokens. Experts are the many small networks a</text><text class="cap" x="40" y="432" text-anchor="start">mixture-of-experts model picks among for each token ({{fig:v05-n25}}). A fifth strategy makes</text><text class="cap" x="40" y="452" text-anchor="start">no cut at all and copies the whole model instead.</text><text class="cap" x="40" y="492" text-anchor="start">Every cut line is a place where the GPUs on either side must exchange data, because</text><text class="cap" x="40" y="512" text-anchor="start">nobody holds everything needed to finish a token. Where the line goes decides what has</text><text class="cap" x="40" y="532" text-anchor="start">to cross it, and how often.</text></svg><figcaption>Five strategies, five places to put the line, and the parts that follow take them one at a time. The copy is the odd one out: it has nothing to say while serving.</figcaption></figure>
