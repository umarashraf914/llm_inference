<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 10:42</div><h3>Spread the experts over k nodes and (k − 1)/k of the traffic crosses the slow wire</h3><svg viewBox='0 0 680 412' role='img'><title>Spread the experts over k nodes and (k − 1)/k of the traffic crosses the slow wire</title><text class="hd" x="40" y="40">Share of dispatch traffic that crosses the network, if routing were even</text><text class="cap" x="40" y="76" text-anchor="start">experts on 1 node</text><rect x="200" y="58" width="400" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="210" y="76" text-anchor="start">0%: everything stays on NVLink</text><text class="cap" x="40" y="116" text-anchor="start">experts on 2 nodes</text><rect x="200" y="98" width="400" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="200" y="98" width="200.0" height="26" rx="3"/><text class="sub" x="300.0" y="111.0" text-anchor="middle" dominant-baseline="central">50.0%</text></g><text class="cap" x="40" y="156" text-anchor="start">experts on 4 nodes</text><rect x="200" y="138" width="400" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="200" y="138" width="300.0" height="26" rx="3"/><text class="sub" x="350.0" y="151.0" text-anchor="middle" dominant-baseline="central">75.0%</text></g><text class="cap" x="40" y="196" text-anchor="start">experts on 8 nodes</text><rect x="200" y="178" width="400" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="200" y="178" width="350.0" height="26" rx="3"/><text class="sub" x="375.0" y="191.0" text-anchor="middle" dominant-baseline="central">87.5%</text></g><text class="cap" x="40" y="246" text-anchor="start">Put a group's experts on k nodes and, with even routing, a token's expert sits on</text><text class="cap" x="40" y="266" text-anchor="start">another node with chance (k − 1) ÷ k. One node keeps everything on NVLink; two send half</text><text class="cap" x="40" y="286" text-anchor="start">the traffic over the network; eight, seven eighths.</text><text class="cap" x="40" y="326" text-anchor="start">Every crossing runs at about 50 GB/s each way instead of NVLink's 450 ({{fig:v05-n7}}): the</text><text class="cap" x="40" y="346" text-anchor="start">same bytes, 9 times the time. This is the arithmetic behind expert parallelism suffering</text><text class="cap" x="40" y="366" text-anchor="start">the moment it spills past the fast domain: its traffic is exactly the kind that cannot</text><text class="cap" x="40" y="386" text-anchor="start">afford the slow boundary.</text></svg><figcaption>Bars to scale against 100%. Node-limited routing ({{ref:v06-o021}}) exists to cap how many nodes one token can reach.</figcaption></figure>
