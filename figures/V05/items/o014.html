<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:22</div><h3>The bubble depends on the phase</h3><svg viewBox='0 0 680 342' role='img'><title>The bubble depends on the phase</title><g class="s"><rect x="40" y="55" width="285" height="78" rx="8"/><text class="lbl" x="182.5" y="77.0" text-anchor="middle" dominant-baseline="central">Prefill</text><text class="sub" x="182.5" y="95.0" text-anchor="middle" dominant-baseline="central">thousands of tokens in one pass,</text><text class="sub" x="182.5" y="112.0" text-anchor="middle" dominant-baseline="central">plenty to slice into microbatches</text></g><g class="h"><rect x="368" y="55" width="272" height="78" rx="8"/><text class="lbl" x="504.0" y="77.0" text-anchor="middle" dominant-baseline="central">Decode</text><text class="sub" x="504.0" y="95.0" text-anchor="middle" dominant-baseline="central">one token at a time,</text><text class="sub" x="504.0" y="112.0" text-anchor="middle" dominant-baseline="central">nothing to slice</text></g><text class="cap" x="40" y="176" text-anchor="start">The bubble is not the same size for every job, because serving has two very different</text><text class="cap" x="40" y="196" text-anchor="start">phases ({{fig:v01-o109}}). Prefill reads the whole prompt at once, maybe thousands of tokens in</text><text class="cap" x="40" y="216" text-anchor="start">one compute-heavy pass: plenty of work to slice into microbatches, so the pipe fills and</text><text class="cap" x="40" y="236" text-anchor="start">the bubble stays small.</text><text class="cap" x="40" y="276" text-anchor="start">Decode is the opposite. Each new token depends on the one before it, so a single request</text><text class="cap" x="40" y="296" text-anchor="start">can only move through the pipeline one tiny step at a time, and the stages spend most of</text><text class="cap" x="40" y="316" text-anchor="start">their time waiting.</text></svg><figcaption>The prefill and decode split of V1, reappearing as a scheduling constraint. It becomes the whole subject of V7, Serving in Production.</figcaption></figure>
