<figure><div class='ts'>Fig 14 &nbsp;&middot;&nbsp; 8:14</div><h3>The bubble depends on the phase</h3><svg viewBox="0 0 680 358" role="img"><title>The bubble depends on the phase</title><g class="s"><rect x="40" y="55" width="285" height="78" rx="8"></rect><text class="lbl" x="182.5" y="77.0" text-anchor="middle" dominant-baseline="central">Prefill</text><text class="sub" x="182.5" y="95.0" text-anchor="middle" dominant-baseline="central">thousands of tokens in one pass,</text><text class="sub" x="182.5" y="112.0" text-anchor="middle" dominant-baseline="central">plenty to slice into microbatches</text></g><g class="h"><rect x="368" y="55" width="272" height="78" rx="8"></rect><text class="lbl" x="504.0" y="77.0" text-anchor="middle" dominant-baseline="central">Decode</text><text class="sub" x="504.0" y="95.0" text-anchor="middle" dominant-baseline="central">one token at a time,</text><text class="sub" x="504.0" y="112.0" text-anchor="middle" dominant-baseline="central">nothing to slice</text></g><text class="cap" x="40" y="176" text-anchor="start">The bubble is not the same size for every job. Prefill fills the pipe easily. Decode is the</text><text class="cap" x="40" y="196" text-anchor="start">opposite: each new token depends on the one before it, so a single request moves through the</text><text class="cap" x="40" y="216" text-anchor="start">pipeline one tiny step at a time and the stages spend most of their time waiting.</text><text class="cap" x="40" y="256" text-anchor="start">The fix is to fill the pipe with other people's tokens. Continuous batching folds new requests</text><text class="cap" x="40" y="276" text-anchor="start">in as old ones finish, keeping every stage fed.</text><text class="cap" x="40" y="316" text-anchor="start">Modern stacks go further and run prefill and decode on separate GPU pools, each with its own</text><text class="cap" x="40" y="336" text-anchor="start">parallelism, so heavy prompt work never stalls the token-by-token stream.</text></svg><figcaption>The prefill and decode split from the first video, reappearing as a scheduling constraint. It becomes the whole subject of the serving episode.</figcaption></figure>
