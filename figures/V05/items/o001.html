<figure><div class='ts'>Fig 01 &nbsp;&middot;&nbsp; 0:00</div><h3>The weights do not fit</h3><svg viewBox="0 0 680 400" role="img"><title>The weights do not fit</title><text class="cap" x="40" y="78" text-anchor="start">The weights</text><g class="h"><rect x="280" y="62" width="340" height="32" rx="3"></rect><text class="sub" x="450.0" y="78.0" text-anchor="middle" dominant-baseline="central">1.6 TB, at 1 byte per parameter</text></g><text class="cap" x="40" y="138" text-anchor="start">A B200 holds</text><g class="s"><rect x="280" y="122" width="41" height="32" rx="3"></rect></g><text class="sub2" x="331" y="141" text-anchor="start">192 GB</text><text class="cap" x="40" y="198" text-anchor="start">An H100 holds</text><g class="s"><rect x="280" y="182" width="17" height="32" rx="3"></rect></g><text class="sub2" x="307" y="201" text-anchor="start">80 GB</text><text class="cap" x="40" y="258" text-anchor="start">A 1.6-trillion-parameter model stored in FP8 is eight times too large for the biggest chip</text><text class="cap" x="40" y="278" text-anchor="start">available, and twenty times too large for an H100.</text><text class="cap" x="40" y="318" text-anchor="start">And this is not a gap quantization can close. Shrink every parameter to a single bit and the</text><text class="cap" x="40" y="338" text-anchor="start">weights still come to 200 GB, which still overflows the B200.</text><text class="cap" x="40" y="378" text-anchor="start">The model has to be split. There is no other option.</text></svg><figcaption>Worth being precise about why this is a different wall from the memory wall. That one was about speed. This one is about the model not physically fitting.</figcaption></figure>
