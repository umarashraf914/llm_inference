<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:00</div><h3>The weights alone are eight times one chip</h3><svg viewBox='0 0 680 566' role='img'><title>The weights alone are eight times one chip</title><text class="cap" x="40" y="69" text-anchor="start">DeepSeek V4 Pro, FP8</text><g class="h"><rect x="200" y="50" width="400.0" height="28" rx="3"/><text class="sub" x="400.0" y="64.0" text-anchor="middle" dominant-baseline="central">1.6 trillion parameters × 1 byte = 1.6 TB</text></g><text class="cap" x="40" y="113" text-anchor="start">one B200 holds</text><g class="s"><rect x="200" y="94" width="48.0" height="28" rx="3"/></g><text class="sub2" x="258.0" y="113" text-anchor="start">192 GB</text><text class="cap" x="40" y="157" text-anchor="start">one H100 holds</text><g class="s"><rect x="200" y="138" width="20.0" height="28" rx="3"/></g><text class="sub2" x="230.0" y="157" text-anchor="start">80 GB</text><text class="hd" x="40" y="204">Even at one bit per parameter, the weights overflow one B200</text><text class="cap" x="40" y="241" text-anchor="start">1 bit per parameter</text><g class="h"><rect x="200" y="222" width="360.0" height="28" rx="3"/><text class="sub" x="380.0" y="236.0" text-anchor="middle" dominant-baseline="central">200 GB</text></g><text class="cap" x="40" y="281" text-anchor="start">one B200</text><g class="s"><rect x="200" y="262" width="345.6" height="28" rx="3"/><text class="sub" x="372.8" y="276.0" text-anchor="middle" dominant-baseline="central">192 GB</text></g><line class="mark xok" x1="545.6" y1="214" x2="545.6" y2="298"/><text class="sub2" x="570.0" y="241" text-anchor="start">8 GB over</text><text class="cap" x="40" y="340" text-anchor="start">DeepSeek V4 Pro has 1.6 trillion parameters. Stored in FP8, one byte each ({{fig:v04-o032}}),</text><text class="cap" x="40" y="360" text-anchor="start">that is 1.6 terabytes of weights. A high-end Nvidia B200 holds 192 GB:</text><text class="cap" x="40" y="380" text-anchor="start">1,600 ÷ 192 = 8.3, so the weights alone are eight times too big for one chip, and</text><text class="cap" x="40" y="400" text-anchor="start">1,600 ÷ 80 = 20 times too big for an 80 GB H100.</text><text class="cap" x="40" y="440" text-anchor="start">Quantization cannot close this gap. Shrink every parameter to a single bit and 1.6</text><text class="cap" x="40" y="460" text-anchor="start">trillion bits ÷ 8 bits per byte ({{fig:v01-o073}}) is still 200 GB, 8 GB more than the B200</text><text class="cap" x="40" y="480" text-anchor="start">holds.</text><text class="cap" x="40" y="520" text-anchor="start">So the model has to be split across many GPUs, and the moment it is, a problem appears</text><text class="cap" x="40" y="540" text-anchor="start">that a single chip never had.</text></svg><figcaption>Bars to scale; the lower pair is drawn larger. This is a capacity wall, not the speed wall of the first video: no amount of bandwidth helps when the weights do not fit ({{ref:v02-o091}}).</figcaption></figure>
