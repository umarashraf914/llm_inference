<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:30</div><h3>Working in parallel means trading partial answers</h3><svg viewBox='0 0 680 444' role='img'><title>Working in parallel means trading partial answers</title><text class="hd" x="40" y="40">In sequence: each GPU waits for the one before</text><g class="u"><rect x="80" y="58" width="110" height="34" rx="3"/><text class="sub" x="135.0" y="75.0" text-anchor="middle" dominant-baseline="central">GPU 1</text></g><line class="conn" x1="194" y1="75" x2="206" y2="75" marker-end="url(#arw)"/><g class="u"><rect x="210" y="58" width="110" height="34" rx="3"/><text class="sub" x="265.0" y="75.0" text-anchor="middle" dominant-baseline="central">GPU 2</text></g><line class="conn" x1="324" y1="75" x2="336" y2="75" marker-end="url(#arw)"/><g class="u"><rect x="340" y="58" width="110" height="34" rx="3"/><text class="sub" x="395.0" y="75.0" text-anchor="middle" dominant-baseline="central">GPU 3</text></g><line class="conn" x1="454" y1="75" x2="466" y2="75" marker-end="url(#arw)"/><g class="u"><rect x="470" y="58" width="110" height="34" rx="3"/><text class="sub" x="525.0" y="75.0" text-anchor="middle" dominant-baseline="central">GPU 4</text></g><text class="sub2" x="80" y="116" text-anchor="start">total time: four steps, one after another</text><text class="hd" x="40" y="160">In parallel: all four work at once, then trade partial answers</text><g class="m"><rect x="80" y="178" width="110" height="34" rx="3"/><text class="sub" x="135.0" y="195.0" text-anchor="middle" dominant-baseline="central">GPU 1</text></g><g class="m"><rect x="210" y="178" width="110" height="34" rx="3"/><text class="sub" x="265.0" y="195.0" text-anchor="middle" dominant-baseline="central">GPU 2</text></g><g class="m"><rect x="340" y="178" width="110" height="34" rx="3"/><text class="sub" x="395.0" y="195.0" text-anchor="middle" dominant-baseline="central">GPU 3</text></g><g class="m"><rect x="470" y="178" width="110" height="34" rx="3"/><text class="sub" x="525.0" y="195.0" text-anchor="middle" dominant-baseline="central">GPU 4</text></g><g class="h"><rect x="80" y="222" width="500" height="30" rx="3"/><text class="sub" x="330.0" y="237.0" text-anchor="middle" dominant-baseline="central">exchange and add the pieces, all four at once</text></g><text class="sub2" x="80" y="274" text-anchor="start">total time: one step, plus the exchange</text><text class="cap" x="40" y="318" text-anchor="start">Split the model and the GPUs must exchange data. Four GPUs each holding a quarter of an</text><text class="cap" x="40" y="338" text-anchor="start">answer have to trade and add their pieces before anyone can continue, and that exchange</text><text class="cap" x="40" y="358" text-anchor="start">takes real time.</text><text class="cap" x="40" y="398" text-anchor="start">Such all-at-once exchanges come in a handful of standard patterns called collectives,</text><text class="cap" x="40" y="418" text-anchor="start">and each of the five strategies has one as its signature.</text></svg><figcaption>Parallel work is only half the bill. The exchange that stitches the pieces together is the other half, and it is what every strategy below is priced by.</figcaption></figure>
