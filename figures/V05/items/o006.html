<figure><div class='ts'>Fig 06 &nbsp;&middot;&nbsp; 2:30</div><h3>Why splitting forces an exchange</h3><svg viewBox="0 0 680 464" role="img"><title>Why splitting forces an exchange</title><text class="hd" x="40" y="46">In sequence: each GPU waits for the one before</text><g class="u"><rect x="80" y="66" width="110" height="34" rx="3"></rect><text class="sub" x="135.0" y="83.0" text-anchor="middle" dominant-baseline="central">GPU 1</text></g><line class="conn" x1="194" y1="83" x2="214" y2="83" marker-end="url(#arw)"></line><g class="u"><rect x="210" y="66" width="110" height="34" rx="3"></rect><text class="sub" x="265.0" y="83.0" text-anchor="middle" dominant-baseline="central">GPU 2</text></g><line class="conn" x1="324" y1="83" x2="344" y2="83" marker-end="url(#arw)"></line><g class="u"><rect x="340" y="66" width="110" height="34" rx="3"></rect><text class="sub" x="395.0" y="83.0" text-anchor="middle" dominant-baseline="central">GPU 3</text></g><line class="conn" x1="454" y1="83" x2="474" y2="83" marker-end="url(#arw)"></line><g class="u"><rect x="470" y="66" width="110" height="34" rx="3"></rect><text class="sub" x="525.0" y="83.0" text-anchor="middle" dominant-baseline="central">GPU 4</text></g><text class="sub2" x="80" y="128" text-anchor="start">total time: four steps</text><text class="hd" x="40" y="178">In parallel: all four work at once, then combine</text><g class="m"><rect x="80" y="198" width="110" height="34" rx="3"></rect><text class="sub" x="135.0" y="215.0" text-anchor="middle" dominant-baseline="central">GPU 1</text></g><line class="conn" x1="135" y1="238" x2="340" y2="268" marker-end="url(#arw)"></line><g class="m"><rect x="210" y="198" width="110" height="34" rx="3"></rect><text class="sub" x="265.0" y="215.0" text-anchor="middle" dominant-baseline="central">GPU 2</text></g><line class="conn" x1="265" y1="238" x2="340" y2="268" marker-end="url(#arw)"></line><g class="m"><rect x="340" y="198" width="110" height="34" rx="3"></rect><text class="sub" x="395.0" y="215.0" text-anchor="middle" dominant-baseline="central">GPU 3</text></g><line class="conn" x1="395" y1="238" x2="340" y2="268" marker-end="url(#arw)"></line><g class="m"><rect x="470" y="198" width="110" height="34" rx="3"></rect><text class="sub" x="525.0" y="215.0" text-anchor="middle" dominant-baseline="central">GPU 4</text></g><line class="conn" x1="525" y1="238" x2="340" y2="268" marker-end="url(#arw)"></line><g class="s"><rect x="250" y="272" width="180" height="32" rx="4"></rect><text class="sub" x="340.0" y="288.0" text-anchor="middle" dominant-baseline="central">combine the four</text></g><text class="sub2" x="80" y="336" text-anchor="start">total time: one step, plus the combining</text><text class="cap" x="40" y="386" text-anchor="start">The combining is the catch. Four GPUs each holding a quarter of an answer have to exchange</text><text class="cap" x="40" y="406" text-anchor="start">and add their pieces before anyone can continue, and that exchange takes real time.</text><text class="cap" x="40" y="442" text-anchor="start">A collective is the name for one of these all-at-once exchanges.</text></svg><figcaption>The word collective simply means every GPU taking part in one coordinated conversation, rather than sending point-to-point messages.</figcaption></figure>
