"201.85714285714286" text-anchor="end">0</text><circle cx="237.3" cy="168.5" r="3.5" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2 halo" x="247.33333333333331" y="172.54952134055327" text-anchor="start">0.84</text><circle cx="280.7" cy="112.6" r="3.5" fill="var(--paper)" stroke="var(--h)" stroke-width="1.5"/><text class="sub2 halo" x="290.6666666666667" y="116.57372755593119" text-anchor="start">1.95</text><text class="hd" x="380" y="76">Without a bend, two are one</text><text class="sub2" x="380" y="104" text-anchor="start">start with x = −1</text><text class="sub2" x="380" y="124" text-anchor="start">× 3 gives −3, × 2 gives −6:</text><text class="sub2" x="380" y="144" text-anchor="start">the same as × 6, for every x</text><text class="sub2" x="380" y="184" text-anchor="start">with GELU between:</text><text class="sub2" x="380" y="204" text-anchor="start">× 3 gives −3, GELU gives −0.004,</text><text class="sub2" x="380" y="224" text-anchor="start">× 2 gives −0.008, not −6</text><text class="cap" x="40" y="288" text-anchor="start">GELU(x) = x × Φ(x), where Φ(x) is the share of a bell curve lying below x, a probability</text><text class="cap" x="40" y="308" text-anchor="start">between 0 and 1. Far above zero Φ is nearly 1 and a number passes almost unchanged; far</text><text class="cap" x="40" y="328" text-anchor="start">below, Φ is nearly 0 and the number is squashed toward zero; near zero, it bends.</text><text class="cap" x="40" y="368" text-anchor="start">It looks at one number at a time: output 3 depends only on input 3. So a GPU holding</text><text class="cap" x="40" y="388" text-anchor="start">some of the numbers can bend them without asking any other GPU.</text><text class="cap" x="40" y="428" text-anchor="start">Why bend at all? Without it, A then B would be a single matrix: in one dimension, × 3</text><text class="cap" x="40" y="448" text-anchor="start">then × 2 is × 6 for every input. The bend is what lets two matrices do what one cannot.</text></svg><figcaption>The two facts tensor parallelism rests on: the bend is what makes two matrices worth having, and it touches each number alone, so whoever holds a number can bend it.</figcaption></figure>
