<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:55</div><h3>Gigabits are not gigabytes, and two directions are not one</h3><svg viewBox='0 0 680 634' role='img'><title>Gigabits are not gigabytes, and two directions are not one</title><text class="hd" x="40" y="40">Network ports are sold in bits per second, one direction at a time</text><g class="u"><rect x="40" y="56" width="110" height="32" rx="3"/><text class="sub" x="95.0" y="72.0" text-anchor="middle" dominant-baseline="central">400 Gb/s</text></g><text class="sub2" x="165.0" y="77" text-anchor="middle">÷</text><g class="u"><rect x="180" y="56" width="130" height="32" rx="3"/><text class="sub" x="245.0" y="72.0" text-anchor="middle" dominant-baseline="central">8 bits per byte</text></g><text class="sub2" x="325.0" y="77" text-anchor="middle">=</text><g class="h"><rect x="340" y="56" width="150" height="32" rx="3"/><text class="sub" x="415.0" y="72.0" text-anchor="middle" dominant-baseline="central">50 GB/s each way</text></g><text class="hd" x="40" y="128">NVLink's headline adds both directions together</text><g class="u"><rect x="40" y="144" width="90" height="32" rx="3"/><text class="sub" x="85.0" y="160.0" text-anchor="middle" dominant-baseline="central">18 links</text></g><text class="sub2" x="145.0" y="165" text-anchor="middle">×</text><g class="u"><rect x="160" y="144" width="140" height="32" rx="3"/><text class="sub" x="230.0" y="160.0" text-anchor="middle" dominant-baseline="central">25 GB/s each way</text></g><text class="sub2" x="315.0" y="165" text-anchor="middle">=</text><g class="s"><rect x="330" y="144" width="150" height="32" rx="3"/><text class="sub" x="405.0" y="160.0" text-anchor="middle" dominant-baseline="central">450 GB/s each way</text></g><text class="sub2" x="530.0" y="165" text-anchor="middle">× 2 = 900</text><text class="hd" x="40" y="222">Like for like, per direction</text><text class="cap" x="40" y="256" text-anchor="start">NVLink, B200</text><g class="s"><rect x="200" y="238" width="360.0" height="26" rx="3"/><text class="sub" x="380.0" y="251.0" text-anchor="middle" dominant-baseline="central">900 GB/s each way</text></g><text class="cap" x="40" y="294" text-anchor="start">NVLink, H100</text><g class="s"><rect x="200" y="276" width="180.0" height="26" rx="3"/><text class="sub" x="290.0" y="289.0" text-anchor="middle" dominant-baseline="central">450 GB/s each way</text></g><text class="cap" x="40" y="332" text-anchor="start">network port</text><g class="h"><rect x="200" y="314" width="20.0" height="26" rx="3"/></g><text class="sub2" x="230.0" y="332" text-anchor="start">50 GB/s each way</text><text class="cap" x="40" y="388" text-anchor="start">A network port is sold in bits per second; GPU memory and NVLink in bytes. A byte is</text><text class="cap" x="40" y="408" text-anchor="start">eight bits ({{fig:v01-o073}}), so a 400 Gb/s InfiniBand or Ethernet port, one per GPU in</text><text class="cap" x="40" y="428" text-anchor="start">Nvidia's B200 servers, moves 50 GB/s. It does that in both directions at once, and is</text><text class="cap" x="40" y="448" text-anchor="start">quoted one way.</text><text class="cap" x="40" y="488" text-anchor="start">NVLink's figure is quoted both ways added. An H100 has 18 links, each moving 25 GB/s</text><text class="cap" x="40" y="508" text-anchor="start">each way: 450 GB/s out while 450 GB/s comes in, 900 in total. A B200 doubles it:</text><text class="cap" x="40" y="528" text-anchor="start">900 + 900 = 1.8 TB/s.</text><text class="cap" x="40" y="568" text-anchor="start">So the like-for-like drop at the edge of the box is 450 ÷ 50 = 9 times on an H100 and</text><text class="cap" x="40" y="588" text-anchor="start">900 ÷ 50 = 18 times on a B200. The quoted 18 to 36 compares a two-way total with a</text><text class="cap" x="40" y="608" text-anchor="start">one-way rate.</text></svg><figcaption>Bars to scale. The usual 18 to 36 times is how the specifications read side by side; the fair comparison is half that. Nine to eighteen times is still a cliff.</figcaption></figure>
