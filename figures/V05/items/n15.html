<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:27</div><h3>Attention splits by heads, and the cache splits with them</h3><svg viewBox='0 0 680 628' role='img'><title>Attention splits by heads, and the cache splits with them</title><g class="u"><rect x="40" y="40" width="141" height="84" rx="14"/><text class="lbl" x="62" y="66">GPU 1</text></g><g class="m"><rect x="52" y="80" width="70" height="24" rx="3"/><text class="sub" x="87.0" y="92.0" text-anchor="middle" dominant-baseline="central">Q 1–8</text></g><g class="m"><rect x="128" y="80" width="41" height="24" rx="3"/><text class="sub" x="148.5" y="92.0" text-anchor="middle" dominant-baseline="central">KV 1</text></g><g class="u"><rect x="193" y="40" width="141" height="84" rx="14"/><text class="lbl" x="215" y="66">GPU 2</text></g><g class="m"><rect x="205" y="80" width="70" height="24" rx="3"/><text class="sub" x="240.0" y="92.0" text-anchor="middle" dominant-baseline="central">Q 9–16</text></g><g class="m"><rect x="281" y="80" width="41" height="24" rx="3"/><text class="sub" x="301.5" y="92.0" text-anchor="middle" dominant-baseline="central">KV 2</text></g><g class="u"><rect x="346" y="40" width="141" height="84" rx="14"/><text class="lbl" x="368" y="66">GPU 3</text></g><g class="m"><rect x="358" y="80" width="70" height="24" rx="3"/><text class="sub" x="393.0" y="92.0" text-anchor="middle" dominant-baseline="central">Q 17–24</text></g><g class="m"><rect x="434" y="80" width="41" height="24" rx="3"/><text class="sub" x="454.5" y="92.0" text-anchor="middle" dominant-baseline="central">KV 3</text></g><g class="u"><rect x="499" y="40" width="141" height="84" rx="14"/><text class="lbl" x="521" y="66">GPU 4</text></g><g class="m"><rect x="511" y="80" width="70" height="24" rx="3"/><text class="sub" x="546.0" y="92.0" text-anchor="middle" dominant-baseline="central">Q 25–32</text></g><g class="m"><rect x="587" y="80" width="41" height="24" rx="3"/><text class="sub" x="607.5" y="92.0" text-anchor="middle" dominant-baseline="central">KV 4</text></g><g class="u"><rect x="40" y="136" width="141" height="84" rx="14"/><text class="lbl" x="62" y="162">GPU 5</text></g><g class="m"><rect x="52" y="176" width="70" height="24" rx="3"/><text class="sub" x="87.0" y="188.0" text-anchor="middle" dominant-baseline="central">Q 33–40</text></g><g class="m"><rect x="128" y="176" width="41" height="24" rx="3"/><text class="sub" x="148.5" y="188.0" text-anchor="middle" dominant-baseline="central">KV 5</text></g><g class="u"><rect x="193" y="136" width="141" height="84" rx="14"/><text class="lbl" x="215" y="162">GPU 6</text></g><g class="m"><rect x="205" y="176" width="70" height="24" rx="3"/><text class="sub" x="240.0" y="188.0" text-anchor="middle" dominant-baseline="central">Q 41–48</text></g><g class="m"><rect x="281" y="176" width="41" height="24" rx="3"/><text class="sub" x="301.5" y="188.0" text-anchor="middle" dominant-baseline="central">KV 6</text></g><g class="u"><rect x="346" y="136" width="141" height="84" rx="14"/><text class="lbl" x="368" y="162">GPU 7</text></g><g class="m"><rect x="358" y="176" width="70" height="24" rx="3"/><text class="sub" x="393.0" y="188.0" text-anchor="middle" dominant-baseline="central">Q 49–56</text></g><g class="m"><rect x="434" y="176" width="41" height="24" rx="3"/><text class="sub" x="454.5" y="188.0" text-anchor="middle" dominant-baseline="central">KV 7</text></g><g class="u"><rect x="499" y="136" width="141" height="84" rx="14"/><text class="lbl" x="521" y="162">GPU 8</text></g><g class="m"><rect x="511" y="176" width="70" height="24" rx="3"/><text class="sub" x="546.0" y="188.0" text-anchor="middle" dominant-baseline="central">Q 57–64</text></g><g class="m"><rect x="587" y="176" width="41" height="24" rx="3"/><text class="sub" x="607.5" y="188.0" text-anchor="middle" dominant-baseline="central">KV 8</text></g><text class="sub2" x="40" y="254" text-anchor="start">query heads and the one KV head they share, per GPU</text><text class="cap" x="40" y="296" text-anchor="start">cache per token, unsplit</text><g class="h"><rect x="200" y="278" width="320.0" height="26" rx="3"/><text class="sub" x="360.0" y="291.0" text-anchor="middle" dominant-baseline="central">327,680 bytes</text></g><text class="cap" x="40" y="334" text-anchor="start">on each GPU</text><g class="s"><rect x="200" y="316" width="40.0" height="26" rx="3"/></g><text class="sub2" x="250.0" y="334" text-anchor="start">40,960 bytes, an eighth</text><text class="cap" x="40" y="382" text-anchor="start">Attention divides even more naturally, because its heads are already independent</text><text class="cap" x="40" y="402" text-anchor="start">({{fig:v03-o013}}). The 70B has 64 query heads sharing 8 KV heads, 8 query heads to each</text><text class="cap" x="40" y="422" text-anchor="start">({{fig:v03-o089}}). Eight GPUs take 8 query heads each, and those 8 are exactly the group that</text><text class="cap" x="40" y="442" text-anchor="start">shares one KV head, so no GPU needs another's keys.</text><text class="cap" x="40" y="482" text-anchor="start">W_Q, W_K and W_V are split by columns, whole heads at a time. W_O, which mixes the heads</text><text class="cap" x="40" y="502" text-anchor="start">back into one vector, is split by rows, leaving partial outputs: the layer's second</text><text class="cap" x="40" y="522" text-anchor="start">all-reduce.</text><text class="cap" x="40" y="562" text-anchor="start">The cache splits with the heads: each GPU keeps keys and values for its own KV head</text><text class="cap" x="40" y="582" text-anchor="start">only, 327,680 ÷ 8 = 40,960 bytes per token. With more GPUs than KV heads, KV heads would</text><text class="cap" x="40" y="602" text-anchor="start">have to be copied, one reason eight is the natural group size here.</text></svg><figcaption>Bars to scale. The two all-reduces per layer now have names: one after attention's W_O, one after the feed-forward block's last matrix.</figcaption></figure>
