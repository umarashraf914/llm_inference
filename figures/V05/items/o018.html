<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:12</div><h3>Data parallelism runs whole copies side by side</h3><svg viewBox='0 0 680 386' role='img'><title>Data parallelism runs whole copies side by side</title><g class="u"><rect x="40" y="40" width="600" height="128" rx="14"/><text class="lbl" x="62" y="66">Complete independent copies</text></g><g class="s"><rect x="66" y="92" width="120" height="52" rx="4"/><text class="sub" x="126.0" y="118.0" text-anchor="middle" dominant-baseline="central">full model</text></g><text class="sub2" x="74" y="190" text-anchor="start">requests 1–25</text><g class="s"><rect x="211" y="92" width="120" height="52" rx="4"/><text class="sub" x="271.0" y="118.0" text-anchor="middle" dominant-baseline="central">full model</text></g><text class="sub2" x="219" y="190" text-anchor="start">requests 26–50</text><g class="s"><rect x="356" y="92" width="120" height="52" rx="4"/><text class="sub" x="416.0" y="118.0" text-anchor="middle" dominant-baseline="central">full model</text></g><text class="sub2" x="364" y="190" text-anchor="start">requests 51–75</text><g class="s"><rect x="501" y="92" width="120" height="52" rx="4"/><text class="sub" x="561.0" y="118.0" text-anchor="middle" dominant-baseline="central">full model</text></g><text class="sub2" x="509" y="190" text-anchor="start">requests 76–100</text><text class="cap" x="40" y="240" text-anchor="start">Data parallelism is the simplest strategy of the five. Run complete, independent copies</text><text class="cap" x="40" y="260" text-anchor="start">of the model and give each one its own share of the incoming requests.</text><text class="cap" x="40" y="300" text-anchor="start">The copies never need to talk while serving ({{fig:v05-n30}}), so this scaling is free, but</text><text class="cap" x="40" y="320" text-anchor="start">narrow. Replication cannot fit a bigger model, since every copy must already hold the</text><text class="cap" x="40" y="340" text-anchor="start">whole thing, and it cannot make a single request faster, since each request still runs</text><text class="cap" x="40" y="360" text-anchor="start">on exactly one replica. It buys throughput and nothing else.</text></svg><figcaption>More copies serve more requests at once. They do not make room for a bigger model or speed for any one request, which is why this split always wraps the others.</figcaption></figure>
