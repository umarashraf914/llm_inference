<figure><div class='ts'>Fig 18 &nbsp;&middot;&nbsp; 11:12</div><h3>Replication, and why it is free here</h3><svg viewBox="0 0 680 428" role="img"><title>Replication, and why it is free here</title><g class="u"><rect x="40" y="40" width="600" height="128" rx="14"></rect><text class="lbl" x="62" y="66">Complete independent copies</text></g><g class="s"><rect x="66" y="92" width="120" height="52" rx="4"></rect><text class="sub" x="126.0" y="118.0" text-anchor="middle" dominant-baseline="central">full model</text></g><text class="sub2" x="74" y="190" text-anchor="start">requests 1-25</text><g class="s"><rect x="211" y="92" width="120" height="52" rx="4"></rect><text class="sub" x="271.0" y="118.0" text-anchor="middle" dominant-baseline="central">full model</text></g><text class="sub2" x="219" y="190" text-anchor="start">requests 26-50</text><g class="s"><rect x="356" y="92" width="120" height="52" rx="4"></rect><text class="sub" x="416.0" y="118.0" text-anchor="middle" dominant-baseline="central">full model</text></g><text class="sub2" x="364" y="190" text-anchor="start">requests 51-75</text><g class="s"><rect x="501" y="92" width="120" height="52" rx="4"></rect><text class="sub" x="561.0" y="118.0" text-anchor="middle" dominant-baseline="central">full model</text></g><text class="sub2" x="509" y="190" text-anchor="start">requests 76-100</text><text class="cap" x="40" y="246" text-anchor="start">If you know data parallelism from training you would expect a heavy coordination bill, because</text><text class="cap" x="40" y="266" text-anchor="start">training replicas average their gradients with an all-reduce at every step.</text><text class="cap" x="40" y="306" text-anchor="start">Inference computes no gradients. There is nothing to synchronise, so the replicas never exchange</text><text class="cap" x="40" y="326" text-anchor="start">a single byte.</text><text class="cap" x="40" y="366" text-anchor="start">Zero communication buys only a narrow kind of scaling. Replication cannot fit a bigger model,</text><text class="cap" x="40" y="386" text-anchor="start">since every copy must already hold the whole thing, and it cannot make one request faster,</text><text class="cap" x="40" y="406" text-anchor="start">since each request still runs on one replica. It buys throughput and nothing else.</text></svg><figcaption>A good example of a training intuition that does not transfer. The absence of gradients changes the cost of this strategy completely.</figcaption></figure>
