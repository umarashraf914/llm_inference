<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:45</div><h3>Each all-reduce carries every token's whole vector</h3><svg viewBox='0 0 680 534' role='img'><title>Each all-reduce carries every token's whole vector</title><text class="hd" x="40" y="40">message  =  tokens × 8,192 numbers × 2 bytes</text><line class="axis" x1="190.0" y1="58" x2="190.0" y2="176"/><text class="sub2" x="190.0" y="192" text-anchor="start">1 KB</text><line class="axis" x1="280.0" y1="58" x2="280.0" y2="176"/><text class="sub2" x="280.0" y="192" text-anchor="middle">10 KB</text><line class="axis" x1="370.0" y1="58" x2="370.0" y2="176"/><text class="sub2" x="370.0" y="192" text-anchor="middle">100 KB</text><line class="axis" x1="460.0" y1="58" x2="460.0" y2="176"/><text class="sub2" x="460.0" y="192" text-anchor="middle">1 MB</text><line class="axis" x1="550.0" y1="58" x2="550.0" y2="176"/><text class="sub2" x="550.0" y="192" text-anchor="middle">10 MB</text><line class="axis" x1="640.0" y1="58" x2="640.0" y2="176"/><text class="sub2" x="640.0" y="192" text-anchor="middle">100 MB</text><text class="cap" x="40" y="82" text-anchor="start">1 token: decode</text><g class="h"><rect x="190" y="64" width="109.29779453661627" height="26" rx="3"/><text class="sub" x="244.64889726830813" y="77.0" text-anchor="middle" dominant-baseline="central">16,384 bytes</text></g><text class="cap" x="40" y="118" text-anchor="start">64 tokens</text><g class="h"><rect x="190" y="100" width="271.85399219516614" height="26" rx="3"/><text class="sub" x="325.92699609758307" y="113.0" text-anchor="middle" dominant-baseline="central">1,048,576 bytes</text></g><text class="cap" x="40" y="154" text-anchor="start">4,096 tokens: a prefill</text><g class="h"><rect x="190" y="136" width="434.410189853716" height="26" rx="3"/><text class="sub" x="407.205094926858" y="149.0" text-anchor="middle" dominant-baseline="central">67,108,864 bytes</text></g><text class="hd" x="40" y="236">Every GPU, over one pass for one token</text><g class="u"><rect x="40" y="254" width="130" height="30" rx="3"/><text class="sub" x="105.0" y="269.0" text-anchor="middle" dominant-baseline="central">160 all-reduces</text></g><text class="sub2" x="183.0" y="272" text-anchor="middle">×</text><g class="u"><rect x="196" y="254" width="160" height="30" rx="3"/><text class="sub" x="276.0" y="269.0" text-anchor="middle" dominant-baseline="central">1.75 × 16,384 bytes</text></g><text class="sub2" x="369.0" y="272" text-anchor="middle">=</text><g class="h"><rect x="382" y="254" width="258" height="30" rx="3"/><text class="sub" x="511.0" y="269.0" text-anchor="middle" dominant-baseline="central">4,587,520 bytes, 4.6 MB</text></g><text class="cap" x="40" y="328" text-anchor="start">An all-reduce has to carry each token's full vector, 8,192 numbers at 2 bytes: 16 KB per</text><text class="cap" x="40" y="348" text-anchor="start">token. In decode at batch 1 that is the whole message; a 4,096-token prefill sends 67 MB</text><text class="cap" x="40" y="368" text-anchor="start">per exchange.</text><text class="cap" x="40" y="408" text-anchor="start">Why all-reduce, rather than adding everything on one GPU? The next layer splits its</text><text class="cap" x="40" y="428" text-anchor="start">matrices by columns too, so it needs the whole vector, the residual stream ({{fig:v01-o099}}),</text><text class="cap" x="40" y="448" text-anchor="start">on every GPU.</text><text class="cap" x="40" y="488" text-anchor="start">In a ring of eight, each GPU sends 1.75 times the message per all-reduce ({{fig:v05-o022}}).</text><text class="cap" x="40" y="508" text-anchor="start">Per token, over one pass: 160 × 1.75 × 16,384 = 4,587,520 bytes, 4.6 MB from every GPU.</text></svg><figcaption>Log scale: each gridline is ten times the last, and the bars start at 1 KB. Decode sends little and often, prefill a great deal at once.</figcaption></figure>
