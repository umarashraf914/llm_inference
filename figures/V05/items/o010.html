<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:38</div><h3>Two blocking exchanges per layer, 160 per token</h3><svg viewBox='0 0 680 482' role='img'><title>Two blocking exchanges per layer, 160 per token</title><text class="sub2" x="110" y="60" text-anchor="start">attention</text><text class="sub2" x="318" y="60" text-anchor="start">feed-forward</text><text class="sub2" x="551" y="60" text-anchor="start">next layer</text><text class="cap" x="40" y="90" text-anchor="start">GPU 1</text><g class="m"><rect x="110" y="72" width="116" height="26" rx="3"/></g><rect x="230" y="72" width="10" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="318" y="72" width="146" height="26" rx="3"/></g><rect x="468" y="72" width="5" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="551" y="72" width="89" height="26" rx="3"/></g><text class="cap" x="40" y="122" text-anchor="start">GPU 2</text><g class="m"><rect x="110" y="104" width="126" height="26" rx="3"/></g><g class="m"><rect x="318" y="104" width="136" height="26" rx="3"/></g><rect x="458" y="104" width="15" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="551" y="104" width="89" height="26" rx="3"/></g><text class="cap" x="40" y="154" text-anchor="start">GPU 3</text><g class="m"><rect x="110" y="136" width="111" height="26" rx="3"/></g><rect x="225" y="136" width="15" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="318" y="136" width="151" height="26" rx="3"/></g><g class="m"><rect x="551" y="136" width="89" height="26" rx="3"/></g><text class="cap" x="40" y="186" text-anchor="start">GPU 4</text><g class="m"><rect x="110" y="168" width="121" height="26" rx="3"/></g><rect x="235" y="168" width="5" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="318" y="168" width="141" height="26" rx="3"/></g><rect x="463" y="168" width="10" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="551" y="168" width="89" height="26" rx="3"/></g><g class="h"><rect x="244" y="72" width="70" height="122" rx="3"/><text class="sub" x="279.0" y="133.0" text-anchor="middle" dominant-baseline="central">all-reduce</text></g><g class="h"><rect x="477" y="72" width="70" height="122" rx="3"/><text class="sub" x="512.0" y="133.0" text-anchor="middle" dominant-baseline="central">all-reduce</text></g><text class="sub2" x="110" y="220" text-anchor="start">dashed: a GPU that finished early, waiting for the slowest</text><g class="u"><rect x="40" y="242" width="110" height="30" rx="3"/><text class="sub" x="95.0" y="257.0" text-anchor="middle" dominant-baseline="central">80 layers</text></g><text class="sub2" x="164.0" y="260" text-anchor="middle">×</text><g class="u"><rect x="178" y="242" width="110" height="30" rx="3"/><text class="sub" x="233.0" y="257.0" text-anchor="middle" dominant-baseline="central">2 per layer</text></g><text class="sub2" x="302.0" y="260" text-anchor="middle">=</text><g class="h"><rect x="316" y="242" width="324" height="30" rx="3"/><text class="sub" x="478.0" y="257.0" text-anchor="middle" dominant-baseline="central">160 blocking exchanges per token</text></g><text class="cap" x="40" y="316" text-anchor="start">Each layer runs attention, an all-reduce, the feed-forward block and another all-reduce,</text><text class="cap" x="40" y="336" text-anchor="start">in that order. Both exchanges sit on the critical path: the next step cannot start on</text><text class="cap" x="40" y="356" text-anchor="start">any GPU until every GPU's partial has been added, so the fast GPUs wait for the slowest.</text><text class="cap" x="40" y="396" text-anchor="start">For the 80-layer model from earlier, that is 80 × 2 = 160 blocking exchanges for every</text><text class="cap" x="40" y="416" text-anchor="start">token, far too heavy to cross between servers. The Megatron team therefore capped the</text><text class="cap" x="40" y="436" text-anchor="start">group at the GPUs inside one server, the eight NVLink GPUs of a standard node, and the</text><text class="cap" x="40" y="456" text-anchor="start">rule still holds.</text></svg><figcaption>Four of the eight GPUs drawn; lengths schematic. The bill is not one big transfer but 160 small waits in a row, and each pays the toll of {{ref:v05-n8}}.</figcaption></figure>
