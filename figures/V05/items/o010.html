<figure><div class='ts'>Fig 10 &nbsp;&middot;&nbsp; 5:23</div><h3>The price, and why it stays inside a node</h3><svg viewBox="0 0 680 402" role="img"><title>The price, and why it stays inside a node</title><g class="u"><rect x="40" y="46" width="600" height="116" rx="14"></rect><text class="lbl" x="62" y="72">One layer, on the critical path</text></g><g class="m"><rect x="66" y="100" width="240" height="40" rx="4"></rect><text class="sub" x="186.0" y="120.0" text-anchor="middle" dominant-baseline="central">all-reduce after the FFN</text></g><g class="m"><rect x="330" y="100" width="284" height="40" rx="4"></rect><text class="sub" x="472.0" y="120.0" text-anchor="middle" dominant-baseline="central">all-reduce after attention</text></g><text class="cap" x="40" y="200" text-anchor="start">Two blocking exchanges inside every layer. The next layer cannot start until they finish.</text><text class="cap" x="40" y="240" text-anchor="start">80 layers</text><g class="u"><rect x="200" y="224" width="60" height="30" rx="3"></rect><text class="sub" x="230.0" y="239.0" text-anchor="middle" dominant-baseline="central">x 2</text></g><text class="sub2" x="276" y="243" text-anchor="start">= 160 blocking exchanges for every single token</text><text class="cap" x="40" y="300" text-anchor="start">Far too heavy to cross between servers. So the group is capped at the GPUs inside one machine,</text><text class="cap" x="40" y="320" text-anchor="start">the eight on NVLink.</text><text class="cap" x="40" y="360" text-anchor="start">The reward: each GPU holds roughly an eighth of the weights and does an eighth of the maths, so</text><text class="cap" x="40" y="380" text-anchor="start">one token genuinely comes out faster. This is the only strategy here that does that.</text></svg><figcaption>Latency for one request is what tensor parallelism buys. Everything else on this list buys capacity or throughput instead.</figcaption></figure>
