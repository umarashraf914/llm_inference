<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 7:46</div><h3>The bubble formula is a count of empty cells</h3><div class='wg'><div class='ctl'><label>GPUs, p <input type='range' min='2' max='8' step='1' value='4'><span class='val'>4</span></label><label>microbatches, m <input type='range' min='1' max='32' step='1' value='4'><span class='val'>4</span></label></div><div class='ctl'><label>chunks per GPU, v <input type='range' min='1' max='4' step='1' value='1'><span class='val'>1</span></label><button type='button'>Reset</button></div><svg viewBox='0 0 680 524' role='img'><title>The bubble formula is a count of empty cells</title><text class="hd" x="40" y="34">Every empty slot of the schedule, counted</text><g data-chart=""><text class="cap" x="40" y="69" text-anchor="start">GPU 1</text><text class="cap" x="40" y="99" text-anchor="start">GPU 2</text><text class="cap" x="40" y="129" text-anchor="start">GPU 3</text><text class="cap" x="40" y="159" text-anchor="start">GPU 4</text><g class="m"><rect x="120.0" y="52" width="70.28571428571429" height="26" rx="3"/><text class="sub" x="155.14285714285714" y="65.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="194.28571428571428" y="52" width="70.28571428571429" height="26" rx="3"/><text class="sub" x="229.42857142857142" y="65.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="m"><rect x="268.57142857142856" y="52" width="70.28571428571429" height="26" rx="3"/><text class="sub" x="303.7142857142857" y="65.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="m"><rect x="342.8571428571429" y="52" width="70.28571428571429" height="26" rx="3"/><text class="sub" x="378.00000000000006" y="65.0" text-anchor="middle" dominant-baseline="central">4</text></g><rect x="417.14285714285717" y="52" width="70.28571428571429" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="452. height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="600.8571428571429" y="95.0" text-anchor="middle" dominant-baseline="central">6</text><rect x="120.0" y="112" width="70.28571428571429" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="155.14285714285714" y="125.0" text-anchor="middle" dominant-baseline="central">7</text><rect x="194.28571428571428" y="112" width="70.28571428571429" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="229.42857142857142" y="125.0" text-anchor="middle" dominant-baseline="central">8</text><g class="m"><rect x="268.57142857142856" y="112" width="70.28571428571429" height="26" rx="3"/><text class="sub" x="303.7142857142857" y="125.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="342.8571428571429" y="112" width="70.28571428571429" height="26" rx="3"/><text class="sub" x="378.00000000000006" y="125.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="m"><rect x="417.14285714285717" y="112" width="70.28571428571429" height="26" rx="3"/><text class="sub" x="452.28571428571433" y="125.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="m"><rect x="491.42857142857144" y="112" width="70.28571428571429" height="26" rx="3"/><text class="sub" x="526.5714285714286" y="125.0" text-anchor="middle" dominant-baseline="central">4</text></g><rect x="565.7142857142858" y="112" width="70.28571428571429" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="600.8571428571429" y="125.0" text-anchor="middle" dominant-baseline="central">9</text><rect x="120.0" y="142" width="70.28571428571429" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="155.14285714285714" y="155.0" text-anchor="middle" dominant-baseline="central">10</text><rect x="194.28571428571428" y="142" width="70.28571428571429" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="229.42857142857142" y="155.0" text-anchor="middle" dominant-baseline="central">11</text><rect x="268.57142857142856" y="142" width="70.28571428571429" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="303.7142857142857" y="155.0" text-anchor="middle" dominant-baseline="central">12</text><g class="m"><rect x="342.8571428571429" y="142" width="70.28571428571429" height="26" rx="3"/><text class="sub" x="378.00000000000006" y="155.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="417.14285714285717" y="142" width="70.28571428571429" height="26" rx="3"/><text class="sub" x="452.28571428571433" y="155.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="m"><rect x="491.42857142857144" y="142" width="70.28571428571429" height="26" rx="3"/><text class="sub" x="526.5714285714286" y="155.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="m"><rect x="565.7142857142858" y="142" width="70.28571428571429" height="26" rx="3"/><text class="sub" x="600.8571428571429" y="155.0" text-anchor="middle" dominant-baseline="central">4</text></g></g><text class="sub2" x="120" y="192" data-count="">each GPU: 4 busy slots of 7, so 3 idle: 42.9%</text><text class="sub2" x="120" y="212" data-formula="">(p − 1) ÷ (v·m + p − 1) = 3 ÷ 7 = 42.9%</text><text class="cap" x="40" y="260" text-anchor="start">Count the cells. Every microbatch must visit every stage, so each stage is busy m slots.</text><text class="cap" x="40" y="280" text-anchor="start">The last microbatch enters stage 1 in slot m and needs p − 1 more slots to reach the</text><text class="cap" x="40" y="300" text-anchor="start">last stage, so the run lasts m + p − 1 slots, and each stage is idle for p − 1 of them.</text><text class="cap" x="40" y="320" text-anchor="start">The idle share is (p − 1) ÷ (m + p − 1): 3 ÷ 7 = 43% for four stages and four</text><text class="cap" x="40" y="340" text-anchor="start">microbatches.</text><text class="cap" x="40" y="380" text-anchor="start">Filling and draining is a fixed cost, roughly one trip through the stages, while the</text><text class="cap" x="40" y="400" text-anchor="start">useful work grows with every extra microbatch. Give each GPU v chunks of layers and</text><text class="cap" x="40" y="420" text-anchor="start">every slot shrinks to 1/v: the run is v·m + p − 1 short slots, of which v·m are busy.</text><text class="cap" x="40" y="460" text-anchor="start">The chart is a slot-by-slot simulation of the schedule, and its count matches the</text><text class="cap" x="40" y="480" text-anchor="start">formula whenever there are at least as many microbatches as GPUs. Both were checked</text><text class="cap" x="40" y="500" text-anchor="start">against the same simulation in Python.</text></svg></div><figcaption>Dashed cells are idle and numbered; a prime marks a microbatch's second chunk. More microbatches never empty the fill and drain triangles, they only dilute them.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const C = {"W": 520, "X0": 120, "Y0": 52, "H": 116, "p0": 4, "m0": 4, "v0": 1};
  const sl = [...fig.querySelectorAll('input[type=range]')], val = [...fig.querySelectorAll('.val')];
  const q = s => fig.querySelector(s), NS = 'http://www.w3.org/2000/svg';
  const fmt = (v, d) => { const s = Math.abs(v).toFixed(d), [i, p] = s.split('.');
    return (v < 0 && +s !== 0 ? '−' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (p ? '.' + p : ''); };
  function simulate(p, m, v) {
    const done = new Map(), grid = Array.from({length: p}, () => []);
    let todo = [];
    for (let i = 0; i < m; i++) for (let r = 0; r < v; r++) for (let s = 0; s < p; s++) todo.push([i, r, s]);
    const key = (i, r, s) => `${i},${r},${s}`;
    let t = 0;
    while (todo.length) {
      const pick = [];
      for (let s = 0; s < p; s++) {
        let best = null;
        for (const k of todo) {
          if (k[2] !== s) continue;
          const d = s ? key(k[0], k[1], s - 1) : (k[1] ? key(k[0], k[1] - 1, p - 1) : null);
          if (d !== null && !(done.has(d) && done.get(d) <= t)) continue;
          if (!best || k[1] < best[1] || (k[1] === best[1] && k[0] < best[0])) best = k;
        }
        grid[s].push(best ? [best[0], best[1]] : null);
        if (best) pick.push(best);
      }
      for (const k of pick) { done.set(key(...k), t + 1); }
      todo = todo.filter(k => !pick.includes(k));
      t++;
    }
    return grid;
  }
  function el(tag, at, txt) { const e = document.createElementNS(NS, tag);
    for (const a in at) e.setAttribute(a, at[a]); if (txt !== undefined) e.textContent = txt; return e; }
  function draw() {
    const p = +sl[0].value, m = +sl[1].value, v = +sl[2].value;
    val[0].textContent = p; val[1].textContent = m; val[2].textContent = v;
    const g = simulate(p, m, v), T = g[0].length, slot = C.W / T, layer = q('[data-chart]');
    const ch = Math.min(26, Math.floor((C.H - (p - 1) * 4) / p));
    layer.replaceChildren();
    let k = 0;
    for (let s = 0; s < p; s++) {
      const y = C.Y0 + s * (ch + 4);
      layer.appendChild(el('text', {class: 'cap', x: 40, y: (y + ch / 2 + 4).toFixed(1)}, `GPU ${s + 1}`));
      for (let t = 0; t < T; t++) {
        const c = g[s][t], x = C.X0 + t * slot, w = Math.max(slot - (slot > 8 ? 4 : 1), 0.5);
        if (c === null) {
          k++;
          layer.appendChild(el('rect', {x: x.toFixed(1), y, width: w.toFixed(1), height: ch, rx: 3,
            fill: 'none', stroke: 'var(--rule)', 'stroke-width': 1, 'stroke-dasharray': '3 3'}));
          if (slot >= 18 && ch >= 16) layer.appendChild(el('text', {class: 'sub2', x: (x + w / 2).toFixed(1),
            y: (y + ch / 2).toFixed(1), 'text-anchor': 'middle', 'dominant-baseline': 'central'}, k));
        } else {
          const gr = el('g', {class: 'm'});
          gr.appendChild(el('rect', {x: x.toFixed(1), y, width: w.toFixed(1), height: ch, rx: slot > 8 ? 3 : 0}));
          if (slot >= 18 && ch >= 16) gr.appendChild(el('text', {class: 'sub', x: (x + w / 2).toFixed(1),
            y: (y + ch / 2).toFixed(1), 'text-anchor': 'middle', 'dominant-baseline': 'central'},
            c[0] + 1 + (c[1] ? '′'.repeat(c[1]) : '')));
          layer.appendChild(gr);
        }
      }
    }
    const busy = v * m, idle = T - busy, sim = idle / T, form = (p - 1) / (v * m + p - 1);
    q('[data-count]').textContent = `each GPU: ${busy} busy slots of ${T}, so ${idle} idle: ${fmt(100 * sim, 1)}%`;
    q('[data-formula]').textContent = `(p − 1) ÷ (v·m + p − 1) = ${p - 1} ÷ ${v * m + p - 1} = ${fmt(100 * form, 1)}%`
      + (Math.abs(sim - form) > 1e-12 ? ', but only when m ≥ p' : '');
  }
  sl.forEach(s => s.addEventListener('input', draw));
  q('button').addEventListener('click', () => { sl[0].value = C.p0; sl[1].value = C.m0; sl[2].value = C.v0; draw(); });
  draw();
})();</script></figure>
