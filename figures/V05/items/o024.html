<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 15:44</div><h3>Communication always takes its cut</h3><svg viewBox='0 0 680 422' role='img'><title>Communication always takes its cut</title><text class="cap" x="40" y="78" text-anchor="start">Ideal scaling</text><g class="u"><rect x="280" y="62" width="340" height="32" rx="3"/><text class="sub" x="450.0" y="78.0" text-anchor="middle" dominant-baseline="central">512 GPUs' worth of work</text></g><text class="cap" x="40" y="138" text-anchor="start">What was achieved</text><g class="s"><rect x="280" y="122" width="257.11137820512823" height="32" rx="3"/><text class="sub" x="408.5556891025641" y="138.0" text-anchor="middle" dominant-baseline="central">387 GPUs' worth, 75.6%</text></g><text class="cap" x="40" y="196" text-anchor="start">Even placed perfectly, more GPUs never buy a proportional speed-up. When Nvidia trained</text><text class="cap" x="40" y="216" text-anchor="start">Megatron-LM's 8.3-billion-parameter model across 512 V100 GPUs in 2019, tensor</text><text class="cap" x="40" y="236" text-anchor="start">parallelism eight ways and 64 data-parallel copies, it sustained 15.1 petaFLOPS against</text><text class="cap" x="40" y="256" text-anchor="start">39 teraFLOPS on one GPU: 15.1 ÷ (512 × 0.039) = 75.6%, which the paper reports as 76%.</text><text class="cap" x="40" y="276" text-anchor="start">That counted as a strong result.</text><text class="cap" x="40" y="316" text-anchor="start">Put another way, 512 GPUs did 387 GPUs' worth of work; the rest went to communication</text><text class="cap" x="40" y="336" text-anchor="start">and waiting. Communication always takes its cut.</text><text class="cap" x="40" y="376" text-anchor="start">At 1.6 trillion parameters, DeepSeek V4 Pro has no single-device fallback to compare</text><text class="cap" x="40" y="396" text-anchor="start">against. The communication map is the only way it runs.</text></svg><figcaption>Bars to scale. A calibration from training on 2019 hardware, not a law: three quarters of ideal was considered good, which says how much of the problem communication is.</figcaption></figure>
