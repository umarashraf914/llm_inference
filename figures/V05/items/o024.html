<figure><div class='ts'>Fig 24 &nbsp;&middot;&nbsp; 15:44</div><h3>What scaling actually delivers</h3><svg viewBox="0 0 680 362" role="img"><title>What scaling actually delivers</title><text class="cap" x="40" y="78" text-anchor="start">Ideal scaling</text><g class="u"><rect x="280" y="62" width="340" height="32" rx="3"></rect><text class="sub" x="450.0" y="78.0" text-anchor="middle" dominant-baseline="central">512 GPUs, 512x the throughput</text></g><text class="cap" x="40" y="138" text-anchor="start">What was achieved</text><g class="s"><rect x="280" y="122" width="255" height="32" rx="3"></rect><text class="sub" x="407.5" y="138.0" text-anchor="middle" dominant-baseline="central">about three quarters of it</text></g><text class="cap" x="40" y="200" text-anchor="start">Training an 8-billion-parameter model across 512 GPUs held about 75% of ideal throughput, and</text><text class="cap" x="40" y="220" text-anchor="start">that counted as a strong result.</text><text class="cap" x="40" y="260" text-anchor="start">Communication always takes its cut. More GPUs never buy proportional speed-up, even when every</text><text class="cap" x="40" y="280" text-anchor="start">strategy is placed perfectly.</text><text class="cap" x="40" y="320" text-anchor="start">At 1.6 trillion parameters there is no single-device fallback to compare against. The</text><text class="cap" x="40" y="340" text-anchor="start">communication map is the only way the model runs at all.</text></svg><figcaption>A useful calibration. Seventy-five percent efficiency at 512 devices is considered good, which tells you how much of the problem communication really is.</figcaption></figure>
