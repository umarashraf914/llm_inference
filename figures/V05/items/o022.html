<figure><div class='ts'>Fig 22 &nbsp;&middot;&nbsp; 13:40</div><h3>Why the ring scales</h3><svg viewBox="0 0 680 488" role="img"><title>Why the ring scales</title><text class="hd" x="40" y="46">The ring all-reduce runs in two halves</text><g class="m"><rect x="40" y="70" width="285" height="66" rx="8"></rect><text class="lbl" x="182.5" y="94.0" text-anchor="middle" dominant-baseline="central">Reduce-scatter</text><text class="sub" x="182.5" y="112.0" text-anchor="middle" dominant-baseline="central">every slice makes one lap, gathering</text></g><g class="s"><rect x="368" y="70" width="272" height="66" rx="8"></rect><text class="lbl" x="504.0" y="94.0" text-anchor="middle" dominant-baseline="central">All-gather</text><text class="sub" x="504.0" y="112.0" text-anchor="middle" dominant-baseline="central">the finished slices make one more</text></g><line class="conn" x1="331" y1="103" x2="362" y2="103" marker-end="url(#arw)"></line><text class="cap" x="40" y="186" text-anchor="start">The message is cut into one slice per GPU. After the first lap every GPU owns one slice of the</text><text class="cap" x="40" y="206" text-anchor="start">finished sum; after the second, everyone has all of them.</text><text class="hd" x="40" y="256">Now count what a single GPU sends</text><text class="cap" x="40" y="296" text-anchor="start">Ring of 8</text><g class="s"><rect x="220" y="280" width="300" height="30" rx="3"></rect><text class="sub" x="370.0" y="295.0" text-anchor="middle" dominant-baseline="central">about 1.75x the message size</text></g><text class="cap" x="40" y="346" text-anchor="start">Ring of 16,000</text><g class="s"><rect x="220" y="330" width="300" height="30" rx="3"></rect><text class="sub" x="370.0" y="345.0" text-anchor="middle" dominant-baseline="central">about 2.00x</text></g><text class="cap" x="40" y="406" text-anchor="start">A bigger ring means more steps but proportionally thinner slices, so the total barely moves.</text><text class="cap" x="40" y="446" text-anchor="start">And twice the message size is the floor: each GPU has to push its own data out and pull the</text><text class="cap" x="40" y="466" text-anchor="start">result back, so no algorithm can move less. Engineers call the ring bandwidth-optimal.</text></svg><figcaption>The surprising part is the independence from ring size. It is why tensor parallelism inside a node and gradient synchronisation across thousands of GPUs are both affordable.</figcaption></figure>
