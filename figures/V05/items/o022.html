<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 14:23</div><h3>Each GPU sends 2(N − 1)/N of the message: never quite twice</h3><svg viewBox='0 0 680 456' role='img'><title>Each GPU sends 2(N − 1)/N of the message: never quite twice</title><text class="hd" x="40" y="40">What one GPU sends, built term by term</text><g class="u"><rect x="40" y="58" width="104" height="32" rx="3"/><text class="sub" x="92.0" y="74.0" text-anchor="middle" dominant-baseline="central">N − 1 slices</text></g><text class="sub2" x="92.0" y="106" text-anchor="middle">reduce-scatter</text><text class="sub2" x="156.0" y="78" text-anchor="middle">+</text><g class="u"><rect x="168" y="58" width="104" height="32" rx="3"/><text class="sub" x="220.0" y="74.0" text-anchor="middle" dominant-baseline="central">N − 1 slices</text></g><text class="sub2" x="220.0" y="106" text-anchor="middle">all-gather</text><text class="sub2" x="284.0" y="78" text-anchor="middle">=</text><g class="m"><rect x="296" y="58" width="124" height="32" rx="3"/><text class="sub" x="358.0" y="74.0" text-anchor="middle" dominant-baseline="central">2(N − 1) slices</text></g><text class="sub2" x="358.0" y="106" text-anchor="middle">about two laps</text><text class="sub2" x="432.0" y="78" text-anchor="middle">×</text><g class="u"><rect x="444" y="58" width="80" height="32" rx="3"/><text class="sub" x="484.0" y="74.0" text-anchor="middle" dominant-baseline="central">S/N each</text></g><text class="sub2" x="484.0" y="106" text-anchor="middle">one slice</text><text class="sub2" x="532" y="78" text-anchor="start">=</text><g class="h"><rect x="546" y="58" width="94" height="32" rx="3"/><text class="sub" x="593.0" y="74.0" text-anchor="middle" dominant-baseline="central">2(N − 1)/N × S</text></g><text class="cap" x="40" y="152" text-anchor="start">four GPUs</text><rect x="160" y="134" width="240" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="160" y="134" width="180.0" height="26" rx="3"/></g><text class="sub2" x="412" y="152" text-anchor="start">6 × S/4 = 1.5 S</text><text class="cap" x="40" y="192" text-anchor="start">eight GPUs</text><rect x="160" y="174" width="240" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="160" y="174" width="210.0" height="26" rx="3"/></g><text class="sub2" x="412" y="192" text-anchor="start">14 × S/8 = 1.75 S</text><text class="cap" x="40" y="232" text-anchor="start">16,000 GPUs</text><rect x="160" y="214" width="240" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="160" y="214" width="239.985" height="26" rx="3"/></g><text class="sub2" x="412" y="232" text-anchor="start">31,998 × S/16,000 = 1.999875 S</text><text class="sub2" x="400" y="270" text-anchor="end">2 S</text><text class="cap" x="40" y="310" text-anchor="start">Now count what a single GPU sends. In the reduce-scatter it sends one slice per step for</text><text class="cap" x="40" y="330" text-anchor="start">N − 1 steps; in the all-gather, N − 1 more: 2(N − 1) slices, roughly two laps round the</text><text class="cap" x="40" y="350" text-anchor="start">ring. Each slice is one N-th of the message.</text><text class="cap" x="40" y="390" text-anchor="start">So every GPU sends 2(N − 1) × S/N = 2(N − 1)/N × S. A bigger ring means more steps but</text><text class="cap" x="40" y="410" text-anchor="start">proportionally thinner slices, so the total barely moves: every GPU sends about twice</text><text class="cap" x="40" y="430" text-anchor="start">the message whether the ring holds eight GPUs or 16,000, and never quite twice.</text></svg><figcaption>Bars to scale against a 2 S track. The surprising part is the independence from ring size: it is why tensor parallelism inside a node and gradient synchronisation across thousands of GPUs are both affordable.</figcaption></figure>
