<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:01</div><h3>Partial answers from different blocks merge exactly</h3><svg viewBox='0 0 680 484' role='img'><title>Partial answers from different blocks merge exactly</title><text class="hd" x="40" y="40">One query, four keys: two blocks on two GPUs, then merged</text><text class="sub2" x="340" y="66" text-anchor="middle">largest</text><text class="sub2" x="340" y="80" text-anchor="middle">score</text><text class="sub2" x="425" y="66" text-anchor="middle">weights</text><text class="sub2" x="425" y="80" text-anchor="middle">add to</text><text class="sub2" x="510" y="66" text-anchor="middle">weighted</text><text class="sub2" x="510" y="80" text-anchor="middle">sum</text><text class="sub2" x="595" y="66" text-anchor="middle">answer</text><text class="cap" x="40" y="108" text-anchor="start">block 1, on GPU 1</text><text class="sub2" x="40" y="124" text-anchor="start">scores 1, 3; values 10, 20</text><g class="m"><rect x="300" y="94" width="80" height="32" rx="3"/><text class="sub" x="340.0" y="110.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="m"><rect x="385" y="94" width="80" height="32" rx="3"/><text class="sub" x="425.0" y="110.0" text-anchor="middle" dominant-baseline="central">1.135</text></g><g class="m"><rect x="470" y="94" width="80" height="32" rx="3"/><text class="sub" x="510.0" y="110.0" text-anchor="middle" dominant-baseline="central">21.35</text></g><g class="m"><rect x="555" y="94" width="80" height="32" rx="3"/><text class="sub" x="595.0" y="110.0" text-anchor="middle" dominant-baseline="central">18.8080</text></g><text class="cap" x="40" y="158" text-anchor="start">block 2, on GPU 2</text><text class="sub2" x="40" y="174" text-anchor="start">scores 5, 2; values 30, 40</text><g class="m"><rect x="300" y="144" width="80" height="32" rx="3"/><text class="sub" x="340.0" y="160.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="m"><rect x="385" y="144" width="80" height="32" rx="3"/><text class="sub" x="425.0" y="160.0" text-anchor="middle" dominant-baseline="central">1.050</text></g><g class="m"><rect x="470" y="144" width="80" height="32" rx="3"/><text class="sub" x="510.0" y="160.0" text-anchor="middle" dominant-baseline="central">31.99</text></g><g class="m"><rect x="555" y="144" width="80" height="32" rx="3"/><text class="sub" x="595.0" y="160.0" text-anchor="middle" dominant-baseline="central">30.4743</text></g><text class="cap" x="40" y="208" text-anchor="start">merged</text><text class="sub2" x="40" y="224" text-anchor="start">block 1 × e^(3 − 5) = 0.135, then add</text><g class="s"><rect x="300" y="194" width="80" height="32" rx="3"/><text class="sub" x="340.0" y="210.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="s"><rect x="385" y="194" width="80" height="32" rx="3"/><text class="sub" x="425.0" y="210.0" text-anchor="middle" dominant-baseline="central">1.203</text></g><g class="s"><rect x="470" y="194" width="80" height="32" rx="3"/><text class="sub" x="510.0" y="210.0" text-anchor="middle" dominant-baseline="central">34.88</text></g><g class="s"><rect x="555" y="194" width="80" height="32" rx="3"/><text class="sub" x="595.0" y="210.0" text-anchor="middle" dominant-baseline="central">28.9847</text></g><text class="cap" x="40" y="258" text-anchor="start">one softmax over all four</text><text class="sub2" x="40" y="274" text-anchor="start">scores 1, 3, 5, 2; values 10…40</text><g class="u"><rect x="300" y="244" width="80" height="32" rx="3"/><text class="sub" x="340.0" y="260.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="u"><rect x="385" y="244" width="80" height="32" rx="3"/><text class="sub" x="425.0" y="260.0" text-anchor="middle" dominant-baseline="central">1.203</text></g><g class="u"><rect x="470" y="244" width="80" height="32" rx="3"/><text class="sub" x="510.0" y="260.0" text-anchor="middle" dominant-baseline="central">34.88</text></g><g class="u"><rect x="555" y="244" width="80" height="32" rx="3"/><text class="sub" x="595.0" y="260.0" text-anchor="middle" dominant-baseline="central">28.9847</text></g><text class="cap" x="40" y="318" text-anchor="start">Each GPU's pass over one block leaves three numbers per query: the largest score it saw,</text><text class="cap" x="40" y="338" text-anchor="start">the sum of its weights e^(score − largest), and the weighted sum of its values, the</text><text class="cap" x="40" y="358" text-anchor="start">online softmax of {{fig:v03-o057}}. Values here are single numbers; in a model they are</text><text class="cap" x="40" y="378" text-anchor="start">vectors, handled the same way.</text><text class="cap" x="40" y="418" text-anchor="start">Two partials merge by rescaling the one with the smaller maximum by e to the difference,</text><text class="cap" x="40" y="438" text-anchor="start">here e^(3 − 5) = 0.135, then adding. The result is identical to one softmax over all</text><text class="cap" x="40" y="458" text-anchor="start">four scores, the same exactness as {{fig:v03-o059}}.</text></svg><figcaption>Exact merging is what lets the blocks arrive in any order: each step folds its partial into a running total, so the ring never needs the whole sequence in one place.</figcaption></figure>
