<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 1:29</div><h3>The second pressure grows while the model runs</h3><svg viewBox='0 0 680 510' role='img'><title>The second pressure grows while the model runs</title><g class="m"><rect x="40" y="40" width="600" height="42" rx="6"/><text class="sub" x="340.0" y="61.0" text-anchor="middle" dominant-baseline="central">cache  =  2 × layers × KV heads × head size × bytes × tokens × requests</text></g><text class="hd" x="40" y="116">Two pressures, over one generation (schematic)</text><g class="h"><rect x="200" y="136" width="46" height="40" rx="3"/></g><g class="m"><rect x="200" y="228" width="46" height="8" rx="3"/></g><g class="h"><rect x="256" y="136" width="46" height="40" rx="3"/></g><g class="m"><rect x="256" y="220" width="46" height="16" rx="3"/></g><g class="h"><rect x="312" y="136" width="46" height="40" rx="3"/></g><g class="m"><rect x="312" y="212" width="46" height="24" rx="3"/></g><g class="h"><rect x="368" y="136" width="46" height="40" rx="3"/></g><g class="m"><rect x="368" y="204" width="46" height="32" rx="3"/></g><g class="h"><rect x="424" y="136" width="46" height="40" rx="3"/></g><g class="m"><rect x="424" y="196" width="46" height="40" rx="3"/></g><text class="cap" x="40" y="162" text-anchor="start">the weights</text><text class="cap" x="40" y="230" text-anchor="start">the KV cache</text><text class="sub2" x="486" y="162" text-anchor="start">fixed before anything runs</text><text class="sub2" x="486" y="230" text-anchor="start">one more token's worth per step</text><text class="sub2" x="223.0" y="256" text-anchor="middle">step 1</text><text class="sub2" x="279.0" y="256" text-anchor="middle">step 2</text><text class="sub2" x="335.0" y="256" text-anchor="middle">step 3</text><text class="sub2" x="391.0" y="256" text-anchor="middle">step 4</text><text class="sub2" x="447.0" y="256" text-anchor="middle">step 5</text><text class="cap" x="40" y="304" text-anchor="start">Each new token attends over every token before it, and that comparison needs a key and a</text><text class="cap" x="40" y="324" text-anchor="start">value for every earlier position at every layer ({{fig:v01-o136}}). Recomputing them at every</text><text class="cap" x="40" y="344" text-anchor="start">step would repeat nearly all the work of the steps before, so the model computes them</text><text class="cap" x="40" y="364" text-anchor="start">once and keeps them: the KV cache.</text><text class="cap" x="40" y="404" text-anchor="start">The cache grows with every token of context and every request in the batch, and</text><text class="cap" x="40" y="424" text-anchor="start">multiplies again across every layer of the model.</text><text class="cap" x="40" y="464" text-anchor="start">So two memory pressures force the split: the weights, too big before anything runs, and</text><text class="cap" x="40" y="484" text-anchor="start">the cache, which grows while it runs.</text></svg><figcaption>One is static and one is dynamic. Different strategies below answer each, which is why real deployments run several at once.</figcaption></figure>
