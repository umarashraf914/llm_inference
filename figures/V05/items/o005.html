<figure><div class='ts'>Fig 05 &nbsp;&middot;&nbsp; 1:26</div><h3>The second pressure: the KV cache</h3><svg viewBox="0 0 680 402" role="img"><title>The second pressure: the KV cache</title><g class="m"><rect x="40" y="46" width="600" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">cache = 2 x layers x batch x sequence x KV heads x head dim x bytes</text></g><text class="cap" x="40" y="122" text-anchor="start">Each new token attends over every token before it, and that needs a key and a value for every</text><text class="cap" x="40" y="142" text-anchor="start">earlier position, at every layer. Recomputing them each step would repeat nearly all the work of</text><text class="cap" x="40" y="162" text-anchor="start">the steps before, so the model computes them once and keeps them.</text><text class="cap" x="40" y="202" text-anchor="start">The cache grows with context length, with batch size, and again with every layer.</text><text class="cap" x="40" y="242" text-anchor="start">70B model, 16-bit cache</text><g class="h"><rect x="340" y="226" width="200" height="30" rx="3"></rect><text class="sub" x="440.0" y="241.0" text-anchor="middle" dominant-baseline="central">about 40 GB</text></g><text class="sub2" x="554" y="245" text-anchor="start">at 128k context</text><text class="cap" x="40" y="300" text-anchor="start">That is one request. At long context the cache reaches the size of the weights themselves, and a</text><text class="cap" x="40" y="320" text-anchor="start">million-token sequence overflows a GPU on its own.</text><text class="cap" x="40" y="360" text-anchor="start">So there are two independent memory pressures forcing the split: the weights, which are too big</text><text class="cap" x="40" y="380" text-anchor="start">before anything runs, and the cache, which grows while it runs.</text></svg><figcaption>One is static and one is dynamic. Different strategies below address each, which is why real deployments run several at once.</figcaption></figure>
