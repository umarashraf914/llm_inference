<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 10:37</div><h3>Across nodes, the shuffling can take over</h3><svg viewBox='0 0 680 322' role='img'><title>Across nodes, the shuffling can take over</title><text class="cap" x="40" y="78" text-anchor="start">Time inside a MoE layer</text><rect x="300" y="62" width="320" height="32" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="300" y="62" width="224.0" height="32" rx="3"/><text class="sub" x="412.0" y="78.0" text-anchor="middle" dominant-baseline="central">over 70% shuffling</text></g><text class="cap" x="40" y="138" text-anchor="start">End-to-end inference latency</text><rect x="300" y="122" width="320" height="32" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="h"><rect x="300" y="122" width="128.0" height="32" rx="3"/><text class="sub" x="364.0" y="138.0" text-anchor="middle" dominant-baseline="central">around 40%</text></g><text class="cap" x="40" y="196" text-anchor="start">Measured across nodes, the two all-to-alls can eat over 70% of a MoE layer's time and</text><text class="cap" x="40" y="216" text-anchor="start">around 40% of end-to-end inference latency. The expert mathematics is not the</text><text class="cap" x="40" y="236" text-anchor="start">bottleneck; moving tokens to the experts is.</text><text class="cap" x="40" y="276" text-anchor="start">That is why DeepSeek built DeepEP, an all-to-all library that exists just for dispatch</text><text class="cap" x="40" y="296" text-anchor="start">and combine.</text></svg><figcaption>Measurements, not a law: the share depends on the system. A strategy whose communication can outweigh its computation has to be placed very carefully.</figcaption></figure>
