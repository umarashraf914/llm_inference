<figure><div class='ts'>Fig 17 &nbsp;&middot;&nbsp; 10:20</div><h3>How much the shuffling takes over</h3><svg viewBox="0 0 680 362" role="img"><title>How much the shuffling takes over</title><text class="cap" x="40" y="78" text-anchor="start">Time inside a MoE layer</text><g class="h"><rect x="300" y="62" width="236" height="32" rx="3"></rect><text class="sub" x="418.0" y="78.0" text-anchor="middle" dominant-baseline="central">over 70% shuffling</text></g><rect x="300" y="62" width="320" height="32" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="cap" x="40" y="138" text-anchor="start">End-to-end inference latency</text><g class="h"><rect x="300" y="122" width="128" height="32" rx="3"></rect><text class="sub" x="364.0" y="138.0" text-anchor="middle" dominant-baseline="central">around 40%</text></g><rect x="300" y="122" width="320" height="32" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="cap" x="40" y="200" text-anchor="start">Measured across nodes. The expert mathematics is not the bottleneck. Moving tokens to the</text><text class="cap" x="40" y="220" text-anchor="start">experts is.</text><text class="cap" x="40" y="260" text-anchor="start">That is why DeepSeek built a dedicated all-to-all library that exists for nothing but dispatch</text><text class="cap" x="40" y="280" text-anchor="start">and combine.</text><text class="cap" x="40" y="320" text-anchor="start">It also explains why expert parallelism suffers the moment it spills past the NVLink domain:</text><text class="cap" x="40" y="340" text-anchor="start">the traffic it generates is exactly the kind that cannot afford the slow boundary.</text></svg><figcaption>A striking measurement. A strategy whose communication dominates its computation is one that has to be placed very carefully.</figcaption></figure>
