<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 10:02</div><h3>Most of a token's six experts live on other GPUs</h3><svg viewBox='0 0 680 428' role='img'><title>Most of a token's six experts live on other GPUs</title><text class="hd" x="40" y="40">Expected experts at home, of a token's six, if routing were even</text><text class="cap" x="40" y="76" text-anchor="start">group of 2 GPUs</text><rect x="190" y="58" width="300" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="190" y="58" width="150.0" height="26" rx="3"/></g><text class="sub2" x="502" y="76" text-anchor="start">3.00 home, 50.0% leave</text><text class="cap" x="40" y="116" text-anchor="start">group of 4 GPUs</text><rect x="190" y="98" width="300" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="190" y="98" width="75.0" height="26" rx="3"/></g><text class="sub2" x="502" y="116" text-anchor="start">1.50 home, 75.0% leave</text><text class="cap" x="40" y="156" text-anchor="start">group of 8 GPUs</text><rect x="190" y="138" width="300" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="190" y="138" width="37.5" height="26" rx="3"/></g><text class="sub2" x="502" y="156" text-anchor="start">0.75 home, 87.5% leave</text><text class="cap" x="40" y="196" text-anchor="start">group of 16 GPUs</text><rect x="190" y="178" width="300" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="190" y="178" width="18.75" height="26" rx="3"/></g><text class="sub2" x="502" y="196" text-anchor="start">0.38 home, 93.8% leave</text><text class="cap" x="40" y="236" text-anchor="start">group of 64 GPUs</text><rect x="190" y="218" width="300" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="s"><rect x="190" y="218" width="4.6875" height="26" rx="3"/></g><text class="sub2" x="502" y="236" text-anchor="start">0.09 home, 98.4% leave</text><text class="cap" x="40" y="282" text-anchor="start">Spread the experts evenly over the G GPUs of an expert-parallel group. If every expert</text><text class="cap" x="40" y="302" text-anchor="start">were equally likely, each of a token's six would sit on the token's own GPU with chance</text><text class="cap" x="40" y="322" text-anchor="start">1/G, so on average 6/G of them stay home and the share 1 − 1/G must travel.</text><text class="cap" x="40" y="362" text-anchor="start">In a group of two, three of six stay home: the couple that might live on this chip. In a</text><text class="cap" x="40" y="382" text-anchor="start">group of eight, three quarters of one; in sixty-four, almost none. The chance that all</text><text class="cap" x="40" y="402" text-anchor="start">six are local in a group of eight is 2.9 in a million.</text></svg><figcaption>Bars to scale against six. Real routers are uneven ({{ref:v06-o017}}), but either way nearly every token leaves home, and the all-to-all is how it travels.</figcaption></figure>
