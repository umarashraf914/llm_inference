<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:15</div><h3>The bend decides the order: columns first, rows second</h3><svg viewBox='0 0 680 618' role='img'><title>The bend decides the order: columns first, rows second</title><text class="hd" x="40" y="40">Two ways to split A, for the same x and A</text><text class="cap" x="40" y="66" text-anchor="start">A split by rows</text><text class="cap" x="360" y="66" text-anchor="start">A split by columns</text><g class="u"><rect x="40" y="78" width="280" height="44" rx="4"/><text class="sub" x="180.0" y="92.0" text-anchor="middle" dominant-baseline="central">each GPU takes one number of x</text><text class="sub" x="180.0" y="108.0" text-anchor="middle" dominant-baseline="central">and the matching row of A</text></g><line class="conn" x1="180" y1="124" x2="180" y2="134" marker-end="url(#arw)"/><g class="m"><rect x="40" y="136" width="280" height="44" rx="4"/><text class="sub" x="180.0" y="150.0" text-anchor="middle" dominant-baseline="central">two full-length partials:</text><text class="sub" x="180.0" y="166.0" text-anchor="middle" dominant-baseline="central">[1 0 2 1] and [0 2 2 6]</text></g><line class="conn" x1="180" y1="182" x2="180" y2="192" marker-end="url(#arw)"/><g class="h"><rect x="40" y="194" width="280" height="44" rx="4"/><text class="sub" x="180.0" y="208.0" text-anchor="middle" dominant-baseline="central">bend each partial, then add:</text><text class="sub" x="180.0" y="224.0" text-anchor="middle" dominant-baseline="central">[0.84 1.95 3.91 6.84]</text></g><line class="conn" x1="180" y1="240" x2="180" y2="250" marker-end="url(#arw)"/><g class="h"><rect x="40" y="252" width="280" height="44" rx="4"/><text class="sub" x="180.0" y="266.0" text-anchor="middle" dominant-baseline="central">but the bend of the true sum [1 2 4 7]</text><text class="sub" x="180.0" y="282.0" text-anchor="middle" dominant-baseline="central">is [0.84 1.95 4.00 7.00]: wrong</text></g><line class="conn" x1="180" y1="298" x2="180" y2="308" marker-end="url(#arw)"/><g class="h"><rect x="40" y="310" width="280" height="44" rx="4"/><text class="sub" x="180.0" y="324.0" text-anchor="middle" dominant-baseline="central">so add before bending:</text><text class="sub" x="180.0" y="340.0" text-anchor="middle" dominant-baseline="central">an extra all-reduce, two per block</text></g><g class="u"><rect x="360" y="78" width="280" height="44" rx="4"/><text class="sub" x="500.0" y="92.0" text-anchor="middle" dominant-baseline="central">each GPU takes two whole columns</text><text class="sub" x="500.0" y="108.0" text-anchor="middle" dominant-baseline="central">of A, and a copy of x</text></g><line class="conn" x1="500" y1="124" x2="500" y2="134" marker-end="url(#arw)"/><g class="m"><rect x="360" y="136" width="280" height="44" rx="4"/><text class="sub" x="500.0" y="150.0" text-anchor="middle" dominant-baseline="central">whole outputs:</text><text class="sub" x="500.0" y="166.0" text-anchor="middle" dominant-baseline="central">[1 2] on GPU 1, [4 7] on GPU 2</text></g><line class="conn" x1="500" y1="182" x2="500" y2="192" marker-end="url(#arw)"/><g class="s"><rect x="360" y="194" width="280" height="44" rx="4"/><text class="sub" x="500.0" y="208.0" text-anchor="middle" dominant-baseline="central">bend them where they are:</text><text class="sub" x="500.0" y="224.0" text-anchor="middle" dominant-baseline="central">[0.84 1.95] and [4.00 7.00]</text></g><line class="conn" x1="500" y1="240" x2="500" y2="250" marker-end="url(#arw)"/><g class="s"><rect x="360" y="252" width="280" height="44" rx="4"/><text class="sub" x="500.0" y="266.0" text-anchor="middle" dominant-baseline="central">then B split by rows: partials</text><text class="sub" x="500.0" y="282.0" text-anchor="middle" dominant-baseline="central">added once, at the end</text></g><line class="conn" x1="500" y1="298" x2="500" y2="308" marker-end="url(#arw)"/><g class="s"><rect x="360" y="310" width="280" height="44" rx="4"/><text class="sub" x="500.0" y="332.0" text-anchor="middle" dominant-baseline="central">one all-reduce per block</text></g><g class="u"><rect x="40" y="380" width="600" height="30" rx="3"/><text class="sub" x="340.0" y="395.0" text-anchor="middle" dominant-baseline="central">GELU(1) + GELU(6) = 0.84 + 6.00 = 6.84, but GELU(1 + 6) = GELU(7) = 7.00</text></g><text class="cap" x="40" y="452" text-anchor="start">Split A by rows and each GPU's partial is full length but incomplete, so the bend lands</text><text class="cap" x="40" y="472" text-anchor="start">on the wrong numbers: in position 4, GPU 1 bends its 1 and GPU 2 bends its 6, but the</text><text class="cap" x="40" y="492" text-anchor="start">bend belongs on 7. The partials would have to be added first, a second exchange in every</text><text class="cap" x="40" y="512" text-anchor="start">block.</text><text class="cap" x="40" y="552" text-anchor="start">Split A by columns and each GPU holds whole numbers, ready to bend where they are.</text><text class="cap" x="40" y="572" text-anchor="start">Megatron-LM's paper makes exactly this argument: GELU(X₁A₁ + X₂A₂) is not GELU(X₁A₁) +</text><text class="cap" x="40" y="592" text-anchor="start">GELU(X₂A₂), so the first matrix is split by columns and the second by rows.</text></svg><figcaption>The order is forced, not a matter of style. Split A any other way and the bend needs the whole sum first, which costs a second exchange per block.</figcaption></figure>
