<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:19</div><h3>Training copies must agree on every nudge; serving copies have none</h3><svg viewBox='0 0 680 788' role='img'><title>Training copies must agree on every nudge; serving copies have none</title><text class="cap" x="40" y="46" text-anchor="start">Training, both copies starting from w = 0.50</text><text class="cap" x="380" y="46" text-anchor="start">Serving</text><g class="u"><rect x="40" y="58" width="300" height="44" rx="4"/><text class="sub" x="190.0" y="72.0" text-anchor="middle" dominant-baseline="central">copy 1 sees batch A</text><text class="sub" x="190.0" y="88.0" text-anchor="middle" dominant-baseline="central">its nudge for one weight w: −0.02</text></g><line class="conn" x1="190.0" y1="104" x2="190.0" y2="114" marker-end="url(#arw)"/><g class="u"><rect x="40" y="116" width="300" height="44" rx="4"/><text class="sub" x="190.0" y="130.0" text-anchor="middle" dominant-baseline="central">copy 2 sees batch B</text><text class="sub" x="190.0" y="146.0" text-anchor="middle" dominant-baseline="central">its nudge for the same w: +0.04</text></g><line class="conn" x1="190.0" y1="162" x2="190.0" y2="172" marker-end="url(#arw)"/><g class="h"><rect x="40" y="174" width="300" height="44" rx="4"/><text class="sub" x="190.0" y="188.0" text-anchor="middle" dominant-baseline="central">applied separately, the copies drift:</text><text class="sub" x="190.0" y="204.0" text-anchor="middle" dominant-baseline="central">w = 0.48 on one, 0.54 on the other</text></g><line class="conn" x1="190.0" y1="220" x2="190.0" y2="230" marker-end="url(#arw)"/><g class="s"><rect x="40" y="232" width="300" height="44" rx="4"/><text class="sub" x="190.0" y="246.0" text-anchor="middle" dominant-baseline="central">averaged first: (−0.02 + 0.04) ÷ 2 = +0.01</text><text class="sub" x="190.0" y="262.0" text-anchor="middle" dominant-baseline="central">both copies: w = 0.51</text></g><line class="conn" x1="190.0" y1="278" x2="190.0" y2="288" marker-end="url(#arw)"/><g class="h"><rect x="40" y="290" width="300" height="44" rx="4"/><text class="sub" x="190.0" y="304.0" text-anchor="middle" dominant-baseline="central">one number for every weight, every step:</text><text class="sub" x="190.0" y="320.0" text-anchor="middle" dominant-baseline="central">an all-reduce of 140 GB</text></g><g class="u"><rect x="380" y="58" width="260" height="44" rx="4"/><text class="sub" x="510.0" y="72.0" text-anchor="middle" dominant-baseline="central">copy 1 answers request A</text><text class="sub" x="510.0" y="88.0" text-anchor="middle" dominant-baseline="central">no weight changes</text></g><line class="conn" x1="510.0" y1="104" x2="510.0" y2="114" marker-end="url(#arw)"/><g class="u"><rect x="380" y="116" width="260" height="44" rx="4"/><text class="sub" x="510.0" y="130.0" text-anchor="middle" dominant-baseline="central">copy 2 answers request B</text><text class="sub" x="510.0" y="146.0" text-anchor="middle" dominant-baseline="central">no weight changes</text></g><line class="conn" x1="510.0" y1="162" x2="510.0" y2="172" marker-end="url(#arw)"/><g class="s"><rect x="380" y="174" width="260" height="44" rx="4"/><text class="sub" x="510.0" y="188.0" text-anchor="middle" dominant-baseline="central">nothing to average</text><text class="sub" x="510.0" y="204.0" text-anchor="middle" dominant-baseline="central">0 bytes exchanged</text></g><text class="hd" x="40" y="370">What each GPU sends per training step, with the ring of Part 8</text><text class="cap" x="40" y="404" text-anchor="start">a group of 8</text><g class="h"><rect x="230" y="386" width="343.0" height="26" rx="3"/><text class="sub" x="401.5" y="399.0" text-anchor="middle" dominant-baseline="central">245 GB</text></g><text class="cap" x="40" y="440" text-anchor="start">a group of 16,000</text><g class="h"><rect x="230" y="422" width="391.9755" height="26" rx="3"/><text class="sub" x="425.98775" y="435.0" text-anchor="middle" dominant-baseline="central">280 GB</text></g><text class="cap" x="40" y="476" text-anchor="start">serving</text><text class="sub2" x="230" y="476" text-anchor="start">0 bytes</text><text class="cap" x="40" y="522" text-anchor="start">Training nudges every weight a little after each batch ({{fig:v01-o003}}), by an amount set by</text><text class="cap" x="40" y="542" text-anchor="start">its gradient: how fast the error changes as that weight moves. Two copies that see</text><text class="cap" x="40" y="562" text-anchor="start">different batches compute different nudges, and if each applied its own, the copies</text><text class="cap" x="40" y="582" text-anchor="start">would drift apart. So the nudges are averaged across every copy and the average applied</text><text class="cap" x="40" y="602" text-anchor="start">everywhere: an all-reduce of one number per weight at every step, 140 GB for a</text><text class="cap" x="40" y="622" text-anchor="start">70-billion-parameter model at two bytes each.</text><text class="cap" x="40" y="662" text-anchor="start">With the ring all-reduce ({{fig:v05-o022}}) each GPU sends 2 × 7/8 × 140 = 245 GB per step in a</text><text class="cap" x="40" y="682" text-anchor="start">group of eight, approaching 280 GB in a very large one. If you know data parallelism</text><text class="cap" x="40" y="702" text-anchor="start">from training, that is the heavy coordination bill you would expect here.</text><text class="cap" x="40" y="742" text-anchor="start">But inference computes no gradients. There is nothing to synchronise, so the replicas</text><text class="cap" x="40" y="762" text-anchor="start">never exchange a byte.</text></svg><figcaption>Bars to scale. This is the bill a training intuition expects and serving never pays: the all-reduce exists to keep learning copies identical, and a serving copy never learns.</figcaption></figure>
