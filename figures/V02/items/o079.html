<figure><div class='ts'>Fig 79 &nbsp;&middot;&nbsp; 14:16</div><h3>What the instruction actually does</h3><svg viewBox='0 0 680 364' role="img"><title>What the instruction actually does</title><text class="hd" x="40" y="46">One matrix multiply accumulate instruction</text><g class="s"><rect x="60" y="70" width="110" height="110" rx="4"></rect><text class="sub" x="115.0" y="125.0" text-anchor="middle" dominant-baseline="central">A tile</text></g><text class="hd" x="182" y="128" text-anchor="start">x</text><g class="s"><rect x="206" y="70" width="110" height="110" rx="4"></rect><text class="sub" x="261.0" y="125.0" text-anchor="middle" dominant-baseline="central">B tile</text></g><text class="hd" x="328" y="128" text-anchor="start">+</text><g class="u"><rect x="352" y="70" width="110" height="110" rx="4"></rect><text class="sub" x="407.0" y="125.0" text-anchor="middle" dominant-baseline="central">C tile</text></g><text class="hd" x="474" y="128" text-anchor="start">=</text><g class="m"><rect x="498" y="70" width="110" height="110" rx="4"></rect><text class="sub" x="553.0" y="125.0" text-anchor="middle" dominant-baseline="central">D tile</text></g><text class="cap" x="40" y="220" text-anchor="start">All four operands are small matrices. The instruction issues once and the hardware</text><text class="cap" x="40" y="240" text-anchor="start">performs every multiply and add inside the tile. In the older warp-wide form the</text><text class="cap" x="40" y="260" text-anchor="start">operands sit in registers; Hopper's newer form can read A and B straight from shared</text><text class="cap" x="40" y="280" text-anchor="start">memory.</text><text class="cap" x="40" y="320" text-anchor="start">The accumulator, C and then D, is usually kept at higher precision than A and B, so that</text><text class="cap" x="40" y="340" text-anchor="start">a long chain of accumulations does not lose information.</text></svg><figcaption>One instruction, thousands of multiply-adds: a warp's 16 × 8 × 16 step is 2,048. That density is why four tensor cores outproduce 128 scalar cores more than sevenfold at 16 bits.</figcaption></figure>
