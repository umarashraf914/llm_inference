<figure><div class='ts'>Fig 11 &nbsp;&middot;&nbsp; 0:49</div><h3>The three questions</h3><svg viewBox="0 0 680 236" role="img"><title>The three questions</title><g class="u"><rect x="40" y="50" width="190" height="88" rx="8"></rect><text class="lbl" x="135.0" y="85.0" text-anchor="middle" dominant-baseline="central">Why so different</text><text class="sub" x="135.0" y="103.0" text-anchor="middle" dominant-baseline="central">from a laptop CPU?</text></g><g class="u"><rect x="245" y="50" width="190" height="88" rx="8"></rect><text class="lbl" x="340.0" y="77.0" text-anchor="middle" dominant-baseline="central">Why is a byte</text><text class="sub" x="340.0" y="95.0" text-anchor="middle" dominant-baseline="central">so expensive</text><text class="sub" x="340.0" y="112.0" text-anchor="middle" dominant-baseline="central">next to an operation?</text></g><g class="u"><rect x="450" y="50" width="190" height="88" rx="8"></rect><text class="lbl" x="545.0" y="77.0" text-anchor="middle" dominant-baseline="central">What can the</text><text class="sub" x="545.0" y="95.0" text-anchor="middle" dominant-baseline="central">hardware do</text><text class="sub" x="545.0" y="112.0" text-anchor="middle" dominant-baseline="central">to fight back?</text></g><text class="cap" x="40" y="178" text-anchor="start">Parts 3 to 5 answer the first. Part 2 and the memory ladder answer the second.</text><text class="cap" x="40" y="206" text-anchor="start">Latency hiding, coalescing, tensor cores and lower precision answer the third.</text></svg><figcaption>The structure of everything below. Holding these three in mind makes the ordering feel inevitable rather than arbitrary.</figcaption></figure>
