<figure><div class='ts'>Fig 75 &nbsp;&middot;&nbsp; 13:23</div><h3>The 295, decomposed</h3><svg viewBox="0 0 680 318" role="img"><title>The 295, decomposed</title><g class="m"><rect x="70" y="50" width="240" height="74" rx="8"></rect><text class="lbl" x="190.0" y="78.0" text-anchor="middle" dominant-baseline="central">Tensor cores</text><text class="sub" x="190.0" y="96.0" text-anchor="middle" dominant-baseline="central">989 trillion ops/s</text></g><g class="h"><rect x="370" y="50" width="240" height="74" rx="8"></rect><text class="lbl" x="490.0" y="78.0" text-anchor="middle" dominant-baseline="central">HBM</text><text class="sub" x="490.0" y="96.0" text-anchor="middle" dominant-baseline="central">3.35 TB/s</text></g><text class="sub2" x="340" y="152" text-anchor="middle">divided</text><line class="conn" x1="190" y1="128" x2="300" y2="168" marker-end="url(#arw)"></line><line class="conn" x1="490" y1="128" x2="380" y2="168" marker-end="url(#arw)"></line><g class="u"><rect x="190" y="172" width="300" height="62" rx="8"></rect><text class="lbl" x="340.0" y="194.0" text-anchor="middle" dominant-baseline="central">295 operations per byte</text><text class="sub" x="340.0" y="212.0" text-anchor="middle" dominant-baseline="central">the ridge point on the H100</text></g><text class="cap" x="40" y="276" text-anchor="start">Below 295, memory bound. Above it, compute bound. The tensor cores set the compute ceiling and</text><text class="cap" x="40" y="296" text-anchor="start">HBM sets the bandwidth roof; the ridge is simply the two divided.</text></svg><figcaption>A workload must perform roughly three hundred operations for every byte it fetches just to break even on an H100.</figcaption></figure>
