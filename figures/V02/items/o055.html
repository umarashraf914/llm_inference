<figure><div class='ts'>Fig 55 &nbsp;&middot;&nbsp; 9:13</div><h3>What hiding a wait means</h3><svg viewBox="0 0 680 406" role="img"><title>What hiding a wait means</title><text class="hd" x="40" y="46">Hiding a wait, away from computers</text><text class="cap" x="40" y="92" text-anchor="start">One cook</text><text class="sub2" x="40" y="112" text-anchor="start">waits for the oven</text><g class="m"><rect x="230" y="76" width="60" height="30" rx="3"></rect><text class="sub" x="260.0" y="91.0" text-anchor="middle" dominant-baseline="central">prep</text></g><rect x="296" y="76" width="280" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="436.0" y="91.0" text-anchor="middle" dominant-baseline="central">stands there watching it</text><text class="cap" x="40" y="172" text-anchor="start">One cook</text><text class="sub2" x="40" y="192" text-anchor="start">with other dishes</text><g class="m"><rect x="230" y="156" width="60" height="30" rx="3"></rect><text class="sub" x="260.0" y="171.0" text-anchor="middle" dominant-baseline="central">prep</text></g><g class="s"><rect x="296" y="156" width="88" height="30" rx="3"></rect><text class="sub" x="340.0" y="171.0" text-anchor="middle" dominant-baseline="central">dish 2</text></g><g class="s"><rect x="390" y="156" width="88" height="30" rx="3"></rect><text class="sub" x="434.0" y="171.0" text-anchor="middle" dominant-baseline="central">dish 3</text></g><g class="s"><rect x="484" y="156" width="92" height="30" rx="3"></rect><text class="sub" x="530.0" y="171.0" text-anchor="middle" dominant-baseline="central">dish 4</text></g><text class="cap" x="40" y="252" text-anchor="start">The oven takes the same time either way. What changes is whether the cook is idle while it</text><text class="cap" x="40" y="272" text-anchor="start">runs.</text><text class="cap" x="40" y="308" text-anchor="start">Nothing was made faster. The wait was covered with other work, and that is the whole of what</text><text class="cap" x="40" y="328" text-anchor="start">latency hiding means.</text><text class="cap" x="40" y="364" text-anchor="start">It only works if there are other dishes. A cook with one order can do nothing but wait, which</text><text class="cap" x="40" y="384" text-anchor="start">is precisely the situation a single decode request puts the chip in.</text></svg><figcaption>The whole strategy in a kitchen. The last line is the limitation, and it is the reason the series does not end here.</figcaption></figure>
