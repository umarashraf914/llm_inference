<figure><div class='ts'>Fig 55 &nbsp;&middot;&nbsp; 9:13</div><h3>What hiding a wait means</h3><svg viewBox='0 0 680 416' role="img"><title>What hiding a wait means</title><text class="hd" x="40" y="46">Hiding a wait, away from computers</text><text class="cap" x="40" y="92" text-anchor="start">One cook</text><text class="sub2" x="40" y="112" text-anchor="start">waits for the oven</text><g class="m"><rect x="230" y="76" width="60" height="30" rx="3"></rect><text class="sub" x="260.0" y="91.0" text-anchor="middle" dominant-baseline="central">prep</text></g><rect x="296" y="76" width="280" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="436.0" y="91.0" text-anchor="middle" dominant-baseline="central">stands there watching it</text><text class="cap" x="40" y="172" text-anchor="start">One cook</text><text class="sub2" x="40" y="192" text-anchor="start">with other dishes</text><g class="m"><rect x="230" y="156" width="60" height="30" rx="3"></rect><text class="sub" x="260.0" y="171.0" text-anchor="middle" dominant-baseline="central">prep</text></g><g class="s"><rect x="296" y="156" width="88" height="30" rx="3"></rect><text class="sub" x="340.0" y="171.0" text-anchor="middle" dominant-baseline="central">dish 2</text></g><g class="s"><rect x="390" y="156" width="88" height="30" rx="3"></rect><text class="sub" x="434.0" y="171.0" text-anchor="middle" dominant-baseline="central">dish 3</text></g><g class="s"><rect x="484" y="156" width="92" height="30" rx="3"></rect><text class="sub" x="530.0" y="171.0" text-anchor="middle" dominant-baseline="central">dish 4</text></g><text class="cap" x="40" y="252" text-anchor="start">The oven takes the same time either way. What changes is whether the cook is idle while</text><text class="cap" x="40" y="272" text-anchor="start">it runs.</text><text class="cap" x="40" y="312" text-anchor="start">Nothing was made faster. The wait was covered with other work, and that is the whole of</text><text class="cap" x="40" y="332" text-anchor="start">what latency hiding means.</text><text class="cap" x="40" y="372" text-anchor="start">It only works if there are other dishes. On this chip they are other warps, and a large</text><text class="cap" x="40" y="392" text-anchor="start">matrix multiply supplies thousands of them.</text></svg><figcaption>The whole strategy in a kitchen. Notice what it does not do: no dish cooks faster, and no fewer trips are made to the oven, so it cannot help work that is short of bandwidth.</figcaption></figure>
