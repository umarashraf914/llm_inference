<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 2:12</div><h3>Hopper is the design, H100 is the chip, NVL72 is the rack</h3><svg viewBox='0 0 680 496' role='img'><title>Hopper is the design, H100 is the chip, NVL72 is the rack</title><text class="hd" x="40" y="46">A design, the chips built to it, and the boxes that hold them</text><text class="sub2" x="40" y="78" text-anchor="start">architecture, year</text><text class="sub2" x="224" y="78" text-anchor="start">chips</text><text class="sub2" x="388" y="78" text-anchor="start">systems</text><g class="u"><rect x="40" y="92" width="160" height="34" rx="6"/><text class="sub" x="120.0" y="109.0" text-anchor="middle" dominant-baseline="central">Volta, 2017</text></g><line class="conn" x1="202" y1="109" x2="220" y2="109" marker-end="url(#arw)"/><g class="u"><rect x="224" y="92" width="140" height="34" rx="6"/><text class="sub" x="294.0" y="109.0" text-anchor="middle" dominant-baseline="central">V100</text></g><g class="u"><rect x="40" y="140" width="160" height="34" rx="6"/><text class="sub" x="120.0" y="157.0" text-anchor="middle" dominant-baseline="central">Ampere, 2020</text></g><line class="conn" x1="202" y1="157" x2="220" y2="157" marker-end="url(#arw)"/><g class="u"><rect x="224" y="140" width="140" height="34" rx="6"/><text class="sub" x="294.0" y="157.0" text-anchor="middle" dominant-baseline="central">A100</text></g><line class="conn" x1="366" y1="157" x2="384" y2="157" marker-end="url(#arw)"/><g class="u"><rect x="388" y="140" width="252" height="34" rx="6"/><text class="sub" x="514.0" y="157.0" text-anchor="middle" dominant-baseline="central">DGX: 8 GPUs, one NVLink domain</text></g><g class="m"><rect x="40" y="188" width="160" height="34" rx="6"/><text class="sub" x="120.0" y="205.0" text-anchor="middle" dominant-baseline="central">Hopper, 2022</text></g><line class="conn" x1="202" y1="205" x2="220" y2="205" marker-end="url(#arw)"/><g class="m"><rect x="224" y="188" width="140" height="34" rx="6"/><text class="sub" x="294.0" y="205.0" text-anchor="middle" dominant-baseline="central">H100, H200</text></g><line class="conn" x1="366" y1="205" x2="384" y2="205" marker-end="url(#arw)"/><g class="u"><rect x="388" y="188" width="252" height="34" rx="6"/><text class="sub" x="514.0" y="205.0" text-anchor="middle" dominant-baseline="central">DGX: 8 GPUs, one NVLink domain</text></g><g class="u"><rect x="40" y="236" width="160" height="34" rx="6"/><text class="sub" x="120.0" y="253.0" text-anchor="middle" dominant-baseline="central">Blackwell, 2024</text></g><line class="conn" x1="202" y1="253" x2="220" y2="253" marker-end="url(#arw)"/><g class="u"><rect x="224" y="236" width="140" height="34" rx="6"/><text class="sub" x="294.0" y="253.0" text-anchor="middle" dominant-baseline="central">B200, GB200</text></g><line class="conn" x1="366" y1="253" x2="384" y2="253" marker-end="url(#arw)"/><g class="u"><rect x="388" y="236" width="252" height="34" rx="6"/><text class="sub" x="514.0" y="253.0" text-anchor="middle" dominant-baseline="central">GB200 NVL72: 72 GPUs in one rack</text></g><text class="sub2" x="40" y="292" text-anchor="start">gold: Hopper and the H100, the chip used throughout this atlas</text><text class="cap" x="40" y="332" text-anchor="start">An architecture is a design: how a multiprocessor is laid out, which number formats its</text><text class="cap" x="40" y="352" text-anchor="start">tensor cores accept. Hopper is NVIDIA's 2022 design. A chip is one product built to it:</text><text class="cap" x="40" y="372" text-anchor="start">the H100 has 132 multiprocessors and 80 GB of memory, and the H200 is the same chip with</text><text class="cap" x="40" y="392" text-anchor="start">more and faster memory.</text><text class="cap" x="40" y="432" text-anchor="start">Systems are what get bought and wired together. A DGX box holds eight GPUs joined by</text><text class="cap" x="40" y="452" text-anchor="start">NVLink. A GB200 superchip pairs one Grace CPU with two Blackwell GPUs, and an NVL72 rack</text><text class="cap" x="40" y="472" text-anchor="start">holds 36 of them, 72 GPUs in one NVLink domain.</text></svg><figcaption>Three kinds of name that the specification sheets mix freely. Later parts compare generations by architecture and chips by product name, so the distinction carries a lot of weight.</figcaption></figure>
