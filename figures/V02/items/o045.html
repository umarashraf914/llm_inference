<figure><div class='ts'>Fig 45 &nbsp;&middot;&nbsp; 6:38</div><h3>What a branch is</h3><svg viewBox="0 0 680 370" role="img"><title>What a branch is</title><text class="hd" x="40" y="46">A branch is a fork in the instructions</text><g class="u"><rect x="240" y="70" width="200" height="36" rx="4"></rect><text class="sub" x="340.0" y="88.0" text-anchor="middle" dominant-baseline="central">if this value is large</text></g><line class="conn" x1="340" y1="106" x2="200" y2="128"></line><line class="conn" x1="340" y1="106" x2="480" y2="128"></line><g class="m"><rect x="110" y="132" width="180" height="36" rx="4"></rect><text class="sub" x="200.0" y="150.0" text-anchor="middle" dominant-baseline="central">do one thing</text></g><g class="s"><rect x="390" y="132" width="180" height="36" rx="4"></rect><text class="sub" x="480.0" y="150.0" text-anchor="middle" dominant-baseline="central">do the other</text></g><text class="cap" x="40" y="216" text-anchor="start">On an ordinary processor this is routine. One thread reaches the fork, takes one side, and</text><text class="cap" x="40" y="236" text-anchor="start">carries on. Nothing is wasted.</text><text class="cap" x="40" y="272" text-anchor="start">Here, thirty-two lanes reach the fork together sharing one instruction, and the value they are</text><text class="cap" x="40" y="292" text-anchor="start">testing is different in every lane.</text><text class="cap" x="40" y="328" text-anchor="start">Some lanes want the left path and some want the right, and there is only one instruction</text><text class="cap" x="40" y="348" text-anchor="start">stream to give them. That conflict is what the next figure resolves, expensively.</text></svg><figcaption>An ordinary construct in every program ever written. It becomes a performance problem only because of the lockstep decision in the previous part.</figcaption></figure>
