<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:20</div><h3>2,048 threads can keep HBM busy, with little to spare</h3><svg viewBox='0 0 680 430' role='img'><title>2,048 threads can keep HBM busy, with little to spare</title><text class="hd" x="40" y="46">Bytes in flight per multiprocessor: needed, against what 2,048 threads can ask for</text><g class="u"><rect x="40" y="62" width="600" height="42" rx="6"/><text class="sub" x="340.0" y="83.0" text-anchor="middle" dominant-baseline="central">915,096 bytes in flight  ÷  132 multiprocessors  =  6,933 bytes each</text></g><text class="cap" x="40" y="150" text-anchor="start">needed</text><g class="h"><rect x="200.0" y="132.0" width="80.4" height="26.0" rx="3"/></g><text class="sub2" x="290.39450905539775" y="150" text-anchor="start">6,933 bytes</text><text class="cap" x="40" y="190" text-anchor="start">4 bytes per thread</text><g class="s"><rect x="200.0" y="172.0" width="95.0" height="26.0" rx="3"/></g><text class="sub2" x="305.0" y="190" text-anchor="start">8,192 bytes</text><text class="cap" x="40" y="230" text-anchor="start">16 bytes per thread</text><g class="s"><rect x="200" y="212" width="380.0" height="26" rx="3"/><text class="sub" x="390.0" y="225.0" text-anchor="middle" dominant-baseline="central">32,768 bytes</text></g><text class="cap" x="40" y="286" text-anchor="start">If every one of the 2,048 threads has one 4-byte load outstanding, that is 8,192 bytes,</text><text class="cap" x="40" y="306" text-anchor="start">1.18 times what is needed: enough, just. A single load instruction can fetch 16 bytes,</text><text class="cap" x="40" y="326" text-anchor="start">and then 2,048 threads cover the need 4.7 times over.</text><text class="cap" x="40" y="366" text-anchor="start">The 2,048 is not derived from this sum. The V100, A100 and H100 all cap a multiprocessor</text><text class="cap" x="40" y="386" text-anchor="start">at 2,048 threads, while their memories run at 0.9, 2.0 and 3.35 TB/s. The cap happens to</text><text class="cap" x="40" y="406" text-anchor="start">clear the bar on the H100; the arithmetic checks it, it does not explain it.</text></svg><figcaption>Little's law as a check, not a cause. And the margin is thinner than it looks: the latency was measured on an idle chip, and it grows when the memory is busy.</figcaption></figure>
