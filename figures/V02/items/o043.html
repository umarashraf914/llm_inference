<figure><div class='ts'>Fig 43 &nbsp;&middot;&nbsp; 6:15</div><h3>Why 2,048 threads, specifically</h3><svg viewBox="0 0 680 408" role="img"><title>Why 2,048 threads, specifically</title><g class="m"><rect x="70" y="46" width="540" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">bytes that must be in flight  =  bandwidth  x  latency</text></g><text class="cap" x="40" y="118" text-anchor="start">To keep a pipe full you need enough outstanding requests to cover its round trip. This is</text><text class="cap" x="40" y="138" text-anchor="start">Little's Law, and it applies to memory systems exactly as it does to queues.</text><text class="cap" x="40" y="178" text-anchor="start">3.35 TB/s</text><g class="h"><rect x="200" y="162" width="90" height="26" rx="3"></rect><text class="sub" x="245.0" y="175.0" text-anchor="middle" dominant-baseline="central">x 400 ns</text></g><text class="sub2" x="300" y="181" text-anchor="start">= 1.34 MB in flight across the chip</text><text class="cap" x="40" y="228" text-anchor="start">divided by 132</text><g class="h"><rect x="200" y="212" width="90" height="26" rx="3"></rect><text class="sub" x="245.0" y="225.0" text-anchor="middle" dominant-baseline="central">per SM</text></g><text class="sub2" x="300" y="231" text-anchor="start">= about 9.9 KB per multiprocessor</text><text class="cap" x="40" y="278" text-anchor="start">2,048 threads</text><g class="s"><rect x="200" y="262" width="90" height="26" rx="3"></rect><text class="sub" x="245.0" y="275.0" text-anchor="middle" dominant-baseline="central">x 4 bytes</text></g><text class="sub2" x="300" y="281" text-anchor="start">= 8 KB of outstanding loads</text><text class="cap" x="40" y="336" text-anchor="start">The occupancy figure is not a round number chosen for convenience. It is roughly the amount of</text><text class="cap" x="40" y="356" text-anchor="start">concurrency required to keep HBM saturated, given its latency.</text><text class="cap" x="40" y="386" text-anchor="start">Too few threads and the memory system idles no matter how fast it is.</text></svg><figcaption>This is the quantitative reason occupancy matters. Bandwidth is only achievable if enough requests are outstanding to cover the latency.</figcaption></figure>
