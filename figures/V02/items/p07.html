2</text></g><g class="s"><rect x="128" y="290" width="30" height="30" rx="3"/><text class="sub" x="143.0" y="305.0" text-anchor="middle" dominant-baseline="central">a33</text></g><g class="s"><rect x="162" y="290" width="30" height="30" rx="3"/><text class="sub" x="177.0" y="305.0" text-anchor="middle" dominant-baseline="central">a34</text></g><g class="u"><rect x="214" y="290" width="30" height="30" rx="3"/><text class="sub" x="229.0" y="305.0" text-anchor="middle" dominant-baseline="central">c31</text></g><g class="u"><rect x="248" y="290" width="30" height="30" rx="3"/><text class="sub" x="263.0" y="305.0" text-anchor="middle" dominant-baseline="central">c32</text></g><g class="u"><rect x="282" y="290" width="30" height="30" rx="3"/><text class="sub" x="297.0" y="305.0" text-anchor="middle" dominant-baseline="central">c33</text></g><g class="u"><rect x="316" y="290" width="30" height="30" rx="3"/><text class="sub" x="331.0" y="305.0" text-anchor="middle" dominant-baseline="central">c34</text></g><g class="s"><rect x="60" y="324" width="30" height="30" rx="3"/><text class="sub" x="75.0" y="339.0" text-anchor="middle" dominant-baseline="central">a41</text></g><g class="s"><rect x="94" y="324" width="30" height="30" rx="3"/><text class="sub" x="109.0" y="339.0" text-anchor="middle" dominant-baseline="central">a42</text></g><g class="s"><rect x="128" y="324" width="30" height="30" rx="3"/><text class="sub" x="143.0" y="339.0" text-anchor="middle" dominant-baseline="central">a43</text></g><g class="s"><rect x="162" y="324" width="30" height="30" rx="3"/><text class="sub" x="177.0" y="339.0" text-anchor="middle" dominant-baseline="central">a44</text></g><g class="u"><rect x="214" y="324" width="30" height="30" rx="3"/><text class="sub" x="229.0" y="339.0" text-anchor="middle" dominant-baseline="central">c41</text></g><g class="u"><rect x="248" y="324" width="30" height="30" rx="3"/><text class="sub" x="263.0" y="339.0" text-anchor="middle" dominant-baseline="central">c42</text></g><g class="u"><rect x="282" y="324" width="30" height="30" rx="3"/><text class="sub" x="297.0" y="339.0" text-anchor="middle" dominant-baseline="central">c43</text></g><g class="u"><rect x="316" y="324" width="30" height="30" rx="3"/><text class="sub" x="331.0" y="339.0" text-anchor="middle" dominant-baseline="central">c44</text></g><text class="sub2" x="358" y="138" text-anchor="start">tile of B</text><text class="sub2" x="60" y="374" text-anchor="start">tile of A</text><text class="sub2" x="214" y="374" text-anchor="start">outputs, one per thread</text><text class="hd" x="420" y="236">Numbers read from HBM, to scale</text><text class="sub2" x="420" y="266" text-anchor="start">each thread its own 8</text><g class="h"><rect x="420.0" y="272.0" width="180.0" height="22.0" rx="3"/></g><text class="sub2" x="608.0" y="288" text-anchor="start">128</text><text class="sub2" x="420" y="320" text-anchor="start">staged once</text><g class="s"><rect x="420.0" y="326.0" width="45.0" height="22.0" rx="3"/></g><text class="sub2" x="473.0" y="342" text-anchor="start">32</text><g class="u"><rect x="40" y="394" width="600" height="42" rx="6"/><text class="sub" x="340.0" y="415.0" text-anchor="middle" dominant-baseline="central">c23  =  a21·b13  +  a22·b23  +  a23·b33  +  a24·b43</text></g><text class="cap" x="40" y="476" text-anchor="start">The thread computing c23 needs row 2 of A and column 3 of B, eight numbers. Every thread</text><text class="cap" x="40" y="496" text-anchor="start">in the same row of outputs needs the same four numbers of A, and every thread in the</text><text class="cap" x="40" y="516" text-anchor="start">same column the same four of B.</text><text class="cap" x="40" y="556" text-anchor="start">If each thread fetched its own eight from HBM, the block would make 16 × 8 = 128 reads.</text><text class="cap" x="40" y="576" text-anchor="start">Staged, the block first copies the 16 numbers of A and the 16 of B into shared memory,</text><text class="cap" x="40" y="596" text-anchor="start">32 reads, and every thread then reads from there. That is 4 times fewer: the saving</text><text class="cap" x="40" y="616" text-anchor="start">equals the width of the tile, so a 128-wide tile saves 128 times.</text><text class="cap" x="40" y="656" text-anchor="start">Cutting a large matrix multiply into blocks like this, each staged once and used many</text><text class="cap" x="40" y="676" text-anchor="start">times, is called tiling.</text></svg><figcaption>Same arithmetic, a quarter of the HBM traffic. This is what a scratchpad managed by hand is for: the program knows in advance who needs what, which a cache can only guess.</figcaption></figure>
