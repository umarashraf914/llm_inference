width="1.6" height="26" rx="1"/></g><g class="h"><rect x="450" y="92" width="13.0" height="26" rx="1"/></g><g class="s"><rect x="450" y="92" width="1.6" height="26" rx="1"/></g><g class="h"><rect x="465" y="92" width="13.0" height="26" rx="1"/></g><g class="s"><rect x="465" y="92" width="1.6" height="26" rx="1"/></g><g class="h"><rect x="480" y="92" width="13.0" height="26" rx="1"/></g><g class="s"><rect x="480" y="92" width="1.6" height="26" rx="1"/></g><g class="h"><rect x="495" y="92" width="13.0" height="26" rx="1"/></g><g class="s"><rect x="495" y="92" width="1.6" height="26" rx="1"/></g><g class="h"><rect x="510" y="92" width="13.0" height="26" rx="1"/></g><g class="s"><rect x="510" y="92" width="1.6" height="26" rx="1"/></g><g class="h"><rect x="525" y="92" width="13.0" height="26" rx="1"/></g><g class="s"><rect x="525" y="92" width="1.6" height="26" rx="1"/></g><g class="h"><rect x="540" y="92" width="13.0" height="26" rx="1"/></g><g class="s"><rect x="540" y="92" width="1.6" height="26" rx="1"/></g><g class="h"><rect x="555" y="92" width="13.0" height="26" rx="1"/></g><g class="s"><rect x="555" y="92" width="1.6" height="26" rx="1"/></g><g class="h"><rect x="570" y="92" width="13.0" height="26" rx="1"/></g><g class="s"><rect x="570" y="92" width="1.6" height="26" rx="1"/></g><g class="h"><rect x="585" y="92" width="13.0" height="26" rx="1"/></g><g class="s"><rect x="585" y="92" width="1.6" height="26" rx="1"/></g><g class="h"><rect x="600" y="92" width="13.0" height="26" rx="1"/></g><g class="s"><rect x="600" y="92" width="1.6" height="26" rx="1"/></g><g class="h"><rect x="615" y="92" width="13.0" height="26" rx="1"/></g><g class="s"><rect x="615" y="92" width="1.6" height="26" rx="1"/></g></g><text class="sub2" x="150" y="136" text-anchor="start">teal: bytes some lane asked for; red: the rest of each 32-byte sector</text><text class="cap" x="40" y="172" text-anchor="start">bytes moved</text><g class="h"><rect x="150" y="156" width="440.0" height="24" rx="3" data-moved=""/></g><text class="cap" x="40" y="206" text-anchor="start">bytes asked for</text><g class="s"><rect x="150" y="190" width="55.0" height="24" rx="3" data-usedbar=""/></g><text class="sub2" x="40" y="244" data-sec="">sectors fetched: 32 × 32 = 1,024 bytes</text><text class="sub2" x="40" y="264" data-lin="">128-byte lines touched: 8</text><text class="sub2" x="40" y="284" data-use="">bytes the threads asked for: 32 × 4 = 128</text><text class="sub2" x="40" y="304" data-pct="">used: 12.5% of what was moved</text><text class="cap" x="40" y="354" text-anchor="start">At stride 1 the 32 lanes read neighbours and four sectors carry everything. Every</text><text class="cap" x="40" y="374" text-anchor="start">doubling of the stride doubles the sectors until, at 8 numbers of 4 bytes (32 bytes),</text><text class="cap" x="40" y="394" text-anchor="start">every lane has a sector to itself: 32 sectors, 1,024 bytes moved, 12.5% used. Beyond</text><text class="cap" x="40" y="414" text-anchor="start">that the waste stays the same; the lanes just spread over more lines.</text><text class="cap" x="40" y="454" text-anchor="start">Wider numbers waste less, because each lane uses more of its sector: 8-byte numbers at</text><text class="cap" x="40" y="474" text-anchor="start">any large stride still use a quarter. The sector rule is NVIDIA's; the page's arithmetic</text><text class="cap" x="40" y="494" text-anchor="start">was checked against Python at every setting.</text></svg></div><figcaption>Same arithmetic at every setting; only where the numbers sit changes, and with it up to eight times the traffic for 4-byte numbers.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const DEF = [8, 4], SW = 15, X0 = 150;
  const sl = fig.querySelector('input[type=range]'), val = fig.querySelector('.val');
  const rad = [...fig.querySelectorAll('input[type=radio]')], q = s => fig.querySelector(s);
  const f1 = v => v.toFixed(1), NS = 'http://www.w3.org/2000/svg';
  function draw() {
    const st = +sl.value, el = +rad.find(r => r.checked).value;
    val.textContent = st;
    const secs = new Map(), lines = new Set();
    for (let k = 0; k < 32; k++) {
      const a = k * st * el, s = Math.floor(a / 32);
      secs.set(s, (secs.get(s) || 0) + 1); lines.add(Math.floor(a / 128));
    }
    const keys = [...secs.keys()].sort((x, y) => x - y), moved = keys.length * 32, used = 32 * el;
    const g = q('[data-cells]'); g.replaceChildren();
    keys.forEach((s, i) => {
      const x = X0 + i * SW, share = secs.get(s) * el / 32;
      const r = document.createElementNS(NS, 'rect'), u = document.createElementNS(NS, 'rect');
      const gr = document.createElementNS(NS, 'g'), gu = document.createElementNS(NS, 'g');
      [[r, SW - 2], [u, (SW - 2) * share]].forEach(([e, w]) => { e.setAttribute('x', x); e.setAttribute('y', 92);
        e.setAttribute('width', w.toFixed(1)); e.setAttribute('height', 26); e.setAttribute('rx', 1); });
      gr.setAttribute('class', 'h'); gu.setAttribute('class', 's'); gr.appendChild(r); gu.appendChild(u);
      g.appendChild(gr); g.appendChild(gu);
    });
    q('[data-moved]').setAttribute('width', (moved / 1024 * 440).toFixed(1));
    q('[data-sec]').textContent = `sectors fetched: ${keys.length} × 32 = ${moved.toLocaleString('en-US')} bytes`;
    q('[data-lin]').textContent = `128-byte lines touched: ${lines.size}`;
    q('[data-use]').textContent = `bytes the threads asked for: 32 × ${el} = ${used}`;
    q('[data-pct]').textContent = `used: ${f1(100 * used / moved)}% of what was moved`;
    q('[data-usedbar]').setAttribute('width', (used / 1024 * 440).toFixed(1));
  }
  sl.addEventListener('input', draw); rad.forEach(r => r.addEventListener('change', draw));
  q('button').addEventListener('click', () => { sl.value = DEF[0]; rad.forEach(r => r.checked = +r.value === DEF[1]); draw(); });
  draw();
})();</script></figure>
