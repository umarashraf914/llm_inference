<figure><div class='ts'>Fig 53 &nbsp;&middot;&nbsp; 8:21</div><h3>What scope means</h3><svg viewBox="0 0 680 398" role="img"><title>What scope means</title><text class="hd" x="40" y="46">Scope: who is allowed to see a level</text><g class="s"><rect x="40" y="74" width="180" height="36" rx="4"></rect><text class="sub" x="130.0" y="92.0" text-anchor="middle" dominant-baseline="central">registers</text></g><text class="sub2" x="240" y="96" text-anchor="start">one thread, and nobody else</text><g class="s"><rect x="40" y="122" width="180" height="36" rx="4"></rect><text class="sub" x="130.0" y="140.0" text-anchor="middle" dominant-baseline="central">shared memory</text></g><text class="sub2" x="240" y="144" text-anchor="start">every thread in one block, and no others</text><g class="u"><rect x="40" y="170" width="180" height="36" rx="4"></rect><text class="sub" x="130.0" y="188.0" text-anchor="middle" dominant-baseline="central">L2 cache</text></g><text class="sub2" x="240" y="192" text-anchor="start">every multiprocessor on the chip</text><g class="h"><rect x="40" y="218" width="180" height="36" rx="4"></rect><text class="sub" x="130.0" y="236.0" text-anchor="middle" dominant-baseline="central">main memory</text></g><text class="sub2" x="240" y="240" text-anchor="start">everything, including other chips</text><text class="cap" x="40" y="300" text-anchor="start">Speed is not the only axis. A level is also defined by who can reach it, and that is what makes</text><text class="cap" x="40" y="320" text-anchor="start">shared memory a way for threads to cooperate rather than merely a fast cache.</text><text class="cap" x="40" y="356" text-anchor="start">Two threads that need to exchange a value must meet at a level they can both see. The higher</text><text class="cap" x="40" y="376" text-anchor="start">that level, the cheaper the exchange.</text></svg><figcaption>The second axis of the ladder. It is why the assembled diagram nests, and why splitting work across multiprocessors is more expensive than splitting it within one.</figcaption></figure>
