<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 7:09</div><h3>Masked lanes still take their turn, so each nested fork halves the useful work</h3><svg viewBox='0 0 680 560' role='img'><title>Masked lanes still take their turn, so each nested fork halves the useful work</title><text class="hd" x="40" y="46">The active mask: one bit per lane, 8 of the 32 drawn</text><g class="m"><rect x="150" y="62" width="40" height="30" rx="3"/><text class="sub" x="170.0" y="77.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="198" y="62" width="40" height="30" rx="3"/><text class="sub" x="218.0" y="77.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="246" y="62" width="40" height="30" rx="3"/><text class="sub" x="266.0" y="77.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="294" y="62" width="40" height="30" rx="3"/><text class="sub" x="314.0" y="77.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="342" y="62" width="40" height="30" rx="3"/><text class="sub" x="362.0" y="77.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="390" y="62" width="40" height="30" rx="3"/><text class="sub" x="410.0" y="77.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="438" y="62" width="40" height="30" rx="3"/><text class="sub" x="458.0" y="77.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="486" y="62" width="40" height="30" rx="3"/><text class="sub" x="506.0" y="77.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="150" y="116" text-anchor="start">a 0 lane still takes its slot, then throws its result away</text><text class="hd" x="40" y="160">Useful share of the lanes' slots, if every fork splits the warp in half</text><text class="cap" x="40" y="194" text-anchor="start">no fork</text><g class="m"><rect x="170" y="176" width="400.0" height="26" rx="3"/><text class="sub" x="370.0" y="189.0" text-anchor="middle" dominant-baseline="central">100% useful: 1 pass</text></g><text class="cap" x="40" y="230" text-anchor="start">one fork</text><g class="m"><rect x="170" y="212" width="200.0" height="26" rx="3"/><text class="sub" x="270.0" y="225.0" text-anchor="middle" dominant-baseline="central">50% useful: 2 passes</text></g><text class="cap" x="40" y="266" text-anchor="start">two, nested</text><g class="m"><rect x="170.0" y="248.0" width="100.0" height="26.0" rx="3"/></g><text class="sub2" x="280.0" y="266" text-anchor="start">25% useful: 4 passes</text><text class="cap" x="40" y="302" text-anchor="start">three, nested</text><g class="m"><rect x="170.0" y="284.0" width="50.0" height="26.0" rx="3"/></g><text class="sub2" x="230.0" y="302" text-anchor="start">12.5% useful: 8 passes</text><text class="cap" x="40" y="356" text-anchor="start">The hardware keeps a bitmask of which lanes are active. Inactive lanes still occupy</text><text class="cap" x="40" y="376" text-anchor="start">their place in the instruction; they simply discard the answer. Nothing waits and</text><text class="cap" x="40" y="396" text-anchor="start">nothing is recomputed, yet time passes with only some of the lanes doing useful work.</text><text class="cap" x="40" y="436" text-anchor="start">The cost is not the decision itself. One instruction stream cannot serve two</text><text class="cap" x="40" y="456" text-anchor="start">destinations at once, so it serves them one after the other. Each nested fork doubles</text><text class="cap" x="40" y="476" text-anchor="start">the passes: one fork means two, two nested forks four, three make eight.</text><text class="cap" x="40" y="516" text-anchor="start">So well-written kernels avoid branching on data inside a warp. A fork costs nothing when</text><text class="cap" x="40" y="536" text-anchor="start">all 32 lanes go the same way.</text></svg><figcaption>Bars to scale. Divergence is not a stall: it is issue slots spent on lanes that discard their results, which is why it shows up as lost throughput, never as waiting.</figcaption></figure>
