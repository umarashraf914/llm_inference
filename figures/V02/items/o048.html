<figure><div class='ts'>Fig 48 &nbsp;&middot;&nbsp; 7:09</div><h3>The mask, and why nesting compounds</h3><svg viewBox="0 0 680 318" role="img"><title>The mask, and why nesting compounds</title><text class="hd" x="40" y="46">How the masking actually works</text><g class="u"><rect x="150" y="66" width="380" height="34" rx="3"></rect><text class="sub" x="340.0" y="83.0" text-anchor="middle" dominant-baseline="central">active mask: one bit per lane</text></g><g class="m"><rect x="150" y="116" width="40" height="30" rx="3"></rect><text class="sub" x="170.0" y="131.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="198" y="116" width="40" height="30" rx="3"></rect><text class="sub" x="218.0" y="131.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="246" y="116" width="40" height="30" rx="3"></rect><text class="sub" x="266.0" y="131.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="294" y="116" width="40" height="30" rx="3"></rect><text class="sub" x="314.0" y="131.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="342" y="116" width="40" height="30" rx="3"></rect><text class="sub" x="362.0" y="131.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="390" y="116" width="40" height="30" rx="3"></rect><text class="sub" x="410.0" y="131.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="438" y="116" width="40" height="30" rx="3"></rect><text class="sub" x="458.0" y="131.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="486" y="116" width="40" height="30" rx="3"></rect><text class="sub" x="506.0" y="131.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="150" y="176" text-anchor="start">lanes with a 0 execute the instruction but discard the result</text><text class="cap" x="40" y="226" text-anchor="start">The hardware keeps a bitmask of which lanes are active. Inactive lanes still consume their</text><text class="cap" x="40" y="246" text-anchor="start">issue slot; they simply throw the answer away.</text><text class="cap" x="40" y="276" text-anchor="start">So divergence costs time even though nothing useful happens. Nesting branches compounds it:</text><text class="cap" x="40" y="296" text-anchor="start">one branch means two passes, two nested means four, three means eight.</text></svg><figcaption>Divergence is not a stall. It is wasted issue slots, which is why it shows up as reduced throughput rather than as latency.</figcaption></figure>
