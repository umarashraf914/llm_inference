<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:22</div><h3>A kernel is written for one thread; each thread finds its data from its own number</h3><svg viewBox='0 0 680 610' role='img'><title>A kernel is written for one thread; each thread finds its data from its own number</title><text class="hd" x="40" y="46">The whole kernel: two lines, run by every thread</text><g class="u"><rect x="40" y="62" width="600" height="30" rx="6"/><text class="sub" x="340.0" y="77.0" text-anchor="middle" dominant-baseline="central">i  =  block number  ×  256  +  thread number</text></g><g class="u"><rect x="40" y="98" width="600" height="30" rx="6"/><text class="sub" x="340.0" y="113.0" text-anchor="middle" dominant-baseline="central">c[i]  =  a[i]  +  b[i]</text></g><text class="sub2" x="40" y="160" text-anchor="start">block</text><text class="sub2" x="110" y="160" text-anchor="start">thread</text><text class="sub2" x="190" y="160" text-anchor="start">its i</text><text class="sub2" x="290" y="160" text-anchor="start">where a[i] sits, in bytes from the start</text><g class="u"><rect x="40" y="170" width="56" height="28" rx="3"/><text class="sub" x="68.0" y="184.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="110" y="170" width="66" height="28" rx="3"/><text class="sub" x="143.0" y="184.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="190" y="170" width="86" height="28" rx="3"/><text class="sub" x="233.0" y="184.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="290" y="170" width="350" height="28" rx="3"/><text class="sub" x="465.0" y="184.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="40" y="206" width="56" height="28" rx="3"/><text class="sub" x="68.0" y="220.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="110" y="206" width="66" height="28" rx="3"/><text class="sub" x="143.0" y="220.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="190" y="206" width="86" height="28" rx="3"/><text class="sub" x="233.0" y="220.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="290" y="206" width="350" height="28" rx="3"/><text class="sub" x="465.0" y="220.0" text-anchor="middle" dominant-baseline="central">4</text></g><g class="u"><rect x="40" y="242" width="56" height="28" rx="3"/><text class="sub" x="68.0" y="256.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="u"><rect x="110" y="242" width="66" height="28" rx="3"/><text class="sub" x="143.0" y="256.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="u"><rect x="190" y="242" width="86" height="28" rx="3"/><text class="sub" x="233.0" y="256.0" text-anchor="middle" dominant-baseline="central">773</text></g><g class="u"><rect x="290" y="242" width="350" height="28" rx="3"/><text class="sub" x="465.0" y="256.0" text-anchor="middle" dominant-baseline="central">3,092</text></g><g class="u"><rect x="40" y="278" width="56" height="28" rx="3"/><text class="sub" x="68.0" y="292.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="110" y="278" width="66" height="28" rx="3"/><text class="sub" x="143.0" y="292.0" text-anchor="middle" dominant-baseline="central">64 … 95</text></g><g class="m"><rect x="190" y="278" width="86" height="28" rx="3"/><text class="sub" x="233.0" y="292.0" text-anchor="middle" dominant-baseline="central">64 … 95</text></g><g class="s"><rect x="290" y="278" width="350" height="28" rx="3"/><text class="sub" x="465.0" y="292.0" text-anchor="middle" dominant-baseline="central">256 … 383: 128 bytes side by side</text></g><text class="sub2" x="40" y="328" text-anchor="start">last row: one warp, threads 64 to 95 of block 0</text><text class="cap" x="40" y="366" text-anchor="start">A kernel is the program the GPU runs. It is written once, for a single thread, and</text><text class="cap" x="40" y="386" text-anchor="start">launched over thousands of threads at a time. Every thread runs the same lines; the only</text><text class="cap" x="40" y="406" text-anchor="start">thing that differs is its number. The hardware hands each one its block number and its</text><text class="cap" x="40" y="426" text-anchor="start">thread number inside the block.</text><text class="cap" x="40" y="466" text-anchor="start">The first line turns those into an index. Thread 5 of block 3 gets i =</text><text class="cap" x="40" y="486" text-anchor="start">3 × 256 + 5 = 773, so it adds element 773 of a and b, which sit 773 × 4 = 3,092 bytes</text><text class="cap" x="40" y="506" text-anchor="start">from the start of each array of 4-byte numbers.</text><text class="cap" x="40" y="546" text-anchor="start">Neighbouring threads get neighbouring indices. The warp made of threads 64 to 95 reads</text><text class="cap" x="40" y="566" text-anchor="start">32 numbers lying side by side, 128 consecutive bytes, which Part 9 shows is exactly what</text><text class="cap" x="40" y="586" text-anchor="start">memory wants.</text></svg><figcaption>The same instruction, different data, comes from one line of arithmetic on the thread's own number. The index formula is the one NVIDIA's own examples use.</figcaption></figure>
