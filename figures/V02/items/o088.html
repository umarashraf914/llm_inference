eight="26.0" rx="2"/></g><g class="s"><rect x="425.0" y="66.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="440.0" y="66.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="455.0" y="66.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="470.0" y="66.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="485.0" y="66.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="500.0" y="66.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="515.0" y="66.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="530.0" y="66.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="545.0" y="66.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="560.0" y="66.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="575.0" y="66.0" width="13.0" height="26.0" rx="2"/></g><text class="sub2" x="184.0" y="109" text-anchor="middle">8 exponent bits</text><text class="sub2" x="416.5" y="109" text-anchor="middle">23 mantissa bits</text><text class="cap" x="40" y="158" text-anchor="start">FP16</text><text class="sub2" x="40" y="176" text-anchor="start">16 bits</text><g class="u"><rect x="110.0" y="140.0" width="13.0" height="26.0" rx="2"/></g><g class="h"><rect x="125.0" y="140.0" width="13.0" height="26.0" rx="2"/></g><g class="h"><rect x="140.0" y="140.0" width="13.0" height="26.0" rx="2"/></g><g class="h"><rect x="155.0" y="140.0" width="13.0" height="26.0" rx="2"/></g><g class="h"><rect x="170.0" y="140.0" width="13.0" height="26.0" rx="2"/></g><g class="h"><rect x="185.0" y="140.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="200.0" y="140.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="215.0" y="140.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="230.0" y="140.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="245.0" y="140.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="260.0" y="140.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="275.0" y="140.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="290.0" y="140.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="305.0" y="140.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="320.0" y="140.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="335.0" y="140.0" width="13.0" height="26.0" rx="2"/></g><text class="sub2" x="161.5" y="183" text-anchor="middle">5 exponent bits</text><text class="sub2" x="274.0" y="183" text-anchor="middle">10 mantissa bits</text><text class="sub2" x="364" y="158" text-anchor="start">fine steps, narrow range</text><text class="cap" x="40" y="232" text-anchor="start">BF16</text><text class="sub2" x="40" y="250" text-anchor="start">16 bits</text><g class="u"><rect x="110.0" y="214.0" width="13.0" height="26.0" rx="2"/></g><g class="h"><rect x="125.0" y="214.0" width="13.0" height="26.0" rx="2"/></g><g class="h"><rect x="140.0" y="214.0" width="13.0" height="26.0" rx="2"/></g><g class="h"><rect x="155.0" y="214.0" width="13.0" height="26.0" rx="2"/></g><g class="h"><rect x="170.0" y="214.0" width="13.0" height="26.0" rx="2"/></g><g class="h"><rect x="185.0" y="214.0" width="13.0" height="26.0" rx="2"/></g><g class="h"><rect x="200.0" y="214.0" width="13.0" height="26.0" rx="2"/></g><g class="h"><rect x="215.0" y="214.0" width="13.0" height="26.0" rx="2"/></g><g class="h"><rect x="230.0" y="214.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="245.0" y="214.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="260.0" y="214.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="275.0" y="214.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="290.0" y="214.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="305.0" y="214.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="320.0" y="214.0" width="13.0" height="26.0" rx="2"/></g><g class="s"><rect x="335.0" y="214.0" width="13.0" height="26.0" rx="2"/></g><text class="sub2" x="184.0" y="257" text-anchor="middle">8 exponent bits</text><text class="sub2" x="296.5" y="257" text-anchor="middle">7 mantissa bits</text><text class="sub2" x="364" y="232" text-anchor="start">FP32's range, coarse steps</text><text class="cap" x="40" y="302" text-anchor="start">Drawn to scale; the grey bit is the sign. The two 16-bit formats spend their bits in</text><text class="cap" x="40" y="322" text-anchor="start">opposite ways.</text><text class="cap" x="40" y="362" text-anchor="start">Deep learning leans on range while staying forgiving about precision. So BF16 keeps all</text><text class="cap" x="40" y="382" text-anchor="start">eight of FP32's exponent bits, and with them FP32's range, and cuts the mantissa from</text><text class="cap" x="40" y="402" text-anchor="start">twenty-three bits to seven. IEEE's FP16 does the reverse: ten mantissa bits and a</text><text class="cap" x="40" y="422" text-anchor="start">five-bit exponent.</text><text class="cap" x="40" y="462" text-anchor="start">BF16 is simply the first half of an FP32 number, rounded, so converting between the two</text><text class="cap" x="40" y="482" text-anchor="start">costs almost nothing. NVIDIA reports that both 16-bit formats train networks in mixed</text><text class="cap" x="40" y="502" text-anchor="start">precision to the same results as FP32, without retuning.</text></svg><figcaption>Layouts and the training result from NVIDIA's A100 whitepaper. Mixed precision means low-precision inputs feeding higher-precision sums, the safeguard a few figures on.</figcaption></figure>
