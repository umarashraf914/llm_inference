<figure><div class='ts'>Fig 88 &nbsp;&middot;&nbsp; 16:16</div><h3>BF16: keep the range, cut the precision</h3><svg viewBox="0 0 680 338" role="img"><title>BF16: keep the range, cut the precision</title><text class="cap" x="40" y="78" text-anchor="start">FP32</text><g class="u"><rect x="120" y="62" width="16" height="34" rx="2"></rect></g><g class="h"><rect x="140" y="62" width="128" height="34" rx="2"></rect><text class="sub" x="204.0" y="79.0" text-anchor="middle" dominant-baseline="central">exponent, 8</text></g><g class="s"><rect x="272" y="62" width="348" height="34" rx="2"></rect><text class="sub" x="446.0" y="79.0" text-anchor="middle" dominant-baseline="central">mantissa, 23</text></g><text class="cap" x="40" y="158" text-anchor="start">BF16</text><g class="u"><rect x="120" y="142" width="16" height="34" rx="2"></rect></g><g class="h"><rect x="140" y="142" width="128" height="34" rx="2"></rect><text class="sub" x="204.0" y="159.0" text-anchor="middle" dominant-baseline="central">exponent, 8</text></g><g class="s"><rect x="272" y="142" width="108" height="34" rx="2"></rect><text class="sub" x="326.0" y="159.0" text-anchor="middle" dominant-baseline="central">mantissa, 7</text></g><text class="cap" x="40" y="216" text-anchor="start">Drawn to scale, one bit per 15 pixels. The grey sliver is the sign bit.</text><text class="cap" x="40" y="246" text-anchor="start">The exponent sets range and the mantissa sets fine precision. Deep learning leans on range</text><text class="cap" x="40" y="266" text-anchor="start">while staying forgiving about precision, so BF16 keeps all eight exponent bits and cuts the</text><text class="cap" x="40" y="286" text-anchor="start">mantissa from twenty-three to seven.</text><text class="cap" x="40" y="316" text-anchor="start">Training barely notices.</text></svg><figcaption>The mechanism behind the whole ladder, and the reason BF16 rather than FP16 became the default training format.</figcaption></figure>
