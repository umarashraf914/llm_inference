<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:20</div><h3>To keep a pipe full, count what must be on the road</h3><svg viewBox='0 0 680 602' role='img'><title>To keep a pipe full, count what must be on the road</title><text class="hd" x="40" y="46">A pizza leaves every 5 minutes, and each round trip takes 30</text><text class="sub2" x="40" y="74" text-anchor="start">driver 1</text><text class="sub2" x="40" y="96" text-anchor="start">driver 2</text><text class="sub2" x="40" y="118" text-anchor="start">driver 3</text><text class="sub2" x="40" y="140" text-anchor="start">driver 4</text><text class="sub2" x="40" y="162" text-anchor="start">driver 5</text><text class="sub2" x="40" y="184" text-anchor="start">driver 6</text><g class="u"><rect x="150" y="62" width="148" height="16" rx="2"/></g><g class="u"><rect x="175" y="84" width="148" height="16" rx="2"/></g><g class="u"><rect x="200" y="106" width="148" height="16" rx="2"/></g><g class="s"><rect x="225" y="128" width="148" height="16" rx="2"/></g><g class="s"><rect x="250" y="150" width="148" height="16" rx="2"/></g><g class="s"><rect x="275" y="172" width="148" height="16" rx="2"/></g><g class="s"><rect x="300" y="62" width="148" height="16" rx="2"/></g><g class="s"><rect x="325" y="84" width="148" height="16" rx="2"/></g><g class="s"><rect x="350" y="106" width="148" height="16" rx="2"/></g><g class="u"><rect x="375" y="128" width="148" height="16" rx="2"/></g><g class="u"><rect x="400" y="150" width="148" height="16" rx="2"/></g><g class="u"><rect x="425" y="172" width="148" height="16" rx="2"/></g><line class="axis" x1="150" y1="200" x2="575" y2="200"/><line class="tick" x1="150" y1="200" x2="150" y2="205"/><text class="sub2" x="150" y="219" text-anchor="middle">0 min</text><line class="tick" x1="225" y1="200" x2="225" y2="205"/><text class="sub2" x="225" y="219" text-anchor="middle">15 min</text><line class="tick" x1="300" y1="200" x2="300" y2="205"/><text class="sub2" x="300" y="219" text-anchor="middle">30 min</text><line class="tick" x1="375" y1="200" x2="375" y2="205"/><text class="sub2" x="375" y="219" text-anchor="middle">45 min</text><line class="tick" x1="450" y1="200" x2="450" y2="205"/><text class="sub2" x="450" y="219" text-anchor="middle">60 min</text><line class="tick" x1="525" y1="200" x2="525" y2="205"/><text class="sub2" x="525" y="219" text-anchor="middle">75 min</text><line class="mark xok" x1="360" y1="56" x2="360" y2="200"/><text class="sub2" x="366" y="238" text-anchor="start">at minute 42: six on the road (teal)</text><g class="u"><rect x="40" y="256" width="600" height="42" rx="6"/><text class="sub" x="340.0" y="277.0" text-anchor="middle" dominant-baseline="central">on the road  =  rate  ×  time each trip takes  =  12 an hour  ×  ½ hour  =  6</text></g><text class="hd" x="40" y="326">The same sum for HBM</text><g class="u"><rect x="40" y="340" width="600" height="42" rx="6"/><text class="sub" x="340.0" y="361.0" text-anchor="middle" dominant-baseline="central">3,352 bytes per ns  ×  273 ns per trip  =  915,096 bytes on the road</text></g><text class="cap" x="40" y="418" text-anchor="start">To keep deliveries leaving every five minutes, the shop needs enough drivers out to</text><text class="cap" x="40" y="438" text-anchor="start">cover a whole round trip. Fewer, and the ovens wait for drivers; more, and drivers wait</text><text class="cap" x="40" y="458" text-anchor="start">for pizzas. This is Little's law: amount in flight = rate × time each item spends in</text><text class="cap" x="40" y="478" text-anchor="start">flight ({{fig:v01-o075}}).</text><text class="cap" x="40" y="518" text-anchor="start">HBM hands over 3,352 bytes every nanosecond, and a request takes about 273 ns to come</text><text class="cap" x="40" y="538" text-anchor="start">back (measured on a Hopper GPU as 479 ticks of its 1.755 GHz clock). So about 915</text><text class="cap" x="40" y="558" text-anchor="start">thousand bytes must be requested and not yet returned at every moment, or the bus runs</text><text class="cap" x="40" y="578" text-anchor="start">part empty.</text></svg><figcaption>Bandwidth is only reached if enough requests are outstanding to cover the wait. The wait here was measured with the chip otherwise idle (Luo et al. 2024); under load it grows, and so does the amount that must be in flight.</figcaption></figure>
