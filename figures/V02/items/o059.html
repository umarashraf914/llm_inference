<figure><div class='ts'>Fig 59 &nbsp;&middot;&nbsp; 9:51</div><h3>Why switching is free here and not elsewhere</h3><svg viewBox="0 0 680 366" role="img"><title>Why switching is free here and not elsewhere</title><text class="hd" x="40" y="46">What switching normally costs</text><text class="cap" x="40" y="92" text-anchor="start">An ordinary processor</text><g class="m"><rect x="280" y="76" width="90" height="30" rx="3"></rect><text class="sub" x="325.0" y="91.0" text-anchor="middle" dominant-baseline="central">work</text></g><g class="h"><rect x="374" y="76" width="120" height="30" rx="3"></rect><text class="sub" x="434.0" y="91.0" text-anchor="middle" dominant-baseline="central">save and restore</text></g><g class="m"><rect x="498" y="76" width="90" height="30" rx="3"></rect><text class="sub" x="543.0" y="91.0" text-anchor="middle" dominant-baseline="central">work</text></g><text class="cap" x="40" y="152" text-anchor="start">This chip</text><g class="m"><rect x="280" y="136" width="150" height="30" rx="3"></rect><text class="sub" x="355.0" y="151.0" text-anchor="middle" dominant-baseline="central">work</text></g><g class="u"><rect x="434" y="136" width="6" height="30" rx="1"></rect></g><g class="m"><rect x="444" y="136" width="150" height="30" rx="3"></rect><text class="sub" x="519.0" y="151.0" text-anchor="middle" dominant-baseline="central">work</text></g><text class="cap" x="40" y="212" text-anchor="start">An ordinary processor has one set of registers, so switching threads means copying one</text><text class="cap" x="40" y="232" text-anchor="start">thread's values out and another's in. That is real work and real cycles.</text><text class="cap" x="40" y="268" text-anchor="start">Here, every resident group already owns its own slice of the register file, permanently. There</text><text class="cap" x="40" y="288" text-anchor="start">is nothing to save because nothing is shared.</text><text class="cap" x="40" y="324" text-anchor="start">The cost is that the register file must be enormous, which it is: 256 kilobytes per</text><text class="cap" x="40" y="344" text-anchor="start">multiprocessor, larger than the cache next to it.</text></svg><figcaption>A cost moved rather than removed. The chip pays in silicon area, once, instead of in cycles, constantly.</figcaption></figure>
