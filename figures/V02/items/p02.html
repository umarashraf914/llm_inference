<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:10</div><h3>3.35 TB/s is 5,120 wires, each carrying 5.24 billion bits a second</h3><svg viewBox='0 0 680 694' role='img'><title>3.35 TB/s is 5,120 wires, each carrying 5.24 billion bits a second</title><text class="hd" x="40" y="46">The package from above: the GPU die and its five memory stacks</text><g class="m"><rect x="230" y="80" width="220" height="150" rx="8"/><text class="lbl" x="340.0" y="146.0" text-anchor="middle" dominant-baseline="central">GPU die</text><text class="sub" x="340.0" y="164.0" text-anchor="middle" dominant-baseline="central">814 mm²</text></g><g class="h"><rect x="110" y="80" width="100" height="66" rx="8"/><text class="lbl" x="160.0" y="104.0" text-anchor="middle" dominant-baseline="central">HBM3 stack</text><text class="sub" x="160.0" y="122.0" text-anchor="middle" dominant-baseline="central">1,024 wires</text></g><g class="h"><rect x="110" y="162" width="100" height="66" rx="8"/><text class="lbl" x="160.0" y="186.0" text-anchor="middle" dominant-baseline="central">HBM3 stack</text><text class="sub" x="160.0" y="204.0" text-anchor="middle" dominant-baseline="central">1,024 wires</text></g><g class="h"><rect x="470" y="80" width="100" height="66" rx="8"/><text class="lbl" x="520.0" y="104.0" text-anchor="middle" dominant-baseline="central">HBM3 stack</text><text class="sub" x="520.0" y="122.0" text-anchor="middle" dominant-baseline="central">1,024 wires</text></g><g class="h"><rect x="470" y="162" width="100" height="66" rx="8"/><text class="lbl" x="520.0" y="186.0" text-anchor="middle" dominant-baseline="central">HBM3 stack</text><text class="sub" x="520.0" y="204.0" text-anchor="middle" dominant-baseline="central">1,024 wires</text></g><g class="h"><rect x="470" y="244" width="100" height="66" rx="8"/><text class="lbl" x="520.0" y="268.0" text-anchor="middle" dominant-baseline="central">HBM3 stack</text><text class="sub" x="520.0" y="286.0" text-anchor="middle" dominant-baseline="central">1,024 wires</text></g><rect x="110" y="244" width="100" height="66" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="160.0" y="277.0" text-anchor="middle" dominant-baseline="central">unused site</text><g class="u"><rect x="40" y="340" width="330" height="34" rx="6"/><text class="sub" x="205.0" y="357.0" text-anchor="middle" dominant-baseline="central">5 stacks  ×  1,024 wires</text></g><text class="sub2" x="386" y="362" text-anchor="start">=  5,120 wires</text><g class="u"><rect x="40" y="386" width="330" height="34" rx="6"/><text class="sub" x="205.0" y="403.0" text-anchor="middle" dominant-baseline="central">×  2,619 million clocks a second  ×  2 transfers per clock</text></g><text class="sub2" x="386" y="408" text-anchor="start">=  5.238 billion bits a second on each wire</text><g class="u"><rect x="40" y="432" width="330" height="34" rx="6"/><text class="sub" x="205.0" y="449.0" text-anchor="middle" dominant-baseline="central">5,120  ×  5.238 billion</text></g><text class="sub2" x="386" y="454" text-anchor="start">=  26.8 trillion bits a second</text><g class="u"><rect x="40" y="478" width="330" height="34" rx="6"/><text class="sub" x="205.0" y="495.0" text-anchor="middle" dominant-baseline="central">÷  8 bits per byte</text></g><text class="sub2" x="386" y="500" text-anchor="start">=  3,352 GB/s, the 3.35 TB/s on the specification</text><text class="cap" x="40" y="550" text-anchor="start">Each stack is a pile of DRAM chips joined to the package by 1,024 data wires. The full</text><text class="cap" x="40" y="570" text-anchor="start">Hopper die has room for six stacks; the H100 sold in this form enables five, which is</text><text class="cap" x="40" y="590" text-anchor="start">where its 80 GB and its 5,120-bit memory interface come from.</text><text class="cap" x="40" y="630" text-anchor="start">Each wire is driven at 2,619 million clocks a second and carries a bit on both the</text><text class="cap" x="40" y="650" text-anchor="start">rising and the falling edge of the clock, so 5.24 billion bits a second. Nothing about</text><text class="cap" x="40" y="670" text-anchor="start">the memory is exotic per wire. The bandwidth comes from the count.</text></svg><figcaption>Schematic layout; the numbers are NVIDIA's (H100 whitepaper, final specifications). The same equation returns for the H200 and for the links between chips, and it is the reason bandwidth grows so slowly: more wires need more edge.</figcaption></figure>
