<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:24</div><h3>All the fast memory on the chip holds less than a thousandth of the model</h3><svg viewBox='0 0 680 564' role='img'><title>All the fast memory on the chip holds less than a thousandth of the model</title><text class="hd" x="40" y="46">Areas to scale: a 70B model's weights, and all the fast memory on the chip</text><g class="h"><rect x="40" y="62" width="600" height="300" rx="4"/><text class="sub" x="56" y="86">140 GB of weights</text><text class="sub" x="98.5" y="142.3">121.6 MB: every register, L1, shared memory and L2</text></g><g class="s"><rect x="70.0" y="132.0" width="12.5" height="12.5" rx="1"/></g><text class="cap" x="40" y="400" text-anchor="start">Memory sizes count in powers of two: a kilobyte of memory is 1,024 bytes and a megabyte</text><text class="cap" x="40" y="420" text-anchor="start">1,048,576. So the chip's registers are 33,792 KB = 34,603,008 bytes, the L1 and shared</text><text class="cap" x="40" y="440" text-anchor="start">memory the same again, and the 50 MB L2 is 52,428,800 bytes: 121.6 million bytes in all,</text><text class="cap" x="40" y="460" text-anchor="start">0.087% of the 140 billion bytes of a 70B model.</text><text class="cap" x="40" y="500" text-anchor="start">The L2 alone holds one part in 2,670 of the weights. Generating a token reads every</text><text class="cap" x="40" y="520" text-anchor="start">weight exactly once, so by the time a weight could be reused, thousands of others have</text><text class="cap" x="40" y="540" text-anchor="start">passed through: during decode the caches have almost nothing worth keeping.</text></svg><figcaption>Drawn as areas, so the small square's side is the square root of the ratio. This is why every token's weights must come up from HBM: there is nowhere closer to keep them.</figcaption></figure>
