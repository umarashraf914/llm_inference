<figure><div class='ts'>Fig 61 &nbsp;&middot;&nbsp; 10:28</div><h3>What a memory transaction is</h3><svg viewBox="0 0 680 326" role="img"><title>What a memory transaction is</title><text class="hd" x="40" y="46">The memory system has one unit of work: a transaction</text><g class="h"><rect x="40" y="74" width="600" height="40" rx="4"></rect><text class="sub" x="340.0" y="94.0" text-anchor="middle" dominant-baseline="central">one transaction always moves 128 bytes</text></g><text class="cap" x="40" y="156" text-anchor="start">You cannot ask for four bytes. The request goes out, a whole block comes back, and the block</text><text class="cap" x="40" y="176" text-anchor="start">is the same size whether you wanted one byte of it or all of it.</text><text class="cap" x="40" y="212" text-anchor="start">So the only question that matters is how much of each block gets used.</text><text class="cap" x="40" y="248" text-anchor="start">Thirty-two lanes asking for thirty-two consecutive numbers use every byte of one block. The</text><text class="cap" x="40" y="268" text-anchor="start">same thirty-two asking for scattered numbers pull thirty-two blocks and use a scrap of each.</text><text class="cap" x="40" y="304" text-anchor="start">Identical arithmetic, identical answer, thirty-two times the traffic.</text></svg><figcaption>One hardware fact with enormous consequences: memory is sold in blocks, and you pay for the whole block however little of it you wanted.</figcaption></figure>
