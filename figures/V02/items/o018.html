<figure><div class='ts'>Fig 18 &nbsp;&middot;&nbsp; 7:46</div><h3>Why there has to be a ladder at all</h3><svg viewBox='0 0 680 554' role="img"><title>Why there has to be a ladder at all</title><text class="hd" x="40" y="46">The same trade, in every storage technology ever built</text><line class="axis" x1="90" y1="260" x2="620" y2="260"></line><line class="axis" x1="90" y1="60" x2="90" y2="260"></line><text class="sub2" x="100" y="76" text-anchor="start">faster</text><text class="sub2" x="560" y="284" text-anchor="start">bigger</text><g class="s"><rect x="120" y="80" width="12" height="12" rx="6"></rect></g><text class="sub2" x="140" y="88" text-anchor="start">registers</text><g class="s"><rect x="200" y="132" width="12" height="12" rx="6"></rect></g><text class="sub2" x="220" y="140" text-anchor="start">on-chip SRAM</text><g class="u"><rect x="340" y="190" width="12" height="12" rx="6"></rect></g><text class="sub2" x="360" y="198" text-anchor="start">memory beside the chip</text><g class="h"><rect x="540" y="238" width="12" height="12" rx="6"></rect></g><text class="sub2" x="410" y="246" text-anchor="end">a disk</text><text class="cap" x="40" y="330" text-anchor="start">Nothing sits in the top right. No technology is both the fastest and the largest: the</text><text class="cap" x="40" y="350" text-anchor="start">fast kind is not dense, and the dense kind is not fast.</text><text class="cap" x="40" y="390" text-anchor="start">There is also geometry. Fast means close, and only a little of anything can be close to</text><text class="cap" x="40" y="410" text-anchor="start">a given point. Making a memory bigger necessarily puts most of it further away. Even</text><text class="cap" x="40" y="430" text-anchor="start">80 GB at register speed, if the cells allowed it, could not all be next to the</text><text class="cap" x="40" y="450" text-anchor="start">arithmetic.</text><text class="cap" x="40" y="490" text-anchor="start">So the only sensible design is a ladder: a very little of the fast kind, a great deal of</text><text class="cap" x="40" y="510" text-anchor="start">the slow kind, and machinery to move things between them. The four rungs that follow are</text><text class="cap" x="40" y="530" text-anchor="start">that ladder.</text></svg><figcaption>Positions are illustrative, the empty corner is not. Speed needs proximity and capacity needs area, two reasons that each alone would force a hierarchy.</figcaption></figure>
