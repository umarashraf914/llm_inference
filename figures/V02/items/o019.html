<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:58</div><h3>Fetching a number from DRAM costs 700 times the energy of adding it</h3><svg viewBox='0 0 680 476' role='img'><title>Fetching a number from DRAM costs 700 times the energy of adding it</title><text class="hd" x="40" y="46">Energy per operation at 45 nm, in picojoules (log axis)</text><line class="axis" x1="250" y1="290" x2="610" y2="290"/><line class="tick" x1="250.0" y1="290" x2="250.0" y2="295"/><text class="sub2" x="250.0" y="310" text-anchor="middle">0.1 pJ</text><line class="tick" x1="340.0" y1="290" x2="340.0" y2="295"/><text class="sub2" x="340.0" y="310" text-anchor="middle">1 pJ</text><line class="tick" x1="430.0" y1="290" x2="430.0" y2="295"/><text class="sub2" x="430.0" y="310" text-anchor="middle">10 pJ</text><line class="tick" x1="520.0" y1="290" x2="520.0" y2="295"/><text class="sub2" x="520.0" y="310" text-anchor="middle">100 pJ</text><line class="tick" x1="610.0" y1="290" x2="610.0" y2="295"/><text class="sub2" x="610.0" y="310" text-anchor="middle">1000 pJ</text><text class="cap" x="40" y="90" text-anchor="start">32-bit float add</text><g class="m"><rect x="250.0" y="70.0" width="85.9" height="30.0" rx="3"/></g><text class="sub2" x="345.88182584953927" y="90" text-anchor="start">0.9 pJ, 1.0×</text><text class="cap" x="40" y="142" text-anchor="start">32-bit float multiply</text><g class="m"><rect x="250" y="122" width="141.13815516602955" height="30" rx="3"/><text class="sub" x="320.56907758301475" y="137.0" text-anchor="middle" dominant-baseline="central">3.7 pJ, 4.1×</text></g><text class="cap" x="40" y="194" text-anchor="start">32-bit read, SRAM cache</text><g class="s"><rect x="250" y="174" width="152.9073003902417" height="30" rx="3"/><text class="sub" x="326.4536501951209" y="189.0" text-anchor="middle" dominant-baseline="central">5 pJ, 5.6×</text></g><text class="cap" x="40" y="246" text-anchor="start">32-bit read, DRAM</text><g class="h"><rect x="250" y="226" width="342.55619765854976" height="30" rx="3"/><text class="sub" x="421.2780988292749" y="241.0" text-anchor="middle" dominant-baseline="central">640 pJ, 711×</text></g><text class="cap" x="40" y="352" text-anchor="start">Fetching one 32-bit number from DRAM took 640 picojoules, 711 times the energy of adding</text><text class="cap" x="40" y="372" text-anchor="start">two such numbers once they have arrived. A read from a small on-chip SRAM cache cost 5</text><text class="cap" x="40" y="392" text-anchor="start">pJ, close to the arithmetic.</text><text class="cap" x="40" y="432" text-anchor="start">So the hierarchy is not only about time. On a chip limited by power, moving data is the</text><text class="cap" x="40" y="452" text-anchor="start">expensive act and computing is nearly free.</text></svg><figcaption>Energies from Han et al. 2015, after Horowitz, for a 45 nm process; the multiples are against the add. Absolute energies have shrunk since. The ordering has not, and it shapes every accelerator.</figcaption></figure>
