<figure><div class='ts'>Fig 19 &nbsp;&middot;&nbsp; 0:24</div><h3>Why moving data costs more than computing</h3><svg viewBox="0 0 680 392" role="img"><title>Why moving data costs more than computing</title><text class="hd" x="40" y="46">Energy per operation, relative to one addition</text><text class="cap" x="40" y="90" text-anchor="start">32-bit add</text><g class="s"><rect x="260" y="72" width="6.5" height="32" rx="3"></rect></g><text class="sub2" x="276.5" y="90" text-anchor="start">1x</text><text class="cap" x="40" y="142" text-anchor="start">32-bit multiply</text><g class="s"><rect x="260" y="124" width="8.0" height="32" rx="3"></rect></g><text class="sub2" x="278.0" y="142" text-anchor="start">4x</text><text class="cap" x="40" y="194" text-anchor="start">read 8 KB of SRAM</text><g class="s"><rect x="260" y="176" width="9.0" height="32" rx="3"></rect></g><text class="sub2" x="279.0" y="194" text-anchor="start">6x</text><text class="cap" x="40" y="246" text-anchor="start">read from DRAM</text><g class="h"><rect x="260" y="228" width="340" height="32" rx="3"></rect></g><text class="sub2" x="610" y="246" text-anchor="start">711x</text><text class="cap" x="40" y="300" text-anchor="start">Moving a number in from DRAM costs several hundred times more energy than doing arithmetic</text><text class="cap" x="40" y="320" text-anchor="start">on it once it has arrived.</text><text class="cap" x="40" y="350" text-anchor="start">So the hierarchy is not only about time. On a power-limited chip, data movement is the</text><text class="cap" x="40" y="370" text-anchor="start">expensive thing and computation is nearly free.</text></svg><figcaption>Ratios from published measurements at 45nm. Absolute numbers have shrunk since; the ordering has not, and it is what shapes accelerator design.</figcaption></figure>
