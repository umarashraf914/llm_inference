<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:58</div><h3>Fetching a number from DRAM costs 700 times the energy of adding it</h3><svg viewBox='0 0 680 476' role='img'><title>Fetching a number from DRAM costs 700 times the energy of adding it</title><text class="hd" x="40" y="46">Energy per operation at 45 nm, relative to one 32-bit float add (log axis)</text><line class="axis" x1="250" y1="290" x2="600" y2="290"/><line class="tick" x1="250.0" y1="290" x2="250.0" y2="295"/><text class="sub2" x="250.0" y="310" text-anchor="middle">1×</text><line class="tick" x1="366.7" y1="290" x2="366.7" y2="295"/><text class="sub2" x="366.7" y="310" text-anchor="middle">10×</text><line class="tick" x1="483.3" y1="290" x2="483.3" y2="295"/><text class="sub2" x="483.3" y="310" text-anchor="middle">100×</text><line class="tick" x1="600.0" y1="290" x2="600.0" y2="295"/><text class="sub2" x="600.0" y="310" text-anchor="middle">1,000×</text><text class="cap" x="40" y="90" text-anchor="start">32-bit float add</text><g class="m"><rect x="250.0" y="70.0" width="3.0" height="30.0" rx="3"/></g><text class="sub2" x="263" y="90" text-anchor="start">1.0×  (0.9 pJ)</text><text class="cap" x="40" y="142" text-anchor="start">32-bit float multiply</text><g class="m"><rect x="250.0" y="122.0" width="71.6" height="30.0" rx="3"/></g><text class="sub2" x="331.6285750398948" y="142" text-anchor="start">4.1×  (3.7 pJ)</text><text class="cap" x="40" y="194" text-anchor="start">32-bit read, SRAM cache</text><g class="s"><rect x="250.0" y="174.0" width="86.9" height="30.0" rx="3"/></g><text class="sub2" x="346.88487440461427" y="194" text-anchor="start">5.6×  (5 pJ)</text><text class="cap" x="40" y="246" text-anchor="start">32-bit read, DRAM</text><g class="h"><rect x="250.0" y="226.0" width="332.7" height="30.0" rx="3"/></g><text class="sub2" x="592.7260375301989" y="246" text-anchor="start">711×  (640 pJ)</text><text class="cap" x="40" y="352" text-anchor="start">Fetching one 32-bit number from DRAM took 640 picojoules, 711 times the energy of adding</text><text class="cap" x="40" y="372" text-anchor="start">two such numbers once they have arrived. A read from a small on-chip SRAM cache cost 5</text><text class="cap" x="40" y="392" text-anchor="start">pJ, close to the arithmetic.</text><text class="cap" x="40" y="432" text-anchor="start">So the hierarchy is not only about time. On a chip limited by power, moving data is the</text><text class="cap" x="40" y="452" text-anchor="start">expensive act and computing is nearly free.</text></svg><figcaption>Figures from Han et al. 2015, after Horowitz, for a 45 nm process; the add bar is one unit wide by definition. Absolute energies have shrunk since. The ordering has not, and it shapes every accelerator.</figcaption></figure>
