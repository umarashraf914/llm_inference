<figure><div class='ts'>Fig 41 &nbsp;&middot;&nbsp; 4:27</div><h3>Why a warp is 32 and not some other number</h3><svg viewBox="0 0 680 284" role="img"><title>Why a warp is 32 and not some other number</title><g class="u"><rect x="40" y="50" width="600" height="126" rx="14"></rect><text class="lbl" x="62" y="76">One multiprocessor</text></g><g class="m"><rect x="66" y="94" width="131" height="62" rx="8"></rect><text class="lbl" x="131.5" y="116.0" text-anchor="middle" dominant-baseline="central">Scheduler 1</text><text class="sub" x="131.5" y="134.0" text-anchor="middle" dominant-baseline="central">32 CUDA cores</text></g><g class="m"><rect x="211" y="94" width="131" height="62" rx="8"></rect><text class="lbl" x="276.5" y="116.0" text-anchor="middle" dominant-baseline="central">Scheduler 2</text><text class="sub" x="276.5" y="134.0" text-anchor="middle" dominant-baseline="central">32 CUDA cores</text></g><g class="m"><rect x="356" y="94" width="131" height="62" rx="8"></rect><text class="lbl" x="421.5" y="116.0" text-anchor="middle" dominant-baseline="central">Scheduler 3</text><text class="sub" x="421.5" y="134.0" text-anchor="middle" dominant-baseline="central">32 CUDA cores</text></g><g class="m"><rect x="501" y="94" width="131" height="62" rx="8"></rect><text class="lbl" x="566.5" y="116.0" text-anchor="middle" dominant-baseline="central">Scheduler 4</text><text class="sub" x="566.5" y="134.0" text-anchor="middle" dominant-baseline="central">32 CUDA cores</text></g><text class="cap" x="40" y="212" text-anchor="start">128 CUDA cores divided by 4 schedulers is 32, exactly one warp's width. Each scheduler owns</text><text class="cap" x="40" y="232" text-anchor="start">a partition sized to retire one warp per instruction.</text><text class="cap" x="40" y="262" text-anchor="start">The warp size is not arbitrary. It is the width of the hardware that executes it.</text></svg><figcaption>Two numbers stated separately turn out to be the same number. Once you see it, the whole execution model clicks into place.</figcaption></figure>
