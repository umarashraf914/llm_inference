<figure><div class='ts'>Fig 70 &nbsp;&middot;&nbsp; 12:00</div><h3>Why the two curves had to diverge</h3><svg viewBox="0 0 680 442" role="img"><title>Why the two curves had to diverge</title><text class="hd" x="40" y="46">Why bandwidth cannot keep up: it needs physical connections</text><text class="cap" x="40" y="96" text-anchor="start">On the same package</text><g class="s"><rect x="270" y="78" width="337.92" height="30" rx="3"></rect></g><text class="sub2" x="280" y="98" text-anchor="start">about 1,024 parallel signals</text><text class="sub2" x="40" y="116" text-anchor="start">a stack of memory, millimetres away</text><text class="cap" x="40" y="156" text-anchor="start">Across a board</text><g class="u"><rect x="270" y="138" width="21.12" height="30" rx="3"></rect></g><text class="sub2" x="303.12" y="156" text-anchor="start">about 64 signals</text><text class="sub2" x="40" y="176" text-anchor="start">centimetres away</text><text class="cap" x="40" y="216" text-anchor="start">Down a cable</text><g class="h"><rect x="270" y="198" width="1.32" height="30" rx="3"></rect></g><text class="sub2" x="283.32" y="216" text-anchor="start">about 4 signals</text><text class="sub2" x="40" y="236" text-anchor="start">metres away</text><text class="cap" x="40" y="288" text-anchor="start">Bandwidth is width times frequency, and width means real wires. A thousand of them can be run</text><text class="cap" x="40" y="308" text-anchor="start">over millimetres, dozens over centimetres, a handful over metres.</text><text class="cap" x="40" y="344" text-anchor="start">Arithmetic has no equivalent constraint. Adding more multipliers needs area, and area has been</text><text class="cap" x="40" y="364" text-anchor="start">getting cheaper for fifty years.</text><text class="cap" x="40" y="400" text-anchor="start">So one curve is limited by how small a transistor can be made, and the other by how many wires</text><text class="cap" x="40" y="420" text-anchor="start">will fit between two objects. They were never going to grow at the same rate.</text></svg><figcaption>Signal counts are approximate and vary by design. The ordering, and the reason for it, are not approximate at all.</figcaption></figure>
