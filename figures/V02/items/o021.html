<figure><div class='ts'>Fig 21 &nbsp;&middot;&nbsp; 1:39</div><h3>What general purpose actually costs</h3><svg viewBox="0 0 680 362" role="img"><title>What general purpose actually costs</title><text class="hd" x="40" y="46">A general-purpose processor does not know what is coming</text><g class="u"><rect x="40" y="74" width="130" height="36" rx="4"></rect><text class="sub" x="105.0" y="92.0" text-anchor="middle" dominant-baseline="central">an instruction</text></g><line class="conn" x1="176" y1="92" x2="196" y2="92" marker-end="url(#arw)"></line><g class="h"><rect x="202" y="74" width="200" height="36" rx="4"></rect><text class="sub" x="302.0" y="92.0" text-anchor="middle" dominant-baseline="central">might be anything at all</text></g><text class="cap" x="40" y="152" text-anchor="start">It could be arithmetic, a jump somewhere else, a read from memory, or a decision that depends</text><text class="cap" x="40" y="172" text-anchor="start">on a value not yet computed. The processor cannot know until it looks.</text><text class="cap" x="40" y="208" text-anchor="start">So it spends silicon on guessing: predicting which way a decision will go, fetching data before</text><text class="cap" x="40" y="228" text-anchor="start">it is asked for, and reordering work to fill gaps.</text><text class="cap" x="40" y="264" text-anchor="start">All of that machinery is pure overhead on a workload where the answer is always the same: it</text><text class="cap" x="40" y="284" text-anchor="start">is another multiply, on the next number along.</text><text class="cap" x="40" y="320" text-anchor="start">The GPU is a chip built for a workload that never surprises it, and that is the entire</text><text class="cap" x="40" y="340" text-anchor="start">difference between the two designs.</text></svg><figcaption>Anticipation is only worth paying for when you do not know what is next. On a matrix multiply you always do.</figcaption></figure>
