122" text-anchor="middle">operation</text><text class="cap" x="40" y="186" text-anchor="start">second 64 bits</text><g class="m"><rect x="581" y="166" width="58" height="30" rx="3"/><text class="sub" x="610.0" y="181.0" text-anchor="middle" dominant-baseline="central">8e</text></g><g class="u"><rect x="521" y="166" width="58" height="30" rx="3"/><text class="sub" x="550.0" y="181.0" text-anchor="middle" dominant-baseline="central">00</text></g><g class="u"><rect x="461" y="166" width="58" height="30" rx="3"/><text class="sub" x="490.0" y="181.0" text-anchor="middle" dominant-baseline="central">00</text></g><g class="u"><rect x="401" y="166" width="58" height="30" rx="3"/><text class="sub" x="430.0" y="181.0" text-anchor="middle" dominant-baseline="central">00</text></g><g class="u"><rect x="341" y="166" width="58" height="30" rx="3"/><text class="sub" x="370.0" y="181.0" text-anchor="middle" dominant-baseline="central">00</text></g><g class="u"><rect x="281" y="166" width="58" height="30" rx="3"/><text class="sub" x="310.0" y="181.0" text-anchor="middle" dominant-baseline="central">c4</text></g><g class="u"><rect x="221" y="166" width="58" height="30" rx="3"/><text class="sub" x="250.0" y="181.0" text-anchor="middle" dominant-baseline="central">0f</text></g><g class="u"><rect x="161" y="166" width="58" height="30" rx="3"/><text class="sub" x="190.0" y="181.0" text-anchor="middle" dominant-baseline="central">00</text></g><text class="sub2" x="280.0" y="214" text-anchor="middle">scheduling hints</text><text class="sub2" x="610.0" y="214" text-anchor="middle">reg 142</text><text class="hd" x="40" y="282">Before any arithmetic: fetch it, decode it, issue it</text><g class="u"><rect x="40" y="296" width="188" height="30" rx="6"/><text class="sub" x="134.0" y="311.0" text-anchor="middle" dominant-baseline="central">fetch: read the number</text></g><line class="conn" x1="230" y1="311" x2="244" y2="311" marker-end="url(#arw)"/><g class="u"><rect x="246" y="296" width="188" height="30" rx="6"/><text class="sub" x="340.0" y="311.0" text-anchor="middle" dominant-baseline="central">decode: split the fields</text></g><line class="conn" x1="436" y1="311" x2="450" y2="311" marker-end="url(#arw)"/><g class="m"><rect x="452" y="296" width="188" height="30" rx="6"/><text class="sub" x="546.0" y="311.0" text-anchor="middle" dominant-baseline="central">issue: send to the lanes</text></g><text class="hd" x="40" y="360">Fetches and decodes paid for 32 additions, to scale</text><text class="cap" x="40" y="394" text-anchor="start">one scalar core</text><g class="h"><rect x="170" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="184" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="198" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="212" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="226" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="240" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="254" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="268" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="282" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="296" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="310" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="324" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="338" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="352" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="366" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="380" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="394" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="408" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="422" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="436" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="450" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="464" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="478" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="492" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="506" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="520" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="534" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="548" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="562" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="576" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="590" y="376" width="12" height="26" rx="2"/></g><g class="h"><rect x="604" y="376" width="12" height="26" rx="2"/></g><text class="sub2" x="626" y="394" text-anchor="start">32</text><text class="cap" x="40" y="430" text-anchor="start">one warp</text><g class="s"><rect x="170" y="412" width="12" height="26" rx="2"/></g><text class="sub2" x="192" y="430" text-anchor="start">1</text><text class="cap" x="40" y="488" text-anchor="start">A program is stored in memory like any other data. On Volta, the first chip with tensor</text><text class="cap" x="40" y="508" text-anchor="start">cores, each instruction is one 128-bit number: here the bytes 8c, 0b and 04 name</text><text class="cap" x="40" y="528" text-anchor="start">registers 140, 11 and 4, the second word's 8e names register 142, and the low bits of</text><text class="cap" x="40" y="548" text-anchor="start">the first word name the operation.</text><text class="cap" x="40" y="588" text-anchor="start">Before anything is computed, the chip must fetch that number and decode it, splitting it</text><text class="cap" x="40" y="608" text-anchor="start">into fields and routing each one. That machinery is real silicon and spends energy on</text><text class="cap" x="40" y="628" text-anchor="start">every instruction. A scalar core pays it for every operation it runs; a warp pays it</text><text class="cap" x="40" y="648" text-anchor="start">once and spreads it across 32 lanes.</text></svg><figcaption>Fetch and decode are paid per instruction, not per operation, so sharing one instruction across 32 lanes divides their cost by 32. That saving is the silicon that becomes arithmetic. Encoding from Jia et al. 2018.</figcaption></figure>
