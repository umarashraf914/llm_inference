<figure><div class='ts'>Fig 89 &nbsp;&middot;&nbsp; 16:44</div><h3>The accumulation safeguard</h3><svg viewBox="0 0 680 178" role="img"><title>The accumulation safeguard</title><g class="m"><rect x="40" y="50" width="250" height="66" rx="8"></rect><text class="lbl" x="165.0" y="74.0" text-anchor="middle" dominant-baseline="central">Multiplies run</text><text class="sub" x="165.0" y="92.0" text-anchor="middle" dominant-baseline="central">in low precision</text></g><line class="conn" x1="294" y1="83" x2="344" y2="83" marker-end="url(#arw)"></line><g class="s"><rect x="350" y="50" width="290" height="66" rx="8"></rect><text class="lbl" x="495.0" y="74.0" text-anchor="middle" dominant-baseline="central">Results accumulate back in FP32</text><text class="sub" x="495.0" y="92.0" text-anchor="middle" dominant-baseline="central">so errors do not pile up</text></g><text class="cap" x="40" y="156" text-anchor="start">The safeguard that makes the whole ladder safe to use.</text></svg><figcaption>Storing in low precision, computing in low precision and accumulating in low precision are three separate decisions. Only the first two are usually taken.</figcaption></figure>
