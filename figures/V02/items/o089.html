<figure><div class='ts'>Fig 89 &nbsp;&middot;&nbsp; 16:44</div><h3>The accumulation safeguard</h3><svg viewBox='0 0 680 274' role="img"><title>The accumulation safeguard</title><g class="m"><rect x="40" y="50" width="250" height="66" rx="8"></rect><text class="lbl" x="165.0" y="74.0" text-anchor="middle" dominant-baseline="central">Multiplies run</text><text class="sub" x="165.0" y="92.0" text-anchor="middle" dominant-baseline="central">in low precision</text></g><line class="conn" x1="294" y1="83" x2="344" y2="83" marker-end="url(#arw)"></line><g class="s"><rect x="350" y="50" width="290" height="66" rx="8"></rect><text class="lbl" x="495.0" y="74.0" text-anchor="middle" dominant-baseline="central">Results accumulate back in FP32</text><text class="sub" x="495.0" y="92.0" text-anchor="middle" dominant-baseline="central">so errors do not pile up</text></g><text class="cap" x="40" y="150" text-anchor="start">Each product is added into a running total ({{fig:v01-o111}}), and the total is kept in FP32</text><text class="cap" x="40" y="170" text-anchor="start">even when the inputs are BF16 or FP8. It costs no speed: the H100's 989.4 trillion BF16</text><text class="cap" x="40" y="190" text-anchor="start">operations a second are quoted with FP32 accumulation.</text><text class="cap" x="40" y="230" text-anchor="start">Google's TPUs make the same choice: bfloat16 multiplies, FP32 accumulation. The next</text><text class="cap" x="40" y="250" text-anchor="start">figure shows what goes wrong without it.</text></svg><figcaption>Storing, multiplying and accumulating in low precision are three separate decisions; the hardware takes the first two and declines the third. Sources: the H100 whitepaper's Table 3 and Google Cloud's TPU architecture page.</figcaption></figure>
