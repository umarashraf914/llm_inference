<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 10:35</div><h3>32 lanes of 4 bytes fill one 128-byte line exactly</h3><svg viewBox='0 0 680 492' role='img'><title>32 lanes of 4 bytes fill one 128-byte line exactly</title><g class="m"><rect x="90" y="46" width="500" height="42" rx="6"/><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">32 threads  ×  4 bytes  =  128 bytes  =  one line  =  four sectors</text></g><text class="hd" x="40" y="136">What one warp instruction turns into, to scale</text><text class="cap" x="40" y="170" text-anchor="start">line requests</text><g class="s"><rect x="300.0" y="152.0" width="6.9" height="24.0" rx="3"/></g><text class="sub2" x="316.875" y="169" text-anchor="start">1  (neighbours)</text><g class="h"><rect x="300.0" y="184.0" width="220.0" height="24.0" rx="3"/></g><text class="sub2" x="530.0" y="201" text-anchor="start">32  (128 bytes apart)</text><text class="cap" x="40" y="256" text-anchor="start">sectors moved</text><g class="s"><rect x="300.0" y="238.0" width="27.5" height="24.0" rx="3"/></g><text class="sub2" x="337.5" y="255" text-anchor="start">4  (neighbours)</text><g class="h"><rect x="300.0" y="270.0" width="220.0" height="24.0" rx="3"/></g><text class="sub2" x="530.0" y="287" text-anchor="start">32  (128 bytes apart)</text><text class="cap" x="40" y="348" text-anchor="start">The warp width and the line size are matched: a warp reading 32 consecutive 4-byte</text><text class="cap" x="40" y="368" text-anchor="start">numbers asks for exactly one 128-byte line, and its four sectors carry nothing but</text><text class="cap" x="40" y="388" text-anchor="start">wanted bytes.</text><text class="cap" x="40" y="428" text-anchor="start">Put the lanes 128 bytes apart and every lane needs a line of its own: 32 requests where</text><text class="cap" x="40" y="448" text-anchor="start">one would have done, the 32 transactions usually quoted. The bytes grow only eightfold,</text><text class="cap" x="40" y="468" text-anchor="start">from 4 sectors to 32, because each request brings one 32-byte sector, not a whole line.</text></svg><figcaption>Two costs, counted separately: requests the caches must handle, and bytes the memory must move. Scattering multiplies the first by 32 and the second by 8.</figcaption></figure>
