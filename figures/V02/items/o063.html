<figure><div class='ts'>Fig 63 &nbsp;&middot;&nbsp; 10:38</div><h3>Why 32 lanes and 128-byte lines are matched</h3><svg viewBox="0 0 680 390" role="img"><title>Why 32 lanes and 128-byte lines are matched</title><g class="m"><rect x="90" y="46" width="500" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">32 threads  x  4 bytes each  =  128 bytes  =  exactly one cache line</text></g><text class="cap" x="40" y="118" text-anchor="start">The warp width and the cache line size are matched by design. A warp reading 32 consecutive</text><text class="cap" x="40" y="138" text-anchor="start">floats requests exactly one line, and every byte fetched is wanted.</text><text class="cap" x="40" y="178" text-anchor="start">Stride the access by one line and each thread lands in a different block. The warp now needs</text><text class="cap" x="40" y="198" text-anchor="start">32 separate transactions and uses 4 bytes out of every 128 fetched.</text><text class="cap" x="40" y="238" text-anchor="start">Perfectly coalesced</text><g class="s"><rect x="300" y="222" width="320" height="28" rx="3"></rect><text class="sub" x="460.0" y="236.0" text-anchor="middle" dominant-baseline="central">100% of fetched bytes used</text></g><text class="cap" x="40" y="288" text-anchor="start">Strided by 128 bytes</text><g class="h"><rect x="300" y="272" width="10" height="28" rx="2"></rect></g><text class="sub2" x="320" y="291" text-anchor="start">3% used, 32x the transactions</text><text class="cap" x="40" y="348" text-anchor="start">Same arithmetic, same number of values, thirty-two times the memory traffic. Nothing about</text><text class="cap" x="40" y="368" text-anchor="start">the computation changed; only where the data sat.</text></svg><figcaption>This is the quantitative version of coalescing. On a chip this memory-bound, data layout is as decisive as the choice of algorithm.</figcaption></figure>
