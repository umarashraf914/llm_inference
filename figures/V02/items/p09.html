<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:54</div><h3>One multiprocessor is four identical quarters</h3><svg viewBox='0 0 680 634' role='img'><title>One multiprocessor is four identical quarters</title><g class="u"><rect x="40" y="60" width="600" height="318" rx="14"/><text class="lbl" x="62" y="86">One H100 multiprocessor</text></g><g class="u"><rect x="58" y="104" width="135" height="198" rx="10"/><text class="sub" x="70" y="126">quarter 1</text></g><g class="u"><rect x="70" y="140" width="111" height="30" rx="4"/><text class="sub" x="125.5" y="155.0" text-anchor="middle" dominant-baseline="central">scheduler</text></g><g class="m"><rect x="70" y="178" width="111" height="30" rx="4"/><text class="sub" x="125.5" y="193.0" text-anchor="middle" dominant-baseline="central">32 FP32 lanes</text></g><g class="m"><rect x="70" y="216" width="111" height="30" rx="4"/><text class="sub" x="125.5" y="231.0" text-anchor="middle" dominant-baseline="central">1 tensor core</text></g><g class="s"><rect x="70" y="254" width="111" height="30" rx="4"/><text class="sub" x="125.5" y="269.0" text-anchor="middle" dominant-baseline="central">16,384 registers</text></g><g class="u"><rect x="201" y="104" width="135" height="198" rx="10"/><text class="sub" x="213" y="126">quarter 2</text></g><g class="u"><rect x="213" y="140" width="111" height="30" rx="4"/><text class="sub" x="268.5" y="155.0" text-anchor="middle" dominant-baseline="central">scheduler</text></g><g class="m"><rect x="213" y="178" width="111" height="30" rx="4"/><text class="sub" x="268.5" y="193.0" text-anchor="middle" dominant-baseline="central">32 FP32 lanes</text></g><g class="m"><rect x="213" y="216" width="111" height="30" rx="4"/><text class="sub" x="268.5" y="231.0" text-anchor="middle" dominant-baseline="central">1 tensor core</text></g><g class="s"><rect x="213" y="254" width="111" height="30" rx="4"/><text class="sub" x="268.5" y="269.0" text-anchor="middle" dominant-baseline="central">16,384 registers</text></g><g class="u"><rect x="344" y="104" width="135" height="198" rx="10"/><text class="sub" x="356" y="126">quarter 3</text></g><g class="u"><rect x="356" y="140" width="111" height="30" rx="4"/><text class="sub" x="411.5" y="155.0" text-anchor="middle" dominant-baseline="central">scheduler</text></g><g class="m"><rect x="356" y="178" width="111" height="30" rx="4"/><text class="sub" x="411.5" y="193.0" text-anchor="middle" dominant-baseline="central">32 FP32 lanes</text></g><g class="m"><rect x="356" y="216" width="111" height="30" rx="4"/><text class="sub" x="411.5" y="231.0" text-anchor="middle" dominant-baseline="central">1 tensor core</text></g><g class="s"><rect x="356" y="254" width="111" height="30" rx="4"/><text class="sub" x="411.5" y="269.0" text-anchor="middle" dominant-baseline="central">16,384 registers</text></g><g class="u"><rect x="487" y="104" width="135" height="198" rx="10"/><text class="sub" x="499" y="126">quarter 4</text></g><g class="u"><rect x="499" y="140" width="111" height="30" rx="4"/><text class="sub" x="554.5" y="155.0" text-anchor="middle" dominant-baseline="central">scheduler</text></g><g class="m"><rect x="499" y="178" width="111" height="30" rx="4"/><text class="sub" x="554.5" y="193.0" text-anchor="middle" dominant-baseline="central">32 FP32 lanes</text></g><g class="m"><rect x="499" y="216" width="111" height="30" rx="4"/><text class="sub" x="554.5" y="231.0" text-anchor="middle" dominant-baseline="central">1 tensor core</text></g><g class="s"><rect x="499" y="254" width="111" height="30" rx="4"/><text class="sub" x="554.5" y="269.0" text-anchor="middle" dominant-baseline="central">16,384 registers</text></g><g class="s"><rect x="58" y="316" width="412" height="38" rx="6"/><text class="sub" x="264.0" y="335.0" text-anchor="middle" dominant-baseline="central">256 KB of L1 cache and shared memory, for all four</text></g><g class="u"><rect x="478" y="316" width="144" height="38" rx="6"/><text class="sub" x="550.0" y="335.0" text-anchor="middle" dominant-baseline="central">TMA copy engine</text></g><text class="cap" x="40" y="410" text-anchor="start">A multiprocessor is four identical quarters. Each has its own scheduler, 32 of the 128</text><text class="cap" x="40" y="430" text-anchor="start">FP32 lanes, one of the four tensor cores and a quarter of the register file: 16,384</text><text class="cap" x="40" y="450" text-anchor="start">registers, 64 KB. The 256 KB of L1 and shared memory, and the copy engine, serve all</text><text class="cap" x="40" y="470" text-anchor="start">four.</text><text class="cap" x="40" y="510" text-anchor="start">128 lanes ÷ 4 schedulers = 32, so each scheduler can send one instruction across 32</text><text class="cap" x="40" y="530" text-anchor="start">threads in a single tick. That is exactly the size of the group a scheduler issues to,</text><text class="cap" x="40" y="550" text-anchor="start">which the next part names.</text><text class="cap" x="40" y="590" text-anchor="start">The match is the H100's, not a law: an A100 multiprocessor has 64 FP32 lanes, 16 a</text><text class="cap" x="40" y="610" text-anchor="start">quarter, and runs the same 32-thread instruction over two ticks.</text></svg><figcaption>A floor plan: the four quarters are peers, side by side, and none contains another. The next part builds the hierarchy of threads that runs on them. Layout from NVIDIA's H100 whitepaper and CUDA programming guide.</figcaption></figure>
