<figure><div class='ts'>Fig 26 &nbsp;&middot;&nbsp; 2:48</div><h3>Where the bet loses</h3><svg viewBox='0 0 680 404' role="img"><title>Where the bet loses</title><text class="hd" x="40" y="46">Where the GPU bet loses</text><g class="s"><rect x="40" y="74" width="285" height="82" rx="8"></rect><text class="lbl" x="182.5" y="98.0" text-anchor="middle" dominant-baseline="central">Work with no dependencies</text><text class="sub" x="182.5" y="116.0" text-anchor="middle" dominant-baseline="central">millions of identical multiplies,</text><text class="sub" x="182.5" y="133.0" text-anchor="middle" dominant-baseline="central">in any order</text></g><g class="h"><rect x="355" y="74" width="285" height="82" rx="8"></rect><text class="lbl" x="497.5" y="98.0" text-anchor="middle" dominant-baseline="central">Work that forms a chain</text><text class="sub" x="497.5" y="116.0" text-anchor="middle" dominant-baseline="central">each step needs the answer</text><text class="sub" x="497.5" y="133.0" text-anchor="middle" dominant-baseline="central">from the one before</text></g><text class="cap" x="40" y="200" text-anchor="start">For the first, a thousand slow lanes finish far sooner than four fast ones. For the</text><text class="cap" x="40" y="220" text-anchor="start">second, nine hundred and ninety-nine of those lanes have nothing to do.</text><text class="cap" x="40" y="260" text-anchor="start">A chain runs at the speed of one lane, and one GPU lane is much slower than one CPU</text><text class="cap" x="40" y="280" text-anchor="start">core.</text><text class="cap" x="40" y="320" text-anchor="start">Tokens do form a chain, since each needs the one before. But every link is a full pass</text><text class="cap" x="40" y="340" text-anchor="start">through the model: one 4,096 × 4,096 matrix times a vector alone is 16,777,216</text><text class="cap" x="40" y="360" text-anchor="start">independent multiply-adds. The lanes have plenty to do. What starves them in decode is</text><text class="cap" x="40" y="380" text-anchor="start">that each weight fetched is used once ({{fig:v01-o112}}).</text></svg><figcaption>The trade is not free for genuinely serial work. Decode is not that: its chain is long but every link is wide, and what it lacks is reuse of each byte, not parallel work.</figcaption></figure>
