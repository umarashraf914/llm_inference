<figure><div class='ts'>Fig 26 &nbsp;&middot;&nbsp; 2:48</div><h3>Where the bet loses</h3><svg viewBox="0 0 680 334" role="img"><title>Where the bet loses</title><text class="hd" x="40" y="46">Where the GPU bet loses</text><g class="s"><rect x="40" y="74" width="285" height="82" rx="8"></rect><text class="lbl" x="182.5" y="98.0" text-anchor="middle" dominant-baseline="central">Work with no dependencies</text><text class="sub" x="182.5" y="116.0" text-anchor="middle" dominant-baseline="central">millions of identical multiplies,</text><text class="sub" x="182.5" y="133.0" text-anchor="middle" dominant-baseline="central">in any order</text></g><g class="h"><rect x="355" y="74" width="285" height="82" rx="8"></rect><text class="lbl" x="497.5" y="98.0" text-anchor="middle" dominant-baseline="central">Work that forms a chain</text><text class="sub" x="497.5" y="116.0" text-anchor="middle" dominant-baseline="central">each step needs the answer</text><text class="sub" x="497.5" y="133.0" text-anchor="middle" dominant-baseline="central">from the one before</text></g><text class="cap" x="40" y="200" text-anchor="start">For the first, a thousand slow lanes finish far sooner than four fast ones. For the second,</text><text class="cap" x="40" y="220" text-anchor="start">nine hundred and ninety-nine of those lanes have nothing to do.</text><text class="cap" x="40" y="256" text-anchor="start">A chain runs at the speed of one lane, and one GPU lane is much slower than one CPU core.</text><text class="cap" x="40" y="292" text-anchor="start">Keep this in view. Producing one token after another is a chain, and it is why the second half</text><text class="cap" x="40" y="312" text-anchor="start">of this series exists.</text></svg><figcaption>The trade is not free. Every property that makes this chip good at prefill makes it bad at sequential work, and decode is sequential.</figcaption></figure>
