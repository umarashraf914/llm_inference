<figure><div class='ts'>Fig 01 &nbsp;&middot;&nbsp; 0:00</div><h3>What a chip physically is</h3><svg viewBox="0 0 680 492" role="img"><title>What a chip physically is</title><text class="hd" x="40" y="46">What is actually inside the package</text><g class="u"><rect x="40" y="66" width="600" height="190" rx="14"></rect><text class="lbl" x="62" y="92">The package: what you can hold</text></g><g class="h"><rect x="70" y="122" width="120" height="110" rx="4"></rect><text class="sub" x="130.0" y="177.0" text-anchor="middle" dominant-baseline="central">memory</text></g><g class="m"><rect x="200" y="122" width="260" height="110" rx="6"></rect><text class="sub" x="330.0" y="177.0" text-anchor="middle" dominant-baseline="central">the die</text></g><g class="h"><rect x="470" y="122" width="120" height="110" rx="4"></rect><text class="sub" x="530.0" y="177.0" text-anchor="middle" dominant-baseline="central">memory</text></g><text class="sub2" x="70" y="288" text-anchor="start">the die is a single square of silicon, roughly 29 mm on a side</text><text class="cap" x="40" y="338" text-anchor="start">About eighty billion transistors are printed onto that square, which works out at roughly a</text><text class="cap" x="40" y="358" text-anchor="start">hundred million of them per square millimetre.</text><text class="cap" x="40" y="394" text-anchor="start">Nothing is assembled by hand. The pattern is printed with light, all at once, the way a</text><text class="cap" x="40" y="414" text-anchor="start">photograph is developed.</text><text class="cap" x="40" y="450" text-anchor="start">Everything this document describes, all 132 multiprocessors and every cache, is regions of</text><text class="cap" x="40" y="470" text-anchor="start">that one square.</text></svg><figcaption>Useful scale for the phrase silicon budget. When a later figure says the CPU spends its area differently, it means literally which parts of this square do what.</figcaption></figure>
