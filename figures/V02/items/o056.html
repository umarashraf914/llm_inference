<figure><div class='ts'>Fig 56 &nbsp;&middot;&nbsp; 9:13</div><h3>The stall</h3><svg viewBox="0 0 680 192" role="img"><title>The stall</title><text class="cap" x="40" y="78" text-anchor="start">One warp</text><g class="m"><rect x="160" y="62" width="70" height="32" rx="4"></rect><text class="sub" x="195.0" y="78.0" text-anchor="middle" dominant-baseline="central">compute</text></g><g class="h"><rect x="234" y="62" width="300" height="32" rx="4"></rect><text class="sub" x="384.0" y="78.0" text-anchor="middle" dominant-baseline="central">stalled, hundreds of cycles</text></g><g class="m"><rect x="538" y="62" width="70" height="32" rx="4"></rect><text class="sub" x="573.0" y="78.0" text-anchor="middle" dominant-baseline="central">resumes</text></g><text class="cap" x="40" y="142" text-anchor="start">A CPU would dodge a wait like this by predicting what comes next and fetching early.</text><text class="cap" x="40" y="170" text-anchor="start">The GPU has none of that machinery. It does something simpler instead.</text></svg><figcaption>Hundreds of cycles, every time a value is not already on chip. With no prefetching, this would be fatal if the chip had only one thread to run.</figcaption></figure>
