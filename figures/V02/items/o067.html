<figure><div class='ts'>Fig 67 &nbsp;&middot;&nbsp; 11:43</div><h3>What a generation is</h3><svg viewBox="0 0 680 442" role="img"><title>What a generation is</title><text class="hd" x="40" y="46">What a generation means</text><text class="cap" x="40" y="96" text-anchor="start">Volta</text><text class="sub2" x="130" y="96" text-anchor="start">2017</text><g class="m"><rect x="210" y="78" width="43.199999999999996" height="30" rx="3"></rect></g><text class="cap" x="40" y="142" text-anchor="start">Ampere</text><text class="sub2" x="130" y="142" text-anchor="start">2020</text><g class="m"><rect x="210" y="124" width="93.6" height="30" rx="3"></rect></g><text class="cap" x="40" y="188" text-anchor="start">Hopper</text><text class="sub2" x="130" y="188" text-anchor="start">2022</text><g class="m"><rect x="210" y="170" width="216.0" height="30" rx="3"></rect></g><text class="cap" x="40" y="234" text-anchor="start">Blackwell</text><text class="sub2" x="130" y="234" text-anchor="start">2024</text><g class="m"><rect x="210" y="216" width="403.2" height="30" rx="3"></rect></g><text class="cap" x="40" y="288" text-anchor="start">Roughly every two years, a new design on a smaller manufacturing process. Bars show peak</text><text class="cap" x="40" y="308" text-anchor="start">arithmetic rate, and most generations add a narrower number format that multiplies it again.</text><text class="cap" x="40" y="344" text-anchor="start">A quantity that doubles every two years grows thirty-two-fold in a decade. Arithmetic has</text><text class="cap" x="40" y="364" text-anchor="start">roughly kept that pace.</text><text class="cap" x="40" y="400" text-anchor="start">Memory bandwidth has not, and the next figures are about why that difference is structural</text><text class="cap" x="40" y="420" text-anchor="start">rather than a matter of effort.</text></svg><figcaption>Bars are relative peak rates rather than a single measured metric. The point is the shape of the climb, not any one number on it.</figcaption></figure>
