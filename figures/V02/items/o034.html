<figure><div class='ts'>Fig 34 &nbsp;&middot;&nbsp; 4:27</div><h3>What the scheduler is choosing between</h3><svg viewBox="0 0 680 286" role="img"><title>What the scheduler is choosing between</title><text class="hd" x="40" y="46">What a scheduler decides, every cycle</text><g class="u"><rect x="40" y="74" width="200" height="36" rx="4"></rect><text class="sub" x="140.0" y="92.0" text-anchor="middle" dominant-baseline="central">64 groups, all resident</text></g><line class="conn" x1="246" y1="92" x2="266" y2="92" marker-end="url(#arw)"></line><g class="m"><rect x="272" y="74" width="190" height="36" rx="4"></rect><text class="sub" x="367.0" y="92.0" text-anchor="middle" dominant-baseline="central">which one can run now?</text></g><line class="conn" x1="468" y1="92" x2="488" y2="92" marker-end="url(#arw)"></line><g class="s"><rect x="494" y="74" width="146" height="36" rx="4"></rect><text class="sub" x="567.0" y="92.0" text-anchor="middle" dominant-baseline="central">issue one instruction</text></g><text class="cap" x="40" y="152" text-anchor="start">A group whose data has not arrived cannot run. A group waiting on another group cannot run.</text><text class="cap" x="40" y="172" text-anchor="start">The scheduler picks from whatever is ready and issues its next instruction.</text><text class="cap" x="40" y="208" text-anchor="start">It makes that choice in hardware, in a single cycle, with no involvement from the program.</text><text class="cap" x="40" y="244" text-anchor="start">If nothing is ready, the unit sits idle for that cycle. That is the failure this whole chip is</text><text class="cap" x="40" y="264" text-anchor="start">designed to avoid, and the next parts are about how.</text></svg><figcaption>One decision, repeated a billion times a second. Everything about occupancy and latency hiding is about making sure this choice is never empty.</figcaption></figure>
