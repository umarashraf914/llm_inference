<figure><div class='ts'>Fig 34 &nbsp;&middot;&nbsp; 4:27</div><h3>What the scheduler is choosing between</h3><svg viewBox='0 0 680 336' role="img"><title>What the scheduler is choosing between</title><text class="hd" x="40" y="46">What a scheduler decides, every cycle</text><g class="u"><rect x="40" y="74" width="200" height="36" rx="4"></rect><text class="sub" x="140.0" y="92.0" text-anchor="middle" dominant-baseline="central">its 16 resident groups</text></g><line class="conn" x1="246" y1="92" x2="266" y2="92" marker-end="url(#arw)"></line><g class="m"><rect x="272" y="74" width="190" height="36" rx="4"></rect><text class="sub" x="367.0" y="92.0" text-anchor="middle" dominant-baseline="central">which one can run now?</text></g><line class="conn" x1="468" y1="92" x2="488" y2="92" marker-end="url(#arw)"></line><g class="s"><rect x="494" y="74" width="146" height="36" rx="4"></rect><text class="sub" x="567.0" y="92.0" text-anchor="middle" dominant-baseline="central">issue one instruction</text></g><text class="cap" x="40" y="152" text-anchor="start">Each of the four schedulers owns a quarter of the groups resident on the multiprocessor,</text><text class="cap" x="40" y="172" text-anchor="start">16 of the 64. A group is handed to one scheduler when it arrives and stays with it.</text><text class="cap" x="40" y="212" text-anchor="start">A group whose data has not arrived cannot run. A group waiting on another group cannot</text><text class="cap" x="40" y="232" text-anchor="start">run. The scheduler picks from whatever is ready and issues its next instruction, in</text><text class="cap" x="40" y="252" text-anchor="start">hardware, in a single cycle, with no involvement from the program.</text><text class="cap" x="40" y="292" text-anchor="start">If none of its 16 is ready, that scheduler's lanes sit idle for the cycle. That is the</text><text class="cap" x="40" y="312" text-anchor="start">failure this whole chip is designed to avoid, and the next parts are about how.</text></svg><figcaption>One decision, repeated a billion times a second. Everything about occupancy and latency hiding is about making sure this choice is never empty.</figcaption></figure>
