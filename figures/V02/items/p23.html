<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 14:04</div><h3>Multiplying two matrices is every row meeting every column</h3><svg viewBox='0 0 680 518' role='img'><title>Multiplying two matrices is every row meeting every column</title><text class="hd" x="40" y="46">Row 1 of A meets column 1 of B: multiply the pairs, add, and that is one entry</text><g class="m"><rect x="250" y="66" width="40" height="40" rx="3"/><text class="sub" x="270.0" y="86.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="s"><rect x="294" y="66" width="40" height="40" rx="3"/><text class="sub" x="314.0" y="86.0" text-anchor="middle" dominant-baseline="central">6</text></g><g class="m"><rect x="250" y="110" width="40" height="40" rx="3"/><text class="sub" x="270.0" y="130.0" text-anchor="middle" dominant-baseline="central">7</text></g><g class="s"><rect x="294" y="110" width="40" height="40" rx="3"/><text class="sub" x="314.0" y="130.0" text-anchor="middle" dominant-baseline="central">8</text></g><g class="m"><rect x="130" y="166" width="40" height="40" rx="3"/><text class="sub" x="150.0" y="186.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="174" y="166" width="40" height="40" rx="3"/><text class="sub" x="194.0" y="186.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="s"><rect x="130" y="210" width="40" height="40" rx="3"/><text class="sub" x="150.0" y="230.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="s"><rect x="174" y="210" width="40" height="40" rx="3"/><text class="sub" x="194.0" y="230.0" text-anchor="middle" dominant-baseline="central">4</text></g><g class="m"><rect x="250" y="166" width="40" height="40" rx="3"/><text class="sub" x="270.0" y="186.0" text-anchor="middle" dominant-baseline="central">19</text></g><g class="u"><rect x="294" y="166" width="40" height="40" rx="3"/><text class="sub" x="314.0" y="186.0" text-anchor="middle" dominant-baseline="central">22</text></g><g class="u"><rect x="250" y="210" width="40" height="40" rx="3"/><text class="sub" x="270.0" y="230.0" text-anchor="middle" dominant-baseline="central">43</text></g><g class="u"><rect x="294" y="210" width="40" height="40" rx="3"/><text class="sub" x="314.0" y="230.0" text-anchor="middle" dominant-baseline="central">50</text></g><text class="sub2" x="346" y="114" text-anchor="start">B</text><text class="sub2" x="112" y="214" text-anchor="start">A</text><text class="sub2" x="346" y="214" text-anchor="start">C = A × B</text><g class="m"><rect x="420" y="112" width="220" height="28" rx="5"/><text class="sub" x="530.0" y="126.0" text-anchor="middle" dominant-baseline="central">c11  =  1 × 5  +  2 × 7  =  19</text></g><g class="u"><rect x="420" y="146" width="220" height="28" rx="5"/><text class="sub" x="530.0" y="160.0" text-anchor="middle" dominant-baseline="central">c12  =  1 × 6  +  2 × 8  =  22</text></g><g class="u"><rect x="420" y="180" width="220" height="28" rx="5"/><text class="sub" x="530.0" y="194.0" text-anchor="middle" dominant-baseline="central">c21  =  3 × 5  +  4 × 7  =  43</text></g><g class="u"><rect x="420" y="214" width="220" height="28" rx="5"/><text class="sub" x="530.0" y="228.0" text-anchor="middle" dominant-baseline="central">c22  =  3 × 6  +  4 × 8  =  50</text></g><text class="cap" x="40" y="294" text-anchor="start">To multiply two matrices, every row of the first meets every column of the second.</text><text class="cap" x="40" y="314" text-anchor="start">Multiply the pairs, add the products, and the sum is one entry of the answer: row 1 of A</text><text class="cap" x="40" y="334" text-anchor="start">against column 1 of B gives 1 × 5 + 2 × 7 = 19.</text><text class="cap" x="40" y="374" text-anchor="start">Two 2 × 2 matrices take 8 multiply-adds, and every number is used twice: the 1 meets</text><text class="cap" x="40" y="394" text-anchor="start">both the 5 and the 6. For two n × n matrices it is n³ multiply-adds from 2n² numbers, so</text><text class="cap" x="40" y="414" text-anchor="start">every number is used n times.</text><text class="cap" x="40" y="454" text-anchor="start">A matrix times a vector is the case where B has one column ({{fig:v01-o085}}): each</text><text class="cap" x="40" y="474" text-anchor="start">weight meets one number and is used once. That is decode. A prompt of many tokens makes</text><text class="cap" x="40" y="494" text-anchor="start">B a matrix with a column per token, and every weight is used once per token.</text></svg><figcaption>Matrix × matrix is matrix × vector done for many vectors at once. The reuse that brings is the whole difference between prefill and decode, and the whole reason for the tensor core.</figcaption></figure>
