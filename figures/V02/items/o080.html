<figure><div class='ts'>Fig 80 &nbsp;&middot;&nbsp; 14:46</div><h3>Why one operation gets its own hardware</h3><svg viewBox='0 0 680 340' role="img"><title>Why one operation gets its own hardware</title><text class="hd" x="40" y="46">What a transformer actually spends its arithmetic on</text><g class="m"><rect x="40" y="74" width="546" height="40" rx="4"></rect><text class="sub" x="313.0" y="94.0" text-anchor="middle" dominant-baseline="central">matrix multiplies</text></g><g class="u"><rect x="590" y="74" width="50" height="40" rx="4"></rect><text class="sub" x="615.0" y="94.0" text-anchor="middle" dominant-baseline="central">rest</text></g><text class="cap" x="40" y="156" text-anchor="start">Well over ninety percent. The remainder is additions, normalisations and the activation</text><text class="cap" x="40" y="176" text-anchor="start">function, all of which are cheap and none of which dominate.</text><text class="cap" x="40" y="216" text-anchor="start">A chip that did matrix multiplication superbly and everything else merely adequately</text><text class="cap" x="40" y="236" text-anchor="start">would therefore be almost as good as one that did everything superbly, and much cheaper</text><text class="cap" x="40" y="256" text-anchor="start">to build. The H100 has 528 such units, four per multiprocessor.</text><text class="cap" x="40" y="296" text-anchor="start">It also explains the risk: a model whose arithmetic looked different would leave most of</text><text class="cap" x="40" y="316" text-anchor="start">this chip idle.</text></svg><figcaption>The bet made in silicon. It has paid off for a decade because the shape of the workload has not changed, and it is not guaranteed against a workload that does.</figcaption></figure>
