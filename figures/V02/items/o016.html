<figure><div class='ts'>Fig 16 &nbsp;&middot;&nbsp; 0:20</div><h3>SRAM against DRAM, at the cell</h3><svg viewBox="0 0 680 354" role="img"><title>SRAM against DRAM, at the cell</title><text class="hd" x="40" y="46">An SRAM cell: six transistors</text><g class="s"><rect x="60" y="70" width="38" height="38" rx="4"></rect></g><g class="s"><rect x="106" y="70" width="38" height="38" rx="4"></rect></g><g class="s"><rect x="152" y="70" width="38" height="38" rx="4"></rect></g><g class="s"><rect x="60" y="116" width="38" height="38" rx="4"></rect></g><g class="s"><rect x="106" y="116" width="38" height="38" rx="4"></rect></g><g class="s"><rect x="152" y="116" width="38" height="38" rx="4"></rect></g><text class="sub2" x="60" y="178" text-anchor="start">cross-coupled, holds its own state</text><text class="sub2" x="60" y="198" text-anchor="start">readable in one cycle</text><text class="hd" x="370" y="46">A DRAM cell: one transistor, one capacitor</text><g class="h"><rect x="390" y="70" width="38" height="38" rx="4"></rect></g><g class="h"><rect x="444" y="70" width="60" height="38" rx="8"></rect><text class="sub" x="474.0" y="89.0" text-anchor="middle" dominant-baseline="central">C</text></g><text class="sub2" x="390" y="138" text-anchor="start">charge leaks away, so the whole array</text><text class="sub2" x="390" y="158" text-anchor="start">must be refreshed thousands of times a second</text><text class="sub2" x="390" y="186" text-anchor="start">reading destroys the charge and needs</text><text class="sub2" x="390" y="206" text-anchor="start">a sense amplifier, then a rewrite</text><text class="cap" x="40" y="262" text-anchor="start">Six transistors per bit against roughly one. DRAM is therefore far denser and far cheaper per</text><text class="cap" x="40" y="282" text-anchor="start">bit, and fundamentally slower to read.</text><text class="cap" x="40" y="312" text-anchor="start">That is the whole reason for a hierarchy: you cannot have capacity and speed in the same</text><text class="cap" x="40" y="332" text-anchor="start">technology, so machines use a little of the fast kind and a lot of the slow kind.</text></svg><figcaption>Every level of the memory ladder later in this document is a consequence of this one trade in silicon.</figcaption></figure>
