<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 7:44</div><h3>SRAM holds a bit in six transistors; DRAM holds it as charge on one capacitor</h3><svg viewBox='0 0 680 610' role='img'><title>SRAM holds a bit in six transistors; DRAM holds it as charge on one capacitor</title><text class="hd" x="40" y="46">An SRAM cell: six transistors</text><g class="s"><rect x="60" y="66" width="38" height="38" rx="4"/></g><g class="s"><rect x="106" y="66" width="38" height="38" rx="4"/></g><g class="s"><rect x="152" y="66" width="38" height="38" rx="4"/></g><g class="s"><rect x="60" y="112" width="38" height="38" rx="4"/></g><g class="s"><rect x="106" y="112" width="38" height="38" rx="4"/></g><g class="s"><rect x="152" y="112" width="38" height="38" rx="4"/></g><text class="sub2" x="60" y="178" text-anchor="start">two loops that hold each other's state</text><text class="sub2" x="60" y="196" text-anchor="start">read in one cycle, without disturbing it</text><text class="hd" x="370" y="46">A DRAM cell: one transistor, one capacitor</text><g class="h"><rect x="390" y="66" width="38" height="38" rx="4"/></g><g class="h"><rect x="444" y="66" width="60" height="38" rx="8"/><text class="sub" x="474.0" y="85.0" text-anchor="middle" dominant-baseline="central">C</text></g><text class="sub2" x="390" y="130" text-anchor="start">the bit is a tiny charge on C</text><text class="sub2" x="390" y="148" text-anchor="start">full is 1, empty is 0</text><text class="hd" x="40" y="240">Left alone, the capacitor's charge leaks away</text><line class="axis" x1="60" y1="352" x2="480" y2="352"/><polyline class="pl-h" points="66,276 140,290 220,312 320,334 460,346"/><line class="tick" x1="60" y1="318" x2="480" y2="318"/><text class="sub2" x="490" y="322" text-anchor="start">below this, it reads as 0</text><text class="sub2" x="66" y="268" text-anchor="start">full</text><text class="sub2" x="470" y="370" text-anchor="end">time</text><text class="cap" x="40" y="406" text-anchor="start">Six transistors per bit against one transistor and one capacitor. DRAM is therefore far</text><text class="cap" x="40" y="426" text-anchor="start">denser and cheaper per bit, which is how 80 GB fits beside the chip, and SRAM is what</text><text class="cap" x="40" y="446" text-anchor="start">the chip itself is built from.</text><text class="cap" x="40" y="486" text-anchor="start">But a capacitor holds a charge the way a leaky bucket holds water. A DRAM cell has to be</text><text class="cap" x="40" y="506" text-anchor="start">topped up on a timer, and reading it is harder than reading an SRAM cell, as the next</text><text class="cap" x="40" y="526" text-anchor="start">figure shows.</text><text class="cap" x="40" y="566" text-anchor="start">That is the whole reason for a hierarchy: no technology has both density and speed, so</text><text class="cap" x="40" y="586" text-anchor="start">machines use a little of the fast kind and a lot of the dense kind.</text></svg><figcaption>The leak curve is schematic. Every rung of the ladder in the next part is a consequence of this one trade in silicon.</figcaption></figure>
