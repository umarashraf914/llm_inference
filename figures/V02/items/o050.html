<figure><div class='ts'>Fig 50 &nbsp;&middot;&nbsp; 7:46</div><h3>Why not one big fast memory</h3><svg viewBox="0 0 680 362" role="img"><title>Why not one big fast memory</title><text class="hd" x="40" y="46">Why not just one memory, large and fast?</text><g class="u"><rect x="40" y="74" width="600" height="40" rx="4"></rect><text class="sub" x="340.0" y="94.0" text-anchor="middle" dominant-baseline="central">80 GB, all of it at register speed</text></g><text class="cap" x="40" y="152" text-anchor="start">Nobody can build it. The technology that is fast is not dense, and the technology that is</text><text class="cap" x="40" y="172" text-anchor="start">dense is not fast, as the earlier figure showed.</text><text class="cap" x="40" y="208" text-anchor="start">There is also a geometry problem. Fast means close, and only a small amount of anything can be</text><text class="cap" x="40" y="228" text-anchor="start">close to a given point. Making a memory bigger necessarily puts most of it further away.</text><text class="cap" x="40" y="264" text-anchor="start">So the hierarchy is not a compromise anybody chose. It is what you get when speed requires</text><text class="cap" x="40" y="284" text-anchor="start">proximity and capacity requires area.</text><text class="cap" x="40" y="320" text-anchor="start">The craft is then deciding what deserves to be close, which is what the rest of this document</text><text class="cap" x="40" y="340" text-anchor="start">is about.</text></svg><figcaption>Two independent reasons, either of which alone would force a hierarchy. Together they make it permanent.</figcaption></figure>
