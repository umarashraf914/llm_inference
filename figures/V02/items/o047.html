<figure><div class='ts'>Fig 47 &nbsp;&middot;&nbsp; 6:38</div><h3>Why divergence costs what it costs</h3><svg viewBox="0 0 680 358" role="img"><title>Why divergence costs what it costs</title><text class="hd" x="40" y="46">Why this is a problem here and nowhere else</text><g class="s"><rect x="40" y="74" width="285" height="86" rx="8"></rect><text class="lbl" x="182.5" y="100.0" text-anchor="middle" dominant-baseline="central">One thread per instruction</text><text class="sub" x="182.5" y="118.0" text-anchor="middle" dominant-baseline="central">takes its path, moves on,</text><text class="sub" x="182.5" y="135.0" text-anchor="middle" dominant-baseline="central">wastes nothing</text></g><g class="h"><rect x="355" y="74" width="285" height="86" rx="8"></rect><text class="lbl" x="497.5" y="100.0" text-anchor="middle" dominant-baseline="central">Thirty-two per instruction</text><text class="sub" x="497.5" y="118.0" text-anchor="middle" dominant-baseline="central">must run both paths in turn,</text><text class="sub" x="497.5" y="135.0" text-anchor="middle" dominant-baseline="central">masking off half each time</text></g><text class="cap" x="40" y="204" text-anchor="start">The cost is not the decision. It is that one instruction stream cannot serve two destinations</text><text class="cap" x="40" y="224" text-anchor="start">at once, so it serves them one after the other.</text><text class="cap" x="40" y="260" text-anchor="start">A balanced fork therefore halves throughput. Two nested forks quarter it, three make it an</text><text class="cap" x="40" y="280" text-anchor="start">eighth, and so on.</text><text class="cap" x="40" y="316" text-anchor="start">Well-written kernels avoid data-dependent branching inside a warp entirely, which is a real</text><text class="cap" x="40" y="336" text-anchor="start">constraint on how the code can be written.</text></svg><figcaption>Worth being precise: nothing is stalled and nothing is recomputed. Lanes are issued and their results discarded, which is why it shows up as lost throughput.</figcaption></figure>
