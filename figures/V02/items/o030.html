<figure><div class='ts'>Fig 30 &nbsp;&middot;&nbsp; 3:56</div><h3>The register file</h3><svg viewBox="0 0 680 280" role="img"><title>The register file</title><g class="s"><rect x="120" y="50" width="440" height="74" rx="8"></rect><text class="lbl" x="340.0" y="78.0" text-anchor="middle" dominant-baseline="central">Register file</text><text class="sub" x="340.0" y="96.0" text-anchor="middle" dominant-baseline="central">256 KB, single-cycle access</text></g><g class="s"><rect x="140" y="132" width="20" height="26" rx="2"></rect></g><g class="s"><rect x="166" y="132" width="20" height="26" rx="2"></rect></g><g class="s"><rect x="192" y="132" width="20" height="26" rx="2"></rect></g><g class="s"><rect x="218" y="132" width="20" height="26" rx="2"></rect></g><g class="s"><rect x="244" y="132" width="20" height="26" rx="2"></rect></g><g class="s"><rect x="270" y="132" width="20" height="26" rx="2"></rect></g><g class="s"><rect x="296" y="132" width="20" height="26" rx="2"></rect></g><g class="s"><rect x="322" y="132" width="20" height="26" rx="2"></rect></g><g class="s"><rect x="348" y="132" width="20" height="26" rx="2"></rect></g><g class="s"><rect x="374" y="132" width="20" height="26" rx="2"></rect></g><g class="s"><rect x="400" y="132" width="20" height="26" rx="2"></rect></g><g class="s"><rect x="426" y="132" width="20" height="26" rx="2"></rect></g><g class="s"><rect x="452" y="132" width="20" height="26" rx="2"></rect></g><g class="s"><rect x="478" y="132" width="20" height="26" rx="2"></rect></g><g class="s"><rect x="504" y="132" width="20" height="26" rx="2"></rect></g><g class="s"><rect x="530" y="132" width="20" height="26" rx="2"></rect></g><text class="cap" x="120" y="188" text-anchor="start">Partitioned across every thread the multiprocessor is running. A thread's working values</text><text class="cap" x="120" y="208" text-anchor="start">live here, and reaching them is effectively free.</text><text class="cap" x="120" y="238" text-anchor="start">Because each thread's slice stays allocated the whole time it is resident, switching between</text><text class="cap" x="120" y="258" text-anchor="start">threads costs nothing.</text></svg><figcaption>The partitioning is the detail that matters. It is what makes latency hiding free, which is the subject of Part 8.</figcaption></figure>
