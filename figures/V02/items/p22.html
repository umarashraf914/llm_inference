<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 12:45</div><h3>The H200's extra 43% of bandwidth is 43% more tokens a second</h3><svg viewBox='0 0 680 540' role='img'><title>The H200's extra 43% of bandwidth is 43% more tokens a second</title><text class="hd" x="40" y="46">Same compute die, different memory, drawn to scale</text><text class="cap" x="40" y="82" text-anchor="start">bandwidth, TB/s</text><g class="h"><rect x="230.0" y="66.0" width="221.2" height="22.0" rx="3"/></g><text class="sub2" x="459.23199999999997" y="82" text-anchor="start">H100: 3.35</text><g class="s"><rect x="230.0" y="92.0" width="316.8" height="22.0" rx="3"/></g><text class="sub2" x="554.8" y="108" text-anchor="start">H200: 4.8</text><text class="cap" x="40" y="158" text-anchor="start">tokens a second</text><g class="h"><rect x="230.0" y="142.0" width="225.7" height="22.0" rx="3"/></g><text class="sub2" x="463.7469387755102" y="158" text-anchor="start">H100: 47.9</text><g class="s"><rect x="230.0" y="168.0" width="323.3" height="22.0" rx="3"/></g><text class="sub2" x="561.2653061224489" y="184" text-anchor="start">H200: 68.6</text><text class="cap" x="40" y="234" text-anchor="start">ridge, ops per byte</text><g class="h"><rect x="230.0" y="218.0" width="324.7" height="22.0" rx="3"/></g><text class="sub2" x="562.6837708830549" y="234" text-anchor="start">H100: 295</text><g class="s"><rect x="230.0" y="244.0" width="226.7" height="22.0" rx="3"/></g><text class="sub2" x="464.7375" y="260" text-anchor="start">H200: 206</text><text class="cap" x="40" y="316" text-anchor="start">The H200 keeps the H100's compute die and replaces the memory: 141 GB at 4.8 TB/s</text><text class="cap" x="40" y="336" text-anchor="start">against 80 GB at 3.35. That is 1.43 times the bandwidth.</text><text class="cap" x="40" y="376" text-anchor="start">Decoding one request reads every weight once per token, so the token rate is bandwidth ÷</text><text class="cap" x="40" y="396" text-anchor="start">bytes ({{fig:v01-o014}}). For a 70B model stored at 8 bits, 70 GB, that goes from 47.9 to</text><text class="cap" x="40" y="416" text-anchor="start">68.6 tokens a second, the same 43% as the bandwidth, from a change that added no</text><text class="cap" x="40" y="436" text-anchor="start">arithmetic at all.</text><text class="cap" x="40" y="476" text-anchor="start">The ridge falls from 295 to 206: with more bytes a second, fewer operations per byte</text><text class="cap" x="40" y="496" text-anchor="start">keep the same tensor cores busy. And 141 GB holds a 70B model's 140 GB at 16 bits, which</text><text class="cap" x="40" y="516" text-anchor="start">an H100 cannot, though with almost nothing to spare.</text></svg><figcaption>Bars to scale. The ceiling assumes the model fits and nothing else competes for the bus; real systems land below it, but the ratio carries over. Memory figures from NVIDIA's H200 datasheet.</figcaption></figure>
