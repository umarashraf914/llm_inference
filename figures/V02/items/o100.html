<figure><div class='ts'>Fig 100 &nbsp;&middot;&nbsp; 19:38</div><h3>The constraint that is not hardware</h3><svg viewBox="0 0 680 316" role="img"><title>The constraint that is not hardware</title><text class="cap" x="40" y="78" text-anchor="start">H100</text><g class="h"><rect x="200" y="62" width="160" height="34" rx="4"></rect><text class="sub" x="280.0" y="79.0" text-anchor="middle" dominant-baseline="central">80 GB</text></g><text class="cap" x="40" y="138" text-anchor="start">MI300X</text><g class="s"><rect x="200" y="122" width="384" height="34" rx="4"></rect><text class="sub" x="392.0" y="139.0" text-anchor="middle" dominant-baseline="central">192 GB</text></g><text class="cap" x="40" y="196" text-anchor="start">On paper AMD beats the H100 where it matters here: a model needing two H100s fits on one.</text><text class="cap" x="40" y="224" text-anchor="start">And yet most teams still reach for Nvidia. The deciding factor is software. CUDA has had</text><text class="cap" x="40" y="244" text-anchor="start">almost two decades to accumulate the libraries, kernels and tooling that all of AI now sits</text><text class="cap" x="40" y="264" text-anchor="start">on, and ROCm is still catching up.</text><text class="cap" x="40" y="294" text-anchor="start">For most teams that maturity, not the hardware specification, is the real binding constraint.</text></svg><figcaption>A good note to close on. Every other figure here is about physics; this one is about ecosystems, and it is frequently the one that decides.</figcaption></figure>
