<figure><div class='ts'>Fig 100 &nbsp;&middot;&nbsp; 19:38</div><h3>The constraint that is not hardware</h3><svg viewBox='0 0 680 374' role="img"><title>The constraint that is not hardware</title><text class="cap" x="40" y="78" text-anchor="start">H100</text><g class="h"><rect x="200" y="62" width="160" height="34" rx="4"></rect><text class="sub" x="280.0" y="79.0" text-anchor="middle" dominant-baseline="central">80 GB</text></g><text class="cap" x="40" y="138" text-anchor="start">MI300X</text><g class="s"><rect x="200" y="122" width="384" height="34" rx="4"></rect><text class="sub" x="392.0" y="139.0" text-anchor="middle" dominant-baseline="central">192 GB</text></g><text class="cap" x="40" y="190" text-anchor="start">On paper AMD beats the H100 where it matters here: 192 GB of HBM at 5.3 TB/s against</text><text class="cap" x="40" y="210" text-anchor="start">80 GB at 3.35, so a model needing two H100s fits on one.</text><text class="cap" x="40" y="250" text-anchor="start">And yet most teams still reach for Nvidia. The deciding factor is software. CUDA has had</text><text class="cap" x="40" y="270" text-anchor="start">almost two decades to accumulate the libraries, kernels and tooling that all of AI now</text><text class="cap" x="40" y="290" text-anchor="start">sits on, and ROCm, AMD's equivalent, is still catching up.</text><text class="cap" x="40" y="330" text-anchor="start">For most teams that maturity, not the hardware specification, is the real binding</text><text class="cap" x="40" y="350" text-anchor="start">constraint.</text></svg><figcaption>Bars to scale; memory figures from NVIDIA's H100 whitepaper and AMD's MI300X specifications. Every other figure here is about physics; this one is about software, and it often decides.</figcaption></figure>
