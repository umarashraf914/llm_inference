<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 14:39</div><h3>Bigger tiles feed themselves: each number fetched is used n times</h3><svg viewBox='0 0 680 446' role='img'><title>Bigger tiles feed themselves: each number fetched is used n times</title><text class="hd" x="40" y="46">Times each fetched number is used, for an n × n × n tile (log axis)</text><text class="cap" x="40" y="82" text-anchor="start">tile 2 × 2</text><g class="m"><rect x="200.0" y="64.0" width="47.1" height="26.0" rx="3"/></g><text class="sub2" x="257.0966474332126" y="82" text-anchor="start">2 uses; 1 operation per byte</text><text class="cap" x="40" y="122" text-anchor="start">tile 4 × 4</text><g class="m"><rect x="200.0" y="104.0" width="94.2" height="26.0" rx="3"/></g><text class="sub2" x="304.19329486642516" y="122" text-anchor="start">4 uses; 2 operations per byte</text><text class="cap" x="40" y="162" text-anchor="start">tile 16 × 16</text><g class="m"><rect x="200.0" y="144.0" width="188.4" height="26.0" rx="3"/></g><text class="sub2" x="398.3865897328504" y="162" text-anchor="start">16 uses; 8 operations per byte</text><text class="cap" x="40" y="202" text-anchor="start">tile 128 × 128</text><g class="m"><rect x="200" y="184" width="329.67653203248824" height="26" rx="3"/><text class="sub" x="364.8382660162441" y="197.0" text-anchor="middle" dominant-baseline="central">128 uses; 64 operations per byte</text></g><line class="axis" x1="200" y1="226" x2="560" y2="226"/><line class="tick" x1="200.0" y1="226" x2="200.0" y2="231"/><text class="sub2" x="200.0" y="245" text-anchor="middle">1</text><line class="tick" x1="356.5" y1="226" x2="356.5" y2="231"/><text class="sub2" x="356.5" y="245" text-anchor="middle">10</text><line class="tick" x1="512.9" y1="226" x2="512.9" y2="231"/><text class="sub2" x="512.9" y="245" text-anchor="middle">100</text><text class="cap" x="40" y="282" text-anchor="start">An n × n × n tile does n³ multiply-adds on 2n² numbers, so every number fetched is used</text><text class="cap" x="40" y="302" text-anchor="start">n times, and at 2 bytes a number the tile does n ÷ 2 operations for each byte it brings</text><text class="cap" x="40" y="322" text-anchor="start">in.</text><text class="cap" x="40" y="362" text-anchor="start">Double the tile and the reuse doubles. That is why tensor cores work on tiles, why</text><text class="cap" x="40" y="382" text-anchor="start">kernels stage large tiles in shared memory, and why prefill, whose many tokens make a</text><text class="cap" x="40" y="402" text-anchor="start">wide tile, runs on the compute side of the ridge while decode, a tile one column wide,</text><text class="cap" x="40" y="422" text-anchor="start">cannot.</text></svg><figcaption>Reuse is a property of the shape, not of the chip. The same arithmetic returns as the systolic array in Part 15, which is a tile made of hardware.</figcaption></figure>
