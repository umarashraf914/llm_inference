<figure><div class='ts'>Fig 57 &nbsp;&middot;&nbsp; 9:30</div><h3>64 resident warps take turns</h3><svg viewBox="0 0 680 335" role="img"><title>64 resident warps take turns</title><text class="sub2" x="40" y="80" text-anchor="start">Warp 0</text><rect x="160" y="58" width="448" height="32" rx="4" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="m"><rect x="160" y="58" width="70" height="32" rx="4"></rect></g><g class="h"><rect x="234" y="58" width="300" height="32" rx="4"></rect></g><g class="m"><rect x="538" y="58" width="70" height="32" rx="4"></rect></g><text class="sub2" x="40" y="124" text-anchor="start">Warp 1</text><rect x="160" y="102" width="448" height="32" rx="4" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="m"><rect x="234" y="102" width="90" height="32" rx="4"></rect><text class="sub" x="279.0" y="118.0" text-anchor="middle" dominant-baseline="central">compute</text></g><text class="sub2" x="40" y="168" text-anchor="start">Warp 2</text><rect x="160" y="146" width="448" height="32" rx="4" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="m"><rect x="328" y="146" width="90" height="32" rx="4"></rect><text class="sub" x="373.0" y="162.0" text-anchor="middle" dominant-baseline="central">compute</text></g><text class="sub2" x="40" y="212" text-anchor="start">Warp 3</text><rect x="160" y="190" width="448" height="32" rx="4" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><g class="m"><rect x="422" y="190" width="90" height="32" rx="4"></rect><text class="sub" x="467.0" y="206.0" text-anchor="middle" dominant-baseline="central">compute</text></g><text class="cap" x="40" y="263" text-anchor="start">While warp 0 waits, the scheduler runs warps that are ready. By the time its data returns,</text><text class="cap" x="40" y="283" text-anchor="start">dozens of others have taken their turn.</text><text class="cap" x="40" y="313" text-anchor="start">Each warp still waits the full latency. The multiprocessor never does.</text></svg><figcaption>This is what the number 64 is for, and Part 5 showed why it is roughly the right number: it is the concurrency Little's Law demands.</figcaption></figure>
