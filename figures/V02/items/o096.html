<figure><div class='ts'>Fig 96 &nbsp;&middot;&nbsp; 18:16</div><h3>Why the gap matters</h3><svg viewBox='0 0 680 342' role="img"><title>Why the gap matters</title><g class="u"><rect x="40" y="46" width="600" height="138" rx="14"></rect><text class="lbl" x="62" y="72">One token, one layer</text></g><g class="m"><rect x="66" y="92" width="42" height="44" rx="4"></rect><text class="sub" x="87.0" y="114.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><line class="conn" x1="110" y1="114" x2="154" y2="114" marker-end="url(#arw)"></line><g class="m"><rect x="162" y="92" width="42" height="44" rx="4"></rect><text class="sub" x="183.0" y="114.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><line class="conn" x1="206" y1="114" x2="250" y2="114" marker-end="url(#arw)"></line><g class="m"><rect x="258" y="92" width="42" height="44" rx="4"></rect><text class="sub" x="279.0" y="114.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><line class="conn" x1="302" y1="114" x2="346" y2="114" marker-end="url(#arw)"></line><g class="m"><rect x="354" y="92" width="42" height="44" rx="4"></rect><text class="sub" x="375.0" y="114.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><line class="conn" x1="398" y1="114" x2="442" y2="114" marker-end="url(#arw)"></line><g class="m"><rect x="450" y="92" width="42" height="44" rx="4"></rect><text class="sub" x="471.0" y="114.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><line class="conn" x1="494" y1="114" x2="538" y2="114" marker-end="url(#arw)"></line><g class="m"><rect x="546" y="92" width="42" height="44" rx="4"></rect><text class="sub" x="567.0" y="114.0" text-anchor="middle" dominant-baseline="central">GPU</text></g><text class="sub2" x="66" y="168" text-anchor="start">results exchanged twice a layer: 160 times a token for 80 layers</text><text class="cap" x="40" y="218" text-anchor="start">Splitting a layer's matrix multiply across GPUs means they must exchange partial results</text><text class="cap" x="40" y="238" text-anchor="start">constantly. Inside an NVLink domain that is affordable. Across InfiniBand it dominates.</text><text class="cap" x="40" y="278" text-anchor="start">The frequency is what makes the difference decisive. A single slow exchange would not</text><text class="cap" x="40" y="298" text-anchor="start">matter; 160 a token, each given a ninth of NVLink's bandwidth across InfiniBand, become</text><text class="cap" x="40" y="318" text-anchor="start">the bottleneck.</text></svg><figcaption>Communication is paid per layer per token, so it multiplies with model depth. It is the constraint the fifth atlas, on parallelism, is built around.</figcaption></figure>
