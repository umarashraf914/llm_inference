<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:39</div><h3>989 trillion is 132 × 4 × 1,024 × 1.83 billion</h3><svg viewBox='0 0 680 596' role='img'><title>989 trillion is 132 × 4 × 1,024 × 1.83 billion</title><text class="hd" x="40" y="46">The headline, multiplied out one factor at a time</text><g class="u"><rect x="40" y="66" width="330" height="34" rx="6"/><text class="sub" x="205.0" y="83.0" text-anchor="middle" dominant-baseline="central">132 multiprocessors  ×  4 tensor cores</text></g><text class="sub2" x="386" y="88" text-anchor="start">=  528 tensor cores</text><g class="u"><rect x="40" y="112" width="330" height="34" rx="6"/><text class="sub" x="205.0" y="129.0" text-anchor="middle" dominant-baseline="central">×  1,024 operations per tick each</text></g><text class="sub2" x="386" y="134" text-anchor="start">=  540,672 operations per tick</text><g class="u"><rect x="40" y="158" width="330" height="34" rx="6"/><text class="sub" x="205.0" y="175.0" text-anchor="middle" dominant-baseline="central">×  1.83 billion ticks a second</text></g><text class="sub2" x="386" y="180" text-anchor="start">=  989.4 trillion operations a second</text><text class="hd" x="40" y="234">One multiprocessor, one tick, drawn to scale</text><text class="cap" x="40" y="272" text-anchor="start">4 tensor cores</text><g class="m"><rect x="190" y="254" width="430.0" height="26" rx="3"/><text class="sub" x="405.0" y="267.0" text-anchor="middle" dominant-baseline="central">4,096 operations</text></g><text class="cap" x="40" y="314" text-anchor="start">128 CUDA cores</text><g class="u"><rect x="190.0" y="296.0" width="26.9" height="26.0" rx="3"/></g><text class="sub2" x="226.875" y="314" text-anchor="start">256 operations, 32-bit</text><text class="cap" x="40" y="372" text-anchor="start">Where 1,024 comes from: an A100 tensor core finishes 256 multiply-adds every tick, and</text><text class="cap" x="40" y="392" text-anchor="start">NVIDIA doubled the rate per multiprocessor, clock for clock, in Hopper. That is 512</text><text class="cap" x="40" y="412" text-anchor="start">multiply-adds, and a multiply-add counts as two operations ({{fig:v01-o111}}).</text><text class="cap" x="40" y="452" text-anchor="start">The CUDA cores do one 32-bit multiply-add each per tick, 256 operations per</text><text class="cap" x="40" y="472" text-anchor="start">multiprocessor, a sixteenth of the tensor cores (on 16-bit pairs, 512, an eighth).</text><text class="cap" x="40" y="492" text-anchor="start">Across the chip the 32-bit gap is 14.8 rather than 16 because NVIDIA rates the tensor</text><text class="cap" x="40" y="512" text-anchor="start">cores at 1.83 GHz and the CUDA cores at 1.98 GHz.</text><text class="cap" x="40" y="552" text-anchor="start">The 1,978.9 trillion sometimes quoted is the same hardware credited with the multiply-</text><text class="cap" x="40" y="572" text-anchor="start">adds it skips when two of every four weights are zero, NVIDIA's 2:4 structured sparsity.</text></svg><figcaption>Every factor is NVIDIA's (H100 and A100 whitepapers), and the product lands on the published 989.4. A peak is a count of units times work per tick times ticks, nothing more mysterious.</figcaption></figure>
