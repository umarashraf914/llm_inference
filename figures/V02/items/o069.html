<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 11:48</div><h3>The wall, in numbers</h3><svg viewBox='0 0 680 418' role='img'><title>The wall, in numbers</title><text class="hd" x="40" y="62">Generation</text><text class="hd" x="180" y="62">Dense 16-bit compute</text><text class="hd" x="390" y="62">Bandwidth</text><text class="hd" x="540" y="62">Ridge</text><text class="cap" x="40" y="92" text-anchor="start">V100, 2017</text><text class="sub2" x="180" y="92" text-anchor="start">125 TFLOP/s  (1×)</text><text class="sub2" x="390" y="92" text-anchor="start">0.9 TB/s  (1×)</text><text class="sub2" x="540" y="92" text-anchor="start">139</text><text class="cap" x="40" y="132" text-anchor="start">A100, 2020</text><text class="sub2" x="180" y="132" text-anchor="start">312 TFLOP/s  (2.5×)</text><text class="sub2" x="390" y="132" text-anchor="start">2.0 TB/s  (2.3×)</text><text class="sub2" x="540" y="132" text-anchor="start">153</text><text class="cap" x="40" y="172" text-anchor="start">H100, 2022</text><text class="sub2" x="180" y="172" text-anchor="start">989 TFLOP/s  (7.9×)</text><text class="sub2" x="390" y="172" text-anchor="start">3.35 TB/s  (3.7×)</text><text class="sub2" x="540" y="172" text-anchor="start">295</text><text class="cap" x="40" y="212" text-anchor="start">B200, 2024</text><text class="sub2" x="180" y="212" text-anchor="start">2,250 TFLOP/s  (18×)</text><text class="sub2" x="390" y="212" text-anchor="start">8.0 TB/s  (8.9×)</text><text class="sub2" x="540" y="212" text-anchor="start">281</text><text class="cap" x="40" y="274" text-anchor="start">Over seven years, dense 16-bit compute grew eighteen-fold and bandwidth about nine-fold.</text><text class="cap" x="40" y="294" text-anchor="start">The ridge, their ratio, doubled from 139 to around 290.</text><text class="cap" x="40" y="334" text-anchor="start">It did not rise every generation: the B200's 281 sits just below the H100's 295, because</text><text class="cap" x="40" y="354" text-anchor="start">Blackwell's memory grew a little faster than its 16-bit compute. Even so, work that kept</text><text class="cap" x="40" y="374" text-anchor="start">a V100's maths busy can be memory-bound on an H100 without anything about it having</text><text class="cap" x="40" y="394" text-anchor="start">changed.</text></svg><figcaption>At 16 bits the ridge doubled and then held level. The climb went somewhere else: into each generation's newest, narrowest format, next. Figures from NVIDIA's whitepapers, datasheets and B200 specifications (dense, without sparsity).</figcaption></figure>
