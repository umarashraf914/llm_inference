<figure><div class='ts'>Fig 69 &nbsp;&middot;&nbsp; 12:00</div><h3>The wall, in numbers</h3><svg viewBox="0 0 680 384" role="img"><title>The wall, in numbers</title><text class="hd" x="40" y="62" text-anchor="start">Generation</text><text class="hd" x="200" y="62" text-anchor="start">Peak compute</text><text class="hd" x="370" y="62" text-anchor="start">Bandwidth</text><text class="hd" x="520" y="62" text-anchor="start">Ridge</text><text class="cap" x="40" y="92" text-anchor="start">V100, 2017</text><text class="sub2" x="200" y="92" text-anchor="start">125 TF  (1x)</text><text class="sub2" x="370" y="92" text-anchor="start">0.9 TB/s  (1x)</text><text class="sub2" x="520" y="92" text-anchor="start">139</text><text class="cap" x="40" y="134" text-anchor="start">A100, 2020</text><text class="sub2" x="200" y="134" text-anchor="start">312 TF  (2.5x)</text><text class="sub2" x="370" y="134" text-anchor="start">2.0 TB/s  (2.2x)</text><text class="sub2" x="520" y="134" text-anchor="start">156</text><text class="cap" x="40" y="176" text-anchor="start">H100, 2022</text><text class="sub2" x="200" y="176" text-anchor="start">989 TF  (7.9x)</text><text class="sub2" x="370" y="176" text-anchor="start">3.35 TB/s  (3.7x)</text><text class="sub2" x="520" y="176" text-anchor="start">295</text><text class="cap" x="40" y="218" text-anchor="start">B200, 2024</text><text class="sub2" x="200" y="218" text-anchor="start">2250 TF  (18x)</text><text class="sub2" x="370" y="218" text-anchor="start">8.0 TB/s  (8.9x)</text><text class="sub2" x="520" y="218" text-anchor="start">281</text><text class="cap" x="40" y="292" text-anchor="start">Compute grew eighteen-fold. Bandwidth grew nine-fold. The ridge, which is the ratio of the</text><text class="cap" x="40" y="312" text-anchor="start">two, roughly doubled.</text><text class="cap" x="40" y="342" text-anchor="start">So a workload that was comfortably compute-bound in 2017 may be memory-bound today without</text><text class="cap" x="40" y="362" t
