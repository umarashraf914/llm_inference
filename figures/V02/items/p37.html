<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 20:14</div><h3>The three questions, answered</h3><svg viewBox='0 0 680 632' role='img'><title>The three questions, answered</title><g class="u"><rect x="40" y="50" width="190" height="88" rx="8"/><text class="lbl" x="135.0" y="85.0" text-anchor="middle" dominant-baseline="central">Why so different</text><text class="sub" x="135.0" y="103.0" text-anchor="middle" dominant-baseline="central">from a laptop CPU?</text></g><line class="conn" x1="135" y1="142" x2="135" y2="164" marker-end="url(#arw)"/><g class="s"><rect x="40" y="166" width="190" height="52" rx="8"/><text class="lbl" x="135.0" y="183.0" text-anchor="middle" dominant-baseline="central">one bet</text><text class="sub" x="135.0" y="201.0" text-anchor="middle" dominant-baseline="central">many identical operations</text></g><line class="conn" x1="135" y1="218" x2="135" y2="230" marker-end="url(#arw)"/><g class="s"><rect x="40" y="232" width="190" height="52" rx="8"/><text class="lbl" x="135.0" y="249.0" text-anchor="middle" dominant-baseline="central">lanes, not cleverness</text><text class="sub" x="135.0" y="267.0" text-anchor="middle" dominant-baseline="central">16,896 lanes, 528 tensor cores</text></g><line class="conn" x1="135" y1="284" x2="135" y2="296" marker-end="url(#arw)"/><g class="s"><rect x="40" y="298" width="190" height="52" rx="8"/><text class="lbl" x="135.0" y="315.0" text-anchor="middle" dominant-baseline="central">waiting is cheap</text><text class="sub" x="135.0" y="333.0" text-anchor="middle" dominant-baseline="central">64 warps to a multiprocessor</text></g><g class="u"><rect x="245" y="50" width="190" height="88" rx="8"/><text class="lbl" x="340.0" y="77.0" text-anchor="middle" dominant-baseline="central">Why is a byte</text><text class="sub" x="340.0" y="95.0" text-anchor="middle" dominant-baseline="central">so expensive</text><text class="sub" x="340.0" y="112.0" text-anchor="middle" dominant-baseline="central">next to an operation?</text></g><line class="conn" x1="340" y1="142" x2="340" y2="164" marker-end="url(#arw)"/><g class="h"><rect x="245" y="166" width="190" height="52" rx="8"/><text class="lbl" x="340.0" y="183.0" text-anchor="middle" dominant-baseline="central">the cell</text><text class="sub" x="340.0" y="201.0" text-anchor="middle" dominant-baseline="central">a capacitor behind long wires</text></g><line class="conn" x1="340" y1="218" x2="340" y2="230" marker-end="url(#arw)"/><g class="h"><rect x="245" y="232" width="190" height="52" rx="8"/><text class="lbl" x="340.0" y="249.0" text-anchor="middle" dominant-baseline="central">the ladder</text><text class="sub" x="340.0" y="267.0" text-anchor="middle" dominant-baseline="central">fast memory is small</text></g><line class="conn" x1="340" y1="284" x2="340" y2="296" marker-end="url(#arw)"/><g class="h"><rect x="245" y="298" width="190" height="52" rx="8"/><text class="lbl" x="340.0" y="315.0" text-anchor="middle" dominant-baseline="central">the ridge</text><text class="sub" x="340.0" y="333.0" text-anchor="middle" dominant-baseline="central">295 operations a byte</text></g><g class="u"><rect x="450" y="50" width="190" height="88" rx="8"/><text class="lbl" x="545.0" y="77.0" text-anchor="middle" dominant-baseline="central">What can the</text><text class="sub" x="545.0" y="95.0" text-anchor="middle" dominant-baseline="central">hardware do</text><text class="sub" x="545.0" y="112.0" text-anchor="middle" dominant-baseline="central">to fight back?</text></g><line class="conn" x1="545" y1="142" x2="545" y2="164" marker-end="url(#arw)"/><g class="m"><rect x="450" y="166" width="190" height="52" rx="8"/><text class="lbl" x="545.0" y="183.0" text-anchor="middle" dominant-baseline="central">hide and coalesce</text><text class="sub" x="545.0" y="201.0" text-anchor="middle" dominant-baseline="central">many warps, whole sectors</text></g><line class="conn" x1="545" y1="218" x2="545" y2="230" marker-end="url(#arw)"/><g class="m"><rect x="450" y="232" width="190" height="52" rx="8"/><text class="lbl" x="545.0" y="249.0" text-anchor="middle" dominant-baseline="central">reuse</text><text class="sub" x="545.0" y="267.0" text-anchor="middle" dominant-baseline="central">tensor cores working on tiles</text></g><line class="conn" x1="545" y1="284" x2="545" y2="296" marker-end="url(#arw)"/><g class="m"><rect x="450" y="298" width="190" height="52" rx="8"/><text class="lbl" x="545.0" y="315.0" text-anchor="middle" dominant-baseline="central">narrower and wider</text><text class="sub" x="545.0" y="333.0" text-anchor="middle" dominant-baseline="central">fewer bits, bigger domains</text></g><text class="cap" x="40" y="388" text-anchor="start">The first answer is one bet: the work is thousands of identical operations, so the</text><text class="cap" x="40" y="408" text-anchor="start">silicon goes on arithmetic lanes rather than on making one thread fast (Parts 2 to 5).</text><text class="cap" x="40" y="448" text-anchor="start">The second is physics and geometry: a DRAM cell is a capacitor read through long wires,</text><text class="cap" x="40" y="468" text-anchor="start">memory that is fast cannot also be large, and so the H100 can do 295 operations in the</text><text class="cap" x="40" y="488" text-anchor="start">time one byte arrives (Parts 6, 7, 10 and 11).</text><text class="cap" x="40" y="528" text-anchor="start">The third is every technique since: enough warps in flight to hide the wait, whole</text><text class="cap" x="40" y="548" text-anchor="start">sectors per fetch, each number reused across a tile, narrower numbers, and conversations</text><text class="cap" x="40" y="568" text-anchor="start">kept inside the fast domain (Parts 8, 9 and 12 to 14). Which hardware gets used is then</text><text class="cap" x="40" y="588" text-anchor="start">settled by software, and the code that makes it fast is the subject of the next atlas,</text><text class="cap" x="40" y="608" text-anchor="start">on kernels.</text></svg><figcaption>The same three boxes as {{ref:v02-o011}}, now with their answers. Every number in them was worked out above.</figcaption></figure>
