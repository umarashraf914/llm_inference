<figure><div class='ts'>Fig 13 &nbsp;&middot;&nbsp; 1:16</div><h3>In sequence against in parallel</h3><svg viewBox="0 0 680 504" role="img"><title>In sequence against in parallel</title><text class="hd" x="40" y="46">In sequence: one worker, one job at a time</text><g class="s"><rect x="60" y="66" width="90" height="30" rx="3"></rect><text class="sub" x="105.0" y="81.0" text-anchor="middle" dominant-baseline="central">job 1</text></g><g class="s"><rect x="156" y="66" width="90" height="30" rx="3"></rect><text class="sub" x="201.0" y="81.0" text-anchor="middle" dominant-baseline="central">job 2</text></g><g class="s"><rect x="252" y="66" width="90" height="30" rx="3"></rect><text class="sub" x="297.0" y="81.0" text-anchor="middle" dominant-baseline="central">job 3</text></g><g class="s"><rect x="348" y="66" width="90" height="30" rx="3"></rect><text class="sub" x="393.0" y="81.0" text-anchor="middle" dominant-baseline="central">job 4</text></g><text class="sub2" x="60" y="122" text-anchor="start">finishes at time 4</text><text class="hd" x="40" y="172">In parallel: four workers, one job each</text><g class="m"><rect x="60" y="192" width="90" height="30" rx="3"></rect><text class="sub" x="105.0" y="207.0" text-anchor="middle" dominant-baseline="central">job 1</text></g><g class="m"><rect x="60" y="226" width="90" height="30" rx="3"></rect><text class="sub" x="105.0" y="241.0" text-anchor="middle" dominant-baseline="central">job 2</text></g><g class="m"><rect x="60" y="260" width="90" height="30" rx="3"></rect><text class="sub" x="105.0" y="275.0" text-anchor="middle" dominant-baseline="central">job 3</text></g><g class="m"><rect x="60" y="294" width="90" height="30" rx="3"></rect><text class="sub" x="105.0" y="309.0" text-anchor="middle" dominant-baseline="central">job 4</text></g><text class="sub2" x="60" y="356" text-anchor="start">all finish at time 1</text><text class="cap" x="40" y="406" text-anchor="start">Parallel work is only possible when the jobs do not depend on one another. Job 2 cannot start</text><text class="cap" x="40" y="426" text-anchor="start">early if it needs job 1's answer.</text><text class="cap" x="40" y="462" text-anchor="start">That single condition decides almost everything about which parts of running a model can be</text><text class="cap" x="40" y="482" text-anchor="start">spread across a chip and which cannot.</text></svg><figcaption>The dependency question is the one that matters. Keep it in mind: it returns as the reason a whole prompt can be processed at once while new tokens come one at a time.</figcaption></figure>
