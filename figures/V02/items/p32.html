<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 17:21</div><h3>A 405-billion-parameter model at 16 bits needs eleven H100s before it does anything</h3><svg viewBox='0 0 680 484' role='img'><title>A 405-billion-parameter model at 16 bits needs eleven H100s before it does anything</title><text class="hd" x="40" y="46">Llama 3's 405B weights against H100 memory, in gigabytes (to scale)</text><text class="cap" x="40" y="78" text-anchor="start">weights at 16 bits</text><text class="sub2" x="40" y="95" text-anchor="start">405 billion × 2 bytes</text><g class="h"><rect x="190" y="64" width="405.0" height="28" rx="3"/><text class="sub" x="392.5" y="78.0" text-anchor="middle" dominant-baseline="central">810 GB</text></g><text class="cap" x="40" y="128" text-anchor="start">weights at 8 bits</text><text class="sub2" x="40" y="145" text-anchor="start">405 billion × 1 byte</text><g class="m"><rect x="190" y="114" width="202.5" height="28" rx="3"/><text class="sub" x="291.25" y="128.0" text-anchor="middle" dominant-baseline="central">405 GB</text></g><text class="cap" x="40" y="188" text-anchor="start">H100s, 80 GB each</text><text class="sub2" x="40" y="205" text-anchor="start">eight to a box</text><g class="s"><rect x="190.0" y="174" width="40.0" height="28" rx="0"/><text class="sub" x="210.0" y="188.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="230.0" y="174" width="40.0" height="28" rx="0"/><text class="sub" x="250.0" y="188.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="s"><rect x="270.0" y="174" width="40.0" height="28" rx="0"/><text class="sub" x="290.0" y="188.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="s"><rect x="310.0" y="174" width="40.0" height="28" rx="0"/><text class="sub" x="330.0" y="188.0" text-anchor="middle" dominant-baseline="central">4</text></g><g class="s"><rect x="350.0" y="174" width="40.0" height="28" rx="0"/><text class="sub" x="370.0" y="188.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="s"><rect x="390.0" y="174" width="40.0" height="28" rx="0"/><text class="sub" x="410.0" y="188.0" text-anchor="middle" dominant-baseline="central">6</text></g><g class="s"><rect x="430.0" y="174" width="40.0" height="28" rx="0"/><text class="sub" x="450.0" y="188.0" text-anchor="middle" dominant-baseline="central">7</text></g><g class="s"><rect x="470.0" y="174" width="40.0" height="28" rx="0"/><text class="sub" x="490.0" y="188.0" text-anchor="middle" dominant-baseline="central">8</text></g><g class="u"><rect x="510.0" y="174" width="40.0" height="28" rx="0"/><text class="sub" x="530.0" y="188.0" text-anchor="middle" dominant-baseline="central">9</text></g><g class="u"><rect x="550.0" y="174" width="40.0" height="28" rx="0"/><text class="sub" x="570.0" y="188.0" text-anchor="middle" dominant-baseline="central">10</text></g><g class="u"><rect x="590.0" y="174" width="40.0" height="28" rx="0"/><text class="sub" x="610.0" y="188.0" text-anchor="middle" dominant-baseline="central">11</text></g><line class="mark xok" x1="595.0" y1="58" x2="595.0" y2="208"/><line class="tick" x1="190" y1="214" x2="510.0" y2="214"/><line class="tick" x1="190" y1="214" x2="190" y2="220"/><line class="tick" x1="510.0" y1="214" x2="510.0" y2="220"/><text class="sub2" x="350.0" y="236" text-anchor="middle">one box of eight: 640 GB</text><line class="tick" x1="512.0" y1="214" x2="630.0" y2="214"/><line class="tick" x1="512.0" y1="214" x2="512.0" y2="220"/><line class="tick" x1="630.0" y1="214" x2="630.0" y2="220"/><text class="sub2" x="571.0" y="236" text-anchor="middle">a second box</text><text class="cap" x="40" y="280" text-anchor="start">Weights take parameters × bytes each ({{fig:v01-o073}}). Llama 3's largest model has 405</text><text class="cap" x="40" y="300" text-anchor="start">billion parameters, so at 16 bits its weights are 810 GB: ten full H100s and part of an</text><text class="cap" x="40" y="320" text-anchor="start">eleventh, before any memory for the work itself.</text><text class="cap" x="40" y="360" text-anchor="start">A box of eight H100s holds 640 GB, so at 16 bits the model spills into a second box, and</text><text class="cap" x="40" y="380" text-anchor="start">whatever passes between the two goes over the network. At 8 bits the weights are 405 GB</text><text class="cap" x="40" y="400" text-anchor="start">and fit in one box, with 235 GB to spare.</text><text class="cap" x="40" y="440" text-anchor="start">A GB200 NVL72 rack holds 13.4 TB of HBM in one NVLink domain, more than sixteen times</text><text class="cap" x="40" y="460" text-anchor="start">the 16-bit weights.</text></svg><figcaption>Bars and boxes to scale; the dashed line is 810 GB. Parameter count from the Llama 3 paper, the rack's memory from NVIDIA's GB200 NVL72 specifications. Serving needs memory beyond the weights, so these counts are a floor.</figcaption></figure>
