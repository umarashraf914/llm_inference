<figure><div class='ts'>Fig 86 &nbsp;&middot;&nbsp; 16:16</div><h3>What a floating-point number is</h3><svg viewBox="0 0 680 396" role="img"><title>What a floating-point number is</title><text class="hd" x="40" y="46">A floating-point number is three fields</text><g class="u"><rect x="40" y="74" width="60" height="40" rx="4"></rect><text class="sub" x="70.0" y="94.0" text-anchor="middle" dominant-baseline="central">sign</text></g><g class="h"><rect x="108" y="74" width="200" height="40" rx="4"></rect><text class="sub" x="208.0" y="94.0" text-anchor="middle" dominant-baseline="central">exponent</text></g><g class="s"><rect x="316" y="74" width="324" height="40" rx="4"></rect><text class="sub" x="478.0" y="94.0" text-anchor="middle" dominant-baseline="central">fraction</text></g><text class="sub2" x="40" y="136" text-anchor="start">plus or minus</text><text class="sub2" x="108" y="136" text-anchor="start">roughly how big</text><text class="sub2" x="316" y="136" text-anchor="start">exactly which number, within that size</text><g class="m"><rect x="90" y="176" width="500" height="42" rx="6"></rect><text class="sub" x="340.0" y="197.0" text-anchor="middle" dominant-baseline="central">value  =  sign  x  2^exponent  x  1.fraction</text></g><text class="cap" x="40" y="262" text-anchor="start">The same idea as scientific notation, in base two. The exponent slides the decimal point and</text><text class="cap" x="40" y="282" text-anchor="start">the fraction says what the digits are.</text><text class="cap" x="40" y="318" text-anchor="start">Splitting the bits between those two fields is a choice, and it is the only choice that</text><text class="cap" x="40" y="338" text-anchor="start">distinguishes one format from another.</text><text class="cap" x="40" y="374" text-anchor="start">Everything on the precision ladder below is the same three fields with different widths.</text></svg><figcaption>Needed before any format can be compared with another. A whole video is devoted to this, but the three fields are enough to follow what comes next.</figcaption></figure>
