<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 16:16</div><h3>What a floating-point number is</h3><svg viewBox='0 0 680 512' role='img'><title>What a floating-point number is</title><text class="hd" x="40" y="46">Scientific notation, in base two</text><g class="u"><rect x="40" y="62" width="290" height="36" rx="6"/><text class="sub" x="185.0" y="80.0" text-anchor="middle" dominant-baseline="central">decimal:   1,500  =  1.5 × 10³</text></g><g class="u"><rect x="350" y="62" width="290" height="36" rx="6"/><text class="sub" x="495.0" y="80.0" text-anchor="middle" dominant-baseline="central">binary:   6  =  110  =  1.1 × 2²</text></g><text class="sub2" x="40" y="126" text-anchor="start">sign s</text><g class="u"><rect x="40" y="134" width="60" height="36" rx="4"/><text class="sub" x="70.0" y="152.0" text-anchor="middle" dominant-baseline="central">0</text></g><text class="sub2" x="40" y="188" text-anchor="start">0: plus</text><text class="sub2" x="108" y="126" text-anchor="start">exponent e, 8 bits</text><g class="h"><rect x="108" y="134" width="200" height="36" rx="4"/><text class="sub" x="208.0" y="152.0" text-anchor="middle" dominant-baseline="central">10000001</text></g><text class="sub2" x="108" y="188" text-anchor="start">129 = 2 + 127</text><text class="sub2" x="316" y="126" text-anchor="start">fraction f, 23 bits</text><g class="s"><rect x="316" y="134" width="324" height="36" rx="4"/><text class="sub" x="478.0" y="152.0" text-anchor="middle" dominant-baseline="central">10000000000000000000000</text></g><text class="sub2" x="316" y="188" text-anchor="start">the .1 of 1.1, then zeros</text><g class="m"><rect x="90" y="210" width="500" height="42" rx="6"/><text class="sub" x="340.0" y="231.0" text-anchor="middle" dominant-baseline="central">value  =  (−1)^s  ×  2^(e − 127)  ×  1.f</text></g><text class="cap" x="40" y="288" text-anchor="start">Scientific notation writes a number as a few digits times a power of ten, the power</text><text class="cap" x="40" y="308" text-anchor="start">saying where the decimal point goes. A floating-point number does the same in base two:</text><text class="cap" x="40" y="328" text-anchor="start">6 is 110 in binary, which is 1.1 × 2², the binary point moved two places.</text><text class="cap" x="40" y="368" text-anchor="start">FP32 keeps the three parts in 32 bits. The sign bit is 0 for plus. The exponent field</text><text class="cap" x="40" y="388" text-anchor="start">holds the power plus 127, the bias, so that negative powers need no sign of their own:</text><text class="cap" x="40" y="408" text-anchor="start">2² is stored as 129, and 2⁻³ would be 124.</text><text class="cap" x="40" y="448" text-anchor="start">The fraction, often called the mantissa, holds the digits after the binary point. With</text><text class="cap" x="40" y="468" text-anchor="start">the point placed just after the first 1, the digit before it is always 1, so it is not</text><text class="cap" x="40" y="488" text-anchor="start">stored: the significand is 1.f, and FP32 gets 24 significant bits from 23.</text></svg><figcaption>6 written as FP32, checked in Python. Every format in this Part is these three fields in other widths; the fourth atlas, on quantization, takes them further ({{ref:v04-o031}}).</figcaption></figure>
