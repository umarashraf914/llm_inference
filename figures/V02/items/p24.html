 y="109" width="22" height="22" rx="3"/></g><g class="s"><rect x="242" y="109" width="22" height="22" rx="3"/></g><g class="s"><rect x="167" y="134" width="22" height="22" rx="3"/></g><g class="s"><rect x="192" y="134" width="22" height="22" rx="3"/></g><g class="m"><rect x="217" y="134" width="22" height="22" rx="3"/></g><g class="s"><rect x="242" y="134" width="22" height="22" rx="3"/></g><g class="s"><rect x="167" y="159" width="22" height="22" rx="3"/></g><g class="s"><rect x="192" y="159" width="22" height="22" rx="3"/></g><g class="m"><rect x="217" y="159" width="22" height="22" rx="3"/></g><g class="s"><rect x="242" y="159" width="22" height="22" rx="3"/></g><text class="sub2" x="167" y="76" text-anchor="start">B</text><g class="u"><rect x="294" y="84" width="22" height="22" rx="3"/></g><g class="u"><rect x="319" y="84" width="22" height="22" rx="3"/></g><g class="u"><rect x="344" y="84" width="22" height="22" rx="3"/></g><g class="u"><rect x="369" y="84" width="22" height="22" rx="3"/></g><g class="u"><rect x="294" y="109" width="22" height="22" rx="3"/></g><g class="u"><rect x="319" y="109" width="22" height="22" rx="3"/></g><g class="m"><rect x="344" y="109" width="22" height="22" rx="3"/></g><g class="u"><rect x="369" y="109" width="22" height="22" rx="3"/></g><g class="u"><rect x="294" y="134" width="22" height="22" rx="3"/></g><g class="u"><rect x="319" y="134" width="22" height="22" rx="3"/></g><g class="u"><rect x="344" y="134" width="22" height="22" rx="3"/></g><g class="u"><rect x="369" y="134" width="22" height="22" rx="3"/></g><g class="u"><rect x="294" y="159" width="22" height="22" rx="3"/></g><g class="u"><rect x="319" y="159" width="22" height="22" rx="3"/></g><g class="u"><rect x="344" y="159" width="22" height="22" rx="3"/></g><g class="u"><rect x="369" y="159" width="22" height="22" rx="3"/></g><text class="sub2" x="294" y="76" text-anchor="start">C</text><g class="u"><rect x="421" y="84" width="22" height="22" rx="3"/></g><g class="u"><rect x="446" y="84" width="22" height="22" rx="3"/></g><g class="u"><rect x="471" y="84" width="22" height="22" rx="3"/></g><g class="u"><rect x="496" y="84" width="22" height="22" rx="3"/></g><g class="u"><rect x="421" y="109" width="22" height="22" rx="3"/></g><g class="u"><rect x="446" y="109" width="22" height="22" rx="3"/></g><g class="m"><rect x="471" y="109" width="22" height="22" rx="3"/></g><g class="u"><rect x="496" y="109" width="22" height="22" rx="3"/></g><g class="u"><rect x="421" y="134" width="22" height="22" rx="3"/></g><g class="u"><rect x="446" y="134" width="22" height="22" rx="3"/></g><g class="u"><rect x="471" y="134" width="22" height="22" rx="3"/></g><g class="u"><rect x="496" y="134" width="22" height="22" rx="3"/></g><g class="u"><rect x="421" y="159" width="22" height="22" rx="3"/></g><g class="u"><rect x="446" y="159" width="22" height="22" rx="3"/></g><g class="u"><rect x="471" y="159" width="22" height="22" rx="3"/></g><g class="u"><rect x="496" y="159" width="22" height="22" rx="3"/></g><text class="sub2" x="421" y="76" text-anchor="start">D</text><text class="hd" x="152" y="137.5" text-anchor="middle">×</text><text class="hd" x="279" y="137.5" text-anchor="middle">+</text><text class="hd" x="406" y="137.5" text-anchor="middle">=</text><g class="u"><rect x="40" y="207" width="600" height="42" rx="6"/><text class="sub" x="340.0" y="228.0" text-anchor="middle" dominant-baseline="central">d23  =  a21·b13  +  a22·b23  +  a23·b33  +  a24·b43  +  c23</text></g><text class="cap" x="40" y="289" text-anchor="start">one 4 × 4 × 4 step</text><g class="m"><rect x="230" y="271" width="410" height="26" rx="5"/><text class="sub" x="435.0" y="284.0" text-anchor="middle" dominant-baseline="central">64 multiply-adds from 32 numbers: each used 4 times</text></g><text class="cap" x="40" y="323" text-anchor="start">Volta's tensor core, 2017</text><g class="u"><rect x="230" y="305" width="410" height="26" rx="5"/><text class="sub" x="435.0" y="318.0" text-anchor="middle" dominant-baseline="central">exactly this step, 64 multiply-adds every tick</text></g><text class="cap" x="40" y="357" text-anchor="start">Hopper's tensor core</text><g class="u"><rect x="230" y="339" width="410" height="26" rx="5"/><text class="sub" x="435.0" y="352.0" text-anchor="middle" dominant-baseline="central">512 multiply-adds every tick</text></g><text class="cap" x="40" y="391" text-anchor="start">one warp instruction</text><g class="u"><rect x="230" y="373" width="410" height="26" rx="5"/><text class="sub" x="435.0" y="386.0" text-anchor="middle" dominant-baseline="central">16 × 8 × 16 = 2,048 multiply-adds: 4 ticks of one core</text></g><text class="cap" x="40" y="437" text-anchor="start">Each of the 16 entries of D is a row of A against a column of B, four multiply-adds,</text><text class="cap" x="40" y="457" text-anchor="start">plus the matching entry of C: 64 multiply-adds in all. Every number of A and B is used</text><text class="cap" x="40" y="477" text-anchor="start">four times, once for each entry in its row or column of D.</text><text class="cap" x="40" y="517" text-anchor="start">The first tensor cores, in Volta, did exactly one such 4 × 4 × 4 step per tick. Hopper's</text><text class="cap" x="40" y="537" text-anchor="start">does 512 multiply-adds a tick, so a warp's 16 × 8 × 16 instruction, 2,048 multiply-adds,</text><text class="cap" x="40" y="557" text-anchor="start">keeps one tensor core busy for four ticks.</text></svg><figcaption>What “a whole tile at once” means, counted. Volta's rate and the 16 × 8 × 16 shape are from NVIDIA's A100 whitepaper; Hopper's rate is the one behind the 989.4 trillion.</figcaption></figure>
