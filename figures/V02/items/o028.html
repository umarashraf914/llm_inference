<figure><div class='ts'>Fig 28 &nbsp;&middot;&nbsp; 3:34</div><h3>Where the throughput actually comes from</h3><svg viewBox="0 0 680 208" role="img"><title>Where the throughput actually comes from</title><text class="cap" x="40" y="76" text-anchor="start">128 CUDA cores</text><g class="u"><rect x="230" y="62" width="26" height="24" rx="3"></rect></g><text class="cap" x="40" y="130" text-anchor="start">4 tensor cores</text><g class="m"><rect x="230" y="116" width="390" height="24" rx="3"></rect></g><text class="cap" x="40" y="178" text-anchor="start">The H100's headline figure, close to a thousand trillion operations a second, comes almost</text><text class="cap" x="40" y="198" text-anchor="start">entirely from the four tensor cores, not the 128 CUDA cores beside them.</text></svg><figcaption>A kernel that never issues tensor-core instructions cannot approach peak, no matter how well it is otherwise written.</figcaption></figure>
