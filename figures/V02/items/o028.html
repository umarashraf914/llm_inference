<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 3:34</div><h3>The headline comes from four tensor cores, not 128 CUDA cores</h3><svg viewBox='0 0 680 376' role='img'><title>The headline comes from four tensor cores, not 128 CUDA cores</title><text class="hd" x="40" y="46">Peak operations per second, all 132 multiprocessors, drawn to scale</text><text class="cap" x="40" y="85" text-anchor="start">CUDA cores, 32-bit</text><g class="u"><rect x="200.0" y="66.0" width="27.0" height="28.0" rx="3"/></g><text class="sub2" x="237.04669496664644" y="85" text-anchor="start">66.9 trillion a second</text><text class="cap" x="40" y="129" text-anchor="start">CUDA cores, 16-bit</text><g class="u"><rect x="200.0" y="110.0" width="54.1" height="28.0" rx="3"/></g><text class="sub2" x="264.0933899332929" y="129" text-anchor="start">133.8 trillion a second</text><text class="cap" x="40" y="173" text-anchor="start">tensor cores, 16-bit</text><g class="m"><rect x="200" y="154" width="400.0" height="28" rx="3"/><text class="sub" x="400.0" y="168.0" text-anchor="middle" dominant-baseline="central">989.4 trillion a second</text></g><text class="cap" x="40" y="232" text-anchor="start">The H100's headline, close to a thousand trillion operations a second, comes almost</text><text class="cap" x="40" y="252" text-anchor="start">entirely from the four tensor cores in each multiprocessor. The 128 CUDA cores in each</text><text class="cap" x="40" y="272" text-anchor="start">one, across all 132, reach 66.9 trillion on 32-bit numbers, the format they are built</text><text class="cap" x="40" y="292" text-anchor="start">around, and 133.8 trillion on 16-bit numbers, which they handle two at a time.</text><text class="cap" x="40" y="332" text-anchor="start">Like for like, at 16 bits, the tensor cores are 7.4 times ahead. The next figure takes</text><text class="cap" x="40" y="352" text-anchor="start">the 989.4 apart.</text></svg><figcaption>A program that never uses the tensor cores cannot come within a factor of seven of the headline, however well it is otherwise written. Figures from NVIDIA's H100 whitepaper.</figcaption></figure>
