dth="1" stroke-dasharray="3 3"/><g class="u"><rect x="550" y="68" width="8" height="22" rx="1"/></g><rect x="550" y="108" width="8" height="22" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="u"><rect x="560" y="68" width="8" height="22" rx="1"/></g><rect x="560" y="108" width="8" height="22" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="u"><rect x="570" y="68" width="8" height="22" rx="1"/></g><rect x="570" y="108" width="8" height="22" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="u"><rect x="580" y="68" width="8" height="22" rx="1"/></g><rect x="580" y="108" width="8" height="22" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="u"><rect x="590" y="68" width="8" height="22" rx="1"/></g><rect x="590" y="108" width="8" height="22" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="u"><rect x="600" y="68" width="8" height="22" rx="1"/></g><rect x="600" y="108" width="8" height="22" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="u"><rect x="610" y="68" width="8" height="22" rx="1"/></g><rect x="610" y="108" width="8" height="22" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="u"><rect x="620" y="68" width="8" height="22" rx="1"/></g><rect x="620" y="108" width="8" height="22" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="154.0" y="150" text-anchor="middle">1</text><text class="sub2" x="314.0" y="150" text-anchor="middle">17</text><text class="sub2" x="474.0" y="150" text-anchor="middle">33</text><text class="sub2" x="624.0" y="150" text-anchor="middle">48</text><text class="sub2" x="628" y="168" text-anchor="end">tick</text><text class="cap" x="40" y="206" text-anchor="start">Every tick, each of the four schedulers issues one instruction across 32 lanes: 128</text><text class="cap" x="40" y="226" text-anchor="start">thread-instructions per tick for the multiprocessor. Spread over 2,048 resident threads,</text><text class="cap" x="40" y="246" text-anchor="start">each thread gets a turn every 16 ticks, if every warp is ready all the time.</text><text class="cap" x="40" y="286" text-anchor="start">At 1.98 billion ticks a second that is about 124 million instructions a second per</text><text class="cap" x="40" y="306" text-anchor="start">thread, a sixteenth of the clock. The chip as a whole issues 33.5 trillion</text><text class="cap" x="40" y="326" text-anchor="start">thread-instructions a second.</text><text class="cap" x="40" y="366" text-anchor="start">This is what “not one of them is fast on its own” means in numbers. The speed is in the</text><text class="cap" x="40" y="386" text-anchor="start">count, not in any one thread.</text></svg><figcaption>Gold cells are warp 0's turns. Slow threads are not a flaw to be engineered away; they are how 64 warps share four schedulers, and it is the sharing that hides the waits.</figcaption></figure>
