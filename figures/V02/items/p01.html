<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:39</div><h3>Almost three hundred, counted two ways</h3><svg viewBox='0 0 680 604' role='img'><title>Almost three hundred, counted two ways</title><text class="hd" x="40" y="46">One decode step of a 70B model on an H100, in time (log axis)</text><line class="axis" x1="170" y1="152" x2="600" y2="152"/><line class="tick" x1="170.0" y1="152" x2="170.0" y2="157"/><text class="sub2" x="170.0" y="172" text-anchor="middle">10 µs</text><line class="tick" x1="277.5" y1="152" x2="277.5" y2="157"/><text class="sub2" x="277.5" y="172" text-anchor="middle">0.1 ms</text><line class="tick" x1="385.0" y1="152" x2="385.0" y2="157"/><text class="sub2" x="385.0" y="172" text-anchor="middle">1 ms</text><line class="tick" x1="492.5" y1="152" x2="492.5" y2="157"/><text class="sub2" x="492.5" y="172" text-anchor="middle">10 ms</text><line class="tick" x1="600.0" y1="152" x2="600.0" y2="157"/><text class="sub2" x="600.0" y="172" text-anchor="middle">100 ms</text><text class="cap" x="40" y="83" text-anchor="start">arithmetic</text><g class="m"><rect x="170.0" y="66.0" width="123.7" height="24.0" rx="3"/></g><text class="sub2" x="303.7062839373831" y="83" text-anchor="start">0.141 ms</text><text class="cap" x="40" y="123" text-anchor="start">reading weights</text><g class="h"><rect x="170.0" y="106.0" width="389.2" height="24.0" rx="3"/></g><text class="sub2" x="569.2385827649" y="123" text-anchor="start">41.8 ms</text><text class="hd" x="40" y="222">The same step, as operations per byte (log axis)</text><line class="axis" x1="170" y1="316" x2="600" y2="316"/><line class="tick" x1="209.2" y1="316" x2="209.2" y2="321"/><text class="sub2" x="209.2" y="336" text-anchor="middle">1</text><line class="tick" x1="339.5" y1="316" x2="339.5" y2="321"/><text class="sub2" x="339.5" y="336" text-anchor="middle">10</text><line class="tick" x1="469.7" y1="316" x2="469.7" y2="321"/><text class="sub2" x="469.7" y="336" text-anchor="middle">100</text><line class="tick" x1="600.0" y1="316" x2="600.0" y2="321"/><text class="sub2" x="600.0" y="336" text-anchor="middle">1,000</text><text class="cap" x="40" y="253" text-anchor="start">decode delivers</text><g class="h"><rect x="170.0" y="236.0" width="39.2" height="24.0" rx="3"/></g><text class="sub2" x="219.21288152653557" y="253" text-anchor="start">1 operation per byte</text><text class="cap" x="40" y="293" text-anchor="start">the chip needs</text><g class="m"><rect x="170.0" y="276.0" width="361.0" height="24.0" rx="3"/></g><text class="sub2" x="540.969786706195" y="293" text-anchor="start">295 per byte to keep busy</text><g class="u"><rect x="40" y="360" width="600" height="42" rx="6"/><text class="sub" x="340.0" y="381.0" text-anchor="middle" dominant-baseline="central">41.8 ms  ÷  0.141 ms  =  295  =  (989.4 T ÷ 3.352 T)  ÷  1</text></g><text class="cap" x="40" y="440" text-anchor="start">Reading 140 GB of weights at 3,352 GB/s takes 41.8 ms ({{fig:v01-o014}}). The</text><text class="cap" x="40" y="460" text-anchor="start">arithmetic, 140 billion operations at 989.4 trillion a second, takes 0.141 ms. The maths</text><text class="cap" x="40" y="480" text-anchor="start">is busy 0.34% of the time.</text><text class="cap" x="40" y="520" text-anchor="start">Counted the second way, decode does one operation for each byte it reads</text><text class="cap" x="40" y="540" text-anchor="start">({{fig:v01-o116}}), while the chip can do 295 operations in the time one byte arrives:</text><text class="cap" x="40" y="560" text-anchor="start">the ridge ({{fig:v01-o126}}). The two ratios are the same number, because 140 billion</text><text class="cap" x="40" y="580" text-anchor="start">operations over 140 billion bytes is exactly one.</text></svg><figcaption>Time spent and work per byte tell one story: on a single request the chip waits 295 times longer than it computes. The rest of this atlas is about the machine that makes that so.</figcaption></figure>
