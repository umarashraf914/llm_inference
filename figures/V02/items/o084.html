<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 15:50</div><h3>Why narrower numbers run faster</h3><svg viewBox='0 0 680 453' role='img'><title>Why narrower numbers run faster</title><text class="hd" x="40" y="46">The same silicon as 32-bit, 16-bit or 8-bit multipliers (area to scale)</text><g class="u"><rect x="60.0" y="66.0" width="132.0" height="132.0" rx="0"/></g><text class="cap" x="126.0" y="228" text-anchor="middle">one 32-bit multiplier</text><text class="sub2" x="126.0" y="245" text-anchor="middle">1,024 ANDs</text><g class="m"><rect x="274.0" y="66.0" width="66.0" height="66.0" rx="0"/></g><g class="m"><rect x="340.0" y="66.0" width="66.0" height="66.0" rx="0"/></g><g class="m"><rect x="274.0" y="132.0" width="66.0" height="66.0" rx="0"/></g><g class="m"><rect x="340.0" y="132.0" width="66.0" height="66.0" rx="0"/></g><text class="cap" x="340.0" y="228" text-anchor="middle">four 16-bit ones</text><text class="sub2" x="340.0" y="245" text-anchor="middle">256 ANDs each</text><g class="m"><rect x="488.0" y="66.0" width="33.0" height="33.0" rx="0"/></g><g class="m"><rect x="521.0" y="66.0" width="33.0" height="33.0" rx="0"/></g><g class="m"><rect x="554.0" y="66.0" width="33.0" height="33.0" rx="0"/></g><g class="m"><rect x="587.0" y="66.0" width="33.0" height="33.0" rx="0"/></g><g class="m"><rect x="488.0" y="99.0" width="33.0" height="33.0" rx="0"/></g><g class="m"><rect x="521.0" y="99.0" width="33.0" height="33.0" rx="0"/></g><g class="m"><rect x="554.0" y="99.0" width="33.0" height="33.0" rx="0"/></g><g class="m"><rect x="587.0" y="99.0" width="33.0" height="33.0" rx="0"/></g><g class="m"><rect x="488.0" y="132.0" width="33.0" height="33.0" rx="0"/></g><g class="m"><rect x="521.0" y="132.0" width="33.0" height="33.0" rx="0"/></g><g class="m"><rect x="554.0" y="132.0" width="33.0" height="33.0" rx="0"/></g><g class="m"><rect x="587.0" y="132.0" width="33.0" height="33.0" rx="0"/></g><g class="m"><rect x="488.0" y="165.0" width="33.0" height="33.0" rx="0"/></g><g class="m"><rect x="521.0" y="165.0" width="33.0" height="33.0" rx="0"/></g><g class="m"><rect x="554.0" y="165.0" width="33.0" height="33.0" rx="0"/></g><g class="m"><rect x="587.0" y="165.0" width="33.0" height="33.0" rx="0"/></g><text class="cap" x="554.0" y="228" text-anchor="middle">sixteen 8-bit ones</text><text class="sub2" x="554.0" y="245" text-anchor="middle">64 ANDs each</text><text class="cap" x="40" y="289" text-anchor="start">A multiplier's size goes with the square of its width (the last figure), so the area of</text><text class="cap" x="40" y="309" text-anchor="start">one 32-bit multiplier holds four 16-bit ones, or sixteen 8-bit ones: 1,024 = 4 × 256 =</text><text class="cap" x="40" y="329" text-anchor="start">16 × 64.</text><text class="cap" x="40" y="369" text-anchor="start">By area alone, halving the width would quadruple the multiplies per tick. Tensor cores</text><text class="cap" x="40" y="389" text-anchor="start">double them instead: the H100 does 989.4 trillion operations a second at 16 bits and</text><text class="cap" x="40" y="409" text-anchor="start">1,978.9 trillion at 8. Why twice and not four times becomes clear once a floating-point</text><text class="cap" x="40" y="429" text-anchor="start">number is taken apart ({{fig:v02-p28}}).</text></svg><figcaption>Squares drawn to the AND-gate count, ignoring the wiring between them. The square law sets how much arithmetic fits; something else sets how fast it can be fed.</figcaption></figure>
