<figure><div class='ts'>Fig 84 &nbsp;&middot;&nbsp; 15:55</div><h3>Why narrower numbers run faster</h3><svg viewBox="0 0 680 426" role="img"><title>Why narrower numbers run faster</title><text class="hd" x="40" y="46">Why fewer bits means more arithmetic per second</text><text class="cap" x="40" y="92" text-anchor="start">One 32-bit multiplier</text><g class="u"><rect x="300" y="76" width="320" height="30" rx="3"></rect></g><text class="cap" x="40" y="152" text-anchor="start">The same silicon, at 16 bits</text><g class="m"><rect x="300" y="136" width="155" height="30" rx="3"></rect></g><g class="m"><rect x="465" y="136" width="155" height="30" rx="3"></rect></g><text class="cap" x="40" y="212" text-anchor="start">The same silicon, at 8 bits</text><g class="m"><rect x="300" y="196" width="72" height="30" rx="3"></rect></g><g class="m"><rect x="382" y="196" width="72" height="30" rx="3"></rect></g><g class="m"><rect x="464" y="196" width="72" height="30" rx="3"></rect></g><g class="m"><rect x="546" y="196" width="72" height="30" rx="3"></rect></g><text class="cap" x="40" y="272" text-anchor="start">A multiplier's area grows roughly with the square of its width, so halving the width buys</text><text class="cap" x="40" y="292" text-anchor="start">considerably more than twice the units in the same area.</text><text class="cap" x="40" y="328" text-anchor="start">And the second payoff, which is separate: half the bits is half the bytes to move, so the same</text><text class="cap" x="40" y="348" text-anchor="start">memory bus delivers twice as many numbers.</text><text class="cap" x="40" y="384" text-anchor="start">One change, two bottlenecks eased. That is why every generation adds a narrower format, and</text><text class="cap" x="40" y="404" text-anchor="start">why the throughput figures double each time it does.</text></svg><figcaption>Boxes are schematic. The mechanism is not: a narrower multiplier takes less area, and more of them fit.</figcaption></figure>
