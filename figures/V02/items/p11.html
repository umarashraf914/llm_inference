<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 5:22</div><h3>A launch is a grid of blocks, and a block is the unit that shares memory</h3><svg viewBox='0 0 680 554' role='img'><title>A launch is a grid of blocks, and a block is the unit that shares memory</title><g class="u"><rect x="40" y="40" width="260" height="254" rx="14"/><text class="lbl" x="62" y="66">one launch: a grid of blocks</text></g><g class="s"><rect x="62" y="82" width="66" height="34" rx="4"/><text class="sub" x="95.0" y="99.0" text-anchor="middle" dominant-baseline="central">block 0</text></g><g class="s"><rect x="138" y="82" width="66" height="34" rx="4"/><text class="sub" x="171.0" y="99.0" text-anchor="middle" dominant-baseline="central">block 1</text></g><g class="s"><rect x="214" y="82" width="66" height="34" rx="4"/><text class="sub" x="247.0" y="99.0" text-anchor="middle" dominant-baseline="central">block 2</text></g><g class="s"><rect x="62" y="132" width="66" height="34" rx="4"/><text class="sub" x="95.0" y="149.0" text-anchor="middle" dominant-baseline="central">block 3</text></g><g class="m"><rect x="138" y="132" width="66" height="34" rx="4"/><text class="sub" x="171.0" y="149.0" text-anchor="middle" dominant-baseline="central">block 4</text></g><g class="s"><rect x="214" y="132" width="66" height="34" rx="4"/><text class="sub" x="247.0" y="149.0" text-anchor="middle" dominant-baseline="central">block 5</text></g><g class="s"><rect x="62" y="182" width="66" height="34" rx="4"/><text class="sub" x="95.0" y="199.0" text-anchor="middle" dominant-baseline="central">block 6</text></g><g class="s"><rect x="138" y="182" width="66" height="34" rx="4"/><text class="sub" x="171.0" y="199.0" text-anchor="middle" dominant-baseline="central">block 7</text></g><g class="s"><rect x="214" y="182" width="66" height="34" rx="4"/><text class="sub" x="247.0" y="199.0" text-anchor="middle" dominant-baseline="central">block 8</text></g><g class="m"><rect x="62" y="232" width="66" height="34" rx="4"/><text class="sub" x="95.0" y="249.0" text-anchor="middle" dominant-baseline="central">block 9</text></g><g class="s"><rect x="138" y="232" width="66" height="34" rx="4"/><text class="sub" x="171.0" y="249.0" text-anchor="middle" dominant-baseline="central">block 10</text></g><g class="s"><rect x="214" y="232" width="66" height="34" rx="4"/><text class="sub" x="247.0" y="249.0" text-anchor="middle" dominant-baseline="central">block …</text></g><g class="u"><rect x="330" y="40" width="310" height="254" rx="14"/><text class="lbl" x="352" y="66">one multiprocessor</text></g><g class="m"><rect x="352" y="82" width="266" height="54" rx="6"/><text class="sub" x="485.0" y="109.0" text-anchor="middle" dominant-baseline="central">block 4: 1,024 threads, 32 warps</text></g><g class="m"><rect x="352" y="148" width="266" height="54" rx="6"/><text class="sub" x="485.0" y="175.0" text-anchor="middle" dominant-baseline="central">block 9: 1,024 threads, 32 warps</text></g><g class="s"><rect x="352" y="214" width="266" height="54" rx="6"/><text class="sub" x="485.0" y="241.0" text-anchor="middle" dominant-baseline="central">shared memory: a separate part each</text></g><text class="cap" x="40" y="330" text-anchor="start">Launching a kernel means asking for a grid of blocks. To add two arrays of 1,048,576</text><text class="cap" x="40" y="350" text-anchor="start">numbers with 256 threads per block takes 4,096 blocks. A block may hold up to 1,024</text><text class="cap" x="40" y="370" text-anchor="start">threads, 32 warps.</text><text class="cap" x="40" y="410" text-anchor="start">The hardware places each block whole on one multiprocessor, which keeps it until all its</text><text class="cap" x="40" y="430" text-anchor="start">threads finish. A multiprocessor holds up to 2,048 threads, two blocks of 1,024 or eight</text><text class="cap" x="40" y="450" text-anchor="start">of 256, and never more than 32 blocks at once.</text><text class="cap" x="40" y="490" text-anchor="start">Shared memory belongs to a block. Its threads all see the same scratchpad, as the staged</text><text class="cap" x="40" y="510" text-anchor="start">tile did, and no other block can see it. That is why a block, and not a warp or a</text><text class="cap" x="40" y="530" text-anchor="start">launch, is the unit that cooperates.</text></svg><figcaption>Two levels between the thread and the chip: warps for issuing instructions, blocks for sharing memory. Limits from NVIDIA's CUDA programming guide (compute capability 9.0).</figcaption></figure>
