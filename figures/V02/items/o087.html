<figure><div class='ts'>Fig 87 &nbsp;&middot;&nbsp; 16:20</div><h3>Range and precision are different things</h3><svg viewBox='0 0 680 364' role="img"><title>Range and precision are different things</title><text class="hd" x="40" y="46">Range and precision are bought separately</text><text class="cap" x="40" y="92" text-anchor="start">More exponent bits</text><g class="h"><rect x="300" y="76" width="320" height="30" rx="3"></rect><text class="sub" x="460.0" y="91.0" text-anchor="middle" dominant-baseline="central">reaches larger and smaller numbers</text></g><text class="cap" x="40" y="152" text-anchor="start">More fraction bits</text><g class="s"><rect x="300" y="136" width="320" height="30" rx="3"></rect><text class="sub" x="460.0" y="151.0" text-anchor="middle" dominant-baseline="central">tells nearby numbers apart</text></g><text class="cap" x="40" y="200" text-anchor="start">A format with a wide exponent and a narrow fraction covers an enormous span coarsely.</text><text class="cap" x="40" y="220" text-anchor="start">The reverse covers a narrow span finely.</text><text class="cap" x="40" y="260" text-anchor="start">With a fixed number of bits, every one given to one field is taken from the other. There</text><text class="cap" x="40" y="280" text-anchor="start">is no setting that improves both.</text><text class="cap" x="40" y="320" text-anchor="start">So a format must choose. For neural networks the choice turned out to be range, and the</text><text class="cap" x="40" y="340" text-anchor="start">next figures show what that buys and what it costs.</text></svg><figcaption>Two properties that sound similar and trade directly against each other. Which one a workload needs is an empirical question, and deep learning gave a surprising answer.</figcaption></figure>
