<figure><div class='ts'>Fig 87 &nbsp;&middot;&nbsp; 16:16</div><h3>Range and precision are different things</h3><svg viewBox="0 0 680 366" role="img"><title>Range and precision are different things</title><text class="hd" x="40" y="46">Range and precision are bought separately</text><text class="cap" x="40" y="92" text-anchor="start">More exponent bits</text><g class="h"><rect x="300" y="76" width="320" height="30" rx="3"></rect><text class="sub" x="460.0" y="91.0" text-anchor="middle" dominant-baseline="central">reaches larger and smaller numbers</text></g><text class="cap" x="40" y="152" text-anchor="start">More fraction bits</text><g class="s"><rect x="300" y="136" width="320" height="30" rx="3"></rect><text class="sub" x="460.0" y="151.0" text-anchor="middle" dominant-baseline="central">tells nearby numbers apart</text></g><text class="cap" x="40" y="212" text-anchor="start">A format with a wide exponent and a narrow fraction covers an enormous span coarsely. The</text><text class="cap" x="40" y="232" text-anchor="start">reverse covers a narrow span finely.</text><text class="cap" x="40" y="268" text-anchor="start">With a fixed number of bits, every one given to one field is taken from the other. There is no</text><text class="cap" x="40" y="288" text-anchor="start">setting that improves both.</text><text class="cap" x="40" y="324" text-anchor="start">Training turns out to need range far more than precision, which is why the format designed for</text><text class="cap" x="40" y="344" text-anchor="start">it keeps all its exponent bits and gives up most of the fraction.</text></svg><figcaption>Two properties that sound similar and trade directly against each other. Which one a workload needs is an empirical question, and deep learning gave a surprising answer.</figcaption></figure>
