<figure><div class='ts'>Fig 90 &nbsp;&middot;&nbsp; 16:54</div><h3>A caution on the marketing</h3><svg viewBox="0 0 680 304" role="img"><title>A caution on the marketing</title><text class="cap" x="40" y="78" text-anchor="start">Headline claim</text><g class="h"><rect x="210" y="62" width="400" height="32" rx="4"></rect><text class="sub" x="410.0" y="78.0" text-anchor="middle" dominant-baseline="central">9×</text></g><text class="cap" x="40" y="158" text-anchor="start">Honest per-generation</text><text class="sub2" x="40" y="178" text-anchor="start">gain on real work</text><g class="m"><rect x="210.0" y="142.0" width="88.9" height="32.0" rx="4"/></g><rect x="298.9" y="142" width="88.9" height="32" rx="4" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="397.8" y="163" text-anchor="start">2 to 4×</text><text class="cap" x="40" y="232" text-anchor="start">The headline blends the precision gain with faster interconnects and ideal benchmarks.</text><text class="cap" x="40" y="262" text-anchor="start">Worth carrying as a habit: when a generational speed-up is quoted, ask which of the three</text><text class="cap" x="40" y="282" text-anchor="start">attacks on the wall it is actually measuring.</text></svg><figcaption>The kind of number that propagates through blog posts unchallenged. The underlying improvements are real; the multiplier is not comparable across workloads.</figcaption></figure>
