<figure><div class='ts'>Fig 62 &nbsp;&middot;&nbsp; 10:28</div><h3>The granularity that causes the problem</h3><svg viewBox="0 0 680 238" role="img"><title>The granularity that causes the problem</title><text class="hd" x="40" y="46">The hardware cannot fetch a single value</text><g class="h"><rect x="40" y="62" width="600" height="44" rx="3"></rect><text class="sub" x="340.0" y="84.0" text-anchor="middle" dominant-baseline="central">one cache line, moved as a unit</text></g><line class="tick" x1="140" y1="112" x2="140" y2="128"></line><text class="sub2" x="140" y="148" text-anchor="middle">the one value a thread asked for</text><text class="cap" x="40" y="196" text-anchor="start">Every read from HBM drags in a whole block. Whether that is efficient depends entirely on</text><text class="cap" x="40" y="216" text-anchor="start">what the other 31 threads in the warp asked for.</text></svg><figcaption>One hardware limitation, and the entire discipline of memory-access patterns follows from it.</figcaption></figure>
