<figure><div class='ts'>Fig 17 &nbsp;&middot;&nbsp; 0:20</div><h3>Why a DRAM read is slow</h3><svg viewBox="0 0 680 312" role="img"><title>Why a DRAM read is slow</title><text class="hd" x="40" y="46">Reading a DRAM cell destroys what it read</text><g class="h"><rect x="60" y="74" width="150" height="40" rx="4"></rect><text class="sub" x="135.0" y="94.0" text-anchor="middle" dominant-baseline="central">charge sits</text></g><line class="conn" x1="216" y1="94" x2="240" y2="94" marker-end="url(#arw)"></line><g class="u"><rect x="246" y="74" width="170" height="40" rx="4"></rect><text class="sub" x="331.0" y="94.0" text-anchor="middle" dominant-baseline="central">read: it drains out</text></g><line class="conn" x1="422" y1="94" x2="446" y2="94" marker-end="url(#arw)"></line><g class="m"><rect x="452" y="74" width="188" height="40" rx="4"></rect><text class="sub" x="546.0" y="94.0" text-anchor="middle" dominant-baseline="central">write it back again</text></g><text class="cap" x="40" y="158" text-anchor="start">The charge is tiny, so measuring it uses it up. Every read is therefore a read followed by a</text><text class="cap" x="40" y="178" text-anchor="start">rewrite, and the cell is unavailable until that finishes.</text><text class="cap" x="40" y="214" text-anchor="start">An SRAM cell holds its state actively, so reading it changes nothing and it is ready again</text><text class="cap" x="40" y="234" text-anchor="start">immediately.</text><text class="cap" x="40" y="270" text-anchor="start">One transistor and a leaking capacitor buys enormous density. It costs refresh, destructive</text><text class="cap" x="40" y="290" text-anchor="start">reads and latency, and those three costs are the memory wall in physical form.</text></svg><figcaption>Three separate penalties from one design decision. Density was worth all of them, which is why main memory has worked this way for fifty years.</figcaption></figure>
