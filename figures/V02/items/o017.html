<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 7:44</div><h3>Reading DRAM destroys the bit, and every row must be rewritten every 64 ms</h3><svg viewBox='0 0 680 494' role='img'><title>Reading DRAM destroys the bit, and every row must be rewritten every 64 ms</title><text class="hd" x="40" y="46">Reading a DRAM cell uses up what it read</text><g class="h"><rect x="40" y="66" width="170" height="40" rx="8"/><text class="lbl" x="125.0" y="86.0" text-anchor="middle" dominant-baseline="central">charge sits</text></g><line class="conn" x1="214" y1="86" x2="236" y2="86" marker-end="url(#arw)"/><g class="u"><rect x="240" y="66" width="190" height="40" rx="8"/><text class="lbl" x="335.0" y="86.0" text-anchor="middle" dominant-baseline="central">read: it drains out</text></g><line class="conn" x1="434" y1="86" x2="456" y2="86" marker-end="url(#arw)"/><g class="m"><rect x="460" y="66" width="180" height="40" rx="8"/><text class="lbl" x="550.0" y="86.0" text-anchor="middle" dominant-baseline="central">write it back</text></g><text class="hd" x="40" y="160">And every row is rewritten on a timer, read or not</text><polyline class="pl-h" points="60.0,186.0 226.4,222.0 226.4,186.0 392.8,222.0 392.8,186.0 559.2,222.0"/><line class="axis" x1="60" y1="266" x2="579.2" y2="266"/><line class="tick" x1="60.0" y1="266" x2="60.0" y2="271"/><text class="sub2" x="60.0" y="286" text-anchor="middle">0 ms</text><line class="tick" x1="226.4" y1="266" x2="226.4" y2="271"/><text class="sub2" x="226.4" y="286" text-anchor="middle">64 ms</text><line class="tick" x1="392.8" y1="266" x2="392.8" y2="271"/><text class="sub2" x="392.8" y="286" text-anchor="middle">128 ms</text><line class="tick" x1="559.2" y1="266" x2="559.2" y2="271"/><text class="sub2" x="559.2" y="286" text-anchor="middle">192 ms</text><text class="sub2" x="589.2" y="212" text-anchor="start">each jump up:</text><text class="sub2" x="589.2" y="230" text-anchor="start">the row rewritten</text><text class="sub2" x="589.2" y="248" text-anchor="start">back to full</text><text class="cap" x="40" y="330" text-anchor="start">The charge is tiny, so measuring it drains it. Every read is a read followed by a</text><text class="cap" x="40" y="350" text-anchor="start">rewrite, and the row is busy until the rewrite finishes.</text><text class="cap" x="40" y="390" text-anchor="start">Charge also leaks, so the memory rewrites every row on a timer. A standard DRAM chip</text><text class="cap" x="40" y="410" text-anchor="start">keeps its data only if every row is refreshed within 64 ms, or 32 ms above 85 °C. It</text><text class="cap" x="40" y="430" text-anchor="start">does this with 8,192 refresh commands per window, one every 7.8 µs, each covering a</text><text class="cap" x="40" y="450" text-anchor="start">slice of the rows: about 16 complete rewrites a second (31 when hot), whether or not</text><text class="cap" x="40" y="470" text-anchor="start">anybody is reading.</text></svg><figcaption>Refresh times from Micron's DDR4 datasheet; the decay drawn is schematic. These are the price of density: they make DRAM slower to answer, but they do not cap its bandwidth, which comes from wires.</figcaption></figure>
