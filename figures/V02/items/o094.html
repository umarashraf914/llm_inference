<figure><div class='ts'>Fig 94 &nbsp;&middot;&nbsp; 18:02</div><h3>Why each level out is slower</h3><svg viewBox='0 0 680 364' role="img"><title>Why each level out is slower</title><text class="hd" x="40" y="46">Why leaving the package is expensive</text><g class="s"><rect x="40" y="66" width="185" height="76" rx="8"></rect><text class="lbl" x="132.5" y="87.0" text-anchor="middle" dominant-baseline="central">On package</text><text class="sub" x="132.5" y="105.0" text-anchor="middle" dominant-baseline="central">HBM, 5,120</text><text class="sub" x="132.5" y="122.0" text-anchor="middle" dominant-baseline="central">short wires</text></g><g class="u"><rect x="248" y="66" width="185" height="76" rx="8"></rect><text class="lbl" x="340.5" y="87.0" text-anchor="middle" dominant-baseline="central">Off package</text><text class="sub" x="340.5" y="105.0" text-anchor="middle" dominant-baseline="central">NVLink, 72 pairs</text><text class="sub" x="340.5" y="122.0" text-anchor="middle" dominant-baseline="central">of longer wires</text></g><g class="h"><rect x="456" y="66" width="184" height="76" rx="8"></rect><text class="lbl" x="548.0" y="95.0" text-anchor="middle" dominant-baseline="central">Across the room</text><text class="sub" x="548.0" y="113.0" text-anchor="middle" dominant-baseline="central">InfiniBand, a cable</text></g><text class="cap" x="40" y="180" text-anchor="start">Bandwidth is width times frequency, and width means physical connections. A package can</text><text class="cap" x="40" y="200" text-anchor="start">carry thousands of them over millimetres; a board connector carries far fewer over</text><text class="cap" x="40" y="220" text-anchor="start">centimetres; a network cable carries fewer still over metres.</text><text class="cap" x="40" y="260" text-anchor="start">Each hop out also costs more energy per bit, because driving a longer wire at the same</text><text class="cap" x="40" y="280" text-anchor="start">rate takes more power.</text><text class="cap" x="40" y="320" text-anchor="start">So the drop at each level, several times per step, is not a design oversight. It is</text><text class="cap" x="40" y="340" text-anchor="start">geometry.</text></svg><figcaption>The same width-times-frequency reasoning from Part 1, applied outward. It explains why the hierarchy continues past the chip boundary.</figcaption></figure>
