<figure><div class='ts'>Fig 94 &nbsp;&middot;&nbsp; 17:40</div><h3>Why each level out is slower</h3><svg viewBox="0 0 680 328" role="img"><title>Why each level out is slower</title><text class="hd" x="40" y="46">Why leaving the package is expensive</text><g class="s"><rect x="40" y="66" width="185" height="76" rx="8"></rect><text class="lbl" x="132.5" y="87.0" text-anchor="middle" dominant-baseline="central">On package</text><text class="sub" x="132.5" y="105.0" text-anchor="middle" dominant-baseline="central">HBM, thousands of</text><text class="sub" x="132.5" y="122.0" text-anchor="middle" dominant-baseline="central">short connections</text></g><g class="u"><rect x="248" y="66" width="185" height="76" rx="8"></rect><text class="lbl" x="340.5" y="87.0" text-anchor="middle" dominant-baseline="central">Off package</text><text class="sub" x="340.5" y="105.0" text-anchor="middle" dominant-baseline="central">NVLink, hundreds of</text><text class="sub" x="340.5" y="122.0" text-anchor="middle" dominant-baseline="central">longer ones</text></g><g class="h"><rect x="456" y="66" width="184" height="76" rx="8"></rect><text class="lbl" x="548.0" y="95.0" text-anchor="middle" dominant-baseline="central">Across the room</text><text class="sub" x="548.0" y="113.0" text-anchor="middle" dominant-baseline="central">InfiniBand, a cable</text></g><text class="cap" x="40" y="186" text-anchor="start">Bandwidth is width times frequency, and width means physical connections. A package can carry</text><text class="cap" x="40" y="206" text-anchor="start">thousands of them over millimetres; a board connector carries far fewer over centimetres; a</text><text class="cap" x="40" y="226" text-anchor="start">network cable carries fewer still over metres.</text><text class="cap" x="40" y="256" text-anchor="start">Each hop out also costs more energy per bit, because driving a longer wire at the same rate</text><text class="cap" x="40" y="276" text-anchor="start">takes more power.</text><text class="cap" x="40" y="306" text-anchor="start">So the roughly tenfold drop at each level is not a design oversight. It is geometry.</text></svg><figcaption>The same width-times-frequency reasoning from Part 1, applied outward. It explains why the hierarchy continues past the chip boundary.</figcaption></figure>
