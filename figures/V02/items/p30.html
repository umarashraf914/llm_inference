<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 16:33</div><h3>BF16 reaches 5 × 10³³ times higher than FP16, in steps eight times coarser</h3><svg viewBox='0 0 680 638' role='img'><title>BF16 reaches 5 × 10³³ times higher than FP16, in steps eight times coarser</title><text class="hd" x="40" y="46">Range: smallest normal number to largest (log axis, eighty powers of ten)</text><text class="cap" x="40" y="79" text-anchor="start">FP32</text><g class="u"><rect x="162.2" y="62" width="449.2" height="24" rx="3"/><text class="sub" x="386.79999999999995" y="74.0" text-anchor="middle" dominant-baseline="central">1.2 × 10⁻³⁸ to 3.4 × 10³⁸</text></g><text class="cap" x="40" y="113" text-anchor="start">BF16</text><g class="s"><rect x="162.2" y="96" width="449.2" height="24" rx="3"/><text class="sub" x="386.79999999999995" y="108.0" text-anchor="middle" dominant-baseline="central">1.2 × 10⁻³⁸ to 3.4 × 10³⁸</text></g><text class="cap" x="40" y="147" text-anchor="start">FP16</text><g class="m"><rect x="360.2" y="130.0" width="53.1" height="24.0" rx="3"/></g><text class="sub2" x="421.3" y="147" text-anchor="start">6.1 × 10⁻⁵ to 65,504</text><line class="axis" x1="150" y1="166" x2="620" y2="166"/><line class="tick" x1="150.0" y1="166" x2="150.0" y2="171"/><text class="sub2" x="150.0" y="185" text-anchor="middle">10⁻⁴⁰</text><line class="tick" x1="267.5" y1="166" x2="267.5" y2="171"/><text class="sub2" x="267.5" y="185" text-anchor="middle">10⁻²⁰</text><line class="tick" x1="385.0" y1="166" x2="385.0" y2="171"/><text class="sub2" x="385.0" y="185" text-anchor="middle">1</text><line class="tick" x1="502.5" y1="166" x2="502.5" y2="171"/><text class="sub2" x="502.5" y="185" text-anchor="middle">10²⁰</text><line class="tick" x1="620.0" y1="166" x2="620.0" y2="171"/><text class="sub2" x="620.0" y="185" text-anchor="middle">10⁴⁰</text><text class="hd" x="40" y="222">Precision: every number each format holds from 1 to 1.03 (linear axis)</text><text class="cap" x="40" y="254" text-anchor="start">FP16</text><text class="sub2" x="40" y="271" text-anchor="start">every 0.00098</text><line class="axis" x1="150" y1="254" x2="620" y2="254"/><line class="pl-m" x1="150.0" y1="244" x2="150.0" y2="264"/><line class="pl-m" x1="165.3" y1="244" x2="165.3" y2="264"/><line class="pl-m" x1="180.6" y1="244" x2="180.6" y2="264"/><line class="pl-m" x1="195.9" y1="244" x2="195.9" y2="264"/><line class="pl-m" x1="211.2" y1="244" x2="211.2" y2="264"/><line class="pl-m" x1="226.5" y1="244" x2="226.5" y2="264"/><line class="pl-m" x1="241.8" y1="244" x2="241.8" y2="264"/><line class="pl-m" x1="257.1" y1="244" x2="257.1" y2="264"/><line class="pl-m" x1="272.4" y1="244" x2="272.4" y2="264"/><line class="pl-m" x1="287.7" y1="244" x2="287.7" y2="264"/><line class="pl-m" x1="303.0" y1="244" x2="303.0" y2="264"/><line class="pl-m" x1="318.3" y1="244" x2="318.3" y2="264"/><line class="pl-m" x1="333.6" y1="244" x2="333.6" y2="264"/><line class="pl-m" x1="348.9" y1="244" x2="348.9" y2="264"/><line class="pl-m" x1="364.2" y1="244" x2="364.2" y2="264"/><line class="pl-m" x1="379.5" y1="244" x2="379.5" y2="264"/><line class="pl-m" x1="394.8" y1="244" x2="394.8" y2="264"/><line class="pl-m" x1="410.1" y1="244" x2="410.1" y2="264"/><line class="pl-m" x1="425.4" y1="244" x2="425.4" y2="264"/><line class="pl-m" x1="440.7" y1="244" x2="440.7" y2="264"/><line class="pl-m" x1="456.0" y1="244" x2="456.0" y2="264"/><line class="pl-m" x1="471.3" y1="244" x2="471.3" y2="264"/><line class="pl-m" x1="486.6" y1="244" x2="486.6" y2="264"/><line class="pl-m" x1="501.9" y1="244" x2="501.9" y2="264"/><line class="pl-m" x1="517.2" y1="244" x2="517.2" y2="264"/><line class="pl-m" x1="532.5" y1="244" x2="532.5" y2="264"/><line class="pl-m" x1="547.8" y1="244" x2="547.8" y2="264"/><line class="pl-m" x1="563.1" y1="244" x2="563.1" y2="264"/><line class="pl-m" x1="578.4" y1="244" x2="578.4" y2="264"/><line class="pl-m" x1="593.7" y1="244" x2="593.7" y2="264"/><line class="pl-m" x1="609.0" y1="244" x2="609.0" y2="264"/><text class="cap" x="40" y="300" text-anchor="start">BF16</text><text class="sub2" x="40" y="317" text-anchor="start">every 0.0078</text><line class="axis" x1="150" y1="300" x2="620" y2="300"/><line class="pl-h" x1="150.0" y1="290" x2="150.0" y2="310"/><line class="pl-h" x1="272.4" y1="290" x2="272.4" y2="310"/><line class="pl-h" x1="394.8" y1="290" x2="394.8" y2="310"/><line class="pl-h" x1="517.2" y1="290" x2="517.2" y2="310"/><line class="axis" x1="150" y1="338" x2="620" y2="338"/><line class="tick" x1="150.0" y1="338" x2="150.0" y2="343"/><text class="sub2" x="150.0" y="357" text-anchor="middle">1.00</text><line class="tick" x1="306.7" y1="338" x2="306.7" y2="343"/><text class="sub2" x="306.7" y="357" text-anchor="middle">1.01</text><line class="tick" x1="463.3" y1="338" x2="463.3" y2="343"/><text class="sub2" x="463.3" y="357" text-anchor="middle">1.02</text><line class="tick" x1="620.0" y1="338" x2="620.0" y2="343"/><text class="sub2" x="620.0" y="357" text-anchor="middle">1.03</text><text class="cap" x="40" y="394" text-anchor="start">The largest number has the biggest exponent and every fraction bit set; the smallest</text><text class="cap" x="40" y="414" text-anchor="start">normal one has the smallest exponent and none. The all-zeros and all-ones exponent</text><text class="cap" x="40" y="434" text-anchor="start">patterns are kept for zero, infinity and the tiniest numbers. So FP16, with five</text><text class="cap" x="40" y="454" text-anchor="start">exponent bits and a bias of 15, spans 2⁻¹⁴ = 0.000061 to (2 − 2⁻¹⁰) × 2¹⁵ = 65,504, and</text><text class="cap" x="40" y="474" text-anchor="start">BF16 spans 2⁻¹²⁶ to 3.4 × 10³⁸, the same powers of two as FP32.</text><text class="cap" x="40" y="514" text-anchor="start">Precision runs the other way. Just above 1, FP16's numbers are 2⁻¹⁰ = 0.00098 apart and</text><text class="cap" x="40" y="534" text-anchor="start">BF16's 2⁻⁷ = 0.0078, eight times coarser. Rounding to the nearest moves a value by at</text><text class="cap" x="40" y="554" text-anchor="start">most 0.05% in FP16 and 0.4% in BF16.</text><text class="cap" x="40" y="594" text-anchor="start">That is the whole trade: BF16 accepts a coarser blur on every number in order to reach</text><text class="cap" x="40" y="614" text-anchor="start">every power of two that FP32 reaches.</text></svg><figcaption>Both panels computed from the bit layouts, with FP16's and FP32's limits checked against numpy. On the top axis FP32 and BF16 differ only in the third digit of their largest number.</figcaption></figure>
