<figure><div class='ts'>Fig 73 &nbsp;&middot;&nbsp; 13:19</div><h3>What attainable means</h3><svg viewBox="0 0 680 416" role="img"><title>What attainable means</title><text class="hd" x="40" y="46">Attainable: the best this chip could possibly do on this work</text><g class="m"><rect x="70" y="70" width="540" height="42" rx="6"></rect><text class="sub" x="340.0" y="91.0" text-anchor="middle" dominant-baseline="central">attainable  =  the lower of the two limits</text></g><g class="h"><rect x="70" y="140" width="240" height="40" rx="4"></rect><text class="sub" x="190.0" y="160.0" text-anchor="middle" dominant-baseline="central">what memory can deliver</text></g><g class="m"><rect x="370" y="140" width="240" height="40" rx="4"></rect><text class="sub" x="490.0" y="160.0" text-anchor="middle" dominant-baseline="central">what arithmetic can consume</text></g><text class="sub2" x="70" y="212" text-anchor="start">whichever is smaller is what you get</text><text class="cap" x="40" y="262" text-anchor="start">It is a ceiling, not a prediction. A badly written kernel will fall well below it, but nothing</text><text class="cap" x="40" y="282" text-anchor="start">can exceed it.</text><text class="cap" x="40" y="318" text-anchor="start">That makes it the right thing to measure against. A kernel at 20% of attainable has a software</text><text class="cap" x="40" y="338" text-anchor="start">problem; a kernel at 95% has a hardware one, and needs a different chip or a different</text><text class="cap" x="40" y="358" text-anchor="start">algorithm.</text><text class="cap" x="40" y="394" text-anchor="start">Knowing which of those two situations you are in is most of the value of the diagram.</text></svg><figcaption>The diagram does not tell you how fast your code runs. It tells you how fast it could run, which is the more useful number.</figcaption></figure>
