<figure><div class='ts'>Fig 31 &nbsp;&middot;&nbsp; 4:07</div><h3>On-chip SRAM</h3><svg viewBox="0 0 680 218" role="img"><title>On-chip SRAM</title><g class="s"><rect x="40" y="50" width="600" height="30" rx="6"></rect><text class="lbl" x="340.0" y="65.0" text-anchor="middle" dominant-baseline="central">256 KB of SRAM per multiprocessor</text></g><g class="s"><rect x="40" y="96" width="534" height="46" rx="3"></rect><text class="sub" x="307.0" y="119.0" text-anchor="middle" dominant-baseline="central">up to 228 KB claimed as shared memory</text></g><g class="u"><rect x="582" y="96" width="58" height="46" rx="3"></rect><text class="sub" x="611.0" y="119.0" text-anchor="middle" dominant-baseline="central">L1</text></g><text class="cap" x="40" y="174" text-anchor="start">Shared memory is a scratchpad the program manages by hand, so cooperating threads can stage</text><text class="cap" x="40" y="194" text-anchor="start">the data they share. Whatever is not claimed serves as an ordinary L1 cache.</text></svg><figcaption>The split is a software decision rather than a fixed partition, which is what makes deliberate tiling possible.</figcaption></figure>
