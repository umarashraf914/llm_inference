<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 9:47</div><h3>How many warps it takes to hide a wait</h3><div class='wg'><div class='ctl'><label>warps on this scheduler <input type='range' min='1' max='16' step='1' value='16'><span class='val'>16</span></label><label>instructions between loads, c <input type='range' min='4' max='64' step='4' value='32'><span class='val'>32</span></label><label>wait for a load, L ticks <input type='range' min='100' max='1000' step='1' value='479'><span class='val'>479</span></label></div><div class='ctl'><button type='button'>Reset</button></div><svg viewBox='0 0 680 624' role='img'><title>How many warps it takes to hide a wait</title><text class="hd" x="40" y="34">One scheduler's warps over 1,200 ticks: issuing, waiting for memory, queued</text><text class="cap" x="40" y="61" text-anchor="start">scheduler</text><text class="cap" x="40" y="83" text-anchor="start">its warps,</text><text class="cap" x="40" y="101" text-anchor="start">one row each</text><g data-lanes=""><g class="m"><rect x="150.0" y="74" width="11.7" height="9" rx="1"/></g><g class="h"><rect x="161.7" y="74" width="175.6" height="9" rx="1"/></g><rect x="337.4" y="74" width="0.4" height="9" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="337.7" y="74" width="11.7" height="9" rx="1"/></g><g class="h"><rect x="349.5" y="74" width="175.6" height="9" rx="1"/></g><rect x="525.1" y="74" width="0.4" height="9" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="525.5" y="74" width="11.7" height="9" rx="1"/></g><g class="h"><rect x="537.2" y="74" width="52.8" height="9" rx="1"/></g><rect x="150.0" y="86" width="11.7" height="9" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="161.7" y="86" width="11.7" height="9" rx="1"/></g><g class="h"><rect x="173.5" y="86" width="175.6" height="9" rx="1"/></g><rect e-dasharray="3 3"/><g class="m"><rect x="490.3" y="230" width="11.7" height="9" rx="1"/></g><g class="h"><rect x="502.0" y="230" width="88.0" height="9" rx="1"/></g><rect x="150.0" y="242" width="164.3" height="9" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="314.3" y="242" width="11.7" height="9" rx="1"/></g><g class="h"><rect x="326.0" y="242" width="175.6" height="9" rx="1"/></g><rect x="501.6" y="242" width="0.4" height="9" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="502.0" y="242" width="11.7" height="9" rx="1"/></g><g class="h"><rect x="513.7" y="242" width="76.3" height="9" rx="1"/></g><rect x="150.0" y="254" width="176.0" height="9" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="326.0" y="254" width="11.7" height="9" rx="1"/></g><g class="h"><rect x="337.7" y="254" width="175.6" height="9" rx="1"/></g><rect x="513.4" y="254" width="0.4" height="9" rx="1" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="513.7" y="254" width="11.7" height="9" rx="1"/></g><g class="h"><rect x="525.5" y="254" width="64.5" height="9" rx="1"/></g><g class="m"><rect x="150.0" y="50" width="187.7" height="14" rx="1"/></g><g class="m"><rect x="337.7" y="50" width="187.7" height="14" rx="1"/></g><g class="m"><rect x="525.5" y="50" width="64.5" height="14" rx="1"/></g></g><line class="axis" x1="150" y1="272" x2="590" y2="272"/><line class="tick" x1="150.0" y1="272" x2="150.0" y2="277"/><text class="sub2" x="150.0" y="291" text-anchor="middle">0</text><line class="tick" x1="260.0" y1="272" x2="260.0" y2="277"/><text class="sub2" x="260.0" y="291" text-anchor="middle">300</text><line class="tick" x1="370.0" y1="272" x2="370.0" y2="277"/><text class="sub2" x="370.0" y="291" text-anchor="middle">600</text><line class="tick" x1="480.0" y1="272" x2="480.0" y2="277"/><text class="sub2" x="480.0" y="291" text-anchor="middle">900</text><line class="tick" x1="590.0" y1="272" x2="590.0" y2="277"/><text class="sub2" x="590.0" y="291" text-anchor="middle">1,200</text><text class="sub2" x="590" y="308" text-anchor="end">ticks</text><text class="sub2" x="40" y="336" data-busy="">scheduler busy 100.0% of the time</text><text class="sub2" x="40" y="356" data-need="">warps needed to cover the wait: ⌈(32 + 479) ÷ 32⌉ = 16</text><text class="sub2" x="40" y="376" data-occ="">this scheduler holds 16 of its 16 warps: occupancy 100.0%</text><text class="cap" x="40" y="420" text-anchor="start">Each warp does c instructions of work, then waits L ticks for a load. While one waits,</text><text class="cap" x="40" y="440" text-anchor="start">the scheduler issues from another that is ready. It stays busy only if the other warps'</text><text class="cap" x="40" y="460" text-anchor="start">work covers one warp's whole cycle, so a scheduler needs (c + L) ÷ c warps, rounded up.</text><text class="cap" x="40" y="500" text-anchor="start">With the measured 479-tick wait for HBM, 32 instructions between loads needs 16 warps,</text><text class="cap" x="40" y="520" text-anchor="start">every warp a scheduler can hold. At 16 instructions it would need 31, and at 8 it would</text><text class="cap" x="40" y="540" text-anchor="start">need 61, so even full occupancy leaves the scheduler idle three quarters of the time.</text><text class="cap" x="40" y="580" text-anchor="start">A simplified model: real schedulers interleave warps, and loads overlap. Its arithmetic</text><text class="cap" x="40" y="600" text-anchor="start">was checked against Python at many settings.</text></svg></div><figcaption>Occupancy cannot hide latency when there is too little work between loads: the scheduler's busy share is set by work against wait, and the warp count only caps it.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const DEF = [16, 32, 479], TW = 1200, X0 = 150, X1 = 590, R0 = 74, RH = 12;
  const sl = [...fig.querySelectorAll('input[type=range]')], val = [...fig.querySelectorAll('.val')];
  const q = s => fig.querySelector(s), NS = 'http://www.w3.org/2000/svg';
  const f1 = v => v.toFixed(1);
  const tx = t => X0 + t / TW * (X1 - X0);
  function segs(w, c, l) {
    const p = Math.max(w * c, c + l), out = [];
    for (let k = 0; k < w; k++) {
      if (k * c > 0) out.push(['queued', k, 0, k * c]);
      for (let n = 0; k * c + n * p < TW; n++) {
        const s = k * c + n * p;
        out.push(['issue', k, s, s + c]); out.push(['memory', k, s + c, s + c + l]);
        if (p > c + l) out.push(['queued', k, s + c + l, s + p]);
      }
    }
    for (let n = 0; n * p < TW; n++) {
      out.push(['issue', -1, n * p, n * p + w * c]);
      if (p > w * c) out.push(['idle', -1, n * p + w * c, (n + 1) * p]);
    }
    return out.map(([k, r, a, b]) => [k, r, Math.max(a, 0), Math.min(b, TW)]).filter(s => s[3] > s[2]);
  }
  function draw() {
    const [w, c, l] = sl.map(s => +s.value);
    val[0].textContent = w; val[1].textContent = c; val[2].textContent = l;
    const g = q('[data-lanes]'); g.replaceChildren();
    for (const [kind, row, a, b] of segs(w, c, l)) {
      const x = tx(a), wd = tx(b) - tx(a), y = row < 0 ? 50 : R0 + row * RH, h = row < 0 ? 14 : 9;
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', x.toFixed(1)); r.setAttribute('y', y);
      r.setAttribute('width', wd.toFixed(1)); r.setAttribute('height', h); r.setAttribute('rx', 1);
      if (kind === 'queued' || kind === 'idle') {
        r.setAttribute('fill', 'none'); r.setAttribute('stroke', 'var(--rule)');
        r.setAttribute('stroke-width', 1); r.setAttribute('stroke-dasharray', '3 3'); g.appendChild(r);
      } else {
        const gg = document.createElementNS(NS, 'g'); gg.setAttribute('class', kind === 'issue' ? 'm' : 'h');
        gg.appendChild(r); g.appendChild(gg);
      }
    }
    const busy = Math.min(1, w * c / (c + l)), need = Math.ceil((c + l) / c);
    q('[data-busy]').textContent = `scheduler busy ${f1(100 * busy)}% of the time`;
    q('[data-need]').textContent = `warps needed to cover the wait: ⌈(${c} + ${l}) ÷ ${c}⌉ = ${need}`;
    q('[data-occ]').textContent = `this scheduler holds ${w} of its 16 warps: occupancy ${f1(100 * w / 16)}%`;
  }
  sl.forEach(s => s.addEventListener('input', draw));
  q('button').addEventListener('click', () => { sl.forEach((s, i) => s.value = DEF[i]); draw(); });
  draw();
})();</script></figure>
