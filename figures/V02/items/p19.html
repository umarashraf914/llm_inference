<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 10:33</div><h3>Memory arrives in 32-byte sectors, four to a 128-byte line</h3><svg viewBox='0 0 680 606' role='img'><title>Memory arrives in 32-byte sectors, four to a 128-byte line</title><text class="hd" x="40" y="46">One 128-byte line: four 32-byte sectors, eight 4-byte numbers in each</text><g class="s"><rect x="68" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="85" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="102" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="119" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="136" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="153" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="170" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="187" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="204" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="221" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="238" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="255" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="272" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="289" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="306" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="323" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="340" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="357" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="374" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="391" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="408" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="425" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="442" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="459" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="476" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="493" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="510" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="527" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="544" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="561" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="578" y="64" width="15" height="26" rx="2"/></g><g class="s"><rect x="595" y="64" width="15" height="26" rx="2"/></g><line class="tick" x1="68" y1="98" x2="202" y2="98"/><text class="sub2" x="135" y="114" text-anchor="middle">sector 0: 32 bytes</text><line class="tick" x1="204" y1="98" x2="338" y2="98"/><text class="sub2" x="271" y="114" text-anchor="middle">sector 1: 32 bytes</text><line class="tick" x1="340" y1="98" x2="474" y2="98"/><text class="sub2" x="407" y="114" text-anchor="middle">sector 2: 32 bytes</text><line class="tick" x1="476" y1="98" x2="610" y2="98"/><text class="sub2" x="543" y="114" text-anchor="middle">sector 3: 32 bytes</text><text class="sub2" x="68" y="136" text-anchor="start">a warp reading 32 neighbouring numbers: one line, four sectors, every byte wanted</text><text class="hd" x="40" y="182">The same warp, each lane in a different sector</text><g class="h"><rect x="68.0" y="198.0" width="30.0" height="26.0" rx="2"/></g><g class="s"><rect x="68.0" y="198.0" width="3.8" height="26.0" rx="1"/></g><g class="h"><rect x="102.0" y="198.0" width="30.0" height="26.0" rx="2"/></g><g class="s"><rect x="102.0" y="198.0" width="3.8" height="26.0" rx="1"/></g><g class="h"><rect x="136.0" y="198.0" width="30.0" height="26.0" rx="2"/></g><g class="s"><rect x="136.0" y="198.0" width="3.8" height="26.0" rx="1"/></g><g class="h"><rect x="170.0" y="198.0" width="30.0" height="26.0" rx="2"/></g><g class="s"><rect x="170.0" y="198.0" width="3.8" height="26.0" rx="1"/></g><g class="h"><rect x="204.0" y="198.0" width="30.0" height="26.0" rx="2"/></g><g class="s"><rect x="204.0" y="198.0" width="3.8" height="26.0" rx="1"/></g><g class="h"><rect x="238.0" y="198.0" width="30.0" height="26.0" rx="2"/></g><g class="s"><rect x="238.0" y="198.0" width="3.8" height="26.0" rx="1"/></g><g class="h"><rect x="272.0" y="198.0" width="30.0" height="26.0" rx="2"/></g><g class="s"><rect x="272.0" y="198.0" width="3.8" height="26.0" rx="1"/></g><g class="h"><rect x="306.0" y="198.0" width="30.0" height="26.0" rx="2"/></g><g class="s"><rect x="306.0" y="198.0" width="3.8" height="26.0" rx="1"/></g><g class="h"><rect x="340.0" y="198.0" width="30.0" height="26.0" rx="2"/></g><g class="s"><rect x="340.0" y="198.0" width="3.8" height="26.0" rx="1"/></g><g class="h"><rect x="374.0" y="198.0" width="30.0" height="26.0" rx="2"/></g><g class="s"><rect x="374.0" y="198.0" width="3.8" height="26.0" rx="1"/></g><g class="h"><rect x="408.0" y="198.0" width="30.0" height="26.0" rx="2"/></g><g class="s"><rect x="408.0" y="198.0" width="3.8" height="26.0" rx="1"/></g><g class="h"><rect x="442.0" y="198.0" width="30.0" height="26.0" rx="2"/></g><g class="s"><rect x="442.0" y="198.0" width="3.8" height="26.0" rx="1"/></g><g class="h"><rect x="476.0" y="198.0" width="30.0" height="26.0" rx="2"/></g><g class="s"><rect x="476.0" y="198.0" width="3.8" height="26.0" rx="1"/></g><g class="h"><rect x="510.0" y="198.0" width="30.0" height="26.0" rx="2"/></g><g class="s"><rect x="510.0" y="198.0" width="3.8" height="26.0" rx="1"/></g><g class="h"><rect x="544.0" y="198.0" width="30.0" height="26.0" rx="2"/></g><g class="s"><rect x="544.0" y="198.0" width="3.8" height="26.0" rx="1"/></g><g class="h"><rect x="578.0" y="198.0" width="30.0" height="26.0" rx="2"/></g><g class="s"><rect x="578.0" y="198.0" width="3.8" height="26.0" rx="1"/></g><text class="sub2" x="68" y="244" text-anchor="start">16 of the 32 sectors drawn; teal is the 4 bytes a lane asked for, red the 28 that came anyway</text><text class="hd" x="40" y="290">Bytes moved for the same 128 bytes asked for, to scale</text><text class="cap" x="40" y="324" text-anchor="start">neighbours</text><g class="s"><rect x="170.0" y="306.0" width="55.0" height="26.0" rx="3"/></g><text class="sub2" x="235.0" y="324" text-anchor="start">128 bytes: 4 sectors, 100% used</text><text class="cap" x="40" y="364" text-anchor="start">scattered</text><g class="h"><rect x="170" y="346" width="440.0" height="26" rx="3"/><text class="sub" x="390.0" y="359.0" text-anchor="middle" dominant-baseline="central">1,024 bytes: 32 sectors, 12.5% used</text></g><text class="cap" x="40" y="422" text-anchor="start">The memory system never hands over a single number. On this chip, as on every NVIDIA GPU</text><text class="cap" x="40" y="442" text-anchor="start">of compute capability 6.0 or later, a warp's reads are gathered into 32-byte sectors,</text><text class="cap" x="40" y="462" text-anchor="start">and the caches keep them in 128-byte lines of four sectors. A sector comes whole even if</text><text class="cap" x="40" y="482" text-anchor="start">one number in it is wanted.</text><text class="cap" x="40" y="522" text-anchor="start">So when the 32 lanes ask for neighbouring 4-byte numbers, four sectors serve the whole</text><text class="cap" x="40" y="542" text-anchor="start">warp. When each asks for a number in a different sector, 32 sectors come up: 1,024 bytes</text><text class="cap" x="40" y="562" text-anchor="start">moved for 128 used, 8 times the traffic. Counted in lines it is 32 requests where one</text><text class="cap" x="40" y="582" text-anchor="start">would have done.</text></svg><figcaption>The block the hardware moves is the sector, so the worst a scattered warp can do is 8 times the bytes, not 32. Granularity from NVIDIA's CUDA C++ Best Practices Guide and Nsight Compute documentation.</figcaption></figure>
