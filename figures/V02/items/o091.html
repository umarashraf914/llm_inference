<figure><div class='ts'>Fig 91 &nbsp;&middot;&nbsp; 17:13</div><h3>The model does not fit</h3><svg viewBox="0 0 680 302" role="img"><title>The model does not fit</title><g class="h"><rect x="40" y="62" width="480" height="44" rx="4"></rect><text class="sub" x="280.0" y="84.0" text-anchor="middle" dominant-baseline="central">a frontier model's weights: hundreds of gigabytes</text></g><g class="s"><rect x="40" y="126" width="116" height="44" rx="4"></rect><text class="sub" x="98.0" y="148.0" text-anchor="middle" dominant-baseline="central">80 GB</text></g><g class="s"><rect x="164" y="126" width="204" height="44" rx="4"></rect><text class="sub" x="266.0" y="148.0" text-anchor="middle" dominant-baseline="central">140 GB</text></g><text class="sub2" x="378" y="153" text-anchor="start">what a single chip holds</text><text class="cap" x="40" y="210" text-anchor="start">This is a capacity wall, not a bandwidth wall. No amount of bandwidth helps if the weights</text><text class="cap" x="40" y="230" text-anchor="start">do not fit at all.</text><text class="cap" x="40" y="260" text-anchor="start">So the model is split across many GPUs, which then have to talk constantly. How fast they can</text><text class="cap" x="40" y="280" text-anchor="start">talk becomes the next constraint.</text></svg><figcaption>Capacity and bandwidth are independent failure modes with different remedies. Confusing them sends you optimising the wrong thing.</figcaption></figure>
