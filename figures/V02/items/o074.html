" y="100" text-anchor="start">operations a second (log)</text><line class="tick" x1="457.0067896069923" y1="118.1735535239439" x2="457.0067896069923" y2="268"/><text class="sub2" x="463.0" y="108.1735535239439" text-anchor="start">ridge: 295</text><text class="sub2 halo" x="217.9" y="193.8318028997801" text-anchor="start">memory bound</text><text class="sub2" x="517.9" y="140.1735535239439" text-anchor="start">compute bound</text><g class="u"><rect x="40" y="324" width="600" height="42" rx="6"/><text class="sub" x="340.0" y="345.0" text-anchor="middle" dominant-baseline="central">ridge  =  989.4 trillion  ÷  3.352 trillion bytes  =  295 operations per byte</text></g><text class="cap" x="40" y="402" text-anchor="start">A recap of V1's roofline ({{fig:v01-o123}}). Below the ridge the slanted roof binds: the</text><text class="cap" x="40" y="422" text-anchor="start">chip can do no more operations a second than bandwidth times intensity. Above it the</text><text class="cap" x="40" y="442" text-anchor="start">flat ceiling binds, the tensor cores' peak.</text><text class="cap" x="40" y="482" text-anchor="start">The ridge is where the two meet, the two hardware peaks divided ({{fig:v01-o126}}).</text><text class="cap" x="40" y="502" text-anchor="start">Below 295 operations per byte a kernel waits on HBM; above it, on the tensor cores.</text></svg><figcaption>Both axes logarithmic. The ridge is not a free-standing number: it is the tensor cores' peak over HBM's bandwidth, so every change to either chip spec moves it.</figcaption></figure>
