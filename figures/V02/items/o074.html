<figure><div class='ts'>Fig 74 &nbsp;&middot;&nbsp; 13:19</div><h3>The roofline, derived</h3><svg viewBox="0 0 680 420" role="img"><title>The roofline, derived</title><g class="m"><rect x="80" y="46" width="520" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">attainable performance  =  min( peak compute,  bandwidth x intensity )</text></g><line class="axis" x1="90" y1="264" x2="620" y2="264"></line><line class="axis" x1="90" y1="110" x2="90" y2="264"></line><polyline class="pl-h" points="90,264 330,150 620,150"></polyline><line class="tick" x1="330" y1="150" x2="330" y2="264"></line><text class="sub2" x="330" y="288" text-anchor="middle">the ridge</text><text class="sub2 halo" x="150" y="220" text-anchor="start">memory bound</text><text class="sub2" x="430" y="220" text-anchor="start">compute bound</text><text class="sub2" x="96" y="136" text-anchor="start">compute ceiling</text><text class="cap" x="40" y="328" text-anchor="start">Two limits, and whichever is lower wins. Below the ridge the bandwidth term binds and runtime</text><text class="cap" x="40" y="348" text-anchor="start">is bytes divided by bandwidth. Above it, the compute term binds.</text><text class="cap" x="40" y="378" text-anchor="start">A kernel is a point under this roof. Optimisation either moves it right, by raising intensity,</text><text class="cap" x="40" y="398" text-anchor="start">or up, by using the hardware better. These are different actions.</text></svg><figcaption>One line of algebra generates the whole diagram. Everything else is reading it correctly.</figcaption></figure>
