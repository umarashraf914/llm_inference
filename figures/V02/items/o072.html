<figure><div class='ts'>Fig 72 &nbsp;&middot;&nbsp; 12:56</div><h3>Three attacks on the wall</h3><svg viewBox="0 0 680 210" role="img"><title>Three attacks on the wall</title><g class="u"><rect x="40" y="55" width="185" height="70" rx="8"></rect><text class="lbl" x="132.5" y="81.0" text-anchor="middle" dominant-baseline="central">Lower precision</text><text class="sub" x="132.5" y="99.0" text-anchor="middle" dominant-baseline="central">fewer bytes per weight</text></g><g class="u"><rect x="248" y="55" width="185" height="70" rx="8"></rect><text class="lbl" x="340.5" y="81.0" text-anchor="middle" dominant-baseline="central">Faster HBM</text><text class="sub" x="340.5" y="99.0" text-anchor="middle" dominant-baseline="central">more bytes per second</text></g><g class="u"><rect x="456" y="55" width="184" height="70" rx="8"></rect><text class="lbl" x="548.0" y="81.0" text-anchor="middle" dominant-baseline="central">Wider links</text><text class="sub" x="548.0" y="99.0" text-anchor="middle" dominant-baseline="central">between chips</text></g><text class="cap" x="40" y="168" text-anchor="start">Every generation attacks the wall the same few ways. Which side of the wall a given operation</text><text class="cap" x="40" y="188" text-anchor="start">lands on comes down to one number.</text></svg><figcaption>The first is the subject of the fourth atlas, on quantization. The third is Part 14 below.</figcaption></figure>
