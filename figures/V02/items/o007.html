<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:10</div><h3>Bandwidth is wires times how fast each one runs</h3><svg viewBox='0 0 680 616' role='img'><title>Bandwidth is wires times how fast each one runs</title><text class="hd" x="40" y="46">A bus is the set of wires between memory and the chip</text><g class="h"><rect x="40" y="66" width="150" height="70" rx="8"/><text class="lbl" x="115.0" y="101.0" text-anchor="middle" dominant-baseline="central">memory</text></g><line class="tick" x1="190" y1="74" x2="488" y2="74"/><line class="tick" x1="190" y1="83" x2="488" y2="83"/><line class="tick" x1="190" y1="92" x2="488" y2="92"/><line class="tick" x1="190" y1="101" x2="488" y2="101"/><line class="tick" x1="190" y1="110" x2="488" y2="110"/><line class="tick" x1="190" y1="119" x2="488" y2="119"/><line class="tick" x1="190" y1="128" x2="488" y2="128"/><g class="m"><rect x="490" y="66" width="150" height="70" rx="8"/><text class="lbl" x="565.0" y="101.0" text-anchor="middle" dominant-baseline="central">the chip</text></g><text class="sub2" x="196" y="158" text-anchor="start">every wire carries one bit at a time, all of them at once</text><g class="u"><rect x="40" y="180" width="600" height="42" rx="6"/><text class="sub" x="340.0" y="201.0" text-anchor="middle" dominant-baseline="central">bandwidth  =  wires  ×  bits per second on each wire  ÷  8 bits per byte</text></g><text class="hd" x="40" y="270">Two real buses, drawn to scale</text><text class="cap" x="40" y="306" text-anchor="start">RTX 4090</text><g class="h"><rect x="150.0" y="292.0" width="35.2" height="22.0" rx="3"/></g><text class="sub2" x="195.25" y="307" text-anchor="start">384 wires at 21.0 Gb/s each</text><text class="cap" x="40" y="346" text-anchor="start">H100</text><g class="s"><rect x="150.0" y="332.0" width="470.0" height="22.0" rx="3"/></g><text class="sub2" x="150" y="372" text-anchor="start">5,120 wires at 5.24 Gb/s each</text><text class="cap" x="40" y="412" text-anchor="start">The gaming card's memory runs each wire four times as fast, 21.0 billion bits a second</text><text class="cap" x="40" y="432" text-anchor="start">against 5.24 billion. The H100 still moves 3.3 times as many bytes per second, because</text><text class="cap" x="40" y="452" text-anchor="start">it has 13.3 times as many wires.</text><text class="cap" x="40" y="492" text-anchor="start">Widening is the main way memory gets faster, and it explains where memory sits:</text><text class="cap" x="40" y="512" text-anchor="start">thousands of wires only work over millimetres, so a wide memory has to be packed beside</text><text class="cap" x="40" y="532" text-anchor="start">the chip ({{fig:v01-o074}}, {{fig:v01-o107}}).</text><text class="cap" x="40" y="572" text-anchor="start">Every weight the model uses travels along these wires before any arithmetic can touch</text><text class="cap" x="40" y="592" text-anchor="start">it.</text></svg><figcaption>Bars are wire counts, to scale. The slow-wire chip wins on bandwidth by going wide, which is the whole design of high-bandwidth memory. Rates: NVIDIA's H100 whitepaper; Luo et al. 2024 for the RTX 4090.</figcaption></figure>
