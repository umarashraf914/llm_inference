<figure><div class='ts'>Fig 07 &nbsp;&middot;&nbsp; 0:10</div><h3>What bandwidth physically is</h3><svg viewBox="0 0 680 414" role="img"><title>What bandwidth physically is</title><g class="m"><rect x="90" y="46" width="500" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">bandwidth  =  bus width  x  transfers per second</text></g><text class="cap" x="40" y="118" text-anchor="start">Bandwidth is not speed in the everyday sense. It is width multiplied by frequency: how many</text><text class="cap" x="40" y="138" text-anchor="start">wires run in parallel, times how often each carries a new bit.</text><text class="cap" x="40" y="178" text-anchor="start">That is why memory gets faster mostly by getting wider. An HBM stack has a 1,024-bit interface</text><text class="cap" x="40" y="198" text-anchor="start">at a moderate clock, where older GDDR used a 32-bit interface at a very high one.</text><text class="hd" x="40" y="246">GDDR: narrow and fast</text><g class="h"><rect x="300" y="232" width="40" height="24" rx="3"></rect></g><text class="sub2" x="348" y="251" text-anchor="start">32 bits</text><text class="hd" x="40" y="296">HBM: wide and steady</text><g class="s"><rect x="300" y="282" width="320" height="24" rx="3"></rect></g><text class="sub2" x="300" y="326" text-anchor="start">1,024 bits per stack</text><text class="cap" x="40" y="372" text-anchor="start">Wide interfaces need enormous numbers of connections, which is why HBM is stacked vertically</text><text class="cap" x="40" y="392" text-anchor="start">and sits on the same package as the die rather than out on the board.</text></svg><figcaption>Understanding bandwidth as width times frequency explains why memory sits where it does and why it cannot simply be made faster.</figcaption></figure>
