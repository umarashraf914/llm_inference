<figure><div class='ts'>Fig 58 &nbsp;&middot;&nbsp; 9:51</div><h3>Why switching costs nothing</h3><svg viewBox="0 0 680 232" role="img"><title>Why switching costs nothing</title><g class="h"><rect x="40" y="50" width="280" height="92" rx="8"></rect><text class="lbl" x="180.0" y="79.0" text-anchor="middle" dominant-baseline="central">CPU thread switch</text><text class="sub" x="180.0" y="97.0" text-anchor="middle" dominant-baseline="central">save and restore state,</text><text class="sub" x="180.0" y="114.0" text-anchor="middle" dominant-baseline="central">real cycles burned</text></g><line class="conn" x1="324" y1="96" x2="356" y2="96" marker-end="url(#arw)"></line><g class="s"><rect x="360" y="50" width="280" height="92" rx="8"></rect><text class="lbl" x="500.0" y="79.0" text-anchor="middle" dominant-baseline="central">GPU warp switch</text><text class="sub" x="500.0" y="97.0" text-anchor="middle" dominant-baseline="central">registers never move,</text><text class="sub" x="500.0" y="114.0" text-anchor="middle" dominant-baseline="central">the scheduler points elsewhere</text></g><text class="cap" x="40" y="190" text-anchor="start">Every resident warp's registers stay allocated in the register file the whole time, so there</text><text class="cap" x="40" y="210" text-anchor="start">is nothing to save or restore.</text></svg><figcaption>Look back at the register file. Its partitioning across all 2,048 threads is precisely what buys free switching, and it is why the file has to be so large.</figcaption></figure>
