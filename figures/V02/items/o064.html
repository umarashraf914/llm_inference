<figure><div class='ts'>Fig 64 &nbsp;&middot;&nbsp; 10:38</div><h3>Why walking a column costs more than walking a row</h3><svg viewBox="0 0 680 498" role="img"><title>Why walking a column costs more than walking a row</title><text class="hd" x="40" y="46">How a grid of numbers is actually stored</text><g class="m"><rect x="60" y="70" width="54" height="30" rx="3"></rect><text class="sub" x="87.0" y="85.0" text-anchor="middle" dominant-baseline="central">0,0</text></g><g class="m"><rect x="122" y="70" width="54" height="30" rx="3"></rect><text class="sub" x="149.0" y="85.0" text-anchor="middle" dominant-baseline="central">0,1</text></g><g class="m"><rect x="184" y="70" width="54" height="30" rx="3"></rect><text class="sub" x="211.0" y="85.0" text-anchor="middle" dominant-baseline="central">0,2</text></g><g class="m"><rect x="246" y="70" width="54" height="30" rx="3"></rect><text class="sub" x="273.0" y="85.0" text-anchor="middle" dominant-baseline="central">0,3</text></g><g class="m"><rect x="308" y="70" width="54" height="30" rx="3"></rect><text class="sub" x="335.0" y="85.0" text-anchor="middle" dominant-baseline="central">0,4</text></g><g class="m"><rect x="370" y="70" width="54" height="30" rx="3"></rect><text class="sub" x="397.0" y="85.0" text-anchor="middle" dominant-baseline="central">0,5</text></g><g class="u"><rect x="60" y="108" width="54" height="30" rx="3"></rect><text class="sub" x="87.0" y="123.0" text-anchor="middle" dominant-baseline="central">1,0</text></g><g class="u"><rect x="122" y="108" width="54" height="30" rx="3"></rect><text class="sub" x="149.0" y="123.0" text-anchor="middle" dominant-baseline="central">1,1</text></g><g class="u"><rect x="184" y="108" width="54" height="30" rx="3"></rect><text class="sub" x="211.0" y="123.0" text-anchor="middle" dominant-baseline="central">1,2</text></g><g class="u"><rect x="246" y="108" width="54" height="30" rx="3"></rect><text class="sub" x="273.0" y="123.0" text-anchor="middle" dominant-baseline="central">1,3</text></g><g class="u"><rect x="308" y="108" width="54" height="30" rx="3"></rect><text class="sub" x="335.0" y="123.0" text-anchor="middle" dominant-baseline="central">1,4</text></g><g class="u"><rect x="370" y="108" width="54" height="30" rx="3"></rect><text class="sub" x="397.0" y="123.0" text-anchor="middle" dominant-baseline="central">1,5</text></g><g class="u"><rect x="60" y="146" width="54" height="30" rx="3"></rect><text class="sub" x="87.0" y="161.0" text-anchor="middle" dominant-baseline="central">2,0</text></g><g class="u"><rect x="122" y="146" width="54" height="30" rx="3"></rect><text class="sub" x="149.0" y="161.0" text-anchor="middle" dominant-baseline="central">2,1</text></g><g class="u"><rect x="184" y="146" width="54" height="30" rx="3"></rect><text class="sub" x="211.0" y="161.0" text-anchor="middle" dominant-baseline="central">2,2</text></g><g class="u"><rect x="246" y="146" width="54" height="30" rx="3"></rect><text class="sub" x="273.0" y="161.0" text-anchor="middle" dominant-baseline="central">2,3</text></g><g class="u"><rect x="308" y="146" width="54" height="30" rx="3"></rect><text class="sub" x="335.0" y="161.0" text-anchor="middle" dominant-baseline="central">2,4</text></g><g class="u"><rect x="370" y="146" width="54" height="30" rx="3"></rect><text class="sub" x="397.0" y="161.0" text-anchor="middle" dominant-baseline="central">2,5</text></g><text class="sub2" x="40" y="206" text-anchor="start">the grid as you think of it</text><line class="conn" x1="340" y1="224" x2="340" y2="244" marker-end="url(#arw)"></line><text class="hd" x="40" y="276">In memory it is one long line, row after row</text><g class="m"><rect x="46" y="296" width="27" height="26" rx="2"></rect></g><g class="m"><rect x="79" y="296" width="27" height="26" rx="2"></rect></g><g class="m"><rect x="112" y="296" width="27" height="26" rx="2"></rect></g><g class="m"><rect x="145" y="296" width="27" height="26" rx="2"></rect></g><g class="m"><rect x="178" y="296" width="27" height="26" rx="2"></rect></g><g class="m"><rect x="211" y="296" width="27" height="26" rx="2"></rect></g><g class="u"><rect x="244" y="296" width="27" height="26" rx="2"></rect></g><g class="u"><rect x="277" y="296" width="27" height="26" rx="2"></rect></g><g class="u"><rect x="310" y="296" width="27" height="26" rx="2"></rect></g><g class="u"><rect x="343" y="296" width="27" height="26" rx="2"></rect></g><g class="u"><rect x="376" y="296" width="27" height="26" rx="2"></rect></g><g class="u"><rect x="409" y="296" width="27" height="26" rx="2"></rect></g><g class="u"><rect x="442" y="296" width="27" height="26" rx="2"></rect></g><g class="u"><rect x="475" y="296" width="27" height="26" rx="2"></rect></g><g class="u"><rect x="508" y="296" width="27" height="26" rx="2"></rect></g><g class="u"><rect x="541" y="296" width="27" height="26" rx="2"></rect></g><g class="u"><rect x="574" y="296" width="27" height="26" rx="2"></rect></g><g class="u"><rect x="607" y="296" width="27" height="26" rx="2"></rect></g><text class="sub2" x="46" y="350" text-anchor="start">row 0</text><text class="sub2" x="244" y="350" text-anchor="start">row 1</text><text class="sub2" x="442" y="350" text-anchor="start">row 2</text><text class="cap" x="40" y="400" text-anchor="start">Neighbours along a row are neighbours in memory. Neighbours down a column are six positions</text><text class="cap" x="40" y="420" text-anchor="start">apart, and in a real matrix they are thousands apart.</text><text class="cap" x="40" y="456" text-anchor="start">So walking a row is cheap and walking a column is expensive, purely because of how the numbers</text><text class="cap" x="40" y="476" text-anchor="start">were laid out. Nothing about the mathematics prefers either direction.</text></svg><figcaption>Layout is not a detail. The same loop written two ways can differ by an order of magnitude in traffic without changing a single arithmetic operation.</figcaption></figure>
