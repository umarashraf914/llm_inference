<figure><div class='ts'>Fig 82 &nbsp;&middot;&nbsp; 15:10</div><h3>Peak against sustained</h3><svg viewBox='0 0 680 436' role="img"><title>Peak against sustained</title><text class="hd" x="40" y="46">Peak against what code actually reaches</text><text class="cap" x="40" y="92" text-anchor="start">Peak, from the specification</text><g class="u"><rect x="320" y="76" width="300" height="30" rx="3"></rect><text class="sub" x="470.0" y="91.0" text-anchor="middle" dominant-baseline="central">989 TFLOP/s</text></g><text class="cap" x="40" y="152" text-anchor="start">A well-tuned kernel</text><g class="s"><rect x="320" y="136" width="210" height="30" rx="3"></rect><text class="sub" x="425.0" y="151.0" text-anchor="middle" dominant-baseline="central">50 to 80%</text></g><rect x="320" y="136" width="300" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="cap" x="40" y="212" text-anchor="start">Ordinary code</text><g class="h"><rect x="320" y="196" width="60" height="30" rx="3"></rect></g><rect x="320" y="196" width="300" height="30" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="cap" x="40" y="272" text-anchor="start">Peak assumes every unit fed every cycle with no stalls, no divergence and no waiting on</text><text class="cap" x="40" y="292" text-anchor="start">memory. Nothing achieves it and nothing is meant to.</text><text class="cap" x="40" y="332" text-anchor="start">The gap between the first bar and the second is the subject of the next atlas, on</text><text class="cap" x="40" y="352" text-anchor="start">kernels.</text><text class="cap" x="40" y="392" text-anchor="start">So a chip is best compared with another chip on peak, and a program is best compared</text><text class="cap" x="40" y="412" text-anchor="start">with itself on the fraction of peak it reaches.</text></svg><figcaption>The third bar is illustrative. The first two are the ones quoted in practice, and confusing them is how most misleading performance claims are made.</figcaption></figure>
