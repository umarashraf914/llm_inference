<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 16:49</div><h3>Add 1 over and over in BF16 and the total stops at 256</h3><svg viewBox='0 0 680 548' role='img'><title>Add 1 over and over in BF16 and the total stops at 256</title><text class="hd" x="40" y="46">The running total, adding 1 each time, in three formats</text><line class="axis" x1="100" y1="266" x2="600" y2="266"/><line class="axis" x1="100" y1="92" x2="100" y2="266"/><line class="tick" x1="100.0" y1="266" x2="100.0" y2="271"/><text class="sub2" x="100.0" y="285" text-anchor="middle">0</text><line class="tick" x1="266.7" y1="266" x2="266.7" y2="271"/><text class="sub2" x="266.7" y="285" text-anchor="middle">1,000</text><line class="tick" x1="95" y1="208.0" x2="100" y2="208.0"/><text class="sub2" x="91" y="212.0" text-anchor="end">1,000</text><line class="tick" x1="433.3" y1="266" x2="433.3" y2="271"/><text class="sub2" x="433.3" y="285" text-anchor="middle">2,000</text><line class="tick" x1="95" y1="150.0" x2="100" y2="150.0"/><text class="sub2" x="91" y="154.0" text-anchor="end">2,000</text><line class="tick" x1="600.0" y1="266" x2="600.0" y2="271"/><text class="sub2" x="600.0" y="285" text-anchor="middle">3,000</text><line class="tick" x1="95" y1="92.0" x2="100" y2="92.0"/><text class="sub2" x="91" y="96.0" text-anchor="end">3,000</text><text class="sub2" x="600" y="304" text-anchor="end">additions</text><text class="sub2" x="40" y="76" text-anchor="start">running total</text><polyline class="conn" points="100.0,266.0 600.0,92.0"/><polyline class="pl-m" points="100.0,266.0 441.3,147.2 600.0,147.2"/><polyline class="pl-h" points="100.0,266.0 142.7,251.2 600.0,251.2"/><text class="sub2" x="600" y="84" text-anchor="end">FP32: 3,000, exact</text><text class="sub2" x="600" y="164.216" text-anchor="end">FP16: stuck at 2,048</text><text class="sub2" x="600" y="243.152" text-anchor="end">BF16: stuck at 256</text><text class="cap" x="40" y="344" text-anchor="start">Adding 1 stays exact only while the total's neighbours are at most 1 apart. BF16 has 8</text><text class="cap" x="40" y="364" text-anchor="start">significant bits, so from 256 its numbers run 256, 258, 260. 257 lies exactly halfway,</text><text class="cap" x="40" y="384" text-anchor="start">the tie goes to 256, and every addition after that is rounded away.</text><text class="cap" x="40" y="424" text-anchor="start">FP16, with 11 significant bits, lasts until 2,048; FP32, with 24, counts exactly to</text><text class="cap" x="40" y="444" text-anchor="start">16,777,216. A dot product of thousands of terms is just such a running total, which is</text><text class="cap" x="40" y="464" text-anchor="start">why its sum is kept in FP32 even when every input is BF16.</text><text class="cap" x="40" y="504" text-anchor="start">Real terms are not all 1, but the effect is the same: once the total is large, any term</text><text class="cap" x="40" y="524" text-anchor="start">smaller than half the gap vanishes, and larger ones are rounded.</text></svg><figcaption>Computed by emulating round-to-nearest, ties to even, in Python, and checked against numpy for FP16. The lines are the emulated totals, drawn through every point where their slope changes.</figcaption></figure>
