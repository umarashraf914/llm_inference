<figure><div class='ts'>Fig 22 &nbsp;&middot;&nbsp; 1:39</div><h3>The CPU spends its silicon on anticipation</h3><svg viewBox="0 0 680 234" role="img"><title>The CPU spends its silicon on anticipation</title><g class="u"><rect x="140" y="50" width="400" height="140" rx="14"></rect><text class="lbl" x="162" y="76">CPU core</text></g><g class="h"><rect x="160" y="92" width="285" height="80" rx="3"></rect><text class="sub" x="302.5" y="132.0" text-anchor="middle" dominant-baseline="central">anticipation: predict, prefetch, reorder</text></g><g class="m"><rect x="460" y="92" width="60" height="80" rx="3"></rect><text class="sub" x="490.0" y="132.0" text-anchor="middle" dominant-baseline="central">math</text></g><text class="sub2" x="140" y="216" text-anchor="start">Runs perhaps a few tens of these fast threads at once.</text></svg><figcaption>Most of the die is spent guessing what the thread will do next and lining the data up before it asks, so the core almost never stops and waits.</figcaption></figure>
