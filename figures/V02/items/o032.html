<figure><div class='ts'>Fig 32 &nbsp;&middot;&nbsp; 4:07</div><h3>Cache against shared memory</h3><svg viewBox="0 0 680 374" role="img"><title>Cache against shared memory</title><text class="hd" x="40" y="46">Two kinds of fast memory, and who decides what is in them</text><g class="u"><rect x="40" y="74" width="285" height="86" rx="8"></rect><text class="lbl" x="182.5" y="100.0" text-anchor="middle" dominant-baseline="central">A cache</text><text class="sub" x="182.5" y="118.0" text-anchor="middle" dominant-baseline="central">the hardware decides,</text><text class="sub" x="182.5" y="135.0" text-anchor="middle" dominant-baseline="central">using what was recently used</text></g><g class="s"><rect x="355" y="74" width="285" height="86" rx="8"></rect><text class="lbl" x="497.5" y="100.0" text-anchor="middle" dominant-baseline="central">Shared memory</text><text class="sub" x="497.5" y="118.0" text-anchor="middle" dominant-baseline="central">the program decides,</text><text class="sub" x="497.5" y="135.0" text-anchor="middle" dominant-baseline="central">by writing instructions to fill it</text></g><text class="cap" x="40" y="204" text-anchor="start">Both are the same silicon and roughly the same speed. The difference is who is in charge.</text><text class="cap" x="40" y="240" text-anchor="start">A cache guesses, and guesses well when a program reuses data. Shared memory does not guess:</text><text class="cap" x="40" y="260" text-anchor="start">the program states exactly which block it wants staged and when.</text><text class="cap" x="40" y="296" text-anchor="start">For a workload that streams through data once, guessing is worthless and stating is</text><text class="cap" x="40" y="316" text-anchor="start">everything. That is why this chip offers both and why serious kernels use the second.</text><text class="cap" x="40" y="352" text-anchor="start">The split between them is itself a setting the program chooses.</text></svg><figcaption>Same silicon, opposite philosophies. The choice between them is the difference between hoping for locality and engineering it.</figcaption></figure>
