<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 8:51</div><h3>The asymmetry that defines the craft</h3><svg viewBox='0 0 680 462' role='img'><title>The asymmetry that defines the craft</title><text class="hd" x="40" y="46">How much worse the bottom rung is than the top, on one log axis</text><text class="cap" x="40" y="82" text-anchor="start">bandwidth, round figure</text><g class="u"><rect x="230" y="64" width="246.66666666666663" height="26" rx="3"/><text class="sub" x="353.3333333333333" y="77.0" text-anchor="middle" dominant-baseline="central">100×</text></g><text class="cap" x="40" y="122" text-anchor="start">bandwidth, worked out</text><g class="h"><rect x="230" y="104" width="256.3269136885717" height="26" rx="3"/><text class="sub" x="358.16345684428586" y="117.0" text-anchor="middle" dominant-baseline="central">120×</text></g><text class="cap" x="40" y="174" text-anchor="start">latency, round figure</text><g class="u"><rect x="230" y="156" width="370.0" height="26" rx="3"/><text class="sub" x="415.0" y="169.0" text-anchor="middle" dominant-baseline="central">1,000×</text></g><text class="cap" x="40" y="214" text-anchor="start">latency, measured idle</text><g class="h"><rect x="230" y="196" width="330.5523441472394" height="26" rx="3"/><text class="sub" x="395.2761720736197" y="209.0" text-anchor="middle" dominant-baseline="central">479×</text></g><line class="axis" x1="230" y1="240" x2="600" y2="240"/><line class="tick" x1="230.0" y1="240" x2="230.0" y2="245"/><text class="sub2" x="230.0" y="259" text-anchor="middle">1×</text><line class="tick" x1="353.3" y1="240" x2="353.3" y2="245"/><text class="sub2" x="353.3" y="259" text-anchor="middle">10×</text><line class="tick" x1="476.7" y1="240" x2="476.7" y2="245"/><text class="sub2" x="476.7" y="259" text-anchor="middle">100×</text><line class="tick" x1="600.0" y1="240" x2="600.0" y2="245"/><text class="sub2" x="600.0" y="259" text-anchor="middle">1,000×</text><text class="cap" x="40" y="298" text-anchor="start">Top to bottom, bandwidth is usually said to fall a hundredfold and latency to grow a</text><text class="cap" x="40" y="318" text-anchor="start">thousandfold. Worked out from the previous figure, bandwidth falls about 120× and</text><text class="cap" x="40" y="338" text-anchor="start">latency grows about 479× on an idle chip, and more when the memory is busy and requests</text><text class="cap" x="40" y="358" text-anchor="start">queue.</text><text class="cap" x="40" y="398" text-anchor="start">Either way, reaching down to HBM for a byte costs vastly more than doing arithmetic on a</text><text class="cap" x="40" y="418" text-anchor="start">byte already at the top. GPU programming is largely the craft of staging data upward and</text><text class="cap" x="40" y="438" text-anchor="start">keeping the maths units fed from the fast end.</text></svg><figcaption>Log axis: the gaps span two and three decades, past what straight bars can show honestly. They call for different remedies: bandwidth by moving fewer bytes, latency by having more work in flight.</figcaption></figure>
