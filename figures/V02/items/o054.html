<figure><div class='ts'>Fig 54 &nbsp;&middot;&nbsp; 8:49</div><h3>The asymmetry that defines the craft</h3><svg viewBox="0 0 680 368" role="img"><title>The asymmetry that defines the craft</title><text class="cap" x="40" y="76" text-anchor="start">Bandwidth</text><text class="sub2" x="40" y="96" text-anchor="start">top to bottom</text><g class="s"><rect x="200" y="62" width="400" height="30" rx="4"></rect><text class="sub" x="400.0" y="77.0" text-anchor="middle" dominant-baseline="central">registers</text></g><g class="h"><rect x="200" y="100" width="4" height="30" rx="1"></rect></g><text class="sub2" x="214" y="119" text-anchor="start">HBM, roughly 100x less</text><text class="cap" x="40" y="176" text-anchor="start">Latency</text><text class="sub2" x="40" y="196" text-anchor="start">top to bottom</text><g class="s"><rect x="200" y="162" width="4" height="30" rx="1"></rect></g><text class="sub2" x="214" y="181" text-anchor="start">registers</text><g class="h"><rect x="200" y="200" width="400" height="30" rx="4"></rect><text class="sub" x="400.0" y="215.0" text-anchor="middle" dominant-baseline="central">HBM, roughly 1000x more</text></g><text class="cap" x="40" y="276" text-anchor="start">Reaching down to HBM for a byte costs vastly more than doing arithmetic on a byte already at</text><text class="cap" x="40" y="296" text-anchor="start">the top of the ladder.</text><text class="cap" x="40" y="326" text-anchor="start">GPU programming is largely the craft of staging data upward and keeping the maths units fed</text><text class="cap" x="40" y="346" text-anchor="start">from the fast end.</text></svg><figcaption>Bars drawn to the stated ratios. Both directions matter, and they call for different remedies: bandwidth by moving fewer bytes, latency by having more work in flight.</figcaption></figure>
