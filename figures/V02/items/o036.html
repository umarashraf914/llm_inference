<figure><div class='ts'>Fig 36 &nbsp;&middot;&nbsp; 3:00</div><h3>Assembled: one multiprocessor</h3><svg viewBox="0 0 680 401" role="img"><title>Assembled: one multiprocessor</title><g class="u"><rect x="40" y="36" width="600" height="282" rx="14"></rect><text class="lbl" x="62" y="62">One multiprocessor, assembled</text></g><g class="m"><rect x="70" y="96" width="250" height="58" rx="8"></rect><text class="lbl" x="195.0" y="116.0" text-anchor="middle" dominant-baseline="central">128 CUDA cores</text><text class="sub" x="195.0" y="134.0" text-anchor="middle" dominant-baseline="central">scalar units</text></g><g class="m"><rect x="360" y="96" width="250" height="58" rx="8"></rect><text class="lbl" x="485.0" y="116.0" text-anchor="middle" dominant-baseline="central">4 tensor cores</text><text class="sub" x="485.0" y="134.0" text-anchor="middle" dominant-baseline="central">matrix tiles</text></g><g class="s"><rect x="70" y="168" width="250" height="58" rx="8"></rect><text class="lbl" x="195.0" y="188.0" text-anchor="middle" dominant-baseline="central">256 KB registers</text><text class="sub" x="195.0" y="206.0" text-anchor="middle" dominant-baseline="central">single cycle</text></g><g class="s"><rect x="360" y="168" width="250" height="58" rx="8"></rect><text class="lbl" x="485.0" y="188.0" text-anchor="middle" dominant-baseline="central">256 KB SRAM</text><text class="sub" x="485.0" y="206.0" text-anchor="middle" dominant-baseline="central">shared memory + L1</text></g><g class="u"><rect x="70" y="240" width="250" height="58" rx="8"></rect><text class="lbl" x="195.0" y="260.0" text-anchor="middle" dominant-baseline="central">4 schedulers</text><text class="sub" x="195.0" y="278.0" text-anchor="middle" dominant-baseline="central">one warp per cycle</text></g><g class="u"><rect x="360" y="240" width="250" height="58" rx="8"></rect><text class="lbl" x="485.0" y="260.0" text-anchor="middle" dominant-baseline="central">TMA</text><text class="sub" x="485.0" y="278.0" text-anchor="middle" dominant-baseline="central">background copies</text></g><text class="cap" x="40" y="359" text-anchor="start">Six components side by side. A warp is not made of CUDA cores, and a CUDA core does not</text><text class="cap" x="40" y="379" text-anchor="start">contain registers. They are neighbours on one floor plan.</text></svg><figcaption>This is a floor plan, not a hierarchy. The next part builds a hierarchy on top of it, and keeping the two apart prevents most of the confusion in this material.</figcaption></figure>
