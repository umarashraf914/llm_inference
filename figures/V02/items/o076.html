<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:46</div><h3>Where prefill and decode land</h3><svg viewBox='0 0 680 486' role='img'><title>Where prefill and decode land</title><g class="m"><rect x="60" y="46" width="560" height="42" rx="6"/><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">intensity  =  operations  ÷  bytes moved</text></g><text class="cap" x="40" y="126" text-anchor="start">decode</text><text class="sub2" x="40" y="144" text-anchor="start">1 token</text><g class="h"><rect x="210.0" y="112.0" width="30.1" height="26.0" rx="3"/></g><text class="sub2 halo" x="248.08179895665793" y="130" text-anchor="start">1 per byte</text><text class="cap" x="40" y="176" text-anchor="start">prefill, all bytes</text><text class="sub2" x="40" y="194" text-anchor="start">2,048 tokens</text><g class="s"><rect x="210.0" y="162.0" width="331.1" height="26.0" rx="3"/></g><text class="sub2 halo" x="549.1329952303793" y="180" text-anchor="start">1,024 per byte</text><text class="cap" x="40" y="226" text-anchor="start">prefill, weights only</text><text class="sub2" x="40" y="244" text-anchor="start">as V1 counts it</text><g class="s"><rect x="210.0" y="212.0" width="361.2" height="26.0" rx="3"/></g><text class="sub2 halo" x="579.2359947967775" y="230" text-anchor="start">2,048 per byte</text><line class="axis" x1="210" y1="266" x2="610" y2="266"/><line class="tick" x1="240.1" y1="266" x2="240.1" y2="271"/><text class="sub2" x="240.1" y="285" text-anchor="middle">1</text><line class="tick" x1="340.1" y1="266" x2="340.1" y2="271"/><text class="sub2" x="340.1" y="285" text-anchor="middle">10</text><line class="tick" x1="440.1" y1="266" x2="440.1" y2="271"/><text class="sub2" x="440.1" y="285" text-anchor="middle">100</text><line class="tick" x1="540.1" y1="266" x2="540.1" y2="271"/><text class="sub2" x="540.1" y="285" text-anchor="middle">1,000</text><line class="mark xok" x1="487.1097891733905" y1="104" x2="487.1097891733905" y2="266"/><text class="sub2" x="487.1" y="98" text-anchor="middle">the ridge, 295</text><text class="cap" x="40" y="322" text-anchor="start">The same weights, the same chip, 16-bit numbers. A token's vector times a 4,096 × 4,096</text><text class="cap" x="40" y="342" text-anchor="start">weight matrix uses each weight once: one operation per byte. A 2,048-token prompt times</text><text class="cap" x="40" y="362" text-anchor="start">the same matrix reuses each weight 2,048 times.</text><text class="cap" x="40" y="402" text-anchor="start">Counting every byte read and written, prefill does 1,024 operations per byte; counting</text><text class="cap" x="40" y="422" text-anchor="start">only the weights, 2,048. V1's “about 2,000” counts a whole 70B model, where the weights</text><text class="cap" x="40" y="442" text-anchor="start">dwarf everything else ({{fig:v01-o128}}). Either way prefill sits far right of the ridge and</text><text class="cap" x="40" y="462" text-anchor="start">decode far left.</text></svg><figcaption>Log axis; intensity computed from the shapes. This single comparison explains most of what is strange about serving large language models.</figcaption></figure>
