<figure><div class='ts'>Fig 76 &nbsp;&middot;&nbsp; 13:40</div><h3>Where prefill and decode land</h3><svg viewBox="0 0 680 408" role="img"><title>Where prefill and decode land</title><g class="m"><rect x="60" y="46" width="560" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">intensity  =  operations / bytes moved</text></g><text class="cap" x="40" y="136" text-anchor="start">Prefill</text><text class="sub2" x="40" y="156" text-anchor="start">2048 x 4096 by 4096 x 4096</text><g class="s"><rect x="320" y="118" width="240" height="36" rx="3"></rect></g><text class="sub2" x="570" y="140" text-anchor="start">1024 ops/byte</text><text class="cap" x="40" y="212" text-anchor="start">Decode</text><text class="sub2" x="40" y="232" text-anchor="start">1 x 4096 by 4096 x 4096</text><g class="h"><rect x="320" y="194" width="6.28" height="36" rx="3"></rect></g><text class="sub2" x="336.28" y="216" text-anchor="start">1 ops/byte</text><line class="mark xok" x1="402.6" y1="108" x2="402.6" y2="272"></line><text class="sub2" x="402.6" y="100" text-anchor="middle">the ridge, 295</text><text class="cap" x="40" y="316" text-anchor="start">The same weights, the same chip. A matrix-matrix multiply reuses every loaded weight across</text><text class="cap" x="40" y="336" text-anchor="start">thousands of output elements. A matrix-vector multiply reuses each one once.</text><text class="cap" x="40" y="366" text-anchor="start">Prefill sits far right of the ridge and decode sits far left, which is why they behave like</text><text class="cap" x="40" y="386" text-anchor="start">entirely different workloads despite sharing a model.</text></svg><figcaption>Intensity computed from the shapes directly. This single comparison explains most of what is strange about serving large language models.</figcaption></figure>
