<figure><div class='ts'>Fig 92 &nbsp;&middot;&nbsp; 17:34</div><h3>What a link is</h3><svg viewBox="0 0 680 390" role="img"><title>What a link is</title><text class="hd" x="40" y="46">A link is a bundle of wires between two chips</text><g class="m"><rect x="40" y="84" width="170" height="70" rx="6"></rect><text class="sub" x="125.0" y="119.0" text-anchor="middle" dominant-baseline="central">GPU A</text></g><line class="tick" x1="212" y1="94" x2="466" y2="94"></line><line class="tick" x1="212" y1="104" x2="466" y2="104"></line><line class="tick" x1="212" y1="114" x2="466" y2="114"></line><line class="tick" x1="212" y1="124" x2="466" y2="124"></line><line class="tick" x1="212" y1="134" x2="466" y2="134"></line><line class="tick" x1="212" y1="144" x2="466" y2="144"></line><g class="m"><rect x="468" y="84" width="172" height="70" rx="6"></rect><text class="sub" x="554.0" y="119.0" text-anchor="middle" dominant-baseline="central">GPU B</text></g><text class="sub2" x="212" y="186" text-anchor="start">the same width-times-frequency arithmetic as any other bus</text><text class="cap" x="40" y="236" text-anchor="start">The difference from the memory bus is only distance and count. Fewer wires, longer, therefore</text><text class="cap" x="40" y="256" text-anchor="start">slower, and each bit costs more energy to send.</text><text class="cap" x="40" y="292" text-anchor="start">So a chip has three bandwidths, not one: to its own memory, to a neighbouring chip, and out to</text><text class="cap" x="40" y="312" text-anchor="start">the network. They differ by roughly a factor of ten at each step.</text><text class="cap" x="40" y="348" text-anchor="start">Keeping those three apart is essential once a model stops fitting on one chip, which is where</text><text class="cap" x="40" y="368" text-anchor="start">this part is heading.</text></svg><figcaption>Not a new kind of object. It is the same wires-times-frequency argument as the memory bus, applied over a longer distance.</figcaption></figure>
