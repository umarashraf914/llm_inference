<figure><div class='ts'>Fig 60 &nbsp;&middot;&nbsp; 9:51</div><h3>Occupancy, and what caps it</h3><svg viewBox="0 0 680 302" role="img"><title>Occupancy, and what caps it</title><text class="hd" x="40" y="46">What limits how many warps fit</text><g class="s"><rect x="40" y="66" width="190" height="70" rx="8"></rect><text class="lbl" x="135.0" y="92.0" text-anchor="middle" dominant-baseline="central">Register file</text><text class="sub" x="135.0" y="110.0" text-anchor="middle" dominant-baseline="central">256 KB per SM</text></g><g class="s"><rect x="246" y="66" width="190" height="70" rx="8"></rect><text class="lbl" x="341.0" y="92.0" text-anchor="middle" dominant-baseline="central">Shared memory</text><text class="sub" x="341.0" y="110.0" text-anchor="middle" dominant-baseline="central">up to 228 KB</text></g><g class="u"><rect x="452" y="66" width="188" height="70" rx="8"></rect><text class="lbl" x="546.0" y="92.0" text-anchor="middle" dominant-baseline="central">Hard limit</text><text class="sub" x="546.0" y="110.0" text-anchor="middle" dominant-baseline="central">64 warps</text></g><text class="cap" x="40" y="180" text-anchor="start">A thread using more registers means fewer threads fit. A block reserving more shared memory</text><text class="cap" x="40" y="200" text-anchor="start">means fewer blocks fit. Whichever runs out first caps occupancy.</text><text class="cap" x="40" y="240" text-anchor="start">Occupancy is a latency-hiding metric, not a speed metric. High occupancy with bad access</text><text class="cap" x="40" y="260" text-anchor="start">patterns is still slow, and a well-tuned kernel at 50% occupancy can beat a careless one at</text><text class="cap" x="40" y="280" text-anchor="start">100%.</text></svg><figcaption>The number to chase is enough concurrency to cover memory latency, not the maximum the hardware permits.</figcaption></figure>
