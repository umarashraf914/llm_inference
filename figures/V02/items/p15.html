0" y="272">Bytes each multiprocessor can take in per tick (log axis)</text><text class="cap" x="40" y="304" text-anchor="start">registers</text><g class="s"><rect x="190.0" y="288.0" width="318.6" height="22.0" rx="3"/></g><text class="sub2" x="516.6391215695493" y="304" text-anchor="start">1,536, one FFMA per lane</text><text class="cap" x="40" y="334" text-anchor="start">shared memory</text><g class="s"><rect x="190.0" y="318.0" width="210.7" height="22.0" rx="3"/></g><text class="sub2" x="408.7209969647868" y="334" text-anchor="start">128, 32 banks × 4 bytes</text><text class="cap" x="40" y="364" text-anchor="start">L2 cache</text><g class="u"><rect x="190.0" y="348.0" width="159.4" height="22.0" rx="3"/></g><text class="sub2" x="357.3626076809924" y="364" text-anchor="start">about 39, measured</text><text class="cap" x="40" y="394" text-anchor="start">HBM</text><g class="h"><rect x="190.0" y="378.0" width="110.8" height="22.0" rx="3"/></g><text class="sub2" x="308.8064888490858" y="394" text-anchor="start">12.8, its 3.35 TB/s shared by 132</text><line class="axis" x1="190" y1="410" x2="590" y2="410"/><line class="tick" x1="190.0" y1="410" x2="190.0" y2="415"/><text class="sub2" x="190.0" y="429" text-anchor="middle">1</text><line class="tick" x1="290.0" y1="410" x2="290.0" y2="415"/><text class="sub2" x="290.0" y="429" text-anchor="middle">10</text><line class="tick" x1="390.0" y1="410" x2="390.0" y2="415"/><text class="sub2" x="390.0" y="429" text-anchor="middle">100</text><line class="tick" x1="490.0" y1="410" x2="490.0" y2="415"/><text class="sub2" x="490.0" y="429" text-anchor="middle">1,000</text><line class="tick" x1="590.0" y1="410" x2="590.0" y2="415"/><text class="sub2" x="590.0" y="429" text-anchor="middle">10,000</text><text class="cap" x="40" y="466" text-anchor="start">Latencies were measured on a Hopper GPU, the H800, with the chip otherwise idle: 29</text><text class="cap" x="40" y="486" text-anchor="start">ticks for shared memory, 40.7 for L1, 263 for L2 and 478.8 for HBM.</text><text class="cap" x="40" y="526" text-anchor="start">Bandwidth falls the other way. An FFMA on every lane reads three 4-byte registers, 1,536</text><text class="cap" x="40" y="546" text-anchor="start">bytes a tick per multiprocessor; shared memory delivers 128; HBM's 3,352 GB/s, divided</text><text class="cap" x="40" y="566" text-anchor="start">among 132 multiprocessors at 1.98 billion ticks a second, is 12.8.</text></svg><figcaption>Latency: Luo et al. 2024, measured on an H800; the L2 rate is theirs too, per multiprocessor of the H800. Bank count: NVIDIA's CUDA programming guide. Each rung down is slower to answer and narrower.</figcaption></figure>
