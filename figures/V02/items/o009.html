<figure><div class='ts'>Fig 09 &nbsp;&middot;&nbsp; 0:14</div><h3>Latency and bandwidth are different things</h3><svg viewBox="0 0 680 432" role="img"><title>Latency and bandwidth are different things</title><text class="hd" x="40" y="46">Latency: how long one request takes</text><g class="u"><rect x="150" y="62" width="40" height="26" rx="3"></rect><text class="sub" x="170.0" y="75.0" text-anchor="middle" dominant-baseline="central">ask</text></g><rect x="196" y="62" width="330" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="361.0" y="75.0" text-anchor="middle" dominant-baseline="central">wait</text><g class="s"><rect x="532" y="62" width="60" height="26" rx="3"></rect><text class="sub" x="562.0" y="75.0" text-anchor="middle" dominant-baseline="central">arrive</text></g><text class="hd" x="40" y="148">Bandwidth: how many can be in flight at once</text><g class="s"><rect x="150" y="164" width="442" height="16" rx="2"></rect></g><g class="s"><rect x="150" y="186" width="442" height="16" rx="2"></rect></g><g class="s"><rect x="150" y="208" width="442" height="16" rx="2"></rect></g><g class="s"><rect x="150" y="230" width="442" height="16" rx="2"></rect></g><g class="s"><rect x="150" y="252" width="442" height="16" rx="2"></rect></g><g class="s"><rect x="150" y="274" width="442" height="16" rx="2"></rect></g><text class="cap" x="40" y="320" text-anchor="start">These are independent. A wide, slow pipe has high bandwidth and high latency. A narrow, quick</text><text class="cap" x="40" y="340" text-anchor="start">one has the reverse.</text><text class="cap" x="40" y="370" text-anchor="start">You cannot make HBM low-latency, because the distance and the DRAM read cycle are what they</text><text class="cap" x="40" y="390" text-anchor="start">are. But you can keep enough requests outstanding that the pipe stays full. That single idea is</text><text class="cap" x="40" y="410" text-anchor="start">the GPU's entire answer to slow memory.</text></svg><figcaption>Confusing these two is the most common error in performance reasoning. Hold them apart and the rest of this document follows easily.</figcaption></figure>
