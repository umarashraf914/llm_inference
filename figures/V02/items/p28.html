<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 16:38</div><h3>BF16's multiplier is a ninth the size of FP32's, yet the rate follows the bits</h3><svg viewBox='0 0 680 755' role='img'><title>BF16's multiplier is a ninth the size of FP32's, yet the rate follows the bits</title><text class="hd" x="40" y="46">Each format's significand multiplier, width × width (area to scale)</text><g class="u"><rect x="60.0" y="70.0" width="120.0" height="120.0" rx="0"/></g><text class="cap" x="120.0" y="220" text-anchor="middle">FP32: 24 bits</text><text class="sub2" x="120.0" y="237" text-anchor="middle">24 × 24 = 576</text><g class="m"><rect x="240.0" y="135.0" width="55.0" height="55.0" rx="0"/></g><text class="cap" x="267.5" y="220" text-anchor="middle">FP16: 11 bits</text><text class="sub2" x="267.5" y="237" text-anchor="middle">11 × 11 = 121</text><g class="m"><rect x="360.0" y="150.0" width="40.0" height="40.0" rx="0"/></g><text class="cap" x="380.0" y="220" text-anchor="middle">BF16: 8 bits</text><text class="sub2" x="380.0" y="237" text-anchor="middle">8 × 8 = 64</text><g class="m"><rect x="470.0" y="170.0" width="20.0" height="20.0" rx="0"/></g><text class="cap" x="480.0" y="220" text-anchor="middle">FP8: 4 bits</text><text class="sub2" x="480.0" y="237" text-anchor="middle">4 × 4 = 16</text><text class="hd" x="40" y="279">The H100's tensor-core rate, trillion operations a second (bars to scale)</text><text class="sub2" x="100" y="303" text-anchor="start">bits a number</text><text class="sub2" x="210" y="303" text-anchor="start">multiplier size</text><text class="cap" x="40" y="330" text-anchor="start">TF32</text><text class="sub2" x="100" y="330" text-anchor="start">32</text><text class="sub2" x="210" y="330" text-anchor="start">121</text><g class="s"><rect x="300.0" y="313.0" width="67.5" height="24.0" rx="3"/></g><text class="sub2" x="375.5" y="330" text-anchor="start">494.7</text><text class="cap" x="40" y="362" text-anchor="start">FP16</text><text class="sub2" x="100" y="362" text-anchor="start">16</text><text class="sub2" x="210" y="362" text-anchor="start">121</text><g class="s"><rect x="300.0" y="345.0" width="135.0" height="24.0" rx="3"/></g><text class="sub2" x="443.0" y="362" text-anchor="start">989.4</text><text class="cap" x="40" y="394" text-anchor="start">BF16</text><text class="sub2" x="100" y="394" text-anchor="start">16</text><text class="sub2" x="210" y="394" text-anchor="start">64</text><g class="s"><rect x="300.0" y="377.0" width="135.0" height="24.0" rx="3"/></g><text class="sub2" x="443.0" y="394" text-anchor="start">989.4</text><text class="cap" x="40" y="426" text-anchor="start">FP8</text><text class="sub2" x="100" y="426" text-anchor="start">8</text><text class="sub2" x="210" y="426" text-anchor="start">16</text><g class="s"><rect x="300.0" y="409.0" width="270.0" height="24.0" rx="3"/></g><text class="sub2" x="578.0" y="426" text-anchor="start">1,978.9</text><text class="cap" x="40" y="471" text-anchor="start">Multiplying two floating-point numbers multiplies their significands and adds their</text><text class="cap" x="40" y="491" text-anchor="start">exponents, since 2^a × 2^b = 2^(a + b). The adder is small, so the significand</text><text class="cap" x="40" y="511" text-anchor="start">multiplier is most of the cost, and it grows with the square of the significand's width:</text><text class="cap" x="40" y="531" text-anchor="start">24 × 24 = 576 for FP32 against 8 × 8 = 64 for BF16, a ninth.</text><text class="cap" x="40" y="571" text-anchor="start">Yet the rates follow the bits a number takes, not the multiplier. TF32 has FP16's 11-bit</text><text class="cap" x="40" y="591" text-anchor="start">significand but is read as 32-bit numbers, and runs at half FP16's rate; BF16's</text><text class="cap" x="40" y="611" text-anchor="start">multiplier is about half FP16's, at the same rate; FP8's is a quarter of BF16's, at</text><text class="cap" x="40" y="631" text-anchor="start">twice the rate.</text><text class="cap" x="40" y="671" text-anchor="start">The likely reason is delivery. Every operand must be carried to the tensor cores, and</text><text class="cap" x="40" y="691" text-anchor="start">the paths that carry them move a fixed number of bits a tick, so halving the bits</text><text class="cap" x="40" y="711" text-anchor="start">doubles the numbers that arrive. The square law sets how much arithmetic fits; the bits</text><text class="cap" x="40" y="731" text-anchor="start">set how fast it is fed.</text></svg><figcaption>Rates are dense, from NVIDIA's H100 whitepaper; TF32's layout is from the A100 whitepaper. The delivery explanation is reasoned from that pattern, not a published specification.</figcaption></figure>
