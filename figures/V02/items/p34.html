<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 18:12</div><h3>Three links, each wires × rate, in the same units</h3><svg viewBox='0 0 680 620' role='img'><title>Three links, each wires × rate, in the same units</title><text class="hd" x="40" y="46">Bytes a second  =  wires × bits a second on each  ÷  8 bits a byte</text><g class="u"><rect x="40" y="62" width="600" height="34" rx="6"/><text class="sub" x="340.0" y="79.0" text-anchor="middle" dominant-baseline="central">HBM:   5,120 wires × 5.238 Gb/s  =  26,819 Gb/s   →   3,352 GB/s</text></g><g class="u"><rect x="40" y="104" width="600" height="34" rx="6"/><text class="sub" x="340.0" y="121.0" text-anchor="middle" dominant-baseline="central">NVLink:   18 links × 2 pairs × 100 Gb/s  =  3,600 Gb/s   →   450 GB/s each way</text></g><g class="u"><rect x="40" y="146" width="600" height="34" rx="6"/><text class="sub" x="340.0" y="163.0" text-anchor="middle" dominant-baseline="central">InfiniBand:   one 400 Gb/s port per GPU   →   50 GB/s each way</text></g><text class="cap" x="40" y="231" text-anchor="start">HBM, its own memory</text><g class="s"><rect x="210.0" y="214.0" width="336.7" height="24.0" rx="3"/></g><text class="sub2" x="554.7" y="231" text-anchor="start">3,352 GB/s</text><text class="cap" x="40" y="265" text-anchor="start">NVLink, a neighbour</text><g class="m"><rect x="210.0" y="248.0" width="220.4" height="24.0" rx="3"/></g><text class="sub2" x="438.4" y="265" text-anchor="start">450 GB/s each way: 7.4× less</text><text class="cap" x="40" y="299" text-anchor="start">InfiniBand, the network</text><g class="h"><rect x="210.0" y="282.0" width="93.2" height="24.0" rx="3"/></g><text class="sub2" x="311.2" y="299" text-anchor="start">50 GB/s each way: 9× less</text><line class="axis" x1="210" y1="318" x2="610" y2="318"/><line class="tick" x1="210.0" y1="318" x2="210.0" y2="323"/><text class="sub2" x="210.0" y="337" text-anchor="middle">10</text><line class="tick" x1="343.3" y1="318" x2="343.3" y2="323"/><text class="sub2" x="343.3" y="337" text-anchor="middle">100</text><line class="tick" x1="476.7" y1="318" x2="476.7" y2="323"/><text class="sub2" x="476.7" y="337" text-anchor="middle">1,000</text><line class="tick" x1="610.0" y1="318" x2="610.0" y2="323"/><text class="sub2" x="610.0" y="337" text-anchor="middle">10,000</text><text class="sub2" x="610" y="356" text-anchor="end">GB/s (log)</text><text class="cap" x="40" y="396" text-anchor="start">Each link is wires times the rate on each wire, the arithmetic of any bus</text><text class="cap" x="40" y="416" text-anchor="start">({{fig:v01-o074}}). Link rates are quoted in gigabits a second; dividing by 8 gives</text><text class="cap" x="40" y="436" text-anchor="start">gigabytes.</text><text class="cap" x="40" y="476" text-anchor="start">NVLink's quoted 900 GB/s adds its two directions; one way it carries 450. InfiniBand's</text><text class="cap" x="40" y="496" text-anchor="start">400 Gb/s is one way, as NVIDIA's own switch figures show: its 64 ports of 400 Gb/s make</text><text class="cap" x="40" y="516" text-anchor="start">the 51.2 Tb/s it quotes for both directions.</text><text class="cap" x="40" y="556" text-anchor="start">Per direction, then, each step out is 7.4 times and then 9 times slower. NVLink is not</text><text class="cap" x="40" y="576" text-anchor="start">an order of magnitude behind memory, 3.7 times against its quoted 900, but the network</text><text class="cap" x="40" y="596" text-anchor="start">is close to an order of magnitude behind NVLink.</text></svg><figcaption>Log axis, three powers of ten. HBM's width and clock and NVLink's 25 GB/s each way over two wire pairs per link are from the H100 whitepaper; the port rate from NVIDIA's Quantum-2 InfiniBand specifications.</figcaption></figure>
