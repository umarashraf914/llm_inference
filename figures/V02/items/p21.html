<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 12:05</div><h3>At each generation's narrowest format, the ridge climbs eightfold</h3><svg viewBox='0 0 680 554' role='img'><title>At each generation's narrowest format, the ridge climbs eightfold</title><text class="hd" x="40" y="46">Ridge, in operations per byte, at 16 bits and at each chip's narrowest float (log axis)</text><text class="cap" x="40" y="80" text-anchor="start">V100, 2017</text><g class="u"><rect x="170.0" y="64.0" width="47.2" height="22.0" rx="3"/></g><text class="sub2" x="225.15266115232498" y="80" text-anchor="start">139 at 16-bit</text><g class="m"><rect x="170.0" y="90.0" width="47.2" height="22.0" rx="3"/></g><text class="sub2" x="225.15266115232498" y="106" text-anchor="start">139 at FP16</text><text class="cap" x="40" y="142" text-anchor="start">A100, 2020</text><g class="u"><rect x="170.0" y="126.0" width="61.1" height="22.0" rx="3"/></g><text class="sub2" x="239.0570614114008" y="142" text-anchor="start">153 at 16-bit</text><g class="m"><rect x="170.0" y="152.0" width="61.1" height="22.0" rx="3"/></g><text class="sub2" x="239.0570614114008" y="168" text-anchor="start">153 at BF16</text><text class="cap" x="40" y="204" text-anchor="start">H100, 2022</text><g class="u"><rect x="170.0" y="188.0" width="155.4" height="22.0" rx="3"/></g><text class="sub2" x="333.36090327180375" y="204" text-anchor="start">295 at 16-bit</text><g class="m"><rect x="170.0" y="214.0" width="254.9" height="22.0" rx="3"/></g><text class="sub2" x="432.8607885134565" y="230" text-anchor="start">590 at FP8</text><text class="cap" x="40" y="266" text-anchor="start">B200, 2024</text><g class="u"><rect x="170.0" y="250.0" width="148.4" height="22.0" rx="3"/></g><text class="sub2" x="326.42839060201413" y="266" text-anchor="start">281 at 16-bit</text><g class="m"><rect x="170.0" y="276.0" width="347.4" height="22.0" rx="3"/></g><text class="sub2" x="525.413653919407" y="292" text-anchor="start">1,125 at FP4</text><line class="axis" x1="170" y1="314" x2="600" y2="314"/><line class="tick" x1="170.0" y1="314" x2="170.0" y2="319"/><text class="sub2" x="170.0" y="333" text-anchor="middle">100</text><line class="tick" x1="269.5" y1="314" x2="269.5" y2="319"/><text class="sub2" x="269.5" y="333" text-anchor="middle">200</text><line class="tick" x1="401.0" y1="314" x2="401.0" y2="319"/><text class="sub2" x="401.0" y="333" text-anchor="middle">500</text><line class="tick" x1="500.5" y1="314" x2="500.5" y2="319"/><text class="sub2" x="500.5" y="333" text-anchor="middle">1,000</text><line class="tick" x1="600.0" y1="314" x2="600.0" y2="319"/><text class="sub2" x="600.0" y="333" text-anchor="middle">2,000</text><text class="cap" x="40" y="370" text-anchor="start">Each generation's tensor cores accept a narrower number, and halving the bits roughly</text><text class="cap" x="40" y="390" text-anchor="start">doubles the operations per second on the same chip. Bandwidth gets no such multiplier.</text><text class="cap" x="40" y="410" text-anchor="start">So at each chip's narrowest floating-point format the ridge climbs from 139 on the V100</text><text class="cap" x="40" y="430" text-anchor="start">to 1,125 on the B200, 8.1 times higher, while at 16 bits it only doubled.</text><text class="cap" x="40" y="470" text-anchor="start">Halving the bits also halves the bytes per weight, so work moved to the new format does</text><text class="cap" x="40" y="490" text-anchor="start">twice the operations per byte: decode at 8 bits does 2 ({{fig:v01-o116}}), still 295</text><text class="cap" x="40" y="510" text-anchor="start">times below the FP8 ridge of 590. The formats speed up both sides for the work that</text><text class="cap" x="40" y="530" text-anchor="start">adopts them; the headline compute races ahead of bandwidth.</text></svg><figcaption>This is the trend behind “compute climbed faster still”: not more silicon so much as narrower numbers. The A100 added no narrower float than 16 bits, which is why its two bars match.</figcaption></figure>
