<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 6:20</div><h3>Assembled: the whole execution hierarchy</h3><svg viewBox='0 0 680 518' role='img'><title>Assembled: the whole execution hierarchy</title><g class="u"><rect x="40" y="36" width="600" height="344" rx="14"/><text class="lbl" x="62" y="62">H100</text><text class="sub" x="62" y="80">132 multiprocessors</text></g><g class="m"><rect x="62" y="92" width="556" height="268" rx="14"/><text class="lbl" x="84" y="118">One multiprocessor</text><text class="sub" x="84" y="136">up to 64 warps, from up to 32 blocks</text></g><g class="s"><rect x="84" y="148" width="512" height="192" rx="14"/><text class="lbl" x="106" y="174">One block</text><text class="sub" x="106" y="192">up to 1,024 threads: 32 warps, one shared memory</text></g><g class="u"><rect x="106" y="204" width="468" height="116" rx="14"/><text class="lbl" x="128" y="230">One warp</text><text class="sub" x="128" y="248">32 threads, one instruction</text></g><g class="m"><rect x="128" y="260" width="44" height="40" rx="3"/><text class="sub" x="150.0" y="280.0" text-anchor="middle" dominant-baseline="central">t0</text></g><g class="m"><rect x="180" y="260" width="44" height="40" rx="3"/><text class="sub" x="202.0" y="280.0" text-anchor="middle" dominant-baseline="central">t1</text></g><g class="m"><rect x="232" y="260" width="44" height="40" rx="3"/><text class="sub" x="254.0" y="280.0" text-anchor="middle" dominant-baseline="central">t2</text></g><g class="m"><rect x="284" y="260" width="44" height="40" rx="3"/><text class="sub" x="306.0" y="280.0" text-anchor="middle" dominant-baseline="central">…</text></g><g class="m"><rect x="336" y="260" width="44" height="40" rx="3"/><text class="sub" x="358.0" y="280.0" text-anchor="middle" dominant-baseline="central">t31</text></g><text class="cap" x="40" y="414" text-anchor="start">32 threads make a warp. A block is up to 32 warps, placed whole on one multiprocessor</text><text class="cap" x="40" y="434" text-anchor="start">and sharing one slice of shared memory. A multiprocessor holds up to 64 warps. 132</text><text class="cap" x="40" y="454" text-anchor="start">multiprocessors make the chip.</text><text class="cap" x="40" y="494" text-anchor="start">32 × 64 × 132 = 270,336 threads in flight.</text></svg><figcaption>Every number in Parts 2 to 4 sits somewhere on this chain. Rebuild the chain and that whole stretch is yours.</figcaption></figure>
