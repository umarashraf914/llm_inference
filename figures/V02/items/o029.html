<figure><div class='ts'>Fig 29 &nbsp;&middot;&nbsp; 3:56</div><h3>What a register is</h3><svg viewBox="0 0 680 392" role="img"><title>What a register is</title><text class="hd" x="40" y="46">A register is a named slot the arithmetic can reach instantly</text><g class="s"><rect x="40" y="74" width="90" height="40" rx="4"></rect><text class="sub" x="85.0" y="94.0" text-anchor="middle" dominant-baseline="central">r0</text></g><g class="s"><rect x="140" y="74" width="90" height="40" rx="4"></rect><text class="sub" x="185.0" y="94.0" text-anchor="middle" dominant-baseline="central">r1</text></g><g class="s"><rect x="240" y="74" width="90" height="40" rx="4"></rect><text class="sub" x="285.0" y="94.0" text-anchor="middle" dominant-baseline="central">r2</text></g><rect x="340" y="74" width="90" height="40" rx="4" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"></rect><text class="sub2" x="385.0" y="94.0" text-anchor="middle" dominant-baseline="central">...</text><line class="conn" x1="240" y1="126" x2="240" y2="148" marker-end="url(#arw)"></line><g class="m"><rect x="150" y="152" width="270" height="40" rx="4"></rect><text class="sub" x="285.0" y="172.0" text-anchor="middle" dominant-baseline="central">the arithmetic unit</text></g><text class="cap" x="40" y="238" text-anchor="start">An arithmetic unit cannot reach into memory. It can only read from a register and write to a</text><text class="cap" x="40" y="258" text-anchor="start">register, and something else has to have put the values there first.</text><text class="cap" x="40" y="294" text-anchor="start">So every number takes the same path: memory, then a register, then the maths, then back. The</text><text class="cap" x="40" y="314" text-anchor="start">register step is not optional.</text><text class="cap" x="40" y="350" text-anchor="start">Registers are the fastest thing on the chip because they sit right next to the units that use</text><text class="cap" x="40" y="370" text-anchor="start">them, and because there are very few of them.</text></svg><figcaption>The first rung of the ladder, and the only one the arithmetic can actually touch. Everything else exists to keep it fed.</figcaption></figure>
