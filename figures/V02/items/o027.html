<figure><div class='ts'>Fig 27 &nbsp;&middot;&nbsp; 3:17</div><h3>The arithmetic units</h3><svg viewBox="0 0 680 196" role="img"><title>The arithmetic units</title><g class="m"><rect x="50" y="55" width="270" height="76" rx="8"></rect><text class="lbl" x="185.0" y="76.0" text-anchor="middle" dominant-baseline="central">128 CUDA cores</text><text class="sub" x="185.0" y="94.0" text-anchor="middle" dominant-baseline="central">scalar, one multiply-add</text><text class="sub" x="185.0" y="111.0" text-anchor="middle" dominant-baseline="central">per cycle each</text></g><g class="m"><rect x="360" y="55" width="270" height="76" rx="8"></rect><text class="lbl" x="495.0" y="76.0" text-anchor="middle" dominant-baseline="central">4 tensor cores</text><text class="sub" x="495.0" y="94.0" text-anchor="middle" dominant-baseline="central">operate on whole matrix tiles,</text><text class="sub" x="495.0" y="111.0" text-anchor="middle" dominant-baseline="central">not single values</text></g><text class="cap" x="50" y="168" text-anchor="start">Everything else on the multiprocessor exists to keep these two fed.</text></svg><figcaption>A maths unit waiting on data is doing nothing. That sentence is the design brief for the four components that follow.</figcaption></figure>
