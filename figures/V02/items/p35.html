start">the link</text><g class="s"><rect x="150" y="246" width="225" height="30" rx="4"/><text class="sub" x="262.5" y="261.0" text-anchor="middle" dominant-baseline="central">GPU A:  10 + 8 = 18</text></g><g class="s"><rect x="395" y="246" width="225" height="30" rx="4"/><text class="sub" x="507.5" y="261.0" text-anchor="middle" dominant-baseline="central">GPU B:  8 + 10 = 18</text></g><g class="m"><rect x="40" y="300" width="600" height="42" rx="6"/><text class="sub" x="340.0" y="321.0" text-anchor="middle" dominant-baseline="central">2 all-reduces a layer  ×  80 layers  =  160 every token</text></g><text class="cap" x="40" y="378" text-anchor="start">Tensor parallelism splits each layer's weights across GPUs. Every output is a dot</text><text class="cap" x="40" y="398" text-anchor="start">product, a sum of weight × input terms ({{fig:v01-o111}}), and with the weights split,</text><text class="cap" x="40" y="418" text-anchor="start">each GPU can add up only its own share of the terms.</text><text class="cap" x="40" y="458" text-anchor="start">Before the next layer can start, the shares must meet: each GPU sends its partial sum</text><text class="cap" x="40" y="478" text-anchor="start">and each ends with the total. The exchange is called an all-reduce, and Megatron-LM's</text><text class="cap" x="40" y="498" text-anchor="start">split needs two per layer, one after the attention block and one after the feed-forward</text><text class="cap" x="40" y="518" text-anchor="start">block.</text><text class="cap" x="40" y="558" text-anchor="start">For an 80-layer model such as Llama 3 70B that is 160 all-reduces for every token, each</text><text class="cap" x="40" y="578" text-anchor="start">one a wait on the link. That frequency is why the link's speed matters so much.</text></svg><figcaption>Numbers small enough to check by hand. Two all-reduces per layer in the forward pass is from the Megatron-LM paper, the layer count from the Llama 3 paper; the fifth atlas, on parallelism, builds the whole scheme.</figcaption></figure>
