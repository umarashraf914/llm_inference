<figure><div class='ts'>Fig 83 &nbsp;&middot;&nbsp; 15:35</div><h3>Lower precision pays off twice</h3><svg viewBox="0 0 680 294" role="img"><title>Lower precision pays off twice</title><g class="u"><rect x="230" y="46" width="220" height="54" rx="8"></rect><text class="lbl" x="340.0" y="73.0" text-anchor="middle" dominant-baseline="central">Fewer bits per number</text></g><line class="conn" x1="300" y1="104" x2="220" y2="140" marker-end="url(#arw)"></line><line class="conn" x1="380" y1="104" x2="460" y2="140" marker-end="url(#arw)"></line><g class="m"><rect x="60" y="144" width="260" height="66" rx="8"></rect><text class="lbl" x="190.0" y="168.0" text-anchor="middle" dominant-baseline="central">More through the tensor cores</text><text class="sub" x="190.0" y="186.0" text-anchor="middle" dominant-baseline="central">each second</text></g><g class="h"><rect x="360" y="144" width="260" height="66" rx="8"></rect><text class="lbl" x="490.0" y="168.0" text-anchor="middle" dominant-baseline="central">Fewer bytes across</text><text class="sub" x="490.0" y="186.0" text-anchor="middle" dominant-baseline="central">the memory bus</text></g><text class="cap" x="40" y="252" text-anchor="start">More compute and less memory traffic from the same silicon. That is why every tensor-core</text><text class="cap" x="40" y="272" text-anchor="start">generation has added a lower-precision format.</text></svg><figcaption>Both arrows point at bottlenecks already established. The bytes side was counted in {{ref:v01-o116}}; the compute side is worked out over the next figures.</figcaption></figure>
