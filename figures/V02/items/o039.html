<figure><div class='ts'>Fig 39 &nbsp;&middot;&nbsp; 5:22</div><h3>What lockstep means</h3><svg viewBox="0 0 680 412" role="img"><title>What lockstep means</title><text class="hd" x="40" y="46">Lockstep: one instruction, everybody at once</text><g class="m"><rect x="60" y="70" width="62" height="36" rx="3"></rect><text class="sub" x="91.0" y="88.0" text-anchor="middle" dominant-baseline="central">add</text></g><g class="m"><rect x="134" y="70" width="62" height="36" rx="3"></rect><text class="sub" x="165.0" y="88.0" text-anchor="middle" dominant-baseline="central">add</text></g><g class="m"><rect x="208" y="70" width="62" height="36" rx="3"></rect><text class="sub" x="239.0" y="88.0" text-anchor="middle" dominant-baseline="central">add</text></g><g class="m"><rect x="282" y="70" width="62" height="36" rx="3"></rect><text class="sub" x="313.0" y="88.0" text-anchor="middle" dominant-baseline="central">add</text></g><g class="m"><rect x="356" y="70" width="62" height="36" rx="3"></rect><text class="sub" x="387.0" y="88.0" text-anchor="middle" dominant-baseline="central">add</text></g><g class="m"><rect x="430" y="70" width="62" height="36" rx="3"></rect><text class="sub" x="461.0" y="88.0" text-anchor="middle" dominant-baseline="central">add</text></g><g class="m"><rect x="504" y="70" width="62" height="36" rx="3"></rect><text class="sub" x="535.0" y="88.0" text-anchor="middle" dominant-baseline="central">add</text></g><g class="m"><rect x="578" y="70" width="62" height="36" rx="3"></rect><text class="sub" x="609.0" y="88.0" text-anchor="middle" dominant-baseline="central">add</text></g><text class="sub2" x="60" y="130" text-anchor="start">all eight doing the same thing, on their own numbers</text><text class="hd" x="40" y="180">Not lockstep: each free to do something different</text><g class="u"><rect x="60" y="204" width="62" height="36" rx="3"></rect><text class="sub" x="91.0" y="222.0" text-anchor="middle" dominant-baseline="central">add</text></g><g class="u"><rect x="134" y="204" width="62" height="36" rx="3"></rect><text class="sub" x="165.0" y="222.0" text-anchor="middle" dominant-baseline="central">load</text></g><g class="u"><rect x="208" y="204" width="62" height="36" rx="3"></rect><text class="sub" x="239.0" y="222.0" text-anchor="middle" dominant-baseline="central">jump</text></g><g class="u"><rect x="282" y="204" width="62" height="36" rx="3"></rect><text class="sub" x="313.0" y="222.0" text-anchor="middle" dominant-baseline="central">add</text></g><g class="u"><rect x="356" y="204" width="62" height="36" rx="3"></rect><text class="sub" x="387.0" y="222.0" text-anchor="middle" dominant-baseline="central">store</text></g><g class="u"><rect x="430" y="204" width="62" height="36" rx="3"></rect><text class="sub" x="461.0" y="222.0" text-anchor="middle" dominant-baseline="central">wait</text></g><g class="u"><rect x="504" y="204" width="62" height="36" rx="3"></rect><text class="sub" x="535.0" y="222.0" text-anchor="middle" dominant-baseline="central">mul</text></g><g class="u"><rect x="578" y="204" width="62" height="36" rx="3"></rect><text class="sub" x="609.0" y="222.0" text-anchor="middle" dominant-baseline="central">add</text></g><text class="sub2" x="60" y="264" text-anchor="start">eight separate instruction streams to fetch and track</text><text class="cap" x="40" y="314" text-anchor="start">The second is more flexible and far more expensive: eight of everything that reads, decodes</text><text class="cap" x="40" y="334" text-anchor="start">and tracks instructions, rather than one shared between eight.</text><text class="cap" x="40" y="370" text-anchor="start">This chip takes the first. Thirty-two lanes share one instruction, which is why they must all</text><text class="cap" x="40" y="390" text-anchor="start">do the same thing, and why the two sins later in this document are both about that.</text></svg><figcaption>The reason a warp exists at all. Sharing one instruction across thirty-two lanes is what frees the silicon that becomes arithmetic.</figcaption></figure>
