<figure><div class='ts'>Fig 15 &nbsp;&middot;&nbsp; 0:20</div><h3>What a capacitor is, and why it leaks</h3><svg viewBox="0 0 680 430" role="img"><title>What a capacitor is, and why it leaks</title><text class="hd" x="40" y="46">A capacitor holds charge, and leaks it</text><g class="h"><rect x="60" y="74" width="200" height="44" rx="6"></rect><text class="sub" x="160.0" y="96.0" text-anchor="middle" dominant-baseline="central">charged: call it 1</text></g><g class="u"><rect x="300" y="74" width="200" height="44" rx="6"></rect><text class="sub" x="400.0" y="96.0" text-anchor="middle" dominant-baseline="central">empty: call it 0</text></g><text class="hd" x="40" y="168">But charge drains away on its own</text><line class="axis" x1="60" y1="280" x2="480" y2="280"></line><polyline class="pl-h" points="66,196 140,212 220,236 320,262 460,276"></polyline><text class="sub2" x="66" y="188" text-anchor="start">full</text><text class="sub2" x="400" y="302" text-anchor="start">and then it is not a 1 any more</text><text class="cap" x="40" y="352" text-anchor="start">So the whole array has to be read and rewritten thousands of times a second, whether anybody</text><text class="cap" x="40" y="372" text-anchor="start">is using it or not. That is what refreshing means.</text><text class="cap" x="40" y="408" text-anchor="start">A cell that has to be constantly refreshed, and destroyed to be read, cannot also be fast.</text></svg><figcaption>The physical reason main memory is slow. It is not a manufacturing failure; it is what storing a bit as charge costs.</figcaption></figure>
