<figure><div class='ts'>Fig 99 &nbsp;&middot;&nbsp; 19:38</div><h3>What a software ecosystem is</h3><svg viewBox="0 0 680 484" role="img"><title>What a software ecosystem is</title><text class="hd" x="40" y="46">What sits between a model and the silicon</text><g class="u"><rect x="40" y="74" width="280" height="40" rx="4"></rect><text class="sub" x="180.0" y="94.0" text-anchor="middle" dominant-baseline="central">The model</text></g><text class="sub2" x="340" y="98" text-anchor="start">written in a high-level framework</text><line class="conn" x1="180" y1="116" x2="180" y2="128" marker-end="url(#arw)"></line><g class="s"><rect x="40" y="132" width="280" height="40" rx="4"></rect><text class="sub" x="180.0" y="152.0" text-anchor="middle" dominant-baseline="central">Libraries</text></g><text class="sub2" x="340" y="156" text-anchor="start">hand-tuned routines for common operations</text><line class="conn" x1="180" y1="174" x2="180" y2="186" marker-end="url(#arw)"></line><g class="s"><rect x="40" y="190" width="280" height="40" rx="4"></rect><text class="sub" x="180.0" y="210.0" text-anchor="middle" dominant-baseline="central">The compiler and driver</text></g><text class="sub2" x="340" y="214" text-anchor="start">turn that into instructions for this chip</text><line class="conn" x1="180" y1="232" x2="180" y2="244" marker-end="url(#arw)"></line><g class="m"><rect x="40" y="248" width="280" height="40" rx="4"></rect><text class="sub" x="180.0" y="268.0" text-anchor="middle" dominant-baseline="central">The silicon</text></g><text class="sub2" x="340" y="272" text-anchor="start">132 multiprocessors</text><text class="cap" x="40" y="330" text-anchor="start">Almost nobody writes instructions for the silicon directly. They call a library routine, and</text><text class="cap" x="40" y="350" text-anchor="start">somebody spent years making that routine fast on this particular chip.</text><text class="cap" x="40" y="386" text-anchor="start">Two decades of those routines is what a mature software ecosystem means, and it is why a</text><text class="cap" x="40" y="406" text-anchor="start">competitor with better hardware can still be the harder choice.</text><text class="cap" x="40" y="442" text-anchor="start">The specification sheet describes the bottom row. What a team actually experiences is all</text><text class="cap" x="40" y="462" text-anchor="start">four.</text></svg><figcaption>The layer that never appears on a specification sheet and frequently decides the outcome. It is the note the video closes on.</figcaption></figure>
