<figure><div class='ts'>Fig 93 &nbsp;&middot;&nbsp; 17:31</div><h3>Two ways to wire GPUs together</h3><svg viewBox='0 0 680 294' role="img"><title>Two ways to wire GPUs together</title><g class="s"><rect x="40" y="50" width="270" height="168" rx="14"></rect><text class="lbl" x="62" y="76">Scale-up</text><text class="sub" x="62" y="94">one box or rack</text></g><g class="m"><rect x="60" y="106" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="120" y="106" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="180" y="106" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="240" y="106" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="60" y="152" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="120" y="152" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="180" y="152" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="240" y="152" width="52" height="38" rx="3"></rect></g><text class="sub2" x="62" y="208" text-anchor="start">NVLink and the NVSwitch crossbar</text><g class="h"><rect x="370" y="50" width="270" height="168" rx="14"></rect><text class="lbl" x="392" y="76">Scale-out</text><text class="sub" x="392" y="94">separate boxes</text></g><g class="u"><rect x="390" y="106" width="110" height="78" rx="4"></rect><text class="sub" x="445.0" y="145.0" text-anchor="middle" dominant-baseline="central">box A</text></g><g class="u"><rect x="510" y="106" width="110" height="78" rx="4"></rect><text class="sub" x="565.0" y="145.0" text-anchor="middle" dominant-baseline="central">box B</text></g><text class="sub2" x="392" y="208" text-anchor="start">ordinary data-centre networking</text><text class="cap" x="40" y="250" text-anchor="start">NVLink gives every GPU full-speed access to every other in the domain. InfiniBand</text><text class="cap" x="40" y="270" text-anchor="start">between boxes carries about a ninth as many bytes a second, each way ({{fig:v02-p34}}).</text></svg><figcaption>The boundary between the two is the most important line in a cluster: whatever crosses it pays the network's rate.</figcaption></figure>
