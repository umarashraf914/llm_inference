<figure><div class='ts'>Fig 93 &nbsp;&middot;&nbsp; 17:34</div><h3>Two ways to wire GPUs together</h3><svg viewBox="0 0 680 300" role="img"><title>Two ways to wire GPUs together</title><g class="s"><rect x="40" y="50" width="270" height="168" rx="14"></rect><text class="lbl" x="62" y="76">Scale-up</text><text class="sub" x="62" y="94">one box or rack</text></g><g class="m"><rect x="60" y="106" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="120" y="106" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="180" y="106" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="240" y="106" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="60" y="152" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="120" y="152" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="180" y="152" width="52" height="38" rx="3"></rect></g><g class="m"><rect x="240" y="152" width="52" height="38" rx="3"></rect></g><text class="sub2" x="62" y="208" text-anchor="start">NVLink and the NVSwitch crossbar</text><g class="h"><rect x="370" y="50" width="270" height="168" rx="14"></rect><text class="lbl" x="392" y="76">Scale-out</text><text class="sub" x="392" y="94">separate boxes</text></g><g class="u"><rect x="390" y="106" width="110" height="78" rx="4"></rect><text class="sub" x="445.0" y="145.0" text-anchor="middle" dominant-baseline="central">box A</text></g><g class="u"><rect x="510" y="106" width="110" height="78" rx="4"></rect><text class="sub" x="565.0" y="145.0" text-anchor="middle" dominant-baseline="central">box B</text></g><text class="sub2" x="392" y="208" text-anchor="start">ordinary data-centre networking</text><text class="cap" x="40" y="258" text-anchor="start">NVLink gives every GPU full-speed access to every other in the domain. InfiniBand between</text><text class="cap" x="40" y="278" text-anchor="start">boxes runs roughly an order of magnitude slower per byte.</text></svg><figcaption>Note this is a third bandwidth, distinct from HBM bandwidth and from memory capacity. Keeping the three apart is essential once models stop fitting on one chip.</figcaption></figure>
