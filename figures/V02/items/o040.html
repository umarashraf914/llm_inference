<figure><div class='ts'>Fig 40 &nbsp;&middot;&nbsp; 5:45</div><h3>Why SIMT is cheap</h3><svg viewBox="0 0 680 274" role="img"><title>Why SIMT is cheap</title><text class="cap" x="40" y="78" text-anchor="start">Scalar processor</text><text class="sub2" x="40" y="98" text-anchor="start">pays per operation</text><g class="h"><rect x="200" y="62" width="24" height="30" rx="2"></rect></g><g class="m"><rect x="226" y="62" width="24" height="30" rx="2"></rect></g><g class="h"><rect x="255" y="62" width="24" height="30" rx="2"></rect></g><g class="m"><rect x="281" y="62" width="24" height="30" rx="2"></rect></g><g class="h"><rect x="310" y="62" width="24" height="30" rx="2"></rect></g><g class="m"><rect x="336" y="62" width="24" height="30" rx="2"></rect></g><g class="h"><rect x="365" y="62" width="24" height="30" rx="2"></rect></g><g class="m"><rect x="391" y="62" width="24" height="30" rx="2"></rect></g><g class="h"><rect x="420" y="62" width="24" height="30" rx="2"></rect></g><g class="m"><rect x="446" y="62" width="24" height="30" rx="2"></rect></g><g class="h"><rect x="475" y="62" width="24" height="30" rx="2"></rect></g><g class="m"><rect x="501" y="62" width="24" height="30" rx="2"></rect></g><g class="h"><rect x="530" y="62" width="24" height="30" rx="2"></rect></g><g class="m"><rect x="556" y="62" width="24" height="30" rx="2"></rect></g><g class="h"><rect x="585" y="62" width="24" height="30" rx="2"></rect></g><g class="m"><rect x="611" y="62" width="24" height="30" rx="2"></rect></g><text class="cap" x="40" y="168" text-anchor="start">GPU warp</text><text class="sub2" x="40" y="188" text-anchor="start">pays once per 32</text><g class="h"><rect x="200" y="152" width="24" height="30" rx="2"></rect></g><g class="m"><rect x="228" y="152" width="22" height="30" rx="2"></rect></g><g class="m"><rect x="253" y="152" width="22" height="30" rx="2"></rect></g><g class="m"><rect x="278" y="152" width="22" height="30" rx="2"></rect></g><g class="m"><rect x="303" y="152" width="22" height="30" rx="2"></rect></g><g class="m"><rect x="328" y="152" width="22" height="30" rx="2"></rect></g><g class="m"><rect x="353" y="152" width="22" height="30" rx="2"></rect></g><g class="m"><rect x="378" y="152" width="22" height="30" rx="2"></rect></g><g class="m"><rect x="403" y="152" width="22" height="30" rx="2"></rect></g><g class="m"><rect x="428" y="152" width="22" height="30" rx="2"></rect></g><g class="m"><rect x="453" y="152" width="22" height="30" rx="2"></rect></g><g class="m"><rect x="478" y="152" width="22" height="30" rx="2"></rect></g><g class="m"><rect x="503" y="152" width="22" height="30" rx="2"></rect></g><g class="m"><rect x="528" y="152" width="22" height="30" rx="2"></rect></g><g class="m"><rect x="553" y="152" width="22" height="30" rx="2"></rect></g><g class="m"><rect x="578" y="152" width="22" height="30" rx="2"></rect></g><g class="m"><rect x="603" y="152" width="22" height="30" rx="2"></rect></g><text class="cap" x="40" y="232" text-anchor="start">Red is instruction fetch and decode, which costs real silicon and energy. Gold is arithmetic.</text><text class="cap" x="40" y="252" text-anchor="start">Spreading that overhead across 32 lanes is where the GPU's compute density comes from.</text></svg><figcaption>The control overhead nearly disappears, which frees the silicon that would have paid for it to become more arithmetic instead.</figcaption></figure>
