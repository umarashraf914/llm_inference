<figure><div class='ts'>Fig 35 &nbsp;&middot;&nbsp; 4:35</div><h3>The tensor memory accelerator</h3><svg viewBox="0 0 680 214" role="img"><title>The tensor memory accelerator</title><g class="h"><rect x="40" y="55" width="170" height="70" rx="8"></rect><text class="lbl" x="125.0" y="81.0" text-anchor="middle" dominant-baseline="central">HBM</text><text class="sub" x="125.0" y="99.0" text-anchor="middle" dominant-baseline="central">main memory</text></g><g class="u"><rect x="255" y="55" width="170" height="70" rx="8"></rect><text class="lbl" x="340.0" y="81.0" text-anchor="middle" dominant-baseline="central">TMA</text><text class="sub" x="340.0" y="99.0" text-anchor="middle" dominant-baseline="central">dedicated copy engine</text></g><g class="s"><rect x="470" y="55" width="170" height="70" rx="8"></rect><text class="lbl" x="555.0" y="81.0" text-anchor="middle" dominant-baseline="central">SRAM</text><text class="sub" x="555.0" y="99.0" text-anchor="middle" dominant-baseline="central">on the multiprocessor</text></g><line class="conn" x1="214" y1="90" x2="251" y2="90" marker-end="url(#arw)"></line><line class="conn" x1="429" y1="90" x2="466" y2="90" marker-end="url(#arw)"></line><text class="cap" x="40" y="168" text-anchor="start">It streams blocks of data in the background, so threads never spend their own instructions</text><text class="cap" x="40" y="188" text-anchor="start">on the transfer.</text></svg><figcaption>A copy engine that runs independently of the maths units is what allows loading and computing to overlap completely.</figcaption></figure>
