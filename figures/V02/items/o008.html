<figure><div class='ts'>Fig 08 &nbsp;&middot;&nbsp; 0:10</div><h3>What a bus is</h3><svg viewBox="0 0 680 324" role="img"><title>What a bus is</title><text class="hd" x="40" y="46">A bus is the set of wires between two places</text><g class="h"><rect x="40" y="76" width="170" height="70" rx="6"></rect><text class="sub" x="125.0" y="111.0" text-anchor="middle" dominant-baseline="central">memory</text></g><line class="tick" x1="212" y1="84" x2="466" y2="84"></line><line class="tick" x1="212" y1="93" x2="466" y2="93"></line><line class="tick" x1="212" y1="102" x2="466" y2="102"></line><line class="tick" x1="212" y1="111" x2="466" y2="111"></line><line class="tick" x1="212" y1="120" x2="466" y2="120"></line><line class="tick" x1="212" y1="129" x2="466" y2="129"></line><line class="tick" x1="212" y1="138" x2="466" y2="138"></line><g class="m"><rect x="468" y="76" width="172" height="70" rx="6"></rect><text class="sub" x="554.0" y="111.0" text-anchor="middle" dominant-baseline="central">the chip</text></g><text class="sub2" x="212" y="176" text-anchor="start">many wires side by side, all carrying bits at once</text><text class="cap" x="40" y="226" text-anchor="start">How many wires, times how often each carries a new bit, is the bandwidth. Widening the bus is</text><text class="cap" x="40" y="246" text-anchor="start">the main way it gets faster.</text><text class="cap" x="40" y="282" text-anchor="start">Every weight the model uses has to travel along these wires before any arithmetic can touch</text><text class="cap" x="40" y="302" text-anchor="start">it. There is no other route.</text></svg><figcaption>The physical object the whole memory wall is about. When a figure says bytes moved, it means bits pushed down these wires.</figcaption></figure>
