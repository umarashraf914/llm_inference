"30" height="22" rx="3"/><text class="sub" x="500.0" y="84.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="543.0" y="97.0" width="30" height="22" rx="3"/><text class="sub" x="558.0" y="108.0" text-anchor="middle" dominant-baseline="central">2</text></g><g class="m"><rect x="567.0" y="155.0" width="30" height="22" rx="3"/><text class="sub" x="582.0" y="166.0" text-anchor="middle" dominant-baseline="central">3</text></g><g class="m"><rect x="543.0" y="213.0" width="30" height="22" rx="3"/><text class="sub" x="558.0" y="224.0" text-anchor="middle" dominant-baseline="central">4</text></g><g class="m"><rect x="485.0" y="237.0" width="30" height="22" rx="3"/><text class="sub" x="500.0" y="248.0" text-anchor="middle" dominant-baseline="central">5</text></g><g class="m"><rect x="427.0" y="213.0" width="30" height="22" rx="3"/><text class="sub" x="442.0" y="224.0" text-anchor="middle" dominant-baseline="central">6</text></g><g class="m"><rect x="403.0" y="155.0" width="30" height="22" rx="3"/><text class="sub" x="418.0" y="166.0" text-anchor="middle" dominant-baseline="central">7</text></g><g class="m"><rect x="427.0" y="97.0" width="30" height="22" rx="3"/><text class="sub" x="442.0" y="108.0" text-anchor="middle" dominant-baseline="central">8</text></g><g class="s"><rect x="466" y="151" width="68" height="30" rx="4"/><text class="sub" x="500.0" y="166.0" text-anchor="middle" dominant-baseline="central">switch</text></g><text class="cap" x="180" y="289.0" text-anchor="middle">wired in pairs: 28 links</text><text class="sub2" x="180" y="306.0" text-anchor="middle">each GPU's links split seven ways</text><text class="cap" x="500" y="289.0" text-anchor="middle">through a switch: 8 connections</text><text class="sub2" x="500" y="306.0" text-anchor="middle">any pair at the full rate</text><g class="m"><rect x="40" y="328.0" width="600" height="42" rx="6"/><text class="sub" x="340.0" y="349.0" text-anchor="middle" dominant-baseline="central">links to join every pair  =  n(n − 1) ÷ 2:   6 for 4 GPUs,  28 for 8,  2,556 for 72</text></g><text class="cap" x="40" y="406.0" text-anchor="start">Joining every pair of n GPUs directly takes n(n − 1) ÷ 2 links: each GPU pairs with the</text><text class="cap" x="40" y="426.0" text-anchor="start">n − 1 others, and each link has two ends. That is 6 for 4 GPUs, 28 for 8 and 2,556 for</text><text class="cap" x="40" y="446.0" text-anchor="start">72.</text><text class="cap" x="40" y="486.0" text-anchor="start">And a GPU's links are a fixed budget, 18 on the H100, so in a mesh of eight each pair</text><text class="cap" x="40" y="506.0" text-anchor="start">gets only about a seventh of them, and a GPU sending to one neighbour leaves most of its</text><text class="cap" x="40" y="526.0" text-anchor="start">links idle.</text><text class="cap" x="40" y="566.0" text-anchor="start">A switch turns this around. Every GPU runs all its links to the switch, which connects</text><text class="cap" x="40" y="586.0" text-anchor="start">any pair at the full rate, and the connections grow with the number of GPUs rather than</text><text class="cap" x="40" y="606.0" text-anchor="start">with the number of pairs. In the DGX H100 the eight GPUs meet in four NVSwitch chips.</text></svg><figcaption>Drawn as one switch; the DGX H100 spreads each GPU's 18 links over four switch chips (H100 whitepaper). NVIDIA describes its switches as giving all-to-all communication at full NVLink speed.</figcaption></figure>
