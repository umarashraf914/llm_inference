<figure><div class='ts'>Fig 14 &nbsp;&middot;&nbsp; 4:22</div><h3>What a cache is</h3><svg viewBox="0 0 680 376" role="img"><title>What a cache is</title><text class="hd" x="40" y="46">A cache is a small fast copy of something slow and far away</text><g class="s"><rect x="40" y="70" width="170" height="100" rx="6"></rect><text class="sub" x="125.0" y="120.0" text-anchor="middle" dominant-baseline="central">cache</text></g><text class="sub2" x="60" y="192" text-anchor="start">small, close, quick</text><line class="conn" x1="216" y1="120" x2="250" y2="120" marker-end="url(#arw)"></line><g class="h"><rect x="256" y="70" width="384" height="100" rx="6"></rect><text class="sub" x="448.0" y="120.0" text-anchor="middle" dominant-baseline="central">the real memory</text></g><text class="sub2" x="276" y="192" text-anchor="start">large, further away, slow</text><text class="cap" x="40" y="242" text-anchor="start">When a value is fetched, a copy is kept nearby in case it is wanted again. If it is, the second</text><text class="cap" x="40" y="262" text-anchor="start">request is answered from the copy and never makes the long trip.</text><text class="cap" x="40" y="298" text-anchor="start">This works only when programs reuse data. A program that touches every number exactly once</text><text class="cap" x="40" y="318" text-anchor="start">gains nothing from any cache, however large.</text><text class="cap" x="40" y="354" text-anchor="start">Hold that thought. Generating one token touches every weight exactly once.</text></svg><figcaption>The last line is the whole problem in miniature, and it is why so much of this series is about moving data rather than caching it.</figcaption></figure>
