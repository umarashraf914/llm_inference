<figure><div class='ts'>Fig 65 &nbsp;&middot;&nbsp; 10:56</div><h3>What a stride is</h3><svg viewBox="0 0 680 414" role="img"><title>What a stride is</title><text class="hd" x="40" y="46">Stride: how far apart the requested numbers are</text><text class="cap" x="40" y="92" text-anchor="start">stride 1</text><text class="sub2" x="40" y="112" text-anchor="start">consecutive</text><g class="s"><rect x="180" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="218" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="256" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="294" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="332" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="370" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="408" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="446" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="484" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="522" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="560" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="598" y="76" width="32" height="30" rx="3"></rect></g><text class="cap" x="40" y="176" text-anchor="start">stride 4</text><text class="sub2" x="40" y="196" text-anchor="start">every fourth</text><g class="s"><rect x="180" y="160" width="32" height="30" rx="3"></rect></g><g class="u"><rect x="218" y="160" width="32" height="30" rx="3"></rect></g><g class="u"><rect x="256" y="160" width="32" height="30" rx="3"></rect></g><g class="u"><rect x="294" y="160" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="332" y="160" width="32" height="30" rx="3"></rect></g><g class="u"><rect x="370" y="160" width="32" height="30" rx="3"></rect></g><g class="u"><rect x="408" y="160" width="32" height="30" rx="3"></rect></g><g class="u"><rect x="446" y="160" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="484" y="160" width="32" height="30" rx="3"></rect></g><g class="u"><rect x="522" y="160" width="32" height="30" rx="3"></rect></g><g class="u"><rect x="560" y="160" width="32" height="30" rx="3"></rect></g><g class="u"><rect x="598" y="160" width="32" height="30" rx="3"></rect></g><text class="cap" x="40" y="260" text-anchor="start">Both loops read twelve values and do identical arithmetic. The second touches four times as</text><text class="cap" x="40" y="280" text-anchor="start">many blocks and throws most of each away.</text><text class="cap" x="40" y="316" text-anchor="start">At a stride of thirty-two or more, every single lane lands in a different block and the waste</text><text class="cap" x="40" y="336" text-anchor="start">reaches its maximum.</text><text class="cap" x="40" y="372" text-anchor="start">Which is why the shape of a loop, and the order its indices run in, is a bandwidth decision</text><text class="cap" x="40" y="392" text-anchor="start">rather than a matter of taste.</text></svg><figcaption>The dial that turns a coalesced access into an uncoalesced one. It is set by how the loop is written, which is why this is a programming concern and not a hardware one.</figcaption></figure>
