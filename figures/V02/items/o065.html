<figure><div class='ts'>Fig 65 &nbsp;&middot;&nbsp; 10:56</div><h3>What a stride is</h3><svg viewBox='0 0 680 464' role="img"><title>What a stride is</title><text class="hd" x="40" y="46">Stride: how far apart the requested numbers are</text><text class="cap" x="40" y="92" text-anchor="start">stride 1</text><text class="sub2" x="40" y="112" text-anchor="start">consecutive</text><g class="s"><rect x="180" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="218" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="256" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="294" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="332" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="370" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="408" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="446" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="484" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="522" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="560" y="76" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="598" y="76" width="32" height="30" rx="3"></rect></g><text class="cap" x="40" y="176" text-anchor="start">stride 4</text><text class="sub2" x="40" y="196" text-anchor="start">every fourth</text><g class="s"><rect x="180" y="160" width="32" height="30" rx="3"></rect></g><g class="u"><rect x="218" y="160" width="32" height="30" rx="3"></rect></g><g class="u"><rect x="256" y="160" width="32" height="30" rx="3"></rect></g><g class="u"><rect x="294" y="160" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="332" y="160" width="32" height="30" rx="3"></rect></g><g class="u"><rect x="370" y="160" width="32" height="30" rx="3"></rect></g><g class="u"><rect x="408" y="160" width="32" height="30" rx="3"></rect></g><g class="u"><rect x="446" y="160" width="32" height="30" rx="3"></rect></g><g class="s"><rect x="484" y="160" width="32" height="30" rx="3"></rect></g><g class="u"><rect x="522" y="160" width="32" height="30" rx="3"></rect></g><g class="u"><rect x="560" y="160" width="32" height="30" rx="3"></rect></g><g class="u"><rect x="598" y="160" width="32" height="30" rx="3"></rect></g><text class="cap" x="40" y="260" text-anchor="start">Both rows read numbers for the same arithmetic. For a whole warp of 32 lanes, stride 1</text><text class="cap" x="40" y="280" text-anchor="start">touches 4 sectors and stride 4 touches 16: four times the bytes, most of them thrown</text><text class="cap" x="40" y="300" text-anchor="start">away.</text><text class="cap" x="40" y="340" text-anchor="start">At a stride of 8 four-byte numbers, 32 bytes, every lane lands in its own sector and the</text><text class="cap" x="40" y="360" text-anchor="start">waste reaches its maximum: 32 sectors, 1,024 bytes moved for 128 used. Larger strides</text><text class="cap" x="40" y="380" text-anchor="start">spread the lanes over more cache lines, but move no more bytes.</text><text class="cap" x="40" y="420" text-anchor="start">Which is why the shape of a loop, and the order its indices run in, is a bandwidth</text><text class="cap" x="40" y="440" text-anchor="start">decision rather than a matter of taste.</text></svg><figcaption>The dial that turns a coalesced access into an uncoalesced one. It is set by how the loop is written, which is why this is a programming concern and not a hardware one.</figcaption></figure>
