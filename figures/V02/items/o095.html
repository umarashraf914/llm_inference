<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 17:48</div><h3>NVLink is not standing still</h3><svg viewBox='0 0 680 470' role='img'><title>NVLink is not standing still</title><text class="hd" x="40" y="46">Each GPU's own memory against its NVLink, each way, in GB/s (to scale)</text><text class="cap" x="40" y="80" text-anchor="start">A100</text><text class="sub2" x="40" y="97" text-anchor="start">2020</text><g class="s"><rect x="170.0" y="64.0" width="102.0" height="22.0" rx="3"/></g><text class="sub2" x="279.9" y="80" text-anchor="start">HBM 2,039</text><g class="m"><rect x="170.0" y="92.0" width="15.0" height="22.0" rx="3"/></g><text class="sub2" x="193.0" y="108" text-anchor="start">NVLink 300 each way, 600 both: HBM is 6.8× faster</text><text class="cap" x="40" y="154" text-anchor="start">H100</text><text class="sub2" x="40" y="171" text-anchor="start">2022</text><g class="s"><rect x="170.0" y="138.0" width="167.6" height="22.0" rx="3"/></g><text class="sub2" x="345.6" y="154" text-anchor="start">HBM 3,352</text><g class="m"><rect x="170.0" y="166.0" width="22.5" height="22.0" rx="3"/></g><text class="sub2" x="200.5" y="182" text-anchor="start">NVLink 450 each way, 900 both: HBM is 7.4× faster</text><text class="cap" x="40" y="228" text-anchor="start">B200</text><text class="sub2" x="40" y="245" text-anchor="start">2024</text><g class="s"><rect x="170.0" y="212.0" width="400.0" height="22.0" rx="3"/></g><text class="sub2" x="578.0" y="228" text-anchor="start">HBM 8,000</text><g class="m"><rect x="170.0" y="240.0" width="45.0" height="22.0" rx="3"/></g><text class="sub2" x="223.0" y="256" text-anchor="start">NVLink 900 each way, 1,800 both: HBM is 8.9× faster</text><text class="cap" x="40" y="306" text-anchor="start">NVLink per GPU has tripled in two generations: 600 GB/s on the A100, 900 on the H100,</text><text class="cap" x="40" y="326" text-anchor="start">1.8 TB/s on Blackwell. Those quoted figures add both directions; each way it is 300, 450</text><text class="cap" x="40" y="346" text-anchor="start">and 900.</text><text class="cap" x="40" y="386" text-anchor="start">HBM grew as well, so the gap has held: a GPU reads its own memory 6.8, 7.4 and 8.9 times</text><text class="cap" x="40" y="406" text-anchor="start">faster than it can receive from a neighbour, or 3.4, 3.7 and 4.4 times against the</text><text class="cap" x="40" y="426" text-anchor="start">quoted two-way figures. Not an order of magnitude, but enough that moving data between</text><text class="cap" x="40" y="446" text-anchor="start">GPUs is never free.</text></svg><figcaption>Bars to scale. HBM from the A100 80 GB datasheet, the H100 whitepaper and the DGX B200 specifications; NVLink from the H100 whitepaper and NVIDIA's NVLink page, whose per-GPU figures count both directions.</figcaption></figure>
