<figure><div class='ts'>Fig 95 &nbsp;&middot;&nbsp; 17:48</div><h3>NVLink is not standing still</h3><svg viewBox="0 0 680 286" role="img"><title>NVLink is not standing still</title><text class="cap" x="40" y="79" text-anchor="start">A100</text><g class="s"><rect x="160" y="59" width="133.2" height="36" rx="4"></rect></g><text class="sub2" x="303.2" y="79" text-anchor="start">600 GB/s</text><text class="cap" x="40" y="133" text-anchor="start">H100</text><g class="s"><rect x="160" y="113" width="199.8" height="36" rx="4"></rect></g><text class="sub2" x="369.8" y="133" text-anchor="start">900 GB/s</text><text class="cap" x="40" y="187" text-anchor="start">Blackwell</text><g class="s"><rect x="160" y="167" width="399.6" height="36" rx="4"></rect></g><text class="sub2" x="569.6" y="187" text-anchor="start">1.8 TB/s</text><text class="cap" x="40" y="244" text-anchor="start">NVLink per GPU, generation by generation. It is fast and getting faster, and it still sits</text><text class="cap" x="40" y="264" text-anchor="start">roughly an order of magnitude behind HBM bandwidth on the same chip.</text></svg><figcaption>Fast enough to make splitting a model across a node practical, slow enough that where you split it matters enormously.</figcaption></figure>
