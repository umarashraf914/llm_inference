="96" x2="273" y2="124" marker-end="url(#arw)"></line><g class="u"><rect x="568" y="60" width="50" height="34" rx="4"></rect><text class="sub" x="593.0" y="77.0" text-anchor="middle" dominant-baseline="central">t3</text></g><line class="conn" x1="593" y1="96" x2="593" y2="124" marker-end="url(#arw)"></line><g class="s"><rect x="62" y="126" width="236" height="40" rx="3"></rect><text class="sub" x="180.0" y="146.0" text-anchor="middle" dominant-baseline="central">four sectors, every byte wanted</text></g><g class="h"><rect x="382" y="126" width="50" height="40" rx="4"></rect></g><g class="s"><rect x="382" y="126" width="6.25" height="40" rx="1"></rect></g><g class="h"><rect x="444" y="126" width="50" height="40" rx="4"></rect></g><g class="s"><rect x="444" y="126" width="6.25" height="40" rx="1"></rect></g><g class="h"><rect x="506" y="126" width="50" height="40" rx="4"></rect></g><g class="s"><rect x="506" y="126" width="6.25" height="40" rx="1"></rect></g><g class="h"><rect x="568" y="126" width="50" height="40" rx="4"></rect></g><g class="s"><rect x="568" y="126" width="6.25" height="40" rx="1"></rect></g><text class="cap" x="40" y="196" text-anchor="start">Each lane on the right drags in a whole 32-byte sector for its 4 bytes. The teal sliver,</text><text class="cap" x="40" y="216" text-anchor="start">one eighth of each block, is the part anybody asked for; the rest is hauled across the</text><text class="cap" x="40" y="236" text-anchor="start">bus and thrown away.</text></svg><figcaption>Slivers drawn at their true eighth. The direct ancestor of the next atlas, on kernels: FlashAttention is in large part an exercise in making every fetched byte count.</figcaption></figure>
