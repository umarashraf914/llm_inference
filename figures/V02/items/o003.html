<figure><div class='ts'>Fig 03 &nbsp;&middot;&nbsp; 0:00</div><h3>Instructions, cycles and threads</h3><svg viewBox="0 0 680 392" role="img"><title>Instructions, cycles and threads</title><text class="hd" x="40" y="46">An instruction is one thing the chip is told to do</text><g class="m"><rect x="60" y="66" width="170" height="34" rx="4"></rect><text class="sub" x="145.0" y="83.0" text-anchor="middle" dominant-baseline="central">add these two</text></g><g class="m"><rect x="244" y="66" width="170" height="34" rx="4"></rect><text class="sub" x="329.0" y="83.0" text-anchor="middle" dominant-baseline="central">fetch that number</text></g><g class="m"><rect x="428" y="66" width="190" height="34" rx="4"></rect><text class="sub" x="523.0" y="83.0" text-anchor="middle" dominant-baseline="central">jump somewhere else</text></g><text class="hd" x="40" y="148">A clock cycle is one tick, and one tick is when work happens</text><line class="axis" x1="60" y1="210" x2="620" y2="210"></line><line class="tick" x1="60" y1="202" x2="60" y2="218"></line><line class="tick" x1="100" y1="202" x2="100" y2="218"></line><line class="tick" x1="140" y1="202" x2="140" y2="218"></line><line class="tick" x1="180" y1="202" x2="180" y2="218"></line><line class="tick" x1="220" y1="202" x2="220" y2="218"></line><line class="tick" x1="260" y1="202" x2="260" y2="218"></line><line class="tick" x1="300" y1="202" x2="300" y2="218"></line><line class="tick" x1="340" y1="202" x2="340" y2="218"></line><line class="tick" x1="380" y1="202" x2="380" y2="218"></line><line class="tick" x1="420" y1="202" x2="420" y2="218"></line><line class="tick" x1="460" y1="202" x2="460" y2="218"></line><line class="tick" x1="500" y1="202" x2="500" y2="218"></line><line class="tick" x1="540" y1="202" x2="540" y2="218"></line><line class="tick" x1="580" y1="202" x2="580" y2="218"></line><text class="sub2" x="60" y="244" text-anchor="start">a modern chip ticks well over a billion times a second</text><text class="cap" x="40" y="294" text-anchor="start">So a cycle is under a nanosecond, a billionth of a second. When a later figure says a memory</text><text class="cap" x="40" y="314" text-anchor="start">access costs hundreds of cycles, it means hundreds of these ticks spent doing nothing else.</text><text class="cap" x="40" y="350" text-anchor="start">A thread is simply a sequence of instructions being worked through, one after another. A chip</text><text class="cap" x="40" y="370" text-anchor="start">that runs many threads is working through many such sequences at the same time.</text></svg><figcaption>Three words the rest of the document leans on without explanation. A cycle is the unit of time at this scale, the way a second is at ours.</figcaption></figure>
