<figure><div class='ts'>Fig 04 &nbsp;&middot;&nbsp; 0:00</div><h3>Two numbers predict the token rate</h3><svg viewBox="0 0 680 266" role="img"><title>Two numbers predict the token rate</title><g class="m"><rect x="60" y="55" width="235" height="62" rx="8"></rect><text class="lbl" x="177.5" y="77.0" text-anchor="middle" dominant-baseline="central">Arithmetic rate</text><text class="sub" x="177.5" y="95.0" text-anchor="middle" dominant-baseline="central">operations per second</text></g><g class="h"><rect x="385" y="55" width="235" height="62" rx="8"></rect><text class="lbl" x="502.5" y="77.0" text-anchor="middle" dominant-baseline="central">Memory bandwidth</text><text class="sub" x="502.5" y="95.0" text-anchor="middle" dominant-baseline="central">bytes per second</text></g><g class="u"><rect x="230" y="152" width="220" height="52" rx="8"></rect><text class="lbl" x="340.0" y="178.0" text-anchor="middle" dominant-baseline="central">Tokens per second</text></g><line class="conn" x1="178" y1="119" x2="300" y2="148" marker-end="url(#arw)"></line><line class="conn" x1="502" y1="119" x2="380" y2="148" marker-end="url(#arw)"></line><text class="cap" x="40" y="244" text-anchor="start">Under 1% of a decode step goes to arithmetic. The other 99% is the chip waiting for weights.</text></svg><figcaption>Two hardware numbers, and the ratio between them, decide almost everything about inference speed. This document is about where those two numbers come from.</figcaption></figure>
