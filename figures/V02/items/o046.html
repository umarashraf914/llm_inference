y="3 3"></rect><text class="sub2" x="310.0" y="312.0" text-anchor="middle" dominant-baseline="central">idle</text><g class="s"><rect x="345" y="294" width="50" height="36" rx="5"></rect></g><g class="s"><rect x="405" y="294" width="50" height="36" rx="5"></rect></g><g class="s"><rect x="465" y="294" width="50" height="36" rx="5"></rect></g><g class="s"><rect x="525" y="294" width="50" height="36" rx="5"></rect></g><text class="cap" x="40" y="378" text-anchor="start">There is only one instruction stream, so the hardware cannot run both branches at once. It</text><text class="cap" x="40" y="398" text-anchor="start">runs them back to back, masking off half the lanes in each pass.</text></svg><figcaption>Each lane sits idle through the half it skipped, so a balanced if/else halves throughput.</figcaption></figure>
