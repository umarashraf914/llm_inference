<figure><div class='ts'>Fig 02 &nbsp;&middot;&nbsp; 0:00</div><h3>What a chip is made of</h3><svg viewBox="0 0 680 382" role="img"><title>What a chip is made of</title><text class="hd" x="40" y="46">A chip is a slab of silicon covered in switches</text><g class="u"><rect x="40" y="66" width="600" height="128" rx="14"></rect><text class="lbl" x="62" y="92">One transistor</text></g><g class="s"><rect x="66" y="122" width="150" height="46" rx="4"></rect><text class="sub" x="141.0" y="145.0" text-anchor="middle" dominant-baseline="central">a wire in</text></g><line class="conn" x1="222" y1="145" x2="246" y2="145" marker-end="url(#arw)"></line><g class="m"><rect x="252" y="122" width="160" height="46" rx="4"></rect><text class="sub" x="332.0" y="145.0" text-anchor="middle" dominant-baseline="central">a switch</text></g><line class="conn" x1="418" y1="145" x2="442" y2="145" marker-end="url(#arw)"></line><g class="s"><rect x="448" y="122" width="166" height="46" rx="4"></rect><text class="sub" x="531.0" y="145.0" text-anchor="middle" dominant-baseline="central">on, or off</text></g><text class="cap" x="40" y="248" text-anchor="start">That is the entire building block. A transistor lets current through, or does not, depending</text><text class="cap" x="40" y="268" text-anchor="start">on a control voltage. It is a tap with no in-between position.</text><text class="cap" x="40" y="304" text-anchor="start">Wire a handful together and you can build a circuit that adds two numbers. Wire eighty billion</text><text class="cap" x="40" y="324" text-anchor="start">of them together and you have a modern GPU.</text><text class="cap" x="40" y="360" text-anchor="start">Everything in this document is made of nothing but these.</text></svg><figcaption>Worth thirty seconds, because the phrase silicon budget appears constantly below and it means literally this: how many transistors, spent on what.</figcaption></figure>
