<figure><div class='ts'>Fig 51 &nbsp;&middot;&nbsp; 7:46</div><h3>The four rungs</h3><svg viewBox="0 0 680 342" role="img"><title>The four rungs</title><text class="cap" x="40" y="68" text-anchor="start">Registers</text><text class="sub2" x="40" y="88" text-anchor="start">256 KB per SM</text><g class="s"><rect x="310" y="52" width="16.329598612473983" height="40" rx="4"></rect></g><text class="sub2" x="336.329598612474" y="74" text-anchor="start">single cycle</text><text class="cap" x="40" y="126" text-anchor="start">SRAM: shared memory + L1</text><text class="sub2" x="40" y="146" text-anchor="start">up to 228 KB per SM</text><g class="s"><rect x="310" y="110" width="14.317393880018159" height="40" rx="4"></rect></g><text class="sub2" x="334.31739388001813" y="132" text-anchor="start">a few nanoseconds</text><text class="cap" x="40" y="184" text-anchor="start">L2 cache</text><text class="sub2" x="40" y="204" text-anchor="start">50 MB, all 132 SMs</text><g class="u"><rect x="310" y="168" width="108.37079843903322" height="40" rx="4"></rect></g><text class="sub2" x="428.37079843903325" y="190" text-anchor="start">tens of nanoseconds</text><text class="cap" x="40" y="242" text-anchor="start">HBM</text><text class="sub2" x="40" y="262" text-anchor="start">80 GB at 3.35 TB/s</text><g class="h"><rect x="310" y="226" width="236.9475960108627" height="40" rx="4"></rect></g><text class="sub2" x="556.9475960108628" y="248" text-anchor="start">hundreds of cycles</text><text class="cap" x="40" y="300" text-anchor="start">Bar length is capacity on a log scale; registers to HBM is a ratio of about 320,000 to one.</text><text class="cap" x="40" y="320" text-anchor="start">Capacity grows going down. Bandwidth and latency run the other way.</text></svg><figcaption>That inversion is the whole point of a hierarchy, and it traces directly back to the SRAM and DRAM cells in Part 2.</figcaption></figure>
