<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 7:46</div><h3>The four rungs</h3><svg viewBox='0 0 680 478' role='img'><title>The four rungs</title><text class="hd" x="40" y="46">Capacity of each rung, summed over the whole chip (log axis)</text><text class="cap" x="40" y="80" text-anchor="start">registers</text><text class="sub2" x="40" y="98" text-anchor="start">256 KB in each SM</text><g class="s"><rect x="200.0" y="64.0" width="92.3" height="30.0" rx="3"/></g><text class="sub2" x="302.34683118945065" y="84" text-anchor="start">34.6 MB</text><text class="cap" x="40" y="132" text-anchor="start">L1 and shared</text><text class="sub2" x="40" y="150" text-anchor="start">256 KB in each SM</text><g class="s"><rect x="200.0" y="116.0" width="92.3" height="30.0" rx="3"/></g><text class="sub2" x="302.34683118945065" y="136" text-anchor="start">34.6 MB</text><text class="cap" x="40" y="184" text-anchor="start">L2</text><text class="sub2" x="40" y="202" text-anchor="start">one, for all 132 SMs</text><g class="u"><rect x="200.0" y="168.0" width="103.2" height="30.0" rx="3"/></g><text class="sub2" x="313.1741950569386" y="188" text-anchor="start">52.4 MB</text><text class="cap" x="40" y="236" text-anchor="start">HBM</text><text class="sub2" x="40" y="254" text-anchor="start">beside the die</text><g class="h"><rect x="200.0" y="220.0" width="296.0" height="30.0" rx="3"/></g><text class="sub2" x="506.03939141468277" y="240" text-anchor="start">80 GB</text><line class="axis" x1="200" y1="278" x2="560" y2="278"/><line class="tick" x1="200.0" y1="278" x2="200.0" y2="283"/><text class="sub2" x="200.0" y="298" text-anchor="middle">1 MB</text><line class="tick" x1="380.0" y1="278" x2="380.0" y2="283"/><text class="sub2" x="380.0" y="298" text-anchor="middle">1 GB</text><line class="tick" x1="560.0" y1="278" x2="560.0" y2="283"/><text class="sub2" x="560.0" y="298" text-anchor="middle">1 TB</text><text class="cap" x="40" y="334" text-anchor="start">Four rungs. Counted across the whole chip, the registers hold 34.6 million bytes and HBM</text><text class="cap" x="40" y="354" text-anchor="start">holds 80 GB, about 2,500 times as much. Each step down is bigger, further from the</text><text class="cap" x="40" y="374" text-anchor="start">arithmetic and slower.</text><text class="cap" x="40" y="414" text-anchor="start">The registers and the 256 KB of L1 and shared memory are inside each multiprocessor; the</text><text class="cap" x="40" y="434" text-anchor="start">L2 is shared by all 132; HBM is the separate memory stacked beside the die. Latency and</text><text class="cap" x="40" y="454" text-anchor="start">bandwidth for each rung follow below.</text></svg><figcaption>Bar length is capacity on a log scale, for the whole chip. That capacity grows as speed falls is the whole point of a ladder, and it traces back to the SRAM and DRAM cells of Part 6.</figcaption></figure>
