<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 19:21</div><h3>A systolic array, beat by beat</h3><div class='wg'><div class='ctl'><button type='button'>Back a beat</button><button type='button'>Next beat</button><button type='button'>Reset</button></div><svg viewBox='0 0 680 696' role='img'><title>A systolic array, beat by beat</title><text class="hd" x="40" y="36">Weights held in the cells; A's numbers move right, running sums move down</text><text class="sub2" x="76" y="82" text-anchor="start">rows of A, fed in on a slant</text><text class="sub2" x="260" y="82" text-anchor="start">B's weights, one to a cell</text><g class="s" data-q="0-0"><rect x="220" y="112" width="30" height="26" rx="3"/><text class="sub" x="235" y="125" text-anchor="middle" dominant-baseline="central">2</text></g><g class="s" data-q="0-1"><rect x="184" y="112" width="30" height="26" rx="3"/><text class="sub" x="199" y="125" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s" data-q="0-2"><rect x="148" y="112" width="30" height="26" rx="3"/><text class="sub" x="163" y="125" text-anchor="middle" dominant-baseline="central">3</text></g><g class="s" data-q="0-3" style="display:none"><rect x="112" y="112" width="30" height="26" rx="3"/><text class="sub" x="127" y="125" text-anchor="middle" dominant-baseline="central"></text></g><g class="s" data-q="0-4" style="display:none"><rect x="76" y="112" width="30" height="26" rx="3"/><text class="sub" x="91" y="125" text-anchor="middle" dominant-baseline="central"></text></g><g class="u" data-cell="0-0"><rect x="260" y="96" width="108" height="58" rx="6"/><text class="lbl" x="314" y="116" text-anchor="middle" dominant-baseline="central">weight 1</text><text class="sub" x="314" y="136" text-anchor="middle" dominant-baseline="central" data-calc="0-0">idle</text></g><g class="u" data-cell="0-1"><rect x="380" y="96" width="108" height="58" rx="6"/><text class="lbl" x="434" y="116" text-anchor="middle" dominant-baseline="central">weight 2</text><text class="sub" x="434" y="136" text-anchor="middle" dominant-baseline="central" data-calc="0-1">idle</text></g><g class="u" data-cell="0-2"><rect x="500" y="96" width="108" height="58" rx="6"/><text class="lbl" x="554" y="116" text-anchor="middle" dominant-baseline="central">weight 1</text><text class="sub" x="554" y="136" text-anchor="middle" dominant-baseline="central" data-calc="0-2">idle</text></g><g class="s" data-q="1-0" style="display:none"><rect x="220" y="182" width="30" height="26" rx="3"/><text class="sub" x="235" y="195" text-anchor="middle" dominant-baseline="central"></text></g><g class="s" data-q="1-1"><rect x="184" y="182" width="30" height="26" rx="3"/><text class="sub" x="199" y="195" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s" data-q="1-2"><rect x="148" y="182" width="30" height="26" rx="3"/><text class="sub" x="163" y="195" text-anchor="middle" dominant-baseline="central">4</text></g><g class="s" data-q="1-3"><rect x="112" y="182" width="30" height="26" rx="3"/><text class="sub" x="127" y="195" text-anchor="middle" dominant-baseline="central">2</text></g><g class="s" data-q="1-4" style="display:none"><rect x="76" y="182" width="30" height="26" rx="3"/><text class="sub" x="91" y="195" text-anchor="middle" dominant-baseline="central"></text></g><g class="u" data-cell="1-0"><rect x="260" y="166" width="108" height="58" rx="6"/><text class="lbl" x="314" y="186" text-anchor="middle" dominant-baseline="central">weight 3</text><text class="sub" x="314" y="206" text-anchor="middle" dominant-baseline="central" data-calc="1-0">idle</text></g><g class="u" data-cell="1-1"><rect x="380" y="166" width="108" height="58" rx="6"/><text class="lbl" x="434" y="186" text-anchor="middle" dominant-baseline="central">weight 1</text><text class="sub" x="434" y="206" text-anchor="middle" dominant-baseline="central" data-calc="1-1">idle</text></g><g class="u" data-cell="1-2"><rect x="500" y="166" width="108" height="58" rx="6"/><text class="lbl" x="554" y="186" text-anchor="middle" dominant-baseline="central">weight 2</text><text class="sub" x="554" y="206" text-anchor="middle" dominant-baseline="central" data-calc="1-2">idle</text></g><g class="s" data-q="2-0" style="display:none"><rect x="220" y="252" width="30" height="26" rx="3"/><text class="sub" x="235" y="265" text-anchor="middle" dominant-baseline="central"></text></g><g class="s" data-q="2-1" style="display:none"><rect x="184" y="252" width="30" height="26" rx="3"/><text class="sub" x="199" y="265" text-anchor="middle" dominant-baseline="central"></text></g><g class="s" data-q="2-2"><rect x="148" y="252" width="30" height="26" rx="3"/><text class="sub" x="163" y="265" text-anchor="middle" dominant-baseline="central">3</text></g><g class="s" data-q="2-3"><rect x="112" y="252" width="30" height="26" rx="3"/><text class="sub" x="127" y="265" text-anchor="middle" dominant-baseline="central">2</text></g><g class="s" data-q="2-4"><rect x="76" y="252" width="30" height="26" rx="3"/><text class="sub" x="91" y="265" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u" data-cell="2-0"><rect x="260" y="236" width="108" height="58" rx="6"/><text class="lbl" x="314" y="256" text-anchor="middle" dominant-baseline="central">weight 2</text><text class="sub" x="314" y="276" text-anchor="middle" dominant-baseline="central" data-calc="2-0">idle</text></g><g class="u" data-cell="2-1"><rect x="380" y="236" width="108" height="58" rx="6"/><text class="lbl" x="434" y="256" text-anchor="middle" dominant-baseline="central">weight 1</text><text class="sub" x="434" y="276" text-anchor="middle" dominant-baseline="central" data-calc="2-1">idle</text></g><g class="u" data-cell="2-2"><rect x="500" y="236" width="108" height="58" rx="6"/><text class="lbl" x="554" y="256" text-anchor="middle" dominant-baseline="central">weight 3</text><text class="sub" x="554" y="276" text-anchor="middle" dominant-baseline="central" data-calc="2-2">idle</text></g><text class="cap" x="40" y="337" text-anchor="start">the answer, C</text><text class="sub2" x="40" y="354" text-anchor="start">each column's, in order</text><g class="u" data-out="0-0"><rect x="264" y="320" width="32" height="24" rx="3"/><text class="sub" x="280" y="332" text-anchor="middle" dominant-baseline="central"></text></g><g class="u" data-out="1-0"><rect x="299" y="320" width="32" height="24" rx="3"/><text class="sub" x="315" y="332" text-anchor="middle" dominant-baseline="central"></text></g><g class="u" data-out="2-0"><rect x="334" y="320" width="32" height="24" rx="3"/><text class="sub" x="350" y="332" text-anchor="middle" dominant-baseline="central"></text></g><g class="u" data-out="0-1"><rect x="384" y="320" width="32" height="24" rx="3"/><text class="sub" x="400" y="332" text-anchor="middle" dominant-baseline="central"></text></g><g class="u" data-out="1-1"><rect x="419" y="320" width="32" height="24" rx="3"/><text class="sub" x="435" y="332" text-anchor="middle" dominant-baseline="central"></text></g><g class="u" data-out="2-1"><rect x="454" y="320" width="32" height="24" rx="3"/><text class="sub" x="470" y="332" text-anchor="middle" dominant-baseline="central"></text></g><g class="u" data-out="0-2"><rect x="504" y="320" width="32" height="24" rx="3"/><text class="sub" x="520" y="332" text-anchor="middle" dominant-baseline="central"></text></g><g class="u" data-out="1-2"><rect x="539" y="320" width="32" height="24" rx="3"/><text class="sub" x="555" y="332" text-anchor="middle" dominant-baseline="central"></text></g><g class="u" data-out="2-2"><rect x="574" y="320" width="32" height="24" rx="3"/><text class="sub" x="590" y="332" text-anchor="middle" dominant-baseline="central"></text></g><text class="sub2" x="260" y="368" data-read="">0 of 7 beats done: 0 of 27 multiply-adds</text><text class="cap" x="40" y="412" text-anchor="start">Each cell holds one weight of B and does one multiply-add a beat: the running sum</text><text class="cap" x="40" y="432" text-anchor="start">arriving from above, plus the number of A arriving from the left times its weight. It</text><text class="cap" x="40" y="452" text-anchor="start">passes the sum down and the number right, and out of the bottom of each column falls a</text><text class="cap" x="40" y="472" text-anchor="start">finished entry of C.</text><text class="cap" x="40" y="512" text-anchor="start">Each row of A goes in on a slant, one number a beat into each row of cells, so that</text><text class="cap" x="40" y="532" text-anchor="start">every number meets its partial sum at the right cell on the right beat. Step through:</text><text class="cap" x="40" y="552" text-anchor="start">the 27 multiply-adds take 3 × 3 − 2 = 7 beats, and every number of A is used by three</text><text class="cap" x="40" y="572" text-anchor="start">cells, every weight by three rows, without a trip back to memory.</text><text class="cap" x="40" y="612" text-anchor="start">Google describes its TPU this way: weights loaded into the array, data streamed through,</text><text class="cap" x="40" y="632" text-anchor="start">each result passed to the next cell. Before TPU v6e its arrays are 128 × 128, 16,384</text><text class="cap" x="40" y="652" text-anchor="start">multiply-adds every beat, in bfloat16 with FP32 sums. The page's arithmetic was checked</text><text class="cap" x="40" y="672" text-anchor="start">against Python at every beat.</text></svg></div><figcaption>A 3 × 3 array computing C = A × B with B's weights held in place, so nothing goes back to a register file between multiply-adds. It is the reuse of a tile ({{ref:v02-p25}}) built into the wiring. TPU details from Google Cloud's TPU architecture page.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const A = [[2, 1, 3], [1, 4, 2], [3, 2, 1]], B = [[1, 2, 1], [3, 1, 2], [2, 1, 3]], C = [[11, 8, 13], [17, 8, 15], [11, 9, 10]], N = A.length, T = 3 * N - 2, SL = 2 * N - 1;
  const q = s => fig.querySelector(s), [back, step, reset] = fig.querySelectorAll('button');
  let s = 0;
  function draw() {
    for (let k = 0; k < N; k++) for (let j = 0; j < N; j++) {
      const i = s - 1 - j - k, g = q(`[data-cell="${k}-${j}"]`), t = q(`[data-calc="${k}-${j}"]`);
      if (s > 0 && i >= 0 && i < N) {
        let sin = 0; for (let kk = 0; kk < k; kk++) sin += A[i][kk] * B[kk][j];
        t.textContent = `${sin} + ${A[i][k]}×${B[k][j]} = ${sin + A[i][k] * B[k][j]}`; g.setAttribute('class', 'm');
      } else { t.textContent = 'idle'; g.setAttribute('class', 'u'); }
    }
    for (let k = 0; k < N; k++) for (let m = 0; m < SL; m++) {
      const g = q(`[data-q="${k}-${m}"]`), i = m + s - k;
      if (i >= 0 && i < N) { g.style.display = ''; g.querySelector('text').textContent = A[i][k]; }
      else g.style.display = 'none';
    }
    let macs = 0;
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      for (let k = 0; k < N; k++) if (i + j + k <= s - 1) macs++;
      const g = q(`[data-out="${i}-${j}"]`), done = i + j + 2 <= s - 1;
      g.setAttribute('class', done ? 's' : 'u'); g.querySelector('text').textContent = done ? C[i][j] : '';
    }
    q('[data-read]').textContent = `${s} of ${T} beats done: ${macs} of ${N ** 3} multiply-adds`;
    back.disabled = s === 0; step.disabled = s === T;
  }
  back.addEventListener('click', () => { if (s > 0) { s--; draw(); } });
  step.addEventListener('click', () => { if (s < T) { s++; draw(); } });
  reset.addEventListener('click', () => { s = 0; draw(); });
  draw();
})();</script></figure>
