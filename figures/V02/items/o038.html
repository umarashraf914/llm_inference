 class="s"><rect x="492" y="166" width="30" height="24" rx="3"/><text class="sub" x="507.0" y="178.0" text-anchor="middle" dominant-baseline="central">76</text></g><line class="conn" x1="340" y1="86" x2="543" y2="126"/><g class="m"><rect x="530" y="128" width="26" height="30" rx="3"/></g><g class="s"><rect x="528" y="166" width="30" height="24" rx="3"/><text class="sub" x="543.0" y="178.0" text-anchor="middle" dominant-baseline="central">77</text></g><line class="conn" x1="340" y1="86" x2="579" y2="126"/><g class="m"><rect x="566" y="128" width="26" height="30" rx="3"/></g><g class="s"><rect x="564" y="166" width="30" height="24" rx="3"/><text class="sub" x="579.0" y="178.0" text-anchor="middle" dominant-baseline="central">78</text></g><line class="conn" x1="340" y1="86" x2="615" y2="126"/><g class="m"><rect x="602" y="128" width="26" height="30" rx="3"/></g><g class="s"><rect x="600" y="166" width="30" height="24" rx="3"/><text class="sub" x="615.0" y="178.0" text-anchor="middle" dominant-baseline="central">79</text></g><text class="sub2" x="40" y="212" text-anchor="start">lanes of warp 2; under each, the i it works on</text><text class="cap" x="40" y="250" text-anchor="start">Fetched once, decoded once, fired across all 32 lanes in lockstep. Every lane runs the</text><text class="cap" x="40" y="270" text-anchor="start">same add; lane k of this warp adds element 64 + k, the number its own thread index</text><text class="cap" x="40" y="290" text-anchor="start">picked out.</text><text class="cap" x="40" y="330" text-anchor="start">Sixteen lanes are drawn for legibility. All 32 execute the same instruction at the same</text><text class="cap" x="40" y="350" text-anchor="start">moment. This is called SIMT: single instruction, multiple threads.</text></svg><figcaption>The threads are not independent programs; they are lanes of one program, each pointed at its own data by its index.</figcaption></figure>
