<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 13:46</div><h3>Intensity, worked for two real operations</h3><svg viewBox='0 0 680 430' role='img'><title>Intensity, worked for two real operations</title><text class="hd" x="40" y="46">Two operations at 16 bits, against the H100's ridge (log axis)</text><text class="cap" x="40" y="88" text-anchor="start">adding two arrays</text><text class="sub2" x="40" y="106" text-anchor="start">c[i] = a[i] + b[i]</text><g class="h"><rect x="230.0" y="74.0" width="43.2" height="28.0" rx="3"/></g><text class="sub2 halo" x="281.1749963235906" y="93" text-anchor="start">0.17 per byte</text><text class="cap" x="40" y="144" text-anchor="start">multiplying two matrices</text><text class="sub2" x="40" y="162" text-anchor="start">1,024 × 1,024 each</text><g class="s"><rect x="230.0" y="130.0" width="316.6" height="28.0" rx="3"/></g><text class="sub2 halo" x="554.5971994775193" y="149" text-anchor="start">341 per byte</text><line class="axis" x1="230" y1="190" x2="610" y2="190"/><line class="tick" x1="254.9" y1="190" x2="254.9" y2="195"/><text class="sub2" x="254.9" y="209" text-anchor="middle">0.1</text><line class="tick" x1="337.4" y1="190" x2="337.4" y2="195"/><text class="sub2" x="337.4" y="209" text-anchor="middle">1</text><line class="tick" x1="420.0" y1="190" x2="420.0" y2="195"/><text class="sub2" x="420.0" y="209" text-anchor="middle">10</text><line class="tick" x1="502.6" y1="190" x2="502.6" y2="195"/><text class="sub2" x="502.6" y="209" text-anchor="middle">100</text><line class="tick" x1="585.1" y1="190" x2="585.1" y2="195"/><text class="sub2" x="585.1" y="209" text-anchor="middle">1,000</text><line class="mark xok" x1="541.3860318116746" y1="66" x2="541.3860318116746" y2="190"/><text class="sub2" x="541.4" y="60" text-anchor="middle">ridge 295</text><text class="cap" x="40" y="246" text-anchor="start">Adding two arrays reads two numbers and writes one for each addition: 6 bytes per</text><text class="cap" x="40" y="266" text-anchor="start">operation at 2 bytes a number, 0.17 operations per byte.</text><text class="cap" x="40" y="306" text-anchor="start">Multiplying two 1,024 × 1,024 matrices does 2 × 1,024³ = 2,147,483,648 operations on</text><text class="cap" x="40" y="326" text-anchor="start">3 × 1,024² numbers, if each is read or written only once, the best case that tiling</text><text class="cap" x="40" y="346" text-anchor="start">approaches: 6,291,456 bytes, 341 operations per byte, just right of the ridge.</text><text class="cap" x="40" y="386" text-anchor="start">Two thousand times apart, and neither number depends on the chip. The chip only decides</text><text class="cap" x="40" y="406" text-anchor="start">where the ridge falls; which side you land on was settled by the mathematics.</text></svg><figcaption>Computed from the shapes, not measured. Precision moves intensity too: at 32 bits every number takes twice the bytes, and both intensities halve.</figcaption></figure>
