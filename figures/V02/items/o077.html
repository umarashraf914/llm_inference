<figure><div class='ts'>Fig 77 &nbsp;&middot;&nbsp; 13:40</div><h3>Intensity, worked for two real operations</h3><svg viewBox="0 0 680 406" role="img"><title>Intensity, worked for two real operations</title><text class="hd" x="40" y="46">Two real operations, and where they land</text><text class="cap" x="40" y="92" text-anchor="start">Adding two arrays</text><text class="sub2" x="40" y="112" text-anchor="start">c[i] = a[i] + b[i]</text><g class="h"><rect x="280" y="76" width="4" height="30" rx="1"></rect></g><text class="sub2" x="296" y="96" text-anchor="start">0.08 operations per byte</text><text class="cap" x="40" y="172" text-anchor="start">Multiplying two matrices</text><text class="sub2" x="40" y="192" text-anchor="start">1024 by 1024</text><g class="s"><rect x="280" y="156" width="340" height="30" rx="3"></rect><text class="sub" x="450.0" y="171.0" text-anchor="middle" dominant-baseline="central">171 operations per byte</text></g><text class="cap" x="40" y="252" text-anchor="start">The first reads three numbers and does one addition. The second reads the same operands over</text><text class="cap" x="40" y="272" text-anchor="start">and over, because every row of one meets every column of the other.</text><text class="cap" x="40" y="308" text-anchor="start">Two thousand times apart, and neither number depends on the chip. Both come from counting the</text><text class="cap" x="40" y="328" text-anchor="start">operations and the bytes in the definition of the operation itself.</text><text class="cap" x="40" y="364" text-anchor="start">The chip only decides where the ridge falls. Which side of it you land on was settled by the</text><text class="cap" x="40" y="384" text-anchor="start">mathematics before any hardware was chosen.</text></svg><figcaption>Computed from the shapes, not measured. This is why matrix multiplication is the operation modern accelerators are built around and array addition is not.</figcaption></figure>
