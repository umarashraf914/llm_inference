<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 16:00</div><h3>The generational ladder</h3><svg viewBox='0 0 680 452' role='img'><title>The generational ladder</title><text class="hd" x="40" y="46">Each generation's new, narrower tensor-core format (bar length is bits, to scale)</text><text class="cap" x="40" y="86" text-anchor="start">FP16</text><text class="sub2" x="40" y="104" text-anchor="start">2017, Volta</text><g class="m"><rect x="190" y="68" width="400" height="28" rx="4"/><text class="sub" x="390.0" y="82.0" text-anchor="middle" dominant-baseline="central">16 bits</text></g><text class="sub2" x="190" y="114" text-anchor="start">the first tensor-core format: 125 trillion a second on the V100</text><text class="cap" x="40" y="160" text-anchor="start">FP8</text><text class="sub2" x="40" y="178" text-anchor="start">2022, Hopper</text><g class="m"><rect x="190" y="142" width="200" height="28" rx="4"/><text class="sub" x="290.0" y="156.0" text-anchor="middle" dominant-baseline="central">8 bits</text></g><text class="sub2" x="190" y="188" text-anchor="start">1,978.9 trillion on the H100, 2× its 989.4 at 16 bits</text><text class="cap" x="40" y="234" text-anchor="start">FP4</text><text class="sub2" x="40" y="252" text-anchor="start">2024, Blackwell</text><g class="m"><rect x="190" y="216" width="100" height="28" rx="4"/><text class="sub" x="240.0" y="230.0" text-anchor="middle" dominant-baseline="central">4 bits</text></g><text class="sub2" x="190" y="262" text-anchor="start">9,000 trillion on the B200, 4× its 2,250 at 16 bits</text><text class="cap" x="40" y="308" text-anchor="start">Each new format halves the bits, and on the chip that introduced it the rate doubles</text><text class="cap" x="40" y="328" text-anchor="start">against 16 bits: the B200 does 2,250 trillion operations a second at 16 bits, 4,500 at 8</text><text class="cap" x="40" y="348" text-anchor="start">and 9,000 at 4.</text><text class="cap" x="40" y="388" text-anchor="start">Across generations the gain compounds with everything else that improved, more and</text><text class="cap" x="40" y="408" text-anchor="start">faster tensor cores among them: from the V100's 125 trillion at 16 bits to the B200's</text><text class="cap" x="40" y="428" text-anchor="start">9,000 trillion at 4 bits is 72 times.</text></svg><figcaption>Bar length is bits per number, to scale. The doublings are measured against 16 bits on the same chip; rates are dense, from NVIDIA's whitepapers and the HGX B200 specifications.</figcaption></figure>
