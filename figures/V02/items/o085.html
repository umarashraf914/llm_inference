<figure><div class='ts'>Fig 85 &nbsp;&middot;&nbsp; 15:55</div><h3>The generational ladder</h3><svg viewBox="0 0 680 268" role="img"><title>The generational ladder</title><text class="cap" x="40" y="73" text-anchor="start">FP16</text><text class="sub2" x="40" y="93" text-anchor="start">2017, Volta</text><g class="m"><rect x="190" y="57" width="400" height="38" rx="4"></rect></g><text class="sub2" x="600" y="79" text-anchor="start">1x throughput</text><text class="cap" x="40" y="129" text-anchor="start">FP8</text><text class="sub2" x="40" y="149" text-anchor="start">2022, Hopper</text><g class="m"><rect x="190" y="113" width="200" height="38" rx="4"></rect></g><text class="sub2" x="400" y="135" text-anchor="start">2x throughput</text><text class="cap" x="40" y="185" text-anchor="start">FP4</text><text class="sub2" x="40" y="205" text-anchor="start">2024, Blackwell</text><g class="m"><rect x="190" y="169" width="100" height="38" rx="4"></rect></g><text class="sub2" x="300" y="191" text-anchor="start">4x throughput</text><text class="cap" x="40" y="246" text-anchor="start">Each halving of the bits roughly doubles the throughput.</text></svg><figcaption>Bar length is bits per number; the multiplier beside it is throughput. Halving the width also halves the bytes moved, which is the second half of the payoff.</figcaption></figure>
