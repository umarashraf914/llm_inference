<figure><div class='ts'>Fig 98 &nbsp;&middot;&nbsp; 19:14</div><h3>A different bet: the systolic array</h3><svg viewBox='0 0 680 374' role="img"><title>A different bet: the systolic array</title><g class="u"><rect x="40" y="46" width="300" height="190" rx="14"></rect><text class="lbl" x="62" y="72">TPU</text><text class="sub" x="62" y="90">one giant systolic array</text></g><g class="m"><rect x="66" y="104" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="96" y="104" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="126" y="104" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="156" y="104" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="186" y="104" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="216" y="104" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="246" y="104" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="276" y="104" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="306" y="104" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="66" y="134" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="96" y="134" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="126" y="134" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="156" y="134" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="186" y="134" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="216" y="134" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="246" y="134" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="276" y="134" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="306" y="134" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="66" y="164" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="96" y="164" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="126" y="164" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="156" y="164" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="186" y="164" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="216" y="164" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="246" y="164" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="276" y="164" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="306" y="164" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="66" y="194" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="96" y="194" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="126" y="194" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="156" y="194" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="186" y="194" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="216" y="194" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="246" y="194" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="276" y="194" width="24" height="24" rx="2"></rect></g><g class="m"><rect x="306" y="194" width="24" height="24" rx="2"></rect></g><text class="cap" x="360" y="90" text-anchor="start">A fixed grid of multiply-accumulate</text><text class="cap" x="360" y="112" text-anchor="start">cells. Data flows in from the edges</text><text class="cap" x="360" y="134" text-anchor="start">and each cell passes its result to</text><text class="cap" x="360" y="156" text-anchor="start">its neighbour, rhythmically.</text><text class="sub2" x="360" y="192" text-anchor="start">No trips back to a register file</text><text class="sub2" x="360" y="212" text-anchor="start">between operations.</text><text class="cap" x="40" y="268" text-anchor="start">Because the operands march through the array, each value loaded is reused by many cells</text><text class="cap" x="40" y="288" text-anchor="start">before it leaves. That is a hardware answer to the same arithmetic-intensity problem tiling</text><text class="cap" x="40" y="308" text-anchor="start">solves in software.</text><text class="cap" x="40" y="330" text-anchor="start">Well suited to dense matrix multiply and not much else, and for now rentable only on</text><text class="cap" x="40" y="350" text-anchor="start">Google Cloud.</text></svg><figcaption>Worth seeing because it makes the point that the multiprocessor model is one way to organise silicon around matrix multiplication, not the only way.</figcaption></figure>
