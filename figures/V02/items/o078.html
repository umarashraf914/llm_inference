eight="34" rx="3"></rect></g><g class="m"><rect x="500" y="142" width="34" height="34" rx="3"></rect></g><g class="u"><rect x="60" y="182" width="34" height="34" rx="3"></rect></g><g class="m"><rect x="380" y="182" width="34" height="34" rx="3"></rect></g><g class="u"><rect x="100" y="182" width="34" height="34" rx="3"></rect></g><g class="m"><rect x="420" y="182" width="34" height="34" rx="3"></rect></g><g class="u"><rect x="140" y="182" width="34" height="34" rx="3"></rect></g><g class="m"><rect x="460" y="182" width="34" height="34" rx="3"></rect></g><g class="u"><rect x="180" y="182" width="34" height="34" rx="3"></rect></g><g class="m"><rect x="500" y="182" width="34" height="34" rx="3"></rect></g><text class="cap" x="40" y="258" text-anchor="start">A CUDA core multiplies two numbers and adds a third, producing one result per cycle. A tensor</text><text class="cap" x="40" y="278" text-anchor="start">core multiplies two small matrices and adds a third, producing a whole tile at once.</text><text class="cap" x="40" y="308" text-anchor="start">That operation is matrix multiply accumulate, and it is all a tensor core does.</text></svg><figcaption>Sixteen output cells drawn. The narrowness is the point: a unit that does one thing, extremely fast, with no generality to pay for.</figcaption></figure>
