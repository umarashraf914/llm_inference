<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:03</div><h3>256 KB is 65,536 registers, and 2,048 threads get 32 each</h3><svg viewBox='0 0 680 470' role='img'><title>256 KB is 65,536 registers, and 2,048 threads get 32 each</title><text class="hd" x="40" y="46">256 KB  ÷  4 bytes per register  =  65,536 registers, shared out</text><text class="sub2" x="190" y="82" text-anchor="start">registers per thread</text><text class="sub2" x="400" y="82" text-anchor="start">threads that fit</text><text class="cap" x="40" y="114" text-anchor="start">32 each</text><g class="s"><rect x="190.0" y="96.0" width="21.3" height="26.0" rx="3"/></g><text class="sub2" x="219.33333333333334" y="114" text-anchor="start">32</text><g class="m"><rect x="400.0" y="96.0" width="170.0" height="26.0" rx="3"/></g><text class="sub2" x="578.0" y="114" text-anchor="start">2,048  (100%)</text><text class="cap" x="40" y="158" text-anchor="start">64 each</text><g class="s"><rect x="190.0" y="140.0" width="42.7" height="26.0" rx="3"/></g><text class="sub2" x="240.66666666666666" y="158" text-anchor="start">64</text><g class="m"><rect x="400.0" y="140.0" width="85.0" height="26.0" rx="3"/></g><text class="sub2" x="493.0" y="158" text-anchor="start">1,024  (50%)</text><text class="cap" x="40" y="202" text-anchor="start">128 each</text><g class="s"><rect x="190.0" y="184.0" width="85.3" height="26.0" rx="3"/></g><text class="sub2" x="283.3333333333333" y="202" text-anchor="start">128</text><g class="m"><rect x="400.0" y="184.0" width="42.5" height="26.0" rx="3"/></g><text class="sub2" x="450.5" y="202" text-anchor="start">512  (25%)</text><text class="cap" x="40" y="246" text-anchor="start">255 each</text><g class="s"><rect x="190.0" y="228.0" width="170.0" height="26.0" rx="3"/></g><text class="sub2" x="368.0" y="246" text-anchor="start">255</text><g class="m"><rect x="400.0" y="228.0" width="21.2" height="26.0" rx="3"/></g><text class="sub2" x="429.25" y="246" text-anchor="start">256  (12.5%)</text><text class="cap" x="40" y="306" text-anchor="start">Each thread gets a private slice of the register file for as long as it is resident. At</text><text class="cap" x="40" y="326" text-anchor="start">32 registers a thread, all 2,048 threads fit: 2,048 × 32 = 65,536. Double the registers</text><text class="cap" x="40" y="346" text-anchor="start">and half as many threads fit; the product never changes.</text><text class="cap" x="40" y="386" text-anchor="start">The compiler decides how many registers a thread needs, up to 255. They are handed out</text><text class="cap" x="40" y="406" text-anchor="start">256 at a time per group of 32 threads, so 255 registers cost 256 a thread and leave room</text><text class="cap" x="40" y="426" text-anchor="start">for 256 threads. Fewer resident threads means fewer to switch to while others wait (Part</text><text class="cap" x="40" y="446" text-anchor="start">8).</text></svg><figcaption>Bars to scale. Registers per thread and threads per multiprocessor trade one for one: a program that hoards registers buys speed per thread with fewer threads to hide waits. Limits: NVIDIA's CUDA programming guide and occupancy calculator.</figcaption></figure>
