<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 4:48</div><h3>The copy engine is told a shape, not 512 addresses</h3><svg viewBox='0 0 680 582' role='img'><title>The copy engine is told a shape, not 512 addresses</title><text class="hd" x="40" y="46">A 64 × 64 tile of 16-bit numbers, cut from a matrix 4,096 numbers wide</text><text class="sub2" x="40" y="82" text-anchor="start">the descriptor, written once</text><g class="u"><rect x="40" y="92" width="104" height="30" rx="3"/><text class="sub" x="92.0" y="107.0" text-anchor="middle" dominant-baseline="central">start address</text></g><g class="s"><rect x="148" y="92" width="140" height="30" rx="3"/><text class="sub" x="218.0" y="107.0" text-anchor="middle" dominant-baseline="central">where row 0 begins</text></g><g class="u"><rect x="40" y="130" width="104" height="30" rx="3"/><text class="sub" x="92.0" y="145.0" text-anchor="middle" dominant-baseline="central">shape</text></g><g class="s"><rect x="148" y="130" width="140" height="30" rx="3"/><text class="sub" x="218.0" y="145.0" text-anchor="middle" dominant-baseline="central">64 rows × 64 columns</text></g><g class="u"><rect x="40" y="168" width="104" height="30" rx="3"/><text class="sub" x="92.0" y="183.0" text-anchor="middle" dominant-baseline="central">element size</text></g><g class="s"><rect x="148" y="168" width="140" height="30" rx="3"/><text class="sub" x="218.0" y="183.0" text-anchor="middle" dominant-baseline="central">2 bytes</text></g><g class="u"><rect x="40" y="206" width="104" height="30" rx="3"/><text class="sub" x="92.0" y="221.0" text-anchor="middle" dominant-baseline="central">row stride</text></g><g class="s"><rect x="148" y="206" width="140" height="30" rx="3"/><text class="sub" x="218.0" y="221.0" text-anchor="middle" dominant-baseline="central">8,192 bytes</text></g><line class="conn" x1="296" y1="164" x2="336" y2="164" marker-end="url(#arw)"/><text class="sub2" x="344" y="82" text-anchor="start">the 64 row addresses the engine works out</text><g class="u"><rect x="344" y="92" width="70" height="24" rx="3"/><text class="sub" x="379.0" y="104.0" text-anchor="middle" dominant-baseline="central">row 0</text></g><g class="s"><rect x="418" y="92" width="140" height="24" rx="3"/><text class="sub" x="488.0" y="104.0" text-anchor="middle" dominant-baseline="central">start</text></g><text class="sub2" x="566" y="109" text-anchor="start">128 bytes</text><g class="u"><rect x="344" y="122" width="70" height="24" rx="3"/><text class="sub" x="379.0" y="134.0" text-anchor="middle" dominant-baseline="central">row 1</text></g><g class="s"><rect x="418" y="122" width="140" height="24" rx="3"/><text class="sub" x="488.0" y="134.0" text-anchor="middle" dominant-baseline="central">start + 8,192</text></g><text class="sub2" x="566" y="139" text-anchor="start">128 bytes</text><g class="u"><rect x="344" y="152" width="70" height="24" rx="3"/><text class="sub" x="379.0" y="164.0" text-anchor="middle" dominant-baseline="central">row 2</text></g><g class="s"><rect x="418" y="152" width="140" height="24" rx="3"/><text class="sub" x="488.0" y="164.0" text-anchor="middle" dominant-baseline="central">start + 16,384</text></g><text class="sub2" x="566" y="169" text-anchor="start">128 bytes</text><text class="sub2" x="344" y="200" text-anchor="start">… 60 more rows …</text><g class="u"><rect x="344" y="212" width="70" height="24" rx="3"/><text class="sub" x="379.0" y="224.0" text-anchor="middle" dominant-baseline="central">row 63</text></g><g class="s"><rect x="418" y="212" width="140" height="24" rx="3"/><text class="sub" x="488.0" y="224.0" text-anchor="middle" dominant-baseline="central">start + 516,096</text></g><text class="sub2" x="566" y="229" text-anchor="start">128 bytes</text><text class="hd" x="40" y="288">Who issues what</text><text class="cap" x="40" y="320" text-anchor="start">without the engine</text><g class="h"><rect x="180" y="302" width="460" height="28" rx="3"/><text class="sub" x="410.0" y="316.0" text-anchor="middle" dominant-baseline="central">128 threads × 4 copies of 16 bytes = 512 instructions, each with its own address</text></g><text class="cap" x="40" y="360" text-anchor="start">with the engine</text><g class="s"><rect x="180" y="342" width="460" height="28" rx="3"/><text class="sub" x="410.0" y="356.0" text-anchor="middle" dominant-baseline="central">1 thread issues 1 instruction carrying the descriptor</text></g><text class="cap" x="40" y="418" text-anchor="start">The program describes the tile once: where it starts, its shape, how big each number is,</text><text class="cap" x="40" y="438" text-anchor="start">and how far apart its rows sit in memory (4,096 numbers × 2 bytes = 8,192 bytes). The</text><text class="cap" x="40" y="458" text-anchor="start">copy engine generates every row address itself and moves each 128-byte row into shared</text><text class="cap" x="40" y="478" text-anchor="start">memory in the background.</text><text class="cap" x="40" y="518" text-anchor="start">Without it, as on the A100, the block's own threads work out every address and issue</text><text class="cap" x="40" y="538" text-anchor="start">every copy: 8,192 bytes in 16-byte pieces is 512 copy instructions, 4 for each of 128</text><text class="cap" x="40" y="558" text-anchor="start">threads, each one an issue slot not spent on arithmetic.</text></svg><figcaption>Describing a shape instead of listing addresses lets loading overlap computing completely: the threads hand over one instruction and go back to their maths. TMA details: NVIDIA's H100 whitepaper.</figcaption></figure>
