<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:06</div><h3>A count is not a rate, and a wait is not a width</h3><svg viewBox='0 0 680 574' role='img'><title>A count is not a rate, and a wait is not a width</title><text class="hd" x="40" y="46">A count against a rate</text><g class="m"><rect x="40" y="66" width="270" height="62" rx="8"/><text class="lbl" x="175.0" y="88.0" text-anchor="middle" dominant-baseline="central">FLOP</text><text class="sub" x="175.0" y="106.0" text-anchor="middle" dominant-baseline="central">one operation: a count</text></g><g class="u"><rect x="370" y="66" width="270" height="62" rx="8"/><text class="lbl" x="505.0" y="88.0" text-anchor="middle" dominant-baseline="central">FLOP/s</text><text class="sub" x="505.0" y="106.0" text-anchor="middle" dominant-baseline="central">operations per second: a rate</text></g><g class="u"><rect x="40" y="148" width="600" height="42" rx="6"/><text class="sub" x="340.0" y="169.0" text-anchor="middle" dominant-baseline="central">140 billion operations  ÷  989.4 trillion per second  =  0.14 ms</text></g><text class="hd" x="40" y="236">A wait against a width</text><text class="cap" x="40" y="274" text-anchor="start">latency</text><g class="u"><rect x="150" y="258" width="44" height="26" rx="3"/><text class="sub" x="172.0" y="271.0" text-anchor="middle" dominant-baseline="central">ask</text></g><rect x="200" y="258" width="330" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="365.0" y="271.0" text-anchor="middle" dominant-baseline="central">wait for the one answer</text><g class="s"><rect x="536" y="258" width="64" height="26" rx="3"/><text class="sub" x="568.0" y="271.0" text-anchor="middle" dominant-baseline="central">arrive</text></g><text class="cap" x="40" y="318" text-anchor="start">bandwidth</text><g class="s"><rect x="150" y="304" width="450" height="9" rx="2"/></g><g class="s"><rect x="150" y="318" width="450" height="9" rx="2"/></g><g class="s"><rect x="150" y="332" width="450" height="9" rx="2"/></g><g class="s"><rect x="150" y="346" width="450" height="9" rx="2"/></g><g class="s"><rect x="150" y="360" width="450" height="9" rx="2"/></g><text class="sub2" x="150" y="388" text-anchor="start">many requests travelling at once, each with its own wait</text><text class="cap" x="40" y="430" text-anchor="start">A FLOP is one operation, a count with no time in it. FLOP/s is a rate. Dividing the</text><text class="cap" x="40" y="450" text-anchor="start">count by the rate gives seconds, and if the units do not cancel that way, the two have</text><text class="cap" x="40" y="470" text-anchor="start">been swapped ({{fig:v01-o063}}).</text><text class="cap" x="40" y="510" text-anchor="start">Latency is how long one request takes to come back. Bandwidth is how many bytes arrive</text><text class="cap" x="40" y="530" text-anchor="start">per second when many requests are travelling at once. They are independent: a wide, slow</text><text class="cap" x="40" y="550" text-anchor="start">pipe has high bandwidth and high latency ({{fig:v01-o076}}).</text></svg><figcaption>Two pairs of words that sound alike and measure different things. Nearly every confusing performance claim swaps one of them, so the rest of this atlas keeps them apart.</figcaption></figure>
