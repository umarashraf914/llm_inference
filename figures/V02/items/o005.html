<figure><div class='ts'>Fig 05 &nbsp;&middot;&nbsp; 0:06</div><h3>FLOP against FLOPS</h3><svg viewBox="0 0 680 344" role="img"><title>FLOP against FLOPS</title><g class="m"><rect x="50" y="50" width="265" height="76" rx="8"></rect><text class="lbl" x="182.5" y="71.0" text-anchor="middle" dominant-baseline="central">FLOP</text><text class="sub" x="182.5" y="89.0" text-anchor="middle" dominant-baseline="central">one floating-point operation</text><text class="sub" x="182.5" y="106.0" text-anchor="middle" dominant-baseline="central">a count, dimensionless</text></g><g class="h"><rect x="365" y="50" width="265" height="76" rx="8"></rect><text class="lbl" x="497.5" y="71.0" text-anchor="middle" dominant-baseline="central">FLOPS, or FLOP/s</text><text class="sub" x="497.5" y="89.0" text-anchor="middle" dominant-baseline="central">operations per second</text><text class="sub" x="497.5" y="106.0" text-anchor="middle" dominant-baseline="central">a rate</text></g><g class="u"><rect x="190" y="152" width="300" height="42" rx="6"></rect><text class="sub" x="340.0" y="173.0" text-anchor="middle" dominant-baseline="central">FLOPs / FLOPS  =  seconds</text></g><text class="cap" x="40" y="232" text-anchor="start">The single-letter difference matters. One is an amount of work; the other is how fast work</text><text class="cap" x="40" y="252" text-anchor="start">gets done. If a sentence about performance does not survive dimensional analysis, one of these</text><text class="cap" x="40" y="272" text-anchor="start">two is being used where the other belongs.</text><text class="cap" x="40" y="302" text-anchor="start">The same distinction runs through everything: bytes against bytes per second, capacity against</text><text class="cap" x="40" y="322" text-anchor="start">bandwidth.</text></svg><figcaption>Worth fixing before anything else. Almost every confusing performance claim turns out to be a quantity and a rate being swapped.</figcaption></figure>
