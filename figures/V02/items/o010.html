<figure><div class='ts'>Fig 10 &nbsp;&middot;&nbsp; 0:14</div><h3>The units of time at this scale</h3><svg viewBox="0 0 680 446" role="img"><title>The units of time at this scale</title><g class="u"><rect x="120" y="46" width="440" height="42" rx="6"></rect><text class="sub" x="340.0" y="67.0" text-anchor="middle" dominant-baseline="central">1 second  =  1,000 milliseconds</text></g><g class="u"><rect x="120" y="100" width="440" height="42" rx="6"></rect><text class="sub" x="340.0" y="121.0" text-anchor="middle" dominant-baseline="central">1 millisecond  =  1,000,000 nanoseconds</text></g><text class="hd" x="40" y="190">What each one is long enough for</text><text class="cap" x="40" y="232" text-anchor="start">one nanosecond</text><g class="s"><rect x="280" y="216" width="6" height="26" rx="1"></rect></g><text class="sub2" x="300" y="235" text-anchor="start">about one clock tick, or a read from on-chip memory</text><text class="cap" x="40" y="288" text-anchor="start">a few hundred ns</text><g class="h"><rect x="280" y="272" width="90" height="26" rx="3"></rect></g><text class="sub2" x="384" y="291" text-anchor="start">a read from the memory beside the chip</text><text class="cap" x="40" y="344" text-anchor="start">30 milliseconds</text><g class="u"><rect x="280" y="328" width="340" height="26" rx="3"></rect><text class="sub" x="450.0" y="341.0" text-anchor="middle" dominant-baseline="central">one token, start to finish</text></g><text class="cap" x="40" y="404" text-anchor="start">Three scales, each about a thousand times the one before. Almost every timing argument below</text><text class="cap" x="40" y="424" text-anchor="start">is a comparison between the first two.</text></svg><figcaption>Bars on a logarithmic scale. A nanosecond against a millisecond is the same ratio as a second against eleven days.</figcaption></figure>
