<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 0:13</div><h3>The units of time at this scale</h3><svg viewBox='0 0 680 462' role='img'><title>The units of time at this scale</title><text class="hd" x="40" y="46">Three durations on one logarithmic axis, from 0.1 ns to 100 ms</text><line class="axis" x1="150" y1="250" x2="630" y2="250"/><line class="tick" x1="150.0" y1="250" x2="150.0" y2="255"/><text class="sub2" x="150.0" y="270" text-anchor="middle">0.1 ns</text><line class="tick" x1="203.3" y1="250" x2="203.3" y2="255"/><text class="sub2" x="203.3" y="270" text-anchor="middle">1 ns</text><line class="tick" x1="256.7" y1="250" x2="256.7" y2="255"/><text class="sub2" x="256.7" y="270" text-anchor="middle">10 ns</text><line class="tick" x1="310.0" y1="250" x2="310.0" y2="255"/><text class="sub2" x="310.0" y="270" text-anchor="middle">100 ns</text><line class="tick" x1="363.3" y1="250" x2="363.3" y2="255"/><text class="sub2" x="363.3" y="270" text-anchor="middle">1 µs</text><line class="tick" x1="416.7" y1="250" x2="416.7" y2="255"/><text class="sub2" x="416.7" y="270" text-anchor="middle">10 µs</text><line class="tick" x1="470.0" y1="250" x2="470.0" y2="255"/><text class="sub2" x="470.0" y="270" text-anchor="middle">100 µs</text><line class="tick" x1="523.3" y1="250" x2="523.3" y2="255"/><text class="sub2" x="523.3" y="270" text-anchor="middle">1 ms</text><line class="tick" x1="576.7" y1="250" x2="576.7" y2="255"/><text class="sub2" x="576.7" y="270" text-anchor="middle">10 ms</text><line class="tick" x1="630.0" y1="250" x2="630.0" y2="255"/><text class="sub2" x="630.0" y="270" text-anchor="middle">100 ms</text><text class="cap" x="40" y="91" text-anchor="start">one tick</text><g class="s"><rect x="150.0" y="74.0" width="39.3" height="24.0" rx="3"/></g><text class="sub2" x="199.33594188104377" y="91" text-anchor="start">0.55 ns at 1.83 GHz</text><text class="cap" x="40" y="143" text-anchor="start">a load from HBM</text><g class="h"><rect x="150.0" y="126.0" width="183.2" height="24.0" rx="3"/></g><text class="sub2" x="343.24677444973497" y="143" text-anchor="start">about 270 ns, or 479 ticks</text><text class="cap" x="40" y="195" text-anchor="start">one token</text><g class="u"><rect x="150.0" y="178.0" width="452.1" height="24.0" rx="3"/></g><text class="sub2" x="612.1131335850487" y="195" text-anchor="start">about 30 ms</text><text class="cap" x="40" y="318" text-anchor="start">Each equal step along the axis is ten times longer. A load from HBM lasts about 500</text><text class="cap" x="40" y="338" text-anchor="start">ticks, and one token lasts about 110,000 loads, so the three are not a thousand apart</text><text class="cap" x="40" y="358" text-anchor="start">each but about 500 and about 100,000.</text><text class="cap" x="40" y="398" text-anchor="start">A tick is the chip's clock: the H100's tensor cores are rated at 1.83 billion ticks a</text><text class="cap" x="40" y="418" text-anchor="start">second, so one tick is 0.55 ns. The load time was measured on a Hopper GPU, 479 ticks at</text><text class="cap" x="40" y="438" text-anchor="start">its 1.755 GHz clock. Almost every timing argument below compares the first two rows.</text></svg><figcaption>Bar lengths are logarithmic. A nanosecond against a millisecond is the same ratio as a second against eleven days. Load latency: Luo et al. 2024, measured on an H800; clock: NVIDIA's H100 whitepaper.</figcaption></figure>
