<figure><div class='ts'>Fig 49 &nbsp;&middot;&nbsp; 7:09</div><h3>Both sins have the same cause</h3><svg viewBox="0 0 680 358" role="img"><title>Both sins have the same cause</title><text class="hd" x="40" y="46">The two sins, side by side</text><g class="h"><rect x="40" y="74" width="285" height="86" rx="8"></rect><text class="lbl" x="182.5" y="100.0" text-anchor="middle" dominant-baseline="central">Divergence</text><text class="sub" x="182.5" y="118.0" text-anchor="middle" dominant-baseline="central">lanes in one group want</text><text class="sub" x="182.5" y="135.0" text-anchor="middle" dominant-baseline="central">different instructions</text></g><g class="h"><rect x="355" y="74" width="285" height="86" rx="8"></rect><text class="lbl" x="497.5" y="100.0" text-anchor="middle" dominant-baseline="central">Uncoalesced access</text><text class="sub" x="497.5" y="118.0" text-anchor="middle" dominant-baseline="central">lanes in one group want</text><text class="sub" x="497.5" y="135.0" text-anchor="middle" dominant-baseline="central">scattered addresses</text></g><text class="cap" x="40" y="204" text-anchor="start">The same shape of problem, on the chip's two resources. A group of thirty-two shares one</text><text class="cap" x="40" y="224" text-anchor="start">instruction and one memory transaction, and both are wasted when the thirty-two disagree.</text><text class="cap" x="40" y="260" text-anchor="start">Divergence wastes issue slots. Scattered access wastes bandwidth, and bandwidth is the scarcer</text><text class="cap" x="40" y="280" text-anchor="start">of the two by a wide margin.</text><text class="cap" x="40" y="316" text-anchor="start">The second is the subject of a later part. Both come from the same design decision, which is</text><text class="cap" x="40" y="336" text-anchor="start">that thirty-two lanes act as one.</text></svg><figcaption>Naming them together makes the pattern visible: a group that acts as one is only efficient when its members agree, on instructions and on addresses alike.</figcaption></figure>
