<figure><div class='ts'>Fig 20 &nbsp;&middot;&nbsp; 0:24</div><h3>Why latency does not improve with a wider bus</h3><svg viewBox="0 0 680 395" role="img"><title>Why latency does not improve with a wider bus</title><text class="hd" x="40" y="46">Where the time actually goes on a memory access</text><text class="cap" x="40" y="96" text-anchor="start">send the address</text><g class="u"><rect x="250" y="78" width="64.0" height="30" rx="3"></rect></g><text class="cap" x="40" y="140" text-anchor="start">open the row</text><g class="h"><rect x="250" y="122" width="192.0" height="30" rx="3"></rect></g><text class="cap" x="40" y="184" text-anchor="start">sense the charge</text><g class="h"><rect x="250" y="166" width="240.0" height="30" rx="3"></rect></g><text class="cap" x="40" y="228" text-anchor="start">send the data back</text><g class="u"><rect x="250" y="210" width="96.0" height="30" rx="3"></rect></g><text class="cap" x="40" y="281" text-anchor="start">Hundreds of nanoseconds in total, and only the last step is the part anybody wanted.</text><text class="cap" x="40" y="317" text-anchor="start">Rough proportions rather than measured ones. What is not rough is that the wait is dominated</text><text class="cap" x="40" y="337" text-anchor="start">by the physics of getting at the charge, not by the distance the data then travels.</text><text class="cap" x="40" y="373" text-anchor="start">Which is why making the bus wider raises bandwidth and does almost nothing for latency.</text></svg><figcaption>Bandwidth and latency come from different parts of the same operation, which is why the two numbers move independently across generations.</figcaption></figure>
