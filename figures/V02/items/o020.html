<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 7:44</div><h3>Why latency does not improve with a wider bus</h3><svg viewBox='0 0 680 410' role='img'><title>Why latency does not improve with a wider bus</title><text class="hd" x="40" y="46">One load from HBM, in nanoseconds, drawn to scale</text><text class="cap" x="40" y="84" text-anchor="start">whole load</text><g class="h"><rect x="170" y="66" width="440.0" height="28" rx="3"/><text class="sub" x="390.0" y="80.0" text-anchor="middle" dominant-baseline="central">about 273 ns, measured</text></g><text class="cap" x="40" y="128" text-anchor="start">cell's own work</text><g class="s"><rect x="170.0" y="110.0" width="44.4" height="28.0" rx="3"/></g><text class="sub2" x="224.3515037593985" y="128" text-anchor="start">27.5 ns: open a row, read a column</text><text class="cap" x="40" y="186" text-anchor="start">In a standard DRAM chip, opening a row takes 13.75 ns and reading a column from the open</text><text class="cap" x="40" y="206" text-anchor="start">row another 13.75 ns. A load from a Hopper GPU's HBM was measured at about 273 ns, ten</text><text class="cap" x="40" y="226" text-anchor="start">times longer.</text><text class="cap" x="40" y="266" text-anchor="start">Most of the wait is the journey: checking the caches on the way for a copy, crossing the</text><text class="cap" x="40" y="286" text-anchor="start">chip to the right memory controller, queuing there, and coming back. The charge is a</text><text class="cap" x="40" y="306" text-anchor="start">small part.</text><text class="cap" x="40" y="346" text-anchor="start">None of that shrinks when the bus gets wider. More wires carry more at once; they do not</text><text class="cap" x="40" y="366" text-anchor="start">shorten the trip. That is why bandwidth and latency move independently across</text><text class="cap" x="40" y="386" text-anchor="start">generations.</text></svg><figcaption>Bars to scale. The cell timings are Micron's for DDR4-3200, standing in for HBM, which is built from the same kind of DRAM cell; the load was measured by Luo et al. 2024.</figcaption></figure>
