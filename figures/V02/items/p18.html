<figure class='widget'><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 9:51</div><h3>Whichever runs out first sets the occupancy</h3><div class='wg'><div class='ctl'><label>threads per block <input type='range' min='32' max='1024' step='32' value='128'><span class='val'>128</span></label><label>registers per thread <input type='range' min='16' max='255' step='1' value='64'><span class='val'>64</span></label><label>shared memory per block <input type='range' min='0' max='227' step='1' value='48'><span class='val'>48 KB</span></label></div><div class='ctl'><button type='button'>Reset</button></div><svg viewBox='0 0 680 478' role='img'><title>Whichever runs out first sets the occupancy</title><text class="hd" x="40" y="34">Warps that could be resident, by each limit separately</text><text class="cap" x="40" y="67" text-anchor="start">registers</text><g class="u"><rect x="200" y="50" width="160.0" height="24" rx="3" data-bar="0"/></g><text class="sub2 halo" x="370.0" y="67" data-v="0">32 warps (8 blocks)</text><text class="cap" x="40" y="103" text-anchor="start">shared memory</text><g class="h"><rect x="200" y="86" width="80.0" height="24" rx="3" data-bar="1"/></g><text class="sub2 halo" x="290.0" y="103" data-v="1">16 warps (4 blocks)</text><text class="cap" x="40" y="139" text-anchor="start">64-warp limit</text><g class="u"><rect x="200" y="122" width="320.0" height="24" rx="3" data-bar="2"/></g><text class="sub2 halo" x="530.0" y="139" data-v="2">64 warps (16 blocks)</text><text class="cap" x="40" y="175" text-anchor="start">32-block limit</text><g class="u"><rect x="200" y="158" width="320.0" height="24" rx="3" data-bar="3"/></g><text class="sub2 halo" x="530.0" y="175" data-v="3">128 warps (32 blocks)</text><line class="mark xok" x1="520.0" y1="44" x2="520.0" y2="188"/><text class="sub2" x="526.0" y="202" text-anchor="start">64</text><text class="sub2" x="40" y="234" data-head="">resident: 4 blocks × 4 warps = 16 warps, occupancy 25.0%, set by shared memory</text><text class="sub2" x="40" y="254" data-detail="">per block: 4 warps × 2,048 registers each; 50,176 bytes of shared memory with the 1 KB reserve</text><text class="cap" x="40" y="294" text-anchor="start">Four things limit how many warps a multiprocessor can hold for one kernel, and each is</text><text class="cap" x="40" y="314" text-anchor="start">counted separately: registers (handed out 256 at a time per warp, from four quarters of</text><text class="cap" x="40" y="334" text-anchor="start">16,384), shared memory (in 128-byte units, plus 1 KB reserved per block, from a</text><text class="cap" x="40" y="354" text-anchor="start">carve-out of up to 228 KB), the 64-warp maximum and the 32-block maximum. Blocks are</text><text class="cap" x="40" y="374" text-anchor="start">placed whole, so whichever limit is reached first sets the occupancy.</text><text class="cap" x="40" y="414" text-anchor="start">Try 256 threads at 128 registers: the registers bind at 16 warps. Then 256 threads at 32</text><text class="cap" x="40" y="434" text-anchor="start">registers: everything fits, 64 warps. The rules are NVIDIA's occupancy calculator's for</text><text class="cap" x="40" y="454" text-anchor="start">this chip; the page's arithmetic was checked against them in Python.</text></svg></div><figcaption>Red marks the limit that binds. A kernel that asks for a little more of any one resource can lose a whole block's worth of warps at once, which is why occupancy moves in steps.</figcaption><script>(() => {
  const fig = document.currentScript.closest('figure');
  const DEF = [128, 64, 48], C = {"WARP": 32, "REG_UNIT": 256, "SUB": 4, "REGS": 65536, "MAXR": 255, "RES": 1024, "SMU": 128, "SMEM": 233472, "WARPS": 64, "BLOCKS": 32}, BX = 200, PX = 5.0;
  const sl = [...fig.querySelectorAll('input[type=range]')], val = [...fig.querySelectorAll('.val')];
  const q = s => fig.querySelector(s);
  const ORDER = ['registers', 'shared memory', '64-warp limit', '32-block limit'];
  function occ(t, r, s) {
    const wpb = Math.ceil(t / C.WARP), rpw = Math.ceil(r * C.WARP / C.REG_UNIT) * C.REG_UNIT;
    let byRegs;
    if (rpw * (Math.ceil(wpb / C.SUB) * C.SUB) > C.REGS || r > C.MAXR) byRegs = 0;
    else byRegs = Math.floor(Math.floor(Math.floor(C.REGS / C.SUB) / rpw) * C.SUB / wpb);
    const per = Math.ceil((s * 1024 + C.RES) / C.SMU) * C.SMU;
    const lim = {'registers': byRegs, 'shared memory': Math.floor(C.SMEM / per),
                 '64-warp limit': Math.floor(C.WARPS / wpb), '32-block limit': C.BLOCKS};
    return [wpb, rpw, per, lim, Math.min(...Object.values(lim))];
  }
  const pl = (n, w) => `${n} ${w}${n !== 1 ? 's' : ''}`;
  function draw() {
    const [t, r, s] = sl.map(x => +x.value);
    val[0].textContent = t; val[1].textContent = r; val[2].textContent = s + ' KB';
    const [wpb, rpw, per, lim, blocks] = occ(t, r, s), warps = blocks * wpb;
    const binding = ORDER.filter(k => lim[k] === blocks);
    ORDER.forEach((k, i) => {
      const w = Math.max(Math.min(lim[k] * wpb, 64) * PX, 2), bar = q(`[data-bar="${i}"]`), tt = q(`[data-v="${i}"]`);
      bar.setAttribute('width', w.toFixed(1));
      bar.parentNode.setAttribute('class', binding.includes(k) ? 'h' : 'u');
      tt.textContent = `${lim[k] * wpb} warps (${pl(lim[k], 'block')})`;
      tt.setAttribute('x', (BX + w + 10).toFixed(1));
    });
    q('[data-head]').textContent = blocks === 0
      ? 'a single block does not fit: ' + binding.join(' and ')
      : `resident: ${pl(blocks, 'block')} × ${pl(wpb, 'warp')} = ${warps} warps, occupancy ${(100 * warps / 64).toFixed(1)}%, set by ${binding.join(' and ')}`;
    q('[data-detail]').textContent = `per block: ${wpb} warps × ${rpw.toLocaleString('en-US')} registers each; ${per.toLocaleString('en-US')} bytes of shared memory with the 1 KB reserve`;
  }
  sl.forEach(x => x.addEventListener('input', draw));
  q('button').addEventListener('click', () => { sl.forEach((x, i) => x.value = DEF[i]); draw(); });
  draw();
})();</script></figure>
