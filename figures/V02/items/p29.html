<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 16:28</div><h3>π in BF16: 0 | 10000000 | 1001001 is 3.140625</h3><svg viewBox='0 0 680 534' role='img'><title>π in BF16: 0 | 10000000 | 1001001 is 3.140625</title><text class="hd" x="40" y="46">π in BF16, read field by field</text><g class="u"><rect x="84" y="66" width="28" height="30" rx="3"/><text class="sub" x="98.0" y="81.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="h"><rect x="116" y="66" width="28" height="30" rx="3"/><text class="sub" x="130.0" y="81.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="h"><rect x="148" y="66" width="28" height="30" rx="3"/><text class="sub" x="162.0" y="81.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="h"><rect x="180" y="66" width="28" height="30" rx="3"/><text class="sub" x="194.0" y="81.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="h"><rect x="212" y="66" width="28" height="30" rx="3"/><text class="sub" x="226.0" y="81.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="h"><rect x="244" y="66" width="28" height="30" rx="3"/><text class="sub" x="258.0" y="81.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="h"><rect x="276" y="66" width="28" height="30" rx="3"/><text class="sub" x="290.0" y="81.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="h"><rect x="308" y="66" width="28" height="30" rx="3"/><text class="sub" x="322.0" y="81.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="h"><rect x="340" y="66" width="28" height="30" rx="3"/><text class="sub" x="354.0" y="81.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="s"><rect x="372" y="66" width="28" height="30" rx="3"/><text class="sub" x="386.0" y="81.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="404" y="66" width="28" height="30" rx="3"/><text class="sub" x="418.0" y="81.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="s"><rect x="436" y="66" width="28" height="30" rx="3"/><text class="sub" x="450.0" y="81.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="s"><rect x="468" y="66" width="28" height="30" rx="3"/><text class="sub" x="482.0" y="81.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="500" y="66" width="28" height="30" rx="3"/><text class="sub" x="514.0" y="81.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="s"><rect x="532" y="66" width="28" height="30" rx="3"/><text class="sub" x="546.0" y="81.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="s"><rect x="564" y="66" width="28" height="30" rx="3"/><text class="sub" x="578.0" y="81.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="98.0" y="114" text-anchor="middle">sign</text><text class="sub2" x="242.0" y="114" text-anchor="middle">exponent, 8 bits</text><text class="sub2" x="482.0" y="114" text-anchor="middle">fraction, 7 bits</text><g class="u"><rect x="40" y="134" width="600" height="34" rx="6"/><text class="sub" x="340.0" y="151.0" text-anchor="middle" dominant-baseline="central">sign  0   →   (−1)^0  =  +1</text></g><g class="u"><rect x="40" y="176" width="600" height="34" rx="6"/><text class="sub" x="340.0" y="193.0" text-anchor="middle" dominant-baseline="central">exponent  10000000  =  128   →   128 − 127  =  1   →   2^1  =  2</text></g><g class="u"><rect x="40" y="218" width="600" height="34" rx="6"/><text class="sub" x="340.0" y="235.0" text-anchor="middle" dominant-baseline="central">significand  1.1001001  =  1 + 1/2 + 1/16 + 1/128  =  1 + 73/128  =  1.5703125</text></g><g class="m"><rect x="40" y="260" width="600" height="34" rx="6"/><text class="sub" x="340.0" y="277.0" text-anchor="middle" dominant-baseline="central">value  =  +1  ×  2  ×  1.5703125  =  3.140625</text></g><text class="cap" x="40" y="330" text-anchor="start">Each field is read by place value ({{fig:v01-p06}}). The exponent 10000000 is 128, and taking</text><text class="cap" x="40" y="350" text-anchor="start">off the bias of 127 leaves 1. The fraction 1001001 is 73, so with its unstored leading 1</text><text class="cap" x="40" y="370" text-anchor="start">the significand is 1 + 73/128.</text><text class="cap" x="40" y="410" text-anchor="start">π is 3.14159265…, so BF16's π is 0.00097 short, 0.031% off. Between 2 and 4 BF16's</text><text class="cap" x="40" y="430" text-anchor="start">numbers are 2 ÷ 128 = 0.015625 apart, and π lies between 3.140625 and 3.15625, nearer</text><text class="cap" x="40" y="450" text-anchor="start">the first.</text><text class="cap" x="40" y="490" text-anchor="start">FP32 has sixteen more fraction bits, exactly the ones BF16 drops: its π, 3.14159274, is</text><text class="cap" x="40" y="510" text-anchor="start">off by 0.0000028%.</text></svg><figcaption>Checked in Python against FP32's π, whose first sixteen bits are exactly these. The first bit dropped is a 0, so cutting the rest off is the correct rounding here.</figcaption></figure>
