<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 15:40</div><h3>Multiplying in binary is long multiplication, and it costs width × width</h3><svg viewBox='0 0 680 650' role='img'><title>Multiplying in binary is long multiplication, and it costs width × width</title><text class="hd" x="40" y="46">11 × 13 in binary, as long multiplication</text><text class="sub2" x="165.0" y="74" text-anchor="middle">128</text><text class="sub2" x="199.0" y="74" text-anchor="middle">64</text><text class="sub2" x="233.0" y="74" text-anchor="middle">32</text><text class="sub2" x="267.0" y="74" text-anchor="middle">16</text><text class="sub2" x="301.0" y="74" text-anchor="middle">8</text><text class="sub2" x="335.0" y="74" text-anchor="middle">4</text><text class="sub2" x="369.0" y="74" text-anchor="middle">2</text><text class="sub2" x="403.0" y="74" text-anchor="middle">1</text><text class="cap" x="40" y="74" text-anchor="start">place value</text><g class="s"><rect x="286" y="84" width="30" height="24" rx="3"/><text class="sub" x="301.0" y="96.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="320" y="84" width="30" height="24" rx="3"/><text class="sub" x="335.0" y="96.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="s"><rect x="354" y="84" width="30" height="24" rx="3"/><text class="sub" x="369.0" y="96.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="388" y="84" width="30" height="24" rx="3"/><text class="sub" x="403.0" y="96.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="286" y="114" width="30" height="24" rx="3"/><text class="sub" x="301.0" y="126.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="320" y="114" width="30" height="24" rx="3"/><text class="sub" x="335.0" y="126.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="s"><rect x="354" y="114" width="30" height="24" rx="3"/><text class="sub" x="369.0" y="126.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="s"><rect x="388" y="114" width="30" height="24" rx="3"/><text class="sub" x="403.0" y="126.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="hd" x="267.0" y="131" text-anchor="middle">×</text><line class="tick" x1="150" y1="145" x2="418" y2="145"/><g class="m"><rect x="286" y="152" width="30" height="24" rx="3"/><text class="sub" x="301.0" y="164.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="320" y="152" width="30" height="24" rx="3"/><text class="sub" x="335.0" y="164.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="m"><rect x="354" y="152" width="30" height="24" rx="3"/><text class="sub" x="369.0" y="164.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="388" y="152" width="30" height="24" rx="3"/><text class="sub" x="403.0" y="164.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="252" y="182" width="30" height="24" rx="3"/><text class="sub" x="267.0" y="194.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="286" y="182" width="30" height="24" rx="3"/><text class="sub" x="301.0" y="194.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="320" y="182" width="30" height="24" rx="3"/><text class="sub" x="335.0" y="194.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="354" y="182" width="30" height="24" rx="3"/><text class="sub" x="369.0" y="194.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="m"><rect x="218" y="212" width="30" height="24" rx="3"/><text class="sub" x="233.0" y="224.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="252" y="212" width="30" height="24" rx="3"/><text class="sub" x="267.0" y="224.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="m"><rect x="286" y="212" width="30" height="24" rx="3"/><text class="sub" x="301.0" y="224.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="320" y="212" width="30" height="24" rx="3"/><text class="sub" x="335.0" y="224.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="184" y="242" width="30" height="24" rx="3"/><text class="sub" x="199.0" y="254.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="218" y="242" width="30" height="24" rx="3"/><text class="sub" x="233.0" y="254.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="m"><rect x="252" y="242" width="30" height="24" rx="3"/><text class="sub" x="267.0" y="254.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="m"><rect x="286" y="242" width="30" height="24" rx="3"/><text class="sub" x="301.0" y="254.0" text-anchor="middle" dominant-baseline="central">1</text></g><line class="tick" x1="150" y1="275" x2="418" y2="275"/><g class="h"><rect x="150" y="282" width="30" height="24" rx="3"/><text class="sub" x="165.0" y="294.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="u"><rect x="184" y="282" width="30" height="24" rx="3"/><text class="sub" x="199.0" y="294.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="218" y="282" width="30" height="24" rx="3"/><text class="sub" x="233.0" y="294.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="u"><rect x="252" y="282" width="30" height="24" rx="3"/><text class="sub" x="267.0" y="294.0" text-anchor="middle" dominant-baseline="central">0</text></g><g class="h"><rect x="286" y="282" width="30" height="24" rx="3"/><text class="sub" x="301.0" y="294.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="h"><rect x="320" y="282" width="30" height="24" rx="3"/><text class="sub" x="335.0" y="294.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="h"><rect x="354" y="282" width="30" height="24" rx="3"/><text class="sub" x="369.0" y="294.0" text-anchor="middle" dominant-baseline="central">1</text></g><g class="h"><rect x="388" y="282" width="30" height="24" rx="3"/><text class="sub" x="403.0" y="294.0" text-anchor="middle" dominant-baseline="central">1</text></g><text class="sub2" x="430" y="100" text-anchor="start">11  =  8 + 2 + 1</text><text class="sub2" x="430" y="130" text-anchor="start">13  =  8 + 4 + 1</text><text class="sub2" x="430" y="168" text-anchor="start">1 × 1011</text><text class="sub2" x="430" y="198" text-anchor="start">0 × 1011, one place left</text><text class="sub2" x="430" y="228" text-anchor="start">1 × 1011, two places left</text><text class="sub2" x="430" y="258" text-anchor="start">1 × 1011, three places left</text><text class="sub2" x="430" y="298" text-anchor="start">143  =  128 + 8 + 4 + 2 + 1</text><text class="cap" x="40" y="192" text-anchor="start">16 bits, each</text><text class="cap" x="40" y="210" text-anchor="start">one AND</text><text class="cap" x="40" y="298" text-anchor="start">the sum</text><g class="m"><rect x="40" y="328" width="600" height="42" rx="6"/><text class="sub" x="340.0" y="349.0" text-anchor="middle" dominant-baseline="central">ANDs  =  width × width:  16 at 4 bits,  64 at 8,  256 at 16,  1,024 at 32</text></g><text class="cap" x="40" y="406" text-anchor="start">Binary long multiplication is the decimal method with an easier times table. Each digit</text><text class="cap" x="40" y="426" text-anchor="start">of 1101 is 0 or 1, so each row is either 0000 or a copy of 1011, shifted one place</text><text class="cap" x="40" y="446" text-anchor="start">further left for each place, and the rows are added. Read by place value</text><text class="cap" x="40" y="466" text-anchor="start">({{fig:v01-p06}}), the sum is 128 + 8 + 4 + 2 + 1 = 143.</text><text class="cap" x="40" y="506" text-anchor="start">Every bit in the four rows pairs one bit of 1011 with one bit of 1101, and it is 1 only</text><text class="cap" x="40" y="526" text-anchor="start">when both are 1. A chip makes each with an AND gate: 4 × 4 = 16 of them for a 4-bit</text><text class="cap" x="40" y="546" text-anchor="start">multiply, and four rows to add.</text><text class="cap" x="40" y="586" text-anchor="start">So the work grows with the square of the width: 64 ANDs at 8 bits, 256 at 16, 1,024 at</text><text class="cap" x="40" y="606" text-anchor="start">32, each with its bits to add up. Halve the width of a number and its multiplier shrinks</text><text class="cap" x="40" y="626" text-anchor="start">to about a quarter.</text></svg><figcaption>11 × 13 = 143, the way a chip does it. Storing a number costs its width; multiplying two costs the width squared, which is why narrow formats pay off so well in the arithmetic.</figcaption></figure>
