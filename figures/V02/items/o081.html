<figure><div class='ts'>Fig 81 &nbsp;&middot;&nbsp; 14:46</div><h3>Why building something so narrow is right</h3><svg viewBox="0 0 680 264" role="img"><title>Why building something so narrow is right</title><g class="m"><rect x="40" y="62" width="546" height="40" rx="3"></rect><text class="sub" x="313.0" y="82.0" text-anchor="middle" dominant-baseline="central">matrix multiplies</text></g><g class="u"><rect x="590" y="62" width="50" height="40" rx="3"></rect><text class="sub" x="615.0" y="82.0" text-anchor="middle" dominant-baseline="central">rest</text></g><text class="cap" x="40" y="142" text-anchor="start">A transformer spends well over 90% of its arithmetic inside matrix multiplies, so a unit that</text><text class="cap" x="40" y="162" text-anchor="start">does nothing else is the highest-leverage silicon available.</text><text class="cap" x="40" y="192" text-anchor="start">The H100 has 528 of them, four per multiprocessor.</text><text class="cap" x="40" y="222" text-anchor="start">One caveat: peak assumes the cores are perfectly fed. Real kernels sustain 50 to 80% of peak</text><text class="cap" x="40" y="242" text-anchor="start">for well-tuned code, and considerably less for unoptimised implementations.</text></svg><figcaption>That fifty-to-eighty percent gap is the entire subject of the kernels video that follows.</figcaption></figure>
