<figure><div class='ts'>Fig ?? &nbsp;&middot;&nbsp; 1:53</div><h3>A CPU runs ahead on a guess, and throws the work away when it guessed wrong</h3><svg viewBox='0 0 680 654' role='img'><title>A CPU runs ahead on a guess, and throws the work away when it guessed wrong</title><text class="hd" x="40" y="46">Guessing a branch: the answer to the test arrives three slots late</text><text class="cap" x="40" y="84" text-anchor="start">wait</text><g class="m"><rect x="200" y="66" width="32" height="26" rx="3"/><text class="sub" x="216.0" y="79.0" text-anchor="middle" dominant-baseline="central">i1</text></g><g class="m"><rect x="236" y="66" width="32" height="26" rx="3"/><text class="sub" x="252.0" y="79.0" text-anchor="middle" dominant-baseline="central">i2</text></g><g class="m"><rect x="272" y="66" width="32" height="26" rx="3"/><text class="sub" x="288.0" y="79.0" text-anchor="middle" dominant-baseline="central">i3</text></g><g class="u"><rect x="308" y="66" width="32" height="26" rx="3"/><text class="sub" x="324.0" y="79.0" text-anchor="middle" dominant-baseline="central">if?</text></g><rect x="344" y="66" width="32" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="380" y="66" width="32" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><rect x="416" y="66" width="32" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><g class="m"><rect x="452" y="66" width="32" height="26" rx="3"/><text class="sub" x="468.0" y="79.0" text-anchor="middle" dominant-baseline="central">i5</text></g><g class="m"><rect x="488" y="66" width="32" height="26" rx="3"/><text class="sub" x="504.0" y="79.0" text-anchor="middle" dominant-baseline="central">i6</text></g><g class="m"><rect x="524" y="66" width="32" height="26" rx="3"/><text class="sub" x="540.0" y="79.0" text-anchor="middle" dominant-baseline="central">i7</text></g><g class="m"><rect x="560" y="66" width="32" height="26" rx="3"/><text class="sub" x="576.0" y="79.0" text-anchor="middle" dominant-baseline="central">i8</text></g><text class="cap" x="40" y="124" text-anchor="start">guess right</text><g class="m"><rect x="200" y="106" width="32" height="26" rx="3"/><text class="sub" x="216.0" y="119.0" text-anchor="middle" dominant-baseline="central">i1</text></g><g class="m"><rect x="236" y="106" width="32" height="26" rx="3"/><text class="sub" x="252.0" y="119.0" text-anchor="middle" dominant-baseline="central">i2</text></g><g class="m"><rect x="272" y="106" width="32" height="26" rx="3"/><text class="sub" x="288.0" y="119.0" text-anchor="middle" dominant-baseline="central">i3</text></g><g class="u"><rect x="308" y="106" width="32" height="26" rx="3"/><text class="sub" x="324.0" y="119.0" text-anchor="middle" dominant-baseline="central">if?</text></g><g class="m"><rect x="344" y="106" width="32" height="26" rx="3"/><text class="sub" x="360.0" y="119.0" text-anchor="middle" dominant-baseline="central">i5</text></g><g class="m"><rect x="380" y="106" width="32" height="26" rx="3"/><text class="sub" x="396.0" y="119.0" text-anchor="middle" dominant-baseline="central">i6</text></g><g class="m"><rect x="416" y="106" width="32" height="26" rx="3"/><text class="sub" x="432.0" y="119.0" text-anchor="middle" dominant-baseline="central">i7</text></g><g class="m"><rect x="452" y="106" width="32" height="26" rx="3"/><text class="sub" x="468.0" y="119.0" text-anchor="middle" dominant-baseline="central">i8</text></g><g class="m"><rect x="488" y="106" width="32" height="26" rx="3"/><text class="sub" x="504.0" y="119.0" text-anchor="middle" dominant-baseline="central">i9</text></g><g class="m"><rect x="524" y="106" width="32" height="26" rx="3"/><text class="sub" x="540.0" y="119.0" text-anchor="middle" dominant-baseline="central">i10</text></g><g class="m"><rect x="560" y="106" width="32" height="26" rx="3"/><text class="sub" x="576.0" y="119.0" text-anchor="middle" dominant-baseline="central">i11</text></g><text class="cap" x="40" y="164" text-anchor="start">guess wrong</text><g class="m"><rect x="200" y="146" width="32" height="26" rx="3"/><text class="sub" x="216.0" y="159.0" text-anchor="middle" dominant-baseline="central">i1</text></g><g class="m"><rect x="236" y="146" width="32" height="26" rx="3"/><text class="sub" x="252.0" y="159.0" text-anchor="middle" dominant-baseline="central">i2</text></g><g class="m"><rect x="272" y="146" width="32" height="26" rx="3"/><text class="sub" x="288.0" y="159.0" text-anchor="middle" dominant-baseline="central">i3</text></g><g class="u"><rect x="308" y="146" width="32" height="26" rx="3"/><text class="sub" x="324.0" y="159.0" text-anchor="middle" dominant-baseline="central">if?</text></g><rect x="344" y="146" width="32" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="360.0" y="159.0" text-anchor="middle" dominant-baseline="central">i5</text><rect x="380" y="146" width="32" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="396.0" y="159.0" text-anchor="middle" dominant-baseline="central">i6</text><rect x="416" y="146" width="32" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="432.0" y="159.0" text-anchor="middle" dominant-baseline="central">i7</text><g class="h"><rect x="452" y="146" width="32" height="26" rx="3"/><text class="sub" x="468.0" y="159.0" text-anchor="middle" dominant-baseline="central">e5</text></g><g class="h"><rect x="488" y="146" width="32" height="26" rx="3"/><text class="sub" x="504.0" y="159.0" text-anchor="middle" dominant-baseline="central">e6</text></g><g class="h"><rect x="524" y="146" width="32" height="26" rx="3"/><text class="sub" x="540.0" y="159.0" text-anchor="middle" dominant-baseline="central">e7</text></g><g class="h"><rect x="560" y="146" width="32" height="26" rx="3"/><text class="sub" x="576.0" y="159.0" text-anchor="middle" dominant-baseline="central">e8</text></g><line class="mark" x1="450.0" y1="58" x2="450.0" y2="180"/><text class="sub2" x="456.0" y="196" text-anchor="start">answer known</text><text class="hd" x="40" y="236">Prefetching: the core spots a pattern in the addresses and fetches ahead</text><text class="cap" x="40" y="272" text-anchor="start">asked for</text><g class="u"><rect x="200" y="254" width="54" height="26" rx="3"/><text class="sub" x="227.0" y="267.0" text-anchor="middle" dominant-baseline="central">100</text></g><g class="u"><rect x="262" y="254" width="54" height="26" rx="3"/><text class="sub" x="289.0" y="267.0" text-anchor="middle" dominant-baseline="central">104</text></g><g class="u"><rect x="324" y="254" width="54" height="26" rx="3"/><text class="sub" x="351.0" y="267.0" text-anchor="middle" dominant-baseline="central">108</text></g><text class="sub2" x="388" y="272" text-anchor="start">+4 each time, so</text><g class="s"><rect x="500" y="254" width="54" height="26" rx="3"/><text class="sub" x="527.0" y="267.0" text-anchor="middle" dominant-baseline="central">112</text></g><g class="s"><rect x="562" y="254" width="54" height="26" rx="3"/><text class="sub" x="589.0" y="267.0" text-anchor="middle" dominant-baseline="central">116</text></g><text class="sub2" x="500" y="300" text-anchor="start">fetched before anyone asks</text><text class="cap" x="40" y="342" text-anchor="start">no prefetch</text><g class="u"><rect x="200" y="324" width="32" height="26" rx="3"/><text class="sub" x="216.0" y="337.0" text-anchor="middle" dominant-baseline="central">ask</text></g><rect x="236" y="324" width="212" height="26" rx="3" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/><text class="sub2" x="342.0" y="337.0" text-anchor="middle" dominant-baseline="central">wait for memory</text><g class="m"><rect x="452" y="324" width="32" height="26" rx="3"/><text class="sub" x="468.0" y="337.0" text-anchor="middle" dominant-baseline="central">use</text></g><text class="cap" x="40" y="382" text-anchor="start">prefetched</text><g class="m"><rect x="200" y="364" width="32" height="26" rx="3"/><text class="sub" x="216.0" y="377.0" text-anchor="middle" dominant-baseline="central">use</text></g><text class="sub2" x="240" y="382" text-anchor="start">112 is already waiting nearby</text><text class="cap" x="40" y="430" text-anchor="start">A branch tests a value, and the value may not be ready yet. Rather than stall, the core</text><text class="cap" x="40" y="450" text-anchor="start">guesses which way the test will go and runs ahead. Right, and the work was free. Wrong,</text><text class="cap" x="40" y="470" text-anchor="start">and it is thrown away and the core restarts down the other path, no later than if it had</text><text class="cap" x="40" y="490" text-anchor="start">waited.</text><text class="cap" x="40" y="530" text-anchor="start">Prefetching makes the same bet about data: a core that sees addresses 100, 104, 108</text><text class="cap" x="40" y="550" text-anchor="start">asked for in turn fetches 112 and 116 before they are wanted, so those loads find their</text><text class="cap" x="40" y="570" text-anchor="start">data close by.</text><text class="cap" x="40" y="610" text-anchor="start">Both cost silicon: tables of past branches, address trackers, room to hold half-finished</text><text class="cap" x="40" y="630" text-anchor="start">guesses.</text></svg><figcaption>Schematic timings. This is what anticipation means: machinery that pays off for one thread making unpredictable turns. A GPU spends that silicon on more threads instead.</figcaption></figure>
