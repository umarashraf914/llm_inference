<figure><div class='ts'>Fig 06 &nbsp;&middot;&nbsp; 0:06</div><h3>What throughput means</h3><svg viewBox="0 0 680 336" role="img"><title>What throughput means</title><text class="hd" x="40" y="46">Throughput is finished work per unit of time</text><g class="u"><rect x="40" y="70" width="130" height="40" rx="4"></rect><text class="sub" x="105.0" y="90.0" text-anchor="middle" dominant-baseline="central">work arrives</text></g><line class="conn" x1="176" y1="90" x2="196" y2="90" marker-end="url(#arw)"></line><g class="m"><rect x="202" y="70" width="240" height="40" rx="4"></rect><text class="sub" x="322.0" y="90.0" text-anchor="middle" dominant-baseline="central">the machine</text></g><line class="conn" x1="448" y1="90" x2="468" y2="90" marker-end="url(#arw)"></line><g class="s"><rect x="474" y="70" width="166" height="40" rx="4"></rect><text class="sub" x="557.0" y="90.0" text-anchor="middle" dominant-baseline="central">work leaves</text></g><text class="sub2" x="474" y="132" text-anchor="start">count what leaves, per second</text><text class="cap" x="40" y="182" text-anchor="start">It says nothing about how long any single item took inside. A machine can have splendid</text><text class="cap" x="40" y="202" text-anchor="start">throughput and make every individual item wait a long time.</text><text class="cap" x="40" y="238" text-anchor="start">That is exactly the trade this chip makes. It runs each thread slowly and runs an enormous</text><text class="cap" x="40" y="258" text-anchor="start">number of them, so the count leaving per second is huge.</text><text class="cap" x="40" y="294" text-anchor="start">Whenever a figure below quotes operations per second or bytes per second, it is quoting a</text><text class="cap" x="40" y="314" text-anchor="start">throughput, and saying nothing about any one operation's latency.</text></svg><figcaption>The word appears in every specification. It counts what comes out, never how long one item spent inside.</figcaption></figure>
