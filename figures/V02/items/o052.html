<figure><div class='ts'>Fig 52 &nbsp;&middot;&nbsp; 8:21</div><h3>The same four rungs, nested by scope</h3><svg viewBox="0 0 680 468" role="img"><title>The same four rungs, nested by scope</title><g class="u"><rect x="40" y="20" width="600" height="348" rx="14"></rect><text class="lbl" x="62" y="46">GPU package</text></g><g class="h"><rect x="70" y="60" width="540" height="238" rx="14"></rect><text class="lbl" x="92" y="86">GPU die</text></g><g class="s"><rect x="100" y="100" width="480" height="140" rx="14"></rect><text class="lbl" x="122" y="126">One multiprocessor, of 132</text></g><g class="s"><rect x="122" y="142" width="436" height="34" rx="3"></rect><text class="sub" x="340.0" y="159.0" text-anchor="middle" dominant-baseline="central">registers, 256 KB, single cycle</text></g><g class="s"><rect x="122" y="186" width="436" height="34" rx="3"></rect><text class="sub" x="340.0" y="203.0" text-anchor="middle" dominant-baseline="central">SRAM, up to 228 KB, nanoseconds</text></g><g class="u"><rect x="100" y="248" width="480" height="30" rx="3"></rect><text class="sub" x="340.0" y="263" text-anchor="middle" dominant-baseline="central">L2 cache, 50 MB, shared by all 132</text></g><g class="h"><rect x="70" y="320" width="540" height="28" rx="3"></rect><text class="sub" x="340.0" y="334" text-anchor="middle" dominant-baseline="central">HBM, 80 GB at 3.35 TB/s, off the compute die</text></g><text class="cap" x="40" y="426" text-anchor="start">Registers and SRAM belong to one multiprocessor. L2 is shared chip-wide. HBM sits off the</text><text class="cap" x="40" y="446" text-anchor="start">compute die entirely, stacked beside it on the package.</text></svg><figcaption>Speed is not the only axis. Who can see a level matters just as much, and it is what makes shared memory a cooperation mechanism rather than merely a fast cache.</figcaption></figure>
