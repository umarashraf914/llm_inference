<figure><div class='ts'>Fig 71 &nbsp;&middot;&nbsp; 12:13</div><h3>The natural experiment</h3><svg viewBox='0 0 680 324' role="img"><title>The natural experiment</title><g class="u"><rect x="40" y="50" width="280" height="130" rx="14"></rect><text class="lbl" x="62" y="76">H100</text></g><g class="m"><rect x="62" y="92" width="236" height="32" rx="3"></rect><text class="sub" x="180.0" y="108.0" text-anchor="middle" dominant-baseline="central">same compute die, same tensor cores</text></g><g class="h"><rect x="62" y="132" width="236" height="32" rx="3"></rect><text class="sub" x="180.0" y="148.0" text-anchor="middle" dominant-baseline="central">80 GB at 3.35 TB/s</text></g><g class="u"><rect x="360" y="50" width="280" height="130" rx="14"></rect><text class="lbl" x="382" y="76">H200</text></g><g class="m"><rect x="382" y="92" width="236" height="32" rx="3"></rect><text class="sub" x="500.0" y="108.0" text-anchor="middle" dominant-baseline="central">same compute die, same peak FLOPS</text></g><g class="h"><rect x="382" y="132" width="236" height="32" rx="3"></rect><text class="sub" x="500.0" y="148.0" text-anchor="middle" dominant-baseline="central">141 GB HBM3e at 4.8 TB/s</text></g><text class="cap" x="40" y="220" text-anchor="start">NVIDIA effectively ran the controlled experiment. The only thing that changed is the</text><text class="cap" x="40" y="240" text-anchor="start">memory: 1.43 times the bandwidth. For memory-bound work that upgrade alone is a genuine</text><text class="cap" x="40" y="260" text-anchor="start">speed-up.</text><text class="cap" x="40" y="300" text-anchor="start">Direct evidence that inference is limited by bandwidth rather than by tensor-core speed.</text></svg><figcaption>The cleanest single argument for the whole thesis: same compute, more bandwidth, faster inference.</figcaption></figure>
