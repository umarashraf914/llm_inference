<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>stage</title>
<link rel="stylesheet" href="theme.css">
<script src="vendor/gsap.min.js"></script>
<script src="vendor/DrawSVGPlugin.min.js"></script>
<script src="vendor/MorphSVGPlugin.min.js"></script>
<script src="vendor/MotionPathPlugin.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="icons.generated.js"></script>
<script src="engine.js"></script>
</head>
<body>
<div id="bg"></div>
<svg id="film" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
  // ?film=v01&scene=ch05_s02 loads the shared library (../lib/, files listed in ../lib/manifest.json),
  // then ../v01/scenes/ch05_common.js (if present), then ../v01/scenes/ch05_s02.js.
  // The renderer then calls V.load(sceneId, timing).
  const q = new URLSearchParams(location.search);
  function load(src, optional) {
    return new Promise((ok, fail) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = ok;
      s.onerror = () => (optional ? ok() : fail(new Error('missing ' + src)));
      document.head.appendChild(s);
    });
  }
  const film = q.get('film'), scene = q.get('scene');
  if (film && scene && !scene.endsWith('_title')) {
    const ch = scene.split('_')[0];
    fetch('../lib/manifest.json', { cache: 'no-store' })
      .then(r => (r.ok ? r.json() : []), () => [])
      .then(files => files.reduce((p, f) => p.then(() => load(`../lib/${f}`)), Promise.resolve()))
      .then(() => load(`../${film}/scenes/${ch}_common.js`, true))
      .then(() => load(`../${film}/scenes/${scene}.js`))
      .then(() => { window.__chapterLoaded = true; }, () => { window.__chapterLoaded = 'error'; });
  } else {
    window.__chapterLoaded = true;
  }
</script>
</body>
</html>
